scaffold_corner_design:

  # ===================================================================
  # Entities — creation, retrieval, required fields, defaults, computed, system, type
  # ===================================================================
  - section: entities
    instances:
      - name: create_author_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Author", "endpoints.POST_/authors"]
        distinguishing_aspect: "POST /authors with full_name+email returns 201 and a server-minted id, created_at, version=1, tax_withholding_pct default 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /authors"
              payload: { full_name: "Jane Doe", email: "jane@x.com" }
              as: Publisher
              captures: { author_id: $.data.id, ver: $.data.version, tax: $.data.tax_withholding_pct }
          assert:
            - "response status == 201"
            - "Author.${author_id}.version == 1"
            - "Author.${author_id}.tax_withholding_pct == 0"

      - name: get_contract_returns_stored_entity
        claim_type: Retrieval
        grounds: ["entities.Contract", "endpoints.GET /contracts/{id}"]
        distinguishing_aspect: "GET /contracts/{id} returns the stored contract with computed unrecouped_advance_cents == advance_cents and lifetime_net_units == 0 at creation."
        test_recipe:
          setup: ["A DRAFT contract created with advance_cents=500000."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Get", email: "cget@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 500000, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { unrecouped: $.data.unrecouped_advance_cents, lnu: $.data.lifetime_net_units }
          assert:
            - "Contract.${contract_id}.unrecouped_advance_cents == 500000"
            - "Contract.${contract_id}.lifetime_net_units == 0"
            - "Contract.${contract_id}.status == DRAFT"

      - name: list_contracts_paginated_envelope
        claim_type: Listing
        grounds: ["entities.Contract", "endpoints.GET_/contracts"]
        distinguishing_aspect: "GET /contracts returns response_type array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two contracts exist for one author."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C List", email: "clist@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 100 }
              as: Publisher
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 200 }
              as: Publisher
          trigger:
            - call: "GET /contracts"
              payload: { author_id: "${author_id}", limit: 10, offset: 0 }
              as: Publisher
          assert:
            - "response_type == array"
            - "meta.total_count == 2 and has_more == false"

      - name: get_contract_not_found
        claim_type: Not Found
        grounds: ["entities.Contract", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /contracts/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_contract_missing_required_author_id
        claim_type: Required Fields
        grounds: ["entities.Contract.fields.author_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /contracts omitting required author_id returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts"
              payload: { advance_cents: 1000 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: contract_reserve_pct_default_applied
        claim_type: Defaults
        grounds: ["entities.Contract.fields.reserve_pct"]
        distinguishing_aspect: "Omitting reserve_pct on contract create applies default 0.25; reserve_hold_periods defaults 2."
        test_recipe:
          setup: ["An author exists."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Def", email: "cdef@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { rp: $.data.reserve_pct, rhp: $.data.reserve_hold_periods }
          assert:
            - "data.reserve_pct == 0.25"
            - "data.reserve_hold_periods == 2"

      - name: subsidiary_author_income_computed_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.SubsidiaryRight.fields.author_income_cents", "calculations.subsidiary_author_income"]
        distinguishing_aspect: "author_income_cents is computed = round_half_up(proceeds*share); a client-supplied author_income_cents in the body is not accepted (not in input) and the computed 750000 stands for proceeds 1000000 share 0.75."
        test_recipe:
          setup: ["ACTIVE-able contract (DRAFT is fine for registering rights)."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Sub", email: "csub@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "FILM", proceeds_cents: 1000000, author_share_pct: 0.75 }
              as: Publisher
              captures: { income: $.data.author_income_cents }
          assert:
            - "data.author_income_cents == 750000"

      - name: author_system_fields_generated
        claim_type: System Fields
        grounds: ["entities.Author.fields", "entities.Author"]
        distinguishing_aspect: "id/created_at/updated_at/version are system-minted on POST /authors; any client-supplied id is ignored (id is a fresh UUID with no prefix)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /authors"
              payload: { full_name: "Sys Gen", email: "sysgen@x.com" }
              as: Publisher
              captures: { aid: $.data.id, cat: $.data.created_at }
          assert:
            - "data.id is a UUID with no type prefix"
            - "data.created_at is ISO8601 with three fractional digits"
            - "data.version == 1"

      - name: subsidiary_right_invalid_enum_type
        claim_type: Type Constraints
        grounds: ["entities.SubsidiaryRight.fields.right_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST subsidiary-rights with right_type=TELEVISION (not in {FOREIGN,AUDIO,FILM}) returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A DRAFT contract exists."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Enum", email: "cenum@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "TELEVISION", proceeds_cents: 100, author_share_pct: 0.5 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: list_price_must_be_positive
        claim_type: Type Constraints
        grounds: ["entities.Format.fields.list_price_cents", "errors[ERR_VALIDATION_RANGE]"]
        distinguishing_aspect: "POST /titles/{id}/formats with list_price_cents=0 violates list_price_cents>0 and returns 422 ERR_VALIDATION_RANGE."
        test_recipe:
          setup: ["A DRAFT contract with a DRAFT title."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Price", email: "cprice@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Bad Price" }
              as: Publisher
              captures: { title_id: $.data.id }
          trigger:
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "EBOOK", list_price_cents: 0 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_VALIDATION_RANGE"

      - name: statementline_is_immutable_no_version
        claim_type: Immutability
        grounds: ["entities.StatementLine"]
        distinguishing_aspect: "StatementLine has common_fields:false — it carries only id+created_at, no version field, and there is no update/delete endpoint for it."
        test_recipe:
          setup: ["A FINALIZED statement S1 that emitted at least one ROYALTY StatementLine."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "C Line", email: "cline@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Line Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 100, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
          trigger:
            - call: "GET /statements/${s1_id}/lines"
              payload: { line_type: "ROYALTY" }
              as: Publisher
          assert:
            - "response_type == array"
            - "at least one StatementLine with line_type == ROYALTY and amount_cents == 30000 (100 units * 300)"

      - name: title_requires_existing_parent_contract
        claim_type: Parent Relationships
        grounds: ["entities.Title.fields.contract_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /contracts/{id}/titles against a non-existent contract id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /contracts/00000000-0000-4000-8000-0000000000bb/titles"
              payload: { name: "Orphan" }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

  # ===================================================================
  # State machines — initial, valid, invalid-from, terminal lockdown, idempotency
  # ===================================================================
  - section: state_machines
    instances:
      - name: contract_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.Contract", "entities.Contract.fields.status"]
        distinguishing_aspect: "A newly created Contract starts in status DRAFT (initial_state)."
        test_recipe:
          setup: ["An author exists."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "I Draft", email: "idraft@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { status: $.data.status }
          assert:
            - "data.status == DRAFT"

      - name: activate_contract_valid_transition
        claim_type: Valid Transition
        grounds: ["state_machines.Contract.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "POST /contracts/{id}/activate on a DRAFT contract with tiers+title+format moves it to ACTIVE and sets unrecouped_advance_cents=advance_cents."
        test_recipe:
          setup: ["DRAFT contract with valid tier cover, one title, one format, advance 700000."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "V Act", email: "vact@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 700000, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Act Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
              captures: { status: $.data.status, unrecouped: $.data.unrecouped_advance_cents }
          assert:
            - "data.status == ACTIVE"
            - "data.unrecouped_advance_cents == 700000"

      - name: activate_without_tiers_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Contract.DRAFT_to_ACTIVE", "errors[ERR_CONTRACT_NOT_READY]"]
        distinguishing_aspect: "Activating a contract with no royalty tiers (but having a title+format) is rejected with 409 ERR_CONTRACT_NOT_READY."
        test_recipe:
          setup: ["DRAFT contract with a title+format but ZERO royalty tiers."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "P NoTier", email: "pnotier@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "NoTier Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_CONTRACT_NOT_READY"

      - name: publish_title_with_no_format_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Title.DRAFT_to_PUBLISHED", "errors[ERR_TITLE_HAS_NO_FORMAT]"]
        distinguishing_aspect: "Publishing a DRAFT title that has zero formats returns 409 ERR_TITLE_HAS_NO_FORMAT."
        test_recipe:
          setup: ["ACTIVE contract with a DRAFT title that has no formats (contract activated via a different title that has a format)."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "P NoFmt", email: "pnofmt@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Anchor Title" }
              as: Publisher
              captures: { anchor_title_id: $.data.id }
            - call: "POST /titles/${anchor_title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Empty Title" }
              as: Publisher
              captures: { empty_title_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
          trigger:
            - call: "POST /titles/${empty_title_id}/publish"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_TITLE_HAS_NO_FORMAT"

      - name: pay_before_finalize_invalid_from
        claim_type: Invalid Transitions
        grounds: ["state_machines.AuthorStatement.FINALIZED_to_PAID", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling pay on a DRAFT statement (not yet FINALIZED) returns 409 ERR_INVALID_STATE; no ledger lines emitted."
        test_recipe:
          setup: ["A DRAFT statement S1 for a CLOSED period (not finalized)."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Inv Pay", email: "invpay@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "InvPay Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 50, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/pay"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminated_contract_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Contract", "entities.Contract.fields.status"]
        distinguishing_aspect: "From TERMINATED, re-terminating the contract returns 409 ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["An ACTIVE contract with no liabilities, terminated to TERMINATED."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Term Lock", email: "termlock@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Term Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: Publisher
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: generate_statement_twice_idempotency_guard
        claim_type: Idempotency
        grounds: ["state_machines.AuthorStatement", "errors[ERR_STATEMENT_EXISTS]"]
        distinguishing_aspect: "Calling generate-statement a second time for the same period returns 409 ERR_STATEMENT_EXISTS (at most one statement per period)."
        test_recipe:
          setup: ["A CLOSED period seq1 with one statement already generated."]
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Idem Stmt", email: "idemstmt@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Idem Book" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 50, units_returned: 0 }
