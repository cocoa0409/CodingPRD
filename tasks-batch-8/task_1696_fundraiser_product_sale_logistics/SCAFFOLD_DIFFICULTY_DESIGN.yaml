  - rule_id: non_linear_state_machine
    instances:
      - name: order_payment_dimension_cycle_paid_partial_paid
        grounds:
          - state_machines.Order[dimension=payment_status].PAID_to_PARTIALLY_PAID
          - state_machines.Order[dimension=payment_status].PARTIALLY_PAID_to_PAID
          - state_machines.Payment.CLEARED_to_BOUNCED
          - calculations.payment_status_derivation
        distinguishing_aspect: |
          Order carries two independent state dimensions; the payment dimension cycles
          PAID -> PARTIALLY_PAID -> PAID through a bounce and a replacement payment while the
          fulfillment dimension stays PENDING the whole time — a non-linear machine on Order,
          distinct from the ReturnRequest cycle of the sibling instance.
        test_recipe:
          setup:
            - "campaign OPEN, group G, product price 1000 cost 600 case 12, seller S, one submitted order o1 qty 1 (total 1000)"
