  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: timeline_zone_halfopen_overlap
        grounds:
          - validations[priority=12]
          - entities.TimelineBlock.fields.start_offset_min
          - entities.TimelineBlock.fields.end_offset_min
        distinguishing_aspect: "TimelineBlock uses half-open [start,end) geometry on (event,zone): [660,780) collides with [600,720) but the adjacent [720,780) (end==start) does NOT — adjacency allowed."
        test_recipe:
          setup:
            - "Event; one RECEPTION_HALL block [600,720)."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "CC & DD", event_date: "2026-09-15T00:00:00Z", venue_name: "Grand", package_type: "PARTIAL", total_budget_cents: 4000000, guest_count_estimate: 70 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/timeline-blocks"
              payload: { event_id: "${ev_id}", label: "Dinner service", zone: "RECEPTION_HALL", block_type: "RECEPTION", start_offset_min: 600, end_offset_min: 720 }
              as: Planner
              captures: { blk1: $.data.id }
          trigger:
            - call: "POST /planning/timeline-blocks"
              payload: { event_id: "${ev_id}", label: "Toasts", zone: "RECEPTION_HALL", block_type: "RECEPTION", start_offset_min: 660, end_offset_min: 780 }
              as: Planner
              captures: { err: $.data.error_id }
            - call: "POST /planning/timeline-blocks"
              payload: { event_id: "${ev_id}", label: "Teardown", zone: "RECEPTION_HALL", block_type: "TEARDOWN", start_offset_min: 720, end_offset_min: 780 }
              as: Planner
              captures: { blk3: $.data.id }
          assert:
            - "Overlapping block [660,780) returns error_id == ERR_TIMELINE_OVERLAP"
            - "Adjacent block [720,780) is created successfully (half-open boundary, end1==start3)"

      - name: staff_shift_buffer_overlap
        grounds:
          - validations[priority=12]
          - entities.StaffAssignment.fields.shift_start_offset_min
          - entities.StaffAssignment.fields.shift_end_offset_min
        distinguishing_aspect: "StaffAssignment uses a buffered closed interval (BUFFER_MIN=30) on one staff member: a 20-minute gap [740,800] after [600,720] collides, a 30-minute gap [750,810] does not — different interval semantics and resource than the timeline zone rule."
        test_recipe:
          setup:
            - "Event; one staff member with a shift [600,720]."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "EE & FF", event_date: "2026-09-15T00:00:00Z", venue_name: "Villa", package_type: "PARTIAL", total_budget_cents: 4000000, guest_count_estimate: 55 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/staff-members"
              payload: { event_id: "${ev_id}", staff_name: "Sam", role_title: "SERVER", hourly_rate_cents: 5000 }
              as: Planner
              captures: { sm: $.data.id }
            - call: "POST /planning/staff-assignments"
              payload: { event_id: "${ev_id}", staff_member_id: "${sm}", shift_start_offset_min: 600, shift_end_offset_min: 720 }
              as: Planner
              captures: { sa1: $.data.id }
          trigger:
            - call: "POST /planning/staff-assignments"
              payload: { event_id: "${ev_id}", staff_member_id: "${sm}", shift_start_offset_min: 740, shift_end_offset_min: 800 }
              as: Planner
              captures: { err: $.data.error_id }
            - call: "POST /planning/staff-assignments"
              payload: { event_id: "${ev_id}", staff_member_id: "${sm}", shift_start_offset_min: 750, shift_end_offset_min: 810 }
              as: Planner
              captures: { sa3: $.data.id }
          assert:
            - "Shift [740,800] returns error_id == ERR_STAFF_DOUBLE_BOOKED (gap 20 < 30)"
            - "Shift [750,810] is created successfully (gap exactly 30, inclusive)"
            - "StaffAssignment.${sa3}.labor_cost_cents == 5000 (5000/hr * 60 min)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
