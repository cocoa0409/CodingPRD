      - name: shared_operations_accept_every_role_named_on_them
        claim_type: shared_operations
        grounds:
          - roles.ProgramAdmin.shared_operations
          - roles.ProjectCoordinator.shared_operations
          - roles.ServiceManager.shared_operations
