            - "NonconformanceReport.${ncr_id}.cost_of_quality_cents == 600"

  - rule_id: resource_temporal_overlap
    instances:
      - name: deviation_half_open_window_overlap_rejected
        grounds:
          - state_machines.Deviation.REQUESTED_to_APPROVED
          - validations[priority=11]
          - entities.Deviation.fields.valid_from
          - entities.Deviation.fields.valid_to
          - entities.Deviation.fields.supplier_id
          - entities.Deviation.fields.part_number
        distinguishing_aspect: |
          Half-open [valid_from, valid_to) interval semantics scoped to (supplier_id,
          part_number) on the Deviation resource: a second APPROVE whose window
          [2026-08-01,2026-10-01) overlaps the existing APPROVED [2026-06-01,2026-09-01)
          is rejected with ERR_DEVIATION_OVERLAP (overlap iff a.from < b.to AND b.from < a.to;
          abutting windows would NOT conflict — the boundary is exclusive).
        test_recipe:
          setup:
            - "A QualityEngineer and a QualityManager Personnel and a Supplier exist; clock at 2026-06-15T00:00:00Z."
            - "Two SUPPLIER NCRs for the same part_number P-O1 are OPEN."
            - "Deviation A (window 2026-06-01..2026-09-01, max_qty=5) is APPROVED."
            - "Deviation B (same supplier+part, window 2026-08-01..2026-10-01) is REQUESTED."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE O1", email: "qeo1@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "QM O1", email: "qmo1@x.com", role: "QUALITY_MANAGER" }
              as: QualityManager
              captures: { qm_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Ovl Co", code: "OVL1" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: QualityManager
            - call: "POST /nonconformance-reports"
              payload: { title: "ncr o1a", source: "SUPPLIER", severity: "MINOR", defect_qty: 2, unit_cost_cents: 500, part_number: "P-O1", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncra_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncra_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /nonconformance-reports"
              payload: { title: "ncr o1b", source: "SUPPLIER", severity: "MINOR", defect_qty: 2, unit_cost_cents: 500, part_number: "P-O1", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncrb_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncrb_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
            - call: "POST /deviations"
              payload: { ncr_id: "${ncra_id}", supplier_id: "${sup_id}", part_number: "P-O1", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", max_qty: 5 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { dev_a_id: $.data.id }
            - call: "POST /deviations/${dev_a_id}/transition"
              payload: { action: "APPROVE" }
              as: QualityManager
              as_user_id: "${qm_id}"
            - call: "POST /deviations"
              payload: { ncr_id: "${ncrb_id}", supplier_id: "${sup_id}", part_number: "P-O1", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-10-01T00:00:00Z", max_qty: 5 }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { dev_b_id: $.data.id }
          trigger:
            - call: "POST /deviations/${dev_b_id}/transition"
              payload: { action: "APPROVE" }
              as: QualityManager
              as_user_id: "${qm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_DEVIATION_OVERLAP"
            - "Deviation.${dev_b_id}.status == REQUESTED"

      - name: auditor_buffered_window_double_booking_rejected
        grounds:
          - state_machines.Audit.PLANNED_to_IN_PROGRESS
          - validations[priority=12]
          - entities.Audit.fields.scheduled_from
          - entities.Audit.fields.scheduled_to
          - entities.Audit.fields.lead_auditor_id
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Audit, scoped to
          lead_auditor_id): a 24h INCLUSIVE buffer expands each closed window, so audit B
          [2026-07-02T12:00,2026-07-03] starting against IN_PROGRESS audit A
          [2026-07-01,2026-07-02] is rejected with ERR_AUDITOR_DOUBLE_BOOKED — abutting/near
          windows DO conflict here (the buffer is inclusive), unlike the deviation's
          exclusive half-open boundary.
        test_recipe:
          setup:
            - "An AUDITOR Personnel leads two audits A and B for the same lead_auditor_id."
            - "Audit A (window 2026-07-01..2026-07-02) is STARTed IN_PROGRESS."
            - "Audit B (window 2026-07-02T12:00..2026-07-03, within 24h of A) is PLANNED."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Aud O2", email: "audo2@x.com", role: "AUDITOR" }
              as: QualityManager
              captures: { aud_id: $.data.id }
            - call: "POST /audits"
              payload: { title: "audit A", lead_auditor_id: "${aud_id}", scheduled_from: "2026-07-01T00:00:00Z", scheduled_to: "2026-07-02T00:00:00Z", clause_scope: "8.5" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { audit_a_id: $.data.id }
            - call: "POST /audits/${audit_a_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${aud_id}"
            - call: "POST /audits"
              payload: { title: "audit B", lead_auditor_id: "${aud_id}", scheduled_from: "2026-07-02T12:00:00Z", scheduled_to: "2026-07-03T00:00:00Z", clause_scope: "8.5" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { audit_b_id: $.data.id }
          trigger:
            - call: "POST /audits/${audit_b_id}/transition"
              payload: { action: "START" }
              as: Auditor
              as_user_id: "${aud_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "http_status == 409"
            - "data.error_id == ERR_AUDITOR_DOUBLE_BOOKED"
            - "Audit.${audit_b_id}.status == PLANNED"

  - rule_id: compensating_invariant
    instances:
      - name: ncr_open_then_void_conserves_supplier_ncrs_attributed
        grounds:
          - state_machines.NonconformanceReport.DRAFT_to_OPEN
          - state_machines.NonconformanceReport.OPEN_to_VOID
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.ncrs_attributed
          - entities.Supplier.fields.quality_rating
        distinguishing_aspect: |
          Conserved quantity #1 = Supplier.ncrs_attributed. Forward DRAFT->OPEN increments it
          0->1 (rating 100.00->96.00); the compensating OPEN->VOID (no CAPA) decrements it
          1->0 and recomputes the rating, restoring ncrs_attributed == 0 and quality_rating
          == 100.00 exactly — net drift on Supplier.ncrs_attributed is zero.
        test_recipe:
          setup:
            - "A QualityEngineer Personnel and a fresh Supplier (ncrs_attributed=0, quality_rating=100.00) exist."
            - "A SUPPLIER NCR is created and OPENed (ncrs_attributed=1, rating=96.00), with no CAPA opened against it."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE I1", email: "qei1@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Inv Co A", code: "INVA" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "inv ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-I1", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /nonconformance-reports/${ncr_id}/open"
              payload: {}
              as: QualityEngineer
              as_user_id: "${qe_id}"
          trigger:
            - call: "POST /nonconformance-reports/${ncr_id}/void"
              payload: {}
              as: QualityManager
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { na: $.data.ncrs_attributed, qr: $.data.quality_rating }
          assert:
            - "NonconformanceReport.${ncr_id}.status == VOID"
            - "Supplier.${sup_id}.ncrs_attributed == 0"
            - "Supplier.${sup_id}.quality_rating == 100.00"
            - "Supplier.${sup_id}.approval_status == APPROVED"

      - name: scar_open_then_cancel_conserves_supplier_open_scar_count
        grounds:
          - state_machines.Scar.OPEN_to_CANCELLED
          - calculations.supplier_quality_rating
          - entities.Supplier.fields.open_scar_count
          - entities.Supplier.fields.quality_rating
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Supplier.open_scar_count. Opening a SCAR increments
          it 0->1 (rating 100.00->95.00); the compensating CANCEL (OPEN->CANCELLED) decrements
          it 1->0 and recomputes the rating, restoring open_scar_count == 0 and quality_rating
          == 100.00 — zero net drift on open_scar_count (a distinct quantity from
          ncrs_attributed in the prior instance).
        test_recipe:
          setup:
            - "A QualityEngineer and a QualityManager Personnel and a fresh Supplier exist."
            - "A SUPPLIER NCR is created in DRAFT (never opened, so ncrs_attributed stays 0)."
            - "A SCAR is opened against the supplier for that NCR (open_scar_count=1, rating=95.00)."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "QE I2", email: "qei2@x.com", role: "QUALITY_ENGINEER" }
              as: QualityManager
              captures: { qe_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Inv Co B", code: "INVB" }
              as: QualityManager
              captures: { sup_id: $.data.id }
            - call: "POST /nonconformance-reports"
              payload: { title: "scar inv ncr", source: "SUPPLIER", severity: "MAJOR", defect_qty: 2, unit_cost_cents: 1000, part_number: "P-I2", supplier_id: "${sup_id}" }
              as: QualityEngineer
              as_user_id: "${qe_id}"
              captures: { ncr_id: $.data.id }
            - call: "POST /scars"
              payload: { ncr_id: "${ncr_id}", supplier_id: "${sup_id}", due_at: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { scar_id: $.data.id }
          trigger:
            - call: "POST /scars/${scar_id}/transition"
              payload: { action: "CANCEL" }
              as: QualityManager
            - call: "GET /suppliers/${sup_id}"
              payload: {}
              as: QualityManager
              captures: { osc: $.data.open_scar_count, qr: $.data.quality_rating }
          assert:
            - "Scar.${scar_id}.status == CANCELLED"
            - "Supplier.${sup_id}.open_scar_count == 0"
            - "Supplier.${sup_id}.ncrs_attributed == 0"
            - "Supplier.${sup_id}.quality_rating == 100.00"
