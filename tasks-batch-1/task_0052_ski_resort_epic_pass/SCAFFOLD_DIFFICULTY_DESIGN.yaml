              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Suspend Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-20" }
              as: ResortOps
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-01-21" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: anti_passback_halfopen_window_boundary
        grounds:
          - calculations.scan_access_decision
          - validations[priority=8]
          - errors[ERR_ANTI_PASSBACK]
          - entities.LiftScan.fields.scan_at
        distinguishing_aspect: |
          Numeric threshold boundary on the anti-passback window: with
          ANTI_PASSBACK_MINUTES=5 and a half-open window [last_grant,
          last_grant+5min), a re-scan at exactly +5 minutes (300s) is GRANTED
          (outside the window) while a re-scan at +4 minutes is DENIED
          ANTI_PASSBACK. Reachable via POST /passes/{id}/scan.
        test_recipe:
          setup:
            - "Clock 2026-02-10T08:00:00Z. FULL_EPIC pass, ACTIVE. First scan GRANTED at 08:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 9000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Whistler", home_network: "EPIC", gate_count: 2 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "APB Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { r1: $.data.result }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T08:04:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { r2: $.data.result, reason2: $.data.denial_reason }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T08:05:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { r3: $.data.result }
          assert:
            - "LiftScan(at 08:00).result == GRANTED"
            - "LiftScan(at 08:04).result == DENIED"
            - "LiftScan(at 08:04).denial_reason == ANTI_PASSBACK"
            - "LiftScan(at 08:05, exactly +5min).result == GRANTED"

      - name: refund_scan_count_le_max_boundary
        grounds:
