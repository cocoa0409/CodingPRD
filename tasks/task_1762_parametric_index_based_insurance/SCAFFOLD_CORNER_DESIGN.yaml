          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "bind-treaty with an expected_program_version captured before an intervening program mutation (advance-reporting-epoch) fails 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["program ACTIVE (version captured), treaty PROPOSED, then reporting epoch advanced (version +1)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-CC1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-CC1", exposure_limit_cents: 100000000 }
