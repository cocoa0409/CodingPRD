              as: CaseManager
              captures: { t2_status: $.data.status }
          assert:
            - "the 13:00 attempt (gap exactly 120 minutes after T1's 11:00 end) returns HTTP 409"
            - "${err} == ERR_TESTIMONY_BUFFER_CONFLICT"
