        distinguishing_aspect: "A COMITY approval writes converted_minutes 0 and creates NO CreditRecord, yet it lifts earned_countable_minutes to the full required_total_minutes 1800 and closes the cycle as CLOSED_COMITY — comity extinguishes the general requirement rather than granting minutes, and it is only available because the attorney's principal office is NY, which is in COMITY_JURISDICTIONS and differs from HOME_JURISDICTION 'ST'."
        test_recipe:
          setup:
            - "Attorney whose principal_office_jurisdiction is NY, admitted 2004 (so no proration), with an open 2026-2028 cycle."
            - "One ACCREDITED provider course carrying exactly the three specialty minimums (ETHICS 180, TECHNOLOGY 60, BIAS_ELIMINATION 120) already VERIFIED by attendance code."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Interstate Bar Academy", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Specialty Trio Live", delivery_format: "LIVE_WEBCAST", total_minutes: 360, presented_at: "2026-03-03T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 180 }, { category: "TECHNOLOGY", minutes: 60 }, { category: "BIAS_ELIMINATION", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "GET /cle/courses/${crs_id}"
              as: BoardAdmin
              captures: { code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2030", full_name: "Adaeze Nwosu", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "NY" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 360, completion_date: "2026-03-03T15:00:00Z", attendance_code: "${code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_id: $.data.id }
            - call: "GET /cle/attorneys/${att_id}"
              as: BoardAdmin
              captures: { att_v: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "COMITY", origin_jurisdiction: "NY", origin_course_title: "New York full compliance certificate", origin_credit_hours: 1.0, origin_category: "GENERAL", completion_date: "2026-04-04T00:00:00Z", expected_attorney_version: "${att_v}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { clm_id: $.data.id }
          trigger:
            - call: "POST /cle/reciprocity-claims/${clm_id}/determination"
              payload: { action: "APPROVE" }
              as: BoardAdmin
          assert:
            - "Before the trigger: ComplianceCycle.${cyc_id}.required_total_minutes == 1800, required_ethics_minutes == 180, required_technology_minutes == 60, required_bias_minutes == 120, prorated == false"
            - "Before the trigger: CreditRecord.${rec_id}.status == 'VERIFIED' and the cycle's earned_ethics_minutes == 180, earned_technology_minutes == 60, earned_bias_minutes == 120, earned_countable_minutes == 360"
            - "Trigger -> HTTP 200: ReciprocityClaim.${clm_id}.status == 'APPROVED', converted_minutes == 0, converted_category == 'GENERAL'"
            - "ComplianceCycle.${cyc_id}.credit_status == 'CLOSED_COMITY', comity_claim_id == ${clm_id}, certified_at == '2026-08-01T00:00:00Z'"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 1800 while earned_ethics_minutes is STILL 180 (only the general requirement is deemed met)"
            - "ComplianceCycle.${cyc_id}.carryover_out_general_minutes == 0 and carryover_out_ethics_minutes == 0"
            - "GET /cle/credit-records?cycle_id=${cyc_id} returns total_count == 1 (the comity pathway creates no CreditRecord)"
            - "Attorney.${att_id}.open_deficiency_count == 0"

      - name: comity_approval_with_a_missing_bias_minimum_pushes_the_cycle_to_deficient
        claim_type: conditional_cascade
        grounds:
          - state_machines.ReciprocityClaim.SUBMITTED_to_APPROVED
          - state_machines.ComplianceCycle.OPEN_to_DEFICIENT
          - calculations.reciprocity_credit_conversion
          - entities.Attorney.fields.open_deficiency_count
        distinguishing_aspect: "The same COMITY approval takes the DEFICIENT branch instead of CLOSED_COMITY when even one specialty total is short: the elimination-of-bias minimum survives comity, so comity_claim_id is still recorded, certified_at stays null, earned_countable_minutes is NOT lifted to 1800, and the attorney's open_deficiency_count rises."
        test_recipe:
          setup:
            - "Attorney whose principal_office_jurisdiction is IL, admitted 2004, with an open 2026-2028 cycle."
            - "A VERIFIED record covering ETHICS 180 and TECHNOLOGY 60 but zero bias minutes."
          setup_api_calls:
            - call: "POST /cle/providers"
