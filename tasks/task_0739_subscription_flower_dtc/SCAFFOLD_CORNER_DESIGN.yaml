      - name: corner_substitution_not_allowed
        claim_type: Conditional validation
        grounds: ["validations[priority=60]", "errors[ERR_SUBSTITUTION_NOT_ALLOWED]", state_machines.Shipment.SOURCING_to_SUBSTITUTED]
        distinguishing_aspect: "confirm-sourced with substitution_applied=true for a from/to pair with no allowed SubstitutionRule returns ERR_SUBSTITUTION_NOT_ALLOWED."
        test_recipe:
          setup: ["Shipment in SOURCING; no SubstitutionRule for ROSE->LILY."]
          setup_api_calls:
            - call: "POST /plans"
