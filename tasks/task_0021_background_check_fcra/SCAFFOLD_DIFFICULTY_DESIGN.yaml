          assert:
            - "below_err == 'ERR_BELOW_FEDERAL_FLOOR'"
            - "ok_days == 5"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_create_requires_application_conditional_offer_in_btb_jurisdiction
        grounds:
          - validations[priority=60]
          - errors[ERR_BAN_THE_BOX_PREMATURE_INQUIRY]
          - entities.Jurisdiction.fields.ban_the_box_enabled
          - state_machines.Application.SUBMITTED_to_CONDITIONAL_OFFER
        distinguishing_aspect: |
          BackgroundCheckOrder creation is gated by Application.status==CONDITIONAL_OFFER
          (cross-entity state read) AND by Jurisdiction.ban_the_box_enabled (cross-entity
          configuration read). Entity pair: BackgroundCheckOrder ← Application × Jurisdiction.
          In a BTB jurisdiction the order POST against a SUBMITTED application fails with
          ERR_BAN_THE_BOX_PREMATURE_INQUIRY; once Application is CONDITIONAL_OFFER, the
          same POST succeeds.
        test_recipe:
          setup:
            - "Jurisdiction CA with ban_the_box_enabled=true. Application in SUBMITTED. Consent GRANTED."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "CA", ban_the_box_enabled: true, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_ca_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Donald Knuth", email: "knuth@example.com", date_of_birth: "1938-01-10T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_ca_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
          trigger:
            # Attempt the order now (Application is SUBMITTED, not CONDITIONAL_OFFER) → premature inquiry
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${consent_id}", expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-ivy"
              captures: { btb_err: $.data.error_id }
            # Extend conditional offer, then retry
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-ivy"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-ivy"
              captures: { order_id: $.data.id, order_status: $.data.status }
          assert:
            - "btb_err == 'ERR_BAN_THE_BOX_PREMATURE_INQUIRY'"
            - "order_status == 'PENDING'"

      - name: order_create_requires_consent_granted_state
        grounds:
          - validations[priority=80]
          - errors[ERR_CONSENT_NOT_GRANTED]
          - state_machines.ConsentDisclosure.PENDING_to_GRANTED
        distinguishing_aspect: |
          BackgroundCheckOrder creation is gated by the linked ConsentDisclosure.consent_status
          == GRANTED. Entity pair: BackgroundCheckOrder ← ConsentDisclosure (different pair
          than Rule 7a's BackgroundCheckOrder ← Application × Jurisdiction). With consent
          still PENDING, the create returns ERR_CONSENT_NOT_GRANTED; once granted, it succeeds.
        test_recipe:
          setup:
            - "Jurisdiction NY with ban_the_box=false. Application in CONDITIONAL_OFFER. Consent in PENDING (NOT granted yet)."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "NY", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_ny_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Hedy Lamarr", email: "hedy@example.com", date_of_birth: "1914-11-09T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_ny_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            # Note: we still need a GRANTED consent so the Application can submit; create a
            # SECOND consent that we grant for the submit, leaving the first one PENDING.
            # However the validation rule says "at most one consent in {PENDING,GRANTED} per
            # application" — so we must REVOKE the pending one before issuing the second.
            # Simpler: grant this one to allow submit, then revoke it, then create a new
            # PENDING consent and try to use it for the order.
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-jane"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/revoke"
              payload: { expected_consent_disclosure_version: "${consent_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { pending_consent_id: $.data.id, pending_consent_v0: $.data.version }
          trigger:
            # PENDING consent — order create must fail with ERR_CONSENT_NOT_GRANTED
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${pending_consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-jane"
              captures: { not_granted_err: $.data.error_id }
            # Grant it and retry
            - call: "POST /api/v1/consents/${pending_consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${pending_consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${pending_consent_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-jane"
              captures: { order_status: $.data.status }
          assert:
            - "not_granted_err == 'ERR_CONSENT_NOT_GRANTED'"
            - "order_status == 'PENDING'"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: consent_open_interval_per_application_no_overlap
        grounds:
          - validations[priority=88]
          - errors[ERR_CONSENT_ALREADY_OPEN]
          - state_machines.ConsentDisclosure
        distinguishing_aspect: |
          ConsentDisclosure occupies an open-ended temporal interval per application:
          from creation (PENDING) until REVOKED, no other consent for the same
          application_id may be in {PENDING, GRANTED}. Interval semantics are
          half-open temporal: the interval is closed at the start (creation) and
          closed at the end (REVOKED is the boundary; a new consent is allowed
          only AFTER the existing one is revoked). No buffer; no aggregate capacity.
        test_recipe:
          setup:
            - "Application with one ConsentDisclosure in GRANTED state. Attempting a second consent for the same application_id must be rejected."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "CO", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_co_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "John von Neumann", email: "jvn@example.com", date_of_birth: "1903-12-28T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_co_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            - call: "POST /api/v1/consents/${c1_id}/grant"
              payload: { expected_consent_disclosure_version: "${c1_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c1_v1: $.data.version }
          trigger:
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:01.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { overlap_err: $.data.error_id }
            # Now revoke the first, then create a second — should now succeed
            - call: "POST /api/v1/consents/${c1_id}/revoke"
              payload: { expected_consent_disclosure_version: "${c1_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:02.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c2_id: $.data.id, c2_status: $.data.consent_status }
          assert:
            - "overlap_err == 'ERR_CONSENT_ALREADY_OPEN'"
            - "c2_status == 'PENDING'"

      - name: verification_categorical_slot_uniqueness_per_order
        grounds:
          - validations[priority=90]
          - errors[ERR_DUPLICATE_VERIFICATION_TYPE]
          - entities.Verification.fields.verification_type
        distinguishing_aspect: |
          Verification occupies a categorical slot per (order_id, verification_type) —
          a closed-set occupancy across a categorical dimension rather than a temporal
          interval. Different resource entity (Verification vs ConsentDisclosure) and
          different interval semantics (categorical slot vs half-open temporal
          interval). Attempting a second CRIMINAL verification on the same order is
          rejected; the slot is already occupied.
        test_recipe:
          setup:
            - "BackgroundCheckOrder created with one CRIMINAL Verification already present. Attempting a second CRIMINAL must be rejected."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
