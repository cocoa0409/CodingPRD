# =============================================================================
# §1.8 Scaffold Difficulty Design — Pet Food Manufacturing & AAFCO Labeling
# Test Targeting Index: 9 Difficulty Rules x 2 instances = 18 instances.
# Every setup chain replays cleanly against SCAFFOLD.yaml §1.5 from empty DB.
# Shared building blocks (written out in full per instance):
#   brand owner -> supplier(+approve) -> ingredient -> pairing request
#   -> pairing approve -> formula -> formula-ingredient(s) -> nutrient profile
#   -> submit-nutrient-review -> substantiate -> lock -> production batch
# =============================================================================

scaffold_difficulty_design:
  # -------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: me_calculation_formulation_vs_lab_variant
        grounds:
          - calculations.me_calculation
          - entities.NutrientProfile.fields.metabolizable_energy_kcal_per_kg
          - entities.NutrientProfile.fields.profile_basis
        distinguishing_aspect: |
          Entity domain: NutrientProfile energetics. For identical macro inputs
          (protein 26, fat 9, fiber 3, moisture 10), the formulation_estimate
          variant (full 0.88 fiber coefficient) yields ME 3541.5 kcal/kg while
          the lab_verified variant (halved 0.44 coefficient) yields 3602.7
          kcal/kg — two valid algorithm variants producing different results
          for the same nutrient numbers.
        test_recipe:
          setup:
            - "BrandOwner ACTIVE exists"
            - "Formula F (DOG, ADULT_MAINTENANCE, FORMULATION basis) exists in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Acme Pet Brands", fein: "123456780", contact_email: "ra@acme.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "AD-001", product_name: "Acme Adult Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
              captures: { np_calc_me: $.data.metabolizable_energy_kcal_per_kg }
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "LAB_ANALYSIS", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
              captures: { np_lab_me: $.data.metabolizable_energy_kcal_per_kg }
          assert:
            - "NutrientProfile(FORMULATION_CALC).metabolizable_energy_kcal_per_kg == 3541.5"
            - "NutrientProfile(LAB_ANALYSIS).metabolizable_energy_kcal_per_kg == 3602.7"
            - "${np_calc_me} != ${np_lab_me}"

      - name: complaint_risk_score_provisional_vs_final
        grounds:
          - calculations.complaint_risk_score
          - entities.ComplaintCase.fields.triage_score
          - state_machines.ComplaintCase.INTAKE_to_TRIAGED
        distinguishing_aspect: |
          Entity domain: ComplaintCase risk scoring (different domain from
          NutrientProfile energetics). At intake the provisional variant omits
          the +10 adverse-event bonus (SERIOUS illness, flag pending = 35.0);
          the final variant at triage confirms the flag and includes the bonus
          (= 45.0) — identical severity and category, different score.
        test_recipe:
          setup:
            - "BrandOwner ACTIVE exists; Formula F (any basis) exists in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Beta Pet Co", fein: "223456780", contact_email: "qa@beta.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "BT-001", product_name: "Beta Dog Chow", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "SERIOUS", category: "ILLNESS", adverse_event_flag: false }
              as: QualityAnalyst
              captures: { cc_id: $.data.id, cc_prov: $.data.triage_score }
          trigger:
            - call: "POST /petfood/complaint-cases/${cc_id}/triage"
              payload: { confirm_adverse_event_flag: true }
              as: QualityAnalyst
              captures: { cc_final: $.data.triage_score }
          assert:
            - "ComplaintCase.${cc_id} provisional triage_score at intake == 35.0"
            - "ComplaintCase.${cc_id}.triage_score after triage == 45.0"
            - "ComplaintCase.${cc_id}.status == TRIAGED (45.0 < 60.0, no auto-escalation)"

  # -------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — two different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: aafco_profile_check_energy_normalization_branch
        grounds:
          - calculations.aafco_profile_check
          - entities.NutrientProfile.fields.aafco_compliance
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear conditional interaction. The
          compliance floor for CAT ADULT protein (base 26.0) is conditionally
          rescaled by ME/4000 only when ME > 4000: with the high-ME profile
          (ME 4347.4) the floor becomes 28.26, so a protein value of 27.0 that
          is COMPLIANT on an unnormalized basis flips to DEFICIENT; protein
          28.5 remains COMPLIANT. Inputs: species, life_stage, protein, fat,
          fiber, moisture, computed ME — with a branch on the ME threshold.
        test_recipe:
          setup:
            - "BrandOwner ACTIVE; Formula CAT-ADULT FORMULATION in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "CatCo", fein: "323456780", contact_email: "ra@catco.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "CT-001", product_name: "CatCo Adult Cat", species: "CAT", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 27.0, crude_fat_min_pct: 18.0, crude_fiber_max_pct: 1.0, moisture_max_pct: 8.0 }
              as: FormulationScientist
              captures: { np_low: $.data.aafco_compliance }
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 28.5, crude_fat_min_pct: 18.0, crude_fiber_max_pct: 1.0, moisture_max_pct: 8.0 }
              as: FormulationScientist
              captures: { np_high: $.data.aafco_compliance }
          assert:
            - "First profile (protein 27.0): metabolizable_energy_kcal_per_kg == 4347.4 and aafco_compliance == DEFICIENT (floor 28.26)"
            - "Second profile (protein 28.5): aafco_compliance == COMPLIANT"

      - name: ga_composite_rounding_order_pinned
        grounds:
          - calculations.ga_composite_calculation
          - entities.GuaranteedAnalysisReport.fields.composite_protein_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, order pinned. With
          samples FIRST 38.236, MIDDLE 22.379, COMPOSITE 22.345 (weight 1.25),
          the pinned order (round each weighted contribution to 3 decimals,
          then sum, then divide, then round to 2 decimals) yields 27.24;
          summing unrounded contributions first would yield 27.25. The scaffold
          pins the first order; the assert checks the exact pinned literal.
        test_recipe:
          setup:
            - "LOCKED formula with COMPLIANT profile; batch COMPLETED"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Delta Pets", fein: "423456780", contact_email: "qa@delta.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Delta Ingredients Inc", fsma_facility_id: "FSMA-D001", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Chicken Meal", ingredient_code: "CHML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.65, CRUDE_FAT: 0.12, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-1001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "DL-001", product_name: "Delta Adult Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f_ver: $.data.version }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 1000.0, line_id: "LINE-A", scheduled_start: "2026-08-10T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - call: "POST /petfood/production-batches/${b_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b_id}/start-run"
              payload: {}
              as: LineOperator
            - call: "POST /petfood/production-batches/${b_id}/complete"
              payload: { actual_kg: 1000.0 }
              as: LineOperator
          trigger:
            - call: "POST /petfood/production-batches/${b_id}/lab-samples"
              payload: { sample_type: "FIRST", measured_protein_pct: 38.236, measured_fat_pct: 12.0, measured_fiber_pct: 2.0, measured_moisture_pct: 9.0 }
              as: QualityAnalyst
            - call: "POST /petfood/production-batches/${b_id}/lab-samples"
              payload: { sample_type: "MIDDLE", measured_protein_pct: 22.379, measured_fat_pct: 12.0, measured_fiber_pct: 2.0, measured_moisture_pct: 9.0 }
              as: QualityAnalyst
            - call: "POST /petfood/production-batches/${b_id}/lab-samples"
              payload: { sample_type: "COMPOSITE", measured_protein_pct: 22.345, measured_fat_pct: 12.0, measured_fiber_pct: 2.0, measured_moisture_pct: 9.0 }
              as: QualityAnalyst
            - call: "POST /petfood/production-batches/${b_id}/ga-reports"
              payload: {}
              as: QualityAnalyst
              captures: { ga_protein: $.data.composite_protein_pct }
          assert:
            - "GuaranteedAnalysisReport.composite_protein_pct == 27.24 (pinned round-contributions-first order; sum-then-round would give 27.25)"

  # -------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: formula_review_revision_cycle
        grounds:
          - state_machines.Formula.NUTRIENT_REVIEW_to_DRAFT
          - state_machines.Formula.DRAFT_to_NUTRIENT_REVIEW
          - entities.Formula.fields.revision_number
        distinguishing_aspect: |
          Entity: Formula — a cyclic machine (DRAFT -> NUTRIENT_REVIEW ->
          DRAFT -> NUTRIENT_REVIEW). Each pass through request-revision
          increments revision_number while status loops; the loop is unbounded
          and the counter records the lap count.
        test_recipe:
          setup:
            - "Formula with one ACTIVE ingredient summing to 100% in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Echo Pets", fein: "523456780", contact_email: "ra@echo.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Lamb Meal", ingredient_code: "LMML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.60, CRUDE_FAT: 0.10, MOISTURE: 0.09 }, allergen_class: "OTHER" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "EC-001", product_name: "Echo Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
              captures: { f_rev1: $.data.revision_number }
          trigger:
            - call: "POST /petfood/formulas/${f_id}/request-revision"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
              captures: { f_rev2: $.data.revision_number, f_status: $.data.status }
          assert:
            - "After first submit: revision_number == 1"
            - "After request-revision: status == DRAFT and revision_number == 2"
            - "After second submit: status == NUTRIENT_REVIEW and revision_number == 2 (cycle traversed, counter kept)"

      - name: complaint_case_branching_fork_auto_escalation
        grounds:
          - state_machines.ComplaintCase.INTAKE_to_TRIAGED
          - entities.ComplaintCase.fields.status
        distinguishing_aspect: |
          Entity: ComplaintCase — a branching fork at triage (INTAKE ->
          {TRIAGED, ESCALATED_RECALL}) where the branch is selected by the
          computed final triage_score against ESCALATION_THRESHOLD 60.0, with
          divergent side-effect sets per branch (TRIAGED only recomputes the
          brand score; ESCALATED_RECALL additionally arms recall gating). A
          DEATH+ILLNESS+adverse-flag case scores 85.0 and forks to
          ESCALATED_RECALL, skipping TRIAGED entirely.
        test_recipe:
          setup:
            - "BrandOwner ACTIVE; Formula in DRAFT"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Foxtrot Pets", fein: "623456780", contact_email: "qa@fox.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "FX-001", product_name: "Foxtrot Cat", species: "CAT", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "DEATH", category: "ILLNESS", adverse_event_flag: true }
              as: QualityAnalyst
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /petfood/complaint-cases/${cc_id}/triage"
              payload: { confirm_adverse_event_flag: true }
              as: QualityAnalyst
              captures: { cc_status: $.data.status, cc_score: $.data.triage_score }
          assert:
            - "ComplaintCase.${cc_id}.triage_score == 85.0"
            - "ComplaintCase.${cc_id}.status == ESCALATED_RECALL (fork branch taken; never observed TRIAGED)"

  # -------------------------------------------------------------------------
  # Rule 4: transitive_cascade — different triggers, depth >=3 and >=2
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recall_initiation_three_hop_cascade
        grounds:
          - state_machines.RecallAction
          - state_machines.ProductionBatch
          - entities.BatchLotCode.fields.status
          - entities.Formula.fields.open_recall_flag
          - entities.BrandOwner.fields.open_recall_count
        distinguishing_aspect: |
          Trigger: POST /petfood/recall-actions. Depth-3 chain: RecallAction
          INITIATED mutates ProductionBatch (COMPLETED -> RECALLED); the batch
          mutation itself triggers its BatchLotCode rows (ACTIVE -> RECALLED);
          and the recall's existence recomputes Formula.open_recall_flag ->
          true, which in turn gates StateRegistration acceptance (hop 3 is the
          formula-level flag mutation caused by the recall row, not by the
          original call directly mutating the formula's batches' lots).
        test_recipe:
          setup:
            - "LOCKED formula; one COMPLETED batch with one ACTIVE lot"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Golf Pets", fein: "723456780", contact_email: "qa@golf.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Golf Supply", fsma_facility_id: "FSMA-G001", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Salmon Meal", ingredient_code: "SMML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.62, CRUDE_FAT: 0.14, MOISTURE: 0.07 }, allergen_class: "FISH" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-2001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "GF-001", product_name: "Golf Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f_ver: $.data.version }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 500.0, line_id: "LINE-B", scheduled_start: "2026-08-11T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - call: "POST /petfood/production-batches/${b_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b_id}/start-run"
              payload: {}
              as: LineOperator
            - call: "POST /petfood/production-batches/${b_id}/complete"
              payload: { actual_kg: 500.0 }
              as: LineOperator
            - call: "POST /petfood/production-batches/${b_id}/lots"
              payload: { packaged_units: 1000, best_by_date: "2027-08-01T00:00:00Z" }
              as: LineOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /petfood/recall-actions"
              payload: { formula_id: "${f_id}", scope_batch_ids: ["${b_id}"], recall_class: "CLASS_I", reason: "Salmonella confirmed" }
              as: QAApprover
              captures: { ra_id: $.data.id, ra_lots: $.data.affected_lot_count }
          assert:
            - "RecallAction.${ra_id}.affected_lot_count == 1"
            - "ProductionBatch.${b_id}.status == RECALLED"
            - "BatchLotCode.${lot_id}.status == RECALLED"
            - "Formula.${f_id}.open_recall_flag == true"
            - "BrandOwner.${bo_id}.open_recall_count == 1"

      - name: pairing_revocation_two_hop_formula_demotion
        grounds:
          - state_machines.SupplierIngredientApproval.APPROVED_to_REVOKED
          - state_machines.Formula.NUTRIENT_REVIEW_to_DRAFT
        distinguishing_aspect: |
          Trigger: POST /petfood/supplier-ingredient-approvals/{id}/revoke —
          different trigger from recall initiation. Depth-2 chain: the REVOKED
          pairing mutates Supplier.approved_ingredient_count, and the coverage
          loss itself demotes every NUTRIENT_REVIEW formula that relied on the
          pairing back to DRAFT with revision_number + 1 (formula mutation is
          caused by the approval-state change, not by a direct call on the
          formula).
        test_recipe:
          setup:
            - "APPROVED pairing is the sole coverage for the formula's only ingredient; formula sits in NUTRIENT_REVIEW at revision 1"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Hotel Pets", fein: "823456780", contact_email: "ra@hotel.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Hotel Supply", fsma_facility_id: "FSMA-H001", country_code: "US", risk_tier: "MEDIUM" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Turkey Meal", ingredient_code: "TKML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.63, CRUDE_FAT: 0.11, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-3001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
