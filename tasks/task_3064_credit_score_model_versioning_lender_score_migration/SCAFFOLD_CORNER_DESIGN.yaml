            - {call: "POST /model-documentation/${md}/file", payload: {expected_documentation_version: "${mdv}"}, as: ComplianceOfficer}
            - {call: "POST /migration-events", payload: {lender_code: "LEND-NORTH", from_score_variant_id: "${v1}", to_score_variant_id: "${v2}", event_type: "RECALIBRATED", evidence_ref: "WS-FLT-1", old_cutoff_score: 640}, as: ComplianceOfficer, captures: {me1: $.data.migration_event_id}}
            - {call: "POST /migration-events", payload: {lender_code: "LEND-SOUTH", from_score_variant_id: "${v1}", to_score_variant_id: "${v1}", event_type: "SNAPSHOT_COMPILED", evidence_ref: "WS-FLT-2"}, as: ModelDeveloper, captures: {me2: $.data.migration_event_id}}
          trigger:
            - {call: "GET /migration-events?from_score_variant_id=${v1}&to_score_variant_id=${v2}", payload: {}, as: ComplianceOfficer, captures: {hit: "$.data[0].id"}}
            - {call: "GET /migration-events?from_score_variant_id=${v1}&event_type=SNAPSHOT_COMPILED", payload: {}, as: ComplianceOfficer, captures: {snap: "$.data[0].id"}}
          assert:
            - "data.hit == MigrationEvent.${me1} — the pair filter returns exactly the crossing event"
            - "the from-only filter would have returned both rows, so the to-variant is load-bearing on this read"
            - "data.snap == MigrationEvent.${me2} && data.snap != MigrationEvent.${me1}"
            - "GET /migration-events?lender_code=LEND-NORTH reports total_count == 1"

