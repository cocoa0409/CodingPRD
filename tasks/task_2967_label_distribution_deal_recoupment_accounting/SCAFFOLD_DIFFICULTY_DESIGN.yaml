            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1600, escalated_royalty_rate_pct: 0.2000, advance_amount_cents: 0, recording_costs_cents: 0, recording_recoupable_pct: 0.0000, marketing_recoup_share_pct: 0.5000, supersedes_agreement_id: "${agr_a_id}" }
              as: LabelAdmin
