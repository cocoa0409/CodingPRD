              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_2_id: $.data.id }
