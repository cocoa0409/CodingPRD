              payload: {}
              as: CenterAdmin
              captures: { room_v1: $.data.version }
          trigger:
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${e2_id}", room_id: "${room_id}", starts_at: "2026-01-02T06:00:00Z", ends_at: "2026-01-02T08:00:00Z", expected_room_version: "${room_v1}" }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response error_id == ERR_ROOM_DOUBLE_BOOKED (starts at ends_at, inside the 30-min turnover buffer)"

      # ---- Instance 2: Provider on-call window — closed-interval, no buffer, touching collides
      - name: rto_provider_window_closed_touching_collides
        grounds:
          - validations[priority=11]
          - entities.OnCallAssignment.fields.coverage_start
