      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Pos Garage
          tax_id: TX-10001
          billing_address: 8 Pos Ave
          home_store_id: ${s_sat}
          credit_limit_cents: 5000000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_mach}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          o1: $.data.id
          o1_v: $.data.version
          acct_v1: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${o1_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
        captures:
          o1_v2: $.data.version
          acct_v2: $.data.version
      - call: POST /commercial/part-orders/{orderId}/allocate
        payload:
          expected_order_version: ${o1_v2}
          expected_account_version: ${acct_v2}
        as: CommercialSalesRep
        captures:
          o1_v3: $.data.version
          acct_v3: $.data.version
      - call: POST /commercial/part-orders/{orderId}/pick
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/part-orders/{orderId}/deliver
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/tool-catalog
        payload:
          tool_sku: TOOL-LOST
          tool_name: Vacuum Gauge
          deposit_amount_cents: 2000
          replacement_part_id: null
          replacement_unit_cost_cents: 0
        as: ToolCribAttendant
        captures:
          t1: $.data.id
      - call: POST /commercial/tool-loans
        payload:
          account_id: ${acct}
          tool_catalog_id: ${t1}
          deposit_amount_cents: 2000
        as: CommercialSalesRep
        captures:
          ln1: $.data.id
          acct_v4: $.data.version
      trigger:
      - call: POST /commercial/tool-loans/{loanId}/checkout
        payload:
          accepted_deposit_cents: 2000
          expected_account_version: ${acct_v4}
        as: CommercialSalesRep
      - call: GET /commercial/commercial-accounts/${acct}
        payload: {}
        as: CommercialSalesRep
        captures:
          cash_before: $.data.petty_cash_cents
          recv_before: $.data.receivable_balance_cents
      - call: POST /commercial/tool-loans/${ln1}/return
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/tool-loans/${ln1}/inspect
        payload:
          return_condition: LOST
        as: ToolCribAttendant
      - call: POST /commercial/tool-loans/${ln1}/forfeit
        payload: {}
        as: ToolCribAttendant
      assert:
      - petty_cash_cents plus receivable_balance_cents is the same integer before forfeiture and after it
      - at the intermediate observation petty_cash_cents == ${cash_before} == 2000 and receivable_balance_cents == ${recv_before} == 7420
      - after forfeiture CommercialAccount.${acct}.petty_cash_cents == 0 — the held deposit was fully consumed
      - CommercialAccount.${acct}.receivable_balance_cents == 5420, exactly 7420 minus the 2000-cent deposit applied against the outstanding invoice
      - ToolLoan.${ln1}.deposit_state == "APPLIED_TO_BALANCE" and ToolLoan.${ln1}.deposit_forfeited_cents == 2000, so no cash and no receivable leaked out of the account
