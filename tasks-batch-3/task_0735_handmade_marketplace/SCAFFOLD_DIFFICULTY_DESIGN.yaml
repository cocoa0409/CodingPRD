            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Draft Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_ok: $.data.id }
          assert:
            - "first create response error_id == ERR_LISTING_NOT_PURCHASABLE"
            - "after publish, Order.${order_ok}.payment_status == UNPAID (order created)"

      - name: payout_release_hold_requires_case_resolved
        grounds:
          - state_machines.Payout.ON_HOLD_to_SCHEDULED
          - entities.Order.fields.has_open_case
          - errors[ERR_PAYOUT_HAS_OPEN_CASE]
        distinguishing_aspect: |
          Pair Payout<-Case (different pair than Order<-Listing): releasing a payout hold is
          gated on the linked Case being resolved (no swept order has_open_case); while the
          case is OPEN release-hold returns ERR_PAYOUT_HAS_OPEN_CASE, and after resolve it
          moves ON_HOLD->SCHEDULED.
