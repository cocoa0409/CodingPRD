# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Sections/claim_types per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_facility_returns_201_with_zero_counters
        claim_type: Creation
        grounds:
          - entities.Facility
          - endpoints[POST /facilities]
        distinguishing_aspect: "POST /facilities with name+total_units returns 201 and all four unit counters initialized to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "Vault Z", total_units: 5 }, as: VaultManager, captures: { av: $.data.units_available, oc: $.data.units_occupied } }
          assert:
            - "Facility.units_available == 0"
            - "Facility.units_occupied == 0"

      - name: member_default_tier_bronze_zero_discount
        claim_type: Defaults
        grounds:
          - entities.Member.fields.membership_tier
          - entities.Member.fields.tier_discount_pct
        distinguishing_aspect: "Omitting membership_tier defaults to BRONZE with tier_discount_pct 0.00."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { full_name: "Def M", email: "def1@x.com" }, as: VaultManager, captures: { mt: $.data.membership_tier, dp: $.data.tier_discount_pct } }
          assert:
            - "Member.membership_tier == BRONZE"
            - "Member.tier_discount_pct == 0.00"

      - name: get_member_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /members/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /members with an unknown UUID returns ERR_NOT_FOUND (404), no body entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /members/00000000-0000-0000-0000-000000000000", payload: {}, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_vehicle_missing_required_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Vehicle.fields.vin
          - endpoints[POST /vehicles]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /vehicles without the required vin field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["a member exists"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Rq M", email: "rq1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
          trigger:
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "X", model: "Y", model_year: 2020, fuel_type: "ICE", declared_value_cents: 100 }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_unit_invalid_enum_class_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.StorageUnit.fields.unit_class
          - endpoints[POST /facilities/{id}/units]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "unit_class outside {STANDARD,CLIMATE,SHOWCASE} (e.g. PLATINUM) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault EnumF", total_units: 3 }, as: VaultManager, captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "EE1", unit_class: "PLATINUM", monthly_rate_cents: 1000 }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_member_email_returns_duplicate
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.email
          - validations[priority=5]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "A second member with an already-used email returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one member with email dup@x.com"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Dup A", email: "dup@x.com" }, as: VaultManager, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /members", payload: { full_name: "Dup B", email: "dup@x.com" }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_DUPLICATE"

      - name: create_unit_beyond_total_units_returns_limit_error
        claim_type: Parent Relationships
        grounds:
          - entities.Facility.fields.total_units
          - errors[ERR_FACILITY_UNIT_LIMIT]
          - endpoints[POST /facilities/{id}/units]
        distinguishing_aspect: "With total_units=1, creating a second unit returns ERR_FACILITY_UNIT_LIMIT (409)."
        test_recipe:
          setup: ["facility total_units=1 with one unit already created"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Lim", total_units: 1 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "LU1", unit_class: "STANDARD", monthly_rate_cents: 1000 }, as: VaultManager, captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "LU2", unit_class: "STANDARD", monthly_rate_cents: 1000 }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_FACILITY_UNIT_LIMIT"

  - section: state_machines
    instances:
      - name: cancel_in_storage_agreement_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StorageAgreement.PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "cancel is only valid from PENDING; cancelling an IN_STORAGE agreement returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["an agreement IN_STORAGE"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault SM1", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "SM1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Sm M", email: "sm1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-SM1", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
          trigger:
            - { call: "POST /storage-agreements/${agr}/cancel", payload: {}, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "StorageAgreement.${agr}.status == IN_STORAGE (unchanged)"

      - name: double_terminate_agreement_rejected_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.StorageAgreement.IN_STORAGE_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Terminating an already-CLOSED agreement returns ERR_INVALID_STATE (terminal-state lockdown)."
        test_recipe:
          setup: ["an agreement terminated (CLOSED)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault SM2", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "SM2", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Sm2 M", email: "sm2@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-SM2", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /storage-agreements/${agr}/terminate", payload: {}, as: VaultManager }
          trigger:
            - { call: "POST /storage-agreements/${agr}/terminate", payload: {}, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "StorageAgreement.${agr}.status == CLOSED"

      - name: move_in_without_documented_vehicle_rejected_cross_entity
        claim_type: guarded_transition
        grounds:
          - state_machines.StorageAgreement.PENDING_to_IN_STORAGE
          - entities.Vehicle.fields.condition_status
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: "move-in requires Vehicle.condition_status DOCUMENTED; with INTAKE_PENDING it returns ERR_CROSS_ENTITY_STATE."
        test_recipe:
          setup: ["agreement PENDING; vehicle never intake-inspected (INTAKE_PENDING)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault SM3", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "SM3", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Sm3 M", email: "sm3@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-SM3", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
          trigger:
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_CROSS_ENTITY_STATE"
            - "StorageAgreement.${agr}.status == PENDING"

      - name: inspection_fail_sets_vehicle_damage_hold
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - entities.Vehicle.fields.condition_status
        distinguishing_aspect: "Failing an inspection sets the vehicle condition_status to DAMAGE_HOLD."
        test_recipe:
          setup: ["a vehicle with a SCHEDULED inspection"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Insp M", email: "insp1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-INS1", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "PERIODIC" }, as: VaultManager, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /inspections/${insp}/fail", payload: { damage_noted: true, findings: "scratch" }, as: ConciergeTech }
          assert:
            - "Inspection.${insp}.status == FAILED"
            - "Vehicle.${veh}.condition_status == DAMAGE_HOLD"

  - section: calculations
    instances:
      - name: monitoring_low_battery_alert_threshold
        claim_type: Correct Result
        grounds:
          - entities.MonitoringSubscription.fields.low_battery_alert
          - endpoints[POST /monitoring/{id}/record-reading]
        distinguishing_aspect: "A recorded reading of 12.3 (< BATTERY_MIN_VOLTAGE 12.4) sets low_battery_alert true."
        test_recipe:
          setup: ["an agreement IN_STORAGE with an ACTIVE monitoring subscription"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Cal1", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "CAL1", unit_class: "CLIMATE", monthly_rate_cents: 40000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Cal M", email: "cal1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-CAL1", fuel_type: "EV", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /storage-agreements/${agr}/monitoring", payload: { monitor_type: "BATTERY_TENDER", monthly_fee_cents: 5000 }, as: ConciergeTech, captures: { mon: $.data.id } }
          trigger:
            - { call: "POST /monitoring/${mon}/record-reading", payload: { battery_voltage: 12.3 }, as: ConciergeTech, captures: { alert: $.data.low_battery_alert } }
          assert:
            - "MonitoringSubscription.${mon}.last_battery_voltage == 12.3"
            - "MonitoringSubscription.${mon}.low_battery_alert == true (12.4 would be false)"

      - name: storage_monthly_fee_covered_by_difficulty
        claim_type: Correct Result
        grounds:
          - calculations.storage_monthly_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / storage_fee_discount_cap_nonlinear
          rationale: "storage_monthly_fee correctness (surcharge + capped tier discount) is asserted by the named §1.8 instance."

      - name: invoice_total_covered_by_difficulty
        claim_type: Correct Result
        grounds:
          - calculations.invoice_total
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_per_line_tax_rounding_order
          rationale: "invoice_total per-line tax rounding is asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: request_without_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request missing X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["request sent with NO X-User-Role and NO X-User-ID headers"]
          setup_api_calls: []
          trigger:
            - { call: "POST /facilities", payload: { name: "NoAuth", total_units: 1 }, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_UNAUTHENTICATED"

  - section: endpoints
    instances:
      - name: list_agreements_filtered_by_member_paginated
        claim_type: Listing
        grounds:
          - endpoints[GET /storage-agreements]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /storage-agreements?member_id returns only that member's agreements inside a paginated array envelope (total_count, has_more)."
        test_recipe:
          setup: ["one member with one PENDING agreement"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Ep1", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "EP1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Ep M", email: "ep1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-EP1", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
          trigger:
            - { call: "GET /storage-agreements", payload: { member_id: "${mem}" }, as: VaultManager }
          assert:
            - "response is an array envelope containing exactly the agreement ${agr}"
            - "meta pagination reports total_count == 1 and has_more == false"

  - section: rbac
    instances:
      - name: member_cannot_approve_service_order_unauthorized
        claim_type: forbidden_operation
        grounds:
          - roles.Member
          - endpoints[POST /service-orders/{id}/approve]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "approve is a VaultManager-exclusive op; a Member calling it returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["an agreement IN_STORAGE with a REQUESTED service order"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Rb1", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "RB1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Rb M", email: "rb1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-RB1", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "DETAIL", estimated_labor_hours: 1.0 }, as: VaultManager, captures: { so: $.data.id } }
          trigger:
            - { call: "POST /service-orders/${so}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: Member, as_user_id: "${mem}", captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_UNAUTHORIZED"
            - "ServiceOrder.${so}.status == REQUESTED (unchanged)"

      - name: conciergetech_cannot_generate_invoice_unauthorized
        claim_type: forbidden_operation
        grounds:
          - roles.ConciergeTech
          - endpoints[POST /invoices/generate]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "invoice generation is BillingAdmin-exclusive; a ConciergeTech calling it returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["a member and a PENDING agreement exist"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Rb2", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "RB2", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Rb2 M", email: "rb2@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-RB2", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
          trigger:
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z" }, as: ConciergeTech, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_UNAUTHORIZED"

  - section: cross_cutting
    instances:
      - name: occ_stale_unit_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-unit]
          - errors[ERR_STALE_UNIT_VERSION]
          - endpoints[POST /storage-agreements]
        distinguishing_aspect: "After one booking bumps unit.version 1->2, a second (non-overlapping) booking carrying the stale expected_unit_version=1 returns ERR_STALE_UNIT_VERSION (412)."
        test_recipe:
          setup: ["a facility with one STANDARD unit (version 1)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault Occ", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "OCC1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, uv1: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Occ M", email: "occ1@x.com" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "A", model: "B", model_year: 2020, vin: "VIN-OCC1", fuel_type: "ICE", declared_value_cents: 100000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-09-01T00:00:00Z", expected_unit_version: "${uv1}" }, as: VaultManager, captures: { agr1: $.data.id } }
          trigger:
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-09-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${uv1}" }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "response data.error_id == ERR_STALE_UNIT_VERSION"
            - "StorageAgreement.${agr1}.status == PENDING (first booking stands)"

  - section: errors
    instances:
      - name: err_unit_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / unit_occupancy_half_open_adjacency_allowed
          rationale: "ERR_UNIT_OVERLAP is the failure path asserted by the named §1.8 instance."
      - name: err_transporter_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRANSPORTER_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / transporter_buffered_overlap_conflict
          rationale: "ERR_TRANSPORTER_CONFLICT is asserted by the named §1.8 instance."
      - name: err_insurance_lapsed_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSURANCE_LAPSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_create_requires_vehicle_insurance_active
          rationale: "ERR_INSURANCE_LAPSED is asserted by the named §1.8 instance (and the priority-pair instance)."
      - name: err_coverage_insufficient_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COVERAGE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / delivery_coverage_ge_declared_value_boundary
          rationale: "ERR_COVERAGE_INSUFFICIENT boundary is asserted by the named §1.8 instance."
      - name: err_units_available_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNITS_AVAILABLE]
        excluded_because:
          difficulty_instance: boundary_precision_check / waitlist_join_only_at_zero_available_units
          rationale: "ERR_UNITS_AVAILABLE is the >=1-available failure path of the named §1.8 instance."
      - name: err_member_suspended_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MEMBER_SUSPENDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / delivery_safety_beats_fiscal
          rationale: "ERR_MEMBER_SUSPENDED is the lower-priority fiscal error in the named §1.8 priority-pair instance."

