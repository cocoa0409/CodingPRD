            - "response.data.error_id == ERR_DISPENSE_CHANNEL_MISMATCH (referenced prescription is CANCELLED, not ACTIVE)"
            - "FinishedPreparation.${prep_id}.dispense_status == IN_INVENTORY (dispense rejected)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: beyond_use_date_boundary_dispense_inclusive_window
        grounds:
          - validations[priority=13]
          - state_machines.FinishedPreparation.IN_INVENTORY_to_DISPENSED
          - entities.FinishedPreparation.fields.beyond_use_utc
          - errors[ERR_BEYOND_USE_DATE_PASSED]
          - calculations.bud_assignment
        distinguishing_aspect: |
          The FinishedPreparation occupies a single-sided usable interval
          [compile, beyond_use_utc] (inclusive right edge). Advancing the facility
          clock one second PAST beyond_use_utc collides with that interval's right
          boundary and the dispense is rejected ERR_BEYOND_USE_DATE_PASSED (409) —
          a half-open point-vs-interval temporal semantics on the FinishedPreparation resource.
        test_recipe:
          setup:
            - "503A facility, nonsterile MFR default_bud_days_nonsterile=14, clock 2026-06-01T00:00:00.000Z."
            - "Batch compiled (BUD = 2026-06-15T00:00:00.000Z), released, one QC_RELEASED/IN_INVENTORY prep."
            - "Clock advanced to 2026-06-15T00:00:01.000Z (one second past BUD)."
