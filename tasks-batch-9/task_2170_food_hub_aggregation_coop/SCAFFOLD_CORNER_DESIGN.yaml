          credit_limit_cents: 5000000
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          b1_id: $.data.id
      - call: POST /buyer-orders
        payload:
          buyer_id: ${b1_id}
          requested_delivery_date: '2026-09-15T00:00:00Z'
        as: Buyer
        as_user_id: ${b1_id}
        captures:
          o1_id: $.data.id
      - call: POST /buyer-orders/${o1_id}/lines
        payload:
          commodity_code: CARROT_LOOSE
          storage_class: CHILL
          unit_of_measure: CASE
          quantity_requested: 60
          max_unit_price_cents: 2500
        as: Buyer
        as_user_id: ${b1_id}
