      trigger:
      - call: POST /event-security/after-action-reviews/${aar_id}/decision
        payload:
          action: FINALIZE
        as: SecurityDirector
        as_user_id: director-1
      - call: POST /event-security/after-action-reviews/${aar_id}/decision
        payload:
          action: FINALIZE
        as: SecurityDirector
        as_user_id: director-1
      - call: POST /event-security/after-action-reviews/${aar_id}/decision
        payload:
