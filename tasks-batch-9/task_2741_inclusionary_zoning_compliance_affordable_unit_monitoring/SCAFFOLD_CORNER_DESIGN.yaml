      - name: the_occupancy_loop_runs_occupied_to_vacant_and_back
        claim_type: loop_back_transition
        grounds:
          - state_machines.AffordableUnit.OCCUPIED_to_VACANT
          - state_machines.AffordableUnit.VACANT_to_OCCUPIED
          - state_machines.IncomeCertification.CERTIFIED_to_EXPIRED
        distinguishing_aspect: |
          The unit occupancy machine is cyclic: a RENTAL unit returns to OCCUPIED after its
          governing certification lapses, and the loop is bounded only by certification terms,
          never by a counter. The clock sweep does the outbound leg (certification EXPIRED,
          unit VACANT with current_rent_cents zeroed and occupant cleared) and a fresh
          certification for a different household does the inbound leg. Each pass strictly
          advances expires_at (2027-08-01 then 2028-08-01), which is the loop's termination
          argument, and the first household stays CERTIFIED rather than being rolled back.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units, approval 2026-01-15) screened SUBJECT, ONSITE elected, agreement recorded; one RENTAL 2-bedroom unit CY-101 at 5000 bps."
            - "Household H1 (size 3, income 6000000) certified into CY-101 on 2026-08-01 at rent 140000, so the certification expires 2027-08-01 and the unit is OCCUPIED."
            - "A second household H2 (size 2, income 5000000) is registered and never applied to a lottery."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Cycle Yard", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-CY-1001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "CY-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Ines Novak", household_size: 2, gross_annual_income_cents: 5000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-08-02T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u_id}", certified_income_cents: 5000000, contract_rent_cents: 141000, effective_date: "2027-08-02" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c2_id: $.data.id } }
          assert:
            - "IncomeCertification.${c1_id}.expires_at == 2027-08-01 and, after the clock advance, state == EXPIRED"
            - "right after the clock advance AffordableUnit.${u_id}.occupancy_status == VACANT with current_rent_cents == 0 and occupant_household_id null, while max_allowed_rent_cents is left at 143872"
            - "Household.${h1_id}.state is still CERTIFIED — expiry does not roll the household back"
            - "the second certification returns HTTP 201 and closes the loop: AffordableUnit.${u_id}.occupancy_status == OCCUPIED with occupant_household_id == ${h2_id} and current_rent_cents == 141000"
            - "IncomeCertification.${c2_id}.expires_at == 2028-08-01 — strictly later than the first pass, so the loop cannot spin without advancing time"
            - "IncomeCertification.${c2_id}.is_recertification == false — this is a new tenancy, not a recertification of ${c1_id}"
            - "Project.${p_id}.state is still MONITORING and onsite_unit_equivalents_bps is still 10000 across the whole loop"

      - name: invalid_transitions_across_the_marketing_and_lottery_track
        claim_type: invalid_transition
        grounds:
          - validations.priority_13
          - validations.priority_14
          - validations.priority_15
          - errors[ERR_PLAN_NOT_APPROVED]
          - errors[ERR_LOTTERY_STATE_INVALID]
          - errors[ERR_HOUSEHOLD_STATE_INVALID]
        distinguishing_aspect: |
          Every undeclared edge on the marketing and lottery machines is refused with that
          machine's own state error, and the priority ladder decides which one when two are
          candidates: applying to a DRAWN event yields ERR_LOTTERY_STATE_INVALID (priority 14)
          even though the applicant would also fail the household check, whereas after a
          redraw returns the event to PENDING the same applicant yields
