      - name: coverage_admin_fee_enters_tier_selection_before_the_rate_is_billed
        grounds:
          - calculations.supplemental_coverage_determination
          - entities.SupplementalScreeningOrder.fields.allowed_amount_cents
          - entities.SupplementalScreeningOrder.fields.coverage_tier
          - entities.SupplementalScreeningOrder.fields.covered_amount_cents
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency pinned by explicit step order:
          the 3000-cent administration fee is folded into allowed_amount_cents at
          step 5 BEFORE the tier ceilings are compared at step 6 and before the
          tier rate is applied at step 7, so a CEM order lands exactly on the
          inclusive TIER_2 ceiling 63000 and bills covered 48825 / responsibility
          14175; tiering the bare 60000 fee schedule first and adding the admin
          fee afterwards would produce covered 46500 and responsibility 16500 on
          the same allowed total.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy and MA policy (COVERAGE_WITH_COST_SHARING, waiver 5000) registered."
            - "Facility with home policy CT, one DBT_3D unit, qualified staff."
            - "One SCREENING exam for an MA-resident patient interpreted BI-RADS 1 with density_category C."
            - "One CEM SupplementalScreeningOrder in status RECOMMENDED on that exam."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_pol_ma
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-6001", patient_state_code: "MA", exam_type: "SCREENING", performed_at: "2026-07-22T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cem_exam_id: $.data.id }
            - call: "POST /exams/${cem_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cem_exam_id}/supplemental-orders"
              payload: { modality: "CEM", recommendation_note: "Contrast enhanced mammography for dense breasts" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cem_order_id: $.data.id }
          trigger:
            - call: "POST /supplemental-orders/${cem_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "SupplementalScreeningOrder.${cem_order_id}.allowed_amount_cents == 63000"
            - "SupplementalScreeningOrder.${cem_order_id}.coverage_tier == TIER_2 (63000 sits exactly on the inclusive TIER_2 ceiling)"
            - "SupplementalScreeningOrder.${cem_order_id}.covered_amount_cents == 48825"
            - "SupplementalScreeningOrder.${cem_order_id}.patient_responsibility_cents == 14175"
            - "SupplementalScreeningOrder.${cem_order_id}.covered_amount_cents + patient_responsibility_cents == 63000"
            - "SupplementalScreeningOrder.${cem_order_id}.coverage_outcome == COVERED_WITH_COST_SHARE"
            - "SupplementalScreeningOrder.${cem_order_id}.status == COVERAGE_DETERMINED"
            - "covered_amount_cents != 46500 — the admin fee is inside the amount the tier rate is applied to, not added after"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: exam_three_parallel_dimensions_hold_three_different_values
        grounds:
          - state_machines.Exam.report_status.INTERPRETED_FINAL_to_AMENDED
          - state_machines.Exam.notification_status.SENT_to_PENDING
          - state_machines.Exam.follow_up_status.PENDING_to_COMPLETED
          - entities.Exam.fields.report_status
          - entities.Exam.fields.notification_status
          - entities.Exam.fields.follow_up_status
        distinguishing_aspect: |
          PARALLEL shape on Exam: report_status, notification_status and
          follow_up_status are three independent dimensions of the same row, and
          after the amendment the exam holds report_status AMENDED,
          notification_status PENDING and follow_up_status COMPLETED at the same
          instant — the completed follow-up is NOT dragged backwards by the
          reopened notification obligation, and the reopened notification does
          not revert the report dimension.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "One SCREENING exam interpreted BI-RADS 0 with density C: report_status INTERPRETED_FINAL, notification_status PENDING, follow_up_status PENDING."
            - "An ULTRASOUND supplemental order on that exam is coverage-determined, scheduled for 2026-08-05T09:00:00Z, the clock is moved to 2026-08-05T10:00:00Z, and the order is completed, so follow_up_status is COMPLETED."
            - "A notification letter is then generated and sent, so notification_status is SENT and the letter is SENT."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
