            - "GET /test-events/${te} returns 200 with data.status == 'SCHEDULED', data.scale_score == null, data.efl_level == null, data.test_date == null"

      - name: testing_center_state_code_lowercase_rejected
        claim_type: type_constraints
        grounds:
          - entities.TestingCenter.fields.state_code
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          state_code must be exactly two UPPERCASE letters; 'or' has the right length but the wrong
          case and is rejected with 400 rather than normalised to 'OR'.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /testing-centers"
              payload: { limit: 10, offset: 0 }
              as: StateAuthority
          trigger:
            - call: "POST /testing-centers"
              payload: { name: "Lowercase Center", state_code: "or" }
              as: StateAuthority
              captures: { e1: $.data.error_id }
          assert:
            - "POST /testing-centers returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /testing-centers still returns total_count == 0"

      - name: enrollment_with_unknown_class_section_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Enrollment.fields.class_section_id
          - validations[priority=10]
          - errors[ERR_CLASS_SECTION_NOT_FOUND]
        distinguishing_aspect: |
          Body FK existence (priority 10) is checked for class_section_id even though the student
          resolves, and the reported code names the missing resource (ERR_CLASS_SECTION_NOT_FOUND),
          not the student. Flat-topology cross-reference integrity.
        test_recipe:
          setup:
            - "One PLACED student; no ClassSection exists."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Noor Idris", email: "noor.idris@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "00000000-0000-4000-8000-0000000000cc" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
          assert:
            - "POST /enrollments returns 404 with data.error_id == 'ERR_CLASS_SECTION_NOT_FOUND'"
            - "GET /students/${s} still reports data.intake_status == 'PLACED' and data.active_enrollment_count == 0"

      - name: room_creation_under_unknown_center_not_found
        claim_type: parent_relationships
        grounds:
          - entities.TestingRoom.parent
          - validations[priority=3]
          - errors[ERR_TESTING_CENTER_NOT_FOUND]
        distinguishing_aspect: |
          TestingRoom's parent center comes from the path, so an unknown centerId is a path-existence
          404 (ERR_TESTING_CENTER_NOT_FOUND) checked before the center-authorization rule at
          priority 40 can report ERR_CENTER_NOT_AUTHORIZED.
        test_recipe:
          setup:
            - "Empty database; no TestingCenter exists."
          setup_api_calls:
            - call: "GET /testing-centers"
              payload: { limit: 10, offset: 0 }
              as: StateAuthority
          trigger:
            - call: "POST /testing-centers/00000000-0000-4000-8000-0000000000aa/rooms"
              payload: { room_code: "R-1", seat_capacity: 10 }
              as: StateAuthority
              captures: { e1: $.data.error_id }
          assert:
            - "POST /testing-centers/00000000-0000-4000-8000-0000000000aa/rooms returns 404 with data.error_id == 'ERR_TESTING_CENTER_NOT_FOUND'"
            - "GET /testing-rooms returns total_count == 0"

      - name: attendance_entries_listed_by_enrollment_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /attendance-entries]
          - entities.AttendanceEntry.fields.enrollment_id
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The filtered-list form is the reverse-reachability read for AttendanceEntry.enrollment_id:
          filtering by enrollment_id plus limit 2 returns 2 of 3 rows with has_more true, and the
          status filter isolates the single VOIDED row.
        test_recipe:
          setup:
            - "One ACTIVE enrollment with three POSTED attendance entries of 2.00 hours each (6.00 posted hours)."
            - "The third entry is then voided under the current enrollment version."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Omar Saleh", email: "omar.saleh@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Ledger", instructor_user_id: "instructor-4", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 2.00 }
              as: Instructor
              captures: { ae1: $.data.id }
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-04", hours: 2.00 }
              as: Instructor
              captures: { ae2: $.data.id }
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-05", hours: 2.00 }
              as: Instructor
              captures: { ae3: $.data.id }
            - call: "GET /enrollments/${e}"
              payload: {}
              as: ProgramCoordinator
              captures: { e_v: $.data.version }
            - call: "POST /attendance-entries/${ae3}/void"
              payload: { void_reason: "duplicate entry", expected_enrollment_version: "${e_v}" }
              as: ProgramCoordinator
          trigger:
