                  - { household_ref: "T2", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "T3", category_codes: ["SNACKS"], recency_days: 5, frequency_12m: 10, monetary_12m_cents: 24000, exposed_brands: ["ACME"], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 22000, campaign_spend_cents: 24000 }] }
                  - { household_ref: "C1", category_codes: ["SNACKS"], recency_days: 6, frequency_12m: 10, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
                  - { household_ref: "C2", category_codes: ["SNACKS"], recency_days: 4, frequency_12m: 12, monetary_12m_cents: 23000, exposed_brands: [], brand_metrics: [{ brand_code: "ACME", baseline_spend_cents: 20000, campaign_spend_cents: 20000 }] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/incrementality-studies"
              payload: { brand_code: "ACME", category_code: "SNACKS", window_start: "2026-09-01", window_end: "2026-09-10" }
