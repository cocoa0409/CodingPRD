# =============================================================================
# Task 1160 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances; every recipe replays from empty-DB via §1.5 endpoints.
# Common fixture values used across instances:
#   sponsor tier SMALL_HUB (federal pct 0.90), NPE total 5,000,000
#   program FY2027 (submission_deadline = 2026-05-15T23:59:59Z)
#   project P1 cost 1,000,000; scores 20/10/10/10/10 -> sponsor 13.00, federal 14.00
#   grant: budget 1,000,000; obligated 900,000; entitlement 900,000; NPE after 4,100,000
#   contract: awarded 500,000; retainage 0.10; dbe goal 12.50
#   invoice INV-1 gross 100,000 -> retainage 10,000.00, net 90,000.00 -> federal 81,000.00
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: priority_score_sponsor_vs_federal
        grounds:
          - calculations.cip_priority_score
          - entities.CIPProject.fields.priority_score_sponsor
          - entities.CIPProject.fields.priority_score_federal
        distinguishing_aspect: |
          On the CIPProject entity domain, the sponsor variant (weights 0.30/0.20/0.20/0.15/0.15,
          multi-airport bonus, no penalty) and the federal variant (weights 0.40/0.25/0.15/0.10/0.10,
          noncompliance penalty, no bonus) produce different scores for identical inputs:
          sponsor 13.00 vs federal 14.00 for scores 20/10/10/10/10.
        test_recipe:
          setup:
            - "Sponsor SMALL_HUB with program FY2027 ACCEPTED; one project scores 20/10/10/10/10, no flags"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10, runway_safety_noncompliant: false, multi_airport_system: false }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
          assert:
            - "GET /aip/cip-projects/${p1}: priority_score_sponsor == 13.00"
            - "GET /aip/cip-projects/${p1}: priority_score_federal == 14.00"
            - "CIPProject.${p1}.status == SELECTED"

      - name: disposal_payback_straightline_vs_fmv
        grounds:
          - calculations.disposal_payback
          - entities.GrantAsset.fields.payback_due
          - entities.GrantAsset.fields.asset_kind
        distinguishing_aspect: |
          On the GrantAsset entity domain, two assets with identical share (100,000), useful life (10y)
          and elapsed time (6y) diverge purely by variant selection: EQUIPMENT uses straight-line book
          value -> payback 40,000.00; LAND uses fair-market value 300,000 x grant pct 0.90 -> 108,000.00.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; ACTIVE grant (federal pct 0.90) created via the standard chain"
            - "Asset EQ: EQUIPMENT, share 100,000, life 10, in_service 2020-05-01T00:00:00Z"
            - "Asset LND: LAND, share 100,000, life 10, in_service 2020-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FAAManager }
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app}/offer", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-applications/${app}/accept-offer", payload: {}, as: SponsorStaff, captures: { grant: $.data.created_grant_id } }
            - { call: "POST /aip/grant-assets", payload: { grant_id: "${grant}", asset_kind: "EQUIPMENT", description: "Sweeper", acquisition_federal_share: 100000, useful_life_years: 10, in_service_date: "2020-05-01T00:00:00Z" }, as: SponsorStaff, captures: { eq: $.data.id } }
            - { call: "POST /aip/grant-assets", payload: { grant_id: "${grant}", asset_kind: "LAND", description: "Parcel 7", acquisition_federal_share: 100000, useful_life_years: 10, in_service_date: "2020-05-01T00:00:00Z" }, as: SponsorStaff, captures: { lnd: $.data.id } }
            - { call: "POST /aip/grant-assets/${eq}/request-disposal", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-assets/${lnd}/request-disposal", payload: {}, as: SponsorStaff }
          trigger:
            - { call: "POST /aip/grant-assets/${eq}/approve-disposal", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-assets/${lnd}/approve-disposal", payload: { fair_market_value: 300000 }, as: FAAManager }
          assert:
            - "GrantAsset.${eq}.payback_due == 40000.00"
            - "GrantAsset.${lnd}.payback_due == 108000.00"
            - "GrantAsset.${eq}.status == DISPOSED and GrantAsset.${lnd}.status == DISPOSED"

      - name: drawdown_provisional_vs_closeout_final
        grounds:
          - calculations.drawdown_federal_share
          - calculations.closeout_final_settlement
          - entities.Grant.fields.federal_obligated
        distinguishing_aspect: |
          On the Grant ledger domain, the provisional variant (per-line pct on invoice net at drawdown
          time) and the final variant (chronological replay of APPROVED drawdowns at closeout) reconcile
          through de-obligation: obligated 900,000 -> 81,000.00 and the 819,000.00 delta returns to
          sponsor NPE (4,100,000 -> 4,919,000.00).
        test_recipe:
          setup:
            - "ACTIVE grant with one APPROVED drawdown of federal_amount 81,000.00 (standard chain)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FAAManager }
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app}/offer", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-applications/${app}/accept-offer", payload: {}, as: SponsorStaff, captures: { grant: $.data.created_grant_id } }
            - { call: "POST /aip/contractors", payload: { sponsor_id: "${sp}", contractor_name: "BuildCo", dbe_certified: false }, as: SponsorStaff, captures: { ctr: $.data.id } }
            - { call: "POST /aip/contracts", payload: { grant_id: "${grant}", cip_project_id: "${p1}", contractor_id: "${ctr}", awarded_value: 500000, dbe_goal_pct: 12.50, retainage_pct: 0.10 }, as: SponsorStaff, captures: { con: $.data.id } }
            - { call: "POST /aip/invoices", payload: { contract_id: "${con}", invoice_number: "INV-1", period: "2026-05", gross_amount: 100000 }, as: Contractor, as_user_id: "${ctr}", captures: { inv: $.data.id } }
            - { call: "POST /aip/invoices/${inv}/verify", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/reimbursement-requests", payload: { grant_id: "${grant}", invoice_ids: ["${inv}"] }, as: FinanceOfficer, as_user_id: "user-fin-1", captures: { dd: $.data.id } }
            - { call: "POST /aip/reimbursement-requests/${dd}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-2" }
            - { call: "POST /aip/reimbursement-requests/${dd}/submit", payload: {}, as: FinanceOfficer, as_user_id: "user-fin-1" }
            - { call: "POST /aip/reimbursement-requests/${dd}/approve", payload: {}, as: FAAManager }
          trigger:
            - { call: "POST /aip/grants/${grant}/request-closeout", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grants/${grant}/begin-audit", payload: {}, as: Auditor }
            - { call: "POST /aip/grants/${grant}/approve-closeout", payload: {}, as: FAAManager }
          assert:
            - "Grant.${grant}.status == CLOSED"
            - "Grant.${grant}.federal_obligated == 81000.00 (final variant de-obligates the provisional 819,000.00 remainder)"
            - "Grant.${grant}.federal_drawn == 81000.00 and Grant.${grant}.federal_available == 0.00"
            - "GET /aip/sponsors/${sp}: npe_entitlement_available == 4919000.00"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: funding_split_tiered_waterfall
        grounds:
          - calculations.funding_split
          - entities.Grant.fields.state_share_estimated
          - entities.Grant.fields.local_share_estimated
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — the tier-selected federal rate
          (0.90 SMALL_HUB vs 0.75 LARGE_HUB) changes the remainder that the 50% state waterfall step
          consumes. Identical 1,000,000 budget: SMALL_HUB -> state 50,000.00 / local 50,000.00;
          LARGE_HUB -> state 125,000.00 / local 125,000.00.
        test_recipe:
          setup:
            - "Two sponsors (SMALL_HUB and LARGE_HUB, NPE 5,000,000 each), each with an ACCEPTED program FY2027, one SELECTED 1,000,000 project, an application with all 6 assurances certified, offered and accepted"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor S", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp_s: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp_s}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog_s: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog_s}", title: "P south", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p_s: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog_s}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog_s}/accept", payload: {}, as: FAAManager, captures: { prog_s_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog_s}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_s_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp_s}", program_id: "${prog_s}", project_ids: ["${p_s}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app_s: $.data.id } }
            - { call: "GET /aip/grant-applications/${app_s}/assurances", payload: {}, as: SponsorStaff, captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id", s3: "$.data[3].id", s4: "$.data[4].id", s5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${s0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${s1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${s2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${s3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${s4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${s5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app_s}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app_s}/offer", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-applications/${app_s}/accept-offer", payload: {}, as: SponsorStaff, captures: { grant_s: $.data.created_grant_id } }
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor L", loc_id: "ZQW", airport_size_tier: "LARGE_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp_l: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp_l}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog_l: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog_l}", title: "P north", project_type: "CAPACITY", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p_l: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog_l}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog_l}/accept", payload: {}, as: FAAManager, captures: { prog_l_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog_l}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_l_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp_l}", program_id: "${prog_l}", project_ids: ["${p_l}"] }, as: SponsorStaff, as_user_id: "user-sponsor-9", captures: { app_l: $.data.id } }
            - { call: "GET /aip/grant-applications/${app_l}/assurances", payload: {}, as: SponsorStaff, captures: { l0: "$.data[0].id", l1: "$.data[1].id", l2: "$.data[2].id", l3: "$.data[3].id", l4: "$.data[4].id", l5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${l0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/sponsor-assurances/${l1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/sponsor-assurances/${l2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/sponsor-assurances/${l3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/sponsor-assurances/${l4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/sponsor-assurances/${l5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-9" }
            - { call: "POST /aip/grant-applications/${app_l}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app_l}/offer", payload: {}, as: FAAManager }
          trigger:
            - { call: "POST /aip/grant-applications/${app_l}/accept-offer", payload: {}, as: SponsorStaff, captures: { grant_l: $.data.created_grant_id } }
          assert:
            - "GET /aip/grants/${grant_s}: federal_obligated == 900000.00, state_share_estimated == 50000.00, local_share_estimated == 50000.00"
            - "GET /aip/grants/${grant_l}: federal_obligated == 750000.00, state_share_estimated == 125000.00, local_share_estimated == 125000.00"

      - name: drawdown_per_line_rounding
        grounds:
          - calculations.drawdown_federal_share
          - entities.ReimbursementRequest.fields.federal_amount
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each line at 2dp half-up, then sum.
          Three invoices of net 33,333.33 at pct 0.90 give 3 x 30,000.00 = 90,000.00 per-line,
          while the rejected sum-first order gives 89,999.99; the response must show 90,000.00.
        test_recipe:
          setup:
            - "ACTIVE grant (SMALL_HUB, pct 0.90); contract with retainage_pct 0.00 and awarded_value 200000"
            - "Three VERIFIED invoices with gross 33333.33 each (net == gross under zero retainage)"
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
