        grounds:
          - calculations.sla_clock
          - entities.SupportIncident.fields.sla_response_breached
          - endpoints.POST /support-incidents/{id}/respond
        distinguishing_aspect: |
          Metric = SupportIncident.response_minutes against SLA_RESPONSE_MINUTES.SEV1 = 60, reached
          through POST /support-incidents/{id}/respond (a different endpoint and a different metric
          from the burn_ratio boundary). The breach comparison is STRICT `>`, so exactly 60 minutes
          is NOT a breach and sla_credit_amount stays 0.00.
        test_recipe:
          setup:
