          Depth-3 chain from a different trigger than the withdrawal cascade: releasing an ALLOCATED
          request moves it to RELEASED (link 1), which decrements RoadshowEvent.allocated_count and
          frees a slot (link 2), which makes the promotion selector move the highest-ranked eligible
          WAITLISTED request to ALLOCATED with promoted_from_waitlist true (link 3).
