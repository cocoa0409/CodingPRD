              captures: { ca_l1_v1: $.data.version }
            - call: "POST /roofing/orders/${ord_l1a}/confirm"
              payload: { expected_contractor_account_version: "${ca_l1_v1}" }
              as: Contractor
              as_user_id: "${ca_l1}"
