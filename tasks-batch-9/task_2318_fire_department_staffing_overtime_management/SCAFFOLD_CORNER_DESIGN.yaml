          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 80", battalion_code: "D8", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
