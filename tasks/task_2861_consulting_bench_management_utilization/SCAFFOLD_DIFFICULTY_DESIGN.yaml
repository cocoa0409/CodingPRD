            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 40.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v2}" }
              as: ResourceManager
              captures: { a2_id: $.data.id }
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
