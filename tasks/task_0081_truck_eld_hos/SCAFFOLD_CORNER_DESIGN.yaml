              as: CarrierAdmin
              captures: { d1_id: $.data.id, d1_v0: $.data.version }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Z32b", full_name: "Other D2", home_terminal_tz_offset_minutes: 0 }
