            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-01T09:00:00Z", window_end_utc: "2026-08-01T10:00:00Z" }
