# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Industrial Equipment Installation & Millwright Services
# Nine Difficulty Rules x 2 instances each.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: invoice_tm_vs_lump_sum_divergence
        grounds:
          - calculations.invoice_amount
          - entities.Project.fields.billing_mode
        distinguishing_aspect: |
          This dual variant lives in the BILLING domain (Invoice.amount_cents): for the same
          billing period, the TM variant bills approved actuals (264800 gross) while the
          LUMP_SUM variant bills cumulative progress percent (500000 gross) — different
          formulas, different results. The sibling instance is in the PAYROLL domain.
        test_recipe:
          setup:
            - "TM project (contract NTE 5000000, retainage 0.10, equipment rate 45000/hr) in INSTALLING with one APPROVED 8h MW_JOURNEYMAN DAY entry on 2026-08-09 (total 84800) and one EXECUTED 4-hour lift on 2026-08-10 (charge 180000)"
            - "LUMP_SUM project (contract 5000000, retainage 0.10) in MOBILIZED with no field activity"
            - "Logical clock at 2026-08-10T11:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "TM Press Install", customer_name: "Acme Plastics", site_address: "1 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_tm: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_tm}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_tm: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_tm}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_tm}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_tm}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_tm: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_tm}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_tm}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_tm}/advance", payload: {}, as: ProjectManager, captures: { p_tm_v: $.data.version } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_tm}", worker_ref: "U-1001", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_tm: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_tm}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_tm}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_tm}", expected_project_version: "${p_tm_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_tm: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_tm}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_tm}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_tm}", crane_ref: "CR-7", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_tm: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/lift-permits/${lp_tm}/execute", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/projects", payload: { name: "LS Conveyor Install", customer_name: "Beta Foods", site_address: "9 Mill Ave", billing_mode: LUMP_SUM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_ls: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_ls}", plan_document_ref: "DOC-SP-2", loto_procedure_ref: "DOC-LOTO-2" }, as: SafetyOfficer, captures: { sp_ls: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_ls}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_ls}/advance", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_tm}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-31" }, as: ProjectManager, captures: { inv_tm_gross: $.data.gross_cents, inv_tm_ret: $.data.retainage_cents, inv_tm_amount: $.data.amount_cents } }
            - { call: "POST /v1/invoices", payload: { project_id: "${p_ls}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-31", progress_pct: 10 }, as: ProjectManager, captures: { inv_ls_gross: $.data.gross_cents, inv_ls_amount: $.data.amount_cents } }
          assert:
            - "TM invoice: gross_cents == 264800 (84800 labor + 180000 equipment), retainage_cents == 26480, amount_cents == 238320"
            - "LUMP_SUM invoice: gross_cents == 500000 (10% of 5000000), retainage_cents == 50000, amount_cents == 450000"
            - "${inv_tm_gross} != ${inv_ls_gross} — same period, different billing variants diverge"
            - "LaborEntry.${le_tm}.status == INVOICED after TM invoice creation"

      - name: labor_daily_vs_weekly_ot_divergence
        grounds:
          - calculations.labor_cost
          - entities.Project.fields.ot_basis
        distinguishing_aspect: |
          This dual variant lives in the PAYROLL domain (LaborEntry.total_cost_cents): identical
          10-hour day costs 114500 under DAILY_OT (2h at 1.5x) but 106000 under WEEKLY_OT
          (no prior weekly hours, all straight). Sibling instance is in the billing domain.
        test_recipe:
          setup:
            - "Project A with ot_basis DAILY_OT; Project B with ot_basis WEEKLY_OT; both freshly created (labor entry allowed while hold_status == CLEAR)"
            - "No prior labor entries for worker U-2001 in either project"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Daily OT Job", customer_name: "Acme", site_address: "1 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_d: $.data.id } }
            - { call: "POST /v1/projects", payload: { name: "Weekly OT Job", customer_name: "Acme", site_address: "2 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: WEEKLY_OT }, as: ProjectManager, captures: { p_w: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_d}", worker_ref: "U-2001", classification: MW_JOURNEYMAN, work_date: "2026-08-10", hours_worked: 10, shift: DAY }, as: SiteSupervisor, captures: { le_d: $.data.id, d_reg: $.data.regular_hours, d_ot: $.data.overtime_hours, d_total: $.data.total_cost_cents } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_w}", worker_ref: "U-2001", classification: MW_JOURNEYMAN, work_date: "2026-08-10", hours_worked: 10, shift: DAY }, as: SiteSupervisor, captures: { le_w: $.data.id, w_reg: $.data.regular_hours, w_ot: $.data.overtime_hours, w_total: $.data.total_cost_cents } }
          assert:
            - "DAILY_OT entry: regular_hours == 8, overtime_hours == 2, total_cost_cents == 114500 (68000 straight + 25500 OT + 21000 fringe)"
            - "WEEKLY_OT entry: regular_hours == 10, overtime_hours == 0, total_cost_cents == 106000 (85000 straight + 0 OT + 21000 fringe)"
            - "${d_total} != ${w_total} — identical hours, different OT regimes diverge"

  - rule_id: combinatorial_formula
    instances:
      - name: labor_cost_multi_input_tiered
        grounds:
          - calculations.labor_cost
        distinguishing_aspect: |
          Mode (a) combinatorial: four inputs (classification tier MW_FOREMAN=9800, NIGHT shift
          multiplier 1.10, DAILY_OT branch at 8h, fringe per hour) interact non-linearly;
          components are individually rounded then summed: 86240 + 16170 + 18900 = 121310.
        test_recipe:
          setup:
            - "DAILY_OT project, no prior entries for worker U-3001"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Night Shift Job", customer_name: "Acme", site_address: "3 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_n: $.data.id } }
          trigger:
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_n}", worker_ref: "U-3001", classification: MW_FOREMAN, work_date: "2026-08-10", hours_worked: 9, shift: NIGHT }, as: SiteSupervisor, captures: { le_n: $.data.id, n_reg: $.data.regular_hours, n_ot: $.data.overtime_hours, n_rate: $.data.base_rate_cents, n_total: $.data.total_cost_cents } }
          assert:
            - "regular_hours == 8, overtime_hours == 1, base_rate_cents == 9800"
            - "straight component round_half_up(8 * 9800 * 1.10) == 86240; OT component round_half_up(1 * 9800 * 1.5 * 1.10) == 16170; fringe 9 * 2100 == 18900"
            - "total_cost_cents == 121310"

      - name: invoice_retainage_rounding_on_summed_gross
        grounds:
          - calculations.invoice_amount
        distinguishing_aspect: |
          Mode (b) nested rounding: retainage is rounded from the SUMMED gross
          (round_half_up(276675 * 0.10) == 27668), NOT summed per-line
          (3 x round_half_up(92225 * 0.10) == 27669) — the scaffold pins sum-then-round,
          and the two orders differ by one cent. Distinct mode from the sibling instance.
        test_recipe:
          setup:
            - "TM project (retainage 0.10, NTE 5000000) with three APPROVED MW_JOURNEYMAN DAY entries of 8.5h each on 2026-08-09 (each total_cost_cents == 92225)"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Rounding Job", customer_name: "Acme", site_address: "4 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_r: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_r}", worker_ref: "U-4001", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 8.5, shift: DAY }, as: SiteSupervisor, captures: { le_r1: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_r1}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_r1}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_r}", worker_ref: "U-4002", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 8.5, shift: DAY }, as: SiteSupervisor, captures: { le_r2: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_r2}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_r2}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_r}", worker_ref: "U-4003", classification: MW_JOURNEYMAN, work_date: "2026-08-09", hours_worked: 8.5, shift: DAY }, as: SiteSupervisor, captures: { le_r3: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_r3}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_r3}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
          trigger:
            - { call: "POST /v1/invoices", payload: { project_id: "${p_r}", kind: PROGRESS, period_start: "2026-08-01", period_end: "2026-08-31" }, as: ProjectManager, captures: { inv_r_gross: $.data.gross_cents, inv_r_ret: $.data.retainage_cents, inv_r_amount: $.data.amount_cents } }
          assert:
            - "gross_cents == 276675 (3 x 92225, sums of already-rounded components)"
            - "retainage_cents == 27668 — round_half_up(276675 * 0.10) == round_half_up(27667.5); the per-line order would yield 27669"
            - "amount_cents == 249007"

  - rule_id: non_linear_state_machine
    instances:
      - name: rigging_plan_revision_cycle
        grounds:
          - state_machines.RiggingPlan.SUBMITTED_to_REJECTED
          - state_machines.RiggingPlan.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic revision loop on RiggingPlan: one row traverses DRAFT -> SUBMITTED -> REJECTED
          -> DRAFT -> SUBMITTED -> APPROVED. Sibling instance uses a parallel-dimensions shape
          on a different entity (Project).
        test_recipe:
          setup:
            - "Project in INSTALLING (safety plan active, survey accepted); one rigging plan submitted with lift_weight_tons 40 / capacity 50"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Cycle Job", customer_name: "Acme", site_address: "5 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_c: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_c}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_c: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_c}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_c}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_c}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_c: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_c}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_c}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_c}/advance", payload: {}, as: ProjectManager, captures: { p_c_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_c}", expected_project_version: "${p_c_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_c: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_c}/submit", payload: {}, as: SiteSupervisor }
          trigger:
            - { call: "POST /v1/rigging-plans/${rp_c}/review", payload: { outcome: REJECTED, reviewer_note: "recheck sling angles" }, as: ProjectManager, captures: { rp_c_rej: $.data.status } }
            - { call: "POST /v1/rigging-plans/${rp_c}/revise", payload: { lift_weight_tons: 45 }, as: SiteSupervisor, captures: { rp_c_draft: $.data.status } }
            - { call: "POST /v1/rigging-plans/${rp_c}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_c}/review", payload: { outcome: APPROVED }, as: ProjectManager, captures: { rp_c_appr: $.data.status } }
          assert:
            - "Status sequence on the same row: ${rp_c_rej} == REJECTED, ${rp_c_draft} == DRAFT, ${rp_c_appr} == APPROVED"
            - "RiggingPlan.${rp_c}.revision == 1 (same row cycled, not a new revision)"
            - "Project.${p_c}.approved_rigging_plan_id == ${rp_c} and approved_rigging_plan_revision == 1"
            - "RiggingPlan.${rp_c}.lift_weight_tons == 45 after revise"

      - name: project_parallel_hold_dimension
        grounds:
          - state_machines.Project.hold_status.CLEAR_to_SAFETY_HOLD
          - entities.Project.fields.work_status
        distinguishing_aspect: |
          Parallel state dimensions on Project: hold_status toggles CLEAR -> SAFETY_HOLD ->
          CLEAR via safety-plan suspend/resume while work_status stays INSTALLING throughout;
          the hold dimension gates operations independently of the linear work chain.
          Sibling instance is a revision cycle on RiggingPlan — different entity, different shape.
        test_recipe:
          setup:
            - "Project in INSTALLING with ACTIVE safety plan; one DRAFT labor entry present"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Hold Job", customer_name: "Acme", site_address: "6 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_h: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_h}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_h: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_h}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_h}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_h}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_h: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_h}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_h}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_h}/advance", payload: {}, as: ProjectManager, captures: { p_h_ins: $.data.work_status } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_h}", worker_ref: "U-5001", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_h: $.data.id } }
          trigger:
            - { call: "POST /v1/safety-plans/${sp_h}/suspend", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/labor-entries/${le_h}/submit", payload: {}, as: SiteSupervisor, captures: { hold_err: $.data.error_id } }
            - { call: "POST /v1/safety-plans/${sp_h}/resume", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/labor-entries/${le_h}/submit", payload: {}, as: SiteSupervisor, captures: { le_h_status: $.data.status } }
          assert:
            - "Project.${p_h}.work_status == INSTALLING before, during, and after the hold cycle (${p_h_ins} == INSTALLING and final read still INSTALLING)"
            - "During hold, labor submit is rejected with error_id ERR_SAFETY_HOLD"
            - "After resume, hold_status == CLEAR and the same entry submits successfully (${le_h_status} == SUBMITTED)"

  - rule_id: transitive_cascade
    instances:
      - name: safety_suspend_cascade
        grounds:
          - state_machines.SafetyPlan.ACTIVE_to_SUSPENDED
          - state_machines.Project.hold_status.CLEAR_to_SAFETY_HOLD
          - state_machines.LaborEntry.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /v1/safety-plans/{id}/suspend: plan SUSPENDED ->
          Project.hold_status SAFETY_HOLD -> SUBMITTED LaborEntry auto-REJECTED ->
          Project rollups re-evaluated and version bumped. Sibling cascade has a different
          trigger (rigging-plan creation).
        test_recipe:
          setup:
            - "Project in INSTALLING with ACTIVE safety plan; le1 (8h MW_JOURNEYMAN DAY, total 84800) APPROVED; le2 (4h OPERATOR DAY, total 37200) SUBMITTED"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Cascade Job", customer_name: "Acme", site_address: "7 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_s: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_s}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_s: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_s}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_s}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_s}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_s: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_s}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_s}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_s}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_s}", worker_ref: "U-6001", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_s1: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_s1}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "POST /v1/labor-entries/${le_s1}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_s}", worker_ref: "U-6002", classification: OPERATOR, work_date: "2026-08-08", hours_worked: 4, shift: DAY }, as: SiteSupervisor, captures: { le_s2: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_s2}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /v1/safety-plans/${sp_s}/suspend", payload: {}, as: SafetyOfficer }
          assert:
            - "SafetyPlan.${sp_s}.status == SUSPENDED"
            - "Project.${p_s}.hold_status == SAFETY_HOLD (cascade hop 1)"
            - "LaborEntry.${le_s2}.status == REJECTED with rejection_reason == 'SAFETY_HOLD' (cascade hop 2)"
            - "LaborEntry.${le_s1}.status == APPROVED — cascade touches only SUBMITTED entries"
            - "Project.${p_s}.approved_labor_cents == 84800 — approved rollup unchanged (cascade hop 3 re-evaluates without drift)"

      - name: rigging_supersede_cascade
        grounds:
          - state_machines.RiggingPlan.APPROVED_to_SUPERSEDED
          - state_machines.LiftPermit.ISSUED_to_CANCELLED
          - entities.Project.fields.approved_rigging_plan_id
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST /v1/rigging-plans): new plan created ->
          prior APPROVED plan SUPERSEDED -> Project approval pin cleared ->
          ISSUED LiftPermit CANCELLED. Sibling cascade originates from safety-plan suspension.
        test_recipe:
          setup:
            - "Project in INSTALLING with rigging plan revision 1 APPROVED (pinned on project) and one ISSUED lift permit for crane CR-7 on 2026-08-10 10:00-14:00"
          setup_api_calls:
