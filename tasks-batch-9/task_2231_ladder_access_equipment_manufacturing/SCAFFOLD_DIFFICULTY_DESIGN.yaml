# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2231 — Ladder & Access Equipment Manufacturing
#
# Every instance grounds ONLY in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# The logical clock starts at 2026-08-01T00:00:00Z; every chain sets it
# explicitly so the derived *_at / *_until literals below are reproducible.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: recall_exposure_shipped_versus_registered_basis
    grounds:
    - calculations.recall_exposure_units
    - entities.RecallEvent.fields.exposure_units_shipped_basis
    - entities.RecallEvent.fields.exposure_units_registered_basis
    - entities.RecallEvent.fields.notification_coverage_pct
    - state_machines.RecallEvent.DRAFT_to_ANNOUNCED
    - endpoints[POST /ladder-ops/recall-events/{id}/announce]
    distinguishing_aspect: 'This dual variant lives in the recall/distribution domain: SHIPPED_BASIS sums ProductionLot.produced_units while REGISTERED_BASIS counts ConsumerRegistration rows over the identical
      lot set, so one announce call freezes 400 against 2 on the same data.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA is DESIGN_FROZEN on revision A and RETAIL_RELEASED, with listing NRTL-1 LISTED.
      - LOT-0001 is RELEASED with produced_units 400 and conformance_index 2.50.
      - Exactly two consumers registered units from LOT-0001 (both registration_status REGISTERED).
      - A RecallEvent for the product exists in DRAFT scoped to revision A with remedy_type REPAIR_KIT.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      - call: POST /ladder-ops/test-benches
        payload:
          bench_code: BENCH-1
          max_load_capacity_lb: 5000
          cooldown_minutes: 60
        as: TestLabTechnician
        captures:
          b1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: DESIGN_QUALIFICATION
        as: TestLabTechnician
        captures:
          c1: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c1}
          start_at: '2026-08-03T08:00:00Z'
          end_at: '2026-08-03T12:00:00Z'
        as: TestLabTechnician
        captures:
          res1: $.data.id
      - call: POST /ladder-ops/test-campaigns/${c1}/start
        payload:
          bench_reservation_id: ${res1}
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: STATIC_VERTICAL
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: RAIL_BENDING
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: SLIP_RESISTANCE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: ELECTRICAL_LEAKAGE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/load-tests
        payload:
          test_code: RIVET_SHEAR
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c1}/conclude
        payload: {}
        as: TestLabTechnician
      - call: POST /ladder-ops/products/${p1}/freeze-design
        payload:
          frozen_revision_id: ${r1}
        as: DesignApprover
        as_user_id: appr-1
      - call: POST /ladder-ops/listing-bodies
        payload:
          body_code: NRTL-1
          accredited_standards:
          - ANSI_ASC_A14_2
          audit_interval_days: 180
        as: ComplianceOfficer
        captures:
          lb1: $.data.id
      - call: POST /ladder-ops/listing-records
        payload:
          product_id: ${p1}
          listing_body_id: ${lb1}
          standard_code: ANSI_ASC_A14_2
        as: ComplianceOfficer
        captures:
          lr1: $.data.id
      - call: POST /ladder-ops/test-campaigns
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          purpose: CERTIFICATION_LISTING
        as: TestLabTechnician
        captures:
          c2: $.data.id
      - call: POST /ladder-ops/bench-reservations
        payload:
          test_bench_id: ${b1}
          test_campaign_id: ${c2}
          start_at: '2026-08-04T08:00:00Z'
          end_at: '2026-08-04T12:00:00Z'
        as: TestLabTechnician
        captures:
          res2: $.data.id
      - call: POST /ladder-ops/test-campaigns/${c2}/start
        payload:
          bench_reservation_id: ${res2}
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/load-tests
        payload:
          test_code: STATIC_VERTICAL
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/load-tests
        payload:
          test_code: RAIL_BENDING
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/load-tests
        payload:
          test_code: SLIP_RESISTANCE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/load-tests
        payload:
          test_code: ELECTRICAL_LEAKAGE
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/load-tests
        payload:
          test_code: RIVET_SHEAR
          applied_load_lb: 1400.0
          measured_deflection_in: 1.2
          permanent_set_in: 0.01
        as: TestLabTechnician
      - call: POST /ladder-ops/test-campaigns/${c2}/conclude
        payload: {}
        as: TestLabTechnician
      - call: POST /ladder-ops/listing-records/${lr1}/list
        payload: {}
        as: CertificationBody
        as_user_id: ${lb1}
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: DUTY_RATING_LABEL
          document_version: '1.0'
          text_digest: sha256:duty_rating_
          placement_zone: SIDE_RAIL_UPPER
          pictogram_count: 0
        as: ComplianceOfficer
        captures:
          d1: $.data.id
      - call: POST /ladder-ops/product-documents/${d1}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: WARNING_LABEL
          document_version: '1.0'
          text_digest: sha256:warning_labe
          placement_zone: SIDE_RAIL_LOWER
          pictogram_count: 3
        as: ComplianceOfficer
        captures:
          d2: $.data.id
      - call: POST /ladder-ops/product-documents/${d2}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: INSTRUCTION_LABEL
          document_version: '1.0'
          text_digest: sha256:instruction_
          placement_zone: BACK_RAIL
          pictogram_count: 1
        as: ComplianceOfficer
        captures:
          d3: $.data.id
      - call: POST /ladder-ops/product-documents/${d3}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: RETAIL_CARTON
          document_version: '1.0'
          text_digest: sha256:retail_carto
          pictogram_count: 1
          includes_assembly_instructions: false
        as: ComplianceOfficer
        captures:
          d4: $.data.id
      - call: POST /ladder-ops/product-documents/${d4}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: ASSEMBLY_INSTRUCTION_SHEET
          document_version: '1.0'
          text_digest: sha256:assembly_ins
          pictogram_count: 0
          includes_assembly_instructions: true
        as: ComplianceOfficer
        captures:
          d5: $.data.id
      - call: POST /ladder-ops/product-documents/${d5}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/product-documents
        payload:
          product_id: ${p1}
          doc_kind: CONSUMER_SAFETY_SHEET
          document_version: '1.0'
          text_digest: sha256:consumer_saf
          pictogram_count: 2
        as: ComplianceOfficer
        captures:
          d6: $.data.id
      - call: POST /ladder-ops/product-documents/${d6}/approve
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/products/${p1}/release-to-retail
        payload: {}
        as: ComplianceOfficer
      - call: POST /ladder-ops/production-lots
        payload:
          product_id: ${p1}
          design_revision_id: ${r1}
          lot_code: LOT-0001
          planned_units: 500
          pultrusion_batch_id: PB-77
        as: ProductionSupervisor
        captures:
          l1: $.data.id
      - call: POST /ladder-ops/production-lots/${l1}/start-production
        payload:
          produced_units: 400
        as: ProductionSupervisor
      - call: POST /ladder-ops/production-lots/${l1}/joint-samples
        payload:
          sample_seq: 1
          pull_force_lbf: 470.0
        as: TestLabTechnician
      - call: POST /ladder-ops/production-lots/${l1}/joint-samples
        payload:
          sample_seq: 2
          pull_force_lbf: 462.0
        as: TestLabTechnician
      - call: POST /ladder-ops/production-lots/${l1}/joint-samples
        payload:
          sample_seq: 3
          pull_force_lbf: 458.0
        as: TestLabTechnician
      - call: POST /ladder-ops/production-lots/${l1}/joint-samples
        payload:
          sample_seq: 4
          pull_force_lbf: 456.0
        as: TestLabTechnician
      - call: POST /ladder-ops/production-lots/${l1}/release
        payload: {}
        as: ProductionSupervisor
      - call: POST /ladder-ops/consumer-registrations
        payload:
          production_lot_id: ${l1}
          consumer_email: buyer1@example.com
          purchase_channel: BIG_BOX_RETAIL
          purchase_date: '2026-07-15T00:00:00Z'
          serial_suffix: '0001'
        as: Consumer
        as_user_id: buyer1@example.com
        captures:
          cr1: $.data.id
      - call: POST /ladder-ops/consumer-registrations
        payload:
          production_lot_id: ${l1}
          consumer_email: buyer2@example.com
          purchase_channel: ONLINE
          purchase_date: '2026-07-20T00:00:00Z'
          serial_suffix: '0002'
        as: Consumer
        as_user_id: buyer2@example.com
        captures:
          cr2: $.data.id
      - call: POST /ladder-ops/recall-events
        payload:
          product_id: ${p1}
          remedy_type: REPAIR_KIT
          affected_revision_ids:
          - ${r1}
          hazard_description: Rivet shear margin below design intent on riveted rail joints.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          rc1: $.data.id
      trigger:
      - call: POST /ladder-ops/recall-events/${rc1}/announce
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      assert:
      - RecallEvent.${rc1}.status == ANNOUNCED
      - RecallEvent.${rc1}.exposure_units_shipped_basis == 400
      - RecallEvent.${rc1}.exposure_units_registered_basis == 2
      - RecallEvent.${rc1}.exposure_units_shipped_basis != RecallEvent.${rc1}.exposure_units_registered_basis
      - RecallEvent.${rc1}.notification_coverage_pct == 0.50
      - RecallEvent.${rc1}.units_remedied == 0
      - RecallEvent.${rc1}.units_outstanding == 2
      - ConsumerRegistration.${cr1}.recall_event_id == ${rc1}
      - ConsumerRegistration.${cr2}.recall_event_id == ${rc1}
      - Product.${p1}.market_status == RECALLED
      - Product.${p1}.design_status == DESIGN_OBSOLETE
      - ListingRecord.${lr1}.status == WITHDRAWN
      - Product.${p1}.dhf_retention_until == 2033-08-01T00:00:00Z
      - Product.${p1}.retention_anchor_source == LOT_RELEASE
  - name: risk_score_gross_versus_mitigated_after_capa_verified
    grounds:
    - calculations.design_risk_score
    - entities.Product.fields.risk_score_gross
    - entities.Product.fields.risk_score_mitigated
    - state_machines.CorrectiveAction.OPEN_to_VERIFIED
    - state_machines.FieldIncident.CAPA_OPENED_to_CLOSED
    - endpoints[POST /ladder-ops/corrective-actions/{id}/verify]
    distinguishing_aspect: 'This dual variant lives in the product-engineering domain (not distribution): GROSS_BASIS sums full incident_points while MITIGATED_BASIS multiplies the CAPA-covered incident
      by CAPA_CREDIT_FACTOR 0.25, so the same two incidents read 42.00 against 15.00.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA exists with revision A APPROVED; the design is never frozen.
      - FieldIncident 1 (RAIL_FRACTURE / HOSPITALIZATION) is CAPA_OPENED with incident_points 36.00.
      - FieldIncident 2 (SLIP_FALL / MINOR) is UNDER_INVESTIGATION with incident_points 6.00.
      - CorrectiveAction 1 on incident 1 is OPEN, authored by eng-1, pinned to APPROVED revision A.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: RAIL_FRACTURE
          injury_severity: HOSPITALIZATION
          occurred_at: '2026-07-20T00:00:00Z'
          narrative: Left rail fractured mid-span during use; user hospitalised.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi1: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi1}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: SLIP_FALL
          injury_severity: MINOR
          occurred_at: '2026-07-22T00:00:00Z'
          narrative: Foot pad slipped on smooth concrete; minor bruising.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi2: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi2}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      - call: POST /ladder-ops/field-incidents/${fi1}/resolve-investigation
        payload:
          finding: ROOT_CAUSE_IDENTIFIED
          root_cause_code: RAIL_SECTION_MODULUS
        as: SafetyDirector
        as_user_id: safety-1
      - call: GET /ladder-ops/field-incidents/${fi1}
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi1v: $.data.version
      - call: POST /ladder-ops/corrective-actions
        payload:
          field_incident_id: ${fi1}
          action_summary: Increase rail section modulus to 0.310 in3.
          design_revision_id: ${r1}
          expected_field_incident_version: ${fi1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          ca1: $.data.id
      trigger:
      - call: POST /ladder-ops/corrective-actions/${ca1}/verify
        payload: {}
        as: DesignApprover
        as_user_id: appr-1
      assert:
      - FieldIncident.${fi1}.incident_points == 36.00
      - FieldIncident.${fi2}.incident_points == 6.00
      - CorrectiveAction.${ca1}.status == VERIFIED
      - FieldIncident.${fi1}.status == CLOSED
      - Product.${p1}.risk_score_gross == 42.00
      - Product.${p1}.risk_score_mitigated == 15.00
      - Product.${p1}.risk_score_gross - Product.${p1}.risk_score_mitigated == 27.00
      - Product.${p1}.dhf_retention_until == null
      - Product.${p1}.retention_anchor_source == null
- rule_id: combinatorial_formula
  instances:
  - name: duty_rating_safety_factor_capped_and_uncapped
    grounds:
    - calculations.required_test_load_derivation
    - entities.Product.fields.safety_factor
    - entities.Product.fields.required_test_load_lb
    - entities.Product.fields.max_allowed_deflection_in
    - endpoints[POST /ladder-ops/products]
    distinguishing_aspect: 'Mode (a): required_test_load_lb combines four inputs (duty_rating table lookup, a max/ceil length-step count, a product_type bonus and a material bonus) inside a min() cap, so
      28 ft MOBILE_SCAFFOLD_TOWER clamps 4.90 to 4.60 while 24 ft EXTENSION_LADDER keeps its uncapped 4.50.'
    test_recipe:
      setup:
      - The database is empty apart from the logical clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-TOWER-28-IAA
          product_type: MOBILE_SCAFFOLD_TOWER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IAA
          working_length_ft: 28.0
          retail_sku: SKU-TW28IAA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          pcap: $.data.id
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          pfree: $.data.id
      assert:
      - Product.${pcap}.rated_load_lb == 375
      - Product.${pcap}.safety_factor == 4.60
      - Product.${pcap}.required_test_load_lb == 1725.00
      - Product.${pcap}.required_pull_force_lbf == 562.50
      - Product.${pcap}.max_allowed_deflection_in == 1.867
      - Product.${pfree}.rated_load_lb == 300
      - Product.${pfree}.safety_factor == 4.50
      - Product.${pfree}.required_test_load_lb == 1350.00
      - Product.${pfree}.required_pull_force_lbf == 450.00
      - Product.${pfree}.max_allowed_deflection_in == 1.600
      - Product.${pcap}.safety_factor != 4.90 (the uncapped raw sum is discarded by the SAFETY_FACTOR_CAP min())
  - name: joint_margin_rounded_per_sample_then_averaged
    grounds:
    - calculations.lot_conformance_index
    - entities.JointIntegritySample.fields.margin_pct
    - entities.ProductionLot.fields.conformance_index
    - endpoints[POST /ladder-ops/production-lots/{id}/joint-samples]
    distinguishing_aspect: 'Mode (b): the rounding ORDER is pinned — each sample margin is rounded to a whole percent first (4, 3, 2, 1) and only then averaged, giving conformance_index 2.50; averaging
      the raw margins and rounding once would give 2.56.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA is DESIGN_FROZEN on revision A with required_pull_force_lbf 450.00.
      - LOT-0001 is IN_PROCESS with produced_units 400 and required_joint_sample_count 4.
      - No joint sample has been recorded yet.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
