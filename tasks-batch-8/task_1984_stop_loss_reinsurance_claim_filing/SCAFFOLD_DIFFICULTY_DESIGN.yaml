  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_filing_submit
        grounds:
          - validations[priority=4]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (state, business_temporal): a filing in DRAFT that missed its
          deadline is submitted twice — after the first submit the filing is
          SUBMITTED, and a re-submit attempt is both an invalid state AND past
          deadline; the state error (priority 4) MUST win over the deadline
          error (priority 11).
        test_recipe:
          setup:
            - "Plan, contract (filing_deadline_days=30, policy year 2026), member, paid claim, notice filed, filing F submitted at 2027-01-15 (within deadline)"
            - "Logical clock then advanced to 2027-03-01 (past deadline 2027-01-31)"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Iota", sponsor_tax_id: "77-7777777" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
