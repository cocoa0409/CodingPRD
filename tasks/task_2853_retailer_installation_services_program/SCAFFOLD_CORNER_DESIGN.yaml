        distinguishing_aspect: "Six probes, one per role's exclusive surface, all return ERR_UNAUTHORIZED_ROLE (403) — and because the role gate sits at priority 2, they do so even when the target id is fabricated and the body is empty, proving the gate precedes both path resolution (priority 6) and required-field checks (priority 3)."
        test_recipe:
          setup:
            - "No rows are needed: every probe below is expected to fail at priority 2, before any id is resolved. The final call proves the rightful role still succeeds."
          setup_api_calls: []
