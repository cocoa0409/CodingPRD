      - name: one_review_sweep_lapses_exactly_the_rounds_whose_deadline_has_passed
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/exhibit-projects/{id}/review-sweep
          - state_machines.ReviewRound.OPEN_to_REVISION_REQUESTED
          - entities.ReviewRound.fields.swept_by_deadline
        distinguishing_aspect: |
          The sweep is the only endpoint in the API that mutates an unbounded set of
          rows in one call, and its selection predicate is a comparison against the
          logical clock rather than anything in the request. Two rounds are open at
          once - possible only because they hang off packages of DIFFERENT stages, so
          neither supersedes the other - and exactly one is due. A sweep that lapses
          both breaks the second assert; a sweep that lapses neither breaks the
          first; and a sweep that marks swept_by_deadline on the untouched round
          breaks the third. The surviving round must still accept a vote afterwards,
          which proves the sweep did not quietly close it, and the posture must flip
          to RESTRICTED because the lapse created an open revision.
        test_recipe:
          setup:
            - "project in SCHEMATIC with a SCHEMATIC package holding an OPEN round due 2026-08-10 and a DESIGN_DEV package holding an OPEN round due 2026-08-25"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgA: $.data.id }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv3}", stage: "DESIGN_DEV", egress_clear_width_cm: 130, wheelchair_turning_radius_cm: 80, peak_visitors_per_hour: 200, circulation_area_sqm: 140.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkgB: $.data.id }
            - call: "POST /design-packages/${pkgA}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rA: $.data.id }
            - call: "POST /design-packages/${pkgB}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-25T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rB: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${proj}/review-sweep"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { sp: $.data.posture, sor: $.data.open_revision_count }
            - call: "GET /review-rounds/${rA}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { aSt: $.data.status, aSw: $.data.swept_by_deadline, aDec: $.data.decided_at, aCast: $.data.cast_vote_count }
            - call: "GET /review-rounds/${rB}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { bSt: $.data.status, bSw: $.data.swept_by_deadline, bDec: $.data.decided_at }
            - call: "GET /design-packages/${pkgA}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { pASt: $.data.status, pARev: $.data.revision_count }
            - call: "GET /design-packages/${pkgB}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { pBSt: $.data.status, pBRev: $.data.revision_count }
            - call: "POST /review-rounds/${rB}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
              captures: { bCast: $.data.cast_vote_count, bSt2: $.data.status }
            - call: "POST /exhibit-projects/${proj}/review-sweep"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { sp2: $.data.posture, sor2: $.data.open_revision_count }
            - call: "GET /review-rounds/${rB}"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { bSt3: $.data.status, bSw3: $.data.swept_by_deadline }
          assert:
            - "${aSt} == REVISION_REQUESTED, ${aSw} == true and ${aDec} == 2026-08-20T09:00:00Z - the due round lapsed at the clock instant, not at its own deadline"
            - "${aCast} == 0 - the round lapsed with no votes cast, which is the whole point of a deadline sweep"
            - "${bSt} == OPEN, ${bSw} == false and ${bDec} == null - 2026-08-25 is still in the future, so this round is untouched by the same call"
            - "${pASt} == REVISION_REQUESTED with ${pARev} == 1, while ${pBSt} == DRAFT with ${pBRev} == 0 - the cascade reached exactly one package"
            - "${sp} == RESTRICTED and ${sor} == 1 - one open revision is enough to restrict the posture"
            - "${bCast} == 1 and ${bSt2} == OPEN - the surviving round still takes votes after the sweep"
            - "${sp2} == RESTRICTED, ${sor2} == 1, ${bSt3} == OPEN and ${bSw3} == false - the second sweep at the same clock instant finds nothing due and changes no round"

      - name: withdrawing_a_placement_checks_the_pair_and_not_just_the_two_ids
        claim_type: cross_reference_link
        grounds:
          - endpoints.DELETE_/artifact-cases/{id}/placements/{artifact_id}
          - validations.priority_61
          - errors.ERR_ARTIFACT_NOT_IN_CASE
        distinguishing_aspect: |
          This is the only two-segment mutating path in the API, and the rule is a
          JOIN condition rather than two existence checks: the artifact must exist AND
          currently belong to the named case AND be in a live placement state. The
          three failures are therefore distinguishable and must not collapse into one
          another - an unknown artifact id is a 404 at the existence rung, a known
          artifact that belongs to a SIBLING case is a 409 at priority 61, and the
          same artifact after a successful withdrawal is a 409 too, because UNPLACED
          is outside {RESERVED, PLACED}. An implementation that only checks
          artifact.assigned_case_id != null passes the sibling probe and corrupts the
          other case.
