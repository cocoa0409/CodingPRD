    output: UtilityConflict[]
    side_effects: []
  - method: GET
    path: /uro/conflicts/{id}
    description: Fetch one utility conflict, including the frozen state_share_pct and its version for optimistic concurrency
    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, AgreementOfficer, ConstructionEngineer, UtilityOwnerRep]
    code: 200
    input: []
