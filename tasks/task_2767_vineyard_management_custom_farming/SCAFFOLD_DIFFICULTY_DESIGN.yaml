  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_create_refused_when_crew_inactive
        grounds:
          - validations[priority=76]
          - errors[ERR_CREW_INACTIVE]
          - entities.LaborCrew.fields.crew_status
          - calculations.work_order_labor_cost
          - calculations.farming_plan_committed_cost
        distinguishing_aspect: |
          Scheduling legality depends on a field of a THIRD entity that the request only
          references: with block, plan and interval all valid, POST /work-orders is refused with
          ERR_CREW_INACTIVE purely because LaborCrew.crew_status is INACTIVE, and the byte-identical
          slot succeeds against an ACTIVE crew — the dependency is on LaborCrew, not on the plan
          (cross-entity #3) or the contract (cross-entity #2).
        test_recipe:
          setup:
            - "Contract C1 ACTIVE with block B-12 enrolled; plan P1 APPROVED with total_budget 14687.50 and committed_cost 0.00."
            - "PIECE_RATE crew CR1 ACTIVE (crew_size 12, base 19.50, piece_rate 0.65, vines_per_hour_standard 45)."
            - "HOURLY crew CR4 (crew_size 8, base_hourly_rate 22.00) created with crew_status INACTIVE and the same four task capabilities."
