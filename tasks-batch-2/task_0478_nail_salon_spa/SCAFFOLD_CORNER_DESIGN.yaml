  # ===================== Cross-Cutting Complexity Layers ==================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_checkout_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[appointment-checkout-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Checkout with expected_appointment_version one less than the current stored version (stale after an add-on attach bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["IN_SERVICE appointment; client observed an earlier version, then an add-on attach (during REQUESTED) advanced version; the stale value is reconstructed as current - 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-22T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-OCC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani OCC", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech OCC", license_number: "LIC-OCC1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client OCC", email: "cocc@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "WALK_IN" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${av} - 1" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "Appointment.${a}.booking_status == IN_SERVICE (unchanged)"

      - name: occ_giftcard_redeem_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[giftcard-redeem-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A standalone gift-card redeem carrying an expected_gift_card_version one less than the stored version (after a prior redeem advanced it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Gift card balance 5000; one prior redeem of 1000 advanced version."]
          setup_api_calls:
            - call: "POST /gift-cards"
              payload: { code: "GC-OCC-1", initial_balance_cents: 5000 }
              as: FrontDesk
              captures: { gc: $.data.id, gv: $.data.version }
            - call: "POST /gift-cards/${gc}/redeem"
              payload: { amount_cents: 1000, expected_gift_card_version: "${gv}" }
              as: FrontDesk
              captures: { gv2: $.data.version }
          trigger:
            - call: "POST /gift-cards/${gc}/redeem"
              payload: { amount_cents: 500, expected_gift_card_version: "${gv2} - 1" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "GiftCard.${gc}.balance_cents == 4000 (unchanged by the rejected redeem)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Appointment.fields.version
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
        distinguishing_aspect: "Appointment.version starts at 1 on create and increments by exactly 1 on confirm (1 -> 2)."
        test_recipe:
          setup: ["A freshly created appointment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-23T12:00:00Z" }
