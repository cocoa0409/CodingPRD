              payload: { solicitation_id: "${sol1_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ENHANCED", weekly_round_trips: 14, seats_per_departure: 19, annual_subsidy_request_usd: 1800000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
