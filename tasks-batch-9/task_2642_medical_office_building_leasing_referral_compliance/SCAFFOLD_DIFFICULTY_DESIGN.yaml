              as: PortfolioAdmin
              captures: { t13_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b13_id}", suite_id: "${s13_id}", tenant_id: "${t13_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 32.00 }
              as: LeasingAgent
              captures: { l13_id: $.data.id, l13_v: $.data.version }
            - call: "POST /leases/${l13_id}/appraisals"
              payload: { expected_lease_version: "${l13_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-20", opinion_low_psf: 30.00, opinion_high_psf: 34.00, independence_attested: true }
              as: ComplianceOfficer
              captures: { ap13_id: $.data.id }
          trigger:
            - call: "GET /leases/${l13_id}/appraisals"
              payload: { status: "QUALIFIED" }
              as: ComplianceOfficer
            - call: "POST /leases/${l13_id}/submit-fmv-review"
              payload: { submission_note: "Submitted with no qualified appraisal on file" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /appraisals/${ap13_id}/decision"
              payload: { action: "QUALIFY", decision_reason: "Independence and methodology verified" }
              as: ComplianceOfficer
            - call: "GET /leases/${l13_id}/appraisals"
