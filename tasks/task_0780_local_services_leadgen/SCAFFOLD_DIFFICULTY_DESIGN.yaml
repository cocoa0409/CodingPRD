            - { call: "POST /service-requests", payload: { customer_id: "${cs}", category_id: "${cat}", zip_code: "94016", description: "assy", budget_cents: 15000 }, as: Customer, as_user_id: "${cs}", captures: { sr: "$.data.id", sr_v: "$.data.version" } }
            - { call: "POST /service-requests/${sr}/distribute", payload: { expected_service_request_version: "${sr_v}" }, as: PlatformAdmin }
            - { call: "GET /leads", payload: { request_id: "${sr}", pro_id: "${ps}" }, as: PlatformAdmin, captures: { lead: "$.data[0].id" } }
