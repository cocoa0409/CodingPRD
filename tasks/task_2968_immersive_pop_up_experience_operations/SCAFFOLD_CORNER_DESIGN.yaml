              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/resubmit"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /creative-submissions/${submission_id}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/decisions"
              payload: { decision: "CHANGES_REQUESTED", note: "lap two: the logo lockup is still wrong" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/resubmit"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /creative-submissions/${submission_id}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/decisions"
              payload: { decision: "CHANGES_REQUESTED", note: "lap three: the closing voiceover is off script" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/resubmit"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /creative-submissions/${submission_id}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/decisions"
              payload: { decision: "CHANGES_REQUESTED", note: "lap four: the merchandise sheet is missing" }
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${submission_id}/resubmit"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agr_v2: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "ATRIUM-SCRIPT-01", title: "Atrium scripted beat sheet, rebuilt", expected_agreement_version: "${agr_v2}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { submission_new: $.data.id }
            - call: "GET /creative-submissions/${submission_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
          assert:
            - "trigger 3 responds 200 with status SUBMITTED and revision_round 1, and change_note back to null"
            - "trigger 6 responds 200 with revision_round 2"
            - "trigger 9 responds 200 with revision_round 3: the THIRD resubmit is still accepted, because the precondition is revision_round < 3 evaluated BEFORE the increment"
            - "trigger 12 responds 409 with data.error_id == ERR_REVISION_ROUND_CAP: the fourth resubmit is the first refusal"
            - "trigger 12 is inert: the submission is still CHANGES_REQUESTED with revision_round 3, change_note 'lap four: the merchandise sheet is missing' and version unchanged"
            - "trigger 14 responds 201 with revision_round 0: the replacement row starts a fresh negotiation budget"
            - "trigger 15 shows the capped row now SUPERSEDED with superseded_by_submission_id == ${submission_new} and revision_round still 3, so superseding is the only escape from the cap and it preserves the audit trail"

      - name: lease_extension_budget_error_is_reachable_past_the_demand_gate
        claim_type: error_triggerability
        grounds:
          - errors[ERR_LEASE_EXTENSION_EXHAUSTED]
          - errors[ERR_DEMAND_BELOW_THRESHOLD]
          - endpoints[POST /experience-runs/{runId}/extensions]
          - validations[priority 150]
          - calculations.run_extension_demand_index
        distinguishing_aspect: |
          ERR_LEASE_EXTENSION_EXHAUSTED is the deepest id in the API: it is reachable only when the
          caller has already cleared the run-state check, the clearance check, SoD-3 and the demand
          floor, so a naive implementation that checks the venue's remaining option days first will
          emit it in place of the demand refusal and never emit the demand refusal at all. The
          §1.8 instance extension_segregation_of_duties_masks_the_demand_floor pins the SoD-versus-
          demand order; this instance pins the pair BELOW it - demand before budget - and adds the
          budget's own boundary, where consuming exactly the whole option is accepted and one further
          day is not.
        test_recipe:
          setup:
            - "The CLEARANCE CHAIN, but the venue is created with lease_extension_option_days 7, and the released slot has base_capacity 4 with wheelchair_positions 1 at 2026-08-25T14:00:00Z."
            - "The run is OPEN and one SINGLE order of party_size 4 is CONFIRMED on that slot, so released_total is 4, sold_total is 4, utilisation_pct is 100.00, refund_share_pct is 0.00 and demand_index is 100.00."
            - "The clock stays at 2026-08-01T00:00:00Z, which is 24 days before the slot, so the order may still be cancelled later in the recipe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
