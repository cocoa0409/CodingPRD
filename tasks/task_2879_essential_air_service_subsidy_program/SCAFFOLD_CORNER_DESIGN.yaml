      - name: half_up_rounding_is_visible_at_the_half_cent
        claim_type: precision
        grounds:
          - calculations.subsidy_payment_amount.precision
          - calculations.proposal_subsidy_per_passenger.precision
          - calculations.community_eligibility_assessment.precision
        distinguishing_aspect: "An annual rate of 1200000.06 makes the monthly entitlement land exactly on a half cent — 1200000.06 / 12 == 100000.005 — so round_half_up gives 100000.01 where banker's rounding would give 100000.00; the same request also pins the 2-decimal quotients 134.95 and 16.99."
        test_recipe:
          setup:
            - "Community HYS (6200 enplanements) SUBSIDIZED under an ACTIVE agreement at 1200000.06 for 12 months; one period with 100 scheduled departures all completed."
