            - { call: "POST /packinghouse/groves/${er3_gb}/maturity-tests", payload: { sampled_at: "2026-07-31T12:00:00Z", brix: 8.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${er3_gb_v2}" }, as: QualityInspector, as_user_id: "qi_er3" }
          trigger:
            - { call: "POST /packinghouse/harvest-assignments/${er3_aa}/start", payload: {}, as: FieldSupervisor, captures: { er3_e1: "$.data.error_id" } }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${er3_gb}", assignment_id: "${er3_ab}", gross_boxes: 10, tare_boxes: 0 }, as: FieldSupervisor, captures: { er3_e2: "$.data.error_id" } }
          assert:
            - "No test ever: ${er3_e1} == ERR_MATURITY_TEST_REQUIRED"
            - "CURRENT test FAILS (superseded PASS): ${er3_e2} == ERR_MATURITY_NOT_PASSING"

