  - method: GET
    path: "/tissue-bank/freezers/{id}/readings"
    description: "List readings for a freezer; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "TemperatureReading[]"
    side_effects: []
  - method: POST
    path: "/tissue-bank/freezers/{id}/excursions"
    description: "Manually report an excursion (origin MANUAL_REPORT); same quarantine cascade as an out-of-range reading"
    roles: [TissueBankCoordinator]
    code: 201
    input: [reason]
    output: TemperatureExcursion
    side_effects: ["Excursion OPEN", "Freezer -> EXCURSION_ACTIVE", "units -> QUARANTINED (EXCURSION)", "reservations -> RELEASED (EXCURSION)"]
  - method: GET
    path: "/tissue-bank/freezers/{id}/excursions"
    description: "List excursions for a freezer; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "TemperatureExcursion[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/freezers/{id}/units"
    description: "List units stored in a freezer; sorted by serial_number ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "TissueUnit[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/freezers/{id}/shipments"
    description: "List shipments received into a freezer; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/excursions/{id}"
    description: "Get an excursion incl. computed severity_score / severity_class / affected_unit_count"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: []
  - method: POST
    path: "/tissue-bank/excursions/{id}/investigate"
    description: "OPEN -> UNDER_INVESTIGATION"
    roles: [QualityManager]
    code: 200
    input: []
    output: TemperatureExcursion
    side_effects: ["status -> UNDER_INVESTIGATION"]
  - method: POST
    path: "/tissue-bank/excursions/{id}/resolve"
    description: "Resolve UNDER_INVESTIGATION with disposition RELEASE or DESTROY; HIGH severity forbids RELEASE; SoD vs manual reporter"
    roles: [QualityManager]
    code: 200
    input: [disposition, resolution_notes]
    output: TemperatureExcursion
    side_effects: ["units released to AVAILABLE or DISCARDED per disposition", "Freezer -> OPERATIONAL"]
  - method: GET
    path: "/tissue-bank/excursions/{id}/readings"
    description: "List readings linked to an excursion; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "TemperatureReading[]"
    side_effects: []

  # --- Implant cases & reservations ---
  - method: POST
    path: "/tissue-bank/implant-cases"
    description: "Schedule an implant case; OR-room half-open [scheduled_start, scheduled_end) overlap with another SCHEDULED case in the same or_room_id is rejected (adjacent end == start is allowed)"
    roles: [ImplantingSurgeon]
    code: 201
    input: [patient_ref, or_room_id, scheduled_start, scheduled_end]
    output: ImplantCase
    side_effects: []
  - method: GET
    path: "/tissue-bank/implant-cases/{id}"
    description: "Get an implant case"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: ImplantCase
    side_effects: []
  - method: POST
    path: "/tissue-bank/implant-cases/{id}/cancel"
    description: "Cancel a SCHEDULED case (own cases only); releases ACTIVE reservations (CASE_CANCELLED)"
    roles: [ImplantingSurgeon]
    code: 200
    input: []
    output: ImplantCase
    side_effects: ["reservations -> RELEASED", "units RESERVED -> AVAILABLE"]
  - method: POST
    path: "/tissue-bank/implant-cases/{id}/complete"
    description: "Complete a SCHEDULED case (own cases only); releases remaining ACTIVE reservations (CASE_COMPLETED)"
    roles: [ImplantingSurgeon]
    code: 200
    input: []
    output: ImplantCase
    side_effects: ["reservations -> RELEASED", "units RESERVED -> AVAILABLE"]
  - method: POST
    path: "/tissue-bank/implant-cases/{id}/record-implantation"
    description: "Record implantation of an ISSUED unit into this case (surgeon owns case; implant window gate)"
    roles: [ImplantingSurgeon]
    code: 200
    input: [tissue_unit_id]
    output: TissueUnit
    side_effects: ["unit ISSUED -> IMPLANTED", "case.implanted_unit_count += 1", "DRAFT DispositionRecord (IMPLANTED) created"]
  - method: POST
    path: "/tissue-bank/implant-cases/{id}/reservations"
    description: "Reserve an AVAILABLE unit for this case; requires unit expiration_at > case scheduled_end"
    roles: [TissueBankCoordinator]
    code: 201
    input: [tissue_unit_id]
    output: Reservation
    side_effects: ["unit AVAILABLE -> RESERVED", "hold_until = case.scheduled_end + 2h"]
  - method: GET
    path: "/tissue-bank/implant-cases/{id}/reservations"
    description: "List reservations for a case; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "Reservation[]"
    side_effects: []
  - method: GET
    path: "/tissue-bank/implant-cases/{id}/adverse-reactions"
    description: "List adverse reactions reported on a case; sorted by created_at ASC"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: "AdverseReactionCase[]"
    side_effects: []
  - method: POST
    path: "/tissue-bank/implant-cases/{id}/adverse-reactions"
    description: "Report an adverse reaction (own case; unit must be IMPLANTED on this case)"
    roles: [ImplantingSurgeon]
    code: 201
    input: [tissue_unit_id, reaction_type, severity, description]
    output: AdverseReactionCase
    side_effects: ["status REPORTED", "supplier scores recomputed (provisional open_adverse term)"]
  - method: POST
    path: "/tissue-bank/reservations/{id}/release"
    description: "Manually release an ACTIVE reservation; unit returns to AVAILABLE"
    roles: [TissueBankCoordinator]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> RELEASED (MANUAL)", "unit RESERVED -> AVAILABLE"]
  - method: GET
    path: "/tissue-bank/reservations/{id}"
    description: "Get a reservation"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  # --- Recalls ---
  - method: POST
    path: "/tissue-bank/recalls"
    description: "Create a recall in DRAFT (scope: supplier + lot_numbers + closed received window)"
    roles: [QualityManager]
    code: 201
    input: [supplier_id, lot_numbers, received_window_start, received_window_end, reason]
    output: Recall
    side_effects: []
  - method: GET
    path: "/tissue-bank/recalls/{id}"
    description: "Get a recall"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: POST
    path: "/tissue-bank/recalls/{id}/activate"
    description: "Activate a DRAFT recall; deterministic sweep quarantines matching units, releases their reservations, flags ISSUED units; zero-match auto-closes (NO_MATCH)"
    roles: [QualityManager]
    code: 200
    input: []
    output: Recall
    side_effects: ["units -> QUARANTINED (RECALL)", "reservations -> RELEASED (RECALL)", "supplier scores recomputed; auto-suspend if provisional < 60"]
  - method: POST
    path: "/tissue-bank/recalls/{id}/close"
    description: "Close an ACTIVE recall once no matching unit remains QUARANTINED with hold_reason RECALL"
    roles: [QualityManager]
    code: 200
    input: []
    output: Recall
    side_effects: ["status -> CLOSED (RESOLVED)", "supplier scores recomputed"]

  # --- Adverse reactions ---
  - method: GET
    path: "/tissue-bank/adverse-reactions/{id}"
    description: "Get an adverse reaction case"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: AdverseReactionCase
    side_effects: []
  - method: POST
    path: "/tissue-bank/adverse-reactions/{id}/investigate"
    description: "REPORTED/REOPENED -> UNDER_INVESTIGATION"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AdverseReactionCase
    side_effects: []
  - method: POST
    path: "/tissue-bank/adverse-reactions/{id}/resolve"
    description: "Close UNDER_INVESTIGATION with outcome CONFIRMED or UNCONFIRMED; SoD vs reporter; CONFIRMED cascades to supplier scores and possible auto-suspension"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, outcome_notes]
    output: AdverseReactionCase
    side_effects: ["status -> CLOSED_CONFIRMED | CLOSED_UNCONFIRMED", "supplier scores recomputed", "conditional supplier auto-suspension"]
  - method: POST
    path: "/tissue-bank/adverse-reactions/{id}/reopen"
    description: "Reopen a CLOSED_* case (cycle); restores the open_adverse provisional term and reverses a prior CONFIRMED finding"
    roles: [ComplianceOfficer]
    code: 200
    input: [reopen_reason]
    output: AdverseReactionCase
    side_effects: ["status -> REOPENED", "reopened_count += 1", "supplier scores recomputed"]

  # --- Par-level policies & valuation ---
  - method: POST
    path: "/tissue-bank/par-level-policies"
    description: "Create an ACTIVE par policy for a tissue_type; supersedes any existing ACTIVE policy for that tissue_type; OCC via expected_current_policy_version (omit when none active)"
    roles: [SupplyChainAdmin]
    code: 201
    input: [tissue_type, par_quantity, max_inventory_value_cents, "expected_current_policy_version?"]
    output: ParLevelPolicy
    side_effects: ["prior ACTIVE policy for the tissue_type -> SUPERSEDED", "increments superseded ParLevelPolicy.version by 1"]
  - method: GET
    path: "/tissue-bank/par-level-policies/{id}"
    description: "Get a policy incl. computed on_hand_available / deficit / needs_reorder"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: ParLevelPolicy
    side_effects: []
  - method: PUT
    path: "/tissue-bank/par-level-policies/{id}"
    description: "Update an ACTIVE policy's thresholds; OCC-guarded by expected_par_level_policy_version; increments ParLevelPolicy.version by 1"
    roles: [SupplyChainAdmin]
    code: 200
    input: ["par_quantity?", "max_inventory_value_cents?", expected_par_level_policy_version]
    output: ParLevelPolicy
    side_effects: ["increments ParLevelPolicy.version by 1"]
  - method: GET
    path: "/tissue-bank/inventory/valuation"
    description: "Computed inventory valuation for a tissue_type under method FIFO or WEIGHTED_AVERAGE (see calculations.inventory_valuation)"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: [tissue_type, method]
    output: "{ tissue_type: string, method: string, on_hand_count: integer, total_value: number }"
    side_effects: []

  # --- Disposition records (retention) ---
  - method: GET
    path: "/tissue-bank/disposition-records/{id}"
    description: "Get a disposition record"
    roles: [TissueBankCoordinator, QualityManager, ComplianceOfficer, ImplantingSurgeon, SupplyChainAdmin]
    code: 200
    input: []
    output: DispositionRecord
    side_effects: []
  - method: POST
    path: "/tissue-bank/disposition-records/{id}/finalize"
    description: "Finalize a DRAFT disposition record (immutable thereafter; retention clock starts)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DispositionRecord
    side_effects: ["status -> FINALIZED", "finalized_at = clock"]
  - method: DELETE
    path: "/tissue-bank/disposition-records/{id}"
    description: "Purge a FINALIZED record once clock >= finalized_at + 3650 days"
    roles: [ComplianceOfficer]
    code: 204
    input: []
    output: null
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not one of the five declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "SupplierDocument id does not exist under the supplier" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "TissueUnit id does not exist" }
  - { id: ERR_FREEZER_NOT_FOUND, http: 404, condition: "Freezer id does not exist" }
  - { id: ERR_EXCURSION_NOT_FOUND, http: 404, condition: "TemperatureExcursion id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "ImplantCase id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Reservation id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id does not exist" }
  - { id: ERR_ADVERSE_REACTION_NOT_FOUND, http: 404, condition: "AdverseReactionCase id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "ParLevelPolicy id does not exist" }
  - { id: ERR_DISPOSITION_NOT_FOUND, http: 404, condition: "DispositionRecord id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, string/array below minimum size" }
  - { id: ERR_INVALID_TEMP_RANGE, http: 400, condition: "min_celsius >= max_celsius on freezer create/reconfigure" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "scheduled_end <= scheduled_start, valid_to < valid_from, or received_window_end < received_window_start" }
  - { id: ERR_DUPLICATE_VALUE, http: 409, condition: "Uniqueness violation: supplier.license_number, freezer.name, or serial_number within a shipment manifest" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the guarded entity's current version (or ACTIVE policy exists while no/0 expected_current_policy_version was sent)" }
  - { id: ERR_SUPPLIER_INVALID_STATE, http: 409, condition: "Supplier transition requested from a state where it is not defined (incl. approve/reinstate gate failures of supplier status, and any mutation on DISQUALIFIED)" }
  - { id: ERR_SUPPLIER_SCORE_BELOW_THRESHOLD, http: 409, condition: "Reinstate requested while qualification_score_provisional < 60" }
  - { id: ERR_DOCUMENT_INVALID_STATE, http: 409, condition: "Verify/reject requested on a document not in SUBMITTED" }
  - { id: ERR_SHIPMENT_NOT_RECEIVED, http: 409, condition: "Accept/reject requested on a shipment not in RECEIVED" }
  - { id: ERR_SHIPMENT_NOT_ACCEPTED, http: 409, condition: "Unit release requested while its shipment is not ACCEPTED" }
  - { id: ERR_UNIT_NOT_QUARANTINED, http: 409, condition: "Release or return-to-supplier requested on a unit not in QUARANTINED" }
  - { id: ERR_UNIT_NOT_HOLDABLE, http: 409, condition: "Manual hold requested on a unit not in AVAILABLE" }
  - { id: ERR_UNIT_NOT_ISSUABLE_STATE, http: 409, condition: "Issue requested on a unit not in AVAILABLE (direct) or RESERVED (with reservation)" }
  - { id: ERR_UNIT_NOT_ISSUED, http: 409, condition: "Return-to-stock or record-implantation requested on a unit not in ISSUED" }
  - { id: ERR_UNIT_NOT_RESERVABLE, http: 409, condition: "Reservation requested on a unit not in AVAILABLE" }
  - { id: ERR_UNIT_NOT_DISCARDABLE, http: 409, condition: "Discard requested on a unit not in QUARANTINED or EXPIRED" }
  - { id: ERR_RESERVATION_NOT_ACTIVE, http: 409, condition: "Release/issue requested against a reservation not in ACTIVE" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "Case mutation requested when the case is not SCHEDULED" }
  - { id: ERR_CASE_OWNERSHIP_VIOLATION, http: 403, condition: "ImplantingSurgeon acting on a case whose surgeon_id != X-User-ID" }
  - { id: ERR_EXCURSION_INVALID_STATE, http: 409, condition: "Investigate/resolve requested from a state where it is not defined; or manual excursion reported while freezer already EXCURSION_ACTIVE" }
  - { id: ERR_RECALL_INVALID_STATE, http: 409, condition: "Activate requested when not DRAFT; close requested when not ACTIVE" }
  - { id: ERR_RECALL_UNRESOLVED_UNITS, http: 409, condition: "Close requested while units matching scope remain QUARANTINED with hold_reason RECALL" }
  - { id: ERR_ADVERSE_INVALID_STATE, http: 409, condition: "Investigate/resolve/reopen requested from a state where it is not defined" }
  - { id: ERR_DISPOSITION_INVALID_STATE, http: 409, condition: "Finalize requested on a non-DRAFT record, or DELETE requested on a DRAFT record" }
  - { id: ERR_SUPPLIER_NOT_QUALIFIED, http: 403, condition: "Supplier not QUALIFIED at receipt creation, shipment accept, unit release, or unit issue" }
  - { id: ERR_REQUIRED_DOCUMENTS_NOT_VERIFIED, http: 403, condition: "Required doc types (AATB_ACCREDITATION, FDA_REGISTRATION) not VERIFIED with valid_to >= clock" }
  - { id: ERR_UNIT_EXPIRED, http: 403, condition: "clock > expiration_at at issue or return-to-stock time" }
  - { id: ERR_UNIT_UNDER_ACTIVE_RECALL, http: 403, condition: "An ACTIVE recall matches the unit (supplier + lot + received window) at release, issue, or return-to-stock" }
  - { id: ERR_FREEZER_IN_EXCURSION, http: 403, condition: "Freezer status == EXCURSION_ACTIVE blocks unit release and issue" }
  - { id: ERR_SEVERITY_REQUIRES_DESTROY, http: 403, condition: "Excursion severity_class == HIGH; disposition RELEASE forbidden" }
  - { id: ERR_IMPLANT_WINDOW_CLOSED, http: 409, condition: "clock outside [scheduled_start - 1h, scheduled_end + 24h] at record-implantation" }
  - { id: ERR_UNIT_EXPIRES_BEFORE_CASE, http: 409, condition: "Reservation requested with unit expiration_at <= case scheduled_end" }
  - { id: ERR_RETENTION_PERIOD_ACTIVE, http: 409, condition: "DELETE of a FINALIZED disposition record before finalized_at + 3650 days" }
  - { id: ERR_OR_ROOM_DOUBLE_BOOKED, http: 409, condition: "New case's half-open window intersects another SCHEDULED case in the same or_room_id (adjacent end == start allowed)" }
  - { id: ERR_DOC_VALIDITY_OVERLAP, http: 409, condition: "New document's closed [valid_from, valid_to] intersects a SUBMITTED/VERIFIED document of the same supplier+doc_type (touching endpoints conflict)" }
  - { id: ERR_FREEZER_CAPACITY_EXCEEDED, http: 409, condition: "Storing N units would push occupied_count + N beyond effective_capacity" }
  - { id: ERR_CAPACITY_BELOW_OCCUPIED, http: 409, condition: "Reconfigured nominal_capacity would violate occupied_count <= nominal_capacity - reserve(new utilization)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID attempted both halves of a segregated pair (document verify vs supplier approve; manual excursion report vs resolve; adverse report vs resolve)" }
  - { id: ERR_RESERVATION_UNIT_MISMATCH, http: 422, condition: "issue's reservation_id references a reservation whose tissue_unit_id != the issued unit" }
  - { id: ERR_UNIT_ISSUED_TO_ANOTHER_CASE, http: 422, condition: "Unit was issued via a reservation belonging to a different implant case" }
  - { id: ERR_UNIT_NOT_IMPLANTED_ON_CASE, http: 422, condition: "Adverse reaction references a unit not IMPLANTED on this case" }
  - { id: ERR_INVENTORY_VALUE_CAP_EXCEEDED, http: 402, condition: "Projected WEIGHTED_AVERAGE valuation after accept would exceed the ACTIVE policy's max_inventory_value_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TissueBankCoordinator
    description: "Tissue services technologist: receipts, storage monitoring, reservations, issues, returns"
    identity: opaque
    exclusive_operations:
      - "POST /tissue-bank/shipments, /accept, /reject"
      - "POST /tissue-bank/tissue-units/{id}/issue, /return-to-stock"
      - "POST /tissue-bank/freezers/{id}/readings, /excursions"
      - "POST /tissue-bank/implant-cases/{id}/reservations"
      - "POST /tissue-bank/reservations/{id}/release"
    shared_operations:
      - "All GET endpoints"
  - name: QualityManager
    description: "Quality/RCM manager: supplier registration & documents, unit release/hold/discard/return, excursion investigation & resolution, recall lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /tissue-bank/suppliers, /suppliers/{id}/documents, /documents/{docId}/verify, /documents/{docId}/reject"
      - "POST /tissue-bank/tissue-units/{id}/release, /hold, /discard, /return-to-supplier"
      - "POST /tissue-bank/excursions/{id}/investigate, /resolve"
      - "POST /tissue-bank/recalls, /recalls/{id}/activate, /recalls/{id}/close"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance: supplier approval/suspension/disqualification, adverse-reaction investigation, disposition finalization & retention purge"
    identity: opaque
    exclusive_operations:
      - "POST /tissue-bank/suppliers/{id}/approve, /suspend, /reinstate, /disqualify"
      - "POST /tissue-bank/adverse-reactions/{id}/investigate, /resolve, /reopen"
      - "POST /tissue-bank/disposition-records/{id}/finalize; DELETE /tissue-bank/disposition-records/{id}"
    shared_operations:
      - "All GET endpoints"
  - name: ImplantingSurgeon
    description: "Implanting surgeon: schedules own cases, records implantations, reports adverse reactions (ownership via surgeon_id == X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /tissue-bank/implant-cases, /implant-cases/{id}/cancel, /complete, /record-implantation, /adverse-reactions"
    shared_operations:
      - "All GET endpoints"
  - name: SupplyChainAdmin
    description: "Supply-chain administrator: freezer registry & reconfiguration, par-level policies, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tissue-bank/freezers; PUT /tissue-bank/freezers/{id}"
      - "POST /tissue-bank/par-level-policies; PUT /tissue-bank/par-level-policies/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
