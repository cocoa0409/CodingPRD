      - name: satisfaction_average_half_up_at_4_375
        grounds:
          - calculations.event_satisfaction_summary
          - constants.PROMOTER_SCORE_FLOOR
          - endpoints.GET_/events/{id}/satisfaction-summary
          - entities.SatisfactionResponse
        distinguishing_aspect: |
          A DIFFERENT metric (the satisfaction mean and promoter share, not a duration) reached through
          a DIFFERENT endpoint (GET /events/{id}/satisfaction-summary). The mean lands exactly on the
          .005 tie: eight scores summing to 35 give 4.375, which must quantize HALF_UP to 4.38 - an
          implementation using Python's default banker's rounding produces 4.37 and fails. The
          promoter floor is simultaneously probed at its own boundary, since a score of exactly 4
          counts as a promoter and a 3 does not.
        test_recipe:
          setup:
            - "Clock at 2026-09-13T09:00:00Z; a single Event left in FORECAST (the summary read needs no plan, no slots and no lifecycle)."
            - "Eight SatisfactionResponses: four scores of 5 in zone Z701 and scores 4, 4, 4, 3 in zone Z702. No GuestIssues at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T09:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Satisfaction Precision Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
