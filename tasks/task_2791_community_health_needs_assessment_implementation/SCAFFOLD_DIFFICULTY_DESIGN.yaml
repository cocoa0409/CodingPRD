              as: CommunityBenefitOfficer
            - call: "POST /strategy-objectives/${obj}/report-progress"
              payload: { actual_value: 1199, as_of_date: "2027-06-15" }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 200, attainment_pct == 99.92 and attainment_status == PARTIAL (one unit short of target is not MET)"
            - "trigger call 2: HTTP 200, attainment_pct == 100.00 and attainment_status == MET — the MET threshold is inclusive"
            - "trigger call 3: HTTP 200, attainment_pct == 150.00 (raw 225.00 clamped to ATTAINMENT_CEILING after rounding) and attainment_status == MET"
            - "trigger call 4: HTTP 200, attainment_pct == 0.00 (raw -0.08 clamped at zero) and attainment_status == NOT_MET — a below-baseline actual never reports a negative percentage"
            - "StrategyObjective.${obj}.status == ACTIVE throughout (report-progress is a self-loop, not a lifecycle move) and baseline_value == 1200 stays immutable across all four reports"
            - "StrategyObjective.${obj}.actual_value == 1199 and as_of_date == \"2027-06-15\" after the last report; version incremented once per report"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: candidate_score_blocked_when_indicator_data_insufficient
        grounds:
          - validations.priority_12.ERR_INDICATOR_DATA_INSUFFICIENT
          - calculations.indicator_disparity_ratio
          - state_machines.PriorityCandidate.DRAFT_to_SCORED
        distinguishing_aspect: |
          Whether a candidate may be scored depends on the derived state of a
          different entity — its HealthIndicator's data_state — not on
          anything in the candidate or the request. Two candidates are created
          in the same cycle from the same request shape and the same domain;
          the one whose indicator has only a single population subgroup is
          rejected, the one whose indicator has two is scored. Because both
          indicators sit in a domain the completed interview rated, the
          rejection cannot be blamed on the missing-community-input rule at
          priority 23.
        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION with posture OPEN"
            - "indicator A with ACTIVE data points OVERALL 18.6, BLACK_NH 24.8, WHITE_NH 15.5 -> subgroup_count 2, data_state SUFFICIENT"
            - "indicator B in the same BEHAVIORAL_HEALTH domain with ACTIVE data points OVERALL 9.0 and BLACK_NH 12.0 only -> subgroup_count 1, disparity_ratio null, data_state INSUFFICIENT"
            - "one COMPLETED StakeholderInterview rating BEHAVIORAL_HEALTH at 5 with attendee_count 12"
            - "two DRAFT PriorityCandidate rows, one per indicator, both with hospital_capacity_score 70"
          setup_api_calls:
            - call: "POST /assessment-cycles"
