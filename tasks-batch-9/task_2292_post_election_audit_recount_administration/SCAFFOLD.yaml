    success_code: 200
    side_effects:
      - "DOCUMENTED -> ESCALATED"
      - "cascade: Audit -> ESCALATED_FULL_HAND_COUNT (escalation_level += 1) -> full-hand-count AuditRound -> one AuditBatch per unsampled batch with retrieval authorization and CustodyEvent(AUTHORIZED)"
      - "timeline projection re-run; Election.certification_risk_flag = true"
  - method: POST
