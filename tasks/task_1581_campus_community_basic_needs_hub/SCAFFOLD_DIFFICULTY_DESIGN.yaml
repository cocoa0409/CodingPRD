  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: PantryVisit gated by IntakeAssessment
  # state vs Referral gated by PartnerAgency state (different entity pairs).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_blocked_after_verified_assessment_expires
        grounds:
          - state_machines.IntakeAssessment.VERIFIED_to_EXPIRED
          - validations[priority=9]
          - errors[ERR_ASSESSMENT_REQUIRED]
        distinguishing_aspect: |
          Entity pair PantryVisit <- IntakeAssessment: the client stays ACTIVE after their
          only VERIFIED assessment crosses expires_at, yet pantry check-in now fails with
          ERR_ASSESSMENT_REQUIRED because the cross-entity precondition (a VERIFIED
          assessment exists) quietly stopped holding — client state alone is insufficient.
        test_recipe:
          setup:
            - "Client verified at 2026-08-01T00:00:00Z -> assessment expires_at 2027-08-01T00:00:00Z, client ACTIVE"
            - "Clock advanced to exactly 2027-08-01T00:00:00Z and swept (expiry boundary is inclusive: now >= expires_at)"
            - "PantryStaff exists"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "P Pa", email: "pantry@hub.test", staff_role: "PANTRY_STAFF" }
              as: HubAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "lake", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 50000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { exp: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: HubAdmin
            - call: "POST /_sweeps/run_pending_transitions"
              payload: {}
              as: HubAdmin
              captures: { swept: $.data.assessments_expired }
          trigger:
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { err: $.data.error_id }
            - call: "GET /clients/${c_id}"
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { c_status: $.data.status, c_hh: $.data.household_size_effective }
          assert:
            - "sweep output: assessments_expired == 1 (expires_at boundary inclusive at exactly 2027-08-01T00:00:00Z)"
            - "check-in rejected 409 ERR_ASSESSMENT_REQUIRED"
            - "Client.${c_id}.status is still ACTIVE (assessment expiry does not suspend the client)"
            - "Client.${c_id}.household_size_effective is null and pantry_points_allotment == 0 after the expiry cascade"

      - name: referral_send_gated_by_agency_pause_then_resume
        grounds:
          - state_machines.Referral.INITIATED_to_SENT
          - state_machines.PartnerAgency.ACTIVE_to_PAUSED
          - errors[ERR_AGENCY_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Referral <- PartnerAgency (distinct from PantryVisit <-
          IntakeAssessment): an INITIATED referral is valid on its own, yet /send is gated
          by the agency's live status — PAUSED rejects with ERR_AGENCY_NOT_ACTIVE and a
