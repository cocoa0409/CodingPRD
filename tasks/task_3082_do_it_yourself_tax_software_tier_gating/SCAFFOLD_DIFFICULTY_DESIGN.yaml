# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3082: DIY Tax Software Tier Gating & Free-File Eligibility
# Catalog fixture used throughout (seeded in every instance's setup):
#   Tiers:    FREE(0c, addon 0c, rank 0) DELUXE(6999c, addon 3999c, rank 1)
#             PREMIER(12999c, addon 4999c, rank 2) SELF_EMPLOYED(19999c, addon 5999c, rank 3)
#   FormSpec: F1040(FREE, dq=false) W2_WH(FREE, dq=false, counts_toward_refund=true)
#             SCH_E(DELUXE, dq=false) SCH_D(PREMIER, dq=true)
#             F8949(PREMIER, dq=true) F4562(PREMIER, dq=true) SCH_C(SELF_EMPLOYED, dq=true)
#   Constants: FREE_FILE_AGI_LIMIT_CENTS=8400000, REFUND_TRANSFER_FEE_CENTS=4000,
#              STATE_FLAT_RATE=0.05, GUARANTEE_CAP_CENTS=100000,
#              AMENDMENT_HOLD_HOURS=24, banks BANK_A/BANK_B, disclosure RTD-2026-1
#   Default logical clock: 2026-09-01T00:00:00Z
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_settled_classification_after_decline
        grounds:
          - calculations.minimum_tier_classification
          - state_machines.UpgradePrompt.PENDING_to_DECLINED_DOWNGRADED
          - entities.TaxReturn.fields.minimum_required_tier
        distinguishing_aspect: |
          Dual-variant on the TaxReturn domain: the provisional pass (at form
          add) prices a SELF_EMPLOYED prompt from a form set that includes
          SCH_C, while the settled pass (at submit-review, after decline
          downgraded SCH_C to REMOVED) re-derives the minimum from the
          strictly smaller ACTIVE set — same formula, different input set,
          different result (SELF_EMPLOYED vs FREE).
        test_recipe:
          setup:
            - "Account A (AGI 5000000c, CA) with return R(2025) holding ACTIVE F1040 + SCH_C; provisional classification created a PENDING prompt FREE->SELF_EMPLOYED with frozen price_delta_cents=19999"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "DELUXE", price_cents: 6999, state_addon_price_cents: 3999, supported_forms: ["SCH_E"], tier_rank: 1 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "SELF_EMPLOYED", price_cents: 19999, state_addon_price_cents: 5999, supported_forms: ["SCH_C"], tier_rank: 3 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_E", minimum_tier: "DELUXE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F8949", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F4562", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_C", minimum_tier: "SELF_EMPLOYED", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "dual1@x.com", full_name: "Dual One", filing_status: "SINGLE", agi_cents: 5000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_C", amount_cents: 2500000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
          trigger:
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/decline"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "UpgradePrompt.${prompt_id}.price_delta_cents == 19999 (frozen from the provisional pass over the pre-decline form set)"
            - "UpgradePrompt.${prompt_id}.status == DECLINED_DOWNGRADED"
            - "TaxReturn.${ret_id}.status == READY_FOR_REVIEW (settled classification over the reduced ACTIVE set: SCH_C removed, minimum dropped to FREE)"
            - "TaxReturn.${ret_id}.minimum_required_tier == FREE"
            - "TaxReturn.${ret_id}.current_tier == FREE"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 0"

      - name: resident_vs_nonresident_state_tax_variants
        grounds:
          - calculations.state_allocation_tax
          - entities.StateReturn.fields.is_resident_state
          - entities.StateReturn.fields.allocated_tax_cents
        distinguishing_aspect: |
          Dual-variant on the StateReturn domain (different entity domain from
          instance 1): resident_full_tax ignores the allocation inputs entirely
          while the non-resident variant applies the exact-rational allocation
          fraction — two StateReturns on the same account with identical
          allocation inputs produce different allocated_tax_cents.
        test_recipe:
          setup:
            - "Account A (AGI 12000000c, resident CA) with return R(2025, DRAFT) holding ACTIVE F1040"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "dual2@x.com", full_name: "Dual Two", filing_status: "SINGLE", agi_cents: 12000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", allocation_numerator_cents: 3000000, allocation_denominator_cents: 12000000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ca_sr: $.data.id, ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "NY", allocation_numerator_cents: 3000000, allocation_denominator_cents: 12000000, expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ny_sr: $.data.id }
          assert:
            - "StateReturn.${ca_sr}.is_resident_state == true"
            - "StateReturn.${ca_sr}.allocated_tax_cents == 600000 (full AGI x 5%; allocation inputs ignored by the resident variant)"
            - "StateReturn.${ny_sr}.is_resident_state == false"
            - "StateReturn.${ny_sr}.allocated_tax_cents == 150000 (AGI x 1/4 x 5% under the non-resident variant)"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 0 (FREE tier add-on price is 0)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: total_fees_circular_order_pinned
        grounds:
          - calculations.total_fees_due
          - validations[priority=19]
          - entities.TaxReturn.fields.total_fees_due_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by explicit evaluation
          order — the refund-transfer service fee is a component of
          total_fees_due_cents, while refund-transfer feasibility compares
          federal_refund_cents to that same total; the scaffold pins
          base -> state add-ons -> service fee -> sum, and checks feasibility
          only against the fully computed total at file time (21998 < 22000
          fails, then raising the refund to 21998 succeeds).
        test_recipe:
          setup:
            - "Account A (AGI 2000000c, CA) with return R(2025) holding ACTIVE F1040 + W2_WH(amount 22000c => federal_refund_cents 22000) + SCH_D; prompt FREE->PREMIER acknowledged so current_tier=PREMIER"
            - "One CA StateReturn added; refund-transfer agreement created and disclosure accepted (refund_transfer_selected=true)"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "DELUXE", price_cents: 6999, state_addon_price_cents: 3999, supported_forms: ["SCH_E"], tier_rank: 1 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "SELF_EMPLOYED", price_cents: 19999, state_addon_price_cents: 5999, supported_forms: ["SCH_C"], tier_rank: 3 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "comb1@x.com", full_name: "Comb One", filing_status: "SINGLE", agi_cents: 2000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 22000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: -5000, expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/acknowledge"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer"
              payload: { bank_partner_code: "BANK_A", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v7: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer/accept-disclosure"
              payload: { expected_return_version: "${ret_v7}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v8: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v8}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v9: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-a", expected_return_version: "${ret_v9}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "first file rejected: ${err1} == ERR_REFUND_INSUFFICIENT_FOR_FEES"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 21998 (12999 base + 4999 state add-on + 4000 service fee, pinned order)"
            - "TaxReturn.${ret_id}.federal_refund_cents == 22000"
            - "TaxReturn.${ret_id}.status == READY_FOR_REVIEW (failed file leaves state untouched)"

      - name: free_file_income_boundary_combinatorial
        grounds:
          - calculations.free_file_eligibility
          - validations[priority=9]
          - entities.TaxReturn.fields.free_file_eligible
        distinguishing_aspect: |
          Mode (a): three-input nonlinear interaction — disqualifying-form
          presence x AGI threshold (inclusive <=) x current_tier==FREE gate;
          at exactly 8400000c with only F1040 the return is eligible and
          submits, at 8400001c the identical form set is ineligible.
        test_recipe:
          setup:
            - "Account A at exactly the limit (AGI 8400000c) with return R1 holding ACTIVE F1040; account B one cent over (AGI 8400001c) with return R2 holding ACTIVE F1040"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "comb2a@x.com", full_name: "Comb Two A", filing_status: "SINGLE", agi_cents: 8400000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_a: $.data.id }
            - call: "POST /tax/accounts/${acct_a}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_a}"
              captures: { ret_a: $.data.id, ret_a_v: $.data.version }
            - call: "POST /tax/returns/${ret_a}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_a_v}" }
              as: Taxpayer
              as_user_id: "${acct_a}"
              captures: { ret_a_v2: $.data.version }
            - call: "POST /tax/accounts"
              payload: { email: "comb2b@x.com", full_name: "Comb Two B", filing_status: "SINGLE", agi_cents: 8400001, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_b: $.data.id }
            - call: "POST /tax/accounts/${acct_b}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_b}"
              captures: { ret_b: $.data.id, ret_b_v: $.data.version }
            - call: "POST /tax/returns/${ret_b}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_b_v}" }
              as: Taxpayer
              as_user_id: "${acct_b}"
              captures: { ret_b_v2: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_a}/submit-review"
              payload: { expected_return_version: "${ret_a_v2}" }
              as: Taxpayer
              as_user_id: "${acct_a}"
              captures: { ret_a_v3: $.data.version }
            - call: "POST /tax/returns/${ret_b}/submit-review"
              payload: { expected_return_version: "${ret_b_v2}" }
              as: Taxpayer
              as_user_id: "${acct_b}"
              captures: { err_b: $.data.error_id }
          assert:
            - "TaxReturn.${ret_a}.status == READY_FOR_REVIEW (AGI exactly at the inclusive 8400000c limit stays eligible)"
            - "TaxReturn.${ret_a}.free_file_eligible == true"
            - "second submit rejected: ${err_b} == ERR_FREE_FILE_INELIGIBLE"
            - "TaxReturn.${ret_b}.status == DRAFT"
            - "TaxReturn.${ret_b}.free_file_eligible == false"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: return_rejection_correction_resubmission_cycle
        grounds:
          - state_machines.TaxReturn.READY_FOR_REVIEW_to_SUBMITTED
          - state_machines.TaxReturn.SUBMITTED_to_REJECTED
          - state_machines.TaxReturn.REJECTED_to_DRAFT
          - state_machines.StateReturn.FILED_to_READY
        distinguishing_aspect: |
          TaxReturn machine is cyclic: READY_FOR_REVIEW -> SUBMITTED ->
          REJECTED -> DRAFT -> READY_FOR_REVIEW -> SUBMITTED loops with
          per-iteration side effects (attempt_sequence increments, correction
          hint set, StateReturn rolls FILED back to READY and re-files).
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA), return R(2025) with ACTIVE F1040, one CA StateReturn marked READY, return in READY_FOR_REVIEW"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "cyc1@x.com", full_name: "Cyc One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { sr_id: $.data.id, ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns/${sr_id}/ready"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id, ret_v6: $.data.version }
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "REJECTED", rejection_code: "R0000_SSN_MISMATCH" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/reopen"
              payload: { expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v7: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v7}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v8: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-2", expected_return_version: "${ret_v8}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa2: $.data.id }
          assert:
            - "FilingAttempt.${fa2}.attempt_sequence == 2 (cycle incremented the sequence)"
            - "FilingAttempt.${fa2}.outcome == PENDING"
            - "FilingAttempt.${fa1}.correction_hint == 'Verify the SSN exactly as printed on the Social Security card.'"
            - "StateReturn.${sr_id}.status == FILED (rolled back to READY by the rejection, then re-filed by the second submission)"
            - "TaxReturn.${ret_id}.status == SUBMITTED"

      - name: claim_partial_approval_review_cycle
        grounds:
          - state_machines.AccuracyClaim.UNDER_REVIEW_to_PARTIALLY_APPROVED
          - state_machines.AccuracyClaim.PARTIALLY_APPROVED_to_UNDER_REVIEW
          - calculations.accuracy_reimbursement
        distinguishing_aspect: |
          AccuracyClaim machine (different entity from instance 1) is cyclic:
          UNDER_REVIEW -> PARTIALLY_APPROVED -> UNDER_REVIEW -> APPROVED ->
          PAID, with reimbursement_cents reset to 0 on each reopen and
          recomputed at each adjudication.
        test_recipe:
          setup:
