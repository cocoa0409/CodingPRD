          trigger:
            - call: "GET /hospital-contracts/00000000-0000-4000-8000-000000000000"
              as: ContractAdmin
              captures: { e_404: $.data.error_id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", acuity: "ELECTIVE" }
