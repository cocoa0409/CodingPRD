            - "${prot_after} == 300000.00 (covered_amount - spent_total for the one ACTIVE plan)"
            - "${nqfp_after} == 0.00 == max(0.00, 300000.00 + 0.00 - 300000.00)"
            - "QOZBusiness.${biz_id}.blown_unspent_amount == 0.00 and qualification_status == UNTESTED (activation is not a test)"

