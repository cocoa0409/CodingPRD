            - "GET /accounts/${acc_id}/ledger-entries?entry_type=REIMBURSEMENT returns one entry with amount_cents == 100000"
            - "Account.${acc_id}.available_balance_cents == 0 and funding_status == DEPLETED (hop 3)"

      - name: settle_cascade_depth2_carryover_creates_next_year_account
        grounds:
          - state_machines.Account.ACTIVE_to_CLOSED
          - calculations.Year-End-Settlement
          - entities.Account.fields.carryover_source_account_id
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (settle, not disburse): (1) the HEALTH_FSA account
          settles to CLOSED with carryover_out=66000; (2) that carryover_out itself creates a new
          next-year HEALTH_FSA account credited with CARRYOVER_IN=66000 and carryover_source_account_id
          pointing back. The second hop is caused by the first.
        test_recipe:
          setup:
            - "PY-CARRY (CARRYOVER cap 66000); Participant has an ACTIVE HEALTH_FSA with available_balance_cents=100000."
            - "Clock advanced past 2027-04-01."
