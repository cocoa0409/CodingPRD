  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: theatre_booking_overlap_with_buffers_half_open
        grounds:
          - validations[priority=5]
        distinguishing_aspect: |
          Resource: Theatre. Semantics: half-open intervals [start, end) with
          load-in/load-out buffers included — a follow-on booking whose
          loadin_start equals the incumbent's run_end + loadout buffer is
          allowed (touching boundaries do not conflict), one hour less is
          rejected.
        test_recipe:
          setup:
            - "Incumbent APPROVED booking on theatre T: loadin 2026-09-06, run_end 2026-09-27, loadout 48h (buffer ends 2026-09-29T00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "O1Co", contact_email: "o1@x.com" }
              as: HouseManager
              captures: { comp1: $.data.id }
            - call: "POST /theatres/companies"
              payload: { name: "O2Co", contact_email: "o2@x.com" }
              as: HouseManager
              captures: { comp2: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "OverlapT", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp1}", title: "Incumbent", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 48 }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { prod1: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp2}", title: "Challenger", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp2}"
              captures: { prod2: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod1}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-09-27T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { bk1: $.data.id }
            - call: "POST /theatres/bookings/${bk1}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod2}", theatre_id: "${house_id}", loadin_start: "2026-09-28T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp2}"
              captures: { bk2: $.data.id }
          trigger:
            - call: "POST /theatres/bookings/${bk2}/approve"
              payload: {}
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_WINDOW_CONFLICT with http 409 (challenger loadin 09-28 is inside incumbent's [loadin, run_end + 48h) = [09-06, 09-29))"
            - "A challenger with loadin_start exactly 2026-09-29T00:00:00Z approves cleanly (half-open boundary: touching is allowed)"

      - name: capital_project_window_closed_contact_conflict
        grounds:
          - validations[priority=5]
          - entities.CapitalProject
        distinguishing_aspect: |
          Resource: CapitalProject vs booking performance run — DIFFERENT
          semantics: contact with the performance run is a conflict under the
          closed-interval reading for maintenance windows (a maintenance window
          must not touch [loadin_start, run_end] at all), unlike the half-open
          booking-vs-booking rule; and it sits on a different resource entity.
        test_recipe:
          setup:
            - "Landmark theatre with APPROVED booking run [2026-09-06, 2026-09-27]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "CapCo", contact_email: "cap@x.com" }
              as: HouseManager
              captures: { comp1: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Palace2", capacity: 1800, size_class: LARGE, is_landmark: true, base_weekly_rent_cents: 900000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/houses/${house_id}/capital-projects"
              payload: { description: "Pre-run facade work", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp1}", title: "PalaceShow", required_size_class: LARGE, required_loadin_hours: 24, required_loadout_hours: 48 }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { prod1: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod1}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-09-27T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { bk1: $.data.id }
            - call: "POST /theatres/bookings/${bk1}/approve"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/houses/${house_id}/capital-projects"
              payload: { description: "Mid-run work touching closing day", window_start: "2026-09-27T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_WINDOW_CONFLICT with http 409 (maintenance window starting exactly at run_end touches the closed performance run and conflicts — different semantics from the half-open booking-vs-booking rule)"

  # ===========================================================================
