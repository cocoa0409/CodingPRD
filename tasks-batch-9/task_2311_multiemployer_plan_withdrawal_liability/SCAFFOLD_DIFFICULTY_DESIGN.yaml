              as: EmployerRepresentative
              as_user_id: "${emp_id}"
              captures: { arb_id: "$.data.id", round_at_init: "$.data.round_number", status_at_init: "$.data.status" }
            - call: "POST /arbitrations/${arb_id}/advance"
              payload: { to_status: "HEARING" }
              as: Arbitrator
              as_user_id: "arb-001"
            - call: "POST /arbitrations/${arb_id}/award"
              payload: { award_outcome: "REMAND", assumption_ruling: "PENDING" }
              as: Arbitrator
              as_user_id: "arb-001"
              captures: { status_after_remand: "$.data.status", round_after_remand: "$.data.round_number" }
            - call: "POST /arbitrations/${arb_id}/advance"
              payload: { to_status: "BRIEFING" }
              as: Arbitrator
              as_user_id: "arb-001"
              captures: { status_second_briefing: "$.data.status", round_second_briefing: "$.data.round_number" }
            - call: "POST /arbitrations/${arb_id}/advance"
              payload: { to_status: "HEARING" }
              as: Arbitrator
              as_user_id: "arb-001"
            - call: "POST /arbitrations/${arb_id}/award"
              payload: { award_outcome: "AFFIRM", assumption_ruling: "REJECTED" }
              as: Arbitrator
