          assert:
            - "${both_err} == ERR_DUTY_ROLE_MISMATCH with HTTP 409 — priority 29 beats the priority 42 window violation in the same call"
            - "${duty_err} == ERR_DUTY_ROLE_MISMATCH with HTTP 409 — TRAINER pairs only with role_type ATHLETIC_TRAINER"
            - "${window_err} == ERR_SHIFT_OUTSIDE_STOP_WINDOW with HTTP 409 — one minute before arrive_at is outside the stop window"
            - "the exact-fit shift returns 201: StaffAssignment.${assignment_id}.status == PROPOSED, and a shift spanning arrive_at to depart_at inclusive is legal"
            - "exactly one StaffAssignment exists on the stop"

      - name: closed_plan_state_versus_oversized_payment
        claim_type: priority_conflict
        grounds:
          - validations.priority_15_ERR_PLAN_NOT_ACCEPTING_PAYMENTS
          - validations.priority_57_ERR_PAYMENT_EXCEEDS_BALANCE
        excluded_because:
          difficulty_instance: closed_plan_state_error_outranks_oversized_payment_fiscal_error
          rationale: "That §1.8 priority_pair_validation_conflict instance already drives a plan to CLOSED_WITH_BALANCE and posts a payment that is simultaneously oversized, asserting ERR_PLAN_NOT_ACCEPTING_PAYMENTS and then isolating each rule on its own — a second priority-conflict corner on the same pair would be a duplicate."

      - name: minor_room_mix_versus_space_capacity
        claim_type: priority_conflict
        grounds:
          - validations.priority_31_ERR_MINOR_ROOM_MIX
          - validations.priority_53_ERR_SPACE_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: minor_room_mix_outranks_sleeping_space_capacity
          rationale: "The mix-versus-capacity ordering, including the chaperone bunk reservation that makes a 12-bunk space hold only 11 minors, is asserted end to end by that §1.8 instance."

      - name: extreme_heat_protocol_thresholds
        claim_type: violation_to_error
        grounds:
          - validations.priority_35_ERR_EXTREME_HEAT_OUTDOOR_PROHIBITED
          - validations.priority_34_ERR_TRAINER_COVERAGE_REQUIRED
        excluded_because:
          difficulty_instance: heat_index_thresholds_at_94_95_104_and_105
          rationale: "That §1.8 boundary_precision_check instance walks heat_index_f at 94, 95, 104 and 105 across both heat rules — trainer coverage required at 95 and the outdoor prohibition at 105 — so the pass/fail sides of both thresholds are already pinned."

      - name: stop_confirmation_aggregate_coverage_requirements
        claim_type: aggregate_validation
        grounds:
          - validations.priority_32_ERR_CHAPERONE_COVERAGE_INSUFFICIENT
          - validations.priority_33_ERR_COOK_COVERAGE_INSUFFICIENT
        excluded_because:
          difficulty_instance: stop_confirmation_depends_on_member_volunteer_and_assignment_states
          rationale: "The aggregate-coverage corner (each volunteer individually valid but the collective count short of ceil(minor_head_count/10) and ceil(roster_head_count/40)) is exactly what that §1.8 cross_entity_state_dependency instance asserts, including that only APPROVED assignments count toward coverage."

      - name: housing_requires_a_signed_agreement
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_18_ERR_AGREEMENT_NOT_SIGNED
        excluded_because:
          difficulty_instance: housing_assignment_requires_signed_spring_training_agreement
          rationale: "That §1.8 cross_entity_state_dependency instance already tests the DRAFT, SUBMITTED, COUNTERED and CANCELLED sides of ERR_AGREEMENT_NOT_SIGNED against the SIGNED success path on the same agreement."

  - section: endpoints
    instances:
      - name: payment_plan_create_read_and_list_expose_the_whole_schedule
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/payment-plans
          - endpoints.GET_/payment-plans/{payment_plan_id}
          - endpoints.GET_/payment-plans
        distinguishing_aspect: "Create-then-read-then-list on the money aggregate: a STANDARD_3 plan for 399900 must expose surcharge 0, financed_total 399900, base 133300 and remainder 0 on the create response, the same values on the single read, and appear under the member_id + status filter — while every clock-derived counter starts at 0 because no due date has passed on the 2026-08-01 clock."
        test_recipe:
          setup: ["One member holds an EXECUTED 399900 STANDARD_3 contract; the clock is still at its 2026-08-01 default."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 90 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_v: "$.data.version" }
          trigger:
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-01-15", expected_member_version: "${member_v}" }
              as: BusinessManager
              captures: { plan_id: "$.data.id" }
            - call: "GET /payment-plans/${plan_id}"
              as: BusinessManager
            - call: "GET /payment-plans"
              payload: { member_id: "${member_id}", status: "ACTIVE" }
              as: BusinessManager
          assert:
            - "the create returns 201 with PaymentPlan.${plan_id}.plan_type == STANDARD_3 copied from the contract, installment_count == 3, principal_cents == 399900, surcharge_cents == 0, financed_total_cents == 399900"
            - "PaymentPlan.${plan_id}.installment_base_cents == 133300 and installment_remainder_cents == 0"
            - "PaymentPlan.${plan_id}.installments_due_count == 0, due_amount_cents == 0, arrears_cents == 0, late_fee_accrued_cents == 0 and outstanding_cents == 399900 on the 2026-08-01 clock"
            - "the single read returns HTTP 200 with byte-identical field values to the create response"
            - "the filtered list returns exactly one element, PaymentPlan.${plan_id}, with total_count == 1 and has_more == false"
            - "Member.${member_id}.tuition_charged_cents == 399900 and Season.${season_id}.tuition_charged_cents == 399900 — set by the execute, not by the plan creation"

      - name: stop_complete_requires_the_clock_to_reach_depart_at
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/tour-stops/{tour_stop_id}/complete
          - validations.priority_46_ERR_STOP_NOT_DEPARTED
        distinguishing_aspect: "The complete action's temporal guard is inclusive: one minute before depart_at it must fail with ERR_STOP_NOT_DEPARTED and leave the stop CONFIRMED, and at the instant exactly equal to depart_at it must succeed. A strict > comparison passes the first call and fails the second."
        test_recipe:
          setup: ["A CONFIRMED rehearsal-only stop departs 2027-06-19T20:00:00Z; the clock has been set to 2027-06-19T19:59:00Z."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
