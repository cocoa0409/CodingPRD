        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
