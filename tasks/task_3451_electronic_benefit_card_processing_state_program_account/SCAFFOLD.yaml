# =============================================================================
# SCAFFOLD — Electronic Benefit Card Processing & State Program Account
# Operations (EBT / Conduent-style state contract)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Electronic Benefit Card Processing & State Program Account Operations (Conduent):
  state contract implementation with benefit program configuration for food, cash and
  disaster assistance with separate purse rules, card issuance, mailing, activation and
  replacement with fee rules that differ by program and state, eligible item restriction
  enforcement at the point of sale using retailer item files with exception handling,
  benefit posting schedules staggered across a month by case identifier with availability
  timing, expungement of unused benefits after inactivity periods with notification
  requirements, retailer settlement and reconciliation across acquirers with dispute
  handling, cardholder customer service including balance inquiry, personal identification
  number reset and skimming claim investigation, program integrity reporting and
  transaction data delivery to the state

domain_name: ebt-state-benefits
api_prefix: /ebt

# Platform/test-driving endpoints mount OUTSIDE the api_prefix. The single logical
# clock endpoint is POST /_clock/set_current_utc (no /ebt prefix). Every other
# endpoint lives under /ebt. All endpoint references in this file and in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml use exactly these
# mount points.
platform_endpoints_note: |
  POST /_clock/set_current_utc is mounted OUTSIDE api_prefix (/ebt). All business
  endpoints are mounted UNDER /ebt. The logical clock starts at exactly
  2026-09-01T00:00:00Z on server startup (before any set_current_utc call) and never
  falls back to wall-clock time.

constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-09-01T00:00:00Z"
  CLOCK_ENDPOINT_MOUNT: "outside_api_prefix"
  # The following mirror StateContract field defaults (§1.1). The entity fields are
  # the operative configuration; these values are the concrete defaults every
  # fixture may rely on. If a fixture does not override a contract field, the value
  # below applies. The two lists MUST stay value-identical.
  DEFAULT_POSTING_MODULUS: 10
  DEFAULT_AVAILABILITY_HOUR_UTC: 6
  DEFAULT_EXPUNGEMENT_INACTIVITY_DAYS: 90
  EXPUNGEMENT_NOTICE_LEAD_DAYS: 30
  DEFAULT_DISASTER_EXPIRY_DAYS: 30
  DEFAULT_REPLACEMENT_FEE_CENTS: 250
  FREE_REPLACEMENTS_PER_365D: 1
  PIN_MAX_FAILURES: 3
  CLAIM_WINDOW_DAYS: 60
  PROVISIONAL_CREDIT_DELAY_DAYS: 10
  PROVISIONAL_CREDIT_CAP_CENTS: 50000
  SKIMMING_SUSPEND_THRESHOLD: 3
  DISPUTE_WINDOW_DAYS: 15
  ACQUIRER_FEE_BASIS_POINTS: 75
  CASH_WITHDRAWAL_DAILY_LIMIT_CENTS: 50000
  CASH_WITHDRAWAL_MULTIPLE_CENTS: 500
  SETTLEMENT_CUTOFF_HOUR_UTC: 0
  CARD_MAIL_DELAY_HOURS: 24

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 14
  state_machine_count: 13
  calculation_count: 12
  endpoint_count: 40
  error_code_count: 40
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateContract
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code, uppercase, ^[A-Z]{2}$" }
      - { name: contract_status, type: enum, source: system, description: "CONFIGURING | ACTIVE | SUSPENDED | CLOSED" }
      - { name: default_posting_modulus, type: integer, source: input, default: 10, description: "Posting-schedule modulus M: bucket = int(case_identifier) MOD M; scheduled day = month-01 + bucket days", constraints: ">= 1, <= 28" }
      - { name: default_availability_hour_utc, type: integer, source: input, default: 6, description: "UTC hour at which a posting becomes spendable on its available date", constraints: "0..23" }
      - { name: default_expungement_inactivity_days, type: integer, source: input, default: 90, description: "Days without ledger activity after which a FOOD/CASH purse is expunged", constraints: ">= 31" }
      - { name: expungement_notice_lead_days, type: integer, source: input, default: 30, description: "Days before expungement eligibility at which the notice is recorded", constraints: ">= 1" }
      - { name: default_disaster_expiry_days, type: integer, source: input, default: 30, description: "Days after available_at at which a DISASTER posting expires", constraints: ">= 1" }
      - { name: default_replacement_fee_cents, type: integer, source: input, default: 250, description: "Card replacement fee charged when a program does not override it", constraints: ">= 0" }
      - { name: free_replacements_per_365d, type: integer, source: input, default: 1, description: "Free card replacements per case per trailing 365-day window", constraints: ">= 0" }
      - { name: pin_max_failures, type: integer, source: input, default: 3, description: "Consecutive PIN mismatches that lock a card", constraints: ">= 1" }
      - { name: claim_window_days, type: integer, source: input, default: 60, description: "Skimming claim filing window measured from each referenced transaction's created_at", constraints: ">= 1" }
      - { name: provisional_credit_delay_days, type: integer, source: input, default: 10, description: "Days a claim may remain UNDER_INVESTIGATION before provisional credit is auto-issued", constraints: ">= 1" }
      - { name: provisional_credit_cap_cents, type: integer, source: input, default: 50000, description: "Maximum provisional credit per claim", constraints: ">= 0" }
      - { name: skimming_suspend_threshold, type: integer, source: input, default: 3, description: "Lifetime substantiated-claim incidents at which a retailer is auto-suspended", constraints: ">= 1" }
      - { name: dispute_window_days, type: integer, source: input, default: 15, description: "Days after batch cutoff_at during which a retailer dispute may be filed (inclusive boundary)", constraints: ">= 1" }
      - { name: acquirer_fee_basis_points, type: integer, source: input, default: 75, description: "Per-transaction acquirer fee in basis points of txn total_cents", constraints: ">= 0" }
      - { name: cash_withdrawal_daily_limit_cents, type: integer, source: input, default: 50000, description: "Per-case cumulative cash-withdrawal limit per UTC calendar day", constraints: ">= 0" }
      - { name: cash_withdrawal_multiple_cents, type: integer, source: input, default: 500, description: "Cash withdrawals must be exact multiples of this amount", constraints: ">= 1" }
      - { name: settlement_cutoff_hour_utc, type: integer, source: input, default: 0, description: "UTC hour of the daily settlement cutoff; a settlement day is [day T cutoff_hour, next day T cutoff_hour)", constraints: "0..23" }
      - { name: card_mail_delay_hours, type: integer, source: input, default: 24, description: "Hours after issuance at which a card flips ISSUED -> MAILED on a clock sweep", constraints: ">= 0" }

  - name: BenefitProgram
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> StateContract.id; owning contract" }
      - { name: program_type, type: enum, source: input, description: "FOOD | CASH | DISASTER; at most one FOOD and one CASH per contract; DISASTER may repeat with non-overlapping windows" }
      - { name: program_status, type: enum, source: system, description: "DRAFT | ACTIVE" }
      - { name: item_restriction_mode, type: enum, source: input, default: "STRICT", description: "STRICT | LENIENT; consulted only for FOOD programs; LENIENT allows unknown UPCs as food-eligible with exception_flag" }
      - { name: posting_modulus, type: integer, source: input, default: null, description: "Optional override of StateContract.default_posting_modulus for this program's posting schedule", constraints: "null or 1..28" }
      - { name: availability_hour_utc, type: integer, source: input, default: null, description: "Optional override of StateContract.default_availability_hour_utc", constraints: "null or 0..23" }
      - { name: expungement_inactivity_days, type: integer, source: input, default: null, description: "Optional override of StateContract.default_expungement_inactivity_days; ignored for DISASTER programs", constraints: "null or >= 31" }
      - { name: disaster_expiry_days, type: integer, source: input, default: null, description: "Optional override of StateContract.default_disaster_expiry_days; consulted only for DISASTER programs", constraints: "null or >= 1" }
      - { name: replacement_fee_cents, type: integer, source: input, default: null, description: "Optional override of StateContract.default_replacement_fee_cents", constraints: "null or >= 0" }
      - { name: disaster_window_start, type: string, source: input, default: null, description: "ISO date; required for DISASTER programs, forbidden otherwise; closed-interval window start" }
      - { name: disaster_window_end, type: string, source: input, default: null, description: "ISO date; required for DISASTER programs, forbidden otherwise; closed-interval window end (>= start)" }

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> StateContract.id; owning contract" }
      - { name: retailer_name, type: string, source: input, description: "Retailer display name" }
      - { name: acquirer_reference, type: string, source: input, description: "Acquirer identifier used to group settlement batches; non-empty string" }
      - { name: retailer_status, type: enum, source: system, description: "APPROVED | SUSPENDED" }
      - { name: skimming_incident_count, type: integer, source: system, default: 0, description: "Lifetime count of substantiated skimming claims that reference this retailer" }

  - name: RetailerItem
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; owning retailer" }
      - { name: upc, type: string, source: input, description: "12-digit UPC-A string, ^[0-9]{12}$" }
      - { name: food_eligible, type: boolean, source: input, description: "Whether this item may be charged to a FOOD/DISASTER purse" }
      - { name: effective_from, type: string, source: input, description: "ISO date; eligibility window start (inclusive)" }
      - { name: effective_to, type: string, source: input, default: null, description: "ISO date; eligibility window end (exclusive); null means open-ended (treated as 9999-12-31)" }
      - { name: item_status, type: enum, source: computed, description: "ACTIVE if effective_from <= current clock date < effective_to (or effective_to null); else EXPIRED (covers both not-yet-effective and ended)" }

  - name: CaseAccount
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> StateContract.id; owning contract" }
      - { name: case_identifier, type: string, source: input, description: "Exactly 10 decimal digits, ^[0-9]{10}$; unique within the contract; drives the posting bucket" }
      - { name: head_of_household_name, type: string, source: input, description: "Head of household full name" }
      - { name: account_status, type: enum, source: system, description: "OPEN | SUSPENDED | DORMANT | CLOSED" }
      - { name: replacements_in_window, type: integer, source: computed, description: "Count of this case's cards with replacement_of_card_id != null and created_at >= (current clock - 365 days)" }

  - name: Purse
    parent: null
    common_fields: true
    fields:
      - { name: case_account_id, type: string, source: system, description: "FK -> CaseAccount.id; owning case" }
      - { name: program_id, type: string, source: system, description: "FK -> BenefitProgram.id; the program this purse holds benefits for" }
      - { name: purse_status, type: enum, source: system, description: "OPEN | FROZEN | CLOSED" }
      - { name: last_activity_at, type: datetime, source: system, description: "Timestamp of the most recent LedgerEntry on this purse; null until the first entry; drives expungement" }
      - { name: expungement_notice_sent_at, type: datetime, source: system, default: null, description: "Clock timestamp at which the expungement notice was recorded; cleared back to null on any new ledger activity" }
      - { name: ledger_balance_cents, type: integer, source: computed, description: "Sum over all LedgerEntry rows of this purse: credit types positive, debit types negative (see purse_balance_inquiry calculation)" }
      - { name: spendable_balance_cents, type: integer, source: computed, description: "ledger_balance_cents minus POST_CREDIT amounts whose linked posting is currently SCHEDULED, minus FORFEIT_DEBIT amounts (see purse_balance_inquiry)" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: purse_id, type: string, source: system, description: "FK -> Purse.id; owning purse" }
      - { name: entry_type, type: enum, source: system, description: "POST_CREDIT | PURCHASE_DEBIT | WITHDRAWAL_DEBIT | FEE_DEBIT | VOID_CREDIT | FORFEIT_DEBIT | EXPIRY_DEBIT | EXPUNGE_DEBIT | PROVISIONAL_CREDIT | PROVISIONAL_REVERSAL_DEBIT | CLAIM_CREDIT | CLAIM_REVERSAL_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Always a positive integer; sign derives from entry_type", constraints: "> 0" }
      - { name: posting_id, type: string, source: system, default: null, description: "Informational reference to the BenefitPosting this entry credits/debits (no reverse lookup guaranteed); null when not posting-related" }
      - { name: reference_id, type: string, source: system, default: null, description: "Informational reference id (authorization, claim, or card id) for audit; not a navigable FK" }
      - { name: memo, type: string, source: system, default: null, description: "Short system memo (e.g. 'replacement fee', 'expungement sweep')" }

  - name: BenefitPosting
    parent: null
    common_fields: true
    fields:
      - { name: purse_id, type: string, source: system, description: "FK -> Purse.id; owning purse" }
      - { name: benefit_month, type: string, source: system, description: "YYYY-MM month this posting belongs to" }
      - { name: amount_cents, type: integer, source: system, description: "Credited amount after first-month proration", constraints: "> 0" }
      - { name: prorated, type: boolean, source: system, description: "True when first-month proration reduced the run amount" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date the benefit is scheduled (bucket day of benefit_month)" }
      - { name: available_at, type: datetime, source: system, description: "UTC instant the posting becomes spendable (posting_bucket_schedule calculation)" }
      - { name: posting_status, type: enum, source: system, description: "SCHEDULED | AVAILABLE | EXPUNGED | EXPIRED | FORFEITED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Clock timestamp of the transition into EXPUNGED | EXPIRED | FORFEITED" }

  - name: Card
    parent: null
    common_fields: true
    fields:
      - { name: case_account_id, type: string, source: system, description: "FK -> CaseAccount.id; owning case" }
      - { name: pan_token, type: string, source: system, description: "Server-minted card token" }
      - { name: card_status, type: enum, source: system, description: "ISSUED | MAILED | ACTIVE | PIN_LOCKED | REPLACED | DEACTIVATED" }
      - { name: pin_secret, type: string, source: system, default: null, description: "Stored PIN value set by activate/pin-reset; write-only in responses is NOT required (returned as masked '****')" }
      - { name: pin_fail_count, type: integer, source: system, default: 0, description: "Consecutive PIN mismatches since last success or reset" }
      - { name: replacement_of_card_id, type: string, source: system, default: null, description: "Informational self-reference to the card this one replaces; not a navigable FK (trace via case card list)" }
      - { name: fee_charged_cents, type: integer, source: system, default: null, description: "Replacement fee actually debited for issuing this card; 0 for a free-allowance replacement; null for the original card" }
      - { name: fee_waived, type: boolean, source: system, default: false, description: "True when the replacement fee was waived because no eligible purse could absorb it" }
      - { name: mailed_at, type: datetime, source: system, default: null, description: "Clock timestamp of ISSUED -> MAILED" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Clock timestamp of MAILED -> ACTIVE" }

  - name: PurchaseTransaction
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id; retailer that ran the authorization (== X-User-ID of the RetailerSystem actor)" }
      - { name: case_account_id, type: string, source: system, description: "Denormalized case id captured at authorization time from the card; informational, no reverse lookup guaranteed" }
      - { name: card_id, type: string, source: system, description: "Card used; informational reference, no reverse lookup guaranteed" }
      - { name: authorization_type, type: enum, source: input, description: "PURCHASE | CASH_WITHDRAWAL" }
      - { name: items, type: array, source: input, default: null, description: "Required for PURCHASE: [{upc, quantity, unit_price_cents}]; forbidden for CASH_WITHDRAWAL" }
      - { name: withdrawal_amount_cents, type: integer, source: input, default: null, description: "Required for CASH_WITHDRAWAL; forbidden for PURCHASE" }
      - { name: food_charge_cents, type: integer, source: computed, description: "Amount charged to FOOD+DISASTER purses (split per split_tender_authorization)" }
      - { name: cash_charge_cents, type: integer, source: computed, description: "Amount charged to the CASH purse" }
      - { name: disaster_charge_cents, type: integer, source: computed, description: "Portion of the food-eligible total absorbed by the DISASTER purse" }
      - { name: total_cents, type: integer, source: computed, description: "food_charge_cents + cash_charge_cents (disaster_charge_cents is a sub-division of food_charge_cents, never added separately)" }
      - { name: exception_flag_count, type: integer, source: computed, default: 0, description: "Number of line items allowed via LENIENT exception (unknown UPC under a LENIENT FOOD program)" }
      - { name: txn_status, type: enum, source: system, description: "AUTHORIZED | VOIDED | SETTLED" }
      - { name: batch_id, type: string, source: system, default: null, description: "SettlementBatch this transaction settled into; informational, set by the cutoff sweep" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Clock timestamp of the void" }

  - name: SkimmingClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_account_id, type: string, source: system, description: "FK -> CaseAccount.id; owning case" }
      - { name: card_id, type: string, source: input, description: "Card claimed compromised; informational reference, no reverse lookup guaranteed" }
      - { name: authorization_ids, type: array, source: input, description: "1..20 PurchaseTransaction ids claimed as fraudulent; informational references (validated, but no reverse lookup guaranteed)" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total amount claimed", constraints: "> 0" }
      - { name: incident_description, type: string, source: input, description: "Free-text description of the skimming incident" }
      - { name: freeze_purse, type: boolean, source: input, default: true, description: "When true, every purse charged by the referenced transactions flips OPEN -> FROZEN at filing" }
      - { name: investigation_status, type: enum, source: system, description: "FILED | UNDER_INVESTIGATION | SUBSTANTIATED | UNSUBSTANTIATED" }
      - { name: credit_status, type: enum, source: system, description: "NONE | PROVISIONAL | FINAL | REVERSED; independent dimension from investigation_status" }
      - { name: provisional_credit_cents, type: integer, source: system, default: 0, description: "Provisional credit issued by the delay sweep (0 until issued)" }
      - { name: provisional_credited_at, type: datetime, source: system, default: null, description: "Clock timestamp provisional credit was issued" }
      - { name: substantiated_amount_cents, type: integer, source: system, default: null, description: "Amount confirmed at adjudication (input on the adjudicating call)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer (drives segregation-of-duties)" }
      - { name: filed_by_role, type: string, source: system, description: "Role of the filer: Cardholder | CardholderServices" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the StateAdmin adjudicator" }
      - { name: investigated_at, type: datetime, source: system, default: null, description: "Clock timestamp of FILED -> UNDER_INVESTIGATION (starts the provisional-credit delay)" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock timestamp of adjudication" }

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> StateContract.id; owning contract" }
      - { name: acquirer_reference, type: string, source: system, description: "Acquirer this batch settles (copied from the settled transactions' retailers)" }
      - { name: settlement_date, type: string, source: system, description: "ISO date of the settled day [settlement_date T cutoff_hour, next day T cutoff_hour)" }
      - { name: cutoff_at, type: datetime, source: system, description: "Clock instant of the cutoff boundary that created this batch (start of the following day)" }
      - { name: batch_status, type: enum, source: system, description: "CUTOFF | DISPUTED | RECONCILED" }
      - { name: gross_settled_cents, type: integer, source: computed, description: "Sum of total_cents over transactions SETTLED into this batch; immutable after cutoff" }
      - { name: txn_count, type: integer, source: computed, description: "Count of transactions SETTLED into this batch; immutable after cutoff" }
      - { name: acquirer_fee_cents, type: integer, source: computed, description: "Sum of per-transaction round_half_up(total_cents * acquirer_fee_basis_points / 10000); round-per-transaction-then-sum order is pinned" }
      - { name: adjustment_total_cents, type: integer, source: computed, default: 0, description: "Signed sum of adjustment_cents over this batch's UPHELD disputes (positive = owed to retailer)" }
      - { name: net_position_cents, type: integer, source: computed, description: "gross_settled_cents - acquirer_fee_cents + adjustment_total_cents" }
      - { name: settled_authorization_ids, type: array, source: system, description: "Ids of the PurchaseTransactions settled into this batch, ordered by (created_at ASC)" }
      - { name: actual_settled_cents, type: integer, source: system, default: null, description: "Amount the acquirer actually paid, supplied at reconcile" }
      - { name: reconciled_at, type: datetime, source: system, default: null, description: "Clock timestamp of the successful reconcile" }

  - name: SettlementDispute
    parent: null
    common_fields: true
    fields:
      - { name: settlement_batch_id, type: string, source: system, description: "FK -> SettlementBatch.id; disputed batch" }
      - { name: dispute_type, type: enum, source: system, description: "RECONCILIATION_MISMATCH (system-created on a failed reconcile) | RETAILER_DISPUTE (retailer-filed)" }
      - { name: retailer_id, type: string, source: system, default: null, description: "Filing retailer for RETAILER_DISPUTE (== X-User-ID); informational, no reverse lookup guaranteed; null for system disputes" }
      - { name: dispute_status, type: enum, source: system, description: "OPEN | UPHELD | OVERTURNED" }
      - { name: disputed_amount_cents, type: integer, source: system, description: "Signed disputed amount: retailer input for RETAILER_DISPUTE; (actual_settled_cents - net_position_cents) for RECONCILIATION_MISMATCH" }
      - { name: adjustment_cents, type: integer, source: system, default: null, description: "Signed adjustment applied to batch.adjustment_total_cents when UPHELD (positive = additional amount owed to retailer); required input on an UPHELD decision" }
      - { name: reason, type: string, source: system, description: "Free-text reason (input for retailer disputes; system text for mismatches)" }
      - { name: filed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the retailer filer; null for system disputes" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Clock timestamp of the decision" }

  - name: DataDelivery
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> StateContract.id; owning contract" }
      - { name: delivery_type, type: enum, source: system, description: "DAILY_TRANSACTION_FILE | MONTHLY_INTEGRITY_REPORT" }
      - { name: period, type: string, source: system, description: "ISO date (daily file) or YYYY-MM (monthly report) the payload covers" }
      - { name: delivery_status, type: enum, source: system, description: "GENERATED | DELIVERED; a delivery flips GENERATED -> DELIVERED in the same sweep that creates it" }
      - { name: txn_count, type: integer, source: computed, default: null, description: "Daily only: transactions settled on period across all acquirers" }
      - { name: settled_food_cents, type: integer, source: computed, default: null, description: "Daily only: sum of food_charge_cents over the period's settled transactions" }
      - { name: settled_cash_cents, type: integer, source: computed, default: null, description: "Daily only: sum of cash_charge_cents over the period's settled transactions" }
      - { name: expunged_cents, type: integer, source: computed, default: null, description: "Monthly only: sum of EXPUNGE_DEBIT amounts with created_at in [month-01, next-month-01)" }
      - { name: expired_cents, type: integer, source: computed, default: null, description: "Monthly only: sum of EXPIRY_DEBIT amounts with created_at in [month-01, next-month-01)" }
      - { name: substantiated_claims_count, type: integer, source: computed, default: null, description: "Monthly only: claims whose decided_at falls in the month with investigation_status SUBSTANTIATED" }
      - { name: provisional_credits_outstanding_cents, type: integer, source: computed, default: null, description: "Monthly only: sum of provisional_credit_cents over claims with credit_status PROVISIONAL at month end" }
      - { name: retailer_suspensions_count, type: integer, source: computed, default: null, description: "Monthly only: retailers whose retailer_status became SUSPENDED during the month" }
      - { name: lenient_exceptions_count, type: integer, source: computed, default: null, description: "Monthly only: sum of exception_flag_count over transactions with created_at in the month" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StateContract
    field: contract_status
    initial_state: CONFIGURING
    terminal_states: [CLOSED]
    transitions:
      - from: CONFIGURING
        to: ACTIVE
        trigger: "POST /ebt/contracts/{id}/status with to=ACTIVE"
        actor: StateAdmin
        preconditions:
          - "At least one BenefitProgram exists for the contract (any program_status)"
        side_effects:
          - "Every BenefitProgram of the contract in DRAFT flips to ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ebt/contracts/{id}/status with to=SUSPENDED"
        actor: StateAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ebt/contracts/{id}/status with to=ACTIVE"
        actor: StateAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ebt/contracts/{id}/status with to=CLOSED"
        actor: StateAdmin
        preconditions:
          - "Every CaseAccount of the contract has account_status == CLOSED (else ERR_CONTRACT_HAS_OPEN_OBLIGATIONS)"
          - "No SettlementBatch of the contract in CUTOFF or DISPUTED (else ERR_CONTRACT_HAS_OPEN_OBLIGATIONS)"
          - "No SkimmingClaim of the contract in FILED or UNDER_INVESTIGATION (else ERR_CONTRACT_HAS_OPEN_OBLIGATIONS)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /ebt/contracts/{id}/status with to=CLOSED"
        actor: StateAdmin
        preconditions:
          - "Same three preconditions as ACTIVE -> CLOSED"
        side_effects: []

  - entity: BenefitProgram
    field: program_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system: owning StateContract flips CONFIGURING -> ACTIVE (cascade), OR program is created while its contract is already ACTIVE (created directly in ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "When a program is created directly in ACTIVE (contract already ACTIVE): one Purse (OPEN) is created for every CaseAccount of the contract whose account_status is OPEN, SUSPENDED, or DORMANT"

  - entity: CaseAccount
    field: account_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /ebt/case-accounts/{id}/status with to=SUSPENDED"
        actor: StateAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /ebt/case-accounts/{id}/status with to=OPEN"
        actor: StateAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DORMANT
        trigger: "system: expungement sweep has just expunged this case's purse(s) and, after the sweep, every purse of the case has ledger_balance_cents == 0 AND no BenefitPosting of the case remains in SCHEDULED or AVAILABLE"
        actor: system
        preconditions: []
        side_effects:
          - "Every Card of the case in ISSUED, MAILED, ACTIVE, or PIN_LOCKED flips to DEACTIVATED (cascade link 2 of the expungement chain)"
      - from: DORMANT
        to: OPEN
        trigger: "system: availability sweep flips a BenefitPosting of one of this case's purses SCHEDULED -> AVAILABLE"
        actor: system
        preconditions: []
        side_effects:
          - "Cards remain DEACTIVATED; reactivation of spending power requires a replacement card (with fee rules)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ebt/case-accounts/{id}/status with to=CLOSED"
        actor: StateAdmin
        preconditions:
          - "Every purse of the case has ledger_balance_cents == 0 (else ERR_CASE_BALANCE_NONZERO)"
          - "No SkimmingClaim of the case in FILED or UNDER_INVESTIGATION (else ERR_CASE_HAS_OPEN_CLAIMS)"
        side_effects:
          - "Every Purse of the case in OPEN or FROZEN flips to CLOSED"
          - "Every BenefitPosting of those purses in SCHEDULED flips to FORFEITED and its POST_CREDIT is reversed by a FORFEIT_DEBIT ledger entry of equal amount"
          - "Every Card of the case in ISSUED, MAILED, ACTIVE, or PIN_LOCKED flips to DEACTIVATED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /ebt/case-accounts/{id}/status with to=CLOSED"
        actor: StateAdmin
        preconditions:
          - "Same two preconditions as OPEN -> CLOSED"
        side_effects:
          - "Same three side effects as OPEN -> CLOSED"
      - from: DORMANT
        to: CLOSED
        trigger: "POST /ebt/case-accounts/{id}/status with to=CLOSED"
        actor: StateAdmin
        preconditions:
          - "Same two preconditions as OPEN -> CLOSED (balances are already zero by construction of DORMANT)"
        side_effects:
          - "Same three side effects as OPEN -> CLOSED"

  - entity: Purse
    field: purse_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system: a SkimmingClaim is filed with freeze_purse=true referencing a transaction that charged this purse"
        actor: system
        preconditions: []
        side_effects:
          - "A FROZEN purse rejects PURCHASE_DEBIT, WITHDRAWAL_DEBIT, and FEE_DEBIT attempts with ERR_PURSE_FROZEN; credits (POST_CREDIT, VOID_CREDIT, PROVISIONAL_CREDIT, CLAIM_CREDIT) and EXPUNGE_DEBIT/EXPIRY_DEBIT still apply"
      - from: FROZEN
        to: OPEN
        trigger: "system: every SkimmingClaim that froze this purse reaches a terminal investigation_status (SUBSTANTIATED or UNSUBSTANTIATED) and the owning case is not CLOSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system: owning CaseAccount closes (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: CLOSED
        trigger: "system: owning CaseAccount closes (cascade); reachable only when the freezing claim is already terminal, which the case-close precondition guarantees"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BenefitPosting
    field: posting_status
    initial_state: SCHEDULED
    terminal_states: [EXPUNGED, EXPIRED, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: AVAILABLE
        trigger: "system: availability sweep when current clock >= available_at AND the owning purse is not CLOSED"
        actor: system
        preconditions:
          - "current clock >= available_at (inclusive boundary)"
          - "owning Purse purse_status != CLOSED (FROZEN purses still receive availability)"
        side_effects:
          - "If the owning case is DORMANT, the case flips DORMANT -> OPEN (bubble-up)"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "system: availability sweep when current clock >= available_at AND the owning purse IS CLOSED; or the case-close cascade"
        actor: system
        preconditions: []
        side_effects:
          - "A FORFEIT_DEBIT ledger entry of equal amount reverses the posting's POST_CREDIT on the owning purse"
      - from: AVAILABLE
        to: EXPUNGED
        trigger: "system: expungement sweep (FOOD and CASH programs only) when current clock >= last_activity_at + effective expungement_inactivity_days (inclusive)"
        actor: system
        preconditions:
          - "Posting belongs to a FOOD or CASH purse (DISASTER purses are exempt from expungement)"
        side_effects:
          - "One EXPUNGE_DEBIT ledger entry per purse zeroes its full remaining ledger_balance_cents (all AVAILABLE postings of that purse flip to EXPUNGED together)"
          - "Purse expungement_notice_sent_at reset to null"
          - "If afterwards every purse of the case has ledger_balance_cents == 0 and no posting of the case remains SCHEDULED or AVAILABLE, the CaseAccount flips OPEN -> DORMANT (cascade link 2), which then deactivates its cards (cascade link 3)"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system: disaster-expiry sweep (DISASTER programs only) when current clock >= available_at + effective disaster_expiry_days (inclusive)"
        actor: system
        preconditions:
          - "Posting belongs to a DISASTER purse"
        side_effects:
          - "An EXPIRY_DEBIT ledger entry of the unspent portion (fifo_benefit_consumption) is posted to the DISASTER purse"
      - from: AVAILABLE
        to: FORFEITED
        trigger: "system: case-close cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Card
    field: card_status
    initial_state: ISSUED
    terminal_states: [REPLACED, DEACTIVATED]
    transitions:
      - from: ISSUED
        to: MAILED
        trigger: "system: card-mail sweep when current clock >= created_at + card_mail_delay_hours (inclusive)"
        actor: system
        preconditions: []
        side_effects:
          - "mailed_at set to the sweep's clock timestamp"
      - from: MAILED
        to: ACTIVE
        trigger: "POST /ebt/cards/{id}/activate"
        actor: "Cardholder (owning case) or CardholderServices"
        preconditions:
          - "Owning CaseAccount account_status == OPEN (ERR_CASE_NOT_OPEN when SUSPENDED or DORMANT)"
        side_effects:
          - "pin_secret set from input; pin_fail_count reset to 0; activated_at set"
      - from: ACTIVE
        to: PIN_LOCKED
        trigger: "system: a PIN mismatch raises pin_fail_count to the contract's pin_max_failures"
        actor: system
        preconditions: []
        side_effects: []
      - from: PIN_LOCKED
        to: ACTIVE
        trigger: "POST /ebt/cards/{id}/pin-reset"
        actor: "CardholderServices (any) or Cardholder (owning case, requires current_pin)"
        preconditions: []
        side_effects:
          - "pin_secret set from new_pin; pin_fail_count reset to 0"
      - from: ACTIVE
        to: REPLACED
        trigger: "POST /ebt/cards/{id}/replace"
        actor: "Cardholder (owning case) or CardholderServices"
        preconditions:
          - "Owning CaseAccount account_status == OPEN (ERR_CASE_NOT_OPEN otherwise)"
        side_effects:
          - "A new Card is created in ISSUED with case_account_id copied, replacement_of_card_id = this card's id"
          - "replacement_fee_assessment runs: free allowance, else FEE_DEBIT on the selected purse, else fee_waived=true on the new card"
      - from: PIN_LOCKED
        to: REPLACED
        trigger: "POST /ebt/cards/{id}/replace"
        actor: "Cardholder (owning case) or CardholderServices"
        preconditions:
          - "Owning CaseAccount account_status == OPEN"
        side_effects:
          - "Same side effects as ACTIVE -> REPLACED"
      - from: ISSUED
        to: DEACTIVATED
        trigger: "system: owning case flips to DORMANT or CLOSED (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MAILED
        to: DEACTIVATED
        trigger: "system: owning case flips to DORMANT or CLOSED (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "system: owning case flips to DORMANT or CLOSED (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PIN_LOCKED
        to: DEACTIVATED
        trigger: "system: owning case flips to DORMANT or CLOSED (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PurchaseTransaction
    field: txn_status
    initial_state: AUTHORIZED
    terminal_states: [VOIDED, SETTLED]
    transitions:
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /ebt/authorizations/{id}/void"
        actor: "RetailerSystem (owning retailer only)"
        preconditions:
          - "Current clock's UTC calendar date == created_at's UTC calendar date (ERR_VOID_WINDOW_EXPIRED otherwise)"
        side_effects:
          - "For each purse debited by the authorization, a VOID_CREDIT ledger entry of the exact debited amount is posted (purse balance restored exactly)"
          - "voided_at set"
      - from: AUTHORIZED
        to: SETTLED
        trigger: "system: settlement-cutoff sweep for the transaction's settlement day"
        actor: system
        preconditions: []
        side_effects:
          - "batch_id set to the created SettlementBatch id; transaction appended to batch.settled_authorization_ids in (created_at ASC) order"

  - entity: SkimmingClaim
    field: investigation_status
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: FILED
        to: UNDER_INVESTIGATION
        trigger: "POST /ebt/claims/{id}/status with to=UNDER_INVESTIGATION"
        actor: CardholderServices
        preconditions:
          - "Segregation of duties: if filed_by_role == CardholderServices, the acting X-User-ID MUST differ from filed_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "investigated_at set (starts the provisional-credit delay clock)"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /ebt/claims/{id}/status with to=SUBSTANTIATED (substantiated_amount_cents required)"
        actor: StateAdmin
        preconditions:
          - "substantiated_amount_cents present and 0 < substantiated_amount_cents <= claimed_amount_cents (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "claim_credit_resolution runs: final credit = min(substantiated_amount_cents, claimed_amount_cents); delta vs any provisional credit is posted (CLAIM_CREDIT or CLAIM_REVERSAL_DEBIT) to the target purse; credit_status -> FINAL"
          - "decided_by_user_id and decided_at set"
          - "Every purse FROZEN by this claim flips FROZEN -> OPEN when its case is not CLOSED"
          - "For each distinct retailer among the referenced transactions: retailer.skimming_incident_count += 1"
          - "Any retailer whose skimming_incident_count reaches the contract's skimming_suspend_threshold flips APPROVED -> SUSPENDED (cascade link 2)"
      - from: UNDER_INVESTIGATION
        to: UNSUBSTANTIATED
        trigger: "POST /ebt/claims/{id}/status with to=UNSUBSTANTIATED"
        actor: StateAdmin
        preconditions: []
        side_effects:
          - "If credit_status == PROVISIONAL, a PROVISIONAL_REVERSAL_DEBIT of provisional_credit_cents is posted to the credited purse and credit_status -> REVERSED; if NONE, credit_status stays NONE"
          - "decided_by_user_id and decided_at set"
          - "Every purse FROZEN by this claim flips FROZEN -> OPEN when its case is not CLOSED"

  - entity: SkimmingClaimCredit
    field: credit_status
    note: "Independent state dimension of SkimmingClaim (parallel dimensions on one entity; transitions are driven by the same triggers listed under SkimmingClaim plus the provisional-credit sweep)"
    entity_alias_of: SkimmingClaim
    initial_state: NONE
    terminal_states: [FINAL, REVERSED]
    transitions:
      - from: NONE
        to: PROVISIONAL
        trigger: "system: provisional-credit sweep when current clock >= investigated_at + provisional_credit_delay_days (inclusive) and investigation_status is still UNDER_INVESTIGATION"
        actor: system
        preconditions: []
        side_effects:
          - "PROVISIONAL_CREDIT of min(claimed_amount_cents, provisional_credit_cap_cents) posted to the target purse; provisional_credit_cents and provisional_credited_at set"
      - from: NONE
        to: FINAL
        trigger: "adjudication to SUBSTANTIATED before any provisional credit"
        actor: StateAdmin
        preconditions: []
        side_effects:
          - "CLAIM_CREDIT of the final credit posted to the target purse"
      - from: PROVISIONAL
        to: FINAL
        trigger: "adjudication to SUBSTANTIATED after provisional credit"
        actor: StateAdmin
        preconditions: []
        side_effects:
          - "If final > provisional: CLAIM_CREDIT of (final - provisional); if final < provisional: CLAIM_REVERSAL_DEBIT of (provisional - final); equal: no entry"
      - from: PROVISIONAL
        to: REVERSED
        trigger: "adjudication to UNSUBSTANTIATED after provisional credit"
        actor: StateAdmin
        preconditions: []
        side_effects:
          - "PROVISIONAL_REVERSAL_DEBIT of the full provisional_credit_cents"

  - entity: SettlementBatch
    field: batch_status
    initial_state: CUTOFF
    terminal_states: [RECONCILED]
    transitions:
      - from: CUTOFF
        to: RECONCILED
        trigger: "POST /ebt/settlement-batches/{id}/reconcile with actual_settled_cents == net_position_cents"
        actor: StateAdmin
        preconditions:
          - "No SettlementDispute of this batch in OPEN (ERR_BATCH_HAS_OPEN_DISPUTES)"
          - "actual_settled_cents == net_position_cents at reconcile time (mismatch routes to DISPUTED instead; no error)"
        side_effects:
          - "reconciled_at set"
      - from: CUTOFF
        to: DISPUTED
        trigger: "POST /ebt/settlement-batches/{id}/reconcile with actual_settled_cents != net_position_cents, OR system when a retailer dispute is filed against this batch while CUTOFF"
        actor: "StateAdmin (reconcile mismatch) or system (dispute filing)"
        preconditions: []
        side_effects:
          - "On reconcile mismatch: a SettlementDispute (dispute_type RECONCILIATION_MISMATCH, dispute_status OPEN, disputed_amount_cents = actual_settled_cents - net_position_cents) is created"
          - "On retailer dispute filing while CUTOFF: batch flips to DISPUTED with no additional record"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /ebt/settlement-batches/{id}/reconcile with actual_settled_cents == net_position_cents (re-reconcile after disputes are decided)"
        actor: StateAdmin
        preconditions:
          - "No SettlementDispute of this batch in OPEN (ERR_BATCH_HAS_OPEN_DISPUTES)"
          - "actual_settled_cents == net_position_cents at reconcile time"
        side_effects:
          - "reconciled_at set"
      - from: DISPUTED
        to: DISPUTED
        trigger: "POST /ebt/settlement-batches/{id}/reconcile with mismatched actual_settled_cents (creates another RECONCILIATION_MISMATCH dispute), retailer dispute filing, or dispute decisions that leave the batch undecided"
        actor: "StateAdmin or system"
        preconditions: []
        side_effects:
          - "On each mismatched reconcile attempt: one more OPEN RECONCILIATION_MISMATCH dispute is created"
        note: "Self-loop keeps the batch in DISPUTED; the batch can only leave via a matched reconcile with zero OPEN disputes"

  - entity: SettlementDispute
    field: dispute_status
    initial_state: OPEN
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /ebt/disputes/{id}/status with to=UPHELD (adjustment_cents required, signed)"
        actor: StateAdmin
        preconditions:
          - "adjustment_cents present (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "adjustment_cents stored; batch.adjustment_total_cents recomputed as the signed sum over UPHELD disputes; batch.net_position_cents recomputed"
      - from: OPEN
        to: OVERTURNED
        trigger: "POST /ebt/disputes/{id}/status with to=OVERTURNED"
        actor: StateAdmin
        preconditions: []
        side_effects:
          - "No adjustment applied; batch totals unchanged"

  - entity: Retailer
    field: retailer_status
    initial_state: APPROVED
    terminal_states: []
    transitions:
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /ebt/retailers/{id}/status with to=SUSPENDED, OR system when a substantiated-claim cascade raises skimming_incident_count to the contract's skimming_suspend_threshold"
        actor: "StateAdmin or system"
        preconditions: []
        side_effects:
          - "A SUSPENDED retailer rejects new authorizations and item-file uploads with ERR_RETAILER_NOT_ACTIVE (existing transactions and batches are unaffected)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /ebt/retailers/{id}/status with to=APPROVED"
        actor: StateAdmin
        preconditions: []
        side_effects: []

  - entity: DataDelivery
    field: delivery_status
    initial_state: GENERATED
    terminal_states: [DELIVERED]
    transitions:
      - from: GENERATED
        to: DELIVERED
        trigger: "system: the same sweep that creates the delivery immediately marks it DELIVERED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-status-stale-version
    parent_entity: CaseAccount
    write_endpoint: "POST /ebt/case-accounts/{id}/status"
    occ_field: expected_case_account_version
    description: |
      A case status change carrying an expected_case_account_version that no
      longer matches the case's current version is rejected. This captures the
      case where another writer has just changed the case's status (a legal
      transition such as SUSPENDED -> OPEN) since the client last observed it,
      making the current writer's view of the account stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: posting_bucket_schedule
    trigger: "allotment run creates a BenefitPosting"
    algorithm: projection
    formula: |
      M = program.posting_modulus if not null else contract.default_posting_modulus
      bucket = int(case.case_identifier) MOD M            # 0..M-1
      base_date = date(benefit_month, 1) + bucket days    # e.g. bucket 0 -> the 1st
      first_month = (case.created_at's UTC date falls inside benefit_month)
      available_date = max(base_date, case_created_date) if first_month else base_date
      H = program.availability_hour_utc if not null else contract.default_availability_hour_utc
      available_at = available_date T H:00:00Z
      scheduled_date = available_date
    input_set: "the purse's case (case_identifier, created_at), the program's overrides, the contract defaults, the run's benefit_month"
    constants:
      DEFAULT_POSTING_MODULUS: 10
      DEFAULT_AVAILABILITY_HOUR_UTC: 6
    precision: "date/hour arithmetic in UTC; no rounding"

  - name: first_month_proration
    trigger: "allotment run creates a BenefitPosting whose case was created inside benefit_month"
    algorithm: threshold
    formula: |
      if case_created_date inside benefit_month:
        days_in_month = calendar days of benefit_month
        remaining_days = days from case_created_date through month end, inclusive
        amount_cents = round_half_up(run_amount_cents * remaining_days / days_in_month)
        prorated = (amount_cents != run_amount_cents)
      else:
        amount_cents = run_amount_cents
        prorated = false
    input_set: "case.created_at (UTC date), run amount_cents, benefit_month"
    constants: {}
    precision: "integer cents, round_half_up, applied exactly once"

  - name: purse_balance_inquiry
    trigger: "every read of a Purse (GET /ebt/purses/{id}, GET /ebt/purses list) and every balance-gated validation"
    algorithm: aggregation
    formula: |
      credit types = {POST_CREDIT, VOID_CREDIT, PROVISIONAL_CREDIT, CLAIM_CREDIT}
      debit types  = {PURCHASE_DEBIT, WITHDRAWAL_DEBIT, FEE_DEBIT, FORFEIT_DEBIT,
                      EXPIRY_DEBIT, EXPUNGE_DEBIT, PROVISIONAL_REVERSAL_DEBIT,
                      CLAIM_REVERSAL_DEBIT}
      ledger_balance_cents    = sum(+amount for credit types, -amount for debit types) over ALL LedgerEntry rows of the purse
      spendable_balance_cents = signed sum over the SAME rows, EXCLUDING:
                                  (a) POST_CREDIT entries whose linked posting is currently in {SCHEDULED, FORFEITED}
                                  (b) FORFEIT_DEBIT entries
      # Cross-check over the posting lifecycle:
      #   posting SCHEDULED:           ledger +X, spendable 0      (future money)
      #   posting AVAILABLE:           ledger +X, spendable +X
      #   SCHEDULED -> FORFEITED:      ledger +X-X = 0, spendable 0 (credit and its reversal both excluded)
      #   AVAILABLE -> EXPUNGED/EXPIRED: ledger 0, spendable 0      (credit counted, expunge/expiry debit counted)
      # Equivalently: spendable = ledger_balance - sum(POST_CREDIT of postings currently SCHEDULED)
      #   - sum(POST_CREDIT of postings currently FORFEITED) + sum(FORFEIT_DEBIT entries)
    input_set: "all LedgerEntry rows of the purse (no status filter on entries themselves); posting status resolved at read time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: LEDGER
        when: "audit, expungement zeroing, close preconditions"
        difference: "counts every entry, including credits whose posting is still SCHEDULED (future money)"
      - name: SPENDABLE
        when: "purchase/withdrawal sufficiency checks, replacement-fee absorption checks, balance inquiry display"
        difference: "excludes POST_CREDIT of postings currently SCHEDULED or FORFEITED and excludes FORFEIT_DEBIT reversals, so scheduled money is invisible until availability while expunged/expired money is fully removed in both views"

  - name: fifo_benefit_consumption
    trigger: "disaster-expiry sweep computing a posting's unspent portion; also the attribution used for reporting"
    algorithm: chronological
    formula: |
      For purse P, replay its LedgerEntry rows in (created_at ASC) order.
      Postings are ordered by (available_at ASC, created_at ASC).
      Allocate each PURCHASE_DEBIT / WITHDRAWAL_DEBIT / FEE_DEBIT amount to the
      oldest posting with remaining unspent balance first (waterfall over that
      ordering). EXPUNGE_DEBIT / EXPIRY_DEBIT / FORFEIT_DEBIT / credit entries do
      not consume postings.
      unspent(posting) = posting.amount_cents - allocated(posting)
    input_set: "LedgerEntry rows of the purse restricted to the three consuming debit types; BenefitPosting rows of the purse that ever reached AVAILABLE"
    constants: {}
    precision: "integer cents; ordering tie-break is created_at ASC (never id)"

  - name: expungement_sweep
    trigger: "clock advance (part of every set_current_utc sweep, step 3)"
    algorithm: threshold
    formula: |
      For each FOOD/CASH purse not CLOSED with last_activity_at != null:
        D = program.expungement_inactivity_days if not null else contract.default_expungement_inactivity_days
        L = contract.expungement_notice_lead_days
        eligible_at = last_activity_at + D days
        notice_at   = eligible_at - L days
        if purse.expungement_notice_sent_at is null and now >= notice_at and now < eligible_at:
          record notice: expungement_notice_sent_at = now
        if now >= eligible_at:   # inclusive boundary
          expunge: every AVAILABLE posting of the purse -> EXPUNGED; one EXPUNGE_DEBIT of the purse's full ledger_balance_cents; notice flag reset to null
      Any new LedgerEntry on a purse sets last_activity_at = entry.created_at and clears expungement_notice_sent_at to null.
    input_set: "FOOD/CASH purses of the contract with purse_status in {OPEN, FROZEN}"
    constants:
      DEFAULT_EXPUNGEMENT_INACTIVITY_DAYS: 90
      EXPUNGEMENT_NOTICE_LEAD_DAYS: 30
    precision: "second-precision UTC timestamps; boundaries inclusive at the eligible edge (now >= eligible_at)"

  - name: replacement_fee_assessment
    trigger: "POST /ebt/cards/{id}/replace"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (the fee amount depends on which purse absorbs it,
      and absorbability depends on the purse balance vs that fee):
      1. If case.replacements_in_window < contract.free_replacements_per_365d:
           fee = 0 (free allowance); new card fee_charged_cents = 0, fee_waived = false. STOP.
      2. For program P in fixed priority order [CASH, FOOD]:
           if the case has a purse of P with purse_status != CLOSED:
             fee_P = P.replacement_fee_cents if not null else contract.default_replacement_fee_cents
             if purse_P.spendable_balance_cents >= fee_P:
               post FEE_DEBIT of fee_P to purse_P (reference_id = new card id);
               new card fee_charged_cents = fee_P, fee_waived = false. STOP.
             (a FROZEN purse cannot absorb the fee: FEE_DEBIT is blocked on FROZEN purses, so skip it)
      3. If no purse absorbed the fee: fee waived; new card fee_charged_cents = 0, fee_waived = true.
      DISASTER purses NEVER absorb replacement fees.
    input_set: "case.replacements_in_window (computed), purses of the case, program fee overrides, contract defaults"
    constants:
      DEFAULT_REPLACEMENT_FEE_CENTS: 250
      FREE_REPLACEMENTS_PER_365D: 1
    precision: "integer cents; no partial debits (a purse either absorbs the full fee or the fee moves on / is waived)"

  - name: split_tender_authorization
    trigger: "POST /ebt/retailers/{id}/authorizations with authorization_type=PURCHASE"
    algorithm: waterfall_allocation
    formula: |
      Resolve each line item (evaluation uses the retailer's covering RetailerItem on the
      current clock date; see item_eligibility resolution):
        food_total_cents = sum(quantity*unit_price_cents over FOOD-eligible items)
        cash_total_cents = sum(quantity*unit_price_cents over non-FOOD-eligible items)
      No-spill rule (each bucket bounded by its own purse; never cross-charged):
        disaster_charge = min(food_total, disaster_purse.spendable)   # only if a DISASTER purse exists and is not CLOSED
        food_charge     = min(food_total - disaster_charge, food_purse.spendable)  # only if a FOOD purse exists and is not CLOSED
        if disaster_charge + food_charge < food_total: reject ERR_INSUFFICIENT_FUNDS
        cash_charge = min(cash_total, cash_purse.spendable)  # only if a CASH purse exists and is not CLOSED
        if cash_charge < cash_total: reject ERR_INSUFFICIENT_FUNDS
        if cash_total > 0 and no CASH purse (not CLOSED) exists: reject ERR_NO_CASH_PURSE
      FROZEN involvement: if food_total > 0 and the FOOD/DISASTER purse charged is FROZEN -> ERR_PURSE_FROZEN; likewise CASH.
      On success: PURCHASE_DEBIT entries post per purse charged (disaster, food, cash).
    input_set: "authorization items, retailer's ACTIVE RetailerItem rows on the current clock date, the case's purses and their spendable balances"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: withdrawal_authorization
    trigger: "POST /ebt/retailers/{id}/authorizations with authorization_type=CASH_WITHDRAWAL"
    algorithm: threshold
    formula: |
      amount = withdrawal_amount_cents
      if no CASH purse (not CLOSED) exists for the case: reject ERR_NO_CASH_PURSE
      if amount % contract.cash_withdrawal_multiple_cents != 0: reject ERR_WITHDRAWAL_MULTIPLE
      day = current clock's UTC calendar date
      used = sum(WITHDRAWAL_DEBIT amounts on the case's CASH purse with created_at in [day 00:00, next day 00:00)
                 and whose transaction is not VOIDED)
      if used + amount > contract.cash_withdrawal_daily_limit_cents: reject ERR_DAILY_LIMIT_EXCEEDED
      # boundary: used + amount == limit is ALLOWED (strictly-greater rejects)
      if cash_purse.spendable_balance_cents < amount: reject ERR_INSUFFICIENT_FUNDS
      On success: WITHDRAWAL_DEBIT of amount posts to the CASH purse.
    input_set: "CASH purse of the card's case, its same-day WITHDRAWAL_DEBIT rows, contract withdrawal constants"
    constants:
      CASH_WITHDRAWAL_DAILY_LIMIT_CENTS: 50000
      CASH_WITHDRAWAL_MULTIPLE_CENTS: 500
    precision: "integer cents"

  - name: acquirer_fee_total
    trigger: "settlement-cutoff sweep, once per created batch"
    algorithm: aggregation
    formula: |
      For each transaction T settled into the batch (order irrelevant to the total):
        fee_T = round_half_up(T.total_cents * contract.acquirer_fee_basis_points / 10000)
      batch.acquirer_fee_cents = sum(fee_T)     # ROUND-PER-TRANSACTION-THEN-SUM is pinned;
                                                # sum-then-round is FORBIDDEN and yields different cents
    input_set: "transactions flipped AUTHORIZED -> SETTLED by this cutoff sweep for this acquirer"
    constants:
      ACQUIRER_FEE_BASIS_POINTS: 75
    precision: "integer cents; per-transaction round_half_up before summation"
    variants:
      - name: ROUND_THEN_SUM
        when: "the operative rule"
        difference: "sum of per-transaction rounded fees"
      - name: SUM_THEN_ROUND
        when: "forbidden alternative kept for test contrast"
        difference: "round_half_up(sum(total_cents) * bp / 10000); e.g. five 67-cent transactions give 5 vs 3 cents"

  - name: settlement_position
    trigger: "every read of a SettlementBatch and every reconcile attempt"
    algorithm: aggregation
    formula: |
      gross = batch.gross_settled_cents           # fixed at cutoff
      fee   = batch.acquirer_fee_cents            # fixed at cutoff
      adj   = sum(adjustment_cents over the batch's UPHELD disputes)   # signed
      net_position_cents = gross - fee + adj
    input_set: "batch fields + its SettlementDispute rows with dispute_status == UPHELD"
    constants: {}
    precision: "integer cents"
    variants:
      - name: GROSS
        when: "acquirer-facing obligation before fees and adjustments"
        difference: "gross_settled_cents only"
      - name: NET
        when: "retailer-facing payable used by reconcile (actual_settled_cents must equal NET)"
        difference: "gross - fee + adjustments; differs from GROSS whenever fee > 0 or any dispute is UPHELD"

  - name: claim_credit_resolution
    trigger: "provisional-credit sweep and claim adjudication"
    algorithm: threshold
    formula: |
      Target purse selection (deterministic):
        food_sum = sum(food_charge_cents over referenced transactions)
        cash_sum = sum(cash_charge_cents over referenced transactions)
        target = the case's CASH purse if cash_sum >= food_sum else the case's FOOD purse
        (the referenced transactions determine the candidate purses; the target purse
         always exists because the case cannot be CLOSED while a claim is open)
      provisional = min(claimed_amount_cents, contract.provisional_credit_cap_cents)
      final       = min(substantiated_amount_cents, claimed_amount_cents)
      On SUBSTANTIATED: post delta = final - provisional_credited (CLAIM_CREDIT if > 0,
      CLAIM_REVERSAL_DEBIT if < 0, nothing if == 0).
      On UNSUBSTANTIATED with PROVISIONAL: PROVISIONAL_REVERSAL_DEBIT of provisional_credit_cents.
    input_set: "the claim, its referenced transactions, the case's purses, contract cap"
    constants:
      PROVISIONAL_CREDIT_CAP_CENTS: 50000
    precision: "integer cents"

  - name: integrity_report_metrics
    trigger: "clock advance that crosses a month boundary (part of every set_current_utc sweep, step 7)"
    algorithm: aggregation
    formula: |
      For the calendar month M = the month that just ended [M-01 00:00, (M+1)-01 00:00) UTC:
        expunged_cents       = sum(EXPUNGE_DEBIT amounts with created_at in M)
        expired_cents        = sum(EXPIRY_DEBIT amounts with created_at in M)
        substantiated_claims_count = count(claims of the contract with decided_at in M and investigation_status == SUBSTANTIATED)
        provisional_credits_outstanding_cents = sum(provisional_credit_cents over claims with credit_status == PROVISIONAL at the month-end instant)
        retailer_suspensions_count = count(retailers of the contract whose APPROVED -> SUSPENDED transition occurred in M)
        lenient_exceptions_count = sum(exception_flag_count over transactions of the contract with created_at in M)
      A MONTHLY_INTEGRITY_REPORT DataDelivery is created with these fields (GENERATED then DELIVERED in the same sweep).
    input_set: "contract-scoped ledger entries, claims, retailers, transactions; month window is half-open [start, end)"
    constants: {}
    precision: "integer cents and counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; segregation of duties: a claim's investigating CardholderServices user must differ from its filer when the filer was also CardholderServices"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all (SOD clause applies to POST /ebt/claims/{id}/status with to=UNDER_INVESTIGATION and returns ERR_SOD_VIOLATION)"
  - priority: 3
    category: existence
    check: "Path template resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Ownership/tenancy: Cardholder may only touch resources of the CaseAccount whose id == X-User-ID; RetailerSystem may only act as/on the Retailer whose id == X-User-ID (path retailer, void target's retailer)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all entity-backed role access"
  - priority: 5
    category: existence
    check: "Request-body references exist (contract_id, case_account_id, card_id, settlement_batch_id, authorization_ids elements)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "endpoints with body references"
  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_case_account_version matches the case's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ebt/case-accounts/{id}/status"
  - priority: 7
    category: state
    check: "Target resource is in a from-state the transition allows (generic invalid transition / terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all status/action endpoints"
  - priority: 8
    category: state
    check: "Contract must be ACTIVE for case creation, program creation, retailer onboarding, item-file upload, allotment runs, authorizations"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ebt/case-accounts, POST /ebt/programs, POST /ebt/retailers, POST /ebt/retailers/{id}/item-files, POST /ebt/contracts/{id}/allotment-runs, POST /ebt/retailers/{id}/authorizations"
  - priority: 9
    category: state
    check: "Case must be OPEN for purchase/withdrawal authorization, claim filing, card issuance, card activation, card replacement"
    error_id: ERR_CASE_NOT_OPEN
    http_status: 409
    applies_to: "POST /ebt/retailers/{id}/authorizations, POST /ebt/claims, POST /ebt/cards, POST /ebt/cards/{id}/activate, POST /ebt/cards/{id}/replace"
  - priority: 10
    category: state
    check: "Retailer must be APPROVED for authorizations and item-file uploads"
    error_id: ERR_RETAILER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ebt/retailers/{id}/authorizations, POST /ebt/retailers/{id}/item-files"
  - priority: 11
    category: state
    check: "Card must be MAILED for activation"
    error_id: ERR_CARD_NOT_MAILED
    http_status: 409
    applies_to: "POST /ebt/cards/{id}/activate"
  - priority: 12
    category: state
    check: "Card must be ACTIVE for authorizations (a PIN_LOCKED or DEACTIVATED/REPLACED/ISSUED/MAILED card cannot spend)"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ebt/retailers/{id}/authorizations"
  - priority: 13
    category: state
    check: "Every purse to be debited must not be FROZEN"
    error_id: ERR_PURSE_FROZEN
    http_status: 409
    applies_to: "POST /ebt/retailers/{id}/authorizations, POST /ebt/cards/{id}/replace (fee absorption skips FROZEN purses instead)"
  - priority: 14
    category: state
    check: "Card must be ACTIVE or PIN_LOCKED for replacement; PIN reset allowed only on ACTIVE or PIN_LOCKED"
    error_id: ERR_REPLACEMENT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /ebt/cards/{id}/replace, POST /ebt/cards/{id}/pin-reset"
  - priority: 15
    category: state
    check: "Transaction must be AUTHORIZED (not VOIDED, not SETTLED) for void"
    error_id: ERR_TXN_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /ebt/authorizations/{id}/void"
  - priority: 16
    category: state
    check: "Batch must have zero OPEN disputes for a successful reconcile"
    error_id: ERR_BATCH_HAS_OPEN_DISPUTES
    http_status: 409
    applies_to: "POST /ebt/settlement-batches/{id}/reconcile (checked before amount comparison; on mismatch-with-open-disputes the dispute error wins)"
  - priority: 17
    category: state
    check: "Case close requires no FILED/UNDER_INVESTIGATION claims; contract close requires all cases CLOSED, no CUTOFF/DISPUTED batches, no open claims"
    error_id: ERR_CASE_HAS_OPEN_CLAIMS
    http_status: 409
    applies_to: "POST /ebt/case-accounts/{id}/status to=CLOSED (ERR_CASE_HAS_OPEN_CLAIMS), POST /ebt/contracts/{id}/status to=CLOSED (ERR_CONTRACT_HAS_OPEN_OBLIGATIONS)"
  - priority: 18
    category: business_safety
    check: "PIN verification: card.pin_secret == input pin; on mismatch pin_fail_count += 1 and at pin_max_failures the card flips ACTIVE -> PIN_LOCKED; a PIN_LOCKED card short-circuits with ERR_PIN_LOCKED before comparing"
    error_id: ERR_PIN_MISMATCH
    http_status: 403
    applies_to: "POST /ebt/retailers/{id}/authorizations (ERR_PIN_MISMATCH / ERR_PIN_LOCKED), POST /ebt/cards/{id}/pin-reset as Cardholder (ERR_PIN_MISMATCH on current_pin)"
  - priority: 19
    category: business_constraint
    check: "Field formats: case_identifier ^[0-9]{10}$; upc ^[0-9]{12}$; state_code ^[A-Z]{2}$; enum membership; items required for PURCHASE / withdrawal_amount_cents required for CASH_WITHDRAWAL; benefit_month format YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all (format/shape failures); dedicated ids: ERR_CASE_IDENTIFIER_INVALID, ERR_UPC_INVALID, ERR_WITHDRAWAL_MULTIPLE (multiple-of check), ERR_ITEM_NOT_ELIGIBLE (eligibility constraint)"
  - priority: 20
    category: business_constraint
    check: "Interval/uniqueness constraints: RetailerItem half-open [effective_from, effective_to) overlap per (retailer_id, upc); DISASTER program closed-window overlap per contract; FOOD/CASH program type uniqueness per contract; case_identifier uniqueness per contract"
    error_id: ERR_ITEM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ebt/retailers/{id}/item-files (ERR_ITEM_WINDOW_OVERLAP), POST /ebt/programs (ERR_DISASTER_WINDOW_OVERLAP, ERR_PROGRAM_TYPE_DUPLICATE), POST /ebt/case-accounts (ERR_CASE_IDENTIFIER_DUPLICATE)"
  - priority: 21
    category: business_temporal
    check: "Temporal windows: void same-UTC-day; claim transactions within claim_window_days; retailer dispute within dispute_window_days of cutoff_at (inclusive); allotment-run benefit_month is the current or next calendar month; DISASTER allotment run's current date inside the disaster window"
    error_id: ERR_VOID_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /ebt/authorizations/{id}/void (ERR_VOID_WINDOW_EXPIRED), POST /ebt/claims (ERR_CLAIM_WINDOW_EXPIRED), POST /ebt/disputes (ERR_DISPUTE_WINDOW_EXPIRED), POST /ebt/contracts/{id}/allotment-runs (ERR_POSTING_MONTH_INVALID)"
  - priority: 22
    category: business_referential
    check: "Cross-references: claimed transactions belong to the filing case; duplicate allotment run (same program + benefit_month already executed)"
    error_id: ERR_CLAIM_TXN_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /ebt/claims (ERR_CLAIM_TXN_CASE_MISMATCH), POST /ebt/contracts/{id}/allotment-runs (ERR_DUPLICATE_POSTING_RUN)"
  - priority: 23
    category: business_fiscal
    check: "Funds/limits: per-purse spendable sufficiency (no cross-purse spill); daily withdrawal limit; claimed amount <= sum of referenced transaction totals; case close requires zero purse balances"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: "POST /ebt/retailers/{id}/authorizations (ERR_INSUFFICIENT_FUNDS, ERR_DAILY_LIMIT_EXCEEDED, ERR_NO_CASH_PURSE), POST /ebt/claims (ERR_CLAIM_AMOUNT_EXCEEDS_REFERENCED), POST /ebt/case-accounts/{id}/status to=CLOSED (ERR_CASE_BALANCE_NONZERO)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform (mounted OUTSIDE api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Mounted OUTSIDE /ebt. Server starts at exactly 2026-09-01T00:00:00Z and never uses wall-clock time. Setting the clock (forward only; backward rejected with ERR_INVALID_REQUEST) runs the pinned sweep pipeline once per call, in this order: (1) posting availability incl. DORMANT reactivation, (2) disaster expiry (FIFO unspent), (3) expungement notices + expungement incl. DORMANT cascade and card deactivation, (4) card mailing, (5) provisional-credit auto-issuance, (6) settlement cutoff batches + daily transaction files, (7) monthly integrity reports. Multi-day jumps apply day-boundary steps per crossed boundary in chronological order."
    roles: [StateAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Runs sweep steps 1-7 pinned above"]

  # --- StateContract ---
  - method: POST
    path: "/ebt/contracts"
    description: "Create a state contract in CONFIGURING with config defaults (any config field may be overridden at creation)"
    roles: [StateAdmin]
    code: 201
    input: ["state_code", "default_posting_modulus?", "default_availability_hour_utc?", "default_expungement_inactivity_days?", "expungement_notice_lead_days?", "default_disaster_expiry_days?", "default_replacement_fee_cents?", "free_replacements_per_365d?", "pin_max_failures?", "claim_window_days?", "provisional_credit_delay_days?", "provisional_credit_cap_cents?", "skimming_suspend_threshold?", "dispute_window_days?", "acquirer_fee_basis_points?", "cash_withdrawal_daily_limit_cents?", "cash_withdrawal_multiple_cents?", "settlement_cutoff_hour_utc?", "card_mail_delay_hours?"]
    output: StateContract
    side_effects: ["contract_status = CONFIGURING"]
  - method: GET
    path: "/ebt/contracts/{id}"
    description: "Read a contract (includes version for OCC-aware clients)"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: []
    output: StateContract
    side_effects: []
  - method: POST
    path: "/ebt/contracts/{id}/status"
    description: "Drive contract transitions: to=ACTIVE (from CONFIGURING or SUSPENDED), to=SUSPENDED (from ACTIVE), to=CLOSED (from ACTIVE or SUSPENDED, with obligation preconditions)"
    roles: [StateAdmin]
    code: 200
    input: [to]
    output: StateContract
    side_effects: ["On CONFIGURING -> ACTIVE: all DRAFT programs flip to ACTIVE", "increments StateContract.version by 1"]
  - method: GET
    path: "/ebt/contracts/{id}/programs"
    description: "List programs of a contract"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: ["limit?", "offset?"]
    output: BenefitProgram[]
    side_effects: []
  - method: POST
    path: "/ebt/programs"
    description: "Create a benefit program. Contract must be CONFIGURING or ACTIVE. Created DRAFT when the contract is CONFIGURING; created ACTIVE when the contract is already ACTIVE (then purses are created for all non-CLOSED cases). FOOD/CASH unique per contract; DISASTER windows are closed intervals and may not touch another DISASTER window of the same contract."
    roles: [StateAdmin]
    code: 201
    input: ["contract_id", "program_type", "item_restriction_mode?", "posting_modulus?", "availability_hour_utc?", "expungement_inactivity_days?", "disaster_expiry_days?", "replacement_fee_cents?", "disaster_window_start?", "disaster_window_end?"]
    output: BenefitProgram
    side_effects: ["If created ACTIVE: one OPEN Purse per CaseAccount of the contract with account_status in {OPEN, SUSPENDED, DORMANT}"]
  - method: GET
    path: "/ebt/contracts/{id}/retailers"
    description: "List retailers of a contract"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: ["limit?", "offset?"]
    output: Retailer[]
    side_effects: []
  - method: POST
    path: "/ebt/retailers"
    description: "Onboard a retailer (APPROVED). Contract must be ACTIVE."
    roles: [StateAdmin]
    code: 201
    input: ["contract_id", "retailer_name", "acquirer_reference"]
    output: Retailer
    side_effects: ["retailer_status = APPROVED, skimming_incident_count = 0"]
  - method: POST
    path: "/ebt/contracts/{id}/allotment-runs"
    description: "Bulk-create one BenefitPosting per eligible purse for (program_id, benefit_month). Eligible: purses of the program whose case account_status is OPEN or DORMANT and purse_status != CLOSED. Cases SUSPENDED are skipped. Duplicate run for the same program+month is rejected. Posting schedule and first-month proration per posting_bucket_schedule / first_month_proration. A POST_CREDIT ledger entry is created immediately for each posting (its credit is SCHEDULED money until availability)."
    roles: [StateAdmin]
    code: 201
    input: ["program_id", "benefit_month", "amount_cents"]
    output: { created_count: integer, skipped_count: integer, posting_ids: "string[]" }
    side_effects: ["BenefitPosting rows created in SCHEDULED", "POST_CREDIT LedgerEntry per posting", "purse.last_activity_at updated by each POST_CREDIT"]
  - method: GET
    path: "/ebt/contracts/{id}/data-deliveries"
    description: "List data deliveries of a contract (daily transaction files and monthly integrity reports)"
    roles: [StateAdmin]
    code: 200
    input: ["delivery_type?", "limit?", "offset?"]
    output: DataDelivery[]
    side_effects: []

  # --- Retailer ---
  - method: GET
    path: "/ebt/retailers/{id}"
    description: "Read a retailer"
    roles: [StateAdmin, CardholderServices, RetailerSystem]
    code: 200
    input: []
    output: Retailer
    side_effects: []
  - method: POST
    path: "/ebt/retailers/{id}/status"
    description: "Manual retailer status control: to=SUSPENDED (from APPROVED) or to=APPROVED (from SUSPENDED). Auto-suspension via the skimming threshold cascade happens without this endpoint."
    roles: [StateAdmin]
    code: 200
    input: [to]
    output: Retailer
    side_effects: ["increments Retailer.version by 1"]
  - method: POST
    path: "/ebt/retailers/{id}/item-files"
    description: "Atomically upload an item-eligibility file. Contract ACTIVE and retailer APPROVED required. Every item validated (UPC format, window overlap per (retailer_id, upc) with half-open [effective_from, effective_to) semantics — adjacency allowed); any failure rejects the whole file."
    roles: [RetailerSystem]
    code: 201
    input: [items]
    output: { created_count: integer }
    side_effects: ["RetailerItem rows created"]
  - method: GET
    path: "/ebt/retailers/{id}/items"
    description: "List item-eligibility records of a retailer (item_status computed against the current clock)"
    roles: [StateAdmin, CardholderServices, RetailerSystem]
    code: 200
    input: ["upc?", "limit?", "offset?"]
    output: RetailerItem[]
    side_effects: []
  - method: POST
    path: "/ebt/retailers/{id}/authorizations"
    description: "Point-of-sale authorization (purchase or cash withdrawal). Path retailer must equal X-User-ID. Full gate chain per §1.4: contract ACTIVE, case OPEN, retailer APPROVED, card ACTIVE (PIN gate), purses not FROZEN, item eligibility per program item_restriction_mode (STRICT rejects unknown UPC; LENIENT allows as food-eligible with exception_flag_count), split-tender waterfall with no cross-purse spill, withdrawal multiple and daily-limit checks."
    roles: [RetailerSystem]
    code: 201
    input: ["card_id", "pin", "authorization_type", "items?", "withdrawal_amount_cents?"]
    output: PurchaseTransaction
    side_effects: ["PURCHASE_DEBIT / WITHDRAWAL_DEBIT LedgerEntry rows per charged purse", "purse.last_activity_at updated", "on PIN mismatch: card.pin_fail_count += 1 and possible ACTIVE -> PIN_LOCKED"]
  - method: GET
    path: "/ebt/retailers/{id}/authorizations"
    description: "List authorizations of a retailer"
    roles: [StateAdmin, CardholderServices, RetailerSystem]
    code: 200
    input: ["txn_status?", "limit?", "offset?"]
    output: PurchaseTransaction[]
    side_effects: []

  # --- CaseAccount / Purse ---
  - method: GET
    path: "/ebt/case-accounts"
    description: "List case accounts (filterable by contract)"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: ["contract_id?", "account_status?", "limit?", "offset?"]
    output: CaseAccount[]
    side_effects: []
  - method: POST
    path: "/ebt/case-accounts"
    description: "Open a case account. Contract must be ACTIVE. case_identifier is exactly 10 digits, unique per contract. One OPEN Purse is created for every ACTIVE program of the contract."
    roles: [StateAdmin]
    code: 201
    input: ["contract_id", "case_identifier", "head_of_household_name"]
    output: CaseAccount
    side_effects: ["One OPEN Purse per ACTIVE program of the contract"]
  - method: GET
    path: "/ebt/case-accounts/{id}"
    description: "Read a case account (Cardholder restricted to own case id == X-User-ID)"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: []
    output: CaseAccount
    side_effects: []
  - method: POST
    path: "/ebt/case-accounts/{id}/status"
    description: "Drive case transitions: to=SUSPENDED (from OPEN), to=OPEN (from SUSPENDED), to=CLOSED (from OPEN/SUSPENDED/DORMANT with zero-balance and no-open-claims preconditions). OCC: expected_case_account_version must match the case's current version."
    roles: [StateAdmin]
    code: 200
    input: ["to", "expected_case_account_version"]
    output: CaseAccount
    side_effects: ["increments CaseAccount.version by 1", "On close: purses -> CLOSED, SCHEDULED postings -> FORFEITED with FORFEIT_DEBIT reversal, cards -> DEACTIVATED"]
  - method: GET
    path: "/ebt/case-accounts/{id}/cards"
    description: "List cards of a case (includes replacement lineage fields)"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: ["limit?", "offset?"]
    output: Card[]
    side_effects: []
  - method: GET
    path: "/ebt/case-accounts/{id}/claims"
    description: "List skimming claims of a case"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: ["limit?", "offset?"]
    output: SkimmingClaim[]
    side_effects: []
  - method: POST
    path: "/ebt/cards"
    description: "Issue the initial card for a case (ISSUED). Case must be OPEN."
    roles: [CardholderServices]
    code: 201
    input: [case_account_id]
    output: Card
    side_effects: ["card_status = ISSUED, pan_token minted"]
  - method: POST
    path: "/ebt/claims"
    description: "File a skimming claim. Case must not be CLOSED and must be OPEN (SUSPENDED/DORMANT rejected). Each referenced transaction must belong to the case and be within claim_window_days. claimed_amount_cents must not exceed the sum of referenced transaction totals. When freeze_purse=true, every purse charged by the referenced transactions flips OPEN -> FROZEN."
    roles: [Cardholder, CardholderServices]
    code: 201
    input: ["case_account_id", "card_id", "authorization_ids", "claimed_amount_cents", "incident_description", "freeze_purse?"]
    output: SkimmingClaim
    side_effects: ["filed_by_user_id / filed_by_role recorded", "referenced purses OPEN -> FROZEN when freeze_purse"]
  - method: GET
    path: "/ebt/purses"
    description: "List purses (filterable by case and program; Cardholder must filter to own case and may only see purses of the case == X-User-ID)"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: ["case_account_id?", "program_id?", "purse_status?", "limit?", "offset?"]
    output: Purse[]
    side_effects: []
  - method: GET
    path: "/ebt/purses/{id}"
    description: "Balance inquiry: returns the purse with both balance variants (ledger_balance_cents and spendable_balance_cents) plus expungement-notice fields"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: []
    output: Purse
    side_effects: []
  - method: GET
    path: "/ebt/purses/{id}/ledger"
    description: "List the purse's append-only ledger entries, ordered created_at ASC"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/ebt/purses/{id}/postings"
    description: "List the purse's benefit postings, ordered (available_at ASC, created_at ASC)"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: ["posting_status?", "limit?", "offset?"]
    output: BenefitPosting[]
    side_effects: []

  # --- Card actions ---
  - method: GET
    path: "/ebt/cards/{id}"
    description: "Read a card (pin_secret is masked as '****' in all responses)"
    roles: [StateAdmin, CardholderServices, Cardholder]
    code: 200
    input: []
    output: Card
    side_effects: []
  - method: POST
    path: "/ebt/cards/{id}/activate"
    description: "Activate a MAILED card and set its PIN. Case must be OPEN. Cardholder must own the card's case."
    roles: [Cardholder, CardholderServices]
    code: 200
    input: [pin]
    output: Card
    side_effects: ["MAILED -> ACTIVE; pin_secret set; pin_fail_count = 0; activated_at set"]
  - method: POST
    path: "/ebt/cards/{id}/replace"
    description: "Replace an ACTIVE or PIN_LOCKED card. Case must be OPEN. Creates the successor card (ISSUED, linked via replacement_of_card_id) and runs replacement_fee_assessment (free allowance -> program-priority fee debit -> waiver)."
    roles: [Cardholder, CardholderServices]
    code: 201
    input: []
    output: Card
    side_effects: ["Old card -> REPLACED", "new Card created ISSUED", "replacement_fee_assessment: possible FEE_DEBIT on selected purse", "increments CaseAccount.version is NOT performed; only Card rows mutate"]
  - method: POST
    path: "/ebt/cards/{id}/pin-reset"
    description: "Reset the PIN of an ACTIVE or PIN_LOCKED card. Cardholder callers must supply a matching current_pin; CardholderServices callers skip current_pin. Unlocks PIN_LOCKED -> ACTIVE and zeroes pin_fail_count."
    roles: [Cardholder, CardholderServices]
    code: 200
    input: ["new_pin", "current_pin?"]
    output: Card
    side_effects: ["pin_secret = new_pin; pin_fail_count = 0; PIN_LOCKED -> ACTIVE when locked"]

  # --- Authorization void ---
  - method: POST
    path: "/ebt/authorizations/{id}/void"
    description: "Void an AUTHORIZED transaction on the same UTC calendar day (by the logical clock). Only the owning retailer (X-User-ID == the transaction's retailer_id) may void. Posts VOID_CREDIT entries restoring every debited purse exactly."
    roles: [RetailerSystem]
    code: 200
    input: []
    output: PurchaseTransaction
    side_effects: ["AUTHORIZED -> VOIDED", "VOID_CREDIT LedgerEntry per debited purse", "purse.last_activity_at updated"]

  # --- Claim lifecycle ---
  - method: POST
    path: "/ebt/claims/{id}/status"
    description: "Drive a claim: to=UNDER_INVESTIGATION (CardholderServices; SOD vs filer; from FILED), to=SUBSTANTIATED with substantiated_amount_cents (StateAdmin; from UNDER_INVESTIGATION), to=UNSUBSTANTIATED (StateAdmin; from UNDER_INVESTIGATION). Adjudication runs claim_credit_resolution, unfreezes purses, and applies the retailer skimming-incident cascade."
    roles: [CardholderServices, StateAdmin]
    code: 200
    input: ["to", "substantiated_amount_cents?"]
    output: SkimmingClaim
    side_effects: ["Per SkimmingClaim and SkimmingClaimCredit state machines"]

  # --- Settlement ---
  - method: GET
    path: "/ebt/settlement-batches"
    description: "List settlement batches (filterable)"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: ["contract_id?", "acquirer_reference?", "batch_status?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []
  - method: GET
    path: "/ebt/settlement-batches/{id}"
    description: "Read a settlement batch with computed positions (gross_settled_cents, acquirer_fee_cents, adjustment_total_cents, net_position_cents)"
    roles: [StateAdmin, CardholderServices]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: POST
    path: "/ebt/settlement-batches/{id}/reconcile"
    description: "Reconcile a CUTOFF or DISPUTED batch against the acquirer's actual payment. Requires zero OPEN disputes first (ERR_BATCH_HAS_OPEN_DISPUTES). actual_settled_cents == net_position_cents -> RECONCILED; mismatch -> batch to DISPUTED and a RECONCILIATION_MISMATCH dispute (OPEN, disputed_amount_cents = actual - net) is auto-created."
    roles: [StateAdmin]
    code: 200
    input: [actual_settled_cents]
    output: SettlementBatch
    side_effects: ["On match: RECONCILED + reconciled_at", "On mismatch: batch -> DISPUTED and SettlementDispute(RECONCILIATION_MISMATCH, OPEN) created"]
  - method: POST
    path: "/ebt/disputes"
    description: "File a retailer dispute against a batch in CUTOFF or DISPUTED, within dispute_window_days of the batch's cutoff_at (inclusive boundary). The batch must belong to a retailer with retailer_id == X-User-ID (at least one settled transaction of that retailer is in the batch). Filing against a CUTOFF batch flips it to DISPUTED."
    roles: [RetailerSystem]
    code: 201
    input: ["settlement_batch_id", "disputed_amount_cents", "reason"]
    output: SettlementDispute
    side_effects: ["Batch CUTOFF -> DISPUTED when applicable", "dispute_status = OPEN"]
  - method: GET
    path: "/ebt/settlement-batches/{id}/disputes"
    description: "List disputes of a batch"
    roles: [StateAdmin, CardholderServices, RetailerSystem]
    code: 200
    input: ["dispute_status?", "limit?", "offset?"]
    output: SettlementDispute[]
    side_effects: []
  - method: POST
    path: "/ebt/disputes/{id}/status"
    description: "Adjudicate a dispute: to=UPHELD requires signed adjustment_cents (applied to batch.adjustment_total_cents; net_position_cents recomputed); to=OVERTURNED applies no adjustment."
    roles: [StateAdmin]
    code: 200
    input: ["to", "adjustment_cents?"]
    output: SettlementDispute
    side_effects: ["On UPHELD: batch.adjustment_total_cents and net_position_cents recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header, or undeclared role value" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership mismatch (Cardholder acting on another case's resource; RetailerSystem acting as another retailer)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: claim filer (when filed_by_role == CardholderServices) attempts to move the same claim to UNDER_INVESTIGATION" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-template resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A request-body reference (contract_id, case_account_id, card_id, settlement_batch_id, an element of authorization_ids) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, enum violation, items/withdrawal_amount_cents present-or-absent mismatch with authorization_type, backward clock set, bad date/month format" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_account_version does not match the case's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid transition: current state is not an allowed from-state for the requested action, or the resource is terminal (e.g. adjudicating a decided dispute, activating a REPLACED card, status change on a CLOSED case)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires contract ACTIVE (case creation, program creation, retailer onboarding, item-file upload, allotment run, authorization)" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Operation requires the case OPEN (authorization, claim filing, card activation, card replacement) but it is SUSPENDED, DORMANT, or CLOSED" }
  - { id: ERR_RETAILER_NOT_ACTIVE, http: 409, condition: "Operation requires retailer APPROVED but it is SUSPENDED" }
  - { id: ERR_CARD_NOT_MAILED, http: 409, condition: "Card activation attempted while ISSUED (mail delay not yet elapsed)" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Authorization attempted with a card that is ISSUED, MAILED, REPLACED, or DEACTIVATED" }
  - { id: ERR_PIN_LOCKED, http: 409, condition: "Authorization attempted on a PIN_LOCKED card (state short-circuit before PIN comparison)" }
  - { id: ERR_PIN_MISMATCH, http: 403, condition: "PIN comparison failed (authorization pin, or Cardholder current_pin on pin-reset); increments pin_fail_count" }
  - { id: ERR_PURSE_FROZEN, http: 409, condition: "A debit would hit a FROZEN purse (state priority beats fiscal insufficiency)" }
  - { id: ERR_REPLACEMENT_NOT_ALLOWED, http: 409, condition: "Replacement or PIN reset attempted on a card in ISSUED, MAILED, REPLACED, or DEACTIVATED" }
  - { id: ERR_TXN_NOT_VOIDABLE, http: 409, condition: "Void attempted on a transaction already VOIDED or already SETTLED" }
  - { id: ERR_BATCH_HAS_OPEN_DISPUTES, http: 409, condition: "Reconcile attempted while the batch has an OPEN dispute" }
  - { id: ERR_CASE_HAS_OPEN_CLAIMS, http: 409, condition: "Case close attempted with a claim in FILED or UNDER_INVESTIGATION" }
  - { id: ERR_CONTRACT_HAS_OPEN_OBLIGATIONS, http: 409, condition: "Contract close attempted with non-CLOSED cases, CUTOFF/DISPUTED batches, or open claims" }
  - { id: ERR_CASE_IDENTIFIER_INVALID, http: 400, condition: "case_identifier fails ^[0-9]{10}$" }
  - { id: ERR_CASE_IDENTIFIER_DUPLICATE, http: 409, condition: "case_identifier already exists within the contract" }
  - { id: ERR_UPC_INVALID, http: 400, condition: "An item-file entry has a UPC failing ^[0-9]{12}$; the whole file is rejected" }
  - { id: ERR_ITEM_WINDOW_OVERLAP, http: 409, condition: "An item-file entry's half-open [effective_from, effective_to) window overlaps an existing record for the same (retailer_id, upc); adjacency is allowed" }
  - { id: ERR_DISASTER_WINDOW_OVERLAP, http: 409, condition: "A DISASTER program's closed [disaster_window_start, disaster_window_end] touches or overlaps another DISASTER program's window in the same contract (adjacency conflicts)" }
  - { id: ERR_PROGRAM_TYPE_DUPLICATE, http: 409, condition: "A FOOD or CASH program already exists for the contract" }
  - { id: ERR_ITEM_NOT_ELIGIBLE, http: 422, condition: "A purchase line fails eligibility: unknown/expired UPC under a STRICT FOOD program, or a non-food item when no CASH purse exists is reported as ERR_NO_CASH_PURSE instead" }
  - { id: ERR_NO_CASH_PURSE, http: 422, condition: "A cash-only charge (non-food items or CASH_WITHDRAWAL) cannot be placed because the case has no non-CLOSED CASH purse" }
  - { id: ERR_WITHDRAWAL_MULTIPLE, http: 400, condition: "withdrawal_amount_cents is not an exact multiple of cash_withdrawal_multiple_cents" }
  - { id: ERR_DAILY_LIMIT_EXCEEDED, http: 422, condition: "used + amount > cash_withdrawal_daily_limit_cents for the current UTC day (equality is allowed)" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "A purse's spendable_balance_cents cannot cover its charge bucket (no cross-purse spill)" }
  - { id: ERR_VOID_WINDOW_EXPIRED, http: 422, condition: "Void attempted on a different UTC calendar day than the transaction's created_at" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "A referenced transaction's created_at is older than claim_window_days from the current clock" }
  - { id: ERR_CLAIM_TXN_CASE_MISMATCH, http: 422, condition: "A referenced transaction belongs to a different case than the claim" }
  - { id: ERR_CLAIM_AMOUNT_EXCEEDS_REFERENCED, http: 422, condition: "claimed_amount_cents exceeds the sum of the referenced transactions' total_cents" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "Retailer dispute filed after cutoff_at + dispute_window_days (boundary inclusive)" }
  - { id: ERR_POSTING_MONTH_INVALID, http: 422, condition: "benefit_month is neither the current nor the next calendar month, or a DISASTER run is executed outside its disaster window" }
  - { id: ERR_DUPLICATE_POSTING_RUN, http: 409, condition: "An allotment run for the same (program_id, benefit_month) already executed" }
  - { id: ERR_CASE_BALANCE_NONZERO, http: 422, condition: "Case close attempted while a purse has ledger_balance_cents != 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateAdmin
    description: "State program administrator: contract/program/retailer/case administration, allotment runs, settlement reconcile, dispute and claim adjudication, data-delivery access, logical-clock control"
    identity: opaque
    exclusive_operations:
      - "POST /ebt/contracts, POST /ebt/contracts/{id}/status, POST /ebt/programs"
      - "POST /ebt/retailers, POST /ebt/retailers/{id}/status"
      - "POST /ebt/case-accounts, POST /ebt/case-accounts/{id}/status"
      - "POST /ebt/contracts/{id}/allotment-runs"
      - "POST /ebt/settlement-batches/{id}/reconcile, POST /ebt/disputes/{id}/status"
      - "POST /ebt/claims/{id}/status with to=SUBSTANTIATED or UNSUBSTANTIATED"
      - "GET /ebt/contracts/{id}/data-deliveries"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints except retailer-scoped authorizations/items are shared with CardholderServices; StateAdmin reads everything"
  - name: CardholderServices
    description: "Conduent customer-service representative: card issuance, activation assist, PIN reset, claim filing and investigation (never adjudication), balance inquiry support"
    identity: opaque
    exclusive_operations:
      - "POST /ebt/cards"
      - "POST /ebt/claims/{id}/status with to=UNDER_INVESTIGATION"
    shared_operations:
      - "POST /ebt/cards/{id}/activate, POST /ebt/cards/{id}/replace, POST /ebt/cards/{id}/pin-reset (shared with Cardholder)"
      - "POST /ebt/claims (shared with Cardholder)"
      - "Read access to cases, purses, ledgers, postings, cards, claims, contracts, programs, retailers, batches"
  - name: Cardholder
    description: "Benefit recipient acting on their own case (X-User-ID == CaseAccount.id): balance inquiry, card activation/replacement/PIN reset (self), skimming claim filing"
    identity: "entity_backed:CaseAccount"
    exclusive_operations: []
    shared_operations:
      - "GET own case, own purses, own ledger, own postings, own cards, own claims"
      - "POST /ebt/cards/{id}/activate, POST /ebt/cards/{id}/replace, POST /ebt/cards/{id}/pin-reset (own cards only; pin-reset requires current_pin)"
      - "POST /ebt/claims (own case only)"
  - name: RetailerSystem
    description: "Retailer point-of-sale system acting as a specific retailer (X-User-ID == Retailer.id): item-file upload, purchase/withdrawal authorization, same-day void, settlement dispute filing"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /ebt/retailers/{id}/item-files"
      - "POST /ebt/retailers/{id}/authorizations"
      - "POST /ebt/authorizations/{id}/void"
      - "POST /ebt/disputes"
    shared_operations:
      - "GET /ebt/retailers/{id} (self), GET /ebt/retailers/{id}/items (self), GET /ebt/retailers/{id}/authorizations (self), GET /ebt/settlement-batches/{id}/disputes"
