      - name: look_back_denominator_empty_after_leave_exclusion
        grounds:
          - validations[priority=26]
          - errors[ERR_NO_HOURS_DATA]
          - calculations.full_time_month_determination
          - entities.HoursRecord.fields.excluded_from_denominator
        distinguishing_aspect: |
          A third metric — the cardinality of the look-back denominator at its empty-set
          boundary — on a third endpoint
          (POST /ale-reporting/employees/{employee_id}/full-time-recompute): twelve months
          with special_unpaid_leave_hours 160 are all excluded (>= 130) leaving zero counted
          months and ERR_NO_HOURS_DATA with 422, while an employee with eleven excluded
          months plus one month at special_unpaid_leave_hours 129 keeps exactly one counted
          month and averages 130.00.
        test_recipe:
          setup:
            - "FilingSeason 2026 OPEN; ControlledGroup DETERMINED_ALE; GroupMember with measurement_method LOOK_BACK and a STANDARD MeasurementCycle (measurement 2025-01-01..2025-12-31, admin end 2025-12-31, stability 2026-01-01..2026-12-31)."
            - "Employee E_ZERO has twelve 2025 HoursRecord rows with hours_of_service 0 and special_unpaid_leave_hours 160, so excluded_from_denominator is true on all twelve."
            - "Employee E_ONE has eleven such rows for months 1-11 plus one month-12 row with hours_of_service 130 and special_unpaid_leave_hours 129, which is NOT excluded."
