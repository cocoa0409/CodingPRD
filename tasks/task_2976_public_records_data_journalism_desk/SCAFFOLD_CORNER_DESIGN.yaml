            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev_id}", finding_id: "${finding_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: ManagingEditor
              captures: { assign_id: $.data.id }
            - call: "POST /records-desk/subject-response-requests"
              payload: { investigation_id: "${inv_id}", subject_name: "Transit Agency Spokesperson", contact_channel: "EMAIL" }
              as: RecordsCoordinator
              captures: { subj_id: $.data.id }
          trigger:
            - call: "GET /records-desk/investigations/${inv_id}"
              as: ManagingEditor
            - call: "POST /records-desk/investigations/${inv_id}/lock-findings"
              payload: {}
              as: ManagingEditor
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/review-assignments/${assign_id}/verdict"
              payload: { verdict: "CONFIRMED", rationale: "Matches the maintenance work orders." }
              as: ExpertReviewer
              as_user_id: "${rev_id}"
            - call: "GET /records-desk/investigations/${inv_id}"
              as: ManagingEditor
            - call: "POST /records-desk/investigations/${inv_id}/lock-findings"
              payload: {}
              as: ManagingEditor
            - call: "GET /records-desk/subject-response-requests/${subj_id}"
              as: RecordsCoordinator
          assert:
            - "trigger call 1: analysis_readiness == \"NOT_READY\", finding_count == 1, doc_matched_finding_count == 1, sme_confirmed_finding_count == 0 - the one missing condition is the SME confirmation"
            - "trigger call 2: HTTP 409 with error_id ERR_ANALYSIS_NOT_READY, and status is still \"ANALYSIS\""
            - "trigger call 3: HTTP 200 - the verdict response reports the assignment COMPLETED, and this single request is what flips the readiness inputs"
            - "trigger call 4: analysis_readiness == \"READY\", doc_matched_finding_count == 0 and sme_confirmed_finding_count == 1, observed on the very next read with no intervening write and no re-poll"
            - "trigger call 4: finding_count == 1 == unverified 0 + doc_matched 0 + sme_confirmed 1 + sme_disputed 0, so the partition holds at the instant of observation"
            - "trigger call 5: HTTP 200 and the RESPONSE BODY ITSELF reports status == \"FINDINGS_LOCKED\" - the caller never needs a follow-up read to see the transition"
            - "trigger call 6: the SubjectResponseRequest is already \"NOTICE_ELIGIBLE\" with its version incremented by 1 - the lock-findings cascade landed inside the same request that returned in call 5"
            - "no assertion in this instance requires a delay, a retry or a second read of the same row to see a settled value"
