          setup: ["one client; one DRAFT study; one QUALIFIED panelist p1 (id used as X-User-ID for the Panelist denial)"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "RBAC Co", contact_email: "rbac@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
