scenario: 'Open Seating Boarding Position Assignment & Point-to-Point Scheduling

  (Southwest Airlines): boarding position assignment by check-in time with

  purchased early-boarding upgrades and status priority, family and preboarding

  accommodation rules that interact with position order, point-to-point network

  scheduling without a hub-and-spoke bank structure affecting aircraft routing

  and crew pairing, single fleet type simplifying maintenance and crew

  qualification while limiting recovery options, bag policy with included

  checked bags affecting turn times and ground staffing, rapid turn targets

  with boarding process design and gate staffing, irregular operations recovery

  where point-to-point routings propagate delays across the day, fare tiers

  with flexible change rules and travel credit administration

  '
domain_name: open-seat-p2p-ops
api_prefix: /ops
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
  - cascading_side_effects
  - dual_variant_calculation
  - optimistic_concurrency
  - selector_policy
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Station
  parent: null
  common_fields: true
  fields:
  - name: iata_code
    type: string
    source: input
    description: 3-letter station code; unique across stations
  - name: bag_weight_limit_lbs
    type: integer
    source: input
    description: Per-bag weight limit applied at acceptance
    default: 50
  - name: min_connection_minutes
    type: integer
    source: input
    description: Minimum turn/connection buffer enforced for routings and pairings at this station
    default: 40
  - name: time_zone_offset_minutes
    type: integer
    source: input
    description: Fixed UTC offset for schedule sanity; informational only
  - name: station_status
    type: enum
    source: system
    description: ACTIVE | CLOSED; CLOSED forbids new flight arrivals/departures
    constraints: ACTIVE | CLOSED
- name: FareClass
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Unique fare class code
  - name: included_bags
    type: integer
    source: input
    description: Free checked bags per PassengerJourney on this fare; >= 0
    default: 2
  - name: change_fee_cents
    type: integer
    source: input
    description: Fee per changed journey leg; 0 means flexible
    default: 0
  - name: upgrade_discount_pct
    type: integer
    source: input
    description: Percent discount on boarding upgrades for this fare, 0..100
    default: 0
  - name: credit_validity_days
    type: integer
    source: input
    description: Days a TravelCredit derived from this fare remains valid
    default: 365
  - name: preboard_eligible
    type: boolean
    source: input
    description: Whether journeys on this fare may hold accommodation PREBOARD
    default: false
  - name: is_active
    type: boolean
    source: input
    description: Inactive fare classes reject new bookings; existing journeys unaffected
    default: true
- name: Passenger
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Passenger display name
  - name: status_tier
    type: enum
    source: input
    description: Loyalty tier affecting boarding priority and upgrade discount
    default: NONE
    constraints: NONE | A_LIST | A_LIST_PREFERRED
  - name: is_min_eligible
    type: boolean
    source: input
    description: May act as accompanying adult on a MIN (family accommodation) journey
    default: true
  - name: date_of_birth
    type: string
    source: input
    description: ISO date; passengers under 6 on flight date are family-boarding children
  - name: standing
    type: enum
    source: system
    description: GOOD | NO_SHOW_FLAGGED; set after 2 NO_SHOW journeys
    default: GOOD
    constraints: GOOD | NO_SHOW_FLAGGED
  - name: no_show_count
    type: integer
    source: system
    description: Count of journeys finalized NO_SHOW; drives standing
    default: 0
- name: Aircraft
  parent: null
  common_fields: true
  fields:
  - name: tail_number
    type: string
    source: input
    description: Unique aircraft identifier
  - name: seat_count
    type: integer
    source: input
    description: Physical seats; caps A1-A15 sale and assignment
  - name: fleet_type
    type: enum
    source: input
    description: SINGLE_FLEET in v1; every CrewMember qualification covers it
    constraints: SINGLE_FLEET
  - name: maintenance_state
    type: enum
    source: system
    description: SERVICEABLE | OUT_OF_SERVICE; OOS cascades to its legs
    default: SERVICEABLE
    constraints: SERVICEABLE | OUT_OF_SERVICE
  - name: home_station_code
    type: string
    source: input
    description: Station where the tail overnight; informational
- name: CrewMember
  parent: null
  common_fields: true
  fields:
  - name: employee_ref
    type: string
    source: input
    description: Unique employee reference
  - name: crew_role
    type: enum
    source: input
    description: CAPTAIN | FIRST_OFFICER | FLIGHT_ATTENDANT
    constraints: CAPTAIN | FIRST_OFFICER | FLIGHT_ATTENDANT
  - name: qualified_fleet
    type: enum
    source: input
    description: Always SINGLE_FLEET; uniform qualification simplifies pairing
    constraints: SINGLE_FLEET
  - name: crew_status
    type: enum
    source: system
    description: AVAILABLE | UNAVAILABLE
    default: AVAILABLE
    constraints: AVAILABLE | UNAVAILABLE
  - name: base_station_code
    type: string
    source: input
    description: Crew base; pairings must start here
- name: FlightLeg
  parent: null
  common_fields: true
  fields:
  - name: flight_number
    type: string
    source: input
    description: Marketing flight number
  - name: origin_station_id
    type: string
    source: input
    description: FK -> Station.id; departure station
  - name: destination_station_id
    type: string
    source: input
    description: FK -> Station.id; arrival station
  - name: scheduled_departure_utc
    type: datetime
    source: input
    description: Planned STD
  - name: scheduled_arrival_utc
    type: datetime
    source: input
    description: Planned STA; must be after STD
  - name: turn_target_minutes
    type: integer
    source: input
    description: Station turn target between inbound block-in and this leg's STD
    default: 35
  - name: gate_agent_count
    type: integer
    source: input
    description: Gate staffing level feeding ground staffing adequacy
    default: 2
  - name: ramp_agent_count
    type: integer
    source: input
    description: Ramp staffing level feeding ground staffing adequacy
    default: 4
  - name: capacity_seats
    type: integer
    source: input
    description: Salable seats; cannot exceed assigned aircraft seat_count
  - name: leg_status
    type: enum
    source: system
    description: SCHEDULED | DELAYED | DEPARTED | ARRIVED | CANCELLED
    default: SCHEDULED
    constraints: SCHEDULED | DELAYED | DEPARTED | ARRIVED | CANCELLED
  - name: delay_minutes
    type: integer
    source: system
    description: Current posted delay vs STD
    default: 0
  - name: delay_cause
    type: enum
    source: system
    description: NONE | WEATHER | INBOUND_DELAY | CREW | MAINTENANCE; recorded on last delay
    default: NONE
    constraints: NONE | WEATHER | INBOUND_DELAY | CREW | MAINTENANCE
  - name: delay_propagated
    type: boolean
    source: system
    description: True when this delay was propagated through aircraft routing rather than posted directly
    default: false
  - name: boarding_start_utc
    type: datetime
    source: system
    description: Set when boarding opens
  - name: actual_departure_utc
    type: datetime
    source: system
    description: Set on DEPART; null until then
  - name: actual_arrival_utc
    type: datetime
    source: system
    description: Set on ARRIVE; null until then
- name: AircraftRouting
  parent: null
  common_fields: true
  fields:
  - name: routing_date
    type: string
    source: input
    description: ISO service date of this tail's day line
  - name: aircraft_id
    type: string
    source: input
    description: FK -> Aircraft.id; tail flying the line
  - name: leg_ids
    type: array
    source: input
    description: FK -> FlightLeg.id[]; ordered flight legs for the tail that day
  - name: routing_status
    type: enum
    source: system
    description: ACTIVE | BROKEN; BROKEN when a covered leg is cancelled or tail OOS
    default: ACTIVE
    constraints: ACTIVE | BROKEN
  - name: slack_minutes
    type: integer
    source: computed
    description: 'Minimum slack across consecutive leg pairs: min(STD_next - STA_prev - turn_target_next)'
- name: CrewPairing
  parent: null
  common_fields: true
  fields:
  - name: pairing_date
    type: string
    source: input
    description: ISO service date of this pairing
  - name: crew_member_id
    type: string
    source: input
    description: FK -> CrewMember.id
  - name: leg_ids
    type: array
    source: input
    description: FK -> FlightLeg.id[]; ordered legs the crew member works
  - name: pairing_status
    type: enum
    source: system
    description: ACTIVE | BROKEN | CLOSED; BROKEN when a covered leg is cancelled/delayed past buffer or crew UNAVAILABLE
    default: ACTIVE
    constraints: ACTIVE | BROKEN | CLOSED
- name: Booking
  parent: null
  common_fields: true
  fields:
  - name: record_locator
    type: string
    source: input
    description: Unique passenger-facing confirmation code
  - name: booking_status
    type: enum
    source: system
    description: ACTIVE | CANCELLED
    default: ACTIVE
    constraints: ACTIVE | CANCELLED
  - name: channel
    type: enum
    source: input
    description: DIRECT | AGENT
    default: DIRECT
    constraints: DIRECT | AGENT
  - name: journey_count
    type: integer
    source: computed
    description: Number of PassengerJourneys under this booking
  - name: journey_ids
    type: array
    source: computed
    description: Ordered ids of PassengerJourneys under this booking, created_at ASC
  - name: journey_ids
    type: array
    source: computed
    description: Ordered ids of PassengerJourneys under this booking, created_at ASC
- name: PassengerJourney
  parent: Booking
  common_fields: true
  fields:
  - name: booking_id
    type: string
    source: system
    description: FK -> Booking.id; parent booking
  - name: passenger_id
    type: string
    source: input
    description: FK -> Passenger.id
  - name: flight_leg_id
    type: string
    source: input
    description: FK -> FlightLeg.id
  - name: fare_class_id
    type: string
    source: input
    description: FK -> FareClass.id
  - name: base_fare_cents
    type: integer
    source: input
    description: Fare paid for this journey, >= 0
  - name: journey_status
    type: enum
    source: system
    description: BOOKED | CHECKED_IN | BOARDED | COMPLETED | NO_SHOW | CANCELLED
    default: BOOKED
    constraints: BOOKED | CHECKED_IN | BOARDED | COMPLETED | NO_SHOW | CANCELLED
  - name: accommodation
    type: enum
    source: system
    description: NONE | PREBOARD | FAMILY; preboard/family accommodation marker
    default: NONE
    constraints: NONE | PREBOARD | FAMILY
  - name: family_anchor_journey_id
    type: string
    source: input
    description: FK -> PassengerJourney.id; for MIN accommodation, the child journey this adult accompanies; null otherwise
  - name: checked_in_at
    type: datetime
    source: system
    description: Check-in timestamp; primary boarding sort key
  - name: no_show_penalty_cents
    type: integer
    source: computed
    description: Non-flexible fares forfeit fare on NO_SHOW; flexible fares convert fare to credit
- name: BoardingAssignment
  parent: PassengerJourney
  common_fields: true
  fields:
  - name: journey_id
    type: string
    source: system
    description: FK -> PassengerJourney.id (1:1)
  - name: flight_leg_id
    type: string
    source: system
    description: FK -> FlightLeg.id; denormalized for ordering queries
  - name: boarding_group
    type: enum
    source: system
    description: PREBOARD | A | B | C | FAMILY
    constraints: PREBOARD | A | B | C | FAMILY
  - name: boarding_position
    type: integer
    source: system
    description: 1-based position inside the group; A1-A15 purchasable zone
  - name: assignment_source
    type: enum
    source: system
    description: CHECKIN_TIME | UPGRADE_PURCHASE | STATUS_PRIORITY | PREBOARD_ACCOMMODATION | FAMILY_ACCOMMODATION | RETIME
    constraints: CHECKIN_TIME | UPGRADE_PURCHASE | STATUS_PRIORITY | PREBOARD_ACCOMMODATION | FAMILY_ACCOMMODATION | RETIME
  - name: assignment_status
    type: enum
    source: system
    description: ACTIVE | VOIDED | RETIMED
    default: ACTIVE
    constraints: ACTIVE | VOIDED | RETIMED
  - name: release_reason
    type: enum
    source: system
    description: NONE | JOURNEY_CANCELLED | FLIGHT_CANCELLED | UPGRADE | DELAY_RETIME
    default: NONE
    constraints: NONE | JOURNEY_CANCELLED | FLIGHT_CANCELLED | UPGRADE | DELAY_RETIME
- name: BoardingUpgrade
  parent: PassengerJourney
  common_fields: true
  fields:
  - name: journey_id
    type: string
    source: system
    description: FK -> PassengerJourney.id; upgraded journey
  - name: upgrade_type
    type: enum
    source: input
    description: EARLY_BIRD (auto check-in at T-36h) | UPGRADED_BOARDING (day-of-travel A1-A15 purchase)
    constraints: EARLY_BIRD | UPGRADED_BOARDING
  - name: price_cents
    type: integer
    source: computed
    description: Charged price after fare-class and status-tier discounts
  - name: position_granted
    type: integer
    source: system
    description: A-position granted for UPGRADED_BOARDING; null for EARLY_BIRD
  - name: upgrade_status
    type: enum
    source: system
    description: ACTIVE | REFUNDED | VOIDED
    default: ACTIVE
    constraints: ACTIVE | REFUNDED | VOIDED
- name: Bag
  parent: PassengerJourney
  common_fields: true
  fields:
  - name: journey_id
    type: string
    source: system
    description: FK -> PassengerJourney.id; owning journey
  - name: weight_lbs
    type: integer
    source: input
    description: Declared weight at acceptance; > origin station limit rejected
  - name: bag_status
    type: enum
    source: system
    description: ACCEPTED | LOADED | DELIVERED | OFFLOADED
    default: ACCEPTED
    constraints: ACCEPTED | LOADED | DELIVERED | OFFLOADED
  - name: bag_fee_cents
    type: integer
    source: computed
    description: Fee for bags beyond fare-class included_bags allotment
- name: TravelCredit
  parent: null
  common_fields: true
  fields:
  - name: passenger_id
    type: string
    source: input
    description: FK -> Passenger.id; owner
  - name: source_journey_id
    type: string
    source: input
    description: FK -> PassengerJourney.id; journey whose cancellation/no-show minted this credit
  - name: initial_amount_cents
    type: integer
    source: input
    description: Minted amount, > 0
  - name: remaining_amount_cents
    type: integer
    source: computed
    description: Decremented by redemptions; never negative
  - name: expires_on
    type: string
    source: computed
    description: service date + fare_class.credit_validity_days
  - name: credit_status
    type: enum
    source: system
    description: OPEN | PARTIALLY_REDEEMED | REDEEMED | EXPIRED | VOID
    default: OPEN
    constraints: OPEN | PARTIALLY_REDEEMED | REDEEMED | EXPIRED | VOID
- name: CreditRedemption
  parent: TravelCredit
  common_fields: true
  fields:
  - name: credit_id
    type: string
    source: system
    description: FK -> TravelCredit.id
  - name: journey_id
    type: string
    source: input
    description: FK -> PassengerJourney.id; journey paid with the credit
  - name: amount_cents
    type: integer
    source: input
    description: Applied amount, > 0, <= credit remaining
  - name: redemption_status
    type: enum
    source: system
    description: ACTIVE | VOIDED
    default: ACTIVE
    constraints: ACTIVE | VOIDED
- name: DisruptionEvent
  parent: FlightLeg
  common_fields: true
  fields:
  - name: flight_leg_id
    type: string
    source: system
    description: FK -> FlightLeg.id; leg the disruption is posted against
  - name: disruption_type
    type: enum
    source: input
    description: DELAY | CANCELLATION
    constraints: DELAY | CANCELLATION
  - name: cause
    type: enum
    source: input
    description: WEATHER | INBOUND_DELAY | CREW | MAINTENANCE
    constraints: WEATHER | INBOUND_DELAY | CREW | MAINTENANCE
  - name: delay_minutes
    type: integer
    source: input
    description: 'For DELAY: posted delay, >= 15 (DELAY_FLOOR_MINUTES)'
  - name: posted_utc
    type: datetime
    source: system
    description: Logical clock time when the disruption was posted
  - name: propagation_depth
    type: integer
    source: system
    description: 0 for a directly posted event; > 0 for system-emitted propagated events on downstream legs
state_machines:
- entity: Station
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: CLOSED
    trigger: POST /ops/stations/{station_id}/status (CLOSE)
    actor: OpsController
    preconditions: []
    side_effects:
    - new FlightLegs referencing this station rejected with ERR_STATION_CLOSED
  - from: CLOSED
    to: ACTIVE
    trigger: POST /ops/stations/{station_id}/status (REOPEN)
    actor: OpsController
    preconditions: []
    side_effects: []
- entity: FlightLeg
  initial_state: SCHEDULED
  terminal_states:
  - ARRIVED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: DELAYED
    trigger: POST /ops/flight-legs/{leg_id}/disruptions (DELAY)
    actor: OpsController
    preconditions:
    - delay_minutes >= 15 (DELAY_FLOOR_MINUTES)
    - leg not yet DEPARTED
    side_effects:
    - FlightLeg.delay_minutes updated; delay_cause set; delay_propagated=false
    - 'If delay_minutes >= 45 (RETIME_THRESHOLD_MINUTES): BoardingAssignments on this leg with assignment_status=ACTIVE are
      recomputed against the delayed boarding start and stamped assignment_source=RETIME; accommodation (PREBOARD/FAMILY)
      assignments are preserved unchanged'
    - 'Cascade hop 1 (aircraft): for every ACTIVE AircraftRouting containing this leg, slack_minutes recomputed; for each
      immediately-following leg L2 in that routing whose STA_prev + L2.turn_target_minutes > STD_next - new delay, a system
      DisruptionEvent is posted on L2 (cause=INBOUND_DELAY, propagation_depth=parent+1, delay_propagated=true) driving L2
      SCHEDULED→DELAYED'
    - 'Cascade hop 2 (crew): every ACTIVE CrewPairing covering this leg whose buffer is violated by the new STD becomes BROKEN;
      a system DELAY DisruptionEvent (cause=CREW, propagation_depth=parent+1) is posted on the pairing''s next covered leg
      L3 if L3.status == SCHEDULED, driving L3→DELAYED (depth-3 chain: post → downstream leg → crew-driven leg)'
    - Propagation depth is capped at 3 (PROPAGATION_DEPTH_CAP); legs already DELAYED by an earlier event are not re-propagated
  - from: DELAYED
    to: DELAYED
    trigger: POST /ops/flight-legs/{leg_id}/disruptions (DELAY)
    actor: OpsController
    preconditions:
    - new delay_minutes strictly greater than current delay_minutes
    side_effects:
    - Same side-effect set as SCHEDULED→DELAYED; propagation may chain further legs whose thresholds are newly violated
  - from: SCHEDULED
    to: DEPARTED
    trigger: POST /ops/flight-legs/{leg_id}/depart
    actor: GateAgent
    preconditions:
    - boarding has been opened on this leg
    - every BoardingAssignment with assignment_status=ACTIVE on this leg belongs to a journey in BOARDED, CANCELLED, or NO_SHOW
      (CHECKED_IN journeys block departure; run POST /ops/flight-legs/{leg_id}/no-show-sweep first to convert them)
    - no CrewPairing covering this leg is in BROKEN status
    - aircraft assigned via ACTIVE routing is SERVICEABLE
    side_effects:
    - actual_departure_utc set to logical clock
    - All Bags on this leg ACCEPTED → LOADED
  - from: DELAYED
    to: DEPARTED
    trigger: POST /ops/flight-legs/{leg_id}/depart
    actor: GateAgent
    preconditions:
    - logical clock >= scheduled_departure_utc + delay_minutes
    - same boarding/crew/aircraft preconditions as SCHEDULED→DEPARTED
    side_effects:
    - same side-effect set as SCHEDULED→DEPARTED
  - from: SCHEDULED
    to: SCHEDULED
    trigger: POST /ops/flight-legs/{leg_id}/no-show-sweep
    actor: GateAgent
    preconditions:
    - boarding has been opened on this leg
    - logical clock >= STD + delay_minutes (posted departure time has been reached)
    side_effects:
    - Journeys still CHECKED_IN → NO_SHOW; Passenger.no_show_count incremented and standing recomputed (2 NO_SHOWs → NO_SHOW_FLAGGED);
      flexible-fare NO_SHOW journeys mint a TravelCredit for base_fare_cents; non-flexible set no_show_penalty_cents=base_fare_cents
    - ACTIVE BoardingUpgrades on NO_SHOW journeys → VOIDED (upgrade price forfeited)
  - from: DELAYED
    to: DELAYED
    trigger: POST /ops/flight-legs/{leg_id}/no-show-sweep
    actor: GateAgent
    preconditions:
    - same preconditions as the SCHEDULED no-show-sweep
    side_effects:
    - same side-effect set as the SCHEDULED no-show-sweep
  - from: DEPARTED
    to: ARRIVED
    trigger: POST /ops/flight-legs/{leg_id}/arrive
    actor: GateAgent
    preconditions: []
    side_effects:
    - actual_arrival_utc set
    - Journeys BOARDED → COMPLETED
    - Bags LOADED → DELIVERED
    - CrewPairings covering this leg with all covered legs ARRIVED → CLOSED
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /ops/flight-legs/{leg_id}/disruptions (CANCELLATION)
    actor: OpsController
    preconditions:
    - leg not yet DEPARTED
    side_effects:
    - All journeys BOOKED or CHECKED_IN on this leg → CANCELLED; TravelCredit minted per journey for base_fare_cents + unrefunded
      upgrade price_cents
    - All BoardingAssignments ACTIVE → VOIDED with release_reason=FLIGHT_CANCELLED
    - ACTIVE BoardingUpgrades on cancelled journeys → REFUNDED
    - AircraftRoutings containing this leg → BROKEN
    - CrewPairings covering this leg → BROKEN
    - Bags ACCEPTED on this leg → OFFLOADED
  - from: DELAYED
    to: CANCELLED
    trigger: POST /ops/flight-legs/{leg_id}/disruptions (CANCELLATION)
    actor: OpsController
    preconditions: []
    side_effects:
    - same side-effect set as SCHEDULED→CANCELLED
- entity: PassengerJourney
  initial_state: BOOKED
  terminal_states:
  - COMPLETED
  - NO_SHOW
  - CANCELLED
  transitions:
  - from: BOOKED
    to: CHECKED_IN
    trigger: POST /ops/journeys/{journey_id}/check-in
    actor: Passenger
    preconditions:
    - acting passenger owns the journey
    - flight leg in SCHEDULED or DELAYED
    - logical clock within [STD-24h, STD-30min] adjusted by posted delay
    - boarding capacity not exhausted on this leg
    side_effects:
    - checked_in_at set to logical clock
    - BoardingAssignment created via boarding_position_assignment calculation (family pairs anchored together; PREBOARD accommodation
      overrides group)
  - from: CHECKED_IN
    to: BOARDED
    trigger: POST /ops/boarding/scan
    actor: GateAgent
    preconditions:
    - boarding open on the flight leg
    - journey has an ACTIVE BoardingAssignment on this leg
    - leg in SCHEDULED or DELAYED
    side_effects: []
  - from: BOARDED
    to: COMPLETED
    trigger: system (flight leg ARRIVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: CHECKED_IN
    to: NO_SHOW
    trigger: system (flight leg DEPARTED)
    actor: system
    preconditions: []
    side_effects:
    - Passenger.no_show_count incremented; standing recomputed
    - 'FareClass.change_fee_cents == 0 (flexible): TravelCredit minted for base_fare_cents; else no_show_penalty_cents = base_fare_cents'
    - ACTIVE BoardingUpgrades on this journey → VOIDED (not refunded)
  - from: BOOKED
    to: CANCELLED
    trigger: POST /ops/journeys/{journey_id}/cancel
    actor: Passenger
    preconditions:
    - acting passenger owns the journey
    - leg not yet DEPARTED
    side_effects:
    - TravelCredit minted for base_fare_cents + ACTIVE upgrade price_cents
    - ACTIVE BoardingAssignment → VOIDED with release_reason=JOURNEY_CANCELLED
    - ACTIVE BoardingUpgrades → REFUNDED
  - from: CHECKED_IN
    to: CANCELLED
    trigger: POST /ops/journeys/{journey_id}/cancel
    actor: Passenger
    preconditions:
    - acting passenger owns the journey
    - leg not yet DEPARTED
    side_effects:
    - same side-effect set as BOOKED→CANCELLED
  - from: BOOKED
    to: CANCELLED
    trigger: system (flight leg CANCELLED)
    actor: system
    preconditions: []
    side_effects:
    - TravelCredit minted; upgrade refunded; assignment VOIDED (release_reason=FLIGHT_CANCELLED)
  - from: CHECKED_IN
    to: CANCELLED
    trigger: system (flight leg CANCELLED)
    actor: system
    preconditions: []
    side_effects:
    - same side-effect set as system BOOKED→CANCELLED
  - from: BOOKED
    to: BOOKED
    trigger: POST /ops/journeys/{journey_id}/change (flight/fare change)
    actor: Passenger
    preconditions:
    - acting passenger owns the journey
    - old and new legs both not DEPARTED
    - flexible fare (change_fee_cents == 0) or change fee payable
    side_effects:
    - Any ACTIVE CreditRedemption paying this journey → VOIDED; TravelCredit.remaining_amount_cents restored (compensation)
    - Change fee debited for non-flexible fares; fare difference converted to TravelCredit when new fare < old fare (flexible
      fares only)
- entity: BoardingAssignment
  initial_state: ACTIVE
  terminal_states:
  - VOIDED
  - RETIMED
  transitions:
  - from: ACTIVE
    to: VOIDED
    trigger: system (journey cancelled / flight cancelled) or POST /ops/boarding-upgrades/{id}/refund
    actor: system
    preconditions: []
    side_effects:
    - release_reason recorded; subsequent assignments in same group NOT renumbered (positions are sticky)
  - from: ACTIVE
    to: RETIMED
    trigger: system (delay >= RETIME_THRESHOLD_MINUTES)
    actor: system
    preconditions: []
    side_effects:
    - non-accommodation assignment positions recomputed; new rows stamped assignment_source=RETIME; PREBOARD/FAMILY rows untouched
- entity: BoardingUpgrade
  initial_state: ACTIVE
  terminal_states:
  - REFUNDED
  - VOIDED
  transitions:
  - from: ACTIVE
    to: REFUNDED
    trigger: POST /ops/boarding-upgrades/{upgrade_id}/refund or system (journey/flight cancellation)
    actor: Passenger | system
    preconditions:
    - 'for passenger-initiated refund: upgrade_type == UPGRADED_BOARDING and flight not yet boarded; EARLY_BIRD is non-refundable'
    side_effects:
    - 'UPGRADED_BOARDING: freed A-position NOT backfilled; assignment → VOIDED (release_reason=UPGRADE); journey assignment
      reverts to original CHECKIN_TIME position (re-issued, RETIMED source not used)'
  - from: ACTIVE
    to: VOIDED
    trigger: system (journey NO_SHOW or flight DEPARTED)
    actor: system
    preconditions: []
    side_effects:
    - no refund, no credit component from upgrade price
- entity: Bag
  initial_state: ACCEPTED
  terminal_states:
  - DELIVERED
  - OFFLOADED
  transitions:
  - from: ACCEPTED
    to: LOADED
    trigger: system (flight leg DEPARTED)
    actor: system
    preconditions: []
    side_effects: []
  - from: LOADED
    to: DELIVERED
    trigger: system (flight leg ARRIVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: ACCEPTED
    to: OFFLOADED
    trigger: POST /ops/bags/{bag_id}/offload or system (flight CANCELLED)
    actor: GateAgent | system
    preconditions:
    - 'manual offload: leg not yet DEPARTED'
    side_effects: []
- entity: TravelCredit
  initial_state: OPEN
  terminal_states:
  - REDEEMED
  - EXPIRED
  - VOID
  transitions:
  - from: OPEN
    to: PARTIALLY_REDEEMED
    trigger: POST /ops/credits/{credit_id}/redeem (amount < remaining)
    actor: Passenger
    preconditions:
    - acting passenger owns the credit
    - credit not expired (logical date <= expires_on)
    - target journey in BOOKED
    side_effects:
    - remaining_amount_cents decremented
    - CreditRedemption created ACTIVE
  - from: PARTIALLY_REDEEMED
    to: PARTIALLY_REDEEMED
    trigger: POST /ops/credits/{credit_id}/redeem (amount < remaining)
    actor: Passenger
    preconditions:
    - same as OPEN→PARTIALLY_REDEEMED
    side_effects:
    - same as OPEN→PARTIALLY_REDEEMED
  - from: OPEN
    to: REDEEMED
    trigger: POST /ops/credits/{credit_id}/redeem (amount == remaining)
    actor: Passenger
    preconditions:
    - same as OPEN→PARTIALLY_REDEEMED
    side_effects:
    - remaining_amount_cents → 0
    - CreditRedemption created ACTIVE
  - from: PARTIALLY_REDEEMED
    to: REDEEMED
    trigger: POST /ops/credits/{credit_id}/redeem (amount == remaining)
    actor: Passenger
    preconditions:
    - same as OPEN→PARTIALLY_REDEEMED
    side_effects:
    - same as OPEN→REDEEMED
  - from: OPEN
    to: EXPIRED
    trigger: system (logical date > expires_on)
    actor: system
    preconditions: []
    side_effects:
    - remaining balance forfeited
  - from: PARTIALLY_REDEEMED
    to: EXPIRED
    trigger: system (logical date > expires_on)
    actor: system
    preconditions: []
    side_effects:
    - remaining balance forfeited
  - from: OPEN
    to: VOID
    trigger: POST /ops/credits/{credit_id}/void (admin clawback)
    actor: OpsController
    preconditions:
    - no ACTIVE CreditRedemptions against this credit
    side_effects: []
  - from: PARTIALLY_REDEEMED
    to: OPEN
    trigger: system (journey change/cancel voids an ACTIVE redemption)
    actor: system
    preconditions: []
    side_effects:
    - remaining_amount_cents restored by redemption amount
- entity: AircraftRouting
  initial_state: ACTIVE
  terminal_states:
  - BROKEN
  transitions:
  - from: ACTIVE
    to: BROKEN
    trigger: system (contained leg CANCELLED or assigned aircraft OUT_OF_SERVICE)
    actor: system
    preconditions: []
    side_effects:
    - downstream legs after the broken point receive propagated DELAY events (cause=MAINTENANCE for OOS, INBOUND_DELAY otherwise)
      if slack exhausted
- entity: CrewPairing
  initial_state: ACTIVE
  terminal_states:
  - CLOSED
  - BROKEN
  transitions:
  - from: ACTIVE
    to: BROKEN
    trigger: system (covered leg cancelled, delay exhausts connection buffer, or crew member UNAVAILABLE)
    actor: system
    preconditions: []
    side_effects:
    - next covered SCHEDULED leg receives a system DELAY event (cause=CREW) if it would otherwise depart without crew
  - from: ACTIVE
    to: CLOSED
    trigger: system (all covered legs ARRIVED)
    actor: system
    preconditions: []
    side_effects: []
- entity: Aircraft
  initial_state: SERVICEABLE
  terminal_states: []
  transitions:
  - from: SERVICEABLE
    to: OUT_OF_SERVICE
    trigger: POST /ops/aircraft/{aircraft_id}/maintenance (TAKE_OUT_OF_SERVICE)
    actor: OpsController
    preconditions:
    - no DEPARTED-but-not-ARRIVED legs on this tail
    side_effects:
    - ACTIVE routings for this tail → BROKEN with downstream MAINTENANCE propagation
  - from: OUT_OF_SERVICE
    to: SERVICEABLE
    trigger: POST /ops/aircraft/{aircraft_id}/maintenance (RETURN_TO_SERVICE)
    actor: OpsController
    preconditions: []
    side_effects: []
- entity: CrewMember
  initial_state: AVAILABLE
  terminal_states: []
  transitions:
  - from: AVAILABLE
    to: UNAVAILABLE
    trigger: POST /ops/crew-members/{crew_id}/availability (MARK_UNAVAILABLE)
    actor: OpsController
    preconditions: []
    side_effects:
    - ACTIVE pairings for this crew member → BROKEN (CREW propagation)
  - from: UNAVAILABLE
    to: AVAILABLE
    trigger: POST /ops/crew-members/{crew_id}/availability (MARK_AVAILABLE)
    actor: OpsController
    preconditions: []
    side_effects: []
- entity: Booking
  initial_state: ACTIVE
  terminal_states:
  - CANCELLED
  transitions:
  - from: ACTIVE
    to: CANCELLED
    trigger: system (all journeys CANCELLED or NO_SHOW)
    actor: system
    preconditions: []
    side_effects: []
concurrency_rules:
- rule_id: boarding-checkin-stale-leg
  parent_entity: FlightLeg
  write_endpoint: POST /ops/flight-legs/{leg_id}/check-ins
  occ_field: expected_leg_version
  description: 'A check-in submitted against a FlightLeg whose version has advanced since

    the client observed it (for example a retime cascade or a newly posted

    delay has bumped the leg) is rejected. The client must re-read the leg,

    re-derive the boarding window, and resubmit with the current version.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: upgrade-purchase-stale-leg
  parent_entity: FlightLeg
  write_endpoint: POST /ops/flight-legs/{leg_id}/upgrades
  occ_field: expected_leg_version
  description: 'An UPGRADED_BOARDING purchase against a FlightLeg whose version has

    advanced since the client observed the A1-A15 pool (for example another

    purchase or a retime has bumped the leg) is rejected so the A-position

    counter never double-allocates.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: credit-redeem-stale-credit
  parent_entity: TravelCredit
  write_endpoint: POST /ops/credits/{credit_id}/redeem
  occ_field: expected_credit_version
  description: 'A redemption against a TravelCredit whose version has advanced since the

    client observed remaining_amount_cents (for example a compensating void

    restored the balance) is rejected; the client must re-read the credit.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: boarding_position_assignment
  trigger: journey check-in; UPGRADED_BOARDING purchase; delay retime (>= RETIME_THRESHOLD_MINUTES)
  algorithm: weighted_scoring
  formula: "Ordered phases; a passenger appears in exactly one phase.\nPhase 1 (PREBOARD): journeys with accommodation=PREBOARD\
    \ → group PREBOARD,\n  positions 1..N by checked_in_at ASC, tie-break created_at ASC.\nPhase 2 (A1-A15 pool): UPGRADED_BOARDING\
    \ purchases in purchase order\n  (upgrade created_at ASC) → group A, positions 1..min(15, aircraft.seat_count);\n  seat_count\
    \ < 15 (SMALL_SEAT_TEST) shrinks the purchasable pool.\nPhase 3 (status priority): remaining A_LIST_PREFERRED journeys\
    \ → A, then\n  remaining A_LIST → A, each ordered by checked_in_at ASC, tie-break\n  created_at ASC, positions continuing\
    \ from 16.\nPhase 4 (regular): remaining NONE-tier journeys → A until A fills\n  (A_CAPACITY=60), then B (positions 1..60),\
    \ then C.\nPhase 5 (FAMILY): journeys with accommodation=FAMILY or MIN → group FAMILY,\n  inserted between A and B in\
    \ boarding sequence. MIN adult+child pairs\n  receive CONSECUTIVE positions: the pair takes the position of whichever\n\
    \  member sorts earlier by (checked_in_at ASC, created_at ASC), and the\n  trailing member is shifted so both stay adjacent.\n\
    Global boarding sequence = group rank (PREBOARD, A, FAMILY, B, C), then\n  boarding_position ASC, then checked_in_at ASC,\
    \ then created_at ASC.\nRetime variant: when delay >= 45 min, phases 2-4 are recomputed against\nthe delayed boarding\
    \ start; PREBOARD and FAMILY rows are NEVER recomputed.\n"
  input_set: journeys on the leg in CHECKED_IN with ACTIVE assignment, plus the leg's ACTIVE UPGRADED_BOARDING upgrades; NO_SHOW/CANCELLED
    journeys and VOIDED/RETIMED assignments excluded
  constants:
    A1_A15_POOL: 15
    GROUP_CAPACITY: 60
    RETIME_THRESHOLD_MINUTES: 45
  precision: integer positions; no fractional positions
  variants:
  - name: retime_recompute
    when: delay_minutes crosses >= 45
    difference: phases 2-4 recomputed with assignment_source=RETIME; accommodation phases frozen
- name: upgrade_price
  trigger: boarding upgrade purchase
  algorithm: tiered_pricing
  formula: "UB_price = floor( floor(BASE_UB_PRICE_CENTS * (100 - fare.upgrade_discount_pct) / 100)\n                  * (100\
    \ - tier_pct) / 100 )\nEB_price = floor(BASE_EB_PRICE_CENTS * (100 - fare.upgrade_discount_pct) / 100)\ntier_pct: NONE=0,\
    \ A_LIST=10, A_LIST_PREFERRED=25 (status discount applies\nto UPGRADED_BOARDING only, never to EARLY_BIRD).\nDiscounts\
    \ apply multiplicatively; each multiplication step rounds down\n(floor) BEFORE the next step is applied — pinned rounding\
    \ order, so\nfare-first-then-status differs from status-first-then-fare.\n"
  input_set: journey's FareClass.upgrade_discount_pct, Passenger.status_tier, upgrade_type
  constants:
    BASE_UB_PRICE_CENTS: 4000
    BASE_EB_PRICE_CENTS: 1500
    AL_DISCOUNT_PCT: 10
    ALP_DISCOUNT_PCT: 25
  precision: integer cents, floor at each multiplication step
  variants:
  - name: early_bird_flat
    when: upgrade_type=EARLY_BIRD
    difference: no status-tier discount ever applies; only the fare-class discount
- name: travel_credit_mint
  trigger: journey cancellation, flight cancellation, flexible-fare NO_SHOW, or downgrade change
  algorithm: aggregation
  formula: "minted_cents = base_fare_cents\n             + sum(price_cents of ACTIVE BoardingUpgrades on the journey)\n  \
    \           - sum(amount_cents of CreditRedemptions paying the journey)\nEvaluation order is pinned (circular-looking\
    \ dependency resolved):\nstep 1: void the journey's ACTIVE CreditRedemptions and restore each\n        source TravelCredit.remaining_amount_cents\
    \ (compensation);\nstep 2: compute minted_cents on the journey's own fields only — the new\n        credit NEVER draws\
    \ from the balances restored in step 1;\nstep 3: floor minted_cents at 0.\nexpires_on = flight leg service date + fare.credit_validity_days.\n"
  input_set: the cancelled/no-show/changed PassengerJourney, its upgrades, its redemptions, its fare class
  constants: {}
  precision: integer cents
  variants:
  - name: no_show_forfeit
    when: NO_SHOW on non-flexible fare (change_fee_cents > 0)
    difference: no credit minted; no_show_penalty_cents = base_fare_cents instead
- name: bag_fee_assessment
  trigger: bag acceptance (POST /ops/journeys/{id}/bags)
  algorithm: waterfall_allocation
  formula: 'Ordinal bag index k = count of prior ACCEPTED/LOADED bags on this journey + 1.

    included = FareClass.included_bags.

    bag_fee_cents = 0 if k <= included else BAG_FEE_CENTS.

    Weight check: weight_lbs > origin station.bag_weight_limit_lbs → reject

    (ERR_BAG_OVERWEIGHT) BEFORE fee assessment.

    Per-journey cap: accepting a bag when count of ACCEPTED/LOADED bags ==

    MAX_BAGS_PER_JOURNEY (10) is rejected; the cap check uses >= comparison

    against the pre-acceptance count.

    '
  input_set: journey's bags in ACCEPTED or LOADED, journey fare class, origin station bag_weight_limit_lbs
  constants:
    BAG_FEE_CENTS: 7500
    MAX_BAGS_PER_JOURNEY: 10
  precision: integer cents
- name: turn_time_projection
  trigger: on demand (GET /ops/flight-legs/{id}/turn-projection); consulted by scheduling rules
  algorithm: forward_looking
  formula: "projected_bags = sum over journeys on the leg in {BOOKED, CHECKED_IN} of\n                 count of that journey's\
    \ ACCEPTED bags, PLUS\n                 fare.included_bags per BOOKED journey (expected-but-not-\n                 yet-checked\
    \ bags), capped at 2 * capacity_seats.\nbag_minutes = BAG_MINUTES_PER_BAG * projected_bags\npax_minutes = ceil(booked_journey_count\
    \ * SECONDS_PER_PAX / 60)\nbuffer = DELAY_RISK_BUFFER_MINUTES if leg.delay_minutes > 0 else 0\nprojected_turn_minutes\
    \ = TURN_BASE_MINUTES + bag_minutes + pax_minutes + buffer\nturns_slip = projected_turn_minutes > leg.turn_target_minutes\n"
  input_set: journeys in {BOOKED, CHECKED_IN} on the leg (CANCELLED/NO_SHOW excluded), their ACCEPTED bags, the leg delay
    state
  constants:
    TURN_BASE_MINUTES: 12
    BAG_MINUTES_PER_BAG: 1
    SECONDS_PER_PAX: 18
    DELAY_RISK_BUFFER_MINUTES: 5
  precision: integer minutes; pax_minutes uses ceil
  variants:
  - name: realized_turn
    when: leg is DEPARTED (chronological post-hoc view)
    difference: uses actual LOADED bag count and actual BOARDED count only, no buffer, no projection; answers 'did we make
      the turn' rather than 'will we make it'
- name: ground_staffing_adequacy
  trigger: on demand (GET /ops/flight-legs/{id}/staffing-check); consulted when turn slips
  algorithm: threshold
  formula: "load_factor = booked_journey_count / capacity_seats (2 dp, round_half_up)\nstaff_units = leg.gate_agent_count\
    \ + leg.ramp_agent_count\nbags_per_ramp_agent = projected_bags / max(leg.ramp_agent_count, 1)\nUnderstaffed when:\n  staff_units\
    \ < REQUIRED_STAFF_UNITS (5)\n  OR (load_factor >= HIGH_LOAD_FACTOR (0.90) AND bags_per_ramp_agent > BAGS_PER_RAMP_AGENT_MAX\
    \ (15))\nBoundary pins: load_factor >= 0.90 triggers (0.90 itself understaffs when\nbag condition also holds); bags_per_ramp_agent\
    \ > 15 means 15.0 exactly is\nadequate; staff_units < 5 means exactly 5 units is adequate.\n"
  input_set: leg gate/ramp agent counts, booked journey count, capacity, projected_bags from turn_time_projection
  constants:
    REQUIRED_STAFF_UNITS: 5
    HIGH_LOAD_FACTOR: 0.9
    BAGS_PER_RAMP_AGENT_MAX: 15
  precision: load_factor 2 decimal places round_half_up; bags_per_ramp_agent 1 decimal place round_half_up
- name: delay_propagation
  trigger: DisruptionEvent posted (DELAY) on a leg
  algorithm: constraint_propagation
  formula: "For each ACTIVE AircraftRouting containing leg L at index i:\n  next = leg_ids[i+1] if it exists.\n  slack_next\
    \ = STD(next) - STA(L) - next.turn_target_minutes\n  If slack_next < delay_minutes(L): post system DisruptionEvent on\
    \ next\n    with cause=INBOUND_DELAY, delay_minutes = delay_minutes(L) - slack_next,\n    propagation_depth = parent_depth\
    \ + 1; recurse on next.\nFor each ACTIVE CrewPairing covering L with a subsequent covered leg L3:\n  if L3 STD is now\
    \ unreachable given crew buffer (min_connection_minutes\n  at the connection station): pairing → BROKEN and L3 receives\
    \ a system\n  DELAY event (cause=CREW, depth+1).\nDepth cap: legs whose event would exceed depth 3 are skipped; legs already\n\
    DELAYED are not re-propagated (first posted delay wins for propagation\nbookkeeping; later direct posts use the DELAYED→DELAYED\
    \ transition).\nEvaluation order: aircraft-routing hop is computed BEFORE crew-pairing\nhop, because the crew hop reads\
    \ the post-aircraft-cascade STDs.\n"
  input_set: ACTIVE routings containing the leg, ACTIVE pairings covering the leg, station min_connection_minutes
  constants:
    PROPAGATION_DEPTH_CAP: 3
    DELAY_FLOOR_MINUTES: 15
  precision: integer minutes
- name: routing_slack
  trigger: AircraftRouting creation; recompute on any contained-leg delay or cancellation
  algorithm: interval_merge
  formula: "For consecutive legs (L_i, L_{i+1}) in the routing:\n  slack_i = STD(L_{i+1}) - STA(L_i) - L_{i+1}.turn_target_minutes\n\
    Half-open interval semantics: STD(L_{i+1}) == STA(L_i) +\nL_{i+1}.turn_target_minutes yields slack 0 and is VALID (touching\
    \ turn\nwindows do not conflict); slack_i < 0 rejects routing creation\n(ERR_ROUTING_TURN_VIOLATION).\nrouting.slack_minutes\
    \ = min over all slack_i.\n"
  input_set: routing's ordered legs, each leg's STA/STD and turn_target_minutes
  constants: {}
  precision: integer minutes
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present and role recognized
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role is permitted for this endpoint per §1.7
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: auth
  check: 'Ownership: Passenger role may only act on own journeys/credits/upgrades (X-User-ID == resource passenger_id)'
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: POST /ops/journeys/{journey_id}/check-in, POST /ops/journeys/{journey_id}/cancel, POST /ops/journeys/{journey_id}/change,
    POST /ops/credits/{credit_id}/redeem, POST /ops/boarding-upgrades/{upgrade_id}/refund, POST /ops/flight-legs/{leg_id}/check-ins,
    POST /ops/flight-legs/{leg_id}/upgrades
- priority: 4
  category: existence
  check: Path resources exist, validated left-to-right (station, leg, journey, credit, upgrade, bag)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: state
  check: Resource state precondition for the operation (journey in BOOKED for check-in, leg not DEPARTED/CANCELLED for disruptions
    and departure, credit OPEN/PARTIALLY_REDEEMED for redeem, etc.)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all state-transition endpoints
- priority: 6
  category: business_referential
  check: 'Fleet homogeneity: CrewMember.qualified_fleet == SINGLE_FLEET and aircraft.fleet_type == SINGLE_FLEET for any leg
    in a pairing/routing'
  error_id: ERR_FLEET_HETEROGENEITY
  http_status: 422
  applies_to: POST /ops/crew-pairings, POST /ops/aircraft-routings
- priority: 7
  category: business_referential
  check: 'Routing leg chain: consecutive legs share station (L_i.destination == L_{i+1}.origin) and STA(L_i) < STD(L_{i+1})'
  error_id: ERR_ROUTING_CHAIN_BROKEN
  http_status: 422
  applies_to: POST /ops/aircraft-routings
- priority: 8
  category: business_referential
  check: 'Routing turn buffer: every consecutive pair satisfies STD_next - STA_prev >= turn_target_next (half-open; equality
    allowed)'
  error_id: ERR_ROUTING_TURN_VIOLATION
  http_status: 422
  applies_to: POST /ops/aircraft-routings
- priority: 9
  category: business_referential
  check: 'Aircraft temporal overlap: tail has no other ACTIVE routing on the same date whose leg windows [STA_prev, STD_next]
    overlap (touching endpoints allowed)'
  error_id: ERR_AIRCRAFT_DOUBLE_BOOKED
  http_status: 409
  applies_to: POST /ops/aircraft-routings
- priority: 10
  category: business_referential
  check: 'Crew legality: pairing starts at crew member base station, legs form a connected chain, per-leg gap <= MAX_CONNECTION_MINUTES
    (120), duty span first-STD to last-STA <= MAX_DUTY_MINUTES (840), crew AVAILABLE and not already paired on an overlapping
    window'
  error_id: ERR_CREW_LEGALITY_VIOLATION
  http_status: 422
  applies_to: POST /ops/crew-pairings
- priority: 11
  category: business_temporal
  check: Crew/pairing and routing windows do not violate station min_connection_minutes at connection stations
  error_id: ERR_STATION_CONNECTION_VIOLATION
  http_status: 422
  applies_to: POST /ops/crew-pairings, POST /ops/aircraft-routings
- priority: 12
  category: business_safety
  check: Preboard accommodation requires fare_class.preboard_eligible == true
  error_id: ERR_PREBOARD_NOT_ELIGIBLE
  http_status: 422
  applies_to: POST /ops/bookings (with journeys requesting PREBOARD), POST /ops/journeys/{journey_id}/check-in
- priority: 13
  category: business_safety
  check: Family (MIN) accommodation requires the anchor journey to be a child passenger (under 6 on flight date) and the accompanying
    passenger is_min_eligible == true
  error_id: ERR_FAMILY_ANCHOR_INELIGIBLE
  http_status: 422
  applies_to: POST /ops/bookings
- priority: 14
  category: business_safety
  check: 'Bag weight: weight_lbs <= origin station.bag_weight_limit_lbs (checked before fee assessment)'
  error_id: ERR_BAG_OVERWEIGHT
  http_status: 422
  applies_to: POST /ops/journeys/{journey_id}/bags
- priority: 15
  category: business_constraint
  check: 'Check-in window: logical clock within [STD - 24h, STD - 30min] adjusted by posted delay_minutes'
  error_id: ERR_CHECKIN_WINDOW_CLOSED
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/check-ins
- priority: 16
  category: business_constraint
  check: EARLY_BIRD purchase only while logical clock < STD - 36h (EARLY_BIRD_CUTOFF_HOURS); UPGRADED_BOARDING only within
    day of travel (STD - 24h <= now)
  error_id: ERR_UPGRADE_WINDOW_CLOSED
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/upgrades
- priority: 17
  category: business_constraint
  check: 'A1-A15 pool: count of ACTIVE UPGRADED_BOARDING on the leg < min(15, aircraft.seat_count) before granting'
  error_id: ERR_UPGRADE_SOLD_OUT
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/upgrades
- priority: 18
  category: business_constraint
  check: One ACTIVE upgrade per journey per type; second purchase of the same type rejected
  error_id: ERR_DUPLICATE_UPGRADE
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/upgrades
- priority: 19
  category: business_constraint
  check: 'Duplicate check-in: journey already CHECKED_IN rejected'
  error_id: ERR_DUPLICATE_CHECKIN
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/check-ins, POST /ops/journeys/{journey_id}/check-in
- priority: 20
  category: business_constraint
  check: 'Boarding capacity: ACTIVE assignments on the leg < capacity_seats'
  error_id: ERR_BOARDING_CAPACITY_EXCEEDED
  http_status: 409
  applies_to: POST /ops/flight-legs/{leg_id}/check-ins
- priority: 21
  category: business_constraint
  check: 'Bag count cap: ACCEPTED+LOADED bags on the journey >= MAX_BAGS_PER_JOURNEY (10) rejects the next bag'
  error_id: ERR_BAG_LIMIT_EXCEEDED
  http_status: 409
  applies_to: POST /ops/journeys/{journey_id}/bags
- priority: 22
  category: business_constraint
  check: 'Delay floor: posted delay_minutes >= 15 (DELAY_FLOOR_MINUTES); DELAYED→DELAYED requires strictly greater delay'
  error_id: ERR_DELAY_BELOW_FLOOR
  http_status: 422
  applies_to: POST /ops/flight-legs/{leg_id}/disruptions
- priority: 23
  category: business_fiscal
  check: 'Fare class active: booking on a fare class with is_active == false rejected'
  error_id: ERR_FARE_INACTIVE
  http_status: 422
  applies_to: POST /ops/bookings
- priority: 24
  category: business_fiscal
  check: 'Credit redeemable: credit not EXPIRED/VOID/REDEEMED and amount_cents <= remaining_amount_cents'
  error_id: ERR_CREDIT_EXHAUSTED
  http_status: 422
  applies_to: POST /ops/credits/{credit_id}/redeem
- priority: 25
  category: business_fiscal
  check: 'Credit expiry: logical date <= expires_on at redemption time'
  error_id: ERR_CREDIT_EXPIRED
  http_status: 410
  applies_to: POST /ops/credits/{credit_id}/redeem
- priority: 26
  category: business_fiscal
  check: 'Change fee: non-flexible fare change requires change_fee_cents payable; downgrade residual on non-flexible fares
    is forfeited (not credited)'
  error_id: ERR_CHANGE_FEE_UNPAID
  http_status: 422
  applies_to: POST /ops/journeys/{journey_id}/change
- priority: 27
  category: business_fiscal
  check: 'Upgrade refund eligibility: only UPGRADED_BOARDING is refundable and only before boarding opens; EARLY_BIRD non-refundable'
  error_id: ERR_UPGRADE_NOT_REFUNDABLE
  http_status: 422
  applies_to: POST /ops/boarding-upgrades/{upgrade_id}/refund
endpoints:
- method: POST
  path: /ops/stations
  description: Create a station
  roles:
  - OpsController
  code: 201
  input:
  - iata_code
  - bag_weight_limit_lbs?
  - min_connection_minutes?
  - time_zone_offset_minutes?
  output: Station
  side_effects:
  - station_status initialized ACTIVE
- method: GET
  path: /ops/stations/{station_id}
  description: Get a station
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input: []
  output: Station
  side_effects: []
- method: GET
  path: /ops/stations
  description: List stations (paginated; filter by station_status)
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input:
  - station_status?
  - limit?
  - offset?
  output: Station[]
  side_effects: []
- method: POST
  path: /ops/stations/{station_id}/status
  description: Close or reopen a station; closing blocks creation of new legs referencing it
  roles:
  - OpsController
  code: 200
  input:
  - action
  output: Station
  side_effects:
  - 'CLOSE: station_status → CLOSED; new FlightLegs referencing the station rejected with ERR_STATION_CLOSED'
  - 'REOPEN: station_status → ACTIVE'
  - increments Station.version by 1
- method: POST
  path: /ops/fare-classes
  description: Create a fare class
  roles:
  - OpsController
  code: 201
  input:
  - code
  - included_bags?
  - change_fee_cents?
  - upgrade_discount_pct?
  - credit_validity_days?
  - preboard_eligible?
  - is_active?
  output: FareClass
  side_effects: []
- method: GET
  path: /ops/fare-classes/{fare_class_id}
  description: Get a fare class
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input: []
  output: FareClass
  side_effects: []
- method: GET
  path: /ops/fare-classes
  description: List fare classes
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input:
  - is_active?
  - limit?
  - offset?
  output: FareClass[]
  side_effects: []
- method: POST
  path: /ops/passengers
  description: Register a passenger
  roles:
  - Passenger
  code: 201
  input:
  - full_name
  - status_tier?
  - is_min_eligible?
  - date_of_birth
  output: Passenger
  side_effects:
  - standing=GOOD, no_show_count=0
- method: GET
  path: /ops/passengers/{passenger_id}
  description: Get a passenger (self or staff)
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: Passenger
  side_effects: []
- method: POST
  path: /ops/aircraft
  description: Register an aircraft tail
  roles:
  - OpsController
  code: 201
  input:
  - tail_number
  - seat_count
  - fleet_type
  - home_station_code
  output: Aircraft
  side_effects:
  - maintenance_state=SERVICEABLE
- method: GET
  path: /ops/aircraft/{aircraft_id}
  description: Get an aircraft
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: Aircraft
  side_effects: []
- method: GET
  path: /ops/aircraft
  description: List aircraft
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - maintenance_state?
  - limit?
  - offset?
  output: Aircraft[]
  side_effects: []
- method: POST
  path: /ops/aircraft/{aircraft_id}/maintenance
  description: 'Take tail out of service / return to service (single fleet: all crews remain qualified)'
  roles:
  - OpsController
  code: 200
  input:
  - action
  output: Aircraft
  side_effects:
  - 'TAKE_OUT_OF_SERVICE: ACTIVE routings on tail → BROKEN; downstream legs receive MAINTENANCE propagation'
  - increments Aircraft.version by 1
- method: POST
  path: /ops/crew-members
  description: Register a crew member (uniform SINGLE_FLEET qualification)
  roles:
  - OpsController
  code: 201
  input:
  - employee_ref
  - crew_role
  - qualified_fleet
  - base_station_code
  output: CrewMember
  side_effects:
  - crew_status=AVAILABLE
- method: GET
  path: /ops/crew-members/{crew_member_id}
  description: Get a crew member
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: CrewMember
  side_effects: []
- method: POST
  path: /ops/crew-members/{crew_member_id}/availability
  description: Mark crew available/unavailable; unavailability breaks ACTIVE pairings
  roles:
  - OpsController
  code: 200
  input:
  - action
  output: CrewMember
  side_effects:
  - 'MARK_UNAVAILABLE: ACTIVE CrewPairings for this member → BROKEN (CREW propagation to next covered leg)'
  - increments CrewMember.version by 1
- method: POST
  path: /ops/flight-legs
  description: Create a flight leg
  roles:
  - OpsController
  code: 201
  input:
  - flight_number
  - origin_station_id
  - destination_station_id
  - scheduled_departure_utc
  - scheduled_arrival_utc
  - turn_target_minutes?
  - gate_agent_count?
  - ramp_agent_count?
  - capacity_seats
  output: FlightLeg
  side_effects:
  - leg_status=SCHEDULED, delay_minutes=0
- method: GET
  path: /ops/flight-legs/{leg_id}
  description: Get a flight leg
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input: []
  output: FlightLeg
  side_effects: []
- method: GET
  path: /ops/flight-legs
  description: List flight legs (filter by status, origin, destination, service date)
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input:
  - leg_status?
  - origin_station_id?
  - destination_station_id?
  - limit?
  - offset?
  output: FlightLeg[]
  side_effects: []
- method: GET
  path: /ops/flight-legs/{leg_id}/journeys
  description: 'Reverse-reachability: journeys on a leg'
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - journey_status?
  - limit?
  - offset?
  output: PassengerJourney[]
  side_effects: []
- method: GET
  path: /ops/flight-legs/{leg_id}/boarding-assignments
  description: 'Reverse-reachability + boarding-order read: assignments on a leg, ordered by boarding sequence (group rank
    PREBOARD, A, FAMILY, B, C; then boarding_position ASC; then checked_in_at ASC; then created_at ASC)'
  roles:
  - OpsController
  - GateAgent
  - Passenger
  code: 200
  input:
  - assignment_status?
  - boarding_group?
  - limit?
  - offset?
  output: BoardingAssignment[]
  side_effects: []
- method: GET
  path: /ops/flight-legs/{leg_id}/disruptions
  description: 'Reverse-reachability: disruption events posted on a leg, ordered posted_utc ASC then created_at ASC'
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - limit?
  - offset?
  output: DisruptionEvent[]
  side_effects: []
- method: POST
  path: /ops/flight-legs/{leg_id}/disruptions
  description: Post a DELAY or CANCELLATION; triggers delay propagation and cancellation cascades
  roles:
  - OpsController
  code: 201
  input:
  - disruption_type
  - cause
  - delay_minutes?
  output: DisruptionEvent
  side_effects:
  - 'DELAY: leg → DELAYED; delay_propagation runs (aircraft hop then crew hop, depth cap 3); retime recompute when delay >=
    45'
  - 'CANCELLATION: leg → CANCELLED; journeys → CANCELLED with credit mint; assignments VOIDED; upgrades REFUNDED; routings/pairings
    BROKEN; bags OFFLOADED'
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/boarding/open
  description: Open boarding on a leg (sets boarding_start_utc from logical clock)
  roles:
  - GateAgent
  code: 200
  input: []
  output: FlightLeg
  side_effects:
  - boarding_start_utc set
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/no-show-sweep
  description: Convert still-CHECKED_IN journeys on this leg to NO_SHOW once the posted departure time is reached; runs standing/credit
    consequences; prerequisite for depart when unboarded checked-in journeys remain
  roles:
  - GateAgent
  code: 200
  input: []
  output: FlightLeg
  side_effects:
  - CHECKED_IN journeys → NO_SHOW with standing/credit consequences; ACTIVE upgrades on them → VOIDED
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/depart
  description: Depart a leg; no-show sweep, bag load, credit minting for flexible no-shows
  roles:
  - GateAgent
  code: 200
  input: []
  output: FlightLeg
  side_effects:
  - leg → DEPARTED; CHECKED_IN journeys → NO_SHOW with standing/credit consequences; ACCEPTED bags → LOADED
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/arrive
  description: Arrive a leg; completes boarded journeys, delivers bags, closes pairings
  roles:
  - GateAgent
  code: 200
  input: []
  output: FlightLeg
  side_effects:
  - leg → ARRIVED; BOARDED journeys → COMPLETED; LOADED bags → DELIVERED; fully-flown pairings → CLOSED
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/check-ins
  description: Check a journey in on this leg (OCC on leg version); creates the BoardingAssignment
  roles:
  - Passenger
  code: 201
  input:
  - journey_id
  - expected_leg_version
  output: PassengerJourney
  side_effects:
  - journey → CHECKED_IN; checked_in_at set; boarding_position_assignment runs
  - increments FlightLeg.version by 1
- method: POST
  path: /ops/flight-legs/{leg_id}/upgrades
  description: Purchase EARLY_BIRD or UPGRADED_BOARDING on a journey for this leg (OCC on leg version)
  roles:
  - Passenger
  code: 201
  input:
  - journey_id
  - upgrade_type
  - expected_leg_version
  output: BoardingUpgrade
  side_effects:
  - upgrade_price computed; UPGRADED_BOARDING grants next A1-A15 position
  - increments FlightLeg.version by 1
- method: GET
  path: /ops/flight-legs/{leg_id}/turn-projection
  description: 'Computed read: projected vs realized turn minutes, staffing adequacy'
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: '{ projected_turn_minutes: integer, projected_bags: integer, pax_minutes: integer, turns_slip: boolean, understaffed:
    boolean, load_factor: number, bags_per_ramp_agent: number }'
  side_effects: []
- method: GET
  path: /ops/flight-legs/{leg_id}/staffing-check
  description: 'Computed read: ground staffing adequacy detail for gate staffing decisions'
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: '{ understaffed: boolean, staff_units: integer, load_factor: number, bags_per_ramp_agent: number, projected_bags:
    integer }'
  side_effects: []
- method: POST
  path: /ops/aircraft-routings
  description: Create an aircraft day-routing (point-to-point line; no bank structure)
  roles:
  - OpsController
  code: 201
  input:
  - routing_date
  - aircraft_id
  - leg_ids
  output: AircraftRouting
  side_effects:
  - slack_minutes computed via routing_slack
- method: GET
  path: /ops/aircraft-routings/{routing_id}
  description: Get an aircraft routing
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: AircraftRouting
  side_effects: []
- method: GET
  path: /ops/aircraft-routings
  description: List routings (filter by aircraft_id, routing_date, status)
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - aircraft_id?
  - routing_date?
  - routing_status?
  - leg_ids?
  - limit?
  - offset?
  output: AircraftRouting[]
  side_effects: []
- method: POST
  path: /ops/crew-pairings
  description: Create a crew pairing over ordered legs
  roles:
  - OpsController
  code: 201
  input:
  - pairing_date
  - crew_member_id
  - leg_ids
  output: CrewPairing
  side_effects: []
- method: GET
  path: /ops/crew-pairings/{pairing_id}
  description: Get a crew pairing
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: CrewPairing
  side_effects: []
- method: GET
  path: /ops/crew-pairings
  description: List pairings (filter by crew_member_id, pairing_date, status)
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - crew_member_id?
  - pairing_date?
  - pairing_status?
  - leg_ids?
  - limit?
  - offset?
  output: CrewPairing[]
  side_effects: []
- method: POST
  path: /ops/bookings
  description: Create a booking with embedded journeys (fare class, accommodation, family anchor)
  roles:
  - Passenger
  code: 201
  input:
  - record_locator
  - channel?
  - journeys
  output: Booking
  side_effects:
  - PassengerJourney rows created BOOKED; accommodation markers validated
- method: GET
  path: /ops/bookings/{booking_id}
  description: Get a booking
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: Booking
  side_effects: []
- method: GET
  path: /ops/bookings/{booking_id}/journeys
  description: 'Reverse-reachability: journeys under a booking'
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input:
  - journey_status?
  - limit?
  - offset?
  output: PassengerJourney[]
  side_effects: []
- method: GET
  path: /ops/journeys/{journey_id}
  description: Get a passenger journey
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: PassengerJourney
  side_effects: []
- method: GET
  path: /ops/journeys
  description: List journeys (multi-FK filtered list; reverse-reachability for booking_id, passenger_id, flight_leg_id, fare_class_id,
    family_anchor_journey_id)
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input:
  - booking_id?
  - passenger_id?
  - flight_leg_id?
  - fare_class_id?
  - family_anchor_journey_id?
  - journey_status?
  - limit?
  - offset?
  output: PassengerJourney[]
  side_effects: []
- method: GET
  path: /ops/journeys/{journey_id}/boarding-assignments
  description: 'Reverse-reachability: assignment history for a journey, ordered created_at DESC (latest ACTIVE first)'
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: BoardingAssignment[]
  side_effects: []
- method: GET
  path: /ops/journeys/{journey_id}/upgrades
  description: 'Reverse-reachability: upgrades purchased on a journey, ordered created_at ASC'
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: BoardingUpgrade[]
  side_effects: []
- method: GET
  path: /ops/journeys/{journey_id}/bags
  description: 'Reverse-reachability: bags checked on a journey'
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: Bag[]
  side_effects: []
- method: POST
  path: /ops/journeys/{journey_id}/check-in
  description: Direct check-in on a journey (non-OCC convenience path; same validations as leg-scoped check-in)
  roles:
  - Passenger
  code: 200
  input: []
  output: PassengerJourney
  side_effects:
  - journey → CHECKED_IN; boarding_position_assignment runs
- method: POST
  path: /ops/journeys/{journey_id}/cancel
  description: Cancel a journey; mint travel credit, refund upgrades, void assignment
  roles:
  - Passenger
  code: 200
  input: []
  output: PassengerJourney
  side_effects:
  - travel_credit_mint runs; assignment VOIDED; upgrades REFUNDED; booking auto-CANCELLED when all journeys terminal
- method: POST
  path: /ops/journeys/{journey_id}/change
  description: Change flight/fare on a journey; flexible fares change free, downgrade residual becomes credit
  roles:
  - Passenger
  code: 200
  input:
  - new_flight_leg_id
  - new_fare_class_id
  - new_base_fare_cents
  output: PassengerJourney
  side_effects:
  - ACTIVE redemptions VOIDED with credit restoration (compensation); change fee assessed; downgrade credit minted for flexible
    fares
- method: POST
  path: /ops/journeys/{journey_id}/bags
  description: Check a bag on a journey (weight check, fee waterfall, count cap)
  roles:
  - GateAgent
  code: 201
  input:
  - weight_lbs
  output: Bag
  side_effects:
  - bag_fee_assessment runs; bag_fee_cents computed
- method: POST
  path: /ops/bags/{bag_id}/offload
  description: Offload an accepted bag before departure
  roles:
  - GateAgent
  code: 200
  input: []
