            - "trigger call 2: error.id == 'ERR_MEDIA_FILL_NOT_FOUND'"
            - "trigger call 3: error.id == 'ERR_QUALIFICATION_NOT_FOUND'"
            - "trigger call 4: error.id == 'ERR_COMPONENT_LOT_NOT_FOUND'"
            - "trigger call 5: error.id == 'ERR_RESERVATION_NOT_FOUND'"
            - "trigger call 6: error.id == 'ERR_IN_PROCESS_CHECK_NOT_FOUND'"
