  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: id_window_closed_inclusive_45day_overlap
        grounds:
          - validations[priority=7]
          - entities.Exchange.fields.id_deadline_at
          - errors[ERR_ID_DEADLINE_PASSED]
        distinguishing_aspect: |
          Interval semantics A — CLOSED-end window [closing, id_deadline] inclusive on the
          Exchange's identification window resource: finalize ON the boundary instant succeeds,
          strictly AFTER it (day 46) fails. The endpoint occupies the [Day0, Day45] closed interval.
        test_recipe:
          setup:
            - "FORWARD exchange closed at 2026-03-01 (id_deadline_at 2026-04-15T00:00:00Z); DRAFT identification with one candidate; clock advanced to 2026-04-16 (day 46, just past the closed window)."
