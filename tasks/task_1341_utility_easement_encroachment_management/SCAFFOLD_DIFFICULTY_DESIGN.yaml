scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc — two calculations on different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: offer_provisional_vs_final_compensation
        grounds:
          - calculations.compensation_balance
          - entities.AcquisitionOffer.fields.total_compensation_cents
          - state_machines.AcquisitionOffer.TENDERED_to_ACCEPTED
        distinguishing_aspect: |
          The compensation_balance calculation on AcquisitionOffer has two
          variants (provisional_view during negotiation, final_view at case
          closure). The provisional view includes the current negotiated total
          in compensation_committed_cents; the final view at closure releases
          rejected/withdrawn offers. This is a different entity domain
          (AcquisitionOffer / EasementCase fiscal) than the severity_tier
          re-derivation on Encroachment.
        test_recipe:
          setup:
            - "EasementCase in ACTIVE_MONITORING with title_cleared=true, easement_area_sqft=10000, fair_market_value_per_sqft=10, acquisition_budget_cents=50000000"
            - "One RECORDED EasementDocument"
            - "One AcquisitionOffer DRAFT with offered_area_sqft=1000, severance_damages_cents=500000 (base_compensation=1000000)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-001", utility_district: "D1", county: "King", parcel_id: "P-001", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-001", recording_date: "2026-07-01T00:00:00Z", grantor_name: "Smith", grantee_name: "CityUtil", gis_polygon_wkt: "POLYGON((0 0, 1 0, 1 1, 0 1, 0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "Jones", landowner_contact: "j@x.com", offered_area_sqft: 1000, severance_damages_cents: 500000 }
              as: RightOfWayAgent
              captures: { offer_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/tender"
              payload: { expected_case_version: "${case_v1}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/counter"
              payload: { counter_amount_cents: 1200000 }
              as: RightOfWayAgent
          assert:
            - "AcquisitionOffer.${offer_id}.base_compensation_cents == 1000000"
            - "AcquisitionOffer.${offer_id}.negotiated_compensation_cents == 1200000"
            - "AcquisitionOffer.${offer_id}.total_compensation_cents == 1700000"
            - "EasementCase.${case_id}.compensation_committed_cents == 1700000"
            - "EasementCase.${case_id}.compensation_balance_cents == 48300000"

      - name: encroachment_severity_provisional_vs_rederived_on_supersede
        grounds:
          - calculations.severity_tier
          - state_machines.EasementDocument.RECORDED_to_SUPERSEDED
          - entities.Encroachment.fields.severity_tier
        distinguishing_aspect: |
          severity_tier on Encroachment has two variants: provisional_severity
          computed at creation against the currently-RECORDED document's
          width_ft, and re_derived_severity recomputed when the encroached
          document is superseded by a new RECORDED document with a different
          width_ft. This is a different entity domain (Encroachment / safety
          classification) than the offer compensation fiscal domain.
        test_recipe:
          setup:
            - "EasementCase in ACTIVE_MONITORING with title_cleared=true, easement_width_ft=50, easement_area_sqft=10000"
            - "RECORDED document D1 with width_ft=50"
            - "Encroachment E with encroachment_type=STRUCTURE, encroachment_area_sqft=2500 (area_ratio=0.25), depth_into_easement_ft=10 (depth_ratio=0.2)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-002", utility_district: "D1", county: "King", parcel_id: "P-002", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-101", recording_date: "2026-07-01T00:00:00Z", grantor_name: "Smith", grantee_name: "CityUtil", gis_polygon_wkt: "POLYGON((0 0, 1 0, 1 1, 0 1, 0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc1_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc1_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "STRUCTURE", encroachment_area_sqft: 2500, depth_into_easement_ft: 10, encroaches_document_id: "${doc1_id}", estimated_removal_cost_cents: 500000 }
              as: RightOfWayAgent
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "AMENDMENT", instrument_number: "INST-102", recording_date: "2026-08-01T00:00:00Z", grantor_name: "Smith", grantee_name: "CityUtil", gis_polygon_wkt: "POLYGON((0 0, 2 0, 2 1, 0 1, 0 0))", width_ft: 20, supersedes_document_id: "${doc1_id}" }
              as: TitleExaminer
              captures: { doc2_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents/${doc2_id}/record"
              payload: {}
              as: TitleExaminer
          assert:
            # provisional: base=3, area_ratio=0.25 -> depth_mult=2.0, depth_ratio=10/50=0.2 -> raw=3*(1+0.2*2)=4.2 -> SEVERE
            - "Before supersede: Encroachment.${enc_id}.severity_tier == SEVERE"
            # re-derived: width_ft=20, depth_ratio=10/20=0.5, area_ratio still 0.25 -> depth_mult=2.0 -> raw=3*(1+0.5*2)=6.0 -> CRITICAL
            - "After supersede: Encroachment.${enc_id}.severity_tier == CRITICAL"
            - "EasementDocument.${doc1_id}.status == SUPERSEDED"
            - "EasementDocument.${doc2_id}.status == RECORDED"

  # =====================================================================
  # Rule 2: combinatorial_formula — different modes (a), (b), (c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: severity_tier_mode_a_nonlinear_interaction
        grounds:
          - calculations.severity_tier
        distinguishing_aspect: |
          Mode (a): severity_tier combines >=3 inputs (encroachment_type,
          encroachment_area_sqft, depth_into_easement_ft, width_ft) with
          non-linear interaction — depth_multiplier is conditionally selected
          based on area_ratio thresholds, producing different tiers at the
          boundary area_ratio=0.25 vs 0.249.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING with easement_area_sqft=10000, RECORDED doc width_ft=50"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-003", utility_district: "D1", county: "King", parcel_id: "P-003", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-201", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
          trigger:
            # Boundary: area_ratio=0.25 (exactly at tier) vs 0.249 (just below)
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "AERIAL_SURVEY", encroachment_type: "STRUCTURE", encroachment_area_sqft: 2500, depth_into_easement_ft: 10, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_at_tier: $.data.id }
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "AERIAL_SURVEY", encroachment_type: "STRUCTURE", encroachment_area_sqft: 2499, depth_into_easement_ft: 10, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_below_tier: $.data.id }
          assert:
            # At tier: area_ratio=0.25 -> mult=2.0, depth_ratio=0.2 -> raw=3*(1+0.4)=4.2 -> SEVERE
            - "Encroachment.${enc_at_tier}.severity_tier == SEVERE"
            # Below tier: area_ratio=0.2499 -> mult=1.5, depth_ratio=0.2 -> raw=3*(1+0.3)=3.9 -> SEVERE
            - "Encroachment.${enc_below_tier}.severity_tier == SEVERE"
            # Note: tier flips only when raw_score crosses 3.5; the multiplier difference (2.0 vs 1.5) is what matters

      - name: permit_fee_mode_b_nested_rounding_order
        grounds:
          - calculations.permit_fee
        distinguishing_aspect: |
          Mode (b): permit_fee uses nested rounding where order matters —
          each tier's area_component is rounded half-up independently, then
          summed with the base rate. An area of 2001 sqft (straddling two
          tiers) produces a different result than sum-then-round.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, title_cleared, RECORDED doc, encroachment NEGOTIATING, permit requested_area_sqft=2001"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-004", utility_district: "D1", county: "King", parcel_id: "P-004", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-301", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "STRUCTURE", encroachment_area_sqft: 100, depth_into_easement_ft: 1, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/notify"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "Owner", permit_type: "STRUCTURE_RETENTION", requested_area_sqft: 2001, requested_start_date: "2026-09-01T00:00:00Z", requested_end_date: "2027-09-01T00:00:00Z", encroachment_id: "${enc_id}", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { permit_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${permit_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${permit_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /easement-cases/${case_id}/permits/${permit_id}/approve"
              payload: { expected_case_version: "${case_v2}" }
              as: RightOfWayAgent
          assert:
            # base=50000; tier1: 500*12=6000; tier2: 1500*8=12000; tier3: 1*5=5; area_component=18005
            # per-tier round_half_up then sum: 50000+6000+12000+5=68005
            - "ThirdPartyPermit.${permit_id}.annual_fee_cents == 68005"
            - "ThirdPartyPermit.${permit_id}.approval_status == APPROVED"

  # =====================================================================
  # Rule 3: non_linear_state_machine — different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: encroachment_negotiation_cycle
        grounds:
          - state_machines.Encroachment
        distinguishing_aspect: |
          Encroachment has a cyclic negotiation loop: NEGOTIATING -> COUNTERED
          -> NEGOTIATING (via resume-negotiation), bounded by MAX_NEGOTIATION_ROUNDS.
          This is a cycle on the Encroachment entity.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, RECORDED doc, encroachment NOTIFIED"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-005", utility_district: "D1", county: "King", parcel_id: "P-005", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-401", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "FENCE", encroachment_area_sqft: 500, depth_into_easement_ft: 5, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/notify"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/counter"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/resume-negotiation"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/counter"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "Encroachment.${enc_id}.status == COUNTERED"
            - "Encroachment.${enc_id}.negotiation_round == 3"

      - name: third_party_permit_parallel_dimensions
        grounds:
          - state_machines.ThirdPartyPermit
        distinguishing_aspect: |
          ThirdPartyPermit has two parallel state dimensions: approval_status
          (PENDING -> APPROVED/DENIED/REVOKED) and field_inspection_status
          (NOT_SCHEDULED -> SCHEDULED -> PASSED/FAILED). They evolve semi-
          independently, and a FAILED inspection on an APPROVED permit triggers
          auto-REVOKE. This is parallel dimensions on the ThirdPartyPermit entity.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, RECORDED doc, encroachment NEGOTIATING, permit PENDING with SCHEDULED inspection"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-006", utility_district: "D1", county: "King", parcel_id: "P-006", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-501", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "STRUCTURE", encroachment_area_sqft: 100, depth_into_easement_ft: 1, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/notify"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "Owner", permit_type: "DRIVEWAY", requested_area_sqft: 400, requested_start_date: "2026-09-01T00:00:00Z", requested_end_date: "2027-09-01T00:00:00Z", encroachment_id: "${enc_id}", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { permit_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${permit_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
          trigger:
            - call: "POST /easement-cases/${case_id}/permits/${permit_id}/record-inspection"
