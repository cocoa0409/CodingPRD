            - "trigger response data.error_id == 'ERR_ROUTE_WEIGHT_EXCEEDED'"
            - "trigger response HTTP status == 409"

      - name: max_reattempts_count_boundary
        grounds:
          - validations[priority=11]
          - entities.DeliveryOrder.fields.reattempt_count
        distinguishing_aspect: |
          At the reattempt count boundary on POST /delivery-orders/{orderId}/windows: rescheduling is
          allowed while reattempt_count < 2 (the first reschedule at count 1 succeeds) but is rejected
          at reattempt_count == 2 with ERR_MAX_REATTEMPTS — a count boundary on a different endpoint
          than the weight boundary.
