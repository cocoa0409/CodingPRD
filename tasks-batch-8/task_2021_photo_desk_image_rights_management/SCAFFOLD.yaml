# =============================================================================
# Task 2021: Photo Desk & Image Rights Management — scaffold seed tables
# =============================================================================

scenario: |
  2021. Photo Desk & Image Rights Management (news organization photo desk): assignment vs wire/stock sourcing decision, licensing terms & usage scope per image, metadata/caption standards & credit requirements, embargo & restricted-use enforcement, archive search & re-use license check, model/property release tracking, infringement claim intake & resolution, photographer payment & rights reversion

domain_name: photo-desk-rights
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - soft_delete
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Photographer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Photographer full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across photographers" }
      - { name: photographer_type, type: enum, source: input, constraints: "STAFF | FREELANCE", description: "Contract type; selects payout variant (STAFF=GUARANTEE, FREELANCE=ROYALTY)" }
      - { name: day_rate_cents, type: integer, source: input, description: "Per-shoot-day rate used by the GUARANTEE payout method" }
      - { name: per_image_fee_cents, type: integer, source: input, description: "Fee credited to accrued_earnings_cents per image cleared on assignment acceptance" }
      - { name: royalty_rate_per_use_cents, type: integer, source: input, description: "Base per-usage-run royalty rate used by the ROYALTY payout method" }
      - { name: rights_reversion_months, type: integer, source: input, default: 24, description: "Calendar months after first publication when rights in ASSIGNMENT images revert to the photographer" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED photographers cannot be commissioned" }
      - { name: accrued_earnings_cents, type: integer, source: computed, default: 0, description: "Lifetime accrual ledger: per-image clearance fees + usage royalties - claim clawbacks (floor 0 per decrement)" }
      - { name: paid_out_cents, type: integer, source: computed, default: 0, description: "Lifetime disbursed total: sum of total_cents over PAID payment runs, debited back on PAID->VOIDED" }

  - name: StoryRequest
    parent: null
    common_fields: true
    fields:
      - { name: headline, type: string, source: input, description: "Story headline the art is for" }
      - { name: slug, type: string, source: input, description: "Story slug; unique across story requests" }
      - { name: needed_by, type: datetime, source: input, description: "Editorial deadline" }
      - { name: budget_cents, type: integer, source: input, description: "Art budget for this story" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of fee_cents over linked Licenses with status ACTIVE; released on revoke/supersede/expire" }
      - { name: decision, type: enum, source: system, constraints: "COMMISSION | WIRE_STOCK", description: "Sourcing decision; null until decide endpoint called" }
      - { name: commissioned_assignment_id, type: string, source: system, description: "id of the Assignment created when decision=COMMISSION; null otherwise" }
      - { name: sourced_image_id, type: string, source: system, description: "id of the existing Image linked when decision=WIRE_STOCK; null otherwise" }
      - { name: status, type: enum, source: system, constraints: "OPEN | DECIDED | FULFILLED | CANCELLED", description: "OPEN -> DECIDED -> FULFILLED; CANCELLED from OPEN or DECIDED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: story_request_id, type: string, source: system, description: "FK -> StoryRequest.id; set at decide(COMMISSION)" }
      - { name: photographer_id, type: string, source: system, description: "FK -> Photographer.id; commissioned photographer" }
      - { name: brief, type: string, source: input, description: "Shoot brief" }
      - { name: shoot_start, type: datetime, source: input, description: "Shoot window start (date portion drives day_count)" }
      - { name: shoot_end, type: datetime, source: input, description: "Shoot window end; must be >= shoot_start" }
      - { name: min_image_count, type: integer, source: input, default: 1, description: "Minimum submitted images required before submit" }
      - { name: max_image_count, type: integer, source: input, default: 10, description: "Maximum images the assignment accepts" }
      - { name: day_count, type: integer, source: computed, description: "date(shoot_end) - date(shoot_start) + 1 (calendar days, inclusive)" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of request-revision cycles" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance; null until ACCEPTED" }
      - { name: kill_fee_cents, type: integer, source: computed, default: 0, description: "Kill fee credited on cancel from SUBMITTED/REVISION_REQUESTED; 0 otherwise" }
      - { name: status, type: enum, source: system, constraints: "COMMISSIONED | IN_PROGRESS | SUBMITTED | REVISION_REQUESTED | ACCEPTED | CANCELLED", description: "Assignment lifecycle with revision cycle" }

  - name: Image
    parent: null
    common_fields: true
    fields:
      - { name: photographer_id, type: string, source: system, description: "FK -> Photographer.id; set from assignment for ASSIGNMENT source; null for WIRE/STOCK" }
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; set for ASSIGNMENT source; null for WIRE/STOCK" }
      - { name: source_type, type: enum, source: system, constraints: "ASSIGNMENT | WIRE | STOCK", description: "ASSIGNMENT via assignment submission; WIRE/STOCK via desk ingest" }
      - { name: agency_name, type: string, source: input, description: "Wire/stock agency name; required when source_type is WIRE or STOCK" }
      - { name: base_license_fee_cents, type: integer, source: input, description: "Agency base fee feeding license_fee_quote; forced to 0 for ASSIGNMENT images" }
      - { name: caption, type: string, source: input, description: "Caption text; optional at ingest, mandatory (>= 10 chars) before clear" }
      - { name: credit_line, type: string, source: input, description: "Credit line, e.g. 'Jane Doe / ACME News'; optional at ingest, mandatory before clear" }
      - { name: keywords, type: array, source: input, default: [], description: "Search keywords" }
      - { name: has_identifiable_people, type: boolean, source: input, default: false, description: "True when recognizable people appear; drives MODEL release requirement" }
      - { name: has_private_property, type: boolean, source: input, default: false, description: "True when private property is depicted; drives PROPERTY release requirement" }
      - { name: embargo_until, type: datetime, source: input, description: "Embargo instant; usage with published_at strictly before this is rejected; exactly at it is allowed; null = no embargo" }
      - { name: status, type: enum, source: system, constraints: "INGESTED | CLEARED | PUBLISHED | ARCHIVED", description: "Editorial lifecycle dimension" }
      - { name: restriction_status, type: enum, source: system, default: NONE, constraints: "NONE | RESTRICTED", description: "Rights-restriction dimension, independent of status; latched by claim intake, lifted by dismissal" }
      - { name: times_used, type: integer, source: computed, default: 0, description: "Count of UsageRun records for this image; drives royalty tier ordinal" }
      - { name: first_published_at, type: datetime, source: system, description: "published_at of the first usage run; null until first use" }
      - { name: rights_reversion_at, type: datetime, source: computed, description: "first_published_at + photographer.rights_reversion_months (calendar months) for ASSIGNMENT images; null for WIRE/STOCK and before first publication" }
      - { name: rights_reverted, type: boolean, source: computed, default: false, description: "rights_reversion_at is not null AND logical now >= rights_reversion_at" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: image_id, type: string, source: system, description: "FK -> Image.id; licensed image" }
      - { name: story_request_id, type: string, source: input, description: "FK -> StoryRequest.id; optional story budget this license charges" }
      - { name: usage_scope, type: enum, source: input, constraints: "PRINT | DIGITAL | SOCIAL | SYNDICATION", description: "Channel scope granted" }
      - { name: territory, type: enum, source: input, default: DOMESTIC, constraints: "DOMESTIC | INTERNATIONAL | GLOBAL", description: "Territory multiplier input" }
      - { name: valid_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "Window end (inclusive; closed interval for usage checks, half-open [valid_from, valid_to) for exclusivity overlap)" }
      - { name: exclusive, type: boolean, source: input, default: false, description: "Exclusive licenses lock the image across all scopes for their window" }
      - { name: pricing_variant, type: enum, source: computed, constraints: "FIRST_USE | REUSE", description: "REUSE when image.times_used > 0 at creation, else FIRST_USE" }
      - { name: fee_cents, type: integer, source: computed, description: "license_fee_quote output; computed at creation" }
      - { name: superseded_by_id, type: string, source: system, description: "id of the License that superseded this one; null unless revoked by supersession" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | ACTIVE | EXPIRED | REVOKED", description: "EXPIRED is lazily derived: an ACTIVE license with valid_to <= logical now reads as EXPIRED" }

  - name: ReleaseRecord
    parent: null
    common_fields: true
    fields:
      - { name: image_id, type: string, source: system, description: "FK -> Image.id; released image" }
      - { name: subject_type, type: enum, source: input, constraints: "MODEL | PROPERTY", description: "Release kind" }
      - { name: subject_name, type: string, source: input, description: "Name of released subject" }
      - { name: document_ref, type: string, source: input, description: "Reference to the signed release document" }
      - { name: signed_at, type: datetime, source: input, description: "Signature date" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; null = perpetual. Expired when expires_at <= logical now" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | REVOKED | EXPIRED", description: "EXPIRED lazily derived from expires_at; REVOKED via revoke endpoint" }

  - name: UsageRun
    parent: null
    common_fields: false
    fields:
      - { name: image_id, type: string, source: system, description: "FK -> Image.id; published image" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; license authorizing this use" }
      - { name: channel, type: enum, source: input, constraints: "PRINT | DIGITAL | SOCIAL | SYNDICATION", description: "Channel of publication; must equal license.usage_scope" }
      - { name: story_slug, type: string, source: input, description: "Story slug the image ran with" }
      - { name: published_at, type: datetime, source: input, description: "Publication instant used for embargo/window checks and payout period filtering" }
      - { name: royalty_cents, type: integer, source: computed, description: "Per-use royalty credited for this run (photographer_payout line item)" }

  - name: InfringementClaim
    parent: null
    common_fields: true
    fields:
      - { name: image_id, type: string, source: input, description: "FK -> Image.id; disputed image" }
      - { name: claimant_name, type: string, source: input, description: "Claimant name" }
      - { name: claim_type, type: enum, source: input, constraints: "UNLICENSED_USE | COPYRIGHT_DISPUTE | MODEL_RELEASE_VIOLATION", description: "Claim category" }
      - { name: description, type: string, source: input, description: "Claim narrative" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed" }
      - { name: proposed_settlement_cents, type: integer, source: system, description: "Latest offer/counter amount on the negotiation cycle" }
      - { name: settlement_amount_cents, type: integer, source: system, description: "Final settlement; set at resolve(UPHELD)" }
      - { name: photographer_clawback_cents, type: integer, source: computed, description: "settlement_split output: photographer-borne share debited from accrued_earnings_cents" }
      - { name: intaken_by_user_id, type: string, source: system, description: "X-User-ID recorded at intake; the same user id may not resolve the claim (segregation of duties)" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID at resolution" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolution; null until terminal" }
      - { name: resolution_outcome, type: enum, source: system, constraints: "UPHELD | DISMISSED", description: "null until resolved" }
      - { name: status, type: enum, source: system, constraints: "INTAKE | UNDER_REVIEW | SETTLEMENT_OFFERED | COUNTERED | ESCALATED | RESOLVED | DISMISSED", description: "Claim lifecycle with negotiation cycle" }

  - name: PaymentRun
    parent: null
    common_fields: true
    fields:
      - { name: photographer_id, type: string, source: system, description: "FK -> Photographer.id; payee" }
      - { name: period_start, type: datetime, source: input, description: "Payout period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Payout period end (exclusive); must be > period_start" }
      - { name: method, type: enum, source: computed, constraints: "GUARANTEE | ROYALTY", description: "Variant selected from photographer.photographer_type" }
      - { name: guarantee_amount_cents, type: integer, source: computed, description: "Day-rate + per-image-fee total for the period (both variants always computed)" }
      - { name: royalty_amount_cents, type: integer, source: computed, description: "Per-use royalty total for the period (per-line rounded then summed)" }
      - { name: clawback_cents, type: integer, source: computed, description: "Claim clawbacks resolved within the period for this photographer's images" }
      - { name: total_cents, type: integer, source: computed, description: "max(0, chosen-method amount - clawback_cents)" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | APPROVED | PAID | VOIDED", description: "Payment run lifecycle; PAID -> VOIDED is the compensation path" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Photographer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /photographers/{id}/suspend
        actor: PhotoEditor
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /photographers/{id}/reactivate
        actor: PhotoEditor
        preconditions: []
        side_effects: []

  - entity: StoryRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: POST /story-requests/{id}/decide
        actor: PhotoEditor
        preconditions:
          - "status == OPEN (else ERR_STORY_ALREADY_DECIDED)"
          - "decision == COMMISSION: photographer_id/brief/shoot_start/shoot_end present (ERR_INVALID_REQUEST); photographer exists (ERR_PHOTOGRAPHER_NOT_FOUND) and status == ACTIVE (ERR_PHOTOGRAPHER_SUSPENDED); no double-booking (ERR_PHOTOGRAPHER_DOUBLE_BOOKED)"
          - "decision == WIRE_STOCK: image_id present; image exists (ERR_IMAGE_NOT_FOUND) and image.status in {CLEARED, PUBLISHED, ARCHIVED} (ERR_IMAGE_NOT_CLEARED)"
        side_effects:
          - "COMMISSION: create Assignment (status COMMISSIONED, day_count computed) and set commissioned_assignment_id"
          - "WIRE_STOCK: set sourced_image_id"
      - from: OPEN
        to: CANCELLED
        trigger: POST /story-requests/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects: []
      - from: DECIDED
        to: CANCELLED
        trigger: POST /story-requests/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects:
          - "Cascade down: commissioned Assignment in {COMMISSIONED, IN_PROGRESS, SUBMITTED, REVISION_REQUESTED} -> CANCELLED (kill fee rule applies)"
          - "Licenses with story_request_id == this and status in {DRAFT, ACTIVE} -> REVOKED; committed_cents recomputed"
      - from: DECIDED
        to: FULFILLED
        trigger: "system (a UsageRun is created whose license.story_request_id == this request)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Assignment
    initial_state: COMMISSIONED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: COMMISSIONED
        to: IN_PROGRESS
        trigger: "system (first image submitted via POST /assignments/{id}/images)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: IN_PROGRESS
        trigger: "system (an image is submitted via POST /assignments/{id}/images while in REVISION_REQUESTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: POST /assignments/{id}/submit
        actor: Photographer
        preconditions:
          - "acting photographer owns the assignment (photographer_id == X-User-ID, else ERR_FORBIDDEN)"
          - "image count in {INGESTED} >= min_image_count (ERR_MIN_IMAGES_NOT_MET)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /assignments/{id}/accept
        actor: PhotoEditor
        preconditions: []
        side_effects:
          - "accepted_at = logical now"
          - "Cascade hop 1: every Image with assignment_id == this and status INGESTED -> CLEARED"
          - "Cascade hop 2 (per cleared image): Photographer.accrued_earnings_cents += photographer.per_image_fee_cents; Photographer.version increments"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: POST /assignments/{id}/request-revision
        actor: PhotoEditor
        preconditions: []
        side_effects:
          - "revision_count += 1"
      - from: COMMISSIONED
        to: CANCELLED
        trigger: POST /assignments/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: POST /assignments/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /assignments/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects:
          - "assignment_kill_fee runs: kill_fee_cents = round_half_up(day_rate_cents * day_count * 0.5); Photographer.accrued_earnings_cents += kill_fee_cents"
      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: POST /assignments/{id}/cancel
        actor: PhotoEditor
        preconditions: []
        side_effects:
          - "assignment_kill_fee runs (same rule as SUBMITTED -> CANCELLED)"

  - entity: Image
    initial_state: INGESTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: INGESTED
        to: CLEARED
        trigger: POST /images/{id}/clear
        actor: RightsManager
        preconditions:
          - "caption present with length >= 10 AND credit_line present and non-empty (ERR_INCOMPLETE_METADATA)"
        side_effects: []
      - from: INGESTED
        to: CLEARED
        trigger: "system (assignment acceptance cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: PUBLISHED
        trigger: "system (first UsageRun created for this image)"
        actor: system
        preconditions: []
        side_effects:
          - "first_published_at = published_at of that run"
          - "rights_reversion_date runs for ASSIGNMENT images"
      - from: CLEARED
        to: ARCHIVED
        trigger: POST /images/{id}/archive
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: ARCHIVED
        trigger: POST /images/{id}/archive
        actor: RightsManager
        preconditions: []
        side_effects: []

  - entity: Image.restriction_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: RESTRICTED
        trigger: "system (POST /infringement-claims intake on this image)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTRICTED
        to: NONE
        trigger: "system (the open claim on this image is resolved DISMISSED and no other open claim remains)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NONE
        to: RESTRICTED
        trigger: "system (a claim on this image is resolved UPHELD — restriction latched)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop: every License with image_id == this and status ACTIVE -> REVOKED"

  - entity: License
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /licenses/{id}/activate
        actor: RightsManager
        preconditions:
          - "release gate: image.has_identifiable_people requires an ACTIVE non-expired MODEL ReleaseRecord; image.has_private_property requires PROPERTY (ERR_RELEASE_REQUIRED)"
          - "exclusivity gate: no other ACTIVE exclusive license on the same image whose [valid_from, valid_to) overlaps this window; if this license is exclusive, no other ACTIVE license of any kind overlapping (ERR_EXCLUSIVE_LICENSE_CONFLICT); half-open adjacency allowed"
          - "budget gate: if story_request_id set, story.committed_cents + fee_cents <= story.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "StoryRequest.committed_cents += fee_cents when story_request_id set"
      - from: DRAFT
        to: REVOKED
        trigger: POST /licenses/{id}/revoke
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: POST /licenses/{id}/revoke
        actor: RightsManager
        preconditions: []
        side_effects:
          - "Compensation: StoryRequest.committed_cents -= fee_cents when story_request_id set"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (superseded by a new license with the same usage_scope, or claim-resolve UPHELD cascade, or story cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "On supersession: superseded_by_id set to the replacing license id"
          - "StoryRequest.committed_cents -= fee_cents when story_request_id set"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: logical now >= valid_to; reflected on every read and evaluation)"
        actor: system
        preconditions: []
        side_effects:
          - "StoryRequest.committed_cents -= fee_cents when story_request_id set (budget released at expiry)"

  - entity: ReleaseRecord
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: POST /releases/{id}/revoke
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: logical now >= expires_at when expires_at is not null)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InfringementClaim
    initial_state: INTAKE
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: INTAKE
        to: UNDER_REVIEW
        trigger: POST /infringement-claims/{id}/review
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SETTLEMENT_OFFERED
        trigger: POST /infringement-claims/{id}/offer
        actor: RightsManager
        preconditions: []
        side_effects:
          - "proposed_settlement_cents = settlement_offer_cents"
      - from: SETTLEMENT_OFFERED
        to: COUNTERED
        trigger: POST /infringement-claims/{id}/counter
        actor: RightsManager
        preconditions: []
        side_effects:
          - "proposed_settlement_cents = counter_amount_cents"
      - from: COUNTERED
        to: SETTLEMENT_OFFERED
        trigger: POST /infringement-claims/{id}/offer
        actor: RightsManager
        preconditions: []
        side_effects:
          - "proposed_settlement_cents = settlement_offer_cents"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: POST /infringement-claims/{id}/escalate
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: SETTLEMENT_OFFERED
        to: ESCALATED
        trigger: POST /infringement-claims/{id}/escalate
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: ESCALATED
        trigger: POST /infringement-claims/{id}/escalate
        actor: RightsManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: POST /infringement-claims/{id}/resolve with outcome=UPHELD
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "settlement_amount_cents present, > 0, <= claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolution_outcome = UPHELD; resolved_at = logical now; resolved_by_user_id = X-User-ID"
          - "settlement_split runs: photographer_clawback_cents computed from settlement_amount_cents"
          - "Cascade hop 1: Image.restriction_status latched RESTRICTED"
          - "Cascade hop 2 (per license): every ACTIVE License on the image -> REVOKED"
          - "Cascade hop 3 (per revoked license): linked StoryRequest.committed_cents -= license.fee_cents"
          - "Photographer.accrued_earnings_cents = max(0, accrued_earnings_cents - photographer_clawback_cents) for the image's photographer (ASSIGNMENT images)"
      - from: SETTLEMENT_OFFERED
        to: RESOLVED
        trigger: POST /infringement-claims/{id}/resolve with outcome=UPHELD
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "settlement_amount_cents present, > 0, <= claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects: ["same as UNDER_REVIEW -> RESOLVED (UPHELD)"]
      - from: COUNTERED
        to: RESOLVED
        trigger: POST /infringement-claims/{id}/resolve with outcome=UPHELD
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "settlement_amount_cents present, > 0, <= claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects: ["same as UNDER_REVIEW -> RESOLVED (UPHELD)"]
      - from: ESCALATED
        to: RESOLVED
        trigger: POST /infringement-claims/{id}/resolve with outcome=UPHELD
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "settlement_amount_cents present, > 0, <= claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects: ["same as UNDER_REVIEW -> RESOLVED (UPHELD)"]
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: POST /infringement-claims/{id}/resolve with outcome=DISMISSED
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolution_outcome = DISMISSED; resolved_at = logical now"
          - "Compensation: Image.restriction_status -> NONE when no other open claim (INTAKE/UNDER_REVIEW/SETTLEMENT_OFFERED/COUNTERED/ESCALATED) references the image"
      - from: SETTLEMENT_OFFERED
        to: DISMISSED
        trigger: POST /infringement-claims/{id}/resolve with outcome=DISMISSED
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["same as UNDER_REVIEW -> DISMISSED"]
      - from: COUNTERED
        to: DISMISSED
        trigger: POST /infringement-claims/{id}/resolve with outcome=DISMISSED
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["same as UNDER_REVIEW -> DISMISSED"]
      - from: ESCALATED
        to: DISMISSED
        trigger: POST /infringement-claims/{id}/resolve with outcome=DISMISSED
        actor: RightsManager
        preconditions:
          - "X-User-ID != intaken_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["same as UNDER_REVIEW -> DISMISSED"]

  - entity: PaymentRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /payment-runs/{id}/approve
        actor: FinanceAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: POST /payment-runs/{id}/pay
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "paid_at = logical now; Photographer.paid_out_cents += total_cents"
      - from: DRAFT
        to: VOIDED
        trigger: POST /payment-runs/{id}/void
        actor: FinanceAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: POST /payment-runs/{id}/void
        actor: FinanceAdmin
        preconditions: []
        side_effects: []
      - from: PAID
        to: VOIDED
        trigger: POST /payment-runs/{id}/void
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "Compensation: Photographer.paid_out_cents -= total_cents"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: license-create-stale-image
    parent_entity: Image
    write_endpoint: "POST /images/{id}/licenses"
    occ_field: "expected_image_version"
    description: |
      Creating a License against an Image whose version has advanced since the
      client last observed it is rejected. License creation legitimately
      supersedes an ACTIVE same-scope license (revoking it), so a writer
      holding a stale image version would silently revoke a license it never
      saw; the stale-version check rejects it instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-run-create-stale-photographer
    parent_entity: Photographer
    write_endpoint: "POST /photographers/{id}/payment-runs"
    occ_field: "expected_photographer_version"
    description: |
      Creating a PaymentRun against a Photographer whose version has advanced
      since the client last observed it is rejected. PaymentRun creation
      legitimately voids an overlapping DRAFT run for the same photographer,
      so a writer holding a stale photographer version would void a run it
      never saw; the stale-version check rejects it instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: license_fee_quote
    trigger: "POST /images/{id}/licenses (at DRAFT creation; result stored on License.fee_cents and pricing_variant)"
    algorithm: tiered_pricing
    formula: |
      B = image.base_license_fee_cents
      scoped = B * SCOPE_MULTIPLIER[usage_scope]
      terr = scoped * TERRITORY_MULTIPLIER[territory]
      pre_discount = terr * (EXCLUSIVITY_MULTIPLIER if exclusive else 1.0)
      if pricing_variant == REUSE:
          fee_cents = round_half_up(pre_discount * (1 - REUSE_DISCOUNT_PCT))
      else:
          fee_cents = round_half_up(pre_discount)
      # Pinned order: scope -> territory -> exclusivity -> reuse discount;
      # rounding applied exactly once at the final step.
      # pricing_variant = REUSE iff image.times_used > 0 at creation, else FIRST_USE.
    input_set: "the new License's usage_scope/territory/exclusive; the parent Image's base_license_fee_cents and times_used at creation time"
    constants:
      SCOPE_MULTIPLIER: { PRINT: 1.0, DIGITAL: 1.2, SOCIAL: 0.8, SYNDICATION: 1.5 }
      TERRITORY_MULTIPLIER: { DOMESTIC: 1.0, INTERNATIONAL: 1.3, GLOBAL: 1.6 }
      EXCLUSIVITY_MULTIPLIER: 2.0
      REUSE_DISCOUNT_PCT: 0.40
    precision: "integer cents, round_half_up applied once at the final step"
    variants:
      - name: first_use
        when: "image.times_used == 0 at license creation"
        difference: "no reuse discount: fee = round_half_up(pre_discount)"
      - name: reuse
        when: "image.times_used > 0 at license creation"
        difference: "40% discount applied AFTER the exclusivity multiplier: fee = round_half_up(pre_discount * 0.6); identical terms price lower than first_use"

  - name: photographer_payout
    trigger: "POST /photographers/{id}/payment-runs (at DRAFT creation; stores guarantee_amount_cents, royalty_amount_cents, clawback_cents, method, total_cents)"
    algorithm: aggregation
    formula: |
      # Input windows are half-open [period_start, period_end).
      guarantee_amount_cents =
          sum over Assignment a where a.photographer_id == P, a.status == ACCEPTED,
                period_start <= a.accepted_at < period_end
            of (P.day_rate_cents * a.day_count)
        + sum over Image i where i.photographer_id == P, i.assignment accepted in period
            of P.per_image_fee_cents   # one per-image fee per image cleared by in-period acceptances
      royalty_amount_cents =
          sum over UsageRun u (u.image.photographer_id == P,
                period_start <= u.published_at < period_end)
            of u.royalty_cents
      # Per-line royalty (stored on each UsageRun at creation):
      #   ordinal = image.times_used before this run + 1
      #   tier = TIER_MULTIPLIER_HIGH if ordinal >= TIER_THRESHOLD else 1.0
      #   line = round_half_up(P.royalty_rate_per_use_cents * CHANNEL_ROYALTY_MULTIPLIER[channel] * tier)
      # Pinned rounding order: round each per-usage line HALF_UP to integer
      # cents FIRST, then sum the rounded lines. Never sum-then-round.
      clawback_cents =
          sum over InfringementClaim c (c.image.photographer_id == P,
                c.status == RESOLVED, c.resolution_outcome == UPHELD,
                period_start <= c.resolved_at < period_end)
            of c.photographer_clawback_cents
      method = GUARANTEE if P.photographer_type == STAFF else ROYALTY
      chosen = guarantee_amount_cents if method == GUARANTEE else royalty_amount_cents
      total_cents = max(0, chosen - clawback_cents)
    input_set: "ACCEPTED assignments with accepted_at in [period_start, period_end); usage runs with published_at in [period_start, period_end); UPHELD-resolved claims with resolved_at in [period_start, period_end); all scoped to the photographer"
    constants:
      CHANNEL_ROYALTY_MULTIPLIER: { PRINT: 1.0, DIGITAL: 1.25, SOCIAL: 0.5, SYNDICATION: 2.0 }
      TIER_THRESHOLD: 10
      TIER_MULTIPLIER_HIGH: 1.5
    precision: "integer cents; per-usage line rounded round_half_up before summation"
    variants:
      - name: guarantee
        when: "photographer.photographer_type == STAFF"
        difference: "pays day rates + per-image fees; usage royalties excluded from total_cents"
      - name: royalty
        when: "photographer.photographer_type == FREELANCE"
        difference: "pays per-use royalties only; identical period activity prices differently from guarantee (day rates excluded)"

  - name: settlement_split
    trigger: "POST /infringement-claims/{id}/resolve with outcome=UPHELD"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (circular-looking dependency made explicit):
      #   1. clawback is computed from settlement_amount_cents ALONE, before
      #      any license revocation or accrual recomputation fires.
      #   2. License revocations and story-budget releases then cascade.
      #   3. accrued_earnings_cents is debited LAST, flooring at 0.
      if image.source_type == ASSIGNMENT:
          photographer_clawback_cents = round_half_up(settlement_amount_cents * PHOTOGRAPHER_LIABILITY_PCT)
      else:
          photographer_clawback_cents = 0
      organization_absorbs_cents = settlement_amount_cents - photographer_clawback_cents
    input_set: "the claim being resolved (settlement_amount_cents) and its image (source_type, photographer_id)"
    constants:
      PHOTOGRAPHER_LIABILITY_PCT: 0.30
    precision: "integer cents, round_half_up"

  - name: rights_reversion_date
    trigger: "system when an ASSIGNMENT image records its first UsageRun (CLEARED -> PUBLISHED)"
    algorithm: projection
    formula: |
      if image.source_type == ASSIGNMENT:
          rights_reversion_at = first_published_at + photographer.rights_reversion_months calendar months
      else:
          rights_reversion_at = null
      rights_reverted = (rights_reversion_at is not null) and (logical now >= rights_reversion_at)
      # Boundary: at exactly rights_reversion_at the rights HAVE reverted (>=).
    input_set: "the image being first-published and its photographer's rights_reversion_months"
    constants: {}
    precision: "instant precision; calendar-month arithmetic"

  - name: usage_ordinal_and_tier
    trigger: "POST /images/{id}/usage-runs (per-line royalty computation and Image.times_used derivation)"
    algorithm: aggregation
    formula: |
      ordinal = image.times_used + 1   # runs counted in created_at order; tie-break by created_at ASC (ids never used)
      tier = 1.5 if ordinal >= 10 else 1.0
      if image.photographer_id is null:   # WIRE/STOCK images owe no desk royalty
          royalty_cents = 0
      else:
          royalty_cents = round_half_up(photographer.royalty_rate_per_use_cents * CHANNEL_ROYALTY_MULTIPLIER[channel] * tier)
      image.times_used += 1
    input_set: "all prior UsageRun records for the image (any channel)"
    constants:
      TIER_THRESHOLD: 10
      TIER_MULTIPLIER_HIGH: 1.5
    precision: "integer cents, round_half_up per line"

  - name: assignment_kill_fee
    trigger: "POST /assignments/{id}/cancel from SUBMITTED or REVISION_REQUESTED"
    algorithm: aggregation
    formula: |
      if cancelling from SUBMITTED or REVISION_REQUESTED:
          kill_fee_cents = round_half_up(photographer.day_rate_cents * assignment.day_count * KILL_FEE_PCT)
          photographer.accrued_earnings_cents += kill_fee_cents
      else:
          kill_fee_cents = 0
    input_set: "the assignment being cancelled and its photographer's day_rate_cents"
    constants:
      KILL_FEE_PCT: 0.5
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed for the endpoint; entity-backed ownership holds (Photographer may only submit to/read own assignments and own payment runs); include_archived=true is limited to Archivist and RightsManager", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request shape: required fields present, types valid, enum values in range; conditional requirements (agency_name required for WIRE/STOCK ingest; decide(COMMISSION) requires photographer_id/brief/shoot_start/shoot_end; decide(WIRE_STOCK) requires image_id; resolve(UPHELD) requires 0 < settlement_amount_cents <= claimed_amount_cents; shoot_end >= shoot_start; period_end > period_start; caption >= 10 chars when present)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body-referenced resources exist (photographer, story request, assignment, image, license, release, claim, payment run), validated left-to-right", error_id: ERR_PHOTOGRAPHER_NOT_FOUND, http_status: 404, applies_to: "endpoints with {id} path params or FK body fields (resource-specific NOT_FOUND code per resource)" }
  - { priority: 5, category: state, check: "State-machine from-state preconditions for action endpoints (submit/accept/request-revision/cancel/clear/archive/review/offer/counter/escalate/approve/pay/void); terminal states reject all further transitions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Image editorial gate: license creation, usage-run creation, and decide(WIRE_STOCK) require image.status in {CLEARED, PUBLISHED, ARCHIVED}", error_id: ERR_IMAGE_NOT_CLEARED, http_status: 409, applies_to: ["POST /images/{id}/licenses", "POST /images/{id}/usage-runs", "POST /story-requests/{id}/decide"] }
  - { priority: 7, category: state, check: "Story request must be OPEN to decide", error_id: ERR_STORY_ALREADY_DECIDED, http_status: 409, applies_to: ["POST /story-requests/{id}/decide"] }
  - { priority: 8, category: business_safety, check: "Release gate: image.has_identifiable_people requires an ACTIVE non-expired MODEL ReleaseRecord on the image; image.has_private_property requires PROPERTY", error_id: ERR_RELEASE_REQUIRED, http_status: 422, applies_to: ["POST /licenses/{id}/activate", "POST /images/{id}/usage-runs"] }
  - { priority: 9, category: business_safety, check: "Segregation of duties: claim resolver's X-User-ID must differ from the claim's intaken_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /infringement-claims/{id}/resolve"] }
  - { priority: 10, category: business_constraint, check: "Exclusivity overlap: activating when another ACTIVE exclusive license on the image has [valid_from, valid_to) overlapping this window, or activating an exclusive license while any other ACTIVE license overlaps; half-open semantics — adjacency (valid_from == other.valid_to) is allowed", error_id: ERR_EXCLUSIVE_LICENSE_CONFLICT, http_status: 409, applies_to: ["POST /licenses/{id}/activate"] }
  - { priority: 11, category: business_constraint, check: "Photographer double-booking: commissioned shoot window plus one-day travel buffer on each side ([shoot_start - 1d, shoot_end + 1d], CLOSED interval) must not intersect any existing assignment of the same photographer in {COMMISSIONED, IN_PROGRESS, SUBMITTED, REVISION_REQUESTED} (its buffered window); touching the buffer day is a conflict", error_id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED, http_status: 409, applies_to: ["POST /story-requests/{id}/decide"] }
  - { priority: 12, category: business_constraint, check: "Commissioned photographer must have status == ACTIVE", error_id: ERR_PHOTOGRAPHER_SUSPENDED, http_status: 409, applies_to: ["POST /story-requests/{id}/decide"] }
  - { priority: 13, category: business_constraint, check: "Assignment image count would exceed max_image_count", error_id: ERR_IMAGE_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /assignments/{id}/images"] }
  - { priority: 14, category: business_constraint, check: "Clear requires caption >= 10 chars and non-empty credit_line (metadata/caption standard)", error_id: ERR_INCOMPLETE_METADATA, http_status: 422, applies_to: ["POST /images/{id}/clear"] }
  - { priority: 15, category: business_temporal, check: "Embargo: image.embargo_until is null or published_at >= embargo_until (exactly at the embargo instant is ALLOWED)", error_id: ERR_EMBARGO_ACTIVE, http_status: 422, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 16, category: business_temporal, check: "License window: published_at within [valid_from, valid_to] (CLOSED both ends; exactly at valid_to is allowed)", error_id: ERR_LICENSE_WINDOW_VIOLATION, http_status: 422, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 17, category: business_temporal, check: "Rights reversion: new licenses cannot be created on an ASSIGNMENT image whose rights_reverted is true", error_id: ERR_RIGHTS_REVERTED, http_status: 409, applies_to: ["POST /images/{id}/licenses"] }
  - { priority: 18, category: business_referential, check: "Restriction gate: no open claim on the image (image.restriction_status == NONE)", error_id: ERR_IMAGE_UNDER_CLAIM, http_status: 409, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 19, category: business_referential, check: "license_id must belong to the path image", error_id: ERR_LICENSE_IMAGE_MISMATCH, http_status: 422, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 20, category: business_referential, check: "Usage scope: channel must equal license.usage_scope", error_id: ERR_SCOPE_NOT_LICENSED, http_status: 422, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 21, category: business_referential, check: "License must be ACTIVE to authorize a usage run (EXPIRED/REVOKED/DRAFT rejected)", error_id: ERR_LICENSE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /images/{id}/usage-runs"] }
  - { priority: 22, category: business_constraint, check: "Minimum images: at least min_image_count images submitted before the assignment can be submitted", error_id: ERR_MIN_IMAGES_NOT_MET, http_status: 422, applies_to: ["POST /assignments/{id}/submit"] }
  - { priority: 23, category: business_constraint, check: "Payment period lock: no overlapping [period_start, period_end) with an APPROVED or PAID run for the same photographer (half-open; adjacency allowed); overlapping DRAFT runs are auto-voided instead", error_id: ERR_PAYMENT_PERIOD_LOCKED, http_status: 409, applies_to: ["POST /photographers/{id}/payment-runs"] }
  - { priority: 24, category: business_fiscal, check: "Story budget: story.committed_cents + license.fee_cents <= story.budget_cents on activation", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /licenses/{id}/activate"] }
  - { priority: 25, category: state, check: "OCC: expected_image_version / expected_photographer_version must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /images/{id}/licenses", "POST /photographers/{id}/payment-runs"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/photographers", description: "Onboard a photographer", roles: [PhotoEditor], code: 201, input: [full_name, email, photographer_type, day_rate_cents, per_image_fee_cents, royalty_rate_per_use_cents, "rights_reversion_months?"], output: Photographer, side_effects: [] }
  - { method: GET, path: "/photographers/{id}", description: "Read a photographer (computed ledgers included)", roles: [PhotoEditor, RightsManager, FinanceAdmin, Archivist, Photographer], code: 200, input: [], output: Photographer, side_effects: [] }
  - { method: POST, path: "/photographers/{id}/suspend", description: "Suspend a photographer (cannot be commissioned while SUSPENDED)", roles: [PhotoEditor], code: 200, input: [], output: Photographer, side_effects: [] }
  - { method: POST, path: "/photographers/{id}/reactivate", description: "Reactivate a suspended photographer", roles: [PhotoEditor], code: 200, input: [], output: Photographer, side_effects: [] }
  - { method: GET, path: "/photographers/{id}/payment-runs", description: "List payment runs for a photographer (reverse reachability)", roles: [FinanceAdmin, Photographer], code: 200, input: ["status?", "limit?", "offset?"], output: "PaymentRun[]", side_effects: [] }
  - { method: POST, path: "/photographers/{id}/payment-runs", description: "Create a DRAFT payment run for a period; computes payout via photographer_payout; auto-voids an overlapping DRAFT run (supersede); OCC-guarded on Photographer.version", roles: [FinanceAdmin], code: 201, input: [period_start, period_end, expected_photographer_version], output: PaymentRun, side_effects: ["photographer_payout runs", "overlapping DRAFT PaymentRun -> VOIDED", "increments Photographer.version by 1"] }
  - { method: POST, path: "/story-requests", description: "Open a story art request", roles: [PhotoEditor], code: 201, input: [headline, slug, needed_by, budget_cents], output: StoryRequest, side_effects: [] }
  - { method: GET, path: "/story-requests/{id}", description: "Read a story request", roles: [PhotoEditor, RightsManager, Archivist], code: 200, input: [], output: StoryRequest, side_effects: [] }
  - { method: POST, path: "/story-requests/{id}/decide", description: "Sourcing decision: COMMISSION creates an Assignment; WIRE_STOCK links an existing cleared image", roles: [PhotoEditor], code: 200, input: [decision, "photographer_id?", "brief?", "shoot_start?", "shoot_end?", "min_image_count?", "max_image_count?", "image_id?", "decision_notes?"], output: StoryRequest, side_effects: ["COMMISSION: create Assignment (COMMISSIONED)", "WIRE_STOCK: set sourced_image_id"] }
  - { method: POST, path: "/story-requests/{id}/cancel", description: "Cancel a story request; cascades to its assignment and linked licenses", roles: [PhotoEditor], code: 200, input: [], output: StoryRequest, side_effects: ["assignment cascade cancel with kill-fee rule", "linked DRAFT/ACTIVE licenses -> REVOKED, budget released"] }
  - { method: GET, path: "/assignments", description: "List/filter assignments (reverse reachability for story_request_id and photographer_id)", roles: [PhotoEditor, RightsManager, Photographer], code: 200, input: ["story_request_id?", "photographer_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/assignments/{id}", description: "Read an assignment", roles: [PhotoEditor, RightsManager, Photographer], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{id}/images", description: "Photographer submits an image to an own assignment (source_type ASSIGNMENT)", roles: [Photographer], code: 201, input: [caption, credit_line, "keywords?", "has_identifiable_people?", "has_private_property?", "embargo_until?"], output: Image, side_effects: ["first submission: assignment COMMISSIONED -> IN_PROGRESS; from REVISION_REQUESTED -> IN_PROGRESS"] }
  - { method: GET, path: "/assignments/{id}/images", description: "List images of an assignment (reverse reachability)", roles: [PhotoEditor, RightsManager, Photographer], code: 200, input: ["limit?", "offset?"], output: "Image[]", side_effects: [] }
  - { method: POST, path: "/assignments/{id}/submit", description: "Photographer submits the assignment for editor review", roles: [Photographer], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/assignments/{id}/accept", description: "Editor accepts: images clear, per-image fees accrue", roles: [PhotoEditor], code: 200, input: [], output: Assignment, side_effects: ["accepted_at set", "INGESTED images -> CLEARED", "Photographer.accrued_earnings_cents += per_image_fee_cents per cleared image; Photographer.version increments"] }
  - { method: POST, path: "/assignments/{id}/request-revision", description: "Editor requests revisions (cycle back to photographer)", roles: [PhotoEditor], code: 200, input: ["feedback?"], output: Assignment, side_effects: ["revision_count += 1"] }
  - { method: POST, path: "/assignments/{id}/cancel", description: "Cancel an assignment; kill fee applies from SUBMITTED/REVISION_REQUESTED", roles: [PhotoEditor], code: 200, input: ["reason?"], output: Assignment, side_effects: ["assignment_kill_fee runs"] }
  - { method: POST, path: "/images", description: "Ingest a wire/stock image (source_type WIRE or STOCK; ASSIGNMENT rejected as ERR_INVALID_REQUEST)", roles: [RightsManager], code: 201, input: [source_type, "agency_name?", base_license_fee_cents, "caption?", "credit_line?", "keywords?", "has_identifiable_people?", "has_private_property?", "embargo_until?"], output: Image, side_effects: [] }
  - { method: GET, path: "/images", description: "Archive search: filter by q (keyword/caption), status, source_type, photographer_id, assignment_id; ARCHIVED excluded unless include_archived=true (Archivist/RightsManager only); paginated", roles: [PhotoEditor, RightsManager, Archivist, FinanceAdmin, Photographer], code: 200, input: ["q?", "status?", "source_type?", "photographer_id?", "assignment_id?", "include_archived?", "limit?", "offset?"], output: "Image[]", side_effects: [] }
  - { method: GET, path: "/images/{id}", description: "Read an image (computed rights fields included)", roles: [PhotoEditor, RightsManager, Archivist, FinanceAdmin, Photographer], code: 200, input: [], output: Image, side_effects: [] }
  - { method: POST, path: "/images/{id}/clear", description: "Rights review: INGESTED -> CLEARED; enforces caption/credit metadata standard", roles: [RightsManager], code: 200, input: [], output: Image, side_effects: [] }
  - { method: POST, path: "/images/{id}/archive", description: "Archive an image (soft removal from default search; re-use still licensable)", roles: [RightsManager], code: 200, input: [], output: Image, side_effects: [] }
  - { method: PUT, path: "/images/{id}/embargo", description: "Set or clear embargo_until (null clears)", roles: [RightsManager], code: 200, input: [embargo_until], output: Image, side_effects: ["increments Image.version by 1"] }
  - { method: GET, path: "/images/{id}/reuse-check", description: "Archive re-use license check: eligibility, blocking reasons, fee quote (license_fee_quote with current variant), release requirements", roles: [PhotoEditor, RightsManager, Archivist], code: 200, input: [channel, "published_at?"], output: "{ eligible: boolean, blocking_reasons: array, fee_quote_cents: integer, pricing_variant: string, requires_model_release: boolean, requires_property_release: boolean }", side_effects: [] }
  - { method: POST, path: "/images/{id}/usage-runs", description: "Record a publication of the image under a license; full compliance gate (state, embargo, restriction, releases, window, scope)", roles: [PhotoEditor, RightsManager], code: 201, input: [license_id, channel, story_slug, published_at], output: UsageRun, side_effects: ["usage_ordinal_and_tier runs (royalty_cents, times_used)", "first run: Image CLEARED -> PUBLISHED, first_published_at set, rights_reversion_date runs", "Photographer.accrued_earnings_cents += royalty_cents", "StoryRequest FULFILLED when license.story_request_id matches"] }
  - { method: GET, path: "/images/{id}/usage-runs", description: "List usage runs of an image (reverse reachability)", roles: [PhotoEditor, RightsManager, Archivist, FinanceAdmin], code: 200, input: ["limit?", "offset?"], output: "UsageRun[]", side_effects: [] }
  - { method: POST, path: "/images/{id}/licenses", description: "Create a DRAFT license (fee quoted); supersedes an ACTIVE same-scope license (old -> REVOKED with superseded_by_id); OCC-guarded on Image.version", roles: [RightsManager], code: 201, input: [usage_scope, valid_from, valid_to, "territory?", "exclusive?", "story_request_id?", expected_image_version], output: License, side_effects: ["license_fee_quote runs (fee_cents, pricing_variant)", "supersede: ACTIVE same-scope license -> REVOKED", "increments Image.version by 1"] }
  - { method: GET, path: "/images/{id}/licenses", description: "List licenses of an image (reverse reachability)", roles: [PhotoEditor, RightsManager, Archivist], code: 200, input: ["status?", "limit?", "offset?"], output: "License[]", side_effects: [] }
  - { method: GET, path: "/licenses", description: "List/filter licenses (reverse reachability for story_request_id)", roles: [PhotoEditor, RightsManager, Archivist, FinanceAdmin], code: 200, input: ["image_id?", "story_request_id?", "status?", "limit?", "offset?"], output: "License[]", side_effects: [] }
  - { method: GET, path: "/licenses/{id}", description: "Read a license", roles: [PhotoEditor, RightsManager, Archivist, FinanceAdmin], code: 200, input: [], output: License, side_effects: [] }
  - { method: GET, path: "/licenses/{id}/usage-runs", description: "List usage runs authorized by a license (reverse reachability)", roles: [RightsManager, Archivist, FinanceAdmin], code: 200, input: ["limit?", "offset?"], output: "UsageRun[]", side_effects: [] }
  - { method: POST, path: "/licenses/{id}/activate", description: "Activate a DRAFT license (release, exclusivity, budget gates)", roles: [RightsManager], code: 200, input: [], output: License, side_effects: ["StoryRequest.committed_cents += fee_cents when story_request_id set"] }
  - { method: POST, path: "/licenses/{id}/revoke", description: "Revoke a DRAFT or ACTIVE license (budget released)", roles: [RightsManager], code: 200, input: [], output: License, side_effects: ["StoryRequest.committed_cents -= fee_cents when story_request_id set"] }
  - { method: POST, path: "/images/{id}/releases", description: "Register a model/property release", roles: [RightsManager], code: 201, input: [subject_type, subject_name, document_ref, signed_at, "expires_at?"], output: ReleaseRecord, side_effects: [] }
  - { method: GET, path: "/images/{id}/releases", description: "List releases of an image (reverse reachability)", roles: [PhotoEditor, RightsManager, Archivist], code: 200, input: ["limit?", "offset?"], output: "ReleaseRecord[]", side_effects: [] }
  - { method: POST, path: "/releases/{id}/revoke", description: "Revoke a release", roles: [RightsManager], code: 200, input: [], output: ReleaseRecord, side_effects: [] }
  - { method: POST, path: "/infringement-claims", description: "Intake an infringement claim; latches the image RESTRICTED; stamps intaken_by_user_id", roles: [RightsManager], code: 201, input: [image_id, claimant_name, claim_type, description, claimed_amount_cents], output: InfringementClaim, side_effects: ["Image.restriction_status -> RESTRICTED", "intaken_by_user_id = X-User-ID"] }
  - { method: GET, path: "/infringement-claims", description: "List/filter claims (reverse reachability for image_id)", roles: [RightsManager, PhotoEditor, FinanceAdmin], code: 200, input: ["image_id?", "status?", "limit?", "offset?"], output: "InfringementClaim[]", side_effects: [] }
  - { method: GET, path: "/infringement-claims/{id}", description: "Read a claim", roles: [RightsManager, PhotoEditor, FinanceAdmin], code: 200, input: [], output: InfringementClaim, side_effects: [] }
  - { method: POST, path: "/infringement-claims/{id}/review", description: "INTAKE -> UNDER_REVIEW", roles: [RightsManager], code: 200, input: [], output: InfringementClaim, side_effects: [] }
  - { method: POST, path: "/infringement-claims/{id}/offer", description: "Offer settlement (UNDER_REVIEW or COUNTERED -> SETTLEMENT_OFFERED)", roles: [RightsManager], code: 200, input: [settlement_offer_cents], output: InfringementClaim, side_effects: ["proposed_settlement_cents updated"] }
  - { method: POST, path: "/infringement-claims/{id}/counter", description: "Record claimant counter (SETTLEMENT_OFFERED -> COUNTERED)", roles: [RightsManager], code: 200, input: [counter_amount_cents], output: InfringementClaim, side_effects: ["proposed_settlement_cents updated"] }
  - { method: POST, path: "/infringement-claims/{id}/escalate", description: "Escalate toward litigation (UNDER_REVIEW/SETTLEMENT_OFFERED/COUNTERED -> ESCALATED)", roles: [RightsManager], code: 200, input: [], output: InfringementClaim, side_effects: [] }
  - { method: POST, path: "/infringement-claims/{id}/resolve", description: "Resolve claim: UPHELD runs settlement_split + restriction/license/budget cascade; DISMISSED lifts restriction. Resolver must differ from intaker (SoD)", roles: [RightsManager], code: 200, input: [outcome, "settlement_amount_cents?"], output: InfringementClaim, side_effects: ["settlement_split runs on UPHELD", "UPHELD: image latched RESTRICTED; ACTIVE licenses -> REVOKED; story budgets released; photographer clawback debited", "DISMISSED: restriction lifted when no other open claim"] }
  - { method: GET, path: "/payment-runs/{id}", description: "Read a payment run", roles: [FinanceAdmin], code: 200, input: [], output: PaymentRun, side_effects: [] }
  - { method: POST, path: "/payment-runs/{id}/approve", description: "DRAFT -> APPROVED", roles: [FinanceAdmin], code: 200, input: [], output: PaymentRun, side_effects: [] }
  - { method: POST, path: "/payment-runs/{id}/pay", description: "APPROVED -> PAID; credits Photographer.paid_out_cents", roles: [FinanceAdmin], code: 200, input: [], output: PaymentRun, side_effects: ["Photographer.paid_out_cents += total_cents; paid_at set"] }
  - { method: POST, path: "/payment-runs/{id}/void", description: "DRAFT/APPROVED/PAID -> VOIDED; voiding a PAID run debits paid_out_cents back", roles: [FinanceAdmin], code: 200, input: [], output: PaymentRun, side_effects: ["PAID -> VOIDED: Photographer.paid_out_cents -= total_cents"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Default at server startup is exactly 2026-08-01T00:00:00Z (never wall-clock); this endpoint sets the logical now used by embargo, expiry, reversion, and period logic", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint; Photographer acting on another's assignment/payment runs; include_archived=true by a role other than Archivist/RightsManager" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid fields, bad enum, violated conditional requirement (agency_name, decide-branch fields, settlement bounds, window ordering, caption length, source_type=ASSIGNMENT on ingest)" }
  - { id: ERR_PHOTOGRAPHER_NOT_FOUND, http: 404, condition: "Referenced photographer does not exist" }
  - { id: ERR_STORY_REQUEST_NOT_FOUND, http: 404, condition: "Referenced story request does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Referenced assignment does not exist" }
  - { id: ERR_IMAGE_NOT_FOUND, http: 404, condition: "Referenced image does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "Referenced license does not exist" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "Referenced release does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced infringement claim does not exist" }
  - { id: ERR_PAYMENT_RUN_NOT_FOUND, http: 404, condition: "Referenced payment run does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Action endpoint invoked from a state with no such transition (including terminal states)" }
  - { id: ERR_IMAGE_NOT_CLEARED, http: 409, condition: "License create / usage run / WIRE_STOCK decision on an INGESTED image" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Usage run authorized by a DRAFT, EXPIRED, or REVOKED license" }
  - { id: ERR_STORY_ALREADY_DECIDED, http: 409, condition: "decide called on a story request not in OPEN" }
  - { id: ERR_EXCLUSIVE_LICENSE_CONFLICT, http: 409, condition: "Activation would overlap an ACTIVE exclusive license window (or, for an exclusive license, any ACTIVE license) on the same image; half-open windows, adjacency allowed" }
  - { id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED, http: 409, condition: "Commissioned shoot window plus 1-day travel buffer intersects another non-terminal assignment of the photographer (closed-interval test)" }
  - { id: ERR_PHOTOGRAPHER_SUSPENDED, http: 409, condition: "Commissioned photographer has status SUSPENDED" }
  - { id: ERR_RIGHTS_REVERTED, http: 409, condition: "New license on an ASSIGNMENT image whose rights have reverted to the photographer" }
  - { id: ERR_IMAGE_UNDER_CLAIM, http: 409, condition: "Usage run on an image with restriction_status RESTRICTED" }
  - { id: ERR_PAYMENT_PERIOD_LOCKED, http: 409, condition: "Payment run period overlaps an APPROVED or PAID run for the same photographer" }
  - { id: ERR_EMBARGO_ACTIVE, http: 422, condition: "Usage run published_at strictly before image.embargo_until" }
  - { id: ERR_RELEASE_REQUIRED, http: 422, condition: "Activation/usage on an image needing a MODEL or PROPERTY release with none ACTIVE and unexpired" }
  - { id: ERR_LICENSE_WINDOW_VIOLATION, http: 422, condition: "Usage run published_at outside [valid_from, valid_to] (closed interval)" }
  - { id: ERR_SCOPE_NOT_LICENSED, http: 422, condition: "Usage run channel differs from license.usage_scope" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Activation would push story.committed_cents above budget_cents" }
  - { id: ERR_IMAGE_LIMIT_EXCEEDED, http: 422, condition: "Submission would exceed assignment.max_image_count" }
  - { id: ERR_MIN_IMAGES_NOT_MET, http: 422, condition: "submit with fewer than min_image_count submitted images" }
  - { id: ERR_INCOMPLETE_METADATA, http: 422, condition: "clear without caption (>= 10 chars) or credit_line" }
  - { id: ERR_LICENSE_IMAGE_MISMATCH, http: 422, condition: "Usage run license_id belongs to a different image" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim resolver X-User-ID equals the claim's intaken_by_user_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_image_version / expected_photographer_version does not match the parent's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PhotoEditor
    description: "Photo desk editor: runs story art requests, sourcing decisions, assignment review; can publish usage runs"
    identity: opaque
    exclusive_operations: ["POST /photographers", "POST /photographers/{id}/suspend", "POST /photographers/{id}/reactivate", "POST /story-requests", "POST /story-requests/{id}/decide", "POST /story-requests/{id}/cancel", "POST /assignments/{id}/accept", "POST /assignments/{id}/request-revision", "POST /assignments/{id}/cancel"]
    shared_operations: ["POST /images/{id}/usage-runs", "GET reads across desk resources", "GET /images/{id}/reuse-check"]
  - name: Photographer
    description: "Commissioned photographer (entity-backed): submits images to own assignments, submits assignments, views own payment runs"
    identity: "entity_backed:Photographer"
    exclusive_operations: ["POST /assignments/{id}/images", "POST /assignments/{id}/submit"]
    shared_operations: ["GET /photographers/{id} (self)", "GET /photographers/{id}/payment-runs (self)", "GET /assignments*", "GET /images*"]
  - name: RightsManager
    description: "Rights & licensing manager: ingests wire/stock, clears, embargoes, archives, manages licenses/releases, runs claim intake through resolution"
    identity: opaque
    exclusive_operations: ["POST /images", "POST /images/{id}/clear", "POST /images/{id}/archive", "PUT /images/{id}/embargo", "POST /images/{id}/licenses", "POST /licenses/{id}/activate", "POST /licenses/{id}/revoke", "POST /images/{id}/releases", "POST /releases/{id}/revoke", "POST /infringement-claims", "POST /infringement-claims/{id}/review", "POST /infringement-claims/{id}/offer", "POST /infringement-claims/{id}/counter", "POST /infringement-claims/{id}/escalate", "POST /infringement-claims/{id}/resolve"]
    shared_operations: ["POST /images/{id}/usage-runs", "GET reads across desk resources", "GET /images with include_archived=true"]
  - name: Archivist
    description: "Archive researcher: searches the archive (including archived images) and runs re-use license checks"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["GET /images (with include_archived=true)", "GET /images/{id}/reuse-check", "GET reads across desk resources"]
  - name: FinanceAdmin
    description: "Finance operator: creates and settles photographer payment runs"
    identity: opaque
    exclusive_operations: ["POST /photographers/{id}/payment-runs", "POST /payment-runs/{id}/approve", "POST /payment-runs/{id}/pay", "POST /payment-runs/{id}/void"]
    shared_operations: ["GET /payment-runs/{id}", "GET /photographers/{id}/payment-runs", "GET reads"]
  - name: PlatformAdmin
    description: "Test-driving operator for the logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
