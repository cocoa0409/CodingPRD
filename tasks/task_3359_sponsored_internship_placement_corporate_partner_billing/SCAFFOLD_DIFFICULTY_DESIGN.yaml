scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: placement_fee_exact_days_versus_monthly_commitment
        grounds:
          - calculations.placement_fee
          - entities.InternshipPlacement.fields.placement_fee_cents
          - state_machines.InternshipPlacement.INTERVIEWED_to_OFFERED
        distinguishing_aspect: "placement_fee reads the same contract prose two ways — per-day proration of the tiered base (296572 cents for the 211-day agreement window) versus a monthly commitment that bills the full base (253000 cents) — so the identical inputs produce two different stored fees."
        test_recipe:
          setup:
            - "partner Northwind Logistics exists at fee tier TIER_B with 12 committed supervision hours per week"
            - "an activated agreement covers 2026-09-01 through 2027-03-31 with one placement slot"
            - "student Ava Reyes is ENROLLED, has paid three L&D stipend statements and now sits at current_phase INTERNSHIP with 13 lifetime contract points"
            - "the placement is INTERVIEWED after a PASSED round with Dana Whitfield"
          setup_api_calls:
            - call: "POST /partners"
              payload: { legal_name: "Northwind Logistics", industry: "LOGISTICS", billing_email: "ap@northwind.example", fee_tier: "TIER_B" }
              as: ProgramStaff
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
            - call: "POST /agreements"
              payload: { partner_id: "${p_id}", project_scope: "Logistics analytics data pipeline support", supervision_hours_per_week: 12, slot_count: 1, fee_tier: "TIER_B", start_date: "2026-09-01", end_date: "2027-03-31" }
              as: ProgramStaff
              captures: { a_id: "$.data.id" }
            - call: "POST /agreements/${a_id}/activations"
              payload: { expected_partner_version: "${p_v1}" }
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 98, hours_expected: 140, behavior_incidents: 4 }
              as: ProgramStaff
              captures: { st1_id: "$.data.id" }
            - call: "POST /stipend-statements/${st1_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-21", period_end: "2026-10-04", hours_attended: 133, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st2_id: "$.data.id" }
            - call: "POST /stipend-statements/${st2_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-10-05", period_end: "2026-10-18", hours_attended: 140, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st3_id: "$.data.id" }
            - call: "POST /stipend-statements/${st3_id}/payments"
              payload: {}
              as: ProgramStaff
            - call: "POST /placements"
              payload: { agreement_id: "${a_id}", student_id: "${s_id}", max_interview_rounds: 3 }
              as: ProgramStaff
              captures: { pl_id: "$.data.id" }
            - call: "POST /placements/${pl_id}/interviews"
              payload: { scheduled_for: "2026-09-20T15:00:00Z", duration_minutes: 45, supervisor_name: "Dana Whitfield" }
              as: ProgramStaff
              captures: { iv1_id: "$.data.id" }
            - call: "POST /interviews/${iv1_id}/outcomes"
              payload: { outcome: "PASSED" }
              as: Partner
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /placements/${pl_id}/offers"
              payload: {}
              as: ProgramStaff
              captures: { fee_at_offer: "$.data.placement_fee_cents" }
          assert:
            - "InternshipPlacement.${pl_id}.placement_fee_cents == 296572"
            - "the calendar_month_proration reading of the same 211-day agreement window would store 253000, a difference of 43572 from the pinned exact_day_window value"
            - "InternshipPlacement.${pl_id}.state == OFFERED"

      - name: lnd_stipend_absence_ratio_versus_absence_days
        grounds:
          - calculations.lnd_stipend_net
          - entities.StipendStatement.fields.attendance_deduction_cents
          - entities.StipendStatement.fields.net_amount_cents
        distinguishing_aspect: "lnd_stipend_net reads the deduction clause as a continuous function of the absence ratio (350 cents deducted at a 0.9000 ratio) or as a whole-day penalty that only fires above ten percent absence (0 cents deducted) — two different nets for one identical attendance record."
        test_recipe:
          setup:
            - "student Ava Reyes is ENROLLED in cohort BOS-01 at phase L_AND_D"
            - "no stipend statement exists yet for the period 2026-09-07 through 2026-09-20"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 2100000 }
              as: Anonymous
              captures: { s_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_code: "DATA", location_code: "BOS-01", start_date: "2026-09-01", capacity: 24 }
              as: ProgramStaff
              captures: { c_id: "$.data.id" }
            - call: "POST /students/${s_id}/eligibility-decisions"
              payload: { decision: "ELIGIBLE" }
              as: ProgramStaff
            - call: "POST /students/${s_id}/enrollments"
              payload: { cohort_id: "${c_id}", track_code: "DATA" }
              as: ProgramStaff
          trigger:
            - call: "POST /stipend-statements"
              payload: { student_id: "${s_id}", phase: "L_AND_D", period_start: "2026-09-07", period_end: "2026-09-20", hours_attended: 126, hours_expected: 140, behavior_incidents: 0 }
              as: ProgramStaff
              captures: { st_id: "$.data.id" }
          assert:
            - "StipendStatement.${st_id}.attendance_ratio == 0.9000"
            - "StipendStatement.${st_id}.gross_amount_cents == 35000"
            - "StipendStatement.${st_id}.attendance_deduction_cents == 350"
            - "StipendStatement.${st_id}.net_amount_cents == 34650"
            - "the per_day_absence reading would deduct 0 cents and store net_amount_cents 35000 for the same ratio"
            - "StipendStatement.${st_id}.contract_points_earned == 3"

  - rule_id: combinatorial_formula
    instances:
      - name: satisfaction_composite_per_term_rounding
        grounds:
          - calculations.satisfaction_composite
          - entities.SatisfactionRecord.fields.composite_score
          - entities.Partner.fields.placement_quality_score
        distinguishing_aspect: "satisfaction_composite is a nested-rounding formula whose rounding order is pinned: rounding each weighted term before summing yields 3.49 and a composite of 3.36, while summing the unrounded terms first yields 3.48 and a composite of 3.35."
        test_recipe:
          setup:
            - "an activated agreement hosts student Ava Reyes on a placement that is ACTIVE"
            - "the placement has one paid internship stipend statement"
            - "no satisfaction record exists yet for the placement"
