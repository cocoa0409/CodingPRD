            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/route-sale-listings"
              payload: { route_id: "${r1}", asking_price_cents: 5000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { l1: "$.data.id" }
          trigger:
            - { call: "POST /dairy/route-sale-listings/${l1}/submit-offer", payload: { buyer_distributor_id: "${d2}", offer_price_cents: 4900000 }, as: DistributorOwner, as_user_id: "${d2}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/approve-transfer", payload: {}, as: TerritoryManager, captures: { err2: "$.data.error_id" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/publish", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/route-sale-listings/${l1}/submit-offer", payload: { buyer_distributor_id: "${d1}", offer_price_cents: 4900000 }, as: DistributorOwner, as_user_id: "${d1}", captures: { err3: "$.data.error_id" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/submit-offer", payload: { buyer_distributor_id: "${d2}", offer_price_cents: 4800000 }, as: DistributorOwner, as_user_id: "${d2}", captures: { st1: "$.data.status" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/reject-offer", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { st2: "$.data.status", buyer2: "$.data.buyer_distributor_id" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/submit-offer", payload: { buyer_distributor_id: "${d2}", offer_price_cents: 4950000 }, as: DistributorOwner, as_user_id: "${d2}", captures: { st3: "$.data.status" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/withdraw", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { st4: "$.data.status" } }
            - { call: "POST /dairy/route-sale-listings/${l1}/publish", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err4: "$.data.error_id" } }
          assert:
            - "err1 == ERR_LISTING_NOT_OPEN_FOR_OFFER (submit-offer requires LISTED, not DRAFT)"
            - "err2 == ERR_LISTING_NOT_UNDER_CONTRACT (approve-transfer requires UNDER_CONTRACT)"
