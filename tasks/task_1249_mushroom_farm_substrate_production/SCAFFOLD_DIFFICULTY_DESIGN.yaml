# =============================================================================
# Task 1249 — Mushroom Farm & Substrate Production
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: piece_pay_provisional_vs_final_divergence
        grounds:
          - calculations.piece_pay
          - entities.HarvestPiece.fields.provisional_pay_cents
          - entities.HarvestPiece.fields.final_pay_cents
          - state_machines.HarvestPiece.LOGGED_to_APPROVED
        distinguishing_aspect: |
          Labor-payroll domain variant pair on HarvestPiece: the provisional variant is a flat
          kg*rate with no grade weighting, the final variant multiplies by the parent flush's
          grade-share factor (1.02 here), so identical inputs produce 2000 vs 2040 cents.
        test_recipe:
          setup:
            - "Variety WB1 (bioefficiency 25.0, shelf 5d, spawn 3d, casing 2d, 3 flushes, dist [0.5,0.3,0.2]) exists"
            - "Tunnel T1 (100t), room R1 (50t, version 1) exist"
            - "Batch (40t PHASE_II_COMPOST) is SPAWNED with WB1"
            - "RoomCycle rc1 (40t, window 2026-05-03..2026-06-14) is FRUITING (clock walked to 2026-05-08)"
            - "Flush f1 RECORDED with total_kg 100.0; worker w1 (rate 50) has a LOGGED piece of 40.0 kg; flush then GRADED 60/30/10"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 100.0 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/workers", payload: { full_name: "Wanda Picker", crew_code: "C1", piece_rate_cents_per_kg: 50 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/pieces", payload: { worker_id: "${w_id}", kg_picked: 40.0 }, as: HarvestCrewLead, as_user_id: "${w_id}", captures: { p_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/grade", payload: { grade_a_kg: 60.0, grade_b_kg: 30.0, cull_kg: 10.0 }, as: GradingInspector }
          trigger:
            - { call: "POST /api/pieces/${p_id}/approve", payload: {}, as: PayrollClerk }
            - { call: "GET /api/workers/${w_id}", payload: {}, as: Any }
          assert:
            - "HarvestPiece.${p_id}.status == APPROVED"
            - "HarvestPiece.${p_id}.provisional_pay_cents == 2000 (flat: 40.0 kg * 50 cents, no grade weighting)"
            - "HarvestPiece.${p_id}.final_pay_cents == 2040 (grade-weighted: 40.0 * 50 * (1.20*0.6 + 1.00*0.3 + 0.0*0.1) = 2000 * 1.02)"
            - "HarvestPiece.${p_id}.provisional_pay_cents != HarvestPiece.${p_id}.final_pay_cents"
            - "Worker.${w_id}.accrued_unpaid_cents == 2040"

      - name: flush_yield_projection_scheduled_vs_actualized
        grounds:
          - calculations.flush_yield_projection
          - entities.RoomCycle.fields.scheduled_projection_kg
          - entities.RoomCycle.fields.actualized_projection_kg
          - state_machines.FlushHarvest.RECORDED_to_GRADED
        distinguishing_aspect: |
          Production-yield domain variant pair on RoomCycle (different entity domain from the
          HarvestPiece payroll pair): scheduled is a static forward-looking estimate
          (tonnage x bioefficiency = 10000.0 kg) while actualized is a chronological replayer
          substituting graded actuals (100.0 + 3000.0 + 2000.0 = 5100.0 kg).
        test_recipe:
          setup:
            - "Same farm chain as piece_pay instance: batch SPAWNED, cycle rc1 FRUITING at clock 2026-05-08"
            - "Flush f1 RECORDED with total_kg 100.0"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 100.0 }, as: FarmManager, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/flushes/${f_id}/grade", payload: { grade_a_kg: 60.0, grade_b_kg: 30.0, cull_kg: 10.0 }, as: GradingInspector }
            - { call: "GET /api/room-cycles/${rc_id}", payload: {}, as: Any }
          assert:
            - "RoomCycle.${rc_id}.scheduled_projection_kg == 10000.0 (static: 40.0 * 1000 * 25.0 / 100)"
            - "RoomCycle.${rc_id}.actualized_projection_kg == 5100.0 (100.0 graded + 10000.0*0.3 + 10000.0*0.2 for remaining flushes 2 and 3)"
            - "RoomCycle.${rc_id}.scheduled_projection_kg != RoomCycle.${rc_id}.actualized_projection_kg"
            - "RoomCycle.${rc_id}.flush_count == 1 and RoomCycle.${rc_id}.harvested_kg == 100.0"

  - rule_id: combinatorial_formula
    instances:
      - name: commitment_shortfall_tiered_penalty
        grounds:
          - calculations.commitment_settlement
          - entities.CommitmentLine.fields.penalty_cents
          - state_machines.CommitmentLine.ACTIVE_to_SETTLED
        distinguishing_aspect: |
          Mode (a) combinatorial: settlement takes 3+ inputs (committed_kg, delivered_kg, tier
          table) with non-linear interaction (inclusive 95% tolerance boundary, then nested
          tier selection at ratios 0.15 / 0.40); committed 500 delivered 400 lands in tier 2
          (ratio 0.20) for a 20000-cent penalty.
        test_recipe:
          setup:
            - "Farm chain through FRUITING at clock 2026-05-08; flush f1 of 1000.0 kg GRADED 600/300/100"
            - "One grade-A packaged lot of 400.0 kg (40 units x 10.0 kg) IN_STOCK, expires 2026-05-13"
            - "Buyer + commitment PO-100 with one line: variety WB1, committed 500.0 kg, week 2026-05-04..2026-05-10, min_grade B; commitment ACTIVE"
            - "The 400 kg lot is ALLOCATED to the line and SHIPPED (delivered_kg 400.0)"
            - "Clock advanced to 2026-05-11 (past week_end)"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 1000.0 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/grade", payload: { grade_a_kg: 600.0, grade_b_kg: 300.0, cull_kg: 100.0 }, as: GradingInspector }
            - { call: "POST /api/flushes/${f_id}/packaged-lots", payload: { grade: "A", units: 40, kg_per_unit: 10.0 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/buyers", payload: { name: "Acme Grocery" }, as: SalesManager, captures: { buyer_id: $.data.id } }
            - { call: "POST /api/buyer-commitments", payload: { buyer_id: "${buyer_id}", reference: "PO-100" }, as: SalesManager, captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /api/buyer-commitments/${c_id}/lines", payload: { variety_id: "${v_id}", committed_kg: 500.0, week_start: "2026-05-04T00:00:00Z", week_end: "2026-05-10T00:00:00Z", min_grade: "B" }, as: SalesManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/buyer-commitments/${c_id}/activate", payload: { expected_commitment_version: "${c_v}" }, as: SalesManager }
            - { call: "POST /api/commitment-lines/${l_id}/allocate", payload: { target_kg: 400.0 }, as: SalesManager }
            - { call: "POST /api/packaged-lots/${lot_id}/ship", payload: {}, as: SalesManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/operations/run-daily-sweep", payload: {}, as: FarmManager, captures: { settled_n: $.data.settled_line_count, closed_n: $.data.closed_commitment_count } }
            - { call: "GET /api/commitment-lines/${l_id}", payload: {}, as: Any }
            - { call: "GET /api/buyers/${buyer_id}", payload: {}, as: Any }
          assert:
            - "sweep response settled_line_count == 1 and closed_commitment_count == 1"
            - "CommitmentLine.${l_id}.status == SETTLED and settlement_outcome == SHORTFALL"
            - "CommitmentLine.${l_id}.shortfall_kg == 100.0"
            - "CommitmentLine.${l_id}.penalty_cents == 20000 (ratio 100/500 = 0.20 -> tier 2 rate 200 cents/kg)"
            - "Buyer.${buyer_id}.lifetime_shortfall_penalty_cents == 20000"
            - "BuyerCommitment.${c_id}.status == CLOSED (bubble-up: all lines terminal)"

      - name: payroll_per_piece_rounding_then_sum
        grounds:
          - calculations.piece_pay
          - calculations.payroll_accrual
          - entities.Worker.fields.accrued_unpaid_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the tiered settlement): nested rounding
          where order matters — the scaffold pins round-per-piece-then-sum; two 10.15 kg pieces
          at 33 cents/kg under factor 1.02 give 342 + 342 = 684 cents, whereas the forbidden
          sum-then-round order would give round(683.298) = 683.
        test_recipe:
          setup:
            - "Farm chain through FRUITING at clock 2026-05-08; flush f1 RECORDED with total_kg 100.0"
            - "Worker w1 (rate 33 cents/kg) has TWO LOGGED pieces of 10.15 kg each on f1"
            - "f1 GRADED 60/30/10 (grade factor 1.02)"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/advance", payload: {}, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/flushes", payload: { total_kg: 100.0 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/workers", payload: { full_name: "Wanda Picker", crew_code: "C1", piece_rate_cents_per_kg: 33 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/pieces", payload: { worker_id: "${w_id}", kg_picked: 10.15 }, as: HarvestCrewLead, as_user_id: "${w_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/pieces", payload: { worker_id: "${w_id}", kg_picked: 10.15 }, as: HarvestCrewLead, as_user_id: "${w_id}", captures: { p2_id: $.data.id } }
            - { call: "POST /api/flushes/${f_id}/grade", payload: { grade_a_kg: 60.0, grade_b_kg: 30.0, cull_kg: 10.0 }, as: GradingInspector }
          trigger:
            - { call: "POST /api/pieces/${p1_id}/approve", payload: {}, as: PayrollClerk }
            - { call: "POST /api/pieces/${p2_id}/approve", payload: {}, as: PayrollClerk }
            - { call: "GET /api/workers/${w_id}", payload: {}, as: Any }
          assert:
            - "HarvestPiece.${p1_id}.final_pay_cents == 342 (round_half_up(10.15 * 33 * 1.02) = round_half_up(341.649))"
            - "HarvestPiece.${p2_id}.final_pay_cents == 342"
            - "Worker.${w_id}.accrued_unpaid_cents == 684 (per-piece rounded sum; sum-then-round would wrongly yield 683)"

  - rule_id: non_linear_state_machine
    instances:
      - name: room_parallel_occupancy_health_dimensions
        grounds:
          - state_machines.GrowingRoom.occupancy_status
          - state_machines.GrowingRoom.health_status
          - calculations.room_health_posture
        distinguishing_aspect: |
          GrowingRoom carries two independent parallel state dimensions on one row:
          occupancy (IDLE/OCCUPIED/TURNAROUND) and health (CLEAR/WATCH/QUARANTINED).
          A severity-2 confirm moves health CLEAR->WATCH while occupancy stays OCCUPIED;
          the later clear returns health to CLEAR with occupancy untouched throughout.
        test_recipe:
          setup:
            - "Batch SPAWNED; cycle rc1 placed in room r1 (occupancy OCCUPIED, health CLEAR) at clock 2026-05-03"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "POST /api/substrate-batches/${b_id}/spawn", payload: { variety_id: "${v_id}", spawn_kg: 280.0 }, as: CompostSupervisor }
            - { call: "POST /api/room-cycles", payload: { room_id: "${r_id}", batch_id: "${b_id}", allocated_tonnage: 40.0, planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-06-14T00:00:00Z", expected_room_version: "${r_v}" }, as: FarmManager, captures: { rc_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/room-cycles/${rc_id}/place", payload: {}, as: FarmManager }
          trigger:
            - { call: "POST /api/contamination-events", payload: { room_id: "${r_id}", room_cycle_id: "${rc_id}", pathogen: "COBWEB", severity: 2, affected_zone_pct: 10.0 }, as: QualityInspector, captures: { ev_id: $.data.id } }
            - { call: "POST /api/contamination-events/${ev_id}/confirm", payload: {}, as: QualityInspector }
            - { call: "GET /api/rooms/${r_id}", payload: {}, as: Any, captures: { health_mid: $.data.health_status, occ_mid: $.data.occupancy_status } }
            - { call: "POST /api/contamination-events/${ev_id}/remediate", payload: {}, as: QualityInspector }
            - { call: "POST /api/contamination-events/${ev_id}/clear", payload: {}, as: QualityInspector }
            - { call: "GET /api/rooms/${r_id}", payload: {}, as: Any, captures: { health_end: $.data.health_status, occ_end: $.data.occupancy_status } }
          assert:
            - "After confirm: GrowingRoom.${r_id}.health_status == WATCH and occupancy_status == OCCUPIED (severity <= 3 never quarantines)"
            - "After clear: GrowingRoom.${r_id}.health_status == CLEAR and occupancy_status == OCCUPIED (health dimension moved twice; occupancy dimension never moved)"
            - "ContaminationEvent.${ev_id}.status == CLEARED"

      - name: batch_pasteurization_retry_cycle
        grounds:
          - state_machines.SubstrateBatch.PASTEURIZING_to_MIXED
          - state_machines.SubstrateBatch.MIXED_to_PASTEURIZING
          - state_machines.PasteurizationTunnel.AVAILABLE_to_OUT_OF_SERVICE
          - state_machines.PasteurizationTunnel.OUT_OF_SERVICE_to_AVAILABLE
        distinguishing_aspect: |
          SubstrateBatch has a cyclic loop (MIXED -> PASTEURIZING -> MIXED on failure, retried
          to CONDITIONED) — a different entity and a different non-linear shape (cycle vs the
          room's parallel dimensions). The failed cycle also loops the tunnel
          AVAILABLE -> OUT_OF_SERVICE -> AVAILABLE via sanitize.
        test_recipe:
          setup:
            - "Tunnel t1 and batch b1 (40t, MIXED) exist; pasteurization cycle pc1 running then FAILED"
            - "Tunnel sanitized; second cycle pc2 created for the same batch"
          setup_api_calls:
            - { call: "POST /api/pasteurization-tunnels", payload: { tunnel_code: "T1", capacity_tonnes: 100.0 }, as: CompostSupervisor, captures: { t_id: $.data.id } }
            - { call: "POST /api/substrate-batches", payload: { recipe: "PHASE_II_COMPOST", tonnage: 40.0 }, as: CompostSupervisor, captures: { b_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-01T00:00:00Z", planned_end: "2026-05-02T00:00:00Z" }, as: CompostSupervisor, captures: { pc1_id: $.data.id } }
            - { call: "POST /api/pasteurization-cycles/${pc1_id}/start", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles/${pc1_id}/fail", payload: {}, as: CompostSupervisor }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any, captures: { b_status_after_fail: $.data.status } }
            - { call: "GET /api/pasteurization-tunnels/${t_id}", payload: {}, as: Any, captures: { t_status_after_fail: $.data.status } }
            - { call: "POST /api/pasteurization-tunnels/${t_id}/sanitize", payload: {}, as: CompostSupervisor }
            - { call: "POST /api/pasteurization-cycles", payload: { batch_id: "${b_id}", tunnel_id: "${t_id}", planned_start: "2026-05-03T00:00:00Z", planned_end: "2026-05-04T00:00:00Z" }, as: CompostSupervisor, captures: { pc2_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /api/pasteurization-cycles/${pc2_id}/start", payload: {}, as: CompostSupervisor }
          trigger:
            - { call: "POST /api/pasteurization-cycles/${pc2_id}/complete", payload: { hours_at_target_temp: 8.0 }, as: CompostSupervisor }
            - { call: "GET /api/substrate-batches/${b_id}", payload: {}, as: Any }
          assert:
            - "SubstrateBatch.${b_id}.status after fail == MIXED (the loop-back; pc2 creation would have failed ERR_BATCH_NOT_MIXED otherwise)"
            - "PasteurizationTunnel.${t_id}.status after fail == OUT_OF_SERVICE"
            - "After retry: PasteurizationCycle.${pc2_id}.status == COMPLETED and SubstrateBatch.${b_id}.status == CONDITIONED"
            - "PasteurizationCycle.${pc1_id}.status == FAILED (terminal, unchanged by the retry)"

  - rule_id: transitive_cascade
    instances:
      - name: contamination_confirm_deep_cascade
        grounds:
          - state_machines.ContaminationEvent.REPORTED_to_CONFIRMED
          - state_machines.GrowingRoom.health_status
          - state_machines.RoomCycle.FRUITING_to_ABORTED
          - entities.SpentSubstrateLot.fields.disposal_only
          - entities.CommitmentLine.fields.supply_at_risk
        distinguishing_aspect: |
          Depth-4 chain from a single confirm trigger: event CONFIRMED -> room QUARANTINED
          (hop 1, caused by the confirm) -> the room's FRUITING cycle ABORTED (hop 2, caused
          by the quarantine) -> a disposal_only SpentSubstrateLot is created AND every ACTIVE
          commitment line of the variety flips supply_at_risk (hop 3, caused by the abort).
        test_recipe:
          setup:
            - "Batch SPAWNED; cycle rc1 (40t WB1) FRUITING in room r1 at clock 2026-05-08"
            - "Buyer + ACTIVE commitment with line l1: WB1, committed 500.0 kg, week 2026-05-04..2026-05-10 (nothing delivered; planned production 10000.0 kg >= 500 so supply_at_risk is false)"
