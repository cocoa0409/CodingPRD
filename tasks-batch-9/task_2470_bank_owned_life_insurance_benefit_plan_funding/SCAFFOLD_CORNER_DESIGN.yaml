              payload: {}
              as: RiskOfficer
            - call: "GET /purchase-requests/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: RiskOfficer
            - call: "GET /policies/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: RiskOfficer
            - call: "GET /death-claims/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: RiskOfficer
            - call: "GET /nqdc-plans/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: RiskOfficer
            - call: "GET /exchange-analyses/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: RiskOfficer
