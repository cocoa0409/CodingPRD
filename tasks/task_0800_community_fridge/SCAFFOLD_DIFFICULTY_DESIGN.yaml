# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: batch_provisional_vs_realized_meals
        grounds:
          - calculations.batch_meal_impact
          - entities.DonationBatch.fields.provisional_meals
          - entities.DonationBatch.fields.realized_meals
          - state_machines.DonationBatch.STOCKED_to_DISCARDED
        distinguishing_aspect: "On DonationBatch: provisional_meals is computed from declared_quantity_kg at STOCK while realized_meals is computed from summed non-VOIDED claimed mass at terminal; they diverge (8 vs 3)."
        test_recipe:
          setup:
            - "Fridge OPERATIONAL, capacity 10; a batch STOCKED with declared_quantity_kg=10.0 (provisional_meals=8); one OPEN claim of 3.6 kg; batch then DISCARDED so realized freezes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Elm St Fridge", location_label: "Elm St", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Sam", email: "sam@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 10.0, slot_footprint: 2, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id, prov: $.data.provisional_meals }
            - call: "POST /donation-batches/${b_id}/claims"
              payload: { quantity_kg: 3.6, recipient_label: "anon" }
              as: Member
          trigger:
            - call: "POST /donation-batches/${b_id}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
              captures: { realized: $.data.realized_meals }
          assert:
            - "DonationBatch.${b_id}.provisional_meals == 8"
            - "DonationBatch.${b_id}.realized_meals == 3"
            - "DonationBatch.${b_id}.provisional_meals != DonationBatch.${b_id}.realized_meals"

      - name: steward_reliability_actual_vs_projected
        grounds:
          - calculations.steward_reliability_score
          - entities.Steward.fields.reliability_actual
          - entities.Steward.fields.reliability_projected
          - state_machines.StewardShift.SCHEDULED_to_MISSED
        distinguishing_aspect: "On Steward: reliability_actual counts only resolved shifts (1/2=0.50) while reliability_projected counts future SCHEDULED shifts as completed ((1+2)/4=0.75); different entity domain from batch meal impact."
        test_recipe:
          setup:
            - "One steward with 1 COMPLETED shift, 1 MISSED shift, and 2 future SCHEDULED shifts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Oak Fridge", location_label: "Oak Ave", capacity_slots: 6 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Ria", email: "ria@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T10:00:00Z" }
              as: NetworkAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T10:00:00Z" }
              as: NetworkAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-20T09:00:00Z", end_at: "2026-03-20T10:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "COVERAGE", start_at: "2026-03-21T09:00:00Z", end_at: "2026-03-21T10:00:00Z" }
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /shifts/${sc_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: Steward
              as_user_id: "${sid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:30:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges/${f_id}/run-ops"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "GET /stewards/${sid}"
              payload: {}
              as: NetworkAdmin
              captures: { ra: $.data.reliability_actual, rp: $.data.reliability_projected }
          assert:
            - "Steward.${sid}.reliability_actual == 0.5"
            - "Steward.${sid}.reliability_projected == 0.75"

  - rule_id: combinatorial_formula
    instances:
      - name: shift_reimbursement_tiered_mileage_posture
        grounds:
          - calculations.shift_reimbursement_amount
          - entities.StewardShift.fields.reimbursement_amount_cents
          - state_machines.StewardShift.SCHEDULED_to_COMPLETED
          - entities.Fridge.fields.budget_committed_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — CLEANING base 2000 + tiered mileage(12mi=460) + cold-chain bonus 500, all scaled by the RESTRICTED hazard multiplier 1.25 = 3700 cents."
        test_recipe:
          setup:
            - "Fridge forced RESTRICTED via temp reading 10.0; a CLEANING shift SCHEDULED; steward ACTIVE; clock past shift start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Pine Fridge", location_label: "Pine Rd", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Cleo", email: "cleo@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/temperature"
              payload: { reading_c: 10.0 }
              as: Steward
              as_user_id: "${sid}"
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "CLEANING", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T11:00:00Z" }
              as: NetworkAdmin
              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 12, handled_cold_chain: true }
              as: Steward
              as_user_id: "${sid}"
              captures: { reimb: $.data.reimbursement_amount_cents }
          assert:
            - "StewardShift.${sh_id}.reimbursement_amount_cents == 3700"
            - "Fridge.${f_id}.budget_committed_cents == 3700"

      - name: impact_report_round_per_batch_then_sum
        grounds:
          - calculations.fridge_impact_report
          - entities.Fridge.fields.total_meals_provided
          - state_machines.DonationBatch.STOCKED_to_DISCARDED
        distinguishing_aspect: "Mode (b): pinned rounding order — two terminal batches each realized 1.8 kg round to 2 meals then sum to 4, whereas sum-then-round (3.6/1.2=3.0) would give 3."
        test_recipe:
          setup:
            - "Fridge OPERATIONAL; two batches each with a single 1.8 kg claim, both DISCARDED (terminal), realized_quantity_kg=1.8 each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Birch Fridge", location_label: "Birch Ln", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Ivy", email: "ivy@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 5.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b1: $.data.id }
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 5.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b2: $.data.id }
            - call: "POST /donation-batches/${b1}/claims"
              payload: { quantity_kg: 1.8, recipient_label: "a" }
              as: Member
            - call: "POST /donation-batches/${b2}/claims"
              payload: { quantity_kg: 1.8, recipient_label: "b" }
              as: Member
            - call: "POST /donation-batches/${b1}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
            - call: "POST /donation-batches/${b2}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { tm: $.data.total_meals_provided }
          assert:
            - "Fridge.${f_id}.total_meals_provided == 4"

  - rule_id: non_linear_state_machine
    instances:
      - name: batch_stocked_held_stocked_revert
        grounds:
          - state_machines.DonationBatch.STOCKED_to_HELD
          - state_machines.DonationBatch.HELD_to_STOCKED
          - state_machines.DonationBatch.STOCKED_to_RECALLED
        distinguishing_aspect: "DonationBatch is non-linear via the STOCKED<->HELD revert cycle: a sibling batch goes STOCKED->HELD on quarantine then HELD->STOCKED when the recall is discarded and the fridge leaves QUARANTINED."
        test_recipe:
          setup:
            - "Fridge OPERATIONAL with two STOCKED batches A and B; recall A -> fridge QUARANTINED -> B HELD; discard A -> fridge leaves QUARANTINED -> B back to STOCKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Cedar Fridge", location_label: "Cedar", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Max", email: "max@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { a_id: $.data.id }
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
            - call: "POST /donation-batches/${a_id}/recall"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /donation-batches/${a_id}/discard"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
            - call: "GET /donation-batches/${b_id}"
              payload: {}
              as: NetworkAdmin
              captures: { bstat: $.data.status }
          assert:
            - "DonationBatch.${b_id}.status == STOCKED"
            - "Fridge.${f_id}.safety_posture == OPERATIONAL"

      - name: shift_completed_failinspection_reopen_cycle
        grounds:
          - state_machines.StewardShift.SCHEDULED_to_COMPLETED
          - state_machines.StewardShift.COMPLETED_to_SCHEDULED
          - entities.StewardShift.fields.reimbursement_amount_cents
        distinguishing_aspect: "StewardShift is non-linear via the COMPLETED->SCHEDULED cyclic revert on fail-inspection, which also reverses the reimbursement to 0; a different entity from DonationBatch."
        test_recipe:
          setup:
            - "A CLEANING shift COMPLETED with a nonzero reimbursement; fail-inspection reverts it to SCHEDULED and zeroes the reimbursement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Ash Fridge", location_label: "Ash", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Ned", email: "ned@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "CLEANING", start_at: "2026-03-01T09:00:00Z", end_at: "2026-03-01T11:00:00Z" }
              as: NetworkAdmin
              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /shifts/${sh_id}/fail-inspection"
              payload: {}
              as: NetworkAdmin
              captures: { st: $.data.status, r: $.data.reimbursement_amount_cents }
          assert:
            - "StewardShift.${sh_id}.status == SCHEDULED"
            - "StewardShift.${sh_id}.reimbursement_amount_cents == 0"
            - "Fridge.${f_id}.budget_committed_cents == 0"

  - rule_id: transitive_cascade
    instances:
      - name: recall_quarantine_hold_suspend_chain
        grounds:
          - state_machines.DonationBatch.STOCKED_to_RECALLED
          - state_machines.DonationBatch.STOCKED_to_HELD
          - state_machines.NeedPosting.OPEN_to_SUSPENDED
          - entities.Fridge.fields.safety_posture
        distinguishing_aspect: "Depth-3 cascade from recall: recall A (hop1) -> Fridge QUARANTINED (hop2, caused by the RECALLED batch) -> sibling B HELD and OPEN need SUSPENDED (hop3, caused by the QUARANTINED posture)."
        test_recipe:
          setup:
            - "Fridge OPERATIONAL, batches A and B STOCKED, one OPEN NeedPosting; recall A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Maple Fridge", location_label: "Maple", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Lea", email: "lea@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/needs"
              payload: { item_description: "canned beans", quantity_needed: 5, needed_by: "2026-04-01T00:00:00Z" }
              as: Member
              captures: { n_id: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { a_id: $.data.id }
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { fv1: $.data.version }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-04-01T00:00:00Z", expected_fridge_version: "${fv1}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /donation-batches/${a_id}/recall"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
          assert:
            - "DonationBatch.${a_id}.status == RECALLED"
            - "Fridge.${f_id}.safety_posture == QUARANTINED"
            - "DonationBatch.${b_id}.status == HELD"
            - "NeedPosting.${n_id}.status == SUSPENDED"

      - name: cleaning_complete_lastcleaned_posture_chain
        grounds:
          - state_machines.StewardShift.SCHEDULED_to_COMPLETED
          - entities.Fridge.fields.last_cleaned_at
          - entities.Fridge.fields.safety_posture
          - calculations.fridge_safety_posture
        distinguishing_aspect: "Depth-2 cascade from a different trigger (CLEANING shift complete): complete (hop1) sets Fridge.last_cleaned_at (hop2 side-effect) which recomputes safety_posture from RESTRICTED (cleaning-overdue) back to OPERATIONAL."
        test_recipe:
          setup:
            - "Fridge created at 2026-03-01; clock advanced 14 days so cleaning is overdue -> RESTRICTED; a CLEANING shift SCHEDULED for that time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Willow Fridge", location_label: "Willow", capacity_slots: 5 }
              as: NetworkAdmin
              captures: { f_id: $.data.id }
            - call: "POST /stewards"
              payload: { name: "Bo", email: "bo@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/shifts"
              payload: { steward_id: "${sid}", kind: "CLEANING", start_at: "2026-03-15T09:00:00Z", end_at: "2026-03-15T11:00:00Z" }
              as: NetworkAdmin
              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T09:30:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: Steward
              as_user_id: "${sid}"
            - call: "GET /fridges/${f_id}"
              payload: {}
              as: NetworkAdmin
              captures: { post: $.data.safety_posture }
          assert:
            - "Fridge.${f_id}.safety_posture == OPERATIONAL"
            - "Fridge.${f_id}.last_cleaned_at == 2026-03-15T09:30:00.000Z"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_recalled_state_beats_useby_safety
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - state_machines.DonationBatch.STOCKED_to_RECALLED
        distinguishing_aspect: "Category pair state vs business_safety: a claim on a batch that is both RECALLED (state, pri 5) and past use_by (business_safety, pri 9) returns ERR_BATCH_RECALLED, the higher-priority state error."
        test_recipe:
          setup:
            - "A batch with use_by 2026-03-05 recalled while STOCKED; clock advanced past use_by to 2026-03-10 without run-ops (RECALLED batches are not swept)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
              payload: { name: "Fir Fridge", location_label: "Fir", capacity_slots: 10 }
              as: NetworkAdmin
              captures: { f_id: $.data.id, fv0: $.data.version }
            - call: "POST /stewards"
              payload: { name: "Uma", email: "uma@x.org" }
              as: NetworkAdmin
              captures: { sid: $.data.id }
            - call: "POST /fridges/${f_id}/donation-batches"
              payload: { steward_id: "${sid}", food_category: "PRODUCE", storage_type: "AMBIENT", declared_quantity_kg: 4.0, slot_footprint: 1, intake_temp_c: 4.0, use_by: "2026-03-05T00:00:00Z", expected_fridge_version: "${fv0}" }
              as: Steward
              as_user_id: "${sid}"
              captures: { b_id: $.data.id }
            - call: "POST /donation-batches/${b_id}/recall"
              payload: {}
              as: Steward
              as_user_id: "${sid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /donation-batches/${b_id}/claims"
              payload: { quantity_kg: 1.0, recipient_label: "x" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BATCH_RECALLED"
            - "response.status == 409"

      - name: intake_notoperational_safety_beats_capacity_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - entities.Fridge.fields.safety_posture
          - entities.Fridge.fields.free_slots
        distinguishing_aspect: "Category pair business_safety vs business_constraint (distinct from the state/safety pair): an intake into a RESTRICTED fridge with slot_footprint > free_slots returns ERR_FRIDGE_NOT_OPERATIONAL (safety, pri 7) not ERR_CAPACITY_EXCEEDED (constraint, pri 14)."
        test_recipe:
          setup:
            - "Fridge capacity 2, fully occupied (free_slots 0) by a first batch, then forced RESTRICTED via temp 10.0; a second intake requests footprint 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
