  - rule_id: priority_pair_validation_conflict
    instances:

      - name: claim_on_suspended_plan_with_stale_received_date_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors.ERR_PLAN_NOT_ACTIVE
          - errors.ERR_TIMELY_FILING
