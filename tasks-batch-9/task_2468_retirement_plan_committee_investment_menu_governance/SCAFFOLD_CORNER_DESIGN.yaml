            - *chain_l3
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "BNDIY", fund_name: "Summit Core Bond Institutional", asset_class_code: "CORE_BOND", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 20, net_expense_ratio_bps: 20, revenue_share_bps: 0, peer_median_expense_bps: 30, track_record_quarters: 40, manager_tenure_quarters: 25, manager_change_flag: false, style_drift_r2: 0.9300, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_bond_y_id: $.data.id }
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "CORE_BOND", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_bond_spec_id: $.data.id }
            - call: "POST /governance/asset-class-slots/${slot_bond_spec_id}/seat-fund"
              payload: { fund_id: "${fund_bond_y_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "LCGRC", fund_name: "Summit Large Cap Growth Institutional", asset_class_code: "US_LARGE_CAP", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 36, net_expense_ratio_bps: 36, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 36, manager_tenure_quarters: 18, manager_change_flag: false, style_drift_r2: 0.9300, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_lc_c_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "BNDIZ", fund_name: "Summit Aggregate Bond Institutional", asset_class_code: "CORE_BOND", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 18, net_expense_ratio_bps: 18, revenue_share_bps: 0, peer_median_expense_bps: 30, track_record_quarters: 48, manager_tenure_quarters: 22, manager_change_flag: false, style_drift_r2: 0.9500, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_bond_z_id: $.data.id }
          trigger:
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "US_LARGE_CAP", designation: "SPECIALTY", slot_index: 7 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_lc_spec_id: $.data.id }
            - call: "POST /governance/asset-class-slots/${slot_lc_spec_id}/seat-fund"
              payload: { fund_id: "${fund_lc_a_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_lc_spec_id}/seat-fund"
              payload: { fund_id: "${fund_lc_c_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_x5a: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_bond_id}", outgoing_fund_id: "${fund_intl_id}", incoming_fund_id: "${fund_bond_z_id}", mapping_strategy: "DIRECT_MAP", rationale: "Replace the core bond holding with the cheaper BNDIZ aggregate mandate after the expense review.", expected_plan_version: "${plan_v_x5a}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_mis_id: $.data.id }
            - call: "POST /governance/fund-replacements/${prop_mis_id}/submit"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_x5b: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_bond_id}", outgoing_fund_id: "${fund_bond_a_id}", incoming_fund_id: "${fund_bond_z_id}", mapping_strategy: "DIRECT_MAP", rationale: "Replace BNDIX with the cheaper BNDIZ aggregate mandate after the quarterly expense review.", expected_plan_version: "${plan_v_x5b}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_ok_id: $.data.id }
            - call: "POST /governance/fund-replacements/${prop_ok_id}/submit"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "setup left Plan.occupied_menu_slots == 6, Plan.reserved_menu_slots == 0 and Plan.available_menu_slots == 0, and Fund.${fund_bond_y_id}.menu_status == ACTIVE with qdia_flag false (the slot designation is SPECIALTY, not QDIA)"
            - "trigger call 1 returned 201 with status EMPTY and current_fund_id null: creating a slot is not a capacity write, so a full menu can still be given an empty slot — only seating is gated"
            - "trigger call 2 returned 409 ERR_FUND_NOT_CANDIDATE even though Plan.available_menu_slots is 0: LCGRA is menu_status ACTIVE, and the priority-42 specific-state error is preferred over the priority-80 capacity error"
            - "trigger call 2 changed nothing: Fund.${fund_lc_a_id}.menu_status is still ACTIVE, AssetClassSlot.${slot_lc_id}.current_fund_id is still ${fund_lc_a_id}, AssetClassSlot.${slot_lc_spec_id}.status is still EMPTY and the capacity triple is still 6 + 0 + 0"
            - "trigger call 3, the same endpoint with a genuine CANDIDATE that satisfies every IPS-2026-A criterion (36 <= 40 * 1.25, 36 >= 12 track-record quarters, 0.9300 >= 0.8000), returned 409 ERR_MENU_CAPACITY_EXHAUSTED — with the referential gates satisfied the capacity gate is what is left, which is what makes call 2's answer a genuine priority claim rather than an accident"
            - "trigger call 5 returned 201 despite naming INTDX — a fund seated in a completely different slot — as outgoing_fund_id: create validates only the INCOMING fund's asset class against the slot, and BNDIZ is CORE_BOND like slot_bond. status == DRAFT, pinned_plan_version == ${plan_v_x5a}, notice_lead_days_required == 30"
            - "trigger call 6 returned 422 ERR_OUTGOING_FUND_MISMATCH because AssetClassSlot.${slot_bond_id}.current_fund_id == ${fund_bond_a_id} != ${fund_intl_id}; the proposal stays DRAFT, is not WITHDRAWN, and Plan.draft_proposal_count is still 1"
            - "trigger call 8 returned 201 and its supersede cascade fired: FundReplacementProposal.${prop_mis_id}.status == WITHDRAWN with superseded_by_proposal_id == ${prop_ok_id}, and Plan.draft_proposal_count == 1 again (the new draft replaced the old one rather than adding to it)"
            - "trigger call 9 returned 200 with status DRAFT -> UNDER_REVIEW: with the outgoing fund corrected and every other submit precondition already true, the same submit that failed on call 6 now passes"
            - "throughout, no write touched AssetClassSlot.${slot_bond_id}.status — it is still ACTIVE, because a submitted proposal reserves nothing; only approve moves the slot to PENDING_REPLACEMENT"

      - name: a_reserved_slot_refuses_a_second_approval_even_with_its_own_carried_motion_and_approved_minutes
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SLOT_NOT_REPLACEABLE
          - errors.ERR_SLOT_HAS_OPEN_PROPOSAL
          - errors.ERR_MENU_CAPACITY_EXHAUSTED
          - validations.priority_42
        distinguishing_aspect: "This is the only way to reach ERR_SLOT_NOT_REPLACEABLE at all: approve WITHDRAWS every other non-terminal proposal on the slot, so a rival proposal must be created AFTER the first approval to survive long enough to be approved. The second approval then violates three rules at once — the slot is PENDING_REPLACEMENT (priority 42), available_menu_slots is 0 because the first approval reserved the last one (priority 80), and another proposal on the slot is APPROVED (priority 89) — and the priority ladder, not the §1.2 declaration order, decides which is returned. §1.2 lists the open-proposal check LAST among approve's preconditions, so declaration order would give the wrong answer."
