# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3161_autonomous_ride_hailing_depot_operations_remote_assistance
#
# Depth probe: nine §0.5 Difficulty Rules, two instances each (18 total).
# Every instance grounds in §1.1–§1.6 of SCAFFOLD.yaml and is driven from
# empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: if_match_credit_open_vs_restricted_territory
        grounds:
          - calculations.territory_total_credit
          - calculations.territory_total_credit.variants.credit_restricted_territory
          - entities.ServiceTerritory.fields.total_credit_cents
          - validations[priority=6]
        distinguishing_aspect: "For identical demand input (effective_demand == 40), an ACTIVE territory resolves credit_per_ride == 5555 and a RESTRICTED territory resolves credit_per_ride == 7142 — the two readings of the same formula differ because provision halves when zone count reaches 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory PHX-METRO is ACTIVE with mapped_pct 100 and validation_hours 120. Depot A has 8 bay positions. Vehicle V1 has battery_pct 80, cleanliness_score 70, calibration signed off and software_version == target_software_version; it is staged then returned to service so it is IN_SERVICE. DemandSignal(MIDDAY) has projected_rides 50, manual_only_rides 10, so effective_demand == 40."
          setup_api_calls:
            - &clock_call
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: TerritoryPlanner
            - &territory_call
              call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO", mapped_pct: 100, validation_hours: 120, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id, t_v: $.data.version }
            - &depot_call
              call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot A", charge_positions: 2, cleaning_positions: 2, calib_positions: 2, software_positions: 2 }
              as: TerritoryPlanner
              captures: { d_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/demand-signals"
              payload: { window_code: "MIDDAY", projected_rides: 50, manual_only_rides: 10 }
              as: TerritoryPlanner
              captures: { ds_id: $.data.id }
            - &vehicle1_call
              call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 80, cleanliness_score: 70, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/vehicles/${v1_id}/return-to-service"
              payload: {}
              as: FleetOperations
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
              captures: { occ_token: $.data.version }
            - call: "POST /fleet/territories/${t_id}/pickup-locations"
              payload: { curb_segment_code: "CURB-A1", curb_access: "SAFE" }
              as: MappingEngineer
              captures: { pl_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/curb-rules"
              payload: { curb_access: "SAFE", sub_service_type: "STANDARD", allowed: true }
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-open-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
              captures: { r1_after_id: $.data.id }
          assert:
            - "GET /fleet/territories/${t_id} returns posture == ACTIVE and total_credit_cents == 2222222"
            - "GET /fleet/vehicles/${v1_id} returns credit_cents == 5555"
            - "GET /fleet/territories/${t_id}/ride-requests/${r1_id} returns status == MATCHED and vehicle_id == ${v1_id}"
      - name: if_match_service_status_boundary_variants
        grounds:
          - calculations.vehicle_service_status
          - calculations.vehicle_service_status.variants.depot_marginal_ready
          - entities.Vehicle.fields.service_status
          - state_machines.Vehicle.transitions.UNAVAILABLE_to_AVAILABLE
        distinguishing_aspect: "A vehicle whose battery_pct is exactly 80 and cleanliness_score exactly 70 resolves service_status == AVAILABLE, while a sibling at battery_pct 79 resolves UNAVAILABLE — the two readings of the same predicate differ only at the inclusive boundary (>= vs >)."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot A with 8 bay positions. Vehicle V1 has battery_pct 80 and cleanliness_score 70; Vehicle V2 has battery_pct 79 and cleanliness_score 70. Both have calibration signed off and matching software, and both are staged at Depot A."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - *depot_call
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 80, cleanliness_score: 70, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0002", battery_pct: 79, cleanliness_score: 70, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v2_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/vehicles/${v2_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 2, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v2_id}", cycle_id: "${c2_id}" }
              as: DepotTechnician
              captures: { bs2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/schedule"
              payload: { bay_slot_id: "${bs2_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
          trigger:
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
            - call: "GET /fleet/vehicles/${v2_id}"
              payload: {}
              as: FleetOperations
          assert:
            - "Vehicle.${v1_id}.battery_pct == 80 and Vehicle.${v1_id}.service_status == AVAILABLE"
            - "Vehicle.${v2_id}.battery_pct == 79 and Vehicle.${v2_id}.service_status == UNAVAILABLE"
            - "both vehicles share cleanliness_score == 70, so battery_pct is the only differing predicate"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: if_match_credit_multi_input_threshold
        grounds:
          - calculations.territory_total_credit
          - entities.DemandSignal.fields.effective_demand
          - entities.ServiceTerritory.fields.total_credit_cents
        distinguishing_aspect: "total_credit_cents is a three-input non-linear function (projected_rides, manual_only_rides, posture) with a conditional branch that selects a different multiplier, so a change in any single input moves the literal; for effective_demand 40 while ACTIVE it resolves to exactly 2222222."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory PHX-METRO ACTIVE (mapped_pct 100, validation_hours 120), Depot A with 8 bay positions, one service-ready IN_SERVICE vehicle, one SAFE curb with an ACTIVE STANDARD curb rule, and a RideRequest in REQUESTED."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - *depot_call
            - call: "POST /fleet/territories/${t_id}/demand-signals"
              payload: { window_code: "MIDDAY", projected_rides: 50, manual_only_rides: 10 }
              as: TerritoryPlanner
            - *vehicle1_call
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/vehicles/${v1_id}/return-to-service"
              payload: {}
              as: FleetOperations
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
              captures: { occ_token: $.data.version }
            - call: "POST /fleet/territories/${t_id}/pickup-locations"
              payload: { curb_segment_code: "CURB-A1", curb_access: "SAFE" }
              as: MappingEngineer
              captures: { pl_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/curb-rules"
              payload: { curb_access: "SAFE", sub_service_type: "STANDARD", allowed: true }
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-comb-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
          assert:
            - "DemandSignal.effective_demand == 40"
            - "ServiceTerritory.${t_id}.total_credit_cents == 2222222"
            - "Vehicle.${v1_id}.credit_cents == 5555"
      - name: if_match_wave_reserve_floor_nested_rounding
        grounds:
          - calculations.wave_vehicle_selection
          - calculations.wave_vehicle_selection.variants.wave_reserve_floor
          - entities.DeploymentWave.fields.deployed_vehicle_count
        distinguishing_aspect: "The pre-deployment kept-staged reserve is rounded per wave with ceil BEFORE the subtraction, so a wave with planned_vehicle_count 4 over 3 available staged vehicles resolves cap == 1; computing the reserve once as floor over the aggregate would give cap == 2 — the rounding order is pinned to the per-wave ceil."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot A with 8 bay positions, three service-ready vehicles V1/V2/V3 all AT_DEPOT and AVAILABLE, one DeploymentWave for MIDDAY with planned_vehicle_count 4, DemandSignal(MIDDAY) projected_rides 50 / manual_only_rides 10."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - *depot_call
            - call: "POST /fleet/territories/${t_id}/demand-signals"
              payload: { window_code: "MIDDAY", projected_rides: 50, manual_only_rides: 10 }
              as: TerritoryPlanner
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 80, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0002", battery_pct: 85, cleanliness_score: 80, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v2_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0003", battery_pct: 81, cleanliness_score: 80, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v3_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/vehicles/${v2_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/vehicles/${v3_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v3_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c3_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 2, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v2_id}", cycle_id: "${c2_id}" }
              as: DepotTechnician
              captures: { bs2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/schedule"
              payload: { bay_slot_id: "${bs2_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/territories/${t_id}/deployment-waves"
              payload: { window_code: "MIDDAY", planned_vehicle_count: 4 }
              as: TerritoryPlanner
              captures: { w_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/deployment-waves/${w_id}/activate"
              payload: {}
              as: TerritoryPlanner
          trigger:
            - call: "POST /fleet/territories/${t_id}/deployment-waves/${w_id}/dispatch"
              payload: {}
              as: TerritoryPlanner
          assert:
            - "DeploymentWave.${w_id}.status == COMPLETED"
            - "DeploymentWave.${w_id}.deployed_vehicle_count == 1"
            - "exactly one of Vehicle.${v1_id}/Vehicle.${v2_id}/Vehicle.${v3_id} has status == IN_SERVICE, and it is the one with the highest battery_pct"
            - "Vehicle.${v3_id}.status == AT_DEPOT and Vehicle.${v3_id}.service_status == UNAVAILABLE"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: if_match_ride_three_attempt_redispatch_cycle
        grounds:
          - state_machines.RideRequest.transitions.MATCHED_to_MATCHED
          - state_machines.RideRequest.transitions.REQUESTED_to_MATCHED
          - entities.RideRequest.fields.dispatch_attempts
        distinguishing_aspect: "RideRequest is cyclic, not linear: a MATCHED ride whose matched vehicle accumulates 3 dispatch attempts un-matches itself back to REQUESTED with vehicle_id cleared, so the entity re-enters a state it already occupied."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot A, one service-ready IN_SERVICE vehicle V1, one SAFE curb with an ACTIVE STANDARD curb rule, and a RideRequest R1 in MATCHED against V1."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - *depot_call
            - *vehicle1_call
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 3600, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { bs1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/schedule"
              payload: { bay_slot_id: "${bs1_id}" }
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${d_id}/cycles/${c1_id}/complete"
              payload: { signed_off: true }
              as: DepotTechnician
            - call: "POST /fleet/vehicles/${v1_id}/return-to-service"
              payload: {}
              as: FleetOperations
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
              captures: { occ_token: $.data.version }
            - call: "POST /fleet/territories/${t_id}/pickup-locations"
              payload: { curb_segment_code: "CURB-A1", curb_access: "SAFE" }
              as: MappingEngineer
              captures: { pl_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/curb-rules"
              payload: { curb_access: "SAFE", sub_service_type: "STANDARD", allowed: true }
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-cycle-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "STUCK" }
              as: RemoteAssistanceOperator
              captures: { s1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "STUCK" }
              as: RemoteAssistanceOperator
              captures: { s2_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "STUCK" }
              as: RemoteAssistanceOperator
              captures: { s3_id: $.data.id }
          assert:
            - "GET /fleet/territories/${t_id}/ride-requests/${r1_id} returns status == REQUESTED"
            - "GET /fleet/territories/${t_id}/ride-requests/${r1_id} returns vehicle_id == null and dispatch_attempts == 3"
            - "GET /fleet/vehicles/${v1_id} returns status == IN_SERVICE"
      - name: if_match_session_tier_escalation_cycle
        grounds:
          - state_machines.AssistanceSession.transitions.ACKNOWLEDGED_to_ESCALATED
          - state_machines.AssistanceSession.transitions.ESCALATED_to_ACKNOWLEDGED
          - entities.AssistanceSession.fields.escalation_tier
        distinguishing_aspect: "AssistanceSession is cyclic rather than linear: an ACKNOWLEDGED session that times out returns to ESCALATED with escalation_tier incremented, so a state the session already occupied is re-entered on a different entity than the RideRequest cycle."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot A, one service-ready IN_SERVICE vehicle V1 matched to RideRequest R1, and one AssistanceSession S1 for R1 in ACKNOWLEDGED."
          setup_api_calls:
            - *clock_call
            - *territory_call
