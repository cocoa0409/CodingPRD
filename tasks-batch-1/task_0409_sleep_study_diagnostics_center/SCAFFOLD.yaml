# =============================================================================
# Sleep Study & Diagnostics Center — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "409. Sleep Study & Diagnostics Center: referral & prior-auth, in-lab PSG vs home sleep test (HSAT), bed/night scheduling, titration (CPAP) study, scoring & physician interpretation, DME order & resupply linkage, compliance-download reporting, follow-up"

domain_name: sleep-diagnostics-center
api_prefix: ""   # flat topology: peer collections live at the root (/patients, /referrals, /study-orders, ...)

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # flat: peer entities linked by foreign keys (Referral, StudyOrder, SleepBed,
  # ScoringReport, DMEOrder, ComplianceRecord, FollowUp). URL paths are flat
  # collections with FK fields in bodies / filtered-list query params — no deep
  # nesting under a single root tree.

  state_machine_shape: branching
  # Referral branches on prior-auth (APPROVED vs DENIED) and on study modality
  # (in-lab PSG vs HSAT) with divergent side-effect sets. StudyOrder has a
  # revert loop (SCORED -> IN_PROGRESS on physician kickback). DMEOrder carries
  # a resupply self-reference.

  relationship_patterns:
    - one_to_many        # Referral 1->N StudyOrder; StudyOrder 1->1 ScoringReport
    - self_referential   # DMEOrder.supersedes_dme_order_id -> DMEOrder.id (resupply chain)
    - cross_aggregate    # StudyOrder.bed_id -> SleepBed.id; ComplianceRecord.dme_order_id -> DMEOrder.id

  role_model: peer_roles
  # SchedulingCoordinator owns referrals/scheduling, SleepTechnologist scores,
  # Physician interprets, DMECoordinator owns DME + compliance. Patient is
  # entity-backed and may read own records and self-attest follow-up symptoms.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: insurance_payer, type: string, source: input, description: "Payer name used by prior-auth gate" }
      - { name: baseline_epworth_score, type: integer, source: input, default: 0, constraints: "0..24 inclusive; Epworth Sleepiness Scale" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation (OCC parent for study creation)" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: referring_provider_npi, type: string, source: input, description: "Referring clinician NPI string" }
      - { name: requested_modality, type: enum, source: input, constraints: "IN_LAB_PSG | HSAT; clinician-requested study type" }
      - { name: clinical_indication, type: string, source: input, description: "Reason for study (e.g., suspected_OSA)" }
      - { name: prior_auth_required, type: boolean, source: input, default: true, description: "Whether payer requires prior authorization" }
      - { name: prior_auth_number, type: string, source: input, default: null, description: "Authorization number, set on approval; null until then" }
      - { name: prior_auth_expires_on, type: string, source: input, default: null, description: "ISO date the authorization lapses; null until approval" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", constraints: "SUBMITTED | PENDING_AUTH | AUTHORIZED | DENIED | SCHEDULED | COMPLETED | CANCELLED" }

  - name: SleepBed
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }
      - { name: bed_label, type: string, source: input, description: "Human label, e.g. Room-3-Bed-A" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 60, constraints: ">= 0; sanitation/turnover gap required AFTER each booked night before the next may start" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", constraints: "AVAILABLE | OUT_OF_SERVICE" }

  - name: StudyOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision; used as deterministic tie-break/order key" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation (OCC parent for scoring submit)" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id" }
      - { name: bed_id, type: string, source: input, default: null, description: "FK -> SleepBed.id; required for IN_LAB modalities, null/forbidden for HSAT" }
      - { name: modality, type: enum, source: input, constraints: "IN_LAB_PSG | HSAT | IN_LAB_TITRATION; titration is a CPAP study and is IN_LAB only" }
      - { name: night_start_utc, type: datetime, source: input, default: null, description: "Booked night start (ISO 8601 UTC); set on scheduling. Null for unscheduled HSAT mail-out" }
      - { name: night_end_utc, type: datetime, source: input, default: null, description: "Booked night end (ISO 8601 UTC); must be > night_start_utc" }
      - { name: total_recording_minutes, type: integer, source: input, default: null, description: "Total sleep recording time in minutes, entered at scoring; > 0" }
      - { name: respiratory_event_count, type: integer, source: input, default: null, description: "Count of apnea+hypopnea events entered at scoring; >= 0" }
      - { name: titration_optimal_cmh2o, type: number, source: input, default: null, description: "Optimal CPAP pressure (cmH2O) found in titration; only for IN_LAB_TITRATION" }
      - { name: ahi, type: number, source: computed, description: "Apnea-Hypopnea Index; events per hour, recomputed at scoring" }
      - { name: severity, type: enum, source: computed, description: "NONE | MILD | MODERATE | SEVERE; derived from ahi thresholds" }
      - { name: status, type: enum, source: system, default: "ORDERED", constraints: "ORDERED | SCHEDULED | IN_PROGRESS | SCORED | INTERPRETED | CANCELLED" }

  - name: ScoringReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }
      - { name: study_order_id, type: string, source: input, description: "FK -> StudyOrder.id" }
      - { name: scored_by_tech_id, type: string, source: system, description: "Opaque X-User-ID of the SleepTechnologist who scored (audit string, not an entity FK)" }
      - { name: ahi_snapshot, type: number, source: computed, description: "AHI copied from StudyOrder at scoring submit time" }
      - { name: severity_snapshot, type: enum, source: computed, description: "NONE | MILD | MODERATE | SEVERE; copied from StudyOrder at scoring submit" }
      - { name: interpretation_text, type: string, source: input, default: null, description: "Physician's written interpretation; set on interpret" }
      - { name: physician_recommends_cpap, type: boolean, source: input, default: false, description: "Whether physician recommends CPAP therapy; set on interpret" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | FINALIZED | RETURNED" }

  - name: DMEOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision; resupply lineage tie-break key" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation (OCC parent for resupply creation)" }
      - { name: study_order_id, type: string, source: input, description: "FK -> StudyOrder.id; the interpreted study that justifies equipment" }
      - { name: supersedes_dme_order_id, type: string, source: input, default: null, description: "FK -> DMEOrder.id; non-null on a resupply that replaces a prior fulfilled order" }
      - { name: device_type, type: enum, source: input, constraints: "CPAP | APAP | BIPAP" }
      - { name: prescribed_pressure_cmh2o, type: number, source: input, description: "Prescribed pressure; > 0" }
      - { name: resupply_cycle_number, type: integer, source: computed, default: 1, description: "1 for initial order; prior.resupply_cycle_number + 1 for a resupply" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | SUBMITTED | FULFILLED | CANCELLED" }

  - name: ComplianceRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }
      - { name: dme_order_id, type: string, source: input, description: "FK -> DMEOrder.id; the fulfilled device whose modem reports usage" }
      - { name: window_start_utc, type: datetime, source: input, description: "Compliance window start (ISO 8601 UTC), inclusive" }
      - { name: window_end_utc, type: datetime, source: input, description: "Compliance window end (ISO 8601 UTC), exclusive; must be > window_start_utc" }
      - { name: nights_used_4h_plus, type: integer, source: input, description: "Count of nights in window with >= 4h usage; >= 0" }
      - { name: total_usage_minutes, type: integer, source: input, description: "Sum of device usage minutes across the window; >= 0" }
      - { name: adherent, type: boolean, source: computed, description: "True iff CMS-style threshold met (see calc cpap_adherence)" }

  - name: FollowUp
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }
      - { name: study_order_id, type: string, source: input, description: "FK -> StudyOrder.id; the interpreted study being followed up" }
      - { name: scheduled_for_utc, type: datetime, source: input, description: "Follow-up appointment time (ISO 8601 UTC)" }
      - { name: post_treatment_epworth_score, type: integer, source: input, default: null, constraints: "0..24 inclusive; entered at completion" }
      - { name: epworth_improvement, type: integer, source: computed, default: null, description: "baseline_epworth_score - post_treatment_epworth_score; set at completion" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    field: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED, DENIED]
    transitions:
      - from: SUBMITTED
        to: PENDING_AUTH
        trigger: "POST /referrals/{referralId}/request-auth"
        actor: SchedulingCoordinator
        preconditions:
          - "referral.prior_auth_required == true (else ERR_AUTH_NOT_REQUIRED)"
        side_effects:
          - "status -> PENDING_AUTH"

      - from: SUBMITTED
        to: AUTHORIZED
        trigger: "POST /referrals/{referralId}/approve-auth"
        actor: SchedulingCoordinator
        preconditions:
          - "referral.prior_auth_required == false (no-auth fast path; else must go via PENDING_AUTH)"
          - "request body provides prior_auth_number and prior_auth_expires_on"
        side_effects:
          - "prior_auth_number, prior_auth_expires_on persisted; status -> AUTHORIZED"

      - from: PENDING_AUTH
        to: AUTHORIZED
        trigger: "POST /referrals/{referralId}/approve-auth"
        actor: SchedulingCoordinator
        preconditions:
          - "request body provides prior_auth_number and prior_auth_expires_on"
        side_effects:
          - "prior_auth_number, prior_auth_expires_on persisted; status -> AUTHORIZED"

      - from: PENDING_AUTH
        to: DENIED
        trigger: "POST /referrals/{referralId}/deny-auth"
        actor: SchedulingCoordinator
        preconditions: []
        side_effects:
          - "status -> DENIED (terminal)"

      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "system: first StudyOrder for this referral transitions ORDERED -> SCHEDULED"
        actor: system
        preconditions:
          - "a StudyOrder under this referral has just been scheduled"
        side_effects:
          - "referral.status -> SCHEDULED (bubble-up from child StudyOrder scheduling)"
        note: "Cascade hop 2 of the schedule chain (see StudyOrder ORDERED->SCHEDULED)."

      - from: SCHEDULED
        to: COMPLETED
        trigger: "system: a StudyOrder under this referral reaches INTERPRETED"
        actor: system
        preconditions:
          - "the StudyOrder under this referral has just reached INTERPRETED"
        side_effects:
          - "referral.status -> COMPLETED (terminal; bubble-up)"

      - from: [SUBMITTED, PENDING_AUTH, AUTHORIZED]
        to: CANCELLED
        trigger: "POST /referrals/{referralId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "no StudyOrder under this referral is in IN_PROGRESS, SCORED, or INTERPRETED (else ERR_REFERRAL_HAS_ACTIVE_STUDY)"
        side_effects:
          - "status -> CANCELLED (terminal)"
          - "every StudyOrder under this referral in {ORDERED, SCHEDULED} -> CANCELLED (cascade down)"
          - "each cascade-cancelled StudyOrder that held a bed releases its night occupancy (bed becomes bookable for that interval again)"

  - entity: StudyOrder
    field: status
    initial_state: ORDERED
    terminal_states: [INTERPRETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: SCHEDULED
        trigger: "POST /study-orders/{studyOrderId}/schedule"
        actor: SchedulingCoordinator
        preconditions:
          - "parent Referral.status == AUTHORIZED (cross-entity gate; else ERR_REFERRAL_NOT_AUTHORIZED)"
          - "referral.prior_auth_expires_on is null OR night_start_utc date <= prior_auth_expires_on (else ERR_AUTH_EXPIRED)"
          - "for IN_LAB_PSG / IN_LAB_TITRATION: bed_id provided, SleepBed.status == AVAILABLE, and night interval does not collide with another booked night on that bed incl. turnover buffer (else ERR_BED_DOUBLE_BOOKED)"
          - "for HSAT: bed_id MUST be null (else ERR_HSAT_BED_NOT_ALLOWED)"
          - "night_end_utc > night_start_utc (else ERR_INVALID_NIGHT_WINDOW)"
        side_effects:
          - "night_start_utc, night_end_utc, bed_id persisted; status -> SCHEDULED"
          - "if parent Referral.status == AUTHORIZED -> Referral.status = SCHEDULED (bubble-up cascade hop)"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /study-orders/{studyOrderId}/start"
        actor: SleepTechnologist
        preconditions:
          - "study.status == SCHEDULED"
        side_effects:
          - "status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: SCORED
        trigger: "POST /study-orders/{studyOrderId}/score"
        actor: SleepTechnologist
        preconditions:
          - "study.status == IN_PROGRESS"
          - "total_recording_minutes > 0 (else ERR_INSUFFICIENT_RECORDING) and respiratory_event_count >= 0"
          - "for IN_LAB_TITRATION: titration_optimal_cmh2o > 0 provided (else ERR_TITRATION_PRESSURE_REQUIRED)"
          - "expected_study_order_version matches StudyOrder.version (else ERR_STALE_STUDY_VERSION)"
        side_effects:
          - "ahi recomputed (calc ahi_index); severity recomputed (calc severity_band)"
          - "status -> SCORED"
          - "a ScoringReport is created in DRAFT with ahi_snapshot, severity_snapshot copied from StudyOrder"
          - "increments StudyOrder.version by 1"

      - from: SCORED
        to: IN_PROGRESS
        trigger: "POST /scoring-reports/{scoringReportId}/return"
        actor: Physician
        preconditions:
          - "linked StudyOrder.status == SCORED"
        side_effects:
          - "ScoringReport.status -> RETURNED"
          - "linked StudyOrder.status -> IN_PROGRESS (revert loop: physician kicks scoring back to tech)"
        note: "Branching-with-revert: the study cycles SCORED -> IN_PROGRESS -> SCORED until interpretation."

      - from: SCORED
        to: INTERPRETED
        trigger: "POST /scoring-reports/{scoringReportId}/interpret"
        actor: Physician
        preconditions:
          - "linked StudyOrder.status == SCORED"
          - "ScoringReport.status == DRAFT"
          - "interpretation_text provided (non-empty)"
        side_effects:
          - "ScoringReport.interpretation_text, physician_recommends_cpap persisted; ScoringReport.status -> FINALIZED"
          - "linked StudyOrder.status -> INTERPRETED (terminal)"
          - "parent Referral.status SCHEDULED -> COMPLETED (bubble-up, terminal)"

      - from: [ORDERED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /study-orders/{studyOrderId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "study.status IN {ORDERED, SCHEDULED} (else ERR_STUDY_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (terminal)"
          - "if a bed night was held, release the night occupancy (bed bookable for that interval again)"

  - entity: ScoringReport
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /scoring-reports/{scoringReportId}/interpret"
        actor: Physician
        preconditions:
          - "report.status == DRAFT"
          - "linked StudyOrder.status == SCORED"
        side_effects:
          - "interpretation_text, physician_recommends_cpap persisted; status -> FINALIZED"
          - "linked StudyOrder -> INTERPRETED (cross-entity, drives Referral completion)"

      - from: DRAFT
        to: RETURNED
        trigger: "POST /scoring-reports/{scoringReportId}/return"
        actor: Physician
        preconditions:
          - "report.status == DRAFT"
          - "linked StudyOrder.status == SCORED"
        side_effects:
          - "status -> RETURNED"
          - "linked StudyOrder -> IN_PROGRESS (revert)"
        note: "A new DRAFT ScoringReport is produced when the tech re-scores (StudyOrder IN_PROGRESS -> SCORED)."

  - entity: DMEOrder
    field: status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dme-orders/{dmeOrderId}/submit"
        actor: DMECoordinator
        preconditions:
          - "linked StudyOrder.status == INTERPRETED (cross-entity gate; else ERR_STUDY_NOT_INTERPRETED)"
          - "the StudyOrder's FINALIZED ScoringReport has physician_recommends_cpap == true (else ERR_CPAP_NOT_RECOMMENDED)"
        side_effects:
          - "status -> SUBMITTED"

      - from: SUBMITTED
        to: FULFILLED
        trigger: "POST /dme-orders/{dmeOrderId}/fulfill"
        actor: DMECoordinator
        preconditions:
          - "dme.status == SUBMITTED"
        side_effects:
          - "status -> FULFILLED (device shipped; eligible for ComplianceRecord and resupply)"

      - from: [DRAFT, SUBMITTED]
        to: CANCELLED
        trigger: "POST /dme-orders/{dmeOrderId}/cancel"
        actor: DMECoordinator
        preconditions:
          - "dme.status IN {DRAFT, SUBMITTED} (else ERR_DME_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (terminal)"

  - entity: FollowUp
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /follow-ups/{followUpId}/complete"
        actor: SchedulingCoordinator
        preconditions:
          - "followup.status == SCHEDULED"
          - "post_treatment_epworth_score provided (0..24)"
        side_effects:
          - "post_treatment_epworth_score persisted; epworth_improvement recomputed (calc epworth_delta); status -> COMPLETED"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /follow-ups/{followUpId}/no-show"
        actor: SchedulingCoordinator
        preconditions:
          - "followup.status == SCHEDULED"
        side_effects:
          - "status -> NO_SHOW (terminal)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /follow-ups/{followUpId}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "followup.status == SCHEDULED"
        side_effects:
          - "status -> CANCELLED (terminal)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — true races)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-study-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /study-orders"
    occ_field: "expected_referral_version"
    description: |
      Creating a StudyOrder against a Referral whose version has advanced since
      the client last observed it is rejected. A prior write (e.g. an auth
      approval that stamped prior_auth_number / prior_auth_expires_on, or a
      cancellation) legitimately changed the Referral; the current writer's view
      of the referral is therefore stale and the create is refused.
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412

  - rule_id: scoring-submit-stale-study
    parent_entity: StudyOrder
    write_endpoint: "POST /study-orders/{studyOrderId}/score"
    occ_field: "expected_study_order_version"
    description: |
      Submitting scoring against a StudyOrder whose version has advanced since
      the client last observed it is rejected. A prior write — a physician
      return that bounced the study back to IN_PROGRESS and bumped its version,
      or another tech's score — makes this writer's view stale, so the score
      is refused on the OCC mismatch.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

  - rule_id: resupply-create-stale-dme
    parent_entity: DMEOrder
    write_endpoint: "POST /dme-orders"
    occ_field: "expected_supersedes_version"
    description: |
      Creating a resupply DMEOrder (supersedes_dme_order_id non-null) against a
      prior DMEOrder whose version has advanced since the client last observed
      it is rejected. Another resupply that already superseded the prior order
      bumped its version, so this writer's view of the predecessor is stale and
      the resupply is refused. Required only when supersedes_dme_order_id is set.
    error_id: ERR_STALE_DME_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ahi_index
    trigger: "StudyOrder IN_PROGRESS -> SCORED (POST /study-orders/{id}/score)"
    algorithm: threshold
    formula: |
      # Apnea-Hypopnea Index = respiratory events per hour of recording.
      # Evaluation order is pinned: compute recording_hours FIRST, then divide.
      recording_hours = total_recording_minutes / 60.0   # exact division, no pre-rounding
      ahi = round(respiratory_event_count / recording_hours, 1)   # 1 decimal, round_half_up
      # The divide-then-round order is mandatory: rounding recording_hours first
      # would change the index. ahi is written onto StudyOrder.ahi and copied to
      # ScoringReport.ahi_snapshot.
    input_set: "single StudyOrder being scored; uses its total_recording_minutes and respiratory_event_count"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: severity_band
    trigger: "StudyOrder IN_PROGRESS -> SCORED, immediately after ahi_index"
    algorithm: threshold
    formula: |
      # AASM severity bands keyed on ahi (events/hour). Boundaries are pinned
      # with >= so an exact boundary value lands in the HIGHER band.
      if ahi < 5:        severity = "NONE"
      elif ahi < 15:     severity = "MILD"      # 5.0 <= ahi < 15.0
      elif ahi < 30:     severity = "MODERATE"  # 15.0 <= ahi < 30.0
      else:              severity = "SEVERE"    # ahi >= 30.0
      # Exact boundary semantics: ahi == 5.0 -> MILD, ahi == 15.0 -> MODERATE,
      # ahi == 30.0 -> SEVERE.
    input_set: "single StudyOrder; uses ahi computed by ahi_index"
    constants:
      MILD_MIN: 5
      MODERATE_MIN: 15
      SEVERE_MIN: 30
    precision: "exact integer thresholds against 1-decimal ahi"

  - name: cpap_adherence
    trigger: "ComplianceRecord create (POST /compliance-records) and recompute on update"
    algorithm: threshold
    formula: |
      # CMS-style adherence over a fixed observation window. THREE inputs with
      # non-linear (compound AND) interaction; both clauses must hold.
      # 1) window must span at least MIN_WINDOW_DAYS calendar days
      window_days = floor((window_end_utc - window_start_utc) / 86400 seconds)
      # 2) at least MIN_NIGHTS nights with >= 4h usage
      # 3) those nights must be >= ADHERENCE_PCT of the window nights AND
      #    average usage on used nights >= MIN_AVG_MINUTES
      if window_days < MIN_WINDOW_DAYS:
          adherent = false
      else:
          avg_used_minutes = (total_usage_minutes / nights_used_4h_plus) if nights_used_4h_plus > 0 else 0
          pct = nights_used_4h_plus / window_days       # used nights over window days
          adherent = (nights_used_4h_plus >= MIN_NIGHTS)
                     and (pct >= ADHERENCE_PCT)
                     and (avg_used_minutes >= MIN_AVG_MINUTES)
      # Evaluation order pinned: window_days gate FIRST; if it fails, short-circuit
      # to adherent=false WITHOUT evaluating the usage clauses.
    input_set: "single ComplianceRecord; uses its window bounds, nights_used_4h_plus, total_usage_minutes"
    constants:
      MIN_WINDOW_DAYS: 30
      MIN_NIGHTS: 21
      ADHERENCE_PCT: 0.70
      MIN_AVG_MINUTES: 240
    precision: "integer minutes; pct is a real ratio compared with >= 0.70"

  - name: resupply_cycle_number
    trigger: "DMEOrder create (POST /dme-orders) when supersedes_dme_order_id is non-null"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency resolved by pinned evaluation order: a new
      # DMEOrder's cycle number depends on its predecessor's cycle number, which
      # itself was computed the same way. Order is well-defined because the chain
      # is acyclic (each resupply points at exactly one earlier, already-persisted
      # order).
      if supersedes_dme_order_id is null:
          resupply_cycle_number = 1
      else:
          prior = DMEOrder[supersedes_dme_order_id]
          resupply_cycle_number = prior.resupply_cycle_number + 1
    input_set: "the predecessor DMEOrder referenced by supersedes_dme_order_id, if any"
    constants: {}
    precision: "integer"

  - name: epworth_delta
    trigger: "FollowUp SCHEDULED -> COMPLETED (POST /follow-ups/{id}/complete)"
    algorithm: aggregation
    formula: |
      # Symptom improvement = baseline minus post-treatment Epworth Sleepiness
      # Scale. Pulls baseline from the Patient via the FollowUp -> StudyOrder ->
      # Referral -> Patient chain (cross-entity). A positive delta = improvement.
      patient = Patient[ Referral[ StudyOrder[followup.study_order_id].referral_id ].patient_id ]
      epworth_improvement = patient.baseline_epworth_score - post_treatment_epworth_score
    input_set: "Patient.baseline_epworth_score (via FK chain) and FollowUp.post_treatment_epworth_score"
    constants: {}
    precision: "integer (may be negative if symptoms worsened)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path / FK-referenced resources exist, validated left-to-right (referral, then study-order, then scoring-report/dme-order/etc.)"
    error_id: "ERR_REFERRAL_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_BED_NOT_FOUND / ERR_STUDY_NOT_FOUND / ERR_SCORING_REPORT_NOT_FOUND / ERR_DME_NOT_FOUND / ERR_COMPLIANCE_NOT_FOUND / ERR_FOLLOWUP_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK body fields

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers/numbers in declared ranges (e.g. epworth 0..24, total_recording_minutes > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: "ERR_INVALID_STATE / ERR_STUDY_NOT_CANCELLABLE / ERR_DME_NOT_CANCELLABLE / ERR_AUTH_NOT_REQUIRED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity state gate: StudyOrder scheduling requires Referral AUTHORIZED; DME submit requires StudyOrder INTERPRETED; scoring submit requires StudyOrder IN_PROGRESS"
    error_id: "ERR_REFERRAL_NOT_AUTHORIZED / ERR_STUDY_NOT_INTERPRETED"
    http_status: 409
    applies_to: "POST /study-orders/{id}/schedule, POST /dme-orders/{id}/submit"

  - priority: 7
    category: business_temporal
    check: "Authorization not expired: night_start_utc date <= referral.prior_auth_expires_on (when set)"
    error_id: ERR_AUTH_EXPIRED
    http_status: 409
    applies_to: "POST /study-orders/{id}/schedule"

  - priority: 8
    category: business_constraint
    check: "Modality/bed coherence: IN_LAB modalities require a bed_id; HSAT forbids a bed_id; titration requires IN_LAB modality"
    error_id: "ERR_BED_REQUIRED / ERR_HSAT_BED_NOT_ALLOWED"
    http_status: 422
    applies_to: "POST /study-orders/{id}/schedule"

  - priority: 9
    category: business_temporal
    check: "Bed night interval (night_start_utc, night_end_utc) must not collide with another booked night on the same bed, including the bed's turnover_buffer_minutes AFTER each existing night; bed must be AVAILABLE"
    error_id: "ERR_BED_DOUBLE_BOOKED / ERR_BED_OUT_OF_SERVICE"
    http_status: 409
    applies_to: "POST /study-orders/{id}/schedule (IN_LAB only)"

  - priority: 10
    category: business_safety
    check: "Compliance window must not overlap another ComplianceRecord window for the same DMEOrder (half-open [start,end) intervals; touching endpoints do NOT overlap)"
    error_id: ERR_COMPLIANCE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /compliance-records"

  - priority: 11
    category: business_safety
    check: "DME clinical gate: the study's FINALIZED ScoringReport must have physician_recommends_cpap == true before a DMEOrder may be submitted"
    error_id: ERR_CPAP_NOT_RECOMMENDED
    http_status: 409
    applies_to: "POST /dme-orders/{id}/submit"

  - priority: 12
    category: business_constraint
    check: "Scoring inputs sufficient: total_recording_minutes > 0; IN_LAB_TITRATION requires titration_optimal_cmh2o > 0"
    error_id: "ERR_INSUFFICIENT_RECORDING / ERR_TITRATION_PRESSURE_REQUIRED"
    http_status: 422
    applies_to: "POST /study-orders/{id}/score"

  - priority: 13
    category: business_referential
    check: "Resupply integrity: a DMEOrder with supersedes_dme_order_id set requires the predecessor to be FULFILLED and to share the same study_order_id (else ERR_RESUPPLY_PREDECESSOR_INVALID)"
    error_id: ERR_RESUPPLY_PREDECESSOR_INVALID
    http_status: 409
    applies_to: "POST /dme-orders"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_<parent>_version (when required by §1.2.1) must equal the parent's current version"
    error_id: "ERR_STALE_REFERRAL_VERSION / ERR_STALE_STUDY_VERSION / ERR_STALE_DME_VERSION"
    http_status: 412
    applies_to: "POST /study-orders, POST /study-orders/{id}/score, POST /dme-orders (resupply)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Create a patient"
    roles: [SchedulingCoordinator]
    code: 201
    input: [full_name, date_of_birth, insurance_payer, "baseline_epworth_score?"]
    output: Patient
    side_effects: ["version=1, baseline_epworth_score defaults to 0 if omitted"]

  - method: GET
    path: "/patients/{patientId}"
    description: "Get a patient"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/referrals"
    description: "Create a referral for a patient"
    roles: [SchedulingCoordinator]
    code: 201
    input: [patient_id, referring_provider_npi, requested_modality, clinical_indication, "prior_auth_required?"]
    output: Referral
    side_effects: ["status=SUBMITTED, version=1; validates patient_id FK"]

  - method: GET
    path: "/referrals"
    description: "List referrals (filterable by patient_id)"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: GET
    path: "/referrals/{referralId}"
    description: "Get a referral"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{referralId}/request-auth"
    description: "Move referral to PENDING_AUTH"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status SUBMITTED -> PENDING_AUTH"]

  - method: POST
    path: "/referrals/{referralId}/approve-auth"
    description: "Authorize a referral (from SUBMITTED no-auth or PENDING_AUTH)"
    roles: [SchedulingCoordinator]
    code: 200
    input: [prior_auth_number, prior_auth_expires_on]
    output: Referral
    side_effects: ["prior_auth_number, prior_auth_expires_on persisted; status -> AUTHORIZED"]

  - method: POST
    path: "/referrals/{referralId}/deny-auth"
    description: "Deny prior authorization"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status PENDING_AUTH -> DENIED (terminal)"]

  - method: POST
    path: "/referrals/{referralId}/cancel"
    description: "Cancel a referral and cascade-cancel its non-active studies"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "status -> CANCELLED"
      - "ORDERED/SCHEDULED StudyOrders under this referral -> CANCELLED, releasing held bed nights"

  # ---- SleepBed ----
  - method: POST
    path: "/beds"
    description: "Create a sleep bed resource"
    roles: [SchedulingCoordinator]
    code: 201
    input: [bed_label, "turnover_buffer_minutes?"]
    output: SleepBed
    side_effects: ["status=AVAILABLE, turnover_buffer_minutes defaults to 60"]

  - method: GET
    path: "/beds"
    description: "List sleep beds"
    roles: [SchedulingCoordinator, SleepTechnologist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SleepBed[]"
    side_effects: []

  - method: GET
    path: "/beds/{bedId}"
    description: "Get a sleep bed"
    roles: [SchedulingCoordinator, SleepTechnologist]
    code: 200
    input: []
    output: SleepBed
    side_effects: []

  - method: POST
    path: "/beds/{bedId}/set-out-of-service"
    description: "Mark a bed OUT_OF_SERVICE"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: SleepBed
    side_effects: ["status -> OUT_OF_SERVICE"]

  - method: GET
    path: "/study-orders"
    description: "List study orders (filterable by referral_id or bed_id)"
    roles: [SchedulingCoordinator, SleepTechnologist, Physician, DMECoordinator]
    code: 200
    input: ["referral_id?", "bed_id?", "status?", "limit?", "offset?"]
    output: "StudyOrder[]"
    side_effects: []

  # ---- StudyOrder ----
  - method: POST
    path: "/study-orders"
    description: "Create a study order under an authorized referral (OCC on referral)"
    roles: [SchedulingCoordinator]
    code: 201
    input: [referral_id, modality, expected_referral_version]
    output: StudyOrder
    side_effects: ["status=ORDERED, version=1; validates referral_id FK; OCC check expected_referral_version == Referral.version; increments Referral.version by 1"]

  - method: GET
    path: "/study-orders/{studyOrderId}"
    description: "Get a study order"
    roles: [SchedulingCoordinator, SleepTechnologist, Physician, DMECoordinator]
    code: 200
    input: []
    output: StudyOrder
    side_effects: []

  - method: POST
    path: "/study-orders/{studyOrderId}/schedule"
    description: "Schedule a study (book bed night for in-lab; mail-out for HSAT)"
    roles: [SchedulingCoordinator]
    code: 200
    input: [night_start_utc, night_end_utc, "bed_id?"]
    output: StudyOrder
    side_effects:
      - "bed_id/night window persisted; status ORDERED -> SCHEDULED"
      - "Referral AUTHORIZED -> SCHEDULED (bubble-up)"

  - method: POST
    path: "/study-orders/{studyOrderId}/start"
    description: "Begin the recording (tech)"
    roles: [SleepTechnologist]
    code: 200
    input: []
    output: StudyOrder
    side_effects: ["status SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/study-orders/{studyOrderId}/score"
    description: "Submit scoring metrics; computes AHI + severity (OCC on study)"
    roles: [SleepTechnologist]
    code: 200
    input: [total_recording_minutes, respiratory_event_count, "titration_optimal_cmh2o?", expected_study_order_version]
    output: StudyOrder
    side_effects:
      - "ahi recomputed (ahi_index), severity recomputed (severity_band)"
      - "status IN_PROGRESS -> SCORED"
      - "creates a DRAFT ScoringReport with ahi_snapshot/severity_snapshot"
      - "increments StudyOrder.version by 1"

  - method: POST
    path: "/study-orders/{studyOrderId}/cancel"
    description: "Cancel an ORDERED/SCHEDULED study; releases held bed night"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: StudyOrder
    side_effects: ["status -> CANCELLED; bed night released if held"]

  - method: GET
    path: "/study-orders/{id}/scoring-reports"
    description: "List scoring reports for a study order (reverse-reachability for ScoringReport.study_order_id)"
    roles: [SchedulingCoordinator, SleepTechnologist, Physician, DMECoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScoringReport[]"
    side_effects: []

  - method: GET
    path: "/study-orders/{id}/follow-ups"
    description: "List follow-ups for a study order (reverse-reachability for FollowUp.study_order_id)"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: "FollowUp[]"
    side_effects: []

  # ---- ScoringReport ----
  - method: GET
    path: "/scoring-reports/{scoringReportId}"
    description: "Get a scoring report"
    roles: [SchedulingCoordinator, SleepTechnologist, Physician, DMECoordinator]
    code: 200
    input: []
    output: ScoringReport
    side_effects: []

  - method: POST
    path: "/scoring-reports/{scoringReportId}/interpret"
    description: "Physician finalizes interpretation; study -> INTERPRETED"
    roles: [Physician]
    code: 200
    input: [interpretation_text, "physician_recommends_cpap?"]
    output: ScoringReport
    side_effects:
      - "interpretation_text, physician_recommends_cpap persisted; status DRAFT -> FINALIZED"
      - "linked StudyOrder SCORED -> INTERPRETED; parent Referral SCHEDULED -> COMPLETED"

  - method: POST
    path: "/scoring-reports/{scoringReportId}/return"
    description: "Physician returns a draft for re-scoring; study -> IN_PROGRESS"
    roles: [Physician]
    code: 200
    input: []
    output: ScoringReport
    side_effects:
      - "status DRAFT -> RETURNED"
      - "linked StudyOrder SCORED -> IN_PROGRESS (bumps StudyOrder.version)"

  # ---- DMEOrder ----
  - method: POST
    path: "/dme-orders"
    description: "Create a DME order (initial or resupply; OCC on predecessor when resupply)"
    roles: [DMECoordinator]
    code: 201
    input: [study_order_id, device_type, prescribed_pressure_cmh2o, "supersedes_dme_order_id?", "expected_supersedes_version?"]
    output: DMEOrder
    side_effects:
      - "status=DRAFT, version=1; resupply_cycle_number computed"
      - "if supersedes_dme_order_id set: OCC check expected_supersedes_version == predecessor.version; increments predecessor.version by 1"

  - method: GET
    path: "/dme-orders"
    description: "List DME orders (filterable by study_order_id or supersedes_dme_order_id)"
    roles: [SchedulingCoordinator, Physician, DMECoordinator]
    code: 200
    input: ["study_order_id?", "supersedes_dme_order_id?", "status?", "limit?", "offset?"]
    output: "DMEOrder[]"
    side_effects: []

  - method: GET
    path: "/dme-orders/{dmeOrderId}"
    description: "Get a DME order"
    roles: [SchedulingCoordinator, Physician, DMECoordinator]
    code: 200
    input: []
    output: DMEOrder
    side_effects: []

  - method: POST
    path: "/dme-orders/{dmeOrderId}/submit"
    description: "Submit a DME order (requires interpreted study + CPAP recommended)"
    roles: [DMECoordinator]
    code: 200
    input: []
    output: DMEOrder
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/dme-orders/{dmeOrderId}/fulfill"
    description: "Mark a DME order FULFILLED (device shipped)"
    roles: [DMECoordinator]
    code: 200
    input: []
    output: DMEOrder
    side_effects: ["status SUBMITTED -> FULFILLED"]

  - method: POST
    path: "/dme-orders/{dmeOrderId}/cancel"
    description: "Cancel a DRAFT/SUBMITTED DME order"
    roles: [DMECoordinator]
    code: 200
    input: []
    output: DMEOrder
    side_effects: ["status -> CANCELLED"]

  - method: GET
    path: "/dme-orders/{id}/compliance-records"
    description: "List compliance records for a DME order (reverse-reachability for ComplianceRecord.dme_order_id)"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: "ComplianceRecord[]"
    side_effects: []

  # ---- ComplianceRecord ----
  - method: POST
    path: "/compliance-records"
    description: "Upload a compliance-download window for a fulfilled DME order"
    roles: [DMECoordinator]
    code: 201
    input: [dme_order_id, window_start_utc, window_end_utc, nights_used_4h_plus, total_usage_minutes]
    output: ComplianceRecord
    side_effects: ["adherent computed (cpap_adherence); validates no window overlap; requires DMEOrder FULFILLED"]

  - method: GET
    path: "/compliance-records/{complianceRecordId}"
    description: "Get a compliance record"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: []
    output: ComplianceRecord
    side_effects: []

  # ---- FollowUp ----
  - method: POST
    path: "/follow-ups"
    description: "Schedule a follow-up for an interpreted study"
    roles: [SchedulingCoordinator]
    code: 201
    input: [study_order_id, scheduled_for_utc]
    output: FollowUp
    side_effects: ["status=SCHEDULED; requires StudyOrder INTERPRETED"]

  - method: GET
    path: "/follow-ups/{followUpId}"
    description: "Get a follow-up"
    roles: [SchedulingCoordinator, Physician, DMECoordinator, Patient]
    code: 200
    input: []
    output: FollowUp
    side_effects: []

  - method: POST
    path: "/follow-ups/{followUpId}/complete"
    description: "Complete a follow-up; records post-treatment Epworth and improvement"
    roles: [SchedulingCoordinator]
    code: 200
    input: [post_treatment_epworth_score]
    output: FollowUp
    side_effects: ["epworth_improvement computed (epworth_delta); status -> COMPLETED"]

  - method: POST
    path: "/follow-ups/{followUpId}/no-show"
    description: "Mark a follow-up as NO_SHOW"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: FollowUp
    side_effects: ["status -> NO_SHOW"]

  - method: POST
    path: "/follow-ups/{followUpId}/cancel"
    description: "Cancel a scheduled follow-up"
    roles: [SchedulingCoordinator]
    code: 200
    input: []
    output: FollowUp
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number, or night_end_utc <= night_start_utc" }
  - { id: ERR_INVALID_NIGHT_WINDOW, http: 422, condition: "night_end_utc <= night_start_utc on a study schedule" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset out of bounds (limit 1..100, offset >= 0)" }
  # --- not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "patient_id does not resolve to a Patient" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referralId / referral_id does not resolve to a Referral" }
  - { id: ERR_BED_NOT_FOUND, http: 404, condition: "bedId / bed_id does not resolve to a SleepBed" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "studyOrderId / study_order_id does not resolve to a StudyOrder" }
  - { id: ERR_SCORING_REPORT_NOT_FOUND, http: 404, condition: "scoringReportId does not resolve to a ScoringReport" }
  - { id: ERR_DME_NOT_FOUND, http: 404, condition: "dmeOrderId / dme_order_id / supersedes_dme_order_id does not resolve to a DMEOrder" }
  - { id: ERR_COMPLIANCE_NOT_FOUND, http: 404, condition: "complianceRecordId does not resolve to a ComplianceRecord" }
  - { id: ERR_FOLLOWUP_NOT_FOUND, http: 404, condition: "followUpId does not resolve to a FollowUp" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which this transition is legal" }
  - { id: ERR_AUTH_NOT_REQUIRED, http: 409, condition: "request-auth called on a referral whose prior_auth_required is false" }
  - { id: ERR_STUDY_NOT_CANCELLABLE, http: 409, condition: "Study cancel attempted from a non-{ORDERED,SCHEDULED} state" }
  - { id: ERR_DME_NOT_CANCELLABLE, http: 409, condition: "DME cancel attempted from a non-{DRAFT,SUBMITTED} state" }
  - { id: ERR_REFERRAL_HAS_ACTIVE_STUDY, http: 409, condition: "Referral cancel blocked because a study is IN_PROGRESS/SCORED/INTERPRETED" }
  # --- cross-entity / referential ---
  - { id: ERR_REFERRAL_NOT_AUTHORIZED, http: 409, condition: "Study schedule attempted while parent Referral is not AUTHORIZED" }
  - { id: ERR_STUDY_NOT_INTERPRETED, http: 409, condition: "DME submit attempted while linked StudyOrder is not INTERPRETED" }
  - { id: ERR_RESUPPLY_PREDECESSOR_INVALID, http: 409, condition: "Resupply predecessor is not FULFILLED or does not share the same study_order_id" }
  # --- temporal / scheduling ---
  - { id: ERR_AUTH_EXPIRED, http: 409, condition: "night_start_utc date is after referral.prior_auth_expires_on" }
  - { id: ERR_BED_DOUBLE_BOOKED, http: 409, condition: "Bed night collides with an existing booked night on that bed incl. turnover buffer" }
  - { id: ERR_BED_OUT_OF_SERVICE, http: 409, condition: "Bed selected for scheduling is OUT_OF_SERVICE" }
  - { id: ERR_COMPLIANCE_WINDOW_OVERLAP, http: 409, condition: "Compliance window overlaps an existing window for the same DMEOrder (half-open intervals)" }
  # --- modality / clinical ---
  - { id: ERR_BED_REQUIRED, http: 422, condition: "IN_LAB modality scheduled without a bed_id" }
  - { id: ERR_HSAT_BED_NOT_ALLOWED, http: 422, condition: "HSAT scheduled with a bed_id supplied" }
  - { id: ERR_INSUFFICIENT_RECORDING, http: 422, condition: "Scoring submitted with total_recording_minutes <= 0" }
  - { id: ERR_TITRATION_PRESSURE_REQUIRED, http: 422, condition: "IN_LAB_TITRATION scored without titration_optimal_cmh2o > 0" }
  - { id: ERR_CPAP_NOT_RECOMMENDED, http: 409, condition: "DME submit blocked because the study's report does not recommend CPAP" }
  # --- concurrency (OCC) ---
  - { id: ERR_STALE_REFERRAL_VERSION, http: 412, condition: "expected_referral_version != Referral.version on study create" }
  - { id: ERR_STALE_STUDY_VERSION, http: 412, condition: "expected_study_order_version != StudyOrder.version on scoring submit" }
  - { id: ERR_STALE_DME_VERSION, http: 412, condition: "expected_supersedes_version != predecessor DMEOrder.version on resupply create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchedulingCoordinator
    description: "Front-office staff: owns patients, referrals, prior-auth workflow, bed inventory, study scheduling, follow-ups."
    identity: opaque
    exclusive_operations:
      - "POST /patients"
      - "POST /referrals"
      - "POST /referrals/{id}/request-auth"
      - "POST /referrals/{id}/approve-auth"
      - "POST /referrals/{id}/deny-auth"
      - "POST /referrals/{id}/cancel"
      - "POST /beds"
      - "POST /beds/{id}/set-out-of-service"
      - "POST /study-orders"
      - "POST /study-orders/{id}/schedule"
      - "POST /study-orders/{id}/cancel"
      - "POST /follow-ups"
      - "POST /follow-ups/{id}/complete"
      - "POST /follow-ups/{id}/no-show"
      - "POST /follow-ups/{id}/cancel"
    shared_operations:
      - "GET endpoints across patients, referrals, beds, study-orders, scoring-reports, dme-orders, compliance-records, follow-ups"

  - name: SleepTechnologist
    description: "Sleep lab technologist: starts and scores recordings."
    identity: opaque
    exclusive_operations:
      - "POST /study-orders/{id}/start"
      - "POST /study-orders/{id}/score"
    shared_operations:
      - "GET /beds, GET /beds/{id}, GET /study-orders, GET /study-orders/{id}, GET /study-orders/{id}/scoring-reports, GET /scoring-reports/{id}"

  - name: Physician
    description: "Interpreting physician: finalizes or returns scoring reports."
    identity: opaque
    exclusive_operations:
      - "POST /scoring-reports/{id}/interpret"
      - "POST /scoring-reports/{id}/return"
    shared_operations:
      - "GET endpoints across patients, referrals, study-orders, scoring-reports, dme-orders, compliance-records, follow-ups"

  - name: DMECoordinator
    description: "Durable medical equipment coordinator: owns DME orders, resupply, compliance uploads."
    identity: opaque
    exclusive_operations:
      - "POST /dme-orders"
      - "POST /dme-orders/{id}/submit"
      - "POST /dme-orders/{id}/fulfill"
      - "POST /dme-orders/{id}/cancel"
      - "POST /compliance-records"
    shared_operations:
      - "GET endpoints across patients, referrals, study-orders, scoring-reports, dme-orders, compliance-records, follow-ups"

  - name: Patient
    description: "The patient: read-only access to their own records and follow-ups."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET /patients/{id} (own), GET /referrals (own via patient_id filter), GET /referrals/{id}, GET /study-orders/{id}/follow-ups, GET /follow-ups/{id}, GET /dme-orders/{id}/compliance-records, GET /compliance-records/{id}"
