              captures: { st: "$.data.run_status", started: "$.data.started_at", tgt: "$.data.target_ppm_at_start", dwell: "$.data.required_dwell_seconds_at_start" }
          assert:
            - "${e_none} == ERR_NO_ANTIMICROBIAL_READINGS with HTTP 422 at priority 43"
            - "${e_stale} == ERR_ANTIMICROBIAL_READING_STALE at priority 44: 05:59 is 61 minutes before 07:00, one minute past ANTIMICROBIAL_READING_MAX_AGE_MINUTES"
            - "${below} == true and ${topup} == 0.1 == round_half_up(20.0 - 19.9, 1) on the 06:00 reading"
            - "${e_below} == ERR_ANTIMICROBIAL_BELOW_MINIMUM at priority 45, which proves the 06:00 reading was accepted as fresh at exactly 60 minutes and that 19.9 < 20.0 fails"
            - "${st} == RUNNING with ${started} == 2026-08-03T07:00:00.000Z once the newest reading is exactly 20.0, because the minimum comparison is strict <"
            - "${tgt} == 20.0 and ${dwell} == 90 == max(90, ceil(90 x 20.0 / 20.0))"

      - name: corner_close_requires_a_reading_inside_the_inclusive_window
        claim_type: Satisfaction → Pass
        grounds:
