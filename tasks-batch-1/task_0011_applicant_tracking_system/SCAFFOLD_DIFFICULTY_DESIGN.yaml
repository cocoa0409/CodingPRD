            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "IntRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Int Cand", email: "intc@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 1, scheduled_at: "2026-09-02T10:00:00Z", duration_minutes: 60, panel_user_ids: ["panelist_a", "panelist_b"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { intv_id: $.data.id }
            - call: "POST /ats/interview-feedback"
              payload: { interview_id: "${intv_id}", panelist_user_id: "panelist_a", score: 4, comments: "good" }
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/interview-feedback"
              payload: { interview_id: "${intv_id}", panelist_user_id: "panelist_b", score: 5, comments: "great" }
              as: HiringManager
              as_user_id: "hm_bob"
          trigger:
            - call: "POST /ats/interviews/${intv_id}/complete"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { final_score: $.data.aggregate_score, final_rec: $.data.recommendation }
          assert:
            - "Interview.aggregate_score == 4.50 (exact mean of 4 and 5)"
            - "Interview.recommendation == STRONG_HIRE (4.50 sits on inclusive lower bound of STRONG_HIRE band)"
            - "Interview.status == COMPLETED"

      - name: offer_accept_exact_expiry_boundary_revoked
        grounds:
          - state_machines.Offer.EXTENDED_to_REVOKED
          - validations[priority=15]
          - errors[ERR_OFFER_EXPIRED]
        distinguishing_aspect: |
          Temporal boundary on a different endpoint /offers/{id}/accept: at exactly now ==
          offer.expires_at, the validation `now < expires_at` fails (boundary uses strict <,
          equality is rejected); the offer transitions to REVOKED. Different metric (datetime
          instant) and different endpoint than the score threshold above.
        test_recipe:
          setup:
            - "Offer in EXTENDED at clock=2026-10-01T00:00:00Z; expires_at = 2026-10-15T00:00:00Z (14 days)"
