      - name: evidence_older_than_two_years_contributes_exactly_nothing
        claim_type: Constants Applied
        grounds:
          - calculations.trafficking_confidence_score.constants.DECAY_MULTIPLIERS
          - errors.ERR_INSUFFICIENT_EVIDENCE
        distinguishing_aspect: "Two items observed in early 2024 are more than 730 days old at the 2026-08-01 clock, so their multiplier is 0.00: the score stays 0 and even INELIGIBLE_ITEM_SALES - which needs no score at all, only one live item - is refused with 422 ERR_INSUFFICIENT_EVIDENCE."
        test_recipe:
