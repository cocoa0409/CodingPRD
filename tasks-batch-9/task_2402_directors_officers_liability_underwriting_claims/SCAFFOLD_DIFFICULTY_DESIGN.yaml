              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /dno/policies/${policy_id}/layers"
              payload: { carrier_name: "Meridian Primary", attachment_point_usd: 0, limit_usd: 5000000, participation_pct: 1.00, form_type: "FOLLOWING_FORM" }
              as: Underwriter
