# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) — task_2310
# Walk of references/claim-extraction-guide.md's nine sections against §1.1–§1.7.
# `excluded_because:` stubs cite instances that exist by name in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_valve_model_create_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.ValveModel
          - endpoints[POST /valve-mfg/valve-models]
        distinguishing_aspect: "POST /valve-mfg/valve-models with every required input returns 201, status DRAFT, spec_revision 1 and version 1 inside the success envelope."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /valve-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Any
          trigger:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-CREATE", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ValveModel.${m_id}.model_code == BV-300-CREATE"
            - "ValveModel.${m_id}.status == DRAFT"
            - "ValveModel.${m_id}.spec_revision == 1"
            - "ValveModel.${m_id}.version == 1"
            - "response.response_type == object"
            - "response.meta.api_request_id is present"

      - name: corner_valve_model_get_by_id_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /valve-mfg/valve-models/{id}]
        distinguishing_aspect: "GET /valve-mfg/valve-models/{id} returns the same field values that the create call stored, with no mutation of status or spec_revision."
        test_recipe:
          setup:
            - "One DRAFT BALL model at class 300 with base_break_torque_nm 420.0."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-READ", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /valve-mfg/valve-models/${m_id}"
              payload: {}
              as: Any
          assert:
            - "HTTP status == 200"
            - "ValveModel.${m_id}.valve_type == BALL"
            - "ValveModel.${m_id}.pressure_class == 300"
            - "ValveModel.${m_id}.base_break_torque_nm == 420.0"
            - "ValveModel.${m_id}.status == DRAFT"

      - name: corner_valve_models_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /valve-mfg/valve-models]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three models stored, GET /valve-mfg/valve-models?limit=2&offset=0 returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Exactly three DRAFT models: two BALL and one GATE."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "PG-1", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "PG-2", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "SOFT", base_break_torque_nm: 300.0 }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "PG-3", valve_type: "GATE", pressure_class: 150, body_material_grade: "WCB", bore_size_mm: 80, seat_type: "METAL", base_break_torque_nm: 250.0 }
              as: ProductEngineer
          trigger:
            - call: "GET /valve-mfg/valve-models"
              payload: { limit: 2, offset: 0 }
              as: Any
          assert:
            - "HTTP status == 200"
            - "response.response_type == array"
            - "len(data) == 2"
            - "total_count == 3"
            - "has_more == true"

      - name: corner_heat_lot_create_missing_material_grade_rejected
        claim_type: Required Fields
        grounds:
          - entities.HeatLot.material_grade
          - validations[priority=10]
        distinguishing_aspect: "Omitting the required material_grade on POST /valve-mfg/heat-lots yields ERR_INVALID_REQUEST (400) and stores nothing."
        test_recipe:
          setup:
            - "One foundry with no heat lots."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C1", name: "Corner Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C101", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C101", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "Foundry.${f_id}.total_lot_count == 0"

      - name: corner_valve_model_defaults_applied_when_optionals_omitted
        claim_type: Defaults
        grounds:
          - entities.ValveModel.required_special_services
          - entities.ValveModel.repair_kit_stock_qty
        distinguishing_aspect: "Omitting required_special_services and repair_kit_stock_qty stores [] and 0 respectively, and qualified_special_services starts empty."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /valve-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Any
          trigger:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-DEF", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          assert:
            - "ValveModel.${m_id}.required_special_services == []"
            - "ValveModel.${m_id}.repair_kit_stock_qty == 0"
            - "ValveModel.${m_id}.qualified_special_services == []"
            - "ValveModel.${m_id}.supersedes_model_id == null"

      - name: corner_valve_model_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ValveModel.status
          - entities.ValveModel.spec_revision
        distinguishing_aspect: "Client-supplied status, spec_revision, id and version are ignored: the server stamps DRAFT, 1, its own id and version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /valve-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Any
          trigger:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-SYS", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0, status: "RELEASED", spec_revision: 9, version: 7 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          assert:
            - "ValveModel.${m_id}.status == DRAFT"
            - "ValveModel.${m_id}.spec_revision == 1"
            - "ValveModel.${m_id}.version == 1"

      - name: corner_component_create_with_unknown_heat_lot_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_HEAT_LOT_NOT_FOUND]
          - validations[priority=23]
        distinguishing_aspect: "POST /valve-mfg/components quoting a heat_lot_id that no row carries returns ERR_HEAT_LOT_NOT_FOUND (404) before any mass or qualification rule runs."
        test_recipe:
          setup:
            - "One DRAFT model and no heat lots at all."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-NF", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "00000000-0000-4000-8000-000000000000", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 100.000 }
              as: ProcurementSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_HEAT_LOT_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_valve_unit_cannot_consume_component_of_another_model
        claim_type: graph
        grounds:
          - validations[priority=42]
          - entities.Component.target_model_id
          - errors[ERR_COMPONENT_NOT_AVAILABLE]
        distinguishing_aspect: "Cross-aggregate FK integrity on a graph topology: a BODY component whose target_model_id is model B cannot open a unit of model A — ERR_COMPONENT_NOT_AVAILABLE (409)."
        test_recipe:
          setup:
            - "One QUALIFIED CASTING/CF8M qualification covering class 600 and a RELEASED 500.000 kg lot."
            - "Model A (IN_REVIEW) and model B (DRAFT), both BALL class 300 in CF8M."
            - "One BODY component of 120.500 kg targeted at model B."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C2", name: "Corner Forge", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-A", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { ma_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${ma_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-B", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 430.0 }
              as: ProductEngineer
              captures: { mb_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C201", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C201", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${mb_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-C2", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-c2", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${ma_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-C2-1" }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPONENT_NOT_AVAILABLE"
            - "HTTP status == 409"
            - "Component.${c_id}.status == CREATED"
            - "Component.${c_id}.target_model_id == ${mb_id}"

  # entities walk, continued — immutability row
  - section: entities
    instances:
      - name: corner_test_record_is_immutable_and_exposes_no_version
        claim_type: Immutability
        grounds:
          - entities.TestRecord
          - endpoints[GET /valve-mfg/valve-units/{id}/test-records]
        distinguishing_aspect: "TestRecord is declared common_fields: false — §1.5 exposes no update or delete route for it and the row carries no version field, only its append-time payload."
        test_recipe:
          setup:
            - "A RELEASED BALL model at class 300 bore 100 and a unit at build_status ASSEMBLED."
            - "One SHELL PASS record on BENCH-C1 from 08:00Z to 09:00Z on 2026-08-01."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C3", name: "Corner Bench Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-IMM", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C301", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C301", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-C3", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-c3", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-C3-1" }
              as: ProductEngineer
              captures: { u_id: $.data.id }
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "MACHINED" }
              as: TestTechnician
              as_user_id: "tech-c3"
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "ASSEMBLED" }
              as: TestTechnician
              as_user_id: "tech-c3"
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SHELL", test_bench_code: "BENCH-C1", started_at: "2026-08-01T08:00:00Z", ended_at: "2026-08-01T09:00:00Z", test_pressure_bar: 80.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-c3"
          trigger:
            - call: "GET /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SHELL" }
              as: Any
          assert:
            - "len(data) == 1"
            - "data[0].result == PASS"
            - "data[0].performed_by_user_id == tech-c3"
            - "data[0] has no version field"
            - "data[0].required_pressure_bar == 76.7"
            - "no PATCH, PUT or DELETE route for test-records exists in §1.5"

  - section: state_machines
    instances:
      - name: corner_valve_unit_initial_state_is_blank_uncertified_none
        claim_type: Initial State
        grounds:
          - state_machines.ValveUnit.initial_state
          - endpoints[POST /valve-mfg/valve-units]
        distinguishing_aspect: "A newly opened unit starts at build_status BLANK, cert_status UNCERTIFIED, service_status NONE with reserved_kit_qty 0, and flips its body component to CONSUMED in the same request."
        test_recipe:
          setup:
            - "An IN_REVIEW BALL model, a RELEASED lot, one BODY component and an APPLIED license scoped to BALL."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C4", name: "Corner Init Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-INIT", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C401", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C401", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-C4", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-c4", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-C4-1" }
              as: ProductEngineer
              captures: { u_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ValveUnit.${u_id}.build_status == BLANK"
            - "ValveUnit.${u_id}.cert_status == UNCERTIFIED"
            - "ValveUnit.${u_id}.service_status == NONE"
            - "ValveUnit.${u_id}.reserved_kit_qty == 0"
            - "Component.${c_id}.status == CONSUMED"
            - "HeatLot.${l_id}.qty_available_kg == 379.500"

      - name: corner_build_advance_skipping_assembled_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ValveUnit.build_status_MACHINED_to_ASSEMBLED
          - errors[ERR_BUILD_SEQUENCE_INVALID]
          - validations[priority=70]
        distinguishing_aspect: "From build_status MACHINED, ADVANCE straight to PACKAGED is non-adjacent and yields ERR_BUILD_SEQUENCE_INVALID (422); the unit stays MACHINED."
        test_recipe:
          setup:
            - "An IN_REVIEW BALL model and a unit advanced exactly one step, to build_status MACHINED."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C5", name: "Corner Seq Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
