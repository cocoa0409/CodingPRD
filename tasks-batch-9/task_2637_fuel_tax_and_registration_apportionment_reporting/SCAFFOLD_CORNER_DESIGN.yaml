        claim_type: conditional_validation
        grounds:
          - validations[18].ERR_CARRIER_LICENSE_INACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / return_prepare_blocked_while_carrier_ifta_license_suspended
          rationale: "That §1.8 instance already drives ifta_license_status to a non-ACTIVE value and asserts the resulting prepare rejection plus the untouched return fields."

      - name: segregation_of_duties_versus_the_bond_ceiling
        claim_type: priority_conflict
        grounds:
          - validations[26].ERR_SEGREGATION_OF_DUTIES
          - validations[37].ERR_BOND_CEILING_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_bond_ceiling_on_return_filing
          rationale: "The simultaneous violation of priority 26 and priority 37 on file, and the proof that 26 wins, is exactly that §1.8 instance."

      - name: trip_state_check_precedes_the_segregation_check
        claim_type: priority_ordering
        grounds:
          - validations[17].ERR_INVALID_TRIP_STATE
          - validations[26].ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / already_accepted_trip_review_returns_state_error_before_segregation_check
          rationale: "That §1.8 instance constructs the double violation on trip review and pins the winner to priority 17."

      - name: overlapping_trip_intervals_for_one_vehicle
        claim_type: temporal_validation
        grounds:
          - validations[32].ERR_TRIP_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vehicle_trip_intervals_are_half_open_so_adjacency_is_allowed
          rationale: "Both the accepted adjacency case and the rejected one-second overlap are asserted in that §1.8 boundary instance."

      - name: driver_credential_window_conflicts
        claim_type: temporal_validation
        grounds:
