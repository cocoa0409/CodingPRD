      - name: reclaim_shipment_then_certification_conserves_mass_with_residue
        claim_type: side_effect_execution
        grounds:
          - state_machines.Cylinder.RECOVERED_to_SENT_FOR_RECLAIM
          - state_machines.Cylinder.SENT_FOR_RECLAIM_to_RECLAIMED
          - calculations.total_refrigerant_mass_invariant
        distinguishing_aspect: "The two reclaim calls only move mass between the cylinder's two buckets: shipment empties current into shipped (30.0/0.0), and a certification of 28.5 returns 28.5 to current while leaving the 1.5 lb reclaimer residue in shipped - so current + shipped is 30.0 at every step and nothing is silently written off."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1, EQ1, CYL1 (nominal 50.0, initial 0.0), then a 30.0 lb RECOVER_REFRIGERANT record so the cylinder is RECOVERED."
