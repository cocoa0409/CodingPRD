scaffold_corner_design:
  - section: entities
    instances:
      - name: warehouse_creation_returns_computed_credit_rate
        claim_type: Computed Fields
        grounds:
          - entities.VirtualWarehouse.fields.credits_per_hour
          - calculations.warehouse_credit_burn
        distinguishing_aspect: "credits_per_hour is a computed field, so a client-supplied value is ignored and the server derives it from the size factor."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp WH", account_locator: "cw2001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cw: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cw}", name: "WH_CW", size: "LARGE", auto_suspend_seconds: 600, auto_resume: true, clusters_min: 1, clusters_max: 1, latency_slo_ms: 1000 }
              as: DataEngineer
          assert:
            - "POST response data.credits_per_hour == 8"
            - "POST response data.status == SUSPENDED"
            - "POST response data.cluster_count == 0"
      - name: warehouse_creation_defaults_auto_suspend_600
        claim_type: Defaults
        grounds:
          - entities.VirtualWarehouse.fields.auto_suspend_seconds
          - entities.VirtualWarehouse.fields.auto_resume
        distinguishing_aspect: "Omitting the optional sizing fields yields the declared defaults rather than null: 600 seconds and auto_resume true."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Defaults", account_locator: "cd2002", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cd2: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cd2}", name: "WH_CD2", size: "XSMALL" }
              as: DataEngineer
          assert:
            - "POST response data.auto_suspend_seconds == 600"
            - "POST response data.auto_resume == true"
            - "POST response data.clusters_min == 1 and data.clusters_max == 1"
            - "POST response data.latency_slo_ms == 1000"
      - name: warehouse_creation_requires_size
        claim_type: Required Fields
        grounds:
          - entities.VirtualWarehouse.fields.size
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "size has no default and is required, so its absence is a 400 rather than a silent XSMALL fallback."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Missing", account_locator: "cm2003", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cm: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cm}", name: "WH_CM" }
              as: DataEngineer
              captures: { err_cm: $.data.error_id }
          assert:
            - "${err_cm} == ERR_INVALID_REQUEST"
            - "GET /v1/warehouses?account_id=${acct_cm} returns total_count 0, so the rejected create left no row"
      - name: warehouse_system_fields_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.VirtualWarehouse.fields.status
          - entities.VirtualWarehouse.fields.credits_per_hour
        distinguishing_aspect: "status and credits_per_hour are server-owned, so a create body that tries to force RUNNING and a 999 credit rate is ignored on both fields."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp System", account_locator: "cs2004", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cs2: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cs2}", name: "WH_CS2", size: "SMALL" }
              as: DataEngineer
          assert:
            - "POST response data.status == SUSPENDED and not RUNNING"
            - "POST response data.credits_per_hour == 2"
            - "POST response data.version == 1"
      - name: warehouse_lookup_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown warehouse id returns 404 with the not-found error rather than an empty object."
        test_recipe:
          setup: ["one account exists but owns no warehouse"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp NotFound", account_locator: "cn2005", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cn: $.data.id }
          trigger:
            - call: "GET /v1/warehouses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DataEngineer
              captures: { err_cn: $.data.error_id }
          assert:
            - "${err_cn} == ERR_RESOURCE_NOT_FOUND"
      - name: warehouse_listing_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - entities.VirtualWarehouse
        distinguishing_aspect: "The list endpoint honours the fixed pagination envelope, so total_count reflects the unpaged match count and has_more flips at the offset boundary."
        test_recipe:
          setup: ["one account with three warehouses"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Page", account_locator: "cp2006", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cp: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cp}", name: "WH_P1", size: "XSMALL" }
              as: DataEngineer
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cp}", name: "WH_P2", size: "SMALL" }
              as: DataEngineer
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cp}", name: "WH_P3", size: "MEDIUM" }
              as: DataEngineer
          trigger:
            - call: "GET /v1/warehouses?account_id=${acct_cp}&limit=2&offset=0"
              payload: {}
              as: PlatformOperator
              captures: { page_total: $.meta.total_count }
          assert:
            - "GET response data has 2 items while total_count == 3"
            - "GET response has_more == true"
            - "with offset=2 the same query returns 1 item and has_more == false"
      - name: drawdown_rejects_warehouse_from_another_account
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_INVALID]
          - entities.CreditDrawdown.fields.warehouse_id
        distinguishing_aspect: "The cross-aggregate warehouse reference is validated against the contract's owning account, so a drawdown cannot bind a contract and a warehouse that belong to different accounts."
        test_recipe:
          setup: ["two accounts, a contract on the first and a warehouse on the second"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp A", account_locator: "ca2007", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ca2: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp B", account_locator: "cb2008", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cb: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cb}", name: "WH_CB", size: "SMALL" }
              as: DataEngineer
              captures: { wh_cb: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_ca2}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_ca: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_ca}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_ca}"
              payload: {}
              as: FinanceController
              captures: { ct_ca_v: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_ca}", warehouse_id: "${wh_cb}", amount_credits: 10, source_kind: "SESSION", idempotency_key: "xacct-1", expected_contract_version: "${ct_ca_v}" }
              as: DataEngineer
          assert:
            - "the create is refused because the warehouse belongs to ${acct_cb} and the contract to ${acct_ca2}, so the owning-account mismatch at priority 4 fires before any allocation"
            - "CapacityContract.${ct_ca}.drawn_credits == 0.0"
      - name: account_creation_rejects_unknown_cloud_provider
        claim_type: Type Constraints
        grounds:
          - entities.Account.fields.cloud_provider
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "cloud_provider is a closed enum, so an unlisted value is a 400 rather than being coerced to a default."
        test_recipe:
          setup: ["no account exists"]
          setup_api_calls:
            - call: "GET /v1/accounts"
              payload: {}
              as: PlatformOperator
          trigger:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Enum", account_locator: "ce2009", cloud_provider: "HYBRID_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
          assert:
            - "the create is refused with ERR_INVALID_REQUEST because HYBRID_CLOUD is not one of SAME_CLOUD or CROSS_CLOUD"
            - "GET /v1/accounts returns total_count 0"
      - name: ledger_entry_is_append_only_with_no_update_route
        claim_type: Immutability
        grounds:
          - entities.AccountLedgerEntry
          - entities.AccountLedgerEntry.fields.bucket
        distinguishing_aspect: "AccountLedgerEntry declares common_fields false and exposes only read routes, so there is no update, patch or delete surface for a posted ledger row."
        test_recipe:
          setup: ["an account with one closed session so at least one ledger row exists"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Append", account_locator: "ca2010", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ap: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_ap}", name: "WH_AP", size: "SMALL", auto_suspend_seconds: 600 }
              as: DataEngineer
              captures: { wh_ap: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_ap}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_ap}" }
              as: DataEngineer
              captures: { ses_ap: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:01:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_ap}"
              payload: {}
              as: DataEngineer
              captures: { wh_ap_v: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_ap}/close"
              payload: { expected_warehouse_version: "${wh_ap_v}" }
              as: DataEngineer
          trigger:
            - call: "GET /v1/accounts/${acct_ap}/ledger-entries"
              payload: {}
              as: FinanceController
              captures: { le_ap_id: "$.data[0].id" }
          assert:
            - "GET returns at least one ledger row with bucket CONSUMPTION and amount_credits 0.033333"
            - "the row exposes id and posted_at but no version field, because common_fields is false for this entity"
            - "no PATCH, PUT or DELETE route exists for /v1/ledger-entries/{id}, so the row cannot be mutated after posting"
      - name: account_retrieval_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Account.fields.account_locator
          - entities.Account.fields.org_name
        distinguishing_aspect: "A stored account reads back with the same org_name, locator and derived posture it was created with, so retrieval is not a projection that drops fields."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Round Trip", account_locator: "cr2011", cloud_provider: "CROSS_CLOUD", region: "eu-central-1", monitor_scope: "INCLUDE_CONSUMERS" }
              as: PlatformOperator
              captures: { acct_rt: $.data.id }
          trigger:
            - call: "GET /v1/accounts/${acct_rt}"
              payload: {}
              as: PlatformOperator
          assert:
            - "GET data.org_name == Corp Round Trip"
            - "GET data.account_locator == cr2011"
            - "GET data.cloud_provider == CROSS_CLOUD and data.region == eu-central-1"
            - "GET data.monitor_scope == INCLUDE_CONSUMERS"
            - "GET data.account_state == OPEN and data.posted_consumption_credits_reconciled == 0.0"
  - section: state_machines
    instances:
      - name: new_warehouse_starts_suspended_with_no_clusters
        claim_type: Initial State
        grounds:
          - state_machines.VirtualWarehouse.initial_state
          - entities.VirtualWarehouse.fields.cluster_count
        distinguishing_aspect: "A freshly created warehouse starts in the declared initial state SUSPENDED with the parallel cluster dimension at 0, not at clusters_min."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Init", account_locator: "ci2012", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ini: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_ini}", name: "WH_INI", size: "MEDIUM", clusters_min: 2, clusters_max: 4 }
              as: DataEngineer
          assert:
            - "POST response data.status == SUSPENDED"
            - "POST response data.cluster_count == 0 and not 2, so the parallel dimension does not follow clusters_min at creation"
            - "the first resume is what sets cluster_count to clusters_min 2"
      - name: closed_contract_rejects_renewal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CapacityContract.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal, so a renewal attempted from it is refused on the state check even though the supplied term window is perfectly valid."
        test_recipe:
          setup: ["one ACTIVE contract on an account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Terminal", account_locator: "ct2013", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_tm: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_tm}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_tm: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_tm}/activate"
              payload: {}
              as: FinanceController
            - call: "POST /v1/capacity-contracts/${ct_tm}/close"
              payload: {}
              as: FinanceController
              as_user_id: "fin-other-7"
          trigger:
            - call: "POST /v1/capacity-contracts/${ct_tm}/renew"
              payload: { new_term_start: "2026-10-01T00:00:00Z", new_term_end: "2026-11-01T00:00:00Z", base_credits: 1000 }
              as: FinanceController
              captures: { err_tm: $.data.error_id }
          assert:
            - "${err_tm} == ERR_INVALID_STATE"
            - "CapacityContract.${ct_tm}.status == CLOSED"
            - "the renewal window itself was valid, so the rejection is caused by the terminal state and not by the dates"
      - name: second_close_of_settled_session_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WarehouseSession.transitions.OPEN_to_CLOSING
          - errors[ERR_SESSION_NOT_OPEN]
        distinguishing_aspect: "CLOSED is the terminal state for a session, so repeating the close trigger is refused with ERR_SESSION_NOT_OPEN rather than being idempotently accepted."
        test_recipe:
          setup: ["one running warehouse with one session already closed"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Double", account_locator: "cd2014", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_dbl: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_dbl}", name: "WH_DBL", size: "SMALL", auto_suspend_seconds: 60 }
              as: DataEngineer
              captures: { wh_dbl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_dbl}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_dbl}" }
              as: DataEngineer
              captures: { ses_dbl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:02:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_dbl}"
              payload: {}
              as: DataEngineer
              captures: { wh_dbl_v1: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_dbl}/close"
              payload: { expected_warehouse_version: "${wh_dbl_v1}" }
              as: DataEngineer
          trigger:
            - call: "GET /v1/warehouses/${wh_dbl}"
              payload: {}
              as: DataEngineer
              captures: { wh_dbl_v2: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_dbl}/close"
              payload: { expected_warehouse_version: "${wh_dbl_v2}" }
              as: DataEngineer
              captures: { err_dbl: $.data.error_id }
          assert:
            - "${err_dbl} == ERR_SESSION_NOT_OPEN"
            - "WarehouseSession.${ses_dbl}.billed_credits is unchanged at 0.033333, so the refused second close posted nothing"
            - "GET /v1/accounts/${acct_dbl}/ledger-entries returns exactly one CONSUMPTION row for this session"
      - name: scaling_a_suspended_warehouse_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - calculations.warehouse_cluster_scaling
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The scaling rule's input set admits only RUNNING and RESIZING warehouses, so the same request against a SUSPENDED warehouse is refused before any cluster arithmetic runs."
        test_recipe:
          setup: ["one SUSPENDED warehouse"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Precond", account_locator: "cp2015", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_pc: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_pc}", name: "WH_PC", size: "LARGE", clusters_min: 1, clusters_max: 4 }
              as: DataEngineer
              captures: { wh_pc: $.data.id }
            - call: "GET /v1/warehouses/${wh_pc}"
              payload: {}
              as: DataEngineer
              captures: { wh_pc_v: $.data.version }
          trigger:
            - call: "POST /v1/warehouses/${wh_pc}/cluster-scaling"
              payload: { clusters: 3, queued_queries: 24, expected_warehouse_version: "${wh_pc_v}" }
              as: DataEngineer
              captures: { err_pc: $.data.error_id }
          assert:
            - "${err_pc} == ERR_INVALID_STATE"
            - "VirtualWarehouse.${wh_pc}.cluster_count == 0"
            - "VirtualWarehouse.${wh_pc}.status == SUSPENDED"
      - name: session_close_posts_exactly_one_consumption_row
        claim_type: Side Effect Execution
        grounds:
          - state_machines.WarehouseSession.transitions.CLOSING_to_CLOSED
          - state_machines.VirtualWarehouse.transitions.RUNNING_to_SUSPENDED
        distinguishing_aspect: "The close side effect writes exactly one CONSUMPTION ledger row carrying the BILLED_FLOOR figure, so the ledger count and the amount both match the transition contract."
        test_recipe:
          setup: ["one running LARGE warehouse with 3 clusters and an open 900-second session"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Side Effect", account_locator: "cs2016", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_se: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_se}", name: "WH_SE", size: "LARGE", auto_suspend_seconds: 60, clusters_min: 1, clusters_max: 4 }
              as: DataEngineer
              captures: { wh_se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_se}/resume"
              payload: {}
              as: DataEngineer
            - call: "GET /v1/warehouses/${wh_se}"
              payload: {}
              as: DataEngineer
              captures: { wh_se_v1: $.data.version }
            - call: "POST /v1/warehouses/${wh_se}/cluster-scaling"
              payload: { clusters: 3, queued_queries: 24, expected_warehouse_version: "${wh_se_v1}" }
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_se}" }
              as: DataEngineer
              captures: { ses_se: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_se}"
              payload: {}
              as: DataEngineer
              captures: { wh_se_v2: $.data.version }
          trigger:
            - call: "POST /v1/warehouse-sessions/${ses_se}/close"
              payload: { expected_warehouse_version: "${wh_se_v2}" }
              as: DataEngineer
          assert:
            - "WarehouseSession.${ses_se}.clusters == 3 and WarehouseSession.${ses_se}.size == LARGE"
            - "WarehouseSession.${ses_se}.billed_credits == 6.000000"
            - "GET /v1/accounts/${acct_se}/ledger-entries returns exactly one row with bucket CONSUMPTION, source_entity WarehouseSession and amount_credits 6.000000"
            - "Account.${acct_se}.posted_consumption_credits_reconciled == 6.0"
      - name: share_republish_preserves_consumer_list
        claim_type: Valid Transition
        grounds:
          - state_machines.DataShare.transitions.SUSPENDED_to_PUBLISHED
        distinguishing_aspect: "The SUSPENDED to PUBLISHED edge is distinct from the DRAFT to PUBLISHED edge and preserves the consumer list taken at suspend time."
        test_recipe:
          setup: ["one provider, one consumer, one published share"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Repub P", account_locator: "cr2017", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rp: $.data.id }
            - call: "POST /v1/accounts"
