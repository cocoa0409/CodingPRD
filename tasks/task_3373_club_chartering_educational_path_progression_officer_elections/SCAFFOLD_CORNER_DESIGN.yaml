  - section: errors
    instances:
      - name: quorum_not_met_on_low_attendance_close
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUORUM_NOT_MET]
          - validations[priority=13]
          - state_machines.MeetingEvent.SCHEDULED_to_HELD
        distinguishing_aspect: "Closing a SCHEDULED meeting as HELD with attendance_count 4 returns ERR_QUORUM_NOT_MET with HTTP 409 and the meeting stays SCHEDULED."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member and a scheduled meeting"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "Ada Lovelace", email: "ada@example.org" } ] }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.memberships[0].id", m_ada_id: "$.data.memberships[0].member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/meetings/${mtg_id}/close"
              payload: { outcome: "HELD", attendance_count: 4, attendee_member_ids: ["${m_ada_id}"] }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { status: "$.data.status", quorum: "$.data.quorum_met" }
          assert:
            - "the close returns ERR_QUORUM_NOT_MET with HTTP 409"
            - "MeetingEvent.${mtg_id}.status stays SCHEDULED and quorum_met stays false"

      - name: dues_already_paid_on_second_renewal
        claim_type: violation_to_error
        grounds:
