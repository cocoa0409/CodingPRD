  # ===================================================================
  # RULE 5 — Priority-pair validation conflicts (distinct category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_temporal_when_scheduling_retread_rejected
        grounds:
          - validations.priority_9_state
          - validations.priority_24_business_temporal
          - errors.ERR_CASING_INVALID_STATE
          - errors.ERR_RETREAD_SLOT_CONFLICT
        distinguishing_aspect: |
          Category pair (state, business_temporal): priority 9 versus priority 24, both 409.
          A single request violates BOTH — the casing is still COLLECTED rather than
          INSPECTED, and the requested slot overlaps an existing booking on the same line.
          The state error must win; the control call proves the temporal violation was live.
        test_recipe:
          setup:
            - "one line already carrying a SCHEDULED job for casing A across 2026-09-01T08:00..12:00Z"
            - "casing B collected but NOT yet inspected"
            - "a DRIVE policy exists and casing B's retread_count is 0, so priorities 15 and 19 cannot fire"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Priority Plant", location_code: "PRP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-1414", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Kestrel Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-8801", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casA_id: $.data.id }
            - call: "POST /casings/${casA_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casA_v: $.data.version }
            - call: "POST /casings/${casA_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casA_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casA_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z" }
              as: PlantScheduler
              captures: { jobA_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-8802", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casB_id: $.data.id }
            - call: "POST /casings/${casB_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casB_v: $.data.version }
          trigger:
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casB_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T09:00:00Z", scheduled_end_at: "2026-09-01T11:00:00Z" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
            - call: "POST /casings/${casB_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casB_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casB_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T09:00:00Z", scheduled_end_at: "2026-09-01T11:00:00Z" }
              as: PlantScheduler
              captures: { err2: $.data.error_id }
          assert:
            - "the first trigger returns 409 with error_id ERR_CASING_INVALID_STATE, NOT ERR_RETREAD_SLOT_CONFLICT"
            - "the third call (identical slot, casing now INSPECTED) returns 409 with error_id ERR_RETREAD_SLOT_CONFLICT, proving the temporal violation was present all along"
            - "RetreadLine.${line_id}.booked_minutes == 270 throughout — neither rejected request booked anything"
            - "no RetreadJob row was created by either rejected request"

