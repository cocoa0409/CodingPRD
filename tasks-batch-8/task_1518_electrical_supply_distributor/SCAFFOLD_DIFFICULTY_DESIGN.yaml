            - "Release.${r_id}.status == CANCELLED"
            - "Contractor.${c_id}.committed_balance_cents == 0 (estimate released)"

      - name: invoice_then_payment_conserves_credit
        grounds:
          - state_machines.Release.DELIVERED_to_INVOICED
          - entities.Contractor.fields.invoiced_balance_cents
        distinguishing_aspect: |
          Conserved quantity = billed cents (different from stock units):
          invoiced_balance_cents + cumulative payments == sum of billed totals
          of INVOICED releases holds both after the invoice (10550 + 0 ==
          10550) and after the compensating payment (0 + 10550 == 10550).
        test_recipe:
          setup:
            - "Contractor limit 1000000; THHN-12CU 200 ft on hand; FIRM job; awarded quote (THHN 200 @ 45.25)"
            - "Release [{THHN, 200}] approved, allocated, scheduled, delivered"
