          setup:
            - "Field F_MINI with one well MINI-1; shipper NORTHLINE with two FIRM contracts CN-1 and CN-2 on that field (max_daily_injection_dth and max_daily_withdrawal_dth both 100000, MSQ 1,000,000)."
