            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_c}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${ac1}", attempted_at: "2026-01-20T04:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${ac2}", attempted_at: "2026-01-20T04:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-01-20T04:00:00Z", idempotency_key: "pa-2507-contrast"}, as: AlarmCompanyOperator, as_user_id: "${company_a}", captures: {err_pair_a_contrast: $.data.error_id}}
          assert:
            - "AlarmSite.${site_a}.response_status == 'RESPONSE_SUSPENDED' before both triggers (order EFFECTIVE and 2026-01-16 <= 2026-01-20 <= 2026-02-15)"
            - "first trigger -> HTTP 409 with error_id == 'ERR_OPEN_DISPATCH_REQUEST_EXISTS' (priority 18 wins; ERR_POLICE_RESPONSE_SUSPENDED must NOT be returned even though priority 26 is also violated)"
            - "second trigger -> HTTP 409 with error_id == 'ERR_POLICE_RESPONSE_SUSPENDED' (sys_c has no open request, so only priority 26 is violated)"
            - "GET /false-alarm-program/dispatch-requests?alarm_system_id=${sys_a} still returns total_count == 1 (the rejected request was not persisted)"
            - "GET /false-alarm-program/dispatch-requests?alarm_system_id=${sys_c} returns total_count == 0"

      - name: pair_b_missing_active_fee_schedule_outranks_the_delinquent_renewal_block
        grounds:
          - "validations[priority=43]"
          - "validations[priority=55]"
          - state_machines.AlarmPermit.GRACE_to_ACTIVE
          - entities.AlarmSite.fields.renewal_block_active
        distinguishing_aspect: >-
          A renewal of a GRACE permit at a site whose outstanding balance is 63000 cents (>= the
          50000-cent block) attempted at a moment when the only ACTIVE FeeSchedule is future-dated must
          return 409 ERR_NO_ACTIVE_FEE_SCHEDULE, not ERR_PERMIT_RENEWAL_BLOCKED; activating a
          schedule effective at the clock and retrying the identical call then surfaces the
          lower-priority 409 ERR_PERMIT_RENEWAL_BLOCKED.
        test_recipe:
          setup:
            - "FeeSchedule S1 (effective_from 2026-01-01) is ACTIVE with permit_issue_fee_cents 60000, permit_term_days 30, renewal_grace_days 10, delinquent_balance_block_cents 50000, invoice_due_days 3650."
            - "One COMMERCIAL AlarmSite with two ACTIVE ECV-callable contacts and one approved system, whose PERMIT_ISSUE_FEE invoice is 60000 + 3000 admin = 63000 cents outstanding, so renewal_block_active is true."
            - "Nightly runs on 2026-01-02 and 2026-02-01 carry the permit ACTIVE -> RENEWAL_DUE (or RENEWAL_BLOCKED) -> GRACE with grace_through_at 2026-02-10, so the permit is still renewable at the trigger clock."
            - "A second schedule S2 with effective_from 2026-06-01 is activated at 2026-02-01, which supersedes S1 and leaves NO schedule active at the logical clock."
