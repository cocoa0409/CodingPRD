      - name: seat_allocation_is_the_many_to_many_junction_between_team_and_neighborhood
        claim_type: graph
        grounds:
          - entities.SeatAllocation
          - endpoints[GET /seat-allocations]
          - validations[priority=64, ERR_TEAM_ALLOCATION_MISMATCH]
        distinguishing_aspect: "SeatAllocation is a true junction: two teams share one neighborhood and one team spans two neighborhoods, and the same list endpoint navigates the edge from either side. The graph is nevertheless closed inside a cycle - a team from cycle B cannot be allocated onto a neighborhood of cycle A."
        test_recipe:
          setup:
            - "Cycle A with teams T-A (12 planned, 3 days -> entitled_seats 10) and T-B (25 planned, 4 days -> expected_daily_attendance ceil(100/5) = 20, base 20, tier 0.12, buffer ceil(2.4) = 3, entitled_seats 23), plus neighborhoods N-1 (seats 40, buffer 4, desks 1..40) and N-2 (seats 40, buffer 4, desks 41..80). A separate cycle B carries team T-Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
