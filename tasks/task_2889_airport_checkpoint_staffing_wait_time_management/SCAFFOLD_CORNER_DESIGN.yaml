              as: StaffingPlanner
              captures: { direct_plan: $.data.staffing_plan_id, direct_lane: $.data.lane_id, direct_off: $.data.officer_id, direct_band: $.data.time_band_id }
          assert:
            - "${by_plan} == ${by_lane} == ${by_officer} == ${by_band} == ${asg1_id} — all four filters find the one row"
            - "${direct_plan} == ${plan_id}, ${direct_lane} == ${lane_id}, ${direct_off} == ${off_id} and ${direct_band} == ${band1_id}"
            - "GET /lane-assignments?assignment_state=CHECKED_IN returns an empty list, so the filters are conjunctive rather than ignored"

      - name: logical_clock_starts_at_the_declared_default_before_any_set
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
        distinguishing_aspect: "The default 2026-08-01T00:00:00Z must come from the logical clock and never from wall-clock time, and every stamped field must read the same clock — so a checkpoint created before any set call carries the default instant, not today's date."
        test_recipe:
