            - *k_clear
            - *k_decide
            - *k_dist
            - *k_ag_std
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${ag_id}", distributor_id: "${dist_id}", quantity: 5, requested_ship_date: "2026-11-01T00:00:00Z", intended_capability: "SLITTING", expected_price_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { shape_err: $.data.error_id }
          assert:
            - "400 error_id == ERR_INVALID_REQUEST (actual ${shape_err})"

      - name: program_close_before_period_end_rejected
        claim_type: "Violation → Error"
        grounds:
          - state_machines.RebateProgram.ACTIVE_to_CLOSED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ACTIVE -> CLOSED requires clock >= period_end: advancing at 2026-12-15 against period_end 2027-01-01 fails ERR_INVALID_STATE; advancing at exactly period_end succeeds."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation; distributor; program ACTIVE with period [2026-10-01, 2027-01-01)."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - call: "POST /stewardship/rebate-programs"
              payload: { formulation_id: "${f_id}", partner_type: "DISTRIBUTOR", distributor_id: "${dist_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", rebate_tiers: [{ threshold_qty: 0, rate_pct: 0.01 }], budget_cap_cents: 1000000 }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/rebate-programs/${prog_id}/advance"
              payload: {}
              as: FinanceController
              as_user_id: "fc-1"
          assert:
            - "at 2026-12-15: 409 ERR_INVALID_STATE (actual ${early_err}); program stays ACTIVE"
            - "at exactly period_end 2027-01-01: advance succeeds, status CLOSED"

      - name: order_create_before_agreement_effective_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=13]
          - errors.ERR_AGREEMENT_NOT_EFFECTIVE
        distinguishing_aspect: "Clock 2026-10-01 vs agreement window starting 2026-11-01 — order creation is 409 ERR_AGREEMENT_NOT_EFFECTIVE; half-open start means a clock at exactly effective_from is admitted."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation; distributor agreement window [2026-11-01, 2027-06-01)."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - *k_dist
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "STANDARD", base_price_cents: 10000, effective_from: "2026-11-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agf_id: $.data.id, agf_v: $.data.version }
          trigger:
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${agf_id}", distributor_id: "${dist_id}", quantity: 5, requested_ship_date: "2026-12-01T00:00:00Z", expected_price_agreement_version: "${agf_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ne_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stewardship/orders"
              payload: { agreement_id: "${agf_id}", distributor_id: "${dist_id}", quantity: 5, requested_ship_date: "2026-12-01T00:00:00Z", expected_price_agreement_version: "${agf_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "before effective_from: 409 ERR_AGREEMENT_NOT_EFFECTIVE (actual ${ne_err}); version not bumped so retry uses the same ${agf_v}"
            - "at exactly effective_from: 201, Order.${ok_id} created"

      - name: duplicate_live_clearance_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=22]
          - errors.ERR_DUPLICATE_CLEARANCE
        distinguishing_aspect: "A second POST /clearances for a (formulation, jurisdiction) pair whose clearance is still SUBMITTED is 409 ERR_DUPLICATE_CLEARANCE — the resubmission upsert only engages from CHANGES_REQUESTED or SUSPENDED."
        test_recipe:
          setup:
            - "Clock 2026-10-01. Formulation with a SUBMITTED DE clearance."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
          trigger:
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "FULL_DISCLOSURE" }
              as: ProductManager
              captures: { dup_err: $.data.error_id }
          assert:
            - "409 error_id == ERR_DUPLICATE_CLEARANCE (actual ${dup_err})"
            - "original JurisdictionClearance.${cl_id}.submission_count stays 1 and status stays SUBMITTED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: Creation
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + api_request_timestamp + response_type object + data; an error has response_type error + data.error_id + data.message."
        test_recipe:
          setup:
            - "Clock 2026-10-01."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /stewardship/formulations"
              payload: { product_code: "F-ENV", name: "Envelope probe", base_polymer_family: "acrylic" }
              as: ProductManager
              captures: { env_f: $.data.id }
            - call: "GET /stewardship/formulations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductManager
              captures: { env_err: $.data.error_id }
          assert:
            - "success: meta.api_request_id and meta.api_request_timestamp present; response_type == object; data.id == ${env_f}"
            - "error: response_type == error; data.error_id == ERR_NOT_FOUND (actual ${env_err}); data.message non-empty"

