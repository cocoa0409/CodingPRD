  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # mode (a) — nested conditional / cap-then-floor composition
      - name: return_discrepancy_nested_cap_then_minimum_fee
        grounds:
          - calculations.return_discrepancy_cost
          - entities.ReturnCondition.fields.discrepancy_cost_cents
          - entities.ReturnCondition.fields.billed_to_lessee_cents
          - entities.LeaseAgreement.fields.return_deposit_applied_cents
          - entities.LeaseAgreement.fields.return_deposit_remaining_cents
          - endpoints[POST /wetlease/return-conditions/{returnId}/inspect]
        distinguishing_aspect: |
          Mode (a): nesting order of min/max/conditional. Raw exposure is 500,750 cents
          (55.50 hours over x 2500 = 138,750; 18 cycles over x 18000 = 324,000; 400 kg short
          x 95 = 38,000) but the liability cap of 400,000 binds FIRST and the 250,000-cent
          minimum fee is applied to the CAPPED figure, so the answer is 400,000. Applying the
          floor before the cap (max then min) also yields 400,000, but applying the cap to a
          raw value already floored at the minimum and then re-capping the sum, or forgetting
          that the deposit waterfall draws from the full 500,000 deposit, produces 500,750
          discrepancy or a non-zero billed_to_lessee_cents. Only the cap-then-floor-then-
          waterfall composition yields 400,000 / 400,000 / 100,000 / 0 simultaneously.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease with return_hours_since_check_max 300.00, return_cycles_since_check_max 120, return_fuel_kg_required 4000, return_liability_cap_cents 400000, return_deposit_cents 500000, redelivery_icao EGSS."
            - "The lease is terminated, which opens a ReturnCondition in PENDING_INSPECTION."
            - "Redelivery readings: hours_since_check_at_return 355.50, cycles_since_check_at_return 138, fuel_on_board_kg 3600, one discrepancy code."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 400000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_id}/decision"
              payload: { determination: "APPROVED" }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_id}", certificate_no: "COI-88001", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
              as: InsuranceUnderwriter
            - call: "POST /wetlease/leases/${lease_id}/activate"
              payload: {}
              as: LessorOpsController
            - call: "POST /wetlease/leases/${lease_id}/terminate"
              payload: { termination_reason: "NOTICE" }
              as: LessorOpsController
              captures: { return_id: $.data.id }
          trigger:
            - call: "POST /wetlease/return-conditions/${return_id}/inspect"
              payload: { hours_since_check_at_return: 355.50, cycles_since_check_at_return: 138, fuel_on_board_kg: 3600, discrepancy_codes: ["AIRFRAME_HOURS_OVER"] }
              as: MaintenanceController
          assert:
            - "response.status == 200"
            - "response.data.discrepancy_cost_cents == 400000"
            - "response.data.billed_to_lessee_cents == 0"
            - "response.data.status == DISCREPANCIES_OPEN"
            - "LeaseAgreement.${lease_id}.return_deposit_applied_cents == 400000"
            - "LeaseAgreement.${lease_id}.return_deposit_remaining_cents == 100000"
            - "LeaseAgreement.${lease_id}.return_deposit_applied_cents + LeaseAgreement.${lease_id}.return_deposit_remaining_cents == 500000"
            - "LeaseAgreement.${lease_id}.status == TERMINATING"

      # mode (b) — rounding / summation order sensitivity
      - name: credited_hours_rounded_per_leg_then_summed
        grounds:
          - calculations.monthly_utilization_charge
          - entities.UtilizationPeriod.fields.credited_block_minutes
          - entities.UtilizationPeriod.fields.credited_hours
          - entities.UtilizationPeriod.fields.overrun_hours
          - entities.UtilizationPeriod.fields.overrun_charge_cents
          - endpoints[POST /wetlease/utilization-periods/{periodId}/close]
        distinguishing_aspect: |
          Mode (b): rounding order. Three COMPLETED 100-minute REVENUE legs give
          100/60 = 1.6666... hours each, rounded to 4 dp per leg = 1.6667, summed = 5.0001,
          which is 0.0001 hours ABOVE the 5.0000-hour guarantee and therefore produces a
          48-cent tier-1 overrun charge on top of the 2,400,000-cent base. Summing minutes
          first (300 / 60 = 5.0000) yields exactly the guarantee, zero overrun and 2,400,000.
          The 48-cent difference and the non-zero overrun_hours can only both appear if each
          leg is rounded to 4 dp before summation.
        test_recipe:
          setup:
