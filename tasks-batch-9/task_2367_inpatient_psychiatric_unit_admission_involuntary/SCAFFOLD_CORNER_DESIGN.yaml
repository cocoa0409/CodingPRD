              payload: { mrn: "MRN-2367-SH1", legal_name: "Registered By Officer", age_years: 33, gender_care_category: "MALE" }
              as: ComplianceOfficer
              captures: { p_sh1: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-SH2", legal_name: "Registered By Clinician", age_years: 34, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_sh2: $.data.id }
            - call: "PATCH /behavioral-health/beds/${b_sh}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "GET /behavioral-health/units/${u_sh}"
              payload: {}
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
            - call: "PATCH /behavioral-health/beds/${b_sh}"
              payload: { status: "AVAILABLE" }
              as: ComplianceOfficer
            - call: "GET /behavioral-health/units/${u_sh}/beds"
              payload: {}
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
          assert:
            - "both patient registrations are HTTP 201 with distinct ids ${p_sh1} and ${p_sh2}: the shared operation is identical for ComplianceOfficer, which carries no X-User-ID, and for the entity_backed IntakeClinician"
            - "the ChargeNurse PATCH is HTTP 200 and the advocate's read then shows Unit.${u_sh} with licensed_placement_bed_count 0, raw_available_bed_count 0, posture \"CLOSED\" and effective_available_bed_count 0 - OUT_OF_SERVICE beds leave the licensed pool"
            - "the ComplianceOfficer PATCH back to AVAILABLE is HTTP 200 and re-derives licensed_placement_bed_count 1, raw_available_bed_count 1, posture \"RESTRICTED\" (raw 1 <= max(1, floor(1 * 0.20)) == 1) and effective_available_bed_count 0 (one bed reserved)"
            - "Unit.${u_sh}.version increased by exactly 2 across the two PATCH calls - the increment is a property of the endpoint, not of the acting role"
            - "the advocate's two GET calls are HTTP 200 despite PatientRightsAdvocate.exclusive_operations being empty, and the bed listing returns total_count 1 with has_more false"

