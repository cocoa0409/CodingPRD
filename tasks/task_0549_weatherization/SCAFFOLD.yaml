# =============================================================================
# PRD Benchmark Seed Tables — Insulation, Weatherization & Energy Audit
# =============================================================================

scenario: |
  549. Insulation, Weatherization & Energy Audit: blower-door & energy audit, scope (attic/wall/crawl) & R-value, utility rebate & 25C tax credit, material & crew scheduling, air-sealing & duct, low-income weatherization (WAP) eligibility, post-test verification, financing

domain_name: weatherization
api_prefix: /weatherization

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities under one namespace prefix, linked by FK fields in bodies,
  # discovered via filtered-list GETs (no parent nesting in URL paths).
  state_machine_shape: parallel
  # Job carries two independent status dimensions (install_status x verification_status)
  # that evolve via different triggers; EnergyAudit is cyclic (REJECTED -> SUBMITTED).
  relationship_patterns:
    - one_to_many          # Job -> {EnergyAudit, ScopeItem, DiagnosticTest, RebateClaim, ...}
    - self_referential     # DiagnosticTest.baseline_test_id -> DiagnosticTest.id
    - cross_aggregate      # RebateClaim references ScopeItem; verify reaches across Job/DiagnosticTest/ScopeItem/RebateClaim
  role_model: segregation_of_duties
  # The auditor who recorded a Job's BASELINE blower-door test may not perform that
  # Job's post-test verification (independent QA).
  consistency_model: immediate

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dwelling
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: address, type: string, source: input, description: "Street address of the home" }
      - { name: year_built, type: integer, source: input, description: "Year the dwelling was constructed" }
      - { name: conditioned_area_sqft, type: number, source: input, description: "Conditioned floor area in square feet" }
      - { name: foundation_type, type: enum, source: input, description: "SLAB | CRAWLSPACE | BASEMENT", constraints: "one of SLAB, CRAWLSPACE, BASEMENT" }
      - { name: heating_fuel_type, type: enum, source: input, description: "GAS | ELECTRIC | OIL | PROPANE", constraints: "one of GAS, ELECTRIC, OIL, PROPANE" }

  - name: WapApplication
    parent: null
    common_fields: true
    fields:
      - { name: dwelling_id, type: string, source: input, description: "FK -> Dwelling.id; the dwelling whose household applies for WAP" }
      - { name: household_size, type: integer, source: input, description: "Number of people in the household", constraints: ">= 1" }
      - { name: annual_gross_income_cents, type: integer, source: input, description: "Household annual gross income in cents", constraints: ">= 0" }
      - { name: income_limit_cents, type: integer, source: computed, description: "200% FPL limit for household_size (see wap_income_eligibility)" }
      - { name: status, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE — set at creation by wap_income_eligibility", constraints: "one of ELIGIBLE, INELIGIBLE" }

  - name: Job
    parent: null
    common_fields: true      # version here is the OCC parent version for financing-plan creation
    fields:
      - { name: dwelling_id, type: string, source: input, description: "FK -> Dwelling.id; the home this weatherization job is for" }
      - { name: program_track, type: enum, source: input, description: "WAP | UTILITY | MARKET — funding track; WAP requires an ELIGIBLE WapApplication", constraints: "one of WAP, UTILITY, MARKET" }
      - { name: rebate_budget_cap_cents, type: integer, source: input, description: "Maximum total APPROVED utility rebate the job may accrue (cents)", constraints: ">= 0" }
      - { name: job_status, type: enum, source: system, description: "ACTIVE | COMPLETED | CANCELLED — overall lifecycle; initial ACTIVE", default: "ACTIVE", constraints: "one of ACTIVE, COMPLETED, CANCELLED" }
      - { name: install_status, type: enum, source: system, description: "PLANNED | SCHEDULED | INSTALLED — install dimension; initial PLANNED (parallel to verification_status)", default: "PLANNED", constraints: "one of PLANNED, SCHEDULED, INSTALLED" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | PASSED | FAILED — post-test dimension; initial PENDING (parallel to install_status)", default: "PENDING", constraints: "one of PENDING, PASSED, FAILED" }
      - { name: total_estimated_cost_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents over ScopeItems in {APPROVED, INSTALLED, VERIFIED} (job_financial_rollup)" }
      - { name: approved_rebate_total_cents, type: integer, source: computed, description: "Sum of finalized_amount_cents over RebateClaims in status APPROVED (rebate_budget_ledger)" }
      - { name: tax_credit_cents, type: integer, source: computed, description: "25C federal credit over qualifying INSTALLED ScopeItems (tax_credit_25c)" }
      - { name: estimated_out_of_pocket_cents, type: integer, source: computed, description: "max(0, total_estimated_cost_cents - approved_rebate_total_cents - tax_credit_cents)" }
      - { name: estimated_annual_savings_kwh, type: number, source: computed, description: "Audit-model savings = sum of ScopeItem.estimated_savings_kwh in {APPROVED, INSTALLED, VERIFIED} (annual_energy_savings ESTIMATED variant)" }
      - { name: verified_annual_savings_kwh, type: number, source: computed, description: "Measurement savings from blower-door CFM50 reduction; null until verify (annual_energy_savings VERIFIED variant)" }

  - name: EnergyAudit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job being audited" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the Auditor who created the audit (opaque)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED; initial DRAFT (REJECTED is re-submittable -> cycle)", default: "DRAFT", constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED" }
      - { name: estimated_annual_savings_kwh, type: number, source: computed, description: "Sum of estimated_savings_kwh over the job's non-rejected ScopeItems, computed at submit" }

  - name: DiagnosticTest
    parent: null
    common_fields: false     # immutable append-only measurement event: id + created_at only
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job this test was run on" }
      - { name: kind, type: enum, source: input, description: "BLOWER_DOOR | DUCT_LEAKAGE", constraints: "one of BLOWER_DOOR, DUCT_LEAKAGE" }
      - { name: stage, type: enum, source: input, description: "BASELINE | POST", constraints: "one of BASELINE, POST" }
      - { name: cfm_measured, type: number, source: input, description: "Measured airflow: CFM50 for BLOWER_DOOR, CFM25 for DUCT_LEAKAGE", constraints: "> 0" }
      - { name: baseline_test_id, type: string, source: input, description: "FK -> DiagnosticTest.id; required when stage=POST — the BASELINE test of the same job and kind", default: null }
      - { name: tester_user_id, type: string, source: system, description: "X-User-ID of the Auditor who recorded this test (opaque; drives SOD on verification)" }

  - name: ScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job this measure belongs to" }
      - { name: audit_id, type: string, source: input, description: "FK -> EnergyAudit.id; the audit that recommended this measure" }
      - { name: category, type: enum, source: input, description: "ATTIC_INSULATION | WALL_INSULATION | CRAWL_INSULATION | AIR_SEALING | DUCT_SEALING", constraints: "one of ATTIC_INSULATION, WALL_INSULATION, CRAWL_INSULATION, AIR_SEALING, DUCT_SEALING" }
      - { name: area_sqft, type: number, source: input, description: "Treated area in square feet", constraints: "> 0" }
      - { name: target_r_value, type: number, source: input, description: "Target insulation R-value (drives PROVISIONAL rebate tier)", constraints: ">= 0" }
      - { name: achieved_r_value, type: number, source: input, description: "Installed R-value recorded at mark-installed (drives FINALIZED rebate tier); null until installed", default: null }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated installed cost in cents", constraints: ">= 0" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual installed cost recorded at mark-installed (drives 25C credit); null until installed", default: null }
      - { name: estimated_savings_kwh, type: number, source: input, description: "Auditor's estimated annual kWh savings for this measure", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | INSTALLED | VERIFIED | FAILED_VERIFICATION | CANCELLED; initial PROPOSED", default: "PROPOSED", constraints: "one of PROPOSED, APPROVED, REJECTED, INSTALLED, VERIFIED, FAILED_VERIFICATION, CANCELLED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: crew_size, type: integer, source: input, description: "Number of installers on the crew", constraints: ">= 1" }
      - { name: skills, type: array, source: input, description: "Categories this crew can install (subset of ScopeItem.category values)" }
      - { name: capacity_days, type: integer, source: input, description: "Maximum committed crew-days the crew may hold across active assignments", constraints: ">= 0" }
      - { name: committed_days, type: integer, source: computed, description: "Sum of duration_days over CrewAssignments with status SCHEDULED for this crew (crew_capacity_ledger)" }
      - { name: available_days, type: integer, source: computed, description: "capacity_days - committed_days" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job to install" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the crew scheduled" }
      - { name: scheduled_start_date, type: datetime, source: input, description: "Install window start (ISO 8601 date-time, UTC); window is half-open [start, end)" }
      - { name: scheduled_end_date, type: datetime, source: input, description: "Install window end (ISO 8601 date-time, UTC); must be strictly after start" }
      - { name: duration_days, type: integer, source: computed, description: "Whole days between start and end (end - start), used for crew-day accounting" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED; initial SCHEDULED", default: "SCHEDULED", constraints: "one of SCHEDULED, CANCELLED" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job the rebate is claimed under" }
      - { name: scope_item_id, type: string, source: input, description: "FK -> ScopeItem.id; the installed measure being claimed" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Rebate estimated at claim creation from target_r_value/area (rebate_amount PROVISIONAL)" }
      - { name: finalized_amount_cents, type: integer, source: computed, description: "Rebate recomputed at submit from achieved_r_value/area (rebate_amount FINALIZED); null until submitted" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | VOIDED; initial DRAFT", default: "DRAFT", constraints: "one of DRAFT, SUBMITTED, APPROVED, DENIED, VOIDED" }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job whose out-of-pocket is financed" }
      - { name: principal_cents, type: integer, source: input, description: "Financed principal in cents", constraints: "> 0" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months", constraints: ">= 1" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points (e.g., 600 = 6.00%)", constraints: ">= 0" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortized monthly payment (financing_amortization)" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | SUPERSEDED; initial OFFERED", default: "OFFERED", constraints: "one of OFFERED, ACCEPTED, DECLINED, SUPERSEDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Job: PARALLEL dimensions (install_status x verification_status) + job_status lifecycle
  - entity: Job
    note: |
      Job carries three status fields. install_status and verification_status are PARALLEL,
      independent dimensions advanced by different triggers. job_status is the overall lifecycle
      and auto-completes when both dimensions terminate favorably.
    initial_state: "job_status=ACTIVE, install_status=PLANNED, verification_status=PENDING"
    terminal_states: ["job_status=COMPLETED", "job_status=CANCELLED"]
    transitions:
      - from: "install_status=PLANNED"
        to: "install_status=SCHEDULED"
        trigger: "POST /weatherization/crew-assignments (side effect of the first SCHEDULED CrewAssignment for the job)"
        actor: ProgramAdmin
        preconditions: ["Job.job_status == ACTIVE"]
        side_effects: ["Job.install_status = SCHEDULED"]

      - from: "install_status=SCHEDULED"
        to: "install_status=INSTALLED"
        trigger: "POST /weatherization/jobs/{job_id}/complete-install"
        actor: ProgramAdmin
        preconditions:
          - "Job.job_status == ACTIVE"
          - "Job.install_status == SCHEDULED (ERR_INVALID_STATE)"
          - "No ScopeItem with status == APPROVED remains not-yet-INSTALLED (ERR_SCOPE_INCOMPLETE)"
        side_effects:
          - "Job.install_status = INSTALLED"
          - "recompute job_financial_rollup"

      - from: "verification_status=PENDING"
        to: "verification_status=PASSED"
        trigger: "POST /weatherization/jobs/{job_id}/verify (blower-door reduction >= MIN_REDUCTION_PCT)"
        actor: Auditor
        preconditions:
          - "Job.install_status == INSTALLED (ERR_INVALID_STATE)"
          - "acting Auditor X-User-ID != baseline BLOWER_DOOR test tester_user_id (ERR_SOD_VIOLATION)"
          - "count of ScopeItems in status INSTALLED for the job >= 1 (ERR_SCOPE_INCOMPLETE)"
          - "post_test_id is a POST-stage BLOWER_DOOR test whose baseline_test_id resolves to a BASELINE test of this job"
          - "cfm50_reduction(baseline, post) >= 0.20"
        side_effects:
          - "Job.verification_status = PASSED"
          - "compute Job.verified_annual_savings_kwh (annual_energy_savings VERIFIED)"
          - "every ScopeItem in status INSTALLED for the job -> VERIFIED"
          - "if Job.install_status == INSTALLED then job_status ACTIVE -> COMPLETED (bubble-up)"

      - from: "verification_status=PENDING"
        to: "verification_status=FAILED"
        trigger: "POST /weatherization/jobs/{job_id}/verify (blower-door reduction < MIN_REDUCTION_PCT)"
        actor: Auditor
        preconditions:
          - "Job.install_status == INSTALLED (ERR_INVALID_STATE)"
          - "acting Auditor X-User-ID != baseline BLOWER_DOOR test tester_user_id (ERR_SOD_VIOLATION)"
          - "count of ScopeItems in status INSTALLED for the job >= 1 (ERR_SCOPE_INCOMPLETE)"
          - "cfm50_reduction(baseline, post) < 0.20"
        side_effects:
          - "Job.verification_status = FAILED"
          - "CASCADE (depth 3): every ScopeItem in status INSTALLED -> FAILED_VERIFICATION (link 1)"
          - "  -> each such ScopeItem's RebateClaim in status APPROVED -> VOIDED (link 2, caused by the ScopeItem failing)"
          - "  -> each VOIDED RebateClaim decrements Job.approved_rebate_total_cents and recomputes estimated_out_of_pocket_cents (link 3, caused by the rebate voiding)"

      - from: "job_status=ACTIVE"
        to: "job_status=CANCELLED"
        trigger: "POST /weatherization/jobs/{job_id}/cancel"
        actor: ProgramAdmin
        preconditions: ["Job.job_status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "Job.job_status = CANCELLED"
          - "CASCADE (depth 2-3): every ScopeItem in {PROPOSED, APPROVED, INSTALLED} -> CANCELLED (link 1)"
          - "  -> each cancelled ScopeItem's RebateClaim in status APPROVED -> VOIDED -> decrement Job.approved_rebate_total_cents (link 2)"
          - "every CrewAssignment in status SCHEDULED for the job -> CANCELLED -> release Crew.committed_days (fan-out, not part of the ScopeItem->RebateClaim chain)"
          - "recompute job_financial_rollup"

      - from: "job_status=ACTIVE"
        to: "job_status=COMPLETED"
        trigger: "system (auto) on verify PASS"
        actor: system
        preconditions: ["Job.install_status == INSTALLED", "Job.verification_status == PASSED"]
        side_effects: ["Job.job_status = COMPLETED"]

  # ---- EnergyAudit: CYCLIC (REJECTED -> SUBMITTED revision loop)
  - entity: EnergyAudit
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /weatherization/audits/{audit_id}/submit"
        actor: Auditor
        preconditions: ["EnergyAudit.status == DRAFT (ERR_INVALID_STATE)"]
        side_effects: ["compute EnergyAudit.estimated_annual_savings_kwh = sum of non-rejected ScopeItem.estimated_savings_kwh"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /weatherization/audits/{audit_id}/submit"
        actor: Auditor
        preconditions: ["EnergyAudit.status == REJECTED (ERR_INVALID_STATE)"]
        side_effects: ["recompute EnergyAudit.estimated_annual_savings_kwh"]
        note: "Revision loop — closes the cycle SUBMITTED -> REJECTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /weatherization/audits/{audit_id}/decide (decision=APPROVE)"
        actor: ProgramAdmin
        preconditions: ["EnergyAudit.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /weatherization/audits/{audit_id}/decide (decision=REJECT)"
        actor: ProgramAdmin
        preconditions: ["EnergyAudit.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []

  # ---- ScopeItem: BRANCHING (approve/reject fork; verify pass/fail fork)
  - entity: ScopeItem
    initial_state: PROPOSED
    terminal_states: [REJECTED, VERIFIED, FAILED_VERIFICATION, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /weatherization/scope-items/{scope_item_id}/decide (decision=APPROVE)"
        actor: ProgramAdmin
        preconditions:
          - "ScopeItem.status == PROPOSED (ERR_INVALID_STATE)"
          - "the referenced EnergyAudit (audit_id) is in status APPROVED (ERR_AUDIT_NOT_APPROVED) [cross-entity: ScopeItem -> EnergyAudit]"
        side_effects: ["recompute Job.total_estimated_cost_cents and estimated_out_of_pocket_cents"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /weatherization/scope-items/{scope_item_id}/decide (decision=REJECT)"
        actor: ProgramAdmin
        preconditions: ["ScopeItem.status == PROPOSED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: INSTALLED
        trigger: "POST /weatherization/scope-items/{scope_item_id}/mark-installed"
        actor: Installer
        preconditions:
          - "ScopeItem.status == APPROVED (ERR_INVALID_STATE)"
          - "the referenced Job (job_id) has install_status == SCHEDULED (ERR_INVALID_STATE) [cross-entity: ScopeItem -> Job]"
        side_effects:
          - "set ScopeItem.achieved_r_value and actual_cost_cents from the request"
          - "recompute Job.tax_credit_cents (tax_credit_25c) and job_financial_rollup"
      - from: INSTALLED
        to: VERIFIED
        trigger: "system on Job verify PASS"
        actor: system
        preconditions: ["parent Job verify transition PASSED"]
        side_effects: []
      - from: INSTALLED
        to: FAILED_VERIFICATION
        trigger: "system on Job verify FAIL (cascade link 1)"
        actor: system
        preconditions: ["parent Job verify transition FAILED"]
        side_effects: ["-> this ScopeItem's RebateClaim in status APPROVED -> VOIDED (cascade link 2)"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "system on Job cancel (cascade link 1)"
        actor: system
        preconditions: ["parent Job job_status -> CANCELLED"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "system on Job cancel (cascade link 1)"
        actor: system
        preconditions: ["parent Job job_status -> CANCELLED"]
        side_effects: ["release from Job.total_estimated_cost_cents on recompute"]
      - from: INSTALLED
        to: CANCELLED
        trigger: "system on Job cancel (cascade link 1)"
        actor: system
        preconditions: ["parent Job job_status -> CANCELLED"]
        side_effects: ["-> this ScopeItem's RebateClaim in status APPROVED -> VOIDED (cascade link 2)"]

  # ---- RebateClaim: BRANCHING (approve/deny fork; void compensation)
  - entity: RebateClaim
    initial_state: DRAFT
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /weatherization/rebate-claims/{rebate_claim_id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "RebateClaim.status == DRAFT (ERR_INVALID_STATE)"
          - "the referenced ScopeItem (scope_item_id) is in status INSTALLED or VERIFIED (ERR_SCOPE_NOT_INSTALLED) [cross-entity: RebateClaim -> ScopeItem]"
        side_effects: ["compute RebateClaim.finalized_amount_cents (rebate_amount FINALIZED, from achieved_r_value/area)"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /weatherization/rebate-claims/{rebate_claim_id}/decide (decision=APPROVE)"
        actor: ProgramAdmin
        preconditions:
          - "RebateClaim.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Job.approved_rebate_total_cents + finalized_amount_cents <= Job.rebate_budget_cap_cents (ERR_REBATE_BUDGET_EXCEEDED)"
        side_effects:
          - "Job.approved_rebate_total_cents += finalized_amount_cents (compensating-invariant: rebate money)"
          - "recompute Job.estimated_out_of_pocket_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /weatherization/rebate-claims/{rebate_claim_id}/decide (decision=DENY)"
        actor: ProgramAdmin
        preconditions: ["RebateClaim.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /weatherization/rebate-claims/{rebate_claim_id}/void  OR  system cascade (Job verify FAIL / Job cancel)"
        actor: ProgramAdmin | system
        preconditions: ["RebateClaim.status == APPROVED (ERR_INVALID_STATE)"]
        side_effects:
          - "Job.approved_rebate_total_cents -= finalized_amount_cents (compensating-invariant: rebate money returns to pre-approval value)"
          - "recompute Job.estimated_out_of_pocket_cents"

  # ---- FinancingPlan: BRANCHING with supersede (OCC parent = Job)
  - entity: FinancingPlan
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /weatherization/financing-plans/{financing_plan_id}/respond (decision=ACCEPT)"
        actor: Homeowner
        preconditions: ["FinancingPlan.status == OFFERED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /weatherization/financing-plans/{financing_plan_id}/respond (decision=DECLINE)"
        actor: Homeowner
        preconditions: ["FinancingPlan.status == OFFERED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system on POST /weatherization/financing-plans creating a newer plan for the same job"
        actor: system
        preconditions: ["FinancingPlan.status == OFFERED"]
        side_effects: []
        note: "A newer OFFERED plan supersedes the prior one; this is the create-with-supersede that makes the OCC race real."

  # ---- CrewAssignment: forward reserve / compensating release
  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: "(new)"
        to: SCHEDULED
        trigger: "POST /weatherization/crew-assignments"
        actor: ProgramAdmin
        preconditions:
          - "scheduled_end_date > scheduled_start_date (ERR_INVALID_DATE_WINDOW)"
          - "no SCHEDULED CrewAssignment for the same crew overlaps [start, end) (ERR_CREW_DOUBLE_BOOKED)"
          - "no SCHEDULED CrewAssignment for another job at the same dwelling is within BUFFER_DAYS (2 days) of [start, end) — i.e. the day-gap between the two windows is < 2 (ERR_DWELLING_WINDOW_CONFLICT)"
          - "Crew.committed_days + duration_days <= Crew.capacity_days (ERR_CREW_CAPACITY_EXCEEDED)"
        side_effects:
          - "compute duration_days; Crew.committed_days += duration_days (compensating-invariant: crew-days)"
          - "if Job.install_status == PLANNED then Job.install_status = SCHEDULED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /weatherization/crew-assignments/{crew_assignment_id}/cancel  OR  system cascade (Job cancel)"
        actor: ProgramAdmin | system
        preconditions: ["CrewAssignment.status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["Crew.committed_days -= duration_days (compensating-invariant: crew-days returns to pre-assignment value)"]

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only — passes the serial-observability filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: financing-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /weatherization/financing-plans"
    occ_field: "expected_job_version"
    description: |
      Creating a FinancingPlan against a Job whose version has advanced since the client
      last observed it is rejected. A newly created OFFERED plan legitimately supersedes the
      prior OFFERED plan (state_machines.FinancingPlan OFFERED -> SUPERSEDED) and increments
      Job.version; a second create still carrying the pre-supersede job version is therefore
      operating on a stale view and is rejected. Both requests are strictly sequential: the
      loser observes the version the winner already advanced.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annual_energy_savings
    trigger: "EnergyAudit submit (ESTIMATED); Job verify (VERIFIED)"
    algorithm: forward_looking
    formula: |
      ESTIMATED = sum( ScopeItem.estimated_savings_kwh
                       for ScopeItem in job where status in {APPROVED, INSTALLED, VERIFIED} )
      VERIFIED  = (baseline_cfm50 - post_cfm50) * SAVINGS_PER_CFM50_KWH
                  where baseline_cfm50 / post_cfm50 are the BLOWER_DOOR BASELINE / POST cfm_measured
    input_set: "ESTIMATED includes only non-rejected/approved-or-later ScopeItems; VERIFIED uses the two referenced blower-door tests"
    constants:
      SAVINGS_PER_CFM50_KWH: 1.5
    precision: "kWh, 1 decimal place, round_half_up"
    variants:
      - name: ESTIMATED
        when: "audit-model projection (submit / job read before verify)"
        difference: "sum of per-measure estimated_savings_kwh — a bottom-up projection"
      - name: VERIFIED
        when: "post-test verification"
        difference: "derived top-down from measured whole-house CFM50 reduction; typically differs from ESTIMATED"

  - name: rebate_amount
    trigger: "RebateClaim create (PROVISIONAL); RebateClaim submit (FINALIZED)"
    algorithm: tiered_pricing
    formula: |
      tier(R)      = TIER1 if R < 30 ; TIER2 if 30 <= R < 49 ; TIER3 if R >= 49
      rate         = RATE_TABLE[category][tier(R)]        # insulation categories, cents/sqft
                     RATE_TABLE[category]["FLAT"]         # AIR_SEALING / DUCT_SEALING (no tier)
      raw          = rate * area_sqft
      rebate       = min( raw, MEASURE_CAP_CENTS )
      # PROVISIONAL uses target_r_value; FINALIZED uses achieved_r_value; area_sqft is shared.
    input_set: "one ScopeItem's category, area_sqft, and R-value (target vs achieved by variant)"
    constants:
      RATE_TABLE:
        ATTIC_INSULATION: { TIER1: 50, TIER2: 90, TIER3: 130 }
        WALL_INSULATION:  { TIER1: 40, TIER2: 70, TIER3: 100 }
        CRAWL_INSULATION: { TIER1: 30, TIER2: 55, TIER3: 80 }
        AIR_SEALING:      { FLAT: 25 }
        DUCT_SEALING:     { FLAT: 20 }
      MEASURE_CAP_CENTS: 200000
    precision: "integer cents (rate is whole cents/sqft, area may be fractional -> round_half_up to whole cents)"
    variants:
      - name: PROVISIONAL
        when: "claim creation"
        difference: "tier from target_r_value"
      - name: FINALIZED
        when: "claim submit (post-install)"
        difference: "tier from achieved_r_value — diverges from PROVISIONAL whenever the installed R-value falls in a different tier"

  - name: tax_credit_25c
    trigger: "ScopeItem mark-installed (recompute Job.tax_credit_cents); Job complete-install"
    algorithm: aggregation
    formula: |
      qualifying = ScopeItems for the job with status in {INSTALLED, VERIFIED}
                   and category in {ATTIC_INSULATION, WALL_INSULATION, CRAWL_INSULATION, AIR_SEALING}
      per line:  line_cents = round_half_up( CREDIT_RATE * actual_cost_cents / 100 ) * 100   # round to whole dollars
      ORDER (pinned): round EACH line to whole dollars FIRST, THEN sum, THEN cap.
      tax_credit_cents = min( sum(line_cents for qualifying), ANNUAL_CAP_CENTS )
    input_set: "INSTALLED/VERIFIED qualifying ScopeItems only; DUCT_SEALING is excluded"
    constants:
      CREDIT_RATE: 0.30
      ANNUAL_CAP_CENTS: 120000
    precision: "per-line rounded to whole dollars (100-cent multiples), round_half_up; sum then cap"

  - name: wap_income_eligibility
    trigger: "WapApplication create"
    algorithm: threshold
    formula: |
      income_limit_cents = FPL_MULTIPLIER * ( FPL_SIZE1_CENTS + (household_size - 1) * FPL_PER_PERSON_CENTS )
      status = ELIGIBLE if annual_gross_income_cents <= income_limit_cents else INELIGIBLE
    input_set: "one WapApplication's household_size and annual_gross_income_cents"
    constants:
      FPL_MULTIPLIER: 2
      FPL_SIZE1_CENTS: 1500000
      FPL_PER_PERSON_CENTS: 500000
    precision: "integer cents; boundary is inclusive (<=)"

  - name: cfm50_reduction
    trigger: "Job verify"
    algorithm: threshold
    formula: |
      reduction_pct = (baseline_cfm50 - post_cfm50) / baseline_cfm50
      PASS if reduction_pct >= MIN_REDUCTION_PCT else FAIL
    input_set: "the job's BLOWER_DOOR BASELINE cfm_measured and the referenced POST cfm_measured"
    constants:
      MIN_REDUCTION_PCT: 0.20
    precision: "ratio compared at full float precision; boundary is inclusive (>=)"

  - name: crew_capacity_ledger
    trigger: "CrewAssignment create (reserve); CrewAssignment cancel (release)"
    algorithm: aggregation
    formula: |
      duration_days(a)   = whole days (scheduled_end_date - scheduled_start_date)
      committed_days(c)  = sum( duration_days(a) for a in CrewAssignments where a.crew_id == c.id and a.status == SCHEDULED )
      available_days(c)  = capacity_days - committed_days(c)
    input_set: "CrewAssignments in status SCHEDULED for the crew"
    constants: {}
    precision: "integer days"

  - name: rebate_budget_ledger
    trigger: "RebateClaim approve (add); RebateClaim void (subtract)"
    algorithm: aggregation
    formula: |
      approved_rebate_total_cents(job) = sum( finalized_amount_cents
                                              for RebateClaim where job_id == job.id and status == APPROVED )
      rebate_budget_remaining(job)     = rebate_budget_cap_cents - approved_rebate_total_cents(job)
    input_set: "RebateClaims in status APPROVED for the job"
    constants: {}
    precision: "integer cents"

  - name: job_financial_rollup
    trigger: "ScopeItem approve/mark-installed/cancel; RebateClaim approve/void; Job complete-install; verify FAIL cascade"
    algorithm: aggregation
    formula: |
      total_estimated_cost_cents    = sum( estimated_cost_cents for ScopeItem in {APPROVED, INSTALLED, VERIFIED} )
      tax_credit_cents              = tax_credit_25c(job)
      estimated_out_of_pocket_cents = max( 0, total_estimated_cost_cents
                                              - approved_rebate_total_cents - tax_credit_cents )
    input_set: "the job's ScopeItems (by status) and APPROVED RebateClaims"
    constants: {}
    precision: "integer cents; out-of-pocket floored at 0"

  - name: financing_amortization
    trigger: "FinancingPlan create"
    algorithm: aggregation
    formula: |
      monthly_rate          = apr_bps / 10000 / 12
      if monthly_rate == 0: monthly_payment_cents = round_half_up( principal_cents / term_months )
      else:                 monthly_payment_cents = round_half_up(
                                principal_cents * monthly_rate / (1 - (1 + monthly_rate) ** (-term_months)) )
    input_set: "one FinancingPlan's principal_cents, apr_bps, term_months"
    constants: {}
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on conflict)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every id in the path resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Every FK in the request body (dwelling_id, job_id, crew_id, audit_id, scope_item_id, baseline_test_id, post_test_id) resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints and verify"

  - priority: 6
    category: business_temporal
    check: "scheduled_end_date is strictly after scheduled_start_date"
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 422
    applies_to: "POST /weatherization/crew-assignments"

  - priority: 7
    category: state
    check: "Target resource is in the required state for the transition (state-machine from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state precondition holds: scope approve requires audit APPROVED (ERR_AUDIT_NOT_APPROVED); rebate submit requires scope INSTALLED/VERIFIED (ERR_SCOPE_NOT_INSTALLED); WAP-track job requires an ELIGIBLE WapApplication for the dwelling (ERR_NOT_WAP_ELIGIBLE); POST-stage diagnostic requires a matching BASELINE test (ERR_BASELINE_TEST_REQUIRED)"
    error_id: "varies: ERR_AUDIT_NOT_APPROVED | ERR_SCOPE_NOT_INSTALLED | ERR_NOT_WAP_ELIGIBLE | ERR_BASELINE_TEST_REQUIRED"
    http_status: 409
    applies_to: "scope decide, rebate submit, job create, diagnostic create"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: on verify, the acting Auditor's X-User-ID must not equal the baseline BLOWER_DOOR test's tester_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /weatherization/jobs/{job_id}/verify"

  - priority: 10
    category: business_constraint
    check: "Structural constraints: verify requires >= 1 INSTALLED ScopeItem and complete-install requires no APPROVED-but-uninstalled ScopeItem (ERR_SCOPE_INCOMPLETE); crew window may not overlap another SCHEDULED assignment of the same crew (ERR_CREW_DOUBLE_BOOKED); crew window may not fall within BUFFER_DAYS (2 days) of another job's SCHEDULED assignment at the same dwelling — day-gap < 2 (ERR_DWELLING_WINDOW_CONFLICT); crew capacity may not be exceeded (ERR_CREW_CAPACITY_EXCEEDED)"
    error_id: "varies: ERR_SCOPE_INCOMPLETE | ERR_CREW_DOUBLE_BOOKED | ERR_DWELLING_WINDOW_CONFLICT | ERR_CREW_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "verify, complete-install, crew-assignment create"

  - priority: 11
    category: business_fiscal
    check: "Approving a rebate may not push Job.approved_rebate_total_cents above Job.rebate_budget_cap_cents"
    error_id: ERR_REBATE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /weatherization/rebate-claims/{rebate_claim_id}/decide (APPROVE)"

  - priority: 12
    category: state
    check: "OCC: expected_job_version must equal the Job's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /weatherization/financing-plans"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Dwelling
  - method: POST
    path: "/weatherization/dwellings"
    description: "Create a dwelling record"
    roles: [ProgramAdmin]
    code: 201
    input: [address, year_built, conditioned_area_sqft, foundation_type, heating_fuel_type]
    output: Dwelling
    side_effects: ["version=1"]

  - method: GET
    path: "/weatherization/dwellings/{dwelling_id}"
    description: "Read a dwelling"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: Dwelling
    side_effects: []

  # ---- WapApplication
  - method: POST
    path: "/weatherization/wap-applications"
    description: "Submit a WAP household eligibility application; eligibility is computed immediately (wap_income_eligibility)"
    roles: [ProgramAdmin, Homeowner]
    code: 201
    input: [dwelling_id, household_size, annual_gross_income_cents]
    output: WapApplication
    side_effects: ["compute income_limit_cents", "set status = ELIGIBLE | INELIGIBLE"]

  - method: GET
    path: "/weatherization/wap-applications/{wap_application_id}"
    description: "Read a WAP application"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: WapApplication
    side_effects: []

  - method: GET
    path: "/weatherization/wap-applications"
    description: "List WAP applications (filter by dwelling_id / status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["dwelling_id?", "status?", "limit?", "offset?"]
    output: WapApplication[]
    side_effects: []

  # ---- Job
  - method: POST
    path: "/weatherization/jobs"
    description: "Create a weatherization job for a dwelling"
    roles: [ProgramAdmin]
    code: 201
    input: [dwelling_id, program_track, rebate_budget_cap_cents]
    output: Job
    side_effects: ["version=1", "job_status=ACTIVE, install_status=PLANNED, verification_status=PENDING", "computed money/savings fields initialized to 0/null"]

  - method: GET
    path: "/weatherization/jobs/{job_id}"
    description: "Read a job (includes all computed money and savings fields)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/weatherization/jobs"
    description: "List jobs (filter by dwelling_id / job_status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["dwelling_id?", "job_status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/weatherization/jobs/{job_id}/complete-install"
    description: "Mark the install dimension complete (install_status SCHEDULED -> INSTALLED)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Job
    side_effects: ["install_status=INSTALLED", "recompute job_financial_rollup", "increments Job.version by 1"]

  - method: POST
    path: "/weatherization/jobs/{job_id}/verify"
    description: "Run post-test verification against a POST-stage blower-door test (verification_status PENDING -> PASSED|FAILED)"
    roles: [Auditor]
    code: 200
    input: [post_test_id]
    output: Job
    side_effects: ["verification_status=PASSED|FAILED", "on PASS: compute verified_annual_savings_kwh, INSTALLED ScopeItems -> VERIFIED, maybe job_status COMPLETED", "on FAIL: cascade ScopeItem -> FAILED_VERIFICATION -> RebateClaim VOIDED -> recompute rollup", "increments Job.version by 1"]

  - method: POST
    path: "/weatherization/jobs/{job_id}/cancel"
    description: "Cancel a job (job_status ACTIVE -> CANCELLED) with cascade"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status=CANCELLED", "cascade: ScopeItems -> CANCELLED -> APPROVED RebateClaims VOIDED", "SCHEDULED CrewAssignments -> CANCELLED (release crew-days)", "recompute job_financial_rollup", "increments Job.version by 1"]

  # ---- EnergyAudit
  - method: POST
    path: "/weatherization/audits"
    description: "Open an energy audit for a job"
    roles: [Auditor]
    code: 201
    input: [job_id]
    output: EnergyAudit
    side_effects: ["status=DRAFT", "auditor_user_id = X-User-ID"]

  - method: GET
    path: "/weatherization/audits/{audit_id}"
    description: "Read an energy audit"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: EnergyAudit
    side_effects: []

  - method: GET
    path: "/weatherization/audits"
    description: "List energy audits (filter by job_id / status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: EnergyAudit[]
    side_effects: []

  - method: POST
    path: "/weatherization/audits/{audit_id}/submit"
    description: "Submit an audit for review (DRAFT->SUBMITTED or REJECTED->SUBMITTED revision loop)"
    roles: [Auditor]
    code: 200
    input: []
    output: EnergyAudit
    side_effects: ["compute estimated_annual_savings_kwh"]

  - method: POST
    path: "/weatherization/audits/{audit_id}/decide"
    description: "Approve or reject a submitted audit"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: EnergyAudit
    side_effects: ["status=APPROVED|REJECTED"]

  # ---- DiagnosticTest
  - method: POST
    path: "/weatherization/diagnostic-tests"
    description: "Record a blower-door or duct-leakage measurement (BASELINE or POST)"
    roles: [Auditor]
    code: 201
    input: [job_id, kind, stage, cfm_measured, "baseline_test_id?"]
    output: DiagnosticTest
    side_effects: ["tester_user_id = X-User-ID"]

  - method: GET
    path: "/weatherization/diagnostic-tests/{diagnostic_test_id}"
    description: "Read a diagnostic test"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: DiagnosticTest
    side_effects: []

  - method: GET
    path: "/weatherization/diagnostic-tests"
    description: "List diagnostic tests (filter by job_id / baseline_test_id / kind / stage)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "baseline_test_id?", "kind?", "stage?", "limit?", "offset?"]
    output: DiagnosticTest[]
    side_effects: []

  # ---- ScopeItem
  - method: POST
    path: "/weatherization/scope-items"
    description: "Add a recommended measure to a job/audit"
    roles: [Auditor]
    code: 201
    input: [job_id, audit_id, category, area_sqft, target_r_value, estimated_cost_cents, estimated_savings_kwh]
    output: ScopeItem
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/weatherization/scope-items/{scope_item_id}"
    description: "Read a scope item"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: ScopeItem
    side_effects: []

  - method: GET
    path: "/weatherization/scope-items"
    description: "List scope items (filter by job_id / audit_id / status / category)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "audit_id?", "status?", "category?", "limit?", "offset?"]
    output: ScopeItem[]
    side_effects: []

  - method: POST
    path: "/weatherization/scope-items/{scope_item_id}/decide"
    description: "Approve or reject a proposed scope item"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: ScopeItem
    side_effects: ["status=APPROVED|REJECTED", "on APPROVE recompute job_financial_rollup"]

  - method: POST
    path: "/weatherization/scope-items/{scope_item_id}/mark-installed"
    description: "Record installation of an approved measure (APPROVED->INSTALLED)"
    roles: [Installer]
    code: 200
    input: [achieved_r_value, actual_cost_cents]
    output: ScopeItem
    side_effects: ["status=INSTALLED", "set achieved_r_value, actual_cost_cents", "recompute tax_credit_25c and job_financial_rollup"]

  # ---- Crew
  - method: POST
    path: "/weatherization/crews"
    description: "Register an install crew"
    roles: [ProgramAdmin]
    code: 201
    input: [name, crew_size, skills, capacity_days]
    output: Crew
    side_effects: ["committed_days=0", "available_days=capacity_days"]

  - method: GET
    path: "/weatherization/crews/{crew_id}"
    description: "Read a crew (includes committed_days / available_days)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- CrewAssignment
  - method: POST
    path: "/weatherization/crew-assignments"
    description: "Schedule a crew for a job over a date window"
    roles: [ProgramAdmin]
    code: 201
    input: [job_id, crew_id, scheduled_start_date, scheduled_end_date]
    output: CrewAssignment
    side_effects: ["status=SCHEDULED", "compute duration_days", "Crew.committed_days += duration_days", "if Job.install_status==PLANNED -> SCHEDULED (increments Job.version by 1)"]

  - method: GET
    path: "/weatherization/crew-assignments/{crew_assignment_id}"
    description: "Read a crew assignment"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/weatherization/crew-assignments"
    description: "List crew assignments (filter by job_id / crew_id / status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/weatherization/crew-assignments/{crew_assignment_id}/cancel"
    description: "Cancel a scheduled crew assignment (releases crew-days)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status=CANCELLED", "Crew.committed_days -= duration_days"]

  # ---- RebateClaim
  - method: POST
    path: "/weatherization/rebate-claims"
    description: "Open a utility rebate claim for a scope item (computes PROVISIONAL amount)"
    roles: [ProgramAdmin]
    code: 201
    input: [job_id, scope_item_id]
    output: RebateClaim
    side_effects: ["status=DRAFT", "compute provisional_amount_cents (rebate_amount PROVISIONAL)"]

  - method: GET
    path: "/weatherization/rebate-claims/{rebate_claim_id}"
    description: "Read a rebate claim"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: RebateClaim
    side_effects: []

  - method: GET
    path: "/weatherization/rebate-claims"
    description: "List rebate claims (filter by job_id / scope_item_id / status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "scope_item_id?", "status?", "limit?", "offset?"]
    output: RebateClaim[]
    side_effects: []

  - method: POST
    path: "/weatherization/rebate-claims/{rebate_claim_id}/submit"
    description: "Submit a rebate claim (computes FINALIZED amount from installed R-value)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RebateClaim
    side_effects: ["status=SUBMITTED", "compute finalized_amount_cents (rebate_amount FINALIZED)"]

  - method: POST
    path: "/weatherization/rebate-claims/{rebate_claim_id}/decide"
    description: "Approve or deny a submitted rebate claim"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: RebateClaim
    side_effects: ["status=APPROVED|DENIED", "on APPROVE: Job.approved_rebate_total_cents += finalized_amount_cents, recompute out-of-pocket"]

  - method: POST
    path: "/weatherization/rebate-claims/{rebate_claim_id}/void"
    description: "Void an approved rebate claim (compensating action; returns budget)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: RebateClaim
    side_effects: ["status=VOIDED", "Job.approved_rebate_total_cents -= finalized_amount_cents, recompute out-of-pocket"]

  # ---- FinancingPlan
  - method: POST
    path: "/weatherization/financing-plans"
    description: "Offer a financing plan for a job's out-of-pocket; supersedes any prior OFFERED plan (OCC on Job.version)"
    roles: [ProgramAdmin, Homeowner]
    code: 201
    input: [job_id, principal_cents, term_months, apr_bps, expected_job_version]
    output: FinancingPlan
    side_effects: ["status=OFFERED", "compute monthly_payment_cents", "prior OFFERED plan for job -> SUPERSEDED", "increments Job.version by 1"]

  - method: GET
    path: "/weatherization/financing-plans/{financing_plan_id}"
    description: "Read a financing plan"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []

  - method: GET
    path: "/weatherization/financing-plans"
    description: "List financing plans (filter by job_id / status)"
    roles: [ProgramAdmin, Auditor, Installer, Homeowner]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []

  - method: POST
    path: "/weatherization/financing-plans/{financing_plan_id}/respond"
    description: "Homeowner accepts or declines an offered financing plan"
    roles: [Homeowner]
    code: 200
    input: [decision]
    output: FinancingPlan
    side_effects: ["status=ACCEPTED|DECLINED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not permitted to perform this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum, out-of-range number, or bad pagination parameter" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or a body foreign-key reference does not resolve to an existing resource" }
  - { id: ERR_INVALID_DATE_WINDOW, http: 422, condition: "scheduled_end_date is not strictly after scheduled_start_date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in the required state for the requested transition" }
  - { id: ERR_AUDIT_NOT_APPROVED, http: 409, condition: "Scope item cannot be approved because its EnergyAudit is not APPROVED" }
  - { id: ERR_SCOPE_NOT_INSTALLED, http: 409, condition: "Rebate claim cannot be submitted because the referenced ScopeItem is not INSTALLED or VERIFIED" }
  - { id: ERR_NOT_WAP_ELIGIBLE, http: 409, condition: "A WAP-track job requires an ELIGIBLE WapApplication for the dwelling" }
  - { id: ERR_BASELINE_TEST_REQUIRED, http: 409, condition: "A POST-stage diagnostic test must reference a BASELINE test of the same job and kind" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "The Auditor performing verification also recorded the baseline blower-door test (segregation of duties)" }
  - { id: ERR_SCOPE_INCOMPLETE, http: 409, condition: "verify requires >= 1 INSTALLED ScopeItem; complete-install requires no APPROVED-but-uninstalled ScopeItem" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "The crew already has a SCHEDULED assignment overlapping the requested window [start, end)" }
  - { id: ERR_DWELLING_WINDOW_CONFLICT, http: 409, condition: "Another job's SCHEDULED assignment at the same dwelling is within BUFFER_DAYS (2 days) of the requested window (day-gap < 2)" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "The assignment would push the crew's committed_days above capacity_days" }
  - { id: ERR_REBATE_BUDGET_EXCEEDED, http: 409, condition: "Approving the rebate would push Job.approved_rebate_total_cents above rebate_budget_cap_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_job_version does not match the Job's current version (OCC on financing-plan create)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Weatherization program operator: owns jobs, dwellings, crews, scheduling, scope decisions, rebate lifecycle, and job cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /weatherization/dwellings"
      - "POST /weatherization/jobs"
      - "POST /weatherization/jobs/{job_id}/complete-install"
      - "POST /weatherization/jobs/{job_id}/cancel"
      - "POST /weatherization/audits/{audit_id}/decide"
      - "POST /weatherization/scope-items/{scope_item_id}/decide"
      - "POST /weatherization/crews"
      - "POST /weatherization/crew-assignments"
      - "POST /weatherization/crew-assignments/{crew_assignment_id}/cancel"
      - "POST /weatherization/rebate-claims"
      - "POST /weatherization/rebate-claims/{rebate_claim_id}/submit"
      - "POST /weatherization/rebate-claims/{rebate_claim_id}/decide"
      - "POST /weatherization/rebate-claims/{rebate_claim_id}/void"
    shared_operations:
      - "POST /weatherization/wap-applications (with Homeowner)"
      - "POST /weatherization/financing-plans (with Homeowner)"
      - "all GET endpoints"

  - name: Auditor
    description: "Field energy auditor: opens audits, records blower-door/duct tests, proposes scope, performs post-test verification"
    identity: opaque
    exclusive_operations:
      - "POST /weatherization/audits"
      - "POST /weatherization/audits/{audit_id}/submit"
      - "POST /weatherization/scope-items"
      - "POST /weatherization/diagnostic-tests"
      - "POST /weatherization/jobs/{job_id}/verify"
    shared_operations:
      - "all GET endpoints"

  - name: Installer
    description: "Install crew lead who records completed measures"
    identity: opaque
    exclusive_operations:
      - "POST /weatherization/scope-items/{scope_item_id}/mark-installed"
    shared_operations:
      - "all GET endpoints"

  - name: Homeowner
    description: "Household applicant: applies for WAP and responds to financing offers"
    identity: opaque
    exclusive_operations:
      - "POST /weatherization/financing-plans/{financing_plan_id}/respond"
    shared_operations:
      - "POST /weatherization/wap-applications (with ProgramAdmin)"
      - "POST /weatherization/financing-plans (with ProgramAdmin)"
      - "all GET endpoints"
