# =============================================================================
# task_1059 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: refund_policy_fee_retained_vs_fee_included_on_order_money
        grounds:
          - calculations.refund_amount
          - entities.RefundRequest.fields.policy
          - entities.RefundRequest.fields.refund_amount_cents
          - entities.RefundRequest.fields.platform_retained_cents
          - state_machines.RefundRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          This dual variant lives on the ORDER MONEY domain: two RefundRequests built from
          byte-identical order lines (face 5000 x2, PASS_ON fee_mode, fee_total 728) settle to
          10000 cents under FEE_RETAINED and 10728 cents under FEE_INCLUDED — a 728-cent delta
          that is exactly the retained platform fee.
        test_recipe:
          setup:
            - "Organizer O owns Event E at Venue V, fee_mode PASS_ON, ONSALE, starts 2026-08-01T18:00:00Z."
            - "TicketType T price_cents 5000, quantity_total 10, seating_mode GA."
            - "Buyer B has two separate PAID orders, each 2 tickets of T: subtotal 10000, fee_total 728, buyer_total 10728."
            - "Logical clock at 2026-07-05T10:00:00Z, i.e. inside the refund window and before Event.starts_at."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Northgate Live", contact_email: "ops@northgate.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Northgate Hall", city: "Portland", seated_capacity: 400 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Summer Session", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "bea@example.com", display_name: "Bea" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 2 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /api/orders/${order_a_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { ev_v2: $.data.version }
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { ev_v3: $.data.version }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 2 }], expected_event_version: "${ev_v3}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_b_id: $.data.id }
            - call: "POST /api/orders/${order_b_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "GET /api/order-items"
              payload: { order_id: "${order_a_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { item_a_id: "$.data[0].id" }
            - call: "GET /api/order-items"
              payload: { order_id: "${order_b_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { item_b_id: "$.data[0].id" }
            - call: "POST /api/refund-requests"
              payload: { order_id: "${order_a_id}", item_refunds: [{ order_item_id: "${item_a_id}", quantity: 2 }], reason: "cannot attend", policy: "FEE_RETAINED" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { rr_retained_id: $.data.id }
            - call: "POST /api/refund-requests"
              payload: { order_id: "${order_b_id}", item_refunds: [{ order_item_id: "${item_b_id}", quantity: 2 }], reason: "cannot attend", policy: "FEE_INCLUDED" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { rr_included_id: $.data.id }
          trigger:
            - call: "POST /api/refund-requests/${rr_retained_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { retained_amount: $.data.refund_amount_cents }
            - call: "POST /api/refund-requests/${rr_included_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { included_amount: $.data.refund_amount_cents }
          assert:
            - "RefundRequest.${rr_retained_id}.refund_amount_cents == 10000"
            - "RefundRequest.${rr_retained_id}.platform_retained_cents == 728"
            - "RefundRequest.${rr_retained_id}.organizer_charged_cents == 10000"
            - "RefundRequest.${rr_included_id}.refund_amount_cents == 10728"
            - "RefundRequest.${rr_included_id}.platform_retained_cents == 0"
            - "RefundRequest.${rr_included_id}.organizer_charged_cents == 10728"
            - "RefundRequest.${rr_included_id}.refund_amount_cents - RefundRequest.${rr_retained_id}.refund_amount_cents == 728"

      - name: reliability_lifetime_vs_trailing_divergence_on_organizer
        grounds:
          - calculations.organizer_reliability_score
          - entities.Event.fields.status
          - entities.Event.fields.gross_cents
          - endpoints
        distinguishing_aspect: |
          This dual variant lives on the ORGANIZER RISK domain, not on order money: the same
          three qualifying events (scores 65, 65, 45) yield LIFETIME 58 and TRAILING 55 because
          TRAILING averages only the RELIABILITY_TRAILING_EVENTS=2 most recently ended events.
        test_recipe:
          setup:
            - "Organizer O has three qualifying events at three different venues: E1 (COMPLETED, ends 2026-08-01T22:00:00Z), E2 (COMPLETED, ends 2026-09-01T22:00:00Z), E3 (CANCELLED from DRAFT, ends 2026-10-01T22:00:00Z)."
            - "No orders exist on any of them, so every gross_cents is 0 and every issued_count is 0."
            - "Per-event scores: E1 65, E2 65, E3 45."
            - "Logical clock at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Cascade Presents", contact_email: "ops@cascade.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Hall One", city: "Portland", seated_capacity: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Hall Two", city: "Portland", seated_capacity: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v2_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Hall Three", city: "Portland", seated_capacity: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v3_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${v1_id}", title: "August Night", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${v2_id}", title: "September Night", starts_at: "2026-09-01T18:00:00Z", ends_at: "2026-09-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${v3_id}", title: "October Night", starts_at: "2026-10-01T18:00:00Z", ends_at: "2026-10-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${e1_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/ticket-types"
              payload: { event_id: "${e2_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e1_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e2_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e1_id}/close-sales"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e2_id}/close-sales"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e3_id}/cancel"
              payload: { reason: "venue withdrew" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events/${e1_id}/complete"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /api/events/${e2_id}/complete"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /api/organizers/${org_id}/reliability"
              payload: { variant: "LIFETIME" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { lifetime_score: $.data.score }
            - call: "GET /api/organizers/${org_id}/reliability"
              payload: { variant: "TRAILING" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { trailing_score: $.data.score }
          assert:
            - "GET reliability variant=LIFETIME returns data.score == 58 and data.events_counted == 3"
            - "GET reliability variant=TRAILING returns data.score == 55 and data.events_counted == 2"
            - "${lifetime_score} != ${trailing_score}"

  - rule_id: combinatorial_formula
    instances:

      - name: fee_rounded_per_ticket_then_summed_across_mixed_price_lines
        grounds:
          - calculations.order_fee_breakdown
          - entities.OrderItem.fields.per_ticket_fee_cents
          - entities.OrderItem.fields.line_fee_cents
          - entities.Order.fields.fee_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Rounding per ticket then multiplying
          then summing gives fee_total_cents 1546 for a 1234x3 + 7777x2 order, whereas summing
          the un-rounded percentage components first and rounding once gives 1545; the scaffold
          pins the per-ticket order, so 1546 is the only correct answer.
        test_recipe:
          setup:
            - "Organizer O owns ONSALE Event E with fee_mode PASS_ON."
            - "TicketType T1 price_cents 1234 (fee tier 1, rate 0.020) and TicketType T2 price_cents 7777 (fee tier 2, rate 0.037), each quantity_total 10, seating_mode GA."
            - "Buyer B holds no other orders on E."
            - "Logical clock at the default 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Riverline Events", contact_email: "ops@riverline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Riverline Hall", city: "Seattle", seated_capacity: 300 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Mixed Tier Night", starts_at: "2026-08-10T18:00:00Z", ends_at: "2026-08-10T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Balcony", tier_rank: 1, price_cents: 1234, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt1_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "Floor", tier_rank: 2, price_cents: 7777, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt2_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "cal@example.com", display_name: "Cal" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt1_id}", quantity: 3 }, { ticket_type_id: "${tt2_id}", quantity: 2 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.subtotal_cents == 19256"
            - "Order.${order_id}.fee_total_cents == 1546"
            - "Order.${order_id}.discount_cents == 0"
            - "Order.${order_id}.buyer_total_cents == 20802"
            - "Order.${order_id}.organizer_gross_cents == 19256"
            - "GET /api/order-items?order_id=${order_id} returns the T1 line with per_ticket_fee_cents == 204 and line_fee_cents == 612"
            - "GET /api/order-items?order_id=${order_id} returns the T2 line with per_ticket_fee_cents == 467 and line_fee_cents == 934"

      - name: payout_reserve_rate_frozen_against_its_own_refund_feedback_loop
        grounds:
          - calculations.payout_net_amount
          - calculations.organizer_reliability_score
          - entities.Payout.fields.reliability_score_snapshot
          - entities.Payout.fields.reserve_rate
          - state_machines.RefundRequest.APPROVED_to_SETTLED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. reserve_rate is
          selected from reliability, which is itself derived from the refund totals that feed
          step 2 of the same formula; freezing reliability_score_snapshot at payout creation
          breaks the cycle, so a later 5000-cent settled refund moves reserve_cents 1000 -> 500
          and net 9000 -> 4500 while reserve_rate stays exactly 0.10.
        test_recipe:
          setup:
            - "Event E (fee_mode PASS_ON) is COMPLETED with exactly one PAID Order of 2 tickets at face 5000 (subtotal 10000, fee_total 728, buyer_total 10728, organizer_gross 10000)."
            - "No attendee was ever scanned, so E.issued_count == 2 and E.checked_in_count == 0 and the organizer's only qualifying event scores 65."
            - "A RefundRequest for 1 ticket with policy FEE_RETAINED sits in REQUESTED, created while the clock was still before Event.starts_at."
            - "Payout P was opened after completion with reliability_score_snapshot 65, reserve_rate 0.10, reserve_cents 1000, net_amount_cents 9000."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Harborlight Co", contact_email: "ops@harborlight.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Harbor Hall", city: "Boston", seated_capacity: 250 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Harbor Night", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "dee@example.com", display_name: "Dee" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 2 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "GET /api/order-items"
              payload: { order_id: "${order_id}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /api/refund-requests"
              payload: { order_id: "${order_id}", item_refunds: [{ order_item_id: "${item_id}", quantity: 1 }], reason: "one guest dropped out", policy: "FEE_RETAINED" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /api/events/${ev_id}/close-sales"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/events/${ev_id}/complete"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "GET /api/organizers/${org_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { org_v: $.data.version }
            - call: "POST /api/payouts"
              payload: { organizer_id: "${org_id}", event_id: "${ev_id}", expected_organizer_version: "${org_v}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { payout_id: $.data.id, snap: $.data.reliability_score_snapshot }
            - call: "POST /api/refund-requests/${rr_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /api/refund-requests/${rr_id}/settle"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "Payout.${payout_id}.reliability_score_snapshot == 65"
            - "Payout.${payout_id}.reserve_rate == 0.10"
            - "Payout.${payout_id}.gross_cents == 10000"
            - "Payout.${payout_id}.refunds_cents == 5000"
            - "Payout.${payout_id}.platform_fee_cents == 0"
            - "Payout.${payout_id}.reserve_basis_cents == 5000"
            - "Payout.${payout_id}.reserve_cents == 500"
            - "Payout.${payout_id}.net_amount_cents == 4500"
            - "Order.${order_id}.payment_status == PARTIALLY_REFUNDED"

  - rule_id: non_linear_state_machine
    instances:

      - name: order_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Order.ISSUED_to_CHECKED_IN_PARTIAL
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Non-linear shape = PARALLEL DIMENSIONS on the Order entity: after one of two
          admissions is scanned, payment_status stays PAID while fulfillment_status moves
          ISSUED -> CHECKED_IN_PARTIAL, proving the two axes are independent rather than a
          single linear pipeline.
        test_recipe:
          setup:
            - "ONSALE Event E starts 2026-08-01T18:00:00Z, ends 2026-08-01T22:00:00Z."
            - "Buyer B has one PAID Order of 2 GA tickets, so two Attendees exist in status ISSUED."
            - "Logical clock at 2026-08-01T17:00:00Z, inside the check-in window (opens 16:00:00Z)."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Twin Axis Live", contact_email: "ops@twinaxis.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Axis Hall", city: "Denver", seated_capacity: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Axis Night", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
