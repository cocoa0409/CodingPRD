  - section: consistency_model
    instances:
    - name: countersignature_response_already_shows_the_executed_join_and_its_cascade
      claim_type: immediate
      grounds:
      - complexity_profile.consistency_model
      - state_machines.Contract.PLANNER_SIGNED_to_COUNTERSIGNED
      - endpoints[POST /sourcing/contracts/{contract_id}/countersign]
      - entities.Contract.fields.executed_at
      - entities.Venue.fields.blocked_room_nights
      - calculations.room_night_inventory_invariant
      distinguishing_aspect: The declared model is immediate, so the countersign RESPONSE BODY itself - not a later read - already carries signature_state EXECUTED and executed_at, and every cascade of that join (event CONTRACTED, entry AWARDED, Venue.blocked_room_nights 587) is observable on reads taken at the very same logical clock with no intervening write.
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR, 24% service charge, 15.6% tax.
        - PREFERRED TIER_1 Venue 'Harborline Grand'.
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18 (nights_span 3), budget ceiling 500000.00, requirements locked.
        - That venue shortlisted at rank 1; round-1 Rfp issued then closed, so the event sits in BID_REVIEW.
        - The venue's Proposal submitted with the 249.00 NET / 600-night / 145000.00 F&B grid and evaluated once on CONTRACTED_BASIS, so it is UNDER_REVIEW with total_cost_contracted_usd 447844.84.
        - The event awarded to that proposal, both approval steps APPROVED so Contract.approval_state == APPROVED, and planner-signed so signature_state == PLANNER_SIGNED with the venue signature still outstanding.
        - Venue.blocked_room_nights is 0 and MeetingEvent.status is AWARDED immediately before the trigger.
