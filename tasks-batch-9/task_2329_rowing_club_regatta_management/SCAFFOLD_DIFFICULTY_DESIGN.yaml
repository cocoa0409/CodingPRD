              as: ClubAdmin
              captures: { dana_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Novice One", tier: "LEARN_TO_ROW", body_weight_kg: 66.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { n1_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Novice Two", tier: "LEARN_TO_ROW", body_weight_kg: 67.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { n2_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Novice Three", tier: "LEARN_TO_ROW", body_weight_kg: 68.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { n3_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull A", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_a_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull B", boat_class: "1X", hull_weight_kg: 14.2, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_b_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull C", boat_class: "1X", hull_weight_kg: 14.4, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { shell_c_id: $.data.id }
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 20.0, water_temp_c: 18.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_open_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_a_id}", session_kind: "LEARN_TO_ROW", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T08:00:00Z", coach_member_id: "${coach_id}", primary_launch_driver_member_id: "${dana_id}", athlete_member_ids: ["${n1_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_b_id}", session_kind: "LEARN_TO_ROW", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z", coach_member_id: "${coach_id}", primary_launch_driver_member_id: "${dana_id}", athlete_member_ids: ["${n2_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_c_id}", session_kind: "LEARN_TO_ROW", planned_start_at: "2026-08-01T07:00:00Z", planned_end_at: "2026-08-01T09:00:00Z", coach_member_id: "${coach_id}", primary_launch_driver_member_id: "${dana_id}", athlete_member_ids: ["${n3_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /boathouse/water-sessions/${s1_id}/clear"
              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /boathouse/water-sessions/${s3_id}/clear"
              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s2_id}/clear"
              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s3_id}/clear"
              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_LAUNCH_DRIVER_OVERBOOKED: S1 is CLEARED and [06:00,08:00) strictly intersects S3's [07:00,09:00), so the count 1 is not strictly less than Dana's launch_supervision_limit of 1"
            - "after that rejection WaterSession.${s3_id}.status == PLANNED and required_launch_count == 0"
            - "the second trigger call returns HTTP 200 with WaterSession.${s2_id}.status == CLEARED: [06:00,08:00) and [08:00,09:00) only touch at 08:00, and no turnaround buffer applies to launch drivers"
            - "WaterSession.${s2_id}.required_launch_count == 1 (LEARN_TO_ROW adds 1, the reading is neither cold nor RESTRICTED) and assigned_launch_count == 1"
            - "the third trigger call again returns HTTP 409 with data.error_id == ERR_LAUNCH_DRIVER_OVERBOOKED, now with two cleared sessions intersecting S3's window"
            - "Shell.${shell_a_id}.status == ASSIGNED and Shell.${shell_b_id}.status == ASSIGNED while Shell.${shell_c_id}.status == AVAILABLE"

      - name: repair_bay_closed_interval_shared_endpoint_does_conflict
        grounds:
          - validations[priority=37]
          - errors[ERR_REPAIR_BAY_CONFLICT]
          - state_machines.DamageReport.TRIAGED_to_REPAIR_SCHEDULED
          - entities.DamageReport.assigned_repair_bay
        distinguishing_aspect: |
          A third resource entity (repair bay) reserved over CLOSED intervals, the opposite
          endpoint convention: a window starting exactly when another ends DOES conflict, so
          12:00-16:00 is refused against 08:00-12:00 while 12:01-16:00 is accepted, and the same
          08:00-12:00 window in a different bay is accepted because the check is bay-scoped.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach as reporter and one EquipmentManager (distinct members, since triage forbids self-triage)"
            - "three hulls, each with one MAJOR damage report already triaged to TRIAGED"
            - "report 1 already scheduled into BAY-A for the closed window 08:00-12:00"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull A", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
