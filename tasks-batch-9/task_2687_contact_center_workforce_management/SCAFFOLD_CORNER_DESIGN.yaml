            - call: "POST /partner-allocations"
              payload: { outsource_partner_id: "${p1_id}", interval_plan_id: "${ip0_id}", allocated_volume: 50 }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "GET /interval-plans/${ip0_id}"
              payload: {}
              as: SourcingManager
              captures: { cv_proposed: "$.data.partner_committed_volume", un_proposed: "$.data.unserved_volume" }
            - call: "POST /partner-allocations/${a2_id}/commit"
              payload: { expected_partner_version: "${p1_v1}" }
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { a2_status: "$.data.status" }
            - call: "GET /interval-plans/${ip0_id}"
              payload: {}
              as: SourcingManager
              captures: { cv_committed: "$.data.partner_committed_volume", un_committed: "$.data.unserved_volume" }
            - call: "POST /partner-allocations/${a2_id}/settle"
              payload: { delivered_volume: 40 }
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { a2_settled: "$.data.status", amt: "$.data.settlement_amount_cents", pen: "$.data.shortfall_penalty_cents" }
            - call: "GET /interval-plans/${ip0_id}"
              payload: {}
              as: SourcingManager
              captures: { cv_settled: "$.data.partner_committed_volume", un_settled: "$.data.unserved_volume" }
            - call: "POST /partner-allocations/${a1_id}/revoke"
              payload: {}
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { a1_revoked: "$.data.status" }
