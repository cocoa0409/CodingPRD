            - "the second present returns status PRESENTED with round_no == 2 — the same state re-entered, not a forward-only step"
            - "the second request-revision returns revision_count == 2, and the third present returns round_no == 3"
            - "the third request-revision is rejected with ERR_REVISION_LIMIT_REACHED (409) because revision_count already equals 2"
            - "after the rejection GET /proposals/${pr} still returns status PRESENTED, round_no 3 and revision_count 2 — the failed loop iteration left no trace"

