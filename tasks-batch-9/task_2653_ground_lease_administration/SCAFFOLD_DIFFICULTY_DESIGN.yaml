  - rule_id: cross_entity_state_dependency
    instances:
      - name: arbitration_referral_blocked_while_the_lease_sits_in_default
        grounds:
          - validations.priority_9_cross_entity
          - errors.ERR_CROSS_ENTITY_BLOCKED
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_ARBITRATION_REFERRED
          - state_machines.Lease.lease_status
        distinguishing_aspect: |
          The referral's own entity is perfectly ready - PROPOSALS_EXCHANGED with divergence 4000 bps, well
          over the threshold - and the blocking condition lives on a different entity's other axis: the
          Lease is IN_DEFAULT. Curing the default with no change at all to the revaluation flips the same
          call from 409 to 201, so the check must read the lease's tenancy axis at referral time rather
          than anything cached on the revaluation.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "One lease with arrears 1000000, a revaluation for 2027-06-01 exchanged at LESSOR 14000000 / LESSEE 10000000, and a MONETARY_RENT_ARREARS notice served by acct-1."
