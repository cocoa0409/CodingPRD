            - "school posture == PROBATION after the sweep (5000 bps < 6000 threshold with 10 first attempts)"
            - "school status remains LICENSED (posture is orthogonal to lifecycle)"
            - "approval submission on PROBATION: error_id == ERR_SCHOOL_ON_PROBATION (http 422)"
            - "offering publish on PROBATION: error_id == ERR_SCHOOL_ON_PROBATION (http 422)"

  # ------------------------------------------------------------ endpoints ---
  - section: endpoints
