      - name: alert_event_create_read_and_filtered_list_are_the_whole_crud_surface
        claim_type: standard_crud
        grounds:
          - "§1.5 POST /alert-events (201, output AlertEvent), GET /alert-events/{id} (200), GET /alert-events (200, output AlertEvent[]) with filters [station_id?, matched_relay_rule_id?, suppression_reference_alert_id?, relay_state?, accessibility_state?, event_code?, originator_sequence?, limit?, offset?]"
          - "§1.0 response_envelope pagination fields ['limit', 'offset', 'total_count', 'has_more'] with defaults limit 10, offset 0"
          - "§1.5 the only other AlertEvent endpoints are the two action endpoints confirm-relay and verify-accessibility — no PUT, PATCH or DELETE is declared"
        distinguishing_aspect: "Every AlertEvent mutation is action-shaped: create-then-read round-trips all input fields verbatim, the list endpoint filters on the computed relay_state as well as the supplied originator_sequence, and there is no update or delete route through which relay_state could be set directly."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 (mandatory []) activated with no relay rules; station KWEA."
            - "Three alerts: two TOR with distinct originator_sequence values and one SVR; all become UNMATCHED_OPTIONAL because the candidate pool is empty."
