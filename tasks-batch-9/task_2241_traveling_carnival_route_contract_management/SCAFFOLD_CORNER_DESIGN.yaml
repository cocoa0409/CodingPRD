            - "Second call: HTTP 201 with ride_id == \"${ride_n5}\" and route_stop_id == \"${stop_n5}\", status == \"RESERVED\""
            - "RideAllocation.${alloc_n5}.footprint_charged_sqft == 5414 and power_charged_amps == 375.0"
