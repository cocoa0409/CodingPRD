      - name: events_ingested_out_of_order_score_identically_and_list_chronologically
        claim_type: chronological
        grounds:
          - calculations.eis_composite_score
          - endpoints["GET /officers/{id}/activity-events"]
          - entities.OfficerActivityEvent.fields.base_weight
          - entities.OfficerActivityEvent.fields.weekday_index
        distinguishing_aspect: |
          weighted_total is defined as a sum taken in occurred_at ascending order with created_at
          ascending as the tie-break, so ingest order must not change the score, and the listing
          read must return the same canonical order rather than insertion order. Four events are
          ingested newest-first with two sharing an occurred_at, which is the only case where the
          created_at tie-break is observable. The alert opened on the way up must also stay
          frozen at the score that created it: event ingest creates an alert but does not refresh
          one that is already open, so the officer climbs to 70.00 ALERT while the alert row
          stays at 30.00 WATCH until an EIS run refreshes it.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Officer Pike, assignment_type PATROL, with no activity events."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-701", full_name: "Officer Pike", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_C", hire_date: "2017-11-06T00:00:00Z" }
              as: SystemAdmin
              captures: { pike_id: $.data.id }
          trigger:
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-20T12:00:00Z", source_reference: "REF-D" }
              as: SystemAdmin
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T12:00:00Z", source_reference: "REF-A" }
              as: SystemAdmin
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-10T12:00:00Z", source_reference: "REF-C" }
              as: SystemAdmin
            - call: "POST /officers/${pike_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-10T12:00:00Z", source_reference: "REF-B" }
              as: SystemAdmin
            - call: "GET /officers/${pike_id}/activity-events"
              payload: { limit: 10, offset: 0 }
              as: SystemAdmin
            - call: "GET /officers/${pike_id}/eis-profile"
              payload: {}
              as: SystemAdmin
            - call: "GET /eis-alerts"
              payload: { officer_id: "${pike_id}" }
              as: SystemAdmin
          assert:
            - "call 5: HTTP 200 with total_count == 4 and the data list ordered REF-A, REF-C, REF-B, REF-D - occurred_at ascending, and between the two 2026-07-10 events the earlier-created REF-C precedes REF-B"
            - "every listed event carries base_weight == 6.0 (USE_OF_FORCE base 3 times LEVEL_3 multiplier 2.0) and system_generated == false"
            - "the REF-A event carries weekday_index == 2, the two 2026-07-10 events carry weekday_index == 4 and REF-D carries weekday_index == 0"
            - "call 6: event_count == 4, weighted_total == 24.0, composite_score == 70.00 (24.0 * 1.0 * 2.5 plus one 10-point FORCE_COUNT bonus), alert_level == ALERT, breached_indicators == [\"FORCE_COUNT\"]"
            - "Officer.${pike_id}.eis_score == 70.00 and eis_alert_level == ALERT - the reverse ingest order produced the same total as a chronological ingest would"
            - "call 7: HTTP 200 with total_count == 1; the single alert was created by the second ingest and still reports composite_score == 30.00, alert_level == WATCH and status == OPEN"

      - name: the_ledger_takes_the_final_variant_days_not_the_presumptive_days
        claim_type: Reconciliation
        grounds:
          - calculations.discipline_matrix
          - endpoints["POST /disciplines/{id}/impose"]
          - entities.Discipline.fields.effective_days
          - entities.Officer.fields.imposed_suspension_days_total
        distinguishing_aspect: |
          The PRESUMPTIVE variant is computed at disposition and the FINAL variant at imposition,
          and the impose payload re-reads aggravator_count and mitigator_count. Here the
          commander finds one aggravating factor at imposition that was not recorded at
          disposition, so presumptive_days 10 and final_days 15 disagree without any prior-tier
          movement. The reconciliation claim is that the officer ledger and the employment
          dimension take final_days and only final_days: presumptive_days must remain the
          historical 10, effective_days must equal 15, imposed_suspension_days_total must be 15
          rather than 10 or 25, and suspension_end_date must be effective_date plus 15 days.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-08-01T00:00:00Z and advances to 2026-08-05T09:00:00Z for the interview."
            - "Internal Affairs holds Commander Reyes and Investigator Ahn; Patrol North holds Sergeant Doyle and Officer Vance; one hearing room exists."
            - "Officer Vance has no prior sustained allegations, so both variants sit at prior tier 0 on a class B allegation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 1, recording_enabled: true }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Failure to complete required reports on shift.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "Reports for four shifts were never filed.", offense_class: "B" }
              as: IACommander
              as_user_id: "${cmdr_id}"
