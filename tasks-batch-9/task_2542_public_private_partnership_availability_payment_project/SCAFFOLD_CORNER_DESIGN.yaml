        claim_type: interval_clipping
        grounds:
          - calculations.relief_credit_for_period
          - entities.ReliefClaim.fields.event_start
          - endpoints[POST /ppp/service-periods/{id}/verify]
        distinguishing_aspect: |
          A granted 8-day COMPENSATION_EVENT window [2027-02-25, 2027-02-25..2027-03-04]
          straddles the start of the period. Only the 4 days that fall inside the HALF-OPEN
          period [2027-03-01, 2027-04-01) may be credited, giving 1110215; crediting the
          granted day count instead yields 2220430, and crediting a closed-interval period
          would add a spurious 2027-04-01. The claim itself keeps granted_relief_days == 8,
          so the clipping must happen in the credit calculation and nowhere else.
        test_recipe:
          setup:
            - "The base chain to OPERATIONS; clock 2027-02-25."
            - "A COMPENSATION_EVENT claim [2027-02-25, 2027-03-04] (8 closed days) notified on 2027-02-25 (0 days after event_start, inside the 20-day window) and GRANTED in full for 8 days."
            - "ServicePeriod 1 = [2027-03-01, 2027-04-01), 31 days, gross 8604167; the overlap is 2027-03-01..2027-03-04 = 4 days."
            - "Expected relief_credit_cents = round_half_up(8604167 * 4 / 31) = 1110215."
