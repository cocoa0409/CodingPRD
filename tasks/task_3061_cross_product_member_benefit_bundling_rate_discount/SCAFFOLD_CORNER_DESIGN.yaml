      - name: deposit_rate_boost_uses_the_highest_matching_band_not_a_marginal_sum
        claim_type: constants_applied
        grounds:
          - calculations.deposit_rate_boost_bps
          - endpoints.GET_/benefits/members/{member_id}/deposit-rate-projection
        distinguishing_aspect: "The band structure is a highest-match selection rather than a marginal accumulation: a balance of 2600000 earns 75 bps flat, not 25 + 50 + 75, so the function is a step and not a sum."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CALC-05 holds an ADOPTED BANKING holding funded by payroll postings to 2600000 cents and has an ACTIVE enrolment."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-CALC-05", full_name: "Vera Ostrom", email: "vera@x.com" }
              as: Anonymous
              captures: { calc05_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${calc05_id}", product_line: "BANKING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { calc05_h_id: $.data.id }
            - call: "POST /benefits/holdings/${calc05_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${calc05_id}"
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${calc05_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { calc05_en_id: $.data.id }
            - call: "POST /benefits/members/${calc05_id}/deposits"
              payload: { enrollment_id: "${calc05_en_id}", amount_cents: 2600000, posted_at: "2026-09-01T00:00:00Z", holding_id: "${calc05_h_id}" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${calc05_en_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /benefits/members/${calc05_id}/deposit-rate-projection"
              payload: {}
              as: Member
              as_user_id: "${calc05_id}"
          assert:
            - "Member.${calc05_id}.qualifying_deposit_balance_cents == 2600000"
            - "the response reports current_boost_bps == 75, the top band, not the marginal sum 25 + 50 + 75 = 150"
            - "moving the balance to 2499999 would step down to 50 bps, confirming a step function with inclusive lower bounds at 100000, 500000 and 2500000"
            - "the response reports projected_boost_bps == 75 as well, since one qualifying month's average equals the spot balance"
            - "a member whose enrolment is not ACTIVE would report current_boost_bps == 0 at any balance, because the band lookup is gated on enrollment status first"

      - name: consecutive_qualifying_months_resets_on_a_single_non_qualifying_month
        claim_type: correct_result
        grounds:
          - calculations.consecutive_qualifying_months
          - entities.DirectDepositEnrollment.fields.requalification_due_at
        distinguishing_aspect: "The trailing-run computation is chronological and resets rather than averaging: a qualifying September, a thin October and a qualifying November leave the count at 1, not at 2 of 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CALC-06 has an ACTIVE enrolment with a 100000-cent monthly threshold."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-CALC-06", full_name: "Wes Hollis", email: "wes@x.com" }
              as: Anonymous
              captures: { calc06_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${calc06_id}", product_line: "BANKING", balance_cents: 500000 }
              as: PlatformAdmin
              captures: { calc06_h_id: $.data.id }
            - call: "POST /benefits/holdings/${calc06_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${calc06_id}"
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${calc06_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { calc06_en_id: $.data.id }
            - call: "POST /benefits/members/${calc06_id}/deposits"
              payload: { enrollment_id: "${calc06_en_id}", amount_cents: 200000, posted_at: "2026-09-01T00:00:00Z", holding_id: "${calc06_h_id}" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${calc06_en_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "DirectDepositEnrollment.${calc06_en_id}.consecutive_qualifying_months == 1, because only September qualified and October and November had no posting at all"
            - "the count is a trailing run, so the single qualifying month survives the two empty months and does not fall to 0"
            - "requalification_due_at == 2026-12-01T00:00:00Z, the first instant three whole logical months after qualified_at"
            - "had November been funded and October left empty, the count would still be 1, because the run restarts at the month after the break"

      - name: benefit_entitlement_rollup_goes_none_partial_full_as_granted_rows_accumulate
        claim_type: correct_result
        grounds:
          - calculations.benefit_entitlement_reconciliation
          - entities.Member.fields.benefit_entitlement_state
          - endpoints.POST_/benefits/members/{member_id}/entitlements/reconcile
        distinguishing_aspect: "The member-level rollup moves through NONE, PARTIAL and FULL as the granted fraction of open holdings grows, and SUSPENDED wins over all three when the member is lapsed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CALC-07 holds an ADOPTED CAREER holding and an ADOPTED LENDING holding, with one GRANTED and one PENDING entitlement over them."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-CALC-07", full_name: "Xena Pace", email: "xena@x.com" }
              as: Anonymous
              captures: { calc07_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${calc07_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { calc07_hc_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${calc07_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { calc07_hl_id: $.data.id }
            - call: "POST /benefits/holdings/${calc07_hc_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${calc07_id}"
            - call: "POST /benefits/holdings/${calc07_hl_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${calc07_id}"
            - call: "POST /benefits/members/${calc07_id}/entitlements"
              payload: { source_holding_id: "${calc07_hc_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
              captures: { calc07_e1_id: $.data.id }
            - call: "POST /benefits/members/${calc07_id}/entitlements"
              payload: { source_holding_id: "${calc07_hl_id}", benefit_code: "LOAN_RATE_DISCOUNT", value_bps: 25 }
              as: BenefitsAdmin
              captures: { calc07_e2_id: $.data.id }
            - call: "POST /benefits/members/${calc07_id}/entitlements/reconcile"
              payload: {}
              as: ComplianceOfficer
              captures: { calc07_rows: $.data }
          trigger:
            - call: "POST /benefits/benefit-entitlements/${calc07_e1_id}/step-down"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "after the reconcile both rows are GRANTED and Member.${calc07_id}.benefit_entitlement_state == FULL, since every open holding's entitlement is granted"
            - "after the step-down, one row is STEPPED_DOWN and the state reads PARTIAL, since one of the two counted rows is still granted"
            - "GET /benefits/members/${calc07_id}/benefit-summary reports granted_count == 1 and stepped_down_count == 1"
            - "stepping the second row down as well drops the state to NONE"
            - "the rollup counts only rows whose source holding is not CLOSED, so a closed-holding entitlement is excluded from both numerator and denominator"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_is_checked_before_the_endpoint_body
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "Priority 1 fires before every existence and business check, so a bodyless request with no headers on an endpoint that also has an unresolvable member_id returns ERR_MISSING_AUTH_HEADERS rather than the 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No member exists."
          setup_api_calls:
            - *kc
          trigger:
            - call: "GET /benefits/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_MISSING_AUTH_HEADERS"
            - "error_id != ERR_MEMBER_NOT_FOUND, even though the member does not exist"
            - "the auth check is evaluated before the path-resource existence check"

      - name: participant_role_on_a_benefits_admin_endpoint_returns_forbidden_role
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles.Underwriter.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Priority 2 is a role-membership check rather than an ownership check: Underwriter is a declared role but is simply not listed on the rule-creation endpoint, so the refusal is ERR_FORBIDDEN_ROLE and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *kc
          trigger:
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "UW_TRY", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "GET /benefits/rate-discount-rules?status=DRAFT returns 0 rows"
            - "the same payload with as: BenefitsAdmin succeeds with 201"

      - name: unknown_resource_id_is_checked_before_the_state_precondition
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Existence outranks state, so a state-transition endpoint called on a wholly unallocated id returns the 404 rather than evaluating the transition's state precondition at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-V-003 exists with no holdings."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-V-003", full_name: "Yara Chen", email: "yara@x.com" }
              as: Anonymous
              captures: { v003_id: $.data.id }
          trigger:
            - call: "POST /benefits/holdings/00000000-0000-4000-8000-0000000000aa/adopt"
              payload: {}
              as: Member
              as_user_id: "${v003_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "error_id != ERR_INVALID_STATE"
            - "the existence check for the holding runs before any state evaluation"

      - name: entitlement_holding_not_adopted_outranks_duplicate_entitlement
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=29]
          - errors[ERR_HOLDING_NOT_ADOPTED]
        distinguishing_aspect: "Within the business blocks, the state-adjacent membership check at priority 7 sits above the uniqueness constraint at priority 29, so a duplicate declared against a non-adopted holding reports the membership error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-V-004 owns a PENDING CAREER holding and already carries a duplicate-matching entitlement row."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-V-004", full_name: "Zia Lund", email: "zia@x.com" }
              as: Anonymous
              captures: { v004_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${v004_id}", product_line: "CAREER", balance_cents: 0 }
              as: PlatformAdmin
              captures: { v004_h_id: $.data.id }
            - call: "POST /benefits/members/${v004_id}/entitlements"
              payload: { source_holding_id: "${v004_h_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
          trigger:
            - call: "POST /benefits/members/${v004_id}/entitlements"
              payload: { source_holding_id: "${v004_h_id}", benefit_code: "CAREER_COACHING_CREDIT", value_bps: 1 }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_HOLDING_NOT_ADOPTED"
            - "error_id != ERR_DUPLICATE_ENTITLEMENT even though the (member_id, benefit_code, source_holding_id) triple repeats"
            - "GET /benefits/benefit-entitlements?member_id=${v004_id} still returns exactly 1 row"

      - name: cascading_validation_enrollment_state_is_read_before_the_rule_is_priced
        claim_type: cascading_validation
        grounds:
          - validations[priority=19]
          - calculations.discount_stack_total_bps
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
        distinguishing_aspect: "The pricing check cannot run until the enrollment status has been resolved, so a requires_direct_deposit rule attached while the enrollment is in GRACE is refused on the enrollment rather than silently contributing zero basis points."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-V-005 has an ADOPTED LENDING holding, LoanAccount la, and a GRACE enrollment."
            - "Rule DD_REQ (DIRECT_DEPOSIT, ADDITIVE, 50 bps, requires_direct_deposit true) is ACTIVE."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-V-005", full_name: "Abe Kwan", email: "abe@x.com" }
              as: Anonymous
              captures: { v005_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${v005_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { v005_h_id: $.data.id }
            - call: "POST /benefits/holdings/${v005_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${v005_id}"
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "DD_REQ", discount_kind: "DIRECT_DEPOSIT", stacking_class: "ADDITIVE", discount_bps: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", requires_direct_deposit: true }
              as: BenefitsAdmin
              captures: { v005_r_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${v005_r_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${v005_id}", holding_id: "${v005_h_id}", loan_type: "PERSONAL", principal_cents: 500000, base_apr_bps: 1100 }
              as: Underwriter
              captures: { v005_la_id: $.data.id }
            - call: "POST /benefits/deposit-enrollments"
              payload: { member_id: "${v005_id}", required_monthly_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { v005_en_id: $.data.id }
            - call: "POST /benefits/members/${v005_id}/deposits"
              payload: { enrollment_id: "${v005_en_id}", amount_cents: 150000, posted_at: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${v005_en_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${v005_en_id}/lapse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /benefits/loan-accounts/${v005_la_id}"
              payload: {}
              as: Underwriter
              captures: { v005_la_v: $.data.version }
          trigger:
            - call: "POST /benefits/loan-accounts/${v005_la_id}/applications"
              payload: { rule_id: "${v005_r_id}", expected_loan_account_version: "${v005_la_v}" }
              as: BenefitsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "DirectDepositEnrollment.${v005_en_id}.status == GRACE"
            - "the response status is 409 and error_id == ERR_ENROLLMENT_NOT_ACTIVE"
            - "no DiscountApplication row is created and LoanAccount.${v005_la_id}.discount_stack_bps stays 0"
            - "activating the enrollment again makes the same call succeed, so the enrollment read was the cascading dependency"

      - name: aggregate_discount_stack_cap_is_validated_across_the_whole_application_set
        claim_type: aggregate_validation
        grounds:
          - validations[priority=25]
          - calculations.discount_stack_total_bps
          - errors[ERR_STACK_CAP_EXCEEDED]
        distinguishing_aspect: "The cap is an aggregate over the loan's whole candidate set rather than over the request: a third application that is individually small is refused only because the running total would cross STACK_CAP_BPS while asking to store the uncapped figure."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-V-006 has an ADOPTED LENDING holding with LoanAccount la and two APPLIED applications totaling 350 bps."
            - "A third CAP_CONTRIBUTING rule worth 100 bps is ACTIVE, and the uncapped sum would be 450."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-V-006", full_name: "Bea Moreno", email: "bea@x.com" }
              as: Anonymous
              captures: { v006_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${v006_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { v006_h_id: $.data.id }
            - call: "POST /benefits/holdings/${v006_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${v006_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${v006_id}", holding_id: "${v006_h_id}", loan_type: "PERSONAL", principal_cents: 700000, base_apr_bps: 1200 }
              as: Underwriter
              captures: { v006_la_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "AGG_BASE_200", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 200, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { v006_r1_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${v006_r1_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "AGG_ADD_150", discount_kind: "AUTOPAY", stacking_class: "ADDITIVE", discount_bps: 150, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { v006_r2_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${v006_r2_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/loan-accounts/${v006_la_id}/autopay-enrollment"
              payload: {}
              as: Member
              as_user_id: "${v006_id}"
            - call: "GET /benefits/loan-accounts/${v006_la_id}"
