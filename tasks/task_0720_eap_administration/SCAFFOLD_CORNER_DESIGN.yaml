            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Fk", external_ref: "EFK1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Fk", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
