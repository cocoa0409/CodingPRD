      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: SM3-001
          title: T
          format: LP
          weight_gram: 140
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 500
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 500
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      trigger:
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
        captures:
          err: $.data.error_id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
        captures:
          err2: $.data.error_id
      assert:
      - both events from QUEUED fail with ERR_TOOLING_JOB_INVALID_STATE; job remains QUEUED with attempt_count 0
  - name: test_pressing_double_review_rejected
    claim_type: invalid_transition
    grounds:
