            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { pp1: $.data } }
            - { call: "GET /parking/permits/${p2}", payload: {}, as: ParkingAdmin, captures: { pp2: $.data } }
          assert:
            - "pp1.status == EXPIRED (offer_expires_at 2026-08-04T09:00:00Z < sweep time)"
            - "pp2.status == OFFERED with offer_expires_at == 2026-08-07T09:00:01Z (promotion pass in the same run-ops)"
            - "prun.ops_run_index == 1"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: accept_on_unknown_permit_returns_not_found
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=6]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 6): ACCEPT on a well-formed but unknown permit id returns 404 ERR_NOT_FOUND, never ERR_PERMIT_NOT_OFFERED."
        test_recipe:
          setup: ["Empty DB (no permit exists)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parking/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_NOT_FOUND with http 404"
      - name: notice_publish_min_notice_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_NOTICE_EFFECTIVE_TOO_SOON]"
          - "state_machines.ServiceChangeNotice.DRAFT_to_PUBLISHED"
        distinguishing_aspect: "Publish requires effective_from >= now + 72h with an inclusive boundary: exactly +72h publishes; one second short returns 422 ERR_NOTICE_EFFECTIVE_TOO_SOON and the notice stays DRAFT."
        test_recipe:
          setup: ["Program; CORE lot; clock 2026-08-01T00:00:00Z; two DRAFT LOT_CLOSURE notices (N1 effective 2026-08-04T00:00:00Z = exactly +72h; N2 effective 2026-08-03T23:59:59Z = 1s short)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-V2" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/notices", payload: { notice_type: LOT_CLOSURE, headline: "N1", effective_from: "2026-08-04T00:00:00Z", lot_id: "${lot}" }, as: ParkingAdmin, captures: { n1: $.data.id } }
            - { call: "POST /parking/notices", payload: { notice_type: LOT_CLOSURE, headline: "N2", effective_from: "2026-08-03T23:59:59Z", lot_id: "${lot}" }, as: ParkingAdmin, captures: { n2: $.data.id } }
          trigger:
            - { call: "POST /parking/notices/${n1}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin, captures: { ok: $.data } }
            - { call: "POST /parking/notices/${n2}/events", payload: { event_type: PUBLISH }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "ok.status == PUBLISHED with published_at == 2026-08-01T00:00:00Z (boundary is inclusive)"
            - "err1 == ERR_NOTICE_EFFECTIVE_TOO_SOON with http 422; GET /parking/notices/${n2}.status remains DRAFT"
      - name: appeal_window_exactly_fourteen_days
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_APPEAL_WINDOW_CLOSED]"
          - "state_machines.Violation.NONE_to_APPEALED"
        distinguishing_aspect: "Appeal window closes after issued_at + 14 days inclusive: appeal at exactly +14 days succeeds; one second past returns ERR_APPEAL_WINDOW_CLOSED and appeal_status stays NONE."
        test_recipe:
          setup: ["Program pool 0; CORE lot; OPEN August cycle; E1 ACTIVE permit; violations V1 and V2 both issued 2026-08-05T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-V3", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: NO_PERMIT_DISPLAY }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v2: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations/${v1}/events", payload: { event_type: APPEAL }, as: Employee, as_user_id: "${e1}", captures: { ok: $.data } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T10:00:01Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations/${v2}/events", payload: { event_type: APPEAL }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
          assert:
            - "ok.appeal_status == APPEALED (appeal at exactly issued_at + 14 days is inside the inclusive window)"
            - "err1 == ERR_APPEAL_WINDOW_CLOSED with http 409; GET /parking/violations/${v2}.appeal_status remains NONE"
      - name: tow_violation_permit_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_VIOLATION_PERMIT_MISMATCH]"
        distinguishing_aspect: "Referential coherence is checked after state/safety/temporal all pass: a tow citing another permit's violation returns ERR_VIOLATION_PERMIT_MISMATCH even though the target permit is legitimately suspended and the cited violation is UNPAID."
        test_recipe:
          setup:
            - "Program threshold 3, tow_hold 48, pool 0; CORE lot capacity 5; OPEN August cycle"
            - "E1's permit ACTIVE then SUSPENDED by three WRONG_LOT violations at 2026-08-10T08:00:00Z; E2's permit ACTIVE with one WRONG_LOT violation V_B"
