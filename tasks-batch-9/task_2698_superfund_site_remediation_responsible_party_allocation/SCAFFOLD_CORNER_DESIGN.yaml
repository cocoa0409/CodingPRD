# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - breadth probe over SCAFFOLD.yaml sections 1.1-1.7
#
# Taxonomy: sections and claim_type values are taken verbatim from the
# scaffold-generator skill's references/claim-extraction-guide.md tables.
#
# Fixed operator identities (identical convention to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   rpm-001  RemedialProjectManager who creates sites and authors RI/FS documents
#   rpm-002  RemedialProjectManager who reviews and approves RI/FS documents
#   rpm-003  RemedialProjectManager who signs Records of Decision
#   af-001   AllocationFacilitator      sc-001  SettlementCounsel
#   cm-001   CommunityMember            ctr-001 unused (Contractor is entity-backed)
#   PRPRepresentative as_user_id == the PotentiallyResponsibleParty id it acts for
#   Contractor        as_user_id == the RemediationContract id it acts on
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_create_site_returns_envelope_with_every_derived_field_defaulted
        claim_type: creation
        grounds:
          - endpoints[POST /sites]
          - entities.Site.fields.listing_status
          - entities.Site.fields.cost_posture
          - entities.Site.fields.oversight_direct_cents
          - entities.Site.fields.total_response_cost_cents
        distinguishing_aspect: "A bare POST /sites returns 201 with response_type object, listing_status PROPOSED, cost_posture OPEN, version 1 and every derived cost/volume field at 0 - the create endpoint declares no derived inputs at all."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites"
              payload: { name: "Pellet Creek Battery Breaking", epa_region: 9, hrs_score: 34.50 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
          assert:
            - "HTTP 201 with meta.api_request_id present, meta.api_request_timestamp present and response_type == object"
            - "Site.${site_id}.name == Pellet Creek Battery Breaking, epa_region == 9, hrs_score == 34.50"
            - "Site.${site_id}.listing_status == PROPOSED and cost_posture == OPEN"
            - "Site.${site_id}.version == 1 and listing_reference == null"
            - "Site.${site_id}.oversight_direct_cents == 0, oversight_indirect_cents == 0, oversight_billed_cents == 0, total_response_cost_cents == 0, recovered_cost_cents == 0, orphan_write_off_cents == 0, unrecovered_cost_cents == 0"
            - "Site.${site_id}.verified_waste_volume_tons == 0, adopted_round_id == null, construction_complete_at == null, five_year_review_due_at == null"

      - name: corner_get_site_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /sites/{id}]
          - errors[ERR_SITE_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that names no Site yields 404 ERR_SITE_NOT_FOUND from the priority-4 existence gate, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database - no Site rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "GET /sites/8f14e45f-ceea-467a-9a36-dedd4bea2543"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and $.data.error_id == ERR_SITE_NOT_FOUND"
            - "$.data.message is a non-empty string and no data.id field is present"

      - name: corner_list_site_prps_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /sites/{id}/prps]
          - entities.PotentiallyResponsibleParty.fields.site_id
        distinguishing_aspect: "Three parties with limit 2 return exactly 2 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false and the ordering is created_at ASC, never id."
        test_recipe:
          setup:
            - "One LISTED site with exactly three PRPs created in a known order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Otter Slough Galvanizing", epa_region: 5, hrs_score: 33.10 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-OSG-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Otter Galvanizing Co", party_type: "OWNER_OPERATOR", viability_score: 70 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_1: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Slough Plating LLC", party_type: "GENERATOR", viability_score: 40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_2: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Riverbend Trucking", party_type: "TRANSPORTER", viability_score: 20 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_3: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}/prps?limit=2&offset=0"
              payload: {}
              as: SettlementCounsel
              as_user_id: "sc-001"
            - call: "GET /sites/${site_id}/prps?limit=2&offset=2"
              payload: {}
              as: SettlementCounsel
              as_user_id: "sc-001"
            - call: "GET /sites/${site_id}/prps?status=IDENTIFIED"
              payload: {}
              as: SettlementCounsel
              as_user_id: "sc-001"
          assert:
            - "the first page returns HTTP 200, response_type == array, exactly 2 rows in created_at ASC order (${prp_1} then ${prp_2}), total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second page returns exactly 1 row (${prp_3}), total_count == 3, offset == 2, has_more == false"
            - "the status filter returns all 3 rows because every party is still IDENTIFIED, total_count == 3, has_more == false"

      - name: corner_create_prp_missing_viability_score_returns_4XX
        claim_type: required_fields
        grounds:
          - endpoints[POST /sites/{id}/prps]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "viability_score is an input field with no default, so omitting it fails the priority-3 shape gate with 422 ERR_INVALID_REQUEST and creates no party row."
        test_recipe:
          setup:
            - "One LISTED site with no PRPs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Larkspur Foundry", epa_region: 6, hrs_score: 30.60 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-LKF-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Larkspur Castings Inc", party_type: "OWNER_OPERATOR" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /sites/${site_id}/prps returns total_count == 0 - no partial party row was written"

      - name: corner_create_prp_with_unknown_party_type_enum_returns_4XX
        claim_type: type_constraints
        grounds:
          - entities.PotentiallyResponsibleParty.fields.party_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "party_type is a closed enum (OWNER_OPERATOR | GENERATOR | TRANSPORTER | ARRANGER); the value LANDLORD is out of range and is refused with 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One LISTED site with no PRPs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Vetch Hollow Scrapyard", epa_region: 7, hrs_score: 31.40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-VHS-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Hollow Land Trust", party_type: "LANDLORD", viability_score: 55 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /sites/${site_id}/prps returns total_count == 0"

      - name: corner_waste_in_record_naming_an_unknown_prp_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /sites/{id}/waste-in-records]
          - validations[priority=5]
          - errors[ERR_PRP_NOT_FOUND]
          - entities.WasteInRecord.fields.prp_id
        distinguishing_aspect: "The site in the path exists but the body's prp_id names nothing, so the priority-5 body-reference gate answers 404 ERR_PRP_NOT_FOUND - a graph-topology FK is validated, not silently stored."
        test_recipe:
          setup:
            - "One LISTED site with no PRPs at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Quill Ridge Wood Treating", epa_region: 4, hrs_score: 37.20 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-QRW-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6", volume_tons: 500, toxicity_class: "II", evidence_grade: "B", disposal_year: 1979 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with $.data.error_id == ERR_PRP_NOT_FOUND"
            - "GET /sites/${site_id}/waste-in-records returns total_count == 0 and Site.${site_id}.verified_waste_volume_tons == 0"

      - name: corner_ownership_period_row_carries_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.OwnershipPeriod
          - endpoints[GET /sites/{id}/ownership-periods]
          - endpoints[POST /sites/{id}/ownership-periods]
        distinguishing_aspect: "OwnershipPeriod is declared common_fields: false, so its rows expose no version and no updated_at, and §1.5 declares no PATCH or DELETE path for /ownership-periods - the chain of title is append-only."
        test_recipe:
          setup:
            - "One LISTED site with one identified party and one recorded ownership period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Bittern Point Shipbreaking", epa_region: 1, hrs_score: 42.20 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-BPS-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Bittern Marine Works", party_type: "OWNER_OPERATOR", viability_score: 61 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/ownership-periods"
              payload: { prp_id: "${prp_a}", start_date: "1955-01-01", end_date: "1960-01-01", acquisition_type: "PURCHASE" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { op1: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}/ownership-periods"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
          assert:
            - "HTTP 200 with total_count == 1 and the single row's id == ${op1}"
            - "the row exposes site_id, prp_id, start_date, end_date, acquisition_type and ownership_days and NO version field and NO updated_at field"
            - "OwnershipPeriod.${op1}.ownership_days == 1826 (1955-01-01 to 1960-01-01 on the half-open interval, 1956 being a leap year)"
            - "PotentiallyResponsibleParty.${prp_a}.ownership_days_total == 1826"

      - name: corner_computed_volumetric_share_and_de_minimis_flag_on_prp
        claim_type: computed_fields
        grounds:
          - entities.PotentiallyResponsibleParty.fields.volumetric_share_pct
          - entities.PotentiallyResponsibleParty.fields.de_minimis_eligible
          - calculations.de_minimis_eligibility
        excluded_because:
          difficulty_instance: boundary_precision_check / de_minimis_share_exactly_at_ceiling_and_premium_exactly_at_floor
          rationale: "That instance asserts volumetric_share_pct == 1.00 and de_minimis_eligible == true for the small party and 99.00 / false for the large one from the same verified totals, which is exactly this computed-field claim at its boundary."

      - name: corner_system_fields_on_allocation_share_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.AllocationShare.fields.provisional_pct
          - entities.AllocationShare.fields.final_pct
          - entities.AllocationShare.fields.disposition
        excluded_because:
          difficulty_instance: dual_variant_calc / allocation_share_provisional_vs_final_diverge_on_waste_in_verification
          rationale: "AllocationShare rows are never created by a client call in that instance either; it asserts the server-minted provisional_pct, final_pct and disposition values end to end."

  - section: state_machines
    instances:

      - name: corner_new_allocation_round_starts_in_drafting_with_one_share_per_noticed_party
        claim_type: initial_state
        grounds:
          - state_machines.AllocationRound.initial_state
          - endpoints[POST /sites/{id}/allocation-rounds]
          - entities.AllocationRound.fields.share_count
          - entities.AllocationRound.fields.round_number
          - entities.AllocationShare.fields.provisional_pct
        distinguishing_aspect: "A freshly created round is DRAFTING with round_number 1, balloted_count 0, accept_share_pct 0.00, adopted_at null and exactly one PENDING share per non-IDENTIFIED party; the never-noticed party gets no share at all."
        test_recipe:
          setup:
            - "Site listed; parties A (3960 t class II, VERIFIED) and B (40 t class IV, VERIFIED) both PARTICIPATING; party D named but never noticed, so still IDENTIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Sablewood Creosote Yard", epa_region: 4, hrs_score: 45.90 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-SCY-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Sablewood Timber Co", party_type: "OWNER_OPERATOR", viability_score: 77 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Creek Road Tie Yard LLC", party_type: "GENERATOR", viability_score: 23 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_b: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Unlocated Successor Trust", party_type: "ARRANGER", viability_score: 5 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_d: $.data.id }
            - call: "POST /prps/${prp_a}/notice"
              payload: { notice_reference: "GNL-2027-2001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_b}/notice"
              payload: { notice_reference: "GNL-2027-2002" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_a}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /prps/${prp_b}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_b}"
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_a}", volume_tons: 3960, toxicity_class: "II", evidence_grade: "A", disposal_year: 1973 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_a: $.data.id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_b}", volume_tons: 40, toxicity_class: "IV", evidence_grade: "B", disposal_year: 1990 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_b: $.data.id }
            - call: "POST /waste-in-records/${w_a}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 3960 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /waste-in-records/${w_b}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 creosote in soil", exposure_medium: "SOIL" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { round_id: $.data.id }
          assert:
            - "HTTP 201 with AllocationRound.${round_id}.status == DRAFTING and round_number == 1"
            - "AllocationRound.${round_id}.share_count == 2, balloted_count == 0, accept_share_pct == 0.00, adopted_at == null, facilitator_user_id == af-001"
            - "AllocationRound.${round_id}.allocated_share_total_pct == 0.00, orphan_share_pct == 0.00, settled_share_pct == 0.00 (nothing is stamped before adoption)"
            - "GET /allocation-rounds/${round_id}/shares returns total_count == 2 in PotentiallyResponsibleParty.created_at ASC order: ${prp_a} then ${prp_b}"
            - "the ${prp_a} share has provisional_pct == 99.28, final_pct == null, disposition == PENDING, ballot == null"
            - "the ${prp_b} share has provisional_pct == 0.72, final_pct == null, disposition == PENDING, ballot == null"
            - "no share exists for ${prp_d} - a still-IDENTIFIED party is not a candidate"
            - "Site.${site_id}.version == ${site_v} + 1 and adopted_round_id == null"

      - name: corner_second_npl_listing_of_a_listed_site_returns_4XX
        claim_type: idempotency
        grounds:
          - state_machines.Site.PROPOSED_to_LISTED
          - validations[priority=10]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Re-posting the NPL listing on an already LISTED site is refused with 409 ERR_INVALID_STATE_TRANSITION and does not overwrite listing_reference or bump version - the transition is not idempotent."
        test_recipe:
          setup:
            - "One site already LISTED with listing_reference FR-2027-CRH-0104."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Cinder Ridge Coal Gasification", epa_region: 3, hrs_score: 51.80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-CRH-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { v_after_listing: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-CRH-9999" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with $.data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Site.${site_id}.listing_status == LISTED and listing_reference == FR-2027-CRH-0104 (the second reference was not stored)"
            - "Site.${site_id}.version == ${v_after_listing} - a refused transition bumps nothing"

      - name: corner_second_ballot_by_the_same_party_returns_4XX
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AllocationRound.BALLOTING_to_ADOPTED
          - entities.AllocationShare.fields.ballot
          - errors[ERR_BALLOT_ALREADY_CAST]
          - endpoints[POST /allocation-rounds/{id}/ballots]
        distinguishing_aspect: "A party that has already balloted on a round that has not been reopened is refused with 409 ERR_BALLOT_ALREADY_CAST; balloted_count stays 1 and the stored ballot keeps its original value even though the second call sends the opposite vote."
        test_recipe:
          setup:
            - "Site listed with two PARTICIPATING parties A 3960 t class II and B 40 t class IV, both VERIFIED; round in BALLOTING; A has cast ACCEPT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
