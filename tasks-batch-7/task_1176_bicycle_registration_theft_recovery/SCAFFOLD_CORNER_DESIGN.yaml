        claim_type: violation_to_error
        grounds: ["errors[ERR_RECOVERY_NOT_ACTIONABLE]", state_machines.RecoveryIntake.transitions, state_machines.OwnerClaim.transitions]
        distinguishing_aspect: "First approved claim wins: with two UNDER_REVIEW claims on two NOTIFIED matches of one intake, approving the second after the first succeeded fails ERR_RECOVERY_NOT_ACTIONABLE (intake check precedes the match check in the transition's precondition order, so this surfaces even though the sibling match is now EXPIRED)."
