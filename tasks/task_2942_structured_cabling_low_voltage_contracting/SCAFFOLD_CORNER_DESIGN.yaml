            - "GET /cabling/links/${link} returns routed_segment_count == 2"
            - "GET /cabling/pathway-segments/${seg_d} returns occupying_route_count == 0"

      - name: routing_is_checked_before_the_trade_milestone_on_a_pull
        claim_type: priority_ordering
        grounds:
          - validations[priority=115]
          - validations[priority=120]
          - errors[ERR_LINK_NOT_ROUTED]
          - errors[ERR_TRADE_NOT_COORDINATED]
        distinguishing_aspect: "With both preconditions unmet the pull reports ERR_LINK_NOT_ROUTED from priority 115, not ERR_TRADE_NOT_COORDINATED from priority 120; adding the route alone flips the answer to the coordination error, and confirming the milestone finally admits the pull."
        test_recipe:
          setup: ["Project RVT1 with room TR01 GROUNDED, tray PS-A, no trade coordination and link TR01-A01 with no routes"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
