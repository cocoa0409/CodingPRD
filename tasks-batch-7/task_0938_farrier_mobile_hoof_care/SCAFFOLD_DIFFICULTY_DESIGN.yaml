      - name: trip_fee_shares_always_sum_back_to_the_stop_fee
        grounds:
          - conservation_invariants.INV_TRIP_FEE_SPLIT
          - calculations.trip_fee_allocation
          - calculations.multi_horse_discount
          - state_machines.RouteStop.ARRIVED_to_COMPLETED
          - entities.RouteStop.fields.trip_fee_cents
          - entities.Invoice.fields.trip_fee_share_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity — CENTS of one stop's trip fee. A 7000-cent zone B fee
          split three ways gives 2334 / 2333 / 2333 in created_at order, and the three shares must
          re-sum to exactly 7000; the same stop with only two billable horses would give 3500 each,
          so removing a horse RAISES the survivors' shares.
        test_recipe:
          setup:
            - "A zone B barn with trip_fee_zone_b_cents 7000 on the active rate card."
            - "Three horses of one client, each with four TRIM lines, all attached to the same stop, all completed while the stop is ARRIVED."
