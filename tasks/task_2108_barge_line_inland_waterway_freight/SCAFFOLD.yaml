    code: 200
    input: ["harbor_name?", "limit?", "offset?"]
    output: FleetingBerth[]
    side_effects: []
  - method: POST
    path: "/fleeting-assignments"
    description: "Reserves berth space for a barge over a half-open interval, subject to the berth's aggregate capacity."
    roles: [HarborAgent]
    code: 201
