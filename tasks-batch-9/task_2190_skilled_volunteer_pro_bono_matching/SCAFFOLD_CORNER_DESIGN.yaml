            - {call: "GET /project-requests/${req_id}", as: ScopingSpecialist, as_user_id: "spec-1", captures: {req_v2: "$.data.version"}}
            - {call: "POST /project-requests/${req_id}/scope-definitions", as: ScopingSpecialist, as_user_id: "spec-1", payload: {expected_project_request_version: "${req_v2}", estimated_hours: 50.00, complexity_factor: 1.10, confidentiality_tier: STANDARD, ip_disposition: ASSIGN_TO_PARTNER}, captures: {scope2_id: "$.data.id"}}
