  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_state_vs_temporal_priority
        grounds:
          - validations[priority=5]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: the purchase is ALREADY REFUNDED
          (state violation, priority 5) AND the clock sits 20 days past purchase
          (temporal policy failure, priority 22.5). The state error ERR_INVALID_STATE
          must win because priority 5 < 22.5.
        test_recipe:
          setup:
            - "RELEASED title; purchase fully auto-refunded on day 0; clock then advanced 20 days"
          setup_api_calls:
            - call: "POST /storefront/_clock/set_current_utc"
