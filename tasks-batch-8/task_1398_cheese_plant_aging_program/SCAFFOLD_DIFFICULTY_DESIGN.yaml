  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: additive_quantity_conserved_across_start_and_cancel
        grounds:
          - state_machines.MakeSheet.SCHEDULED_to_IN_PROGRESS
          - state_machines.MakeSheet.IN_PROGRESS_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: AdditiveLot.quantity_on_hand. Forward action
          (make start consumes culture_units_planned + coagulant_ml_planned)
          paired with its compensating action (make cancel refunds both) MUST
          leave each lot's quantity_on_hand equal to its pre-start value.
        test_recipe:
          setup:
            - "RELEASED culture lot 100.0 units, coagulant 5000.0 mL; SCHEDULED make planning 10.0 units / 250.0 mL"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant Q", license_number: "WI-116" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 10.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
          trigger:
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/cancel", payload: {}, as: MakePlanner }
            - { call: "GET /plant/additive-lots/${cul_id}", payload: {}, as: QAGrader, captures: { cul_q: $.data.quantity_on_hand } }
            - { call: "GET /plant/additive-lots/${coa_id}", payload: {}, as: QAGrader, captures: { coa_q: $.data.quantity_on_hand } }
          assert:
            - "cul_q == 100.0 (invariant: quantity_on_hand unchanged by start+cancel pair)"
            - "coa_q == 5000.0"
            - "MakeSheet.${make_id}.status == CANCELLED"

      - name: aging_room_occupancy_conserved_across_place_and_remove
        grounds:
          - state_machines.AgingUnit.transitions
          - calculations.aging_room_posture
        distinguishing_aspect: |
          Different conserved quantity than instance 1: AgingRoom.wheels_present
          (an occupancy ledger, not a stock ledger). Placement (+wheel_count)
          paired with removal of the same unit (-wheel_count) MUST leave
          wheels_present at its pre-placement value and restore posture to
          AVAILABLE.
        test_recipe:
          setup:
            - "Room capacity 10 with 0 wheels; completed+released MUENSTER batch with 4 wheels placed then removed"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant R", license_number: "WI-117" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 4 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${plant_id}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 10, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 4, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 40.0, fat_dry_basis_pct: 50.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_carol" }
            - { call: "POST /plant/cheese-batches/${batch_id}/release", payload: {}, as: QAGrader }
          trigger:
            - { call: "POST /plant/aging-units/${unit_id}/remove", payload: {}, as: AgingRoomOperator }
            - { call: "GET /plant/aging-rooms/${room_id}", payload: {}, as: AgingRoomOperator, captures: { wheels_after: $.data.wheels_present, posture_after: $.data.posture } }
          assert:
            - "wheels_after == 0 (invariant: place(+4) + remove(-4) restores pre-placement occupancy)"
            - "posture_after == AVAILABLE"
            - "AgingUnit.${unit_id}.status == REMOVED"
