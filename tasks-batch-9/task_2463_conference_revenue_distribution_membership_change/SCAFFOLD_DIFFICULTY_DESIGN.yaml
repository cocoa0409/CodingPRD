              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_r_id}/request-revision"
              payload: { note: "Travel mileage and expense documentation do not support the claim" }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          trigger:
            - call: "POST /bowl-appearances/${ba_r_id}/resubmit"
              payload: { submitted_expense_cents: 4200000, travel_miles: 900, units_claimed: 1 }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /bowl-appearances/${ba_r_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "BowlAppearance.${ba_r_id}.revision_round == 1"
            - "BowlAppearance.${ba_r_id}.status == APPROVED"
            - "BowlAppearance.${ba_r_id}.allowable_expense_cents == 4200000 and .travel_allowance_cents == 85500"
            - "BowlAppearance.${ba_r_id}.reimbursement_band_bps == 8500 and .reimbursed_cents == 4285500"
            - "BowlAppearance.${ba_r_id}.residual_to_pool_cents == 1714500"
            - "BowlAppearance.${ba_r_id}.reimbursed_cents != 5100000, the amount the pre-revision claim would have drawn"
            - "Conference.escrow_balance_cents == 1714500 and Conference.validated_postseason_unit_count == 1"

      - name: member_withdrawal_notice_rescission_restores_full_share
        grounds:
          - state_machines.Member.FULL_SHARE_to_WITHDRAWAL_NOTICED
          - state_machines.Member.WITHDRAWAL_NOTICED_to_FULL_SHARE
          - calculations.exit_settlement_assessment
          - calculations.member_phase_schedule
        distinguishing_aspect: |
          Member returns to the exact state it left: WITHDRAWAL_NOTICED is reversible via
          rescind, which restores voting_weight_bps to 10000 and zeroes all five assessed
          exit fields, so the 305325000 cent settlement exists only while the notice
          stands - unlike DEPARTED, which the same machine reaches only through a
          WITHDRAW execution and never leaves.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget, a reserve of 18000000 cents after the FY2026 reserve draw, and four FULL_SHARE charter members."
            - "The FY2026 EQUAL_SHARE pool has been distributed FINAL_AUDITED, audited and POSTED, so every member's last_full_annual_distribution_cents is 147500000."
