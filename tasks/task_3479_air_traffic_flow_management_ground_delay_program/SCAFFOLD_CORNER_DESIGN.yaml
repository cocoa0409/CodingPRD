          rationale: "That instance moves F3's CTA to 13:00, before its 13:20 schedule, and pins provisional_delay_minutes == 0 — the zero-floor for early CTAs is asserted there."

      - name: compression_zero_release_no_moves
        claim_type: correct_result
        grounds:
