              payload: { decision: "APPROVE", review_note: "copy is compliant" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Anchor Housing Alliance", tier: "ANCHOR", branding_asset_ref: "brand/anchor.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_a_id: $.data.id }
            - call: "GET /advocacy/message-variants/${var_id}"
              payload: {}
              as: PartnerDelegate
              as_user_id: "${part_a_id}"
              captures: { var_v1: $.data.version }
            - call: "POST /advocacy/partner-endorsements"
              payload: { partner_id: "${part_a_id}", message_variant_id: "${var_id}", discipline_pledge: true, talking_points_ack: true, expected_variant_version: "${var_v1}" }
              as: PartnerDelegate
              as_user_id: "${part_a_id}"
            - call: "POST /advocacy/message-variants/${var_id}/lock"
              payload: {}
              as: MessageStrategist
              as_user_id: "u_strat_1"
            - call: "GET /advocacy/segments/${seg_id}"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { seg_v1: $.data.version }
            - call: "POST /advocacy/activations"
              payload: { campaign_id: "${camp_id}", segment_id: "${seg_id}", message_variant_id: "${var_id}", channel: "EMAIL", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", expected_segment_version: "${seg_v1}", min_viable_reach: 1 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { act_id: $.data.id, reserved_at_create: $.data.projected_reach }
            - call: "POST /advocacy/activations/${act_id}/clear"
              payload: { clearance_note: "consent evidence sampled" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/activations/${act_id}/start-send"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { delivery_sending: $.data.delivery_state }
          trigger:
            - call: "POST /advocacy/activations/${act_id}/complete"
              payload: { delivered_count: 1, bounced_count: 0 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { realized_in_response: $.data.realized_reach, cost_in_response: $.data.send_cost_cents, delivery_in_response: $.data.delivery_state }
            - call: "GET /advocacy/message-variants/${var_id}"
              payload: {}
              as: MessageStrategist
              as_user_id: "u_strat_1"
              captures: { var_reach: $.data.realized_reach_total, var_cost: $.data.send_cost_total_cents }
            - call: "GET /advocacy/supporters/${sup1_id}"
              payload: {}
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { reserved_after: $.data.touches_reserved, consumed_after: $.data.touches_consumed }
          assert:
            - "${reserved_at_create} == 1"
            - "${delivery_sending} == SENDING"
            - "${realized_in_response} == 1"
            - "${cost_in_response} == 2"
            - "${delivery_in_response} == SENT"
            - "${var_reach} == 1"
            - "${var_cost} == 2"
            - "${reserved_after} == 0"
            - "${consumed_after} == 1"
            - "Segment.${seg_id}.active_activation_count == 0"
