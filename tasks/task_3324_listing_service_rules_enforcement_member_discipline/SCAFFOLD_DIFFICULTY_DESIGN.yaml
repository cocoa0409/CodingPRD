            - "StatusChange for listing B has late_by_hours == 1 and auto_citation_id non-null"
      - name: credit_cap_exactly_at_cap_allowed_one_cent_over_rejected
        grounds:
          - entities.Association.fields.sanction_credit_cap_cents
          - errors[ERR_CREDIT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Zero/empty-set-style boundary on a different metric (credit balance, not
          hours) reached through a different endpoint (donate-credit): donating
          the exact remaining headroom lands the balance AT the cap and succeeds;
          one cent more is rejected with ERR_CREDIT_CAP_EXCEEDED — the metric is
          sanction_credit_balance_cents vs cap, distinct from the 48h lateness
          boundary.
