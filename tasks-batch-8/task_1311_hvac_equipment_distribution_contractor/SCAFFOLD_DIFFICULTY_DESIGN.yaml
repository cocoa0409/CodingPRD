              as: DistributorAdmin
              captures: { ap12_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c12_id}" }
              as: ContractorUser
              as_user_id: "${c12_id}"
              captures: { o12a_id: $.data.id }
            - call: "POST /api/v1/orders/${o12a_id}/lines"
              payload: { equipment_model_id: "${m12_id}", quantity: 2 }
              as: ContractorUser
              as_user_id: "${c12_id}"
            - call: "POST /api/v1/orders/${o12a_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c12_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c12_id}" }
              as: ContractorUser
              as_user_id: "${c12_id}"
              captures: { o12b_id: $.data.id }
            - call: "POST /api/v1/orders/${o12b_id}/lines"
              payload: { equipment_model_id: "${m12_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c12_id}"
          trigger:
            - call: "POST /api/v1/orders/${o12b_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c12_id}"
            - call: "GET /api/v1/allocation-pools/${ap12_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Order.${o12a_id}.status == ALLOCATED (available == quantity satisfied the inclusive boundary)"
            - "Order.${o12b_id}.status == BACKORDERED (available == 0 < 1)"
            - "AllocationPool.${ap12_id}.committed_qty == 2"
            - "AllocationPool.${ap12_id}.reserved_qty == 0"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency: different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_review_requires_registration_registered
        grounds:
          - state_machines.PartsClaim.SUBMITTED_to_UNDER_REVIEW
          - validations[priority=18]
          - errors[ERR_WARRANTY_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair PartsClaim -> WarrantyRegistration: BEGIN_REVIEW on a claim
          whose anchored registration is still PENDING_REGISTRATION (not yet
          registered) is rejected with ERR_WARRANTY_NOT_ACTIVE even though
          the claim itself is in a legal from-state.
        test_recipe:
          setup:
            - "Contractor C13; delivered order; registration W13 created but NOT registered (PENDING_REGISTRATION); claim PC13 SUBMITTED against W13; clock 2026-06-10 within the 60-day window"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Nu Air", license_number: "LIC-013" }
              as: DistributorAdmin
              captures: { c13_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-N13", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-N", list_price_cents: 800000 }
              as: DistributorAdmin
              captures: { m13_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c13_id}" }
              as: ContractorUser
              as_user_id: "${c13_id}"
              captures: { o13_id: $.data.id }
            - call: "POST /api/v1/orders/${o13_id}/lines"
              payload: { equipment_model_id: "${m13_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c13_id}"
            - call: "POST /api/v1/orders/${o13_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c13_id}"
            - call: "POST /api/v1/orders/${o13_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o13_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/warranty-registrations"
              payload: { serial_number: "SN-N13-001", equipment_model_id: "${m13_id}", contractor_id: "${c13_id}", order_id: "${o13_id}", install_date: "2026-06-05T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${c13_id}"
              captures: { w13_id: $.data.id }
            - call: "POST /api/v1/parts-claims"
              payload: { warranty_registration_id: "${w13_id}", contractor_id: "${c13_id}", failure_date: "2026-06-08T00:00:00Z", part_cost_cents: 50000, labor_cost_cents: 10000 }
              as: ContractorUser
              as_user_id: "${c13_id}"
              captures: { pc13_id: $.data.id }
          trigger:
            - call: "POST /api/v1/parts-claims/${pc13_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
              captures: { pc13_err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_WARRANTY_NOT_ACTIVE"
            - "PartsClaim.${pc13_id}.status remains SUBMITTED"

      - name: rebate_submit_requires_order_delivered
        grounds:
          - state_machines.RebateSubmission.DRAFT_to_SUBMITTED
          - validations[priority=17]
          - errors[ERR_REBATE_MISMATCH]
        distinguishing_aspect: |
          Pair RebateSubmission -> Order (different from PartsClaim ->
          WarrantyRegistration): submitting a dossier whose referenced order
          is merely SHIPPED (not DELIVERED) fails the cross-entity gate even
          though the dossier itself is DRAFT and all its own fields are valid.
        test_recipe:
          setup:
            - "Contractor C14; order O14 with a PREMIUM AHRI line in SHIPPED state; DRAFT RebateSubmission RB14 referencing O14"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Xi Air", license_number: "LIC-014" }
              as: DistributorAdmin
              captures: { c14_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-X14", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-M", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { ou14_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "IU-X14", equipment_type: "COIL", refrigerant_type: "NONE", capacity_btuh: 36000, family_code: "FAM-M", list_price_cents: 100000 }
              as: DistributorAdmin
              captures: { iu14_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-2014", outdoor_unit_id: "${ou14_id}", indoor_unit_id: "${iu14_id}", seer2: 17.0, eer2: 12.5 }
              as: DistributorAdmin
              captures: { r14_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c14_id}" }
              as: ContractorUser
              as_user_id: "${c14_id}"
              captures: { o14_id: $.data.id }
            - call: "POST /api/v1/orders/${o14_id}/lines"
              payload: { ahri_rating_id: "${r14_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c14_id}"
            - call: "POST /api/v1/orders/${o14_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c14_id}"
            - call: "POST /api/v1/orders/${o14_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/rebate-submissions"
              payload: { contractor_id: "${c14_id}", order_id: "${o14_id}", ahri_rating_id: "${r14_id}", program_type: "FEDERAL_TAX_CREDIT", homeowner_name: "X Home", install_address: "2 Oak Ave", install_date: "2026-08-02T00:00:00Z", docs: ["AHRI_CERTIFICATE", "INVOICE"] }
              as: ContractorUser
              as_user_id: "${c14_id}"
              captures: { rb14_id: $.data.id }
          trigger:
            - call: "POST /api/v1/rebate-submissions/${rb14_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c14_id}"
              captures: { rb14_err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (order not DELIVERED — cross-entity gate evaluated as a state precondition on the referenced order)"
            - "RebateSubmission.${rb14_id}.status remains DRAFT"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap: different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: prebuy_window_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.PreBuyProgram.fields.window_start
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) semantics on the PreBuyProgram resource:
          a second FAM-G program starting exactly at the first program's
          window_end is ALLOWED (adjacent, not overlapping), while one
          starting one second earlier overlaps and is rejected — adjacency
          is permitted under half-open semantics.
        test_recipe:
          setup:
            - "PreBuyProgram PG1 for FAM-G with window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "PG1", family_code: "FAM-G", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", ship_by_date: "2026-09-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { pg1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "PG2-ADJACENT", family_code: "FAM-G", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", ship_by_date: "2026-10-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { pg2_id: $.data.id }
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "PG3-OVERLAP", family_code: "FAM-G", window_start: "2026-08-31T23:59:59Z", window_end: "2026-10-01T00:00:00Z", ship_by_date: "2026-10-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { pg3_err: $.data.error_id }
          assert:
            - "first trigger call succeeds (201) — touching endpoints allowed under half-open semantics"
            - "second trigger call error_id == ERR_WINDOW_OVERLAP (one second earlier overlaps)"

      - name: instructor_closed_interval_with_buffer
        grounds:
          - validations[priority=11]
          - entities.TrainingCourse.fields.instructor_name
          - errors[ERR_INSTRUCTOR_CONFLICT]
        distinguishing_aspect: |
          Closed-interval-plus-buffer semantics on the TrainingCourse
          instructor resource (different resource and different geometry from
          the half-open PreBuyProgram): a session whose session_start equals
          another session's session_end OVERLAPS (closed intervals share the
          endpoint), and a session starting exactly one day after another's
          end also CONFLICTS because the 1-day buffer is required — only a
          start more than 1 day past the prior end is allowed.
        test_recipe:
          setup:
            - "TrainingCourse TC-A for instructor 'I Rivera' with session [2026-08-10T00:00:00Z, 2026-08-12T00:00:00Z] (closed)"
          setup_api_calls:
            - call: "POST /api/v1/training-courses"
              payload: { course_code: "TC-A", title: "R-454B Handling", credit_hours: 4, session_start: "2026-08-10T00:00:00Z", session_end: "2026-08-12T00:00:00Z", instructor_name: "I Rivera", max_seats: 20 }
              as: TrainingCoordinator
              captures: { tca_id: $.data.id }
          trigger:
            - call: "POST /api/v1/training-courses"
              payload: { course_code: "TC-B", title: "Advanced Diagnostics", credit_hours: 4, session_start: "2026-08-12T00:00:00Z", session_end: "2026-08-13T00:00:00Z", instructor_name: "I Rivera", max_seats: 20 }
              as: TrainingCoordinator
              captures: { tcb_err: $.data.error_id }
            - call: "POST /api/v1/training-courses"
              payload: { course_code: "TC-C", title: "Inverter Systems", credit_hours: 4, session_start: "2026-08-13T00:00:00Z", session_end: "2026-08-14T00:00:00Z", instructor_name: "I Rivera", max_seats: 20 }
              as: TrainingCoordinator
              captures: { tcc_err: $.data.error_id }
            - call: "POST /api/v1/training-courses"
              payload: { course_code: "TC-D", title: "Airflow Design", credit_hours: 4, session_start: "2026-08-14T00:00:00Z", session_end: "2026-08-15T00:00:00Z", instructor_name: "I Rivera", max_seats: 20 }
              as: TrainingCoordinator
              captures: { tcd_id: $.data.id }
          assert:
            - "TC-B rejected with ERR_INSTRUCTOR_CONFLICT (closed intervals share 2026-08-12)"
            - "TC-C rejected with ERR_INSTRUCTOR_CONFLICT (starts exactly 1 day after end; buffer requires strictly more than 1 day)"
            - "TC-D accepted (201) — starts more than 1 day after 2026-08-12 end"

  # =========================================================================
  # Rule 9 — compensating_invariant: different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pool_quantity_conserved_across_submit_cancel
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - calculations.allocation_consumption
          - entities.AllocationPool.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity: AllocationPool unit count. Invariant
          pool.reserved_qty + pool.committed_qty is identical before the
          submit and after the compensating cancel — the forward action
          (submit reserves 3) paired with its compensation (cancel releases
          3) leaves the pool ledger with zero drift.
        test_recipe:
          setup:
            - "AllocationPool AP15 for FAM-L: season covering clock 2026-08-05, total_qty 10, all free"
            - "Contractor C15 with model M15 in FAM-L; DRAFT order O15 quantity 3"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Omicron Air", license_number: "LIC-015" }
              as: DistributorAdmin
              captures: { c15_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-O15", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-L", list_price_cents: 600000 }
              as: DistributorAdmin
              captures: { m15_id: $.data.id }
            - call: "POST /api/v1/allocation-pools"
              payload: { family_code: "FAM-L", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", total_qty: 10 }
              as: DistributorAdmin
              captures: { ap15_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c15_id}" }
              as: ContractorUser
              as_user_id: "${c15_id}"
              captures: { o15_id: $.data.id }
            - call: "POST /api/v1/orders/${o15_id}/lines"
              payload: { equipment_model_id: "${m15_id}", quantity: 3 }
              as: ContractorUser
              as_user_id: "${c15_id}"
          trigger:
            - call: "POST /api/v1/orders/${o15_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c15_id}"
            - call: "POST /api/v1/orders/${o15_id}/cancel"
              payload: {}
              as: ContractorUser
              as_user_id: "${c15_id}"
            - call: "GET /api/v1/allocation-pools/${ap15_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "AllocationPool.${ap15_id}.reserved_qty == 0 after the cancel (conserved: 0 before submit, 0 after cancel)"
            - "AllocationPool.${ap15_id}.committed_qty == 0 after the cancel"
            - "Order.${o15_id}.status == CANCELLED"

      - name: accrual_balance_conserved_across_claim_and_reject
        grounds:
          - state_machines.CoopClaim.SUBMITTED_to_VERIFIED
          - state_machines.CoopClaim.VERIFIED_to_REJECTED
          - calculations.coop_accrual_calculation
          - entities.Contractor.fields.coop_accrual_final_cents
        distinguishing_aspect: |
          Conserved quantity: money (co-op accrual cents) — different
          conserved type from pool units. Filing a CoopClaim and then
          REJECTING it (the compensating action) leaves
          contractor.coop_accrual_final_cents unchanged; only a PAID claim
          may debit the balance.
        test_recipe:
          setup:
            - "Contractor C16 with one DELIVERED order of line total 10,000,000 cents -> coop_accrual_final_cents == 200000"
            - "CoopClaim CC16 of spend 50000 cents, verified then rejected"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Pi Air", license_number: "LIC-016" }
              as: DistributorAdmin
              captures: { c16_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-P16", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-K", list_price_cents: 10000000 }
              as: DistributorAdmin
              captures: { m16_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c16_id}" }
              as: ContractorUser
              as_user_id: "${c16_id}"
              captures: { o16_id: $.data.id }
            - call: "POST /api/v1/orders/${o16_id}/lines"
              payload: { equipment_model_id: "${m16_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c16_id}"
            - call: "POST /api/v1/orders/${o16_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c16_id}"
            - call: "POST /api/v1/orders/${o16_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o16_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/coop-claims"
              payload: { contractor_id: "${c16_id}", invoice_reference: "INV-AD-001", period: "2026-H2", spend_cents: 50000 }
              as: ContractorUser
              as_user_id: "${c16_id}"
              captures: { cc16_id: $.data.id }
            - call: "POST /api/v1/coop-claims/${cc16_id}/decision"
              payload: { action: "VERIFY" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/coop-claims/${cc16_id}/decision"
              payload: { action: "REJECT" }
              as: DistributorAdmin
            - call: "GET /api/v1/contractors/${c16_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "CoopClaim.${cc16_id}.status == REJECTED"
            - "Contractor.${c16_id}.coop_accrual_final_cents == 200000 (unchanged by the file-then-reject pair)"
            - "Contractor.${c16_id}.coop_accrual_provisional_cents == 200000"
