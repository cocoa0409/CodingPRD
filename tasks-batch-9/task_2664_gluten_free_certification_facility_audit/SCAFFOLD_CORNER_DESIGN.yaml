      - name: product_ingredient_link_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.ProductIngredient.common_fields
          - entities.ProductIngredient.fields.inclusion_pct
          - endpoints."GET /gfco/product-ingredients/{linkId}"
          - endpoints."POST /gfco/product-ingredients"
        distinguishing_aspect: |
          ProductIngredient is the scaffold's only `common_fields: false` entity: it
          carries id and created_at but no version and no updated_at, and SS1.5 declares no
          PUT, PATCH or DELETE for it, so a formula change is expressed by adding lines
          rather than editing them. A read of the link must therefore expose exactly four
          business fields plus the two identity fields.
