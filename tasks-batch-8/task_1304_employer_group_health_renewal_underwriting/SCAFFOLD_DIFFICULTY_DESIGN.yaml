# =============================================================================
# Scaffold Difficulty Design (Test Targeting Index) — §1.8
# Employer Group Health Renewal & Underwriting
# Every ground/call/field references SCAFFOLD.yaml §1.1–§1.7 verbatim.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claims_experience_conservative_margin_load
        grounds:
          - calculations.experience_rate
          - calculations.credibility_factor
          - state_machines.ClaimsExperience.SUBMITTED_to_REVIEWED
        distinguishing_aspect: |
          Claims-domain variant: identical claims economics (4000 net PEPM pre-trend, 24 months,
          completion 1.00) price at 5338 on a 500-life case (credibility 1.0 >= 0.5, base variant)
          but at 5871 on a 100-life case (credibility 0.2 < 0.5, conservative_experience variant
          adds the 10% margin load) — two valid approaches on the claims-cost domain diverge.
        test_recipe:
          setup:
            - "Case A: group_size 500, enrolled 400, claims 2024-01..2025-12 (24 months), total_paid 38400000, enrollment_months 9600, no large claims -> REVIEWED"
            - "Case B: group_size 100, enrolled 80, same per-capita claims (total_paid 7680000, enrollment_months 1920) -> REVIEWED"
            - "Logical clock untouched (default 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "BigCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { cA: "$.data.id" } }
            - { call: "POST /underwriting-cases/${cA}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { csA: "$.data.id" } }
            - { call: "POST /census-snapshots/${csA}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { clA: "$.data.id" } }
            - { call: "POST /claims-experiences/${clA}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /underwriting-cases", payload: { group_name: "MidCo", group_size: 100, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { cB: "$.data.id" } }
            - { call: "POST /underwriting-cases/${cB}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/census-snapshots", payload: { total_employees: 100, enrolled_employees: 80, dependent_count: 40, tier_distribution: { EE: 40, ES: 16, EC: 12, EF: 12 } }, as: Underwriter, captures: { csB: "$.data.id" } }
            - { call: "POST /census-snapshots/${csB}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 7680000, total_enrollment_months: 1920, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { clB: "$.data.id" } }
            - { call: "POST /claims-experiences/${clB}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
          trigger:
            - { call: "POST /claims-experiences/${clA}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /claims-experiences/${clB}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
          assert:
            - "UnderwritingCase.${cA}.experience_rate_cents == 5338"
            - "UnderwritingCase.${cA}.credibility_factor == 1.0"
            - "UnderwritingCase.${cB}.experience_rate_cents == 5871"
            - "UnderwritingCase.${cB}.credibility_factor == 0.2"
            - "UnderwritingCase.${cB}.experience_rate_cents - UnderwritingCase.${cA}.experience_rate_cents == 533"
      - name: blended_rate_cap_binds_vs_uncapped
        grounds:
          - calculations.blended_rate
          - entities.UnderwritingCase.fields.rate_cap_pct
          - entities.UnderwritingCase.fields.is_rate_cap_applied
          - state_machines.UnderwritingCase.CLAIMS_PENDING_to_RATING_IN_PROGRESS
        distinguishing_aspect: |
          Renewal-pricing-domain variant (distinct from the claims domain of
          claims_experience_conservative_margin_load): identical blended input (Z=1.0,
          experience 5338) yields blended_rate_cents == 4600 with is_rate_cap_applied == true
          when the current premium makes the 15% cap bind, but 5338 with
          is_rate_cap_applied == false when the cap does not bind.
        test_recipe:
          setup:
            - "Case A: group 500 / enrolled 400, current_premium_annual 19200000 (current PEPM 4000 -> cap 4600), claims reviewed (experience 5338)"
            - "Case B: identical but current_premium_annual 24000000 (current PEPM 5000 -> cap 5750)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "CapCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 19200000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { cA: "$.data.id" } }
            - { call: "POST /underwriting-cases/${cA}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { csA: "$.data.id" } }
            - { call: "POST /census-snapshots/${csA}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cA}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { clA: "$.data.id" } }
            - { call: "POST /claims-experiences/${clA}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /underwriting-cases", payload: { group_name: "FreeCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { cB: "$.data.id" } }
            - { call: "POST /underwriting-cases/${cB}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { csB: "$.data.id" } }
            - { call: "POST /census-snapshots/${csB}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${cB}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { clB: "$.data.id" } }
            - { call: "POST /claims-experiences/${clB}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
          trigger:
            - { call: "POST /claims-experiences/${clA}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /claims-experiences/${clB}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
          assert:
            - "UnderwritingCase.${cA}.blended_rate_cents == 4600"
            - "UnderwritingCase.${cA}.is_rate_cap_applied == true"
            - "UnderwritingCase.${cA}.rate_cap_pct == 0.15"
            - "UnderwritingCase.${cB}.blended_rate_cents == 5338"
            - "UnderwritingCase.${cB}.is_rate_cap_applied == false"
  - rule_id: combinatorial_formula
    instances:
      - name: actuarial_value_multi_factor_clamp
        grounds:
          - calculations.actuarial_value
          - calculations.plan_relativity
          - state_machines.BenefitPlanDesign.DRAFT_to_MODELED
        distinguishing_aspect: |
          Mode (a) combinatorial: actuarial_value combines >= 3 inputs (deductible, coinsurance,
          OOP max, copays) with non-linear interaction (multiplicative coinsurance factor,
          max(0,...) OOP excess, [0.50, 1.00] clamp); plan B prices at AV 0.8123 and relativity
          0.8123 against the reference plan's 1.0000/1.0.
        test_recipe:
          setup:
            - "Case in RATING_IN_PROGRESS (group 500, enrolled 400, premium 24000000, claims reviewed)"
            - "Reference plan R (ded 0, coins 1.0, oop 200000, copays 0) and buy-down plan B (ded 250000, coins 0.8, oop 500000, copays 2500/5000) both DRAFT"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "AVCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Reference PPO", deductible_individual: 0, deductible_family: 0, oop_max_individual: 200000, oop_max_family: 400000, coinsurance_pct: 1.0, copay_primary: 0, copay_specialist: 0, employer_contribution_pct: 0.8, contribution_strategy: "PERCENTAGE", is_reference_plan: true }, as: Underwriter, captures: { pR: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Buydown PPO", deductible_individual: 250000, deductible_family: 500000, oop_max_individual: 500000, oop_max_family: 1000000, coinsurance_pct: 0.8, copay_primary: 2500, copay_specialist: 5000, employer_contribution_pct: 0.75, contribution_strategy: "TIERED", is_reference_plan: false }, as: Underwriter, captures: { pB: "$.data.id" } }
          trigger:
            - { call: "POST /plan-designs/${pR}/model", payload: {}, as: Underwriter }
            - { call: "POST /plan-designs/${pB}/model", payload: {}, as: Underwriter }
          assert:
            - "BenefitPlanDesign.${pR}.actuarial_value == 1.0"
            - "BenefitPlanDesign.${pR}.relativity_factor == 1.0"
            - "BenefitPlanDesign.${pB}.actuarial_value == 0.8123"
            - "BenefitPlanDesign.${pB}.relativity_factor == 0.8123"
            - "BenefitPlanDesign.${pR}.status == MODELED"
            - "BenefitPlanDesign.${pB}.status == MODELED"
      - name: pepm_rounded_before_annual_multiplication
        grounds:
          - calculations.quote_pepm_rate
          - calculations.annual_premium
          - calculations.renewal_increase
          - state_machines.Quote.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct from instance one's mode (a)): nested rounding order is
          pinned — pepm_rate is rounded to whole cents FIRST (5338 x 0.8123 = 4336.0574 -> 4336),
          then annual_premium = rounded_pepm x 12 x enrolled = 20812800; the alternative order
          (unrounded 4336.0574 x 4800) would yield 20813076, so the order is observable.
        test_recipe:
          setup:
            - "Case in RATING_IN_PROGRESS (group 500, enrolled 400, premium 24000000, blended 5338 uncapped)"
            - "Reference plan R (AV 1.0000) and plan B (AV 0.8123, relativity 0.8123) both MODELED"
            - "Quote for plan B created in DRAFT with a fresh expected_case_version"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "RoundCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Reference PPO", deductible_individual: 0, deductible_family: 0, oop_max_individual: 200000, oop_max_family: 400000, coinsurance_pct: 1.0, copay_primary: 0, copay_specialist: 0, employer_contribution_pct: 0.8, contribution_strategy: "PERCENTAGE", is_reference_plan: true }, as: Underwriter, captures: { pR: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Buydown PPO", deductible_individual: 250000, deductible_family: 500000, oop_max_individual: 500000, oop_max_family: 1000000, coinsurance_pct: 0.8, copay_primary: 2500, copay_specialist: 5000, employer_contribution_pct: 0.75, contribution_strategy: "TIERED", is_reference_plan: false }, as: Underwriter, captures: { pB: "$.data.id" } }
            - { call: "POST /plan-designs/${pR}/model", payload: {}, as: Underwriter }
            - { call: "POST /plan-designs/${pB}/model", payload: {}, as: Underwriter }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${pB}", funding_type: "FULLY_INSURED", rate_guarantee_months: 12, enrollment_change_threshold: 0.1, expected_case_version: "${cv}" }, as: Underwriter, captures: { q: "$.data.id" } }
          trigger:
            - { call: "POST /quotes/${q}/propose", payload: {}, as: Underwriter }
          assert:
            - "Quote.${q}.pepm_rate_cents == 4336"
            - "Quote.${q}.annual_premium_cents == 20812800"
            - "Quote.${q}.renewal_increase_pct == -0.1328"
            - "Quote.${q}.broker_commission_cents == 832512"
            - "Quote.${q}.commission_disclosure_required == false"
            - "Quote.${q}.status == PROPOSED"
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_proposed_countered_cycle
        grounds:
          - state_machines.Quote.PROPOSED_to_COUNTERED
          - state_machines.Quote.COUNTERED_to_PROPOSED
          - state_machines.NegotiationRound
        distinguishing_aspect: |
          Quote entity is cyclic: PROPOSED -> COUNTERED -> PROPOSED -> COUNTERED loops are legal
          (negotiation rounds), and each pass appends a NegotiationRound while quote_number and
          pepm_rate_cents are preserved on the same quote row.
        test_recipe:
          setup:
            - "Case QUOTED with quote Q PROPOSED (reference plan, pepm 5338, annual 25622400, threshold 0.1)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "CycleCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Reference PPO", deductible_individual: 0, deductible_family: 0, oop_max_individual: 200000, oop_max_family: 400000, coinsurance_pct: 1.0, copay_primary: 0, copay_specialist: 0, employer_contribution_pct: 0.8, contribution_strategy: "PERCENTAGE", is_reference_plan: true }, as: Underwriter, captures: { p: "$.data.id" } }
            - { call: "POST /plan-designs/${p}/model", payload: {}, as: Underwriter }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 12, enrollment_change_threshold: 0.1, expected_case_version: "${cv}" }, as: Underwriter, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/propose", payload: {}, as: Underwriter }
          trigger:
            - { call: "POST /quotes/${q}/counter", payload: { proposed_pepm_cents: 5000, proposed_contribution_pct: 0.85, justification: "Client requests rate relief for budget cycle" }, as: Broker, as_user_id: "${b}" }
            - { call: "GET /quotes/${q}", payload: {}, as: Underwriter, captures: { st1: "$.data.status", nr1: "$.data.negotiation_round" } }
            - { call: "POST /quotes/${q}/respond", payload: { proposed_pepm_cents: 5200, proposed_contribution_pct: 0.82, justification: "Final offer after full experience review" }, as: Underwriter }
            - { call: "GET /quotes/${q}", payload: {}, as: Underwriter, captures: { st2: "$.data.status", nr2: "$.data.negotiation_round" } }
            - { call: "POST /quotes/${q}/counter", payload: { proposed_pepm_cents: 5100, proposed_contribution_pct: 0.84, justification: "Second counter with slightly higher contribution" }, as: Broker, as_user_id: "${b}" }
          assert:
            - "${st1} == COUNTERED"
            - "GET /underwriting-cases/${c} after first counter: status == NEGOTIATING"
            - "${st2} == PROPOSED"
            - "${nr2} == 2"
            - "GET /quotes/${q}/negotiation-rounds after second counter: total_count == 3"
            - "Quote.${q}.pepm_rate_cents == 5338 throughout the cycle"
      - name: case_quoted_negotiating_cycle
        grounds:
          - state_machines.UnderwritingCase.QUOTED_to_NEGOTIATING
          - state_machines.UnderwritingCase.NEGOTIATING_to_QUOTED
        distinguishing_aspect: |
          UnderwritingCase entity (distinct from Quote in the sibling instance) is cyclic:
          QUOTED -> NEGOTIATING -> QUOTED -> NEGOTIATING driven by alternating broker counter /
          underwriter respond actions, with no quote ever leaving its own cycle.
        test_recipe:
          setup:
            - "Case QUOTED with quote Q PROPOSED (reference plan, pepm 5338)"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "LoopCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
