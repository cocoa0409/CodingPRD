# =============================================================================
# task_0615_workplace_giving — §1.9 Scaffold Corner Design (Coverage Index)
# Breadth probe over the claim-extraction-guide taxonomy. Every grounds:* resolves
# into SCAFFOLD.yaml §1.1-§1.7. Default clock = 2026-01-01T00:00:00Z.
# excluded_because: stubs cite §1.8 instances by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Program", "endpoints"]
        distinguishing_aspect: "POST /programs with only name+tax_year returns 201; defaults applied (match_ratio 0.5, status DRAFT, version 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id", ver: "$.data.version" }
          assert:
            - "Response status 201"
            - "Program.${prog_id}.status == DRAFT"
            - "Program.${prog_id}.match_ratio == 0.5"
            - "Program.${prog_id}.annual_match_cap_cents == 100000"
            - "Program.${prog_id}.version == 1"

      - name: program_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Program", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{nonexistent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_employee_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Employee", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /employees without full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "e@co.com", annual_salary_cents: 1000000 }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_donation_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Donation.fields.donation_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /donations with donation_type='WEEKLY' (not in {ONE_TIME,RECURRING}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["ACTIVE program, APPROVED charity, LIVE campaign, ACTIVE employee"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C", ein: "30-3030303" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "en@co.com", full_name: "En", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "C", goal_cents: 100000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "WEEKLY", funding_method: "CREDIT", base_amount_cents: 1000 }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: charity_bad_ein_format_on_approve_rejected
        claim_type: Type Constraints
        grounds: ["entities.Charity.fields.ein", "state_machines.Charity.UNDER_REVIEW_to_APPROVED", "errors[ERR_CHARITY_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Charity created with EIN '123456789' (no dash) cannot be APPROVED -> ERR_CHARITY_NOT_ELIGIBLE on approve."
        test_recipe:
          setup: ["ACTIVE program; charity UNDER_REVIEW with malformed EIN"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "BadEin", ein: "31-3131313", claimed_501c3: false }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_CHARITY_NOT_ELIGIBLE (claimed_501c3 false blocks approval)"

      - name: employee_system_fields_ignored_on_create
        claim_type: System Fields
        grounds: ["entities.Employee.fields.match_consumed_ytd_cents", "entities.Employee.fields.status"]
        distinguishing_aspect: "Newly created Employee has match_consumed_ytd_cents 0, dfd_consumed_ytd_cents 0, status ACTIVE regardless of any client-sent values."
        test_recipe:
          setup: ["A program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "sf@co.com", full_name: "Sf", annual_salary_cents: 9000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
          assert:
            - "Employee.${emp_id}.match_consumed_ytd_cents == 0"
            - "Employee.${emp_id}.dfd_consumed_ytd_cents == 0"
            - "Employee.${emp_id}.status == ACTIVE"

      - name: duplicate_ein_in_program_rejected
        claim_type: Type Constraints
        grounds: ["entities.Charity.fields.ein", "errors[ERR_DUPLICATE_EIN]"]
        distinguishing_aspect: "Two charities with the same EIN in one program: the second (non-REJECTED first) is rejected with ERR_DUPLICATE_EIN."
        test_recipe:
          setup: ["A program with an existing SUBMITTED charity ein 32-3232323"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "First", ein: "32-3232323" }
              as: GivingAdmin
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Second", ein: "32-3232323" }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_DUPLICATE_EIN"

      - name: duplicate_employee_email_in_program_rejected
        claim_type: Type Constraints
        grounds: ["entities.Employee.fields.email", "errors[ERR_DUPLICATE_EMPLOYEE_EMAIL]"]
        distinguishing_aspect: "Second employee with same email in one program is rejected with ERR_DUPLICATE_EMPLOYEE_EMAIL."
        test_recipe:
          setup: ["A program with an existing employee dup@co.com"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "dup@co.com", full_name: "First", annual_salary_cents: 5000000 }
              as: GivingAdmin
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "dup@co.com", full_name: "Second", annual_salary_cents: 5000000 }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_DUPLICATE_EMPLOYEE_EMAIL"

      - name: list_employees_paginated_envelope
        claim_type: Listing
        grounds: ["entities.Employee", "endpoints"]
        distinguishing_aspect: "GET /employees?program_id=.. returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A program with one employee"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "l@co.com", full_name: "L", annual_salary_cents: 5000000 }
              as: GivingAdmin
              captures: { e1: "$.data.id" }
          trigger:
            - call: "GET /employees?program_id=${prog_id}&limit=10&offset=0"
              payload: {}
              as: GivingAdmin
          assert:
            - "Response status 200; response_type == array"
            - "meta pagination total_count == 1 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: charity_approve_from_submitted_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Charity.UNDER_REVIEW_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a charity that is still SUBMITTED (never started review) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A program with a SUBMITTED charity"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "S", ein: "34-3434343" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
          trigger:
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Charity.${charity_id}.status == SUBMITTED (unchanged)"

      - name: charity_reject_is_terminal_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Charity.UNDER_REVIEW_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED charity cannot be started for review again -> ERR_INVALID_STATE (REJECTED is terminal)."
        test_recipe:
          setup: ["A REJECTED charity"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "R", ein: "35-3535353" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/reject"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Charity.${charity_id}.status == REJECTED"

      - name: charity_review_rounds_bound_exceeded
        claim_type: cyclic
        grounds: ["state_machines.Charity.NEEDS_INFO_to_UNDER_REVIEW", "errors[ERR_MAX_REVIEW_ROUNDS]"]
        distinguishing_aspect: "After 3 review rounds, restarting review from NEEDS_INFO is rejected with ERR_MAX_REVIEW_ROUNDS (loop is bounded by review_rounds < 3)."
        test_recipe:
          setup: ["A charity that has cycled review until review_rounds == 3 and is in NEEDS_INFO"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Loop3", ein: "36-3636363" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/request-info"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/request-info"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/request-info"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_MAX_REVIEW_ROUNDS"
            - "Charity.${charity_id}.review_rounds == 3 (not incremented further)"

      - name: donation_settle_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: ["state_machines.Donation.AUTHORIZED_to_SETTLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling an already-SETTLED donation a second time -> ERR_INVALID_STATE (transitions are not idempotent)."
        test_recipe:
          setup: ["A SETTLED donation"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C", ein: "37-3737373" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "id@co.com", full_name: "Id", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "C", goal_cents: 100000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 5000 }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: donation_authorize_blocked_when_employee_not_active
        claim_type: guarded transitions
        grounds: ["state_machines.Donation.PLEDGED_to_AUTHORIZED", "errors[ERR_EMPLOYEE_NOT_ACTIVE]"]
        distinguishing_aspect: "Authorizing a donation whose donor Employee is SUSPENDED -> ERR_EMPLOYEE_NOT_ACTIVE (cross-entity guard Donation->Employee)."
        test_recipe:
          setup: ["A PLEDGED donation by an employee who is then SUSPENDED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C", ein: "38-3838383" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "sp@co.com", full_name: "Sp", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "C", goal_cents: 100000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 5000 }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
            - call: "POST /employees/${emp_id}/suspend"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_EMPLOYEE_NOT_ACTIVE"

      - name: program_close_blocked_with_open_batch
        claim_type: guarded transitions
        grounds: ["state_machines.Program.ACTIVE_to_CLOSED", "errors[ERR_OPEN_BATCH_EXISTS]"]
        distinguishing_aspect: "Closing a program while an OPEN DisbursementBatch exists -> ERR_OPEN_BATCH_EXISTS (cross-entity guard Program->DisbursementBatch)."
        test_recipe:
          setup: ["ACTIVE program; APPROVED charity; OPEN disbursement batch under the program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C", ein: "39-3939393" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /disbursement-batches"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: GivingAdmin
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /programs/${prog_id}/close"
              payload: {}
              as: ProgramManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status 409"
            - "data.error_id == ERR_OPEN_BATCH_EXISTS"
            - "Program.${prog_id}.status == ACTIVE (unchanged)"

      - name: refund_blocked_when_donation_disbursed
        claim_type: guarded transitions
        grounds: ["state_machines.Donation.SETTLED_to_REFUNDED", "errors[ERR_DONATION_DISBURSED]"]
        distinguishing_aspect: "Refunding a SETTLED donation that has a STAGED grant -> ERR_DONATION_DISBURSED."
        test_recipe:
          setup: ["SETTLED donation base 5000 staged into an OPEN batch as a DONATION grant"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C", ein: "40-4040404" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "rd@co.com", full_name: "Rd", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "C", goal_cents: 100000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 5000 }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
            - call: "POST /disbursement-batches"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: GivingAdmin
              captures: { batch_id: "$.data.id", batch_v0: "$.data.version" }
