scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: honeypot_plan_scoped_classification_variant
    grounds:
    - calculations.bot_classification
    - entities.Zone.fields.bot_classifications
    - calculations.plan_feature_matrix
    distinguishing_aspect: 'Same fingerprint and same client_ip produce HONEYPOT_BOT on a PRO zone

      (bot_classification feature on) but LIKELY_AUTOMATED on a FREE zone

      (feature off) — the dual variant lives on the classification domain

      and is selected purely by plan tier, not by request data.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - PRO account with ACTIVE FULL zone (one seeded proxied A record); FREE account with ACTIVE FULL zone.
      - Both zones have honeypot path '/trap-9' with a recorded hit from 203.0.113.9.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc_pro: $.data.id
      - call: POST /api/accounts
        payload:
          company_name: Free Corp
          plan_tier: FREE
          account_email: ops@free.example.com
        as: PlatformAdmin
        captures:
          acc_free: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc_pro}
          domain_name: pro.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.1
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc_pro}
        captures:
          zone_pro: $.data.id
      - call: POST /api/zones/${zone_pro}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc_pro}
      - call: POST /api/zones
        payload:
          account_id: ${acc_free}
          domain_name: free.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.2
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc_free}
        captures:
          zone_free: $.data.id
      - call: POST /api/zones/${zone_free}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc_free}
      - call: POST /api/zones/${zone_pro}/honeypots
        payload:
          url_path: /trap-9
        as: ZoneAdmin
        as_user_id: ${acc_pro}
      - call: POST /api/zones/${zone_pro}/honeypot-hits
        payload:
          client_ip: 203.0.113.9
          url_path: /trap-9
        as: ZoneAdmin
        as_user_id: ${acc_pro}
      - call: POST /api/zones/${zone_free}/honeypots
        payload:
          url_path: /trap-9
        as: ZoneAdmin
        as_user_id: ${acc_free}
      - call: POST /api/zones/${zone_free}/honeypot-hits
        payload:
          client_ip: 203.0.113.9
          url_path: /trap-9
        as: ZoneAdmin
        as_user_id: ${acc_free}
      trigger:
      - call: POST /api/zones/${zone_pro}/bot-classifications
        payload:
          request_fingerprint: fp-jz9
          verified_crawler: false
          client_ip: 203.0.113.9
        as: ZoneAdmin
        as_user_id: ${acc_pro}
        captures:
          cls_pro: $.data.classification
          score_pro: $.data.bot_score
      - call: POST /api/zones/${zone_free}/bot-classifications
        payload:
          request_fingerprint: fp-jz9
          verified_crawler: false
          client_ip: 203.0.113.9
        as: ZoneAdmin
        as_user_id: ${acc_free}
        captures:
          cls_free: $.data.classification
          score_free: $.data.bot_score
      assert:
      - 'PRO zone: classification == HONEYPOT_BOT and bot_score == 1'
      - 'FREE zone: classification == LIKELY_AUTOMATED and bot_score == 50'
      - Identical inputs (fp-jz9, verified_crawler=false, client_ip 203.0.113.9) yield different classifications purely because the plan tiers differ on the bot_classification feature
  - name: purge_completion_shield_degraded_variant
    grounds:
    - calculations.purge_request_status
    - entities.PurgeRequest.fields.origin_shield_degraded
    - entities.Zone.fields.origin_shield_pop_code
    distinguishing_aspect: 'Identical PURGE_ALL requests complete immediately on an unshielded zone

      but stay IN_PROGRESS until the 900-second shield latency elapses on a

      shielded zone — the dual variant lives on the PurgeRequest domain and

      is selected by origin_shield_pop_code alone.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - 'BUSINESS account (origin_shield feature on) with two ACTIVE FULL zones: zone_plain (no shield) and zone_shield (origin_shield_pop_code = SFO).'
      - Each zone has one PURGE_ALL request queued at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/pops
        payload:
          code: SFO
          capacity_baseline_gbps: 200
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: plain.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.10
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_plain: $.data.id
      - call: POST /api/zones/${zone_plain}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: shield.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.11
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_shield: $.data.id
      - call: POST /api/zones/${zone_shield}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone_shield}
        payload:
          origin_shield_pop_code: SFO
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/purge-requests
        payload:
          zone_id: ${zone_plain}
          purge_type: PURGE_ALL
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          pr_plain: $.data.id
      - call: POST /api/purge-requests
        payload:
          zone_id: ${zone_shield}
          purge_type: PURGE_ALL
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          pr_shield: $.data.id
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:01Z'
        as: PlatformAdmin
      - call: GET /api/zones/${zone_plain}
        payload: {}
        as: PlatformAdmin
        captures:
          plain_stamp: $.data.last_purged_at
      - call: GET /api/zones/${zone_shield}
        payload: {}
        as: PlatformAdmin
        captures:
          shield_stamp: $.data.last_purged_at
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:15:00Z'
        as: PlatformAdmin
      - call: GET /api/zones/${zone_shield}
        payload: {}
        as: PlatformAdmin
        captures:
          shield_stamp_after: $.data.last_purged_at
      assert:
      - plain_stamp == "2026-09-01T00:00:01Z" — the unshielded PURGE_ALL completed at the first clock advance past requested_at (latency 0), stamping Zone.last_purged_at
      - shield_stamp is null at +1s — the shielded request is still IN_PROGRESS (900s latency not elapsed), and PurgeRequest.${pr_shield}.origin_shield_degraded == true
      - After advancing the clock to 2026-09-01T00:15:00Z (900s later), shield_stamp_after == "2026-09-01T00:15:00Z"
      - Identical PURGE_ALL inputs diverge only because zone_shield.origin_shield_pop_code is set
- rule_id: combinatorial_formula
  instances:
  - name: dos_threshold_three_input_sensitivity_modes
    grounds:
    - calculations.dos_mitigation_effective_trigger
    - entities.Zone.fields.dos_sensitivity
    - entities.DdosEvent.fields.trigger_threshold_rps
    distinguishing_aspect: 'Mode (a): three inputs (baseline_rps x AUTO_THRESHOLD_MULTIPLIER x

      SENSITIVITY_MULTIPLIER[dos_sensitivity]) with conditional tier selection;

      identical baseline 100 and observed 1000 flips auto_mitigated between

      HIGH (threshold 1000, triggers) and LOW (threshold 4000, does not).

      '
    test_recipe:
      setup:
      - 'BUSINESS account (dos_sensitivity feature on) with two ACTIVE FULL zones: zone_high (dos_sensitivity HIGH) and zone_low (dos_sensitivity LOW).'
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: high.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.20
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_high: $.data.id
          zone_high_v: $.data.version
      - call: POST /api/zones/${zone_high}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_high_v2: $.data.version
      - call: PATCH /api/zones/${zone_high}
        payload:
          dos_sensitivity: HIGH
          expected_zone_version: ${zone_high_v2}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: low.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.21
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_low: $.data.id
      - call: POST /api/zones/${zone_low}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_low_v2: $.data.version
      - call: PATCH /api/zones/${zone_low}
        payload:
          dos_sensitivity: LOW
          expected_zone_version: ${zone_low_v2}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/zones/${zone_high}/ddos-events
        payload:
          observed_rps: 1000
          baseline_rps: 100
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          evt_high: $.data.id
      - call: POST /api/zones/${zone_low}/ddos-events
        payload:
          observed_rps: 1000
          baseline_rps: 100
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          evt_low: $.data.id
      assert:
      - DdosEvent.${evt_high}.trigger_threshold_rps == 1000 and auto_mitigated == true and status == ACTIVATED
      - DdosEvent.${evt_low}.trigger_threshold_rps == 4000 and auto_mitigated == false
      - Zone.${zone_high}.dos_mitigation_active == true while Zone.${zone_low}.dos_mitigation_active == false (visible on GET /api/zones/{id})
  - name: block_duration_single_rounding_order
    grounds:
    - calculations.block_duration_total
    - entities.IpBlock.fields.blocked_seconds_total
    distinguishing_aspect: 'Mode (b): rounding order is pinned — round_half_up is applied ONCE to

      (released_at - confirmed_at) * 0.975, never per-term. For a 3000-second

      confirmed window the total is 2925; a per-term rounding implementation

      would compute differently on non-integral products and is forbidden.

      '
    test_recipe:
      setup:
      - BUSINESS account with one ACTIVE FULL zone; a PROVISIONAL IpBlock for 198.51.100.7 created at 11:55, confirmed at 12:00 (expiry re-anchored to 13:00), extended at 12:30 (expiry 13:30), then read
        at 12:50 while still CONFIRMED.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T11:55:00Z'
        as: PlatformAdmin
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: biz.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.30
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/ip-blocks
        payload:
          zone_id: ${zone}
          ip: 198.51.100.7
          ip_version: V4
          reason: credential stuffing
        as: TrustSafetyAnalyst
        captures:
          blk: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T12:00:00Z'
        as: PlatformAdmin
      - call: POST /api/ip-blocks/${blk}/confirm
        payload: {}
        as: TrustSafetyAnalyst
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T12:30:00Z'
        as: PlatformAdmin
      - call: PATCH /api/ip-blocks/${blk}
        payload:
          extend: true
        as: TrustSafetyAnalyst
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T12:50:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /api/ip-blocks
        payload:
          zone_id: ${zone}
          ip: 198.51.100.7
        as: TrustSafetyAnalyst
        captures:
          dur: $.data[0].blocked_seconds_total
          exp: $.data[0].expires_at
      assert:
      - IpBlock.status == CONFIRMED at 12:50
      - blocked_seconds_total == 2925 (round_half_up(3000 * 0.975) computed once on the product; confirmed 12:00, read 12:50)
      - expires_at after the 12:30 extension == 2026-09-01T13:30:00Z (re-anchored at now + 3600s, never shortened)
- rule_id: non_linear_state_machine
  instances:
  - name: zone_redelegation_cycle
    grounds:
    - state_machines.Zone.MOVED_to_ACTIVE
    - state_machines.Zone.ACTIVE_to_MOVED
    distinguishing_aspect: 'Zone exhibits a true cycle ACTIVE -> MOVED -> ACTIVE: re-verification

      from MOVED restores ACTIVE but does NOT resurrect the enforcement rules

      the mark-moved cascade disabled — the loop is asymmetric by design.

      '
    test_recipe:
      setup:
      - PRO account with one FULL zone, verified ACTIVE, carrying one ACTIVE firewall rule.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: cycle.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.40
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: r1
            rule_kind: FIREWALL_FILTER
            expression: (http.request.uri.path contains "/admin")
            action: BLOCK
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.40
            proxied: false
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:01:00Z'
        as: PlatformAdmin
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.40
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_after: $.data.version
          rules_after: $.data.traffic_rules
      assert:
      - Zone.${zone}.status == ACTIVE after the MOVED -> ACTIVE re-verification (cycle completed)
      - traffic_rules[0].status == DISABLED — the drift cascade disabled it and re-verification does not restore it
      - Zone version == 6 after the chain (create v1, verify v2, PATCH rules v3, PATCH records v4, PATCH records v5, re-verify v6)
  - name: abuse_report_reconsideration_loop
    grounds:
    - state_machines.AbuseReport.ACTION_TAKEN_to_REVIEWING
    - state_machines.AbuseReport.REVIEWING_to_ACTION_TAKEN
    distinguishing_aspect: 'AbuseReport exhibits the REVIEWING <-> ACTION_TAKEN cycle: an analyst can

      take action, reconsider back to REVIEWING, and take action again — each

      pass increments version; terminal CLOSED is reachable only from

      ACTION_TAKEN or FORWARDED.

      '
    test_recipe:
      setup:
      - BUSINESS account with ACTIVE FULL zone; one abuse report (HOSTED routing) claimed to REVIEWING.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: loop.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.41
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/abuse-reports
        payload:
          zone_id: ${zone}
          reporter_email: victim@example.org
          category: PHISHING
          description: phishing kit
          target_url: https://loop.example.com/login
          reporter_trust_score: 45
        as: Anonymous
        captures:
          rep: $.data.id
      - call: POST /api/abuse-reports/${rep}/claim
        payload: {}
        as: TrustSafetyAnalyst
      trigger:
      - call: POST /api/abuse-reports/${rep}/disposition
        payload:
          disposition: TAKE_ACTION
        as: TrustSafetyAnalyst
      - call: POST /api/abuse-reports/${rep}/claim
        payload: {}
        as: TrustSafetyAnalyst
      - call: POST /api/abuse-reports/${rep}/disposition
        payload:
          disposition: TAKE_ACTION
        as: TrustSafetyAnalyst
      - call: POST /api/abuse-reports/${rep}/close
        payload: {}
        as: TrustSafetyAnalyst
        captures:
          rep_final: $.data.version
      assert:
      - The second take-action succeeds after reconsideration — REVIEWING -> ACTION_TAKEN -> REVIEWING -> ACTION_TAKEN -> CLOSED all valid
      - AbuseReport.${rep}.status == CLOSED and resolved_at is set
      - AbuseReport version at close == 6 (create v1 + claim + action + claim + action + close)
      - AbuseReport.${rep}.forwarded_at stays null — the report never passed through FORWARDED
- rule_id: transitive_cascade
  instances:
  - name: delegation_drift_disables_rules_then_blocks_new_rules
    grounds:
    - state_machines.Zone.ACTIVE_to_MOVED
    - validations[priority=5]
    distinguishing_aspect: 'Trigger 1 (delegation drift on clock advance): zone -> MOVED disables the firewall rule (hop 1); the zone being MOVED is itself the reason a subsequent PATCH to re-arm the rule
      fails with ERR_INVALID_STATE (hop 2: the cascade''s end-state, not the original drift, blocks the follow-up).'
    test_recipe:
      setup:
      - PRO account with ACTIVE FULL zone carrying one ACTIVE firewall rule; the zone's records are then replaced with a non-proxied set so delegation drifts.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: cascade.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.50
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: r1
            rule_kind: FIREWALL_FILTER
            expression: (ip.src eq 203.0.113.0/24)
            action: BLOCK
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.50
            proxied: false
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:01:00Z'
        as: PlatformAdmin
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: r1
            rule_kind: FIREWALL_FILTER
            expression: (ip.src eq 203.0.113.0/24)
            action: BLOCK
            status: ACTIVE
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - After the records replace plus clock advance, GET /api/zones/${zone} shows status == MOVED and traffic_rules[0].status == DISABLED (hop 1 cascade fired)
      - The PATCH re-arm on the MOVED zone fails with error_id == ERR_INVALID_STATE (hop 2)
  - name: rate_limit_trigger_creates_provisional_block
    grounds:
    - calculations.traffic_rule_trigger
    - state_machines.IpBlock
    distinguishing_aspect: 'Trigger 2 (traffic hit): the threshold-crossing hit creates a PROVISIONAL

      IpBlock (hop 1); the block''s existence is itself what blocks a duplicate

      IpBlock creation for the same ip with ERR_DUPLICATE_RESOURCE (hop 2) —

      a different propagation pattern from the mark-moved cascade.

      '
    test_recipe:
      setup:
      - PRO account with ACTIVE FULL zone carrying one ACTIVE RATE_LIMIT rule (threshold 3 rpm, action BLOCK).
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T10:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: ratelimit.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: api
            record_type: A
            content: 192.0.2.51
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: rl1
            rule_kind: RATE_LIMIT
            expression: (http.request.uri.path contains "/api")
            action: BLOCK
            rate_limit_threshold_rpm: 3
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T10:00:01Z'
          client_ip: 198.51.100.99
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T10:00:02Z'
          client_ip: 198.51.100.99
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T10:00:03Z'
          client_ip: 198.51.100.99
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          hit3: $.data.triggered_rule_names
          blk_auto: $.data.blocked_ip_block_id
      - call: POST /api/ip-blocks
        payload:
          zone_id: ${zone}
          ip: 198.51.100.99
          ip_version: V4
          reason: manual duplicate
        as: TrustSafetyAnalyst
        captures:
          err: $.data.error_id
      assert:
      - Third hit response has triggered_rule_names == ["rl1"] (window count reached threshold 3)
      - A PROVISIONAL IpBlock for 198.51.100.99 on the zone was created by the crossing hit (hop 1); blocked_ip_block_id names it
      - 'The manual duplicate IpBlock creation for the same ip fails with error_id == ERR_DUPLICATE_RESOURCE (hop 2: the cascade-created block rejects the follow-up)'
- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_beats_plan_feature_on_dos_sensitivity
    grounds:
    - validations[priority=6]
    - validations[priority=11]
    - errors.ERR_INVALID_STATE
    - errors.ERR_PLAN_FEATURE_UNAVAILABLE
    distinguishing_aspect: 'Pair state vs business_constraint: setting dos_sensitivity=HIGH on a

      MOVED zone of a FREE account (which lacks the dos_sensitivity feature)

      violates both rules; priority 6 (state) wins, so the error is

      ERR_INVALID_STATE (409), never ERR_PLAN_FEATURE_UNAVAILABLE (402).

      '
    test_recipe:
      setup:
      - FREE account with a zone that was verified ACTIVE and then DELETED.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Free Corp
          plan_tier: FREE
          account_email: ops@free.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: conflict.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.60
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: GET /api/zones/${zone}
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone_v_now: $.data.version
      - call: DELETE /api/zones/${zone}
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dos_sensitivity: HIGH
          expected_zone_version: ${zone_v_now}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE with http_status 409 — the state rule at priority 6 fires before the plan-feature rule at priority 11 (the PATCH carries dos_sensitivity=HIGH on a DELETED FREE zone)
      - error_id != ERR_PLAN_FEATURE_UNAVAILABLE even though the FREE tier genuinely lacks the dos_sensitivity feature
  - name: time_range_beats_overlap_on_maintenance_window
    grounds:
    - validations[priority=11]
    - validations[priority=12]
    - errors.ERR_INVALID_TIME_RANGE
    - errors.ERR_WINDOW_OVERLAP
    distinguishing_aspect: 'Pair business_temporal vs business_temporal with different error codes: a new window that is both inverted (end < start) and overlapping an existing window returns ERR_INVALID_TIME_RANGE
      (priority 12) ahead of ERR_WINDOW_OVERLAP (priority 13) — ordering within the temporal category is pinned.'
    test_recipe:
      setup:
      - PoP AMS with one existing window 2026-09-20T01:00:00Z to 2026-09-20T03:00:00Z.
      setup_api_calls:
      - call: POST /api/pops
        payload:
          code: AMS
          capacity_baseline_gbps: 100
        as: PlatformAdmin
        captures:
          pop: $.data.id
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-20T01:00:00Z'
          end_utc: '2026-09-20T03:00:00Z'
          headroom_pct: 50
        as: NetworkPlanner
      trigger:
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-20T04:00:00Z'
          end_utc: '2026-09-20T02:00:00Z'
          headroom_pct: 50
        as: NetworkPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_TIME_RANGE (422) — the inverted-range check at priority 12 fires before overlap at priority 13
      - error_id != ERR_WINDOW_OVERLAP even though the interval [04:00, 02:00) also collides with the existing window under naive arithmetic
- rule_id: boundary_precision_check
  instances:
  - name: rate_limit_threshold_exact_count
    grounds:
    - calculations.traffic_rule_trigger
    distinguishing_aspect: 'Metric = rolling-window hit count on the traffic-hits endpoint: with

      threshold 3, the 3rd hit inside the closed 60s window triggers

      (>= boundary) while the 2nd does not; a hit exactly 60 seconds older

      than the crossing hit is excluded from the window.

      '
    test_recipe:
      setup:
      - PRO account, ACTIVE zone, one RATE_LIMIT rule threshold=3 action=BLOCK.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: boundary.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: api
            record_type: A
            content: 192.0.2.70
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          traffic_rules:
          - name: rl1
            rule_kind: RATE_LIMIT
            expression: (http.request.uri.path contains "/login")
            action: BLOCK
            rate_limit_threshold_rpm: 3
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T09:00:00Z'
          client_ip: 198.51.100.20
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T09:01:00Z'
          client_ip: 198.51.100.20
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          h1: $.data.triggered_rule_names
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T09:01:01Z'
          client_ip: 198.51.100.20
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          h2: $.data.triggered_rule_names
      - call: POST /api/zones/${zone}/traffic-hits
        payload:
          occurred_at: '2026-09-01T09:01:02Z'
          client_ip: 198.51.100.20
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          h3: $.data.triggered_rule_names
      assert:
      - The 09:00:00Z hit is 60+ seconds before the 09:01:02Z hit and is EXCLUDED from its window (boundary is inclusive of occurred_at - 59s, exclusive beyond)
      - h1 == [] and h2 == [] (window counts 1 and 2, below threshold 3)
      - h3 == ["rl1"] (window count exactly 3 >= threshold 3 — the >= boundary triggers)
  - name: maintenance_window_half_open_boundary
    grounds:
    - validations[priority=13]
    - calculations.effective_pop_capacity
    distinguishing_aspect: 'Metric = interval adjacency on the maintenance-windows endpoint: a new

      window whose start_utc exactly equals an existing window''s end_utc does

      NOT conflict (half-open occupancy), while a window starting one second

      earlier does conflict with ERR_WINDOW_OVERLAP.

      '
    test_recipe:
      setup:
      - PoP SFO (baseline 200 Gbps) with one window 2026-09-10T02:00:00Z to 2026-09-10T04:00:00Z.
      setup_api_calls:
      - call: POST /api/pops
        payload:
          code: SFO
          capacity_baseline_gbps: 200
        as: PlatformAdmin
        captures:
          pop: $.data.id
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-10T02:00:00Z'
          end_utc: '2026-09-10T04:00:00Z'
          headroom_pct: 40
        as: NetworkPlanner
      trigger:
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-10T04:00:00Z'
          end_utc: '2026-09-10T06:00:00Z'
          headroom_pct: 60
        as: NetworkPlanner
        captures:
          pop_after: $.data.maintenance_windows
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-10T03:59:59Z'
          end_utc: '2026-09-10T05:00:00Z'
          headroom_pct: 60
        as: NetworkPlanner
        captures:
          err: $.data.error_id
      assert:
      - The 04:00:00Z-starting window succeeds — touching boundaries do not overlap under half-open semantics (maintenance_windows has 2 items)
      - The 03:59:59Z-starting window fails with error_id == ERR_WINDOW_OVERLAP (409)
      - GET /api/pops/${pop} with as_of_utc=2026-09-10T04:00:00Z and reserved_gbps=60 returns effective_capacity_gbps == 120 (floor(200*60/100)) — the first window no longer occupies 04:00, only the second
        does
- rule_id: cross_entity_state_dependency
  instances:
  - name: purge_request_blocked_on_pending_zone
    grounds:
    - state_machines.Zone
    - validations[priority=5]
    distinguishing_aspect: 'Pair PurgeRequest -> Zone: creating a purge request for a PENDING zone fails with ERR_INVALID_STATE because the child-creation precondition requires an ACTIVE zone — the purge''s
      reachability depends on the zone''s onboarding state, not on the purge''s own payload.'
    test_recipe:
      setup:
      - PRO account with one PENDING zone (record seeded, never verified).
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: gated.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.80
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      trigger:
      - call: POST /api/purge-requests
        payload:
          zone_id: ${zone}
          purge_type: PURGE_ALL
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (409)
      - no PurgeRequest row exists for the zone (GET /api/purge-requests?zone_id=... returns 0 rows)
  - name: abuse_forward_gated_by_zone_state
    grounds:
    - state_machines.AbuseReport.REVIEWING_to_FORWARDED
    - validations[priority=6]
    distinguishing_aspect: 'Pair AbuseReport -> Zone: forwarding a REVIEWING report fails with ERR_INVALID_STATE after the target zone drifts to MOVED (records replaced with a non-proxied set plus a clock
      advance) — the report''s valid transitions depend on the zone''s state, not just its own.'
    test_recipe:
      setup:
      - PRO account with ACTIVE PARTIAL zone; one REVIEWING abuse report on it; the zone's records are then replaced with a non-proxied set and the clock advanced so the zone drifts to MOVED.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: xdep.example.com
          onboarding_type: PARTIAL
          origin_host_email: abuse@originhost.example.net
          dns_records:
          - name: app
            record_type: CNAME
            content: app.cdn.example.net
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/abuse-reports
        payload:
          zone_id: ${zone}
          reporter_email: r@example.org
          category: MALWARE
          description: d
          target_url: https://xdep.example.com/m
          reporter_trust_score: 50
        as: Anonymous
        captures:
          rep: $.data.id
      - call: POST /api/abuse-reports/${rep}/claim
        payload: {}
        as: TrustSafetyAnalyst
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: app
            record_type: CNAME
            content: app.cdn.example.net
            proxied: false
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:01:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/abuse-reports/${rep}/disposition
        payload:
          disposition: FORWARD
        as: TrustSafetyAnalyst
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (409) — the forward precondition zone.status == ACTIVE fails after the drift to MOVED
      - AbuseReport.${rep}.status remains REVIEWING and forwarded_to stays null
- rule_id: resource_temporal_overlap
  instances:
  - name: maintenance_window_interval_overlap_semantics
    grounds:
    - validations[priority=13]
    - entities.Pop.fields.maintenance_windows
    distinguishing_aspect: 'Resource = Pop, semantics = half-open time intervals [start,end):

      overlap iff new.start < existing.end AND existing.start < new.end;

      exact adjacency (new.start == existing.end) is permitted.

      '
    test_recipe:
      setup:
      - PoP LAX with one window 2026-09-12T01:00:00Z to 2026-09-12T03:00:00Z.
      setup_api_calls:
      - call: POST /api/pops
        payload:
          code: LAX
          capacity_baseline_gbps: 150
        as: PlatformAdmin
        captures:
          pop: $.data.id
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-12T01:00:00Z'
          end_utc: '2026-09-12T03:00:00Z'
          headroom_pct: 50
        as: NetworkPlanner
      trigger:
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-12T02:30:00Z'
          end_utc: '2026-09-12T04:00:00Z'
          headroom_pct: 50
        as: NetworkPlanner
        captures:
          err_overlap: $.data.error_id
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-12T03:00:00Z'
          end_utc: '2026-09-12T05:00:00Z'
          headroom_pct: 50
        as: NetworkPlanner
        captures:
          pop_after: $.data.maintenance_windows
      assert:
      - The 02:30-starting window fails with error_id == ERR_WINDOW_OVERLAP (409)
      - The 03:00-starting window succeeds — adjacency at exactly the boundary is not an overlap; maintenance_windows now holds 2 items
  - name: bot_band_closed_interval_overlap_semantics
    grounds:
    - validations[priority=15]
    - entities.Zone.fields.bot_action_bands
    distinguishing_aspect: 'Resource = the zone''s bot-score band space, semantics = CLOSED integer

      intervals [min,max]: overlap iff new.min <= existing.max AND

      existing.min <= new.max; adjacency requires new.min == existing.max + 1

      — a different geometric treatment from the maintenance-window half-open

      rule, on a different resource.

      '
    test_recipe:
      setup:
      - PRO account (bot_classification feature on) with ACTIVE zone carrying one ACTIVE band [1, 20].
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: bands.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.90
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          bot_action_bands:
          - name: low-block
            action: BLOCK
            min_score: 1
            max_score: 20
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          bot_action_bands:
          - name: low-block
            action: BLOCK
            min_score: 1
            max_score: 20
          - name: mid-challenge
            action: CHALLENGE
            min_score: 20
            max_score: 40
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err_overlap: $.data.error_id
      - call: PATCH /api/zones/${zone}
        payload:
          bot_action_bands:
          - name: low-block
            action: BLOCK
            min_score: 1
            max_score: 20
          - name: mid-challenge
            action: CHALLENGE
            min_score: 21
            max_score: 40
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          bands_after: $.data.bot_action_bands
      assert:
      - The [20, 40] band fails with error_id == ERR_BAND_OVERLAP (409) — closed intervals share score 20
      - The [21, 40] band succeeds — adjacency at max+1 is permitted; bot_action_bands holds 2 items
- rule_id: compensating_invariant
  instances:
  - name: dns_record_content_restore_invariant
    grounds:
    - entities.Zone.fields.dns_records
    - state_machines.Zone
    distinguishing_aspect: 'Conserved quantity = the zone''s dns_records content: a PATCH replaces

      the record content with a new value and a compensating PATCH restores

      the original; the record set and the zone''s enforcement footprint are

      identical before and after the pair (only version advances).

      '
    test_recipe:
      setup:
      - PRO account with ACTIVE zone and one A record content 192.0.2.100 proxied=true.
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: invariant.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.100
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.200
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.100
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          recs_after: $.data.dns_records
          v_after: $.data.version
      assert:
      - dns_records[0].content == "192.0.2.100" after the forward/compensating pair — the conserved quantity is restored exactly
      - dns_records[0].proxied == true throughout (only content was mutated)
      - Zone version == 4 (create v1 + verify + two patches) — mutations are tracked even though the value round-trips
  - name: cache_stamp_conserved_on_unfinished_purge
    grounds:
    - calculations.cache_freshness_window
    - entities.Zone.fields.last_purged_at
    distinguishing_aspect: 'Conserved quantity = Zone.last_purged_at: a PURGE_ALL request that

      never completes (shield latency not yet elapsed) leaves the zone''s

      last_purged_at unchanged; only the completion transition stamps it —

      a partial purge chain leaves zero drift.

      '
    test_recipe:
      setup:
      - BUSINESS account with ACTIVE shielded zone (origin_shield_pop_code SFO), one QUEUED PURGE_ALL request submitted at 2026-09-01T00:00:00Z; clock advanced only 5 minutes (< 900s latency).
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/pops
        payload:
          code: SFO
          capacity_baseline_gbps: 200
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Biz Corp
          plan_tier: BUSINESS
          account_email: ops@biz.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: stamp.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.110
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: PATCH /api/zones/${zone}
        payload:
          origin_shield_pop_code: SFO
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: POST /api/purge-requests
        payload:
          zone_id: ${zone}
          purge_type: PURGE_ALL
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          pr: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:05:00Z'
        as: PlatformAdmin
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          stamp: $.data.last_purged_at
      assert:
      - Zone.${zone}.last_purged_at remains null — the shielded request is IN_PROGRESS at +300s but not COMPLETED, so the stamp is conserved unchanged
      - PurgeRequest.${pr}.origin_shield_degraded == true and requested_at == 2026-09-01T00:00:00Z
