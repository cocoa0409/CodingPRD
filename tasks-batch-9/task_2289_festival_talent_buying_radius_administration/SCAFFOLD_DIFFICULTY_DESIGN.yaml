              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_x}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_x}"
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_y}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 400000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 75, window_start_date: "2026-11-04", window_end_date: "2026-12-14", exclusivity_scope: "FULL" }
