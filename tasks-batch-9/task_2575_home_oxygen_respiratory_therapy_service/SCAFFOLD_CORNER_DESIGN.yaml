      - name: travel_authorization_interval_and_supply_limit_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=65]
          - validations[priority=75]
          - validations[priority=92]
          - calculations.travel_supply_authorization
        distinguishing_aspect: |
          The supply limit is a single-hour cliff: at a 30-hour trip the pinned pipeline authorises
          exactly 12 cylinders and the request is accepted, while a 31-hour trip crosses to 13 and is
          refused — the extra hour adds only 180 base litres but the 35% reserve and the ceiling
          division amplify it past a cylinder boundary, and the handling surcharge then rides on the
          pre-surcharge count.
        test_recipe:
          setup:
            - "Two branches; an ACTIVE_AMBULATORY patient at B1 with altitude_feet 500 and no compliance hold."
            - "A signed and approved certificate with prescribed_lpm 3.0, hours_per_day 24 and portable_prescribed true, plus a contract to hang the authorisations off."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { b1: $.data.id }
            - call: "POST /home-oxygen/branches"
              payload: { name: "Asheville", state_code: "NC", competitive_bid_area: false, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
