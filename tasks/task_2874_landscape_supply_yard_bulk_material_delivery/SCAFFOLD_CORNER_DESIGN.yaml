        distinguishing_aspect: "Every listed side effect of one stage-next fires together: the winner's queue_position becomes null, the two survivors are renumbered 1 and 2 (not left at 2 and 3), the winner's lot is pinned from the earliest BULK line, and the order moves CONFIRMED -> ALLOCATED."
