# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Hospital Cost Accounting & Service-Line Margin
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per rule (18 total).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tdabc_vs_rvu_identical_minutes_diverge
        grounds:
          - calculations.case_costing
          - entities.Case.fields.total_indirect_allocated
        distinguishing_aspect: |
          The same clinical activity (identical quantities) costed under a TDABC
          model versus an RVU model produces different total_indirect_allocated
          values on the Case entity — the divergence lives in the case-costing
          domain (not the budget domain of the sibling instance).
        test_recipe:
          setup:
            - "ServiceLine ORTHO (code ORTHO, base_direct_cost 9000.00, budgeted_volume 120) ACTIVE"
            - "CostCenter OR_MINS: allocated_cost 12000.00, capacity 8000 minutes, INDIRECT/VARIABLE, capacity_measure MINUTES (rate 1.50/min)"
            - "CostCenter OR_RVU: allocated_cost 12000.00, total_rvu 4000.0, INDIRECT/VARIABLE, capacity_measure RVU (rate 3.00/rvu)"
            - "CostCenter PERIOP: OVERHEAD/FIXED, allocated_cost 7000.00, capacity_measure NONE"
            - "CostModel M_TDABC on ORTHO: TDABC, rate_factor 1.20, overhead PERIOP, effective 2026-01, approved ACTIVE"
            - "CostModel M_RVU on ORTHO: RVU, rate_factor 1.00, overhead PERIOP, effective 2026-01, approved ACTIVE"
            - "Physician P1 ACTIVE; Drg D470 target 750.00 base_rate 30000.00"
            - "Case A under M_TDABC with one activity line: OR_MINS qty 100 (minutes), expected_reimbursement 30000.00"
            - "Case B under M_RVU with one activity line: OR_RVU qty 100 (rvu), expected_reimbursement 30000.00"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR RVU", code: "ORRVU", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "RVU", total_rvu: 4000.0 }
              as: FinanceController
              captures: { cc_rvu: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.20, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_tdabc: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_tdabc}/approve"
              payload: {}
              as: FinanceController
              captures: { m_tdabc_v: $.data.version }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-RVU", service_line_id: "${sl_ortho}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_rvu: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_rvu}/approve"
              payload: {}
              as: FinanceController
              captures: { m_rvu_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_tdabc}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_a: $.data.id }
            - call: "POST /cost-accounting/cases/${case_a}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_rvu}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_b: $.data.id }
            - call: "POST /cost-accounting/cases/${case_b}/activity-lines"
              payload: { cost_center_id: "${cc_rvu}", quantity: 100 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_a}/post"
              payload: { expected_model_version: "${m_tdabc_v}" }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_b}/post"
              payload: { expected_model_version: "${m_rvu_v}" }
              as: CostAnalyst
          assert:
            - "Case.${case_a}.total_indirect_allocated == 7180.00  (TDABC: activity round(100*1.50*1.20)=180.00 + overhead pool 7000.00)"
            - "Case.${case_b}.total_indirect_allocated == 7300.00  (RVU: activity round(100*3.00*1.00)=300.00 + overhead pool 7000.00)"
            - "Case.${case_a}.total_indirect_allocated != Case.${case_b}.total_indirect_allocated"

      - name: static_vs_flexed_overhead_budget_diverge
        grounds:
          - calculations.flex_budget
          - entities.BudgetPeriod.fields.flexed_overhead
        distinguishing_aspect: |
          The same BudgetPeriod (entity domain: budget, distinct from the Case
          costing domain of the sibling instance) reports a static baseline of
          7000.00 but a volume-flexed overhead of 9800.00 once actual indirect
          volume crosses the 20000 tier — two valid budget values for identical
          inputs.
        test_recipe:
          setup:
            - "ServiceLine CARD (code CARD, base_direct_cost 10000.00, budgeted_volume 60) ACTIVE"
            - "CostCenter LAB: INDIRECT/VARIABLE, allocated_cost 5000.00, total_rvu 2.0, capacity_measure RVU (2500/rvu)"
            - "CostCenter RAD: INDIRECT/VARIABLE, allocated_cost 9000.00, total_rvu 3.0, capacity_measure RVU (3000/rvu)"
            - "CostCenter PERIOP: OVERHEAD/FIXED, allocated_cost 7000.00, capacity_measure NONE"
            - "CostModel CARD-RVU on CARD: RVU, rate_factor 1.00, overhead PERIOP, effective 2026-01, ACTIVE"
            - "BudgetPeriod PERIOP/2026-08 static_budget_amount 7000.00 OPEN"
            - "One posted case in 2026-08 under CARD-RVU with LAB qty 4 and RAD qty 6 (pre-overhead activity 28000.00)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Cardiology", code: "CARD", base_direct_cost: 10000.00, budgeted_volume: 60 }
              as: FinanceController
              captures: { sl_card: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Radiology", code: "RAD", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 9000.00, capacity_measure: "RVU", total_rvu: 3.0 }
              as: FinanceController
              captures: { cc_rad: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
              captures: { phys2: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "291", description: "Heart failure", target_cost: 30000.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg291: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "CARD-RVU", service_line_id: "${sl_card}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_card: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_card}/approve"
              payload: {}
              as: FinanceController
              captures: { m_card_v: $.data.version }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-08", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_0800: $.data.id }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_card}", physician_id: "${phys2}", drg_id: "${drg291}", cost_model_id: "${m_card}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_c: $.data.id }
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_lab}", quantity: 4 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_rad}", quantity: 6 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_c}/post"
              payload: { expected_model_version: "${m_card_v}" }
              as: CostAnalyst
            - call: "GET /cost-accounting/budget-periods/${bp_0800}"
              payload: {}
              as: FinanceController
              captures: { bp_flexed: $.data.flexed_overhead, bp_variance: $.data.variance_amount, bp_dir: $.data.variance_direction }
          assert:
            - "BudgetPeriod.${bp_0800}.static_budget_amount == 7000.00"
            - "BudgetPeriod.${bp_0800}.actual_indirect_volume == 28000.00"
            - "BudgetPeriod.${bp_0800}.flexed_overhead == 9800.00   (tier 0.35 because 28000 > 20000)"
            - "BudgetPeriod.${bp_0800}.variance_amount == 2800.00 and variance_direction == UNFAVORABLE"
            - "static variant (7000.00) != flexed variant (9800.00) for identical period data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) tiered/branching, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: flex_budget_volume_tier_selection
        grounds:
          - calculations.flex_budget
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear conditional branching:
          tier rate (3 branches), actual_indirect_volume, and static_budget interact
          so that crossing the 20000.00 boundary flips the rate from 0.30 to 0.35
          and flips variance_direction at exactly 0.00.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE (base 9000.00); CostCenter OR_MINS rate 1.50/min INDIRECT; CostCenter PERIOP OVERHEAD allocated 7000.00"
            - "CostModel ORTHO-TDABC TDABC factor 1.00 overhead PERIOP ACTIVE"
            - "BudgetPeriod PERIOP/2026-09 static 7000.00 OPEN"
            - "Physician P1 ACTIVE; Drg D470"
            - "Case X posted with OR_MINS qty 13000 minutes -> activity 19500.00 (<=20000, tier 0.30)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-09", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_0900: $.data.id }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-09", expected_reimbursement: 40000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 13000 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-09", expected_reimbursement: 40000.00 }
              as: CostAnalyst
              captures: { case_y: $.data.id }
            - call: "POST /cost-accounting/cases/${case_y}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 334 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_y}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
            - call: "GET /cost-accounting/budget-periods/${bp_0900}"
              payload: {}
              as: FinanceController
          assert:
            - "After case X: actual_indirect_volume == 19500.00, flexed_overhead == 5850.00 (0.30 tier), variance == -1150.00 FAVORABLE"
            - "After case Y (334 min -> 501.00): actual_indirect_volume == 20001.00, flexed_overhead == 7000.35 (0.35 tier), variance == 0.35 UNFAVORABLE"
            - "Crossing 20000.00 flips both tier rate and variance direction"

      - name: per_line_round_then_sum_order_pinned
        grounds:
          - calculations.case_costing
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-per-activity-line
          THEN sum; the forbidden sum-then-round order yields a different cent value
          (32.46 vs 32.45) for identical inputs, so the order is observable.
        test_recipe:
          setup:
            - "ServiceLine NEURO (base 5000.00) ACTIVE"
            - "CostCenter OR_MINS2: allocated 12360.00, capacity 8000 -> rate 1.545/min, INDIRECT/VARIABLE, MINUTES"
            - "CostCenter PERIOP2 OVERHEAD allocated 100.00"
            - "CostModel NEURO-TDABC: TDABC, factor 1.00, overhead PERIOP2, effective 2026-01, ACTIVE"
            - "Physician P1, Drg D470"
            - "Case Z with three activity lines, each OR_MINS2 qty 7 minutes"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Neurosurgery", code: "NEURO", base_direct_cost: 5000.00, budgeted_volume: 40 }
              as: FinanceController
              captures: { sl_neuro: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes N", code: "ORMINS2", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12360.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins2: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop N", code: "PERIOP2", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 100.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop2: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Neurosurgery" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "NEURO-TDABC", service_line_id: "${sl_neuro}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop2}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_n: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_n}/approve"
              payload: {}
              as: FinanceController
              captures: { m_n_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_neuro}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_n}", period: "2026-08", expected_reimbursement: 20000.00 }
              as: CostAnalyst
              captures: { case_z: $.data.id }
            - call: "POST /cost-accounting/cases/${case_z}/activity-lines"
              payload: { cost_center_id: "${cc_mins2}", quantity: 7 }
              as: CostAnalyst
              captures: { line1: $.data.id }
            - call: "POST /cost-accounting/cases/${case_z}/activity-lines"
              payload: { cost_center_id: "${cc_mins2}", quantity: 7 }
              as: CostAnalyst
              captures: { line2: $.data.id }
            - call: "POST /cost-accounting/cases/${case_z}/activity-lines"
              payload: { cost_center_id: "${cc_mins2}", quantity: 7 }
              as: CostAnalyst
              captures: { line3: $.data.id }
          trigger:
            - call: "POST /cost-accounting/cases/${case_z}/post"
              payload: { expected_model_version: "${m_n_v}" }
              as: CostAnalyst
          assert:
            - "ActivityCostLine.${line1}.allocated_amount == 10.82 (round_half_up(7*1.545) per-line)"
            - "ActivityCostLine.${line2}.allocated_amount == 10.82"
            - "ActivityCostLine.${line3}.allocated_amount == 10.82"
            - "Case.${case_z}.total_indirect_allocated == 132.46 (32.46 activity + 100.00 overhead); sum-then-round would give 132.45"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: physician_deactivate_reactivate_cycle
        grounds:
          - state_machines.Physician.ACTIVE_to_INACTIVE
          - state_machines.Physician.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Physician has a cycle ACTIVE -> INACTIVE -> ACTIVE (entity: Physician);
          reactivation restores case-creation eligibility, and the loop can repeat.
        test_recipe:
          setup:
            - "Physician P3 registered ACTIVE (no cases referencing it)"
          setup_api_calls:
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000003", full_name: "Dr. Three", specialty: "ENT" }
              as: FinanceController
              captures: { phys3: $.data.id }
          trigger:
            - call: "POST /cost-accounting/physicians/${phys3}/deactivate"
              payload: {}
              as: FinanceController
            - call: "POST /cost-accounting/physicians/${phys3}/reactivate"
              payload: {}
              as: FinanceController
              captures: { phys3_status: $.data.status }
          assert:
            - "Physician.${phys3}.status == ACTIVE after the deactivate->reactivate loop"
            - "A second deactivate after reactivation succeeds (cycle repeats)"

      - name: refresh_approve_reject_branching_fork
        grounds:
          - state_machines.CostModelRefresh.PROPOSED_to_APPROVED
          - state_machines.CostModelRefresh.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          CostModelRefresh forks at PROPOSED into APPROVED (path to APPLIED with
          cascade) versus REJECTED (terminal, no side effects) — a branching
          fork on a different entity (CostModelRefresh) than the Physician cycle.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; CostCenter LAB 5000/2.0 RVU; CostCenter PERIOP OVERHEAD 7000"
            - "CostModel M ACTIVE on ORTHO (RVU, overhead PERIOP, effective 2026-01)"
            - "Refresh R1 proposed for M with LAB allocated 5100/2.0 (delta +2.00% <= 3.00, dq 90) -> approvable"
            - "Refresh R2 proposed for M with LAB allocated 5100/2.0 -> will be rejected"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-RVU", service_line_id: "${sl_ortho}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_rvu: $.data.id, m_rvu_v: $.data.version }
            - call: "POST /cost-accounting/cost-models/${m_rvu}/approve"
              payload: {}
              as: FinanceController
              captures: { m_rvu_v: $.data.version }
            - call: "POST /cost-accounting/cost-model-refreshes"
              payload: { model_id: "${m_rvu}", period: "2026-09", proposed_rates: [ { cost_center_id: "${cc_lab}", allocated_cost: 5100.00, total_rvu: 2.0 } ], data_quality_score: 90.0 }
              as: CostAnalyst
              captures: { r1: $.data.id }
            - call: "POST /cost-accounting/cost-model-refreshes"
              payload: { model_id: "${m_rvu}", period: "2026-09", proposed_rates: [ { cost_center_id: "${cc_lab}", allocated_cost: 5100.00, total_rvu: 2.0 } ], data_quality_score: 90.0 }
              as: CostAnalyst
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /cost-accounting/cost-model-refreshes/${r1}/approve"
              payload: { expected_model_version: "${m_rvu_v}" }
              as: FinanceController
              captures: { r1_status: $.data.status }
            - call: "POST /cost-accounting/cost-model-refreshes/${r2}/reject"
              payload: {}
              as: FinanceController
              captures: { r2_status: $.data.status }
          assert:
            - "CostModelRefresh.${r1}.status == APPROVED (branch 1)"
            - "CostModelRefresh.${r2}.status == REJECTED (branch 2)"
            - "REJECTED refresh apply attempt fails: POST /cost-model-refreshes/${r2}/apply -> ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: refresh_apply_cascade_depth3
        grounds:
          - state_machines.CostModelRefresh.APPROVED_to_APPLIED
          - calculations.case_costing
          - calculations.flex_budget
        distinguishing_aspect: |
          Depth-3 chain triggered by refresh apply: CostModelRefresh apply mutates
          CostCenter rates (hop 1); that rate change recomputes each POSTED Case's
          allocated amounts and ServiceLine rollup (hop 2); the case recompute
          recomputes BudgetPeriod.actual_indirect_volume / flexed_overhead /
          variance (hop 3). Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "ServiceLine CARD ACTIVE (base 10000.00)"
            - "CostCenter LAB 5000/2.0 RVU INDIRECT; CostCenter RAD 9000/3.0 RVU INDIRECT; CostCenter PERIOP OVERHEAD 7000"
            - "CostModel CARD-RVU ACTIVE (factor 1.00, overhead PERIOP, effective 2026-01), version 2"
            - "BudgetPeriod PERIOP/2026-08 static 7000 OPEN"
            - "Case C posted 2026-08 with LAB qty 4 + RAD qty 6 -> activity 28000.00, indirect 35000.00; version_at_post = 2"
            - "Refresh R proposed+approved: LAB -> 6000/2.0 (3000/rvu, +20% would be rejected... use 5150/2.0 = 2575, +3.00% exactly, allowed)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Cardiology", code: "CARD", base_direct_cost: 10000.00, budgeted_volume: 60 }
              as: FinanceController
              captures: { sl_card: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Radiology", code: "RAD", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 9000.00, capacity_measure: "RVU", total_rvu: 3.0 }
              as: FinanceController
              captures: { cc_rad: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
              captures: { phys2: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "291", description: "Heart failure", target_cost: 30000.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg291: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "CARD-RVU", service_line_id: "${sl_card}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_card: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_card}/approve"
              payload: {}
              as: FinanceController
              captures: { m_card_v: $.data.version }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-08", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_0800: $.data.id }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_card}", physician_id: "${phys2}", drg_id: "${drg291}", cost_model_id: "${m_card}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_c: $.data.id }
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_lab}", quantity: 4 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_rad}", quantity: 6 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_c}/post"
              payload: { expected_model_version: "${m_card_v}" }
              as: CostAnalyst
            - call: "POST /cost-accounting/cost-model-refreshes"
              payload: { model_id: "${m_card}", period: "2026-08", proposed_rates: [ { cost_center_id: "${cc_lab}", allocated_cost: 5150.00, total_rvu: 2.0 } ], data_quality_score: 95.0 }
              as: CostAnalyst
              captures: { r1: $.data.id }
            - call: "POST /cost-accounting/cost-model-refreshes/${r1}/approve"
              payload: { expected_model_version: "${m_card_v}" }
              as: FinanceController
          trigger:
            - call: "POST /cost-accounting/cost-model-refreshes/${r1}/apply"
              payload: {}
              as: FinanceController
            - call: "GET /cost-accounting/cases/${case_c}"
              payload: {}
              as: CostAnalyst
              captures: { c_ind: $.data.total_indirect_allocated, c_margin: $.data.margin }
            - call: "GET /cost-accounting/budget-periods/${bp_0800}"
              payload: {}
              as: FinanceController
              captures: { bp_vol: $.data.actual_indirect_volume, bp_flex: $.data.flexed_overhead }
          assert:
            - "CostCenter.${cc_lab}.allocated_cost == 5150.00 (hop 1: center rate updated)"
            - "Case.${case_c}.total_indirect_allocated == 35300.00 (hop 2: recompute — LAB 4*2575=10300.00 + RAD 18000.00 + overhead 7000.00)"
            - "Case.${case_c}.version_at_post == 3 (model version advanced by apply)"
            - "BudgetPeriod.${bp_0800}.actual_indirect_volume == 28300.00 and flexed_overhead == 9905.00 (hop 3: 0.35 * 28300.00)"

      - name: service_line_archive_cascade_depth2
        grounds:
          - state_machines.ServiceLine.ACTIVE_to_ARCHIVED
        distinguishing_aspect: |
          Depth-2 chain with a different trigger (service-line archive): archiving
          the ServiceLine mutates its CostModels to ARCHIVED (hop 1) which itself
          is a mutation on CostModel that would block further refresh proposals;
          and mutates PayerContracts to TERMINATED (hop 2 from the same archive,
          driven by the line cascade, not by a parallel fan-out — contracts
          terminate because the line archive cascades through its children).
        test_recipe:
          setup:
            - "ServiceLine NEURO ACTIVE (base 5000.00, volume 40)"
            - "CostCenter PERIOP2 OVERHEAD 100.00; CostModel NEURO-M created as DRAFT then... to allow archive, model must NOT be ACTIVE: keep it DRAFT then archive? No — archive precondition requires no ACTIVE model. Use: model M created DRAFT (never approved) and archived separately is not needed; instead: ACTIVE model archived first individually, then line archived. To keep the cascade observable: create model DRAFT, approve ACTIVE, archive model (allowed: no open cases/refreshes), then create a PayerContract ACTIVE on the line, then archive line -> contract terminates; plus a second DRAFT model on the line -> line archive cascades it to ARCHIVED."
            - "No cases on the line"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Neurosurgery", code: "NEURO", base_direct_cost: 5000.00, budgeted_volume: 40 }
              as: FinanceController
              captures: { sl_neuro: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop N", code: "PERIOP2", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 100.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop2: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "NEURO-DRAFT", service_line_id: "${sl_neuro}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop2}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_draft: $.data.id }
            - call: "POST /cost-accounting/payer-contracts"
              payload: { service_line_id: "${sl_neuro}", payer_name: "Medicare", payer_type: "MEDICARE", contracted_rate: 30000.00, effective_period: "2026-01" }
              as: FinanceController
              captures: { pc_mc: $.data.id }
          trigger:
            - call: "POST /cost-accounting/service-lines/${sl_neuro}/archive"
              payload: {}
              as: FinanceController
            - call: "GET /cost-accounting/cost-models/${m_draft}"
              payload: {}
              as: FinanceController
              captures: { m_status: $.data.status }
            - call: "GET /cost-accounting/payer-contracts/${pc_mc}"
              payload: {}
              as: FinanceController
              captures: { pc_status: $.data.status }
          assert:
            - "ServiceLine.${sl_neuro}.status == ARCHIVED"
            - "CostModel.${m_draft}.status == ARCHIVED (hop 1 cascade)"
            - "PayerContract.${pc_mc}.status == TERMINATED (hop 2 cascade from the same archive)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_case_post
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_referential (priority 6):
          a case in POSTED status re-posted with a payload whose expected_model_version
          is stale must fail with the state error ERR_INVALID_STATE (case not DRAFT),
          NOT the OCC/referential ERR_STALE_MODEL_VERSION — priority 4 wins.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; CC OR_MINS 12000/8000 MINUTES; CC PERIOP OVERHEAD 7000; model M TDABC factor 1.00 ACTIVE v2; physician P1; drg D470"
            - "Case X posted (status POSTED) with OR_MINS qty 100"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats the OCC/referential failure the stale version 1 would also trigger)"

      - name: business_safety_beats_business_constraint_on_refresh
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair business_safety (priority 7: variance/data-quality governance)
          vs business_constraint (priority 8): a refresh approval that violates BOTH
          the variance threshold (>3.00%) and would also hit a constraint fails with
          ERR_REFRESH_VARIANCE_EXCEEDED, the safety-class error — priority 7 wins
          over priority 8.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; CC LAB 5000/2.0 RVU; CC PERIOP OVERHEAD 7000; model M RVU ACTIVE v2"
            - "Refresh R proposed: LAB -> 5200/2.0 (delta +4.00% > 3.00 threshold), data_quality 95"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-RVU", service_line_id: "${sl_ortho}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_rvu: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_rvu}/approve"
              payload: {}
              as: FinanceController
              captures: { m_rvu_v: $.data.version }
            - call: "POST /cost-accounting/cost-model-refreshes"
              payload: { model_id: "${m_rvu}", period: "2026-09", proposed_rates: [ { cost_center_id: "${cc_lab}", allocated_cost: 5200.00, total_rvu: 2.0 } ], data_quality_score: 95.0 }
              as: CostAnalyst
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /cost-accounting/cost-model-refreshes/${r1}/approve"
              payload: { expected_model_version: "${m_rvu_v}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFRESH_VARIANCE_EXCEEDED"
            - "CostModelRefresh.${r1}.status remains PROPOSED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: flex_tier_boundary_exactly_20000_uses_030
        grounds:
          - calculations.flex_budget
          - entities.BudgetPeriod.fields.flexed_overhead
        distinguishing_aspect: |
          Numeric threshold boundary on the volume metric: actual_indirect_volume
          exactly 20000.00 must use the 0.30 tier (<= is inclusive), while
          20001.00 uses 0.35 — exercised via POST /cases/{id}/post feeding
          GET /budget-periods/{id}.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE (base 9000); CC OR_MINS 1.50/min INDIRECT; CC PERIOP OVERHEAD 7000"
            - "Model M TDABC factor 1.00 overhead PERIOP ACTIVE v2; BudgetPeriod PERIOP/2026-10 static 7000 OPEN; physician P1; drg D470"
            - "Case X with OR_MINS qty 13333.33... — use qty 13333.33 * 1.5 = 19999.995 -> rounds to 20000.00 per-line. Actually use qty 13333.33: raw = 13333.33*1.5 = 19999.995 -> round_half_up -> 20000.00"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-10", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_1000: $.data.id }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-10", expected_reimbursement: 40000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 13333.33 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
          trigger:
            - call: "GET /cost-accounting/budget-periods/${bp_1000}"
              payload: {}
              as: FinanceController
              captures: { bp_flex: $.data.flexed_overhead, bp_vol: $.data.actual_indirect_volume }
          assert:
            - "BudgetPeriod.${bp_1000}.actual_indirect_volume == 20000.00"
            - "BudgetPeriod.${bp_1000}.flexed_overhead == 6000.00  (20000.00 is <= 20000 -> 0.30 tier, NOT 0.35)"

      - name: physician_margin_empty_set_zero_case
        grounds:
          - calculations.physician_margin_report
        distinguishing_aspect: |
          Empty-collection boundary on the case-count metric (different metric from
          the volume tier): a physician with zero POSTED/LOCKED cases in the period
          yields case_count 0 and margin_per_case 0 (not an error, not division by
          zero) — exercised via GET /reports/physician-margin.
        test_recipe:
          setup:
            - "Physician P9 registered ACTIVE with no cases at all"
          setup_api_calls:
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000009", full_name: "Dr. Nine", specialty: "ENT" }
              as: FinanceController
              captures: { phys9: $.data.id }
          trigger:
            - call: "GET /cost-accounting/reports/physician-margin"
              payload: { physician_id: "${phys9}", period: "2026-08" }
              as: FinanceController
              captures: { rep_count: $.data.case_count, rep_mpc: $.data.margin_per_case, rep_margin: $.data.margin }
          assert:
            - "report.case_count == 0"
            - "report.margin == 0 and report.margin_per_case == 0 (empty set does not error)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_post_depends_on_model_active
        grounds:
          - state_machines.Case.DRAFT_to_POSTED
          - entities.CostModel.fields.status
        distinguishing_aspect: |
          Entity pair Case -> CostModel: a DRAFT case priced by a DRAFT (not yet
          ACTIVE) CostModel cannot post — the valid transition of Case depends on
          the state of a different entity (CostModel).
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; CC OR_MINS 1.50/min; CC PERIOP OVERHEAD 7000"
            - "CostModel M created but left DRAFT (never approved)"
            - "Physician P1; Drg D470; Case X under M with one activity line"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id, m_t_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MODEL_NOT_ACTIVE (Case post gated by CostModel state; the DRAFT model is at version ${m_t_v} so the OCC value is current — the failure is purely the model-state gate)"

      - name: service_line_archive_depends_on_case_states
        grounds:
          - state_machines.ServiceLine.ACTIVE_to_ARCHIVED
          - entities.Case.fields.status
        distinguishing_aspect: |
          Entity pair ServiceLine -> Case (different pair from Case->CostModel):
          archiving a ServiceLine is rejected while any of its Cases is DRAFT or
          POSTED; the line's valid transition depends on child Case states.
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; full costing setup (CC OR_MINS, CC PERIOP, model M TDABC ACTIVE v2, P1, D470)"
            - "Case X created under M and left in DRAFT (never posted)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
          trigger:
            - call: "POST /cost-accounting/service-lines/${sl_ortho}/archive"
              payload: {}
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SERVICE_LINE_HAS_OPEN_CASES (DRAFT case blocks archive)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: budget_period_duplicate_window_rejected
        grounds:
          - validations[priority=9]
          - entities.BudgetPeriod.fields.constraints_note
        distinguishing_aspect: |
          Interval semantics: exact-window identity on the same resource — a second
          BudgetPeriod for the SAME cost_center in the SAME period (window fully
          coincident) is rejected as ERR_DUPLICATE_BUDGET_PERIOD; a DIFFERENT
          period (disjoint window) succeeds. Resource: BudgetPeriod-per-pool.
        test_recipe:
          setup:
            - "CostCenter PERIOP OVERHEAD 7000 exists"
            - "BudgetPeriod PERIOP/2026-08 already created"
          setup_api_calls:
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-08", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_0800: $.data.id }
          trigger:
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-08", static_budget_amount: 8000.00 }
              as: FinanceController
              captures: { err: $.data.error_id }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-09", static_budget_amount: 8000.00 }
              as: FinanceController
              captures: { bp_0900: $.data.id }
          assert:
            - "Duplicate (PERIOP, 2026-08) -> ERR_DUPLICATE_BUDGET_PERIOD"
            - "Disjoint (PERIOP, 2026-09) -> 201 created (window-adjacent but non-overlapping)"

      - name: case_period_before_model_effective_window_rejected
        grounds:
          - validations[priority=9]
          - state_machines.Case.DRAFT_to_POSTED
        distinguishing_aspect: |
          Different interval semantics from window-identity: here the rule is a
          half-open precedence window — a case whose service period PRECEDES the
          model's effective_period (start boundary violated, case window strictly
          before model window) is rejected with ERR_CASE_PERIOD_BEFORE_MODEL at
          post time; a case at exactly the effective period is admitted (>= is
          inclusive). Resource entity: Case (not BudgetPeriod).
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE; CC OR_MINS 1.50/min; CC PERIOP OVERHEAD 7000"
            - "CostModel M TDABC factor 1.00 overhead PERIOP effective_period 2026-06, approved ACTIVE (v2)"
            - "Physician P1; Drg D470"
            - "Case EARLY with period 2026-05 (precedes model window); Case ONTIME with period 2026-06 (exactly at boundary)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-06" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-05", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_early: $.data.id }
            - call: "POST /cost-accounting/cases/${case_early}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-06", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_ontime: $.data.id }
            - call: "POST /cost-accounting/cases/${case_ontime}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_early}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /cost-accounting/cases/${case_ontime}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
              captures: { ontime_status: $.data.status }
          assert:
            - "Case EARLY post -> ERR_CASE_PERIOD_BEFORE_MODEL (2026-05 < 2026-06)"
            - "Case ONTIME post succeeds (2026-06 >= 2026-06; boundary inclusive)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: case_post_void_restores_service_line_rollup
        grounds:
          - state_machines.Case.DRAFT_to_POSTED
          - state_machines.Case.POSTED_to_VOIDED
          - entities.ServiceLine.fields.total_direct_cost
        distinguishing_aspect: |
          Conserved quantity: ServiceLine rollups. Forward action (case post)
          debits total_direct_cost / credits total_revenue; the compensating
          action (case void) MUST restore the line to its pre-post values
          exactly — invariant: total_direct_cost(after post then void)
          == total_direct_cost(before post).
        test_recipe:
          setup:
            - "ServiceLine ORTHO ACTIVE base 9000.00; CC OR_MINS 1.50/min; CC PERIOP OVERHEAD 7000; model M TDABC factor 1.20 ACTIVE v2; P1; D470"
            - "Before any case: ORTHO.total_direct_cost == 0, total_revenue == 0"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl_ortho: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc_mins: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { phys1: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint replacement", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg470: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "ORTHO-TDABC", service_line_id: "${sl_ortho}", allocation_basis: "TDABC", rate_factor: 1.20, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_t: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_t}/approve"
              payload: {}
              as: FinanceController
              captures: { m_t_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_ortho}", physician_id: "${phys1}", drg_id: "${drg470}", cost_model_id: "${m_t}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_x: $.data.id }
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 120 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 130 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_x}/activity-lines"
              payload: { cost_center_id: "${cc_mins}", quantity: 80 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_x}/post"
              payload: { expected_model_version: "${m_t_v}" }
              as: CostAnalyst
            - call: "GET /cost-accounting/service-lines/${sl_ortho}"
              payload: {}
              as: FinanceController
              captures: { sl_tdc_post: $.data.total_direct_cost, sl_rev_post: $.data.total_revenue }
            - call: "POST /cost-accounting/cases/${case_x}/void"
              payload: {}
              as: CostAnalyst
            - call: "GET /cost-accounting/service-lines/${sl_ortho}"
              payload: {}
              as: FinanceController
              captures: { sl_tdc_void: $.data.total_direct_cost, sl_rev_void: $.data.total_revenue }
          assert:
            - "After post: ServiceLine.total_direct_cost == 9774.00 (base 9000 + activity 774.00) and total_revenue == 30000.00"
            - "After void: ServiceLine.total_direct_cost == 0.00 and total_revenue == 0.00 (fully restored; invariant holds, no drift)"

      - name: budget_actuals_restored_after_void
        grounds:
          - state_machines.Case.POSTED_to_VOIDED
          - calculations.flex_budget
          - entities.BudgetPeriod.fields.actual_indirect_volume
        distinguishing_aspect: |
          Conserved quantity: BudgetPeriod actual volume (a different conserved
          quantity from the ServiceLine rollup). Posting a case increases
          actual_indirect_volume; voiding that same case MUST return
          actual_indirect_volume / flexed_overhead / variance to pre-post values.
        test_recipe:
          setup:
            - "ServiceLine CARD ACTIVE base 10000; CC LAB 5000/2.0 RVU; CC RAD 9000/3.0 RVU; CC PERIOP OVERHEAD 7000"
            - "Model CARD-RVU ACTIVE v2; BudgetPeriod PERIOP/2026-08 static 7000 OPEN (actuals start 0)"
            - "Physician P2; Drg D291; Case C with LAB qty 4 + RAD qty 6"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Cardiology", code: "CARD", base_direct_cost: 10000.00, budgeted_volume: 60 }
              as: FinanceController
              captures: { sl_card: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Radiology", code: "RAD", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 9000.00, capacity_measure: "RVU", total_rvu: 3.0 }
              as: FinanceController
              captures: { cc_rad: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop Services", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { cc_periop: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
              captures: { phys2: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "291", description: "Heart failure", target_cost: 30000.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { drg291: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "CARD-RVU", service_line_id: "${sl_card}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${cc_periop}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m_card: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m_card}/approve"
              payload: {}
              as: FinanceController
              captures: { m_card_v: $.data.version }
            - call: "POST /cost-accounting/budget-periods"
              payload: { cost_center_id: "${cc_periop}", period: "2026-08", static_budget_amount: 7000.00 }
              as: FinanceController
              captures: { bp_0800: $.data.id }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl_card}", physician_id: "${phys2}", drg_id: "${drg291}", cost_model_id: "${m_card}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { case_c: $.data.id }
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_lab}", quantity: 4 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${case_c}/activity-lines"
              payload: { cost_center_id: "${cc_rad}", quantity: 6 }
              as: CostAnalyst
          trigger:
            - call: "POST /cost-accounting/cases/${case_c}/post"
              payload: { expected_model_version: "${m_card_v}" }
              as: CostAnalyst
            - call: "GET /cost-accounting/budget-periods/${bp_0800}"
              payload: {}
              as: FinanceController
              captures: { vol_post: $.data.actual_indirect_volume }
            - call: "POST /cost-accounting/cases/${case_c}/void"
              payload: {}
              as: CostAnalyst
            - call: "GET /cost-accounting/budget-periods/${bp_0800}"
              payload: {}
              as: FinanceController
              captures: { vol_void: $.data.actual_indirect_volume, flex_void: $.data.flexed_overhead, var_void: $.data.variance_amount }
          assert:
            - "After post: actual_indirect_volume == 28000.00"
            - "After void: actual_indirect_volume == 0.00, flexed_overhead == 0.00, variance_amount == -7000.00 FAVORABLE (invariant restored)"
