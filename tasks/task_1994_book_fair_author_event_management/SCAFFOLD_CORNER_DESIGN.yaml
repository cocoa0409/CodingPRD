        excluded_because:
          difficulty_instance: "non_linear_state_machine / agreement_counter_cycle_rounds_exhaustion"
          rationale: "That §1.8 instance captures and asserts the version progression 1 -> 6 across consecutive counter mutations; the corner instance booking_counter_stale_version_rejected additionally asserts a 412 on a deliberately stale version expression."
