          overlap). A booking with start_date 2026-04-05 >= end_date 2026-04-03 whose ordered span also overlaps an
          existing ACTIVE booking fails with ERR_INVALID_DATE_RANGE (priority 10 wins), not ERR_BOOKING_OVERLAP.
