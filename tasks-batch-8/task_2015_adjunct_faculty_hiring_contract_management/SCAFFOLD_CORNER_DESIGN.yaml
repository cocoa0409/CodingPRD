              as_user_id: "hr_reviewer_1"
              captures: { cred_b: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-mia" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
