# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2798 — Early Intervention Service Coordination
#
# Nine §0.5 rule_id blocks, 19 instances total. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only; every setup chain starts from an empty database
# and drives state exclusively through §1.5 endpoints. Every numeric assert
# below was computed by executing the §1.3 formula with its declared constants.
#
# Logical clock: before the first POST /_clock/set_current_utc the clock reads
# 2026-08-01T00:00:00Z, so every chain sets it explicitly as its first call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: timeline_gross_vs_net_divergence
        grounds:
          - calculations.initial_timeline_elapsed_days
          - entities.Referral.fields.gross_elapsed_days
          - entities.Referral.fields.net_elapsed_days
          - entities.Referral.fields.excluded_delay_days
          - entities.Referral.fields.initial_timeline_status
          - entities.Assessment.fields.family_unavailable_days
          - endpoints[GET /ei/referrals/{referralId}/timeline-compliance]
        distinguishing_aspect: |
          This is the calendar-day variant pair on Referral: the same referral is MISSED on the GROSS
          variant (54 elapsed days > 45) and MET on the NET variant (42 days after subtracting the 12
          documented family-unavailable days), and only the NET variant writes initial_timeline_status.
          The other dual_variant_calc instance is the money pair on CostShare (declared vs verified
          income), not a day count.
        test_recipe:
          setup:
            - "One ACTIVE coordinator in county CNT_A with a 12.00-point ceiling."
            - "Child born 2024-06-15 (third birthday 2027-06-15); referral received 2026-03-02, so statutory_deadline_date is 2026-04-16."
            - "Two COMPLETED assessments carrying family_unavailable_days 7 and 5 (12 excluded days in total)."
            - "An INITIAL IFSP whose meeting_date is 2026-04-25 — 54 days after intake — stops the statutory clock."
            - "Logical clock parked at 2026-04-25T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-26T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 7 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-25", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 5 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-26" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-26", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-25T09:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-04-25", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
          trigger:
            - call: "GET /ei/referrals/${ref_id}/timeline-compliance"
              as: ProgramAdmin
          assert:
            - "response.data.statutory_deadline_date == \"2026-04-16\""
            - "response.data.stop_date == \"2026-04-25\""
            - "response.data.gross_elapsed_days == 54"
            - "response.data.excluded_delay_days == 12"
            - "response.data.net_elapsed_days == 42"
            - "response.data.initial_timeline_status == \"MET\""
            - "Referral.${ref_id}.gross_elapsed_days == 54 and Referral.${ref_id}.net_elapsed_days == 42, so the two variants differ by exactly 12 days on the same row"
            - "Referral.${ref_id}.initial_timeline_status == \"MET\" even though gross_elapsed_days (54) exceeds STATUTORY_TIMELINE_DAYS (45): the status is driven by the NET variant only"
            - "Referral.${ref_id}.initial_ifsp_meeting_date == \"2026-04-25\""

      - name: cost_share_provisional_vs_final_fee_divergence
        grounds:
          - calculations.family_cost_share
          - entities.CostShare.fields.assessed_monthly_fee_cents
          - entities.CostShare.fields.final_monthly_fee_cents
          - entities.CostShare.fields.insurance_offset_cents
          - entities.CostShare.fields.tier_code
          - state_machines.CostShare.PROVISIONAL_to_VERIFIED
        distinguishing_aspect: |
          This is the money variant pair on CostShare: the declared income 12,000,000 cents lands the
          family in TIER_1 (369.8% FPL, rate 0.05, fee 2600) while the verified income 15,500,000 cents
          lands in TIER_2 (477.7% FPL, rate 0.10, capped 5200, insurance offset 3120, final 2080), so
          the FINAL variant both crosses a tier boundary and applies an offset the PROVISIONAL variant
          is forbidden to apply. The other dual_variant_calc instance is the day-count pair on Referral.
        test_recipe:
          setup:
            - "A case in ACTIVE_SERVICES with one ACTIVE plan carrying a single SPEECH_THERAPY line: 4 sessions/month, 2 units/session, 6500 cents/unit."
            - "A PROVISIONAL CostShare for 2026-03 built from household_size 4 and declared income 12,000,000 cents, with insurance_use_consent true and policy POL-4471 on file."
            - "No visit has been documented, so the ledger fields are all 0 and the finalize cannot be perturbed by accruals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /ei/ifsps/${ifsp_id}/consent"
              payload: { consent_scope: "FULL", consent_signed_date: "2026-03-20" }
              as: FamilyRepresentative
              as_user_id: "${child_id}"
            - call: "POST /ei/cost-shares"
              payload: { referral_id: "${ref_id}", effective_month: "2026-03", household_size: 4, declared_annual_gross_income_cents: 12000000, insurance_use_consent: true, insurance_policy_id: "POL-4471" }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
              captures: { cs_id: $.data.id }
          trigger:
            - call: "POST /ei/cost-shares/${cs_id}/finalize"
              payload: { verified_annual_gross_income_cents: 15500000, verification_date: "2026-03-20" }
              as: FiscalOfficer
              as_user_id: "fiscal-officer-1"
          assert:
            - "CostShare.${cs_id}.status == \"VERIFIED\""
            - "CostShare.${cs_id}.fpl_threshold_cents == 3245000"
            - "CostShare.${cs_id}.assessed_monthly_fee_cents == 2600 (PROVISIONAL variant, unchanged by finalize)"
            - "CostShare.${cs_id}.fpl_percent == 477.7"
            - "CostShare.${cs_id}.tier_code == \"TIER_2\""
            - "CostShare.${cs_id}.coinsurance_rate == 0.10"
            - "CostShare.${cs_id}.monthly_cap_cents == 30000"
            - "CostShare.${cs_id}.insurance_offset_cents == 3120"
            - "CostShare.${cs_id}.final_monthly_fee_cents == 2080"
            - "CostShare.${cs_id}.final_monthly_fee_cents != CostShare.${cs_id}.assessed_monthly_fee_cents (2080 vs 2600)"
            - "CostShare.${cs_id}.total_assessed_cents == 0 and family_balance_cents == 0: finalize never re-prices accruals"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: caseload_weight_nonlinear_clamp
        grounds:
          - calculations.case_weight_points
          - calculations.coordinator_caseload_aggregates
          - entities.Referral.fields.case_weight_points
          - entities.ServiceCoordinator.fields.weighted_caseload_points
          - entities.ServiceCoordinator.fields.utilization_ratio
          - endpoints[GET /ei/service-coordinators/{coordinatorId}/caseload-summary]
        distinguishing_aspect: |
          This instance exercises the multi-term additive interaction plus the terminal clamp: three
          independent complexity terms (interpreter 0.50, transition-window 0.75, four-or-more service
          lines 0.50) stack on the 1.50 pre-plan base to an unclamped 3.25, and MAX_CASE_WEIGHT_POINTS
          truncates the stored value to exactly 3.00 — a linear implementation that omits the clamp,
          or clamps before summing, cannot produce 3.00 here. The other combinatorial_formula instance
          exercises rounding ORDER (per-line before summation), not term stacking with a clamp.
        test_recipe:
          setup:
            - "Coordinator in county CNT_B who speaks EN and ES with a 12.00-point ceiling."
            - "Child born 2023-10-01 (third birthday 2026-10-01), family primary language ES."
            - "Referral received 2026-05-01 in CNT_B with interpreter_required true; case progressed to IFSP_PENDING with a DRAFT plan."
            - "Logical clock parked at 2026-05-10T09:00:00Z, which is 144 days before the third birthday — inside the 180-day transition-window term."
            - "Three HOME service lines already added, so case_weight_points is 1.50 + 0.50 + 0.75 = 2.75 with the four-line term still inactive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Beatriz Alvarez", county_code: "CNT_B", language_codes: ["EN", "ES"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Mateo", last_name: "Ibarra", date_of_birth: "2023-10-01", county_code: "CNT_B", primary_language: "ES" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "HOSPITAL", referral_received_date: "2026-05-01", county_code: "CNT_B", presenting_concern: "Global developmental delay following a prolonged NICU stay", interpreter_required: true }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-05-04", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-05-06", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-05-05", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-05-07", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-05-08" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-05-09", rating_social: 2, rating_knowledge: 2, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-05-09", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc1_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "PHYSICAL_THERAPY", setting_code: "HOME", frequency_per_month: 2, units_per_session: 2, unit_rate_cents: 7000, planned_units_total: 48 }
              as: ProgramAdmin
              captures: { svc2_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "OCCUPATIONAL_THERAPY", setting_code: "HOME", frequency_per_month: 2, units_per_session: 2, unit_rate_cents: 7000, planned_units_total: 48 }
              as: ProgramAdmin
              captures: { svc3_id: $.data.id }
          trigger:
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "DEVELOPMENTAL_INSTRUCTION", setting_code: "HOME", frequency_per_month: 4, units_per_session: 1, unit_rate_cents: 5200, planned_units_total: 48 }
              as: ProgramAdmin
              captures: { svc4_id: $.data.id }
            - call: "GET /ei/service-coordinators/${coord_id}/caseload-summary"
              as: ProgramAdmin
          assert:
            - "IFSP.${ifsp_id}.service_line_count == 4"
            - "IFSP.${ifsp_id}.status == \"PENDING_CONSENT\" (adding lines to an un-consented plan does not activate it)"
            - "Referral.${ref_id}.case_weight_points == 3.00, the clamped value of the unclamped additive sum 1.50 + 0.50 + 0.75 + 0.50 = 3.25"
            - "ServiceCoordinator.${coord_id}.weighted_caseload_points == 3.00"
            - "ServiceCoordinator.${coord_id}.utilization_ratio == 0.2500"
            - "ServiceCoordinator.${coord_id}.active_case_count == 1"
            - "response.data.caseload_posture == \"OPEN\""
            - "response.data.headroom_points == 9.00"

      - name: cost_share_per_line_rounding_before_sum
        grounds:
          - calculations.family_cost_share
          - entities.CostShare.fields.assessed_monthly_fee_cents
          - entities.CostShare.fields.fpl_percent
          - entities.IFSPService.fields.unit_rate_cents
          - endpoints[POST /ei/cost-shares]
        distinguishing_aspect: |
          This instance pins the ORDER of operations rather than the stacking of terms: two service
          lines priced 3x1x4115 and 1x1x6789 cents at coinsurance 0.05 round per line to 617 + 339 =
          956 cents, whereas summing first and rounding once yields 957 — a one-cent divergence that
          only a per-line-round-then-sum implementation reproduces. The other combinatorial_formula
          instance stacks three additive terms into a clamp and involves no rounding order at all.
        test_recipe:
          setup:
            - "A case in ACTIVE_SERVICES whose ACTIVE plan carries exactly two non-exempt lines, created in this order: SPEECH_THERAPY 3 sessions/month x 1 unit at 4115 cents, then PHYSICAL_THERAPY 1 session/month x 1 unit at 6789 cents."
            - "Household size 3 with declared annual gross income 9,000,000 cents, which is 334.6% of the 2,690,000-cent threshold and therefore TIER_1 (rate 0.05, cap 12000)."
            - "No CostShare row exists for the referral yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
