            - { call: "POST /defects", payload: { segment_id: "${s2}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { d2: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${s3}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { d3: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${p1}", defect_ids: ["${d1}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { n1: "$.data.id" } }
