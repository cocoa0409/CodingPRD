            - call: POST /obstetric-units/${unit_b}/staff-members
              payload: { full_name: "Rosa Lindqvist MD", staff_role: "ANESTHESIOLOGIST", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
