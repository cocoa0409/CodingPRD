            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 0 }
              as: FinancialCounselor
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
              captures: { err: $.data.error_id }
            - call: "POST /patient-access/authorizations"
              payload: { patient_id: "${p_id}", appointment_id: "${a_id}", payer_auth_number: "AUTH777", authorized_units: 1, valid_until: "2026-09-30" }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
              captures: { st: $.data.status, sat: $.data.auth_satisfied }
          assert:
            - "err == ERR_AUTH_REQUIRED"
            - "st == READY"
            - "sat == true"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_slot_touching_intervals_do_not_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Half-open interval semantics on the provider resource:
          [start, start+duration) — an appointment starting exactly when a
          predecessor ends (end == start, gap = 0) is allowed, while a
          one-minute overlap is rejected with ERR_PROVIDER_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Registered patient(s); appointment A1 for provider DRX 09:00-09:30 booked"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Ov", last_name: "One", date_of_birth: "1986-06-16", sex_at_birth: "M", primary_phone: "+15559000001" }
              as: Registrar
              captures: { p1_id: $.data.id }
            - call: "POST /patient-access/patients"
              payload: { first_name: "Ov", last_name: "Two", date_of_birth: "1987-07-17", sex_at_birth: "F", primary_phone: "+15559000002" }
              as: Registrar
              captures: { p2_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p1_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-27T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRX" }
              as: Registrar
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p2_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-27T09:30:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRX" }
              as: Registrar
              captures: { a2_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p2_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-27T09:29:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRX" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${a2_id}.scheduled_start == 2026-08-27T09:30:00Z (created)"
            - "err == ERR_PROVIDER_DOUBLE_BOOKED"

      - name: referral_validity_date_window_inclusive
        grounds:
          - calculations.referral_matching
          - entities.Referral.fields.valid_until
        distinguishing_aspect: |
          Closed date-interval semantics on the Referral resource (different
          geometry from half-open provider slots): valid_from <= visit_date
          <= valid_until with BOTH endpoints inclusive — an appointment on
          exactly valid_until matches, one day after does not (referral_id
          stays null and the HMO gate goes BLOCKED).
        test_recipe:
          setup:
            - "Registered patient with HMO policy; OPEN referral valid 2026-08-01..2026-08-31 for CARD/99213"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Win", last_name: "Dow", date_of_birth: "1988-08-18", sex_at_birth: "F", primary_phone: "+15559000003" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYERH", member_id: "MW", plan_type: "HMO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
            - call: "POST /patient-access/referrals"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI888", specialty_code: "CARD", procedure_code: "99213", visits_authorized: 5, valid_from: "2026-08-01", valid_until: "2026-08-31" }
              as: Registrar
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI888", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-08-31T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRP" }
              as: Registrar
              captures: { a_ok: $.data.id, ref_ok: $.data.referral_id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI888", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-09-01T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRQ" }
              as: Registrar
              captures: { a_bad: $.data.id, ref_bad: $.data.referral_id, gate_bad: $.data.registration_gate }
          assert:
            - "ref_ok == ${ref_id}"
            - "ref_bad == null"
            - "gate_bad == BLOCKED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_then_void_preserves_collected_amount
        grounds:
          - calculations.collected_amount
          - state_machines.Payment.POSTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: Appointment.amount_collected_cents. Posting
          5000 then voiding that same payment returns the invariant to its
          pre-action value (0); the void is the compensating action and no
          drift is permitted.
        test_recipe:
          setup:
            - "PRE_CHECKED appointment, amount_collected_cents == 0 initially"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Inv", last_name: "One", date_of_birth: "1989-09-19", sex_at_birth: "M", primary_phone: "+15551000003" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MI1", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 30000, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", department_code: "ORTHO", procedure_code: "99213", scheduled_start: "2026-08-28T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRR" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 20, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { collected_pre: $.data.amount_collected_cents }
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 5000, method: "CASH", kind: "POST" }
              as: FinancialCounselor
              captures: { pay_id: $.data.id }
            - call: "POST /patient-access/payments/${pay_id}/void"
              payload: {}
              as: AccessSupervisor
            - call: "GET /patient-access/appointments/${a_id}"
              as: FinancialCounselor
              captures: { collected_post: $.data.amount_collected_cents }
          assert:
            - "collected_pre == 0"
            - "collected_post == collected_pre"

      - name: referral_consume_then_release_preserves_visits_consumed
        grounds:
          - state_machines.Appointment.READY_to_ARRIVED
          - state_machines.Referral.OPEN_to_EXHAUSTED
          - entities.Referral.fields.visits_consumed
        distinguishing_aspect: |
          Conserved quantity (different from money): the referral utilization
          ledger. Check-in consumes a visit (+1) and the queue-skip
          compensation (ticket CALLED -> SKIPPED, appointment back to
          ARRIVED) MUST NOT drift the ledger — visits_consumed stays 1 and
          visits_consumed + remaining_capacity == visits_authorized holds
          across the forward/compensating pair.
        test_recipe:
          setup:
            - "READY appointment matched to an OPEN referral with visits_authorized=2, visits_consumed=0"
          setup_api_calls:
            - call: "POST /patient-access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:50:00Z" }
              as: AccessSupervisor
            - call: "POST /patient-access/patients"
              payload: { first_name: "Inv", last_name: "Two", date_of_birth: "1990-10-20", sex_at_birth: "F", primary_phone: "+15551000004" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/patients/${p_id}/complete-registration"
              payload: { consent_general: true }
              as: Registrar
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYERH", member_id: "MI2", plan_type: "HMO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { pol_id: $.data.id }
            - call: "POST /patient-access/referrals"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI777", specialty_code: "CARD", procedure_code: "99213", visits_authorized: 2, valid_from: "2026-08-01", valid_until: "2026-09-30" }
              as: Registrar
              captures: { ref_id: $.data.id }
            - call: "POST /patient-access/appointments"
              payload: { patient_id: "${p_id}", referring_provider_npi: "NPI777", department_code: "CARD", procedure_code: "99213", scheduled_start: "2026-08-10T09:00:00Z", duration_minutes: 30, visit_type: "ESTABLISHED", provider_code: "DRS" }
              as: Registrar
              captures: { a_id: $.data.id }
            - call: "POST /patient-access/eligibility-checks"
              payload: { policy_id: "${pol_id}", appointment_id: "${a_id}", coverage_status: "ACTIVE", copay_cents: 0, coinsurance_pct: 0, auth_required: false }
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/pre-check"
              payload: {}
              as: Registrar
            - call: "POST /patient-access/appointments/${a_id}/copay-estimates"
              payload: { policy_id: "${pol_id}", allowed_amount_cents: 0 }
              as: FinancialCounselor
            - call: "POST /patient-access/appointments/${a_id}/mark-ready"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/check-in"
              payload: {}
              as: FrontDeskAgent
            - call: "POST /patient-access/queue-tickets/call-next"
              payload: { department_code: "CARD", queue_date: "2026-08-10" }
              as: FrontDeskAgent
              captures: { t_id: $.data.id }
            - call: "POST /patient-access/queue-tickets/${t_id}/skip"
              payload: {}
              as: FrontDeskAgent
            - call: "GET /patient-access/referrals/${ref_id}"
              as: Registrar
              captures: { consumed: $.data.visits_consumed, ref_status: $.data.status }
          assert:
            - "consumed == 1"
            - "ref_status == OPEN"
            - "Appointment.${a_id}.status == ARRIVED after the skip compensation"
