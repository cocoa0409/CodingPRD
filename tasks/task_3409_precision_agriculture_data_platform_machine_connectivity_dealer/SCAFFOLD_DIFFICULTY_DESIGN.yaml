      - name: data_pull_scope_safety_beats_quota_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors.ERR_DATA_SCOPE_NOT_GRANTED
          - errors.ERR_PARTNER_QUOTA_EXCEEDED
          - endpoints.POST_/agdata/integration-partners/{id}/data-pull
        distinguishing_aspect: "Category pair (business_safety vs business_fiscal): the partner is CERTIFIED but has exhausted its daily quota of 1 (fiscal) AND targets an organization with no covering grant (safety); the safety error ERR_DATA_SCOPE_NOT_GRANTED must win over ERR_PARTNER_QUOTA_EXCEEDED."
        test_recipe:
          setup:
            - "Partner certified with api_quota_calls_per_day 1; organization O1 grants the partner TELEMATICS for 2026; one successful pull against O1 exhausts the quota; organization O2 exists with NO grant to the partner."
          setup_api_calls:
            - *d_clock
            - *d_org
            - call: "POST /agdata/integration-partners"
              payload: { name: "AgriSight Analytics", api_quota_calls_per_day: 1 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /agdata/integration-partners/${partner_id}/submit-for-certification"
              payload: {}
              as: PlatformAdmin
            - call: "POST /agdata/integration-partners/${partner_id}/decide"
              payload: { decision: "CERTIFY" }
              as: PlatformAdmin
            - call: "POST /agdata/data-share-grants"
              payload: { organization_id: "${org_id}", grantee_type: "THIRD_PARTY_APP", grantee_ref_id: "${partner_id}", scopes: ["TELEMATICS"], valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org_id}", scope: "TELEMATICS" }
              as: PartnerApp
              as_user_id: "${partner_id}"
            - call: "POST /agdata/organizations"
              payload: { name: "Cottonwood Creek Coop", region_code: "US-KS", right_to_repair_enabled: false }
              as: PlatformAdmin
              captures: { org2_id: $.data.id }
          trigger:
            - call: "POST /agdata/integration-partners/${partner_id}/data-pull"
              payload: { organization_id: "${org2_id}", scope: "TELEMATICS" }
              as: PartnerApp
              as_user_id: "${partner_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_DATA_SCOPE_NOT_GRANTED"
            - "error_id != ERR_PARTNER_QUOTA_EXCEEDED although calls_today == api_quota_calls_per_day"
            - "GET /agdata/integration-partners/${partner_id} still shows calls_today == 1 (the rejected pull did not consume quota)"

