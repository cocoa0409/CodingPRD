scenario: "561. Countertop & Stone Fabrication (granite/quartz): template/digital measure & slab selection, slab inventory & remnant, CNC/edge & seam layout, fabrication & install scheduling, sink/cutout & backsplash, deposit/balance, seal/repair warranty, change order"
domain_name: "stone-fabrication"
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite slab area reserved/consumed/released with remnant fragmentation
  secondary_archetype: posture_driven_gating   # Project lifecycle status gates child operations
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Project is an aggregate root (quotes, templates, payments, change-orders nest under it);
  # Slab/Bay/Crew are flat peers referenced by FK from FabricationOrder/InstallJob (cross-aggregate).

  state_machine_shape: compound
  # Project posture is compound (gates children); Template is cyclic (reopen loop);
  # WarrantyClaim is branching fork-join; FabricationOrder has a recut cycle.

  relationship_patterns:
    - one_to_many          # Project -> Quote/Template/Payment/ChangeOrder; Template -> Cutout; Slab -> Remnant
    - cross_aggregate      # FabricationOrder -> Slab/Bay; InstallJob -> Crew/FabricationOrder

  role_model: peer_roles
  # SalesRep/Fabricator/Installer own disjoint resource types; ShopManager is a hierarchical override for config + approvals.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: "Customer / homeowner name."
      - name: address
        type: string
        source: input
        description: "Install site address."
      - name: material_grade
        type: enum
        source: input
        description: "Stone grade for this job; drives per-sqft rate."
        constraints: "one of {STANDARD, PREMIUM, EXOTIC}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle/posture; gates child operations."
        default: INTAKE
        constraints: "one of {INTAKE, IN_PRODUCTION, ON_HOLD, INSTALLED, CLOSED}"
      - name: payment_status
        type: enum
        source: computed
        description: "Derived from captured payments vs deposit threshold and final invoice."
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL}"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "quote_total_cents of the Quote whose status==ACTIVE (0 if none)."
      - name: final_invoice_cents
        type: integer
        source: computed
        description: "Final invoice; null until the Project's APPROVED Template is priced. See calculations.final_invoice."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "sum(Payment.amount_cents WHERE status==CAPTURED)."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "COALESCE(final_invoice_cents, quoted_total_cents) - amount_paid_cents."

  - name: Quote
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: est_sqft
        type: number
        source: input
        description: "Estimated countertop square footage."
        constraints: ">= 0"
      - name: material_grade
        type: enum
        source: input
        description: "Grade priced by this quote."
        constraints: "one of {STANDARD, PREMIUM, EXOTIC}"
      - name: edge_profile
        type: enum
        source: input
        description: "Edge treatment; upcharge per linear foot."
        constraints: "one of {EASED, BEVELED, BULLNOSE, OGEE}"
      - name: edge_linear_ft
        type: number
        source: input
        description: "Linear feet of finished edge."
        constraints: ">= 0"
      - name: sink_count
        type: integer
        source: input
        description: "Number of sink cutouts estimated."
        constraints: ">= 0"
      - name: faucet_count
        type: integer
        source: input
        description: "Number of faucet cutouts estimated."
        constraints: ">= 0"
      - name: cooktop_count
        type: integer
        source: input
        description: "Number of cooktop cutouts estimated."
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Pre-floor subtotal; see calculations.quote_pricing."
      - name: quote_total_cents
        type: integer
        source: computed
        description: "max(subtotal_cents, MIN_JOB_CENTS)."
      - name: status
        type: enum
        source: system
        description: "ACTIVE quote is the priced one; superseded by a newer quote."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: Template
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: measured_sqft
        type: number
        source: input
        description: "Digitally measured countertop square footage (actual)."
        constraints: ">= 0"
      - name: edge_profile
        type: enum
        source: input
        description: "Measured edge treatment."
        constraints: "one of {EASED, BEVELED, BULLNOSE, OGEE}"
      - name: edge_linear_ft
        type: number
        source: input
        description: "Measured linear feet of edge."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Digital-measure lifecycle; reopens on change order."
        default: DRAFT
        constraints: "one of {DRAFT, MEASURED, APPROVED, SUPERSEDED}"

  - name: Cutout
    parent: Template
    common_fields: false
    fields:
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id"
      - name: cutout_type
        type: enum
        source: input
        description: "Kind of cutout; drives per-cutout charge."
        constraints: "one of {SINK, FAUCET, COOKTOP}"
      - name: charge_cents
        type: integer
        source: computed
        description: "CUTOUT_CHARGE_CENTS[cutout_type] snapshotted at creation."

  - name: Slab
    parent: null
    common_fields: true
    fields:
      - name: slab_label
        type: string
        source: input
        description: "Warehouse label / bin id."
      - name: material_grade
        type: enum
        source: input
        description: "Grade of this physical slab."
        constraints: "one of {STANDARD, PREMIUM, EXOTIC}"
      - name: nominal_sqft
        type: number
        source: input
        description: "Full slab area in square feet."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Inventory lifecycle."
        default: IN_STOCK
        constraints: "one of {IN_STOCK, RESERVED, CONSUMED}"
      - name: reserved_sqft
        type: number
        source: computed
        description: "Consumption reserved by the allocating FabricationOrder (0 when IN_STOCK); see calculations.slab_yield."
        default: 0
      - name: remaining_sqft
        type: number
        source: computed
        description: "nominal_sqft - reserved_sqft; conserved quantity, see calculations.slab_remaining_area."

  - name: Remnant
    parent: Slab
    common_fields: false
    fields:
      - name: slab_id
        type: string
        source: input
        description: "FK -> Slab.id"
      - name: area_sqft
        type: number
        source: computed
        description: "Leftover area = Slab.nominal_sqft - actual_consumed_sqft at consumption."
      - name: status
        type: enum
        source: system
        description: "Remnant availability."
        default: AVAILABLE
        constraints: "one of {AVAILABLE}"

  - name: Bay
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "CNC/fabrication bay name."

  - name: Crew
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Install crew name."

  - name: FabricationOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id"
      - name: slab_id
        type: string
        source: input
        description: "FK -> Slab.id; slab reserved on creation."
      - name: bay_id
        type: string
        source: input
        description: "FK -> Bay.id; occupies bay for [scheduled_start, scheduled_end)."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Bay occupation start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Bay occupation end (ISO 8601 UTC); must be > scheduled_start."
      - name: pieces
        type: array
        source: input
        description: "Cut pieces: array of { label: string, sqft: number>0 }; must be non-empty."
      - name: actual_consumed_sqft
        type: number
        source: computed
        description: "sum(pieces[].sqft) + KERF_SQFT_PER_PIECE * len(pieces); see calculations.slab_yield."
      - name: status
        type: enum
        source: system
        description: "Fabrication lifecycle with recut cycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CUTTING, RECUTTING, QC_PASSED, COMPLETE, CANCELLED}"

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: fabrication_order_id
        type: string
        source: input
        description: "FK -> FabricationOrder.id; must be COMPLETE."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; occupies crew for install_date +/- TRAVEL_BUFFER_DAYS."
      - name: install_date
        type: string
        source: input
        description: "Install calendar date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: system
        description: "Install lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, DONE}"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock time when install reached DONE; anchors warranty window."

  - name: Payment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents."
        constraints: "> 0"
      - name: kind
        type: enum
        source: input
        description: "Deposit vs balance payment."
        constraints: "one of {DEPOSIT, BALANCE}"
      - name: status
        type: enum
        source: system
        description: "CAPTURED on record; REFUNDED on refund."
        default: CAPTURED
        constraints: "one of {CAPTURED, REFUNDED}"

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id"
      - name: description
        type: string
        source: input
        description: "What is changing."
      - name: delta_cents
        type: integer
        source: input
        description: "Signed price delta added to the final invoice when APPLIED."
      - name: reopens_template
        type: boolean
        source: input
        description: "If true, applying reopens the APPROVED Template to MEASURED."
        default: true
      - name: status
        type: enum
        source: system
        description: "Change-order lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, APPLIED}"

  - name: WarrantyClaim
    parent: InstallJob
    common_fields: true
    fields:
      - name: install_job_id
        type: string
        source: input
        description: "FK -> InstallJob.id; job must be DONE and within warranty window."
      - name: claim_type
        type: enum
        source: input
        description: "Nature of the defect."
        constraints: "one of {SEAL, CHIP, CRACK}"
      - name: description
        type: string
        source: input
        description: "Defect description."
      - name: resolution
        type: enum
        source: system
        description: "Set when resolved; branch determines side effects."
        constraints: "one of {SEAL_REPAIR, REPLACEMENT, REJECTED}"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle (branching fork-join)."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RESOLVED, REJECTED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: IN_PRODUCTION
        trigger: "POST /fabrication-orders (first fab order for this project)"
        actor: Fabricator
        preconditions:
          - "Project has an APPROVED Template"
          - "Project.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
        side_effects:
          - "Project.status = IN_PRODUCTION"
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /fabrication-orders (new fab order after a reopen)"
        actor: Fabricator
        preconditions:
          - "Project has an APPROVED Template"
        side_effects:
          - "Project.status = IN_PRODUCTION"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "system: an APPLIED ChangeOrder with reopens_template=true"
        actor: system
        preconditions: []
        side_effects:
          - "Project.status = ON_HOLD (cascade link from ChangeOrder apply -> Template reopen)"
      - from: IN_PRODUCTION
        to: INSTALLED
        trigger: "system: linked InstallJob reaches DONE"
        actor: system
        preconditions: []
        side_effects:
          - "Project.status = INSTALLED"
      - from: INSTALLED
        to: CLOSED
        trigger: "system: on InstallJob DONE when payment_status==PAID_IN_FULL"
        actor: system
        preconditions:
          - "Project.payment_status == PAID_IN_FULL"
        side_effects:
          - "Project.status = CLOSED"
        note: "If not paid in full at install DONE, Project stays INSTALLED; a later BALANCE payment does not auto-close."

  - entity: Template
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /projects/{id}/templates records the digital measure (created directly in MEASURED)"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Any prior non-SUPERSEDED Template on the Project moves to SUPERSEDED"
        note: "Creation lands the Template in MEASURED; DRAFT is the nominal pre-persist state."
      - from: MEASURED
        to: APPROVED
        trigger: "POST /templates/{id}/approve"
        actor: Fabricator
        preconditions:
          - "Template.measured_sqft > 0 (non-empty measure)"
        side_effects:
          - "Recompute Project.final_invoice_cents (calculations.final_invoice)"
          - "Recompute Project.balance_due_cents"
      - from: APPROVED
        to: MEASURED
        trigger: "system: an APPLIED ChangeOrder with reopens_template=true (cascade link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "Cancel the Project's linked FabricationOrder if status IN {SCHEDULED, CUTTING, RECUTTING, QC_PASSED} (cascade link 2)"
          - "Project.status = ON_HOLD"
        note: "Revision loop: APPROVED can return to MEASURED, then be re-approved."

  - entity: FabricationOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CUTTING
        trigger: "POST /fabrication-orders/{id}/start-cut"
        actor: Fabricator
        preconditions: []
        side_effects: []
      - from: CUTTING
        to: QC_PASSED
        trigger: "POST /fabrication-orders/{id}/qc { result: PASS }"
        actor: Fabricator
        preconditions: []
        side_effects: []
      - from: CUTTING
        to: RECUTTING
        trigger: "POST /fabrication-orders/{id}/qc { result: FAIL }"
        actor: Fabricator
        preconditions: []
        side_effects: []
      - from: RECUTTING
        to: CUTTING
        trigger: "POST /fabrication-orders/{id}/start-cut (recut loop)"
        actor: Fabricator
        preconditions: []
        side_effects: []
      - from: QC_PASSED
        to: COMPLETE
        trigger: "POST /fabrication-orders/{id}/complete"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Slab RESERVED -> CONSUMED (cascade link 1 of complete-cascade)"
          - "Create Remnant with area_sqft = Slab.nominal_sqft - FabricationOrder.actual_consumed_sqft (cascade link 2, caused by slab consumption)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fabrication-orders/{id}/cancel  OR  system reopen-cascade"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Slab RESERVED -> IN_STOCK; Slab.reserved_sqft = 0; Slab.remaining_sqft = Slab.nominal_sqft (cascade link 3 of reopen-cascade)"
      - from: CUTTING
        to: CANCELLED
        trigger: "POST /fabrication-orders/{id}/cancel  OR  system reopen-cascade"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Slab RESERVED -> IN_STOCK; Slab.reserved_sqft = 0; Slab.remaining_sqft = Slab.nominal_sqft"
      - from: RECUTTING
        to: CANCELLED
        trigger: "POST /fabrication-orders/{id}/cancel  OR  system reopen-cascade"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Slab RESERVED -> IN_STOCK; Slab.reserved_sqft = 0; Slab.remaining_sqft = Slab.nominal_sqft"
      - from: QC_PASSED
        to: CANCELLED
        trigger: "POST /fabrication-orders/{id}/cancel  OR  system reopen-cascade"
        actor: Fabricator
        preconditions: []
        side_effects:
          - "Slab RESERVED -> IN_STOCK; Slab.reserved_sqft = 0; Slab.remaining_sqft = Slab.nominal_sqft"

  - entity: Slab
    initial_state: IN_STOCK
    terminal_states: [CONSUMED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /fabrication-orders (slab allocated)"
        actor: Fabricator
        preconditions:
          - "Slab.status == IN_STOCK"
        side_effects:
          - "Slab.reserved_sqft = FabricationOrder.actual_consumed_sqft"
          - "Slab.remaining_sqft = Slab.nominal_sqft - Slab.reserved_sqft"
      - from: RESERVED
        to: IN_STOCK
        trigger: "system: allocating FabricationOrder cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "Slab.reserved_sqft = 0; Slab.remaining_sqft = Slab.nominal_sqft"
      - from: RESERVED
        to: CONSUMED
        trigger: "system: allocating FabricationOrder completed"
        actor: system
        preconditions: []
        side_effects:
          - "Create Remnant (area_sqft = nominal_sqft - actual_consumed_sqft)"

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [DONE]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: Installer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /install-jobs/{id}/complete"
        actor: Installer
        preconditions: []
        side_effects:
          - "InstallJob.completed_at = current logical clock time"
          - "Project IN_PRODUCTION -> INSTALLED (or -> CLOSED if payment_status==PAID_IN_FULL)"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve { resolution: SEAL_REPAIR }"
        actor: Installer
        preconditions: []
        side_effects:
          - "WarrantyClaim.resolution = SEAL_REPAIR"
          - "No financial or install side effects (seal touch-up branch)"
      - from: SUBMITTED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve { resolution: REPLACEMENT }"
        actor: Installer
        preconditions: []
        side_effects:
          - "WarrantyClaim.resolution = REPLACEMENT"
          - "Linked InstallJob's FabricationOrder.slab produces a new remedial context: Project.status = IN_PRODUCTION (reopened for refabrication)"
        note: "Divergent branch: REPLACEMENT reopens production; SEAL_REPAIR does not."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/resolve { resolution: REJECT }"
        actor: Installer
        preconditions: []
        side_effects:
          - "WarrantyClaim.resolution = REJECTED"

  - entity: Payment
    initial_state: CAPTURED
    terminal_states: [REFUNDED]
    transitions:
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund"
        actor: SalesRep
        preconditions:
          - "Payment.status == CAPTURED"
        side_effects:
          - "Recompute Project.amount_paid_cents, balance_due_cents, payment_status (compensating: money conservation)"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPLIED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /change-orders/{id}/approve"
        actor: ShopManager
        preconditions:
          - "ChangeOrder.status == DRAFT"
          - "Project.status != CLOSED"
        side_effects:
          - "Recompute Project.final_invoice_cents (adds delta_cents line) and balance_due_cents"
          - "If reopens_template==true: reopen APPROVED Template MEASURED (cascade link 1) -> cancel linked FabricationOrder (link 2) -> release Slab (link 3); Project.status=ON_HOLD"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quote-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/quotes"
    occ_field: "expected_project_version"
    description: |
      Creating a new Quote against a Project whose version has advanced since the
      client last observed it is rejected. A new Quote legitimately supersedes the
      prior ACTIVE quote (the newest quote is authoritative); a writer holding a
      stale Project version has not seen the supersede that another writer already
      performed, so its create is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a Project whose version has advanced since the
      client last observed it is rejected. ChangeOrder creation is priced against the
      Project's current invoice snapshot; a stale Project version means the client's
      view of the invoice/quote basis is out of date, so the create is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: quote_pricing
    trigger: "POST /projects/{id}/quotes"
    algorithm: tiered_pricing
    formula: |
      material_rate = MATERIAL_RATE_CENTS[material_grade]        # per sqft
      edge_rate     = EDGE_RATE_CENTS[edge_profile]              # per linear ft
      material_charge = round_half_up(material_rate * est_sqft)  # cents
      edge_charge     = round_half_up(edge_rate * edge_linear_ft)
      cutout_charge   = sink_count*CUTOUT_CHARGE_CENTS[SINK]
                      + faucet_count*CUTOUT_CHARGE_CENTS[FAUCET]
                      + cooktop_count*CUTOUT_CHARGE_CENTS[COOKTOP]
      subtotal_cents  = material_charge + edge_charge + cutout_charge
      quote_total_cents = max(subtotal_cents, MIN_JOB_CENTS)     # non-linear floor
    input_set: "Single Quote's own input fields; no cross-entity aggregation."
    constants:
      MATERIAL_RATE_CENTS: { STANDARD: 4500, PREMIUM: 6500, EXOTIC: 9500 }
      EDGE_RATE_CENTS: { EASED: 0, BEVELED: 800, BULLNOSE: 1200, OGEE: 2000 }
      CUTOUT_CHARGE_CENTS: { SINK: 15000, FAUCET: 3500, COOKTOP: 12000 }
      MIN_JOB_CENTS: 80000
    precision: "integer cents; round_half_up on each multiplicative sub-term."
    variants: []

  - name: final_invoice
    trigger: "POST /templates/{id}/approve; recomputed on POST /change-orders/{id}/approve (APPLIED)"
    algorithm: aggregation
    formula: |
      # Line items (base cents), then tax rounded PER LINE, then summed.
      # Pinned order: round_half_up(line_base * (1 + TAX_RATE)) per line, THEN sum.
      material_base = MATERIAL_RATE_CENTS[Project.material_grade] * Template.measured_sqft
      edge_base     = EDGE_RATE_CENTS[Template.edge_profile] * Template.edge_linear_ft
      lines = [ material_base, edge_base ]
            + [ CUTOUT_CHARGE_CENTS[c.cutout_type] for c in Cutouts of APPROVED Template ]
            + [ co.delta_cents for co in ChangeOrders WHERE status==APPLIED ]
      final_invoice_cents = sum( round_half_up(line * (1 + TAX_RATE)) for line in lines )
    input_set: "Cutouts of the Project's APPROVED Template; ChangeOrders with status==APPLIED. Order: material, edge, cutouts by created_at ASC, change-orders by created_at ASC."
    constants:
      TAX_RATE: 0.0875
      MATERIAL_RATE_CENTS: { STANDARD: 4500, PREMIUM: 6500, EXOTIC: 9500 }
      EDGE_RATE_CENTS: { EASED: 0, BEVELED: 800, BULLNOSE: 1200, OGEE: 2000 }
      CUTOUT_CHARGE_CENTS: { SINK: 15000, FAUCET: 3500, COOKTOP: 12000 }
    precision: "integer cents; round_half_up per line BEFORE summation (order pinned)."
    variants: []

  - name: deposit_vs_balance
    trigger: "read model on Project; deposit gate checked on POST /projects/{id}/payments"
    algorithm: forward_looking
    formula: |
      # DUAL VARIANT on the Project cost domain.
      deposit_required_cents = round_half_up(Project.quoted_total_cents * DEPOSIT_PCT)
      final_balance_cents    = Project.final_invoice_cents - Project.amount_paid_cents
    input_set: "quoted_total from ACTIVE Quote; final_invoice from calculations.final_invoice."
    constants:
      DEPOSIT_PCT: 0.50
    precision: "integer cents; round_half_up."
    variants:
      - name: deposit_estimate
        when: "at booking, before template approval; forward-looking on the ACTIVE quote"
        difference: "DEPOSIT_PCT * quoted_total_cents; ignores actual measure and change orders"
      - name: final_balance
        when: "after template APPROVED (and any APPLIED change orders); actual"
        difference: "final_invoice_cents - amount_paid_cents; reflects measured sqft + change orders, diverges from deposit_estimate"

  - name: slab_yield
    trigger: "POST /fabrication-orders (reserve); POST /fabrication-orders/{id}/complete (consume)"
    algorithm: aggregation
    formula: |
      # DUAL VARIANT on the Slab material domain.
      estimated_yield_sqft = round_half_up(Slab.nominal_sqft * (1 - STD_WASTE_FACTOR), 2)
      actual_consumed_sqft = round_half_up( sum(p.sqft for p in pieces)
                             + KERF_SQFT_PER_PIECE * len(pieces), 2)
    input_set: "FabricationOrder.pieces; Slab.nominal_sqft."
    constants:
      STD_WASTE_FACTOR: 0.15
      KERF_SQFT_PER_PIECE: 0.10
    precision: "2 decimal places, round_half_up."
    variants:
      - name: estimated_yield
        when: "planning; nominal usable area of a slab"
        difference: "nominal_sqft * (1 - STD_WASTE_FACTOR); slab-intrinsic estimate"
      - name: actual_consumed
        when: "when a fab order allocates the slab"
        difference: "sum(piece sqft) + kerf per piece; job-specific actual, diverges from estimate"

  - name: slab_remaining_area
    trigger: "any Slab reserve / release / consume transition"
    algorithm: aggregation
    formula: |
      Slab.remaining_sqft = round_half_up(Slab.nominal_sqft - Slab.reserved_sqft, 2)
      # reserved_sqft = FabricationOrder.actual_consumed_sqft while RESERVED, else 0
    input_set: "Slab.nominal_sqft, Slab.reserved_sqft (from allocating FabricationOrder)."
    constants: {}
    precision: "2 decimal places, round_half_up."
    variants: []

  - name: project_ledger
    trigger: "POST /projects/{id}/payments; POST /payments/{id}/refund"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(Payment.amount_cents WHERE status==CAPTURED)
      balance_due_cents = COALESCE(final_invoice_cents, quoted_total_cents) - amount_paid_cents
      payment_status =
        PAID_IN_FULL  if amount_paid_cents >= COALESCE(final_invoice_cents, quoted_total_cents)
        DEPOSIT_PAID  elif amount_paid_cents >= round_half_up(quoted_total_cents * DEPOSIT_PCT)
        UNPAID        else
    input_set: "Payments of the Project with status==CAPTURED (REFUNDED excluded)."
    constants:
      DEPOSIT_PCT: 0.50
    precision: "integer cents; round_half_up."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (incl. terminal)"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints (fabrication/install/warranty/change-order transitions, template approve, payment refund)"
  - priority: 5
    category: state
    check: "Mutating operations on a CLOSED Project are rejected"
    error_id: ERR_PROJECT_CLOSED
    http_status: 409
    applies_to: "POST /projects/{id}/payments, /quotes, /change-orders, /templates"
  - priority: 6
    category: business_referential
    check: "FabricationOrder create: referenced Template.status == APPROVED"
    error_id: ERR_TEMPLATE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /fabrication-orders"
  - priority: 7
    category: business_referential
    check: "InstallJob create: referenced FabricationOrder.status == COMPLETE"
    error_id: ERR_FAB_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /install-jobs"
  - priority: 8
    category: business_referential
    check: "FabricationOrder create: Project.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 409
    applies_to: "POST /fabrication-orders"
  - priority: 9
    category: business_constraint
    check: "FabricationOrder create: pieces array non-empty (>=1 piece)"
    error_id: ERR_NO_PIECES
    http_status: 422
    applies_to: "POST /fabrication-orders"
  - priority: 10
    category: business_constraint
    check: "FabricationOrder create: referenced Slab.status == IN_STOCK"
    error_id: ERR_SLAB_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /fabrication-orders"
  - priority: 11
    category: business_constraint
    check: "FabricationOrder create: scheduled_end > scheduled_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /fabrication-orders"
  - priority: 12
    category: business_temporal
    check: "Bay half-open overlap: reject if exists non-CANCELLED fab order on same bay with a.start < b.end AND b.start < a.end (adjacency end==start allowed)"
    error_id: ERR_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /fabrication-orders"
  - priority: 13
    category: business_temporal
    check: "Crew buffered overlap: reject if exists any install job on same crew with abs(days between install_date) <= TRAVEL_BUFFER_DAYS (=1), i.e. dates must differ by > 1 day"
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /install-jobs"
  - priority: 14
    category: business_temporal
    check: "WarrantyClaim create: current clock <= InstallJob.completed_at + WARRANTY_DAYS (=365)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /install-jobs/{id}/warranty-claims"
  - priority: 15
    category: business_fiscal
    check: "Payment requires an ACTIVE Quote to exist (quoted basis)"
    error_id: ERR_QUOTE_REQUIRED
    http_status: 409
    applies_to: "POST /projects/{id}/payments"
  - priority: 16
    category: business_fiscal
    check: "amount_cents > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /projects/{id}/payments"
  - priority: 17
    category: business_fiscal
    check: "Deposit gate: a DEPOSIT payment must bring cumulative captured >= round_half_up(quoted_total*0.50)"
    error_id: ERR_DEPOSIT_TOO_LOW
    http_status: 422
    applies_to: "POST /projects/{id}/payments (kind==DEPOSIT)"
  - priority: 18
    category: business_fiscal
    check: "Payment must not push amount_paid_cents above the balance basis COALESCE(final_invoice_cents, quoted_total_cents) (no overpayment)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /projects/{id}/payments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- config / inventory ---
  - method: POST
    path: "/bays"
    description: "Create a fabrication bay."
    roles: [ShopManager]
    code: 201
    input: [name]
    output: Bay
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Create an install crew."
    roles: [ShopManager]
    code: 201
    input: [name]
    output: Crew
    side_effects: []
  - method: POST
    path: "/slabs"
    description: "Intake a physical slab into inventory."
    roles: [ShopManager, Fabricator]
    code: 201
    input: [slab_label, material_grade, nominal_sqft]
    output: Slab
    side_effects: ["Slab.status=IN_STOCK; reserved_sqft=0; remaining_sqft=nominal_sqft"]
  - method: GET
    path: "/slabs/{id}"
    description: "Read a slab."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Slab
    side_effects: []
  - method: GET
    path: "/slabs/{id}/remnants"
    description: "List remnants cut from a slab (reverse-reachability Remnant.slab_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Remnant[]
    side_effects: []

  # --- projects ---
  - method: POST
    path: "/projects"
    description: "Create a project."
    roles: [SalesRep, ShopManager]
    code: 201
    input: [customer_name, address, material_grade]
    output: Project
    side_effects: ["Project.status=INTAKE; payment_status=UNPAID"]
  - method: GET
    path: "/projects/{id}"
    description: "Read a project (computed ledger fields)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Project
    side_effects: []

  # --- quotes ---
  - method: POST
    path: "/projects/{id}/quotes"
    description: "Create a quote; supersedes prior ACTIVE quote. OCC on Project.version."
    roles: [SalesRep, ShopManager]
    code: 201
    input: [expected_project_version, est_sqft, material_grade, edge_profile, edge_linear_ft, sink_count, faucet_count, cooktop_count]
    output: Quote
    side_effects:
      - "Prior ACTIVE quote -> SUPERSEDED"
      - "Compute subtotal_cents, quote_total_cents (calculations.quote_pricing)"
      - "Recompute Project.quoted_total_cents, balance_due_cents"
      - "increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/quotes"
    description: "List quotes for a project (reverse-reachability Quote.project_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Quote[]
    side_effects: []

  # --- payments ---
  - method: POST
    path: "/projects/{id}/payments"
    description: "Record a captured payment (deposit or balance)."
    roles: [SalesRep, ShopManager]
    code: 201
    input: [amount_cents, kind]
    output: Payment
    side_effects:
      - "Payment.status=CAPTURED"
      - "Recompute Project.amount_paid_cents, balance_due_cents, payment_status (calculations.project_ledger)"
  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a captured payment (compensating action)."
    roles: [SalesRep, ShopManager]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment.status=REFUNDED"
      - "Recompute Project.amount_paid_cents, balance_due_cents, payment_status"
  - method: GET
    path: "/projects/{id}/payments"
    description: "List payments for a project (reverse-reachability Payment.project_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # --- change orders ---
  - method: POST
    path: "/projects/{id}/change-orders"
    description: "Create a change order. OCC on Project.version."
    roles: [SalesRep, ShopManager]
    code: 201
    input: [expected_project_version, description, delta_cents, "reopens_template?"]
    output: ChangeOrder
    side_effects:
      - "ChangeOrder.status=DRAFT"
      - "increments Project.version by 1"
  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve+apply a change order (triggers reopen cascade)."
    roles: [ShopManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "ChangeOrder.status=APPLIED"
      - "Recompute Project.final_invoice_cents (adds delta_cents line), balance_due_cents"
      - "If reopens_template: Template APPROVED->MEASURED (link1) -> cancel linked FabricationOrder (link2) -> release Slab (link3); Project.status=ON_HOLD"
      - "increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List change orders for a project (reverse-reachability ChangeOrder.project_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: ChangeOrder[]
    side_effects: []

  # --- templates + cutouts ---
  - method: POST
    path: "/projects/{id}/templates"
    description: "Record a digital measure (Template created in MEASURED)."
    roles: [Fabricator, ShopManager]
    code: 201
    input: [measured_sqft, edge_profile, edge_linear_ft]
    output: Template
    side_effects:
      - "Prior non-SUPERSEDED Template -> SUPERSEDED"
      - "Template.status=MEASURED"
  - method: GET
    path: "/projects/{id}/templates"
    description: "List templates for a project (reverse-reachability Template.project_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Template[]
    side_effects: []
  - method: GET
    path: "/templates/{id}"
    description: "Read a template."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Template
    side_effects: []
  - method: POST
    path: "/templates/{id}/cutouts"
    description: "Add a sink/faucet/cooktop cutout to a template."
    roles: [Fabricator, ShopManager]
    code: 201
    input: [cutout_type]
    output: Cutout
    side_effects: ["Cutout.charge_cents = CUTOUT_CHARGE_CENTS[cutout_type]"]
  - method: GET
    path: "/templates/{id}/cutouts"
    description: "List cutouts of a template (reverse-reachability Cutout.template_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: Cutout[]
    side_effects: []
  - method: POST
    path: "/templates/{id}/approve"
    description: "Approve a measured template; prices the final invoice."
    roles: [Fabricator, ShopManager]
    code: 200
    input: []
    output: Template
    side_effects:
      - "Template.status=APPROVED"
      - "Compute Project.final_invoice_cents (calculations.final_invoice), balance_due_cents"

  # --- fabrication ---
  - method: POST
    path: "/fabrication-orders"
    description: "Create a fabrication order: reserve slab, schedule bay, define pieces."
    roles: [Fabricator, ShopManager]
    code: 201
    input: [project_id, template_id, slab_id, bay_id, scheduled_start, scheduled_end, pieces]
    output: FabricationOrder
    side_effects:
      - "Compute actual_consumed_sqft (calculations.slab_yield)"
      - "Slab IN_STOCK->RESERVED; reserved_sqft=actual_consumed_sqft; remaining_sqft recomputed"
      - "Project INTAKE/ON_HOLD -> IN_PRODUCTION"
      - "FabricationOrder.status=SCHEDULED"
  - method: GET
    path: "/fabrication-orders/{id}"
    description: "Read a fabrication order."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: FabricationOrder
    side_effects: []
  - method: GET
    path: "/fabrication-orders"
    description: "List/filter fabrication orders (reverse-reachability for project_id/template_id/slab_id/bay_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: ["project_id?", "template_id?", "slab_id?", "bay_id?"]
    output: FabricationOrder[]
    side_effects: []
  - method: POST
    path: "/fabrication-orders/{id}/start-cut"
    description: "Begin cutting (SCHEDULED/RECUTTING -> CUTTING)."
    roles: [Fabricator, ShopManager]
    code: 200
    input: []
    output: FabricationOrder
    side_effects: ["FabricationOrder.status=CUTTING"]
  - method: POST
    path: "/fabrication-orders/{id}/qc"
    description: "QC result (CUTTING -> QC_PASSED on PASS, -> RECUTTING on FAIL)."
    roles: [Fabricator, ShopManager]
    code: 200
    input: [result]
    output: FabricationOrder
    side_effects: ["status=QC_PASSED or RECUTTING per result"]
  - method: POST
    path: "/fabrication-orders/{id}/complete"
    description: "Complete fabrication (QC_PASSED -> COMPLETE); consume slab; create remnant."
    roles: [Fabricator, ShopManager]
    code: 200
    input: []
    output: FabricationOrder
    side_effects:
      - "FabricationOrder.status=COMPLETE"
      - "Slab RESERVED->CONSUMED (link1)"
      - "Create Remnant area_sqft=nominal_sqft-actual_consumed_sqft (link2)"
  - method: POST
    path: "/fabrication-orders/{id}/cancel"
    description: "Cancel a non-terminal fabrication order; release slab."
    roles: [Fabricator, ShopManager]
    code: 200
    input: []
    output: FabricationOrder
    side_effects:
      - "FabricationOrder.status=CANCELLED"
      - "Slab RESERVED->IN_STOCK; reserved_sqft=0; remaining_sqft=nominal_sqft"

  # --- install ---
  - method: POST
    path: "/install-jobs"
    description: "Schedule an install job on a crew for a COMPLETE fabrication order."
    roles: [Installer, ShopManager]
    code: 201
    input: [project_id, fabrication_order_id, crew_id, install_date]
    output: InstallJob
    side_effects: ["InstallJob.status=SCHEDULED"]
  - method: GET
    path: "/install-jobs/{id}"
    description: "Read an install job."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: InstallJob
    side_effects: []
  - method: GET
    path: "/install-jobs"
    description: "List/filter install jobs (reverse-reachability for project_id/crew_id/fabrication_order_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: ["project_id?", "crew_id?", "fabrication_order_id?"]
    output: InstallJob[]
    side_effects: []
  - method: POST
    path: "/install-jobs/{id}/start"
    description: "Start install (SCHEDULED -> IN_PROGRESS)."
    roles: [Installer, ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob.status=IN_PROGRESS"]
  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "Complete install (IN_PROGRESS -> DONE); anchor warranty; advance Project."
    roles: [Installer, ShopManager]
    code: 200
    input: []
    output: InstallJob
    side_effects:
      - "InstallJob.status=DONE; completed_at=current clock"
      - "Project IN_PRODUCTION -> INSTALLED (or CLOSED if PAID_IN_FULL)"

  # --- warranty ---
  - method: POST
    path: "/install-jobs/{id}/warranty-claims"
    description: "File a warranty claim against a DONE install within the warranty window."
    roles: [Installer, ShopManager]
    code: 201
    input: [claim_type, description]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim.status=SUBMITTED"]
  - method: GET
    path: "/install-jobs/{id}/warranty-claims"
    description: "List warranty claims for an install job (reverse-reachability WarrantyClaim.install_job_id)."
    roles: [ShopManager, SalesRep, Fabricator, Installer]
    code: 200
    input: []
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "Resolve a warranty claim (SEAL_REPAIR / REPLACEMENT / REJECT)."
    roles: [Installer, ShopManager]
    code: 200
    input: [resolution]
    output: WarrantyClaim
    side_effects:
      - "SEAL_REPAIR/REPLACEMENT -> status=RESOLVED; REJECT -> status=REJECTED"
      - "REPLACEMENT: Project.status=IN_PRODUCTION (reopen for refabrication)"

  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (before any set; never falls back to wall-clock)."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock = to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, or invalid enum value."
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project id not found."
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "Template id not found."
  - id: ERR_SLAB_NOT_FOUND
    http: 404
    condition: "Slab id not found."
  - id: ERR_BAY_NOT_FOUND
    http: 404
    condition: "Bay id not found."
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "Crew id not found."
  - id: ERR_FAB_ORDER_NOT_FOUND
    http: 404
    condition: "FabricationOrder id not found."
  - id: ERR_INSTALL_JOB_NOT_FOUND
    http: 404
    condition: "InstallJob id not found."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "Payment id not found."
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "ChangeOrder id not found."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "WarrantyClaim id not found."
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "State transition not allowed from current state (incl. terminal)."
  - id: ERR_PROJECT_CLOSED
    http: 409
    condition: "Mutation attempted on a CLOSED Project."
  - id: ERR_TEMPLATE_NOT_APPROVED
    http: 409
    condition: "FabricationOrder create requires an APPROVED Template."
  - id: ERR_FAB_NOT_COMPLETE
    http: 409
    condition: "InstallJob create requires a COMPLETE FabricationOrder."
  - id: ERR_DEPOSIT_NOT_PAID
    http: 409
    condition: "FabricationOrder create requires Project.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}."
  - id: ERR_NO_PIECES
    http: 422
    condition: "FabricationOrder create with an empty pieces array."
  - id: ERR_SLAB_NOT_AVAILABLE
    http: 409
    condition: "FabricationOrder create references a Slab not IN_STOCK."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "scheduled_end <= scheduled_start."
  - id: ERR_BAY_UNAVAILABLE
    http: 409
    condition: "Bay half-open time overlap with another fabrication order."
  - id: ERR_CREW_UNAVAILABLE
    http: 409
    condition: "Crew install-date within TRAVEL_BUFFER_DAYS of another install job."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "Warranty claim filed after install completed_at + WARRANTY_DAYS."
  - id: ERR_DEPOSIT_TOO_LOW
    http: 422
    condition: "Deposit payment does not reach 50% of quoted total."
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Payment amount_cents <= 0."
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment would push amount paid above the balance basis."
  - id: ERR_QUOTE_REQUIRED
    http: 409
    condition: "Payment attempted with no ACTIVE quote."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_project_version does not match current Project.version (OCC)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ShopManager
    description: "Owner/operator; config (bays, crews, slabs), change-order approvals; hierarchical override on all write operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /bays"
      - "POST /crews"
      - "POST /change-orders/{id}/approve"
    shared_operations:
      - "All SalesRep, Fabricator, Installer write operations (override)"
      - "All GET reads"
  - name: SalesRep
    description: "Sales/finance: projects, quotes, payments, refunds, change-order creation."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/quotes"
      - "POST /projects/{id}/payments"
      - "POST /payments/{id}/refund"
      - "POST /projects/{id}/change-orders"
    shared_operations:
      - "All GET reads"
  - name: Fabricator
    description: "Shop floor: slab intake, templates, cutouts, template approval, fabrication orders and transitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/templates"
      - "POST /templates/{id}/cutouts"
      - "POST /templates/{id}/approve"
      - "POST /fabrication-orders"
      - "POST /fabrication-orders/{id}/start-cut"
      - "POST /fabrication-orders/{id}/qc"
      - "POST /fabrication-orders/{id}/complete"
      - "POST /fabrication-orders/{id}/cancel"
    shared_operations:
      - "POST /slabs (shared with ShopManager)"
      - "All GET reads"
  - name: Installer
    description: "Field install: install jobs and transitions, warranty claims and resolution."
    identity: "opaque"
    exclusive_operations:
      - "POST /install-jobs"
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/complete"
      - "POST /install-jobs/{id}/warranty-claims"
      - "POST /warranty-claims/{id}/resolve"
    shared_operations:
      - "All GET reads"
