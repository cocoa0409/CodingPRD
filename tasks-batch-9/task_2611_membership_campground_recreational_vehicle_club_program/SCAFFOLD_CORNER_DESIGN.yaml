          rationale: "The named §1.8 instance already walks the full five-level chain end to end in one sweep — invoice to PAST_DUE, dues axis to DELINQUENT, membership to SUSPENDED, reservations to CANCELLED with entitlement credited back, and the freed member-pool seat promoting a waitlisted stay — and asserts the ordering by showing the promoted member could only be promoted after the credit-back step ran."
