scenario: |
  Film distribution and showtime scheduling system: film release window management with
  film profile (duration/rating/format-2D/3D/IMAX), distributor information, release-date
  setting, region-level release strategy, and shelving/delisting workflow; cinema scheduling
  strategy with cinema-tier classification, screen-and-format matching with film, distributor
  minimum-show-count requirement, peak-and-off-peak strategy, and competing-film coordination;
  automatic showtime arrangement with screening-room operating hours, between-show cleaning
  interval, trailer and ad time, multi-film parallel scheduling, and conflict and gap
  optimization; pre-sale box office tracking with pre-sale opening rules, pre-sale data
  aggregation, real-time box-office statistics, regional box-office comparison, and pre-sale
  anomaly detection (bulk-buying); revenue split settlement with distributor-cinema split
  ratio, special promotion split rules, ticket-platform commission, tax handling, settlement
  cycle, and refund-induced reversal; show-adjustment notification with adjustment reasons
  (low attendance/new-film insertion/incident), affected-ticket handling (refund/exchange),
  notification dispatch to ticket holders, and adjustment record archiving; event-driven
  synchronization with ticketing platform, payment, and cinema management systems; audit
  logging for schedule changes and settlement records.

domain_name: film-distribution-scheduling
api_prefix: /films

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many

  role_model: peer_roles
  consistency_model: immediate

  difficulty_level: Expert
  entity_count: 11
  endpoint_count: 28
  error_code_count: 24
  state_machine_count: 4
  calculation_count: 6
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (no prefix)" }
      - { name: name, type: string, source: input, description: "Distributor company name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: default_split_ratio_bps, type: integer, source: input, description: "Default share of net box-office allocated to distributor, in basis points (0-10000)", constraints: "0 <= x <= 10000" }
      - { name: min_show_count_per_week, type: integer, source: input, description: "Minimum number of showtimes a cinema must run for any film from this distributor per ISO-week", constraints: "x >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "values: ACTIVE, INACTIVE" }

  - name: Film
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: title, type: string, source: input, description: "Film title" }
      - { name: distributor_id, type: string, source: input, description: "FK Distributor.id" }
      - { name: duration_minutes, type: integer, source: input, description: "Film runtime in minutes", constraints: "x > 0" }
      - { name: rating, type: enum, source: input, description: "G | PG | PG13 | R | NC17", constraints: "values: G, PG, PG13, R, NC17" }
      - { name: format, type: enum, source: input, description: "2D | 3D | IMAX (single format per Film row; a title released in multiple formats is multiple Film records)", constraints: "values: 2D, 3D, IMAX" }
      - { name: release_date, type: datetime, source: input, description: "First date the film may be ON_SALE for screenings (ISO 8601, three fractional digits)" }
      - { name: region_strategy, type: object, source: input, description: "{ allowed_regions: [string], tier_caps: { TIER_1: int, TIER_2: int, TIER_3: int } } — list of region codes plus per-cinema-tier maximum simultaneous cinemas allowed" }
      - { name: status, type: enum, source: system, description: "PLANNED | RELEASED | SHELVED | DELISTED", default: "PLANNED", constraints: "values: PLANNED, RELEASED, SHELVED, DELISTED" }
      - { name: shelved_reason, type: string, source: system, required: false, description: "Reason captured at SHELVE transition (free text), cleared on re-RELEASE" }

  - name: Cinema
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Cinema name" }
      - { name: region_code, type: string, source: input, description: "Region code used to match Film.region_strategy.allowed_regions" }
      - { name: tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3", constraints: "values: TIER_1, TIER_2, TIER_3" }
      - { name: peak_window_start_minute, type: integer, source: input, description: "Minute-of-day (0..1439) marking start of peak slot, e.g., 1080 = 18:00", constraints: "0 <= x <= 1439", default: 1080 }
      - { name: peak_window_end_minute, type: integer, source: input, description: "Minute-of-day (0..1439) marking exclusive end of peak slot, e.g., 1380 = 23:00", constraints: "0 <= x <= 1439", default: 1380 }

  - name: Screen
    parent: Cinema
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: cinema_id, type: string, source: input, description: "FK Cinema.id" }
      - { name: label, type: string, source: input, description: "Internal label (e.g., 'Screen 4')" }
      - { name: supported_formats, type: array, source: input, description: "Subset of [2D, 3D, IMAX] the screen can play" }
      - { name: operating_start_minute, type: integer, source: input, description: "Minute-of-day operating-hours start (inclusive)", constraints: "0 <= x <= 1439" }
      - { name: operating_end_minute, type: integer, source: input, description: "Minute-of-day operating-hours end (exclusive)", constraints: "0 < x <= 1440, x > operating_start_minute" }
      - { name: cleaning_interval_minutes, type: integer, source: input, description: "Required clean-up gap between consecutive shows on this screen", constraints: "x >= 0", default: 15 }
      - { name: trailer_minutes, type: integer, source: input, description: "Trailer length played before each show", constraints: "x >= 0", default: 10 }
      - { name: ad_minutes, type: integer, source: input, description: "Ad block length played before each show", constraints: "x >= 0", default: 5 }
      - { name: seat_capacity, type: integer, source: input, description: "Number of seats", constraints: "x > 0" }

  - name: Showtime
    parent: Screen
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: screen_id, type: string, source: input, description: "FK Screen.id" }
      - { name: cinema_id, type: string, source: system, description: "Denormalised from screen.cinema_id" }
      - { name: film_id, type: string, source: input, description: "FK Film.id" }
      - { name: distributor_id, type: string, source: system, description: "Denormalised from film.distributor_id at creation" }
      - { name: start_minute, type: integer, source: input, description: "Minute-of-day the show block begins (ads start here)", constraints: "0 <= x <= 1439" }
      - { name: business_date, type: datetime, source: input, description: "Calendar date this showtime is scheduled for (ISO 8601, three fractional digits, midnight)" }
      - { name: block_minutes, type: integer, source: computed, description: "Total minutes the screen is occupied by this show; pinned by calculation showtime_block_minutes" }
      - { name: end_minute, type: integer, source: computed, description: "start_minute + block_minutes (may overflow into next-day if Screen permits; see validations)" }
      - { name: ticket_price_cents, type: integer, source: input, description: "Per-seat price in integer cents", constraints: "x >= 0" }
      - { name: presale_opens_at, type: datetime, source: input, description: "When presale opens (ISO 8601, three fractional digits)" }
      - { name: sale_status, type: enum, source: system, description: "PRESALE | ON_SALE | CLOSED — sales-side dimension", default: "PRESALE", constraints: "values: PRESALE, ON_SALE, CLOSED" }
      - { name: lifecycle_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED — execution-side dimension; parallel to sale_status", default: "SCHEDULED", constraints: "values: SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED" }
      - { name: tickets_sold_count, type: integer, source: computed, description: "Count of Tickets with status=VALID for this showtime" }
      - { name: tickets_refunded_count, type: integer, source: computed, description: "Count of Tickets with status in (REFUNDED, EXCHANGED) for this showtime" }
      - { name: gross_box_office_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over Tickets in status=VALID for this showtime" }
      - { name: anomaly_flag, type: boolean, source: computed, description: "True iff anomaly detection rule has tripped at least once for this showtime" }
      - { name: cancel_reason, type: enum, source: system, required: false, description: "LOW_ATTENDANCE | NEW_FILM_INSERTION | INCIDENT — set only when lifecycle_status transitions to CANCELLED", constraints: "values: LOW_ATTENDANCE, NEW_FILM_INSERTION, INCIDENT" }

  - name: Ticket
    parent: Showtime
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: showtime_id, type: string, source: input, description: "FK Showtime.id" }
      - { name: buyer_external_id, type: string, source: input, description: "Opaque ticketing-platform buyer reference" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Amount paid in cents (may differ from list price due to promo)", constraints: "x >= 0" }
      - { name: promo_code, type: string, source: input, required: false, description: "Optional promo code applied at purchase" }
      - { name: status, type: enum, source: system, description: "VALID | REFUNDED | EXCHANGED", default: "VALID", constraints: "values: VALID, REFUNDED, EXCHANGED" }
      - { name: exchanged_to_showtime_id, type: string, source: system, required: false, description: "If status=EXCHANGED, FK to the replacement Showtime" }
      - { name: purchased_at, type: datetime, source: system, description: "Server timestamp at purchase (ISO 8601, three fractional digits)" }
      - { name: refunded_at, type: datetime, source: system, required: false, description: "Server timestamp at refund or exchange" }

  - name: Settlement
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: showtime_id, type: string, source: input, description: "FK Showtime.id — settlements are 1:1 with showtime at POST time but reversal entries reference the same showtime_id" }
      - { name: cycle_label, type: string, source: input, description: "Settlement cycle (e.g., '2026-W19' ISO-week)" }
      - { name: kind, type: enum, source: system, description: "POSTING | REVERSAL — POSTING is the original split; REVERSAL is a compensating entry triggered by a ticket refund/exchange", constraints: "values: POSTING, REVERSAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | REVERSED — REVERSED status only applies to POSTING rows whose net effect has been fully offset by REVERSAL rows", default: "DRAFT", constraints: "values: DRAFT, POSTED, REVERSED" }
      - { name: gross_cents, type: integer, source: computed, description: "Source amount included in this entry (POSTING: gross_box_office_cents; REVERSAL: -paid_amount_cents of the refunded ticket)" }
      - { name: platform_commission_cents, type: integer, source: computed, description: "Ticket-platform commission allocated by calculation settlement_split" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax allocated by calculation settlement_split" }
      - { name: distributor_amount_cents, type: integer, source: computed, description: "Distributor share allocated by calculation settlement_split" }
      - { name: cinema_amount_cents, type: integer, source: computed, description: "Cinema share allocated by calculation settlement_split" }
      - { name: parent_settlement_id, type: string, source: system, required: false, description: "For kind=REVERSAL, FK to the POSTING row being reversed" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable — Settlement is append-only" }

  - name: ScheduleAdjustment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: showtime_id, type: string, source: input, description: "FK Showtime.id whose status changed" }
      - { name: adjustment_type, type: enum, source: input, description: "CANCEL | EXCHANGE_TARGET | INSERTION — INSERTION records a new showtime created by NEW_FILM_INSERTION displacement", constraints: "values: CANCEL, EXCHANGE_TARGET, INSERTION" }
      - { name: reason, type: enum, source: input, description: "LOW_ATTENDANCE | NEW_FILM_INSERTION | INCIDENT", constraints: "values: LOW_ATTENDANCE, NEW_FILM_INSERTION, INCIDENT" }
      - { name: affected_ticket_ids, type: array, source: system, description: "Snapshot of Ticket.id list affected at archive time" }
      - { name: notifications_dispatched, type: integer, source: system, description: "Count of notification events emitted to ticket holders" }
      - { name: archived_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable" }

  - name: AnomalyAlert
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: showtime_id, type: string, source: input, description: "FK Showtime.id" }
      - { name: buyer_external_id, type: string, source: input, description: "Buyer flagged for bulk-buying" }
      - { name: rule, type: enum, source: system, description: "ROLLING_WINDOW | CUMULATIVE — see calculations.presale_anomaly_score", constraints: "values: ROLLING_WINDOW, CUMULATIVE" }
      - { name: triggering_count, type: integer, source: system, description: "Number of tickets in the qualifying window that breached the threshold" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable" }

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: kind, type: enum, source: input, description: "TICKETING_PLATFORM | PAYMENT | CINEMA_MGMT — origin system for event-driven sync", constraints: "values: TICKETING_PLATFORM, PAYMENT, CINEMA_MGMT" }
      - { name: payload, type: object, source: input, description: "Event body forwarded from the upstream system" }
      - { name: applied, type: boolean, source: system, description: "True after server has handled the event" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at time of action" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at time of action" }
      - { name: action, type: enum, source: system, description: "FILM_RELEASE | FILM_SHELVE | FILM_DELIST | SHOWTIME_CREATE | SHOWTIME_CANCEL | SETTLEMENT_POST | SETTLEMENT_REVERSE | TICKET_REFUND | TICKET_EXCHANGE | CLOCK_ADVANCE | SWEEP_RUN", constraints: "values: FILM_RELEASE, FILM_SHELVE, FILM_DELIST, SHOWTIME_CREATE, SHOWTIME_CANCEL, SETTLEMENT_POST, SETTLEMENT_REVERSE, TICKET_REFUND, TICKET_EXCHANGE, CLOCK_ADVANCE, SWEEP_RUN" }
      - { name: target_entity, type: string, source: system, description: "Entity name, e.g., 'Showtime'" }
      - { name: target_id, type: string, source: system, description: "ID of mutated entity" }
      - { name: payload_snapshot, type: object, source: system, description: "Snapshot of relevant fields after the action" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Film
    field: status
    initial_state: PLANNED
    terminal_states: [DELISTED]
    note: "Cyclic — SHELVED ⇄ RELEASED supports re-release loops; DELISTED is terminal."
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /films/{film_id}/release (system clock must satisfy now() >= release_date)"
        actor: DistributorOps
        preconditions:
          - "Film.release_date <= server clock now()"
          - "Distributor.status == ACTIVE"
        side_effects:
          - "Film.status := RELEASED; Film.shelved_reason := null; updated_at refreshed"
          - "AuditLog row emitted with action=FILM_RELEASE"

      - from: RELEASED
        to: SHELVED
        trigger: "POST /films/{film_id}/shelve"
        actor: DistributorOps
        preconditions:
          - "Film has at least one Showtime in lifecycle_status=SCHEDULED OR lifecycle_status=IN_PROGRESS"
        side_effects:
          - "Film.status := SHELVED; Film.shelved_reason := request.reason"
          - "All future Showtimes for this film (lifecycle_status=SCHEDULED) flip sale_status from PRESALE/ON_SALE → CLOSED (purchases blocked); lifecycle_status stays SCHEDULED"
          - "AuditLog row emitted with action=FILM_SHELVE"

      - from: SHELVED
        to: RELEASED
        trigger: "POST /films/{film_id}/release"
        actor: DistributorOps
        preconditions:
          - "Film.release_date <= now()"
        side_effects:
          - "Film.status := RELEASED; Film.shelved_reason := null"
          - "Showtimes that were CLOSED purely due to shelving (lifecycle_status=SCHEDULED) reopen sale_status per presale_opens_at rule"
          - "AuditLog row emitted with action=FILM_RELEASE"

      - from: [PLANNED, RELEASED, SHELVED]
        to: DELISTED
        trigger: "POST /films/{film_id}/delist"
        actor: DistributorOps
        preconditions: []
        side_effects:
          - "Film.status := DELISTED"
          - "Cascade hop 1 — every Showtime for this film with lifecycle_status=SCHEDULED is force-set lifecycle_status=CANCELLED, cancel_reason=NEW_FILM_INSERTION on a delist is rejected; here cancel_reason=INCIDENT is used; sale_status=CLOSED"
          - "Cascade hop 2 — every Ticket for those cancelled Showtimes with status=VALID is set to status=REFUNDED, refunded_at=now()"
          - "Cascade hop 3 — for each refunded ticket whose original POSTING Settlement is in status=POSTED, append a REVERSAL Settlement row (kind=REVERSAL, parent_settlement_id pointing at the POSTING)"
          - "Cascade hop 4 — one ScheduleAdjustment row per cancelled Showtime archived with adjustment_type=CANCEL, reason=INCIDENT, affected_ticket_ids and notifications_dispatched populated"
          - "AuditLog row emitted with action=FILM_DELIST"

  - entity: Showtime
    field: sale_status
    initial_state: PRESALE
    terminal_states: [CLOSED]
    note: "Parallel dimension to lifecycle_status — sale_status and lifecycle_status evolve independently. sale_status governs whether Tickets may be purchased; lifecycle_status governs execution."
    transitions:
      - from: PRESALE
        to: ON_SALE
        trigger: "system sweep POST /_sweep/run or implicit on ticket purchase attempt (lazy evaluation) once now() >= presale_opens_at"
        actor: system
        preconditions:
          - "Showtime.presale_opens_at <= now()"
          - "Film.status == RELEASED"
        side_effects:
          - "Showtime.sale_status := ON_SALE"

      - from: [PRESALE, ON_SALE]
        to: CLOSED
        trigger: "system on lifecycle_status=IN_PROGRESS, lifecycle_status=COMPLETED, lifecycle_status=CANCELLED, or POST /films/{film_id}/shelve"
        actor: system
        preconditions:
          - "Showtime.lifecycle_status transitions to IN_PROGRESS/COMPLETED/CANCELLED, OR parent Film just shelved"
        side_effects:
          - "Showtime.sale_status := CLOSED; ticket purchase POSTs rejected with ERR_SHOWTIME_NOT_ON_SALE"

  - entity: Showtime
    field: lifecycle_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Parallel dimension to sale_status."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system sweep POST /_sweep/run once now() crosses business_date+start_minute"
        actor: system
        preconditions:
          - "now() >= business_date + start_minute"
          - "Film.status IN {RELEASED}"
        side_effects:
          - "Showtime.lifecycle_status := IN_PROGRESS; Showtime.sale_status := CLOSED"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system sweep POST /_sweep/run once now() crosses business_date+end_minute"
        actor: system
        preconditions:
          - "now() >= business_date + end_minute"
        side_effects:
          - "Showtime.lifecycle_status := COMPLETED"
          - "Settlement DRAFT row may now be POSTED (separate /settlements POST call)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /showtimes/{showtime_id}/cancel"
        actor: CinemaOps
        preconditions:
          - "cancel_reason in {LOW_ATTENDANCE, NEW_FILM_INSERTION, INCIDENT}"
          - "If cancel_reason=LOW_ATTENDANCE: gross_box_office_cents / (Screen.seat_capacity * ticket_price_cents) < LOW_ATTENDANCE_THRESHOLD (see calculations.attendance_rate)"
        side_effects:
          - "Showtime.lifecycle_status := CANCELLED; Showtime.cancel_reason := request.cancel_reason; Showtime.sale_status := CLOSED"
          - "Cascade hop 1 — every VALID Ticket for this Showtime → status := REFUNDED (or EXCHANGED if exchange target supplied in same request), refunded_at := now()"
          - "Cascade hop 2 — for each refunded ticket whose POSTING Settlement is POSTED, append REVERSAL Settlement row"
          - "ScheduleAdjustment row archived (adjustment_type=CANCEL, reason=cancel_reason)"
          - "AuditLog row emitted with action=SHOWTIME_CANCEL"

  - entity: Settlement
    field: status
    initial_state: DRAFT
    terminal_states: [REVERSED]
    note: "POSTING-kind rows progress DRAFT→POSTED→REVERSED. REVERSAL-kind rows are born at POSTED (immutable append-only ledger entries)."
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /settlements/{settlement_id}/post"
        actor: FinanceOps
        preconditions:
          - "Settlement.kind == POSTING"
          - "Showtime.lifecycle_status == COMPLETED (cross-entity dependency: cannot post a settlement whose underlying showtime hasn't completed)"
        side_effects:
          - "Settlement.status := POSTED"
          - "AuditLog row emitted with action=SETTLEMENT_POST"

      - from: POSTED
        to: REVERSED
        trigger: "system, when sum(REVERSAL rows referencing this POSTING) equals this POSTING's gross_cents"
        actor: system
        preconditions:
          - "sum of all child REVERSAL.gross_cents (as negative) + this POSTING.gross_cents == 0"
        side_effects:
          - "Settlement.status := REVERSED"
          - "AuditLog row emitted with action=SETTLEMENT_REVERSE"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ticket purchases race for the last seat on a Showtime"
    guarantee: "At most tickets_sold_count <= Screen.seat_capacity at all times; second purchase rejected once capacity reached"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Showtime.tickets_sold_count increment"

  - scenario: "Two scheduling calls try to create overlapping Showtimes on the same Screen"
    guarantee: "At most one Showtime per [Screen, time-interval]; second creation rejected"
    error_id: ERR_SCREEN_TIME_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on (screen_id, business_date, start_minute) tuple"

  - scenario: "Showtime cancel and ticket purchase race"
    guarantee: "If cancel commits first, subsequent purchase fails with ERR_SHOWTIME_NOT_ON_SALE; if purchase commits first, it is included in cascade refund"
    error_id: ERR_SHOWTIME_NOT_ON_SALE
    http_status: 409
    serialization: "First-writer-wins on Showtime.lifecycle_status; cascading refund includes any ticket whose insert observed sale_status != CLOSED at commit"

  - scenario: "Settlement POST and ticket refund race for the same showtime"
    guarantee: "Either POST wins and the refund subsequently appends a REVERSAL row, or refund wins and POST observes the refunded ticket excluded from gross_cents"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Showtime.version; the loser retries"

  - scenario: "Optimistic concurrency conflict on Film mutation (release/shelve/delist)"
    guarantee: "First-writer-wins on Film.version; second mutation rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "If-Match required on PATCH/POST action endpoints"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: showtime_block_minutes
    trigger: "POST /screens/{screen_id}/showtimes (creation) and on Screen ad/trailer/cleaning adjustments"
    algorithm: tiered_pricing
    formula: |
      base = Film.duration_minutes + Screen.trailer_minutes + Screen.ad_minutes
      if Film.format == "IMAX":
          format_setup = 5
      elif Film.format == "3D":
          format_setup = 3
      else:  # 2D
          format_setup = 0
      block_minutes = base + format_setup
      end_minute = start_minute + block_minutes      # ad_block + trailer + film, NO cleaning included in block
      # cleaning interval is enforced separately in screen_time_conflict validation
    input_set: "Film and Screen referenced by the new Showtime"
    constants:
      IMAX_SETUP_MINUTES: 5
      THREEEDEE_SETUP_MINUTES: 3
      TWODEE_SETUP_MINUTES: 0
    precision: "integer minutes"
    note: "Mode (a) of Rule 2 — combinatorial formula with 3+ inputs (duration, trailer, ad, format) and conditional branch on Film.format. Cleaning interval is intentionally NOT part of block_minutes — it is a separate adjacency rule between two consecutive Showtimes; see validation priority 11."

  - name: settlement_split
    trigger: "POST /settlements (DRAFT creation) and POST /settlements/{id}/post"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: showtime, distributor split bps, list of VALID tickets at evaluation time
      # ORDER OF OPERATIONS IS PINNED — DO NOT REORDER.
      # Step 1: per-ticket platform commission rounded half-up to cents, then summed.
      per_ticket_platform_cents = []
      for t in tickets_in_evaluation_set:
          fee = round(t.paid_amount_cents * PLATFORM_COMMISSION_BPS / 10000, half_up)
          per_ticket_platform_cents.append(fee)
      platform_commission_cents = sum(per_ticket_platform_cents)
      # Step 2: gross = sum of paid_amount_cents over the evaluation set.
      gross_cents = sum(t.paid_amount_cents for t in tickets_in_evaluation_set)
      # Step 3: net_after_platform = gross_cents - platform_commission_cents
      net_after_platform = gross_cents - platform_commission_cents
      # Step 4: tax computed on net_after_platform, single round half-up.
      tax_cents = round(net_after_platform * TAX_BPS / 10000, half_up)
      # Step 5: net_after_tax = net_after_platform - tax_cents
      net_after_tax = net_after_platform - tax_cents
      # Step 6: distributor share = round_half_up(net_after_tax * distributor_share_bps / 10000)
      #         where distributor_share_bps = Distributor.default_split_ratio_bps,
      #         UNLESS a promo_code applied to AT LEAST ONE ticket in the set — then PROMO_DISTRIBUTOR_BPS_OVERRIDE applies (e.g., 5000 = 50/50).
      effective_bps = (PROMO_DISTRIBUTOR_BPS_OVERRIDE
                       if any(t.promo_code for t in tickets_in_evaluation_set)
                       else Distributor.default_split_ratio_bps)
      distributor_amount_cents = round(net_after_tax * effective_bps / 10000, half_up)
      # Step 7: cinema_amount_cents = net_after_tax - distributor_amount_cents  (waterfall remainder)
      cinema_amount_cents = net_after_tax - distributor_amount_cents
      # INVARIANT: distributor_amount_cents + cinema_amount_cents + tax_cents + platform_commission_cents == gross_cents
    input_set: |
      POSTING: all Tickets with status=VALID for the Showtime, evaluated at POST time.
      REVERSAL: exactly one Ticket — the one being refunded/exchanged. evaluation_set has size 1.
    constants:
      PLATFORM_COMMISSION_BPS: 800            # 8% platform commission
      TAX_BPS: 600                            # 6% tax on net_after_platform
      PROMO_DISTRIBUTOR_BPS_OVERRIDE: 5000    # 50/50 split when any ticket carries a promo_code
    precision: "integer cents, round_half_up at each named round() step"
    variants:
      - name: posting_variant
        when: "kind=POSTING, evaluated over the FULL set of VALID Tickets for the Showtime at POST time"
        difference: "platform_commission_cents is the SUM of per-ticket rounded values (round-then-sum). gross_cents reflects all current VALID tickets."
      - name: reversal_variant
        when: "kind=REVERSAL, evaluated over the SINGLE refunded ticket"
        difference: "platform_commission_cents is computed on the single ticket; gross_cents is negative (the refunded amount appears as a debit). Because per-ticket rounding occurs before summation, REVERSING a ticket subtracts exactly its rounded share of platform_commission_cents — NOT a fresh-computed slice of a hypothetical net total. Provisional (POSTING) and final (POSTING - REVERSALS) numbers therefore differ when promo eligibility flipped on the refund."
    note: |
      Mode (b) of Rule 2 — nested rounding order: per-ticket round THEN sum for platform commission;
      single rounding at the net-tax level. Rule 1 dual variant: posting_variant vs reversal_variant
      operate on the same gross but produce different totals due to per-line rounding and promo
      eligibility recomputation on the reduced set.

  - name: presale_anomaly_score
    trigger: "POST /showtimes/{showtime_id}/tickets (each purchase)"
    algorithm: threshold
    formula: |
      now = server clock now()
      # ROLLING_WINDOW rule
      rolling_count = count(Tickets t where t.showtime_id == this.showtime_id
                            and t.buyer_external_id == this.buyer_external_id
                            and t.status == VALID
                            and t.purchased_at >= now - 60 minutes
                            and t.purchased_at <= now)
      # CUMULATIVE rule
      cumulative_count = count(Tickets t where t.showtime_id == this.showtime_id
                               and t.buyer_external_id == this.buyer_external_id
                               and t.status == VALID)
      anomaly_triggered = (rolling_count >= ROLLING_WINDOW_THRESHOLD) OR (cumulative_count >= CUMULATIVE_THRESHOLD)
      rule_triggered = "ROLLING_WINDOW" if rolling_count >= ROLLING_WINDOW_THRESHOLD else "CUMULATIVE"
    input_set: "Tickets table filtered by showtime_id, buyer_external_id, status=VALID; rolling window of last 60 minutes vs full history"
    constants:
      ROLLING_WINDOW_THRESHOLD: 10            # 10 tickets in 60 minutes
      CUMULATIVE_THRESHOLD: 30                # 30 tickets total
      WINDOW_MINUTES: 60
    precision: "integer counts; thresholds use >= (inclusive)"
    variants:
      - name: rolling_window_variant
        when: "fast bulk purchase within 60 minutes"
        difference: "Time-bounded denominator; flags burst behaviour. Threshold at 10 tickets."
      - name: cumulative_variant
        when: "slow drip exceeding 30 total tickets per buyer per showtime"
        difference: "Unbounded denominator over all VALID tickets for the buyer/showtime. Threshold at 30 tickets."
    note: |
      Rule 1 dual variant — same input domain (Tickets) but two algorithms (rolling-window vs cumulative)
      producing different verdicts; AND operates on a different entity domain (Ticket/Buyer) than
      settlement_split (Showtime/Settlement).

  - name: attendance_rate
    trigger: "POST /showtimes/{showtime_id}/cancel when cancel_reason=LOW_ATTENDANCE"
    algorithm: threshold
    formula: |
      max_revenue_cents = Screen.seat_capacity * Showtime.ticket_price_cents
      attendance_rate_bps = (Showtime.gross_box_office_cents * 10000) // max_revenue_cents
      # Integer division (floor) is intentional — pin the boundary
      low_attendance = attendance_rate_bps < LOW_ATTENDANCE_THRESHOLD_BPS
    input_set: "Showtime and its parent Screen at cancel-attempt time"
    constants:
      LOW_ATTENDANCE_THRESHOLD_BPS: 1500      # 15.00%
    precision: "integer basis points, floor division"
    note: "Boundary precision: strict '<' — attendance_rate_bps==1500 does NOT qualify as low (Rule 6 mode-a)."

  - name: weekly_min_show_count
    trigger: "POST /screens/{screen_id}/showtimes (creation) and POST /showtimes/{showtime_id}/cancel"
    algorithm: aggregation
    formula: |
      # For the ISO-week containing Showtime.business_date, count distinct Showtimes whose
      # film.distributor_id == this.distributor_id and whose lifecycle_status IN {SCHEDULED, IN_PROGRESS, COMPLETED}
      # (CANCELLED excluded) across ALL Cinemas in the requesting Cinema (when validating per cinema)
      # OR across the system (when validating distributor-level totals).
      # The PER-CINEMA per-distributor target is Distributor.min_show_count_per_week.
      count = count(Showtime s where iso_week(s.business_date) == iso_week(this.business_date)
                                  and Film.distributor_id == this.film.distributor_id
                                  and s.cinema_id == this.cinema_id
                                  and s.lifecycle_status in {SCHEDULED, IN_PROGRESS, COMPLETED})
      satisfied = count >= Distributor.min_show_count_per_week
    input_set: "Showtimes filtered by ISO week of business_date, cinema_id, distributor_id, lifecycle_status NOT IN {CANCELLED}"
    constants: {}
    precision: "integer counts; inclusive >= threshold"
    note: |
      Cancellation that would drop a [cinema, distributor, week] count below min_show_count_per_week is
      rejected with ERR_MIN_SHOW_COUNT_BREACH unless cancel_reason=INCIDENT (force majeure exception).
      Rule 6 mode-b: inclusive '>=' boundary on count.

  - name: showtime_gross_box_office
    trigger: "any Ticket insert/update touching status; settlement_split read"
    algorithm: aggregation
    formula: |
      gross_box_office_cents = sum(t.paid_amount_cents for t in Tickets where t.showtime_id == this.id and t.status == VALID)
      tickets_sold_count    = count(t for t in Tickets where t.showtime_id == this.id and t.status == VALID)
      tickets_refunded_count = count(t for t in Tickets where t.showtime_id == this.id and t.status in {REFUNDED, EXCHANGED})
    input_set: "Tickets table filtered by showtime_id and status"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_HEADERS_MISSING
    http_status: 401
    applies_to: "all endpoints except GET /_meta/health"

  - priority: 2
    category: auth
    check: "X-User-Role is authorized for the endpoint per §1.7 RBAC Matrix"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced parent and target resources exist (validated left-to-right in URL path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Foreign-key references in request body resolve to existing rows (e.g., film_id, screen_id, distributor_id, showtime_id, exchanged_to_showtime_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH endpoints carrying foreign keys"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (release, shelve, delist, cancel showtime, post settlement, refund ticket, exchange ticket)"

  - priority: 6
    category: state
    check: "Cross-entity state dependency — Showtime sale_status cannot transition to ON_SALE if Film.status != RELEASED"
    error_id: ERR_FILM_NOT_RELEASED
    http_status: 409
    applies_to: "implicit on POST /showtimes/{id}/tickets and explicit on POST /_sweep/run side effects"

  - priority: 7
    category: state
    check: "Cross-entity state dependency — Settlement POST requires Showtime.lifecycle_status == COMPLETED"
    error_id: ERR_SHOWTIME_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /settlements/{id}/post"

  - priority: 8
    category: business_safety
    check: "Presale anomaly — if presale_anomaly_score trips, reject the offending ticket purchase AND insert an AnomalyAlert; the ticket is NOT persisted"
    error_id: ERR_PRESALE_ANOMALY_DETECTED
    http_status: 409
    applies_to: "POST /showtimes/{showtime_id}/tickets"

  - priority: 9
    category: business_constraint
    check: "Format matching — Film.format must appear in Screen.supported_formats"
    error_id: ERR_SCREEN_FORMAT_MISMATCH
    http_status: 422
    applies_to: "POST /screens/{screen_id}/showtimes"

  - priority: 10
    category: business_constraint
    check: "Region-strategy — Film.region_strategy.allowed_regions must include Cinema.region_code, and active SCHEDULED-or-later cinemas count for this film in the cinema's tier must be < tier_caps[cinema.tier]"
    error_id: ERR_REGION_STRATEGY_VIOLATION
    http_status: 422
    applies_to: "POST /screens/{screen_id}/showtimes"

  - priority: 11
    category: business_temporal
    check: |
      Screen time conflict — for any other Showtime S' on the SAME Screen with lifecycle_status != CANCELLED,
      the interval [S'.start_minute, S'.end_minute + Screen.cleaning_interval_minutes) on the same business_date
      MUST NOT overlap with [this.start_minute, this.end_minute) (half-open intervals; cleaning buffer applied
      to the RIGHT of the earlier showtime).
    error_id: ERR_SCREEN_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /screens/{screen_id}/showtimes"

  - priority: 12
    category: business_temporal
    check: |
      Operating hours — start_minute >= Screen.operating_start_minute AND end_minute <= Screen.operating_end_minute.
      end_minute is inclusive-open on the right (must be <=, not <), so a show finishing exactly at operating_end_minute is allowed.
    error_id: ERR_OUTSIDE_OPERATING_HOURS
    http_status: 422
    applies_to: "POST /screens/{screen_id}/showtimes"

  - priority: 13
    category: business_temporal
    check: |
      Competing-film coordination — within the same Cinema during its peak window
      [peak_window_start_minute, peak_window_end_minute), at most COMPETING_PEAK_CAP=1 Showtime per Distributor.id
      may have start_minute in that window per business_date (aggregate density cap; intervals treated as
      CLOSED-CLOSED point-membership for window inclusion).
    error_id: ERR_COMPETING_FILM_CONFLICT
    http_status: 409
    applies_to: "POST /screens/{screen_id}/showtimes"

  - priority: 14
    category: business_fiscal
    check: |
      Seat capacity — Showtime.tickets_sold_count + 1 <= Screen.seat_capacity on every ticket purchase.
      Strictly inclusive boundary: the (seat_capacity)-th sale succeeds; the (seat_capacity+1)-th is rejected.
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /showtimes/{showtime_id}/tickets"

  - priority: 15
    category: business_fiscal
    check: |
      Per-buyer cumulative cap — for the same showtime_id and buyer_external_id, count of VALID Tickets
      strictly < PER_BUYER_HARD_CAP=20. This sits BELOW priority 8 (presale anomaly) — anomaly is safety,
      this is a fiscal limit. When both would fire on the same request, priority 8 wins.
    error_id: ERR_PER_BUYER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /showtimes/{showtime_id}/tickets"

  - priority: 16
    category: business_referential
    check: |
      Distributor weekly minimum — cancelling a Showtime that would drop weekly_min_show_count below
      Distributor.min_show_count_per_week is rejected unless cancel_reason=INCIDENT. This sits ABOVE
      the lower-priority duplication check below (priority 17).
    error_id: ERR_MIN_SHOW_COUNT_BREACH
    http_status: 409
    applies_to: "POST /showtimes/{showtime_id}/cancel"

  - priority: 17
    category: business_referential
    check: |
      Duplicate idempotency — repeating a settlement POST or ticket refund for the same target with the same
      version is rejected with ERR_DUPLICATE_OPERATION (idempotency on action endpoints).
    error_id: ERR_DUPLICATE_OPERATION
    http_status: 409
    applies_to: "POST /settlements/{id}/post, POST /tickets/{id}/refund, POST /tickets/{id}/exchange"

  - priority: 18
    category: state
    check: "Optimistic concurrency — If-Match-style request body field 'version' must match current entity version on mutation endpoints"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints with common_fields=true target"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Distributors ---
  - method: POST
    path: "/distributors"
    description: "Create distributor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email, default_split_ratio_bps, min_show_count_per_week]
    output: Distributor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/distributors/{distributor_id}"
    description: "Read distributor"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  # --- Films ---
  - method: POST
    path: "/films"
    description: "Create film (status defaults to PLANNED)"
    roles: [DistributorOps]
    code: 201
    input: [title, distributor_id, duration_minutes, rating, format, release_date, region_strategy]
    output: Film
    side_effects: ["status=PLANNED"]

  - method: GET
    path: "/films/{film_id}"
    description: "Read film"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Film
    side_effects: []

  - method: POST
    path: "/films/{film_id}/release"
    description: "Transition Film PLANNED→RELEASED or SHELVED→RELEASED"
    roles: [DistributorOps]
    code: 200
    input: [version]
    output: Film
    side_effects: ["Film.status:=RELEASED", "shelved_reason cleared", "shelved showtimes reopen"]

  - method: POST
    path: "/films/{film_id}/shelve"
    description: "Transition Film RELEASED→SHELVED"
    roles: [DistributorOps]
    code: 200
    input: [version, reason]
    output: Film
    side_effects: ["Film.status:=SHELVED", "all SCHEDULED future Showtimes flip sale_status→CLOSED"]

  - method: POST
    path: "/films/{film_id}/delist"
    description: "Transition Film to DELISTED (terminal); cascades to Showtimes → Tickets → Settlements"
    roles: [DistributorOps]
    code: 200
    input: [version]
    output: Film
    side_effects:
      - "Film.status:=DELISTED"
      - "Cascade: SCHEDULED Showtimes → CANCELLED (cancel_reason=INCIDENT)"
      - "Cascade: VALID Tickets → REFUNDED"
      - "Cascade: POSTED Settlements → REVERSAL rows appended"
      - "Cascade: one ScheduleAdjustment per cancelled Showtime"

  # --- Cinemas ---
  - method: POST
    path: "/cinemas"
    description: "Create cinema"
    roles: [CinemaOps]
    code: 201
    input: [name, region_code, tier, peak_window_start_minute, peak_window_end_minute]
    output: Cinema
    side_effects: []

  - method: GET
    path: "/cinemas/{cinema_id}"
    description: "Read cinema"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Cinema
    side_effects: []

  # --- Screens ---
  - method: POST
    path: "/cinemas/{cinema_id}/screens"
    description: "Create screen under cinema"
    roles: [CinemaOps]
    code: 201
    input: [label, supported_formats, operating_start_minute, operating_end_minute, cleaning_interval_minutes, trailer_minutes, ad_minutes, seat_capacity]
    output: Screen
    side_effects: []

  - method: GET
    path: "/screens/{screen_id}"
    description: "Read screen"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Screen
    side_effects: []

  - method: POST
    path: "/screens/{screen_id}/showtimes"
    description: "Schedule a new Showtime on this screen (computes block_minutes, end_minute, runs validations 9–13)"
    roles: [CinemaOps]
    code: 201
    input: [film_id, start_minute, business_date, ticket_price_cents, presale_opens_at]
    output: Showtime
    side_effects:
      - "block_minutes and end_minute pinned by showtime_block_minutes"
      - "lifecycle_status=SCHEDULED, sale_status=PRESALE"
      - "AuditLog row action=SHOWTIME_CREATE"

  # --- Showtimes ---
  - method: GET
    path: "/showtimes/{showtime_id}"
    description: "Read showtime (returns computed aggregates)"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Showtime
    side_effects: []

  - method: GET
    path: "/showtimes"
    description: "List showtimes with filtering by cinema_id, film_id, business_date, lifecycle_status, sale_status"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: ["cinema_id?", "film_id?", "business_date?", "lifecycle_status?", "sale_status?", "limit?", "offset?"]
    output: "Showtime[]"
    side_effects: []

  - method: POST
    path: "/showtimes/{showtime_id}/cancel"
    description: "Cancel a SCHEDULED showtime; cascades to Tickets and Settlements"
    roles: [CinemaOps]
    code: 200
    input: [version, cancel_reason, "exchange_to_showtime_id?"]
    output: Showtime
    side_effects:
      - "lifecycle_status:=CANCELLED, sale_status:=CLOSED"
      - "Cascade refund/exchange of VALID tickets"
      - "Cascade REVERSAL settlements"
      - "ScheduleAdjustment archived"
      - "AuditLog action=SHOWTIME_CANCEL"

  # --- Tickets ---
  - method: POST
    path: "/showtimes/{showtime_id}/tickets"
    description: "Purchase a ticket (idempotent via buyer_external_id+request_nonce in header — server-side; not modelled as request body field)"
    roles: [TicketingPlatform]
    code: 201
    input: [buyer_external_id, paid_amount_cents, "promo_code?"]
    output: Ticket
    side_effects:
      - "Showtime.sale_status auto-transitions PRESALE→ON_SALE if presale_opens_at reached"
      - "presale_anomaly_score evaluated; on trigger → ERR_PRESALE_ANOMALY_DETECTED + AnomalyAlert row"
      - "Showtime.tickets_sold_count and gross_box_office_cents recomputed"

  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Read ticket"
    roles: [PlatformAdmin, TicketingPlatform, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: POST
    path: "/tickets/{ticket_id}/refund"
    description: "Refund a VALID ticket (compensating action)"
    roles: [TicketingPlatform, CinemaOps]
    code: 200
    input: [version]
    output: Ticket
    side_effects:
      - "Ticket.status:=REFUNDED, refunded_at:=now()"
      - "Showtime.gross_box_office_cents recomputed"
      - "If POSTING Settlement is POSTED → REVERSAL Settlement row appended; if all REVERSAL rows zero out → POSTING Settlement.status:=REVERSED"
      - "AuditLog action=TICKET_REFUND"

  - method: POST
    path: "/tickets/{ticket_id}/exchange"
    description: "Exchange a VALID ticket onto a new Showtime (must be SCHEDULED, sale_status in PRESALE or ON_SALE, format/price compatible)"
    roles: [TicketingPlatform, CinemaOps]
    code: 200
    input: [version, exchanged_to_showtime_id]
    output: Ticket
    side_effects:
      - "Original Ticket.status:=EXCHANGED, refunded_at:=now()"
      - "REVERSAL Settlement row appended for the original ticket if its POSTING was POSTED"
      - "New child Ticket created on the destination showtime (paid_amount_cents carried; promo_code carried)"
      - "AuditLog action=TICKET_EXCHANGE"

  # --- Settlements ---
  - method: POST
    path: "/settlements"
    description: "Create DRAFT POSTING Settlement for a completed showtime"
    roles: [FinanceOps]
    code: 201
    input: [showtime_id, cycle_label]
    output: Settlement
    side_effects: ["kind=POSTING, status=DRAFT", "split fields computed by settlement_split using current VALID tickets"]

  - method: POST
    path: "/settlements/{settlement_id}/post"
    description: "Transition Settlement DRAFT→POSTED"
    roles: [FinanceOps]
    code: 200
    input: [version]
    output: Settlement
    side_effects: ["Settlement.status:=POSTED", "AuditLog action=SETTLEMENT_POST"]

  - method: GET
    path: "/settlements/{settlement_id}"
    description: "Read settlement"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements with filters (cycle_label, showtime_id, kind, status)"
    roles: [PlatformAdmin, DistributorOps, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: ["cycle_label?", "showtime_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  # --- Reports / Anomalies / Adjustments ---
  - method: GET
    path: "/anomaly-alerts"
    description: "List anomaly alerts (filter by showtime_id, buyer_external_id, rule)"
    roles: [PlatformAdmin, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: ["showtime_id?", "buyer_external_id?", "rule?", "limit?", "offset?"]
    output: "AnomalyAlert[]"
    side_effects: []

  - method: GET
    path: "/schedule-adjustments"
    description: "List archived schedule adjustments"
    roles: [PlatformAdmin, CinemaOps, FinanceOps, Auditor]
    code: 200
    input: ["showtime_id?", "reason?", "adjustment_type?", "limit?", "offset?"]
    output: "ScheduleAdjustment[]"
    side_effects: []

  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (filter by action, target_entity, target_id)"
    roles: [PlatformAdmin, Auditor]
    code: 200
    input: ["action?", "target_entity?", "target_id?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test/clock/sweep/event harness ---
  - method: POST
    path: "/_clock/advance"
    description: "Test harness — advance server clock to the given ISO 8601 instant (idempotent; rejected if instant <= current clock)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_timestamp]
    output: null
    side_effects: ["server clock now() := to_timestamp", "AuditLog action=CLOCK_ADVANCE"]

  - method: POST
    path: "/_sweep/run"
    description: "Test harness — run periodic sweep that progresses Showtime.sale_status PRESALE→ON_SALE, lifecycle_status SCHEDULED→IN_PROGRESS→COMPLETED for time-eligible rows"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["State transitions per §1.2 system-actor rules", "AuditLog action=SWEEP_RUN"]

  - method: POST
    path: "/_events/external"
    description: "Test harness — accept an inbound event from ticketing-platform/payment/cinema-mgmt for event-driven sync"
    roles: [PlatformAdmin, TicketingPlatform]
    code: 201
    input: [kind, payload]
    output: ExternalEvent
    side_effects: ["ExternalEvent persisted with applied=false then handler applied=true"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_HEADERS_MISSING
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"

  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint per RBAC matrix"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource referenced in URL path does not exist"

  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "Foreign key in request body does not resolve"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state that permits the requested transition"

  - id: ERR_FILM_NOT_RELEASED
    http: 409
    condition: "Operation requires Film.status=RELEASED (e.g., ticket purchase)"

  - id: ERR_SHOWTIME_NOT_COMPLETED
    http: 409
    condition: "Settlement POST requires Showtime.lifecycle_status=COMPLETED"

  - id: ERR_SHOWTIME_NOT_ON_SALE
    http: 409
    condition: "Ticket purchase attempted while Showtime.sale_status != ON_SALE"

  - id: ERR_PRESALE_ANOMALY_DETECTED
    http: 409
    condition: "Per-buyer bulk-buying threshold tripped (rolling-window or cumulative)"

  - id: ERR_SCREEN_FORMAT_MISMATCH
    http: 422
    condition: "Film.format not in Screen.supported_formats"

  - id: ERR_REGION_STRATEGY_VIOLATION
    http: 422
    condition: "Cinema.region_code not in Film.region_strategy.allowed_regions OR tier_cap exceeded"

  - id: ERR_SCREEN_TIME_CONFLICT
    http: 409
    condition: "Proposed showtime overlaps an existing non-cancelled showtime on the same screen including cleaning buffer"

  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 422
    condition: "Showtime start_minute or end_minute violates Screen operating hours"

  - id: ERR_COMPETING_FILM_CONFLICT
    http: 409
    condition: "Cinema peak window already has a Showtime for this distributor on the same business_date"

  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "Showtime.tickets_sold_count would exceed Screen.seat_capacity"

  - id: ERR_PER_BUYER_LIMIT_EXCEEDED
    http: 409
    condition: "Buyer would exceed PER_BUYER_HARD_CAP=20 valid tickets on this showtime"

  - id: ERR_MIN_SHOW_COUNT_BREACH
    http: 409
    condition: "Cancellation would drop per-cinema per-distributor weekly count below Distributor.min_show_count_per_week (unless cancel_reason=INCIDENT)"

  - id: ERR_DUPLICATE_OPERATION
    http: 409
    condition: "Action repeated with same version against an already-mutated target"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Request body 'version' does not match current entity version"

  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid type, out-of-range integer, unknown enum value"

  - id: ERR_CLOCK_REGRESS
    http: 422
    condition: "POST /_clock/advance to_timestamp <= current clock"

  - id: ERR_PRESALE_NOT_OPEN
    http: 409
    condition: "Ticket purchase before Showtime.presale_opens_at"

  - id: ERR_TICKET_NOT_REFUNDABLE
    http: 409
    condition: "Ticket already REFUNDED, EXCHANGED, or on a Showtime whose lifecycle_status=COMPLETED beyond REFUND_GRACE"

  - id: ERR_EXCHANGE_TARGET_INVALID
    http: 422
    condition: "Exchange target Showtime not SCHEDULED, sale_status not in {PRESALE, ON_SALE}, or format/price incompatible"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages distributors, runs harness endpoints, reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /distributors"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "All GET endpoints"
      - "POST /_events/external"

  - name: DistributorOps
    description: "Distributor user; manages film lifecycle"
    identity: entity_backed:Distributor
    exclusive_operations:
      - "POST /films"
      - "POST /films/{id}/release"
      - "POST /films/{id}/shelve"
      - "POST /films/{id}/delist"
    shared_operations:
      - "GET endpoints on Film, Distributor, Showtime, Cinema, Screen, Settlement, ScheduleAdjustment"

  - name: CinemaOps
    description: "Cinema operator; manages cinemas, screens, showtimes; can refund/exchange tickets and cancel showtimes"
    identity: entity_backed:Cinema
    exclusive_operations:
      - "POST /cinemas"
      - "POST /cinemas/{id}/screens"
      - "POST /screens/{id}/showtimes"
      - "POST /showtimes/{id}/cancel"
    shared_operations:
      - "POST /tickets/{id}/refund"
      - "POST /tickets/{id}/exchange"
      - "GET endpoints on Cinema/Screen/Showtime/Ticket/Settlement/ScheduleAdjustment/AnomalyAlert"

  - name: TicketingPlatform
    description: "Upstream ticketing platform; purchases tickets, refunds/exchanges, posts external sync events"
    identity: opaque
    exclusive_operations:
      - "POST /showtimes/{id}/tickets"
    shared_operations:
      - "POST /tickets/{id}/refund"
      - "POST /tickets/{id}/exchange"
      - "POST /_events/external"
      - "GET endpoints on Ticket, Showtime"

  - name: FinanceOps
    description: "Finance operator; manages settlement lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /settlements"
      - "POST /settlements/{id}/post"
    shared_operations:
      - "GET endpoints on Settlement, Showtime, Ticket, Film, Distributor, Cinema, Screen"

  - name: Auditor
    description: "Read-only audit role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (including /audit-logs, /anomaly-alerts, /schedule-adjustments)"
