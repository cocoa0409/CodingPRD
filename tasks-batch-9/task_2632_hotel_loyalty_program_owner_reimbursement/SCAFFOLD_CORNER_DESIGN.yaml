            buffer rule, including the 6-refused / 7-accepted pair and the exclusion of DRAFT and
            REVOKED windows from the input set, are fully asserted by that §1.8 instance.

  # ===========================================================================
  - section: validations
    instances:
      - name: values_sitting_exactly_on_their_limits_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_24_ERR_AMOUNT_OUT_OF_RANGE
          - validations.priority_72_ERR_BLACKOUT_ANNUAL_CAP_EXCEEDED
          - validations.priority_80_ERR_INSUFFICIENT_POINTS
          - calculations.blackout_conflict_check
        distinguishing_aspect: |
          Four rules are inclusive at their boundary and all four let the request through: a
          program_fee_pct of exactly 0.20, a purchase of exactly the 1000-point minimum lot, a
          blackout window of exactly 60 days against a 60-day annual cap, and a redemption charging
          exactly the member's whole balance. Nothing here is an error case - the point is that the
          boundary is not off by one.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Boundary Bay Hotel", brand_code: "BBH", market_tier: "URBAN", program_fee_pct: 0.20, rooms_count: 1, trailing_12m_occupancy_pct: 1.0, trailing_12m_adr_cents: 0 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_fee_pct: $.data.program_fee_pct }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "bb1@example.com", full_name: "Vera Ionescu", enrollment_date: "2026-01-07" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 40000 }
              as: ProgramAdministrator
              captures: { pp_big: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_big}/settle"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 1000 }
              as: ProgramAdministrator
              captures: { pp_min: $.data.id, pp_min_cash: $.data.cash_due_cents, pp_min_status: $.data.status }
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-01-01", end_date: "2026-03-01", scope: "ALL_REDEMPTIONS" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { w_id: $.data.id, w_days: $.data.day_count }
            - call: "POST /loyalty/blackout-windows/${w_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { w_status: $.data.status }
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_used: $.data.blackout_days_used_current_year, h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-07-10", checkout_date: "2026-07-12", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, r_charged: $.data.points_charged }
          assert:
            - "${h_fee_pct} == 0.20 - the inclusive ceiling of the 0.0..0.20 range, with rooms_count 1 and adr 0 also at their inclusive floors"
            - "${pp_min_cash} == 1250 and ${pp_min_status} == PENDING - exactly one 1000-point lot is a legal purchase"
            - "${w_days} == 60 (31 January days + 28 February days + 1 March day) and ${w_status} == ACTIVE"
            - "${h_used} == 60 - 0 + 60 does not exceed the 60-day annual cap, because the rule is a strict >"
            - "${r_charged} == 40000 and the redemption was created - the member's balance was exactly 40000, and priority 80 compares with >="
            - "Member.${m_id}.point_balance == 0 afterwards, and the still-PENDING 1000-point purchase contributed nothing to it"
            - "Redemption.${r_id}.season == STANDARD - the July arrival falls outside the January-to-March blackout window"

