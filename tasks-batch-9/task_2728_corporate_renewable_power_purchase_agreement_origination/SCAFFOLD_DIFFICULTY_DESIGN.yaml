  # ===========================================================================
  # RULE 7 - resource_temporal_overlap
  # Instance 1: resource = Deal, partitioned by event_type; CLOSED intervals, so
  #             touching endpoints COLLIDE, and a REJECTED claim frees its window.
  # Instance 2: resource = SettlementPeriod, partitioned by hour slot; HALF-OPEN
  #             semantics, so the abutting hour is ACCEPTED and only an exact
  #             duplicate collides. Different entity, opposite convention.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: risk_event_closed_window_touching_endpoints_collide_per_event_type
        grounds:
          - validations.priority_22_ERR_RISK_WINDOW_OVERLAP
          - entities.RiskEvent.fields.event_type
          - entities.RiskEvent.fields.window_start
          - entities.RiskEvent.fields.window_end
          - endpoints.POST_/ppa/deals/{id}/risk-events
        distinguishing_aspect: |
          The contended resource is the DEAL's risk timeline, partitioned by
          event_type, and the interval convention is CLOSED on both ends - so a claim
          whose window_start equals an existing window_end is REJECTED, which is the
          opposite of the half-open convention used for settlement periods. Two
          further axes are pinned: the exclusion is per event_type, so a FORCE_MAJEURE
          claim may sit inside a CURTAILMENT window, and a REJECTED claim releases its
          window so the identical dates can be re-claimed afterwards.
