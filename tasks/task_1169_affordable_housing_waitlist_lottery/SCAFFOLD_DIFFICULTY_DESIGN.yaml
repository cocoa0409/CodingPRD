# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1169: Affordable Housing Waitlist & Lottery Administration
# Nine difficulty rules x 2 instances each = 18 instances.
# All chains replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Clock default before any set: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_certified_income_divergence
        grounds:
          - calculations.certified_income_annualization
          - calculations.provisional_eligibility_screen
          - entities.IncomeCertification.fields.certified_annual_income_cents
        distinguishing_aspect: |
          Income domain: the same household produces 2800000 cents self-reported (provisional
          variant, PROVISIONALLY_ELIGIBLE) but 3600200 cents documented (certified variant with
          per-source whole-dollar annualization) — two valid algorithms, different results, on the
          Application/IncomeCertification entity domain.
        test_recipe:
          setup:
            - "Property with AmiLimit(household_size=2, AMI_50, 4000000); campaign OPEN for 2026-06 with target_ami_tier AMI_50; one application household_size=2 self-reported income 2800000, status VERIFIED; income certification at DOCS_REQUESTED requiring SALARY"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Ana Lopez", email: "ana@x.com" }
              as: Anonymous
              captures: { ap: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 2800000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /income-certifications"
              payload: { application_id: "${app}" }
              as: ComplianceOfficer
              captures: { cert: $.data.id }
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "REQUEST_DOCS", required_docs: ["SALARY"] }
              as: ComplianceOfficer
          trigger:
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "SUBMIT_DOCS", income_sources: [{ source_type: "SALARY", amount_per_period_cents: 300020, periods_per_year: 12 }] }
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "CERTIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { certified_income: $.data.certified_annual_income_cents, ami_bp: $.data.ami_percentage_bp, det: $.data.determination }
            - call: "GET /applications/${app}"
              as: ApplicationClerk
              captures: { prov: $.data.provisional_determination }
          assert:
            - "Application.${app}.provisional_determination == PROVISIONALLY_ELIGIBLE (self-reported 2800000 <= 4000000)"
            - "IncomeCertification.${cert}.certified_annual_income_cents == 3600200 (300020 x 12 = 3600240 cents = $36002.40 -> round_half_up to 36002 dollars)"
            - "IncomeCertification.${cert}.ami_percentage_bp == 9001 (round_half_up(3600200 x 10000 / 4000000) = round_half_up(9000.5))"
            - "IncomeCertification.${cert}.determination == ELIGIBLE"
            - "certified 3600200 != self-reported 2800000 for identical household — variants diverge on the income domain"

      - name: report_window_variants_diverge
        grounds:
          - calculations.compliance_aggregation
          - entities.ComplianceReport.fields.applications_received_count
        distinguishing_aspect: |
          Reporting domain (distinct from the income domain): the same two application events
          (2026-03-25 and 2026-05-10) yield applications_received_count == 1 under the
          CALENDAR_QUARTER variant (window [2026-04-01, 2026-07-01), end-exclusive) but == 2 under
          the ROLLING_90_DAY variant (window [2026-03-17, 2026-06-15], both ends inclusive).
        test_recipe:
          setup:
            - "Property; campaign with window 2026-03-01..2026-06-25, OPEN; application X created at 2026-03-25T10:00:00Z; application Z created at 2026-05-10T10:00:00Z"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "Spring 2026", application_open_at: "2026-03-01T00:00:00Z", application_close_at: "2026-06-25T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T10:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Xavier Young", email: "x@x.com" }
              as: Anonymous
              captures: { apx: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${apx}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${apx}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T10:00:00Z" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Zoe Zimmer", email: "z@x.com" }
              as: Anonymous
              captures: { apz: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${apz}", campaign_id: "${c}", household_size: 1, self_reported_annual_income_cents: 2500000 }
              as: Applicant
              as_user_id: "${apz}"
          trigger:
            - call: "POST /compliance-reports"
              payload: { campaign_id: "${c}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", period_mode: "CALENDAR_QUARTER" }
              as: ComplianceOfficer
              captures: { rq: $.data.id, rq_count: $.data.applications_received_count }
            - call: "POST /compliance-reports"
              payload: { campaign_id: "${c}", period_start: "2026-03-17T00:00:00Z", period_end: "2026-06-15T00:00:00Z", period_mode: "ROLLING_90_DAY" }
              as: ComplianceOfficer
              captures: { rr: $.data.id, rr_count: $.data.applications_received_count }
          assert:
            - "ComplianceReport.${rq}.applications_received_count == 1 (only the 2026-05-10 application falls inside [2026-04-01, 2026-07-01) )"
            - "ComplianceReport.${rr}.applications_received_count == 2 (both 2026-03-25 and 2026-05-10 fall inside [2026-03-17, 2026-06-15] inclusive)"
            - "identical event set, different counts per variant — divergence on the ComplianceReport domain"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: preference_tier_branching_local_beats_veteran
        grounds:
          - calculations.preference_tier_assignment
          - calculations.effective_rank_assignment
          - state_machines.LotteryRun.SEALED_to_EXECUTED
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with conditional branching: with LOCAL_RESIDENT + VETERAN both
          verified the nested branch yields tier 1 (LOCAL preempts VETERAN); ACCESSIBILITY alone
          yields tier 3; no verified claims yields tier 4; effective_rank then groups strictly by
          tier independent of hash order.
        test_recipe:
          setup:
            - "Campaign CLOSED after window; application A with VERIFIED LOCAL_RESIDENT and VETERAN claims; application B with VERIFIED ACCESSIBILITY claim; application C with no claims; all three applications VERIFIED before SEAL"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Ann A", email: "a@x.com" }
              as: Anonymous
              captures: { apa: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${apa}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${apa}"
              captures: { appa: $.data.id }
            - call: "POST /preference-claims"
              payload: { application_id: "${appa}", category: "LOCAL_RESIDENT", evidence_ref: "lease-2025" }
              as: Applicant
              as_user_id: "${apa}"
              captures: { cla1: $.data.id }
            - call: "POST /preference-claims"
              payload: { application_id: "${appa}", category: "VETERAN", evidence_ref: "dd214" }
              as: Applicant
              as_user_id: "${apa}"
              captures: { cla2: $.data.id }
            - call: "POST /preference-claims/${cla1}/transition"
              payload: { action: "VERIFY" }
              as: ApplicationClerk
            - call: "POST /preference-claims/${cla2}/transition"
              payload: { action: "VERIFY" }
              as: ApplicationClerk
            - call: "POST /applications/${appa}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${appa}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /applicants"
              payload: { full_name: "Bob B", email: "b@x.com" }
              as: Anonymous
              captures: { apb: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${apb}", campaign_id: "${c}", household_size: 1, self_reported_annual_income_cents: 2500000 }
              as: Applicant
              as_user_id: "${apb}"
              captures: { appb: $.data.id }
            - call: "POST /preference-claims"
              payload: { application_id: "${appb}", category: "ACCESSIBILITY", evidence_ref: "mobility-cert" }
              as: Applicant
              as_user_id: "${apb}"
              captures: { clb: $.data.id }
            - call: "POST /preference-claims/${clb}/transition"
              payload: { action: "VERIFY" }
              as: ApplicationClerk
            - call: "POST /applications/${appb}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${appb}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /applicants"
              payload: { full_name: "Cid C", email: "c@x.com" }
              as: Anonymous
              captures: { apc: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${apc}", campaign_id: "${c}", household_size: 3, self_reported_annual_income_cents: 3500000 }
              as: Applicant
              as_user_id: "${apc}"
              captures: { appc: $.data.id }
            - call: "POST /applications/${appc}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${appc}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: $.data.version }
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-TIER", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { run: $.data.id }
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "SEAL" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
          trigger:
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "EXECUTE" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "GET /waitlist-entries?application_id=${appa}"
              as: LotteryAdministrator
              captures: { ea_tier: "$.data[0].preference_tier", ea_rank: "$.data[0].effective_rank" }
            - call: "GET /waitlist-entries?application_id=${appb}"
              as: LotteryAdministrator
              captures: { eb_tier: "$.data[0].preference_tier", eb_rank: "$.data[0].effective_rank" }
            - call: "GET /waitlist-entries?application_id=${appc}"
              as: LotteryAdministrator
              captures: { ec_tier: "$.data[0].preference_tier", ec_rank: "$.data[0].effective_rank" }
          assert:
            - "entry of application ${appa}: preference_tier == 1 (LOCAL_RESIDENT branch preempts VETERAN even though both verified)"
            - "entry of application ${appb}: preference_tier == 3 (ACCESSIBILITY-only branch)"
            - "entry of application ${appc}: preference_tier == 4 (no verified claims)"
            - "effective_rank: ${appa} entry == 1, ${appb} entry == 2, ${appc} entry == 3 — strict tier grouping independent of sha256 base_rank order"
            - "LotteryRun.${run}.entries_generated == 3"

      - name: per_source_rounding_then_sum_order
        grounds:
          - calculations.certified_income_annualization
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned and observable: annualize + round_half_up each
          source to whole dollars FIRST, then sum. Sources 100020c x 12 and 50020c x 12 yield
          12002 + 6002 = 18004 dollars = 1800400 cents; the forbidden sum-then-round order would
          yield 18005 dollars = 1800500 cents.
        test_recipe:
          setup:
            - "VERIFIED application (household_size 2) on a campaign with target AMI_50; AmiLimit(hh=2, AMI_50) = 4000000; certification at DOCS_REQUESTED requiring SALARY and BENEFITS"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Dana D", email: "d@x.com" }
              as: Anonymous
              captures: { ap: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 1800000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /income-certifications"
              payload: { application_id: "${app}" }
              as: ComplianceOfficer
              captures: { cert: $.data.id }
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "REQUEST_DOCS", required_docs: ["SALARY", "BENEFITS"] }
              as: ComplianceOfficer
          trigger:
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "SUBMIT_DOCS", income_sources: [{ source_type: "SALARY", amount_per_period_cents: 100020, periods_per_year: 12 }, { source_type: "BENEFITS", amount_per_period_cents: 50020, periods_per_year: 12 }] }
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "CERTIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { certified_income: $.data.certified_annual_income_cents, ami_bp: $.data.ami_percentage_bp }
          assert:
            - "IncomeCertification.${cert}.certified_annual_income_cents == 1800400 (round_half_up($12002.40)=12002 and round_half_up($6002.40)=6002, then summed)"
            - "certified_annual_income_cents != 1800500 (the sum-then-round order is NOT the specified behavior)"
            - "IncomeCertification.${cert}.ami_percentage_bp == 4501 (round_half_up(1800400 x 10000 / 4000000))"
            - "IncomeCertification.${cert}.determination == ELIGIBLE (1800400 <= 4000000)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state machines on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_info_cycle_twice
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Application.NEEDS_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on Application: UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW -> NEEDS_INFO
          -> UNDER_REVIEW traverses the info-request loop twice; each pass increments version by 1.
        test_recipe:
          setup:
            - "Campaign OPEN; one application in SUBMITTED"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Eve E", email: "e@x.com" }
              as: Anonymous
              captures: { ap: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /applications/${app}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "REQUEST_INFO", note: "need id" }
              as: ApplicationClerk
              captures: { s1: $.data.status }
            - call: "POST /applications/${app}/review"
              payload: { action: "SUBMIT_INFO", note: "id attached" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { s2: $.data.status }
            - call: "POST /applications/${app}/review"
              payload: { action: "REQUEST_INFO", note: "need paystub" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "SUBMIT_INFO", note: "paystub attached" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { s4: $.data.status, v4: $.data.version }
          assert:
            - "after first REQUEST_INFO: status == NEEDS_INFO (${s1})"
            - "after first SUBMIT_INFO: status == UNDER_REVIEW (${s2}) — cycle closes A->B->A"
            - "after the second full loop: status == UNDER_REVIEW (${s4}) and version == 6 (create=1, BEGIN_REVIEW=2, then +1 per loop transition)"
            - "loop is repeatable, not one-shot — non-linear machine on Application"

      - name: waitlist_entry_offer_refusal_cycle
        grounds:
          - state_machines.WaitlistEntry.RANKED_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_RANKED
          - state_machines.UnitOffer.PENDING_to_DECLINED
        distinguishing_aspect: |
          Cyclic machine on WaitlistEntry (different entity than Application): RANKED -> OFFERED ->
          RANKED on decline while refusal_count (1) stays below MAX_REFUSALS (2); the unit returns
          to AVAILABLE and the entry remains selector-eligible.
        test_recipe:
          setup:
            - "Full pipeline: property with ONE_BR standard (1..3) and AmiLimit(hh=2, AMI_50, 4000000); one AVAILABLE ONE_BR AMI_50 unit; one VERIFIED application hh=2 with CERTIFIED income 3000000; lottery PUBLISHED; offer generated (entry OFFERED, unit RESERVED)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /occupancy-standards"
              payload: { property_id: "${p}", bedroom_count: "ONE_BR", min_occupants: 1, max_occupants: 3 }
              as: HousingDeveloper
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /units"
