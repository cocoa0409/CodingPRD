  # ---------------------------------- ResinLot ----------------------------------
  - method: POST
    path: "/resin-lots"
    description: "Receive a polyethylene resin lot with its grade, melt index, colour match, additive package, regrind share, cost and expiry."
    roles: [PlantAdmin, ResinTechnician]
    code: 201
    input: [lot_code, resin_grade, melt_index_g10min, color_code, color_delta_e, additive_package_code, regrind_pct_by_mass, cost_cents_per_kg, received_kg, expires_on]
    output: ResinLot
    side_effects: ["available_kg initialised to received_kg, reserved_kg and consumed_kg to 0.000, establishing the conserved mass invariant", "status initialised to AVAILABLE", "every ProductionOrder in BLOCKED_RESIN that this lot qualifies for -> READY_TO_SCHEDULE, or BLOCKED_WAREHOUSE when its target site is FROZEN", "version initialised to 1"]
  - method: GET
    path: "/resin-lots"
    description: "List resin lots with their live three-bucket mass ledger."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, QualityInspector]
    code: 200
    input: ["resin_grade?", "color_code?", "additive_package_code?", "status?", "expires_on_or_before?", "limit?", "offset?"]
    output: ResinLot[]
    side_effects: []
  - method: GET
    path: "/resin-lots/{resin_lot_id}"
    description: "Read one resin lot including available_kg, reserved_kg and consumed_kg."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, QualityInspector]
    code: 200
    input: []
    output: ResinLot
    side_effects: []
  - method: POST
    path: "/resin-lots/{resin_lot_id}/quarantine"
    description: "Quarantine a resin lot on a quality finding. Head of CASCADE-F."
    roles: [QualityInspector]
    code: 200
    input: [quarantine_reason]
    output: ResinLot
    side_effects: ["status AVAILABLE or DEPLETED -> QUARANTINED", "CASCADE-F link 2: RESERVED charges on this lot -> RELEASED with released_reason LOT_QUARANTINED, moving charge_kg from reserved_kg back to available_kg", "CASCADE-F link 3: SCHEDULED cycles holding those charges -> ABORTED with abort_reason LOT_QUARANTINED", "CASCADE-F link 4: affected orders with no remaining qualified lot -> BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT", "increments ResinLot.version by 1"]
  - method: POST
    path: "/resin-lots/{resin_lot_id}/release-quarantine"
    description: "Clear a quarantine. The lot returns to AVAILABLE when it still holds mass, otherwise to DEPLETED."
    roles: [QualityInspector]
    code: 200
    input: [release_note]
    output: ResinLot
    side_effects: ["status QUARANTINED -> AVAILABLE when available_kg > 0.000, else -> DEPLETED", "on return to AVAILABLE, BLOCKED_RESIN orders this lot qualifies for -> READY_TO_SCHEDULE, or BLOCKED_WAREHOUSE when the target site is FROZEN", "aborted cycles are NOT resurrected", "increments ResinLot.version by 1"]

  # --------------------------------- ResinCharge ---------------------------------
  - method: POST
    path: "/resin-charges"
    description: "Reserve a resin charge from one lot for one scheduled cycle. Guarded by OCC on the lot (§1.2.1 charge-create-stale-resin-lot)."
    roles: [ResinTechnician]
    code: 201
    input: [molding_cycle_id, resin_lot_id, charge_kg, regrind_kg, expected_resin_lot_version]
    output: ResinCharge
    side_effects: ["status initialised to RESERVED; created_by_technician_id set to the acting X-User-ID", "virgin_kg and charge_regrind_pct computed per calculations.resin_mass_ledger", "ResinLot.available_kg decreases and reserved_kg increases by charge_kg, preserving available + reserved + consumed == received_kg", "the lot -> DEPLETED when available_kg reaches exactly 0.000", "MoldingCycle.charged_mass_kg, weighted_melt_index_g10min and cycle_regrind_pct recomputed", "increments ResinLot.version by 1 and MoldingCycle.version by 1"]
  - method: GET
    path: "/resin-charges"
    description: "List resin charges, filterable by cycle, lot, creating technician and status."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, QualityInspector]
    code: 200
    input: ["molding_cycle_id?", "resin_lot_id?", "created_by_technician_id?", "status?", "released_reason?", "limit?", "offset?"]
    output: ResinCharge[]
    side_effects: []
  - method: GET
    path: "/resin-charges/{resin_charge_id}"
    description: "Read one resin charge including virgin_kg and charge_regrind_pct."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, QualityInspector]
    code: 200
    input: []
    output: ResinCharge
    side_effects: []
  - method: POST
    path: "/resin-charges/{resin_charge_id}/release"
    description: "Release a still-RESERVED charge back to its lot. CONSUMED charges are irreversible."
    roles: [ResinTechnician]
    code: 200
    input: ["release_reason?"]
    output: ResinCharge
    side_effects: ["status RESERVED -> RELEASED with released_reason CYCLE_ABORTED when no reason is supplied", "charge_kg moves from ResinLot.reserved_kg back to available_kg — the compensating half of the mass invariant", "a DEPLETED lot that regains mass -> AVAILABLE and unblocks the BLOCKED_RESIN orders it qualifies for", "the cycle's charge rollups are recomputed over the remaining participating charges", "increments ResinCharge.version by 1, ResinLot.version by 1 and MoldingCycle.version by 1"]

  # ------------------------------- ProductionOrder -------------------------------
  - method: POST
