              as: RetailExec
              captures: { agr1_id: $.data.id }
            - call: "POST /retail-agreements/${agr1_id}/sign"
              payload: {}
              as: RetailExec
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "ClubWarehouse", exclusive: true, window_start: "2026-12-01T00:00:00Z", window_end: "2027-02-01T00:00:00Z", min_launch_units: 200 }
              as: RetailExec
