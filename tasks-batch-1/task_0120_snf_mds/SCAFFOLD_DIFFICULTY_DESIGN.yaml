  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_cascade_admission_careplan_goal_depth3
        grounds:
          - state_machines.Admission.DISCHARGE_PLANNED_to_DISCHARGED
          - state_machines.CarePlan.ACTIVE_to_CLOSED
          - entities.CarePlan.fields.status
          - entities.CarePlanGoal.fields.status
          - entities.Resident.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by admission discharge: discharge sets Admission DISCHARGED
          (hop 1) -> that mutation closes each ACTIVE CarePlan to CLOSED (hop 2) -> closing each
          plan discontinues its OPEN/IN_PROGRESS CarePlanGoals to DISCONTINUED (hop 3). Each hop
          is caused by the prior hop, not by the discharge call directly.
        test_recipe:
          setup:
            - "PRIVATE admission ACTIVE with an ACTIVE care plan holding one OPEN goal; a SUBMITTED DISCHARGE assessment; admission moved to DISCHARGE_PLANNED"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Disch SNF", cms_certification_number: "CCN-DSC1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
