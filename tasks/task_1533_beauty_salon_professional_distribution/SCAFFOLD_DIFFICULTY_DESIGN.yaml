  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_active_salon
        grounds:
          - validations[priority=7]
          - state_machines.SalonAccount.PENDING_VERIFICATION_to_ACTIVE
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Order x SalonAccount: order creation is gated on the salon's
          status — PENDING_VERIFICATION rejects with ERR_ACCOUNT_NOT_ACTIVE; once the
          license verification flips the salon ACTIVE, the identical request succeeds.
          (Sibling instance uses the Shipment x DiversionCase pair.)
        test_recipe:
          setup:
            - "Salon exists in PENDING_VERIFICATION (license submitted but not yet verified); catalog brand + RETAIL product exist"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C W", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon W", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-W-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/brands", payload: { name: "BrandW" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-W1", name: "Lotion", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 4000, weight_grams: 200 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
          assert:
            - "First create rejected: error_id == ERR_ACCOUNT_NOT_ACTIVE"
            - "After license verification SalonAccount.${s_id}.status == ACTIVE"
            - "Second create succeeds: Order.${o_id}.fulfillment_status == DRAFT and payment_status == UNPAID"

      - name: shipment_blocked_by_open_diversion_hold
        grounds:
          - validations[priority=9]
          - state_machines.DiversionCase.OPEN_to_DISMISSED
          - errors[ERR_SHIPMENT_HELD_DIVERSION]
        distinguishing_aspect: |
          Entity pair Shipment x DiversionCase: creating a shipment for an APPROVED
          order is rejected with ERR_SHIPMENT_HELD_DIVERSION while an OPEN case with
          hold_shipments == true exists for the salon; dismissing the case lifts the
          gate and the identical create succeeds. (Sibling uses Order x SalonAccount.)
        test_recipe:
          setup:
            - "ACTIVE SILVER salon; order of 2 RETAIL units APPROVED"
            - "OPEN diversion case with hold_shipments == true filed by the consultant"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C V", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon V", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-V-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandV" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-V1", name: "Mousse", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 6000, weight_grams: 200 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 2 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o_id}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${o_id}", payload: {}, as: DistributionAdmin, captures: { it0: "$.data[0].id" } }
            - { call: "POST /api/diversion-cases", payload: { salon_account_id: "${s_id}", product_id: "${p1}", severity: MINOR, evidence_note: "online listing", hold_shipments: true }, as: SalesConsultant, as_user_id: "${c_id}", captures: { dc: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${o_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${it0}", quantity: 2 } ] }, as: WarehouseOperator, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/diversion-cases/${dc}/dismiss", payload: {}, as: ComplianceOfficer, as_user_id: "officer-9" }
            - { call: "POST /api/orders/${o_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${it0}", quantity: 2 } ] }, as: WarehouseOperator, captures: { sh: "$.data.id" } }
          assert:
            - "First shipment create rejected: error_id == ERR_SHIPMENT_HELD_DIVERSION"
            - "After dismiss (case DISMISSED) the identical create succeeds: Shipment.${sh}.status == PLANNED"
            - "Shipment.${sh}.hazmat_declaration_required == false and shipping_charge_cents == 1200"

  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_exclusive_half_open_overlap
        grounds:
          - validations[priority=14]
          - entities.BrandTerritoryExclusive.fields.effective_from
          - errors[ERR_TERRITORY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to). An overlapping
          window [2026-03-01, 2026-09-01) against [2026-01-01, 2026-06-01) is rejected;
          the adjacent window starting exactly at 2026-06-01 is allowed. Resource:
          (brand, territory) exclusivity — vs the 30-minute-buffer rule on RoutePlan in
          the sibling instance.
        test_recipe:
          setup:
            - "Brand with an existing CA exclusivity [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /api/brands", payload: { name: "BrandZ" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/brands/${b_id}/territory-exclusives", payload: { territory_code: "CA", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: DistributionAdmin, captures: { ex1: "$.data.id" } }
          trigger:
            - { call: "POST /api/brands/${b_id}/territory-exclusives", payload: { territory_code: "CA", effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/brands/${b_id}/territory-exclusives", payload: { territory_code: "CA", effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: DistributionAdmin, captures: { ex2: "$.data.id" } }
          assert:
            - "Overlapping window rejected: error_id == ERR_TERRITORY_WINDOW_OVERLAP"
            - "Adjacent window (from == existing to) accepted with 201: BrandTerritoryExclusive.${ex2} created"
            - "GET /api/brands/${b_id}/territory-exclusives returns exactly 2 windows for CA"

      - name: route_stop_thirty_minute_buffer
        grounds:
          - validations[priority=15]
          - entities.RouteStop.fields.start_at
          - errors[ERR_ROUTE_STOP_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Interval semantics: buffered gap — consecutive stops on one RoutePlan need
          >= 30 minutes between prev.end_at and next.start_at, so a stop starting
          exactly at the previous stop's end (gap 0) is rejected while a 30-minute gap
          is allowed. Adjacency-allowed (half-open) does NOT apply here, unlike the
          territory-exclusive sibling. Resource: RoutePlan schedule.
        test_recipe:
          setup:
            - "DRAFT route plan for a CA consultant; one stop 2026-08-10 09:00-10:00 exists"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C Q", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon Q1", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s1: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon Q2", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s2: "$.data.id" } }
            - { call: "POST /api/route-plans", payload: { sales_consultant_id: "${c_id}", name: "Monday Route" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { rp: "$.data.id" } }
            - { call: "POST /api/route-plans/${rp}/stops", payload: { salon_account_id: "${s1}", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T10:00:00Z" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { st1: "$.data.id" } }
          trigger:
            - { call: "POST /api/route-plans/${rp}/stops", payload: { salon_account_id: "${s2}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/route-plans/${rp}/stops", payload: { salon_account_id: "${s2}", start_at: "2026-08-10T10:30:00Z", end_at: "2026-08-10T11:30:00Z" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { st2: "$.data.id" } }
          assert:
            - "Zero-gap stop rejected: error_id == ERR_ROUTE_STOP_BUFFER_VIOLATION"
            - "30-minute-gap stop accepted with 201: RouteStop.${st2}.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: credit_ledger_balance_invariant_on_cancel
        grounds:
          - calculations.credit_redemption_cap
          - calculations.education_credit_accrual
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.SalonAccount.fields.education_credit_points
