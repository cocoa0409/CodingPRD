          - state_machines.LicenseAgreement.ISSUED_to_VOIDED
          - calculations.space_days_committed
        distinguishing_aspect: |
          One call fans out to four children of three different kinds on the way down:
          the ACTIVE hold, the ISSUED license, the escrowed deposit and the space-day
          ledger. The escrow return is the easiest leg to miss because it lives on the
          Client rather than on any descendant of the booking.
        test_recipe:
          setup:
            - "the Meeting Room 301 booking is TENTATIVE with one ACTIVE hold and an ISSUED license holding 90900 in escrow"
            - "Client.credit_balance_cents is 109100 and SpaceUnit.committed_space_days is 5"
