# §1.9 Scaffold Corner Design — breadth coverage of every testable claim
# in SCAFFOLD.yaml §1.1–§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not
# already assert. Sections and claim types follow the scaffold-generator
# skill's references/claim-extraction-guide.md.
scaffold_corner_design:
- section: entities
  instances:
  - name: contact_creation_persists_every_input_field
    claim_type: Creation
    grounds:
    - entities.Contact
    - endpoints[POST /compliance/contacts]
    distinguishing_aspect: POST /compliance/contacts with every declared input returns 201 and echoes all six input fields while stamping the ten computed counters at their declared defaults.
    test_recipe:
      setup:
      - empty database
      - logical clock set to 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 5
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
      assert:
      - the call returns 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == "object"
      - Contact.${c1_id}.phone_number == "+14155550101"
      - Contact.${c1_id}.state_code == "CA" and utc_offset_minutes == -420 and time_zone_label == "America/Los_Angeles"
      - Contact.${c1_id}.phone_type == WIRELESS and attempt_budget_total == 5
      - Contact.${c1_id}.attempts_charged == 0 and attempt_budget_remaining == 5
      - Contact.${c1_id}.internal_dnc_status == CLEAR, risk_tier == LOW, rnd_result == NOT_CHECKED, rnd_safe_harbor_eligible == false
      - Contact.${c1_id}.total_consent_count == 0 and overdue_propagation_count == 0
      - Contact.${c1_id}.version == 1 and created_at == "2026-08-03T00:00:00.000Z"
  - name: contact_retrieval_returns_the_stored_row
    claim_type: Retrieval
    grounds:
    - entities.Contact
    - endpoints[GET /compliance/contacts/{id}]
    distinguishing_aspect: GET /compliance/contacts/{id} returns the same field values the create call stamped, with updated_at still equal to created_at because no write has touched the row.
    test_recipe:
      setup:
      - one Contact created at 2026-08-03T00:00:00Z with attempt_budget_total 3
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      trigger:
      - call: GET /compliance/contacts/${c1_id}
        payload: {}
        as: DialerOperator
        captures:
          read_v: $.data.version
      assert:
      - the call returns 200 with response_type == "object"
      - Contact.${c1_id}.phone_number == "+14155550101" and state_code == "CA"
      - Contact.${c1_id}.attempt_budget_total == 3 and attempt_budget_remaining == 3
      - Contact.${c1_id}.version == 1 and updated_at == created_at
  - name: contact_defaults_applied_when_optional_inputs_omitted
    claim_type: Defaults
    grounds:
    - entities.Contact.fields.phone_type
    - entities.Contact.fields.attempt_budget_total
    distinguishing_aspect: Omitting phone_type and attempt_budget_total yields UNKNOWN and 3 respectively, and attempt_budget_remaining is derived from the defaulted total rather than left at 0.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
      assert:
      - Contact.${c1_id}.phone_type == UNKNOWN
      - Contact.${c1_id}.attempt_budget_total == 3 and attempt_budget_remaining == 3
      - Contact.${c1_id}.attempts_charged == 0
  - name: dialer_profile_defaults_applied_when_optional_inputs_omitted
    claim_type: Defaults
    grounds:
    - entities.DialerProfile.fields.abandonment_limit_pct
    - entities.DialerProfile.fields.amd_enabled
    - entities.DialerProfile.fields.abandon_message_seconds
    distinguishing_aspect: A DialerProfile created with only mode and agents_available takes abandonment_limit_pct 3.00, amd_enabled false, amd_abandon_on_machine false and abandon_message_seconds 2, so requires_waiver is false.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/dialer-profiles
        payload:
          mode: POWER
          agents_available: 4
        as: DialerOperator
        captures:
          dp_id: $.data.id
      assert:
      - DialerProfile.${dp_id}.abandonment_limit_pct == 3.00
      - DialerProfile.${dp_id}.amd_enabled == false and amd_abandon_on_machine == false
      - DialerProfile.${dp_id}.abandon_message_seconds == 2
      - DialerProfile.${dp_id}.requires_waiver == false and waiver_reference == null
      - DialerProfile.${dp_id}.status == DRAFT and max_lines_last_computed == 0
  - name: contact_system_fields_are_server_stamped_input_ignored
    claim_type: System Fields
    grounds:
    - entities.Contact.fields.attempts_charged
    - entities.Contact
    distinguishing_aspect: 'Client-supplied id, created_at, version and attempts_charged values are discarded: the row is stamped with a server id, version 1, attempts_charged 0 and created_at equal to the logical clock.'
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          id: 11111111-1111-1111-1111-111111111111
          created_at: '2020-01-01T00:00:00Z'
          version: 99
          attempts_charged: 7
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
      assert:
      - Contact.${c1_id}.id != "11111111-1111-1111-1111-111111111111"
      - Contact.${c1_id}.created_at == "2026-08-03T00:00:00.000Z"
      - Contact.${c1_id}.version == 1
      - Contact.${c1_id}.attempts_charged == 0 and attempt_budget_remaining == 3
  - name: scrub_job_counter_fields_are_computed_from_the_target_set
    claim_type: Computed Fields
    grounds:
    - calculations.scrub_target_resolution
    - entities.ScrubJob.fields.contacts_scrubbed_count
    - entities.ScrubJob.fields.contacts_suppressed_count
    - entities.ScrubJob.fields.eligible_target_count
    distinguishing_aspect: With two CA contacts of which one sits on the NATIONAL list, execute stamps contacts_scrubbed_count 2, contacts_suppressed_count 1 and eligible_target_count 1 - the difference, not an input.
    test_recipe:
      setup:
      - clock at 2026-08-03T00:00:00Z; CA policy ACTIVE; APPROVED CA VOICE script; APPROVED profile
      - 'two CA contacts: +14155550101 (clean) and +14155550202 (on the NATIONAL list, refreshed 2026-08-01)'
      - one DRAFT campaign targeting CA
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/contacts/${c1_id}/number-status-check
        payload:
          claimed_consent_date: '2026-07-15'
        as: DialerOperator
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/dialer-profiles
        payload:
          mode: PREDICTIVE
          agents_available: 5
          abandonment_limit_pct: 50.0
          amd_enabled: true
          amd_abandon_on_machine: false
          abandon_message_seconds: 2
        as: DialerOperator
        captures:
          dp_id: $.data.id
      - call: POST /compliance/dialer-profiles/${dp_id}/approve
        payload:
          waiver_reference: WVR-2026-0142
        as: ComplianceOfficer
        as_user_id: officer-profile-approver
      - call: POST /compliance/campaigns
        payload:
          name: CA Aug Outreach
          channel: VOICE
          campaign_purpose: MARKETING
          target_state_codes:
          - CA
          dialer_profile_id: ${dp_id}
          agent_script_id: ${scr_id}
        as: CampaignManager
        captures:
          camp_id: $.data.id
          camp_v: $.data.version
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550202'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c2_id: $.data.id
          c2_v: $.data.version
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+14155550202'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        captures:
          sup_c2_id: $.data.id
      trigger:
      - call: POST /compliance/scrub-jobs
        payload:
          campaign_id: ${camp_id}
          list_types:
          - NATIONAL
          - INTERNAL
          expected_campaign_version: ${camp_v}
        as: CampaignManager
        captures:
          job_id: $.data.id
      - call: POST /compliance/scrub-jobs/${job_id}/execute
        payload: {}
        as: CampaignManager
      assert:
      - ScrubJob.${job_id}.status == COMPLETED and failure_reason == null
      - ScrubJob.${job_id}.contacts_scrubbed_count == 2
      - ScrubJob.${job_id}.contacts_suppressed_count == 1
      - ScrubJob.${job_id}.eligible_target_count == 1
      - ScrubJob.${job_id}.completed_at == "2026-08-03T00:00:00.000Z" and expires_at == "2026-09-03T00:00:00.000Z"
      - Campaign.${camp_id}.status == PENDING_LAUNCH and eligible_target_count == 1
  - name: contact_utc_offset_above_range_rejected
    claim_type: Type Constraints
    grounds:
    - entities.Contact.fields.utc_offset_minutes
    - validations[priority=30]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: utc_offset_minutes 900 exceeds the declared ceiling of 840, so the create is refused with ERR_INVALID_REQUEST and no Contact row exists.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: 900
          time_zone_label: Pacific/Kiritimati
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 400 with data.error_id == "ERR_INVALID_REQUEST"
      - no Contact row is created (a later create with utc_offset_minutes -420 succeeds and is version 1)
  - name: contact_non_e164_phone_number_rejected
    claim_type: Type Constraints
    grounds:
    - entities.Contact.fields.phone_number
    - validations[priority=30]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A phone_number of "4155550101" fails the ^\+[1-9][0-9]{7,14}$ constraint, so the create returns ERR_INVALID_REQUEST rather than storing an unnormalised number.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '4155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 400 with data.error_id == "ERR_INVALID_REQUEST"
  - name: contact_missing_required_state_code_rejected
    claim_type: Required Fields
    grounds:
    - entities.Contact.fields.state_code
    - validations[priority=30]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: state_code has source input and no default, so omitting it returns ERR_INVALID_REQUEST instead of a Contact with a null state.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 400 with data.error_id == "ERR_INVALID_REQUEST"
  - name: dialer_profile_unknown_mode_enum_rejected
    claim_type: Type Constraints
    grounds:
    - entities.DialerProfile.fields.mode
    - validations[priority=30]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: mode "BLAST" is not a member of {PREVIEW, POWER, PREDICTIVE}, so the create returns ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - empty database
      - clock at 2026-08-03T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/dialer-profiles
        payload:
          mode: BLAST
          agents_available: 4
        as: DialerOperator
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 400 with data.error_id == "ERR_INVALID_REQUEST"
  - name: suppression_entry_listing_paginates_with_total_count_and_has_more
    claim_type: Listing
    grounds:
    - entities.SuppressionEntry
    - endpoints[GET /compliance/suppression-entries]
    distinguishing_aspect: With three ACTIVE NATIONAL rows, limit 2 offset 0 returns two items with total_count 3 and has_more true, and offset 2 returns the third with has_more false.
    test_recipe:
      setup:
      - clock at 2026-08-03T00:00:00Z
      - three ACTIVE NATIONAL suppression rows for +18005550000, +18005550001 and +18005550002
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550001'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550002'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      trigger:
      - call: GET /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          status: ACTIVE
          limit: 2
          offset: 0
        as: ComplianceOfficer
        captures:
          first_id: $.data[0].id
      - call: GET /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          status: ACTIVE
          limit: 2
          offset: 2
        as: ComplianceOfficer
        captures:
          third_id: $.data[0].id
      assert:
      - the first call returns 200 with response_type == "array", total_count == 3, limit == 2, offset == 0, has_more == true and exactly 2 items
      - the second call returns total_count == 3, offset == 2, has_more == false and exactly 1 item
      - ${first_id} != ${third_id} (the pages are disjoint)
