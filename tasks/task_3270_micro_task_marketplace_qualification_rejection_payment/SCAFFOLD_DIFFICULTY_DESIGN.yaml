              payload: { display_name: "W1 XB", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W2 XB", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W3 XB", country: "US" }
              as: Anonymous
              captures: { w3: $.data.id }
            - call: "POST /mkt/hits/${hOld}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/hits/${hOld}/assignments"
              payload: { worker_id: "${w2}" }
              as: Worker
              as_user_id: "${w2}"
              captures: { a2: $.data.id, a2_v: $.data.version }
            - call: "POST /mkt/hits/${hOld}/assignments"
              payload: { worker_id: "${w3}" }
              as: Worker
              as_user_id: "${w3}"
              captures: { a3: $.data.id, a3_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a2}/submit"
              payload: { expected_assignment_version: "${a2_v}" }
              as: Worker
              as_user_id: "${w2}"
            - call: "POST /mkt/assignments/${a3}/submit"
              payload: { expected_assignment_version: "${a3_v}" }
              as: Worker
              as_user_id: "${w3}"
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "spam" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a2}/reject"
              payload: { reason: "spam" }
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${a3}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/requesters/${rid}/abuse-review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "XB New", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hNew: $.data.id }
          trigger:
            - call: "POST /mkt/hits/${hNew}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REQUESTER_NOT_ACTIVE"
            - "Requester.${rid}.status == SUSPENDED and HIT.${hNew}.status == DRAFT"
            - "the prior HIT HIT.${hOld}.status == CANCELLED (cancelled by the suspension cascade, not by this call)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: hit_slot_overlap_same_worker_same_hit_is_closed
        grounds:
          - errors.ERR_HIT_MAX_ASSIGNMENTS_REACHED
          - state_machines.HIT.transitions.PUBLISHED_to_DISPATCHED
          - endpoints.POST_/mkt/hits/{hit_id}/assignments
        distinguishing_aspect: "A second acceptance by the same worker on the same HIT is refused while their earlier assignment is live, because the slot is compared as a per-(HIT, Worker) closed interval — a distinct worker still fills the remaining slot."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 2-slot 100c HIT published; W1 accepts slot 1 and W2 accepts slot 2, so the pool is full."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Overlap" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Overlap Probe", reward_cents: 100, max_assignments: 2, assignment_duration_minutes: 60, time_limit_minutes: 600 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Overlap", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W2 Overlap", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
          trigger:
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w2}" }
              as: Worker
              as_user_id: "${w2}"
              captures: { a2: $.data.id }
          assert:
            - "the W2 acceptance succeeds with status 201 and Assignment.${a2}.status == ACCEPTED"
            - "HIT.${hit1}.accepted_count == 2 and HIT.${hit1}.status == DISPATCHED"
            - "a second acceptance by W1 on the same HIT is refused with ERR_HIT_MAX_ASSIGNMENTS_REACHED"

      - name: worker_capacity_overlap_count_aggregate_expires_nearest_deadline
        grounds:
          - calculations.hit_assignment_selector
          - errors.ERR_CONCURRENCY_LIMIT_EXCEEDED
          - endpoints.POST_/mkt/workers/{worker_id}/assignments/concurrency-check
        distinguishing_aspect: "At the 2-assignment cap the aggregate count is resolved by expiring the ACCEPTED assignment with the earliest deadline (A, deadline T0+30), not the later one (B, deadline T0+600) and not by refusing on a per-pair comparison."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. HIT A (1 slot, duration 30) and HIT B (1 slot, duration 600) published and accepted back to back by W1, so W1 holds two ACCEPTED assignments with different deadlines."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Cap" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Cap A", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 30, time_limit_minutes: 600 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Cap B", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 600, time_limit_minutes: 900 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Cap C", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 600 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hC: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hC}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Cap", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hA}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aA: $.data.id }
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aB: $.data.id }
          trigger:
            - call: "POST /mkt/workers/${w1}/assignments/concurrency-check"
              payload: { hit_id: "${hC}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aC: $.data.id }
          assert:
            - "Assignment.${aA}.status == EXPIRED — it carried the earliest deadline (T0+30)"
            - "Assignment.${aB}.status == ACCEPTED — the later deadline T0+600 is preserved"
            - "Assignment.${aC}.status == ACCEPTED and Worker.${w1}.expired_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: requester_prepaid_plus_escrow_conserved_across_publish_and_cancel
        grounds:
          - state_machines.HIT.transitions.PUBLISHED_to_CANCELLED
          - state_machines.HIT.transitions.DRAFT_to_PUBLISHED
          - entities.Requester.fields.prepaid_balance_cents
          - entities.Requester.fields.escrowed_cents
        distinguishing_aspect: "Publish moves 125c from prepaid_balance_cents into escrowed_cents and cancel moves it back, so the named quantity prepaid_balance_cents + escrowed_cents stays at 2000 before and after the compensating pair."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester deposits 2000c; a 1-slot 100c HIT whose funds_required_cents is 125 is created and published (no assignments accepted)."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Conserve" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Conserve Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
              captures: { hv: $.data.version }
          trigger:
            - call: "POST /mkt/hits/${hit1}/cancel"
              payload: { expected_hit_version: "${hv}" }
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "before cancel: Requester.${rid}.prepaid_balance_cents == 1875 and escrowed_cents == 125"
            - "after cancel: Requester.${rid}.prepaid_balance_cents == 2000 and escrowed_cents == 0"
            - "the named quantity prepaid_balance_cents + escrowed_cents == 2000 on both sides of the pair"
            - "HIT.${hit1}.status == CANCELLED and HIT.${hit1}.escrowed_cents == 0"

      - name: worker_withdrawable_plus_reserved_payouts_conserved_across_request_and_reject
        grounds:
          - state_machines.PayoutRequest.transitions.HELD_FOR_VETTING_to_REJECTED
          - entities.Worker.fields.withdrawable_cents
          - entities.Worker.fields.total_earned_cents
        distinguishing_aspect: "A payout request reserves 100c from withdrawable_cents and its rejection releases it, so the named quantity withdrawable_cents + sum(HELD_FOR_VETTING payout amounts) stays at the earned total 180 even though the payout row itself moves to a terminal state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Worker W1 earns 180c from two approved 100c assignments; W1 (US, unverified) requests a 100c BANK_TRANSFER payout, which is minted HELD_FOR_VETTING."
          setup_api_calls:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Payout Conserve" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Payout A", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Payout B", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Payout", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hA}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aA: $.data.id, aA_v: $.data.version }
            - call: "POST /mkt/hits/${hB}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { aB: $.data.id, aB_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${aA}/submit"
              payload: { expected_assignment_version: "${aA_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aB}/submit"
              payload: { expected_assignment_version: "${aB_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${aA}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/assignments/${aB}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers/${w1}/payouts"
              payload: { payment_method: "BANK_TRANSFER", amount_cents: 100 }
              as: Worker
              as_user_id: "${w1}"
              captures: { pay1: $.data.id }
          trigger:
            - call: "POST /mkt/payouts/${pay1}/reject"
              payload: { rejection_reason: "documents unreadable" }
              as: PlatformAdmin
          assert:
            - "before reject: Worker.${w1}.withdrawable_cents == 80 and the HELD_FOR_VETTING request reserves 100"
            - "after reject: Worker.${w1}.withdrawable_cents == 180 — the reservation is fully released"
            - "PayoutRequest.${pay1}.status == REJECTED and Worker.${w1}.total_earned_cents == 180 on both sides of the pair"
