    - errors[ERR_PRICE_HOLD_OVERLAP]
    - entities.Quote.fields.received_at
    - entities.Quote.fields.expires_at
    distinguishing_aspect: 'RESOURCE = the (material_package_id, supplier_id) pair over the half-open interval [received_at, expires_at): an identical 2026-08-01 to 2026-09-15 hold from a DIFFERENT supplier on the same package is accepted, while a shorter overlapping hold from the SAME supplier is refused.'
