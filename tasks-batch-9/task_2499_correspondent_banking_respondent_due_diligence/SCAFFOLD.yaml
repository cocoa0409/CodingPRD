  # ---------------- PeriodicRefresh ----------------------------------------
  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/periodic-refreshes"
    description: "Schedule a refresh cycle over a HALF-OPEN [window_start, scheduled_due_date) window. Adjacent cycles are legal; interior overlap is not, and a cycle opened too soon after a completed one breaches the 30-day buffer."
    roles: [ComplianceAnalyst, PlatformAdmin]
    code: 201
    input: ["trigger_reason", "window_start", "scheduled_due_date"]
    output: PeriodicRefresh
    side_effects: ["ERR_REFRESH_WINDOW_OVERLAP (409) on interior overlap with a SCHEDULED or IN_PROGRESS cycle; ERR_REFRESH_BUFFER_VIOLATION (422) when window_start falls within 30 days after a COMPLETED cycle's scheduled_due_date — the overlap check is evaluated first", "creates the row in SCHEDULED with cadence_months_applied and rating_at_schedule frozen from the respondent's approved_risk_rating", "moves the respondent's dd_state APPROVED -> REFRESH_DUE", "a create with trigger_reason ADVERSE_MEDIA, ALERT_ESCALATION or NESTED_DISCOVERY cancels any other SCHEDULED cycle with cancelled_reason SUPERSEDED_BY_ACCELERATION", "increments RespondentBank.version by 1"]

  - method: GET
    path: "/correspondent-banking/periodic-refreshes"
    description: "List refresh cycles, filtered by respondent_bank_id, ordered window_start ASC then created_at ASC."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: ["respondent_bank_id?", "state?", "trigger_reason?", "limit?", "offset?"]
    output: PeriodicRefresh[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/periodic-refreshes/{periodicRefreshId}"
    description: "Read one refresh cycle including cadence_months_applied and the rating frozen at scheduling."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: []
    output: PeriodicRefresh
    side_effects: []

  - method: POST
    path: "/correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression"
    description: "Start, complete, lapse or cancel a refresh cycle. Completion requires a REFRESH_FINAL risk assessment taken after the cycle started, and re-derives the next refresh date."
    roles: [ComplianceAnalyst, PlatformAdmin]
    code: 200
    input: ["action", "cancelled_reason?"]
    output: PeriodicRefresh
    side_effects: ["START requires state SCHEDULED, sets IN_PROGRESS and started_at, and moves the respondent to UNDER_REFRESH", "COMPLETE requires state IN_PROGRESS and a RespondentBank.last_risk_assessed_at >= started_at with risk_assessment_variant REFRESH_FINAL, else ERR_REFRESH_NOT_REASSESSED; it writes completed_at, completed_control_score and completion_risk_rating, moves the respondent to APPROVED with last_approved_at and approved_risk_rating refreshed, runs calculations.refresh_due_date (variant AT_APPROVAL) and sets the respondent's CALIBRATED monitoring profile to RECALIBRATION_REQUIRED with recalibration_reason REFRESH_COMPLETION", "LAPSE requires state SCHEDULED or IN_PROGRESS and the logical clock >= scheduled_due_date; it writes lapsed_at and moves the respondent to REFRESH_OVERDUE, then to RESTRICTED with restriction_reason REFRESH_LAPSED once the clock is 30 days past scheduled_due_date", "CANCEL requires a cancelled_reason and state SCHEDULED", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/refresh-sweeps"
    description: "Operator-driven sweep over every respondent: lapses overdue refresh cycles, marks dispatched RFIs overdue, escalates already-overdue RFIs whose next 72-hour window has elapsed, and applies the resulting restrictions. Deterministic order — respondents by refresh_due_date ASC then created_at ASC, and inside one respondent refresh cycles before information requests."
    roles: [PlatformAdmin]
    code: 200
    input: ["dry_run?"]
    output: RespondentBank[]
    side_effects: ["with dry_run true nothing is written and the response lists the respondents that would change", "otherwise applies, per respondent in the pinned order, the same transitions as POST /correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression with action LAPSE and POST /correspondent-banking/information-requests/{informationRequestId}/overdue-marking with action MARK_OVERDUE then ESCALATE", "calculations.unresponsive_strike_ledger for every RFI it marks overdue", "returns the affected RespondentBank rows in the sweep order", "increments RespondentBank.version by 1 for each affected respondent"]

