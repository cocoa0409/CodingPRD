            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-070001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
