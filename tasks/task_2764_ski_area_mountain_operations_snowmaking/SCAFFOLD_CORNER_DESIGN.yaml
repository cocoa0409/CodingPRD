            - "Trigger 2: HTTP 200 with opening_state == 'OPEN'; the day plan posture moves to 'PUBLISHED_FULL' and its version is incremented, so ${dp_v0} is now stale."
            - "Trigger 3: HTTP 412 with data.error_id == 'ERR_STALE_DAY_PLAN_VERSION' - the capacity the caller observed (guest_capacity 1080 on the zero-acreage branch of the crowding rule) is not the 918 that now applies."
            - "Trigger 4: admitted_guest_count == 0, non_season_admitted_count == 0, waitlisted_guest_count == 0, parking_stalls_used == 0, guest_capacity == 918 and non_season_pool == 642."
            - "Trigger 6: HTTP 201 with state == 'CONFIRMED', waitlist_reason == 'NONE' and allocated_stalls == 3."
            - "Trigger 7: HTTP 412 with data.error_id == 'ERR_STALE_DAY_PLAN_VERSION' - guest_capacity 918 leaves room for another party of 10, so the rejection is purely the consumed token; two parties may not be admitted against one observed version."
            - "Trigger 8: admitted_guest_count == 10, non_season_admitted_count == 10 and parking_stalls_used == 3 - the 412 admitted nobody and allocated no stall."
            - "Trigger 10: HTTP 201 on the identical payload with the refreshed token; state == 'CONFIRMED' and non_season_admitted_count stays 10, because a SEASON_PASS party is not drawn from the non-season pool."
