      - name: agent_pause_resume_cycle_restores_routing_eligibility
        grounds:
          - state_machines.Agent.ACTIVE_to_PAUSED
          - state_machines.Agent.PAUSED_to_ACTIVE
          - calculations.agent_selector
        distinguishing_aspect: |
          Agent machine is cyclic (ACTIVE -> PAUSED -> ACTIVE): while PAUSED the
          agent is excluded from the selector and their OFFERED leads cascade to
          a peer; after resume the same agent wins the next round-robin on the
          last_assigned_at ordering. Distinct entity from the Lead parallel
          instance.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; SPHERE source auto_route false; ACTIVE agents A1 (created first) and A2"
            - "Lead1 routed to A1 at 2026-08-01T00:00:00Z (round-robin: both never assigned, created_at tie-break)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 100000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent One", license_number: "LIC-A1", max_active_leads: 10 }, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/agents/${a1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Two", license_number: "LIC-A2", max_active_leads: 10 }, as: TeamAdmin, captures: { a2: $.data.id } }
            - { call: "POST /crm/agents/${a2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead One", contact_phone: "+15125550041", contact_email: "l1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/route", payload: {}, as: TeamAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Two", contact_phone: "+15125550042", contact_email: "l2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead2: $.data.id } }
          trigger:
            - { call: "POST /crm/agents/${a1}/pause", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${a1}/resume", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead2}/route", payload: {}, as: TeamAdmin, captures: { asg2_agent: $.data.agent_id } }
          assert:
            - "After pause: Assignment.${asg1}.status == EXPIRED with outcome_reason == AUTO_PAUSE; Lead.${lead1}.assigned_agent_id == ${a2} (cascade re-route excluding the paused agent)"
            - "After resume: Agent.${a1}.status == ACTIVE and consecutive_missed_claims == 0"
            - "asg2_agent == ${a1}: round-robin orders by last_assigned_at ASC — A1 last assigned 00:00:00, A2 01:00:00 — proving the resumed agent re-enters eligibility immediately"

  - rule_id: transitive_cascade
    instances:
      - name: claim_expiry_auto_pause_cascade_reroutes_pool
        grounds:
          - state_machines.Lead.OFFERED_to_NEW
          - state_machines.Agent.ACTIVE_to_PAUSED
          - calculations.agent_selector
        distinguishing_aspect: |
          Depth-4 chain from the clock-set trigger: assignment deadline expiry
          -> agent missed-claim counter hits 3 -> agent auto-pauses -> the pause
          cascade-expires the agent's OTHER offered assignment -> both leads
          re-route to the surviving agent. Each link is caused by the previous
          link, not by the clock call directly.
        test_recipe:
          setup:
            - "Team (claim window default 7200s) with ACTIVE ROUND_ROBIN policy; SPHERE source auto_route false"
            - "ACTIVE agents X (created first, consecutive_missed_claims seeded to 2) and Y (max_active_leads 3, holding one CLAIMED lead Ly so capacity 1/3)"
            - "Lead1 OFFERED to X (assignment A1) and Lead2 OFFERED to X (assignment A2), both offered at 2026-08-01T00:00:00Z with claim deadline 02:00:00"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 100000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent X", license_number: "LIC-X", max_active_leads: 10 }, as: TeamAdmin, captures: { x: $.data.id } }
            - { call: "POST /crm/agents/${x}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${x}/import-production-stats", payload: { consecutive_missed_claims: 2 }, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Y", license_number: "LIC-Y", max_active_leads: 3 }, as: TeamAdmin, captures: { y: $.data.id } }
            - { call: "POST /crm/agents/${y}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead One", contact_phone: "+15125550050", contact_email: "l1@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/route", payload: {}, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Y Zero", contact_phone: "+15125550051", contact_email: "ly0@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { leady0: $.data.id } }
            - { call: "POST /crm/leads/${leady0}/route", payload: {}, as: TeamAdmin, captures: { ay0: $.data.id, ay0_agent: $.data.agent_id } }
            - { call: "POST /crm/leads/${leady0}/claim", payload: {}, as: Agent, as_user_id: "${y}" }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Lead Two", contact_phone: "+15125550052", contact_email: "l2@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead2: $.data.id } }
            - { call: "POST /crm/leads/${lead2}/route", payload: {}, as: TeamAdmin, captures: { a2: $.data.id, a2_agent: $.data.agent_id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:01Z" }, as: TeamAdmin, captures: { auto_paused: $.data.auto_paused_agent_count } }
          assert:
            - "Setup check: a1 agent is ${x} (first-created), ay0_agent == ${y} (never-assigned beats X's set last_assigned_at), a2_agent == ${x} (tie on last_assigned_at 00:00:00 broken by created_at ASC)"
            - "auto_paused == 1; Agent.${x}.status == PAUSED and consecutive_missed_claims == 3 (only the DEADLINE expiry of A1 increments; A2's cascade expiry does not)"
            - "Assignment.${a1}.status == EXPIRED with outcome_reason == DEADLINE (processed first: same claim_deadline_at, earlier created_at)"
            - "Assignment.${a2}.status == EXPIRED with outcome_reason == AUTO_PAUSE"
            - "Lead.${lead1}.assigned_agent_id == ${y} and Lead.${lead2}.assigned_agent_id == ${y} (re-routed with X excluded); Agent.${y}.active_lead_count == 3"
            - "Lead.${leady0} remains CLAIMED by ${y} — the cascade touches only OFFERED assignments"

      - name: deal_approval_cascade_closes_lead_exits_nurture_recomputes_tier
        grounds:
          - state_machines.Deal.PENDING_to_APPROVED
          - state_machines.Lead.UNDER_CONTRACT_to_CLOSED_WON
          - state_machines.NurtureEnrollment.ENROLLED_to_EXITED
          - calculations.agent_performance_tier
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (deal approval, not the
          clock): approve -> lead CLOSED_WON (capacity released) -> the lead's
          ENROLLED enrollment auto-exits CONVERTED AND the agent's trailing
          conversions recompute flips the performance tier BRONZE -> SILVER.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; PORTAL source auto_route true cost 0; ACTIVE agent C; ONBOARDING LEADER L"
            - "ACTIVE nurture campaign targeting COLD with one step"
            - "Lead routed to C, claimed, WORKING, enrolled (temperature COLD == target), Deal gross 500000 PENDING"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/nurture-campaigns", payload: { team_id: "${t}", name: "Cold Drip", temperature_target: "COLD", steps: [{ offset_days: 1, channel: "EMAIL" }] }, as: TeamAdmin, captures: { camp: $.data.id } }
            - { call: "POST /crm/nurture-campaigns/${camp}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550053", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/nurture-enrollments", payload: { campaign_id: "${camp}", lead_id: "${lead}" }, as: TeamLeader, as_user_id: "${l}", captures: { enr: $.data.id } }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead}", gross_commission_cents: 500000 }, as: Agent, as_user_id: "${c}", captures: { deal: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal}/approve", payload: {}, as: TeamLeader, as_user_id: "${l}" }
          assert:
            - "Deal.${deal}.status == APPROVED and Lead.${lead}.status == CLOSED_WON"
            - "Agent.${c}.active_lead_count == 0 (capacity released by the closure link)"
            - "Agent.${c}.trailing_90d_conversions == 1 and performance_tier == SILVER (recompute link caused by the closure, crossing the >= 1 threshold)"
            - "NurtureEnrollment.${enr}.status == EXITED with exit_reason == CONVERTED (caused by the lead closure, not by the approval directly)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: intake_paused_source_and_exhausted_budget_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_SOURCE_NOT_ACTIVE]
          - errors[ERR_SOURCE_BUDGET_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal on POST /crm/leads: the
          source is PAUSED AND the intake would exceed the monthly budget; the
          state error (priority 6) must win over the fiscal error (priority 10).
        test_recipe:
          setup:
            - "Team; PORTAL source cost_per_lead_cents 10000, monthly_budget_cents 10000, auto_route false"
            - "One lead already taken this month (spent_this_month_cents == 10000, so a second intake would exceed the budget)"
            - "Source then PAUSED — both failure conditions now hold for the next intake"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 10000, monthly_budget_cents: 10000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "First", contact_phone: "+15125550060", contact_email: "f@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources/${src}/pause", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Second", contact_phone: "+15125550061", contact_email: "s@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SOURCE_NOT_ACTIVE (state, priority 6), NOT ERR_SOURCE_BUDGET_EXHAUSTED (business_fiscal, priority 10)"
            - "HTTP status is 409 either way; only the error_id distinguishes the priority order"

      - name: split_overlap_and_bad_sum_temporal_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SPLIT_WINDOW_OVERLAP]
          - errors[ERR_SPLIT_SHARE_SUM_INVALID]
        distinguishing_aspect: |
          Different error-category pair from the sibling instance: business_temporal
          vs business_constraint on POST /crm/split-agreements — the window
          overlap check (priority 7) must beat the share-sum check (priority 8)
          when both are violated.
        test_recipe:
          setup:
            - "Team; ACTIVE agents A1 and A2"
            - "Existing ACTIVE SplitAgreement for (A1, A2) over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent One", license_number: "LIC-A1", max_active_leads: 10 }, as: TeamAdmin, captures: { a1: $.data.id } }
            - { call: "POST /crm/agents/${a1}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent Two", license_number: "LIC-A2", max_active_leads: 10 }, as: TeamAdmin, captures: { a2: $.data.id } }
            - { call: "POST /crm/agents/${a2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 5000, b_share_bps: 5000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-09-01T00:00:00Z" }, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${a1}", agent_b_id: "${a2}", a_share_bps: 4000, b_share_bps: 4000, effective_from: "2026-08-15T00:00:00Z" }, as: TeamAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SPLIT_WINDOW_OVERLAP (business_temporal, priority 7), NOT ERR_SPLIT_SHARE_SUM_INVALID (business_constraint, priority 8), even though 4000 + 4000 != 10000 is also violated"
            - "HTTP status differs (409 vs 422) but the pinned ordering, not the status, decides which check runs first"

  - rule_id: boundary_precision_check
    instances:
      - name: speed_to_lead_exact_deadline_within_sla
