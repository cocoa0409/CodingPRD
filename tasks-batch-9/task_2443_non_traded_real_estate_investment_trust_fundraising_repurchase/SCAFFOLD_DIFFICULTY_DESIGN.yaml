  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: offering_not_effective_outranks_offering_maximum_exceeded
        grounds:
          - validations[priority=8].error_id
          - validations[priority=13].error_id
          - errors[ERR_OFFERING_NOT_EFFECTIVE]
          - errors[ERR_OFFERING_MAXIMUM_EXCEEDED]
          - entities.Offering.fields.maximum_offering_amount_cents
        distinguishing_aspect: |
          One subscription violates the priority-8 cross-entity-state rule (the
          offering's registration is SUSPENDED) and the priority-13 fiscal
          ceiling (gross_proceeds 20000000 + 600000 > maximum 20500000) at the
          same time; the response must be ERR_OFFERING_NOT_EFFECTIVE (409), and
          the very same body must flip to ERR_OFFERING_MAXIMUM_EXCEEDED (422)
          once registration is reinstated — proving the order, not just the codes.
        test_recipe:
          setup:
            - "Offering 'Ashford Core Plus REIT' with minimum_offering_amount_cents 20000000 and maximum_offering_amount_cents 20500000, escrow BROKEN off one 20000000-cent class I subscription, so gross_proceeds_cents is 20000000."
            - "Registration then SUSPENDED, escrow left at BROKEN."
            - "A DOCUMENTED investor with concentration_limit_cents 500000000, so no investor-protection gate can fire."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ashford Core Plus REIT", minimum_offering_amount_cents: 20000000, maximum_offering_amount_cents: 20500000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
