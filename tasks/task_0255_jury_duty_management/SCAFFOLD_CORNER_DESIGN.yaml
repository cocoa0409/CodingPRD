          note: "The not-yet-summoned filter shrinks the eligible pool to 0, so the short-pool fallback ERR_POOL_EXHAUSTED fires; ERR_DUPLICATE_SUMMONS guards an explicit re-issue path. This corner verifies the exclusion semantics keep the juror out of the pool."

