  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: toy_line_advance_gated_by_agreement_and_property
        grounds:
          - state_machines.ToyLine.CONCEPT_to_IN_DEVELOPMENT
          - entities.LicenseAgreement.fields.status
          - entities.Property.fields.lifecycle
        distinguishing_aspect: |
          ToyLine -> (LicenseAgreement, Property) pair: CONCEPT ->
          IN_DEVELOPMENT is legal only when the linked agreement is ACTIVE and
          the property is not CONFIDENTIAL; a NEGOTIATION agreement or a
          pre-reveal property blocks the line.
        test_recipe:
          setup:
            - "Studio STRICT, property P1 reveal 2027-01-01 (CONFIDENTIAL at 2026-10-01), agreement LA1 in NEGOTIATION."
            - "LICENSED line cannot be created pre-reveal, so the gate is tested at reveal+1day with agreement still NEGOTIATION."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "Stealth Studio", confidentiality_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "Secret Sequel", category: "FILM", reveal_date: "2026-10-05T00:00:00Z", release_date: "2027-06-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 0, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id }
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Secret Line", brand_kind: "LICENSED", property_id: "${p1}", license_agreement_id: "${la1}" }
              as: BrandManager
              captures: { l1: $.data.id, l1_v: $.data.version }
          trigger:
            - call: "POST /toy-licensing/toy-lines/${l1}/advance"
              payload: { expected_toy_line_version: "${l1_v}" }
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (agreement still NEGOTIATION blocks advance)"
            - "ToyLine.${l1}.status stays CONCEPT"
      - name: commitment_cancel_gated_by_review_lock
        grounds:
          - state_machines.AssortmentCommitment.COMMITTED_to_CANCELLED
          - entities.LineReview.fields.lifecycle
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Different entity pair AssortmentCommitment -> LineReview: cancel is
          legal only while the host review's computed lifecycle is OPEN; once
          the clock passes commitment_deadline the review is LOCKED and the
          same cancel request fails even though the commitment row is
          unchanged.
        test_recipe:
          setup:
            - "Evergreen line + sku; retailer R1 CONFIRMED review (window 2026-09-15..2026-11-15, deadline 2026-10-15); commitment C1 COMMITTED."
            - "Clock advanced to 2026-10-20 (LOCKED)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-10-15T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 100, unit_price_cents: 500, shelf_slots: 4 }
              as: BrandManager
              captures: { c1: $.data.id }
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-licensing/assortment-commitments/${c1}/cancel"
              payload: {}
              as: BrandManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (review LOCKED)"
            - "AssortmentCommitment.${c1}.status stays COMMITTED"
            - "LineReview.${lr1}.shelf_slots_used stays 4"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_review_half_open_window_adjacency
        grounds:
          - validations[priority=8]
          - entities.LineReview.fields.window_start
          - entities.LineReview.fields.window_end
        distinguishing_aspect: |
          Half-open interval semantics on LineReview: window A
          [2026-09-01, 2026-10-01) and window B starting exactly 2026-10-01
          are adjacent and allowed; window C starting 2026-09-30 overlaps and
          is rejected. Interval-geometry rule on the LineReview resource.
        test_recipe:
          setup:
            - "Retailer R1. Review A [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", commitment_deadline: "2026-09-25T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
          trigger:
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z", commitment_deadline: "2026-10-25T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { ok_b: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-30T00:00:00Z", window_end: "2026-10-15T00:00:00Z", commitment_deadline: "2026-10-10T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent review B created successfully (201)"
            - "Overlapping review C rejected with ERR_REVIEW_WINDOW_OVERLAP (409)"
      - name: factory_month_capacity_aggregate_overlap
        grounds:
          - calculations.factory_capacity_allocation
          - validations[priority=9]
          - entities.Factory.fields.capacity_units_per_month
        distinguishing_aspect: |
          Different interval semantics on a different resource: not pairwise
          interval intersection but aggregate bucket capacity — two tooling
          orders in the same (factory, production_month) bucket are allowed
          while their sum fits, and the order that tips the sum past
          capacity_units_per_month is rejected; a third order in a different
          month bucket is unaffected.
        test_recipe:
          setup:
            - "Factory F1 capacity 1000; evergreen line + sku SK1 (moq 100)."
            - "Existing APPROVED order for 800 units in 2027-01."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 1000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-06-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 100, unit_cost_cents: 100, tooling_cost_cents: 10000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 800 }
              as: BrandManager
          trigger:
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 250 }
              as: BrandManager
              captures: { err: $.data.error_id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-02", units: 250 }
              as: BrandManager
              captures: { ok_feb: $.data.id }
          assert:
            - "2027-01 order of 250 rejected with ERR_FACTORY_CAPACITY_EXCEEDED (800+300 > 1000 after MOQ rounding to 300)"
            - "2027-02 order of 250 created (different bucket; allocated_units 300)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: embargo_penalty_waive_restores_retailer_ledger
        grounds:
          - invariants.embargo_ledger_conservation
          - endpoints.POST_/toy-licensing/shipments/{id}/record_sale
          - endpoints.POST_/toy-licensing/shipments/{id}/waive_penalty
        distinguishing_aspect: |
          Conserved quantity: Retailer.credit_balance_cents. Assessing an
          embargo penalty debits the ledger; waiving it credits back exactly
          penalty_cents; the pair leaves the ledger unchanged while
          violation_count stays incremented (waive is not an un-violation).
        test_recipe:
          setup:
            - "Clock 2026-10-01. Evergreen line street 2027-01-01, sku, retailer R1, CONFIRMED review, commitment at 100c, shipment of 1000 units."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 1000, unit_price_cents: 100, shelf_slots: 4 }
              as: BrandManager
              captures: { c1: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c1}", planned_ship_date: "2026-12-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/shipments/${sh1}/record_sale"
              payload: { units_sold: 500 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { pen: $.data.penalty_cents }
            - call: "POST /toy-licensing/shipments/${sh1}/waive_penalty"
              payload: {}
              as: BrandManager
          assert:
            - "Shipment.${sh1}.penalty_cents == 5000 after sale (500*100c*0.10) and penalty_status == OPEN"
            - "Retailer.${r1}.credit_balance_cents == -5000 after sale"
            - "After waive: Shipment.${sh1}.penalty_status == WAIVED and Retailer.${r1}.credit_balance_cents == 0"
            - "Retailer.${r1}.violation_count == 1 (waive does not decrement)"
      - name: closeout_exit_cycle_frees_and_reoccupies_shelf_slots
        grounds:
          - invariants.closeout_shelf_conservation
          - endpoints.POST_/toy-licensing/toy-lines/{id}/enter_closeout
          - endpoints.POST_/toy-licensing/toy-lines/{id}/exit_closeout
        distinguishing_aspect: |
          Different conserved quantity: LineReview.shelf_slots_used. Closing
          out a line frees exactly the cancelled commitments' slots; exiting
          closeout and re-committing re-occupies them; the invariant
          shelf_slots_used == sum of slots over COMMITTED/AT_RISK commitments
          holds at every step.
