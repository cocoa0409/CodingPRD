        distinguishing_aspect: "Meeting close is a BoardAdmin exclusive: a sitting BoardMember holding the right role for votes gets 403 ERR_INSUFFICIENT_PERMISSIONS on close — deliberation and gavel are separate roles."
        test_recipe:
