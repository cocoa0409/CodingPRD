          setup:
            - "clock 2026-09-01; regulation US-CA-SCAQMD/SPRAY_AIRLESS limit 340; power-tool system (SSPC_SP11_POWER_TOOL, profile 1..3, DFT 6..12, base_voc 250, thinner 420, max_thinner 0.10, adhesion 400)"
