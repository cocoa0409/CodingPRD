            - { call: "POST /permits/security-plans", payload: { application_id: "${a}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications/${a}/open-review", payload: {}, as: PermitClerk, captures: { av0: $.data.version } }
            - { call: "GET /permits/agency-reviews?application_id=${a}", payload: {}, as: PermitClerk, captures: { r0: "$.data[0].id", r1: "$.data[1].id", r2: "$.data[2].id" } }
            - { call: "POST /permits/agency-reviews/${r0}/decide", payload: { decision: "APPROVE", expected_application_version: "${av0}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av1: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r1}/decide", payload: { decision: "APPROVE", expected_application_version: "${av1}" }, as: AgencyReviewer, as_user_id: "rev-1" }
            - { call: "GET /permits/applications/${a}", payload: {}, as: PermitClerk, captures: { av2: $.data.version } }
            - { call: "POST /permits/agency-reviews/${r2}/decide", payload: { decision: "REJECT", expected_application_version: "${av2}" }, as: AgencyReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /permits/applications/${a}/request-revisions", payload: {}, as: PermitClerk }
          assert:
