  - section: endpoints
    instances:
      - name: target_market_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /cdfi/institutions/{institution_id}/target-markets]
          - endpoints[GET /cdfi/institutions/{institution_id}/target-markets]
        distinguishing_aspect: |
          TargetMarket has no single-item GET, so the read path is the nested list with a state
          filter: two markets under one institution, one APPROVED and one DRAFT, must be
          retrievable as total_count 2 unfiltered, 1 with state=DRAFT and 1 with state=APPROVED,
          and the DRAFT row must carry census_tract_codes exactly as posted.
        test_recipe:
          setup:
            - "One institution with two markets: an INVESTMENT_AREA that has been approved and a second INVESTMENT_AREA left DRAFT with two tract codes."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000037", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "South Bronx Investment Area", census_tract_codes: ["36005010100"] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm1_id: $.data.id }
            - call: "POST /cdfi/target-markets/${tm1_id}/approve"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "Mott Haven Investment Area", census_tract_codes: ["36005011200", "36005011300"] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm2_id: $.data.id }
          trigger:
            - call: "GET /cdfi/institutions/${inst_id}/target-markets"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { all_status: $.status, all_total: $.meta.total_count }
            - call: "GET /cdfi/institutions/${inst_id}/target-markets?state=DRAFT"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { draft_total: $.meta.total_count }
            - call: "GET /cdfi/institutions/${inst_id}/target-markets?state=APPROVED"
              payload: {}
