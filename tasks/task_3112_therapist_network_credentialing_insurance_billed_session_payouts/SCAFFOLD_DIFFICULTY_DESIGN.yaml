      - name: resubmission_rejected_at_the_recovery_deadline_exactly_while_write_off_is_allowed
        grounds:
          - calculations.claim_recovery_deadline_utc
          - state_machines.Claim.transitions.DENIED_to_REPROCESSING
          - state_machines.Claim.transitions.DENIED_to_WRITTEN_OFF
          - errors.ERR_TIMELY_FILING_EXPIRED
          - errors.ERR_WRITE_OFF_NOT_ALLOWED
          - endpoints.POST_/network/claims/{id}/resubmit
        distinguishing_aspect: "At the exact instant logical clock == recovery_deadline the two adjacent operations disagree: resubmission needs strict inequality and is rejected with 422 while write-off accepts the boundary and succeeds, so the same timestamp is both too late and early enough."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, then 2026-06-20T00:00:00Z."
            - "Payer PAX has timely_filing_days 90 and the session is dated 2026-06-16T14:00:00Z."
            - "One claim submitted at 2026-06-16T16:00:00Z and then denied at outcome DENIED with denial_code NOT_COVERED, so recovery_deadline == 2026-09-14T16:00:00Z."
            - "Logical clock is then set to 2026-09-14T15:59:59Z for the first probe and 2026-09-14T16:00:00Z for the second."
