              as: NO_HEADERS_AT_ALL
              captures: { e1: $.data.error_id }
            - call: "GET /eye-bank/donors"
              payload: {}
              as: X_USER_ROLE_ONLY_NO_X_USER_ID
              captures: { e2: $.data.error_id }
            - call: "GET /eye-bank/donors"
              payload: {}
              as: NotARealRole
              as_user_id: "00000000-0000-4000-8000-0000000000b1"
              captures: { e3: $.data.error_id }
          assert:
            - "HTTP 401 on all three attempts"
            - "${e1} == \"ERR_UNAUTHENTICATED\" and ${e2} == \"ERR_UNAUTHENTICATED\" and ${e3} == \"ERR_UNAUTHENTICATED\""
            - "the response envelope is the §1.0 error envelope with response_type == \"error\" and a non-empty data.message"
            - "no Donor row is created (GET /eye-bank/donors as EyeBankCoordinator reports total_count == 0)"

      - name: an_entity_backed_actor_must_resolve_and_must_own_the_resource_it_touches
        claim_type: entity_backed_identity_and_ownership
        grounds:
          - validations.priority_3
          - validations.priority_10
          - "errors[ERR_UNKNOWN_ACTOR]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles[RecoveryTechnician].identity"
          - "roles[EvaluationTechnician].identity"
        distinguishing_aspect: |
          The same arrive call is attempted three ways against one DISPATCHED recovery: with an
          X-User-ID that matches no Technician row (403 ERR_UNKNOWN_ACTOR, priority 3), with a real
          but different technician's id (403 ERR_NOT_RESOURCE_OWNER, priority 10), and finally with
          the assigned technician (200). The evaluation endpoint's ownership rule is the odd one out —
          it compares X-User-ID to the *body's* evaluator_technician_id rather than to a field of the
          path resource — so a certified technician submitting a colleague's id is also refused.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "technicians A (RECOVERY_ONLY, assigned), B (RECOVERY_AND_EVAL) and C (RECOVERY_AND_EVAL)"
