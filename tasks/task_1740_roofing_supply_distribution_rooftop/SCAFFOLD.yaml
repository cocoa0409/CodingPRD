# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator with full access to configuration and all records"
    identity: opaque
    exclusive_operations: ["create branches", "create products", "set logical clock"]
    shared_operations: ["read all resources"]

  - name: BranchManager
    description: "Branch operations leader; owns surge events, allocation grants, return approvals"
    identity: opaque
    exclusive_operations: ["declare/close surge events", "grant/revoke allocations", "approve/reject returns"]
    shared_operations: ["read branch-scoped resources"]

  - name: SalesRep
    description: "Creates and quotes takeoffs, closes orders"
    identity: opaque
    exclusive_operations: ["quote/revise takeoffs", "close orders"]
    shared_operations: ["create takeoffs", "read accounts/orders"]

  - name: Dispatcher
    description: "Schedules and executes deliveries"
    identity: opaque
    exclusive_operations: ["create delivery slots", "schedule/dispatch/complete/fail/reschedule/reconfirm/cancel deliveries"]
    shared_operations: ["read orders, slots, lots"]

  - name: Contractor
    description: "External customer; owns job accounts, confirms orders, files returns/claims"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations: ["convert takeoffs", "confirm/cancel own orders", "request allocations", "request returns", "file/dispute damage claims", "register warranties"]
    shared_operations: ["read own account, jobs, orders"]

  - name: CreditAnalyst
    description: "Manages contractor credit, invoicing, lien lifecycle, claim crediting"
    identity: opaque
    exclusive_operations: ["create/suspend/reinstate contractor accounts", "post payments", "invoice orders", "file/record/release liens", "credit approved claims"]
    shared_operations: ["read accounts, orders, claims"]

  - name: ClaimsAdjuster
    description: "Reviews and adjudicates damage claims; cannot credit them (SoD)"
    identity: opaque
    exclusive_operations: ["start-review/approve/reject damage claims"]
    shared_operations: ["read deliveries, claims"]

  - name: WarehouseClerk
    description: "Receives inventory and returned bundles"
    identity: opaque
    exclusive_operations: ["receive inventory lots", "receive approved returns"]
    shared_operations: ["read lots, returns, order lines"]
