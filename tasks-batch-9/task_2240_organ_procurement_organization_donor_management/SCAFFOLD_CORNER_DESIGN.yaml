        distinguishing_aspect: |
          The freeze gate is endpoint-scoped, not case-scoped: after a cardiac-arrest observation
          freezes the case, further observations and organ additions are refused with ERR_CASE_FROZEN
          while the deliberately exempt disposition endpoint still records the research referral for
          the organ stranded by the closure.
