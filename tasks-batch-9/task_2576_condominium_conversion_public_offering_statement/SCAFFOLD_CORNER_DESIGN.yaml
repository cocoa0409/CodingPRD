          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /conversion-projects]
        distinguishing_aspect: "One request violates three rules at once (no auth headers, a role that may
          not create projects, and a body missing the required year_built). The declared ladder resolves
          it in one fixed order: 401, then 403 once headers are supplied, then 422 once the role is
          right. A server validating the body first would answer 422 to all three."
