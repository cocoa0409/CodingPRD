            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", class_session_id: "${src_sess_id}", expected_class_session_version: "${src_v}" }
              as: Parent
              as_user_id: "${parent_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/pause"
              payload: {}
