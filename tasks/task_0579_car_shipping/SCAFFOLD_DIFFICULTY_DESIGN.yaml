            - call: "POST /listings/${listing1_id}/offers/${offer1_id}/accept"
              payload: {}
              as: Broker
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-03T08:00:00Z", pickup_window_end: "2026-06-07T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
