            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
