      - name: credential_verify_twice_rejects_second_decision
        claim_type: idempotency
        grounds:
          - validations.priority_12_ERR_CREDENTIAL_NOT_PENDING
          - errors.ERR_CREDENTIAL_NOT_PENDING
        distinguishing_aspect: "The second VERIFY on the same credential is refused with ERR_CREDENTIAL_NOT_PENDING (409) rather than silently re-stamping verified_at_utc; the credential keeps the first verifier and the first timestamp."
        test_recipe:
          setup:
            - "Vendor TWICEV has one rep whose BACKGROUND_CHECK credential was verified at 2026-08-01T00:00:00Z; the clock is then advanced to 2026-08-03T00:00:00Z so a re-stamp would be observable."
