              payload: {}
              as: Programmer
              captures: { b_v3: $.data.version }
            - call: "POST /bookings/${b_id}/counter"
              payload: { expected_booking_version: "${b_v3}", proposed_house_nut_cents: 13500, proposed_distributor_share_pct: 0.38, proposed_min_run_days: 4, proposed_guarantee_cents: 3800 }
              as: Programmer
