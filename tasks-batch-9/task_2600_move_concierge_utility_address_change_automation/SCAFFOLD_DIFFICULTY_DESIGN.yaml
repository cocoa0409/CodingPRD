        grounds:
          - "validations[priority=9]"
          - "validations[priority=21]"
          - "endpoints[POST /address-change-filings/{id}/submission]"
          - state_machines.AddressChangeFiling.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Category pair state (priority 9, ERR_FILING_NOT_SUBMITTABLE) vs business_referential
          (priority 21, ERR_CONSENT_REVOKED) on POST /address-change-filings/{id}/submission: with the
          filing already SUBMITTED and the move's consent gate BLOCKED, both rules are violated and the
          response must be ERR_FILING_NOT_SUBMITTABLE; driving the filing to REJECTED (which repairs only
          the state rule) then surfaces ERR_CONSENT_REVOKED from the very same call, proving the ordering
          rather than a single hard-coded error.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Resident with GRANTED consents for both UTILITY_SETUP and USPS_FILING (move_id null)."
            - "Move for 2026-08-20 verified by KBA, never mapped, so lifecycle stays VERIFIED (an allowed from-state for filing submission)."
            - "One filing created and submitted, so its status is SUBMITTED with resubmit_count 0."
            - "The UTILITY_SETUP consent is then revoked, which flips consent_gate to BLOCKED while the USPS_FILING consent stays GRANTED (so priority 20 ERR_CONSENT_MISSING is NOT violated and the pair under test is exactly 9 vs 21)."
