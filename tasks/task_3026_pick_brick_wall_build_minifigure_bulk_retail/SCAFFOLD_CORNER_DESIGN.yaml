            - "WallBin.${bin_h01}.bin_mass_grams == 900"

      - name: rotation_with_no_candidates_is_a_no_op_not_an_error
        claim_type: Correct Result
        grounds: ["calculations.wall_depletion_restock", "endpoints.POST_/stores/wall-bins/rotate"]
