scenario: "Community Garden & Plot Allocation: plot inventory & size, application & waitlist, seasonal fee & work-hour requirement, assignment & renewal priority, rule/abandonment compliance, water usage, shared tools/shed, forfeiture/reassignment"
domain_name: "community-garden-plot-allocation"
api_prefix: ""   # flat topology: every collection is a top-level resource path

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency          # OCC on Plot.version for direct manager assignment (supersede)
    - cascading_side_effects          # forfeiture / escalation propagate Assignment -> Plot -> Application
    - dual_variant_calculation        # provisional vs final seasonal fee; snapshot vs live priority score
    - rate_threshold_triggers         # water overage per-period breakpoints; work-hour requirement boundary

  entity_topology: flat               # peer entities linked by foreign keys, no nesting in resource identity
  state_machine_shape: parallel       # Assignment carries independent occupancy_status x fee_status axes; Plot is cyclic; Application branches
  relationship_patterns:
    - one_to_many                     # Garden->Plot, Assignment->WorkLog/WaterReading
    - self_referential                # Assignment.renewed_from_assignment_id -> Assignment.id
    - cross_aggregate                 # ComplianceCase/ToolLoan/ShedBooking reach across Assignment/Gardener boundaries

  role_model: segregation_of_duties   # GardenManager assesses; Treasurer settles money; a manager cannot waive/refund fees
  consistency_model: immediate

# =====================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Garden
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the community garden site"
      - name: season_label
        type: string
        source: input
        description: "Human label for the growing season, e.g. '2026-SPRING'"
      - name: season_start
        type: datetime
        source: input
        description: "Inclusive start instant of the current season (ISO 8601 UTC)"
      - name: season_end
        type: datetime
        source: input
        description: "Exclusive end instant of the current season (ISO 8601 UTC)"
      - name: offer_window_days
        type: integer
        source: input
        default: 7
        description: "Days an OFFERED application has to accept before it expires"
        constraints: ">= 1"
      - name: total_plots
        type: integer
        source: computed
        description: "Count of Plot rows whose garden_id == this Garden.id"
      - name: available_plot_count
        type: integer
        source: computed
        description: "Count of Plot rows for this garden whose status == AVAILABLE (conserved-quantity anchor, §1.3 plot_pool_conservation)"

  - name: Plot
    parent: Garden
    common_fields: true
    fields:
      - name: garden_id
        type: string
        source: input
        description: "FK -> Garden.id; the garden this plot belongs to"
      - name: label
        type: string
        source: input
        description: "Plot label unique within the garden, e.g. 'A-12'"
      - name: size
        type: enum
        source: input
        description: "Plot size class driving fee, water allowance and work-hour requirement"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "Occupancy posture of the plot"
        constraints: "one of {AVAILABLE, RESERVED, ASSIGNED}"
      - name: current_assignment_id
        type: string
        source: system
        description: "Id of the Assignment currently occupying this plot, or null when status != ASSIGNED. Denormalized pointer, NOT a canonical FK (the owning FK is Assignment.plot_id)."

  - name: Gardener
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Gardener's full name"
      - name: email
        type: string
        source: input
        description: "Unique contact email; duplicate -> ERR_DUPLICATE_EMAIL"
        constraints: "unique across all Gardener rows"
      - name: tenure_seasons
        type: integer
        source: system
        default: 0
        description: "Number of completed/renewed seasons; incremented by confirm-renewal; feeds renewal_priority_score"
      - name: standing
        type: enum
        source: system
        default: GOOD
        description: "Derived disciplinary standing recomputed from strike_count on every compliance-case creation"
        constraints: "one of {GOOD, PROBATION, SUSPENDED}"
      - name: strike_count
        type: integer
        source: system
        default: 0
        description: "Cumulative count of compliance cases opened against this gardener"
      - name: balance_owed_cents
        type: integer
        source: system
        default: 0
        description: "Running fee ledger in integer cents (conserved-quantity anchor, §1.3 fee_ledger_conservation)"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: gardener_id
        type: string
        source: input
        description: "FK -> Gardener.id; the applicant"
      - name: garden_id
        type: string
        source: input
        description: "FK -> Garden.id; the garden being applied to"
      - name: requested_size
        type: enum
        source: input
        description: "Plot size the applicant is waiting for"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Waitlist lifecycle state"
        constraints: "one of {SUBMITTED, WAITLISTED, OFFERED, ACCEPTED, DECLINED, EXPIRED}"
      - name: priority_score_at_submission
        type: integer
        source: computed
        description: "Snapshot of renewal_priority_score frozen at submission (as_submitted variant, §1.3)"
      - name: offered_plot_id
        type: string
        source: system
        description: "Id of the Plot currently offered to this application, or null. Denormalized pointer (owning FK is Assignment.plot_id / Plot identity), not a canonical FK."
      - name: offer_expires_at
        type: datetime
        source: system
        description: "Instant after which an OFFERED application is no longer acceptable; null unless OFFERED"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: plot_id
        type: string
        source: system
        description: "FK -> Plot.id; the plot leased under this assignment"
      - name: gardener_id
        type: string
        source: system
        description: "FK -> Gardener.id; the leaseholder"
      - name: garden_id
        type: string
        source: system
        description: "FK -> Garden.id; denormalized owning garden"
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; the accepted application, or null for a direct manager assignment"
      - name: renewed_from_assignment_id
        type: string
        source: system
        description: "FK -> Assignment.id; the prior-season assignment this one renews, or null"
      - name: season_start
        type: datetime
        source: system
        description: "Inclusive start of the leased season (copied from Garden at creation)"
      - name: season_end
        type: datetime
        source: system
        description: "Exclusive end of the leased season (copied from Garden at creation)"
      - name: size
        type: enum
        source: system
        description: "Plot size snapshot taken at assignment creation; drives fee & requirements"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: occupancy_status
        type: enum
        source: system
        default: ACTIVE
        description: "Occupancy axis (independent of fee_status)"
        constraints: "one of {ACTIVE, RENEWAL_PENDING, RENEWED, ENDED, FORFEITED}"
      - name: fee_status
        type: enum
        source: system
        default: UNPAID
        description: "Money axis (independent of occupancy_status)"
        constraints: "one of {UNPAID, PAID, WAIVED, REFUNDED}"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "Seasonal fee estimate computed at creation (assignment_fee provisional variant, §1.3)"
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Settled seasonal fee, set at settle/forfeit (assignment_fee final variant, §1.3); null until then"
      - name: required_work_hours
        type: integer
        source: computed
        description: "Work-hour requirement for the season = REQUIRED_WORK_HOURS[size]"
      - name: logged_work_hours
        type: number
        source: system
        default: 0
        description: "Running sum of WorkLog.hours for this assignment"

  - name: WorkLog
    parent: null
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment credited with these hours"
      - name: hours
        type: number
        source: input
        description: "Work hours contributed by this entry"
        constraints: "> 0"
      - name: logged_on
        type: datetime
        source: input
        description: "Instant the work was performed (ISO 8601 UTC)"
      - name: note
        type: string
        source: input
        description: "Optional free-text description of the work"

  - name: WaterReading
    parent: null
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment this reading meters"
      - name: period_index
        type: integer
        source: input
        description: "Billing period ordinal within the season"
        constraints: "integer in [1, SEASON_PERIODS]; unique per (assignment_id, period_index)"
      - name: gallons_used
        type: number
        source: input
        description: "Gallons consumed during the billing period"
        constraints: ">= 0"
      - name: recorded_on
        type: datetime
        source: input
        description: "Instant the meter was read (ISO 8601 UTC)"

  - name: ComplianceCase
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment under review"
      - name: gardener_id
        type: string
        source: system
        description: "FK -> Gardener.id; denormalized from the assignment at creation"
      - name: violation_type
        type: enum
        source: input
        description: "Nature of the rule/abandonment violation"
        constraints: "one of {NEGLECT, RULE_BREACH, UNPAID_FEE, WATER_ABUSE}"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Compliance lifecycle state"
        constraints: "one of {OPEN, WARNED, CURED, ESCALATED}"
      - name: cure_deadline
        type: datetime
        source: system
        description: "Instant by which the violation must be cured; set on WARN = clock + CURE_GRACE_DAYS where CURE_GRACE_DAYS = 14 days; null before WARN"
      - name: opened_on
        type: datetime
        source: system
        description: "Logical-clock instant at which the case was opened"

  - name: Tool
    parent: Garden
    common_fields: true
    fields:
      - name: garden_id
        type: string
        source: input
        description: "FK -> Garden.id; the garden whose shed holds this tool"
      - name: name
        type: string
        source: input
        description: "Tool name, e.g. 'Wheelbarrow #2'"
      - name: category
        type: enum
        source: input
        description: "Tool category"
        constraints: "one of {HAND, POWER, CART}"
      - name: cleaning_buffer_hours
        type: integer
        source: input
        default: 4
        description: "Hours of cleaning downtime appended after each loan's effective end before the tool can be re-loaned"
        constraints: ">= 0"

  - name: ToolLoan
    parent: null
    common_fields: true
    fields:
      - name: tool_id
        type: string
        source: input
        description: "FK -> Tool.id; the tool checked out"
      - name: gardener_id
        type: string
        source: input
        description: "FK -> Gardener.id; the borrower"
      - name: checked_out_at
        type: datetime
        source: input
        description: "Interval start of the loan (ISO 8601 UTC)"
      - name: due_at
        type: datetime
        source: input
        description: "Scheduled return instant (interval end before buffer)"
        constraints: "> checked_out_at"
      - name: returned_at
        type: datetime
        source: system
        description: "Actual return instant, set on return; null while CHECKED_OUT"
      - name: status
        type: enum
        source: system
        default: CHECKED_OUT
        description: "Loan lifecycle state"
        constraints: "one of {CHECKED_OUT, RETURNED, RETURNED_LATE}"
      - name: late_fine_cents
        type: integer
        source: computed
        default: 0
        description: "Fine assessed on late return (tool_late_fine, §1.3); 0 while outstanding or returned on time"

  - name: ShedBooking
    parent: null
    common_fields: false
    fields:
      - name: garden_id
        type: string
        source: input
        description: "FK -> Garden.id; the garden whose shared shed is booked"
      - name: gardener_id
        type: string
        source: input
        description: "FK -> Gardener.id; the booking gardener"
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive start of the shed reservation (ISO 8601 UTC)"
      - name: ends_at
        type: datetime
        source: input
        description: "Exclusive end of the shed reservation (ISO 8601 UTC)"
        constraints: "> starts_at"
      - name: purpose
        type: enum
        source: input
        description: "Reason for the booking"
        constraints: "one of {STORAGE, WORKSHOP, MEETING}"

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  # ---- Plot: cyclic occupancy (AVAILABLE <-> RESERVED <-> ASSIGNED) ----
  - entity: Plot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /plots/{id}/offer  (or cascade auto-offer from settle/forfeit/escalate)"
        actor: GardenManager
        preconditions:
          - "plot.status == AVAILABLE"
          - "at least one eligible WAITLISTED Application exists for (plot.garden_id, plot.size); else ERR_NO_ELIGIBLE_APPLICANT"
        side_effects:
          - "select top-ranked Application via renewal_priority_score (as_of_allocation); set that Application.status = OFFERED, offered_plot_id = plot.id, offer_expires_at = clock + garden.offer_window_days"
          - "increments Plot.version by 1"
      - from: RESERVED
        to: ASSIGNED
        trigger: "POST /applications/{id}/accept"
        actor: Gardener
        preconditions:
          - "the offered Application.status == OFFERED and offered_plot_id == plot.id"
          - "clock <= Application.offer_expires_at; else ERR_OFFER_EXPIRED"
        side_effects:
          - "create Assignment (occupancy ACTIVE, fee UNPAID), compute provisional_fee_cents"
          - "Gardener.balance_owed_cents += provisional_fee_cents"
          - "set plot.current_assignment_id = new Assignment.id"
          - "increments Plot.version by 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /applications/{id}/decline  or  POST /gardens/{id}/expire-offers"
        actor: Gardener | system
        preconditions:
          - "the offered Application.status == OFFERED and offered_plot_id == plot.id"
        side_effects:
          - "clear Application.offered_plot_id and offer_expires_at; Application.status = DECLINED (decline) or EXPIRED (expire sweep)"
          - "increments Plot.version by 1"
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /plots/{id}/assign"
        actor: GardenManager
        preconditions:
          - "plot.status == AVAILABLE; else ERR_PLOT_NOT_AVAILABLE"
          - "request expected_plot_version == plot.version; else ERR_STALE_VERSION (OCC, §1.2.1)"
          - "no non-terminal Assignment on this plot whose [season_start, season_end) overlaps the garden's season; else ERR_PLOT_SEASON_CONFLICT"
        side_effects:
          - "create Assignment (occupancy ACTIVE, fee UNPAID) directly, superseding any pending offer selection; compute provisional_fee_cents"
          - "Gardener.balance_owed_cents += provisional_fee_cents"
          - "set plot.current_assignment_id = new Assignment.id"
          - "increments Plot.version by 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /assignments/{id}/settle | /forfeit  (or cascade from compliance escalate)"
        actor: GardenManager | system
        preconditions:
          - "plot.current_assignment_id refers to the assignment being ended"
        side_effects:
          - "set plot.current_assignment_id = null"
          - "on forfeit/escalate ONLY: immediately attempt the AVAILABLE->RESERVED auto-offer (conditional cascade; skipped when no eligible applicant)"
          - "increments Plot.version by 1"

  # ---- Application: branching waitlist lifecycle ----
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "system, immediately on POST /applications"
        actor: system
        preconditions:
          - "no other Application for the same (gardener_id, garden_id, requested_size) is in {WAITLISTED, OFFERED}; else ERR_DUPLICATE_APPLICATION"
        side_effects:
          - "compute and freeze priority_score_at_submission = renewal_priority_score(as_submitted)"
      - from: WAITLISTED
        to: OFFERED
        trigger: "POST /plots/{id}/offer selects this application (or cascade auto-offer)"
        actor: GardenManager | system
        preconditions:
          - "Application.requested_size == plot.size"
          - "this application is the top-ranked eligible candidate for the plot"
        side_effects:
          - "set offered_plot_id = plot.id, offer_expires_at = clock + garden.offer_window_days; Plot AVAILABLE->RESERVED"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /applications/{id}/accept"
        actor: Gardener
        preconditions:
          - "acting Gardener owns this application (X-User-ID == gardener_id)"
          - "Plot referenced by offered_plot_id.status == RESERVED (cross-entity, §1.7)"
          - "clock <= offer_expires_at; else ERR_OFFER_EXPIRED"
        side_effects:
          - "Plot RESERVED->ASSIGNED; create Assignment linked via application_id"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Gardener
        preconditions:
          - "acting Gardener owns this application"
        side_effects:
          - "Plot RESERVED->AVAILABLE; clear offered_plot_id, offer_expires_at"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /gardens/{id}/expire-offers when clock > offer_expires_at"
        actor: system
        preconditions:
          - "clock > offer_expires_at"
        side_effects:
          - "Plot RESERVED->AVAILABLE; clear offered_plot_id, offer_expires_at"

  # ---- Assignment: PARALLEL axes (occupancy_status x fee_status) ----
  - entity: Assignment
    initial_state: "occupancy_status=ACTIVE, fee_status=UNPAID"
    terminal_states: ["occupancy_status in {RENEWED, ENDED, FORFEITED}", "fee_status in {WAIVED, REFUNDED}"]
    transitions:
      # --- occupancy axis ---
      - from: "occupancy=ACTIVE"
        to: "occupancy=RENEWAL_PENDING"
        trigger: "POST /assignments/{id}/request-renewal"
        actor: Gardener
        preconditions:
          - "acting Gardener owns the assignment"
          - "occupancy_status == ACTIVE"
          - "no ComplianceCase for this assignment in {OPEN, WARNED, ESCALATED}; else ERR_RENEWAL_BLOCKED_BY_COMPLIANCE (cross-entity, §1.7)"
        side_effects:
          - "occupancy_status = RENEWAL_PENDING"
      - from: "occupancy=RENEWAL_PENDING"
        to: "occupancy=RENEWED"
        trigger: "POST /assignments/{id}/confirm-renewal"
        actor: GardenManager
        preconditions:
          - "occupancy_status == RENEWAL_PENDING; else ERR_RENEWAL_NOT_PENDING"
          - "no ComplianceCase for this assignment in {OPEN, WARNED, ESCALATED}; else ERR_RENEWAL_BLOCKED_BY_COMPLIANCE"
        side_effects:
          - "occupancy_status = RENEWED (terminal on this row)"
          - "create a new Assignment for the next season on the same plot, renewed_from_assignment_id = this.id, occupancy ACTIVE / fee UNPAID"
          - "increment Gardener.tenure_seasons by 1"
      - from: "occupancy in {ACTIVE, RENEWAL_PENDING}"
        to: "occupancy=ENDED"
        trigger: "POST /assignments/{id}/settle"
        actor: GardenManager
        preconditions:
          - "occupancy_status in {ACTIVE, RENEWAL_PENDING}; else ERR_ASSIGNMENT_NOT_ACTIVE"
        side_effects:
          - "compute final_fee_cents (assignment_fee final variant); if fee_status == UNPAID then Gardener.balance_owed_cents += (final_fee_cents - provisional_fee_cents) to reconcile owed to final"
          - "Plot ASSIGNED->AVAILABLE (cascade; NO auto-offer on settle)"
      - from: "occupancy in {ACTIVE, RENEWAL_PENDING}"
        to: "occupancy=FORFEITED"
        trigger: "POST /assignments/{id}/forfeit  (or system cascade from compliance escalate)"
        actor: GardenManager | system
        preconditions:
          - "occupancy_status in {ACTIVE, RENEWAL_PENDING}; else ERR_ASSIGNMENT_NOT_ACTIVE"
        side_effects:
          - "compute final_fee_cents (assignment_fee final variant); if fee_status == UNPAID then Gardener.balance_owed_cents += (final_fee_cents - provisional_fee_cents) to reconcile owed to final"
          - "Plot ASSIGNED->AVAILABLE, then conditional AVAILABLE->RESERVED auto-offer to the top WAITLISTED Application (transitive cascade, §1.3 forfeiture_reassignment_cascade)"
      # --- fee axis (independent) ---
      - from: "fee=UNPAID"
        to: "fee=PAID"
        trigger: "POST /assignments/{id}/pay"
        actor: Treasurer
        preconditions:
          - "fee_status == UNPAID; else ERR_FEE_NOT_PAYABLE"
          - "amount_cents == the currently owed fee for this assignment (final_fee_cents if set, else provisional_fee_cents)"
        side_effects:
          - "fee_status = PAID; Gardener.balance_owed_cents -= amount_cents"
      - from: "fee=UNPAID"
        to: "fee=WAIVED"
        trigger: "POST /assignments/{id}/waive-fee"
        actor: Treasurer
        preconditions:
          - "fee_status == UNPAID; else ERR_FEE_NOT_PAYABLE"
        side_effects:
          - "fee_status = WAIVED; Gardener.balance_owed_cents -= (final_fee_cents if set else provisional_fee_cents)"
      - from: "fee=PAID"
        to: "fee=REFUNDED"
        trigger: "POST /assignments/{id}/refund"
        actor: Treasurer
        preconditions:
          - "fee_status == PAID; else ERR_FEE_NOT_REFUNDABLE"
          - "amount_cents == the amount previously paid on this assignment"
        side_effects:
          - "fee_status = REFUNDED; Gardener.balance_owed_cents += amount_cents (compensation, §1.3 fee_ledger_conservation)"

  # ---- ComplianceCase: branching compliance / abandonment ----
  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [CURED, ESCALATED]
    transitions:
      - from: OPEN
        to: WARNED
        trigger: "POST /compliance-cases/{id}/warn"
        actor: GardenManager
        preconditions:
          - "status == OPEN; else ERR_COMPLIANCE_NOT_OPEN"
        side_effects:
          - "set cure_deadline = clock + CURE_GRACE_DAYS (CURE_GRACE_DAYS = 14 days)"
      - from: WARNED
        to: CURED
        trigger: "POST /compliance-cases/{id}/resolve"
        actor: GardenManager
        preconditions:
          - "status == WARNED; else ERR_COMPLIANCE_NOT_WARNED"
          - "clock <= cure_deadline; else ERR_CURE_PERIOD_EXPIRED (boundary, §1.3)"
        side_effects:
          - "status = CURED (terminal); unblocks renewal for the assignment"
      - from: WARNED
        to: ESCALATED
        trigger: "POST /compliance-cases/{id}/escalate"
        actor: GardenManager
        preconditions:
          - "status == WARNED; else ERR_COMPLIANCE_NOT_WARNED"
          - "clock > cure_deadline; else ERR_CURE_PERIOD_ACTIVE (boundary, §1.3)"
        side_effects:
          - "status = ESCALATED; force the linked Assignment occupancy ACTIVE/RENEWAL_PENDING -> FORFEITED (transitive cascade, §1.3 abandonment_forfeiture_cascade)"

  # ---- ToolLoan: linear with late branch ----
  - entity: ToolLoan
    initial_state: CHECKED_OUT
    terminal_states: [RETURNED, RETURNED_LATE]
    transitions:
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /tool-loans/{id}/return when returned_at <= due_at"
        actor: Gardener
        preconditions:
          - "status == CHECKED_OUT; else ERR_LOAN_NOT_OUTSTANDING"
          - "returned_at <= due_at (on-time boundary, §1.3 tool_late_fine)"
        side_effects:
          - "set returned_at; late_fine_cents = 0"
      - from: CHECKED_OUT
        to: RETURNED_LATE
        trigger: "POST /tool-loans/{id}/return when returned_at > due_at"
        actor: Gardener
        preconditions:
          - "status == CHECKED_OUT; else ERR_LOAN_NOT_OUTSTANDING"
          - "returned_at > due_at"
        side_effects:
          - "set returned_at; late_fine_cents = tool_late_fine(returned_at, due_at)"

# ---------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on parent version only)
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: assign-stale-plot
    parent_entity: Plot
    write_endpoint: "POST /plots/{id}/assign"
    occ_field: "expected_plot_version"
    description: |
      A direct manager assignment against a Plot whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the plot has, in the meantime, been offered to and reserved by a
      waitlisted applicant (a legitimate supersede of the manager's earlier
      view), so the manager's assign request now carries a stale plot version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  # ----- Dual-variant #1 (Assignment domain), combinatorial mode (a) -----
  - name: assignment_fee
    trigger: "provisional variant on Assignment creation (accept/assign); final variant on settle/forfeit"
    algorithm: tiered_pricing
    formula: |
      # size-tiered constants selected by Assignment.size
      base       = BASE_FEE_CENTS[size]
      deposit    = WATER_DEPOSIT_CENTS[size]

      # PROVISIONAL (at creation): flat estimate = base + refundable water deposit
      provisional_fee_cents = base + deposit

      # FINAL (at settle/forfeit): actual usage reconciled, deposit credited back
      water_overage = water_overage_charge(assignment)          # see calc below (mode b)
      shortfall_h   = max(0, REQUIRED_WORK_HOURS[size] - logged_work_hours)
      work_penalty  = round_half_up(shortfall_h * WORK_SHORTFALL_PENALTY_CENTS_PER_HOUR)
      final_fee_cents = max(0, base + water_overage + work_penalty - deposit)
      # evaluation order is pinned: water_overage and work_penalty are fully
      # resolved BEFORE the outer max(0, ...) floor is applied.
    input_set: "the single Assignment; final variant also reads all WaterReading rows and the running logged_work_hours for that assignment"
    constants:
      BASE_FEE_CENTS: { SMALL: 3000, MEDIUM: 5000, LARGE: 8000 }
      WATER_DEPOSIT_CENTS: { SMALL: 500, MEDIUM: 1000, LARGE: 1500 }
      REQUIRED_WORK_HOURS: { SMALL: 8, MEDIUM: 12, LARGE: 16 }
      WORK_SHORTFALL_PENALTY_CENTS_PER_HOUR: 1500
    precision: "integer cents; round_half_up when multiplying fractional shortfall hours"
    variants:
      - name: provisional
        when: "Assignment just created (accept/assign); actual usage not yet known"
        difference: "flat base + deposit; ignores water usage and work hours entirely"
      - name: final
        when: "Assignment settled or forfeited"
        difference: "adds actual water overage and work-hour shortfall penalty, credits the deposit back; differs from provisional for identical size whenever usage != deposit assumptions"

  # ----- Combinatorial mode (b): rounding-order-sensitive -----
  - name: water_overage_charge
    trigger: "invoked by assignment_fee final variant at settle/forfeit"
    algorithm: aggregation
    formula: |
      # For each billing period p in [1, SEASON_PERIODS], read the WaterReading
      # for (assignment_id, p); a missing period contributes 0 gallons.
      total = 0
      for p in 1..SEASON_PERIODS:
        gallons   = reading(assignment_id, p).gallons_used or 0
        overage_g = max(0, gallons - WATER_FREE_GALLONS_PER_PERIOD[size])
        charge_p  = round_half_up(overage_g * WATER_RATE_CENTS_PER_GALLON)   # ROUND PER PERIOD
        total    += charge_p                                                 # THEN SUM
      water_overage_charge_cents = total
      # ROUNDING ORDER IS PINNED: round each period's charge to whole cents
      # first, then sum. (Summing raw overage gallons across periods and rounding
      # once at the end yields a different figure and is INCORRECT here.)
    input_set: "all WaterReading rows for the assignment, keyed by period_index 1..SEASON_PERIODS"
    constants:
      WATER_FREE_GALLONS_PER_PERIOD: { SMALL: 100, MEDIUM: 200, LARGE: 350 }
      WATER_RATE_CENTS_PER_GALLON: 3.5
      SEASON_PERIODS: 3
    precision: "whole cents per period, round_half_up, then integer sum"

  # ----- Dual-variant #2 (Gardener/Application domain): selector ranking -----
  - name: renewal_priority_score
    trigger: "as_submitted frozen on POST /applications; as_of_allocation recomputed whenever a plot is offered (POST /plots/{id}/offer or cascade auto-offer)"
    algorithm: weighted_scoring
    formula: |
      score = gardener.tenure_seasons * PRIORITY_TENURE_WEIGHT
            + PRIORITY_STANDING_BONUS[gardener.standing]
            - gardener.strike_count * PRIORITY_STRIKE_WEIGHT
      # Selector for an AVAILABLE plot being offered:
      #   candidate_set = Applications with status == WAITLISTED
      #                   AND garden_id == plot.garden_id
      #                   AND requested_size == plot.size
      #   rank          = score DESC (as_of_allocation, using each gardener's CURRENT fields)
      #   tie_break     = Application.created_at ASC   (never id)
      #   empty_set     = raise ERR_NO_ELIGIBLE_APPLICANT
    input_set: "as_submitted reads the gardener's fields at submission; as_of_allocation reads the gardener's fields at offer time (may have changed via renewal/compliance)"
    constants:
      PRIORITY_TENURE_WEIGHT: 10
      PRIORITY_STANDING_BONUS: { GOOD: 5, PROBATION: 0, SUSPENDED: -100 }
      PRIORITY_STRIKE_WEIGHT: 3
    precision: "integer score"
    variants:
      - name: as_submitted
        when: "frozen into Application.priority_score_at_submission at submission time"
        difference: "uses the gardener's tenure/standing/strikes as they were at submission"
      - name: as_of_allocation
        when: "recomputed live during plot offer selection"
        difference: "uses the gardener's CURRENT tenure/standing/strikes; diverges from the snapshot once the gardener renews (tenure++) or is struck (standing/strikes change)"

  # ----- Late-return fine (ToolLoan domain), boundary at due_at -----
  - name: tool_late_fine
    trigger: "on POST /tool-loans/{id}/return"
    algorithm: threshold
    formula: |
      if returned_at <= due_at:
        late_fine_cents = 0                      # on-time boundary: exactly due_at -> 0
      else:
        hours_late      = ceil((returned_at - due_at) in whole hours)
        late_fine_cents = hours_late * TOOL_LATE_FINE_CENTS_PER_HOUR
    input_set: "the single ToolLoan (returned_at vs due_at)"
    constants:
      TOOL_LATE_FINE_CENTS_PER_HOUR: 200
    precision: "integer cents; partial hours ceil up to the next whole hour"

  # ----- Named conserved-quantity invariants (Rule 9 anchors) -----
  - name: plot_pool_conservation
    trigger: "invariant checked across any Plot-status transition"
    algorithm: aggregation
    formula: |
      # For a fixed Garden at all times:
      Garden.total_plots == count(Plot where garden_id == Garden.id)
      Garden.total_plots == count(status==AVAILABLE) + count(status==RESERVED) + count(status==ASSIGNED)
      # A forfeit (ASSIGNED->AVAILABLE) immediately paired with its auto-offer
      # (AVAILABLE->RESERVED) leaves count(status==AVAILABLE) net unchanged.
    input_set: "all Plot rows for one garden"
    constants: {}
    precision: "exact integer counts"

  - name: fee_ledger_conservation
    trigger: "invariant checked across pay/refund and waive"
    algorithm: aggregation
    formula: |
      # Gardener.balance_owed_cents is a signed running ledger. A pay
      # (-amount) followed by a refund (+amount) of the SAME amount leaves
      # balance_owed_cents exactly equal to its pre-pay value (net zero drift).
    input_set: "one Gardener's balance_owed_cents across a pay/refund pair"
    constants: {}
    precision: "exact integer cents"

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint (per §1.7); and for Gardener-owned actions (accept, decline, request-renewal, work-logs, tool-loans, shed-bookings) X-User-ID == the resource's gardener_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Garden in path or body garden_id exists"
    error_id: ERR_GARDEN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a garden"
  - priority: 3
    category: existence
    check: "Plot in path or body plot reference exists"
    error_id: ERR_PLOT_NOT_FOUND
    http_status: 404
    applies_to: "plot endpoints"
  - priority: 3
    category: existence
    check: "Gardener referenced exists"
    error_id: ERR_GARDENER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing a gardener"
  - priority: 3
    category: existence
    check: "Application in path exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "application endpoints"
  - priority: 3
    category: existence
    check: "Assignment in path or body assignment_id exists"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "assignment/work-log/water-reading/compliance endpoints"
  - priority: 3
    category: existence
    check: "ComplianceCase in path exists"
    error_id: ERR_COMPLIANCE_CASE_NOT_FOUND
    http_status: 404
    applies_to: "compliance-case endpoints"
  - priority: 3
    category: existence
    check: "Tool referenced exists"
    error_id: ERR_TOOL_NOT_FOUND
    http_status: 404
    applies_to: "tool / tool-loan create endpoints"
  - priority: 3
    category: existence
    check: "ToolLoan in path exists"
    error_id: ERR_TOOL_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /tool-loans/{id}/return, GET /tool-loans/{id}"
  - priority: 4
    category: business_constraint
    check: "request body has all required fields with valid types/enums (size in {SMALL,MEDIUM,LARGE}, period_index in [1,3], hours>0, gallons_used>=0, due_at>checked_out_at, ends_at>starts_at); duplicate WaterReading (assignment_id, period_index) also rejected here"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Plot.status == AVAILABLE for offer/assign"
    error_id: ERR_PLOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /plots/{id}/offer, POST /plots/{id}/assign"
  - priority: 5
    category: state
    check: "Application.status == OFFERED for accept/decline"
    error_id: ERR_OFFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /applications/{id}/accept, POST /applications/{id}/decline"
  - priority: 5
    category: state
    check: "Assignment.occupancy_status in {ACTIVE, RENEWAL_PENDING} for settle/forfeit, == ACTIVE for request-renewal"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assignments/{id}/settle|forfeit|request-renewal"
  - priority: 5
    category: state
    check: "Assignment.occupancy_status == RENEWAL_PENDING for confirm-renewal"
    error_id: ERR_RENEWAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm-renewal"
  - priority: 5
    category: state
    check: "Assignment.fee_status == UNPAID for pay/waive-fee"
    error_id: ERR_FEE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /assignments/{id}/pay, POST /assignments/{id}/waive-fee"
  - priority: 5
    category: state
    check: "Assignment.fee_status == PAID for refund"
    error_id: ERR_FEE_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /assignments/{id}/refund"
  - priority: 5
    category: state
    check: "ComplianceCase.status == OPEN for warn"
    error_id: ERR_COMPLIANCE_NOT_OPEN
    http_status: 409
    applies_to: "POST /compliance-cases/{id}/warn"
  - priority: 5
    category: state
    check: "ComplianceCase.status == WARNED for resolve/escalate"
    error_id: ERR_COMPLIANCE_NOT_WARNED
    http_status: 409
    applies_to: "POST /compliance-cases/{id}/resolve|escalate"
  - priority: 5
    category: state
    check: "ToolLoan.status == CHECKED_OUT for return"
    error_id: ERR_LOAN_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /tool-loans/{id}/return"
  - priority: 6
    category: state
    check: "expected_plot_version == Plot.version (optimistic concurrency, §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /plots/{id}/assign"
  - priority: 7
    category: business_safety
    check: "no ComplianceCase for the assignment in {OPEN, WARNED, ESCALATED} when renewing"
    error_id: ERR_RENEWAL_BLOCKED_BY_COMPLIANCE
    http_status: 409
    applies_to: "POST /assignments/{id}/request-renewal, POST /assignments/{id}/confirm-renewal"
  - priority: 8
    category: business_referential
    check: "acting Gardener has at least one Assignment with occupancy_status == ACTIVE in the garden before checking out a tool or booking the shed"
    error_id: ERR_NOT_ACTIVE_GARDENER
    http_status: 403
    applies_to: "POST /tool-loans, POST /shed-bookings"
  - priority: 9
    category: business_constraint
    check: "Application.requested_size == Plot.size when offering/accepting"
    error_id: ERR_SIZE_MISMATCH
    http_status: 409
    applies_to: "POST /plots/{id}/offer, POST /applications/{id}/accept"
  - priority: 9
    category: business_constraint
    check: "at least one eligible WAITLISTED Application exists for (plot.garden_id, plot.size) when offering"
    error_id: ERR_NO_ELIGIBLE_APPLICANT
    http_status: 409
    applies_to: "POST /plots/{id}/offer"
  - priority: 9
    category: business_constraint
    check: "no existing Application for the same (gardener_id, garden_id, requested_size) in {WAITLISTED, OFFERED}"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /applications"
  - priority: 9
    category: business_constraint
    check: "Gardener.email is unique"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /gardeners"
  - priority: 9
    category: business_fiscal
    check: "pay amount_cents == currently owed fee; refund amount_cents == amount previously paid"
    error_id: ERR_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /assignments/{id}/pay, POST /assignments/{id}/refund"
  - priority: 10
    category: business_temporal
    check: "clock <= Application.offer_expires_at when accepting"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/accept"
  - priority: 10
    category: business_temporal
    check: "clock <= cure_deadline when resolving"
    error_id: ERR_CURE_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /compliance-cases/{id}/resolve"
  - priority: 10
    category: business_temporal
    check: "clock > cure_deadline when escalating"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /compliance-cases/{id}/escalate"
  - priority: 10
    category: business_temporal
    check: "no non-terminal Assignment on the plot whose [season_start, season_end) overlaps the new season; adjacency (equal boundary) is allowed (half-open, no buffer)"
    error_id: ERR_PLOT_SEASON_CONFLICT
    http_status: 409
    applies_to: "POST /plots/{id}/assign"
  - priority: 10
    category: business_temporal
    check: "new loan [checked_out_at, due_at] must not intersect any non-returned ToolLoan for the tool whose occupied window is [checked_out_at, effective_end + cleaning_buffer_hours) where effective_end = returned_at or due_at (buffer semantics)"
    error_id: ERR_TOOL_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /tool-loans"
  - priority: 10
    category: business_temporal
    check: "new shed booking [starts_at, ends_at) must not intersect any existing ShedBooking for the garden; touching boundaries are allowed (half-open, no buffer)"
    error_id: ERR_SHED_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /shed-bookings"
  - priority: 11
    category: business_fiscal
    check: "Gardener.balance_owed_cents == 0 before a renewal is requested or confirmed"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /assignments/{id}/request-renewal, POST /assignments/{id}/confirm-renewal"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [GardenManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock used by all deadline/expiry/window rules"]

  # ---- Garden ----
  - method: POST
    path: "/gardens"
    description: "Create a garden with its season window"
    roles: [GardenManager]
    code: 201
    input: [name, season_label, season_start, season_end, "offer_window_days?"]
    output: Garden
    side_effects: ["total_plots=0, available_plot_count=0"]
  - method: GET
    path: "/gardens/{id}"
    description: "Read a garden"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: Garden
    side_effects: []
  - method: GET
    path: "/gardens/{id}/tools"
    description: "List tools in the garden's shed (reverse-reachability for Tool.garden_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: Tool[]
    side_effects: []
  - method: GET
    path: "/gardens/{id}/shed-bookings"
    description: "List shed bookings for the garden (reverse-reachability for ShedBooking.garden_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["limit?", "offset?"]
    output: ShedBooking[]
    side_effects: []
  - method: POST
    path: "/gardens/{id}/expire-offers"
    description: "System sweep: expire every OFFERED application in the garden whose offer_expires_at < clock, releasing its plot"
    roles: [GardenManager]
    code: 200
    input: []
    output: Application[]
    side_effects: ["for each expired: Application OFFERED->EXPIRED; Plot RESERVED->AVAILABLE; clear offered_plot_id/offer_expires_at; Plot.version++"]

  # ---- Plot ----
  - method: POST
    path: "/plots"
    description: "Create a plot in a garden"
    roles: [GardenManager]
    code: 201
    input: [garden_id, label, size]
    output: Plot
    side_effects: ["Garden.total_plots++, Garden.available_plot_count++"]
  - method: GET
    path: "/plots/{id}"
    description: "Read a plot"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: Plot
    side_effects: []
  - method: GET
    path: "/plots"
    description: "List/filter plots (reverse-reachability for Plot.garden_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["garden_id?", "status?", "size?", "limit?", "offset?"]
    output: Plot[]
    side_effects: []
  - method: POST
    path: "/plots/{id}/offer"
    description: "Offer an AVAILABLE plot to the top-ranked eligible WAITLISTED applicant (server selects via renewal_priority_score as_of_allocation, tie-break created_at ASC)"
    roles: [GardenManager]
    code: 200
    input: []
    output: Application
    side_effects: ["Plot AVAILABLE->RESERVED (Plot.version++); selected Application WAITLISTED->OFFERED, offered_plot_id/offer_expires_at set"]
  - method: POST
    path: "/plots/{id}/assign"
    description: "Directly assign an AVAILABLE plot to a gardener (manager supersede), guarded by OCC on Plot.version"
    roles: [GardenManager]
    code: 201
    input: [gardener_id, expected_plot_version]
    output: Assignment
    side_effects: ["create Assignment (ACTIVE/UNPAID), compute provisional_fee_cents; Gardener.balance_owed_cents += provisional_fee_cents; Plot AVAILABLE->ASSIGNED, current_assignment_id set; increments Plot.version by 1"]

  # ---- Gardener ----
  - method: POST
    path: "/gardeners"
    description: "Register a gardener"
    roles: [GardenManager]
    code: 201
    input: [full_name, email]
    output: Gardener
    side_effects: ["tenure_seasons=0, standing=GOOD, strike_count=0, balance_owed_cents=0"]
  - method: GET
    path: "/gardeners/{id}"
    description: "Read a gardener"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: Gardener
    side_effects: []
  - method: GET
    path: "/gardeners/{id}/shed-bookings"
    description: "List a gardener's shed bookings (reverse-reachability for ShedBooking.gardener_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["limit?", "offset?"]
    output: ShedBooking[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "Submit a waitlist application; auto-transitions SUBMITTED->WAITLISTED and freezes priority_score_at_submission"
    roles: [Gardener]
    code: 201
    input: [gardener_id, garden_id, requested_size]
    output: Application
    side_effects: ["status WAITLISTED; compute priority_score_at_submission (renewal_priority_score as_submitted)"]
  - method: GET
    path: "/applications/{id}"
    description: "Read an application"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List/filter applications (reverse-reachability for Application.gardener_id and garden_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["gardener_id?", "garden_id?", "status?", "requested_size?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/accept"
    description: "Accept an offer; creates the assignment"
    roles: [Gardener]
    code: 201
    input: []
    output: Assignment
    side_effects: ["Application OFFERED->ACCEPTED; Plot RESERVED->ASSIGNED (Plot.version++); create Assignment (application_id set), compute provisional_fee_cents; Gardener.balance_owed_cents += provisional_fee_cents"]
  - method: POST
    path: "/applications/{id}/decline"
    description: "Decline an offer; releases the plot"
    roles: [Gardener]
    code: 200
    input: []
    output: Application
    side_effects: ["Application OFFERED->DECLINED; Plot RESERVED->AVAILABLE (Plot.version++); clear offered_plot_id/offer_expires_at"]

  # ---- Assignment ----
  - method: GET
    path: "/assignments/{id}"
    description: "Read an assignment"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List/filter assignments (reverse-reachability for plot_id, gardener_id, garden_id, application_id, renewed_from_assignment_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["plot_id?", "gardener_id?", "garden_id?", "application_id?", "renewed_from_assignment_id?", "occupancy_status?", "fee_status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/request-renewal"
    description: "Leaseholder requests renewal for the next season"
    roles: [Gardener]
    code: 200
    input: []
    output: Assignment
    side_effects: ["occupancy ACTIVE->RENEWAL_PENDING"]
  - method: POST
    path: "/assignments/{id}/confirm-renewal"
    description: "Manager confirms renewal; mints the next-season assignment and credits tenure"
    roles: [GardenManager]
    code: 201
    input: []
    output: Assignment
    side_effects: ["occupancy RENEWAL_PENDING->RENEWED; create next-season Assignment (renewed_from_assignment_id set, ACTIVE/UNPAID); Gardener.tenure_seasons++"]
  - method: POST
    path: "/assignments/{id}/settle"
    description: "Close an assignment at season end; computes the final fee and frees the plot (no auto-offer)"
    roles: [GardenManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["occupancy {ACTIVE,RENEWAL_PENDING}->ENDED; compute final_fee_cents; if fee_status==UNPAID then Gardener.balance_owed_cents += (final_fee_cents - provisional_fee_cents); Plot ASSIGNED->AVAILABLE (Plot.version++)"]
  - method: POST
    path: "/assignments/{id}/forfeit"
    description: "Forfeit an assignment; frees the plot and immediately auto-offers it to the waitlist"
    roles: [GardenManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["occupancy {ACTIVE,RENEWAL_PENDING}->FORFEITED; compute final_fee_cents; if fee_status==UNPAID then Gardener.balance_owed_cents += (final_fee_cents - provisional_fee_cents); Plot ASSIGNED->AVAILABLE then conditional AVAILABLE->RESERVED auto-offer (transitive cascade)"]
  - method: POST
    path: "/assignments/{id}/pay"
    description: "Treasurer records payment of the assignment fee"
    roles: [Treasurer]
    code: 200
    input: [amount_cents]
    output: Assignment
    side_effects: ["fee UNPAID->PAID; Gardener.balance_owed_cents -= amount_cents"]
  - method: POST
    path: "/assignments/{id}/waive-fee"
    description: "Treasurer waives the assignment fee"
    roles: [Treasurer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["fee UNPAID->WAIVED; Gardener.balance_owed_cents -= outstanding fee"]
  - method: POST
    path: "/assignments/{id}/refund"
    description: "Treasurer refunds a previously paid fee (compensation)"
    roles: [Treasurer]
    code: 200
    input: [amount_cents]
    output: Assignment
    side_effects: ["fee PAID->REFUNDED; Gardener.balance_owed_cents += amount_cents"]

  # ---- WorkLog ----
  - method: POST
    path: "/work-logs"
    description: "Log work hours against an assignment"
    roles: [Gardener]
    code: 201
    input: [assignment_id, hours, logged_on, "note?"]
    output: WorkLog
    side_effects: ["Assignment.logged_work_hours += hours"]
  - method: GET
    path: "/assignments/{id}/work-logs"
    description: "List work logs for an assignment (reverse-reachability for WorkLog.assignment_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkLog[]
    side_effects: []

  # ---- WaterReading ----
  - method: POST
    path: "/water-readings"
    description: "Record a per-period water meter reading for an assignment"
    roles: [Gardener]
    code: 201
    input: [assignment_id, period_index, gallons_used, recorded_on]
    output: WaterReading
    side_effects: []
  - method: GET
    path: "/assignments/{id}/water-readings"
    description: "List water readings for an assignment (reverse-reachability for WaterReading.assignment_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["limit?", "offset?"]
    output: WaterReading[]
    side_effects: []

  # ---- ComplianceCase ----
  - method: POST
    path: "/compliance-cases"
    description: "Open a compliance/abandonment case against an assignment; records a strike"
    roles: [GardenManager]
    code: 201
    input: [assignment_id, violation_type]
    output: ComplianceCase
    side_effects: ["status OPEN, opened_on=clock, gardener_id denormalized; Gardener.strike_count++; recompute Gardener.standing (0->GOOD, 1..2->PROBATION, >=3->SUSPENDED)"]
  - method: GET
    path: "/compliance-cases/{id}"
    description: "Read a compliance case"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: []
  - method: GET
    path: "/compliance-cases"
    description: "List/filter compliance cases (reverse-reachability for assignment_id and gardener_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["assignment_id?", "gardener_id?", "status?", "limit?", "offset?"]
    output: ComplianceCase[]
    side_effects: []
  - method: POST
    path: "/compliance-cases/{id}/warn"
    description: "Issue a warning and start the cure clock"
    roles: [GardenManager]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status OPEN->WARNED; cure_deadline = clock + CURE_GRACE_DAYS (CURE_GRACE_DAYS = 14 days)"]
  - method: POST
    path: "/compliance-cases/{id}/resolve"
    description: "Mark the violation cured within the grace window"
    roles: [GardenManager]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status WARNED->CURED"]
  - method: POST
    path: "/compliance-cases/{id}/escalate"
    description: "Escalate an uncured violation past its deadline; forfeits the assignment (cascade)"
    roles: [GardenManager]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: ["status WARNED->ESCALATED; force linked Assignment ->FORFEITED (which frees the Plot and conditionally auto-offers it)"]

  # ---- Tool ----
  - method: POST
    path: "/tools"
    description: "Add a shared tool to a garden's shed"
    roles: [GardenManager]
    code: 201
    input: [garden_id, name, category, "cleaning_buffer_hours?"]
    output: Tool
    side_effects: []

  # ---- ToolLoan ----
  - method: POST
    path: "/tool-loans"
    description: "Check out a shared tool over a time window (buffer-guarded overlap)"
    roles: [Gardener]
    code: 201
    input: [tool_id, gardener_id, checked_out_at, due_at]
    output: ToolLoan
    side_effects: ["status CHECKED_OUT"]
  - method: GET
    path: "/tool-loans/{id}"
    description: "Read a tool loan"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: []
    output: ToolLoan
    side_effects: []
  - method: GET
    path: "/tool-loans"
    description: "List/filter tool loans (reverse-reachability for tool_id and gardener_id)"
    roles: [GardenManager, Gardener, Treasurer]
    code: 200
    input: ["tool_id?", "gardener_id?", "status?", "limit?", "offset?"]
    output: ToolLoan[]
    side_effects: []
  - method: POST
    path: "/tool-loans/{id}/return"
    description: "Return a checked-out tool; assesses any late fine"
    roles: [Gardener]
    code: 200
    input: [returned_at]
    output: ToolLoan
    side_effects: ["set returned_at; status RETURNED or RETURNED_LATE; compute late_fine_cents"]

  # ---- ShedBooking ----
  - method: POST
    path: "/shed-bookings"
    description: "Book the shared shed over a time window (adjacency-allowed, no buffer)"
    roles: [Gardener]
    code: 201
    input: [garden_id, gardener_id, starts_at, ends_at, purpose]
    output: ShedBooking
    side_effects: []

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint, or Gardener acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing/invalid body field, bad enum, out-of-range value, or duplicate WaterReading period"
  - id: ERR_GARDEN_NOT_FOUND
    http: 404
    condition: "referenced Garden does not exist"
  - id: ERR_PLOT_NOT_FOUND
    http: 404
    condition: "referenced Plot does not exist"
  - id: ERR_GARDENER_NOT_FOUND
    http: 404
    condition: "referenced Gardener does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "referenced Application does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced Assignment does not exist"
  - id: ERR_COMPLIANCE_CASE_NOT_FOUND
    http: 404
    condition: "referenced ComplianceCase does not exist"
  - id: ERR_TOOL_NOT_FOUND
    http: 404
    condition: "referenced Tool does not exist"
  - id: ERR_TOOL_LOAN_NOT_FOUND
    http: 404
    condition: "referenced ToolLoan does not exist"
  - id: ERR_PLOT_NOT_AVAILABLE
    http: 409
    condition: "offer/assign attempted on a Plot whose status != AVAILABLE"
  - id: ERR_OFFER_NOT_PENDING
    http: 409
    condition: "accept/decline attempted on an Application whose status != OFFERED"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "settle/forfeit/request-renewal on an assignment not in the required occupancy state"
  - id: ERR_RENEWAL_NOT_PENDING
    http: 409
    condition: "confirm-renewal when occupancy_status != RENEWAL_PENDING"
  - id: ERR_FEE_NOT_PAYABLE
    http: 409
    condition: "pay/waive-fee when fee_status != UNPAID"
  - id: ERR_FEE_NOT_REFUNDABLE
    http: 409
    condition: "refund when fee_status != PAID"
  - id: ERR_COMPLIANCE_NOT_OPEN
    http: 409
    condition: "warn when ComplianceCase.status != OPEN"
  - id: ERR_COMPLIANCE_NOT_WARNED
    http: 409
    condition: "resolve/escalate when ComplianceCase.status != WARNED"
  - id: ERR_LOAN_NOT_OUTSTANDING
    http: 409
    condition: "return when ToolLoan.status != CHECKED_OUT"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_plot_version != Plot.version on assign (OCC)"
  - id: ERR_RENEWAL_BLOCKED_BY_COMPLIANCE
    http: 409
    condition: "renewal requested/confirmed while an unresolved ComplianceCase (OPEN/WARNED/ESCALATED) exists for the assignment"
  - id: ERR_NOT_ACTIVE_GARDENER
    http: 403
    condition: "tool checkout or shed booking by a gardener with no ACTIVE assignment in the garden"
  - id: ERR_SIZE_MISMATCH
    http: 409
    condition: "Application.requested_size != Plot.size on offer/accept"
  - id: ERR_NO_ELIGIBLE_APPLICANT
    http: 409
    condition: "offer attempted when the waitlist has no eligible WAITLISTED application for the plot size"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "gardener already has a WAITLISTED/OFFERED application for the same garden and size"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "gardener email already registered"
  - id: ERR_AMOUNT_MISMATCH
    http: 422
    condition: "pay amount != owed fee, or refund amount != amount previously paid"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "accept attempted after offer_expires_at"
  - id: ERR_CURE_PERIOD_EXPIRED
    http: 409
    condition: "resolve attempted after cure_deadline"
  - id: ERR_CURE_PERIOD_ACTIVE
    http: 409
    condition: "escalate attempted at or before cure_deadline"
  - id: ERR_PLOT_SEASON_CONFLICT
    http: 409
    condition: "assign would create a season interval overlapping an existing non-terminal assignment on the plot"
  - id: ERR_TOOL_TIME_CONFLICT
    http: 409
    condition: "tool loan window overlaps an existing loan's occupied window including cleaning buffer"
  - id: ERR_SHED_TIME_CONFLICT
    http: 409
    condition: "shed booking window overlaps an existing booking for the garden"
  - id: ERR_OUTSTANDING_BALANCE
    http: 402
    condition: "renewal requested/confirmed while Gardener.balance_owed_cents != 0"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Gardener
    description: "A community member who applies for plots, accepts/declines offers, logs work and water, borrows tools, books the shed, and requests renewals"
    identity: "entity_backed:Gardener"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/accept"
      - "POST /applications/{id}/decline"
      - "POST /assignments/{id}/request-renewal"
      - "POST /work-logs"
      - "POST /water-readings"
      - "POST /tool-loans"
      - "POST /tool-loans/{id}/return"
      - "POST /shed-bookings"
    shared_operations:
      - "GET reads on gardens, plots, gardeners, applications, assignments, work-logs, water-readings, compliance-cases, tools, tool-loans, shed-bookings"
  - name: GardenManager
    description: "Site operator who manages inventory, runs allocation/offers, assigns plots, confirms renewals, settles/forfeits assignments, and drives compliance"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /gardens"
      - "POST /plots"
      - "POST /plots/{id}/offer"
      - "POST /plots/{id}/assign"
      - "POST /gardens/{id}/expire-offers"
      - "POST /gardeners"
      - "POST /assignments/{id}/confirm-renewal"
      - "POST /assignments/{id}/settle"
      - "POST /assignments/{id}/forfeit"
      - "POST /compliance-cases"
      - "POST /compliance-cases/{id}/warn"
      - "POST /compliance-cases/{id}/resolve"
      - "POST /compliance-cases/{id}/escalate"
      - "POST /tools"
    shared_operations:
      - "all GET reads"
  - name: Treasurer
    description: "Finance role that settles money only; segregation of duties keeps fee payment/waiver/refund out of the GardenManager's hands"
    identity: "opaque"
    exclusive_operations:
      - "POST /assignments/{id}/pay"
      - "POST /assignments/{id}/waive-fee"
      - "POST /assignments/{id}/refund"
    shared_operations:
      - "all GET reads"
