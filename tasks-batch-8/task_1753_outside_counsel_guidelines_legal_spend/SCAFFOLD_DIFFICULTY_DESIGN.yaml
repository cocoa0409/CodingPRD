  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pay
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OPEN_APPEALS]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: paying a VOID invoice
          that also has an open appeal would violate both priority-4 (state)
          and priority-9 (fiscal guard ERR_OPEN_APPEALS); priority-4's
          ERR_INVALID_STATE MUST be returned.
        test_recipe:
          setup:
            - "Invoice in REJECTED state with an open appeal; firm voids the invoice so it reaches VOID while appeal remains open (state now terminal, appeal still SUBMITTED)"
            - "Note: in normal flow void is only allowed from REJECTED; we engineer a REJECTED invoice with a pending appeal, then void it"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "PrioDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "PrioFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
