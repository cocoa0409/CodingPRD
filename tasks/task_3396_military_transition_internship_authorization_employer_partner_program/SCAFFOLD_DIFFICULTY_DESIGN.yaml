          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2027-01-20", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}" }
          assert:
            - "rejected with ERR_APPLICATION_NOT_APPROVED (409), NOT ERR_DURATION_EXCEEDS_POLICY — even though duration 111 days > headroom (2027-01-15 - 2026-10-01) - 7 = 99 would also fail"
            - "no match persisted: GET /skillbridge/internship-matches?internship_application_id=${app} returns an empty list and EmployerOpening.${op}.version stays 1"

