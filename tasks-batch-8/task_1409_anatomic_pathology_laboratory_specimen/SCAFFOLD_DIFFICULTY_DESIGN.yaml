            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-501", patient_dob: "1955-02-14", specimen_type: "BIOPSY", anatomical_site: "Rectum", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "single fragment" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 96.0 }, as: Histotech }
            - { call: "GET /pathology/blocks/${b1}", as: LabAdmin }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech, captures: { err: $.data.error_id } }
          assert:
            - "Slide.${s1}.status == SECTIONED"
            - "Block.${b1}.tissue_remaining_pct == 4.0 and Block.${b1}.status == DEPLETED (4.0 < 5.0)"
            - "follow-up slide order on the depleted block fails: err == ERR_BLOCK_DEPLETED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: signout_state_error_beats_critical_discrepancy_safety_error
        grounds:
          - validations[priority=16]
          - validations[priority=32]
          - errors[ERR_CASE_NOT_PENDING_SIGNOUT]
          - errors[ERR_UNRESOLVED_CRITICAL_DISCREPANCY]
        distinguishing_aspect: "Category pair (state vs business_safety): a sign-out attempted while the case is in WORKUP with an OPEN LEVEL_3 discrepancy violates both rules, and the state error ERR_CASE_NOT_PENDING_SIGNOUT (priority 16) wins over the safety error ERR_UNRESOLVED_CRITICAL_DISCREPANCY (priority 32)."
