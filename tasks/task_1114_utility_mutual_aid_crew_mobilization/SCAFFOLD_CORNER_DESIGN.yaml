  # ==========================================================================
  # Section: cross-cutting complexity layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: layer_occ_stale_supersede_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[schedule-publish-stale-supersede]"
          - "errors[ERR_STALE_SCHEDULE_VERSION]"
        distinguishing_aspect: "OCC on the superseded schedule's version: S1 published (v2); S2 published superseding S1 (S1 -> v3, S2 -> v2); publishing S3 against S2 while presenting S2's pre-publish version (${s2_v} - 1) is rejected 412 — deterministic with strictly sequential requests."
        test_recipe:
          setup: ["Event ACTIVE; S1 and S2 both processed; S2 is the current PUBLISHED schedule at version 2"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${s1_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/billing-rate-schedules/${s1_id}", payload: {}, as: ProgramAdmin, captures: { s1_v: "$.data.version" } }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12100 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }], supersedes_schedule_id: "${s1_id}" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s2_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${s2_id}/publish", payload: { expected_superseded_schedule_version: "${s1_v}" }, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/billing-rate-schedules/${s2_id}", payload: {}, as: ProgramAdmin, captures: { s2_v: "$.data.version" } }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12200 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }], supersedes_schedule_id: "${s2_id}" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s3_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/billing-rate-schedules/${s3_id}/publish", payload: { expected_superseded_schedule_version: "${s2_v} - 1" }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_SCHEDULE_VERSION (http 412)"
            - "BillingRateSchedule.${s3_id}.status == DRAFT (unchanged)"
            - "BillingRateSchedule.${s2_id}.status == PUBLISHED and version == ${s2_v} (unchanged)"

      - name: layer_cascade_suspend_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Crew.CLEARED_TO_WORK_to_SAFETY_HOLD"
        excluded_because:
          difficulty_instance: safety_suspend_depth3_cascade
          rationale: "The depth-3 cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: layer_cascade_return_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Crew.DEMOBILIZING_to_RETURNED"
        excluded_because:
          difficulty_instance: complete_return_depth2_releases_request
          rationale: "The depth-2 return cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: layer_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.invoice_totals"
          - "calculations.per_diem_claim_amount"
          - "calculations.aar_cost_variance"
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_totals
          rationale: "All three dual-variant domains are asserted by the three §1.8 rule-1 instances, starting with the named one."

      - name: layer_version_pinning_covered
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.TimeSheet.fields.certified_schedule_id"
        excluded_because:
          difficulty_instance: invoice_submit_rejects_superseded_schedule
          rationale: "Stale-pin detection and recertify re-pinning are asserted in the named §1.8 instance."

