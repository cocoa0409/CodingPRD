                weight_kg: 36000
              as: Consignor
              as_user_id: ${consignor_id}
              captures: { lot1_id: "$.data.id" }
            - call: POST /refurbishment-orders
              payload: { lot_id: "${lot1_id}", scope_note: "hydraulic pump overhaul", estimated_cost_cents: 400000 }
              as: IntakeInspector
              as_user_id: inspector-1
              captures: { order1_id: "$.data.id" }
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: START }
              as: IntakeInspector
              as_user_id: inspector-1
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: SUBMIT_QA, actual_cost_cents: 400000 }
              as: IntakeInspector
              as_user_id: inspector-1
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: QA_REWORK, qa_note: "lap one" }
              as: IntakeInspector
              as_user_id: inspector-2
            - call: POST /refurbishment-orders/${order1_id}/transition
              payload: { action: START }
              as: IntakeInspector
              as_user_id: inspector-1
            - call: POST /refurbishment-orders/${order1_id}/transition
