  - rule_id: cross_entity_state_dependency
    instances:

      - name: lock_of_a_valid_route_depends_on_driver_qualification_state
        grounds:
          - validations.priority_13
          - errors.ERR_DRIVER_NOT_QUALIFIED
          - state_machines.Driver.QUALIFIED_to_SUSPENDED
          - state_machines.Driver.SUSPENDED_to_QUALIFIED
          - state_machines.Dispatch.STACKED_to_LOCKED
        distinguishing_aspect: |
          The (Dispatch, Driver) pair: the dispatch is a perfectly valid STACKED
          route with one READY, fee-disclosed stop, a resolvable cost model and no
          window or hot-bag pressure. Nothing about the Dispatch changes between
          the rejected lock and the accepted one - only the Driver's
          qualification_status moves SUSPENDED -> QUALIFIED. Suspension
          deliberately does NOT recall existing dispatches, so the block must be
          evaluated at lock time from the parent's live state rather than
          snapshotted when the dispatch was drafted.
