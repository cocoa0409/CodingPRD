            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://ab/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "shingle", uri: "s3://ab/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
