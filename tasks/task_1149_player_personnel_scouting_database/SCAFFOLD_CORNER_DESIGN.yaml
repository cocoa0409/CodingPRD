              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RANK_OUT_OF_BOUNDS, HTTP 422"

      - name: video_tag_end_before_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "entities.VideoTag"]
        distinguishing_aspect: "end_sec <= start_sec violates the schema rule end_sec > start_sec -> ERR_VALIDATION."
