          setup: "Hall CX72 in FIT_OUT with PDU-A1 (BW-A1, BW-A2) and PDU-B1 (BW-B1), all three busways ENERGIZED, one zone, one PLANNED rack R-1-1 (design 15.00 kW, required_feed_count 2) holding one A-side feed on BW-A1."
