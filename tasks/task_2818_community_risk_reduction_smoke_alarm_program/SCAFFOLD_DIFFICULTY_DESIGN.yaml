            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "2 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh2_id: $.data.id, hh2_v0: $.data.version }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
