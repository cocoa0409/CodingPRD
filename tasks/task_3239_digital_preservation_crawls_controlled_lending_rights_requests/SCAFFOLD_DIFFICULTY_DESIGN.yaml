        grounds:
          - state_machines.Loan.ACTIVE_to_EXPIRED
          - calculations.renewal_window
          - errors.ERR_LOAN_NOT_RENEWABLE
        distinguishing_aspect: |
          Interval semantics: half-open expiry on the loan window — the loan
          occupies [checked_out_at, due_at) and a renewal at current_clock ==
          due_at exactly is rejected (ERR_LOAN_NOT_RENEWABLE) because
          current_clock < due_at is strict; one millisecond before due_at the
          same renewal succeeds. Resource: the loan's possession window.
        test_recipe:
          setup:
            - "Work W10 with two LENDABLE items I10a/I10b; patron P12 with ACTIVE STANDARD loans LN10a (checked out 2026-09-01T00:00:00Z, due 2026-09-15T00:00:00Z) and LN10b (checked out 2026-09-01T00:00:00.001Z... simplified: second loan on I10b created at the same clock so due_at is identical)."
