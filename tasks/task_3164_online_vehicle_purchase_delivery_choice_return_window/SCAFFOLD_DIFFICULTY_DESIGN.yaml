  - name: order_cancellation_cascade_depth3
    grounds:
    - state_machines.PurchaseOrder.STRUCTURED_to_CANCELLED
    - state_machines.Vehicle.RESERVED_to_LISTED
    - state_machines.FinancingPrequalification.LOCKED_to_PREQUALIFIED
    distinguishing_aspect: 'Depth-3 chain from a different trigger: POST order cancel from

      STRUCTURED -> PurchaseOrder CANCELLED -> Vehicle RESERVED -> LISTED ->

      FinancingPrequalification LOCKED -> PREQUALIFIED with locked_order_id

      cleared -> the linked TitleRegistration PENDING row deleted; distinct

      origin transition from the return-acceptance cascade.

