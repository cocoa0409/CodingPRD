# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# Empty-DB start every instance; all clocks default to 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: job_charge_estimate_vs_final_diverge
        grounds:
          - calculations.job_charge
          - entities.Job.fields.estimated_total_cents
          - entities.Job.fields.final_total_cents
          - state_machines.Job.QUOTED_to_BOOKED
          - state_machines.Job.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Same job_charge formula on the Job cost domain yields 49315 from estimated_hours=2.5 (estimate variant) but 56215 from actual_hours=3.0 (final variant); the two variants diverge on the identical Job."
        test_recipe:
          setup:
            - "RateCard MOVE (base 6000/hr, min_billable 2.0, crew_surcharge 0.10, surge 1.25, truck_fee 8000), BASIC policy, one Customer."
            - "Job J1: MOVE, crew_size 2, estimated_hours 2.5, truck_required true, weekday window 2026-03-11T09:00Z, one HEAVY_ITEM add-on unit 4500 x1; quoted then booked (estimated_total_cents=49315)."
            - "Helper HA APPROVED, assigned to J1, checked in, job started, checked out, then completed with actual_hours 3.0."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HA", email: "ha@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { ha: "$.data.id" } }
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 2, estimated_hours: 2.5, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z", truck_required: true }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/add-ons", payload: { addon_type: "HEAVY_ITEM", quantity: 1, unit_fee_cents: 4500 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${job}", helper_id: "${ha}", role: "LEAD" }, as: Dispatcher, captures: { asg: "$.data.id" } }
            - { call: "POST /assignments/${asg}/check-in", payload: {}, as: Helper, as_user_id: "${ha}" }
            - { call: "POST /jobs/${job}/start", payload: {}, as: Dispatcher }
            - { call: "POST /assignments/${asg}/check-out", payload: {}, as: Helper, as_user_id: "${ha}" }
          trigger:
            - { call: "POST /jobs/${job}/complete", payload: { actual_hours: 3.0 }, as: Dispatcher, captures: { final: "$.data.final_total_cents" } }
          assert:
            - "Job.${job}.estimated_total_cents == 49315"
            - "Job.${job}.final_total_cents == 56215"
            - "Job.${job}.estimated_total_cents != Job.${job}.final_total_cents"

      - name: claim_settlement_basic_vs_full_diverge
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.insurance_covered_cents
          - entities.InsurancePolicy.fields.tier
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Identical claimed_amount 150000 settles to 140000 under a BASIC policy (deductible path) but 135000 under a FULL policy (percentage path); the divergence is on the Claim/Insurance domain, distinct from Job cost."
        test_recipe:
          setup:
            - "Two Jobs booked, one under a BASIC policy (cap 200000, deductible 10000) and one under a FULL policy (cap 1000000, coverage_pct 0.9)."
            - "A Claim for 150000 filed and moved to UNDER_REVIEW on each job."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { basic: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-FULL", tier: "FULL", coverage_cap_cents: 1000000, deductible_cents: 0, coverage_pct: 0.9 }, as: Admin, captures: { full: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${basic}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jb: "$.data.id" } }
            - { call: "POST /jobs/${jb}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { qb: "$.data.id" } }
            - { call: "GET /jobs/${jb}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jbv: "$.data.version" } }
            - { call: "POST /jobs/${jb}/book", payload: { quote_id: "${qb}", expected_job_version: "${jbv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /claims", payload: { job_id: "${jb}", damage_description: "scratch", claimed_amount_cents: 150000 }, as: Customer, as_user_id: "${cust}", captures: { cb: "$.data.id" } }
            - { call: "POST /claims/${cb}/review", payload: {}, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${full}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jf: "$.data.id" } }
            - { call: "POST /jobs/${jf}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { qf: "$.data.id" } }
            - { call: "GET /jobs/${jf}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jfv: "$.data.version" } }
            - { call: "POST /jobs/${jf}/book", payload: { quote_id: "${qf}", expected_job_version: "${jfv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /claims", payload: { job_id: "${jf}", damage_description: "scratch", claimed_amount_cents: 150000 }, as: Customer, as_user_id: "${cust}", captures: { cf: "$.data.id" } }
            - { call: "POST /claims/${cf}/review", payload: {}, as: Admin }
          trigger:
            - { call: "POST /claims/${cb}/approve", payload: {}, as: Admin }
            - { call: "POST /claims/${cf}/approve", payload: {}, as: Admin }
          assert:
            - "Claim.${cb}.insurance_covered_cents == 140000"
            - "Claim.${cf}.insurance_covered_cents == 135000"
            - "Claim.${cb}.insurance_covered_cents != Claim.${cf}.insurance_covered_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_total_nonlinear_weekend_crew_surcharge
        grounds:
          - calculations.job_charge
          - entities.Quote.fields.base_labor_cents
          - entities.Quote.fields.surge_multiplier
          - entities.Quote.fields.total_cents
          - state_machines.Job.DRAFT_to_QUOTED
        distinguishing_aspect: "Mode (a): crew_size 3 triggers the crew_surcharge branch (72000->79200) and a Saturday window triggers the 1.25 surge branch (79200->99000), composing to total 113850 — three interacting inputs, not a single linear rate."
        test_recipe:
          setup:
            - "RateCard MOVE, one Customer; Job crew_size 3, estimated_hours 4.0, no truck, no add-ons, weekend (Saturday) window 2026-03-14T09:00Z."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 3, estimated_hours: 4.0, window_start: "2026-03-14T09:00:00Z", window_end: "2026-03-14T13:00:00Z", truck_required: false }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
          trigger:
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
          assert:
            - "Quote.${q}.base_labor_cents == 79200"
            - "Quote.${q}.surge_multiplier == 1.25"
            - "Quote.${q}.subtotal_cents == 79200"
            - "Quote.${q}.service_fee_cents == 14850"
            - "Quote.${q}.total_cents == 113850"

      - name: addons_per_line_round_then_sum
        grounds:
          - calculations.addons_taxed_total
          - entities.AddOn.fields.line_total_cents
          - entities.Quote.fields.addons_total_cents
        distinguishing_aspect: "Mode (b): per-line rounding of two taxed add-ons (round(4882.5)=4883 + round(3251.745)=3252) sums to 8135, whereas sum-then-round (round(7497*1.085)=8134) differs by 1 cent; the scaffold pins per-line-then-sum."
        test_recipe:
          setup:
            - "RateCard MOVE, one Customer; DRAFT Job crew_size 2, estimated_hours 2.0, weekday window, no truck; two add-ons HEAVY_ITEM 4500x1 and PACKING_MATERIALS 999x3."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 2, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z", truck_required: false }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/add-ons", payload: { addon_type: "HEAVY_ITEM", quantity: 1, unit_fee_cents: 4500 }, as: Customer, as_user_id: "${cust}", captures: { a1: "$.data.id" } }
            - { call: "POST /jobs/${job}/add-ons", payload: { addon_type: "PACKING_MATERIALS", quantity: 3, unit_fee_cents: 999 }, as: Customer, as_user_id: "${cust}", captures: { a2: "$.data.id" } }
          trigger:
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
          assert:
            - "AddOn.${a1}.line_total_cents == 4883"
            - "AddOn.${a2}.line_total_cents == 3252"
            - "Quote.${q}.addons_total_cents == 8135"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: job_requote_self_loop
        grounds:
          - state_machines.Job.QUOTED_to_QUOTED
          - state_machines.Quote.ACTIVE_to_SUPERSEDED
          - entities.Quote.fields.status
        distinguishing_aspect: "Job in QUOTED re-quotes to QUOTED (a self-loop, non-linear), superseding its prior ACTIVE quote and bumping Job.version to 3; a linear pipeline could not return to QUOTED."
        test_recipe:
          setup:
            - "RateCard MOVE, Customer, Job quoted once (status QUOTED, version 2, one ACTIVE quote)."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 2, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q1: "$.data.id" } }
          trigger:
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q2: "$.data.id" } }
          assert:
            - "Job.${job}.status == QUOTED"
            - "Job.${job}.version == 3"
            - "Quote.${q1}.status == SUPERSEDED"
            - "Quote.${q2}.status == ACTIVE"

      - name: helper_suspend_reinstate_cycle
        grounds:
          - state_machines.Helper.APPROVED_to_SUSPENDED
          - state_machines.Helper.SUSPENDED_to_APPROVED
          - entities.Helper.fields.vetting_status
        distinguishing_aspect: "Helper vetting cycles APPROVED->SUSPENDED->APPROVED (SUSPENDED_to_APPROVED is the back-edge), a cyclic machine on a different entity than Job."
        test_recipe:
          setup:
            - "One Helper, vetted APPROVED then SUSPENDED."
          setup_api_calls:
            - { call: "POST /helpers", payload: { display_name: "HA", email: "ha@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { ha: "$.data.id" } }
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "SUSPEND" }, as: Admin }
          trigger:
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "REINSTATE" }, as: Admin }
          assert:
            - "Helper.${ha}.vetting_status == APPROVED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rating_suspends_helper_releases_assignment
        grounds:
          - calculations.helper_rating_avg
          - state_machines.Helper.APPROVED_to_SUSPENDED
          - state_machines.Assignment.ASSIGNED_to_RELEASED
          - calculations.helper_active_assignment_count
        distinguishing_aspect: "Trigger POST /ratings (1 star) -> Helper.rating_avg becomes 1.0 -> Helper auto APPROVED->SUSPENDED -> the helper's other ASSIGNED assignment goes RELEASED (depth-3 chain, each hop caused by the previous, originating at Rating creation)."
        test_recipe:
          setup:
            - "Helper HA APPROVED. Job JC1 driven to COMPLETED with HA as checked-out crew (ratable). Job JC2 BOOKED with HA freshly ASSIGNED (future window)."
            - "Before the rating: HA.active_assignment_count == 2 (JC1 CHECKED_OUT + JC2 ASSIGNED), vetting APPROVED."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HA", email: "ha@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { ha: "$.data.id" } }
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jc1: "$.data.id" } }
            - { call: "POST /jobs/${jc1}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q1: "$.data.id" } }
            - { call: "GET /jobs/${jc1}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { v1: "$.data.version" } }
            - { call: "POST /jobs/${jc1}/book", payload: { quote_id: "${q1}", expected_job_version: "${v1}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${jc1}", helper_id: "${ha}", role: "LEAD" }, as: Dispatcher, captures: { asg1: "$.data.id" } }
            - { call: "POST /assignments/${asg1}/check-in", payload: {}, as: Helper, as_user_id: "${ha}" }
            - { call: "POST /jobs/${jc1}/start", payload: {}, as: Dispatcher }
            - { call: "POST /assignments/${asg1}/check-out", payload: {}, as: Helper, as_user_id: "${ha}" }
            - { call: "POST /jobs/${jc1}/complete", payload: { actual_hours: 3.0 }, as: Dispatcher }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-20T09:00:00Z", window_end: "2026-03-20T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { jc2: "$.data.id" } }
            - { call: "POST /jobs/${jc2}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q2: "$.data.id" } }
            - { call: "GET /jobs/${jc2}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { v2: "$.data.version" } }
            - { call: "POST /jobs/${jc2}/book", payload: { quote_id: "${q2}", expected_job_version: "${v2}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${jc2}", helper_id: "${ha}", role: "LEAD" }, as: Dispatcher, captures: { asg2: "$.data.id" } }
          trigger:
            - { call: "POST /ratings", payload: { job_id: "${jc1}", helper_id: "${ha}", stars: 1, comment: "bad" }, as: Customer, as_user_id: "${cust}", captures: { rid: "$.data.id" } }
          assert:
            - "Helper.${ha}.rating_avg == 1.0"
            - "Helper.${ha}.vetting_status == SUSPENDED"
            - "Assignment.${asg2}.status == RELEASED"
            - "Assignment.${asg1}.status == CHECKED_OUT"
            - "Helper.${ha}.active_assignment_count == 1"

      - name: claim_approval_reverses_payout
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Payout.RELEASED_to_REVERSED
          - calculations.helper_lifetime_payout
          - entities.Claim.fields.responsible_helper_id
        distinguishing_aspect: "Trigger POST /claims/{id}/approve -> the responsible helper's RELEASED Payout goes REVERSED -> Helper.lifetime_payout_cents recomputes to 0 (depth-2 chain from a Claim trigger, distinct from the rating cascade's trigger)."
        test_recipe:
          setup:
            - "Job JS driven to SETTLED under a BASIC policy with helper HS as checked-out crew; a RELEASED Payout of 14100 exists and HS.lifetime_payout_cents == 14100."
            - "A Claim for 150000 with responsible_helper_id=HS filed on JS and moved to UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HS", email: "hs@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hs: "$.data.id" } }
            - { call: "POST /helpers/${hs}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-10T09:00:00Z", window_end: "2026-03-10T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { js: "$.data.id" } }
            - { call: "POST /jobs/${js}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${js}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${js}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${js}", helper_id: "${hs}", role: "LEAD" }, as: Dispatcher, captures: { asg: "$.data.id" } }
            - { call: "POST /assignments/${asg}/check-in", payload: {}, as: Helper, as_user_id: "${hs}" }
            - { call: "POST /jobs/${js}/start", payload: {}, as: Dispatcher }
