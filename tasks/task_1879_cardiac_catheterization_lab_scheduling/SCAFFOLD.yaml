# =============================================================================
# SCAFFOLD.yaml — Cardiac Catheterization Lab Scheduling (task 1879)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1879. Cardiac Catheterization Lab Scheduling (hospital cath lab): case posting
  with procedure type & equipment need, STEMI activation & bumping of elective
  cases, lab/room assignment & staffing per case, device/implant inventory
  (stents/leads) & consignment, contrast & radiation dose tracking,
  post-procedure recovery bed availability, appropriate-use criteria
  documentation, registry data submission

domain_name: cardiac-cath-lab
api_prefix: /cath-lab

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - selector_policy
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities, flat topology, FK references)
# =============================================================================
entities:
  - name: CathLabRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_name, type: string, source: input, description: "Human-readable lab/room name" }
      - { name: equipment_profile, type: array, source: input, default: "[]", description: "Equipment codes installed: subset of {BIPLANE_ANGIOGRAPHY, IVUS, OCT, FFR, ROTATIONAL_ATHERECTOMY, IABP, MECHANICAL_SUPPORT}", constraints: "each element one of the listed enum codes" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE", default: "ACTIVE" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff full name" }
      - { name: staff_role, type: enum, source: input, description: "INTERVENTIONAL_CARDIOLOGIST | SCRUB_TECHNOLOGIST | CIRCULATING_NURSE" }
      - { name: credentials, type: array, source: input, default: "[]", description: "Free-form credential codes" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the staff member may receive new case assignments" }

  - name: CathCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_mrn, type: string, source: input, description: "Patient medical record number" }
      - { name: procedure_type, type: enum, source: input, description: "DIAGNOSTIC_CATHETERIZATION | PCI | STEMI_PCI | DEVICE_IMPLANT | EP_STUDY" }
      - { name: priority, type: enum, source: input, description: "ELECTIVE | URGENT | STEMI" }
      - { name: performing_physician_id, type: string, source: input, description: "FK -> StaffMember.id; referenced StaffMember must have staff_role INTERVENTIONAL_CARDIOLOGIST" }
      - { name: weight_kg, type: number, source: input, description: "Patient weight in kg, > 0; feeds contrast_limit_ml" }
      - { name: serum_creatinine, type: number, source: input, description: "Serum creatinine mg/dL, > 0; feeds contrast_limit_ml" }
      - { name: equipment_needs, type: array, source: input, default: "[]", description: "Equipment codes required by the case (same enum as CathLabRoom.equipment_profile)" }
      - { name: lab_id, type: string, source: system, description: "FK -> CathLabRoom.id; assigned by schedule/STEMI activation, null while POSTED/BUMPED/CANCELLED", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: system, description: "Scheduled window start; null while POSTED/BUMPED/CANCELLED", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + base_minutes(procedure_type) + setup_minutes (see estimated_case_window); null while unscheduled", constraints: "nullable" }
      - { name: actual_start, type: datetime, source: system, description: "Logical-clock timestamp set on start; null until IN_PROGRESS", constraints: "nullable" }
      - { name: actual_end, type: datetime, source: system, description: "Logical-clock timestamp set on complete; null until COMPLETED", constraints: "nullable" }
      - { name: contrast_limit_ml, type: number, source: computed, description: "Per-patient contrast ceiling computed at posting (see contrast_limit_ml calculation)" }
      - { name: cumulative_contrast_ml, type: number, source: computed, default: 0, description: "Sum of contrast_ml over this case's DoseRecords with record_type CONTRAST and status ACTIVE" }
      - { name: cumulative_radiation_mgy, type: number, source: computed, default: 0, description: "Sum of per-record rounded record_total_mgy over non-voided RADIATION DoseRecords (see radiation_dose_report)" }
      - { name: radiation_alert, type: boolean, source: computed, default: false, description: "true once cumulative_radiation_mgy >= RADIATION_ALERT_MGY (5000.0); never auto-clears" }
      - { name: bump_count, type: integer, source: computed, default: 0, description: "Number of times this case has been bumped by a STEMI activation" }
      - { name: auc_status, type: enum, source: system, default: "NOT_DOCUMENTED", description: "NOT_DOCUMENTED | DOCUMENTED; set by POST auc-attestation" }
      - { name: auc_score, type: enum, source: system, description: "APPROPRIATE | MAY_BE_APPROPRIATE | RARELY_APPROPRIATE; null until documented", constraints: "nullable" }
      - { name: auc_criterion_code, type: string, source: system, description: "AUC criterion code from latest attestation; null until documented", constraints: "nullable" }
      - { name: ordering_physician_id, type: string, source: system, description: "FK -> StaffMember.id; ordering physician from latest AUC attestation; null until documented", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "POSTED | SCHEDULED | BUMPED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CathCase.id; case this assignment staffs" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; assigned staff member" }
      - { name: role_in_case, type: enum, source: input, description: "PRIMARY_OPERATOR | SCRUB | CIRCULATOR; must map to staff_role (INTERVENTIONAL_CARDIOLOGIST | SCRUB_TECHNOLOGIST | CIRCULATING_NURSE respectively)" }
      - { name: window_start, type: datetime, source: computed, description: "Copied from case.scheduled_start at assignment time" }
      - { name: window_end, type: datetime, source: computed, description: "Copied from case.scheduled_end at assignment time" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED" }

  - name: DeviceLot
    parent: null
    common_fields: true
    fields:
      - { name: device_type, type: enum, source: input, description: "STENT_DES | STENT_BMS | PACEMAKER_LEAD | ICD_LEAD | CLOSURE_DEVICE" }
      - { name: manufacturer, type: string, source: input, description: "Device manufacturer" }
      - { name: model_number, type: string, source: input, description: "Catalog/model number" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: ownership, type: enum, source: input, description: "OWNED | CONSIGNMENT" }
      - { name: quantity_on_hand, type: integer, source: input, default: 0, description: "Physical units on shelf (>= 0); decremented by implant, incremented by restock; unchanged by reserve/release" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Sum of quantity over DeviceUsages with status RESERVED against this lot" }
      - { name: available_units, type: integer, source: computed, description: "quantity_on_hand - allocated_units (scheduling view; see device_availability)" }
      - { name: reorder_threshold, type: integer, source: input, description: "LOW_STOCK boundary (>= 0)" }
      - { name: expiration_date, type: datetime, source: input, description: "Use-by date; reservation blocked when current logical date is strictly after this date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LOW_STOCK | DEPLETED; derived from available_units vs reorder_threshold" }

  - name: DeviceUsage
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CathCase.id; case the devices are reserved/implanted for" }
      - { name: lot_id, type: string, source: input, description: "FK -> DeviceLot.id; lot drawn from" }
      - { name: quantity, type: integer, source: input, description: "Units reserved (>= 1)" }
      - { name: status, type: enum, source: system, description: "RESERVED | IMPLANTED | RELEASED" }

  - name: DoseRecord
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CathCase.id; case this dose entry belongs to" }
      - { name: record_type, type: enum, source: input, description: "CONTRAST | RADIATION" }
      - { name: contrast_ml, type: number, source: input, description: "Contrast volume mL (>= 0); required iff record_type == CONTRAST", constraints: "nullable" }
      - { name: fluoroscopy_mgy, type: number, source: input, description: "Fluoroscopy dose mGy (>= 0); required iff record_type == RADIATION", constraints: "nullable" }
      - { name: cine_mgy, type: number, source: input, description: "Cine-acquisition dose mGy (>= 0); required iff record_type == RADIATION", constraints: "nullable" }
      - { name: record_total_mgy, type: number, source: computed, description: "round_half_up(fluoroscopy_mgy + cine_mgy, 2) for RADIATION records; 0 for CONTRAST" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: RecoveryBed
    parent: null
    common_fields: true
    fields:
      - { name: bed_label, type: string, source: input, description: "Human-readable bed label" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OCCUPIED | OUT_OF_SERVICE" }
      - { name: held_case_id, type: string, source: system, description: "FK -> CathCase.id; case currently holding/occupying the bed; null when AVAILABLE or OUT_OF_SERVICE", constraints: "nullable" }
      - { name: window_start, type: datetime, source: system, description: "Start of committed recovery window (= holding case's scheduled_end, recomputed to actual_end on occupation); null when free", constraints: "nullable" }
      - { name: window_end, type: datetime, source: system, description: "Projected release time = window_start + RECOVERY_MINUTES (90); scheduled variant until occupation, actual variant after (see bed_release_projection)", constraints: "nullable" }

  - name: RegistrySubmission
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> CathCase.id; at most one RegistrySubmission exists per case (ERR_DUPLICATE_SUBMISSION)" }
      - { name: registry_name, type: enum, source: computed, description: "NCDR_CATHPCI (DIAGNOSTIC_CATHETERIZATION/PCI/STEMI_PCI) | NCDR_ICD (DEVICE_IMPLANT) | NCDR_EP (EP_STUDY)" }
      - { name: completeness_pct, type: number, source: computed, description: "Registry completeness percent at last evaluation (see registry_completeness); refreshed on submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last DRAFT -> SUBMITTED; null while DRAFT", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of last record-decision; null until decided", constraints: "nullable" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded with a REJECTED decision; null otherwise", constraints: "nullable" }
      - { name: correction_note, type: string, source: system, description: "Note recorded on revise (REJECTED -> DRAFT); null until revised", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CathCase
    initial_state: POSTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: POSTED
        to: SCHEDULED
        trigger: "POST /cath-lab/cases/{id}/schedule"
        actor: CathLabScheduler
        preconditions:
          - "If priority == ELECTIVE: auc_status == DOCUMENTED (else ERR_AUC_REQUIRED)"
          - "Target room status == ACTIVE (else ERR_ROOM_NOT_ACTIVE)"
          - "equipment_needs subset of room.equipment_profile (else ERR_EQUIPMENT_MISMATCH)"
          - "No room window conflict on target room (else ERR_ROOM_WINDOW_CONFLICT)"
          - "A recovery bed is secured: explicit bed_id AVAILABLE, or bed_selector non-empty (else ERR_BED_INVALID_STATE / ERR_NO_RECOVERY_BED)"
        side_effects:
          - "lab_id and scheduled_start set from payload; scheduled_end computed via estimated_case_window"
          - "Chosen RecoveryBed: AVAILABLE -> RESERVED, held_case_id = this case, window_start = scheduled_end, window_end = scheduled_end + 90 (scheduled variant)"
          - "CathCase.version incremented by 1"
      - from: POSTED
        to: SCHEDULED
        trigger: "system (automatic on STEMI case creation: POST /cath-lab/cases with priority == STEMI)"
        actor: system
        preconditions:
          - "bump_room_selector returned a room (else creation fails with ERR_NO_STEMI_ROOM)"
        side_effects:
          - "lab_id/scheduled_start set from payload; scheduled_end computed via estimated_case_window (STEMI setup_minutes = 0)"
          - "Every overlapping ELECTIVE SCHEDULED case on the chosen room transitions SCHEDULED -> BUMPED (see that transition's side effects)"
          - "bed_selector picks a RecoveryBed: AVAILABLE -> RESERVED with window [scheduled_end, scheduled_end + 90)"
      - from: SCHEDULED
        to: BUMPED
        trigger: "system (STEMI activation bump: chosen by bump_room_selector overlap set)"
        actor: system
        preconditions:
          - "Case priority == ELECTIVE and status == SCHEDULED and its room window overlaps the STEMI window"
        side_effects:
          - "bump_count incremented by 1; lab_id/scheduled_start/scheduled_end cleared to null"
          - "Its RecoveryBed (status RESERVED, held_case_id == this case) transitions RESERVED -> AVAILABLE with held_case_id/window_start/window_end cleared (link 2b)"
          - "Each of its StaffAssignments with status ASSIGNED transitions ASSIGNED -> RELEASED (link 2a)"
          - "Each of its DeviceUsages with status RESERVED transitions RESERVED -> RELEASED (link 2c), which itself recomputes the DeviceLot.allocated_units and DeviceLot.status (link 3)"
      - from: BUMPED
        to: SCHEDULED
        trigger: "POST /cath-lab/cases/{id}/schedule (reschedule)"
        actor: CathLabScheduler
        preconditions:
          - "Same preconditions as POSTED -> SCHEDULED (AUC still satisfied from prior attestation if ELECTIVE)"
        side_effects:
          - "Same side effects as POSTED -> SCHEDULED (new room/window/bed)"
        note: "SCHEDULED -> BUMPED -> SCHEDULED is the bump-reschedule cycle (cyclic machine)"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cath-lab/cases/{id}/start"
        actor: InterventionalCardiologist
        preconditions:
          - "Acting X-User-ID == performing_physician_id (else ERR_NOT_PERFORMING_PHYSICIAN)"
          - "Room (lab_id) status == ACTIVE (else ERR_ROOM_NOT_ACTIVE)"
          - "Staffing complete: >= 1 ASSIGNED StaffAssignment with role_in_case == SCRUB and >= 1 with role_in_case == CIRCULATOR (else ERR_STAFFING_INCOMPLETE)"
        side_effects:
          - "actual_start = current logical clock time"
          - "CathCase.version incremented by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cath-lab/cases/{id}/complete"
        actor: InterventionalCardiologist
        preconditions:
          - "Acting X-User-ID == performing_physician_id (else ERR_NOT_PERFORMING_PHYSICIAN)"
        side_effects:
          - "actual_end = current logical clock time"
          - "RecoveryBed holding this case: RESERVED -> OCCUPIED; window_start = actual_end, window_end = actual_end + 90 (actual variant of bed_release_projection)"
          - "All ASSIGNED StaffAssignments of this case -> RELEASED"
          - "All still-RESERVED DeviceUsages of this case -> RELEASED, recomputing each DeviceLot.allocated_units and DeviceLot.status"
      - from: POSTED
        to: CANCELLED
        trigger: "POST /cath-lab/cases/{id}/cancel"
        actor: CathLabScheduler
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cath-lab/cases/{id}/cancel"
        actor: CathLabScheduler
        preconditions: []
        side_effects:
          - "RecoveryBed RESERVED -> AVAILABLE (fields cleared)"
          - "ASSIGNED StaffAssignments -> RELEASED"
          - "RESERVED DeviceUsages -> RELEASED (DeviceLot.allocated_units/status recomputed)"
      - from: BUMPED
        to: CANCELLED
        trigger: "POST /cath-lab/cases/{id}/cancel"
        actor: CathLabScheduler
        preconditions: []
        side_effects: []
        note: "BUMPED already released bed/staff/usages at bump time"

  - entity: StaffAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /cath-lab/staff-assignments/{id}/release"
        actor: CathLabScheduler
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: RELEASED
        trigger: "system (case bump, case cancel, or case completion cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeviceUsage
    initial_state: RESERVED
    terminal_states: [IMPLANTED, RELEASED]
    transitions:
      - from: RESERVED
        to: IMPLANTED
        trigger: "POST /cath-lab/device-usages/{id}/implant"
        actor: CathLabTechnologist
        preconditions:
          - "Parent case status == IN_PROGRESS (else ERR_CASE_INVALID_STATE)"
        side_effects:
          - "DeviceLot.quantity_on_hand -= quantity; DeviceLot.allocated_units -= quantity"
          - "DeviceLot.status recomputed from available_units vs reorder_threshold (link 2 of implant cascade)"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /cath-lab/device-usages/{id}/release"
        actor: CathLabTechnologist
        preconditions: []
        side_effects:
          - "DeviceLot.allocated_units -= quantity; DeviceLot.status recomputed"
      - from: RESERVED
        to: RELEASED
        trigger: "system (case bump / cancel / complete cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "DeviceLot.allocated_units -= quantity; DeviceLot.status recomputed"

  - entity: DoseRecord
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /cath-lab/dose-records/{id}/void"
        actor: CathLabTechnologist
        preconditions:
          - "Parent case status == IN_PROGRESS (else ERR_CASE_INVALID_STATE)"
          - "Record not already VOIDED (else ERR_DOSE_RECORD_ALREADY_VOIDED)"
        side_effects:
          - "Case cumulative_contrast_ml / cumulative_radiation_mgy recomputed over remaining ACTIVE records (compensating action)"
          - "radiation_alert NOT cleared even if cumulative drops below threshold (alert latches)"

  - entity: RecoveryBed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (case schedule or STEMI activation bed assignment)"
        actor: system
        preconditions: []
        side_effects:
          - "held_case_id = case id; window_start = case.scheduled_end; window_end = scheduled_end + 90 (scheduled variant)"
      - from: RESERVED
        to: OCCUPIED
        trigger: "system (case completion)"
        actor: system
        preconditions: []
        side_effects:
          - "window_start = case.actual_end; window_end = actual_end + 90 (actual variant)"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (case bump or cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "held_case_id/window_start/window_end cleared to null"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /cath-lab/recovery-beds/{id}/release"
        actor: RecoveryNurseManager
        preconditions: []
        side_effects:
          - "held_case_id/window_start/window_end cleared to null"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "PATCH /cath-lab/recovery-beds/{id} (status = OUT_OF_SERVICE)"
        actor: RecoveryNurseManager
        preconditions:
          - "status == AVAILABLE (RESERVED/OCCUPIED beds cannot be taken out of service: ERR_RESOURCE_IN_USE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "PATCH /cath-lab/recovery-beds/{id} (status = AVAILABLE)"
        actor: RecoveryNurseManager
        preconditions: []
        side_effects: []

  - entity: CathLabRoom
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "PATCH /cath-lab/rooms/{id} (status = OUT_OF_SERVICE)"
        actor: CathLabScheduler
        preconditions:
          - "No case with lab_id == this room and status IN {SCHEDULED, IN_PROGRESS} (else ERR_RESOURCE_IN_USE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "PATCH /cath-lab/rooms/{id} (status = ACTIVE)"
        actor: CathLabScheduler
        preconditions: []
        side_effects: []

  - entity: DeviceLot
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LOW_STOCK
        trigger: "system (available_units recompute after reserve/release/implant/restock)"
        actor: system
        preconditions: ["0 < available_units < reorder_threshold"]
        side_effects: []
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (available_units recompute)"
        actor: system
        preconditions: ["available_units == 0"]
        side_effects: []
      - from: LOW_STOCK
        to: ACTIVE
        trigger: "system (available_units recompute)"
        actor: system
        preconditions: ["available_units >= reorder_threshold"]
        side_effects: []
      - from: LOW_STOCK
        to: DEPLETED
        trigger: "system (available_units recompute)"
        actor: system
        preconditions: ["available_units == 0"]
        side_effects: []
      - from: DEPLETED
        to: LOW_STOCK
        trigger: "system (available_units recompute)"
        actor: system
        preconditions: ["0 < available_units < reorder_threshold"]
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (available_units recompute)"
        actor: system
        preconditions: ["available_units >= reorder_threshold"]
        side_effects: []
    note: "status is fully derived from available_units vs reorder_threshold after every mutation that changes either quantity_on_hand or allocated_units; boundary: available == reorder_threshold is ACTIVE (>=)"

  - entity: RegistrySubmission
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cath-lab/registry-submissions/{id}/submit"
        actor: RegistryCoordinator
        preconditions:
          - "Case status == COMPLETED (else ERR_CASE_INVALID_STATE)"
          - "registry_completeness == 100.0 (else ERR_SUBMISSION_INCOMPLETE)"
          - "current logical time <= case.actual_end + SUBMISSION_WINDOW_DAYS (30 days); exactly at the boundary is allowed (else ERR_SUBMISSION_WINDOW_EXPIRED)"
        side_effects:
          - "submitted_at = current logical clock time; completeness_pct refreshed and stored"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cath-lab/registry-submissions/{id}/record-decision (outcome = ACCEPTED)"
        actor: RegistryCoordinator
        preconditions: []
        side_effects: ["decided_at = current logical clock time"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cath-lab/registry-submissions/{id}/record-decision (outcome = REJECTED)"
        actor: RegistryCoordinator
        preconditions:
          - "rejection_reason present in payload (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_at = current logical clock time; rejection_reason stored"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /cath-lab/registry-submissions/{id}/revise"
        actor: RegistryCoordinator
        preconditions: []
        side_effects:
          - "correction_note stored; submitted_at/decided_at cleared to null"
        note: "DRAFT -> SUBMITTED -> REJECTED -> DRAFT is the revision cycle (cyclic machine)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only true races listed)
# =============================================================================
concurrency_rules:
  - rule_id: auc-attestation-stale-case
    parent_entity: CathCase
    write_endpoint: "POST /cath-lab/cases/{id}/auc-attestation"
    occ_field: expected_case_version
    description: |
      Recording an AUC attestation against a CathCase whose version has
      advanced since the client last observed it is rejected. An attestation
      legitimately overwrites the case's current AUC documentation, so a
      second sequential attestation carrying the version observed before an
      intervening write (e.g. an earlier attestation, a schedule, or a dose
      side effect) is operating on a stale view and must be refused.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: device-lot-restock-stale-version
    parent_entity: DeviceLot
    write_endpoint: "POST /cath-lab/device-lots/{id}/restock"
    occ_field: expected_lot_version
    description: |
      Restocking a DeviceLot whose version has advanced since the client last
      observed it is rejected. A restock is valid from any lot state, so the
      only way to detect that the client's quantity basis is stale (e.g. an
      intervening restock or an implant that decremented quantity_on_hand)
      is the OCC version check on the lot.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contrast_limit_ml
    trigger: "CathCase creation (POST /cath-lab/cases)"
    algorithm: threshold
    formula: |
      raw = CONTRAST_MULTIPLIER * weight_kg / serum_creatinine
      limit = min(raw, CONTRAST_CAP_ML)
      Store on case.contrast_limit_ml.
    input_set: "The new case's weight_kg and serum_creatinine"
    constants:
      CONTRAST_MULTIPLIER: 5.0
      CONTRAST_CAP_ML: 300.0
    precision: "1 decimal place, round_half_up"
    note: "Examples: 60kg / 1.5mg/dL -> 200.0 mL; 80kg / 1.0mg/dL -> 400 -> capped 300.0 mL"

  - name: contrast_limit_check
    trigger: "POST /cath-lab/cases/{id}/dose-records with record_type CONTRAST"
    algorithm: threshold
    formula: |
      projected = case.cumulative_contrast_ml + payload.contrast_ml
      if projected > case.contrast_limit_ml: reject ERR_CONTRAST_LIMIT_EXCEEDED
      Boundary: projected == contrast_limit_ml is ALLOWED (strict >).
    input_set: "Parent case + the new record only (cumulative is maintained incrementally from ACTIVE CONTRAST records)"
    precision: "1 decimal place, round_half_up"

  - name: estimated_case_window
    trigger: "Case scheduling (POST /cath-lab/cases/{id}/schedule) and STEMI auto-scheduling"
    algorithm: forward_looking
    formula: |
      base = BASE_MINUTES[procedure_type]
      if priority == STEMI:
        setup = 0                                  # expedited branch: no setup allowance
      else:
        n = count(equipment_needs)
        setup = 0 if n == 0 else (15 if n <= 2 else 30)   # tiered branch
      scheduled_end = scheduled_start + base + setup
    input_set: "The case being scheduled (procedure_type, priority, equipment_needs) + payload scheduled_start"
    constants:
      BASE_MINUTES_DIAGNOSTIC_CATHETERIZATION: 45
      BASE_MINUTES_PCI: 90
      BASE_MINUTES_STEMI_PCI: 75
      BASE_MINUTES_DEVICE_IMPLANT: 60
      BASE_MINUTES_EP_STUDY: 120
    precision: "whole minutes; datetimes at second resolution"
    note: "Combinatorial mode (a): >= 3 inputs (procedure_type tier table, equipment-count tier, priority branch) with non-linear interaction"

  - name: room_window_conflict
    trigger: "POST /cath-lab/cases/{id}/schedule and STEMI bump_room_selector overlap scan"
    algorithm: interval_merge
    formula: |
      For the target room, committed set = cases with lab_id == room AND status IN {SCHEDULED, IN_PROGRESS}.
      Each committed case occupies [scheduled_start, scheduled_end + TURNOVER_BUFFER_MINUTES).
      New case occupies [new_start, new_end + TURNOVER_BUFFER_MINUTES).
      Conflict iff new_start < committed_end_buffered AND committed_start < new_end_buffered.
      Buffer-extended half-open semantics: new_start == committed_end + TURNOVER is NOT a conflict
      (exactly adjacent after the buffer is allowed).
    input_set: "Non-terminal scheduled cases on the room (status IN {SCHEDULED, IN_PROGRESS}); POSTED/BUMPED/CANCELLED/COMPLETED excluded"
    constants:
      TURNOVER_BUFFER_MINUTES: 20

  - name: staff_window_conflict
    trigger: "POST /cath-lab/cases/{id}/staff-assignments"
    algorithm: interval_merge
    formula: |
      For the candidate staff member, committed set = StaffAssignments with staff_id == candidate,
      status == ASSIGNED, and whose CathCase.status IN {SCHEDULED, IN_PROGRESS}.
      Windows are STRICT half-open [window_start, window_end) with NO buffer:
      conflict iff new_start < committed_end AND committed_start < new_end.
      Adjacency is allowed: new_start == committed_end is NOT a conflict (unlike rooms, no turnover buffer).
    input_set: "ASSIGNED assignments of the same staff member on SCHEDULED/IN_PROGRESS cases only"
    note: "Different interval semantics from room_window_conflict (no buffer, pure adjacency) on a different resource (StaffMember vs CathLabRoom)"

  - name: device_availability
    trigger: "Computed on every DeviceLot read and after any reserve/release/implant/restock"
    algorithm: aggregation
    formula: |
      allocated_units = sum(quantity) over DeviceUsages with lot_id == this lot AND status == RESERVED
      available_units = quantity_on_hand - allocated_units
    input_set: "DeviceUsages of the lot filtered to status == RESERVED only (IMPLANTED/RELEASED excluded)"
    precision: "integer units"
    variants:
      - name: scheduling_view
        when: "Reservation validation (POST device-usages) and DeviceLot.status derivation"
        difference: "available = quantity_on_hand - allocated_units (reservations subtracted)"
      - name: physical_view
        when: "Consignment/shelf reconciliation reported on DeviceLot reads (quantity_on_hand field)"
        difference: "physical = quantity_on_hand (reservations NOT subtracted); differs from scheduling_view whenever any usage is RESERVED"

  - name: device_lot_status
    trigger: "After every mutation that changes quantity_on_hand or allocated_units (create, reserve, release, implant, restock)"
    algorithm: threshold
    formula: |
      if available_units == 0: status = DEPLETED
      elif available_units < reorder_threshold: status = LOW_STOCK
      else: status = ACTIVE
      Boundary: available_units == reorder_threshold is ACTIVE (>=); available_units == 0 is DEPLETED.
    input_set: "The lot's own available_units and reorder_threshold"

  - name: radiation_dose_report
    trigger: "POST /cath-lab/cases/{id}/dose-records with record_type RADIATION, and void of a RADIATION record"
    algorithm: aggregation
    formula: |
      record_total_mgy = round_half_up(fluoroscopy_mgy + cine_mgy, 2)   # per record, BEFORE summing
      cumulative_radiation_mgy = sum(record_total_mgy) over this case's RADIATION records with status == ACTIVE
      Rounding order is PINNED: round each record to 2 decimals (round_half_up) first, then sum.
      The alternative order (sum raw values, then round once) yields different results and is forbidden.
      Example: records (1.005 + 0) and (1.005 + 0): pinned -> round(1.005)=1.01 + 1.01 = 2.02;
      forbidden order -> round(2.010) = 2.01.
      if cumulative_radiation_mgy >= RADIATION_ALERT_MGY: case.radiation_alert = true (>= triggers; latches, never auto-clears)
    input_set: "DoseRecords of the case with record_type == RADIATION and status == ACTIVE (VOIDED excluded)"
    constants:
      RADIATION_ALERT_MGY: 5000.0
    precision: "2 decimal places per record, round_half_up, round-per-record-then-sum"
    note: "Combinatorial mode (b): nested rounding where order matters, order pinned explicitly"

  - name: bed_release_projection
    trigger: "Bed reservation at schedule/STEMI activation, and recomputation at case completion"
    algorithm: forward_looking
    formula: |
      window_end = window_start + RECOVERY_MINUTES
    input_set: "The holding case's scheduled_end (before completion) or actual_end (at completion)"
    constants:
      RECOVERY_MINUTES: 90
    variants:
      - name: scheduled_variant
        when: "At case scheduling / STEMI activation (bed RESERVED)"
        difference: "window_start = case.scheduled_end; projection from the posted schedule"
      - name: actual_variant
        when: "At case completion (bed RESERVED -> OCCUPIED)"
        difference: "window_start = case.actual_end; recomputed from the actual finish; differs from scheduled_variant whenever actual_end != scheduled_end"

  - name: bump_room_selector
    trigger: "POST /cath-lab/cases with priority == STEMI (activation)"
    algorithm: selector_policy
    formula: |
      Eligibility filter (all must hold):
        room.status == ACTIVE
        AND equipment_needs subset of room.equipment_profile
        AND no case on the room with status == IN_PROGRESS
        AND no case on the room with status == SCHEDULED and priority IN {STEMI, URGENT}
          whose buffered window overlaps the STEMI window (room_window_conflict semantics).
      Ranking: ascending count of overlapping SCHEDULED ELECTIVE cases on the room
        (fewest victims first); ties broken by room.created_at ASC (never by id).
      Fallback: if the eligible set is empty, the POST /cath-lab/cases fails with ERR_NO_STEMI_ROOM
        (no case is persisted).
      Side effect: every overlapping SCHEDULED ELECTIVE case on the chosen room is bumped
        (SCHEDULED -> BUMPED with full cascade).
    input_set: "All CathLabRooms; overlap judged against STEMI window [scheduled_start, scheduled_end + 20)"

  - name: bed_selector
    trigger: "Case scheduling when bed_id is omitted from the payload"
    algorithm: selector_policy
    formula: |
      Eligibility filter: RecoveryBed.status == AVAILABLE (a bed holds at most one case at a time;
        RESERVED/OCCUPIED/OUT_OF_SERVICE beds are ineligible).
      Ranking: created_at ASC (earliest-created available bed first); ties broken by bed_label ASC.
      Fallback: empty eligible set -> ERR_NO_RECOVERY_BED.
    input_set: "All RecoveryBeds"

  - name: registry_completeness
    trigger: "RegistrySubmission creation and re-evaluated on submit"
    algorithm: aggregation
    formula: |
      Required elements (7 for ELECTIVE cases, 6 otherwise):
        patient_mrn present; performing_physician_id set; actual_start set; actual_end set;
        >= 1 RADIATION DoseRecord with status == ACTIVE; no DeviceUsage of the case still RESERVED;
        and (ELECTIVE only) case.auc_status == DOCUMENTED.
      completeness_pct = round_half_up(present_count / total_count * 100, 1)
      Submit requires completeness_pct == 100.0 (boundary: exactly 100.0 passes; 99.9 fails).
    input_set: "The case, its DoseRecords (ACTIVE RADIATION only), its DeviceUsages (any status), its AUC fields"
    precision: "1 decimal place, round_half_up"

  - name: submission_window_check
    trigger: "POST /cath-lab/registry-submissions/{id}/submit"
    algorithm: threshold
    formula: |
      deadline = case.actual_end + SUBMISSION_WINDOW_DAYS days
      if current logical time > deadline: reject ERR_SUBMISSION_WINDOW_EXPIRED
      Boundary: current time == deadline exactly is ALLOWED (strict >).
    input_set: "The submission's case actual_end and the logical clock"
    constants:
      SUBMISSION_WINDOW_DAYS: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right (roomId/staffId/caseId/lotId/bedId/assignmentId/usageId/recordId/submissionId); then body foreign-key references must exist (lab_id, bed_id, staff_id, lot_id, performing_physician_id, ordering_physician_id), each mapped to its resource-specific error"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_ROOM_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_BED_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_USAGE_NOT_FOUND, ERR_DOSE_RECORD_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids or body FK references"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, types correct, enum values in-domain, numeric ranges valid (weight_kg > 0, serum_creatinine > 0, quantity >= 1, quantities >= 0); conditional requirements: STEMI create needs scheduled_start; CONTRAST record needs contrast_ml; RADIATION record needs fluoroscopy_mgy and cine_mgy; record-decision with outcome REJECTED needs rejection_reason"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "Target resource (and parent-context resource) in correct state: case from-state for schedule (POSTED|BUMPED), start (SCHEDULED), complete (IN_PROGRESS), cancel (POSTED|SCHEDULED|BUMPED); case SCHEDULED|IN_PROGRESS for device reserve and staff-assignment creation (staffing requires SCHEDULED); case IN_PROGRESS for dose-record add/void and implant; case COMPLETED for registry-submission creation; usage RESERVED for implant/release; assignment ASSIGNED for release; bed OCCUPIED for release; bed AVAILABLE for explicit bed_id scheduling; submission DRAFT for submit, SUBMITTED for record-decision, REJECTED for revise"
    error_id: "ERR_CASE_INVALID_STATE | ERR_USAGE_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_BED_INVALID_STATE | ERR_SUBMISSION_INVALID_STATE"
    http_status: 409
    applies_to: "state transition and state-gated creation endpoints"
  - priority: 6
    category: business_safety
    check: "Clinical safety/compliance: ELECTIVE case scheduling requires auc_status == DOCUMENTED (ERR_AUC_REQUIRED); AUC attestation segregation of duties — ordering_physician_id must differ from case.performing_physician_id AND acting X-User-ID must equal ordering_physician_id (ERR_AUC_ORDERING_CONFLICT); contrast dose would push cumulative above contrast_limit_ml (ERR_CONTRAST_LIMIT_EXCEEDED)"
    error_id: "ERR_AUC_REQUIRED | ERR_AUC_ORDERING_CONFLICT | ERR_CONTRAST_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "schedule, auc-attestation, dose-record creation"
  - priority: 7
    category: business_temporal
    check: "Temporal conflicts and deadlines: room window conflict with turnover buffer (ERR_ROOM_WINDOW_CONFLICT); staff window conflict strict half-open (ERR_STAFF_WINDOW_CONFLICT); device lot expired — current logical date strictly after expiration_date (ERR_DEVICE_EXPIRED); registry submission window elapsed (ERR_SUBMISSION_WINDOW_EXPIRED)"
    error_id: "ERR_ROOM_WINDOW_CONFLICT | ERR_STAFF_WINDOW_CONFLICT | ERR_DEVICE_EXPIRED | ERR_SUBMISSION_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "schedule, STEMI activation, staff-assignment creation, device reserve, submission submit"
  - priority: 8
    category: business_referential
    check: "Referenced-entity state and consistency: room ACTIVE (ERR_ROOM_NOT_ACTIVE); staff is_active (ERR_STAFF_INACTIVE); role mapping role_in_case vs staff_role, and performing_physician_id must reference an INTERVENTIONAL_CARDIOLOGIST (ERR_STAFF_ROLE_MISMATCH); acting cardiologist must equal performing_physician_id on start/complete (ERR_NOT_PERFORMING_PHYSICIAN); staffing completeness at start (ERR_STAFFING_INCOMPLETE); room/bed/staff deactivation while referenced by non-terminal work (ERR_RESOURCE_IN_USE); equipment_needs subset of room profile (ERR_EQUIPMENT_MISMATCH); second RegistrySubmission for same case (ERR_DUPLICATE_SUBMISSION)"
    error_id: "ERR_ROOM_NOT_ACTIVE | ERR_STAFF_INACTIVE | ERR_STAFF_ROLE_MISMATCH | ERR_NOT_PERFORMING_PHYSICIAN | ERR_STAFFING_INCOMPLETE | ERR_RESOURCE_IN_USE | ERR_EQUIPMENT_MISMATCH | ERR_DUPLICATE_SUBMISSION"
    http_status: 409
    applies_to: "endpoints referencing other entities"
  - priority: 9
    category: business_constraint
    check: "Capacity/quota/selector fallbacks: device stock insufficient — available_units < requested quantity (ERR_INSUFFICIENT_DEVICE_STOCK); no eligible recovery bed (ERR_NO_RECOVERY_BED); no eligible STEMI room (ERR_NO_STEMI_ROOM)"
    error_id: "ERR_INSUFFICIENT_DEVICE_STOCK | ERR_NO_RECOVERY_BED | ERR_NO_STEMI_ROOM"
    http_status: 409
    applies_to: "device reserve, schedule, STEMI activation"
  - priority: 10
    category: business_constraint
    check: "Optimistic concurrency: expected_case_version / expected_lot_version must match the parent's current version"
    error_id: "ERR_STALE_CASE_VERSION | ERR_STALE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /cath-lab/cases/{id}/auc-attestation, POST /cath-lab/device-lots/{id}/restock"
    note: "OCC is checked after existence and request-shape, before the write is applied"

# =============================================================================
# §1.5 API Endpoint Table (44 endpoints)
# =============================================================================
endpoints:
  # --- CathLabRoom ---
  - method: POST
    path: "/cath-lab/rooms"
    description: "Register a cath lab room"
    roles: [CathLabScheduler]
    code: 201
    input: [room_name, "equipment_profile?"]
    output: CathLabRoom
    side_effects: ["status initialized ACTIVE"]
  - method: GET
    path: "/cath-lab/rooms"
    description: "List cath lab rooms"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CathLabRoom[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/rooms/{id}"
    description: "Get one cath lab room"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: CathLabRoom
    side_effects: []
  - method: PATCH
    path: "/cath-lab/rooms/{id}"
    description: "Set room status (ACTIVE <-> OUT_OF_SERVICE); setting the current status is rejected ERR_INVALID_REQUEST; taking a room with SCHEDULED/IN_PROGRESS cases out of service fails ERR_RESOURCE_IN_USE"
    roles: [CathLabScheduler]
    code: 200
    input: [status]
    output: CathLabRoom
    side_effects: ["room state transition"]
  # --- StaffMember ---
  - method: POST
    path: "/cath-lab/staff"
    description: "Register a staff member"
    roles: [CathLabScheduler]
    code: 201
    input: [full_name, staff_role, "credentials?"]
    output: StaffMember
    side_effects: ["is_active defaults true"]
  - method: GET
    path: "/cath-lab/staff"
    description: "List staff members"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["staff_role?", "is_active?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/staff/{id}"
    description: "Get one staff member"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: PATCH
    path: "/cath-lab/staff/{id}"
    description: "Activate/deactivate a staff member; deactivation blocked while the member holds ASSIGNED assignments on non-terminal cases (ERR_RESOURCE_IN_USE)"
    roles: [CathLabScheduler]
    code: 200
    input: [is_active]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/cath-lab/staff/{id}/assignments"
    description: "List staff assignments for a staff member (reverse reachability for StaffAssignment.staff_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "StaffAssignment[]"
    side_effects: []
  # --- CathCase ---
  - method: POST
    path: "/cath-lab/cases"
    description: "Post a cath case. priority STEMI activates immediately: requires scheduled_start, runs bump_room_selector, is created in SCHEDULED, bumps overlapping ELECTIVE cases (full cascade) and reserves a recovery bed; selector empty -> ERR_NO_STEMI_ROOM and nothing is persisted. ELECTIVE/URGENT cases are created POSTED."
    roles: [CathLabScheduler, InterventionalCardiologist]
    code: 201
    input: [patient_mrn, procedure_type, priority, performing_physician_id, weight_kg, serum_creatinine, "equipment_needs?", "scheduled_start?"]
    output: CathCase
    side_effects: ["contrast_limit_ml computed", "STEMI: room assignment + bump cascade + bed reservation"]
  - method: GET
    path: "/cath-lab/cases"
    description: "List cath cases (filtered-list reverse reachability for lab_id, performing_physician_id, ordering_physician_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["status?", "priority?", "lab_id?", "performing_physician_id?", "ordering_physician_id?", "limit?", "offset?"]
    output: "CathCase[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/cases/{id}"
    description: "Get one cath case"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: CathCase
    side_effects: []
  - method: POST
    path: "/cath-lab/cases/{id}/schedule"
    description: "Schedule (or reschedule a bumped) case onto a room: computes scheduled_end, checks AUC/equipment/room-window, secures a recovery bed (explicit bed_id or bed_selector)"
    roles: [CathLabScheduler]
    code: 200
    input: [lab_id, scheduled_start, "bed_id?"]
    output: CathCase
    side_effects: ["POSTED|BUMPED -> SCHEDULED", "bed AVAILABLE -> RESERVED", "increments CathCase.version by 1"]
  - method: POST
    path: "/cath-lab/cases/{id}/cancel"
    description: "Cancel a non-terminal case; releases bed, staff assignments, and device reservations"
    roles: [CathLabScheduler]
    code: 200
    input: []
    output: CathCase
    side_effects: ["status -> CANCELLED with release cascades"]
  - method: POST
    path: "/cath-lab/cases/{id}/start"
    description: "Begin the procedure (performing cardiologist only); requires room ACTIVE and complete staffing"
    roles: [InterventionalCardiologist]
    code: 200
    input: []
    output: CathCase
    side_effects: ["SCHEDULED -> IN_PROGRESS", "actual_start = logical clock"]
  - method: POST
    path: "/cath-lab/cases/{id}/complete"
    description: "Finish the procedure (performing cardiologist only); occupies recovery bed with actual-variant window; releases staff and unused device reservations"
    roles: [InterventionalCardiologist]
    code: 200
    input: []
    output: CathCase
    side_effects: ["IN_PROGRESS -> COMPLETED", "actual_end = logical clock", "bed RESERVED -> OCCUPIED (actual variant)", "assignments/usages released"]
  - method: POST
    path: "/cath-lab/cases/{id}/auc-attestation"
    description: "Document appropriate-use criteria for the case (OCC on CathCase.version). Overwrites any prior attestation. Segregation of duties: ordering physician != performing physician, and the acting cardiologist must be the ordering physician."
    roles: [InterventionalCardiologist]
    code: 201
    input: [ordering_physician_id, auc_score, criterion_code, expected_case_version]
    output: CathCase
    side_effects: ["auc_status -> DOCUMENTED, auc_score/auc_criterion_code/ordering_physician_id stored", "increments CathCase.version by 1"]
  # --- StaffAssignment ---
  - method: POST
    path: "/cath-lab/cases/{id}/staff-assignments"
    description: "Assign a staff member to a SCHEDULED case; enforces role mapping, is_active, and strict half-open window conflicts"
    roles: [CathLabScheduler]
    code: 201
    input: [staff_id, role_in_case]
    output: StaffAssignment
    side_effects: ["window_start/window_end copied from case schedule"]
  - method: GET
    path: "/cath-lab/cases/{id}/staff-assignments"
    description: "List staff assignments of a case (reverse reachability for StaffAssignment.case_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "StaffAssignment[]"
    side_effects: []
  - method: POST
    path: "/cath-lab/staff-assignments/{id}/release"
    description: "Release an ASSIGNED staff assignment"
    roles: [CathLabScheduler]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["ASSIGNED -> RELEASED"]
  # --- DeviceLot ---
  - method: POST
    path: "/cath-lab/device-lots"
    description: "Register a device/implant lot (owned or consignment)"
    roles: [CathLabTechnologist]
    code: 201
    input: [device_type, manufacturer, model_number, lot_number, ownership, quantity_on_hand, reorder_threshold, expiration_date]
    output: DeviceLot
    side_effects: ["status derived from available_units vs reorder_threshold"]
  - method: GET
    path: "/cath-lab/device-lots"
    description: "List device lots"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["device_type?", "status?", "ownership?", "limit?", "offset?"]
    output: "DeviceLot[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/device-lots/{id}"
    description: "Get one device lot (includes quantity_on_hand physical view and available_units scheduling view)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: DeviceLot
    side_effects: []
  - method: POST
    path: "/cath-lab/device-lots/{id}/restock"
    description: "Add units to a lot (OCC on DeviceLot.version)"
    roles: [CathLabTechnologist]
    code: 200
    input: [quantity, expected_lot_version]
    output: DeviceLot
    side_effects: ["quantity_on_hand += quantity", "status recomputed", "increments DeviceLot.version by 1"]
  - method: GET
    path: "/cath-lab/device-lots/{id}/usages"
    description: "List device usages drawn from a lot (reverse reachability for DeviceUsage.lot_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceUsage[]"
    side_effects: []
  # --- DeviceUsage ---
  - method: POST
    path: "/cath-lab/cases/{id}/device-usages"
    description: "Reserve device units from a lot for a SCHEDULED or IN_PROGRESS case"
    roles: [CathLabTechnologist]
    code: 201
    input: [lot_id, quantity]
    output: DeviceUsage
    side_effects: ["DeviceLot.allocated_units += quantity", "DeviceLot.status recomputed"]
  - method: GET
    path: "/cath-lab/cases/{id}/device-usages"
    description: "List device usages of a case (reverse reachability for DeviceUsage.case_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceUsage[]"
    side_effects: []
  - method: POST
    path: "/cath-lab/device-usages/{id}/implant"
    description: "Mark reserved units as implanted (consumes physical stock); requires parent case IN_PROGRESS"
    roles: [CathLabTechnologist]
    code: 200
    input: []
    output: DeviceUsage
    side_effects: ["RESERVED -> IMPLANTED", "DeviceLot.quantity_on_hand -= quantity and allocated_units -= quantity", "DeviceLot.status recomputed"]
  - method: POST
    path: "/cath-lab/device-usages/{id}/release"
    description: "Return reserved units to available stock"
    roles: [CathLabTechnologist]
    code: 200
    input: []
    output: DeviceUsage
    side_effects: ["RESERVED -> RELEASED", "DeviceLot.allocated_units -= quantity", "DeviceLot.status recomputed"]
  # --- DoseRecord ---
  - method: POST
    path: "/cath-lab/cases/{id}/dose-records"
    description: "Record a contrast or radiation dose entry for an IN_PROGRESS case; contrast limit enforced (projected > limit rejected; == limit allowed); radiation alert latches at >= 5000.0 mGy"
    roles: [CathLabTechnologist]
    code: 201
    input: [record_type, "contrast_ml?", "fluoroscopy_mgy?", "cine_mgy?"]
    output: DoseRecord
    side_effects: ["case cumulative_contrast_ml / cumulative_radiation_mgy recomputed", "radiation_alert latching", "increments CathCase.version by 1"]
  - method: GET
    path: "/cath-lab/cases/{id}/dose-records"
    description: "List dose records of a case (reverse reachability for DoseRecord.case_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["record_type?", "status?", "limit?", "offset?"]
    output: "DoseRecord[]"
    side_effects: []
  - method: POST
    path: "/cath-lab/dose-records/{id}/void"
    description: "Void an ACTIVE dose record (compensating action); requires parent case IN_PROGRESS"
    roles: [CathLabTechnologist]
    code: 200
    input: []
    output: DoseRecord
    side_effects: ["ACTIVE -> VOIDED", "case cumulative totals recomputed", "radiation_alert NOT cleared"]
  # --- RecoveryBed ---
  - method: POST
    path: "/cath-lab/recovery-beds"
    description: "Register a recovery bed"
    roles: [RecoveryNurseManager]
    code: 201
    input: [bed_label]
    output: RecoveryBed
    side_effects: ["status initialized AVAILABLE"]
  - method: GET
    path: "/cath-lab/recovery-beds"
    description: "List recovery beds (filtered-list reverse reachability for held_case_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["status?", "held_case_id?", "limit?", "offset?"]
    output: "RecoveryBed[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/recovery-beds/{id}"
    description: "Get one recovery bed"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: RecoveryBed
    side_effects: []
  - method: PATCH
    path: "/cath-lab/recovery-beds/{id}"
    description: "Set bed status (AVAILABLE <-> OUT_OF_SERVICE); RESERVED/OCCUPIED beds cannot go out of service (ERR_RESOURCE_IN_USE); setting the current status is rejected ERR_INVALID_REQUEST"
    roles: [RecoveryNurseManager]
    code: 200
    input: [status]
    output: RecoveryBed
    side_effects: ["bed state transition"]
  - method: POST
    path: "/cath-lab/recovery-beds/{id}/release"
    description: "Release an OCCUPIED bed (patient leaves recovery)"
    roles: [RecoveryNurseManager]
    code: 200
    input: []
    output: RecoveryBed
    side_effects: ["OCCUPIED -> AVAILABLE", "held_case_id/window fields cleared"]
  # --- RegistrySubmission ---
  - method: POST
    path: "/cath-lab/cases/{id}/registry-submissions"
    description: "Open a registry submission for a COMPLETED case; registry_name derived from procedure_type; at most one submission per case"
    roles: [RegistryCoordinator]
    code: 201
    input: []
    output: RegistrySubmission
    side_effects: ["status DRAFT", "completeness_pct computed"]
  - method: GET
    path: "/cath-lab/cases/{id}/registry-submissions"
    description: "List registry submissions of a case (reverse reachability for RegistrySubmission.case_id)"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RegistrySubmission[]"
    side_effects: []
  - method: GET
    path: "/cath-lab/registry-submissions/{id}"
    description: "Get one registry submission"
    roles: [CathLabScheduler, InterventionalCardiologist, CathLabTechnologist, RecoveryNurseManager, RegistryCoordinator]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: []
  - method: POST
    path: "/cath-lab/registry-submissions/{id}/submit"
    description: "Submit a DRAFT submission to the registry; requires completeness 100.0 and submission window not elapsed"
    roles: [RegistryCoordinator]
    code: 200
    input: []
    output: RegistrySubmission
    side_effects: ["DRAFT -> SUBMITTED", "submitted_at set", "completeness_pct refreshed"]
  - method: POST
    path: "/cath-lab/registry-submissions/{id}/record-decision"
    description: "Record the registry clearinghouse decision (ACCEPTED or REJECTED; REJECTED requires rejection_reason)"
    roles: [RegistryCoordinator]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: RegistrySubmission
    side_effects: ["SUBMITTED -> ACCEPTED | REJECTED", "decided_at set"]
  - method: POST
    path: "/cath-lab/registry-submissions/{id}/revise"
    description: "Return a REJECTED submission to DRAFT for correction (revision cycle)"
    roles: [RegistryCoordinator]
    code: 200
    input: [correction_note]
    output: RegistrySubmission
    side_effects: ["REJECTED -> DRAFT", "submitted_at/decided_at cleared"]
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/cath-lab/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. All timestamping (actual_start/actual_end, submitted_at, decided_at) and date checks (device expiry, submission window) use this clock."
    roles: [CathLabScheduler]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "No CathLabRoom with the given roomId" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "No StaffMember with the given staffId" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "No CathCase with the given caseId" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "No DeviceLot with the given lotId" }
  - { id: ERR_BED_NOT_FOUND, http: 404, condition: "No RecoveryBed with the given bedId" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "No StaffAssignment with the given assignmentId" }
  - { id: ERR_USAGE_NOT_FOUND, http: 404, condition: "No DeviceUsage with the given usageId" }
  - { id: ERR_DOSE_RECORD_NOT_FOUND, http: 404, condition: "No DoseRecord with the given recordId" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "No RegistrySubmission with the given submissionId" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request shape violation: missing required field, bad type, out-of-domain enum, invalid numeric range, or unmet conditional requirement (STEMI scheduled_start, per-record-type dose fields, REJECTED rejection_reason, setting a status to its current value)" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "CathCase not in a valid from-state for the requested operation (incl. parent-context state: COMPLETED for submission creation, IN_PROGRESS for dose/implant, SCHEDULED for staffing, SCHEDULED|IN_PROGRESS for device reserve)" }
  - { id: ERR_USAGE_INVALID_STATE, http: 409, condition: "DeviceUsage not RESERVED for implant/release" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "StaffAssignment not ASSIGNED for release" }
  - { id: ERR_BED_INVALID_STATE, http: 409, condition: "RecoveryBed not OCCUPIED for release, or explicit bed_id not AVAILABLE at scheduling" }
  - { id: ERR_SUBMISSION_INVALID_STATE, http: 409, condition: "RegistrySubmission not in the required from-state (DRAFT for submit, SUBMITTED for record-decision, REJECTED for revise)" }
  - { id: ERR_DOSE_RECORD_ALREADY_VOIDED, http: 409, condition: "Void requested on a DoseRecord already VOIDED" }
  - { id: ERR_AUC_REQUIRED, http: 422, condition: "ELECTIVE case scheduling requires auc_status == DOCUMENTED" }
  - { id: ERR_AUC_ORDERING_CONFLICT, http: 403, condition: "AUC segregation of duties violated: ordering_physician_id equals case.performing_physician_id, or acting X-User-ID does not equal ordering_physician_id" }
  - { id: ERR_CONTRAST_LIMIT_EXCEEDED, http: 422, condition: "New CONTRAST record would push cumulative_contrast_ml strictly above contrast_limit_ml (exactly at limit allowed)" }
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "Buffered room window [start, end+20) collides with a SCHEDULED/IN_PROGRESS case on the room (exactly adjacent after buffer allowed)" }
  - { id: ERR_STAFF_WINDOW_CONFLICT, http: 409, condition: "Strict half-open staff window collision with an ASSIGNED assignment on a SCHEDULED/IN_PROGRESS case (exact adjacency allowed)" }
  - { id: ERR_DEVICE_EXPIRED, http: 422, condition: "Current logical date is strictly after the lot's expiration_date (on the expiration date itself is allowed)" }
  - { id: ERR_SUBMISSION_WINDOW_EXPIRED, http: 422, condition: "Submit attempted strictly more than 30 days after case.actual_end (exactly at the deadline allowed)" }
  - { id: ERR_ROOM_NOT_ACTIVE, http: 409, condition: "Referenced room is OUT_OF_SERVICE (schedule or start)" }
  - { id: ERR_STAFF_INACTIVE, http: 409, condition: "Referenced staff member has is_active == false" }
  - { id: ERR_STAFF_ROLE_MISMATCH, http: 422, condition: "role_in_case incompatible with staff_role, or performing_physician_id does not reference an INTERVENTIONAL_CARDIOLOGIST" }
  - { id: ERR_NOT_PERFORMING_PHYSICIAN, http: 403, condition: "Acting cardiologist's X-User-ID does not equal case.performing_physician_id on start/complete" }
  - { id: ERR_STAFFING_INCOMPLETE, http: 422, condition: "Case start requires >= 1 ASSIGNED SCRUB and >= 1 ASSIGNED CIRCULATOR" }
  - { id: ERR_RESOURCE_IN_USE, http: 409, condition: "Deactivation blocked: room has SCHEDULED/IN_PROGRESS cases, bed is RESERVED/OCCUPIED, or staff holds ASSIGNED assignments on non-terminal cases" }
  - { id: ERR_EQUIPMENT_MISMATCH, http: 422, condition: "case.equipment_needs is not a subset of the room's equipment_profile" }
  - { id: ERR_DUPLICATE_SUBMISSION, http: 409, condition: "A RegistrySubmission already exists for this case" }
  - { id: ERR_INSUFFICIENT_DEVICE_STOCK, http: 409, condition: "available_units < requested quantity (request equal to available_units allowed)" }
  - { id: ERR_NO_RECOVERY_BED, http: 409, condition: "bed_selector found no AVAILABLE recovery bed and no explicit bed_id given" }
  - { id: ERR_NO_STEMI_ROOM, http: 409, condition: "bump_room_selector found no eligible room for a STEMI activation; the case is not persisted" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match the CathCase's current version (OCC)" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not match the DeviceLot's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CathLabScheduler
    description: "Cath lab scheduling coordinator; owns rooms, staff registry, case scheduling/cancellation, staffing, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /cath-lab/rooms; PATCH /cath-lab/rooms/{id}"
      - "POST /cath-lab/staff; PATCH /cath-lab/staff/{id}"
      - "POST /cath-lab/cases/{id}/schedule; POST /cath-lab/cases/{id}/cancel"
      - "POST /cath-lab/cases/{id}/staff-assignments; POST /cath-lab/staff-assignments/{id}/release"
      - "POST /cath-lab/_clock/set_current_utc"
    shared_operations:
      - "POST /cath-lab/cases (shared with InterventionalCardiologist)"
      - "All GET endpoints"
  - name: InterventionalCardiologist
    description: "Performing/ordering physician; starts and completes own cases, documents AUC (segregated: may not self-attest as ordering physician on own case)"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /cath-lab/cases/{id}/start; POST /cath-lab/cases/{id}/complete (X-User-ID must equal performing_physician_id)"
      - "POST /cath-lab/cases/{id}/auc-attestation (X-User-ID must equal ordering_physician_id, which must differ from performing_physician_id)"
    shared_operations:
      - "POST /cath-lab/cases (shared with CathLabScheduler)"
      - "All GET endpoints"
  - name: CathLabTechnologist
    description: "Scrum/technologist; owns device lots, device usage, and dose recording"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /cath-lab/device-lots; POST /cath-lab/device-lots/{id}/restock"
      - "POST /cath-lab/cases/{id}/device-usages; POST /cath-lab/device-usages/{id}/implant; POST /cath-lab/device-usages/{id}/release"
      - "POST /cath-lab/cases/{id}/dose-records; POST /cath-lab/dose-records/{id}/void"
    shared_operations:
      - "All GET endpoints"
  - name: RecoveryNurseManager
    description: "Recovery unit manager; owns recovery beds and their release"
    identity: opaque
    exclusive_operations:
      - "POST /cath-lab/recovery-beds; PATCH /cath-lab/recovery-beds/{id}; POST /cath-lab/recovery-beds/{id}/release"
    shared_operations:
      - "All GET endpoints"
  - name: RegistryCoordinator
    description: "Registry data coordinator; owns registry submissions lifecycle (segregated from performing physician)"
    identity: opaque
    exclusive_operations:
      - "POST /cath-lab/cases/{id}/registry-submissions"
      - "POST /cath-lab/registry-submissions/{id}/submit"
      - "POST /cath-lab/registry-submissions/{id}/record-decision"
      - "POST /cath-lab/registry-submissions/{id}/revise"
    shared_operations:
      - "All GET endpoints"
