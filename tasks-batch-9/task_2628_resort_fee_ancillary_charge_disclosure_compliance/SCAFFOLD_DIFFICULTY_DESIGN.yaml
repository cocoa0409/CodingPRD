          assert:
            - "FeeProgram.${fp_ban}.mandatory_fee_count == 1 and FeeProgram.${fp_ban}.inclusion_coverage_ratio == 0.0000, so the priority-22 rule is genuinely violated as well"
            - "the trigger returns HTTP 422 with data.error_id == ERR_MANDATORY_FEE_BANNED_IN_JURISDICTION"
            - "the trigger does NOT return ERR_MANDATORY_FEE_WITHOUT_INCLUSION even though both rules are violated and both would return 422"
            - "FeeProgram.${fp_ban}.status is still UNDER_REVIEW and Property.${p_ban}.published_fee_program_count == 0"
            - "control: POST /fee-programs/${fp_free}/publish returns HTTP 422 with data.error_id == ERR_MANDATORY_FEE_WITHOUT_INCLUSION, because Maricopa has mandatory_fee_ban false so only the priority-22 rule bites"
            - "FeeProgram.${fp_free}.status is still UNDER_REVIEW after the control call"

  - rule_id: boundary_precision_check
    instances:

      - name: disclosure_score_exactly_at_flag_threshold_sixty_does_not_flag
        grounds:
          - calculations.channel_disclosure_score
          - calculations.property_disclosure_posture
          - state_machines.ChannelDisclosureProfile.DEPLOYED_to_FLAGGED
          - endpoints.POST_/channel-disclosure-profiles/{id}/audit
        distinguishing_aspect: |
          METRIC: disclosure_score against DISCLOSURE_FLAG_THRESHOLD (60) and
          DISCLOSURE_CONFIRM_THRESHOLD (80), probed through
          POST /channel-disclosure-profiles/{id}/audit. Both comparisons are
          STRICT less-than, so a profile scoring exactly 60 must survive an audit
          in DEPLOYED and must make the property AT_RISK rather than
          NON_COMPLIANT, while the nearest reachable score below it (50) both
          flags and turns the property NON_COMPLIANT. Any `<=` in the
          implementation flips both halves of this instance.
        test_recipe:
          setup:
            - "A jurisdiction with first_quote_total_required FALSE and itemization_required_on_folio true, so a profile may legally carry first_quote_shows_total false and the capability penalty stays 0 on channels that support itemisation"
