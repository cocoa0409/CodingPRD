          Depth-4 chain whose trigger is a catalog write: publish -> Part.lifecycle_status OBSOLETE
          (hop 1) -> that part's ALLOCATED OrderLine becomes SUBSTITUTE_PENDING with its reservation
          released and a PRICE_FILE_OBSOLESCENCE SubstituteRequest created (hop 2) -> the parent
          PartOrder leaves ALLOCATED for HELD(SUBSTITUTE_PENDING) with subtotal recomputed to 102400
          (hop 3) -> the ServicerAccount's credit_used_cents falls to 102400 (hop 4). Each hop is
          caused only by the preceding hop: no part turned obsolete means no line moves, no line
          moves means the order stays ALLOCATED, and an ALLOCATED order keeps its full exposure.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Parts P1 (12999 MECHANICAL) and P4 (128000 MECHANICAL); InventoryRecord (STL, P1) and (STL, P4) each with on_hand_units 10."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "A WILL_CALL order at STL is credit-approved and ALLOCATED with line L1 (P1 x1, 10399) and line L2 (P4 x1, 102400): subtotal 112799, both lines ALLOCATED, one unit of each part reserved, credit_used_cents 112799."
            - "A DRAFT price file carries one line for P1 with new_list_price_cents 12999 and new_lifecycle_status OBSOLETE, so the publish changes lifecycle only and leaves the catalog price sum untouched."
            - "The clock stays at 2026-08-01T00:00:00Z, which is exactly the file's effective_at."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p4_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p4_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_1_id: $.data.id }
            - call: "GET /part-orders/${order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { order_v1: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p4_id}", quantity: 1, expected_part_order_version: "${order_v1}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_2_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
