              captures: { ff_v4: "$.data.version" }
            - call: "POST /athletics/point-transfers"
              payload: { source_donor_id: "${ff_id}", recipient_donor_id: "${gg_id}", basis: "DEATH", points_amount: 10.00, expected_source_donor_version: "${ff_v4}" }
              as: DevelopmentOfficer
