scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reg_t_vs_pma_initial_margin
        grounds:
          - calculations.margin_requirement
          - entities.Account.fields.account_type
          - entities.Order.fields.margin_requirement_cents
        distinguishing_aspect: |
          Same Order inputs (BUY 100 AAPL @ $150.00 limit, notional 1,500,000 cents)
          produce different margin_requirement_cents on different Account.account_type:
          MARGIN_REG_T yields 750000 cents (50% rate), MARGIN_PMA yields 225000 cents
          (15% rate). Two valid algorithms diverge on the same Order entity domain
          driven by Account.account_type field — first dual-variant calc grounded on
          Order/Account.
        test_recipe:
          setup:
            - "Create Customer with kyc verified."
            - "Create Account A1 with account_type=MARGIN_REG_T, status=APPROVED, cash_balance_cents=10_000_000."
            - "Create Account A2 with account_type=MARGIN_PMA, status=APPROVED, cash_balance_cents=10_000_000."
          trigger:
            - "POST /brokerage/orders body={account_id:A1, symbol:AAPL, instrument_type:EQUITY, side:BUY, order_type:LIMIT, quantity:100, limit_price_cents:15000}"
            - "POST /brokerage/orders body={account_id:A2, symbol:AAPL, instrument_type:EQUITY, side:BUY, order_type:LIMIT, quantity:100, limit_price_cents:15000}"
          assert:
            - "Order created for A1 has margin_requirement_cents == 750000"
            - "Order created for A2 has margin_requirement_cents == 225000"
            - "Order created for A1 has margin_requirement_cents > Order for A2"

      - name: pdt_evaluation_immediate_vs_subsequent
        grounds:
          - calculations.pdt_flag_check
          - calculations.portfolio_equity
          - entities.Account.fields.equity_value_cents
          - entities.Account.fields.pdt_flag
        distinguishing_aspect: |
          Same DayTrade insert on Account (different domain than Order — Account
          equity scoring vs Order cost) produces different posture under the two
          valid timing interpretations: variant A evaluates equity at the instant
          of the 4th day trade (before any settlement), variant B evaluates after
          all open orders of that day are netted. Scaffold pins variant A (evaluate
          immediately on DayTrade insert) — equity_value_cents read at evaluation
          time differs from value at end-of-day. Distinct entity domain (Account
          risk posture) from the cost-accounting Order margin variant.
        test_recipe:
          setup:
            - "Create approved Customer + Account A with cash_balance_cents=2_499_900 ($24,999) and 3 existing DayTrade rows for trade_date=today."
          trigger:
            - "POST /brokerage/orders MARKET BUY 1 share at 100 cents on A → fills, then POST /brokerage/orders MARKET SELL 1 share at 100 cents on A → fills, creating the 4th DayTrade."
          assert:
            - "Account.pdt_flag == true immediately after 4th DayTrade insert"
            - "Account.trading_posture == 'PDT_FROZEN'"
            - "Account.equity_value_cents < 2_500_000 confirms the floor was breached at evaluation time"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: options_eligibility_tiered_thresholds_mode_a
        grounds:
          - calculations.options_eligibility_max
          - entities.Customer.fields.years_options_experience
          - entities.Customer.fields.liquid_net_worth_cents
          - entities.Customer.fields.total_net_worth_cents
        distinguishing_aspect: |
          Mode (a): formula with 3 inputs (yrs, lnw, tnw) and non-linear interaction —
          tiered-rate selection where the eligibility level is the MAXIMUM tier for
          which BOTH thresholds are met. Different inputs that pass two tiers but
          fail the third (e.g., yrs=2 lnw=10_000_000 tnw=24_999_999) cap at level 2,
          not level 3. Conditional branches on multiple inputs produce a single tier.
        test_recipe:
          setup:
            - "Create Customer C1 with years_options_experience=2, liquid_net_worth_cents=10000000, total_net_worth_cents=24999999, kyc verified, account APPROVED."
            - "POST /brokerage/options-approvals for C1 with requested_level=3."
            - "POST /brokerage/options-approvals/{id}/start-review as ComplianceOfficer."
          trigger:
            - "POST /brokerage/options-approvals/{id}/decide body={decision:'APPROVE', approved_level:3}"
          assert:
            - "Response error_id == 'ERR_OPTIONS_LEVEL_EXCEEDS_ELIGIBILITY' (level 3 requires tnw >= 25_000_000)"
            - "Same call with approved_level:2 succeeds and Account.options_level == 2"

      - name: margin_naked_option_per_term_rounding_mode_b
        grounds:
          - calculations.margin_requirement
          - entities.Order.fields.option_strategy
          - entities.Order.fields.margin_requirement_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — Reg T naked option requires
          base = ceil(notional * 0.50) AND addon = ceil(notional * 0.20), summed AFTER
          each ceil. With notional=12345 cents: per-term-then-sum = ceil(12345*0.50)
          + ceil(12345*0.20) = 6173 + 2469 = 8642 cents; sum-then-ceil would be
          ceil(12345*0.70) = ceil(8641.5) = 8642 cents — tie, but with notional=12347
          per-term gives ceil(6173.5)+ceil(2469.4) = 6174+2470 = 8644 cents whereas
          sum-then-ceil gives ceil(12347*0.70) = ceil(8642.9) = 8643 cents. Scaffold
          pins per-term ceil BEFORE summation.
        test_recipe:
          setup:
            - "Approved Customer with options_level=4, Account A account_type=MARGIN_REG_T, status=APPROVED, cash_balance_cents=100_000."
          trigger:
            - "POST /brokerage/orders body={account_id:A, symbol:AAPL, instrument_type:OPTION, option_strategy:'NAKED_CALL', side:SELL, order_type:LIMIT, quantity:1, limit_price_cents:12347}"
          assert:
            - "Order.margin_requirement_cents == 8644  # ceil(12347*0.50)=6174 + ceil(12347*0.20)=2470"
            - "Order.margin_requirement_cents != 8643  # sum-then-ceil would be wrong"

      - name: acat_business_day_walk_mode_c
        grounds:
          - calculations.acat_completion_eta
          - entities.ACATTransfer.fields.expected_completion_at
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order is pinned —
          expected_completion_at is computed by walking forward day-by-day, skipping
          weekends, decrementing the remaining-business-days counter only on Mon-Fri.
          Naively adding 6*24h or 6 calendar days produces a different timestamp
          when initiated_at falls late in the week. Scaffold pins: walk one calendar
          day at a time, decrement counter iff weekday in MON..FRI, target time is
          17:00:00 UTC.
        test_recipe:
          setup:
            - "Approved Customer + Account A; advance clock so initiated_at = 2026-01-05T10:00:00Z (a Monday)."
            - "POST /brokerage/acat-transfers body={account_id:A, direction:INBOUND, counterparty_brokerage:'Other', counterparty_account_number:'X', requested_value_cents:100000}"
          trigger:
            - "POST /brokerage/acat-transfers/{id}/validate as ComplianceOfficer"
          assert:
            - "ACATTransfer.expected_completion_at == '2026-01-13T17:00:00.000Z'  # Mon+6BD = Tue 1/13"
            - "Naive +6 days would give 2026-01-11T10:00:00Z; the assertion above rejects that"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: options_approval_revision_cycle
        grounds:
          - state_machines.OptionsApproval.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.OptionsApproval.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.OptionsApproval.SUBMITTED_to_UNDER_REVIEW
          - entities.OptionsApproval.fields.revision_count
        distinguishing_aspect: |
          OptionsApproval has a cyclic shape: UNDER_REVIEW → REVISION_REQUESTED →
          SUBMITTED → UNDER_REVIEW. Distinct from a linear pipeline because the same
          row can re-enter UNDER_REVIEW any number of times (bounded by
          revision_count < 3). Belongs to entity OptionsApproval — different entity
          from instance two.
        test_recipe:
          setup:
            - "Approved Customer with eligibility for level 2; OptionsApproval OA submitted with requested_level=2."
          trigger:
            - "Cycle 1: start-review → decide REQUEST_REVISION → PATCH (resubmit)."
            - "Cycle 2: start-review → decide REQUEST_REVISION → PATCH (resubmit)."
          assert:
            - "OptionsApproval.status == 'SUBMITTED' after second resubmit"
            - "OptionsApproval.revision_count == 2"
            - "Same id re-entered UNDER_REVIEW twice (cycle observed)"

      - name: account_posture_branching_with_revert
        grounds:
          - state_machines.Account.OPEN_to_PDT_FROZEN
          - state_machines.Account.PDT_FROZEN_to_OPEN
          - state_machines.Account.OPEN_to_TRANSFER_LOCKED
          - state_machines.Account.TRANSFER_LOCKED_to_OPEN
          - entities.Account.fields.trading_posture
        distinguishing_aspect: |
          Account.trading_posture is non-linear: branching fork-join with revert —
          OPEN branches to either PDT_FROZEN or TRANSFER_LOCKED via divergent
          side-effect sets (PDT cascade cancels orders AND rejects options-approvals;
          TRANSFER_LOCKED only cancels orders), then both branches revert back to
          OPEN through different conditions. Entity is Account (distinct from
          OptionsApproval above).
        test_recipe:
          setup:
            - "Approved Customer + Account A with equity_value_cents=2_499_900 and 3 existing DayTrades; one WORKING LIMIT Order O1; one SUBMITTED OptionsApproval OA1."
          trigger:
            - "Trigger 4th DayTrade via two MARKET orders on A."
          assert:
            - "Account.trading_posture == 'PDT_FROZEN'"
            - "Order O1.status == 'CANCELLED' (cascade)"
            - "OptionsApproval OA1.status == 'REJECTED' (cascade)"
            - "POST /brokerage/accounts/A/pdt/reset with deposit raising equity to >= 2_500_000 returns posture := 'OPEN' (revert branch)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: pdt_trigger_three_hop_cascade
        grounds:
          - state_machines.Account.OPEN_to_PDT_FROZEN
          - state_machines.Order.ACCEPTED_to_CANCELLED
          - state_machines.OptionsApproval.UNDER_REVIEW_to_REJECTED
          - calculations.pdt_flag_check
        distinguishing_aspect: |
          Trigger: DayTrade insert (4th in window with equity < $25K). Hop 1:
          DayTrade insert mutates Account.pdt_flag and trading_posture. Hop 2:
          that posture change ITSELF mutates Order.status (cancels non-terminal
          orders); the cancellation is caused by the Account mutation in hop 1, not
          by the original order action. Hop 3: that same posture change ITSELF
          mutates OptionsApproval.status (rejects non-terminal approvals). Depth 3
          chain from a single trigger.
        test_recipe:
          setup:
            - "Approved Customer + Account A with cash_balance_cents=2_499_900 and 3 existing DayTrade rows for today."
            - "Submit WORKING LIMIT Order O1."
            - "Submit OptionsApproval OA1 and POST start-review (status=UNDER_REVIEW)."
          trigger:
            - "POST /brokerage/orders MARKET BUY 1 share for A at 100 cents → fills."
            - "POST /brokerage/orders MARKET SELL 1 share for A at 100 cents → fills, creating 4th DayTrade."
          assert:
            - "Hop 1: Account.pdt_flag == true and trading_posture == 'PDT_FROZEN'"
            - "Hop 2: Order O1.status == 'CANCELLED'"
            - "Hop 3: OptionsApproval OA1.status == 'REJECTED'"

      - name: acat_completion_two_hop_cascade
        grounds:
          - state_machines.ACATTransfer.IN_TRANSIT_to_COMPLETED
          - state_machines.Account.TRANSFER_LOCKED_to_OPEN
          - entities.Account.fields.cash_balance_cents
          - entities.Account.fields.trading_posture
        distinguishing_aspect: |
          Different trigger from PDT cascade: SYSTEM time-gated completion when
          POST /brokerage/_clock/advance crosses expected_completion_at. Hop 1:
          clock advance mutates ACATTransfer.status to COMPLETED and credits/debits
          Account.cash_balance_cents (for OUTBOUND, deducts the requested_value).
          Hop 2: that cash mutation ITSELF causes Account.trading_posture to revert
          from TRANSFER_LOCKED to OPEN (caused by hop 1, not by the original clock
          advance directly). Depth 2 chain originating from a clock trigger —
          structurally different propagation pattern from the PDT 3-hop cascade.
        test_recipe:
          setup:
            - "Approved Customer + Account A with cash_balance_cents=10_000_000, no Orders."
            - "POST /brokerage/acat-transfers OUTBOUND for A, requested_value_cents=500_000 → INITIATED."
            - "POST /brokerage/acat-transfers/{id}/validate → VALIDATED, posture := TRANSFER_LOCKED, expected_completion_at = initiated_at + 6BD at 17:00 UTC."
            - "POST /brokerage/_clock/advance to one business day later → ACATTransfer transitions to IN_TRANSIT."
          trigger:
            - "POST /brokerage/_clock/advance seconds=sufficient_to_cross_expected_completion_at"
          assert:
            - "Hop 1: ACATTransfer.status == 'COMPLETED' AND Account.cash_balance_cents == 9_500_000 (debited by 500_000)"
            - "Hop 2: Account.trading_posture == 'OPEN' (reverted; caused by hop 1's cash/state mutation, not by the clock event directly)"
            - "Cascade originates from clock-advance trigger — different trigger entity than PDT cascade"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_pdt_before_margin
        grounds:
          - validations[priority=25]
          - validations[priority=29]
          - entities.Account.fields.pdt_flag
        distinguishing_aspect: |
          Category pair: state (ERR_PDT_EQUITY_BELOW_MINIMUM, priority 25) vs
          business_fiscal (ERR_INSUFFICIENT_MARGIN, priority 29). A single order
          submission can simultaneously fail BOTH: PDT-flagged account with equity
          $20K (under $25K floor) AND submits an order whose required margin
          exceeds cash balance. The scaffold pins state error wins because lower
          priority number = earlier check.
        test_recipe:
          setup:
            - "Approved Customer + Account A with account_type=MARGIN_REG_T, pdt_flag=true (manually set via 4 prior day trades), equity_value_cents=2_000_000 ($20K), cash_balance_cents=100_000 ($1K)."
          trigger:
            - "POST /brokerage/orders body={account_id:A, symbol:AAPL, instrument_type:EQUITY, side:BUY, order_type:LIMIT, quantity:100, limit_price_cents:15000}  # notional=1.5M cents, Reg T req=750K cents >> $1K cash"
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_PDT_EQUITY_BELOW_MINIMUM'  # priority 25, state category"
            - "error_id != 'ERR_INSUFFICIENT_MARGIN'  # priority 29, business_fiscal category — would also be true but state wins"

      - name: existence_vs_business_referential_close_account
        grounds:
          - validations[priority=5]
          - validations[priority=28]
          - entities.Account.fields.status
        distinguishing_aspect: |
          Category pair: existence (ERR_ACCOUNT_NOT_FOUND, priority 5) vs
          business_referential (ERR_ACCOUNT_HAS_DEPENDENCIES, priority 28) —
          structurally different from instance one's state/business_fiscal pair.
          A POST /brokerage/accounts/{id}/close call with a wholly nonexistent
          path id can never reach the dependency check; even when the test
          contrives both conditions (use a deleted id while open Orders exist on
          a SIBLING approved account), the scaffold pins existence wins. The two
          conflicts here exercise different error-category pairs from instance 1.
        test_recipe:
          setup:
            - "Approved Customer + Account A (with one WORKING Order O1 — would trigger ERR_ACCOUNT_HAS_DEPENDENCIES on close)."
          trigger:
            - "POST /brokerage/accounts/non-existent-uuid-deadbeef/close"
          assert:
            - "Response error_id == 'ERR_ACCOUNT_NOT_FOUND'  # priority 5, existence category"
            - "error_id != 'ERR_ACCOUNT_HAS_DEPENDENCIES'  # priority 28, business_referential — never reached because target id is missing"
            - "Compare with POST /brokerage/accounts/A/close (real id, open order) → returns 'ERR_ACCOUNT_HAS_DEPENDENCIES' confirming the second check exists and is reachable when existence passes"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: pdt_count_exactly_four
        grounds:
          - calculations.pdt_flag_check
          - entities.Account.fields.pdt_flag
        distinguishing_aspect: |
          Boundary: PDT_TRADE_THRESHOLD = 4 with operator >=. Count of DayTrades
          in rolling 5 business days == 3 → no flag; count == 4 → flag. Tests the
          exact `>=` vs `>` boundary on the count metric. Reached via POST /orders
          (MARKET) which inserts DayTrade and runs pdt_flag_check.
        test_recipe:
          setup:
            - "Approved Account A with cash_balance_cents=10_000_000 (above equity floor? No — set equity_value_cents=1_000_000 below floor by adjusting cash for boundary test). Re-set: cash_balance_cents=2_499_900 so equity remains < $25K."
            - "Insert 3 prior DayTrade rows for today via three matched MARKET BUY/SELL pairs."
          trigger:
            - "POST /brokerage/orders MARKET BUY then MARKET SELL on A → creates 4th DayTrade."
          assert:
            - "Before 4th day trade: Account.pdt_flag == false"
            - "After 4th day trade: Account.pdt_flag == true"
            - "Count threshold uses >= 4, not > 4"

      - name: options_eligibility_lnw_exactly_at_threshold
        grounds:
          - calculations.options_eligibility_max
          - entities.Customer.fields.liquid_net_worth_cents
        distinguishing_aspect: |
          Different metric (liquid_net_worth_cents money threshold, not a count)
          and different endpoint (POST /options-approvals/{id}/decide). Boundary:
          LEVEL_1_LNW_CENTS = 1_000_000 with operator >=. lnw=999_999 → max
          eligible=0; lnw=1_000_000 → max eligible=1. Distinct from the count
          boundary above.
        test_recipe:
          setup:
            - "Customer C_LOW: years_options_experience=0, liquid_net_worth_cents=999999. Account APPROVED."
            - "Customer C_AT:  years_options_experience=0, liquid_net_worth_cents=1000000. Account APPROVED."
            - "Submit OptionsApproval for each with requested_level=1; start-review."
          trigger:
            - "POST /brokerage/options-approvals/{C_LOW_OA}/decide body={decision:'APPROVE', approved_level:1}"
            - "POST /brokerage/options-approvals/{C_AT_OA}/decide body={decision:'APPROVE', approved_level:1}"
          assert:
            - "C_LOW decision returns error_id == 'ERR_OPTIONS_LEVEL_EXCEEDS_ELIGIBILITY' (lnw=999999 fails)"
            - "C_AT decision returns 200 with OptionsApproval.approved_level == 1 (lnw=1_000_000 passes >= threshold)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_submission_requires_account_open_posture
        grounds:
          - validations[priority=12]
          - state_machines.Order.ACCEPTED_to_WORKING
          - entities.Account.fields.trading_posture
        distinguishing_aspect: |
          Entity pair: Order ↔ Account. Order creation is gated by
          Account.trading_posture == OPEN. Same Order payload that succeeds when
          posture=OPEN fails with ERR_TRADING_FROZEN when posture=PDT_FROZEN or
          TRANSFER_LOCKED — Order's valid create transition depends on a different
          entity's state.
        test_recipe:
          setup:
            - "Account A approved, trading_posture=OPEN, sufficient cash."
            - "Manually trigger TRANSFER_LOCKED via OUTBOUND ACAT validate to flip posture."
          trigger:
            - "POST /brokerage/orders for A while trading_posture=TRANSFER_LOCKED"
          assert:
            - "Response error_id == 'ERR_TRADING_FROZEN'"
            - "Same payload after canceling the outbound transfer (posture reverts to OPEN) returns 201 Created"

      - name: acat_validate_requires_no_open_orders
        grounds:
          - validations[priority=27]
          - state_machines.ACATTransfer.INITIATED_to_VALIDATED
          - entities.Order.fields.status
        distinguishing_aspect: |
          Different entity pair: ACATTransfer ↔ Order. ACATTransfer's
          INITIATED→VALIDATED transition is blocked if any Order on the same Account
          is in {ACCEPTED, WORKING}. This is a different pair (ACAT/Order) from the
          first instance's (Order/Account) dependency.
        test_recipe:
          setup:
            - "Account A approved, OPEN. Submit LIMIT Order O1 → status=WORKING."
            - "POST /brokerage/acat-transfers OUTBOUND for A → status=INITIATED."
          trigger:
            - "POST /brokerage/acat-transfers/{id}/validate as ComplianceOfficer"
          assert:
            - "Response error_id == 'ERR_OPEN_ORDERS_BLOCK_TRANSFER'"
            - "After DELETE /brokerage/orders/O1, second validate call returns 200 and transfer.status == 'VALIDATED'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: day_trade_rolling_window_inclusive_both_ends
        grounds:
          - calculations.pdt_flag_check
          - entities.DayTrade.fields.trade_date
        distinguishing_aspect: |
          Interval semantics: rolling 5-business-day window with INCLUSIVE
          boundaries on both ends (today and today-4BD). Adjacency rule: a
          DayTrade exactly 5 business days ago is OUT of the window; exactly 4
          business days ago is IN. The window's geometric treatment is "closed-
          closed on business-day grid, weekends excluded entirely."
        test_recipe:
          setup:
            - "Account A approved with equity_value_cents < $25K."
            - "Insert 3 DayTrade rows: one with trade_date = today-3BD, one today-4BD, one today-5BD."
          trigger:
            - "POST /brokerage/orders MARKET BUY then SELL on A today → 4th DayTrade inserted with trade_date=today."
          assert:
            - "Account.pdt_flag == false  # today-5BD DayTrade is OUT (window is 5 BD inclusive = today, today-1, today-2, today-3, today-4); count in window == 3"
            - "After also inserting a synthetic DayTrade with trade_date = today-4BD, repeating the trigger flips pdt_flag to true (count in window == 4)"

      - name: acat_outbound_no_overlap_with_existing_pending
        grounds:
          - validations[priority=26]
          - concurrency_rules[transfer_already_pending]
          - entities.ACATTransfer.fields.status
          - entities.ACATTransfer.fields.direction
        distinguishing_aspect: |
          Different interval semantics on a different resource entity (ACATTransfer
          vs DayTrade). Here the "interval" is the resource occupation period from
          INITIATED to a terminal state — adjacency rule: only ONE OUTBOUND
          ACATTransfer per Account can occupy this period at a time. Geometric
          treatment is "non-overlapping occupations on the OUTBOUND lane" — distinct
          from a rolling time window. Two terminal transfers can be back-to-back
          (zero buffer), but two non-terminal cannot overlap.
        test_recipe:
          setup:
            - "Account A approved. POST /brokerage/acat-transfers OUTBOUND #1 → INITIATED."
          trigger:
            - "POST /brokerage/acat-transfers OUTBOUND #2 for same Account A."
          assert:
            - "Response error_id == 'ERR_TRANSFER_ALREADY_PENDING'"
            - "After DELETE /brokerage/acat-transfers/{id-of-#1} (status → CANCELLED), POST #2 returns 201"
            - "Two simultaneously COMPLETED transfers back-to-back: allowed (no overlap once first is terminal)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancel_order_preserves_cash_balance
        grounds:
          - state_machines.Order.ACCEPTED_to_CANCELLED
          - state_machines.Order.WORKING_to_CANCELLED
          - entities.Account.fields.cash_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Account.cash_balance_cents. Forward action
          (POST /orders creating a WORKING LIMIT order) must NOT debit cash; the
          compensating action (DELETE /orders/{id} CANCEL) must also leave cash
          unchanged. Invariant: cash_balance_cents BEFORE POST equals
          cash_balance_cents AFTER DELETE. A scaffold that mistakenly debits cash
          on order submission and refunds on cancellation could drift if either
          half is wrong; pinning the invariant as "no debit at all" prevents drift.
        test_recipe:
          setup:
            - "Account A approved, cash_balance_cents=10_000_000."
          trigger:
            - "POST /brokerage/orders LIMIT BUY 100 AAPL @ $150 (Reg T notional=1.5M, margin req computed but cash not debited)."
            - "DELETE /brokerage/orders/{id}"
          assert:
            - "After POST: Account.cash_balance_cents == 10_000_000 (unchanged)"
            - "After DELETE: Account.cash_balance_cents == 10_000_000 (unchanged)"
            - "Invariant: cash_balance_cents_BEFORE == cash_balance_cents_AFTER == 10_000_000"

      - name: cancel_outbound_acat_preserves_position_count
        grounds:
          - state_machines.ACATTransfer.INITIATED_to_CANCELLED
          - state_machines.ACATTransfer.VALIDATED_to_CANCELLED
          - state_machines.Account.OPEN_to_TRANSFER_LOCKED
          - state_machines.Account.TRANSFER_LOCKED_to_OPEN
          - entities.Account.fields.equity_value_cents
        distinguishing_aspect: |
          Different conserved quantity: Account.equity_value_cents (market value
          of long EQUITY positions plus cash). Forward action: POST OUTBOUND ACAT
          + validate (does NOT move funds yet; only validate locks posture).
          Compensating action: DELETE the OUTBOUND transfer in VALIDATED state.
          Invariant: equity_value_cents BEFORE POST equals equity_value_cents
          AFTER DELETE — no value leaks during the lock/unlock cycle even though
          posture flipped TRANSFER_LOCKED then back to OPEN. Distinct conserved
          quantity from cash_balance_cents (cash) — equity is the broader portfolio
          mark-to-market.
        test_recipe:
          setup:
            - "Account A approved with cash_balance_cents=10_000_000 and one prior FILLED EQUITY Order: BUY 10 AAPL @ $100 (1_000_000 cents). equity_value_cents = 10_000_000 + 10*10000 = 11_000_000."
          trigger:
            - "POST /brokerage/acat-transfers OUTBOUND for A, requested_value_cents=500_000."
            - "POST /brokerage/acat-transfers/{id}/validate."
            - "DELETE /brokerage/acat-transfers/{id}."
          assert:
            - "Before POST: Account.equity_value_cents == 11_000_000"
            - "After validate: Account.trading_posture == 'TRANSFER_LOCKED', equity_value_cents == 11_000_000 (unchanged)"
            - "After DELETE: Account.trading_posture == 'OPEN' (revert), equity_value_cents == 11_000_000"
            - "Invariant: equity_value_cents_BEFORE == equity_value_cents_AFTER == 11_000_000"
