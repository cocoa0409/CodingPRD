      - name: emission_posture_flips_to_restricted_at_exactly_the_0_8500_utilization_ratio
        claim_type: Constants Applied
        grounds:
          - calculations.plant_compliance_posture
          - calculations.plant_compliance_posture.constants.POSTURE_RESTRICTED_RATIO
          - entities.Plant.fields.emission_utilization_ratio
          - validations[ERR_PLANT_RESTRICTED]
        distinguishing_aspect: "POSTURE_RESTRICTED_RATIO 0.8500 is inclusive: a 255.00 g reservation against a 300.00 g allowance lands the ratio on exactly 0.8500, which is enough to leave OPEN for RESTRICTED, and RESTRICTED is narrow - it refuses the run start with ERR_PLANT_RESTRICTED while every non-formation write stays legal."
        test_recipe:
          setup:
            - "One plant whose monthly_lead_emission_permit_g is 300.00 g (not 100000.00 g), an APPROVED LEAD_ACID design, a 20.00 kW bay and a quantity-9 lot already advanced to FORMATION while the posture was still OPEN."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 300.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
