      - name: dispute_pauses_interest_accrual
        claim_type: correct_result
        grounds: [calculations.late_interest_accrual, state_machines.Receivable.OPEN_to_DISPUTED, state_machines.Receivable.DISPUTED_to_OPEN]
        distinguishing_aspect: "Interest freezes while DISPUTED: day 61 accrues 116; 10 dispute days add nothing; after resolve, billable days = days_outstanding - 60 - total_disputed_days, so day 76 yields round(425000 * 0.10/365 * 6) = 699, not 1863."
        test_recipe:
          setup: ["INVOICE award (apr 1000 bps): TRAVEL 100000 + MATERIALS 50000 + EQUIPMENT 200000 (obligated 425000); three postings; receivable 425000 created at 2026-08-01"]
