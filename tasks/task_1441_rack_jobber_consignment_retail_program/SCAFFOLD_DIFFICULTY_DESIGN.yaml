            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 10, scanned_at: "2026-08-01T10:00:00Z", client_event_id: "s-1" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { stmt: "$.data.id", st_v1: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "POST /settlement-statements/${stmt}/finalize", payload: { expected_settlement_statement_version: "${st_v1}" }, as: JobberFinance, as_user_id: "fin-1" }
            - { call: "POST /settlement-statements/${stmt}/dispute", payload: { reason: "retailer disputes shrink line" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /settlement-statements/${stmt}/revise", payload: {}, as: JobberFinance, as_user_id: "fin-1", captures: { st_v4: "$.data.version" } }
            - { call: "POST /settlement-statements/${stmt}/finalize", payload: { expected_settlement_statement_version: "${st_v4}" }, as: JobberFinance, as_user_id: "fin-1" }
          assert:
            - "status path: PROVISIONAL -> FINALIZED -> DISPUTED -> PROVISIONAL -> FINALIZED (cycle traversed)"
            - "variant_used flips PROVISIONAL -> FINAL -> PROVISIONAL -> FINAL"
            - "version increments by exactly 1 per transition: 1 -> 2 -> 3 -> 4 -> 5"
            - "net_payable_to_jobber_cents == 1500 after both finalizations (recomputation is stable)"

      - name: visit_counts_dispute_recount_cycle
