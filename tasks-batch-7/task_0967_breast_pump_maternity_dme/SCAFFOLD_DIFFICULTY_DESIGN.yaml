  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_benefit_period_half_open_overlap
        grounds:
          - "validations[priority=9]"
          - entities.InsurancePolicy.fields.benefit_period_start
          - entities.InsurancePolicy.fields.benefit_period_end
        distinguishing_aspect: |
          Resource: the member's policy timeline; semantics: half-open interval overlap —
          [2026-06-01, 2027-06-01) collides with existing [2026-01-01, 2027-01-01) and is
          rejected, while adjacency (new start == existing end, 2027-01-01) is permitted.
        test_recipe:
          setup:
            - "Member with ACTIVE policy A covering [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
