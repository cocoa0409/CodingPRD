      - name: dismissal_appeal_reversed_incompatible_then_reinstated
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_APPEAL_OUTCOME_INCOMPATIBLE]", state_machines.Appeal.UNDER_REVIEW_to_REINSTATED, state_machines.Case.DISMISSED_to_AWAITING_FORMAL_COMPLAINT]
        distinguishing_aspect: "Outcome/target compatibility matrix: REVERSED on a DISMISSAL appeal is rejected ERR_APPEAL_OUTCOME_INCOMPATIBLE; the correct REINSTATED outcome then succeeds and the case returns DISMISSED -> AWAITING_FORMAL_COMPLAINT with dismissal_reason and closed_at cleared."
        test_recipe:
          setup: ["case DISMISSED (MANDATORY_NO_JURISDICTION); dismissal appeal UNDER_REVIEW with assigned officer"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "AO One", university_id: "U-AO-1", role_type: "STAFF", email: "ao1@example.edu" }, as: CaseAdministrator, captures: { ao_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_HARASSMENT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: false, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/dismiss", payload: { dismissal_reason: "MANDATORY_NO_JURISDICTION", refer_to_conduct: false }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - call: "POST /api/cases/${case_id}/appeals"
              payload: { filed_by_side: "COMPLAINANT", appeal_target: "DISMISSAL", grounds: ["PROCEDURAL_IRREGULARITY"], statement: "Review the dismissal" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /api/appeals/${app_id}/begin-review", payload: { appeal_officer_id: "${ao_id}" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /api/appeals/${app_id}/decide", payload: { outcome: "REVERSED" }, as: AppealOfficer, as_user_id: "${ao_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/appeals/${app_id}/decide", payload: { outcome: "REINSTATED" }, as: AppealOfficer, as_user_id: "${ao_id}", captures: { app_st: $.data.status } }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_st: $.data.status, dr: $.data.dismissal_reason, ca: $.data.closed_at } }
          assert:
            - "REVERSED on a DISMISSAL appeal rejected 422 ERR_APPEAL_OUTCOME_INCOMPATIBLE; appeal stays UNDER_REVIEW"
            - "REINSTATED accepted: Appeal.${app_id}.status == REINSTATED"
            - "Case.${case_id}.status == AWAITING_FORMAL_COMPLAINT with dismissal_reason null and closed_at null (reinstatement fully reopens the pre-dismissal state)"

