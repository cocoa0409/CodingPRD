      - name: bonded_report_amend_cycle_completes
        claim_type: valid_transition
        grounds:
          - "state_machines.BondedPeriodReport"
        distinguishing_aspect: "The full compliance loop executes: OPEN -> RECONCILED -> FILED -> REJECTED -> AMENDED -> FILED -> ACCEPTED, with the preparer/filer and the compliance officer being different X-User-IDs."
        test_recipe:
          setup: ["Report with past period [2026-01-01, 2026-07-01) created at the default clock 2026-09-01."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BondedPreparer
              as_user_id: "prep-1"
              captures: { rep_id: $.data.id }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/reconcile", as: BondedPreparer, as_user_id: "prep-1" }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/file", as: BondedPreparer, as_user_id: "prep-1" }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/reject", as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/amend", as: BondedPreparer, as_user_id: "prep-1" }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/file", as: BondedPreparer, as_user_id: "prep-1" }
            - { call: "POST /barrel-aging/bonded-reports/${rep_id}/accept", as: ComplianceOfficer, as_user_id: "officer-1" }
          assert:
            - "after amend: state == AMENDED (REJECTED -> AMENDED loop edge)"
            - "after second file: state == FILED (AMENDED -> FILED loop edge)"
            - "after accept: state == ACCEPTED and decided_by_user_id == 'officer-1'"
            - "BondedPeriodReport.${rep_id}.version == 7 (create 1, reconcile 2, file 3, reject 4, amend 5, file 6, accept 7)"

      - name: aborted_batch_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.BlendBatch"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "ABORTED is terminal: validate on an aborted batch is rejected; no component or volume state changes."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel min_maturation_months 0; label ACTIVE with age_statement_years 1; batch (bottling 2030-09-01) with one component drawn 10.0; batch validated then aborted."]
