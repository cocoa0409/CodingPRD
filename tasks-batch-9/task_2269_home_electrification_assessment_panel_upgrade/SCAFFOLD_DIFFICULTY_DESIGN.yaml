      - name: conditional_pass_reduction_floors_each_final_line
        grounds:
          - calculations.measure_line_incentive.constants.CONDITIONAL_REDUCTION_PCT
          - state_machines.Inspection.SCHEDULED_to_CONDITIONAL_PASS
          - entities.RebateProject.fields.conditional_pass_flag
          - endpoints.POST_/inspections/{id}/result
        distinguishing_aspect: |
          A fourth metric on a fourth endpoint: the FLOOR of the 10%
          conditional-pass reduction, tested on POST /inspections/{id}/result.
          The final line before reduction is deliberately 700001, an odd cent
          count, so the reduction lands on 630000.9 and must floor to 630000 —
          not round to 630001, and not truncate the cost basis instead of the
          line. The instance also pins the CONDITIONAL_PASS entry condition,
          deficiency_severity_max <= 2.
        test_recipe:
          setup:
            - "An OPEN program with low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000, group_cap_cents 800000 and quality_suspension_threshold 0."
