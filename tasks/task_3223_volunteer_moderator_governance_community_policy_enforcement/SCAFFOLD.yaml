      - "status=COORDINATED, started_at_utc=logical clock"
      - "exemption_granted_until_utc copies the community's protest_exemption_until_utc"
      - "the Community ACTIVE_to_PROTEST_RESTRICTED transition fires with restricted_since_utc=logical clock"
      - "increments Community.version by 1"

  - method: POST
    path: "/api/communities/{id}/protests/{protestId}/end"
    description: "End a protest and restore the community's access"
    roles: [Moderator, PlatformAdmin]
    code: 200
    input: []
    output: ProtestEvent
    side_effects:
      - "status=ENDED, ended_at_utc=logical clock"
      - "when the community was PROTEST_RESTRICTED the Community PROTEST_RESTRICTED_to_ACTIVE transition fires with restricted_since_utc=null"
      - "increments Community.version by 1"

  - method: POST
    path: "/api/community-administration/policy-advisories"
    description: "Issue an administrator policy advisory during a protest, arming a 7-day moratorium"
    roles: [PlatformAdmin]
    code: 200
    input: ["community_id"]
    output: Community
    side_effects:
      - "Community.protest_exemption_until_utc = logical clock + 7 days"
      - "every COORDINATED ProtestEvent of the community copies the new exemption into exemption_granted_until_utc"
      - "Community stays PROTEST_RESTRICTED"
      - "increments Community.version by 1"

  - method: POST
    path: "/api/community-administration/regulation-cadences"
    description: "Record an administrator regulation cadence over a community in institution negotiation"
    roles: [PlatformAdmin]
    code: 200
    input: ["community_id"]
    output: Community
    side_effects:
      - "the cadence timestamp is recorded for the community and suppresses the 30-day INSTITUTION_NEGOTIATION_to_QUARANTINED auto-transition"
      - "increments Community.version by 1"

  - method: POST
    path: "/api/community-administration/institution-negotiations"
    description: "Place a restricted community under institution negotiation"
    roles: [PlatformAdmin]
    code: 200
    input: ["community_id"]
    output: Community
    side_effects:
      - "Community state=RESTRICTED_to_INSTITUTION_NEGOTIATION with restricted_since_utc preserved"
      - "increments Community.version by 1"

  - method: POST
    path: "/api/community-administration/decision-audits"
    description: "Audit a decision that required cross-power approval"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision_id"]
    output: ContentDecision
    side_effects:
      - "ContentDecision RECORDED_to_AUDITED with an audit entry appended to audit_log_ref"
      - "Community ACTIVE_to_ACTIVE self-loop recompute fires"

  - method: POST
    path: "/api/community-administration/decision-revisions"
    description: "Reverse a decision after an audit, unwinding its sanction"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision_id"]
    output: ContentDecision
    side_effects:
      - "ContentDecision AUDITED_to_REVISED"
      - "the issuing AccountSanction -> status=LIFTED with sanitized_on_utc=logical clock"
      - "Account.karma_points and Account.account_sanction_index recomputed"
      - "every ContentReport this decision moved out of OPEN returns to status=OPEN unless already RESOLVED_LOCKED"
      - "Community.open_report_weight, Community.applying_sanction_count and Community.health_index recomputed"

  - method: POST
    path: "/api/community-administration/decision-reaudits"
    description: "Re-audit a revised decision and close the revision cycle"
    roles: [PlatformAdmin]
    code: 200
    input: ["decision_id"]
    output: ContentDecision
    side_effects:
      - "ContentDecision REVISED_to_AUDITED with a second audit entry appended to audit_log_ref"

  - method: POST
    path: "/api/community-administration/archivals"
    description: "Archive a quarantined community"
    roles: [PlatformAdmin]
    code: 200
    input: ["community_id"]
    output: Community
    side_effects:
      - "Community QUARANTINED_to_ARCHIVED"
      - "every ACTIVE Moderator -> status=RESIGNED with removal_reason_code=ADMIN_ARCHIVAL"
      - "every TeamSuccession not COMPLETED -> COMPLETED with completion_reason=ALL_MODERATORS_INACTIVE"
      - "every Post -> status=LOCKED"
      - "every REQUESTED or COORDINATED ProtestEvent -> ENDED"
      - "increments Community.version by 1"

  - method: GET
    path: "/api/communities/{id}/escalations"
    description: "List the escalation records raised against this community's local rules"
    roles: [Moderator, PlatformAdmin, ContentReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ rule_id: string, escalation_note: string, escalated_at_utc: datetime }[]"
    side_effects: []

  - method: GET
    path: "/api/moderators/{id}/actions"
    description: "List the recorded moderation actions attributed to this moderator row"
    roles: [Moderator, PlatformAdmin, SuccessionAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ moderator_id: string, action_kind: string, action_at_utc: datetime }[]"
    side_effects: []

  - method: GET
    path: "/api/communities/{id}/account-sanctions"
    description: "List the sanctions issued by decisions of this community"
    roles: [Moderator, PlatformAdmin, ContentReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccountSanction[]
    side_effects: []

  - method: GET
    path: "/api/communities/{id}/appeals"
    description: "List the appeals filed against sanctions issued by this community"
    roles: [Moderator, PlatformAdmin, ContentReviewer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role absent or not a declared role, or X-User-ID absent"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not permitted for the operation, or an entity_backed actor does not own or moderate the target resource"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same moderator would both author the most recent succession discussion round and open the following dispute, or would demote themselves"

  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "the community id path segment does not resolve to a community"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "a nested resource id, a referenced backlog item, or another referenced identifier does not resolve inside the community"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_community_version or expected_moderator_version does not equal the persisted version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is in a state that does not admit the requested operation"

  - id: ERR_DUPLICATE_COMMUNITY_NAME
    http: 409
    condition: "a community already exists with this name and a state other than CLOSED"

  - id: ERR_DUPLICATE_RULE_CODE
    http: 409
    condition: "an ACTIVE community rule already uses this rule_code"

  - id: ERR_RULE_CONFLICT
    http: 409
    condition: "a local rule conflicts with the sitewide policy floor: is_sitewide_floor true with rule_band below the floor band, or a local band raised above the floor that must be escalated"

  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "a protest is approved twice by the same account, or coordinate runs with quorum_approval_count below required_quorum_count"

  - id: ERR_CROSS_POWER_QUORUM_NOT_MET
    http: 409
    condition: "coordinate runs with distinct_power_count below 2"

  - id: ERR_PRIVATE_PROTEST_FORBIDDEN
    http: 409
    condition: "a protest is requested or coordinated with requested_access_mode PRIVATE"

  - id: ERR_TOP_MODERATOR_REMOVAL_FORBIDDEN
    http: 409
    condition: "an is_top_moderator moderator is removed for inactivity while no TeamSuccession is COMPLETED"

  - id: ERR_FINAL_MODERATOR_REMOVAL
    http: 409
    condition: "a removal would leave the community with no other ACTIVE moderator"

  - id: ERR_INACTIVITY_REMOVAL_NOT_JUSTIFIED
    http: 409
    condition: "the moderator's inactivity anchor is fewer than 90 days before the logical clock"

  - id: ERR_PENDING_HANDOVER
    http: 409
    condition: "a moderator is reinstated from DEMOTED while the community has no ACTIVE top moderator"

  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "an appeal is submitted 7 days or more after it was filed"

  - id: ERR_PRECEDENT_EXPIRED
    http: 409
    condition: "an appeal is decided at or after its deadline_utc"

  - id: ERR_NO_NEW_EVIDENCE
    http: 422
    condition: "an appeal is granted with neither new_evidence_url nor sanction_misapplication_present"

  - id: ERR_ACTIVE_SANCTION_CONFLICT
    http: 409
    condition: "a reinstatement targets a sanction that is already ACTIVE, or whose issuing community is QUARANTINED"

  - id: ERR_REINSTATEMENT_CONDITIONS_UNMET
    http: 409
    condition: "health_index below 70.00, inactive_moderator_count above 0, active_top_moderator_count below 1, the 90-day quarantine clock, or an OPEN tier-3 report — any one unsatisfied condition blocks the reinstatement"

  - id: ERR_BRIGADE_EVIDENCE_INCOMPLETE
    http: 409
    condition: "a brigade cluster is escalated while evidence_complete is false, that is while overlap_ratio is below 0.30"

  - id: ERR_BRIGADE_SEVERITY_TOO_LOW
    http: 409
    condition: "a brigade cluster is escalated with signal_severity_band below 3"

  - id: ERR_COOLING_OFF_ACTIVE
    http: 409
    condition: "a brigade revival runs fewer than 7 days after the cluster's detected_at_utc"

  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "the account path segment or the subject account of a decision does not resolve"

  - id: ERR_SANCTION_NOT_FOUND
    http: 404
    condition: "the appealed or reinstated sanction_id does not resolve, or does not belong to the account in the path"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum member is outside its declared set, or a numeric field is outside its declared range, including participant_count below 1"

  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit is below 1 or above 100, or offset is negative"

  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "the protest id path segment does not resolve inside the community"

  - id: ERR_ACCOUNT_WIDE_CONFLICT
    http: 409
    condition: "a duplicate account-wide sanction is applied for an account that already carries an ACTIVE account-wide sanction of the same decision_outcome in the same community"

  - id: ERR_ARCHIVED_COMMUNITY
    http: 409
    condition: "any mutating operation targets a community whose state is ARCHIVED"

# =============================================================================
# §1.7 RBAC Role Permission Matrix
# =============================================================================
roles:

  - name: Account
    description: "A reddit account. Owns posts, files content reports, and appeals its own account sanctions."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /api/accounts/{id}/appeals — file an appeal, for its own account only"
      - "POST /api/accounts/{id}/appeals/{appealId}/submit — submit its own appeal"
    shared_operations:
      - "POST /api/communities — create a community"
      - "GET /api/communities and /api/communities/{id} — read communities"
      - "POST /api/communities/{id}/posts — publish a post"
      - "GET /api/communities/{id}/posts and /api/accounts/{id}/posts — read posts"
      - "POST /api/communities/{id}/content-reports — file a report"
      - "GET /api/accounts/{id}, /api/accounts/{id}/sanctions, /api/accounts/{id}/appeals — read its own account state"

  - name: Moderator
    description: "A volunteer moderator acting through a Moderator row of some community. Moderates its own community only."
    identity: "entity_backed:Moderator"
    exclusive_operations:
      - "POST and PUT /api/communities/{id}/rules — author and amend local rules"
      - "POST /api/communities/{id}/escalations — escalate a local rule conflict"
      - "POST /api/communities/{id}/moderators and every moderator mutation endpoint, including /remove, /resign, /demote and /reinstate"
      - "POST /api/communities/{id}/successions and its /discussions, /disputes endpoints"
      - "POST /api/communities/{id}/content-decisions — record content decisions"
      - "POST /api/communities/{id}/automated-detection-backlog-items — record detections"
      - "POST /api/communities/{id}/protests and its /approvals, /coordinate, /end endpoints"
      - "POST /api/communities/{id}/brigade-clusters and its /dismiss endpoint"
      - "POST /api/communities/{id}/reinstatement-requests — request release from restriction"
    shared_operations:
      - "POST /api/communities — create a community, becoming its first top moderator"
      - "POST /api/communities/{id}/moderators, shared with PlatformAdmin"
      - "GET /api/communities/{id}/content-reports and /content-decisions — read the moderation queue"
      - "GET /api/moderators/{id} and /api/moderators/{id}/approvals — read the team"

  - name: PlatformAdmin
    description: "A platform operator. Intervenes when local moderation conflicts with sitewide policy, audits decisions and controls community posture. Not tied to any persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /api/community-administration/account-sanctions — apply an account-wide sanction"
      - "POST /api/community-administration/sanction-reinstatements — reactivate a lifted sanction"
      - "POST /api/community-administration/appeal-referrals — refer and return appeals"
      - "POST /api/accounts/{id}/appeals/{appealId}/decide — grant or deny an appeal"
      - "POST /api/community-administration/brigade-escalations and /brigade-revivals — escalate and revive brigade clusters"
      - "POST /api/community-administration/decision-audits, /decision-revisions and /decision-reaudits — audit, reverse and re-audit decisions"
      - "POST /api/community-administration/policy-advisories, /regulation-cadences, /institution-negotiations and /archivals — posture and platform response"
      - "POST /api/communities/{id}/successions/{successionId}/prevent — govern a blocked handover"
      - "POST /_clock/set_current_utc — advance the logical clock"
    shared_operations:
      - "POST /api/communities — create a community"
      - "GET on every read endpoint"
      - "POST /api/communities/{id}/rules, /moderators, /content-reports, /content-decisions, /protests and their sub-resources"

  - name: Anonymous
    description: "An unauthenticated reader. Reaches only the endpoints that declare it."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /api/communities and /api/communities/{id} — read public community posture"

  - name: ContentReviewer
    description: "A platform trust-and-safety reviewer. Reads the detection backlog, reports and decisions across communities but records no decisions of its own."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /api/communities and /api/communities/{id} — read communities"
      - "GET /api/communities/{id}/content-reports, /content-decisions, /automated-detection-backlog-items and /brigade-clusters — read detection history"
      - "GET /api/accounts/{id}, /api/accounts/{id}/sanctions and /api/accounts/{id}/appeals — read sanction history"

  - name: SuccessionAuditor
    description: "A platform governance auditor. Reads succession records and the moderator team to adjudicate top-moderator disputes, and may pass a succession block through the same dispute endpoint as a moderator."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /api/communities/{id}/successions and /successions/{successionId} — read successions"
      - "GET /api/communities/{id}/moderators and /moderators/{moderatorId} — read the team"
      - "GET /api/moderators/{id} — read a moderator row"
      - "POST /api/communities/{id}/successions/{successionId}/disputes — open a dispute"