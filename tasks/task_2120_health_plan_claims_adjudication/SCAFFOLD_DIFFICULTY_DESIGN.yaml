            - "BenefitPlan XENT-1 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Nu Clinic; fee schedule rate 73721 = 40000 cents effective 2026-01-01."
            - "Member M-XENT-1 has exactly one coverage segment [2026-01-01, 2026-02-01), so the member-has-coverage check at priority 60 passes but no interval contains 2026-02-10."
            - "Claim CLM-XENT-1 was accepted at intake with coverage_id null and cob_role PRIMARY, and carries one 73721 line, 1 unit, billed 60000, service date 2026-02-10."
