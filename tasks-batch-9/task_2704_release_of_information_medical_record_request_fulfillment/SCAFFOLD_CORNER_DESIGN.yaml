        grounds:
          - validations.priority_33
          - errors.ERR_DUPLICATE_MRN
        distinguishing_aspect: >
          Uniqueness is on the PAIR (facility_id, mrn), so the identical MRN is a 409
          on the same facility and a 201 on a second facility — the negative and the
          positive leg differ in exactly one field of the composite key.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one CA fee rule; two facilities under it; one patient MRN-3001 already created at facility A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
