              as: Prescriber
              captures: { rx4: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { total_before: $.data.total_copay_cents }
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
            - call: "POST /pharmacy/prescriptions/${rx3}/regimen-change"
              payload: { new_drug_name: "Empagliflozin", new_form: "TABLET", new_copay_tier: "SPECIALTY", new_dose_times: ["EVENING"], new_quantity_per_dose: 1, expected_prescription_version: "${rx3_ver}", change_reason: "eGFR decline" }
              as: Prescriber
              captures: { rx3b: $.data.id }
