  - rule_id: transitive_cascade
    instances:

      - name: bed_return_conversion_cascades_five_levels_to_voided_claim
        grounds:
          - state_machines.EscalationEvent.TIER4_OPEN_to_BED_RETURN_CONVERTED
          - state_machines.Episode.ESCALATED_to_RETURNED_TO_FACILITY
          - state_machines.DeviceKit.DEPLOYED_to_IN_REFURB
          - state_machines.DailyComplianceRecord.PENDING_to_CARVED_OUT
          - state_machines.BillingClaim.BUILT_to_VOIDED
          - state_machines.BedReservation.HELD_to_OCCUPIED
          - state_machines.MealPlan.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          CASCADE C1, depth 5, triggered by POST /escalation-events/{id}/convert-bed-return: the
          escalation flips BED_RETURN_CONVERTED, which flips the Episode to RETURNED_TO_FACILITY,
          which releases the DeviceKit to IN_REFURB, which marks the current-date
          DailyComplianceRecord kit_deployed_all_day false and carves it out, which voids the
          BUILT BillingClaim. Each link is caused by the previous link, not by the original call.
