            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 5000, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 8000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 8000 }, as: PurchasingManager }
