  # ==========================================================================
  # RULE 3 — non_linear_state_machine
  # Instance (i) exercises the Keg machine (two parallel dimensions plus the
  # QUARANTINED <-> IN_SERVICE loop). Instance (ii) exercises the
  # ReconciliationClaim machine (SUBMITTED <-> COUNTERED cycle with a round cap).
  # Different entities, different non-linear shapes.
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: keg_parallel_custody_and_service_dimensions_with_quarantine_retest_loop
        grounds:
          - state_machines.Keg.custody_state
          - state_machines.Keg.service_state
          - state_machines.ServiceCycle
          - entities.Keg.fields.service_state
          - entities.Keg.fields.fills_at_last_pressure_test
          - entities.ServiceCycle.fields.quarantine_reason
          - validations.priority_25_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Entity: Keg. Non-linearity is of the parallel + loop kind. custody_state and
          service_state are two independent dimensions driven by the SAME record-step calls,
          and they deliberately move out of step: a FILL advances custody FILLED but leaves
          service_state SERVICE_OK (1 fill is far below PRESSURE_TEST_INTERVAL_FILLS 25); a
          FAIL pressure test drives custody to QUARANTINED and service to SERVICE_FAILED
          together; the PASS retest returns custody to IN_SERVICE but leaves service_state
          stuck at SERVICE_FAILED; only the release clears service_state. The cycle itself
          loops INSPECTED -> QUARANTINED -> PRESSURE_TESTED, which is not reachable in any
          forward-only reading of the machine.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z; every sub-timestamp below is earlier the same day."
            - "Pool with four kegs so a single allocation keeps posture OPEN at 75.00."
            - "ServiceCenter with concurrent_cycle_capacity 2 and intake_buffer_hours 4 so the single intake is never blocked."
            - "Two distinct technician user ids because validation 25 forbids the pressure tester from releasing the cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
