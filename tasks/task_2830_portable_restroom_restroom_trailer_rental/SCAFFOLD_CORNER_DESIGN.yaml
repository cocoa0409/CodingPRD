              captures: { posture_after_submit: $.data.site_posture, permit_status_after_submit: $.data.permit_status }
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-12501" }
              as: ComplianceOfficer
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_after_approve: $.data.site_posture, permit_status_after_approve: $.data.permit_status }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { quoted_in_write: $.data.quoted_cents, net_in_write: $.data.net_billable_cents, credit_in_write: $.data.credit_accrued_cents, debits_in_write: $.data.charge_debits_cents }
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_id}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 600 }
              as: DispatchPlanner
              captures: { units_in_write: $.data.units_on_route }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: DispatchPlanner
              captures: { committed_next_read: $.data.committed_units, planned_next_read: $.data.density_planned_pct, realized_next_read: $.data.density_realized_pct }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: DispatchPlanner
              captures: { deployed_next_read: $.data.deployed_unit_count }
            - call: "POST /charge-events"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_id}", charge_kind: "TIP_OVER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { charge_amount_in_write: $.data.amount_cents }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { debits_next_read: $.data.charge_debits_cents, net_next_read: $.data.net_billable_cents }
            - call: "GET /service-sites/${site_id}"
              payload: {}
              as: SalesRep
              captures: { posture_next_read: $.data.site_posture }
          assert:
            - "at creation the derived fields are already present and zeroed rather than absent: ${posture_at_create} == RESTRICTED, ${permit_status_at_create} == NONE, ${deployed_at_create} == 0, ${committed_at_create} == 0, ${planned_at_create} == 0, ${realized_at_create} == 0, ${quoted_at_create} == 0, ${net_at_create} == 0"
            - "${permit_status_after_submit} == PENDING and ${posture_after_submit} == RESTRICTED on the FIRST read after the submit"
            - "${permit_status_after_approve} == APPROVED and ${posture_after_approve} == OPEN on the FIRST read after the approval"
            - "${quoted_in_write} == 181500, ${credit_in_write} == 0, ${debits_in_write} == 0 and ${net_in_write} == 181500 — the quote response itself carries the ledger, not just the id"
            - "${units_in_write} == 13 — the schedule write response already carries its frozen derived count"
            - "${committed_next_read} == 13, ${planned_next_read} == 65 (floor(13 / 20 * 100)) and ${realized_next_read} == 0 on the first read of the route after the link"
            - "${deployed_next_read} == 1 on the first read of the site after activation moved the deployment to DEPLOYED"
            - "${charge_amount_in_write} == 27500 — TIP_OVER base at strike multiplier 100%, returned by the write itself"
            - "${debits_next_read} == 27500 and ${net_next_read} == 209000 (181500 + 27500 - 0) on the first contract read after the charge"
            - "${posture_next_read} == RESTRICTED on the first site read after the charge — the open tip-over propagated across aggregates with no lag"
