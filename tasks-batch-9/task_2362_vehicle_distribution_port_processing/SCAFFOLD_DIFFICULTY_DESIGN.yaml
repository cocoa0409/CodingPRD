              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_id}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp2_id: $.data.id }
          trigger:
            - call: "POST /vpc/quality-inspections/${insp2_id}/complete"
              payload: { outcome: "FAIL", defect_count: 2 }
              as: QualityInspector
              as_user_id: "u-qc-1"
          assert:
            - "${status_after_install} == ACCESSORY_IN_PROGRESS and ${damage_after_install} == SURVEY_DAMAGE_OPEN — the kitting trigger moved only the processing dimension"
            - "${status_after_repair} == ACCESSORY_IN_PROGRESS and ${damage_after_repair} == REPAIRED — the repair trigger moved only the damage dimension"
            - "Vehicle.${veh_id}.processing_status == ACCESSORY_IN_PROGRESS after the FAIL — the backward edge from INSPECTION_PASSED fired"
            - "Vehicle.${veh_id}.damage_status == REPAIRED after the FAIL — the rewind does not reopen damage"
            - "Vehicle.${veh_id}.rework_cycle_count == 1"
            - "QualityInspection.${insp1_id}.status == PASSED and QualityInspection.${insp2_id}.status == FAILED — the unit visited INSPECTION_PASSED and left it"

      - name: carrier_claim_dispute_resubmit_cycle_returns_to_filed_until_ceiling
        grounds:
          - state_machines.CarrierClaim.DISPUTED_to_FILED
          - state_machines.CarrierClaim.FILED_to_DISPUTED
          - entities.CarrierClaim.fields.revision_round
          - calculations.carrier_claim_recoverable_amount.constants.MAX_CLAIM_REVISIONS
          - validations.priority_21
        distinguishing_aspect: |
          Non-linear because FILED -> DISPUTED -> FILED is a cycle that the entity may traverse
          three times, with recoverable_amount_cents recomputed on every re-entry
          (87000 -> 75000 -> 65000 -> 55000) and revision_round monotonically counting the
          revisits until the fourth resubmit is refused — a linear reading of the graph would
          either forbid the return edge or allow it forever.
        test_recipe:
          setup:
            - "One unit surveyed with line items 95000 (UNDERBODY 34) and 32000 (GLASS 30) -> claimed_amount_cents 112000."
            - "A CarrierClaim FILED against carrier OCNL under the SURVEY_BASED basis (recoverable 87000)."
            - "No RepairOrder is created, so the basis never switches."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000007", model_line: "TX300" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "UNDERBODY", severity_points: 34, repair_estimate_cents: 95000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 32000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
              captures: { survey_v: $.data.version }
            - call: "POST /vpc/damage-surveys/${survey_id}/claims"
              payload: { carrier_scac: "OCNL", expected_damage_survey_version: "${survey_v}" }
              as: DamageSurveyor
              captures: { claim_id: $.data.id, round0: $.data.revision_round, rec0: $.data.recoverable_amount_cents }
          trigger:
            - call: "POST /vpc/carrier-claims/${claim_id}/carrier-response"
              payload: { outcome: "DISPUTE", disputed_amount_cents: 100000 }
              as: DistributionManager
              captures: { st_disputed_1: $.data.status }
            - call: "POST /vpc/carrier-claims/${claim_id}/resubmit"
              payload: { revised_claim_amount_cents: 100000 }
              as: DamageSurveyor
              captures: { st_refiled_1: $.data.status, round1: $.data.revision_round, rec1: $.data.recoverable_amount_cents }
            - call: "POST /vpc/carrier-claims/${claim_id}/carrier-response"
              payload: { outcome: "DISPUTE", disputed_amount_cents: 90000 }
              as: DistributionManager
            - call: "POST /vpc/carrier-claims/${claim_id}/resubmit"
              payload: { revised_claim_amount_cents: 90000 }
              as: DamageSurveyor
              captures: { round2: $.data.revision_round, rec2: $.data.recoverable_amount_cents }
            - call: "POST /vpc/carrier-claims/${claim_id}/carrier-response"
              payload: { outcome: "DISPUTE", disputed_amount_cents: 80000 }
              as: DistributionManager
            - call: "POST /vpc/carrier-claims/${claim_id}/resubmit"
              payload: { revised_claim_amount_cents: 80000 }
              as: DamageSurveyor
              captures: { round3: $.data.revision_round, rec3: $.data.recoverable_amount_cents }
            - call: "POST /vpc/carrier-claims/${claim_id}/carrier-response"
              payload: { outcome: "DISPUTE", disputed_amount_cents: 70000 }
              as: DistributionManager
            - call: "POST /vpc/carrier-claims/${claim_id}/resubmit"
              payload: { revised_claim_amount_cents: 70000 }
              as: DamageSurveyor
              captures: { revision_limit_error: $.data.error_id }
          assert:
            - "${round0} == 0 and ${rec0} == 87000"
            - "${st_disputed_1} == DISPUTED and ${st_refiled_1} == FILED — the entity returned to a state it had already occupied"
            - "${round1} == 1 and ${rec1} == 75000 (100000 - 25000)"
            - "${round2} == 2 and ${rec2} == 65000"
            - "${round3} == 3 and ${rec3} == 55000"
            - "${revision_limit_error} == ERR_CLAIM_REVISION_LIMIT with HTTP 409 — revision_round 3 is not < MAX_CLAIM_REVISIONS 3"
            - "CarrierClaim.${claim_id}.status == DISPUTED and CarrierClaim.${claim_id}.revision_round == 3 after the refusal"

      - name: repair_order_fork_to_escalated_has_divergent_side_effect_set
        grounds:
          - state_machines.RepairOrder.ESTIMATED_to_AUTHORIZED
          - state_machines.RepairOrder.ESTIMATED_to_ESCALATED
          - state_machines.RepairOrder.ESCALATED_to_AUTHORIZED
          - state_machines.RepairOrder.ESCALATED_to_REJECTED
          - calculations.repair_authorization_tier
        distinguishing_aspect: |
          Non-linear because ESTIMATED forks on a computed tier into two successors whose side
          effects differ (the AUTO branch advances Vehicle.damage_status to REPAIR_AUTHORIZED and
          stamps authorized_by_user_id; the ESCALATED branch advances neither), and the branches
          then rejoin at AUTHORIZED where the deferred damage-dimension effect finally fires.
