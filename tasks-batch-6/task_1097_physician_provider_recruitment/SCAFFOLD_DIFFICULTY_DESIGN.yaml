          assert:
            - "GuaranteeClaim.${claim_id}.status == RESOLVED_REFUND"
            - "GuaranteeClaim.${claim_id}.days_worked == 30"
            - "GuaranteeClaim.${claim_id}.credit_cents == 4000000"

  - rule_id: combinatorial_formula
    instances:
      - name: placement_fee_floor_binds_mode_a
        grounds:
          - calculations.placement_fee
          - entities.Placement.fields.fee_estimate_cents
          - entities.JobOpening.fields.is_hard_to_fill
        distinguishing_aspect: |
          Mode (a): fee = max(round(comp * contingency_pct * multiplier), min_fee_cents) is a >=3-input
          non-linear formula with a nested max() floor and a conditional multiplier. With comp 8,000,000,
          pct 0.20, multiplier 1.0 (not hard-to-fill) the percentage product 1,600,000 is below the
          floor 2,000,000, so the max() floor binds and fee_estimate_cents == 2,000,000.
        test_recipe:
          setup:
            - "Non-hard-to-fill CARDIOLOGY opening (contingency 0.20, min_fee 2,000,000), comp range 5,000,000-10,000,000."
            - "Offer with offered comp 8,000,000 ACCEPTED -> Placement; estimate fee computed at ACCEPT."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 5000000, comp_max_cents: 10000000, is_hard_to_fill: false, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 8000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 7000000, sign_on_bonus_cents: 1000000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
          trigger:
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "GET /placements?offer_id=${offer_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { placement_id: "$.data[0].id", fee_est: "$.data[0].fee_estimate_cents" } }
          assert:
            - "Placement.${placement_id}.fee_estimate_cents == 2000000"

      - name: relocation_per_line_rounding_mode_b
        grounds:
          - calculations.relocation_reimbursement
          - state_machines.Placement.APPROVED_to_REIMBURSED
          - entities.Placement.fields.relocation_reimbursed_cents
        distinguishing_aspect: |
          Mode (b): each taxable line is grossed up by 1.25 and rounded to whole cents BEFORE summing.
          Lines 1,000,000 (non-taxable) + round(333,333*1.25)=416,666 + round(250,001*1.25)=312,501 sum to
          1,729,167; the sum-then-round order would give 1,729,168. The pinned per-line order yields 1,729,167 (< cap 2,000,000).
        test_recipe:
          setup:
            - "Placement created via ACCEPT with relocation_cap 2,000,000; three relocation expenses added and APPROVED."
            - "Then RELOCATION_REIMBURSE runs the per-line-rounding aggregation."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, is_hard_to_fill: false, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 25000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 25000000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z", relocation_cap_cents: 2000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "GET /placements?offer_id=${offer_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { placement_id: "$.data[0].id" } }
            - { call: "POST /placements/${placement_id}/relocation-expenses", payload: { category: "MOVERS", amount_cents: 1000000, is_taxable: false }, as: AccountManager, as_user_id: "${am_id}", captures: { exp1: "$.data.id" } }
            - { call: "POST /placements/${placement_id}/relocation-expenses", payload: { category: "TEMP_HOUSING", amount_cents: 333333, is_taxable: true }, as: AccountManager, as_user_id: "${am_id}", captures: { exp2: "$.data.id" } }
            - { call: "POST /placements/${placement_id}/relocation-expenses", payload: { category: "FLIGHTS", amount_cents: 250001, is_taxable: true }, as: AccountManager, as_user_id: "${am_id}", captures: { exp3: "$.data.id" } }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "RELOCATION_APPROVE", expense_id: "${exp1}" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "RELOCATION_APPROVE", expense_id: "${exp2}" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "RELOCATION_APPROVE", expense_id: "${exp3}" }, as: AccountManager, as_user_id: "${am_id}" }
          trigger:
            - { call: "POST /placements/${placement_id}/transition", payload: { action: "RELOCATION_REIMBURSE" }, as: AccountManager, as_user_id: "${am_id}" }
          assert:
            - "Placement.${placement_id}.relocation_reimbursed_cents == 1729167"
            - "Placement.${placement_id}.relocation_status == REIMBURSED"

  - rule_id: non_linear_state_machine
    instances:
      - name: offer_cyclic_negotiation_round
        grounds:
          - state_machines.Offer.EXTENDED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_EXTENDED
          - entities.Offer.fields.round_number
        distinguishing_aspect: |
          Offer is cyclic: EXTENDED -> COUNTERED -> EXTENDED loops the same entity. After a client COUNTER
          and an AM revise, round_number advances 1 -> 2 and status returns to EXTENDED (not a linear pipeline).
        test_recipe:
          setup:
            - "An offer EXTENDED (round 1) on an INTERVIEWING application with a completed site visit."
            - "Client COUNTERs it (EXTENDED->COUNTERED); AM revises it back (COUNTERED->EXTENDED, round 2)."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
