# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# International Remittance — Expert band. Walks references/claim-extraction-guide.md
# row-by-row against §1.1–§1.7. Every test_recipe chain is empty-DB executable
# against §1.5; negative instances are named to signal intentional rejection.
# Corners already covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_corridor_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Corridor"
          - "endpoints"
        distinguishing_aspect: "POST /corridors with all required fields returns 201; status=ACTIVE and reserved_minor=0 are system-set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK","CASH_PICKUP","WALLET"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 400000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id, st: $.data.status, reserved: $.data.reserved_minor }
          assert:
            - "HTTP status == 201"
            - "Corridor.${corridor_id}.status == ACTIVE"
            - "Corridor.${corridor_id}.reserved_minor == 0"
            - "Corridor.${corridor_id}.version == 1"

      - name: get_sender_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Sender"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /senders/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /senders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RemittanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_recipient_missing_required_payout_method_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Recipient.fields.payout_method"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /recipients omitting required payout_method returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A sender exists."]
          setup_api_calls:
            - call: "POST /senders"
              payload: { full_name: "Req Field Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
          trigger:
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "No Method", country: "PH", payout_account_ref: "X" }
              as: RemittanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: corridor_rolling_window_hours_default_applied_when_omitted
        claim_type: Defaults
        grounds:
          - "entities.Corridor.fields.rolling_window_hours"
        distinguishing_aspect: "Omitting rolling_window_hours applies the default 24; rate_lock_ttl_seconds defaults to 1800."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /corridors"
              payload: { name: "US->MX", send_country: "US", receive_country: "MX", send_currency: "USD", receive_currency: "MXN", enabled_payout_methods: ["CASH_PICKUP"], fx_margin_bps: 100, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 500000, rolling_window_cap_minor: 400000 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
          assert:
            - "Corridor.${corridor_id}.rolling_window_hours == 24"
            - "Corridor.${corridor_id}.rate_lock_ttl_seconds == 1800"

      - name: sender_kyc_tier_system_field_ignores_input
        claim_type: System Fields
        grounds:
          - "entities.Sender.fields.kyc_tier"
          - "entities.Sender.fields.status"
        distinguishing_aspect: "POST /senders ignores any client-supplied kyc_tier/status; kyc_tier=TIER0, status=ACTIVE are system-initialized."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /senders"
              payload: { full_name: "Sys Field Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id, tier: $.data.kyc_tier, st: $.data.status }
          assert:
            - "Sender.${sender_id}.kyc_tier == TIER0"
            - "Sender.${sender_id}.status == ACTIVE"

      - name: quote_computed_disclosure_fields_correct_on_lock
        claim_type: Computed Fields
        grounds:
          - "entities.Quote.fields.locked_rate_micro"
          - "entities.Quote.fields.fee_minor"
          - "entities.Quote.fields.recipient_amount_minor"
        excluded_because:
          difficulty_instance: combinatorial_formula / recipient_amount_rounding_order_mode_b
          rationale: "Quote computed disclosure fields (locked_rate_micro, fee_minor, recipient_amount_minor) are asserted as literals by the named §1.8 instance."

      - name: list_transfers_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "entities.Transfer"
          - "endpoints"
        distinguishing_aspect: "GET /transfers returns a paginated envelope; with limit=1 over 2 transfers, total_count==2 and has_more==true."
        test_recipe:
          setup: ["Two transfers exist for the same sender on the same corridor."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Page Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Page Recipient", country: "PH", payout_method: "BANK", payout_account_ref: "PG-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { q1v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${q1}", recipient_id: "${recipient_id}", expected_quote_version: "${q1v}" }
              as: RemittanceAgent
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 60000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { q2v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${q2}", recipient_id: "${recipient_id}", expected_quote_version: "${q2v}" }
              as: RemittanceAgent
          trigger:
            - call: "GET /transfers?sender_id=${sender_id}&limit=1&offset=0"
              payload: {}
              as: RemittanceAgent
          assert:
            - "response.meta present; response_type == array"
            - "total_count == 2 and has_more == true and returned array length == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: lock_already_locked_quote_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Quote.DRAFT_to_LOCKED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Locking a quote already in LOCKED is not a declared transition from LOCKED; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A LOCKED quote."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Lock Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
          trigger:
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: quote_auto_expires_after_ttl_blocks_consume
        claim_type: Valid Transition
        grounds:
          - "state_machines.Quote.LOCKED_to_EXPIRED"
          - "errors[ERR_QUOTE_EXPIRED]"
        distinguishing_aspect: "Advancing the clock past expires_at auto-transitions the LOCKED quote to EXPIRED; a subsequent transfer create returns ERR_QUOTE_EXPIRED (409)."
        test_recipe:
          setup: ["A LOCKED quote with ttl 1800s; clock advanced 1801s so the window has elapsed."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Exp Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Exp Recipient", country: "PH", payout_method: "BANK", payout_account_ref: "EX-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /_clock/advance"
              payload: { seconds: 1801 }
              as: PlatformAdmin
          trigger:
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_QUOTE_EXPIRED"
            - "Quote.${quote_id}.status == EXPIRED"

      - name: decide_terminal_compliance_case_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.ComplianceCase.OPEN_to_CLEARED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Re-deciding an already-CLEARED ComplianceCase (terminal) returns ERR_INVALID_STATE; no further state change."
        test_recipe:
          setup: ["A ComplianceCase already CLEARED (its transfer compliance_status==CLEARED)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
              payload: { listed_name: "Ivan Petrov", listed_country: "PH", program: "OFAC-SDN", weight_name_bps: 7000, weight_country_bps: 3000 }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Term Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Ivan Petrov", country: "PH", payout_method: "BANK", payout_account_ref: "TM-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-TM" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /compliance-cases"
              payload: {}
              as: ComplianceOfficer
              captures: { case_id: $.data.0.id, case_v: $.data.0.version }
            - call: "POST /compliance-cases/${case_id}/decide"
              payload: { decision: "CLEAR", expected_case_version: "${case_v}" }
              as: ComplianceOfficer
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /compliance-cases/${case_id}/decide"
              payload: { decision: "CLEAR", expected_case_version: "${case_v2}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Transfer.${transfer_id}.compliance_status == CLEARED"

      - name: recipient_kyc_revision_cycle_increments_review_count
        claim_type: cyclic
        grounds:
          - "state_machines.Recipient.REJECTED_to_PENDING_REVIEW"
          - "entities.Recipient.fields.kyc_review_count"
        distinguishing_aspect: "A REJECTED recipient resubmitting KYC re-enters PENDING_REVIEW and kyc_review_count increments to 1."
        test_recipe:
          setup: ["A recipient whose KYC was submitted then REJECTED."]
          setup_api_calls:
            - call: "POST /senders"
              payload: { full_name: "Cyc Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Cyc Recipient", country: "PH", payout_method: "BANK", payout_account_ref: "CY-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-A" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-B" }
              as: RemittanceAgent
              captures: { rc: $.data.kyc_review_count, ks: $.data.kyc_status }
          assert:
            - "Recipient.${recipient_id}.kyc_status == PENDING_REVIEW"
            - "Recipient.${recipient_id}.kyc_review_count == 1"

      - name: payout_success_bubbles_to_delivered_and_credits_ledger
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Transfer.IN_TRANSIT_to_DELIVERED"
          - "calculations.ledger_invariant"
          - "entities.Corridor.fields.reserved_minor"
        distinguishing_aspect: "Reporting SUCCEEDED on the payout attempt bubbles delivery_status to DELIVERED, decrements reserved_minor to 0, and writes a RECIPIENT_CREDIT (+50000); transfer ledger nets to 0."
        test_recipe:
          setup: ["A funded, CLEARED, VERIFIED transfer dispatched (IN_TRANSIT) with a PENDING payout attempt."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Deliv Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Deliv Recipient", country: "PH", payout_method: "BANK", payout_account_ref: "DL-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-DL" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /transfers/${transfer_id}/dispatch"
              payload: {}
              as: PayoutOperator
            - call: "GET /payout-attempts?transfer_id=${transfer_id}"
              payload: {}
              as: PayoutOperator
              captures: { attempt_id: $.data.0.id }
          trigger:
            - call: "POST /payout-attempts/${attempt_id}/report-outcome"
              payload: { outcome: "SUCCEEDED" }
              as: PayoutOperator
          assert:
            - "Transfer.${transfer_id}.delivery_status == DELIVERED"
            - "Corridor.${corridor_id}.reserved_minor == 0"
            - "GET /ledger-entries?transfer_id=${transfer_id} contains RECIPIENT_CREDIT amount_minor == 50000 and the sum of all amount_minor == 0"

      - name: retry_dispatch_after_max_attempts_returns_invalid_state_error
        claim_type: guarded transitions
        grounds:
          - "state_machines.Transfer.FAILED_to_IN_TRANSIT"
          - "errors[ERR_MAX_ATTEMPTS_REACHED]"
        distinguishing_aspect: "A third dispatch after MAX_PAYOUT_ATTEMPTS=2 FAILED attempts is rejected with ERR_MAX_ATTEMPTS_REACHED; delivery_status stays FAILED."
        test_recipe:
          setup: ["A funded, CLEARED, VERIFIED transfer with two FAILED payout attempts; delivery_status FAILED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
