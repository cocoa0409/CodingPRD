  - method: GET
    path: "/trips/{id}/duty-events"
    description: "List duty events linked to a trip"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "DutyEvent[]"
    side_effects: []

  - method: GET
    path: "/trips/{id}/accessorials"
    description: "List accessorial charges linked to a trip"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccessorialCharge[]"
    side_effects: []

  - method: POST
    path: "/trips/{id}/fuel-purchases"
    description: "Record a fuel purchase (trip must be DISPATCHED..AT_DELIVERY)"
    roles: [Driver, Dispatcher]
    code: 201
    input: [driver_id, state_code, gallons, pump_price_cents, purchased_at]
    output: FuelPurchase
    side_effects: ["total_cost_cents/tax_paid_cents/net_effective_price_cents computed (fuel_purchase_costing)", "tractor.current_fuel_gallons += gallons"]

  - method: GET
    path: "/trips/{id}/fuel-purchases"
    description: "List fuel purchases of a trip"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "FuelPurchase[]"
    side_effects: []

  # --- AccessorialCharge (flat actions) ---
  - method: GET
    path: "/accessorials/{id}"
    description: "Get an accessorial charge"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: []

  - method: POST
    path: "/accessorials/{id}/submit"
    description: "Submit a PENDING or DISPUTED charge (DISPUTED->SUBMITTED is the resubmit cycle)"
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/accessorials/{id}/approve"
    description: "Approve a SUBMITTED charge"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/accessorials/{id}/dispute"
    description: "Dispute a SUBMITTED charge"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/accessorials/{id}/reject"
    description: "Reject a SUBMITTED or DISPUTED charge (terminal)"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: AccessorialCharge
    side_effects: ["status -> REJECTED"]

  # --- Settlement ---
  - method: POST
    path: "/settlements"
    description: "Generate a DRAFT settlement for a driver and half-open period"
    roles: [PayrollClerk]
    code: 201
    input: [driver_id, period_start, period_end]
    output: Settlement
    side_effects: ["settlement_gross_pay computed", "created_by_id = X-User-ID"]

  - method: GET
    path: "/settlements"
    description: "List settlements with filters"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: ["driver_id?", "status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/settlements/{id}/recalculate"
    description: "Recompute a DRAFT settlement, optionally applying manual_adjustment_cents (OCC-guarded)"
    roles: [PayrollClerk]
    code: 200
    input: ["manual_adjustment_cents?", expected_settlement_version]
    output: Settlement
    side_effects: ["increments Settlement.version by 1", "settlement_gross_pay recomputed", "manual_adjustment_cents replaced (default 0)"]

  - method: POST
    path: "/settlements/{id}/submit"
    description: "Submit a DRAFT settlement for approval"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> PENDING_APPROVAL"]

  - method: POST
    path: "/settlements/{id}/reject"
    description: "Reject a PENDING_APPROVAL settlement back to DRAFT (rework cycle)"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/settlements/{id}/approve"
    description: "Approve a PENDING_APPROVAL settlement; approver must differ from creator"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> APPROVED", "approved_by_id = X-User-ID"]

  - method: POST
    path: "/settlements/{id}/mark-paid"
    description: "Mark an APPROVED settlement paid (terminal)"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> PAID"]

  # --- Invoice ---
  - method: POST
    path: "/loads/{id}/invoice"
    description: "Create a DRAFT invoice for a DELIVERED load (at most one non-VOID per load)"
    roles: [LoadPlanner]
    code: 201
    input: []
    output: Invoice
    side_effects: ["linehaul_cents and fuel_surcharge_cents snapshotted from load", "requires load DELIVERED (ERR_INVOICE_NOT_ISSUABLE otherwise)"]

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [FleetAdmin, LoadPlanner, Dispatcher, SafetyOfficer, PayrollClerk, Driver]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a DRAFT invoice (requires all accessorials terminal)"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> ISSUED", "APPROVED accessorials -> BILLED", "accessorial_total_cents and total_cents computed", "Load DELIVERED -> INVOICED, final_margin_cents computed"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an ISSUED invoice (compensating cascade)"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID", "BILLED accessorials -> APPROVED", "Load INVOICED -> DELIVERED, final_margin cleared"]

  - method: POST
    path: "/invoices/{id}/mark-paid"
    description: "Mark an ISSUED invoice paid"
    roles: [LoadPlanner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID", "Load INVOICED -> CLOSED"]

  # --- Dispatch ---
  - method: GET
    path: "/dispatch/backhaul-candidates"
    description: "Ranked backhaul/empty-mile candidates for a tractor (backhaul_ranking)"
    roles: [Dispatcher]
    code: 200
    input: [tractor_id, "driver_id?", "limit?"]
    output: "Load[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # auth & request
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, range violation, delivery_appt_at <= pickup_appt_at, period_end <= period_start, occurred_at after logical now, manual HOS_VIOLATION creation" }
  - { id: ERR_DRIVER_MISMATCH, http: 403, condition: "Driver identity does not match the acted-on driver/trip/load ownership" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  # not found
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver id does not exist" }
  - { id: ERR_TRACTOR_NOT_FOUND, http: 404, condition: "Tractor id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "CustomerAccount id does not exist" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "Lane id does not exist" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "Load id does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "Trip id does not exist" }
  - { id: ERR_ACCESSORIAL_NOT_FOUND, http: 404, condition: "AccessorialCharge id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Settlement id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_FUEL_RATE_NOT_FOUND, http: 404, condition: "StateFuelRate id does not exist" }
  - { id: ERR_SAFETY_EVENT_NOT_FOUND, http: 404, condition: "SafetyEvent id does not exist" }
  # state
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Suspend/dispatch/duty-event requires employment_status ACTIVE" }
  - { id: ERR_DRIVER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires SUSPENDED" }
  - { id: ERR_DRIVER_ALREADY_TERMINATED, http: 409, condition: "Action on a TERMINATED driver" }
  - { id: ERR_TRACTOR_NOT_AVAILABLE, http: 409, condition: "Trip create / out-of-service requires tractor AVAILABLE" }
  - { id: ERR_TRACTOR_NOT_OUT_OF_SERVICE, http: 409, condition: "Return-to-service requires OUT_OF_SERVICE" }
  - { id: ERR_CUSTOMER_INVALID_STATE, http: 409, condition: "Credit-hold requires ACTIVE; release requires CREDIT_HOLD" }
  - { id: ERR_LOAD_NOT_TENDERED, http: 409, condition: "Screen requires TENDERED" }
  - { id: ERR_LOAD_NOT_SCREENED, http: 409, condition: "Accept requires SCREENED" }
  - { id: ERR_LOAD_NOT_REJECTABLE, http: 409, condition: "Reject requires TENDERED or SCREENED" }
  - { id: ERR_LOAD_NOT_ASSIGNABLE, http: 409, condition: "Trip create requires load ACCEPTED; dispatch requires load ASSIGNED" }
  - { id: ERR_LOAD_NOT_CANCELLABLE, http: 409, condition: "Cancel allowed only from TENDERED/SCREENED/ACCEPTED/ASSIGNED/DISPATCHED" }
  - { id: ERR_TRIP_NOT_PLANNED, http: 409, condition: "Dispatch or replan requires trip PLANNED" }
  - { id: ERR_TRIP_NOT_CANCELLABLE, http: 409, condition: "Trip cancel allowed only from PLANNED/DISPATCHED/AT_PICKUP" }
  - { id: ERR_TRIP_NOT_FUELABLE, http: 409, condition: "Fuel purchase requires trip DISPATCHED, AT_PICKUP, IN_TRANSIT, or AT_DELIVERY" }
  - { id: ERR_ACCESSORIAL_NOT_SUBMITTABLE, http: 409, condition: "Submit requires PENDING or DISPUTED" }
  - { id: ERR_ACCESSORIAL_NOT_APPROVABLE, http: 409, condition: "Approve requires SUBMITTED" }
  - { id: ERR_ACCESSORIAL_NOT_DISPUTABLE, http: 409, condition: "Dispute requires SUBMITTED" }
  - { id: ERR_ACCESSORIAL_NOT_REJECTABLE, http: 409, condition: "Reject requires SUBMITTED or DISPUTED" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT, http: 409, condition: "Recalculate/submit require DRAFT" }
  - { id: ERR_SETTLEMENT_NOT_PENDING_APPROVAL, http: 409, condition: "Approve/reject require PENDING_APPROVAL" }
  - { id: ERR_SETTLEMENT_NOT_APPROVED, http: 409, condition: "Mark-paid requires APPROVED" }
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "Issue requires DRAFT and load DELIVERED; invoice create requires load DELIVERED" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Void requires ISSUED" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Mark-paid requires ISSUED" }
  - { id: ERR_INVOICE_ALREADY_EXISTS, http: 409, condition: "A non-VOID invoice already exists for the load" }
  - { id: ERR_SAFETY_EVENT_NOT_VOIDABLE, http: 409, condition: "Safety event already voided" }
  # business safety / temporal / constraint / referential
  - { id: ERR_DRIVER_SAFETY_BELOW_FLOOR, http: 422, condition: "driver.safety_score < 60 at trip create/replan" }
  - { id: ERR_HOS_INSUFFICIENT, http: 422, condition: "Any hos_feasibility_check clause fails" }
  - { id: ERR_HOME_TIME_EXCEEDED, http: 422, condition: "Projected days out at delivery > 14" }
  - { id: ERR_TRIP_OVERLAP, http: 422, condition: "Driver has a non-terminal trip whose [planned_start_at, delivery_appt_at) window overlaps" }
  - { id: ERR_CHECK_CALL_OUT_OF_ORDER, http: 422, condition: "Kind rank regression, occurred_at or odometer regression vs previous check call, first odometer < start_odometer_miles, or check call on a terminal/PLANNED trip" }
  - { id: ERR_DUTY_EVENT_OUT_OF_ORDER, http: 422, condition: "occurred_at not strictly greater than driver's previous duty event" }
  - { id: ERR_SETTLEMENT_PERIOD_OVERLAP, http: 422, condition: "Half-open period overlaps an existing settlement for the same driver" }
  - { id: ERR_FUEL_RATE_WINDOW_OVERLAP, http: 422, condition: "Closed effective window overlaps an existing window for the same state_code (touching endpoints conflict)" }
  - { id: ERR_PAY_CONFIG_INCOMPLETE, http: 422, condition: "MILEAGE without pay_rate_cents_per_mile or PERCENTAGE without pay_percentage_bp" }
  - { id: ERR_DUPLICATE_ACCESSORIAL_TYPE, http: 422, condition: "A non-REJECTED DETENTION_PICKUP (resp. DETENTION_DELIVERY) already exists for the load" }
  - { id: ERR_INVOICE_OPEN_ACCESSORIALS, http: 422, condition: "Issue blocked: accessorial in PENDING/SUBMITTED/DISPUTED" }
  - { id: ERR_FUEL_RATE_UNAVAILABLE, http: 422, condition: "No current StateFuelRate row for the required state_code (incl. US-NATIONAL at screen/accept)" }
  - { id: ERR_STATE_NOT_ON_ROUTE, http: 422, condition: "Fuel purchase state_code not in trip.route_states" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 422, condition: "current_fuel_gallons + gallons > tank_capacity_gallons" }
  - { id: ERR_FUEL_PLAN_INFEASIBLE, http: 422, condition: "Empty route_states or no eligible state within range with a current rate" }
  # fiscal
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Load accept requires customer ACTIVE" }
  - { id: ERR_MARGIN_BELOW_FLOOR, http: 402, condition: "Recomputed projected margin < 0 or projected RPM < lane.rpm_floor_cents at accept" }
  # segregation of duties
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Settlement approver X-User-ID equals created_by_id" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Fleet master-data administrator: drivers, tractors, customers, fuel rates; clock control"
    identity: opaque
    exclusive_operations:
      - "POST /drivers, PATCH /drivers/{id}, POST /drivers/{id}/terminate"
      - "POST /tractors, POST /tractors/{id}/out-of-service, POST /tractors/{id}/return-to-service"
      - "POST /customers, POST /state-fuel-rates"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]

  - name: LoadPlanner
    description: "Commercial planner: lanes, load tender/screen/accept/reject/cancel, credit holds, accessorial adjudication, invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /lanes"
      - "POST /loads, POST /loads/{id}/screen|accept|reject|cancel"
      - "POST /customers/{id}/credit-hold, POST /customers/{id}/release-credit-hold"
      - "POST /accessorials/{id}/approve|dispute|reject"
      - "POST /loads/{id}/invoice, POST /invoices/{id}/issue|void|mark-paid"
    shared_operations: ["All GET endpoints"]

  - name: Dispatcher
    description: "Dispatch operator: trip creation/dispatch/cancel/replan, check calls on behalf, accessorial capture, fuel purchase on behalf, backhaul"
    identity: opaque
    exclusive_operations:
      - "POST /trips, PATCH /trips/{id}, POST /trips/{id}/dispatch, POST /trips/{id}/cancel"
      - "GET /dispatch/backhaul-candidates"
    shared_operations:
      - "All GET endpoints"
      - "POST /trips/{id}/check-calls (with Driver)"
      - "POST /drivers/{id}/duty-events (with Driver)"
      - "POST /trips/{id}/fuel-purchases (with Driver)"
      - "POST /loads/{id}/accessorials (with Driver)"
      - "POST /accessorials/{id}/submit (with Driver)"

  - name: SafetyOfficer
    description: "Safety/compliance: suspension, reinstatement, safety event log and voids"
    identity: opaque
    exclusive_operations:
      - "POST /drivers/{id}/suspend, POST /drivers/{id}/reinstate"
      - "POST /drivers/{id}/safety-events, POST /safety-events/{id}/void"
    shared_operations: ["All GET endpoints"]

  - name: PayrollClerk
    description: "Payroll: settlement lifecycle. Segregation of duties: approver X-User-ID must differ from created_by_id"
    identity: opaque
    exclusive_operations:
      - "POST /settlements, POST /settlements/{id}/recalculate|submit|reject|approve|mark-paid"
    shared_operations: ["All GET endpoints"]

  - name: Driver
    description: "Driver self-service: own duty events, own trip check calls, own fuel purchases, own accessorial capture/submit"
    identity: "entity_backed:Driver"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /drivers/{id}/duty-events (only when {id} == X-User-ID)"
      - "POST /trips/{id}/check-calls (only when trip.driver_id == X-User-ID)"
      - "POST /trips/{id}/fuel-purchases (only when driver_id == X-User-ID == trip.driver_id)"
      - "POST /loads/{id}/accessorials and /accessorials/{id}/submit (only for loads with a trip driven by X-User-ID)"
