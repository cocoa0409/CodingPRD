    instances:
      - name: event_close_cancels_registrations_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.Event.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: "transitive_cascade / event_close_cascade_event_registration_member"
          rationale: "Event close cascade and point refunds asserted by the named §1.8 instance."
      - name: member_suspend_cascade_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED]
        excluded_because:
