            - "GET /habitat-conservation-plans/${hcp_id}/mitigation-commitments returns an empty list after all refused attempts, and the plan still reports endowment_required_cents == 0 with funding_status 'UNFUNDED'"
            - "GET /conservation-banks/${bank_id} reports credits_available == 500.00, credits_reserved == 0.00 and credits_transferred == 0.00; GET /conservation-banks/${bank2_id} reports credits_available == 5.00 with the same zeroes — no refused request touched either ledger"
