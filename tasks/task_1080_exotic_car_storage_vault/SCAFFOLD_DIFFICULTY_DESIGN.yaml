# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: storage_proration_full_month_vs_prorated
        grounds:
          - calculations.storage_proration
          - calculations.storage_monthly_fee
          - entities.StorageAgreement.fields.days_stored
          - endpoints["POST /invoices/generate"]
        distinguishing_aspect: |
          Same StorageAgreement (monthly_rate 40500) billed two ways: FULL_MONTH charges the
          whole 40500 (total 43740) while PRORATED charges 40500*12/30 = 16200 (total 17496) —
          two valid variants on the StorageAgreement billing domain diverge.
        test_recipe:
          setup:
            - "Facility with one CLIMATE unit (monthly_rate_cents 40000); GOLD member (0.10 discount)"
            - "Vehicle intake-documented; agreement moved in on 2026-06-01, terminated on 2026-06-13 (days_stored=12)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault A", total_units: 4 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "C1", unit_class: "CLIMATE", monthly_rate_cents: 40000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Gold M", email: "g1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Ferrari", model: "F8", model_year: 2022, vin: "VIN-DV1", fuel_type: "ICE", declared_value_cents: 30000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
          trigger:
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z", proration_mode: "FULL_MONTH" }, as: BillingAdmin, captures: { inv_full: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements/${agr}/terminate", payload: {}, as: VaultManager }
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z", proration_mode: "PRORATED" }, as: BillingAdmin, captures: { inv_pro: $.data.id } }
          assert:
            - "StorageAgreement.${agr}.monthly_rate_cents == 40500"
            - "Invoice.${inv_full}.subtotal_cents == 40500"
            - "Invoice.${inv_full}.total_cents == 43740"
            - "StorageAgreement.${agr}.days_stored == 12"
            - "Invoice.${inv_pro}.subtotal_cents == 16200"
            - "Invoice.${inv_pro}.total_cents == 17496"

      - name: service_order_estimate_vs_final_cost
        grounds:
          - calculations.service_order_cost
          - entities.ServiceOrder.fields.estimated_cost_cents
          - entities.ServiceOrder.fields.final_cost_cents
          - state_machines.ServiceOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          On the ServiceOrder domain (different entity than storage_proration): the estimate at
          approve uses estimated_labor_hours (DETAIL 15000 + 2.0*12000 = 39000) while the final at
          complete uses actual_labor_hours + parts (15000 + 2.5*12000 + 8000 = 53000).
        test_recipe:
          setup:
            - "Agreement IN_STORAGE; a DETAIL ServiceOrder approved (estimate) then completed (final)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault B", total_units: 3 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "S1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Bronze M", email: "b1@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Porsche", model: "911", model_year: 2021, vin: "VIN-DV2", fuel_type: "ICE", declared_value_cents: 20000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "DETAIL", estimated_labor_hours: 2.0 }, as: VaultManager, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: VaultManager }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech }
          trigger:
            - { call: "POST /service-orders/${so}/complete", payload: { actual_labor_hours: 2.5, parts_cents: 8000 }, as: ConciergeTech }
          assert:
            - "ServiceOrder.${so}.estimated_cost_cents == 39000"
            - "ServiceOrder.${so}.final_cost_cents == 53000"
            - "estimated_cost_cents (39000) != final_cost_cents (53000)"

  - rule_id: combinatorial_formula
    instances:
      - name: storage_fee_discount_cap_nonlinear
        grounds:
          - calculations.storage_monthly_fee
          - entities.StorageUnit.fields.unit_class
          - entities.Member.fields.tier_discount_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base 200000, SHOWCASE surcharge 12000, PLATINUM 0.20) with a
          non-linear min() cap — raw_discount 42400 is clamped to MAX_DISCOUNT_CENTS 20000, so
          monthly_rate = 212000-20000 = 192000 (not the uncapped 169600).
        test_recipe:
          setup:
            - "SHOWCASE unit (monthly_rate 200000); PLATINUM member; agreement created (no move-in needed)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault C", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "SH1", unit_class: "SHOWCASE", monthly_rate_cents: 200000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Plat M", email: "p1@x.com", membership_tier: "PLATINUM" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Bugatti", model: "Chiron", model_year: 2023, vin: "VIN-CF1", fuel_type: "ICE", declared_value_cents: 300000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
          trigger:
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
          assert:
            - "StorageAgreement.${agr}.monthly_rate_cents == 192000"
            - "the discount was capped at 20000 (uncapped 42400 would give 169600)"

      - name: invoice_per_line_tax_rounding_order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.tax_cents
          - calculations.service_order_cost
        distinguishing_aspect: |
          Mode (b): rounding order is pinned as round-per-line-then-sum for tax. STORAGE 3130 and
          SERVICE 3130 each yield round(3130*0.08)=250 tax; per-line sum = 500 (total 6760), which
          differs from round(6260*0.08)=501 (sum-then-round would give 6761).
        test_recipe:
          setup:
            - "BRONZE member; STANDARD unit rate 3130 (monthly_rate 3130); agreement IN_STORAGE"
            - "One START_ENGINE ServiceOrder completed with parts 130 (final_cost 3130), uninvoiced"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault D", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "ST1", unit_class: "STANDARD", monthly_rate_cents: 3130 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Bronze N", email: "b2@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Lotus", model: "Emira", model_year: 2022, vin: "VIN-CF2", fuel_type: "ICE", declared_value_cents: 9000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "START_ENGINE", estimated_labor_hours: 0 }, as: VaultManager, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: VaultManager }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders/${so}/complete", payload: { actual_labor_hours: 0, parts_cents: 130 }, as: ConciergeTech }
          trigger:
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z", proration_mode: "FULL_MONTH" }, as: BillingAdmin, captures: { inv: $.data.id } }
          assert:
            - "Invoice.${inv}.subtotal_cents == 6260"
            - "Invoice.${inv}.tax_cents == 500"
            - "Invoice.${inv}.total_cents == 6760"
            - "per-line tax (500) differs from sum-then-round tax (501)"

  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_in_out_cycle
        grounds:
          - state_machines.StorageAgreement.IN_STORAGE_to_CHECKED_OUT
          - state_machines.StorageAgreement.CHECKED_OUT_to_IN_STORAGE
        distinguishing_aspect: |
          Cyclic on StorageAgreement: IN_STORAGE -> CHECKED_OUT -> IN_STORAGE -> CHECKED_OUT, the
          same two states re-entered (not a linear pipeline).
        test_recipe:
          setup:
            - "Agreement IN_STORAGE"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault E", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "E1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Cyc M", email: "c1@x.com", membership_tier: "SILVER" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Audi", model: "R8", model_year: 2020, vin: "VIN-CY1", fuel_type: "ICE", declared_value_cents: 15000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
          trigger:
            - { call: "POST /storage-agreements/${agr}/check-out", payload: {}, as: ConciergeTech }
            - { call: "POST /storage-agreements/${agr}/check-in", payload: {}, as: ConciergeTech }
            - { call: "POST /storage-agreements/${agr}/check-out", payload: {}, as: ConciergeTech }
          assert:
            - "after first check-out StorageAgreement.${agr}.status == CHECKED_OUT"
            - "after check-in StorageAgreement.${agr}.status == IN_STORAGE"
            - "after second check-out StorageAgreement.${agr}.status == CHECKED_OUT (cycle re-entered)"

      - name: service_order_hold_resume_and_reject_branch
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_ON_HOLD
          - state_machines.ServiceOrder.ON_HOLD_to_IN_PROGRESS
          - state_machines.ServiceOrder.REQUESTED_to_REJECTED
        distinguishing_aspect: |
          On ServiceOrder (a different entity than StorageAgreement): a revert cycle IN_PROGRESS
          <-> ON_HOLD plus a fork REQUESTED -> {APPROVED, REJECTED} — non-linear branch+revert.
        test_recipe:
          setup:
            - "Agreement IN_STORAGE; one ServiceOrder started (IN_PROGRESS); a second ServiceOrder still REQUESTED"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault F", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "F1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Br M", email: "br1@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Nissan", model: "GTR", model_year: 2019, vin: "VIN-SO1", fuel_type: "ICE", declared_value_cents: 12000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "DETAIL", estimated_labor_hours: 1.0 }, as: VaultManager, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: VaultManager }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "FUEL", estimated_labor_hours: 0.5 }, as: VaultManager, captures: { so2: $.data.id } }
          trigger:
            - { call: "POST /service-orders/${so1}/hold", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders/${so2}/reject", payload: {}, as: VaultManager }
          assert:
            - "after hold ServiceOrder.${so1}.status == ON_HOLD"
            - "after start ServiceOrder.${so1}.status == IN_PROGRESS (revert cycle closed)"
            - "ServiceOrder.${so2}.status == REJECTED (branch other than APPROVED)"

  - rule_id: transitive_cascade
    instances:
      - name: terminate_cascade_unit_release_then_waitlist_promotion
        grounds:
          - state_machines.StorageAgreement.IN_STORAGE_to_CLOSED
          - state_machines.StorageUnit.OCCUPIED_to_AVAILABLE
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - state_machines.MonitoringSubscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from terminate: agreement -> CLOSED (A) causes the assigned unit OCCUPIED
          -> AVAILABLE (B); the unit release itself causes the top WAITING WaitlistEntry -> OFFERED
          with unit AVAILABLE -> RESERVED (C). Each hop is caused by the previous, not by terminate.
        test_recipe:
          setup:
            - "Facility with ONE CLIMATE unit; member A occupies it (agreement IN_STORAGE) with an ACTIVE monitoring sub"
            - "Member B is WAITING for a CLIMATE unit at the facility (unit was the only CLIMATE, so B could join)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault G", total_units: 1 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "G1", unit_class: "CLIMATE", monthly_rate_cents: 40000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "A M", email: "a1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { memA: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${memA}", make: "McLaren", model: "720S", model_year: 2021, vin: "VIN-CS1", fuel_type: "ICE", declared_value_cents: 25000000 }, as: VaultManager, captures: { vehA: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${vehA}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${memA}", vehicle_id: "${vehA}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agrA: $.data.id } }
            - { call: "POST /storage-agreements/${agrA}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /storage-agreements/${agrA}/monitoring", payload: { monitor_type: "BATTERY_TENDER", monthly_fee_cents: 5000 }, as: ConciergeTech, captures: { mon: $.data.id } }
            - { call: "POST /members", payload: { full_name: "B M", email: "b3@x.com", membership_tier: "SILVER" }, as: VaultManager, captures: { memB: $.data.id } }
            - { call: "POST /waitlist", payload: { member_id: "${memB}", facility_id: "${fac}", desired_unit_class: "CLIMATE" }, as: Member, as_user_id: "${memB}", captures: { wlB: $.data.id } }
          trigger:
            - { call: "POST /storage-agreements/${agrA}/terminate", payload: {}, as: VaultManager }
          assert:
            - "StorageAgreement.${agrA}.status == CLOSED"
            - "MonitoringSubscription.${mon}.status == CANCELLED"
            - "WaitlistEntry.${wlB}.status == OFFERED"
            - "WaitlistEntry.${wlB}.offered_unit_id == ${unit}"
            - "StorageUnit.${unit}.status == RESERVED"

      - name: coi_revoke_cascade_vehicle_lapse_then_delivery_cancel
        grounds:
          - state_machines.InsuranceCOI.ACTIVE_to_REVOKED
          - entities.Vehicle.fields.insurance_status
          - state_machines.DeliveryJob.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Different trigger (COI revoke, not terminate): revoke (A) causes Vehicle.insurance_status
          -> LAPSED (B); the vehicle lapse causes that vehicle's SCHEDULED DeliveryJob -> CANCELLED
          (C). Distinct propagation pattern from the terminate cascade.
        test_recipe:
          setup:
            - "Vehicle with an ACTIVE COI (coverage 30000000 >= declared 30000000); a SCHEDULED DeliveryJob"
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "D M", email: "d1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Aston", model: "DB11", model_year: 2022, vin: "VIN-CS2", fuel_type: "ICE", declared_value_cents: 30000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /vehicles/${veh}/coi", payload: { policy_number: "P-1", carrier: "ACME", coverage_amount_cents: 30000000, effective_at: "2026-05-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z" }, as: VaultManager, captures: { coi: $.data.id } }
            - { call: "POST /transporters", payload: { name: "T-G", buffer_minutes: 60 }, as: VaultManager, captures: { tr: $.data.id } }
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Concours", pickup_at: "2026-06-20T09:00:00Z", dropoff_at: "2026-06-20T18:00:00Z" }, as: VaultManager, captures: { dj: $.data.id } }
          trigger:
            - { call: "POST /coi/${coi}/revoke", payload: {}, as: VaultManager }
          assert:
            - "InsuranceCOI.${coi}.status == REVOKED"
            - "Vehicle.${veh}.insurance_status == LAPSED"
            - "DeliveryJob.${dj}.status == CANCELLED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: delivery_safety_beats_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_INSURANCE_LAPSED]
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          Category pair business_safety (priority 10, ERR_INSURANCE_LAPSED) vs business_fiscal
          (priority 12, ERR_MEMBER_SUSPENDED): a delivery create where the vehicle is LAPSED AND
          the member is SUSPENDED returns ERR_INSURANCE_LAPSED (safety wins).
        test_recipe:
          setup:
            - "Member SUSPENDED (an ISSUED invoice past due_at + 30 grace days); vehicle insurance LAPSED (COI revoked)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault H", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "H1", unit_class: "STANDARD", monthly_rate_cents: 50000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Sus M", email: "s1@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "BMW", model: "M4", model_year: 2020, vin: "VIN-PP1", fuel_type: "ICE", declared_value_cents: 10000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /vehicles/${veh}/coi", payload: { policy_number: "P-2", carrier: "ACME", coverage_amount_cents: 10000000, effective_at: "2026-05-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z" }, as: VaultManager, captures: { coi: $.data.id } }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /invoices/generate", payload: { member_id: "${mem}", agreement_id: "${agr}", period_start_at: "2026-06-01T00:00:00Z", period_end_at: "2026-07-01T00:00:00Z" }, as: BillingAdmin, captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: BillingAdmin }
            - { call: "POST /coi/${coi}/revoke", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /members/${mem}/refresh-billing", payload: {}, as: BillingAdmin }
            - { call: "POST /members/${mem}/refresh-billing", payload: {}, as: BillingAdmin }
            - { call: "POST /transporters", payload: { name: "T-H" }, as: VaultManager, captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Rally", pickup_at: "2026-08-10T09:00:00Z", dropoff_at: "2026-08-10T18:00:00Z" }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "Member.${mem}.billing_status == SUSPENDED"
            - "Vehicle.${veh}.insurance_status == LAPSED"
            - "trigger response data.error_id == ERR_INSURANCE_LAPSED (safety priority 10 beats fiscal priority 12)"

      - name: service_start_state_beats_referential
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Category pair state (priority 6, ERR_INVALID_STATE) vs business_referential (priority 7,
          ERR_CROSS_ENTITY_STATE): starting a COMPLETED ServiceOrder while its agreement is
          CHECKED_OUT returns ERR_INVALID_STATE (state wins over the cross-entity failure).
        test_recipe:
          setup:
            - "A ServiceOrder COMPLETED; then its agreement checked out (CHECKED_OUT, not IN_STORAGE)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault I", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "I1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "St M", email: "st1@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Chevy", model: "Corvette", model_year: 2021, vin: "VIN-PP2", fuel_type: "ICE", declared_value_cents: 8000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "DETAIL", estimated_labor_hours: 1.0 }, as: VaultManager, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: VaultManager }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders/${so}/complete", payload: { actual_labor_hours: 1.0 }, as: ConciergeTech }
            - { call: "POST /storage-agreements/${agr}/check-out", payload: {}, as: ConciergeTech }
          trigger:
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE (state priority 6 beats referential priority 7)"
            - "ServiceOrder.${so}.status == COMPLETED (unchanged)"
            - "StorageAgreement.${agr}.status == CHECKED_OUT"

  - rule_id: boundary_precision_check
    instances:
      - name: waitlist_join_only_at_zero_available_units
        grounds:
          - validations[priority=13]
          - errors[ERR_UNITS_AVAILABLE]
          - entities.Facility.fields.units_available
        distinguishing_aspect: |
          Zero-count boundary on POST /waitlist: joining is permitted exactly because the count of
          AVAILABLE CLIMATE units is 0 (the only CLIMATE unit is OCCUPIED); with >=1 available it
          would be ERR_UNITS_AVAILABLE.
        test_recipe:
          setup:
            - "Facility with a single CLIMATE unit, currently OCCUPIED by member A (units_available == 0)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault J", total_units: 1 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "J1", unit_class: "CLIMATE", monthly_rate_cents: 40000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "A2 M", email: "a2@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { memA: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${memA}", make: "Ford", model: "GT", model_year: 2020, vin: "VIN-BP1", fuel_type: "ICE", declared_value_cents: 50000000 }, as: VaultManager, captures: { vehA: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${vehA}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${memA}", vehicle_id: "${vehA}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agrA: $.data.id } }
            - { call: "POST /storage-agreements/${agrA}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /members", payload: { full_name: "B2 M", email: "b4@x.com", membership_tier: "SILVER" }, as: VaultManager, captures: { memB: $.data.id } }
          trigger:
            - { call: "POST /waitlist", payload: { member_id: "${memB}", facility_id: "${fac}", desired_unit_class: "CLIMATE" }, as: Member, as_user_id: "${memB}", captures: { wl: $.data.id } }
          assert:
            - "Facility.${fac}.units_available == 0"
            - "WaitlistEntry.${wl}.status == WAITING (join accepted at the zero boundary)"

      - name: delivery_coverage_ge_declared_value_boundary
        grounds:
          - validations[priority=11]
          - errors[ERR_COVERAGE_INSUFFICIENT]
          - entities.InsuranceCOI.fields.coverage_amount_cents
          - entities.Vehicle.fields.declared_value_cents
        distinguishing_aspect: |
          >= boundary on POST /delivery-jobs (a different metric and endpoint than the waitlist
          zero-count): coverage_amount_cents 5000000 == declared_value_cents 5000000 passes exactly
          at equality; 4999999 would be ERR_COVERAGE_INSUFFICIENT.
        test_recipe:
          setup:
            - "Vehicle declared_value 5000000 with an ACTIVE COI coverage exactly 5000000; a transporter"
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Cov M", email: "cov1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Toyota", model: "Supra", model_year: 2021, vin: "VIN-BP2", fuel_type: "ICE", declared_value_cents: 5000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /vehicles/${veh}/coi", payload: { policy_number: "P-3", carrier: "ACME", coverage_amount_cents: 5000000, effective_at: "2026-05-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z" }, as: VaultManager, captures: { coi: $.data.id } }
            - { call: "POST /transporters", payload: { name: "T-J", buffer_minutes: 30 }, as: VaultManager, captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Expo", pickup_at: "2026-06-15T09:00:00Z", dropoff_at: "2026-06-15T17:00:00Z" }, as: VaultManager, captures: { dj: $.data.id } }
          assert:
            - "DeliveryJob.${dj}.status == SCHEDULED (coverage == declared_value passes the >= check)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: delivery_create_requires_vehicle_insurance_active
        grounds:
          - validations[priority=10]
          - entities.Vehicle.fields.insurance_status
          - state_machines.DeliveryJob.initial_state
          - errors[ERR_INSURANCE_LAPSED]
        distinguishing_aspect: |
          Entity pair DeliveryJob -> Vehicle: creating a DeliveryJob is blocked while
          Vehicle.insurance_status != ACTIVE (NONE -> ERR_INSURANCE_LAPSED); once an ACTIVE COI is
          attached the same create succeeds (SCHEDULED).
        test_recipe:
          setup:
            - "Vehicle with NO COI (insurance_status NONE), declared_value 5000000; a transporter"
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Ce M", email: "ce1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Jaguar", model: "FType", model_year: 2021, vin: "VIN-CE1", fuel_type: "ICE", declared_value_cents: 5000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /transporters", payload: { name: "T-K", buffer_minutes: 30 }, as: VaultManager, captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Show1", pickup_at: "2026-06-10T09:00:00Z", dropoff_at: "2026-06-10T12:00:00Z" }, as: VaultManager, captures: { err: $.data.error_id } }
            - { call: "POST /vehicles/${veh}/coi", payload: { policy_number: "P-4", carrier: "ACME", coverage_amount_cents: 5000000, effective_at: "2026-05-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z" }, as: VaultManager, captures: { coi: $.data.id } }
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Show2", pickup_at: "2026-06-12T09:00:00Z", dropoff_at: "2026-06-12T12:00:00Z" }, as: VaultManager, captures: { dj2: $.data.id } }
          assert:
            - "first attempt data.error_id == ERR_INSURANCE_LAPSED (vehicle insurance NONE)"
            - "Vehicle.${veh}.insurance_status == ACTIVE after COI attached"
            - "DeliveryJob.${dj2}.status == SCHEDULED (create succeeds once insurance ACTIVE)"

      - name: service_start_requires_agreement_in_storage
        grounds:
          - validations[priority=7]
          - state_machines.ServiceOrder.APPROVED_to_IN_PROGRESS
          - state_machines.StorageAgreement.CHECKED_OUT_to_IN_STORAGE
          - errors[ERR_CROSS_ENTITY_STATE]
        distinguishing_aspect: |
          Entity pair ServiceOrder -> StorageAgreement (different pair than DeliveryJob -> Vehicle):
          an APPROVED ServiceOrder cannot start while its agreement is CHECKED_OUT
          (ERR_CROSS_ENTITY_STATE); after check-in (IN_STORAGE) the start succeeds.
        test_recipe:
          setup:
            - "Agreement IN_STORAGE; a ServiceOrder APPROVED; agreement then CHECKED_OUT"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault L", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "L1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id, unit_v: $.data.version } }
            - { call: "POST /members", payload: { full_name: "Ce2 M", email: "ce2@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Dodge", model: "Viper", model_year: 2017, vin: "VIN-CE2", fuel_type: "ICE", declared_value_cents: 9000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /inspections", payload: { vehicle_id: "${veh}", inspection_type: "INTAKE" }, as: VaultManager, captures: { insp: $.data.id } }
            - { call: "POST /inspections/${insp}/pass", payload: {}, as: VaultManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${unit_v}" }, as: VaultManager, captures: { agr: $.data.id } }
            - { call: "POST /storage-agreements/${agr}/move-in", payload: {}, as: VaultManager }
            - { call: "POST /service-orders", payload: { agreement_id: "${agr}", service_type: "DETAIL", estimated_labor_hours: 1.0 }, as: VaultManager, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/approve", payload: { scheduled_at: "2026-06-02T09:00:00Z" }, as: VaultManager }
            - { call: "POST /storage-agreements/${agr}/check-out", payload: {}, as: ConciergeTech }
          trigger:
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech, captures: { err: $.data.error_id } }
            - { call: "POST /storage-agreements/${agr}/check-in", payload: {}, as: ConciergeTech }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: ConciergeTech }
          assert:
            - "first start data.error_id == ERR_CROSS_ENTITY_STATE (agreement CHECKED_OUT)"
            - "ServiceOrder.${so}.status == IN_PROGRESS after check-in restores IN_STORAGE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_occupancy_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - entities.StorageAgreement.fields.move_in_at
          - entities.StorageAgreement.fields.planned_move_out_at
          - errors[ERR_UNIT_OVERLAP]
        distinguishing_aspect: |
          StorageUnit resource, HALF-OPEN [move_in_at, planned_move_out_at) semantics: two bookings
          sharing the endpoint 2026-09-01 do NOT overlap (both accepted), but an interior window
          [2026-08-01, 2026-10-01) overlaps and is rejected with ERR_UNIT_OVERLAP.
        test_recipe:
          setup:
            - "Facility with one STANDARD unit; two adjacent bookings, then an overlapping one"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "Vault M", total_units: 2 }, as: VaultManager, captures: { fac: $.data.id } }
            - { call: "POST /facilities/${fac}/units", payload: { unit_code: "M1", unit_class: "STANDARD", monthly_rate_cents: 30000 }, as: VaultManager, captures: { unit: $.data.id } }
            - { call: "POST /members", payload: { full_name: "Ov M", email: "ov1@x.com", membership_tier: "BRONZE" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Mazda", model: "RX7", model_year: 1994, vin: "VIN-OV1", fuel_type: "ICE", declared_value_cents: 6000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: VaultManager }
          trigger:
            - { call: "GET /units/${unit}", payload: {}, as: VaultManager, captures: { uv1: $.data.version } }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-06-01T00:00:00Z", planned_move_out_at: "2026-09-01T00:00:00Z", expected_unit_version: "${uv1}" }, as: VaultManager, captures: { agr1: $.data.id } }
            - { call: "GET /units/${unit}", payload: {}, as: VaultManager, captures: { uv2: $.data.version } }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-09-01T00:00:00Z", planned_move_out_at: "2026-12-01T00:00:00Z", expected_unit_version: "${uv2}" }, as: VaultManager, captures: { agr2: $.data.id } }
            - { call: "GET /units/${unit}", payload: {}, as: VaultManager, captures: { uv3: $.data.version } }
            - { call: "POST /storage-agreements", payload: { member_id: "${mem}", vehicle_id: "${veh}", unit_id: "${unit}", move_in_at: "2026-08-01T00:00:00Z", planned_move_out_at: "2026-10-01T00:00:00Z", expected_unit_version: "${uv3}" }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "StorageAgreement.${agr1}.status == PENDING (booking accepted)"
            - "StorageAgreement.${agr2}.status == PENDING (adjacent at 2026-09-01, no overlap)"
            - "third booking data.error_id == ERR_UNIT_OVERLAP (interior window overlaps both)"

      - name: transporter_buffered_overlap_conflict
        grounds:
          - validations[priority=9]
          - entities.Transporter.fields.buffer_minutes
          - entities.DeliveryJob.fields.pickup_at
          - errors[ERR_TRANSPORTER_CONFLICT]
        distinguishing_aspect: |
          Transporter resource, CLOSED interval [pickup_at, dropoff_at] PLUS buffer_minutes after
          dropoff (different interval semantics than the unit half-open, no-buffer rule): a second
          job at 14:30 conflicts because it falls inside the 60-min buffer after the first job's
          14:00 dropoff, even though the raw job windows do not overlap.
        test_recipe:
          setup:
            - "Vehicle with ACTIVE adequate COI; transporter buffer 60 min; one SCHEDULED job 10:00-14:00"
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Tp M", email: "tp1@x.com", membership_tier: "GOLD" }, as: VaultManager, captures: { mem: $.data.id } }
            - { call: "POST /vehicles", payload: { member_id: "${mem}", make: "Honda", model: "NSX", model_year: 2018, vin: "VIN-OV2", fuel_type: "HYBRID", declared_value_cents: 1000000 }, as: VaultManager, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: VaultManager }
            - { call: "POST /vehicles/${veh}/coi", payload: { policy_number: "P-5", carrier: "ACME", coverage_amount_cents: 1000000, effective_at: "2026-05-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z" }, as: VaultManager, captures: { coi: $.data.id } }
            - { call: "POST /transporters", payload: { name: "T-M", buffer_minutes: 60 }, as: VaultManager, captures: { tr: $.data.id } }
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Meet1", pickup_at: "2026-06-10T10:00:00Z", dropoff_at: "2026-06-10T14:00:00Z" }, as: VaultManager, captures: { dj1: $.data.id } }
          trigger:
            - { call: "POST /delivery-jobs", payload: { vehicle_id: "${veh}", transporter_id: "${tr}", event_name: "Meet2", pickup_at: "2026-06-10T14:30:00Z", dropoff_at: "2026-06-10T16:00:00Z" }, as: VaultManager, captures: { err: $.data.error_id } }
          assert:
            - "DeliveryJob.${dj1}.status == SCHEDULED"
            - "second job data.error_id == ERR_TRANSPORTER_CONFLICT (14:30 falls within the 60-min buffer after 14:00)"

  - rule_id: compensating_invariant
    instances:
      - name: facility_unit_count_conserved_on_occupy_release
        grounds:
          - calculations.facility_unit_counts
          - state_machines.StorageUnit.OCCUPIED_to_AVAILABLE
          - entities.Facility.fields.units_available
          - entities.Facility.fields.units_occupied
        distinguishing_aspect: |
          Conserved quantity = facility unit COUNT: at every step
          units_available+units_reserved+units_occupied+units_out_of_service == 1 (the single unit);
          the occupy (move-in) + release (terminate) compensating pair returns units_available to 1.
        test_recipe:
          setup:
