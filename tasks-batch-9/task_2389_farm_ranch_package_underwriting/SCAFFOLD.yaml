    side_effects: ["releases this policy's own RESERVED CatReservation rows first, then re-reserves", "re-values every ACTIVE ScheduledItem at the rating instant", "writes property / livestock / liability / base / cat_load / total premium figures and exposed_tiv_cents", "creates three CatReservation rows and bumps the three pool versions", "appends one PremiumTransaction per non-zero component in the order BASE_PROPERTY, BASE_LIVESTOCK, BASE_LIABILITY, CAT_LOAD", "sets uw_status to RATED (with quote_expires_at) or REFERRED (with referred_at, referred_by_user_id and referral_reason_code)", "increments FarmPolicy.version by 1"]
