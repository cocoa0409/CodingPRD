              payload: { action: "APPROVE", late_fee_paid: false }
              as: LeagueAdministrator
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_INSUFFICIENT_PERMISSIONS with http 403"
            - "${err2} == ERR_INSUFFICIENT_PERMISSIONS with http 403"

      - name: nested_existence_left_to_right
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", errors.ERR_LEAGUE_NOT_FOUND, errors.ERR_PLAYER_NOT_FOUND]
        distinguishing_aspect: "Path ids validate left-to-right: unknown league -> ERR_LEAGUE_NOT_FOUND even when the player id is also unknown; known league + unknown player -> ERR_PLAYER_NOT_FOUND."
        test_recipe:
          setup: ["One league exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { league_name: "Nested LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
          trigger:
            - call: "GET /leagues/00000000-0000-0000-0000-000000000000/players/00000000-0000-0000-0000-000000000000/eligibility-documents"
              payload: {}
              as: LeagueAdministrator
              captures: { err1: $.data.error_id }
            - call: "GET /leagues/${lg}/players/00000000-0000-0000-0000-000000000000/eligibility-documents"
              payload: {}
              as: LeagueAdministrator
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_LEAGUE_NOT_FOUND (league checked first)"
            - "${err2} == ERR_PLAYER_NOT_FOUND"

      - name: residency_waiver_satisfies_boundary_requirement
        claim_type: conditional
        grounds: [errors.ERR_OUTSIDE_BOUNDARY, state_machines.BoundaryWaiver.PENDING_to_APPROVED]
        distinguishing_aspect: "Conditional validation: a player with neither residence nor school in boundary fails verify with ERR_OUTSIDE_BOUNDARY; an APPROVED RESIDENCY_BOUNDARY waiver covering the current date flips the check to pass."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; player P1 (both flags false, MAJOR age) with fresh documents."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Boundary LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Out", last_name: "Sider", birth_date: "2015-03-10", residence_within_boundary: false, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
          trigger:
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
              captures: { err: $.data.error_id }
            - call: "GET /leagues/${lg}"
              payload: {}
              as: LeagueAdministrator
              captures: { lgv: $.data.version }
            - call: "POST /leagues/${lg}/boundary-waivers"
              payload: { player_id: "${p1}", waiver_type: "RESIDENCY_BOUNDARY", reason: "parental relocation", valid_from: "2027-01-01", valid_until: "2027-12-01", expected_league_version: "${lgv}" }
              as: LeagueAdministrator
              captures: { w: $.data.id }
            - call: "POST /leagues/${lg}/boundary-waivers/${w}/decide"
