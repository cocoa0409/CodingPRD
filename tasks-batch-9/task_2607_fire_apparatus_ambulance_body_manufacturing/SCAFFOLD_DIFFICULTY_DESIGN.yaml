              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-22T00:00:00Z", slot_end_date: "2026-10-06T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v2}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r3_id: $.data.id }
          assert:
            - "the back-to-back window 2026-09-15 .. 2026-09-29 is rejected 409 ERR_SLOT_WINDOW_CONFLICT: new.slot_start_date == existing.slot_end_date still falls inside the inflated end 2026-09-22"
