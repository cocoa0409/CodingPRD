              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/routes/${r1}/stops"
              payload: { customer_id: "${cust_id}", sequence_index: 1 }
              as: Dispatcher
              captures: { s1: '$.data.id' }
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            # Skip the stop on 2026-05-01
            - call: "POST /api/v1/stops/${s1}/skip"
              payload: { skip_reason: "customer not available", notified_before_cutoff: true }
              as: Driver
            # Capture the generated SkipCredit
            - call: "GET /api/v1/customers/${cust_id}/skip-credits"
