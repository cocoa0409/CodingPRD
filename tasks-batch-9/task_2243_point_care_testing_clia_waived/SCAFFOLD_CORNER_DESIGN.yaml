            - call: "GET /poct/pt-enrollments/${enr_id}"
              as: QualityCoordinator
              captures: { enr_status_1: $.data.status, fails_1: $.data.fail_count_last_three, graded_1: $.data.graded_event_count }
            - call: "POST /poct/pt-events/${ev_2}/score"
              payload: { score_pct: 65.00, graded_on: "2026-09-01" }
              as: QualityCoordinator
              captures: { s2_outcome: $.data.outcome, s2_status: $.data.status }
            - call: "GET /poct/pt-enrollments/${enr_id}"
