# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3210_event_cinema_one_night_booking_theater_guarantee
#
# Depth probe: nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Every ground resolves into SCAFFOLD.yaml §1.1-§1.7. No independent rule
# source — deleting this file leaves the scaffold's declared behavior identical.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: guarantee_ceiling_dual_variant_on_booking
        grounds:
          - calculations.guarantee_floor_derivation
          - calculations.guarantee_floor_derivation.variants.PER_SCREEN_LOADED
          - calculations.guarantee_floor_derivation.variants.AGGREGATE_CAPPED
          - entities.Booking.fields.guarantee_ceiling_cents
          - state_machines.Booking.PENDING_APPROVAL_to_APPROVED
          - state_machines.Booking.APPROVED_to_ON_SALE
        distinguishing_aspect: |
          The booking-domain ceiling has two live variants: PER_SCREEN_LOADED while
          the booking is still negotiating and AGGREGATE_CAPPED once it is on sale.
          Identical booking data yields guarantee_ceiling_cents == 1890000 in the
          first and 1080000 in the second, so the variant — not the inputs —
          decides the number.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. B-rated circuit with a 2000-screen pool, accredited; CA theater with 60 seats."
            - "Title BOOKABLE, 90-minute concert, standard price 1500 cents, max_screen_commitment 60, rights through 2027-03-01."
            - "Booking at guarantee 1500000 cents with one 60-screen line at the CA theater; guarantee is below the PER_SCREEN_LOADED ceiling 1890000 but above the AGGREGATE_CAPPED ceiling 1080000."
          setup_api_calls:
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Kaleidoscope Concerts", contact_email: "prog@kaleidoscope.example", settlement_currency: "USD", guarantee_floor_cents: 1000000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Silverline Cinemas", circuit_code: "SILV", credit_rating: "B", settlement_terms: "NET_30", screen_pool_total: 2000, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Silverline Pasadena", city: "Pasadena", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 60, screen_count: 3, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_id: $.data.id }
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Aurora Live In Concert", content_type: "CONCERT", is_live: false, duration_minutes: 90, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-03-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 60, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1500000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 60, expected_attendance: 70, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
          trigger:
            - call: "GET /event-cinema/bookings/${b_id}"
              payload: {}
              as: PlatformOps
              captures: { ceiling_negotiating: $.data.guarantee_ceiling_cents }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
              captures: { advanced: $.data.advanced_count }
            - call: "GET /event-cinema/bookings/${b_id}"
              payload: {}
              as: PlatformOps
              captures: { ceiling_onsale: $.data.guarantee_ceiling_cents }
          assert:
            - "Booking.${b_id}.status == ON_SALE after the sweep"
            - "the PER_SCREEN_LOADED reading is 1890000 — ${ceiling_negotiating} == 1890000"
            - "the AGGREGATE_CAPPED reading is 1080000 — ${ceiling_onsale} == 1080000"
            - "the two variants differ by 810000 cents on identical booking data, so the variant is load-bearing"
            - "${advanced} == 1"

      - name: settlement_split_dual_variant_on_settlement
        grounds:
          - calculations.settlement_split
          - calculations.settlement_split.variants.ALLOCATION_ORDER
          - calculations.settlement_split.variants.NET_OFF_TOP
          - entities.Settlement.fields.distributor_net_cents
          - entities.Circuit.fields.settlement_terms
        distinguishing_aspect: |
          The settlement-domain split has two live variants selected by
          Circuit.settlement_terms. For gross 3000000, guarantee 1000000, share 0.40,
          top-up 0, adjustment 0 and makegood 0, ALLOCATION_ORDER pays the
          distributor 1800000 while NET_OFF_TOP pays 1200000 — a 600000-cent divergence
          on identical reported attendance, with the exhibitor taking the residual
          in both.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-20T00:00:00Z, after the screenings have run. One NET_30 circuit and one GROSS_ON_GROSS circuit, each with one reported line."
            - "Both confirmed bookings carry guarantee 1000000 cents and revenue_share_pct 0.40; both report gross 3000000 cents with no top-up, adjustment or make-good."
          setup_api_calls:
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Retro Marquee Releasing", contact_email: "acq@retromarquee.example", settlement_currency: "USD", guarantee_floor_cents: 10000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Meridian Screens", circuit_code: "MERI", credit_rating: "A", settlement_terms: "NET_30", screen_pool_total: 600, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_net_id: $.data.id }
            - call: "POST /event-cinema/circuits/${circ_net_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Grossline Theatres", circuit_code: "GSLN", credit_rating: "A", settlement_terms: "GROSS_ON_GROSS", screen_pool_total: 600, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_gross_id: $.data.id }
            - call: "POST /event-cinema/circuits/${circ_gross_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_net_id}", theater_name: "Meridian Burbank", city: "Burbank", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 200, screen_count: 4, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_net_id}"
              captures: { th_net_id: $.data.id }
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_gross_id}", theater_name: "Grossline Glendale", city: "Glendale", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 200, screen_count: 4, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_gross_id}"
              captures: { th_gross_id: $.data.id }
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Anniversary Restoration: The Long Road", content_type: "ANNIVERSARY", is_live: false, duration_minutes: 120, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-06-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 120, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
          trigger:
            - call: "POST /event-cinema/settlements"
              payload: { booking_id: "${b_net_id}", gross_box_office_cents: 3000000, reported_line_count: 1, topup_paid_cents: 0, adjustment_cents: 0 }
              as: FinanceOps
              captures: { settle_net_id: $.data.id, net_alloc: $.data.distributor_net_cents, exh_alloc: $.data.exhibitor_net_cents }
            - call: "POST /event-cinema/settlements"
              payload: { booking_id: "${b_gross_id}", gross_box_office_cents: 3000000, reported_line_count: 1, topup_paid_cents: 0, adjustment_cents: 0 }
              as: FinanceOps
              captures: { settle_gross_id: $.data.id, net_offtop: $.data.distributor_net_cents, exh_offtop: $.data.exhibitor_net_cents }
          assert:
            - "the ALLOCATION_ORDER variant pays the distributor 1800000 — ${net_alloc} == 1800000"
            - "the NET_OFF_TOP variant pays the distributor 1200000 — ${net_offtop} == 1200000"
            - "the variants differ by 600000 cents on identical reported attendance"
            - "both exhibitors take the residual — ${exh_alloc} == 1200000 and ${exh_offtop} == 1800000"
            - "Settlement.${settle_net_id}.invariant_drift_cents == 0 and Settlement.${settle_gross_id}.invariant_drift_cents == 0"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: makegood_credit_tiered_min_formula
        grounds:
          - calculations.makegood_credit_derivation
          - entities.EncryptionKey.fields.issuance_status
          - state_machines.FeedEvent.DETECTED_to_CONFIRMED
          - state_machines.Screening.SCHEDULED_to_SKIPPED_INCOMPLETE
        distinguishing_aspect: |
          Mode (a): a formula with five inputs that interact non-linearly — a
          four-way tier selected by outage_minutes, a lost fraction that scales by
          those same minutes, and a nested min() against a venue-seat cap. A 10-minute
          outage on a 100-seat house at 1500 cents over a 90-minute runtime credits
          4167 cents; the 30-minute tier on the same screening credits exactly
          30000 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-12-01T20:45:00Z, after the screening ended. One confirmed booking, B-rated circuit, CA theater with 60 seats."
            - "A single 90-minute screening that reported SKIPPED_INCOMPLETE with 100 attendees; a FeedEvent filed for it with outage_minutes 10."
          setup_api_calls:
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Lantern Faith Media", contact_email: "ops@lanternfaith.example", settlement_currency: "USD", guarantee_floor_cents: 10000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Heartland Screens", circuit_code: "HRTL", credit_rating: "B", settlement_terms: "NET_30", screen_pool_total: 400, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Heartland Tulsa", city: "Tulsa", state_code: "CA", timezone: "America/Chicago", seats_total: 60, screen_count: 2, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_id: $.data.id }
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Easter Vigil Live", content_type: "LIVE_BROADCAST", is_live: true, duration_minutes: 90, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-03-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 40, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 40, expected_attendance: 100, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${b_id}/confirm"
              payload: { expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { b_v5: $.data.version }
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/feed-events"
              payload: { booking_id: "${b_id}", failure_type: "FEED_LOSS", detected_at_utc: "2026-12-01T19:05:00Z", outage_minutes: 10 }
              as: PlatformOps
              captures: { fe_id: $.data.id }
            - call: "POST /event-cinema/feed-events/${fe_id}/confirm"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T20:45:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 100, reported_outcome: "SKIPPED_INCOMPLETE" }
              as: Theater
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/apply-makegood"
              payload: { line_id: "${line_id}", feed_event_id: "${fe_id}", expected_booking_version: "${b_v5}" }
              as: PlatformOps
              captures: { mg_total: $.data.makegood_credit_cents, committed: $.data.committed_screens_total }
          assert:
            - "the tier for a 10-minute outage is RATE_TIER_3 0.25, so the raw credit is 0.25 * 1500 * 100 * (10/90) = 4166.67 cents rounding to 4167"
            - "the seat cap is 60 * 1500 * 0.5 = 45000, so the nested min() does not bind and Booking.${b_id}.makegood_credit_cents == 4167 — ${mg_total} == 4167"
            - "the line's own credit is the booking total here, one line to one screening — GET /event-cinema/booking-lines/${line_id} reports credit_issued_cents == 4167"
            - "the same screening at outage_minutes 30 selects RATE_TIER_2 0.60 and yields 0.60 * 1500 * 100 * (30/90) = 30000 cents exactly"
            - "the same screening at outage_minutes 4 selects RATE_TIER_4 0.00 and yields exactly 0 cents even though the outage is real"

      - name: settlement_payment_rate_gate_evaluation_order
        grounds:
          - calculations.settlement_split
          - entities.Settlement.fields.invariant_drift_cents
          - entities.Booking.fields.guarantee_cents
          - entities.Circuit.fields.settlement_terms
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency whose evaluation order is pinned.
          payment_rate_pct is tiered on a gate ratio computed from
          Booking.guarantee_cents, yet the amount the rate is applied to is itself
          the guarantee — the value is well-defined only because the order is fixed
          to (guarantee read, tier selected, covered computed, residual derived).
          Selecting the tier against the already-covered amount instead would move a
          straddling booking across the 1.5 gate and change the cents paid.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-20T00:00:00Z. A NET_30 circuit whose booking carries guarantee 1000000 cents and share 0.40, with one reported line."
            - "Recorded gross is 3000000 cents against guarantee 1000000, giving gate_ratio 3.0 and the top payment-rate tier; top-up, adjustment and make-good are all 0."
          setup_api_calls:
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Northlight Documentaries", contact_email: "slate@northlight.example", settlement_currency: "USD", guarantee_floor_cents: 10000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Beacon Arts Screens", circuit_code: "BEA1", credit_rating: "A", settlement_terms: "NET_60", screen_pool_total: 300, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Beacon Arts Berkeley", city: "Berkeley", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 180, screen_count: 2, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_id: $.data.id }
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Deep Field: A Space Anniversary", content_type: "ANNIVERSARY", is_live: false, duration_minutes: 100, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-06-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 30, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 30, expected_attendance: 180, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "POST /event-cinema/bookings/${b_id}/confirm"
              payload: { expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { b_v5: $.data.version }
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:30:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 175, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /event-cinema/settlements"
              payload: { booking_id: "${b_id}", gross_box_office_cents: 3000000, reported_line_count: 1, topup_paid_cents: 0, adjustment_cents: 0 }
              as: FinanceOps
              captures: { settle_id: $.data.id, dist_net: $.data.distributor_net_cents, drift: $.data.invariant_drift_cents }
          assert:
            - "the pinned order selects the top tier because 3000000 / 1000000 == 3.0 >= 1.5, giving payment_rate_pct 1.00"
            - "covered is min(1000000 * 1.00, 3000000) == 1000000 and residual_cash == 2000000"
            - "the revenue-share term is round_half_up(2000000 * 0.40) == 800000"
            - "Settlement.${settle_id}.distributor_net_cents == 1800000 — ${dist_net} == 1800000"
            - "Settlement.${settle_id}.invariant_drift_cents == 0 — ${drift} == 0"
            - "selecting the tier against the covered amount rather than the guarantee would read gate_ratio 3.0 again and pay the same 1800000 for this input, but moves a booking whose gross sits at 1.4x its guarantee onto the 0.75 tier and changes the cents — the gate input is therefore pinned, not incidental"
  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: booking_negotiation_cycle_and_counter_cap
        grounds:
          - state_machines.Booking.PENDING_APPROVAL_to_COUNTERED
          - state_machines.Booking.COUNTERED_to_PENDING_APPROVAL
          - validations[priority=23]
          - errors[ERR_COUNTER_LIMIT_REACHED]
          - entities.Booking.fields.status
        distinguishing_aspect: |
          The Booking machine is cyclic, not linear: PENDING_APPROVAL <-> COUNTERED
          loops, and the loop is additionally bounded at third counter by a
          validation. A booking can return to the state it already occupied, which
          no A->B->C pipeline can express.
        test_recipe:
          setup:
            - &k_clock
              call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - &k_dist
              call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Vermilion Stage Rights", contact_email: "rights@vermilion.example", settlement_currency: "USD", guarantee_floor_cents: 1000000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - &k_circ_b
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Cedar Point Screens", circuit_code: "CEDR", credit_rating: "B", settlement_terms: "NET_30", screen_pool_total: 2000, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - &k_acc_b
              call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - &k_th_ca
              call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Cedar Point Sacramento", city: "Sacramento", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 200, screen_count: 4, showtime_buffer_minutes: 20 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_id: $.data.id }
            - &k_title_a
              call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Midnight Broadcast: Encore Anniversary", content_type: "ANNIVERSARY", is_live: false, duration_minutes: 120, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-06-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 120, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
            - &k_pub_a
              call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
            - &k_booking_draft
              call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - &k_line_60
              call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 60, expected_attendance: 100, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/counter"
              payload: { proposed_guarantee_cents: 4000000, proposed_revenue_share_pct: 0.35, expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version, s1: $.data.status }
            - call: "POST /event-cinema/bookings/${b_id}/re-propose"
              payload: { expected_booking_version: "${b_v4}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v5: $.data.version, s2: $.data.status }
            - call: "POST /event-cinema/bookings/${b_id}/counter"
              payload: { proposed_guarantee_cents: 4000000, proposed_revenue_share_pct: 0.35, expected_booking_version: "${b_v5}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v6: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/re-propose"
              payload: { expected_booking_version: "${b_v6}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v7: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/counter"
              payload: { proposed_guarantee_cents: 4000000, proposed_revenue_share_pct: 0.35, expected_booking_version: "${b_v7}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v8: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/re-propose"
              payload: { expected_booking_version: "${b_v8}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v9: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/counter"
              payload: { proposed_guarantee_cents: 4000000, proposed_revenue_share_pct: 0.35, expected_booking_version: "${b_v9}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { s4th_error: "$.data.error_id" }
          assert:
            - "the first counter lands the booking in COUNTERED — ${s1} == COUNTERED"
            - "the re-propose returns it to the state it already held — ${s2} == PENDING_APPROVAL, so the machine is cyclic and not a pipeline"
            - "Booking.${b_id}.status == PENDING_APPROVAL after three full cycles"
            - "the fourth counter is refused with 409 and ${s4th_error} == ERR_COUNTER_LIMIT_REACHED"
            - "Booking.${b_id}.guarantee_cents == 4000000 after three counters, unchanged by the refused fourth"

      - name: encryption_key_parallel_issuance_and_validity
        grounds:
          - state_machines.EncryptionKey.PENDING_to_ISSUED
          - state_machines.EncryptionKey.ISSUED_to_REVOKED
          - calculations.key_window_alignment
          - entities.EncryptionKey.fields.validity_state
          - entities.EncryptionKey.fields.issuance_status
        distinguishing_aspect: |
          EncryptionKey carries two independent state axes on one row:
          issuance_status (PENDING | ISSUED | REVOKED) and validity_state
          (NOT_YET_VALID | VALID | EXPIRED). Issuing a key does not make it VALID,
          and revoking it does not move it to EXPIRED — the two dimensions advance
          independently of one another.
        test_recipe:
          setup:
            - "Standard CA fixture from the anchor prelude, booking driven to APPROVED with a 120-minute screening on 2026-12-01 at 19:00 UTC."
            - "A file delivery whose lead time is satisfied; clock parked at 2026-11-20T00:00:00Z, well before the 2026-12-01T00:00:00Z key window opens."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:aa11bb22", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id, b_v5: $.data.version }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:aa11bb22" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T00:00:00Z", not_valid_after_utc: "2026-12-01T03:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id, vs_pending: $.data.validity_state }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
              captures: { vs_issued: $.data.validity_state, iss_after_issue: $.data.issuance_status }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T01:00:00Z" }
              as: PlatformOps
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { vs_in_window: $.data.validity_state }
            - call: "POST /event-cinema/keys/${key_id}/revoke"
              payload: { revocation_reason: "CONTENT_FAILURE" }
              as: ContentOfficer
              captures: { vs_after_revoke: $.data.validity_state, iss_after_revoke: $.data.issuance_status }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: PlatformOps
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { vs_expired: $.data.validity_state }
          assert:
            - "a freshly minted key is PENDING and NOT_YET_VALID — ${vs_pending} == NOT_YET_VALID"
            - "issuing the key advances only the issuance axis: ${iss_after_issue} == ISSUED while ${vs_issued} == NOT_YET_VALID because 2026-11-20 is before the key window opens"
            - "inside the window the key reads VALID on the validity axis — ${vs_in_window} == VALID"
            - "revoking advances only the issuance axis: ${iss_after_revoke} == REVOKED while ${vs_after_revoke} == VALID, proving the axes are independent"
            - "after the window closes the revoked key still reports EXPIRED — ${vs_expired} == EXPIRED"

  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: title_withdrawal_four_hop_key_revocation_cascade
        grounds:
          - state_machines.Title.BOOKABLE_to_WITHDRAWN
          - state_machines.Booking.APPROVED_to_CANCELLED
          - state_machines.Screening.SCHEDULED_to_SKIPPED_CANCELLED
          - state_machines.EncryptionKey.ISSUED_to_REVOKED
          - entities.Theater.fields.pending_rekey_count
        distinguishing_aspect: |
          One withdrawal on the Title produces a depth-4 chain in which each hop is
          caused by the previous hop, not by the original action: Title->Booking,
          Booking->BookingLine, BookingLine's Booking->Screening, Screening->EncryptionKey,
          and the key revocation itself bumps Theater.pending_rekey_count.
        test_recipe:
          setup:
            - "Standard CA fixture from the anchor prelude, booking driven to APPROVED with a 120-minute screening, its file delivery verified and its key ISSUED."
            - "Clock at 2026-11-20T00:00:00Z; the circuit's committed_screens_balance is 60 and the theater's pending_rekey_count is 0."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "FILE", content_checksum: "sha256:cc33dd44", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:cc33dd44" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T00:00:00Z", not_valid_after_utc: "2026-12-01T03:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id }
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/titles/${title_id}/withdraw"
              payload: {}
              as: ProgrammingManager
              captures: { title_status: $.data.status }
            - call: "GET /event-cinema/bookings/${b_id}"
              payload: {}
              as: PlatformOps
              captures: { hop1: $.data.status }
            - call: "GET /event-cinema/booking-lines/${line_id}"
              payload: {}
              as: PlatformOps
              captures: { hop2: $.data.exhibit_state }
            - call: "GET /event-cinema/screenings/${scr_id}"
              payload: {}
              as: PlatformOps
              captures: { hop3: $.data.state }
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { hop4: $.data.issuance_status }
            - call: "GET /event-cinema/theaters/${th_id}"
              payload: {}
              as: PlatformOps
              captures: { rekey: $.data.pending_rekey_count, bal: $.data.status }
          assert:
            - "hop 0: the title is withdrawn — ${title_status} == WITHDRAWN"
            - "hop 1: the booking is cancelled because of the withdrawal, not directly invoked — ${hop1} == CANCELLED"
            - "hop 2: the line is released because of hop 1 — ${hop2} == RELEASED"
            - "hop 3: the screening is cancelled because of hop 1 — ${hop3} == SKIPPED_CANCELLED"
            - "hop 4: the key is revoked because of hop 3, not because of the withdrawal — ${hop4} == REVOKED"
            - "the revocation bumps the venue's rekey backlog — ${rekey} == 1"
            - "the circuit's committed screens fall back to 0 once the line releases — GET /event-cinema/circuits/${circ_id} reports committed_screens_balance == 0"

      - name: venue_go_dark_screening_and_key_cascade
        grounds:
          - state_machines.Screening.SCHEDULED_to_SKIPPED_CANCELLED
          - state_machines.EncryptionKey.PENDING_to_REVOKED
          - entities.Theater.fields.pending_rekey_count
          - entities.Screening.fields.state
        distinguishing_aspect: |
          A different trigger (the venue going dark) drives its own shorter chain —
          Theater->Screening->EncryptionKey with the key revocation incrementing the
          venue counter as the terminal hop. The chain originates from a venue
          transition, not from the title withdrawal of the other instance.
        test_recipe:
          setup:
            - "Standard CA fixture from the anchor prelude, booking APPROVED at 60 screens with a 120-minute screening and one ISSUED key; clock at 2026-11-20T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/content-deliveries"
              payload: { booking_id: "${b_id}", delivery_method: "BOTH", content_checksum: "sha256:ee55ff66", scheduled_delivery_utc: "2026-11-25T00:00:00Z", expected_booking_version: "${b_v4}" }
              as: PlatformOps
              captures: { cd_id: $.data.id }
            - call: "POST /event-cinema/content-deliveries/${cd_id}/mark-delivered"
              payload: { delivered_checksum: "sha256:ee55ff66" }
              as: PlatformOps
            - call: "POST /event-cinema/content-deliveries/${cd_id}/verify"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/encryption-keys"
              payload: { screening_id: "${scr_id}", not_valid_before_utc: "2026-12-01T00:00:00Z", not_valid_after_utc: "2026-12-01T03:00:00Z" }
              as: PlatformOps
              captures: { key_id: $.data.id }
            - call: "POST /event-cinema/keys/${key_id}/issue"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/theaters/${th_id}/go-dark"
              payload: {}
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { th_status: $.data.status }
            - call: "GET /event-cinema/screenings/${scr_id}"
              payload: {}
              as: PlatformOps
              captures: { scr_state: $.data.state }
            - call: "GET /event-cinema/encryption-keys/${key_id}"
              payload: {}
              as: PlatformOps
              captures: { key_state: $.data.issuance_status }
            - call: "GET /event-cinema/theaters/${th_id}"
              payload: {}
              as: PlatformOps
              captures: { rekey2: $.data.pending_rekey_count }
          assert:
            - "the venue goes dark — ${th_status} == DARK"
            - "its scheduled screening is cancelled by the venue transition — ${scr_state} == SKIPPED_CANCELLED"
            - "the key is revoked because of the screening change — ${key_state} == REVOKED"
            - "the venue's rekey backlog is 1 — ${rekey2} == 1"
            - "the booking itself is untouched by this chain — GET /event-cinema/bookings/${b_id} still reports status APPROVED"

  # ===========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_outranks_guarantee_above_ceiling
        grounds:
          - validations[priority=6]
          - validations[priority=27]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_GUARANTEE_ABOVE_CEILING]
          - state_machines.Booking.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          The conflict is state (priority 6) against business_fiscal (priority 27):
          a DRAFT booking whose guarantee also exceeds its ceiling violates both, and
          the state check must win with ERR_INVALID_STATE/409 rather than the fiscal
          ERR_GUARANTEE_ABOVE_CEILING/422.
        test_recipe:
          setup:
            - "Standard CA fixture. Booking left in DRAFT with one 60-screen line whose guarantee 5000000 cents exceeds the AGGREGATE_CAPPED ceiling of 1260000."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 5000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - *k_line_60
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the request fails with status 409, not 422 — the state conflict outranks the fiscal one"
            - "the error is the state one — ${err_id} == ERR_INVALID_STATE"
            - "the fiscal condition is genuinely violated too — Booking.${b_id}.guarantee_cents == 5000000 is above the AGGREGATE_CAPPED ceiling 1260000, so this is a true dual failure and not a single-condition test"
            - "Booking.${b_id}.status is unchanged at DRAFT"

      - name: rights_expired_outranks_rights_window_violation
        grounds:
          - validations[priority=15]
          - validations[priority=19]
          - errors[ERR_RIGHTS_EXPIRED]
          - errors[ERR_RIGHTS_WINDOW_VIOLATION]
          - state_machines.Booking.ON_SALE_to_CONFIRMED
        distinguishing_aspect: |
          The conflict is business_safety (priority 15) against business_constraint
          (priority 19): a booking on sale whose title rights have since been shrunk
          and whose clock has passed the shortened expiry violates both, and the
          safety check must win with ERR_RIGHTS_EXPIRED/422.
        test_recipe:
          setup:
            - "Standard CA fixture. Booking driven to ON_SALE; the title's rights_end_utc is then amended backwards to 2026-11-15T00:00:00Z and the clock moved to 2026-11-20T00:00:00Z, which is past the amended expiry but still before the 2026-12-01 showtime."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
