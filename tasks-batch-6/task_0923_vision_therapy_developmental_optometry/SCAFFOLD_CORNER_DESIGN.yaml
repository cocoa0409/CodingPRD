      - name: logical_clock_defaults_to_2026_05_01_before_any_set_call
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /vision-therapy/_clock/set_current_utc]
          - calculations.patient_age_years
          - entities.Referral.fields.sla_due_at
        distinguishing_aspect: "With no set_current_utc call anywhere in the chain the logical clock reads exactly 2026-05-01T00:00:00Z, so a ROUTINE referral created first thing gets sla_due_at 2026-05-06T00:00:00.000Z and never a wall-clock-derived value."
        test_recipe:
          setup:
            - "Completely empty database and no clock call at all - the server default must be in force."
          setup_api_calls:
            - call: "POST /vision-therapy/patients"
              payload: { full_name: "Ana Ruiz", date_of_birth: "2016-06-01", diagnosis_category: "CONVERGENCE_INSUFFICIENCY" }
              as: FrontDesk
              captures: { pt: $.data.id }
          trigger:
            - call: "POST /vision-therapy/referrals"
              payload: { patient_id: "${pt}", direction: "INBOUND", urgency: "ROUTINE", referring_provider_name: "Dr Amara Family Eyecare", target_provider_name: "Vision Therapy Clinic", reason: "Convergence insufficiency workup" }
              as: FrontDesk
              captures: { sla: $.data.sla_due_at, st: $.data.status }
            - call: "POST /vision-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
          assert:
            - "${sla} == 2026-05-06T00:00:00.000Z, that is the default clock plus ROUTINE_REFERRAL_SLA_HOURS 120"
            - "${st} == SENT"
            - "the set_current_utc response reports current_utc == 2026-06-01T00:00:00.000Z"

