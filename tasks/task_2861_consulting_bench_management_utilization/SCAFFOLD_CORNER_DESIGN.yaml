              captures: { d1_closed_v: $.data.version }
          trigger:
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
              captures: { err_qualify: $.data.error_id }
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
              captures: { err_mode: $.data.error_id }
            - call: "POST /demand-opportunities/${d1_id}/close"
              payload: { outcome: "LOST" }
              as: SalesLead
              captures: { err_close: $.data.error_id }
          assert:
            - "the setup close returned 200 with pipeline_status == \"CLOSED_LOST\", closed_outcome == \"LOST\", staffing_status still \"UNSTAFFED\" and ${d1_closed_v} == 2"
            - "${err_qualify} == ERR_OPPORTUNITY_STATE_INVALID with HTTP 409"
            - "${err_mode} == ERR_OPPORTUNITY_STATE_INVALID with HTTP 409"
            - "${err_close} == ERR_OPPORTUNITY_STATE_INVALID with HTTP 409"
            - "DemandOpportunity.${d1_id}.version is still ${d1_closed_v} after all three rejections"

      - name: reskilling_completion_graduates_the_cohort_and_upgrades_the_assertion
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReskillingProgram.RUNNING_to_COMPLETED
