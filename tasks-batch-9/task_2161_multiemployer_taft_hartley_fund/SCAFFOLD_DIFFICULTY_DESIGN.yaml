# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2161 — Multiemployer (Taft-Hartley) Benefit Fund Administration
# 9 rule_ids x 2 instances = 18 instances. Every ground resolves into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: delinquency_basis_statutory_vs_plan_schedule_diverge
        grounds:
          - calculations.delinquency_charges
          - entities.DelinquencyAssessment.fields.basis
          - entities.DelinquencyAssessment.fields.liquidated_damages_cents
          - entities.Fund.fields.grace_days
          - entities.Fund.fields.ld_floor_cents
        distinguishing_aspect: |
          This dual variant lives on the DelinquencyAssessment money domain: two assessments
          raised on one identical report at one identical clock instant produce total_cents
          434494 under STATUTORY and 397404 under PLAN_SCHEDULE, because STATUTORY charges
          interest from day 1 and doubles it against a flat 20% damages figure while
          PLAN_SCHEDULE first subtracts 15 grace days from the interest clock and then reads a
          tiered damages rate off the ungraced days_late.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-19T00:00:00Z."
            - "Fund with interest_rate_annual_bps 900, ld_rate_bps 2000, ld_floor_cents 5000, grace_days 15."
            - "Employer contributing at 825500 millicents/hour with one SUBMITTED, UNPAID 2026-03 report of three lines totalling 357668 cents due 2026-04-20, i.e. exactly 60 days late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Local 212 Health and Pension Fund", ein: "36-1234567", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Bo Ferreira", ssn_last4: "2290" }
              as: FundAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Cy Nakamura", ssn_last4: "8813" }
              as: FundAdministrator
              captures: { p3_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v}", lines: [ { participant_id: "${p1_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" }, { participant_id: "${p2_id}", hours: 148.70, gross_wages_cents: 520000, work_classification: "APPRENTICE" }, { participant_id: "${p3_id}", hours: 166.10, gross_wages_cents: 710000, work_classification: "FOREMAN" } ] }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
              captures: { r1_id: $.data.id, r1_due: $.data.due_date, r1_due_cents: $.data.total_contributions_due_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: FundAdministrator
          trigger:
            - call: "POST /contribution-reports/${r1_id}/delinquency-assessments"
              payload: { basis: "STATUTORY" }
              as: FundAdministrator
              captures: { a_stat_id: $.data.id }
            - call: "POST /contribution-reports/${r1_id}/delinquency-assessments"
              payload: { basis: "PLAN_SCHEDULE" }
              as: FundAdministrator
              captures: { a_plan_id: $.data.id }
          assert:
            - "ContributionReport.${r1_id}.due_date == '2026-04-20'"
            - "ContributionReport.${r1_id}.total_contributions_due_cents == 357668"
            - "DelinquencyAssessment.${a_stat_id}.days_late == 60"
            - "DelinquencyAssessment.${a_stat_id}.principal_cents == 357668"
            - "DelinquencyAssessment.${a_stat_id}.interest_cents == 5292"
            - "DelinquencyAssessment.${a_stat_id}.liquidated_damages_cents == 71534"
            - "DelinquencyAssessment.${a_stat_id}.total_cents == 434494"
            - "DelinquencyAssessment.${a_plan_id}.days_late == 60"
            - "DelinquencyAssessment.${a_plan_id}.principal_cents == 357668"
            - "DelinquencyAssessment.${a_plan_id}.interest_cents == 3969"
            - "DelinquencyAssessment.${a_plan_id}.liquidated_damages_cents == 35767"
            - "DelinquencyAssessment.${a_plan_id}.total_cents == 397404"
            - "DelinquencyAssessment.${a_stat_id}.total_cents - DelinquencyAssessment.${a_plan_id}.total_cents == 37090"

      - name: pension_credit_hours_based_vs_elapsed_time_diverge
        grounds:
          - calculations.pension_credit_accrual
          - entities.Fund.fields.accrual_method
          - entities.PensionAccrual.fields.pension_credit
          - entities.PensionAccrual.fields.vesting_year_earned
          - entities.Participant.fields.vesting_service_years
        distinguishing_aspect: |
          This dual variant lives on the Participant / PensionAccrual benefit domain, not on any
          money field: one identical 151.30-hour 2026-03 filing yields pension_credit 0.00 and
          vesting_year_earned false in a HOURS_BASED fund but pension_credit 1.00 and
          vesting_year_earned true in an ELAPSED_TIME fund, because HOURS_BASED buys credit in
          250-hour quarters while ELAPSED_TIME grants a whole credit for any covered year.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Two funds identical except accrual_method: fund H is HOURS_BASED, fund E is ELAPSED_TIME."
            - "One employer and one participant in each fund; each employer files and the administrator posts a 2026-03 report carrying exactly one 151.30-hour JOURNEYMAN line for its own participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Hours Based Fund", ein: "36-1000001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_h_id: $.data.id }
            - call: "POST /funds"
              payload: { name: "Elapsed Time Fund", ein: "36-1000002", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "ELAPSED_TIME", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_e_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_h_id}", legal_name: "Hours Employer", ein: "36-2000001", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_h_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_e_id}", legal_name: "Elapsed Employer", ein: "36-2000002", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_e_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_h_id}", full_name: "Hana Ito", ssn_last4: "1001" }
              as: FundAdministrator
              captures: { p_h_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_e_id}", full_name: "Emil Novak", ssn_last4: "1002" }
              as: FundAdministrator
              captures: { p_e_id: $.data.id }
            - call: "GET /employers/${emp_h_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_h_v: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_h_id}", work_period: "2026-03", expected_employer_version: "${emp_h_v}", lines: [ { participant_id: "${p_h_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
              captures: { r_h_id: $.data.id }
            - call: "GET /employers/${emp_e_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_e_v: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_e_id}", work_period: "2026-03", expected_employer_version: "${emp_e_v}", lines: [ { participant_id: "${p_e_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" } ] }
              as: FundAdministrator
              captures: { r_e_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${r_h_id}/post"
              payload: {}
              as: FundAdministrator
            - call: "POST /contribution-reports/${r_e_id}/post"
              payload: {}
              as: FundAdministrator
          assert:
            - "GET /participants/${p_h_id}/pension-accruals returns exactly 1 row with plan_year == 2026"
            - "PensionAccrual(participant=${p_h_id}, plan_year=2026).hours_credited == 151.30"
            - "PensionAccrual(participant=${p_h_id}, plan_year=2026).pension_credit == 0.00"
            - "PensionAccrual(participant=${p_h_id}, plan_year=2026).vesting_year_earned == false"
            - "PensionAccrual(participant=${p_h_id}, plan_year=2026).break_in_service == true"
            - "Participant.${p_h_id}.vesting_service_years == 0"
            - "Participant.${p_h_id}.total_pension_credits == 0.00"
            - "PensionAccrual(participant=${p_e_id}, plan_year=2026).hours_credited == 151.30"
            - "PensionAccrual(participant=${p_e_id}, plan_year=2026).pension_credit == 1.00"
            - "PensionAccrual(participant=${p_e_id}, plan_year=2026).vesting_year_earned == true"
            - "Participant.${p_e_id}.vesting_service_years == 1"
            - "Participant.${p_e_id}.total_pension_credits == 1.00"
            - "Participant.${p_e_id}.vested == false"

  - rule_id: combinatorial_formula
    instances:
      - name: contribution_due_rounds_per_line_before_summing
        grounds:
          - calculations.contribution_due
          - entities.ContributionLine.fields.contribution_cents
          - entities.ContributionLine.fields.work_classification
          - entities.ContributionReport.fields.total_contributions_due_cents
          - entities.Employer.fields.contribution_rate_millicents_per_hour
        distinguishing_aspect: |
          Mode (b) nested rounding: the same three lines total 357668 cents when each line is
          rounded half-up first and the rounded cents are summed, but 357669 cents when the
          three exact products are summed and the total is rounded once; the scaffold pins
          round-per-line-then-sum, so 357668 is the only correct answer and a one-cent
          difference falsifies the wrong order.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Employer contributing at 825500 millicents/hour with three participants enrolled."
            - "A single 2026-03 filing carrying 151.30 JOURNEYMAN, 148.70 APPRENTICE and 166.10 FOREMAN hours, whose exact unrounded products are 124897.5125, 61376.4625 and 171394.5375 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Rounding Fund", ein: "36-1100001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Bo Ferreira", ssn_last4: "2290" }
              as: FundAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Cy Nakamura", ssn_last4: "8813" }
              as: FundAdministrator
              captures: { p3_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v: $.data.version }
          trigger:
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v}", lines: [ { participant_id: "${p1_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" }, { participant_id: "${p2_id}", hours: 148.70, gross_wages_cents: 520000, work_classification: "APPRENTICE" }, { participant_id: "${p3_id}", hours: 166.10, gross_wages_cents: 710000, work_classification: "FOREMAN" } ] }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
              captures: { r1_id: $.data.id }
          assert:
            - "ContributionReport.${r1_id}.total_contributions_due_cents == 357668"
            - "ContributionReport.${r1_id}.total_contributions_due_cents != 357669"
            - "ContributionReport.${r1_id}.total_hours_reported == 466.10"
            - "GET /contribution-reports/${r1_id}/lines returns 3 rows"
            - "ContributionLine(report=${r1_id}, participant=${p1_id}).contribution_cents == 124898"
            - "ContributionLine(report=${r1_id}, participant=${p2_id}).contribution_cents == 61376"
            - "ContributionLine(report=${r1_id}, participant=${p3_id}).contribution_cents == 171394"

      - name: withdrawal_schedule_cap_evaluation_order_pinned
        grounds:
          - calculations.withdrawal_payment_schedule
          - calculations.withdrawal_liability_allocation
          - entities.WithdrawalAssessment.fields.twenty_year_cap_applied
          - entities.WithdrawalAssessment.fields.capped_liability_cents
          - entities.WithdrawalAssessment.fields.de_minimis_reduction_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: schedule_years is derived from
          net_liability_cents while capped_liability_cents is derived from schedule_years, and
          the pinned order forbids re-deriving de_minimis_reduction_cents after the cap fires —
          net_liability_cents stays 60000000 with de_minimis_reduction_cents 0 while
          capped_liability_cents collapses to 1651000 over exactly 20 installments, which an
          implementation that iterates the cap to a fixed point cannot reproduce.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "Fund with total_uvb_cents 100000000, no allocations yet, pool contributions 20000000 in each of the five prior years."
            - "Employer whose five prior-year contributions are 12000000 each (60% of the pool) but whose five prior-year base units are only 100 hours each, so the annual payment base is tiny relative to the allocated liability."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Cap Test Fund", ein: "36-1200001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Capstone Erectors", ein: "36-9000001", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [12000000, 12000000, 12000000, 12000000, 12000000], prior_year_base_units: [100, 100, 100, 100, 100] }
              as: FundAdministrator
              captures: { emp_cap_id: $.data.id }
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /withdrawal-assessments"
              payload: { employer_id: "${emp_cap_id}", withdrawal_date: "2026-03-31", method: "PRESUMPTIVE", expected_fund_version: "${fund_v}" }
              as: FundAdministrator
              captures: { wl_cap_id: $.data.id }
          assert:
            - "WithdrawalAssessment.${wl_cap_id}.employer_share_fraction == 0.6000000000"
            - "WithdrawalAssessment.${wl_cap_id}.raw_allocation_cents == 60000000"
            - "WithdrawalAssessment.${wl_cap_id}.de_minimis_reduction_cents == 0"
            - "WithdrawalAssessment.${wl_cap_id}.net_liability_cents == 60000000"
            - "WithdrawalAssessment.${wl_cap_id}.annual_payment_cents == 82550"
            - "WithdrawalAssessment.${wl_cap_id}.twenty_year_cap_applied == true"
            - "WithdrawalAssessment.${wl_cap_id}.schedule_years == 20"
            - "WithdrawalAssessment.${wl_cap_id}.capped_liability_cents == 1651000"
            - "WithdrawalAssessment.${wl_cap_id}.status == DRAFT"
            - "Employer.${emp_cap_id}.status == WITHDRAWN"

  - rule_id: non_linear_state_machine
    instances:
      - name: report_filing_and_payment_axes_advance_independently
        grounds:
          - state_machines.ContributionReport.SUBMITTED_to_POSTED
          - state_machines.ContributionReport.UNPAID_to_PARTIAL
          - state_machines.ContributionReport.PARTIAL_to_PAID_IN_FULL
          - entities.ContributionReport.fields.filing_status
          - entities.ContributionReport.fields.payment_status
        distinguishing_aspect: |
          Non-linearity here is parallel state dimensions on ContributionReport: filing_status
          moves SUBMITTED -> POSTED while payment_status independently sits at PARTIAL, and
          payment_status later reaches PAID_IN_FULL without filing_status moving at all, so the
          observable pair (filing_status, payment_status) takes the combinations
          (SUBMITTED, PARTIAL), (POSTED, PARTIAL) and (POSTED, PAID_IN_FULL) in that order.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "One employer with one participant and a SUBMITTED, UNPAID 2026-03 report of a single 151.30-hour JOURNEYMAN line worth 124898 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FundAdministrator
            - call: "POST /funds"
              payload: { name: "Parallel Axis Fund", ein: "36-1300001", interest_rate_annual_bps: 900, ld_rate_bps: 2000, ld_floor_cents: 5000, grace_days: 15, hours_per_coverage_month: 120, bank_cap_hours: 480, max_advance_coverage_months: 12, eligibility_lag_months: 2, accrual_method: "HOURS_BASED", pool_prior_year_contributions_cents: [20000000, 20000000, 20000000, 20000000, 20000000], total_uvb_cents: 100000000 }
              as: FundAdministrator
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { fund_id: "${fund_id}", legal_name: "Ironbridge Mechanical", ein: "36-7654321", contribution_rate_millicents_per_hour: 825500, prior_year_contributions_cents: [4000000, 5000000, 6000000, 5500000, 4500000], prior_year_base_units: [4800, 6000, 7200, 6600, 5400] }
              as: FundAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /participants"
              payload: { fund_id: "${fund_id}", full_name: "Ada Kowalski", ssn_last4: "4417" }
              as: FundAdministrator
              captures: { p1_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", work_period: "2026-03", expected_employer_version: "${emp_v}", lines: [ { participant_id: "${p1_id}", hours: 151.30, gross_wages_cents: 600000, work_classification: "JOURNEYMAN" } ] }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${r1_id}/remit"
              payload: { amount_cents: 50000 }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
            - call: "POST /contribution-reports/${r1_id}/post"
              payload: {}
              as: FundAdministrator
            - call: "POST /contribution-reports/${r1_id}/remit"
              payload: { amount_cents: 74898 }
              as: ContributingEmployer
              as_user_id: "${emp_id}"
          assert:
            - "after the first remit, ContributionReport.${r1_id}.filing_status == SUBMITTED and payment_status == PARTIAL and amount_remitted_cents == 50000"
            - "after the post, ContributionReport.${r1_id}.filing_status == POSTED and payment_status == PARTIAL"
            - "after the second remit, ContributionReport.${r1_id}.filing_status == POSTED and payment_status == PAID_IN_FULL"
            - "ContributionReport.${r1_id}.amount_remitted_cents == 124898"
            - "ContributionReport.${r1_id}.posted_at is non-null and paid_in_full_at is non-null"
            - "Participant.${p1_id}.credited_hours_total == 151.30"
            - "Employer.${emp_id}.cumulative_delinquent_cents == 0"

      - name: payroll_audit_dispute_returns_to_fieldwork_cycle
        grounds:
          - state_machines.PayrollAudit.IN_FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.PayrollAudit.FINDINGS_ISSUED_to_IN_FIELDWORK
          - entities.PayrollAudit.fields.round_count
          - entities.PayrollAudit.fields.findings
          - errors[ERR_AUDIT_ROUND_LIMIT_REACHED]
        distinguishing_aspect: |
          Non-linearity here is a true cycle on a different entity, PayrollAudit: the pair
          IN_FIELDWORK -> FINDINGS_ISSUED -> IN_FIELDWORK repeats, incrementing round_count from
