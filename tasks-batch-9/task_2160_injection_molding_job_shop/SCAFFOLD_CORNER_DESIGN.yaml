            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
          trigger:
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE", note: "self review attempt" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err_id: $.data.error_id } }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
          assert:
            - "the qe-alice call returns status 403 and ${err_id} == ERR_SEGREGATION_OF_DUTIES"
            - "after the qe-alice call PPAPSubmission.${ppap_id}.status == SUBMITTED and internal_reviewed_by_user_id == null"
            - "the qe-bob call returns 200, status == UNDER_REVIEW and internal_reviewed_by_user_id == qe-bob"

      - name: request_missing_x_user_role_header_returns_unauthenticated
        claim_type: Role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 outranks everything: a POST /customers with no X-User-Role header (rendered here as the reserved non-role Anonymous) returns 401 ERR_UNAUTHENTICATED rather than 403 or 400, even though the body is valid."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: Anonymous, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 401 and ${err_id} == ERR_UNAUTHENTICATED"
            - "no Customer row is created"

