        distinguishing_aspect: "The aggregation reverses cleanly: settling the only participant returns both liability totals to 0.00 and the zero-liability guard reports funded_ratio_bps 10000 with posture FUNDED rather than dividing by zero or leaving the CRITICAL posture behind."
        test_recipe:
