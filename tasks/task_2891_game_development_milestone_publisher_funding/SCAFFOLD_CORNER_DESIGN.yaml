            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 0, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
