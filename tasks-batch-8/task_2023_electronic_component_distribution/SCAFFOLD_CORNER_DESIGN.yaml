  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: list_pagination_and_envelope_shape
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /manufacturer-lines]"]
        distinguishing_aspect: "List responses honor limit/offset with total_count and has_more; every success response carries the fixed meta envelope."
        test_recipe:
          setup: ["Three manufacturer lines created"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-P1", name: "Page Line 1", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-P2", name: "Page Line 2", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-P3", name: "Page Line 3", sourcing_channel: "OPEN_MARKET" }
              as: DistributorAdmin
          trigger:
            - call: "GET /manufacturer-lines?limit=2&offset=0"
              as: DistributorAdmin
            - call: "GET /manufacturer-lines?limit=2&offset=2"
              as: DistributorAdmin
          assert:
            - "Page 1: response_type == array, len(data) == 2, total_count == 3, has_more == true"
            - "Page 2: len(data) == 1, total_count == 3, has_more == false"
            - "Every response contains meta.api_request_id and meta.api_request_timestamp"
            - "Default pagination (no params) would apply limit 10 per response_envelope.pagination_defaults"

      - name: error_envelope_shape_on_failure
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_DUPLICATE_LINE_CODE]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == error and data carries error_id and message."
        test_recipe:
          setup: ["One line LIN-ENV exists"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-ENV", name: "Envelope Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
          trigger:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-ENV", name: "Envelope Line 2", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { err_env_id: $.data.error_id, err_env_msg: $.data.message }
          assert:
            - "response_type == error"
            - "${err_env_id} == ERR_DUPLICATE_LINE_CODE"
            - "${err_env_msg} is a non-empty string"

      - name: fk_reverse_reachability_lists
        claim_type: retrieval
        grounds: ["endpoints[GET /order-lines]", "endpoints[GET /lots]", "endpoints[GET /claims]", "endpoints[GET /lots/{lotId}/exposures]"]
        distinguishing_aspect: "Every FK declared in §1.1 is reverse-reachable: children are listable from their parent id via filtered list or sub-resource."
        test_recipe:
          setup: ["Part with one lot; order with one line; one exposure on the lot"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-FK", name: "FK Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_fk: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_fk}", part_number: "PFK-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_fk: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_fk}", date_code: "202601", qty_received: 50, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_fk: $.data.id }
            - call: "POST /lots/${lot_fk}/exposures"
              payload: { note: "fk check" }
              as: WarehouseOps
              captures: { exp_fk: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust FK", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_fk: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_fk}", lines: [ { part_id: "${part_fk}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_fk: $.data.id }
          trigger:
            - call: "GET /lots?part_id=${part_fk}"
              as: DistributorAdmin
            - call: "GET /order-lines?order_id=${o_fk}"
              as: DistributorAdmin
            - call: "GET /lots/${lot_fk}/exposures"
              as: DistributorAdmin
            - call: "GET /design-registrations?customer_id=${cust_fk}"
              as: DistributorAdmin
          assert:
            - "GET /lots?part_id=${part_fk} returns total_count == 1 with id ${lot_fk}"
            - "GET /order-lines?order_id=${o_fk} returns total_count == 1"
            - "GET /lots/${lot_fk}/exposures returns total_count == 1 with id ${exp_fk}"
            - "GET /design-registrations?customer_id=${cust_fk} returns total_count == 0 (empty set, not an error)"

  # ============================================================ errors
  - section: errors
