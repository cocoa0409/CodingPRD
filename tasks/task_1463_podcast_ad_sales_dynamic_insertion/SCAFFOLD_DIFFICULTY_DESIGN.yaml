              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CT", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 950, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 950, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li1: $.data.id }
            - call: "POST /adnet/line-items/${li1}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "POST_ROLL", reserved_impressions: 1, priority: 5, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li2: $.data.id }
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "PAUSE" }
              as: AdOps
          trigger:
            - call: "POST /adnet/line-items/${li2}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
          assert:
            - "Response error_id == ERR_CAMPAIGN_NOT_ACTIVE (state, priority 6) — not ERR_INSUFFICIENT_INVENTORY (fiscal, priority 11), although reserved_impressions 1 > available_impressions 0 also holds"
            - "LineItem.${li2}.status remains DRAFT and Show.${sh}.available_impressions == 0"

      - name: safety_beats_referential_on_line_item_create
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_BRAND_SAFETY_CONFLICT]
          - errors[ERR_COPY_CAMPAIGN_MISMATCH]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential): the create
