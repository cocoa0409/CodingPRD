              as: HieAdmin
              captures: { ctN2_id: $.data.id }
            - call: "POST /hie/conformance-tests/${ctN2_id}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pN_id}/conformance-tests"
              payload: { profile: "QUERY_RESPONDER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctN3_id: $.data.id }
            - call: "POST /hie/conformance-tests/${ctN3_id}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pN_id}/onboarding-transitions"
