              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_wd_trigger: $.data.error_id }
            - *q_terminate_a
            - call: "POST /oversight/wind-down-plans"
              payload: { partner_id: "${pa_id}", trigger_reason: "VOLUNTARY", end_user_funds_disposition: "TRANSFER_TO_SUCCESSOR", notice_days: 29, target_completion_date: "2026-10-15T00:00:00Z", milestones: ["NOTIFY_END_USERS", "FINAL_SETTLEMENT", "RETURN_FUNDS", "CLOSE_CUSTODY"] }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_wd_notice_min: $.data.error_id }
            - call: "POST /oversight/wind-down-plans"
              payload: { partner_id: "${pa_id}", trigger_reason: "VOLUNTARY", end_user_funds_disposition: "TRANSFER_TO_SUCCESSOR", notice_days: 45, target_completion_date: "2026-09-14T00:00:00Z", milestones: ["NOTIFY_END_USERS", "FINAL_SETTLEMENT", "RETURN_FUNDS", "CLOSE_CUSTODY"] }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_wd_target: $.data.error_id }
            - *q_plan_a
            - call: "POST /oversight/wind-down-plans/${plan_id}/submit"
              payload: { submission_note: "Orderly exit plan." }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - call: "POST /oversight/wind-down-plans/${plan_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Approved by risk." }
