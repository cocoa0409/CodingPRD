  - rule_id: non_linear_state_machine
    instances:
      - name: application_quorum_cycle_referred_under_review
        grounds:
          - state_machines.Application.REFERRED_to_UNDER_REVIEW
          - state_machines.Application.UNDER_REVIEW_to_REFERRED
          - state_machines.Assignment.ACCEPTED_to_DECLINED
        distinguishing_aspect: |
          Application review-status forms a cycle driven by assignment quorum: REFERRED ->
          UNDER_REVIEW on the first live assignment, then UNDER_REVIEW -> REFERRED when a decline
          drops live assignments below 2, then REFERRED -> UNDER_REVIEW again when a replacement
          assignment is created.
        test_recipe:
          setup:
            - "Application referred to a RECRUITING section; two ACTIVE reviewers r1, r2; both assignments created and accepted (application UNDER_REVIEW, live_assignment_count 2)"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
            - { call: "POST /grants/institutes", payload: { name: "National Test Institute", appropriation_cents: 100000000, reserve_cents: 0, indirect_cost_rate: 0.5, select_pay_cap_pct: 0.10, select_pay_extension_percentile: 5.0 }, as: ProgramOfficer, captures: { insti_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-106", title: "R01 Cycle FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section C", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Cycle app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 1", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r1: $.data.id } }
            - { call: "POST /grants/reviewers/${r1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 2", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r2: $.data.id } }
            - { call: "POST /grants/reviewers/${r2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 3", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r3: $.data.id } }
            - { call: "POST /grants/reviewers/${r3}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r3}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { a_1: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { a_2: $.data.id } }
            - { call: "POST /grants/assignments/${a_1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${a_2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
          trigger:
            - { call: "POST /grants/assignments/${a_1}/respond", payload: { decision: "DECLINE" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "GET /grants/applications/${app_a}", payload: {}, as: ProgramOfficer, captures: { mid_status: $.data.status, mid_live: $.data.live_assignment_count } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r3}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { a_3: $.data.id } }
            - { call: "GET /grants/applications/${app_a}", payload: {}, as: ProgramOfficer, captures: { end_status: $.data.status, end_live: $.data.live_assignment_count } }
          assert:
            - "Application.${app_a}.status == UNDER_REVIEW before the decline (setup end-state)"
            - "Assignment.${a_1}.status == DECLINED after respond DECLINE"
            - "Reviewer.${r1}.active_assignment_count == 0 after the decline"
            - "Application.${app_a}.status == REFERRED after the decline (quorum dropped to 1 < 2)"
            - "Application.${app_a}.live_assignment_count == 1 after the decline"
            - "Application.${app_a}.status == UNDER_REVIEW after the replacement assignment"
            - "Application.${app_a}.live_assignment_count == 2 at the end"

      - name: jit_return_resubmit_cycle_to_acceptance
        grounds:
          - state_machines.JitRequest.ISSUED_to_SUBMITTED
          - state_machines.JitRequest.SUBMITTED_to_RETURNED
          - state_machines.JitRequest.RETURNED_to_SUBMITTED
          - state_machines.JitRequest.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          JitRequest is a cyclic machine on a different entity than Application: ISSUED -> SUBMITTED
          -> RETURNED -> SUBMITTED -> ACCEPTED, with the resubmission re-covering all required items
          and the accept recording budget_cut_pct that the award build will consume.
        test_recipe:
          setup:
            - "Funded pipeline: one application selected by payline publication, JitRequest ISSUED with required_items [OTHER_SUPPORT, BUDGET_JUSTIFICATION] and due_date = clock + 30 days"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
