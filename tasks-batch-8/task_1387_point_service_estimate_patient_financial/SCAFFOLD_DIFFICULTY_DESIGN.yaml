              as: FinancialCounselor
              captures: { est_a: $.data.id }
            - call: "POST /clearance/estimates/${est_a}/price"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_a}/present"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/estimates/${est_a}/accept"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-D-2", full_name: "Pat Delta-B", date_of_birth: "1981-02-14" }
              as: Registrar
              captures: { pat_b: $.data.id }
            - call: "POST /clearance/patients/${pat_b}/cases"
              payload: { service_date: "2026-08-20", service_description: "Lab panel" }
              as: Registrar
              captures: { case_b: $.data.id, case_b_v: $.data.version }
            - call: "POST /clearance/cases/${case_b}/estimates"
              payload: { expected_case_version: "${case_b_v}", pricing_mode: "UNINSURED_GFE", lines: [{ cpt_code: "95999", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est_b: $.data.id }
            - call: "POST /clearance/estimates/${est_b}/price"
