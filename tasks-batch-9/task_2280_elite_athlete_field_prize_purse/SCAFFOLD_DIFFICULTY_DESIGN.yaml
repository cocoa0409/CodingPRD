              as: AntiDopingLiaison
              captures: { test1_id: "$.data.id" }
          trigger:
            - call: POST /doping-tests
              payload: { athlete_id: "${ath1_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-10-10T18:00:00Z", window_end_at: "2026-10-10T22:00:00Z", sample_code: "S-W-2" }
              as: AntiDopingLiaison
              captures: { err1: "$.data.error_id" }
            - call: POST /doping-tests
              payload: { athlete_id: "${ath1_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-10-10T18:00:01Z", window_end_at: "2026-10-10T22:00:00Z", sample_code: "S-W-3" }
              as: AntiDopingLiaison
              captures: { test2_id: "$.data.id" }
            - call: POST /doping-tests
