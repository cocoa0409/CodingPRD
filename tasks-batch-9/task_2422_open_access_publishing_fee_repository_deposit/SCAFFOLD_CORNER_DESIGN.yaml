            - "${k1_status_before} == UNSCREENED"
            - "${k1_v_before} == 1"
            - "${k1_score} == 46"
            - "${k1_status} == WATCHLIST"
            - "${k1_guidance} == Venue on watchlist: confirm indexing and peer-review claims before submitting."
            - "${k1_seen} == 2026-08-04T00:00:00Z"
            - "${k1_v_after} == 2"
