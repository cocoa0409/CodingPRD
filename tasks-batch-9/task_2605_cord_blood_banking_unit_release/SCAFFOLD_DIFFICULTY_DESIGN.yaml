  - rule_id: boundary_precision_check
    instances:
      - name: receipt_window_inclusive_at_exactly_48_hours
        grounds:
          - calculations.collection_transit_hours
          - validations[priority 25]
          - endpoints[POST /cbb/collections/{id}/receive]
        distinguishing_aspect: |
          Metric under test is elapsed transit time in hours on the receive endpoint, with the gate
          evaluated on the EXACT rational elapsed value while the persisted hours_to_receipt is rounded to
          2 decimals. The pair 48h00m (accepted) / 48h30m (rejected) pins the comparison as inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:00:00Z when both collections are logged."
            - "Two independent PRIVATE_FAMILY enrollments, each CONSENTED with a DISPATCHED kit and a COLLECTED collection whose collected_at is exactly 2026-08-10T05:00:00Z."
