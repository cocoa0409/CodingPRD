      - name: credit_lifecycle_guards_are_rejected_with_distinct_errors
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BENEFICIARY_CONSENT_REQUIRED
          - errors.ERR_CREDIT_HAS_LIVE_PRESENTATION
          - errors.ERR_ADVISING_BANK_INELIGIBLE
          - errors.ERR_PRESENTATION_WINDOW_CLOSED
          - calculations.presentation_window
        distinguishing_aspect: |
          Four guards on the credit's own lifecycle, separated by which credit they
          are aimed at. Cancelling an ISSUED credit with no
          beneficiary_consent_reference is 422 ERR_BENEFICIARY_CONSENT_REQUIRED and
          the same call WITH the reference then succeeds - proving the guard is the
          missing field and not the state. Cancelling a different credit that
          carries an UNDER_EXAMINATION presentation is 409
          ERR_CREDIT_HAS_LIVE_PRESENTATION even though the consent reference is
          present, so the state guard is ordered ahead of the referential one.
          Naming a SUSPENDED bank as advising bank is caught at POST /credits with
          422 ERR_ADVISING_BANK_INELIGIBLE, not deferred to issuance. And submitting
          on 2026-11-22 is 422 ERR_PRESENTATION_WINDOW_CLOSED because
          presentation_deadline_date is min(2026-11-30, 2026-10-31 + 21) =
          2026-11-21 - the expiry date is NOT the binding bound.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Standard fixture: applicant Baltic Timber Imports AS (NO, CLEARED), USD facility limit_cents 50000000 collateral_required_pct 0 expiring 2027-06-30, bank Nordkyst Bank NDKBNOKK (NO, risk 12, AA, appetite 90000000), beneficiary Riga Sawmill SIA (LV, nominated bank = Nordkyst)."
            - "A second bank Coastline Trade Bank CLTBSEXX (SE, risk 20, A, appetite 50000000) is created and then PATCHed to status SUSPENDED."
            - "Three identical credits C1, C2, C3 are issued off that facility, each amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21 (so presentation_deadline_date is 2026-11-21), each with mandatory COMMERCIAL_INVOICE and BILL_OF_LADING. C1 has no presentations; C2 carries a submitted presentation; C3 carries a fully documented presentation that has not been submitted."
