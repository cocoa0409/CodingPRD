          assert:
            - "FiberInventoryLot.${lot_id}.tons_consumed == 36.000 AND status == DEPLETED after batch B starts, and GET /mill/fiber-balance still reports imbalance_tons == 0.000"
            - "the first GET /reject-streams/summary returns gross 8.500, reversed 0.000, net 8.500, manifested 0.000, unmanifested 8.500, repulped 0.000, so net == manifested + unmanifested holds"
            - "the reverse call returns HTTP 201 and RejectStream.${rs_rev}.reversal_of_id == ${rs_a} AND RejectStream.${rs_rev}.dry_solids_tons == 6.000"
            - "after the reversal, RejectStream.${rs_a}.disposition == REPULPED and RejectStream.${rs_b}.disposition is still PENDING"
            - "the second GET /reject-streams/summary returns gross 8.500, reversed 6.000, net 2.500, manifested 0.000, unmanifested 2.500, repulped 6.000, so the split identity 2.500 == 0.000 + 2.500 still holds"
            - "GET /reject-streams?reversal_of_id=${rs_a} returns total_count == 1"
            - "the second reverse call returns HTTP 409 with data.error_id == \"ERR_ENV_RECORD_INVALID_STATE\" (reverse demands disposition PENDING), so the compensation cannot be applied twice"
            - "the manifest call returns HTTP 404 with data.error_id == \"ERR_REJECT_STREAM_REFERENCE_INVALID\" because the claimed row is a reversal row"
            - "GET /reject-streams/summary after both refusals is unchanged: 8.500 / 6.000 / 2.500 / 0.000 / 2.500 / 6.000"
