  - section: cross_cutting_complexity_layers
    instances:
      - name: assessment_create_rejects_a_vehicle_version_stale_by_one_snapshot
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-vehicle]
          - validations[priority=8]
          - errors[ERR_STALE_VEHICLE_VERSION]
        distinguishing_aspect: |
          The invisible writer is the TELEMATICS GATEWAY, not another technician: a snapshot ingest
          alone advances the vehicle's version, so a technician who read the vehicle before that
          ingest is refused with 412. The refusal must not consume the version either, so the very
          same body succeeds once the fresh version is read - and the newly ingested row is then part
          of the window.
        test_recipe:
          setup:
            - "The canonical chain with three valid snapshots at 56.000 kWh; the technician reads the vehicle and holds its version."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000601", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C401", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { stale_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-26T00:00:00Z", odometer_miles: 71600, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${stale_ver}", module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { fresh_ver: $.data.version }
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${fresh_ver}", module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "GET /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
          assert:
            - "the fourth snapshot ingest returns 201 and advances the vehicle's version, so ${fresh_ver} == ${stale_ver} + 1"
            - "the assessment with the stale version returns 412 ERR_STALE_VEHICLE_VERSION"
            - "the refused call left the pack's modules untouched: faulted_module_count is still 0 and no module reads FAULTED"
            - "the retry with the fresh version returns 201 with window_snapshot_count 4, estimated_capacity_kwh 56.000 (a 4-row window takes a plain mean, not a trimmed one) and retention_pct 70.00"
            - "the assessment listing for the vehicle has total_count 1 - the refusal created nothing"

      - name: dispute_create_rejects_a_claim_version_staled_by_the_adjudication
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispute-create-stale-claim]
          - validations[priority=9]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: |
          The owner's stale view is precisely the pre-adjudication one, so the 412 must be answered
          even though the very act that staled the claim - the adjudication - is what made it
          disputable at all. Priority 9 therefore precedes the priority-21 disputability check: a
          version stale by one is a 412, never a 409.
        test_recipe:
          setup:
            - "The canonical chain to a SUBMITTED claim; the owner reads the claim and holds its version BEFORE the adjudication."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000611", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C411", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_ver: $.data.version }
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver}", module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /battery-warranty/warranty-claims"
              payload: { vehicle_id: "${veh_id}", service_center_id: "${center_id}", assessment_id: "${asmt_id}", diagnosing_technician_id: "${tech_a_id}" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /battery-warranty/warranty-claims/${claim_id}"
              payload: {}
              as: VehicleOwner
              as_user_id: "${veh_id}"
              captures: { stale_claim_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "MODULE_REPLACEMENT" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
              captures: { fresh_claim_ver: $.data.version }
            - call: "POST /battery-warranty/capacity-disputes"
              payload: { claim_id: "${claim_id}", lab_name: "Statewide Cell Lab", owner_statement: "stale read", expected_claim_version: "${stale_claim_ver}" }
              as: VehicleOwner
              as_user_id: "${veh_id}"
            - call: "POST /battery-warranty/capacity-disputes"
              payload: { claim_id: "${claim_id}", lab_name: "Statewide Cell Lab", owner_statement: "fresh read", expected_claim_version: "${fresh_claim_ver}" }
              as: VehicleOwner
              as_user_id: "${veh_id}"
            - call: "GET /battery-warranty/warranty-claims/${claim_id}/capacity-disputes"
              payload: {}
              as: VehicleOwner
              as_user_id: "${veh_id}"
          assert:
            - "the adjudication returns 200 and ${fresh_claim_ver} == ${stale_claim_ver} + 1"
            - "the filing with the stale version returns 412 ERR_STALE_CLAIM_VERSION - not 409 ERR_CLAIM_NOT_DISPUTABLE and not 200"
            - "the filing with the fresh version returns 201 with dispute_status LAB_ASSIGNED, nominal_basis_kwh 80.000, oem_retention_pct 70.00, retest_count 0 and resolved_by_user_id null"
            - "the dispute listing on the claim has total_count 1, and the accepted filing raised the claim's version once more"

      - name: consent_resolicitation_rejects_a_stale_campaign_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-resolicit-stale-campaign]
          - validations[priority=10]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
        distinguishing_aspect: |
          The staling writer here is the OWNER's decline, which lowers open_consent_count on the
          campaign; the second eligible vehicle keeps the campaign open so it does not compound-close
          and the only remaining difference between the refused and accepted call is the version. The
          412 must precede both the priority-26 release check and the priority-64 duplicate check.
        test_recipe:
          setup:
            - "One program and TWO eligible MX-90 / US-WEST vehicles, each with an installed NEW pack."
            - "A CHARGING campaign is FIELD-released, minting one PENDING consent per vehicle; the client reads the campaign version, then the vehicle-1 owner DECLINES."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000621", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000622", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C421", installed_vehicle_id: "${veh1_id}" }
              as: ProgramAdmin
              captures: { pack1_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C422", installed_vehicle_id: "${veh2_id}" }
              as: ProgramAdmin
              captures: { pack2_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns"
              payload: { campaign_code: "CMP-OCC-01", target_defect: "CHARGING", software_version: "bms-4.2.1", applies_to_pack_type: "ANY", applies_to_model_code: "MX-90" }
              as: ProgramAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns/${camp_id}/release"
              payload: { release_scope: "FIELD" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}" }
              as: ProgramAdmin
              captures: { consent1_id: "$.data[0].id" }
            - call: "GET /battery-warranty/remediation-campaigns/${camp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { stale_camp_ver: $.data.version }
            - call: "POST /battery-warranty/remediation-consents/${consent1_id}/decision"
              payload: { decision: "DECLINE" }
              as: VehicleOwner
              as_user_id: "${veh1_id}"
          trigger:
            - call: "POST /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}", expected_campaign_version: "${stale_camp_ver}", superseded_consent_id: "${consent1_id}" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-campaigns/${camp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { fresh_camp_ver: $.data.version }
            - call: "POST /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}", expected_campaign_version: "${fresh_camp_ver}", superseded_consent_id: "${consent1_id}" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-campaigns/${camp_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the FIELD release minted 2 consents, so solicited_consent_count is 2 and open_consent_count was 2"
            - "after the decline the campaign reads open_consent_count 1 and status FIELD_RELEASE - the second vehicle's PENDING consent keeps it from compound-closing"
            - "the re-solicitation with the stale version returns 412 ERR_STALE_CAMPAIGN_VERSION, and ${fresh_camp_ver} != ${stale_camp_ver}"
            - "the re-solicitation with the fresh version returns 201 with solicitation_round 2, consent_status PENDING, superseded_consent_id ${consent1_id} and expires_at 2026-08-15T00:00:00Z"
            - "the campaign then reads solicited_consent_count 3, open_consent_count 2 and applied_count 0, and consent 1 is still DECLINED"

      - name: thermal_event_four_link_cascade
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: s4_thermal_event_cascades_pack_to_vehicle_to_consents_to_campaign_closure
          rationale: |
            The full four-link chain - pack quarantine, vehicle immobilization, consent expiry and
            campaign suspension with the recomputed open_consent_count - is asserted there in one
            request, together with the negative controls on the GRANTED consent and the non-matching
            campaign.
      - name: retention_denominator_forks_by_variant
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: soh_retention_telematics_window_vs_bench_derated_basis
          rationale: |
            That instance runs both variants over the same pack and measured capacity and shows the
            denominators diverging (80.000 vs 70.000) because only the bench variant excludes the
            freshly faulted modules pro rata.
      - name: retention_threshold_boundary_admits_the_claim
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: retention_exactly_at_tier_threshold_qualifies_on_claim_filing
          rationale: |
            The inclusive tier boundary (retention_pct exactly equal to applicable_min_retention_pct
            qualifies) and the one-hundredth-of-a-point miss above it are both asserted there.

  - section: consistency_model
    instances:
      - name: assessment_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints[POST /battery-warranty/soh-assessments]
          - entities.SohAssessment.fields.qualifies_for_claim
        distinguishing_aspect: |
          The declared model is immediate consistency, so the 201 body of a single assessment create
          must already contain the whole derived closure - window size, basis, estimate, retention,
          elapsed months, coverage position, applicable threshold, cell delta and the
          qualifies_for_claim verdict - AND the sibling writes (module statuses, prior-assessment
          supersession, vehicle version) must be visible to the very next read with no polling,
          retry or settle step.
        test_recipe:
