# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_3337 — Franchise Mobile Tool Truck Routes & Customer Credit Extension
# Every grounds: entry resolves to an element declared in SCAFFOLD.yaml §1.1–§1.7.
# Every ${var} is bound by a captures: block earlier in the SAME instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc  (two different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_financing_principal_on_sales_order
        grounds: [calculations.order_financing_variant, calculations.warranty_principal_allocation, state_machines.SalesOrder.DRAFT_to_CONFIRMED, state_machines.SalesOrder.CONFIRMED_to_DELIVERED, state_machines.WarrantyClaim.SUBMITTED_to_APPROVED, entities.SalesOrder.fields.financed_principal_cents]
        distinguishing_aspect: |
          On the SalesOrder domain one order yields two valid principal amounts:
          the PROVISIONAL basis (gross_total_cents, visible while order_status is
          CONFIRMED) and the FINAL basis (gross_total_cents minus every APPROVED
          claim's principal_allocated_cents, written at DELIVER). For an order
          whose gross is 30225 with one approved CLAIM allocating 4800, the two
          bases differ by exactly 4800 and account principal lands at 25425.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (tier A, visit_weekday 1, mix_plan DIAGNOSTIC_WEIGHTED) IN_SERVICE with territory QUALIFIED; shop S1 (zip 75001) ACTIVE on R1"
            - "Technician T ACTIVE at S1, credit_line_limit_cents 100000, months_in_trade 100"
            - "Product P1: unit_cost 12000, retail 15000, 12-month default warranty; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application (approved_limit_cents 50000) minted to credit account A1, ACTIVE, recourse_holder FRANCHISOR"
            - "Order O1 on R1 carries 2 x P1 and is CONFIRMED with gross_total_cents 30225; the PROVISIONAL financed_principal_cents read while CONFIRMED is 30225"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 2, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id", o1_ver: "$.data.version" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM, expected_sales_order_version: "${o1_ver}" }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "GET /retail/sales-orders/${o1_id}", payload: {}, as: RouteSalesRep, captures: { o1_provisional: "$.data.financed_principal_cents" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-10-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/warranty-claims", payload: { line_index: 0, claim_kind: CLAIM, idempotency_key: idem-dual-fin-1, apply_to_account_id: "${a1_id}" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/warranty-claims/${c1_id}/status", payload: { action: SUBMIT }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/warranty-claims/${c1_id}/status", payload: { action: APPROVE }, as: WarrantyAdmin }
          trigger:
            - { call: "GET /retail/sales-orders/${o1_id}", payload: {}, as: CreditOfficer, captures: { o1_final: "$.data.financed_principal_cents", o1_gross: "$.data.gross_total_cents" } }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_principal: "$.data.principal_balance_cents" } }
          assert:
            - "SalesOrder.${o1_id}.gross_total_cents == 30225"
            - "SalesOrder.${o1_id}.financed_principal_cents == 25425"
            - "the PROVISIONAL basis captured while CONFIRMED is SalesOrder.${o1_id}.financed_principal_cents == 30225"
            - "SalesOrder.${o1_id}.gross_total_cents - SalesOrder.${o1_id}.financed_principal_cents == 4800"
            - "CreditAccount.${a1_id}.principal_balance_cents == 25425"

      - name: dual_variant_finance_charge_basis_on_lease_account
        grounds: [calculations.finance_charge_accrual, calculations.lease_amortization, state_machines.CreditAccount.APPLIED_to_ACTIVE, state_machines.Payment.BOOKED_to_COLLECTED, entities.CreditAccount.fields.use_final_basis]
        distinguishing_aspect: |
          On the CreditAccount domain the accrual basis is a dual variant keyed on
          the FROZEN predicate use_final_basis (prior_balance vs settled_basis):
          an identical 45338-cent opening principal with a same-week 20000-cent
          collection leaves the REVOLVING charge at round_half_up(45338*0.1560/52)
          == 136 cents but drops the LEASE charge to
          round_half_up(25338*0.1560/52) == 76 cents — a 60-cent divergence
          produced by the SAME input event across two accounts of one technician.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; routes R1 and R2 (tier A, visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with territories QUALIFIED; shop S1 (zip 75001) ACTIVE on R1"
            - "Technician T ACTIVE at S1, credit_line_limit_cents 100000, months_in_trade 100"
            - "Product P1: unit_cost 12000, retail 15000, 12-month warranty; R1 and R2 each hold 10 units"
            - "AP1 FRANCHISEE-sourced REVOLVING for T, requested_limit_cents 45338, decision_score 72, APPROVED, minted to A1 (ACTIVE, use_final_basis false)"
            - "AP2 FRANCHISOR-sourced LEASE for T, requested_limit_cents 45338, requested_term_months 12, decision_score 100, REVIEWed then APPROVED, minted to A2 (ACTIVE, account_kind LEASE, use_final_basis true)"
            - "Each account carries a DELIVERED 45338-cent POWER_TOOLS order created in the week of 2026-09-07, so principal_balance_cents is 45338 on both"
            - "A2 also holds one BOOKED payment of 20000 cents with expected_week_start 2026-09-21T00:00:00Z; A1 holds none"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R2, route_tier: A, zip_codes: [75002], visit_weekday: 1, truck_label: T-02, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r2_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r2_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r2_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r2_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 45338, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 45338, requested_kind: LEASE, requested_term_months: 12, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISOR }, as: CreditOfficer, captures: { ap2_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap2_id}/status", payload: { action: REVIEW }, as: CreditOfficer }
            - { call: "POST /retail/credit-applications/${ap2_id}/status", payload: { action: APPROVE }, as: CreditOfficer, captures: { ap2_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap2_id}/accounts", payload: { expected_application_version: "${ap2_ver}" }, as: CreditOfficer, captures: { a2_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r2_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a2_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o2_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o2_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o2_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/credit-accounts/${a2_id}/payments", payload: { amount_cents: 20000, collection_source: TRUCK_COLLECTION, expected_week_start: "2026-09-21T00:00:00Z" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm2_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/credit-accounts/${a2_id}/payments", payload: { amount_cents: 20000, collection_source: TRUCK_COLLECTION, expected_week_start: "2026-09-14T00:00:00Z" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm2_id: "$.data.id" } }
            - { call: "POST /retail/credit-accounts/${a2_id}/payments/${pm2_id}/status", payload: { action: COLLECT }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm2_week: "$.data.effective_iso_week" } }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_accrued: "$.data.accrued_finance_charge_cents", a1_installment: "$.data.installment_due_cents" } }
            - { call: "GET /retail/credit-accounts/${a2_id}", payload: {}, as: CreditOfficer, captures: { a2_accrued: "$.data.accrued_finance_charge_cents", a2_installment: "$.data.installment_due_cents" } }
          assert:
            - "Payment.${pm2_id}.effective_iso_week == 2026-09-14T00:00:00Z, the same accrual week the charge is computed for"
            - "CreditAccount.${a1_id}.use_final_basis == false"
            - "CreditAccount.${a2_id}.use_final_basis == true"
            - "CreditAccount.${a1_id}.accrued_finance_charge_cents == 136"
            - "CreditAccount.${a2_id}.accrued_finance_charge_cents == 76"
            - "CreditAccount.${a1_id}.accrued_finance_charge_cents - CreditAccount.${a2_id}.accrued_finance_charge_cents == 60"
            - "CreditAccount.${a2_id}.installment_due_cents == 4287"
            - "CreditAccount.${a1_id}.installment_due_cents == 0"

  # ===========================================================================
  # Rule 2 — combinatorial_formula  (two DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_nested_rounding_order_on_order_gross
        grounds: [calculations.order_gross_total, entities.SalesOrder.fields.gross_total_cents, state_machines.SalesOrder.DRAFT_to_CONFIRMED]
        distinguishing_aspect: |
          Mode (b) nested rounding: order_gross_total pins "round each line, then
          sum", so two lines of 1 x 15000 under DIAGNOSTIC_WEIGHTED round
          separately (15113 + 15113 = 30226) while merging them into one line of
          quantity 2 produces 30225 — a one-cent difference proving the rounding
          order is observable. The prohibited sum-then-round variant would give
          30225 for the two-line order.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (mix_plan DIAGNOSTIC_WEIGHTED) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application minted to A1 (ACTIVE, limit 50000)"
            - "Logical clock 2026-09-07T00:00:00Z"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 400000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }, { product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_split: "$.data.gross_total_cents", o_split_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 2, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_merged: "$.data.gross_total_cents" } }
          assert:
            - "SalesOrder.${o_split_id}.gross_total_cents == 30226"
            - "the merged-line order gross_total_cents capture is == 30225"
            - "SalesOrder.${o_split_id}.gross_total_cents - 30225 == 1"
            - "SalesOrder.${o_split_id}.gross_total_cents != 30225"

      - name: combinatorial_circular_total_and_fee_evaluation_order
        grounds: [calculations.minimum_payment_due, calculations.payment_allocation, calculations.finance_charge_accrual, state_machines.Payment.BOOKED_to_COLLECTED, entities.CreditAccount.fields.current_balance_cents, entities.CreditAccount.fields.minimum_payment_due_cents]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a PINNED evaluation order:
          minimum_payment_due reads current_balance_cents to pick a tier and then
          derives the due, while current_balance_cents is itself defined as
          principal plus accrued charge — the scaffold pins "(1) read opening
          balance, (2) pick tier, (3) derive due", so a 45338-cent balance pays
          4534 cents and a post-accrual balance of 46174 pays 4617, not 4534:
          deriving the due from the value the formula is about to produce is the
          prohibited direction.
        test_recipe:
          setup:
            - "Franchisee F CERTIFIED; route R1 (visit_weekday 1, mix_plan POWER_TOOLS) IN_SERVICE with a QUALIFIED territory and ACTIVE shop S1"
            - "Technician T ACTIVE at S1; product P1 costs 12000, retails 15000; R1 holds 10 units"
            - "T holds an APPROVED FRANCHISEE-sourced REVOLVING application with approved_limit_cents 80000, minted to A1 (ACTIVE)"
            - "Logical clock 2026-09-07T00:00:00Z; a 45338-cent order is DELIVERED in that week, so A1.current_balance_cents is 45338 and minimum_payment_due_cents is 4534"
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: POWER_TOOLS, territory_model: FRANCHISEE_ASSUMED, territory_points: 0 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 45338, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
