            - call: "POST /api/payout-batches"
              payload: { payout_currency: "USD", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { batch_id: $.data.id }
            - call: "POST /api/payout-batches/${batch_id}/calculate"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
            - call: "POST /api/payout-batches/${batch_id}/submit"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { sub_by: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /api/payout-batches/${batch_id}/approve"
              payload: {}
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${sub_by} == fin-1"
            - "${err} == ERR_UNAUTHORIZED"
            - "HTTP status is 403"
            - "PayoutBatch.${batch_id}.status == PENDING_APPROVAL"

