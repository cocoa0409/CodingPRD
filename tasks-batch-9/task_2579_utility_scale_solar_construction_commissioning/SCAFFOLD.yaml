scenario: |
  Generate task harder than expert level!

  2579. Utility-Scale Solar Construction & Commissioning (solar engineering, procurement and construction contractor): site civil work with grading, drainage and access road construction under stormwater permits, module, tracker and inverter procurement with delivery sequencing and laydown yard management, pile driving and racking installation with geotechnical refusal handling and tolerance verification, direct current field wiring, combiner and string testing with insulation resistance verification, medium voltage collection, substation and interconnection facility construction with utility coordination, commissioning with capacity testing, performance ratio verification and punch list closure, labor sourcing with prevailing wage or apprenticeship requirements tied to tax credit qualification, mechanical completion, substantial completion and final acceptance milestone administration

domain_name: utility-scale-solar-epc
api_prefix: "/solar"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Project is the compliance aggregate root, but Block -> GradingArea and
  # Delivery -> YardZone are cross-aggregate references, and child resources
  # (piles, string circuits, labor entries) are addressed on flat top-level
  # paths rather than deep nesting.

  state_machine_shape: parallel
  # Block carries TWO independent dimensions (mechanical_status x
  # electrical_status) that advance from different endpoints and are joined
  # only by the derived `mc_ready` flag. PunchListItem is cyclic
  # (OPEN -> CLOSURE_SUBMITTED -> OPEN), Project.milestone_state is cyclic
  # (claim -> reject -> claim), Delivery receipt is a branching fork
  # (ACCEPTED vs REJECTED with divergent side-effect sets), and
  # Block/Project rollups are compound (state = f(children)).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The operator who posts LaborEntry rows into a PayrollWeek may not certify
  # that week; the contractor who submits a punch-list closure may not decide
  # it; the contractor who claims a milestone may not certify it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "EPC project name" }
      - { name: utility_name, type: string, source: input, description: "Interconnecting utility" }
      - { name: ac_capacity_kw, type: number, source: input, description: "Nameplate AC capacity in kW", constraints: "> 0" }
      - { name: dc_capacity_kw, type: number, source: input, description: "Installed DC capacity in kW", constraints: "> 0" }
      - { name: contract_value_cents, type: integer, source: input, description: "Base EPC contract value in cents", constraints: "> 0" }
      - { name: approved_change_order_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over accepted change orders (see calculations.change_order_ledger)" }
      - { name: retainage_pct, type: number, source: input, description: "Fraction of adjusted contract withheld until final acceptance", constraints: "0 <= x <= 0.10" }
      - { name: ld_per_day_cents, type: integer, source: input, description: "Liquidated damages per calendar day of substantial-completion delay", constraints: ">= 0" }
      - { name: ld_cap_pct, type: number, source: input, description: "Liquidated damages cap as fraction of adjusted contract", constraints: "0 <= x <= 0.20" }
      - { name: sc_deadline_date, type: string, source: input, description: "Contract substantial-completion date, YYYY-MM-DD (UTC calendar date)" }
      - { name: guaranteed_capacity_kw_ac, type: number, source: input, description: "Guaranteed AC capacity used by the capacity test", constraints: "> 0" }
      - { name: guaranteed_performance_ratio, type: number, source: input, description: "Guaranteed performance ratio, 4 decimals, e.g. 0.6900", constraints: "0 < x < 1" }
      - { name: prevailing_wage_election, type: enum, source: input, default: REMEDIABLE, description: "Feature flag: STRICT rejects under-prevailing labor entries at post time; REMEDIABLE accepts them and accrues restitution", constraints: "STRICT | REMEDIABLE" }
      - { name: apprenticeship_basis, type: enum, source: input, default: PROJECT_AGGREGATE, description: "Default variant selector for calculations.apprenticeship_compliance", constraints: "PROJECT_AGGREGATE | WEEKLY_WORST_CASE" }
      - { name: apprenticeship_min_pct, type: number, source: input, default: 15.00, description: "Minimum apprentice labor-hour percentage required for tax-credit qualification", constraints: "0 <= x <= 100" }
      - { name: milestone_state, type: enum, source: system, default: PRECONSTRUCTION, description: "Milestone administration state machine (see state_machines.Project)", constraints: "PRECONSTRUCTION | MC_CLAIMED | MC_CERTIFIED | SC_CLAIMED | SC_CERTIFIED | FA_CLAIMED | FINAL_ACCEPTED" }
      - { name: mc_readiness, type: enum, source: computed, default: BLOCKED, description: "READY iff blocks_total >= 1 AND blocks_mc_ready_count == blocks_total AND every GradingArea of this project has status == ACCEPTED; otherwise BLOCKED", constraints: "BLOCKED | READY" }
      - { name: blocks_total, type: integer, source: computed, default: 0, description: "Count of Block rows with project_id == this Project.id" }
      - { name: blocks_mc_ready_count, type: integer, source: computed, default: 0, description: "Count of Block rows of this project with mc_ready == true" }
      - { name: total_labor_hours, type: number, source: computed, default: 0, description: "Sum of LaborEntry.hours where status == POSTED across all PayrollWeek rows of this project, 2 decimals" }
      - { name: apprentice_labor_hours, type: number, source: computed, default: 0, description: "Sum of LaborEntry.hours where status == POSTED AND is_apprentice == true, 2 decimals" }
      - { name: apprentice_hours_pct, type: number, source: computed, default: 0, description: "Result of calculations.apprenticeship_compliance under the applied basis, 2 decimals" }
      - { name: apprenticeship_basis_applied, type: enum, source: computed, description: "Basis actually used by the most recent labor-compliance run", constraints: "PROJECT_AGGREGATE | WEEKLY_WORST_CASE" }
      - { name: wage_restitution_owed_cents, type: integer, source: computed, default: 0, description: "Result of calculations.prevailing_wage_restitution over POSTED labor entries" }
      - { name: wage_liquidated_damages_cents, type: integer, source: computed, default: 0, description: "round_half_up(wage_restitution_owed_cents * PW_LD_RATE) from calculations.prevailing_wage_restitution" }
      - { name: tax_credit_status, type: enum, source: computed, default: UNDETERMINED, description: "UNDETERMINED before any labor-compliance run; QUALIFIED iff apprenticeship qualified AND wage_restitution_owed_cents == 0; else DISQUALIFIED", constraints: "UNDETERMINED | QUALIFIED | DISQUALIFIED" }
      - { name: open_punch_item_count, type: integer, source: computed, default: 0, description: "Count of PunchListItem rows of this project with status IN {OPEN, CLOSURE_SUBMITTED}" }
      - { name: open_critical_punch_count, type: integer, source: computed, default: 0, description: "Count of PunchListItem rows of this project with status IN {OPEN, CLOSURE_SUBMITTED} AND severity == CRITICAL" }
      - { name: delay_days, type: integer, source: computed, default: 0, description: "Calendar days from sc_deadline_date to the SC certification date, floor 0 (see calculations.substantial_completion_settlement)" }
      - { name: ld_assessed_cents, type: integer, source: computed, default: 0, description: "Liquidated damages assessed at SC certification, from calculations.substantial_completion_settlement" }
      - { name: retainage_held_cents, type: integer, source: computed, default: 0, description: "Retainage withheld at SC certification" }
      - { name: punchlist_holdback_cents, type: integer, source: computed, default: 0, description: "Punch-list holdback withheld at SC certification" }
      - { name: sc_payment_due_cents, type: integer, source: computed, default: 0, description: "Payment due on substantial completion" }
      - { name: final_payment_cents, type: integer, source: computed, default: 0, description: "Release computed at final acceptance (see calculations.final_acceptance_release)" }
      - { name: mc_claimed_by_user_id, type: string, source: system, description: "X-User-ID that filed the outstanding mechanical-completion claim; null when no claim is outstanding" }
      - { name: last_milestone_rejection_reason, type: string, source: system, description: "Reason recorded by the most recent milestone rejection, including AUTO_MC_READINESS_LOST for cascade-driven rejections; null before any rejection" }

  - name: GradingArea
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: area_code, type: string, source: input, description: "Civil area code, unique per project" }
      - { name: permit_number, type: string, source: input, description: "Stormwater (construction general permit) number covering this area" }
      - { name: disturbed_acreage_limit, type: number, source: input, description: "Permitted maximum disturbed acreage for this area", constraints: "> 0" }
      - { name: disturbed_acreage_current, type: number, source: computed, default: 0, description: "Sum of acreage_disturbed_delta over accepted earthwork logs, 2 decimals" }
      - { name: access_road_meters, type: integer, source: input, default: 0, description: "Access road length constructed under this area" }
      - { name: bmp_inspection_interval_days, type: integer, source: input, description: "Maximum days between best-management-practice inspections", constraints: ">= 1" }
      - { name: bmp_last_inspected_at, type: datetime, source: system, description: "Set to the logical clock at creation, then to inspected_at of each BMP_INSPECTION site event" }
      - { name: bmp_deficiency_open, type: boolean, source: computed, default: false, description: "true when the latest BMP_INSPECTION reported deficiencies_found == true and no later inspection cleared them" }
      - { name: rain_blackout_until, type: datetime, source: computed, description: "occurred_at + RAIN_BLACKOUT_HOURS of the latest qualifying RAIN_EVENT; null when no qualifying rain event has been logged" }
      - { name: permit_status, type: enum, source: system, default: ACTIVE, description: "Stormwater permit coverage state for this area", constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Civil work state (see state_machines.GradingArea)", constraints: "PLANNED | CLEARED | GRADED | ACCEPTED | HOLD" }
      - { name: status_before_hold, type: enum, source: system, description: "Status captured when the area entered HOLD, restored on permit reinstatement; null when never held", constraints: "PLANNED | CLEARED | GRADED" }
      - { name: compaction_test_pct, type: number, source: system, description: "Compaction test result recorded at acceptance; null before acceptance" }
      - { name: drainage_inspection_passed, type: boolean, source: system, description: "Drainage inspection outcome recorded at acceptance; null before acceptance" }
      - { name: earthwork_windows, type: array, source: system, description: "Append-only list of accepted earthwork occupancy records, each { work_start_at, work_end_at, activity_type, acreage_disturbed_delta }, ordered by created_at ASC" }

  - name: YardZone
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: zone_code, type: string, source: input, description: "Laydown yard zone code, unique per project" }
      - { name: pallet_capacity, type: integer, source: input, description: "Total pallet positions in this zone", constraints: "> 0" }
      - { name: reserved_pallets, type: integer, source: computed, default: 0, description: "Sum of Delivery.pallets for deliveries of this zone with status IN {RESERVED, ARRIVED, ACCEPTED}" }
      - { name: available_pallets, type: integer, source: computed, description: "pallet_capacity - reserved_pallets; conserved quantity of calculations.yard_zone_pallet_ledger" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project the material is bought for" }
      - { name: yard_zone_id, type: string, source: input, description: "FK -> YardZone.id; laydown zone holding the pallets; must belong to the same project" }
      - { name: component_type, type: enum, source: input, description: "Procured component class", constraints: "MODULE | TRACKER | INVERTER" }
      - { name: unit_qty, type: integer, source: input, description: "Ordered unit count (modules, tracker rows, inverters)", constraints: "> 0" }
      - { name: pallets, type: integer, source: input, description: "Pallet positions the shipment occupies in the laydown zone", constraints: "> 0" }
      - { name: planned_arrival_at, type: datetime, source: input, description: "Planned truck arrival instant" }
      - { name: laydown_window_start, type: datetime, source: input, description: "Start of the pallet occupancy window (inclusive)" }
      - { name: laydown_window_end, type: datetime, source: input, description: "End of the pallet occupancy window (exclusive)" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "Delivery sequencing state (see state_machines.Delivery)", constraints: "RESERVED | ARRIVED | ACCEPTED | REJECTED | CANCELLED" }
      - { name: received_unit_qty, type: integer, source: system, description: "Units counted at receipt; null before receipt" }
      - { name: damaged_unit_qty, type: integer, source: system, description: "Units found damaged at receipt; null before receipt" }
      - { name: accepted_unit_qty, type: integer, source: computed, description: "received_unit_qty - damaged_unit_qty when status == ACCEPTED; 0 when status == REJECTED; null before receipt" }
      - { name: damage_ratio, type: number, source: computed, description: "round_half_up(damaged_unit_qty / received_unit_qty, 4) at receipt; null before receipt" }
      - { name: inspection_note, type: string, source: input, description: "Free-text receiving inspection note; null when omitted" }
      - { name: cancel_reason, type: string, source: system, description: "Reason recorded when the reservation was cancelled; null otherwise" }

  - name: Block
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: grading_area_id, type: string, source: input, description: "FK -> GradingArea.id; civil area the block sits in; must belong to the same project" }
      - { name: block_code, type: string, source: input, description: "Array block code, unique per project" }
      - { name: dc_capacity_kw, type: number, source: input, description: "Block DC capacity in kW", constraints: "> 0" }
      - { name: planned_pile_count, type: integer, source: input, description: "Piles required before the block can be mechanically complete", constraints: ">= 1" }
      - { name: planned_string_count, type: integer, source: input, description: "String circuits required before the block can be electrically tested", constraints: ">= 1" }
      - { name: mechanical_status, type: enum, source: system, default: PLANNED, description: "Mechanical dimension of the parallel state machine (see state_machines.Block.mechanical)", constraints: "PLANNED | PILES_COMPLETE | MECH_COMPLETE | HOLD" }
      - { name: electrical_status, type: enum, source: system, default: PLANNED, description: "Electrical dimension of the parallel state machine (see state_machines.Block.electrical)", constraints: "PLANNED | WIRED | TESTED | REWORK" }
      - { name: piles_accepted_count, type: integer, source: computed, default: 0, description: "Count of Pile rows of this block with status == ACCEPTED" }
      - { name: piles_refused_count, type: integer, source: computed, default: 0, description: "Count of Pile rows of this block with status == REFUSED" }
      - { name: circuits_wired_count, type: integer, source: computed, default: 0, description: "Count of StringCircuit rows of this block with status IN {WIRED, TESTED, FAILED}" }
      - { name: circuits_tested_count, type: integer, source: computed, default: 0, description: "Count of StringCircuit rows of this block with status == TESTED" }
      - { name: circuits_failed_count, type: integer, source: computed, default: 0, description: "Count of StringCircuit rows of this block with status == FAILED" }
      - { name: modules_installed_qty, type: integer, source: system, description: "Modules reported installed at mechanical completion; null before mechanical completion" }
      - { name: max_torque_tube_deviation_mm, type: number, source: system, description: "Surveyed worst-case torque-tube deviation recorded at mechanical completion; null before" }
      - { name: mc_ready, type: boolean, source: computed, default: false, description: "true iff mechanical_status == MECH_COMPLETE AND electrical_status == TESTED" }

  - name: Pile
    parent: Block
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; owning array block" }
      - { name: row_index, type: integer, source: input, description: "Tracker row index within the block", constraints: ">= 1" }
      - { name: position_index, type: integer, source: input, description: "Pile position within the row", constraints: ">= 1" }
      - { name: design_embedment_mm, type: integer, source: input, description: "Geotechnical design embedment depth in mm", constraints: "> 0" }
      - { name: actual_embedment_mm, type: integer, source: system, description: "Embedment achieved by the last drive or remediation; null before driving" }
      - { name: plumb_deviation_mm, type: number, source: system, description: "Plumb deviation from vertical in mm at the last drive or remediation; null before driving" }
      - { name: blow_count, type: integer, source: system, description: "Blow count of the last drive; null before driving" }
      - { name: refusal_flag, type: boolean, source: system, default: false, description: "true when the last drive reported geotechnical refusal" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Pile disposition (see state_machines.Pile)", constraints: "PLANNED | ACCEPTED | OUT_OF_TOLERANCE | REFUSED" }
      - { name: remediated, type: boolean, source: computed, default: false, description: "true once a remediation has been accepted on this pile" }
      - { name: remediation_method, type: enum, source: system, description: "Method of the last accepted remediation; null when never remediated", constraints: "PREDRILL | SPLICE | RELOCATE" }
      - { name: driven_at, type: datetime, source: system, description: "Instant of the last drive result; null before driving" }

  - name: StringCircuit
    parent: Block
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; owning array block" }
      - { name: circuit_code, type: string, source: input, description: "String circuit code, unique per block" }
      - { name: modules_in_series, type: integer, source: input, description: "Modules wired in series on this string", constraints: ">= 1" }
      - { name: combiner_position, type: string, source: system, description: "Combiner box terminal position recorded at wiring; null before wiring" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "DC wiring and test state (see state_machines.StringCircuit)", constraints: "PLANNED | WIRED | TESTED | FAILED" }
      - { name: insulation_resistance_mohm, type: number, source: system, description: "Insulation resistance measured by the last test in megaohms; null before testing" }
      - { name: measured_voc_v, type: number, source: system, description: "Open-circuit voltage measured by the last test in volts; null before testing" }
      - { name: expected_voc_v, type: number, source: computed, description: "Temperature-corrected expected open-circuit voltage from calculations.string_test_disposition, 2 decimals; null before testing" }
      - { name: polarity_ok, type: boolean, source: system, description: "Polarity verification of the last test; null before testing" }
      - { name: test_failure_reason, type: enum, source: computed, description: "Dominant failure cause of the last test in the pinned order INSULATION > VOC_DEVIATION > POLARITY; null when the last test passed or no test exists", constraints: "INSULATION | VOC_DEVIATION | POLARITY" }
      - { name: tested_at, type: datetime, source: system, description: "Instant of the last test result; null before testing" }

  - name: Substation
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: substation_code, type: string, source: input, description: "Substation / interconnection facility code, unique per project" }
      - { name: interconnection_voltage_kv, type: number, source: input, description: "Point-of-interconnection voltage in kV", constraints: "> 0" }
      - { name: mv_collection_km, type: number, source: input, description: "Medium-voltage collection circuit length in km", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: SITE_CIVIL, description: "Construction and energization state (see state_machines.Substation)", constraints: "SITE_CIVIL | STEEL_ERECTED | EQUIPMENT_SET | BACKFEED_REQUESTED | ENERGIZED" }
      - { name: utility_witness_ref, type: string, source: system, description: "Utility witness/evidence reference recorded on the latest advance; null before the first advance" }
      - { name: energized_at, type: datetime, source: system, description: "Logical-clock instant at which the substation was energized; null before energization" }
      - { name: energizing_outage_window_id, type: string, source: system, description: "Id of the OutageWindow consumed by energization; null before energization. Discovery is via GET /solar/substations/{substation_id}/outage-windows (status EXECUTED)" }

  - name: OutageWindow
    parent: Substation
    common_fields: true
    fields:
      - { name: substation_id, type: string, source: input, description: "FK -> Substation.id; facility the switching outage applies to" }
      - { name: start_at, type: datetime, source: input, description: "Requested outage start instant (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Requested outage end instant (inclusive)" }
      - { name: purpose, type: enum, source: input, description: "Reason the utility outage is requested", constraints: "BACKFEED | SWITCHING | TIE_IN" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Utility coordination state (see state_machines.OutageWindow)", constraints: "REQUESTED | APPROVED | DENIED | EXECUTED" }
      - { name: utility_reference, type: string, source: system, description: "Utility switching order reference supplied with the response; null before a response" }
      - { name: responded_at, type: datetime, source: system, description: "Instant the utility response was recorded; null before a response" }

  - name: CommissioningTest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project under test" }
      - { name: test_type, type: enum, source: input, description: "CAPACITY drives calculations.capacity_test_result; PERFORMANCE_RATIO drives calculations.performance_ratio_result", constraints: "CAPACITY | PERFORMANCE_RATIO" }
      - { name: correction_variant, type: enum, source: input, default: AS_MEASURED, description: "Variant selector for calculations.capacity_test_result; ignored (and echoed unchanged) by PERFORMANCE_RATIO tests", constraints: "AS_MEASURED | WEATHER_CORRECTED" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned test start instant" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Commissioning state (see state_machines.CommissioningTest)", constraints: "SCHEDULED | IN_PROGRESS | PASSED | FAILED | SUSPENDED | VOID" }
      - { name: interval_count, type: integer, source: computed, default: 0, description: "Count of TestInterval rows of this test" }
      - { name: valid_interval_count, type: integer, source: computed, default: 0, description: "Count of TestInterval rows of this test with is_valid == true" }
      - { name: reported_kw_ac, type: number, source: computed, description: "Capacity result under the applied variant, 2 decimals; null until a CAPACITY test is finalized" }
      - { name: reported_performance_ratio, type: number, source: computed, description: "Performance ratio result, 4 decimals; null until a PERFORMANCE_RATIO test is finalized" }
      - { name: pass_threshold_kw_ac, type: number, source: computed, description: "round_half_up(Project.guaranteed_capacity_kw_ac * CAPACITY_PASS_RATIO, 2) evaluated at finalization; null for PERFORMANCE_RATIO tests" }
      - { name: finalized_at, type: datetime, source: system, description: "Instant the test was finalized; null before finalization" }
      - { name: suspend_reason, type: enum, source: system, description: "Cascade reason recorded when the test was suspended; null otherwise", constraints: "MC_READINESS_LOST" }
      - { name: void_reason, type: enum, source: system, description: "Reason recorded when the test was voided; null otherwise", constraints: "SUPERSEDED_BY_NEW_TEST" }
      - { name: superseded, type: boolean, source: computed, default: false, description: "true once a later test of the same test_type on the same project has voided this one" }

  - name: TestInterval
    parent: CommissioningTest
    common_fields: false
    fields:
      - { name: commissioning_test_id, type: string, source: input, description: "FK -> CommissioningTest.id; owning test" }
      - { name: sampled_at, type: datetime, source: input, description: "Sample instant; samples are append-only and replayed in created_at ASC order" }
      - { name: irradiance_w_m2, type: number, source: input, description: "Plane-of-array irradiance in W/m2", constraints: ">= 0" }
      - { name: measured_kw_ac, type: number, source: input, description: "Metered AC power at the point of interconnection in kW", constraints: ">= 0" }
      - { name: ambient_c, type: number, source: input, description: "Ambient temperature in degrees Celsius" }
      - { name: wind_m_s, type: number, source: input, description: "Wind speed in m/s", constraints: ">= 0" }
      - { name: is_valid, type: boolean, source: computed, description: "true iff irradiance_w_m2 >= MIN_IRRADIANCE_W_M2 AND wind_m_s <= MAX_WIND_M_S AND AMBIENT_MIN_C <= ambient_c <= AMBIENT_MAX_C" }
      - { name: corrected_kw_ac, type: number, source: computed, description: "Per-interval weather-corrected power, 2 decimals, from calculations.capacity_test_result; null when is_valid == false" }

  - name: PunchListItem
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; block the defect belongs to, or null for balance-of-plant items; when present the block must belong to the same project" }
      - { name: title, type: string, source: input, description: "Defect description" }
      - { name: category, type: enum, source: input, description: "Discipline owning the defect", constraints: "MECHANICAL | ELECTRICAL | CIVIL | DOCUMENTATION" }
      - { name: severity, type: enum, source: input, description: "CRITICAL items block substantial completion; all open items block final acceptance", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Owner-engineer estimate of closure cost, feeds the punch-list holdback", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Closure state (see state_machines.PunchListItem)", constraints: "OPEN | CLOSURE_SUBMITTED | CLOSED | WAIVED" }
      - { name: closure_evidence_ref, type: string, source: system, description: "Evidence reference of the latest closure submission; null before any submission" }
      - { name: rejection_count, type: integer, source: computed, default: 0, description: "Number of times a closure submission on this item has been rejected" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the latest closure submission; null before any submission" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the latest closure decision; null before any decision" }

  - name: PayrollWeek
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: week_start_date, type: string, source: input, description: "Monday of the payroll week, YYYY-MM-DD; unique per project" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Certified-payroll state (see state_machines.PayrollWeek)", constraints: "OPEN | CERTIFIED" }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "Count of LaborEntry rows of this week with status == POSTED" }
      - { name: total_hours, type: number, source: computed, default: 0, description: "Sum of LaborEntry.hours where status == POSTED, 2 decimals" }
      - { name: apprentice_hours, type: number, source: computed, default: 0, description: "Sum of LaborEntry.hours where status == POSTED AND is_apprentice == true, 2 decimals" }
      - { name: journeyworker_hours, type: number, source: computed, default: 0, description: "Sum of LaborEntry.hours where status == POSTED AND is_apprentice == false, 2 decimals" }
      - { name: apprentice_pct, type: number, source: computed, default: 0, description: "round_half_up(apprentice_hours / total_hours * 100, 2); 0 when total_hours == 0" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID that certified the week; null while OPEN" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification; null while OPEN" }

  - name: LaborEntry
    parent: PayrollWeek
    common_fields: true
    fields:
      - { name: payroll_week_id, type: string, source: input, description: "FK -> PayrollWeek.id; owning certified-payroll week" }
      - { name: worker_ref, type: string, source: input, description: "Anonymized worker reference" }
      - { name: classification, type: enum, source: input, description: "Wage determination classification", constraints: "ELECTRICIAN | LABORER | OPERATOR | IRONWORKER" }
      - { name: is_apprentice, type: boolean, source: input, description: "true when the worker is a registered apprentice" }
      - { name: hours, type: number, source: input, description: "Hours worked, 2 decimals", constraints: "> 0" }
      - { name: paid_rate_cents, type: integer, source: input, description: "Base hourly rate paid, in cents", constraints: ">= 0" }
      - { name: fringe_rate_cents, type: integer, source: input, description: "Hourly fringe benefit credit, in cents", constraints: ">= 0" }
      - { name: prevailing_rate_cents, type: integer, source: input, description: "Applicable prevailing wage determination total rate, in cents", constraints: ">= 0" }
      - { name: work_date, type: string, source: input, description: "Date worked, YYYY-MM-DD; must fall inside the owning week" }
      - { name: status, type: enum, source: system, default: POSTED, description: "Ledger state (see state_machines.LaborEntry)", constraints: "POSTED | VOIDED" }
      - { name: shortfall_cents_per_hour, type: integer, source: computed, default: 0, description: "max(0, prevailing_rate_cents - (paid_rate_cents + fringe_rate_cents))" }
      - { name: restitution_cents, type: integer, source: computed, default: 0, description: "round_half_up(shortfall_cents_per_hour * hours, 0) while status == POSTED; 0 once VOIDED" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID that posted the entry; drives the segregation-of-duties check on week certification" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded when the entry was voided; null while POSTED" }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: GradingArea
    initial_state: PLANNED
    terminal_states: [ACCEPTED]
    transitions:
      - from: PLANNED
        to: CLEARED
        trigger: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs with activity_type == CLEARING"
        actor: CivilSuperintendent
        preconditions:
          - "status IN {PLANNED, CLEARED, GRADED}"
          - "permit_status == ACTIVE"
          - "work_start_at >= rain_blackout_until OR rain_blackout_until IS NULL"
          - "work_start_at <= bmp_last_inspected_at + bmp_inspection_interval_days"
          - "the [work_start_at, work_end_at] closed interval collides with no entry of earthwork_windows (see calculations.earthwork_window_conflict_check)"
          - "disturbed_acreage_current + acreage_disturbed_delta <= disturbed_acreage_limit"
        side_effects:
          - "append { work_start_at, work_end_at, activity_type, acreage_disturbed_delta } to earthwork_windows"
          - "recompute disturbed_acreage_current (calculations.earthwork_disturbance_ledger)"
          - "increment version by 1 and refresh updated_at"
      - from: CLEARED
        to: GRADED
        trigger: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs with activity_type == GRADING"
        actor: CivilSuperintendent
        preconditions: ["same precondition set as PLANNED->CLEARED", "status == CLEARED or GRADED"]
        side_effects:
          - "append the window record to earthwork_windows"
          - "recompute disturbed_acreage_current"
          - "increment version by 1"
        note: "activity_type DRAINAGE or ACCESS_ROAD logs are accepted from PLANNED/CLEARED/GRADED and leave status unchanged."
      - from: GRADED
        to: ACCEPTED
        trigger: "POST /solar/grading-areas/{grading_area_id}/acceptance"
        actor: OwnerEngineer
        preconditions:
          - "status == GRADED"
          - "permit_status == ACTIVE"
          - "bmp_deficiency_open == false"
          - "compaction_test_pct >= MIN_COMPACTION_PCT"
          - "drainage_inspection_passed == true"
        side_effects:
          - "store compaction_test_pct and drainage_inspection_passed"
          - "recompute Project.mc_readiness (calculations.block_and_project_readiness_rollup)"
          - "increment version by 1"
      - from: PLANNED
        to: HOLD
        trigger: "POST /solar/grading-areas/{grading_area_id}/site-events with event_type == PERMIT_SUSPENSION (also valid from CLEARED and GRADED)"
        actor: CivilSuperintendent
        preconditions: ["status IN {PLANNED, CLEARED, GRADED}", "permit_status == ACTIVE"]
        side_effects:
          - "set status_before_hold = status, then status = HOLD and permit_status = SUSPENDED"
          - "recompute Project.mc_readiness (a non-ACCEPTED area forces BLOCKED)"
          - "increment version by 1"
      - from: HOLD
        to: CLEARED
        trigger: "POST /solar/grading-areas/{grading_area_id}/site-events with event_type == PERMIT_REINSTATEMENT"
        actor: CivilSuperintendent
        preconditions: ["status == HOLD", "permit_status == SUSPENDED", "bmp_deficiency_open == false"]
        side_effects:
          - "set status = status_before_hold, status_before_hold = null, permit_status = ACTIVE"
          - "increment version by 1"
        note: "Restores whichever of PLANNED / CLEARED / GRADED was captured in status_before_hold."

  - entity: Delivery
    initial_state: RESERVED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ARRIVED
        trigger: "POST /solar/deliveries/{delivery_id}/receipt"
        actor: ProcurementCoordinator
        preconditions: ["status == RESERVED", "received_unit_qty > 0", "0 <= damaged_unit_qty <= received_unit_qty"]
        side_effects:
          - "store received_unit_qty, damaged_unit_qty, inspection_note"
          - "compute damage_ratio = round_half_up(damaged_unit_qty / received_unit_qty, 4)"
          - "immediately evaluate the ARRIVED fork below in the same request"
          - "increment version by 1"
      - from: ARRIVED
        to: ACCEPTED
        trigger: "system, inside POST /solar/deliveries/{delivery_id}/receipt, when damage_ratio <= MAX_DAMAGE_RATIO"
        actor: system
        preconditions: ["damage_ratio <= MAX_DAMAGE_RATIO"]
        side_effects:
          - "set accepted_unit_qty = received_unit_qty - damaged_unit_qty"
          - "YardZone.reserved_pallets keeps this delivery's pallets (material is now on hand)"
          - "the accepted units become available to calculations.module_availability_check for MODULE deliveries"
      - from: ARRIVED
        to: REJECTED
        trigger: "system, inside POST /solar/deliveries/{delivery_id}/receipt, when damage_ratio > MAX_DAMAGE_RATIO"
        actor: system
        preconditions: ["damage_ratio > MAX_DAMAGE_RATIO"]
        side_effects:
          - "set accepted_unit_qty = 0"
          - "release the reservation: recompute YardZone.reserved_pallets and available_pallets excluding this delivery, and increment YardZone.version by 1"
        note: "Divergent branch: ACCEPTED keeps pallets occupied and grants module availability; REJECTED releases pallets and grants nothing."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /solar/deliveries/{delivery_id}/cancellation"
        actor: ProcurementCoordinator
        preconditions: ["status == RESERVED"]
        side_effects:
          - "store cancel_reason"
          - "recompute YardZone.reserved_pallets and available_pallets excluding this delivery, increment YardZone.version by 1 (compensating action of calculations.yard_zone_pallet_ledger)"
          - "increment version by 1"

  - entity: Block
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: "mechanical_status == PLANNED"
        to: "mechanical_status == PILES_COMPLETE"
        trigger: "system, inside POST /solar/piles/{pile_id}/drive-results or /remediations, when piles_accepted_count reaches planned_pile_count"
        actor: system
        preconditions: ["piles_accepted_count >= planned_pile_count", "piles_refused_count == 0", "mechanical_status IN {PLANNED, HOLD}"]
        side_effects: ["increment version by 1", "recompute mc_ready (still false until electrical_status == TESTED)"]
      - from: "mechanical_status == PILES_COMPLETE"
        to: "mechanical_status == MECH_COMPLETE"
        trigger: "POST /solar/blocks/{block_id}/mechanical-completion"
        actor: InstallationForeman
        preconditions:
          - "mechanical_status == PILES_COMPLETE"
          - "max_torque_tube_deviation_mm <= TORQUE_TUBE_TOLERANCE_MM"
          - "modules_installed_qty <= remaining accepted MODULE units (calculations.module_availability_check)"
        side_effects:
          - "store modules_installed_qty and max_torque_tube_deviation_mm"
          - "recompute mc_ready; when it flips to true, increment Project.blocks_mc_ready_count and recompute Project.mc_readiness"
          - "increment version by 1"
      - from: "mechanical_status IN {PLANNED, PILES_COMPLETE, MECH_COMPLETE}"
        to: "mechanical_status == HOLD"
        trigger: "system, second hop of the pile-refusal cascade: a Pile of this block became REFUSED"
        actor: system
        preconditions: ["piles_refused_count >= 1"]
        side_effects:
          - "set mechanical_status = HOLD"
          - "recompute mc_ready -> false; when it was true, decrement Project.blocks_mc_ready_count and recompute Project.mc_readiness (third hop)"
          - "increment version by 1"
      - from: "mechanical_status == HOLD"
        to: "mechanical_status == PILES_COMPLETE"
        trigger: "system, inside POST /solar/piles/{pile_id}/remediations, when the last REFUSED pile of the block is accepted"
        actor: system
        preconditions: ["piles_refused_count == 0", "piles_accepted_count >= planned_pile_count"]
        side_effects: ["set mechanical_status = PILES_COMPLETE", "increment version by 1"]
        note: "When piles_refused_count reaches 0 but piles_accepted_count < planned_pile_count the block returns to PLANNED instead."
      - from: "electrical_status == PLANNED"
        to: "electrical_status == WIRED"
        trigger: "system, inside POST /solar/string-circuits/{circuit_id}/wiring, when circuits_wired_count reaches planned_string_count"
        actor: system
        preconditions: ["circuits_wired_count >= planned_string_count", "circuits_failed_count == 0"]
        side_effects: ["increment version by 1"]
      - from: "electrical_status == WIRED"
        to: "electrical_status == TESTED"
        trigger: "system, inside POST /solar/string-circuits/{circuit_id}/test-results, when circuits_tested_count reaches planned_string_count"
        actor: system
        preconditions: ["circuits_tested_count >= planned_string_count", "circuits_failed_count == 0"]
        side_effects:
          - "recompute mc_ready; when it flips to true, increment Project.blocks_mc_ready_count and recompute Project.mc_readiness"
          - "increment version by 1"
      - from: "electrical_status IN {WIRED, TESTED}"
        to: "electrical_status == REWORK"
        trigger: "system, second hop of the string-test-failure cascade: a StringCircuit of this block became FAILED"
        actor: system
        preconditions: ["circuits_failed_count >= 1"]
        side_effects:
          - "set electrical_status = REWORK"
          - "recompute mc_ready -> false; when it was true, decrement Project.blocks_mc_ready_count and recompute Project.mc_readiness (third hop)"
          - "increment version by 1"
      - from: "electrical_status == REWORK"
        to: "electrical_status == TESTED"
        trigger: "system, inside POST /solar/string-circuits/{circuit_id}/test-results on a retest, when circuits_failed_count returns to 0 and circuits_tested_count >= planned_string_count"
        actor: system
        preconditions: ["circuits_failed_count == 0", "circuits_tested_count >= planned_string_count"]
        side_effects:
          - "recompute mc_ready; when it flips to true, increment Project.blocks_mc_ready_count and recompute Project.mc_readiness"
          - "increment version by 1"
        note: "The two dimensions are independent: a block can be MECH_COMPLETE while electrically in REWORK, and TESTED while mechanically on HOLD."

  - entity: Pile
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: ACCEPTED
        trigger: "POST /solar/piles/{pile_id}/drive-results with a disposition of ACCEPTED per calculations.pile_drive_disposition"
        actor: InstallationForeman
        preconditions:
          - "status == PLANNED"
          - "the owning Block's GradingArea has status == ACCEPTED"
        side_effects:
          - "store actual_embedment_mm, plumb_deviation_mm, blow_count, refusal_flag, driven_at"
          - "increment Block.piles_accepted_count; when it reaches Block.planned_pile_count and no pile is REFUSED, the block's mechanical dimension advances to PILES_COMPLETE"
          - "increment version by 1"
      - from: PLANNED
        to: OUT_OF_TOLERANCE
        trigger: "POST /solar/piles/{pile_id}/drive-results with a disposition of OUT_OF_TOLERANCE"
        actor: InstallationForeman
        preconditions: ["status == PLANNED", "the owning Block's GradingArea has status == ACCEPTED"]
        side_effects: ["store the drive measurements", "increment version by 1"]
        note: "No block-level cascade: the pile simply does not count toward piles_accepted_count."
      - from: PLANNED
        to: REFUSED
        trigger: "POST /solar/piles/{pile_id}/drive-results with refusal == true and actual_embedment_mm < design_embedment_mm * REFUSAL_MIN_EMBEDMENT_RATIO"
        actor: InstallationForeman
        preconditions: ["status == PLANNED", "the owning Block's GradingArea has status == ACCEPTED"]
        side_effects:
          - "store the drive measurements with refusal_flag = true"
          - "increment Block.piles_refused_count; because this block now has a REFUSED pile, Block.mechanical_status becomes HOLD (hop 2 of the refusal cascade)"
          - "increment version by 1"
      - from: OUT_OF_TOLERANCE
        to: ACCEPTED
        trigger: "POST /solar/piles/{pile_id}/remediations (also valid from REFUSED)"
        actor: InstallationForeman
        preconditions:
          - "status IN {OUT_OF_TOLERANCE, REFUSED}"
          - "the remediated measurements satisfy actual_embedment_mm >= design_embedment_mm * REFUSAL_MIN_EMBEDMENT_RATIO AND plumb_deviation_mm <= PLUMB_TOLERANCE_MM"
        side_effects:
          - "set remediated = true, store remediation_method and the new measurements, clear refusal_flag"
          - "recompute Block.piles_accepted_count and piles_refused_count; a HOLD block whose piles_refused_count returns to 0 leaves HOLD"
          - "increment version by 1"

  - entity: StringCircuit
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: WIRED
        trigger: "POST /solar/string-circuits/{circuit_id}/wiring"
        actor: InstallationForeman
        preconditions: ["status == PLANNED", "the owning Block has mechanical_status == MECH_COMPLETE"]
        side_effects:
          - "store combiner_position"
          - "increment Block.circuits_wired_count; when it reaches Block.planned_string_count the block's electrical dimension advances to WIRED"
          - "increment version by 1"
      - from: WIRED
        to: TESTED
        trigger: "POST /solar/string-circuits/{circuit_id}/test-results whose disposition is PASS per calculations.string_test_disposition"
        actor: InstallationForeman
        preconditions: ["status IN {WIRED, FAILED}"]
        side_effects:
          - "store insulation_resistance_mohm, measured_voc_v, expected_voc_v, polarity_ok, tested_at; clear test_failure_reason"
          - "increment Block.circuits_tested_count; when it reaches Block.planned_string_count with circuits_failed_count == 0 the block's electrical dimension advances to TESTED"
          - "increment version by 1"
      - from: WIRED
        to: FAILED
        trigger: "POST /solar/string-circuits/{circuit_id}/test-results whose disposition is FAIL (also valid from TESTED and FAILED)"
        actor: InstallationForeman
        preconditions: ["status IN {WIRED, TESTED, FAILED}"]
        side_effects:
          - "store the measurements and test_failure_reason"
          - "increment Block.circuits_failed_count; because this block now has a FAILED circuit, Block.electrical_status becomes REWORK (hop 2 of the string-test cascade)"
          - "increment version by 1"
      - from: FAILED
        to: TESTED
        trigger: "POST /solar/string-circuits/{circuit_id}/test-results on a retest whose disposition is PASS"
        actor: InstallationForeman
        preconditions: ["status == FAILED"]
        side_effects:
          - "clear test_failure_reason and store the new measurements"
          - "recompute Block.circuits_failed_count and circuits_tested_count; a REWORK block whose circuits_failed_count returns to 0 leaves REWORK"
          - "increment version by 1"
        note: "Cycle: WIRED -> FAILED -> TESTED -> FAILED -> TESTED is unbounded; each retest overwrites the measurements."

  - entity: Substation
    initial_state: SITE_CIVIL
    terminal_states: [ENERGIZED]
    transitions:
      - from: SITE_CIVIL
        to: STEEL_ERECTED
        trigger: "POST /solar/substations/{substation_id}/status-advances with to_status == STEEL_ERECTED"
        actor: UtilityCoordinator
        preconditions: ["to_status is the immediate successor of status"]
        side_effects: ["store utility_witness_ref", "increment version by 1"]
      - from: STEEL_ERECTED
        to: EQUIPMENT_SET
        trigger: "POST /solar/substations/{substation_id}/status-advances with to_status == EQUIPMENT_SET"
        actor: UtilityCoordinator
        preconditions: ["to_status is the immediate successor of status"]
        side_effects: ["store utility_witness_ref", "increment version by 1"]
      - from: EQUIPMENT_SET
        to: BACKFEED_REQUESTED
        trigger: "POST /solar/substations/{substation_id}/status-advances with to_status == BACKFEED_REQUESTED"
        actor: UtilityCoordinator
        preconditions: ["to_status is the immediate successor of status", "the project's medium-voltage collection is represented by mv_collection_km >= 0 (no further gate)"]
        side_effects: ["store utility_witness_ref", "increment version by 1"]
      - from: BACKFEED_REQUESTED
        to: ENERGIZED
        trigger: "POST /solar/substations/{substation_id}/status-advances with to_status == ENERGIZED"
        actor: UtilityCoordinator
        preconditions:
          - "to_status is the immediate successor of status"
          - "an OutageWindow of this substation with status == APPROVED and purpose == BACKFEED contains the current logical clock instant in its closed [start_at, end_at] interval"
        side_effects:
          - "set energized_at = current logical clock, energizing_outage_window_id = that window's id"
          - "that OutageWindow transitions APPROVED -> EXECUTED and its version increments by 1"
          - "increment version by 1"

  - entity: OutageWindow
    initial_state: REQUESTED
    terminal_states: [DENIED, EXECUTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /solar/outage-windows/{window_id}/utility-response with decision == APPROVE"
        actor: UtilityCoordinator
        preconditions: ["status == REQUESTED"]
        side_effects: ["store utility_reference and responded_at", "increment version by 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /solar/outage-windows/{window_id}/utility-response with decision == DENY"
        actor: UtilityCoordinator
        preconditions: ["status == REQUESTED"]
        side_effects:
          - "store utility_reference and responded_at"
          - "the window stops occupying the feeder: it is excluded from calculations.outage_window_conflict_check"
          - "increment version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "system, inside POST /solar/substations/{substation_id}/status-advances with to_status == ENERGIZED"
        actor: system
        preconditions: ["status == APPROVED", "start_at <= current logical clock <= end_at"]
        side_effects: ["increment version by 1"]

  - entity: CommissioningTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, VOID]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system, on the first POST /solar/commissioning-tests/{test_id}/intervals"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increment interval_count and (when the sample is valid) valid_interval_count", "increment version by 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /solar/commissioning-tests/{test_id}/finalization when the applied calculation clears the guarantee"
        actor: CommissioningEngineer
        preconditions:
          - "status == IN_PROGRESS"
          - "valid_interval_count >= 1"
          - "the project's Substation has status == ENERGIZED"
        side_effects:
          - "store reported_kw_ac / reported_performance_ratio, pass_threshold_kw_ac and finalized_at"
          - "increment version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /solar/commissioning-tests/{test_id}/finalization when the applied calculation misses the guarantee"
        actor: CommissioningEngineer
        preconditions: ["status == IN_PROGRESS", "valid_interval_count >= 1", "the project's Substation has status == ENERGIZED"]
        side_effects: ["store the reported result and finalized_at", "increment version by 1"]
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system, third-or-later hop of a readiness cascade: Project.mc_readiness became BLOCKED (also valid from IN_PROGRESS)"
        actor: system
        preconditions: ["status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["set suspend_reason = MC_READINESS_LOST", "increment version by 1"]
      - from: FAILED
        to: VOID
        trigger: "system, inside POST /solar/commissioning-tests when a new test of the same test_type is created for the project (also valid from SCHEDULED, IN_PROGRESS and SUSPENDED)"
        actor: system
        preconditions: ["status IN {SCHEDULED, IN_PROGRESS, FAILED, SUSPENDED}", "the new test has the same test_type and project_id"]
        side_effects: ["set void_reason = SUPERSEDED_BY_NEW_TEST and superseded = true", "increment version by 1"]

  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: CLOSURE_SUBMITTED
        trigger: "POST /solar/punch-list-items/{item_id}/closure-submissions"
        actor: InstallationForeman
        preconditions: ["status == OPEN"]
        side_effects: ["store closure_evidence_ref and submitted_by_user_id", "increment version by 1"]
      - from: CLOSURE_SUBMITTED
        to: OPEN
        trigger: "POST /solar/punch-list-items/{item_id}/closure-decisions with decision == REJECT"
        actor: OwnerEngineer
        preconditions: ["status == CLOSURE_SUBMITTED", "X-User-ID differs from submitted_by_user_id"]
        side_effects:
          - "increment rejection_count, store decided_by_user_id"
          - "increment version by 1"
        note: "Cycle: OPEN -> CLOSURE_SUBMITTED -> OPEN is unbounded and rejection_count records the loop count."
      - from: CLOSURE_SUBMITTED
        to: CLOSED
        trigger: "POST /solar/punch-list-items/{item_id}/closure-decisions with decision == APPROVE"
        actor: OwnerEngineer
        preconditions: ["status == CLOSURE_SUBMITTED", "X-User-ID differs from submitted_by_user_id"]
        side_effects:
          - "store decided_by_user_id"
          - "recompute Project.open_punch_item_count and Project.open_critical_punch_count, and Project.version increments by 1"
          - "increment version by 1"
      - from: CLOSURE_SUBMITTED
        to: WAIVED
        trigger: "POST /solar/punch-list-items/{item_id}/closure-decisions with decision == WAIVE"
        actor: OwnerEngineer
        preconditions: ["status == CLOSURE_SUBMITTED", "X-User-ID differs from submitted_by_user_id"]
        side_effects:
          - "store decided_by_user_id"
          - "recompute Project.open_punch_item_count and Project.open_critical_punch_count, and Project.version increments by 1"
          - "increment version by 1"

  - entity: PayrollWeek
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    transitions:
      - from: OPEN
        to: CERTIFIED
        trigger: "POST /solar/payroll-weeks/{week_id}/certification"
        actor: LaborComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "entry_count >= 1"
          - "X-User-ID is not the posted_by_user_id of any POSTED LaborEntry of this week (segregation of duties)"
        side_effects: ["store certified_by_user_id and certified_at", "increment version by 1"]

  - entity: LaborEntry
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /solar/labor-entries/{entry_id}/void"
        actor: LaborComplianceOfficer
        preconditions: ["status == POSTED", "the owning PayrollWeek has status == OPEN"]
        side_effects:
          - "store void_reason, set restitution_cents = 0"
          - "recompute PayrollWeek.total_hours, apprentice_hours, journeyworker_hours, apprentice_pct, entry_count and increment PayrollWeek.version by 1"
          - "recompute Project.total_labor_hours and Project.apprentice_labor_hours and increment Project.version by 1 (compensating action of calculations.payroll_hour_ledger)"
          - "increment version by 1"

  - entity: Project
    initial_state: PRECONSTRUCTION
    terminal_states: [FINAL_ACCEPTED]
    transitions:
      - from: PRECONSTRUCTION
        to: MC_CLAIMED
        trigger: "POST /solar/projects/{project_id}/milestone-claims with milestone_kind == MECHANICAL_COMPLETION"
        actor: EpcProjectManager
        preconditions: ["milestone_state == PRECONSTRUCTION", "mc_readiness == READY"]
        side_effects: ["store mc_claimed_by_user_id = X-User-ID", "increment version by 1"]
      - from: MC_CLAIMED
        to: MC_CERTIFIED
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == MECHANICAL_COMPLETION, decision == CERTIFY"
        actor: OwnerEngineer
        preconditions: ["milestone_state == MC_CLAIMED", "mc_readiness == READY", "X-User-ID differs from mc_claimed_by_user_id"]
        side_effects: ["clear mc_claimed_by_user_id", "increment version by 1"]
      - from: MC_CLAIMED
        to: PRECONSTRUCTION
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with decision == REJECT"
        actor: OwnerEngineer
        preconditions: ["milestone_state == MC_CLAIMED", "X-User-ID differs from mc_claimed_by_user_id"]
        side_effects: ["store last_milestone_rejection_reason, clear mc_claimed_by_user_id", "increment version by 1"]
        note: "Cycle: the claim may be re-filed once readiness is restored."
      - from: MC_CLAIMED
        to: PRECONSTRUCTION
        trigger: "system, fourth hop of the string-test-failure cascade: mc_readiness became BLOCKED while a mechanical-completion claim was outstanding"
        actor: system
        preconditions: ["milestone_state == MC_CLAIMED", "mc_readiness transitioned to BLOCKED"]
        side_effects:
          - "set last_milestone_rejection_reason = AUTO_MC_READINESS_LOST and clear mc_claimed_by_user_id"
          - "increment version by 1"
      - from: MC_CERTIFIED
        to: SC_CLAIMED
        trigger: "POST /solar/projects/{project_id}/milestone-claims with milestone_kind == SUBSTANTIAL_COMPLETION"
        actor: EpcProjectManager
        preconditions:
          - "milestone_state == MC_CERTIFIED"
          - "the project's Substation has status == ENERGIZED"
          - "a CommissioningTest of this project with test_type == CAPACITY and status == PASSED exists"
          - "open_critical_punch_count == 0"
        side_effects: ["increment version by 1"]
      - from: SC_CLAIMED
        to: SC_CERTIFIED
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == SUBSTANTIAL_COMPLETION, decision == CERTIFY"
        actor: OwnerEngineer
        preconditions: ["milestone_state == SC_CLAIMED", "open_critical_punch_count == 0"]
        side_effects:
          - "run calculations.substantial_completion_settlement and store delay_days, ld_assessed_cents, retainage_held_cents, punchlist_holdback_cents, sc_payment_due_cents"
          - "increment version by 1"
      - from: SC_CLAIMED
        to: MC_CERTIFIED
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == SUBSTANTIAL_COMPLETION, decision == REJECT"
        actor: OwnerEngineer
        preconditions: ["milestone_state == SC_CLAIMED"]
        side_effects: ["store last_milestone_rejection_reason", "increment version by 1"]
      - from: SC_CERTIFIED
        to: FA_CLAIMED
        trigger: "POST /solar/projects/{project_id}/milestone-claims with milestone_kind == FINAL_ACCEPTANCE"
        actor: EpcProjectManager
        preconditions:
          - "milestone_state == SC_CERTIFIED"
          - "open_punch_item_count == 0"
          - "a CommissioningTest of this project with test_type == PERFORMANCE_RATIO and status == PASSED exists"
          - "tax_credit_status == QUALIFIED"
        side_effects: ["increment version by 1"]
      - from: FA_CLAIMED
        to: FINAL_ACCEPTED
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == FINAL_ACCEPTANCE, decision == CERTIFY"
        actor: OwnerEngineer
        preconditions: ["milestone_state == FA_CLAIMED", "open_punch_item_count == 0", "tax_credit_status == QUALIFIED"]
        side_effects:
          - "run calculations.final_acceptance_release and store final_payment_cents"
          - "increment version by 1"
      - from: FA_CLAIMED
        to: SC_CERTIFIED
        trigger: "POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == FINAL_ACCEPTANCE, decision == REJECT"
        actor: OwnerEngineer
        preconditions: ["milestone_state == FA_CLAIMED"]
        side_effects: ["store last_milestone_rejection_reason", "increment version by 1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: delivery-create-stale-yard-zone
    parent_entity: YardZone
    write_endpoint: "POST /solar/deliveries"
    occ_field: "expected_yard_zone_version"
    description: |
      Creating a Delivery against a YardZone whose version has advanced since
      the client last read it is rejected. A laydown reservation legitimately
      consumes pallet positions that another writer may already have consumed
      or released, so the reservation is only accepted while the client's view
      of the zone's occupancy is current.
    error_id: ERR_STALE_YARD_ZONE_VERSION
    http_status: 412
  - rule_id: commissioning-test-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /solar/commissioning-tests"
    occ_field: "expected_project_version"
    description: |
      Creating a CommissioningTest voids any earlier test of the same
      test_type on that project, so the write legitimately supersedes prior
      commissioning history. It is therefore rejected when the client's
      observed Project.version is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: yard_zone_pallet_ledger
    trigger: "On POST /solar/deliveries (reserve), POST /solar/deliveries/{delivery_id}/receipt (accept keeps / reject releases) and POST /solar/deliveries/{delivery_id}/cancellation (release)"
    algorithm: aggregation
    formula: |
      reserved_pallets = SUM(d.pallets
                             FOR d IN Delivery WHERE d.yard_zone_id == zone.id
                                                 AND d.status IN {RESERVED, ARRIVED, ACCEPTED})
      available_pallets = zone.pallet_capacity - reserved_pallets
      INVARIANT (conserved quantity "pallet positions"):
        zone.pallet_capacity == zone.reserved_pallets + zone.available_pallets   # always
        AND after (POST /solar/deliveries  ->  POST /solar/deliveries/{id}/cancellation)
            on the same delivery, zone.reserved_pallets equals its value before
            the reservation, exactly (no pallet drift), while zone.version has
            advanced by exactly 2.
    input_set: "Deliveries of the zone with status IN {RESERVED, ARRIVED, ACCEPTED}; CANCELLED and REJECTED deliveries are excluded"
    constants: {}
    precision: "integer pallets, no rounding"

  - name: laydown_window_capacity_check
    trigger: "On POST /solar/deliveries, before the reservation is persisted"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics with AGGREGATE capacity:
      # windows share the zone until the summed pallets exceed capacity, and
      # touching endpoints (existing.end == candidate.start) do NOT collide.
      overlapping = [ d FOR d IN Delivery
                        WHERE d.yard_zone_id == candidate.yard_zone_id
                          AND d.status IN {RESERVED, ARRIVED, ACCEPTED}
                          AND d.laydown_window_start <  candidate.laydown_window_end
                          AND d.laydown_window_end   >  candidate.laydown_window_start ]
      occupied = SUM(d.pallets FOR d IN overlapping)
      IF occupied + candidate.pallets > zone.pallet_capacity:
          REJECT with ERR_YARD_WINDOW_CAPACITY_EXCEEDED
    input_set: "Same-zone deliveries in {RESERVED, ARRIVED, ACCEPTED}; the pairwise-overlap-with-candidate sum is the pinned definition of occupancy (no interval splitting, no peak-profile scan)"
    constants: {}
    precision: "integer pallets"

  - name: outage_window_conflict_check
    trigger: "On POST /solar/substations/{substation_id}/outage-windows, before the request is persisted"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics with an EXCLUSIVE switching buffer:
      # the feeder admits exactly one live window, and each window is padded by
      # OUTAGE_SWITCHING_BUFFER_MINUTES on BOTH sides, so touching windows and
      # gaps of <= 120 minutes both collide.
      FOR w IN OutageWindow WHERE w.substation_id == candidate.substation_id
                              AND w.status IN {REQUESTED, APPROVED, EXECUTED}:
          IF candidate.start_at <= w.end_at   + OUTAGE_SWITCHING_BUFFER_MINUTES
             AND candidate.end_at + OUTAGE_SWITCHING_BUFFER_MINUTES >= w.start_at:
              REJECT with ERR_OUTAGE_WINDOW_CONFLICT
    input_set: "Same-substation windows with status IN {REQUESTED, APPROVED, EXECUTED}; DENIED windows release the feeder and are excluded"
    constants:
      OUTAGE_SWITCHING_BUFFER_MINUTES: 120
    precision: "whole minutes, UTC"

  - name: earthwork_window_conflict_check
    trigger: "On POST /solar/grading-areas/{grading_area_id}/earthwork-logs"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics, exclusive crew occupancy, NO buffer.
      FOR w IN area.earthwork_windows:
          IF candidate.work_start_at <= w.work_end_at
             AND candidate.work_end_at >= w.work_start_at:
              REJECT with ERR_EARTHWORK_WINDOW_CONFLICT
    input_set: "Every record already appended to GradingArea.earthwork_windows (append-only, never pruned)"
    constants: {}
    precision: "whole minutes, UTC"

  - name: site_condition_gates
    trigger: "On POST /solar/grading-areas/{grading_area_id}/site-events (to update the gates) and on POST /solar/grading-areas/{grading_area_id}/earthwork-logs and /acceptance (to evaluate them)"
    algorithm: threshold
    formula: |
      # --- maintained by site-events ---
      ON event_type == RAIN_EVENT:
          IF rainfall_inches >= RAIN_TRIGGER_INCHES:
              rain_blackout_until = occurred_at + RAIN_BLACKOUT_HOURS hours
          # a non-qualifying rain event leaves rain_blackout_until untouched
      ON event_type == BMP_INSPECTION:
          bmp_last_inspected_at = occurred_at
          bmp_deficiency_open   = (deficiencies_found == true)

      # --- evaluated by earthwork-logs, in this order ---
      IF permit_status != ACTIVE OR bmp_deficiency_open == true:
          REJECT with ERR_PERMIT_NOT_ACTIVE                # priority 11
      IF rain_blackout_until IS NOT NULL
         AND candidate.work_start_at < rain_blackout_until:
          REJECT with ERR_RAIN_EVENT_BLACKOUT               # priority 12
      IF candidate.work_start_at
         > bmp_last_inspected_at + bmp_inspection_interval_days days:
          REJECT with ERR_BMP_INSPECTION_OVERDUE            # priority 13

      # --- evaluated by acceptance ---
      IF compaction_test_pct < MIN_COMPACTION_PCT OR drainage_inspection_passed != true:
          REJECT with ERR_INVALID_REQUEST                   # priority 3
    input_set: "The latest RAIN_EVENT and the latest BMP_INSPECTION site event of the area, plus the candidate earthwork window or acceptance payload"
    constants:
      RAIN_TRIGGER_INCHES: 0.25
      RAIN_BLACKOUT_HOURS: 48
      MIN_COMPACTION_PCT: 95.0
    precision: "whole minutes and whole days, UTC; rainfall to 2 decimals; compaction to 1 decimal"

  - name: earthwork_disturbance_ledger
    trigger: "On POST /solar/grading-areas/{grading_area_id}/earthwork-logs, after all other checks pass"
    algorithm: aggregation
    formula: |
      disturbed_acreage_current = round_half_up(
          SUM(w.acreage_disturbed_delta FOR w IN area.earthwork_windows ORDER BY created_at ASC), 2)
      GATE evaluated BEFORE the append:
        IF round_half_up(disturbed_acreage_current + candidate.acreage_disturbed_delta, 2)
           > area.disturbed_acreage_limit:
              REJECT with ERR_DISTURBED_ACREAGE_EXCEEDED
    input_set: "All appended earthwork windows of the area, in created_at ASC order"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: pile_drive_disposition
    trigger: "On POST /solar/piles/{pile_id}/drive-results and POST /solar/piles/{pile_id}/remediations"
    algorithm: threshold
    formula: |
      # Three inputs interact non-linearly: the refusal flag SELECTS which
      # embedment threshold applies, and the plumb check is ANDed on top.
      min_refusal_embedment = design_embedment_mm * REFUSAL_MIN_EMBEDMENT_RATIO
      plumb_ok = (plumb_deviation_mm <= PLUMB_TOLERANCE_MM)
      IF refusal == true:
          IF actual_embedment_mm < min_refusal_embedment:      -> REFUSED
          ELSE IF plumb_ok:                                    -> ACCEPTED
          ELSE:                                                -> OUT_OF_TOLERANCE
      ELSE:
          IF actual_embedment_mm >= design_embedment_mm AND plumb_ok: -> ACCEPTED
          ELSE:                                                      -> OUT_OF_TOLERANCE
      # Remediation path reuses the refusal branch: a remediation is accepted only
      # when actual_embedment_mm >= min_refusal_embedment AND plumb_ok, otherwise
      # the request is rejected with ERR_REMEDIATION_STILL_OUT_OF_TOLERANCE and the
      # pile keeps its previous status.
    input_set: "The single Pile addressed by the path, plus its design_embedment_mm"
    constants:
      REFUSAL_MIN_EMBEDMENT_RATIO: 0.90
      PLUMB_TOLERANCE_MM: 12.0
    precision: "embedment in whole mm; plumb deviation 1 decimal place"

  - name: string_test_disposition
    trigger: "On POST /solar/string-circuits/{circuit_id}/test-results"
    algorithm: threshold
    formula: |
      expected_voc_v = round_half_up(
          modules_in_series * MODULE_VOC_STC_V
          * (1 + VOC_TEMP_COEFF_PER_C * (ambient_c - STC_TEMP_C)), 2)
      allowed_deviation_v = round_half_up(expected_voc_v * VOC_TOLERANCE_PCT, 4)
      # Pinned check order; the FIRST failing check names test_failure_reason.
      IF insulation_resistance_mohm < IR_MIN_MOHM:                       -> FAIL(INSULATION)
      ELSE IF abs(measured_voc_v - expected_voc_v) > allowed_deviation_v: -> FAIL(VOC_DEVIATION)
      ELSE IF polarity_ok == false:                                      -> FAIL(POLARITY)
      ELSE:                                                              -> PASS
    input_set: "The single StringCircuit addressed by the path and the measurements in the request body"
    constants:
      IR_MIN_MOHM: 40.0
      MODULE_VOC_STC_V: 49.50
      VOC_TEMP_COEFF_PER_C: -0.0028
      STC_TEMP_C: 25
      VOC_TOLERANCE_PCT: 0.03
    precision: "voltages 2 decimal places, round_half_up; resistance 1 decimal place"

  - name: module_availability_check
    trigger: "On POST /solar/blocks/{block_id}/mechanical-completion"
    algorithm: aggregation
    formula: |
      delivered = SUM(d.accepted_unit_qty
                      FOR d IN Delivery WHERE d.project_id == block.project_id
                                          AND d.component_type == MODULE
                                          AND d.status == ACCEPTED)
      already_installed = SUM(b.modules_installed_qty
                              FOR b IN Block WHERE b.project_id == block.project_id
                                               AND b.modules_installed_qty IS NOT NULL
                                               AND b.id != block.id)
      IF request.modules_installed_qty > delivered - already_installed:
          REJECT with ERR_INSUFFICIENT_ACCEPTED_MODULES
    input_set: "ACCEPTED MODULE deliveries of the project only; RESERVED, ARRIVED, REJECTED and CANCELLED deliveries contribute nothing, and TRACKER / INVERTER deliveries are excluded"
    constants: {}
    precision: "integer units"

  - name: block_and_project_readiness_rollup
    trigger: "After every transition that changes Block.mechanical_status, Block.electrical_status, or GradingArea.status"
    algorithm: constraint_propagation
    formula: |
      block.mc_ready = (block.mechanical_status == MECH_COMPLETE
                        AND block.electrical_status == TESTED)
      project.blocks_total          = COUNT(Block WHERE project_id == project.id)
      project.blocks_mc_ready_count = COUNT(Block WHERE project_id == project.id AND mc_ready)
      project.mc_readiness = READY IF project.blocks_total >= 1
                                      AND project.blocks_mc_ready_count == project.blocks_total
                                      AND EVERY GradingArea of the project has status == ACCEPTED
                                   ELSE BLOCKED
      # Propagation is single-pass and ordered: Pile/StringCircuit -> Block ->
      # Project -> (milestone auto-rejection | commissioning-test suspension).
      # When project.mc_readiness leaves READY:
      #   IF project.milestone_state == MC_CLAIMED:
      #        milestone_state -> PRECONSTRUCTION,
      #        last_milestone_rejection_reason = AUTO_MC_READINESS_LOST
      #   every CommissioningTest of the project with status IN {SCHEDULED, IN_PROGRESS}
      #        -> SUSPENDED with suspend_reason = MC_READINESS_LOST
    input_set: "All blocks and grading areas of the project, regardless of creation order"
    constants: {}
    precision: "integer counts"

  - name: capacity_test_result
    trigger: "On POST /solar/commissioning-tests/{test_id}/finalization when test_type == CAPACITY"
    algorithm: weighted_scoring
    formula: |
      valid = [ i FOR i IN TestInterval WHERE i.commissioning_test_id == test.id
                                          AND i.irradiance_w_m2 >= MIN_IRRADIANCE_W_M2
                                          AND i.wind_m_s <= MAX_WIND_M_S
                                          AND AMBIENT_MIN_C <= i.ambient_c <= AMBIENT_MAX_C ]
                ORDER BY created_at ASC
      IF len(valid) == 0: REJECT with ERR_NO_VALID_TEST_INTERVALS
      pass_threshold_kw_ac = round_half_up(project.guaranteed_capacity_kw_ac * CAPACITY_PASS_RATIO, 2)
      # ROUNDING ORDER IS PINNED: correct-and-round PER INTERVAL, then average,
      # then round the average. Averaging raw values and rounding once is wrong.
      reported_kw_ac = round_half_up(SUM(sample_value(i) FOR i IN valid) / len(valid), 2)
      result = PASSED IF reported_kw_ac >= pass_threshold_kw_ac ELSE FAILED
    input_set: "TestInterval rows of this test that clear all three weather filters; invalid samples are excluded from both the numerator and the denominator"
    constants:
      MIN_IRRADIANCE_W_M2: 600
      MAX_WIND_M_S: 8.0
      AMBIENT_MIN_C: -10
      AMBIENT_MAX_C: 45
      G_REF_W_M2: 1000
      STC_TEMP_C: 25
      CELL_TEMP_RISE_PER_W: 0.025
      PMAX_TEMP_COEFF_PER_C: -0.0035
      CAPACITY_PASS_RATIO: 0.98
    variants:
      - name: AS_MEASURED
        when: "CommissioningTest.correction_variant == AS_MEASURED"
        difference: "sample_value(i) = i.measured_kw_ac (no correction; TestInterval.corrected_kw_ac is still stored for reference but is not used)"
      - name: WEATHER_CORRECTED
        when: "CommissioningTest.correction_variant == WEATHER_CORRECTED"
        difference: |
          sample_value(i) = i.corrected_kw_ac, where
            cell_temp_c = i.ambient_c + i.irradiance_w_m2 * CELL_TEMP_RISE_PER_W
            temp_factor = 1 + PMAX_TEMP_COEFF_PER_C * (cell_temp_c - STC_TEMP_C)
            corrected_kw_ac = round_half_up(
                i.measured_kw_ac * (G_REF_W_M2 / i.irradiance_w_m2) / temp_factor, 2)
          Identical intervals therefore yield a materially different
          reported_kw_ac and can flip PASSED/FAILED.
    precision: "2 decimal places, round_half_up, applied per interval and again to the mean"

  - name: performance_ratio_result
    trigger: "On POST /solar/commissioning-tests/{test_id}/finalization when test_type == PERFORMANCE_RATIO"
    algorithm: aggregation
    formula: |
      valid = same filter as capacity_test_result
      IF len(valid) == 0: REJECT with ERR_NO_VALID_TEST_INTERVALS
      numerator   = SUM(i.measured_kw_ac FOR i IN valid)
      denominator = SUM(project.dc_capacity_kw * i.irradiance_w_m2 / G_REF_W_M2 FOR i IN valid)
      reported_performance_ratio = round_half_up(numerator / denominator, 4)
      result = PASSED IF reported_performance_ratio >= project.guaranteed_performance_ratio
                       ELSE FAILED
      # correction_variant is IGNORED here: performance ratio is always computed
      # from as-measured power against as-measured irradiance.
    input_set: "Same valid-interval set as capacity_test_result; sums are taken over raw measurements with no per-interval rounding"
    constants:
      G_REF_W_M2: 1000
    precision: "4 decimal places, round_half_up, applied once to the ratio"

  - name: apprenticeship_compliance
    trigger: "On POST /solar/projects/{project_id}/labor-compliance-runs"
    algorithm: threshold
    formula: |
      basis = request.basis_override IF PRESENT ELSE project.apprenticeship_basis
      weeks = PayrollWeek WHERE project_id == project.id, ORDER BY week_start_date ASC
      entries(w) = LaborEntry WHERE payroll_week_id == w.id AND status == POSTED
      qualified = (apprentice_hours_pct >= project.apprenticeship_min_pct)   # >= , not >
      project.apprenticeship_basis_applied = basis
    input_set: "POSTED labor entries of every PayrollWeek of the project regardless of week status; VOIDED entries are excluded; weeks with total_hours == 0 are excluded from the WEEKLY_WORST_CASE minimum"
    constants:
      DEFAULT_APPRENTICE_MIN_PCT: 15.00
    variants:
      - name: PROJECT_AGGREGATE
        when: "basis == PROJECT_AGGREGATE"
        difference: |
          apprentice_hours_pct = round_half_up(
              SUM(e.hours FOR e IN all entries WHERE e.is_apprentice) /
              SUM(e.hours FOR e IN all entries) * 100, 2)
          One ratio over the whole project; a strong week can carry a weak one.
      - name: WEEKLY_WORST_CASE
        when: "basis == WEEKLY_WORST_CASE"
        difference: |
          per_week_pct(w) = round_half_up(w.apprentice_hours / w.total_hours * 100, 2)
          apprentice_hours_pct = MIN(per_week_pct(w) FOR w IN weeks WHERE w.total_hours > 0)
          Rounding happens per week BEFORE the minimum is taken, so the same
          entries can qualify under PROJECT_AGGREGATE and fail here.
    precision: "2 decimal places, round_half_up"

  - name: prevailing_wage_restitution
    trigger: "On POST /solar/projects/{project_id}/labor-compliance-runs, and on POST /solar/payroll-weeks/{week_id}/labor-entries when project.prevailing_wage_election == STRICT (as a pre-persist gate)"
    algorithm: aggregation
    formula: |
      FOR each e IN LaborEntry of the project WHERE e.status == POSTED:
          e.shortfall_cents_per_hour = max(0, e.prevailing_rate_cents
                                              - (e.paid_rate_cents + e.fringe_rate_cents))
          e.restitution_cents = round_half_up(e.shortfall_cents_per_hour * e.hours, 0)
      # ROUNDING ORDER IS PINNED: round PER ENTRY to whole cents, THEN sum.
      # Summing the unrounded products and rounding once produces a different
      # total (e.g. 1747 vs 1746 cents) and is wrong.
      project.wage_restitution_owed_cents  = SUM(e.restitution_cents)
      project.wage_liquidated_damages_cents = round_half_up(
          project.wage_restitution_owed_cents * PW_LD_RATE, 0)
      project.tax_credit_status =
          QUALIFIED    IF apprenticeship_compliance.qualified AND wage_restitution_owed_cents == 0
          ELSE DISQUALIFIED
      # STRICT gate: a labor entry whose shortfall_cents_per_hour > 0 is rejected
      # at post time with ERR_BELOW_PREVAILING_WAGE and never enters the ledger.
    input_set: "POSTED labor entries of every PayrollWeek of the project, ordered by (work_date ASC, created_at ASC); VOIDED entries contribute 0"
    constants:
      PW_LD_RATE: 0.20
    precision: "whole cents, round_half_up, applied per entry before summation"

  - name: payroll_hour_ledger
    trigger: "On POST /solar/payroll-weeks/{week_id}/labor-entries and POST /solar/labor-entries/{entry_id}/void"
    algorithm: aggregation
    formula: |
      week.total_hours         = round_half_up(SUM(e.hours FOR POSTED e OF week), 2)
      week.apprentice_hours    = round_half_up(SUM(e.hours FOR POSTED e OF week WHERE e.is_apprentice), 2)
      week.journeyworker_hours = round_half_up(SUM(e.hours FOR POSTED e OF week WHERE NOT e.is_apprentice), 2)
      week.apprentice_pct      = round_half_up(week.apprentice_hours / week.total_hours * 100, 2)  # 0 when total_hours == 0
      project.total_labor_hours      = round_half_up(SUM(week.total_hours FOR weeks OF project), 2)
      project.apprentice_labor_hours = round_half_up(SUM(week.apprentice_hours FOR weeks OF project), 2)
      INVARIANT (conserved quantity "certified payroll hours"):
        week.apprentice_hours + week.journeyworker_hours == week.total_hours
        AND after (POST labor-entries -> POST /solar/labor-entries/{id}/void) on the
        same entry, week.total_hours, week.apprentice_hours, week.journeyworker_hours,
        week.entry_count, project.total_labor_hours and project.apprentice_labor_hours
        all equal their values before the post, exactly.
    input_set: "POSTED labor entries only; VOIDED entries leave the ledger entirely"
    precision: "2 decimal places, round_half_up"

  - name: change_order_ledger
    trigger: "On POST /solar/projects/{project_id}/change-orders"
    algorithm: aggregation
    formula: |
      candidate_total = project.approved_change_order_cents + request.amount_cents
      IF candidate_total > round_half_up(project.contract_value_cents * CHANGE_ORDER_CAP_PCT, 0):
          REJECT with ERR_CHANGE_ORDER_CAP_EXCEEDED
      project.approved_change_order_cents = candidate_total
    input_set: "Cumulative accepted change orders of the project; the cap is always measured against the BASE contract_value_cents, never against the already-adjusted value"
    constants:
      CHANGE_ORDER_CAP_PCT: 0.20
    precision: "whole cents"

  - name: substantial_completion_settlement
    trigger: "On POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == SUBSTANTIAL_COMPLETION and decision == CERTIFY"
    algorithm: waterfall_allocation
    formula: |
      # Circular-looking: the LD cap and the retainage both key off the adjusted
      # contract value, and the punch-list holdback is capped by the retainage
      # that step 5 has not computed yet. EVALUATION ORDER IS PINNED 1..7.
      1. adjusted_contract_cents = contract_value_cents + approved_change_order_cents
      2. ld_cap_cents  = round_half_up(adjusted_contract_cents * ld_cap_pct, 0)
      3. delay_days    = max(0, calendar_days(sc_deadline_date -> date(current logical clock)))
      4. ld_assessed_cents = min(delay_days * ld_per_day_cents, ld_cap_cents)
      5. retainage_held_cents = round_half_up(adjusted_contract_cents * retainage_pct, 0)
      6. punchlist_holdback_cents = min(
             round_half_up(SUM(p.estimated_cost_cents
                              FOR p IN PunchListItem OF project
                              WHERE p.status IN {OPEN, CLOSURE_SUBMITTED}) * PUNCH_HOLDBACK_MULTIPLIER, 0),
             retainage_held_cents)
      7. sc_payment_due_cents = max(0, adjusted_contract_cents
                                       - retainage_held_cents
                                       - ld_assessed_cents
                                       - punchlist_holdback_cents)
    input_set: "Open punch items (status IN {OPEN, CLOSURE_SUBMITTED}) at the instant of certification; CLOSED and WAIVED items contribute 0"
    constants:
      PUNCH_HOLDBACK_MULTIPLIER: 1.5
    precision: "whole cents, round_half_up; delay_days in whole UTC calendar days"

  - name: final_acceptance_release
    trigger: "On POST /solar/projects/{project_id}/milestone-decisions with milestone_kind == FINAL_ACCEPTANCE and decision == CERTIFY"
    algorithm: aggregation
    formula: |
      final_payment_cents = retainage_held_cents + punchlist_holdback_cents
      # Money identity across the two settlements (audited, not stored):
      #   sc_payment_due_cents + final_payment_cents
      #     == adjusted_contract_cents - ld_assessed_cents
    input_set: "The settlement fields frozen on the Project by substantial_completion_settlement; no punch item may still be open at this point"
    constants: {}
    precision: "whole cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# ---------------------------------------------------------------------------
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the roles declared in §1.7", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: all }
  - { priority: 3, category: business_constraint, check: "Required body fields present; enums within declared constraint sets; hours > 0, pallets > 0, unit_qty > 0, capacities > 0, percentages within range; unknown fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 4, category: business_temporal, check: "Interval bounds are ordered strictly: laydown_window_start < laydown_window_end, work_start_at < work_end_at, start_at < end_at", error_id: ERR_INVALID_WINDOW_BOUNDS, http_status: 400, applies_to: "POST /solar/deliveries, POST /solar/grading-areas/{grading_area_id}/earthwork-logs, POST /solar/substations/{substation_id}/outage-windows" }
  - { priority: 5, category: existence, check: "Path and body resources resolved left-to-right in path order, then body foreign keys in declaration order: Project", error_id: ERR_PROJECT_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a project" }
  - { priority: 5, category: existence, check: "GradingArea referenced by path or by Block.grading_area_id exists", error_id: ERR_GRADING_AREA_NOT_FOUND, http_status: 404, applies_to: "grading-area endpoints, POST /solar/projects/{project_id}/blocks" }
  - { priority: 5, category: existence, check: "YardZone referenced by Delivery.yard_zone_id exists", error_id: ERR_YARD_ZONE_NOT_FOUND, http_status: 404, applies_to: "POST /solar/deliveries" }
  - { priority: 5, category: existence, check: "Delivery in path exists", error_id: ERR_DELIVERY_NOT_FOUND, http_status: 404, applies_to: "delivery endpoints" }
  - { priority: 5, category: existence, check: "Block referenced by path or by PunchListItem.block_id exists", error_id: ERR_BLOCK_NOT_FOUND, http_status: 404, applies_to: "block endpoints, POST /solar/projects/{project_id}/punch-list-items" }
  - { priority: 5, category: existence, check: "Pile in path exists", error_id: ERR_PILE_NOT_FOUND, http_status: 404, applies_to: "pile endpoints" }
  - { priority: 5, category: existence, check: "StringCircuit in path exists", error_id: ERR_STRING_CIRCUIT_NOT_FOUND, http_status: 404, applies_to: "string-circuit endpoints" }
  - { priority: 5, category: existence, check: "Substation in path exists", error_id: ERR_SUBSTATION_NOT_FOUND, http_status: 404, applies_to: "substation endpoints" }
  - { priority: 5, category: existence, check: "OutageWindow in path exists", error_id: ERR_OUTAGE_WINDOW_NOT_FOUND, http_status: 404, applies_to: "POST /solar/outage-windows/{window_id}/utility-response" }
  - { priority: 5, category: existence, check: "CommissioningTest in path exists", error_id: ERR_COMMISSIONING_TEST_NOT_FOUND, http_status: 404, applies_to: "commissioning-test endpoints" }
  - { priority: 5, category: existence, check: "PunchListItem in path exists", error_id: ERR_PUNCH_ITEM_NOT_FOUND, http_status: 404, applies_to: "punch-list-item endpoints" }
  - { priority: 5, category: existence, check: "PayrollWeek in path exists", error_id: ERR_PAYROLL_WEEK_NOT_FOUND, http_status: 404, applies_to: "payroll-week endpoints" }
  - { priority: 5, category: existence, check: "LaborEntry in path exists", error_id: ERR_LABOR_ENTRY_NOT_FOUND, http_status: 404, applies_to: "POST /solar/labor-entries/{entry_id}/void" }
  - { priority: 6, category: business_referential, check: "Cross-aggregate reference stays inside one project: Delivery.yard_zone_id's YardZone.project_id == body project_id; Block.grading_area_id's GradingArea.project_id == path project_id; PunchListItem.block_id's Block.project_id == path project_id", error_id: ERR_CROSS_PROJECT_REFERENCE, http_status: 422, applies_to: "POST /solar/deliveries, POST /solar/projects/{project_id}/blocks, POST /solar/projects/{project_id}/punch-list-items" }
  - { priority: 7, category: state, check: "expected_yard_zone_version equals the current YardZone.version (concurrency_rules.delivery-create-stale-yard-zone)", error_id: ERR_STALE_YARD_ZONE_VERSION, http_status: 412, applies_to: "POST /solar/deliveries" }
  - { priority: 7, category: state, check: "expected_project_version equals the current Project.version (concurrency_rules.commissioning-test-create-stale-project)", error_id: ERR_STALE_PROJECT_VERSION, http_status: 412, applies_to: "POST /solar/commissioning-tests" }
  - { priority: 8, category: state, check: "GradingArea.status IN {PLANNED, CLEARED, GRADED} for earthwork logs; status == GRADED for acceptance; status == HOLD for PERMIT_REINSTATEMENT; status != HOLD for PERMIT_SUSPENSION", error_id: ERR_GRADING_AREA_NOT_OPEN_FOR_WORK, http_status: 409, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs, /acceptance, /site-events" }
  - { priority: 8, category: state, check: "Delivery.status == RESERVED for receipt and cancellation", error_id: ERR_DELIVERY_NOT_RESERVED, http_status: 409, applies_to: "POST /solar/deliveries/{delivery_id}/receipt, /cancellation" }
  - { priority: 8, category: state, check: "Pile.status == PLANNED for drive-results", error_id: ERR_PILE_NOT_DRIVEABLE, http_status: 409, applies_to: "POST /solar/piles/{pile_id}/drive-results" }
  - { priority: 8, category: state, check: "Pile.status IN {OUT_OF_TOLERANCE, REFUSED} for remediations", error_id: ERR_PILE_NOT_REMEDIABLE, http_status: 409, applies_to: "POST /solar/piles/{pile_id}/remediations" }
  - { priority: 8, category: state, check: "Block.mechanical_status == PILES_COMPLETE for mechanical-completion", error_id: ERR_BLOCK_PILES_INCOMPLETE, http_status: 409, applies_to: "POST /solar/blocks/{block_id}/mechanical-completion" }
  - { priority: 8, category: state, check: "StringCircuit.status == PLANNED for wiring; status IN {WIRED, TESTED, FAILED} for test-results", error_id: ERR_CIRCUIT_STATE_INVALID, http_status: 409, applies_to: "POST /solar/string-circuits/{circuit_id}/wiring, /test-results" }
  - { priority: 8, category: state, check: "to_status is the immediate successor of Substation.status", error_id: ERR_SUBSTATION_STEP_NOT_SEQUENTIAL, http_status: 409, applies_to: "POST /solar/substations/{substation_id}/status-advances" }
  - { priority: 8, category: state, check: "OutageWindow.status == REQUESTED for a utility response", error_id: ERR_OUTAGE_WINDOW_ALREADY_ANSWERED, http_status: 409, applies_to: "POST /solar/outage-windows/{window_id}/utility-response" }
  - { priority: 8, category: state, check: "CommissioningTest.status == SCHEDULED or IN_PROGRESS to accept intervals; status == IN_PROGRESS to finalize", error_id: ERR_TEST_STATE_INVALID, http_status: 409, applies_to: "POST /solar/commissioning-tests/{test_id}/intervals, /finalization" }
  - { priority: 8, category: state, check: "PunchListItem.status == OPEN for a closure submission; status == CLOSURE_SUBMITTED for a closure decision", error_id: ERR_PUNCH_ITEM_STATE_INVALID, http_status: 409, applies_to: "POST /solar/punch-list-items/{item_id}/closure-submissions, /closure-decisions" }
  - { priority: 8, category: state, check: "PayrollWeek.status == OPEN to post or void entries and to certify", error_id: ERR_PAYROLL_WEEK_LOCKED, http_status: 409, applies_to: "POST /solar/payroll-weeks/{week_id}/labor-entries, /certification, POST /solar/labor-entries/{entry_id}/void" }
  - { priority: 8, category: state, check: "LaborEntry.status == POSTED to void", error_id: ERR_LABOR_ENTRY_ALREADY_VOIDED, http_status: 409, applies_to: "POST /solar/labor-entries/{entry_id}/void" }
  - { priority: 8, category: state, check: "Project.milestone_state permits the requested claim or decision for the given milestone_kind (see state_machines.Project); change orders require milestone_state != FINAL_ACCEPTED", error_id: ERR_MILESTONE_OUT_OF_SEQUENCE, http_status: 409, applies_to: "POST /solar/projects/{project_id}/milestone-claims, /milestone-decisions, /change-orders" }
  - { priority: 9, category: auth, check: "Segregation of duties: the deciding X-User-ID differs from PunchListItem.submitted_by_user_id; the certifying X-User-ID is not the posted_by_user_id of any POSTED LaborEntry of the week; the deciding X-User-ID differs from Project.mc_claimed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /solar/punch-list-items/{item_id}/closure-decisions, POST /solar/payroll-weeks/{week_id}/certification, POST /solar/projects/{project_id}/milestone-decisions" }
  - { priority: 10, category: state, check: "The owning Block's GradingArea has status == ACCEPTED before any pile is driven or remediated", error_id: ERR_GRADING_AREA_NOT_ACCEPTED, http_status: 409, applies_to: "POST /solar/piles/{pile_id}/drive-results, /remediations" }
  - { priority: 10, category: state, check: "The owning Block has mechanical_status == MECH_COMPLETE before a string circuit may be wired", error_id: ERR_BLOCK_NOT_MECHANICALLY_COMPLETE, http_status: 409, applies_to: "POST /solar/string-circuits/{circuit_id}/wiring" }
  - { priority: 10, category: state, check: "A Substation of the project has status == ENERGIZED before a commissioning test may be finalized and before substantial completion may be claimed", error_id: ERR_SUBSTATION_NOT_ENERGIZED, http_status: 422, applies_to: "POST /solar/commissioning-tests/{test_id}/finalization, POST /solar/projects/{project_id}/milestone-claims" }
  - { priority: 11, category: business_safety, check: "GradingArea.permit_status == ACTIVE and bmp_deficiency_open == false", error_id: ERR_PERMIT_NOT_ACTIVE, http_status: 422, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs, /acceptance" }
  - { priority: 12, category: business_safety, check: "work_start_at is not inside the post-rain blackout: rain_blackout_until IS NULL OR work_start_at >= rain_blackout_until", error_id: ERR_RAIN_EVENT_BLACKOUT, http_status: 422, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs" }
  - { priority: 13, category: business_safety, check: "BMP inspection current: work_start_at <= bmp_last_inspected_at + bmp_inspection_interval_days", error_id: ERR_BMP_INSPECTION_OVERDUE, http_status: 422, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs" }
  - { priority: 14, category: business_temporal, check: "calculations.earthwork_window_conflict_check finds no colliding window (closed intervals, no buffer)", error_id: ERR_EARTHWORK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs" }
  - { priority: 15, category: business_temporal, check: "calculations.outage_window_conflict_check finds no colliding window (closed intervals padded by OUTAGE_SWITCHING_BUFFER_MINUTES on both sides)", error_id: ERR_OUTAGE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /solar/substations/{substation_id}/outage-windows" }
  - { priority: 16, category: business_temporal, check: "Energization requires an APPROVED BACKFEED OutageWindow whose closed [start_at, end_at] interval contains the current logical clock", error_id: ERR_NO_APPROVED_OUTAGE_WINDOW, http_status: 422, applies_to: "POST /solar/substations/{substation_id}/status-advances" }
  - { priority: 17, category: business_constraint, check: "calculations.earthwork_disturbance_ledger gate: projected disturbed acreage <= disturbed_acreage_limit", error_id: ERR_DISTURBED_ACREAGE_EXCEEDED, http_status: 422, applies_to: "POST /solar/grading-areas/{grading_area_id}/earthwork-logs" }
  - { priority: 18, category: business_constraint, check: "calculations.laydown_window_capacity_check: overlapping reserved pallets + candidate pallets <= YardZone.pallet_capacity", error_id: ERR_YARD_WINDOW_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /solar/deliveries" }
  - { priority: 19, category: business_constraint, check: "max_torque_tube_deviation_mm <= TORQUE_TUBE_TOLERANCE_MM (25.0)", error_id: ERR_TORQUE_TUBE_TOLERANCE_EXCEEDED, http_status: 422, applies_to: "POST /solar/blocks/{block_id}/mechanical-completion" }
  - { priority: 20, category: business_constraint, check: "calculations.module_availability_check: modules_installed_qty <= accepted MODULE units not yet installed elsewhere", error_id: ERR_INSUFFICIENT_ACCEPTED_MODULES, http_status: 422, applies_to: "POST /solar/blocks/{block_id}/mechanical-completion" }
  - { priority: 21, category: business_constraint, check: "Remediated measurements clear the refusal branch of calculations.pile_drive_disposition", error_id: ERR_REMEDIATION_STILL_OUT_OF_TOLERANCE, http_status: 422, applies_to: "POST /solar/piles/{pile_id}/remediations" }
  - { priority: 22, category: business_constraint, check: "At least one TestInterval of the test clears all three weather filters", error_id: ERR_NO_VALID_TEST_INTERVALS, http_status: 422, applies_to: "POST /solar/commissioning-tests/{test_id}/finalization" }
  - { priority: 23, category: business_constraint, check: "Project.mc_readiness == READY for a MECHANICAL_COMPLETION claim and for its certification", error_id: ERR_BLOCKS_NOT_MC_READY, http_status: 422, applies_to: "POST /solar/projects/{project_id}/milestone-claims, /milestone-decisions" }
  - { priority: 24, category: business_constraint, check: "A PASSED CAPACITY test exists for SUBSTANTIAL_COMPLETION; a PASSED PERFORMANCE_RATIO test exists for FINAL_ACCEPTANCE", error_id: ERR_REQUIRED_TEST_NOT_PASSED, http_status: 422, applies_to: "POST /solar/projects/{project_id}/milestone-claims" }
  - { priority: 25, category: business_constraint, check: "open_critical_punch_count == 0 for SUBSTANTIAL_COMPLETION claim and certification", error_id: ERR_OPEN_CRITICAL_PUNCH_ITEMS, http_status: 422, applies_to: "POST /solar/projects/{project_id}/milestone-claims, /milestone-decisions" }
  - { priority: 26, category: business_constraint, check: "open_punch_item_count == 0 for FINAL_ACCEPTANCE claim and certification", error_id: ERR_OPEN_PUNCH_ITEMS, http_status: 422, applies_to: "POST /solar/projects/{project_id}/milestone-claims, /milestone-decisions" }
  - { priority: 27, category: business_constraint, check: "tax_credit_status == QUALIFIED for FINAL_ACCEPTANCE claim and certification", error_id: ERR_TAX_CREDIT_NOT_QUALIFIED, http_status: 422, applies_to: "POST /solar/projects/{project_id}/milestone-claims, /milestone-decisions" }
  - { priority: 28, category: business_fiscal, check: "When Project.prevailing_wage_election == STRICT, a posted entry must satisfy paid_rate_cents + fringe_rate_cents >= prevailing_rate_cents", error_id: ERR_BELOW_PREVAILING_WAGE, http_status: 422, applies_to: "POST /solar/payroll-weeks/{week_id}/labor-entries" }
  - { priority: 29, category: business_fiscal, check: "calculations.change_order_ledger cap: cumulative approved change orders <= contract_value_cents * CHANGE_ORDER_CAP_PCT", error_id: ERR_CHANGE_ORDER_CAP_EXCEEDED, http_status: 422, applies_to: "POST /solar/projects/{project_id}/change-orders" }

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Project ------------------------------------------------------------
  - method: POST
    path: /solar/projects
    roles: [EpcProjectManager]
    input: [name, utility_name, ac_capacity_kw, dc_capacity_kw, contract_value_cents, retainage_pct, ld_per_day_cents, ld_cap_pct, sc_deadline_date, guaranteed_capacity_kw_ac, guaranteed_performance_ratio, "prevailing_wage_election?", "apprenticeship_basis?", "apprenticeship_min_pct?"]
    output: Project
    description: "Create an EPC project. milestone_state starts at PRECONSTRUCTION, mc_readiness at BLOCKED, tax_credit_status at UNDETERMINED."
    side_effects: ["persist Project with version = 1 and all computed ledger fields at their defaults"]
  - method: GET
    path: /solar/projects/{id}
    roles: &all_read [EpcProjectManager, CivilSuperintendent, ProcurementCoordinator, InstallationForeman, UtilityCoordinator, CommissioningEngineer, OwnerEngineer, LaborComplianceOfficer]
    input: []
    output: Project
    description: "Read one project, including every derived ledger and settlement field."
    side_effects: []
  - method: GET
    path: /solar/projects
    roles: *all_read
    input: ["milestone_state?", "mc_readiness?", "limit?", "offset?"]
    output: Project[]
    description: "Paginated project list; envelope meta carries total_count and has_more."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/settlement-summary
    roles: *all_read
    input: []
    output: { adjusted_contract_cents: integer, delay_days: integer, ld_cap_cents: integer, ld_assessed_cents: integer, retainage_held_cents: integer, punchlist_holdback_cents: integer, sc_payment_due_cents: integer, final_payment_cents: integer, open_punch_item_count: integer, open_critical_punch_count: integer, tax_credit_status: string }
    description: "Computed read. adjusted_contract_cents (contract_value_cents + approved_change_order_cents), open_punch_item_count, open_critical_punch_count and tax_credit_status are always live. The six waterfall money fields — delay_days, ld_cap_cents, ld_assessed_cents, retainage_held_cents, punchlist_holdback_cents, sc_payment_due_cents — mirror calculations.substantial_completion_settlement as frozen on the Project and are 0 until SUBSTANTIAL_COMPLETION is certified; final_payment_cents mirrors calculations.final_acceptance_release and is 0 until FINAL_ACCEPTANCE is certified."
    side_effects: []
  - method: POST
    path: /solar/projects/{project_id}/change-orders
    roles: [EpcProjectManager]
    input: [amount_cents, reason]
    output: Project
    description: "Accept a change order; cumulative amount is capped at contract_value_cents * CHANGE_ORDER_CAP_PCT (calculations.change_order_ledger)."
    side_effects: ["increase approved_change_order_cents", "increment Project.version by 1"]
  - method: POST
    path: /solar/projects/{project_id}/labor-compliance-runs
    roles: [LaborComplianceOfficer]
    input: ["basis_override?"]
    output: Project
    description: "Recompute apprenticeship compliance and prevailing-wage restitution. basis_override selects the calculations.apprenticeship_compliance variant for this run without changing Project.apprenticeship_basis."
    side_effects: ["set apprentice_hours_pct, apprenticeship_basis_applied, wage_restitution_owed_cents, wage_liquidated_damages_cents, tax_credit_status", "increment Project.version by 1"]
  - method: POST
    path: /solar/projects/{project_id}/milestone-claims
    roles: [EpcProjectManager]
    input: [milestone_kind]
    output: Project
    description: "File a MECHANICAL_COMPLETION, SUBSTANTIAL_COMPLETION or FINAL_ACCEPTANCE claim (see state_machines.Project)."
    side_effects: ["advance milestone_state", "store mc_claimed_by_user_id for a mechanical-completion claim", "increment Project.version by 1"]
  - method: POST
    path: /solar/projects/{project_id}/milestone-decisions
    roles: [OwnerEngineer]
    input: [milestone_kind, decision, "reason?"]
    output: Project
    description: "Owner decision CERTIFY or REJECT on the outstanding claim. Segregation of duties: the decider may not be mc_claimed_by_user_id."
    side_effects: ["advance or revert milestone_state", "run the SC settlement waterfall on SUBSTANTIAL_COMPLETION + CERTIFY", "run the final release on FINAL_ACCEPTANCE + CERTIFY", "store last_milestone_rejection_reason on REJECT", "increment Project.version by 1"]

  # --- Civil / stormwater -------------------------------------------------
  - method: POST
    path: /solar/projects/{project_id}/grading-areas
    roles: [CivilSuperintendent]
    input: [area_code, permit_number, disturbed_acreage_limit, bmp_inspection_interval_days, "access_road_meters?"]
    output: GradingArea
    description: "Open a civil grading area under a stormwater permit. bmp_last_inspected_at is stamped with the current logical clock."
    side_effects: ["persist GradingArea in PLANNED / permit ACTIVE with empty earthwork_windows", "recompute Project.mc_readiness (a new non-ACCEPTED area forces BLOCKED) and increment Project.version by 1"]
  - method: GET
    path: /solar/grading-areas/{id}
    roles: *all_read
    input: []
    output: GradingArea
    description: "Read one grading area, including earthwork_windows and permit fields."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/grading-areas
    roles: *all_read
    input: ["status?"]
    output: GradingArea[]
    description: "Grading areas of a project."
    side_effects: []
  - method: POST
    path: /solar/grading-areas/{grading_area_id}/earthwork-logs
    roles: [CivilSuperintendent]
    input: [activity_type, work_start_at, work_end_at, acreage_disturbed_delta, "crew_ref?"]
    output: GradingArea
    description: "Log a CLEARING, GRADING, DRAINAGE or ACCESS_ROAD earthwork window. Permit, rain-blackout, BMP-currency, window-conflict and acreage checks apply in that priority order."
    side_effects: ["append the window to earthwork_windows", "recompute disturbed_acreage_current", "advance status on CLEARING / GRADING", "increment GradingArea.version by 1"]
  - method: POST
    path: /solar/grading-areas/{grading_area_id}/site-events
    roles: [CivilSuperintendent]
    input: [event_type, occurred_at, "rainfall_inches?", "deficiencies_found?", "note?"]
    output: GradingArea
    description: "Record a RAIN_EVENT (rainfall_inches >= RAIN_TRIGGER_INCHES sets rain_blackout_until = occurred_at + RAIN_BLACKOUT_HOURS), a BMP_INSPECTION (sets bmp_last_inspected_at = occurred_at and bmp_deficiency_open = deficiencies_found), a PERMIT_SUSPENSION or a PERMIT_REINSTATEMENT."
    side_effects: ["update the permit / BMP / blackout fields", "move status to HOLD or restore status_before_hold", "recompute Project.mc_readiness and increment Project.version by 1 when the area leaves or re-enters ACCEPTED-eligibility", "increment GradingArea.version by 1"]
  - method: POST
    path: /solar/grading-areas/{grading_area_id}/acceptance
    roles: [OwnerEngineer]
    input: [compaction_test_pct, drainage_inspection_passed]
    output: GradingArea
    description: "Owner acceptance of civil work; requires compaction_test_pct >= MIN_COMPACTION_PCT (95.0) and drainage_inspection_passed == true."
    side_effects: ["store the test results and set status = ACCEPTED", "recompute Project.mc_readiness and increment Project.version by 1", "increment GradingArea.version by 1"]

  # --- Laydown yard and deliveries ---------------------------------------
  - method: POST
    path: /solar/projects/{project_id}/yard-zones
    roles: [ProcurementCoordinator]
    input: [zone_code, pallet_capacity]
    output: YardZone
    description: "Create a laydown yard zone; available_pallets starts equal to pallet_capacity."
    side_effects: ["persist YardZone with reserved_pallets = 0"]
  - method: GET
    path: /solar/yard-zones/{id}
    roles: *all_read
    input: []
    output: YardZone
    description: "Read one yard zone, including the pallet ledger and the version used by the delivery-create OCC rule."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/yard-zones
    roles: *all_read
    input: []
    output: YardZone[]
    description: "Yard zones of a project."
    side_effects: []
  - method: POST
    path: /solar/deliveries
    roles: [ProcurementCoordinator]
    input: [project_id, yard_zone_id, component_type, unit_qty, pallets, planned_arrival_at, laydown_window_start, laydown_window_end, expected_yard_zone_version, "inspection_note?"]
    output: Delivery
    description: "Reserve pallet positions for an inbound shipment. Guarded by concurrency_rules.delivery-create-stale-yard-zone and by calculations.laydown_window_capacity_check."
    side_effects: ["persist Delivery in RESERVED", "recompute YardZone.reserved_pallets and available_pallets and increment YardZone.version by 1"]
  - method: GET
    path: /solar/deliveries/{id}
    roles: *all_read
    input: []
    output: Delivery
    description: "Read one delivery."
    side_effects: []
  - method: GET
    path: /solar/deliveries
    roles: *all_read
    input: ["project_id?", "yard_zone_id?", "status?", "component_type?", "limit?", "offset?"]
    output: Delivery[]
    description: "Filtered delivery list; filters combine conjunctively and pagination applies after filtering."
    side_effects: []
  - method: POST
    path: /solar/deliveries/{delivery_id}/receipt
    roles: [ProcurementCoordinator]
    input: [received_unit_qty, damaged_unit_qty, "inspection_note?"]
    output: Delivery
    description: "Receive and inspect the shipment. The ARRIVED fork is resolved in the same request: damage_ratio <= MAX_DAMAGE_RATIO (0.05) accepts, above rejects."
    side_effects: ["store the receipt counts and damage_ratio", "set status to ACCEPTED or REJECTED and set accepted_unit_qty", "on REJECTED release the pallets and increment YardZone.version by 1", "increment Delivery.version by 1"]
  - method: POST
    path: /solar/deliveries/{delivery_id}/cancellation
    roles: [ProcurementCoordinator]
    input: [cancel_reason]
    output: Delivery
    description: "Cancel a reservation before arrival; the compensating action of calculations.yard_zone_pallet_ledger."
    side_effects: ["set status = CANCELLED and store cancel_reason", "release the pallets: recompute YardZone.reserved_pallets and available_pallets and increment YardZone.version by 1", "increment Delivery.version by 1"]

  # --- Blocks, piles, racking --------------------------------------------
  - method: POST
    path: /solar/projects/{project_id}/blocks
    roles: [EpcProjectManager]
    input: [grading_area_id, block_code, dc_capacity_kw, planned_pile_count, planned_string_count]
    output: Block
    description: "Create an array block inside a grading area of the same project."
    side_effects: ["persist Block with both parallel dimensions at PLANNED and mc_ready = false", "increment Project.blocks_total, recompute mc_readiness and increment Project.version by 1"]
  - method: GET
    path: /solar/blocks/{id}
    roles: *all_read
    input: []
    output: Block
    description: "Read one block, including both state dimensions and every rollup counter."
    side_effects: []
  - method: GET
    path: /solar/blocks
    roles: *all_read
    input: ["project_id?", "grading_area_id?", "mechanical_status?", "electrical_status?", "mc_ready?", "limit?", "offset?"]
    output: Block[]
    description: "Filtered block list."
    side_effects: []
  - method: POST
    path: /solar/blocks/{block_id}/piles
    roles: [InstallationForeman]
    input: [row_index, position_index, design_embedment_mm]
    output: Pile
    description: "Register a planned pile location with its geotechnical design embedment."
    side_effects: ["persist Pile in PLANNED"]
  - method: GET
    path: /solar/blocks/{id}/piles
    roles: *all_read
    input: ["status?"]
    output: Pile[]
    description: "Piles of a block."
    side_effects: []
  - method: GET
    path: /solar/piles/{id}
    roles: *all_read
    input: []
    output: Pile
    description: "Read one pile."
    side_effects: []
  - method: POST
    path: /solar/piles/{pile_id}/drive-results
    roles: [InstallationForeman]
    input: [actual_embedment_mm, plumb_deviation_mm, blow_count, refusal, "driven_at?"]
    output: Pile
    description: "Record a pile driving result. Disposition follows calculations.pile_drive_disposition; the owning block's grading area must be ACCEPTED."
    side_effects: ["store the measurements and refusal_flag", "set status to ACCEPTED, OUT_OF_TOLERANCE or REFUSED", "update Block.piles_accepted_count / piles_refused_count, drive the mechanical dimension (including HOLD on refusal) and increment Block.version by 1", "propagate to Project.mc_readiness, auto-reject an outstanding MC claim and suspend live commissioning tests when readiness is lost", "increment Pile.version by 1"]
  - method: POST
    path: /solar/piles/{pile_id}/remediations
    roles: [InstallationForeman]
    input: [remediation_method, actual_embedment_mm, plumb_deviation_mm]
    output: Pile
    description: "Predrill, splice or relocate an OUT_OF_TOLERANCE or REFUSED pile. Accepted only when the remediated measurements clear the refusal branch of calculations.pile_drive_disposition."
    side_effects: ["set remediated = true, clear refusal_flag, store remediation_method and measurements, set status = ACCEPTED", "recompute the block counters, leave HOLD when piles_refused_count returns to 0 and increment Block.version by 1", "recompute Project.mc_readiness and increment Project.version by 1 when it changes", "increment Pile.version by 1"]
  - method: POST
    path: /solar/blocks/{block_id}/mechanical-completion
    roles: [InstallationForeman]
    input: [modules_installed_qty, max_torque_tube_deviation_mm]
    output: Block
    description: "Declare tracker and module installation complete for the block. Requires mechanical_status == PILES_COMPLETE, deviation within TORQUE_TUBE_TOLERANCE_MM and enough accepted MODULE units (calculations.module_availability_check)."
    side_effects: ["store modules_installed_qty and max_torque_tube_deviation_mm, set mechanical_status = MECH_COMPLETE", "recompute mc_ready, Project.blocks_mc_ready_count and Project.mc_readiness and increment Project.version by 1 when they change", "increment Block.version by 1"]

  # --- DC field wiring and string testing --------------------------------
  - method: POST
    path: /solar/blocks/{block_id}/string-circuits
    roles: [InstallationForeman]
    input: [circuit_code, modules_in_series]
    output: StringCircuit
    description: "Register a planned DC string circuit on a block."
    side_effects: ["persist StringCircuit in PLANNED"]
  - method: GET
    path: /solar/blocks/{id}/string-circuits
    roles: *all_read
    input: ["status?"]
    output: StringCircuit[]
    description: "String circuits of a block."
    side_effects: []
  - method: GET
    path: /solar/string-circuits/{id}
    roles: *all_read
    input: []
    output: StringCircuit
    description: "Read one string circuit, including the last test measurements and expected_voc_v."
    side_effects: []
  - method: POST
    path: /solar/string-circuits/{circuit_id}/wiring
    roles: [InstallationForeman]
    input: [combiner_position]
    output: StringCircuit
    description: "Terminate the string into its combiner position. Requires the owning block to be mechanically complete."
    side_effects: ["store combiner_position and set status = WIRED", "increment Block.circuits_wired_count, advance the electrical dimension to WIRED when the planned count is reached, increment Block.version by 1"]
  - method: POST
    path: /solar/string-circuits/{circuit_id}/test-results
    roles: [InstallationForeman]
    input: [insulation_resistance_mohm, measured_voc_v, ambient_c, polarity_ok]
    output: StringCircuit
    description: "Record an insulation-resistance, open-circuit-voltage and polarity test. Disposition and test_failure_reason follow the pinned check order of calculations.string_test_disposition."
    side_effects: ["store the measurements and expected_voc_v, set status to TESTED or FAILED", "update Block.circuits_tested_count / circuits_failed_count, drive the electrical dimension (REWORK on failure, back to TESTED on a clean retest) and increment Block.version by 1", "propagate to Project.mc_readiness, auto-reject an outstanding MC claim and suspend live commissioning tests when readiness is lost", "increment StringCircuit.version by 1"]

  # --- MV collection, substation, interconnection -------------------------
  - method: POST
    path: /solar/projects/{project_id}/substations
    roles: [UtilityCoordinator]
    input: [substation_code, interconnection_voltage_kv, mv_collection_km]
    output: Substation
    description: "Create the substation / interconnection facility record."
    side_effects: ["persist Substation in SITE_CIVIL"]
  - method: GET
    path: /solar/substations/{id}
    roles: *all_read
    input: []
    output: Substation
    description: "Read one substation."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/substations
    roles: *all_read
    input: ["status?"]
    output: Substation[]
    description: "Substations of a project."
    side_effects: []
  - method: POST
    path: /solar/substations/{substation_id}/status-advances
    roles: [UtilityCoordinator]
    input: [to_status, utility_witness_ref]
    output: Substation
    description: "Advance construction one step. Steps may not be skipped; ENERGIZED additionally requires an APPROVED BACKFEED outage window whose closed interval contains the current logical clock."
    side_effects: ["store utility_witness_ref and set status = to_status", "on ENERGIZED set energized_at and energizing_outage_window_id and transition that OutageWindow APPROVED -> EXECUTED, incrementing its version by 1", "increment Substation.version by 1"]
  - method: POST
    path: /solar/substations/{substation_id}/outage-windows
    roles: [UtilityCoordinator]
    input: [start_at, end_at, purpose]
    output: OutageWindow
    description: "Request a utility switching outage. Guarded by calculations.outage_window_conflict_check (closed intervals padded by OUTAGE_SWITCHING_BUFFER_MINUTES on both sides)."
    side_effects: ["persist OutageWindow in REQUESTED"]
  - method: GET
    path: /solar/substations/{id}/outage-windows
    roles: *all_read
    input: ["status?", "purpose?"]
    output: OutageWindow[]
    description: "Outage windows of a substation."
    side_effects: []
  - method: GET
    path: /solar/outage-windows/{id}
    roles: *all_read
    input: []
    output: OutageWindow
    description: "Read one outage window."
    side_effects: []
  - method: POST
    path: /solar/outage-windows/{window_id}/utility-response
    roles: [UtilityCoordinator]
    input: [decision, utility_reference]
    output: OutageWindow
    description: "Record the utility's APPROVE or DENY response. A DENIED window releases the feeder and no longer collides with new requests."
    side_effects: ["set status = APPROVED or DENIED, store utility_reference and responded_at", "increment OutageWindow.version by 1"]

  # --- Commissioning ------------------------------------------------------
  - method: POST
    path: /solar/commissioning-tests
    roles: [CommissioningEngineer]
    input: [project_id, test_type, scheduled_at, expected_project_version, "correction_variant?"]
    output: CommissioningTest
    description: "Schedule a capacity or performance-ratio test. Guarded by concurrency_rules.commissioning-test-create-stale-project; any earlier live or failed test of the same test_type on the project is voided as SUPERSEDED_BY_NEW_TEST."
    side_effects: ["persist CommissioningTest in SCHEDULED", "void earlier same-type tests, setting void_reason and superseded and incrementing each of their versions by 1", "increment Project.version by 1"]
  - method: GET
    path: /solar/commissioning-tests/{id}
    roles: *all_read
    input: []
    output: CommissioningTest
    description: "Read one commissioning test, including interval counters and the finalized result."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/commissioning-tests
    roles: *all_read
    input: ["test_type?", "status?"]
    output: CommissioningTest[]
    description: "Commissioning tests of a project."
    side_effects: []
  - method: POST
    path: /solar/commissioning-tests/{test_id}/intervals
    roles: [CommissioningEngineer]
    input: [sampled_at, irradiance_w_m2, measured_kw_ac, ambient_c, wind_m_s]
    output: TestInterval
    description: "Append an immutable measurement interval. Validity and corrected_kw_ac are computed at append time from the pinned weather filters and correction formula."
    side_effects: ["persist the immutable TestInterval", "increment interval_count and, when valid, valid_interval_count; move a SCHEDULED test to IN_PROGRESS", "increment CommissioningTest.version by 1"]
  - method: GET
    path: /solar/commissioning-tests/{id}/intervals
    roles: *all_read
    input: ["is_valid?"]
    output: TestInterval[]
    description: "Measurement intervals of a test in created_at ASC order."
    side_effects: []
  - method: POST
    path: /solar/commissioning-tests/{test_id}/finalization
    roles: [CommissioningEngineer]
    input: ["note?"]
    output: CommissioningTest
    description: "Finalize the test. Requires status == IN_PROGRESS, at least one valid interval and an ENERGIZED substation on the project; applies calculations.capacity_test_result (under the test's correction_variant) or calculations.performance_ratio_result."
    side_effects: ["store reported_kw_ac / pass_threshold_kw_ac / reported_performance_ratio and finalized_at", "set status = PASSED or FAILED", "increment CommissioningTest.version by 1"]

  # --- Punch list ---------------------------------------------------------
  - method: POST
    path: /solar/projects/{project_id}/punch-list-items
    roles: [OwnerEngineer]
    input: [title, category, severity, estimated_cost_cents, "block_id?"]
    output: PunchListItem
    description: "Raise a punch list item, optionally against a block of the same project."
    side_effects: ["persist PunchListItem in OPEN", "increment Project.open_punch_item_count and, for CRITICAL, open_critical_punch_count; increment Project.version by 1"]
  - method: GET
    path: /solar/punch-list-items/{id}
    roles: *all_read
    input: []
    output: PunchListItem
    description: "Read one punch list item, including rejection_count and the submitter / decider user ids."
    side_effects: []
  - method: GET
    path: /solar/punch-list-items
    roles: *all_read
    input: ["project_id?", "block_id?", "status?", "severity?", "limit?", "offset?"]
    output: PunchListItem[]
    description: "Filtered punch list."
    side_effects: []
  - method: POST
    path: /solar/punch-list-items/{item_id}/closure-submissions
    roles: [InstallationForeman]
    input: [closure_evidence_ref]
    output: PunchListItem
    description: "Submit closure evidence for an OPEN item; records submitted_by_user_id from X-User-ID."
    side_effects: ["set status = CLOSURE_SUBMITTED, store closure_evidence_ref and submitted_by_user_id", "increment PunchListItem.version by 1"]
  - method: POST
    path: /solar/punch-list-items/{item_id}/closure-decisions
    roles: [OwnerEngineer]
    input: [decision, "note?"]
    output: PunchListItem
    description: "Owner decision APPROVE, REJECT or WAIVE on a submitted closure. Segregation of duties: the decider may not be submitted_by_user_id. REJECT returns the item to OPEN and increments rejection_count."
    side_effects: ["set status = CLOSED, WAIVED or OPEN and store decided_by_user_id", "on CLOSED / WAIVED recompute Project.open_punch_item_count and open_critical_punch_count and increment Project.version by 1", "increment PunchListItem.version by 1"]

  # --- Certified payroll and labor compliance -----------------------------
  - method: POST
    path: /solar/projects/{project_id}/payroll-weeks
    roles: [LaborComplianceOfficer]
    input: [week_start_date]
    output: PayrollWeek
    description: "Open a certified-payroll week for the project."
    side_effects: ["persist PayrollWeek in OPEN with a zeroed hour ledger"]
  - method: GET
    path: /solar/payroll-weeks/{id}
    roles: *all_read
    input: []
    output: PayrollWeek
    description: "Read one payroll week, including the conserved hour ledger."
    side_effects: []
  - method: GET
    path: /solar/projects/{id}/payroll-weeks
    roles: *all_read
    input: ["status?"]
    output: PayrollWeek[]
    description: "Payroll weeks of a project in week_start_date ASC order."
    side_effects: []
  - method: POST
    path: /solar/payroll-weeks/{week_id}/labor-entries
    roles: [LaborComplianceOfficer]
    input: [worker_ref, classification, is_apprentice, hours, paid_rate_cents, fringe_rate_cents, prevailing_rate_cents, work_date]
    output: LaborEntry
    description: "Post a certified-payroll line. The week must be OPEN; when Project.prevailing_wage_election == STRICT an under-prevailing line is refused instead of accruing restitution."
    side_effects: ["persist LaborEntry in POSTED with shortfall_cents_per_hour and restitution_cents", "recompute the week hour ledger and apprentice_pct and increment PayrollWeek.version by 1", "recompute Project.total_labor_hours and apprentice_labor_hours and increment Project.version by 1"]
  - method: GET
    path: /solar/payroll-weeks/{id}/labor-entries
    roles: *all_read
    input: ["status?", "is_apprentice?"]
    output: LaborEntry[]
    description: "Labor entries of a week in (work_date ASC, created_at ASC) order."
    side_effects: []
  - method: GET
    path: /solar/labor-entries/{id}
    roles: *all_read
    input: []
    output: LaborEntry
    description: "Read one labor entry."
    side_effects: []
  - method: POST
    path: /solar/labor-entries/{entry_id}/void
    roles: [LaborComplianceOfficer]
    input: [void_reason]
    output: LaborEntry
    description: "Void a posted line while its week is still OPEN; the compensating action of calculations.payroll_hour_ledger."
    side_effects: ["set status = VOIDED, store void_reason, zero restitution_cents", "recompute the week hour ledger and increment PayrollWeek.version by 1", "recompute the project hour totals and increment Project.version by 1", "increment LaborEntry.version by 1"]
  - method: POST
    path: /solar/payroll-weeks/{week_id}/certification
    roles: [LaborComplianceOfficer]
    input: ["note?"]
    output: PayrollWeek
    description: "Certify the payroll week, locking it against further posts and voids. Segregation of duties: the certifier may not have posted any POSTED entry of the week."
    side_effects: ["set status = CERTIFIED, store certified_by_user_id and certified_at", "increment PayrollWeek.version by 1"]

  # --- Test-driving -------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: *all_read
    input: [now]
    output: { now: string }
    description: "Test-driving endpoint: set the logical UTC clock used by every timestamp, blackout, outage-window containment and delay-day computation. The clock defaults to 2026-08-01T00:00:00Z when it has never been set."
    side_effects: ["replace the logical clock instant; no business entity is modified"]

# ---------------------------------------------------------------------------
# §1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, message: "Missing or unknown X-User-Role / X-User-ID header", trigger: "validations priority 1" }
  - { error_id: ERR_FORBIDDEN_ROLE, http_status: 403, message: "Role may not perform this operation", trigger: "validations priority 2" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "Acting user may not both submit and decide this item", trigger: "validations priority 9" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, message: "Malformed or missing field, unknown field, or value outside its declared constraint", trigger: "validations priority 3" }
  - { error_id: ERR_INVALID_WINDOW_BOUNDS, http_status: 400, message: "Interval start must be strictly before interval end", trigger: "validations priority 4" }
  - { error_id: ERR_PROJECT_NOT_FOUND, http_status: 404, message: "Project does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_GRADING_AREA_NOT_FOUND, http_status: 404, message: "Grading area does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_YARD_ZONE_NOT_FOUND, http_status: 404, message: "Yard zone does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_DELIVERY_NOT_FOUND, http_status: 404, message: "Delivery does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_BLOCK_NOT_FOUND, http_status: 404, message: "Block does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_PILE_NOT_FOUND, http_status: 404, message: "Pile does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_STRING_CIRCUIT_NOT_FOUND, http_status: 404, message: "String circuit does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_SUBSTATION_NOT_FOUND, http_status: 404, message: "Substation does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_OUTAGE_WINDOW_NOT_FOUND, http_status: 404, message: "Outage window does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_COMMISSIONING_TEST_NOT_FOUND, http_status: 404, message: "Commissioning test does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_PUNCH_ITEM_NOT_FOUND, http_status: 404, message: "Punch list item does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_PAYROLL_WEEK_NOT_FOUND, http_status: 404, message: "Payroll week does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_LABOR_ENTRY_NOT_FOUND, http_status: 404, message: "Labor entry does not exist", trigger: "validations priority 5" }
  - { error_id: ERR_CROSS_PROJECT_REFERENCE, http_status: 422, message: "Referenced resource belongs to a different project", trigger: "validations priority 6" }
  - { error_id: ERR_STALE_YARD_ZONE_VERSION, http_status: 412, message: "expected_yard_zone_version does not match the current yard zone version", trigger: "concurrency_rules.delivery-create-stale-yard-zone" }
  - { error_id: ERR_STALE_PROJECT_VERSION, http_status: 412, message: "expected_project_version does not match the current project version", trigger: "concurrency_rules.commissioning-test-create-stale-project" }
  - { error_id: ERR_GRADING_AREA_NOT_OPEN_FOR_WORK, http_status: 409, message: "Grading area is not in a state that accepts this civil operation", trigger: "validations priority 8" }
  - { error_id: ERR_DELIVERY_NOT_RESERVED, http_status: 409, message: "Delivery is no longer in RESERVED", trigger: "validations priority 8" }
  - { error_id: ERR_PILE_NOT_DRIVEABLE, http_status: 409, message: "Pile already has a drive result", trigger: "validations priority 8" }
  - { error_id: ERR_PILE_NOT_REMEDIABLE, http_status: 409, message: "Pile is not OUT_OF_TOLERANCE or REFUSED", trigger: "validations priority 8" }
  - { error_id: ERR_BLOCK_PILES_INCOMPLETE, http_status: 409, message: "Block piles are not complete", trigger: "validations priority 8" }
  - { error_id: ERR_CIRCUIT_STATE_INVALID, http_status: 409, message: "String circuit is not in a state that accepts this operation", trigger: "validations priority 8" }
  - { error_id: ERR_SUBSTATION_STEP_NOT_SEQUENTIAL, http_status: 409, message: "Substation construction steps may not be skipped or repeated", trigger: "validations priority 8" }
  - { error_id: ERR_OUTAGE_WINDOW_ALREADY_ANSWERED, http_status: 409, message: "Outage window already has a utility response", trigger: "validations priority 8" }
  - { error_id: ERR_TEST_STATE_INVALID, http_status: 409, message: "Commissioning test is not in a state that accepts this operation", trigger: "validations priority 8" }
  - { error_id: ERR_PUNCH_ITEM_STATE_INVALID, http_status: 409, message: "Punch list item is not in a state that accepts this operation", trigger: "validations priority 8" }
  - { error_id: ERR_PAYROLL_WEEK_LOCKED, http_status: 409, message: "Payroll week is certified and locked", trigger: "validations priority 8" }
  - { error_id: ERR_LABOR_ENTRY_ALREADY_VOIDED, http_status: 409, message: "Labor entry is already voided", trigger: "validations priority 8" }
  - { error_id: ERR_MILESTONE_OUT_OF_SEQUENCE, http_status: 409, message: "Milestone claim or decision is out of sequence", trigger: "validations priority 8" }
  - { error_id: ERR_GRADING_AREA_NOT_ACCEPTED, http_status: 409, message: "Owning grading area has not been accepted", trigger: "validations priority 10" }
  - { error_id: ERR_BLOCK_NOT_MECHANICALLY_COMPLETE, http_status: 409, message: "Owning block is not mechanically complete", trigger: "validations priority 10" }
  - { error_id: ERR_SUBSTATION_NOT_ENERGIZED, http_status: 422, message: "No substation of this project is energized", trigger: "validations priority 10" }
  - { error_id: ERR_PERMIT_NOT_ACTIVE, http_status: 422, message: "Stormwater permit coverage is not active or a BMP deficiency is open", trigger: "validations priority 11" }
  - { error_id: ERR_RAIN_EVENT_BLACKOUT, http_status: 422, message: "Earthwork is blacked out following a qualifying rain event", trigger: "validations priority 12" }
  - { error_id: ERR_BMP_INSPECTION_OVERDUE, http_status: 422, message: "Best-management-practice inspection is overdue for this area", trigger: "validations priority 13" }
