          setup: ["Empty store; only the logical clock is pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
          trigger:
