  # ------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_submit_gated_by_requisition_open
        grounds:
          - state_machines.Offer.DRAFT_to_PENDING_APPROVAL
          - state_machines.Requisition.OPEN_to_PAUSED
          - errors[ERR_REQUISITION_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Offer -> Requisition: the offer's submit transition is
          legal exactly when its parent requisition is OPEN; the same offer
          submits successfully after RESUME, proving the gate is on live
          cross-entity state, not on offer-local data.
        test_recipe:
          setup:
            - "Requisition (standard range, budget 50000000, headcount 1) OPEN; three L5/T1 peers; offer base 18000000 pct 0 in DRAFT"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand U", email: "cand.u@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
