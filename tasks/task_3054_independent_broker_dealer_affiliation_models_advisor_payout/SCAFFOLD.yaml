    input: []
    output: RevenueEntry
    side_effects: ["status=RELEASED", "the advisor's trailing-12-month production is recomputed"]

  - method: POST
    path: "/payout-periods"
    description: "Open a payout period for a branch; five periods are allowed per calendar month"
    roles: [BranchManager, PlatformAdmin]
    code: 201
    input: [branch_code, year, month, period_index]
    output: PayoutPeriod
    side_effects: ["state=OPEN", "status=OPEN", "Branch.current_payout_period_id points at the new period", "increments Branch.version by 1"]

  - method: GET
    path: "/payout-periods"
    description: "List payout periods"
    roles: [BranchManager, AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["branch_code?", "state?", "limit?", "offset?"]
    output: PayoutPeriod[]
    side_effects: []

  - method: GET
    path: "/payout-periods/{id}"
    description: "Get a payout period"
    roles: [BranchManager, AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PayoutPeriod
    side_effects: []

  - method: POST
    path: "/payout-periods/{id}/state"
    description: "Advance a payout period through CLOSED, PAID, REOPENED and VOID; posting releases the period's lines and amortizes the advisors' loans"
    roles: [BranchManager, ComplianceOfficer]
    code: 200
    input: [to_state, expected_branch_version]
    output: PayoutPeriod
    side_effects:
      - "CLOSED -> PAID releases every DRAFT line at its provisional rate, posts pass-through rows and advisory splits, and amortizes active loans"
      - "PAID -> REOPENED reverses the true-ups, the loan amortization entries and the pass-through postings"
      - "CLOSED -> VOID voids every DRAFT line"
      - "increments Branch.version by 1"

  - method: POST
    path: "/payout-periods/{id}/true-up"
    description: "Recompute a released payout line on the advisor's cumulative year production and apply the signed difference"
    roles: [BranchManager, AdvisorOps]
    code: 200
    input: [expected_branch_version]
    output: PayoutPeriod
    side_effects:
      - "line.true_up_amount_cents is the signed final-minus-provisional income difference"
      - "a negative true-up is posted as a signed LoanAmortizationEntry and raises the advisor's outstanding loan balance"
      - "period.true_up_amount_cents and period.period_payout_cents are recomputed"
      - "increments Branch.version by 1"

  - method: POST
    path: "/payout-periods/{id}/net-settlement"
    description: "Compute the net settlement for one advisor in the period, applying the pass-through and errors-and-omissions waterfalls"
    roles: [BranchManager, AdvisorOps]
    code: 200
    input: [advisor_code]
    output:
      net_settlement_cents: integer
      pass_through_cents: integer
      eo_charge_cents: integer
      supervisory_override_cents: integer
    side_effects: ["the advisor's ExpensePassThrough rows for the period are pinned to their computed amounts"]

  - method: GET
    path: "/payout-periods/{id}/payout-lines"
    description: "List the payout lines of a period (FK reverse-reachability for AdvisorPayoutLine.payout_period_id)"
    roles: [BranchManager, AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AdvisorPayoutLine[]
    side_effects: []

  - method: GET
    path: "/payout-periods/{id}/expense-pass-throughs"
    description: "List the expense pass-through rows of a period (FK reverse-reachability for ExpensePassThrough.payout_period_id)"
    roles: [BranchManager, AdvisorOps, ComplianceOfficer]
    code: 200
    input: []
    output: ExpensePassThrough[]
    side_effects: []

  - method: POST
    path: "/payout-loans"
    description: "Create a transition assistance loan against an advisor's future production"
    roles: [AdvisorOps, PlatformAdmin]
    code: 201
    input: [advisor_code, principal_cents, amortization_rate_bps, forgiveness_milestone_pct]
    output: PayoutLoan
    side_effects: ["status=REQUESTED", "remaining_balance_cents=principal_cents"]

  - method: GET
    path: "/payout-loans"
    description: "List transition assistance loans"
    roles: [AdvisorOps, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["advisor_code?", "status?", "limit?", "offset?"]
    output: PayoutLoan[]
    side_effects: []

  - method: GET
    path: "/payout-loans/{id}"
    description: "Get a transition assistance loan"
    roles: [AdvisorOps, PlatformAdmin, ComplianceOfficer, BranchManager]
    code: 200
    input: []
    output: PayoutLoan
    side_effects: []

  - method: GET
    path: "/payout-loans/{id}/amortization-entries"
    description: "List the amortization entries of a loan (FK reverse-reachability for LoanAmortizationEntry.payout_loan_id)"
    roles: [AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LoanAmortizationEntry[]
    side_effects: []

  - method: GET
    path: "/payout-loans/{id}/forgiveness-audit"
    description: "Supervisory audit export for a loan: surfaces the configured forgiveness milestone percentage, the milestone threshold and the trailing-12-month gross commission sum the milestone is measured against"
    roles: [AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output:
      loan_id: string
      principal_cents: integer
      remaining_balance_cents: integer
      milestone_progress_cents: integer
      milestone_threshold_cents: integer
      configured_forgiveness_milestone_pct: integer
      gross_commission_sum_cents: integer
      milestone_matured: boolean
      status: string
    side_effects: []

  - method: GET
    path: "/payout-loans/{id}/amortization-schedule"
    description: "Amortization schedule projection for a loan: posted amortization total, forgiveness applied and the residual balance"
    roles: [AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output:
      amortization_total_cents: integer
      milestone_forgiveness_applied_cents: integer
      remaining_balance_cents: integer
    side_effects: []

  - method: POST
    path: "/payout-loans/{id}/amortize"
    description: "Post the period's amortization draw against a loan"
    roles: [AdvisorOps, BranchManager]
    code: 200
    input: [payout_period_id]
    output: PayoutLoan
    side_effects:
      - "a LoanAmortizationEntry is POSTED with the draw amount"
      - "remaining_balance_cents is reduced"
      - "status=AMORTIZING"
      - "recomputes the advisor's outstanding_loan_balance_cents" # informational: the advisor's version is NOT bumped by an amortization draw

  - method: POST
    path: "/payout-loans/{id}/forgive"
    description: "Book the forgiveness milestone against a loan when production has matured"
    roles: [AdvisorOps, PlatformAdmin]
    code: 200
    input: [expected_advisor_version]
    output: PayoutLoan
    side_effects:
      - "a LoanAmortizationEntry is POSTED with the forgiveness amount"
      - "remaining_balance_cents is reduced"
      - "status=FORGIVEN"

  - method: GET
    path: "/loan-amortization-entries"
    description: "List loan amortization entries"
    roles: [AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["payout_loan_id?", "payout_period_id?", "limit?", "offset?"]
    output: LoanAmortizationEntry[]
    side_effects: []

  - method: GET
    path: "/loan-amortization-entries/{id}"
    description: "Get a loan amortization entry"
    roles: [AdvisorOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LoanAmortizationEntry
    side_effects: []

  - method: POST
    path: "/expense-pass-throughs"
    description: "Raise an expense pass-through line for an advisor in a period: technology, clearing, errors-and-omissions or regulatory"
    roles: [AdvisorOps, BranchManager]
    code: 201
    input: [advisor_code, payout_period_id, category, billing_model]
    output: ExpensePassThrough
    side_effects: ["status=PENDING", "amount_cents is derived when the period is posted"]

  - method: GET
    path: "/expense-pass-throughs"
    description: "List expense pass-through rows"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["advisor_code?", "payout_period_id?", "category?", "limit?", "offset?"]
    output: ExpensePassThrough[]
    side_effects: []

  - method: GET
    path: "/expense-pass-throughs/{id}"
    description: "Get an expense pass-through row"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ExpensePassThrough
    side_effects: []

  - method: POST
    path: "/expense-pass-throughs/{id}/state"
    description: "Waive or settle an expense pass-through row"
    roles: [BranchManager, AdvisorOps]
    code: 200
    input: [to_status]
    output: ExpensePassThrough
    side_effects: ["PENDING -> POSTED pins amount_cents; PENDING -> WAIVED excludes the row from the settlement waterfall"]

  - method: POST
    path: "/advisory-splits/levelize"
    description: "Run the advisory fee levelization sweep for one advisor's accounts in a period"
    roles: [AdvisorOps, BranchManager]
    code: 200
    input: [advisor_code, payout_period_id]
    output: AdvisoryRevenueSplit[]
    side_effects:
      - "an AdvisoryRevenueSplit row is created per eligible advisory account with status POSTED"
      - "each account's base_annual_fee_cents, rafee_effective_bps and fee_levelized are stamped, and annual_fee_cents is rewritten to the levelized fee, so levelized accounts are not swept twice in a calendar year"
      - "when every eligible advisory account of the advisor is already levelized the sweep is rejected with ERR_YEAR_ALREADY_LEVELIZED"

  - method: GET
    path: "/advisory-splits"
    description: "List advisory revenue splits"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "payout_period_id?", "status?", "limit?", "offset?"]
    output: AdvisoryRevenueSplit[]
    side_effects: []

  - method: GET
    path: "/advisory-splits/{id}"
    description: "Get an advisory revenue split"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AdvisoryRevenueSplit
    side_effects: []

  - method: POST
    path: "/transitions"
    description: "Open a transition record for a departing advisor and register the account retention contest"
    roles: [AdvisorOps, BranchManager]
    code: 201
    input: [advisor_code, payout_period_id, expected_advisor_version]
    output: TransitionRecord
    side_effects:
      - "status=CONTESTED when advisor.status == DEPARTING and the advisor has at least one account in FROZEN, PENDING_TRANSFER or RETENTION_CONTESTED, otherwise PENDING"
      - "accounts_in_contest_count is derived from the frozen book"
      - "advisor.retention_status=CONTESTED"

  - method: GET
    path: "/transitions"
    description: "List transition records"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["advisor_code?", "payout_period_id?", "status?", "limit?", "offset?"]
    output: TransitionRecord[]
    side_effects: []

  - method: GET
    path: "/transitions/{id}"
    description: "Get a transition record"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TransitionRecord
    side_effects: []

  - method: GET
    path: "/transitions/{id}/retention-rows"
    description: "List the account retention rows of a transition (FK reverse-reachability for AccountRetention.transition_record_id)"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer]
    code: 200
    input: []
    output: AccountRetention[]
    side_effects: []

  - method: POST
    path: "/transitions/{id}/retention/contest"
    description: "Contest one account onto a transition, granting a retention credit"
    roles: [BranchManager]
    code: 201
    input: [account_id, retention_rate_bps]
    output: AccountRetention
    side_effects:
      - "status=POSTED"
      - "credit_amount_cents is clipped by the book retention credit cap"
      - "the account -> RETENTION_CONTESTED"
      - "recomputes the transition's account counts and settled_amount_cents"

  - method: POST
    path: "/transitions/{id}/retention/settle"
    description: "Close the retention contest; the submitted account_ids_retained are the accounts the firm kept, and the retention ratio is measured from that list"
    roles: [BranchManager]
    code: 200
    input: [account_ids_retained, expected_advisor_version]
    output: TransitionRecord
    side_effects:
      - "status=SETTLED"
      - "POSTED retention rows of the submitted accounts -> RETAINED and those accounts -> RETAINED"
      - "POSTED retention rows of every other contested account -> LOST and those accounts -> PENDING_TRANSFER"
      - "every frozen account of the advisor -> OPEN"
      - "accounts_retained_count is set from the submitted list"

  - method: POST
    path: "/transitions/{id}/retention/lose"
    description: "Close the retention contest against the firm; the submitted account_ids_lost are the accounts the firm lost and the rest are retained"
    roles: [BranchManager]
    code: 200
    input: [account_ids_lost, expected_advisor_version]
    output: TransitionRecord
    side_effects:
      - "status=SETTLED"
      - "POSTED retention rows of the submitted accounts -> LOST and those accounts -> PENDING_TRANSFER with pending_transfer_at stamped"
      - "POSTED retention rows of every other contested account -> RETAINED and those accounts -> RETAINED"
      - "accounts_retained_count is set to accounts_in_contest_count minus the submitted list"

  - method: GET
    path: "/account-retentions"
    description: "List account retention rows"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["transition_record_id?", "account_id?", "status?", "limit?", "offset?"]
    output: AccountRetention[]
    side_effects: []

  - method: GET
    path: "/account-retentions/{id}"
    description: "Get an account retention row"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AccountRetention
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, unknown field, or a declared input field missing from the request"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the operation, or an entity-backed actor is acting on another advisor's resource"
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "branch_code does not resolve to a branch"
  - id: ERR_ADVISOR_NOT_FOUND
    http: 404
    condition: "advisor_code does not resolve to an advisor"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a server-minted id path segment does not resolve to a resource of the expected type"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version"
  - id: ERR_CLOCK_NOT_SET
    http: 409
    condition: "a window-sensitive operation runs before the logical clock has been set"
  - id: ERR_PERIOD_ALREADY_EXISTS
    http: 409
    condition: "a payout period already exists for the same branch, year, month and period_index"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "the advisor's branch still has an OPEN or REOPENED payout period, or the addressed period is not in a state that allows true-up"
  - id: ERR_PERIOD_HAS_NO_RELEASED_PRODUCTION
    http: 409
    condition: "closing a period that has no RELEASED revenue entry in its calendar month"
  - id: ERR_PERIOD_HAS_DRAFT_ENTRIES
    http: 409
    condition: "posting a period while a revenue entry in its calendar month is still DRAFT"
  - id: ERR_PERIOD_ALREADY_POSTED
    http: 409
    condition: "voiding a period whose lines are already released, or contesting a retention while the period is already PAID or VOID"
  - id: ERR_PERIOD_PROVISIONAL_BASIS_MISMATCH
    http: 409
    condition: "the line's provisional base rate does not match the grid base rate for its projected basis, or true-up is attempted on a period that is not CLOSED, PAID or REOPENED"
  - id: ERR_EO_COVERAGE_INSUFFICIENT
    http: 403
    condition: "the advisor's errors-and-omissions coverage is LIMITED, or the branch's office of supervisory jurisdiction is not active"
  - id: ERR_BOOK_PORTABILITY_BELOW_MINIMUM
    http: 422
    condition: "book_portability_pct is below the threshold the operation requires"
  - id: ERR_PORTABILITY_PROTOCOL_FAILURE
    http: 403
    condition: "the advisor is not a protocol signatory and the portability ratio is below the non-protocol threshold"
  - id: ERR_LOAN_BALANCE_OUTSTANDING
    http: 409
    condition: "the advisor's transition assistance loan balance is not zero"
  - id: ERR_NO_TRANSITION_LOAN
    http: 409
    condition: "enrollment is attempted for an advisor with no transition assistance loan on file"
  - id: ERR_BRANCH_NOT_ACTIVE
    http: 409
    condition: "the advisor's primary branch is not ACTIVE"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the resource is not in the from-state the requested transition requires, or a child row is still pending"
  - id: ERR_FROZEN_ACCOUNTS_REMAIN
    http: 409
    condition: "an aggregate is settled while a child row is still pending: a frozen account survives a reinstatement, or a retention row is still PENDING"
  - id: ERR_TRANSITION_ALREADY_SETTLED
    http: 409
    condition: "reinstatement is attempted after the transition has already SETTLED"
  - id: ERR_TRANSITION_NOT_SETTLED
    http: 409
    condition: "departure settlement is attempted before the transition has SETTLED"
  - id: ERR_TRANSITION_NOT_CONTESTED
    http: 409
    condition: "an account is contested onto a transition that is not CONTESTED"
  - id: ERR_RETENTION_TARGET_MET
    http: 409
    condition: "the retention ratio has already reached the target, so the contest cannot be lost"
  - id: ERR_RETENTION_TARGET_MISSED
    http: 409
    condition: "the retention ratio is below the target and the contest cannot be settled as retained"
  - id: ERR_RETENTION_CREDIT_EXHAUSTED
    http: 409
    condition: "the book retention credit cap is fully consumed and no further account can be contested"
  - id: ERR_TRANSFER_HOLD_PERIOD
    http: 409
    condition: "a book transfer is confirmed before the supervisory hold period has elapsed"
  - id: ERR_YEAR_ALREADY_LEVELIZED
    http: 409
    condition: "every eligible advisory account of the advisor has already been levelized in this calendar year"
  - id: ERR_RATE_FLOOR_APPLIED
    http: 422
    condition: "the computed grid rate falls below the floor and is clamped, so the rate the client asked for is not achievable"
  - id: ERR_PAYOUT_CAP_REACHED
    http: 409
    condition: "a new payout line is opened for an advisor whose cumulative released payout has already reached the annual gross payout cap (the cap flags the payout; it does not truncate an already-released line)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Firm-level operator that onboards branches and advisors, extends transition assistance loans, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /branches"
      - "PATCH /branches/{id}"
      - "POST /_clock/set_current_utc"
      - "POST /payout-loans/{id}/forgive"
    shared_operations:
      - "POST /advisors"
      - "GET /branches"
      - "GET /advisors"
      - "POST /payout-loans"
      - "GET /payout-loans"
      - "POST /branch-supervisor-enrollments"

  - name: AdvisorOps
    description: "Advisor services team acting as a specific advisor for advisor-scoped operations; owns enrollment, affiliation and payouts"
    identity: entity_backed:Advisor
    exclusive_operations:
      - "POST /advisors/{id}/enrollment"
      - "POST /advisors/{id}/affiliation"
      - "POST /advisors/{id}/departure"
      - "POST /advisors/{id}/departure/reinstate"
      - "POST /advisors/{id}/book-transfer"
    shared_operations:
      - "POST /advisor-links"
      - "POST /accounts"
      - "POST /revenue-entries"
      - "POST /expense-pass-throughs"
      - "POST /advisory-splits/levelize"
      - "POST /transitions"
      - "POST /advisors/{id}/payout-lines"
      - "POST /payout-loans"
      - "POST /payout-loans/{id}/amortize"
      - "POST /advisor-payout-lines/{id}/settlement"

  - name: BranchManager
    description: "Supervising branch principal who runs payout periods and the retention contest"
    identity: opaque
    exclusive_operations:
      - "POST /payout-periods"
      - "POST /payout-periods/{id}/true-up"
      - "POST /payout-periods/{id}/net-settlement"
      - "POST /transitions/{id}/retention/contest"
      - "POST /transitions/{id}/retention/settle"
      - "POST /transitions/{id}/retention/lose"
      - "POST /expense-pass-throughs/{id}/state"
    shared_operations:
      - "POST /payout-periods/{id}/state"
      - "POST /advisor-links"
      - "POST /accounts"
      - "POST /revenue-entries"
      - "POST /advisors/{id}/payout-lines"
      - "POST /transitions"
      - "POST /advisory-splits/levelize"

  - name: ComplianceOfficer
    description: "Supervision and surveillance role that owns suspensions, reopenings, transfer confirmations and departure settlement"
    identity: opaque
    exclusive_operations:
      - "POST /advisors/{id}/state"
      - "POST /advisors/{id}/departure/settle"
      - "POST /accounts/{id}/transfer/confirm"
    shared_operations:
      - "POST /payout-periods/{id}/state"
      - "GET /advisors"
      - "GET /accounts"
      - "GET /revenue-entries"
      - "GET /payout-periods"
      - "GET /transitions"
      - "GET /account-retentions"
      - "GET /payout-loans/{id}/forgiveness-audit"