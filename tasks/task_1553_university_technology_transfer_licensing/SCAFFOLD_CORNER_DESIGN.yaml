      - call: POST /tlo/disclosure-entries/${entry_id}/confirm
        payload: {}
        as: Inventor
        as_user_id: ${inv_id}
      - call: GET /tlo/disclosures/${disc_id}
        payload: {}
        as: Any
        captures:
          disc_v: $.data.version
      - call: POST /tlo/disclosures/${disc_id}/inventorship/finalize
        payload:
          expected_disclosure_version: ${disc_v}
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/assessment
        payload:
          patentability_rating: HIGH
          market_rating: HIGH
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: PURSUE_PATENT
        as: TechTransferOfficer
      - call: POST /tlo/disclosures/${disc_id}/licenses
        payload:
          licensee_name: Alpha
          exclusivity: NON_EXCLUSIVE
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2026-12-31T00:00:00Z'
          royalty_rate_bp: 500
          minimum_annual_royalty_cents: 0
          upfront_fee_cents: 0
        as: LicensingManager
        captures:
          l1: $.data.id
          l1_v: $.data.version
      - call: POST /tlo/licenses/${l1}/execute
        payload:
          expected_license_version: ${l1_v}
        as: LicensingManager
      - call: POST /tlo/disclosures/${disc_id}/licenses
        payload:
          licensee_name: Beta
          exclusivity: NON_EXCLUSIVE
          effective_date: '2027-01-01T00:00:00Z'
          expiration_date: '2027-06-30T00:00:00Z'
          royalty_rate_bp: 500
          minimum_annual_royalty_cents: 0
          upfront_fee_cents: 0
        as: LicensingManager
        captures:
          l2: $.data.id
          l2_v: $.data.version
      - call: POST /tlo/licenses/${l2}/execute
        payload:
          expected_license_version: ${l2_v}
        as: LicensingManager
      trigger:
      - call: POST /tlo/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        captures:
