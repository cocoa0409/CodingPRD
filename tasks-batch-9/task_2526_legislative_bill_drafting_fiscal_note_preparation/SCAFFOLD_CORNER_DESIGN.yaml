      - name: sla_due_date_clamps_at_the_ceiling_then_halves_once_for_priority
        claim_type: Correct Result
        grounds:
          - calculations.drafting_sla_due_utc
          - calculations.drafting_complexity_score
        distinguishing_aspect: "A request whose actual_complexity_score is 71 produces raw hours 426, which the ceiling clamps to 240 BEFORE the priority multiplier; 240 * 0.5 = 120 with no deadline-pressure factor (the clock 2026-09-11 has not reached 2026-10-01), so sla_due_utc is exactly 2026-09-16T00:00:00Z — a value below the 24-hour floor would be legal here because the clamp precedes the multipliers."
