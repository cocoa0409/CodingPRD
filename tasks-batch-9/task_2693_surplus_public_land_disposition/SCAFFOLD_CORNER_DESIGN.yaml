        distinguishing_aspect: "The recirculation cycle returns the review to CIRCULATING rather than parking it in RECIRCULATION_REQUIRED: after recirculating a NEGATIVE_DECLARATION review whose first window was [2026-09-01, 2026-10-01] into [2026-10-31, 2026-12-01], status is CIRCULATING again, circulation_round is 2, and circulation_start_on / circulation_end_on are REPLACED by the new window rather than appended - 2026-10-31 is exactly circulation_end_on + RECIRCULATION_BUFFER_DAYS (30), the earliest legal start."
        test_recipe:
          setup:
            - "One custodian Agency, one Parcel and one ADOPTED declaration."
            - "A NEGATIVE_DECLARATION EnvironmentalReview circulating over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z] - a 30-day span, exactly ENV_CIRCULATION_MIN_DAYS."
          setup_api_calls:
