        as: ShowOperations
        as_user_id: ops-1
        captures:
          wh_id: $.data.id
          wh_v: $.data.version
      - call: POST /exhibitors
        payload:
          company_name: Acme Motors
          contact_email: ops@acme.test
          credit_limit_cents: 5000000
        as: ShowOperations
        as_user_id: ops-1
        captures:
          ex_id: $.data.id
