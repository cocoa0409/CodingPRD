# =============================================================================
# §1.8 Scaffold Difficulty Design — Return of Title IV Funds & Withdrawal Processing
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules (§0.5).
# All money figures below were computed by executing the pinned formulas by hand:
#   T1 "Fall 2026": 2026-08-24..2026-12-11 = 110 calendar days; break 2026-11-25..29
#     (5 days, deductible) -> total_days = 105; midpoint day 53 = 2026-10-15;
#     day 63 = 2026-10-25 -> 63/105 = 0.600 exactly; day 64 = 2026-10-26 -> 0.610.
#   T2 "Fall Mini": 2026-09-01..2026-12-09 = 100 days, no breaks -> total_days = 100;
#     midpoint day 50 = 2026-10-20 -> 0.500.
#   Deadlines: determination 2026-10-25 + 45d = 2026-12-09; 2026-09-02 + 45d = 2026-10-17;
#     2026-11-15 + 45d = 2026-12-30. Offered 2026-10-26 + 14d = 2026-11-09.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: official_vs_unofficial_midpoint_withdrawal_basis
        grounds:
          - calculations.withdrawal_date_determination
          - calculations.percentage_completed
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.WithdrawalCase.fields.withdrawal_date
        distinguishing_aspect: |
          Two valid withdrawal-date bases on the WithdrawalCase domain: OFFICIAL uses the
          notification date (2026-10-25, day 63 of 105, 0.600) while UNOFFICIAL on a
          non-attendance term uses the statutory midpoint (2026-10-15, day 53, 0.505) —
          identical aid packages earn 300000 vs 252500 cents.
        test_recipe:
          setup:
            - "Term T1 2026-08-24..2026-12-11 with break 2026-11-25..29 (total_days 105), TIERED, attendance_taking_required=false"
            - "Two students each enrolled with charges 600000, PELL_GRANT 200000 disbursed, SUBSIDIZED_LOAN 300000 accepted and disbursed (aid identical)"
            - "E1 withdrawn OFFICIAL notification_date 2026-10-25; E2 withdrawn UNOFFICIAL (clock 2026-12-01)"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", attendance_taking_required: false, refund_method: "TIERED" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S1", full_name: "Stu One", email: "s1@x.edu" }
              as: RegistrarClerk
              captures: { s1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "S2", full_name: "Stu Two", email: "s2@x.edu" }
              as: RegistrarClerk
              captures: { s2: $.data.id }
            - call: "POST /r2t4/students/${s1}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e1: $.data.id }
            - call: "POST /r2t4/students/${s2}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e2: $.data.id }
            - call: "POST /r2t4/enrollments/${e1}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p1: $.data.id }
            - call: "POST /r2t4/awards/${p1}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d1: $.data.id }
            - call: "POST /r2t4/disbursements/${d1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e1}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { l1: $.data.id }
            - call: "POST /r2t4/awards/${l1}/accept"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /r2t4/awards/${l1}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { d2: $.data.id }
            - call: "POST /r2t4/disbursements/${d2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e2}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p2: $.data.id }
            - call: "POST /r2t4/awards/${p2}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d3: $.data.id }
            - call: "POST /r2t4/disbursements/${d3}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e2}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { l2: $.data.id }
            - call: "POST /r2t4/awards/${l2}/accept"
              payload: {}
              as: Student
              as_user_id: "${s2}"
            - call: "POST /r2t4/awards/${l2}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { d4: $.data.id }
            - call: "POST /r2t4/disbursements/${d4}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/enrollments/${e1}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { c1: $.data.id }
            - call: "POST /r2t4/enrollments/${e2}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL" }
              as: RegistrarClerk
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${c1}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { c1_earned: $.data.aid_earned_cents, c1_wd: $.data.withdrawal_date, c1_pct: $.data.percentage_completed }
            - call: "POST /r2t4/withdrawal-cases/${c2}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { c2_earned: $.data.aid_earned_cents, c2_wd: $.data.withdrawal_date, c2_pct: $.data.percentage_completed }
          assert:
            - "WithdrawalCase.${c1}.withdrawal_date == '2026-10-25' and .percentage_completed == 0.600 and .aid_earned_cents == 300000"
            - "WithdrawalCase.${c2}.withdrawal_date == '2026-10-15' and .percentage_completed == 0.505 and .aid_earned_cents == 252500"
            - "c1_earned != c2_earned (300000 vs 252500) for identical aid packages — the variant, not the money, drives the delta"

      - name: tiered_vs_pro_rata_institutional_refund
        grounds:
          - calculations.institutional_refund
          - entities.AcademicTerm.fields.refund_method
          - entities.StudentAccountEntry.fields.entry_type
        distinguishing_aspect: |
          Different entity domain (StudentAccountEntry ledger, not WithdrawalCase): for the
          same relative withdrawal day (day 11 of a 110-day term) and identical 400000-cent
          charges, TIERED posts a REFUND_CREDIT of -300000 while PRO_RATA posts -360000.
        test_recipe:
          setup:
            - "Term TA TIERED 2027-01-11..2027-04-30 (110 days); term TB PRO_RATA 2027-05-03..2027-08-20 (110 days); terms do not overlap"
            - "Enrollment EA in TA with charges 400000, withdrawn OFFICIAL 2027-01-21 (day 11)"
            - "Enrollment EB in TB with charges 400000, withdrawn OFFICIAL 2027-05-13 (day 11)"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Spring A", start_date: "2027-01-11", end_date: "2027-04-30", refund_method: "TIERED" }
              as: RegistrarClerk
              captures: { ta: $.data.id }
            - call: "POST /r2t4/terms"
              payload: { name: "Summer B", start_date: "2027-05-03", end_date: "2027-08-20", refund_method: "PRO_RATA" }
              as: RegistrarClerk
              captures: { tb: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SA", full_name: "Stu A", email: "sa@x.edu" }
              as: RegistrarClerk
              captures: { sa: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SB", full_name: "Stu B", email: "sb@x.edu" }
              as: RegistrarClerk
              captures: { sb: $.data.id }
            - call: "POST /r2t4/students/${sa}/enrollments"
              payload: { term_id: "${ta}", institutional_charges_cents: 400000 }
              as: RegistrarClerk
              captures: { ea: $.data.id }
            - call: "POST /r2t4/students/${sb}/enrollments"
              payload: { term_id: "${tb}", institutional_charges_cents: 400000 }
              as: RegistrarClerk
              captures: { eb: $.data.id }
            - call: "POST /r2t4/enrollments/${ea}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2027-01-21" }
              as: RegistrarClerk
              captures: { ca: $.data.id }
            - call: "POST /r2t4/enrollments/${eb}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2027-05-13" }
              as: RegistrarClerk
              captures: { cb: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${ca}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "POST /r2t4/withdrawal-cases/${cb}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/account-entries"
              payload: { enrollment_id: "${ea}", entry_type: "REFUND_CREDIT" }
              as: FinancialAidOfficer
              captures: { ra: "$.data[0].amount_cents" }
            - call: "GET /r2t4/account-entries"
              payload: { enrollment_id: "${eb}", entry_type: "REFUND_CREDIT" }
              as: FinancialAidOfficer
              captures: { rb: "$.data[0].amount_cents" }
          assert:
            - "REFUND_CREDIT entry on ${ea} amount_cents == -300000 (TIERED: day 11 falls in through_day 14 tier, 0.75 * 400000)"
            - "REFUND_CREDIT entry on ${eb} amount_cents == -360000 (PRO_RATA: (1 - 0.100) * 400000)"
            - "ra != rb — same relative day, same charges, different refund variant"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: return_split_nested_min_with_grant_protection
        grounds:
          - calculations.return_responsibility_split
          - entities.WithdrawalCase.fields.student_grant_return_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: school share is a nested
          min(charges * unearned_pct, return_amount), then the student share passes through
          a conditional 50% grant-protection rate and a loan-deferral branch; pinned inputs
          yield school 50000, student grant obligation 50000, loan deferred 100000.
        test_recipe:
          setup:
            - "Term T2 2026-09-01..2026-12-09 (100 days, no breaks, attendance_taking_required=false)"
            - "Enrollment charges 100000; PELL_GRANT 200000 disbursed; SUBSIDIZED_LOAN 300000 accepted + disbursed (500000 disbursed total)"
            - "Clock 2026-11-15; withdraw UNOFFICIAL -> midpoint withdrawal_date 2026-10-20, completed 50, pct 0.500"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall Mini", start_date: "2026-09-01", end_date: "2026-12-09", attendance_taking_required: false }
              as: RegistrarClerk
              captures: { t2: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SP", full_name: "Stu P", email: "sp@x.edu" }
              as: RegistrarClerk
              captures: { sp: $.data.id }
            - call: "POST /r2t4/students/${sp}/enrollments"
              payload: { term_id: "${t2}", institutional_charges_cents: 100000 }
              as: RegistrarClerk
              captures: { ep: $.data.id }
            - call: "POST /r2t4/enrollments/${ep}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pp: $.data.id }
            - call: "POST /r2t4/awards/${pp}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dp1: $.data.id }
            - call: "POST /r2t4/disbursements/${dp1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ep}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { lp: $.data.id }
            - call: "POST /r2t4/awards/${lp}/accept"
              payload: {}
              as: Student
              as_user_id: "${sp}"
            - call: "POST /r2t4/awards/${lp}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { dp2: $.data.id }
            - call: "POST /r2t4/disbursements/${dp2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/enrollments/${ep}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL" }
              as: RegistrarClerk
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cp}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${cp}/obligations"
              payload: {}
              as: FinancialAidOfficer
          assert:
            - "WithdrawalCase.${cp}.aid_earned_cents == 250000 (100000 PELL + 150000 SUB) and .aid_unearned_cents == 250000"
            - "WithdrawalCase.${cp}.school_return_cents == 50000 (min(100000 * 0.500, 250000))"
            - "WithdrawalCase.${cp}.student_grant_return_cents == 50000 (min(200000, 100000 grant unearned) * 0.5)"
            - "WithdrawalCase.${cp}.student_loan_deferred_cents == 100000 (student_share 200000 - grant base 100000)"
            - "Exactly 2 obligations: one party == SCHOOL amount_cents == 50000, one party == STUDENT amount_cents == 50000, both due_date == '2026-12-30' (determination 2026-11-15 + 45d)"

      - name: per_award_round_then_sum_order
        grounds:
          - calculations.r2t4_earned_unearned
          - entities.WithdrawalCase.fields.aid_earned_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: round each award to whole cents then sum.
          Two awards of 100001 cents at earned_pct 0.505 yield 50501 + 50501 = 101002;
          the rejected sum-then-round order would yield round(200002 * 0.505) = 101001.
        test_recipe:
          setup:
            - "Term T1 2026-08-24..2026-12-11 with break 2026-11-25..29 (total_days 105, midpoint 2026-10-15 -> 53/105 -> 0.505)"
            - "Enrollment charges 500000; PELL_GRANT 100001 disbursed; SUBSIDIZED_LOAN 100001 accepted + disbursed"
            - "Clock 2026-12-01; withdraw UNOFFICIAL"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11", attendance_taking_required: false }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SR", full_name: "Stu R", email: "sr@x.edu" }
              as: RegistrarClerk
              captures: { sr: $.data.id }
            - call: "POST /r2t4/students/${sr}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 500000 }
              as: RegistrarClerk
              captures: { er: $.data.id }
            - call: "POST /r2t4/enrollments/${er}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 100001 }
              as: FinancialAidOfficer
              captures: { pr: $.data.id }
            - call: "POST /r2t4/awards/${pr}/disbursements"
              payload: { amount_cents: 100001 }
              as: FinancialAidOfficer
              captures: { dr1: $.data.id }
            - call: "POST /r2t4/disbursements/${dr1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${er}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 100001 }
              as: FinancialAidOfficer
              captures: { lr: $.data.id }
            - call: "POST /r2t4/awards/${lr}/accept"
              payload: {}
              as: Student
              as_user_id: "${sr}"
            - call: "POST /r2t4/awards/${lr}/disbursements"
              payload: { amount_cents: 100001 }
              as: FinancialAidOfficer
              captures: { dr2: $.data.id }
            - call: "POST /r2t4/disbursements/${dr2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/enrollments/${er}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL" }
              as: RegistrarClerk
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cr}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
          assert:
            - "WithdrawalCase.${cr}.percentage_completed == 0.505"
            - "WithdrawalCase.${cr}.aid_earned_cents == 101002 (per-award round_half_up(100001 * 0.505) = 50501 twice, then summed)"
            - "WithdrawalCase.${cr}.aid_disbursable_cents == 200002 and .aid_disbursed_cents == 200002"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: withdrawal_case_recalculate_loop_then_autoclose
        grounds:
          - state_machines.WithdrawalCase.CALCULATED_to_CALCULATED
          - state_machines.WithdrawalCase.CALCULATED_to_CLOSED
          - concurrency_rules[case-recalculate-stale-version]
        distinguishing_aspect: |
          WithdrawalCase is non-linear: CALCULATED -> CALCULATED recalculation loop with
          compensation (old obligation VOIDED, chargeback reversed), then a fork whose
          branch (100% earned -> no obligations, no offers) reaches CLOSED by auto-transition.
        test_recipe:
          setup:
            - "Term T1 (105 days); enrollment charges 600000; PELL 200000 + SUB 300000 disbursed (500000)"
            - "Withdraw OFFICIAL 2026-10-25 (pct 0.600); calculate -> SCHOOL obligation 200000, chargeback posted, balance 300000"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SC", full_name: "Stu C", email: "sc@x.edu" }
              as: RegistrarClerk
              captures: { sc: $.data.id }
            - call: "POST /r2t4/students/${sc}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ec: $.data.id }
            - call: "POST /r2t4/enrollments/${ec}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pc: $.data.id }
            - call: "POST /r2t4/awards/${pc}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dc1: $.data.id }
            - call: "POST /r2t4/disbursements/${dc1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ec}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { lc: $.data.id }
            - call: "POST /r2t4/awards/${lc}/accept"
              payload: {}
              as: Student
              as_user_id: "${sc}"
            - call: "POST /r2t4/awards/${lc}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { dc2: $.data.id }
            - call: "POST /r2t4/disbursements/${dc2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ec}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cc: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${cc}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { cc_v: $.data.version }
            - call: "GET /r2t4/withdrawal-cases/${cc}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob_c: "$.data[0].id" }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cc}/recalculate"
              payload: { expected_withdrawal_case_version: "${cc_v}", notification_date: "2026-10-26" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { cc_status: $.data.status, cc_earned: $.data.aid_earned_cents }
            - call: "GET /r2t4/withdrawal-cases/${cc}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob_c_status: "$.data[0].status" }
            - call: "GET /r2t4/enrollments/${ec}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ec_bal: $.data.balance_cents }
          assert:
            - "WithdrawalCase.${cc}.percentage_completed == 0.610 and .earned_pct == 1.000 (day 64 crosses the 60% cap)"
            - "WithdrawalCase.${cc}.aid_earned_cents == 500000 (100% of 200000 + 300000)"
            - "ReturnObligation.${ob_c}.status == VOIDED (voided by the recalculation loop, not by a return)"
            - "WithdrawalCase.${cc}.status == CLOSED (no obligations, no offers, notification already sent -> auto-close after the loop iteration)"
            - "Enrollment.${ec}.balance_cents == 100000 (chargeback 200000 reversed; 600000 - 500000 aid)"

      - name: enrollment_withdraw_rescind_cycle
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - state_machines.Enrollment.WITHDRAWN_to_ENROLLED
          - state_machines.WithdrawalCase.OPEN_to_CANCELLED
        distinguishing_aspect: |
          Enrollment is cyclic (ENROLLED -> WITHDRAWN -> ENROLLED): rescission compensates
          the withdrawal and permits a second withdrawal that opens a brand-new case — a
          cycle on a different entity than WithdrawalCase.
        test_recipe:
          setup:
            - "Term T1 (105 days); enrollment charges 600000, no aid"
            - "Withdraw OFFICIAL 2026-09-02 -> case K1 OPEN; rescind -> ENROLLED; withdraw again OFFICIAL 2026-09-10 -> case K2"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SY", full_name: "Stu Y", email: "sy@x.edu" }
              as: RegistrarClerk
              captures: { sy: $.data.id }
            - call: "POST /r2t4/students/${sy}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ey: $.data.id }
            - call: "POST /r2t4/enrollments/${ey}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-02" }
              as: RegistrarClerk
              captures: { k1: $.data.id }
            - call: "POST /r2t4/enrollments/${ey}/rescind-withdrawal"
              payload: {}
              as: RegistrarClerk
              captures: { ey_status: $.data.status }
          trigger:
            - call: "POST /r2t4/enrollments/${ey}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-10" }
              as: RegistrarClerk
              captures: { k2: $.data.id, k2_status: $.data.status }
            - call: "GET /r2t4/withdrawal-cases/${k1}"
              payload: {}
              as: RegistrarClerk
              captures: { k1_status: $.data.status }
          assert:
            - "Enrollment.${ey}.status == ENROLLED after rescission (cycle completed)"
            - "WithdrawalCase.${k1}.status == CANCELLED"
            - "Second withdraw succeeds: WithdrawalCase.${k2}.status == OPEN and ${k2} != ${k1}"
            - "Enrollment.${ey}.balance_cents == 600000 throughout (no aid, no calculation ran)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: calculate_cascade_obligation_chargeback_balance_notification
        grounds:
          - state_machines.WithdrawalCase.OPEN_to_CALCULATED
          - calculations.return_responsibility_split
          - calculations.student_balance
          - entities.StudentAccountEntry.fields.source_ref
        distinguishing_aspect: |
          Depth-4 chain from POST calculate: case CALCULATED creates the SCHOOL ReturnObligation;
          that obligation creation posts the R2T4_CHARGEBACK ledger entry (source_ref = obligation id);
          the entry posting recomputes Enrollment.balance_cents; the positive balance flips
          balance_notification_sent. Each link is caused by the previous link, not by calculate directly.
        test_recipe:
          setup:
            - "Term T1 (105 days); enrollment charges 600000; PELL 200000 + SUB 300000 disbursed (500000)"
            - "Withdraw OFFICIAL 2026-10-25 (pct 0.600, return_amount 200000, school share min(240000, 200000) = 200000)"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SD", full_name: "Stu D", email: "sd@x.edu" }
              as: RegistrarClerk
              captures: { sd: $.data.id }
            - call: "POST /r2t4/students/${sd}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ed: $.data.id }
            - call: "POST /r2t4/enrollments/${ed}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pd: $.data.id }
            - call: "POST /r2t4/awards/${pd}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dd1: $.data.id }
            - call: "POST /r2t4/disbursements/${dd1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ed}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { ld: $.data.id }
            - call: "POST /r2t4/awards/${ld}/accept"
              payload: {}
              as: Student
              as_user_id: "${sd}"
            - call: "POST /r2t4/awards/${ld}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { dd2: $.data.id }
            - call: "POST /r2t4/disbursements/${dd2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ed}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cd: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cd}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${cd}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob_d: "$.data[0].id", ob_d_due: "$.data[0].due_date" }
            - call: "GET /r2t4/account-entries"
              payload: { enrollment_id: "${ed}", entry_type: "R2T4_CHARGEBACK" }
              as: FinancialAidOfficer
              captures: { cb_amt: "$.data[0].amount_cents", cb_src: "$.data[0].source_ref" }
            - call: "GET /r2t4/enrollments/${ed}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ed_bal: $.data.balance_cents, ed_notif: $.data.balance_notification_sent }
          assert:
            - "Exactly 1 ReturnObligation: party == SCHOOL, amount_cents == 200000, status == PENDING, due_date == '2026-12-09' (determination 2026-10-25 + 45d)"
            - "R2T4_CHARGEBACK entry amount_cents == 200000 and source_ref == ${ob_d} (entry caused by obligation creation)"
            - "Enrollment.${ed}.balance_cents == 300000 (600000 charges - 500000 aid + 200000 chargeback; day-63 refund tier is 0)"
            - "Enrollment.${ed}.balance_notification_sent == true (balance > 0 while case CALCULATED)"

      - name: offer_accept_cascade_disbursement_credit_balance
        grounds:
          - state_machines.PostWithdrawalOffer.SENT_to_ACCEPTED
          - calculations.post_withdrawal_disbursement
          - state_machines.WithdrawalCase.CALCULATED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST offer accept, not calculate):
          offer ACCEPTED creates a DISBURSED AidDisbursement; that disbursement posts the
          AID_CREDIT entry and bumps award.disbursed_amount_cents; the entry recomputes
          the balance, which closes the case.
        test_recipe:
          setup:
            - "Term T1 (105 days); enrollment charges 500000; PELL 200000 (100000 DISBURSED + 100000 SCHEDULED); SUB 300000 accepted (100000 DISBURSED + 200000 SCHEDULED)"
            - "Withdraw OFFICIAL 2026-10-25 (pct 0.600): earned 300000 > disbursed 200000 -> PWD path"
            - "Calculate at clock 2026-10-26: grant PWD 20000 auto-credited; loan offer 80000 SENT; all SCHEDULED rows CANCELLED; balance 280000"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SE", full_name: "Stu E", email: "se@x.edu" }
              as: RegistrarClerk
              captures: { se: $.data.id }
            - call: "POST /r2t4/students/${se}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 500000 }
              as: RegistrarClerk
              captures: { ee: $.data.id }
            - call: "POST /r2t4/enrollments/${ee}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pe: $.data.id }
            - call: "POST /r2t4/awards/${pe}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { de1: $.data.id }
            - call: "POST /r2t4/disbursements/${de1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${pe}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ee}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { le: $.data.id }
            - call: "POST /r2t4/awards/${le}/accept"
              payload: {}
              as: Student
              as_user_id: "${se}"
            - call: "POST /r2t4/awards/${le}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { de2: $.data.id }
            - call: "POST /r2t4/disbursements/${de2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${le}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ee}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { ce: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-26T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/withdrawal-cases/${ce}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { ce_pwd_loan: $.data.pwd_loan_cents }
            - call: "GET /r2t4/withdrawal-cases/${ce}/offers"
              payload: {}
              as: FinancialAidOfficer
              captures: { of_e: "$.data[0].id", of_e_amt: "$.data[0].amount_cents" }
          trigger:
            - call: "POST /r2t4/post-withdrawal-offers/${of_e}/accept"
              payload: {}
              as: Student
              as_user_id: "${se}"
              captures: { of_e_status: $.data.status }
            - call: "GET /r2t4/disbursements"
              payload: { pwd_offer_id: "${of_e}" }
              as: FinancialAidOfficer
              captures: { pwd_d_amt: "$.data[0].amount_cents", pwd_d_status: "$.data[0].status" }
            - call: "GET /r2t4/awards/${le}"
              payload: {}
              as: FinancialAidOfficer
              captures: { le_disbursed: $.data.disbursed_amount_cents }
            - call: "GET /r2t4/enrollments/${ee}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ee_bal: $.data.balance_cents }
            - call: "GET /r2t4/withdrawal-cases/${ce}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ce_status: $.data.status }
          assert:
            - "PostWithdrawalOffer.${of_e}.amount_cents == 80000 and after accept .status == ACCEPTED"
            - "New AidDisbursement with pwd_offer_id == ${of_e}: amount_cents == 80000, status == DISBURSED (created by the acceptance, link 2)"
            - "AidAward.${le}.disbursed_amount_cents == 180000 (100000 + 80000, link 3)"
            - "Enrollment.${ee}.balance_cents == 200000 (500000 - 200000 aid - 20000 grant PWD - 80000 loan PWD, link 4)"
            - "WithdrawalCase.${ce}.status == CLOSED (offers terminal, no obligations, notification sent)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_returned_obligation
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_OBLIGATION_ALREADY_RETURNED]
          - errors[ERR_RETURN_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Pair {state, business_fiscal}: a record-return on an already-RETURNED obligation
          whose amount is ALSO wrong must surface the state error
          ERR_OBLIGATION_ALREADY_RETURNED (priority 6), not ERR_RETURN_AMOUNT_MISMATCH (priority 12).
        test_recipe:
          setup:
            - "Term T1; enrollment charges 600000; PELL 200000 disbursed; withdraw OFFICIAL 2026-10-25; calculate -> SCHOOL obligation 80000 due 2026-12-09"
            - "Return recorded in full by BursarClerk -> obligation RETURNED"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SF", full_name: "Stu F", email: "sf@x.edu" }
              as: RegistrarClerk
              captures: { sf: $.data.id }
            - call: "POST /r2t4/students/${sf}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ef: $.data.id }
            - call: "POST /r2t4/enrollments/${ef}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pf: $.data.id }
            - call: "POST /r2t4/awards/${pf}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { df1: $.data.id }
            - call: "POST /r2t4/disbursements/${df1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ef}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cf: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${cf}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${cf}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob_f: "$.data[0].id" }
            - call: "POST /r2t4/return-obligations/${ob_f}/record-return"
              payload: { amount_cents: 80000 }
              as: BursarClerk
          trigger:
            - call: "POST /r2t4/return-obligations/${ob_f}/record-return"
              payload: { amount_cents: 1 }
              as: BursarClerk
              captures: { err_f: $.data.error_id }
          assert:
            - "error_id == ERR_OBLIGATION_ALREADY_RETURNED (http 409) — the state failure at priority 6 masks the amount mismatch at priority 12"
            - "ReturnObligation.${ob_f}.returned_amount_cents remains 80000"

      - name: state_vs_temporal_on_double_withdraw
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_ENROLLMENT_ALREADY_WITHDRAWN]
          - errors[ERR_DATE_OUT_OF_PERIOD]
        distinguishing_aspect: |
          Pair {state, business_temporal} — a different pair than {state, business_fiscal}:
          withdrawing an already-WITHDRAWN enrollment with a notification_date outside the
          term must surface ERR_ENROLLMENT_ALREADY_WITHDRAWN (priority 6), not
          ERR_DATE_OUT_OF_PERIOD (priority 8).
        test_recipe:
          setup:
            - "Term T1 (2026-08-24..2026-12-11); enrollment charges 600000; withdrawn OFFICIAL 2026-09-02"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SG", full_name: "Stu G", email: "sg@x.edu" }
              as: RegistrarClerk
              captures: { sg: $.data.id }
            - call: "POST /r2t4/students/${sg}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { eg: $.data.id }
            - call: "POST /r2t4/enrollments/${eg}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-02" }
              as: RegistrarClerk
          trigger:
            - call: "POST /r2t4/enrollments/${eg}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2027-01-15" }
              as: RegistrarClerk
              captures: { err_g: $.data.error_id }
          assert:
            - "error_id == ERR_ENROLLMENT_ALREADY_WITHDRAWN (http 409) — state failure wins over the out-of-period date failure"
            - "No second WithdrawalCase exists for ${eg}: GET /r2t4/withdrawal-cases?enrollment_id=${eg} returns exactly 1 row"

      - name: safety_vs_fiscal_on_sod_return
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_RETURN_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Pair {business_safety, business_fiscal}: when the calculating officer records the
          SCHOOL return AND supplies a wrong amount, the segregation-of-duties error
          ERR_SEGREGATION_OF_DUTIES (priority 11) wins over ERR_RETURN_AMOUNT_MISMATCH (priority 12).
        test_recipe:
          setup:
            - "Term T1; enrollment charges 600000; PELL 200000 disbursed; withdraw OFFICIAL 2026-10-25"
            - "Case calculated by FinancialAidOfficer X-User-ID 'officer-1' -> SCHOOL obligation 80000 PENDING"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SH", full_name: "Stu H", email: "sh@x.edu" }
              as: RegistrarClerk
              captures: { sh: $.data.id }
            - call: "POST /r2t4/students/${sh}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { eh: $.data.id }
            - call: "POST /r2t4/enrollments/${eh}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { ph: $.data.id }
            - call: "POST /r2t4/awards/${ph}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { dh1: $.data.id }
            - call: "POST /r2t4/disbursements/${dh1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${eh}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { ch: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${ch}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${ch}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob_h: "$.data[0].id" }
          trigger:
            - call: "POST /r2t4/return-obligations/${ob_h}/record-return"
              payload: { amount_cents: 1 }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { err_h: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (http 403) — compliance check at priority 11 masks the fiscal mismatch at priority 12"
            - "ReturnObligation.${ob_h}.status remains PENDING"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sixty_percent_cap_exact_boundary
        grounds:
          - calculations.percentage_completed
          - entities.WithdrawalCase.fields.earned_pct
        distinguishing_aspect: |
          Metric: percentage threshold. Exactly 0.600 completed earns 60% (cap NOT applied,
          rule is strictly-greater); 0.610 earns 100%. Exercised through POST calculate.
        test_recipe:
          setup:
            - "Term T1 (105 days): day 63 = 2026-10-25 -> 63/105 = 0.600 exactly; day 64 = 2026-10-26 -> 0.610"
            - "Two enrollments, charges 600000 each, PELL 200000 disbursed each; E1 withdraws 2026-10-25, E2 withdraws 2026-10-26"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SI", full_name: "Stu I", email: "si@x.edu" }
              as: RegistrarClerk
              captures: { si: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SJ", full_name: "Stu J", email: "sj@x.edu" }
              as: RegistrarClerk
