              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 1000 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-6"
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 1000 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { q_status: $.data.status, q_cost: $.data.query_cost }
          assert:
            - "first query: ERR_GRANT_NOT_QUERYABLE (grant REQUESTED)"
            - "second query after approval: status == EXECUTED, query_cost == 1 (row_units 1 x join_factor 1.0 x tier 1.0)"
            - "CleanRoomGrant.${grant}.query_budget_remaining == 99"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: grant_windows_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.CleanRoomGrant.fields.valid_until
        distinguishing_aspect: |
          Interval semantics: half-open [valid_from, valid_until) on
          CleanRoomGrant windows per supplier account — an overlap (09-19 <
          existing 09-20 end) is rejected, while exact adjacency
          (new start == existing end) is allowed.
        test_recipe:
          setup:
            - "Account with ACTIVE contract; existing REQUESTED grant window [2026-09-10, 2026-09-20)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Nu Nectar", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-10T00:00:00Z", valid_until: "2026-09-20T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-19T00:00:00Z", valid_until: "2026-10-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-20T00:00:00Z", valid_until: "2026-10-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { g2: $.data.id }
          assert:
            - "overlapping grant (start 2026-09-19 < existing end 2026-09-20): ERR_WINDOW_OVERLAP"
            - "adjacent grant (start 2026-09-20 == existing end): created successfully (half-open semantics)"

      - name: cycle_windows_require_seven_day_buffer
        grounds:
          - validations[priority=8]
          - entities.LineReviewCycle.fields.window_end
        distinguishing_aspect: |
          Different interval semantics on a different resource: LineReviewCycle
          windows per category are closed intervals with a mandatory 7-day
          buffer — a new window 5 days after an existing one is rejected, but
          exactly 7 days after is allowed (unlike grants where adjacency
          suffices).
        test_recipe:
          setup:
            - "Existing SNACKS cycle window [2026-10-01, 2026-10-15]"
          setup_api_calls:
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-10-01", window_end: "2026-10-15" }
              as: CategoryManager
              captures: { cyc1: $.data.id }
          trigger:
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-10-20", window_end: "2026-10-25" }
              as: CategoryManager
              captures: { err_id: $.data.error_id }
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-10-22", window_end: "2026-10-28" }
              as: CategoryManager
              captures: { cyc2: $.data.id }
          assert:
            - "window starting 2026-10-20 (5 days after 2026-10-15, < 7-day buffer): ERR_CYCLE_GAP_VIOLATION"
            - "window starting 2026-10-22 (exactly 7 days after): created successfully"
            - "LineReviewCycle.${cyc2}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: report_credit_ledger_invariant_through_reserve_cancel
        grounds:
          - calculations.report_credit_ledger
          - state_machines.InsightReport.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: report credit ledger. Forward reserve (create,
          cost 3) paired with its compensating cancel leaves
          allowance == available + reserved + consumed at 10 == 10 + 0 + 0;
          no drift.
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_PORTFOLIO contract, report_credit_allowance 10, scope SNACKS"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Xi Xacuti", region: "SE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "COMPETITOR_BLIND", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { rep: $.data.id }
            - call: "GET /shopper-insights/subscription-contracts/${contract}"
              as: RetailerAdmin
              captures: { a1: $.data.report_credits_available, r1: $.data.report_credits_reserved, c1: $.data.report_credits_consumed }
            - call: "POST /shopper-insights/insight-reports/${rep}/cancel"
              as: SupplierAnalyst
              as_user_id: "${acct}"
            - call: "GET /shopper-insights/subscription-contracts/${contract}"
              as: RetailerAdmin
              captures: { a2: $.data.report_credits_available, r2: $.data.report_credits_reserved, c2: $.data.report_credits_consumed }
          assert:
            - "after create: available == 7, reserved == 3, consumed == 0 (COMPETITOR_BLIND costs 3)"
            - "after cancel (compensating action): available == 10, reserved == 0, consumed == 0"
            - "invariant holds at both observations: 10 == available + reserved + consumed"
            - "InsightReport.${rep}.status == CANCELLED"

      - name: query_budget_invariant_through_suppression_refund
        grounds:
          - calculations.query_budget_ledger
          - state_machines.CleanRoomQuery.SUBMITTED_to_SUPPRESSED
        distinguishing_aspect: |
          Different conserved quantity: clean-room query budget. A SUPPRESSED
          query's charge is fully refunded by the compensating refund
          (net zero), while an EXECUTED query debits permanently;
          total == consumed + remaining at every observation.
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_CATEGORY contract; APPROVED grant query_budget_total 200"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Omicron Oats", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", query_budget_total: 200 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-7"
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 10 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { q1: $.data.id, q1_status: $.data.status, q1_cost: $.data.query_cost }
            - call: "GET /shopper-insights/clean-room-grants/${grant}"
              as: DataSteward
              as_user_id: "steward-7"
              captures: { rem1: $.data.query_budget_remaining, con1: $.data.query_budget_consumed }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 5200 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { q2_status: $.data.status, q2_cost: $.data.query_cost }
            - call: "GET /shopper-insights/clean-room-grants/${grant}"
              as: DataSteward
              as_user_id: "steward-7"
              captures: { rem2: $.data.query_budget_remaining, con2: $.data.query_budget_consumed }
          assert:
            - "suppressed query (rows 10 < 20): status SUPPRESSED, query_cost == 1 charged then refunded"
            - "after suppression: query_budget_consumed == 0, query_budget_remaining == 200 (net zero)"
            - "executed query (rows 5200, 1 join, TIER_CATEGORY): query_cost == 6, consumed == 6, remaining == 194"
            - "invariant: 200 == consumed + remaining at both observations"
