scaffold_corner_design:
  - section: entities
    instances:
      - name: program_create_defaults_applied
        claim_type: creation_defaults
        grounds: ["entities.Program"]
        distinguishing_aspect: "Minimal required-field creation yields DRAFT status, PUBLIC visibility default, version 1, and zeroed ledger counters."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/programs/${prog}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Program.${prog}.status == DRAFT"
            - "Program.${prog}.visibility == PUBLIC"
            - "Program.${prog}.version == 1"
            - "Program.${prog}.bounty_reserved_cents == 0 and bounty_paid_cents == 0 and total_withheld_cents == 0 and available_pool_cents == 5000000"

      - name: researcher_missing_required_country_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Researcher.fields.country_code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required country_code on registration is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/researchers"
              payload: { handle: "rx", email: "rx@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: read_only_field_in_report_payload_returns_invalid_request
        claim_type: system_fields
        grounds: ["entities.Report.fields.severity_final", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed field severity_final in the submission payload is rejected, not silently stored."
        test_recipe:
          setup:
            - "ACTIVE public program with CRITICAL asset scoped; researcher R"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rro", email: "rro@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
          trigger:
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "XSS", severity_final: "CRITICAL" }
              as: Researcher
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_program_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]]"]
        distinguishing_aspect: "Reading a program with a non-existent UUID yields 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"

      - name: reports_list_pagination_and_filter
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /api/reports"]
        distinguishing_aspect: "limit/offset pagination interacts with the status filter: 2 NEW reports with limit=1 yields total_count 2, has_more true, one item; offset=1 yields the second."
        test_recipe:
          setup:
            - "ACTIVE public program, CRITICAL asset, researcher R with 2 submitted (NEW) reports"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rpg", email: "rpg@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "one", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "two", description: "d", vulnerability_class: "SQLI" }
              as: Researcher
              as_user_id: "${res}"
          trigger:
            - call: "GET /api/reports?status=NEW&limit=1"
              payload: {}
              as: Triager
          assert:
            - "response envelope contains total_count == 2 and has_more == true with exactly 1 item"
            - "GET /api/reports?status=NEW&limit=1&offset=1 returns the second report and has_more == false"

      - name: cross_program_asset_reference_out_of_scope
        claim_type: parent_relationship
        grounds: ["entities.ScopeAsset.fields.program_id", "errors[ERR_OUT_OF_SCOPE]]"]
        distinguishing_aspect: "An asset that exists but belongs to a different program is rejected ERR_OUT_OF_SCOPE (FK exists but crosses the aggregate boundary)."
        test_recipe:
          setup:
            - "programs P1 and P2 both ACTIVE; asset A belongs to P2 only; researcher R"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P1", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog1: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog1}", name: "A1", asset_identifier: "a1.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset1: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog1}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset1}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/programs"
              payload: { name: "P2", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog2: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog2}", name: "A2", asset_identifier: "a2.example.com", criticality: "HIGH" }
              as: ProgramAdmin
              captures: { asset2: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog2}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset2}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog2}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rcp", email: "rcp@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
          trigger:
            - call: "POST /api/reports"
              payload: { program_id: "${prog1}", asset_id: "${asset2}", title: "t", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OUT_OF_SCOPE"

  - section: state_machines
    instances:
      - name: triage_on_validated_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Report", "errors[ERR_INVALID_STATE]]"]
        distinguishing_aspect: "VALIDATED report rejects further triage actions; no side effects fire."
        test_recipe:
          setup: ["ACTIVE program, asset, researcher, report VALIDATED"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rit", email: "rit@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 5, exploitability: 5, affected_scope: 5 }
              as: Triager
          trigger:
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "REQUEST_INFO" }
              as: Triager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Report.${rep}.status remains VALIDATED"

      - name: respond_on_declined_invitation_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ProgramInvitation", "errors[ERR_INVALID_STATE]]"]
        distinguishing_aspect: "DECLINED is terminal; a second respond (ACCEPT) is rejected."
        test_recipe:
          setup: ["ACTIVE PRIVATE program (min_reputation 0); researcher R; invitation declined"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", visibility: "PRIVATE", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/researchers"
              payload: { handle: "rtl", email: "rtl@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/invitations"
              payload: { program_id: "${prog}", researcher_id: "${res}" }
              as: ProgramAdmin
              captures: { inv: $.data.id }
            - call: "POST /api/invitations/${inv}/respond"
              payload: { decision: "DECLINE" }
              as: Researcher
              as_user_id: "${res}"
          trigger:
            - call: "POST /api/invitations/${inv}/respond"
              payload: { decision: "ACCEPT" }
              as: Researcher
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "ProgramInvitation.${inv}.status remains DECLINED"

      - name: clock_sweep_expires_pending_invitation
        claim_type: automatic_transition
        grounds: ["state_machines.ProgramInvitation.PENDING_to_EXPIRED", "calculations.invitation_expiry", "errors[ERR_INVITATION_EXPIRED]]"]
        distinguishing_aspect: "Clock sweep flips PENDING -> EXPIRED when now > issued_at + 7 days; subsequent respond is rejected ERR_INVITATION_EXPIRED."
        test_recipe:
          setup: ["PRIVATE ACTIVE program; invitation issued 2026-09-01T00:00:00Z (expires 2026-09-08T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", visibility: "PRIVATE", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "MEDIUM" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rex", email: "rex@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/invitations"
              payload: { program_id: "${prog}", researcher_id: "${res}" }
              as: ProgramAdmin
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/invitations/${inv}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/invitations/${inv}/respond"
              payload: { decision: "ACCEPT" }
              as: Researcher
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "ProgramInvitation.${inv}.status == EXPIRED after the sweep"
            - "${err} == ERR_INVITATION_EXPIRED on respond"

      - name: clock_sweep_reinstates_suspended_researcher
        claim_type: automatic_transition
        grounds: ["state_machines.Researcher.SUSPENDED_to_ACTIVE", "calculations.invitation_expiry"]
        distinguishing_aspect: "Clock sweep at suspension_ends_at (inclusive >=) flips SUSPENDED -> ACTIVE and clears suspension_ends_at."
        test_recipe:
          setup: ["researcher SUSPENDED at 2026-09-01 with strike_count 2 -> suspension_ends_at 2026-09-29T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rsu", email: "rsu@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "STRIKE", reason: "one" }
              as: Triager
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "STRIKE", reason: "two" }
              as: Triager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/researchers/${res}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Researcher.${res}.status == ACTIVE (suspension_ends_at comparison is inclusive >=)"
            - "Researcher.${res}.suspension_ends_at == null"
            - "Researcher.${res}.strike_count remains 2 (reinstatement does not erase strikes)"

      - name: ticket_verify_rejected_after_report_marked_duplicate
        claim_type: precondition_enforcement
        grounds: ["state_machines.RemediationTicket.FIXED_to_VERIFIED", "errors[ERR_INVALID_STATE]]"]
        distinguishing_aspect: "VERIFY's cross-entity precondition is evaluated at VERIFY time: a report marked DUPLICATE after the ticket was created blocks verification."
        test_recipe:
          setup: ["anchor report VALIDATED; second report VALIDATED then marked DUPLICATE of anchor; its ticket advanced to FIXED"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rtv", email: "rtv@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "anchor", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { repA: $.data.id }
            - call: "POST /api/reports/${repA}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${repA}/validate"
              payload: { impact: 5, exploitability: 5, affected_scope: 5 }
              as: Triager
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "dupe", description: "d", vulnerability_class: "XSS" }
              as: Researcher
              as_user_id: "${res}"
              captures: { repB: $.data.id }
            - call: "POST /api/reports/${repB}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${repB}/validate"
              payload: { impact: 5, exploitability: 5, affected_scope: 5 }
              as: Triager
            - call: "POST /api/remediation-tickets"
              payload: { report_id: "${repB}", external_ref: "ENG-5" }
              as: ProgramAdmin
              captures: { tick: $.data.id }
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "START" }
              as: ProgramAdmin
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "FIX" }
              as: ProgramAdmin
            - call: "POST /api/reports/${repB}/triage"
              payload: { action: "MARK_DUPLICATE", duplicate_of_id: "${repA}" }
              as: Triager
          trigger:
            - call: "POST /api/remediation-tickets/${tick}/transition"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "RemediationTicket.${tick}.status remains FIXED; Report.${repB}.status remains DUPLICATE"

  - section: calculations
    instances:
      - name: severity_band_boundary_exactly_7_is_high
        claim_type: threshold_boundary
        grounds: ["calculations.severity_score"]
        distinguishing_aspect: "Band thresholds are inclusive from below: adjusted exactly 7.0 bands HIGH (>= 7.0), not MEDIUM; 6.9 would band MEDIUM."
        test_recipe:
          setup: ["ACTIVE program (exposure_modifier 1.0), MEDIUM asset (env factor 1.0); report triaged"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "MEDIUM" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rsb", email: "rsb@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "AUTHZ" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
          trigger:
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 8, exploitability: 6, affected_scope: 6 }
              as: Triager
          assert:
            - "Report.${rep}.severity_score_base == 7.0 (0.5*8 + 0.3*6 + 0.2*6)"
            - "Report.${rep}.severity_score_adjusted == 7.0"
            - "Report.${rep}.severity_final == HIGH"

      - name: tax_threshold_59999_missing_pays_with_backup_withholding
        claim_type: threshold_boundary
        grounds: ["calculations.withholding_amount"]
        distinguishing_aspect: "The 60000-cent tax block is an inclusive threshold: 59999 with MISSING tax pays with 24% backup withholding (withheld 14400), while 60000 blocks."
        test_recipe:
          setup: ["ACTIVE program, MEDIUM asset; researcher R tax MISSING; LOW report validated; BONUS award 59999 APPROVED"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "MEDIUM" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "rtb", email: "rtb@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "OTHER" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 2, exploitability: 2, affected_scope: 2 }
              as: Triager
            - call: "POST /api/awards"
              payload: { report_id: "${rep}", award_type: "BONUS", amount_cents: 59999 }
              as: Triager
              captures: { aw: $.data.id }
            - call: "POST /api/awards/${aw}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
