              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/vendors"
              payload: { legal_name: "Coastal Locksmiths", trade: "LOCKSMITH", coi_expires_at: "2027-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 7000, rating: 4.2 }
              as: Dispatcher
              captures: { vendor_id: $.data.id }
            - call: "POST /property-care/vendors/${vendor_id}/reinstate"
              payload: {}
              as: Dispatcher
            - call: "POST /property-care/properties/${prop_id}/key-assets"
              payload: { key_type: "PHYSICAL", label: "Spare front key", copies_total: 1 }
              as: Dispatcher
              captures: { ka_id: $.data.id, ka_v1: $.data.version }
            - call: "POST /property-care/key-assets/${ka_id}/access-grants"
              payload: { vendor_id: "${vendor_id}", window_start_at: "2026-06-11T10:00:00Z", window_end_at: "2026-06-11T12:00:00Z", expected_key_asset_version: "${ka_v1}" }
              as: Dispatcher
