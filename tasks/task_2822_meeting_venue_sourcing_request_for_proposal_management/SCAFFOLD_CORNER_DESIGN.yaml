        - MeetingEvent EVT-2822-A requirements locked with that venue SHORTLISTED at rank 1.
        - Round-1 Rfp ISSUED and deliberately left open, so counters remain legal.
        - The venue's Proposal submitted with the 249.00 NET / 600-night / 145000.00 F&B grid and evaluated once, so it is UNDER_REVIEW with total_cost_contracted_usd 447844.84 and negotiation_round_count 0.
