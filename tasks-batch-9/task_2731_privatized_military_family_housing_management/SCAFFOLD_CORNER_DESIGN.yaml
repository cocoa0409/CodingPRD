        test_recipe:
          setup:
            - "One installation with the declared defaults and one 2026 BahRate row for E5 with dependents (245000 / 19500)."
            - "One unit A-101, 2 bedrooms, TOWNHOME, JUNIOR_ENLISTED, historic_flag false."
            - "One E5 sponsor with three full-time-custody dependents, so bedroom_eligibility is 2."
            - "The application (pcs_orders_date 2026-08-25) is still PENDING: no offer run has been made."
