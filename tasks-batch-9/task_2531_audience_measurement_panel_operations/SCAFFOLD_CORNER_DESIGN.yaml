              captures: { e38b: "$.data.error_id" }
            - call: "GET /clients/${cl38_id}"
              payload: {}
              as: ClientServiceRep
          assert:
            - "Trigger call 1: HTTP 422 with ${e38a} == ERR_INVALID_REQUEST - UPSTREAM_RUN_REPIN is reserved for the repin cascade and cannot be supplied by hand, and the row stays SCHEDULED"
            - "Trigger call 2: HTTP 200 with data.state == HELD, data.held_from_state == SCHEDULED and data.hold_reason == DATA_QUALITY_REVIEW"
            - "Trigger call 3: data.held_deliverable_count == 1"
            - "Trigger call 4: HTTP 200 with data.state == SCHEDULED, data.held_from_state == null and data.hold_reason == null - the release restores exactly the recorded state"
            - "Trigger call 5: HTTP 409 with ${e38b} == ERR_DELIVERABLE_NOT_HELD (priority 52)"
            - "Trigger call 6: data.held_deliverable_count == 0 - the counter round-tripped to zero and the refused second release did not push it to -1"

      - name: client_suspension_holds_every_open_deliverable_and_reinstate_does_not_release
        claim_type: cross_entity
        grounds:
          - endpoints[POST /clients/{client_id}/suspend]
          - endpoints[POST /clients/{client_id}/reinstate]
          - validations[priority 45, 71]
        distinguishing_aspect: "Suspension is a fan-out over the client's non-terminal deliverables recording each row's own held_from_state, and reinstatement is deliberately NOT its inverse: it clears the status but leaves every hold and the held_deliverable_count standing."
        test_recipe:
          setup:
            - "CHAIN C complete, with CODE DMA-639, RANK 139, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002039, LABEL RS-C39; a STANDARD client contracted to DMA-639 holding one SCHEDULED dataset row and one REQUESTED custom-analysis row against the PUBLISHED run."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: ClientServiceRep
              captures: { run39_id: "$.data[0].id", m39_id: "$.data[0].market_id" }
            - call: "POST /clients"
              payload: { name: "Great Plains Networks", tier: "STANDARD", contract_market_ids: ["${m39_id}"] }
              as: ClientServiceRep
              captures: { cl39_id: "$.data.id" }
            - call: "POST /clients/${cl39_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run39_id}", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { d39a_id: "$.data.id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl39_id}", processing_run_id: "${run39_id}", question: "Share of viewing by income band", requested_cell_count: 3 }
              as: ClientServiceRep
              captures: { d39b_id: "$.data.id" }
          trigger:
            - call: "POST /clients/${cl39_id}/suspend"
              payload: { suspended_reason: "Invoice 90 days past due" }
              as: ClientServiceRep
            - call: "GET /client-deliverables"
              payload: { client_id: "${cl39_id}", state: "HELD" }
              as: ClientServiceRep
            - call: "POST /client-deliverables"
              payload: { client_id: "${cl39_id}", processing_run_id: "${run39_id}", question: "One more cut", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { e39a: "$.data.error_id" }
            - call: "POST /clients/${cl39_id}/reinstate"
              payload: {}
              as: ClientServiceRep
            - call: "POST /clients/${cl39_id}/reinstate"
              payload: {}
              as: ClientServiceRep
              captures: { e39b: "$.data.error_id" }
            - call: "POST /client-deliverables/${d39a_id}/release"
              payload: {}
              as: ClientServiceRep
            - call: "GET /clients/${cl39_id}"
              payload: {}
              as: ClientServiceRep
          assert:
            - "Trigger call 1: HTTP 200 with data.status == SUSPENDED, data.suspended_reason == Invoice 90 days past due and data.held_deliverable_count == 2"
            - "Trigger call 2: total_count == 2; the ${d39a_id} row has held_from_state SCHEDULED and the ${d39b_id} row has held_from_state REQUESTED, and both carry hold_reason CLIENT_REQUESTED"
            - "Trigger call 3: HTTP 409 with ${e39a} == ERR_CLIENT_SUSPENDED (priority 45) and custom_analysis_used is still 1"
            - "Trigger call 4: HTTP 200 with data.status == ACTIVE, data.suspended_reason == null and data.held_deliverable_count STILL 2 - reinstatement is not the inverse of the suspension cascade"
            - "Trigger call 5: HTTP 409 with ${e39b} == ERR_CLIENT_NOT_SUSPENDED (priority 71)"
            - "Trigger call 6: HTTP 200 with data.state == SCHEDULED restored from held_from_state"
            - "Trigger call 7: data.held_deliverable_count == 1 - only an explicit release decrements the counter"

      - name: acknowledged_notification_rejects_a_second_acknowledge
        claim_type: idempotency
        grounds:
          - state_machines.ClientNotification.transitions.SENT_to_ACKNOWLEDGED
          - validations[priority 60]
          - calculations.methodology_impact_delta
        distinguishing_aspect: "ACKNOWLEDGED is terminal, so acknowledged_client_count can never be inflated past notified_client_count by a client that clicks twice; the notification also freezes its own copy of the MINOR tier and delta at send time."
        test_recipe:
          setup:
            - "CHAIN C complete, with CODE DMA-640, RANK 140, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002040, LABEL RS-C40 (the PUBLISHED target rule set the run is pinned to); the clock reads 2026-08-11T00:00:00Z."
            - "A DRAFT rule set RS-C41 differs from RS-C40 in exactly one dimension: missing_interval_ascription_minutes 66 instead of 60, so a = 0, b = 0, c = min(1.0, 6/60) = 0.1 and impact_delta_pct == round_half_up(0.25 * 0.1, 4) == 0.0250 -> MINOR -> 72 lead hours."
            - "A STANDARD client contracted to DMA-640 is the only client whose contract_market_ids intersect the change's affected_market_ids."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: GovernanceDirector
              captures: { run40_id: "$.data[0].id", m40_id: "$.data[0].market_id", rs40_id: "$.data[0].edit_rule_set_id" }
            - call: "POST /clients"
              payload: { name: "Blue Ridge Television", tier: "STANDARD", contract_market_ids: ["${m40_id}"] }
              as: ClientServiceRep
              captures: { cl40_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C41", missing_interval_ascription_minutes: 66, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs41_id: "$.data.id" }
            - call: "POST /methodology-changes"
              payload: { title: "Lengthen ascription window to 66 minutes", target_edit_rule_set_id: "${rs40_id}", proposed_edit_rule_set_id: "${rs41_id}", affected_market_ids: ["${m40_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-40"
              captures: { ch40_id: "$.data.id", ch40_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch40_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run40_id}", expected_methodology_change_version: "${ch40_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-40"
            - call: "POST /methodology-changes/${ch40_id}/notify"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-analyst-40"
            - call: "GET /client-notifications"
              payload: { methodology_change_id: "${ch40_id}" }
              as: ClientServiceRep
              captures: { n40_id: "$.data[0].id", n40_tier: "$.data[0].impact_tier", n40_delta: "$.data[0].disclosed_delta_pct" }
          trigger:
            - call: "POST /client-notifications/${n40_id}/acknowledge"
              payload: {}
              as: ClientUser
              as_user_id: "${cl40_id}"
            - call: "POST /client-notifications/${n40_id}/acknowledge"
              payload: {}
              as: ClientUser
              as_user_id: "${cl40_id}"
              captures: { e40: "$.data.error_id" }
            - call: "GET /methodology-changes/${ch40_id}"
              payload: {}
              as: GovernanceDirector
          assert:
            - "Setup call 5: HTTP 200 with data.state == IMPACT_ASSESSED, data.impact_delta_pct == 0.0250, data.impact_tier == MINOR, data.notification_lead_hours == 72, data.notification_deadline_at == 2026-08-14T00:00:00Z and data.baseline_projected_average_audience == 24306"
            - "Setup call 6: data.state == NOTIFIED, data.notified_client_count == 1, data.acknowledged_client_count == 0"
            - "Setup call 7: total_count == 1 with ${n40_tier} == MINOR, ${n40_delta} == 0.0250, state SENT and sent_at == 2026-08-11T00:00:00Z"
            - "Trigger call 1: HTTP 200 with data.state == ACKNOWLEDGED and data.acknowledged_at == 2026-08-11T00:00:00Z"
            - "Trigger call 2: HTTP 409 with ${e40} == ERR_NOTIFICATION_NOT_SENT (priority 60)"
            - "Trigger call 3: data.acknowledged_client_count == 1 (not 2) and data.state is still NOTIFIED - acknowledgement never activates the change by itself"

      - name: audit_finalize_qualified_appends_disclosures_and_unfreezes_the_market
        claim_type: side_effect_execution
        grounds:
          - state_machines.AccreditationAudit.transitions.OPEN_to_FINALIZED
          - endpoints[POST /accreditation-audits/{accreditation_audit_id}/finalize]
          - validations[priority 63]
        distinguishing_aspect: "The QUALIFIED outcome is the middle case: it demands a non-empty disclosure list (unlike ACCREDITED), appends the disclosures in payload order, yet leaves publication_blocked false (unlike DENIED), and releasing the audit un-freezes the market back to OPEN."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-642, RANK 142, T 2, B 1000, BUDGET 500000 (market OPEN, one UNDER_TARGET cell), a PUBLISHED rule set RS-C42, and one OPEN audit opened by auditor-opener-42, which freezes the market."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Delta Two", market_code: "DMA-642", dma_rank: 142, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m42_id: "$.data.id" }
            - call: "POST /markets/${m42_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c42_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C42", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs42_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs42_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m42_id}", scope_edit_rule_set_id: "${rs42_id}", auditor_note: "Scheduled review of DMA-642 methodology" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-42"
              captures: { au42_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation-audits/${au42_id}/finalize"
              payload: { outcome: "QUALIFIED", limitation_disclosures: [] }
              as: AccreditationAuditor
              as_user_id: "auditor-finalizer-42"
              captures: { e42: "$.data.error_id" }
            - call: "POST /accreditation-audits/${au42_id}/finalize"
              payload: { outcome: "QUALIFIED", limitation_disclosures: ["SMALL_CELL_SAMPLE", "OOH_COVERAGE_PARTIAL"] }
              as: AccreditationAuditor
              as_user_id: "auditor-finalizer-42"
            - call: "GET /markets/${m42_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: HTTP 422 with ${e42} == ERR_DISCLOSURE_REQUIRED (priority 63); the audit is still OPEN and the market is still FROZEN"
            - "Trigger call 2: HTTP 200 with data.state == FINALIZED, data.outcome == QUALIFIED, data.finalized_by_user_id == auditor-finalizer-42, data.finalized_at == 2026-08-01T00:00:00Z and data.limitation_disclosures == [SMALL_CELL_SAMPLE, OOH_COVERAGE_PARTIAL] in payload order"
            - "Trigger call 3: data.accreditation_status == QUALIFIED, data.publication_blocked == false, data.open_audit_count == 0"
            - "Trigger call 3: data.limitation_disclosures == [SMALL_CELL_SAMPLE, OOH_COVERAGE_PARTIAL] appended to the market, and data.recruitment_posture == OPEN again with posture_changed_at == 2026-08-01T00:00:00Z"

