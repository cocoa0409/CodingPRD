            - call: "POST /petition-drives"
              payload: { district_id: "${pd_district_id}", drive_type: "FORMATION", closes_at: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pool_drive_id: "$.data.id" }
            - call: "POST /petition-drives/${pool_drive_id}/signatures"
              payload: { lodging_business_id: "${pool_b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${pool_drive_id}/signatures"
              payload: { lodging_business_id: "${pool_b2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /petition-drives/${pool_drive_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /lodging-businesses"
              payload: { district_id: "${pd_district_id}", legal_name: "Tidepool Cottages", boundary_zone: "ZONE_CORE", classification: "SHORT_TERM_RENTAL", room_count: 20, prior_year_gross_room_revenue_cents: 20000000, operator_contact_email: "ops@tidepoolcottages.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pool_b3_id: "$.data.id" }
            - call: "POST /petition-drives/${pool_drive_id}/tally"
