  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_gated_by_vendor_status
        grounds:
          - state_machines.ScreeningOrder.transitions.CONSENT_CAPTURED_to_DISPATCHED
          - state_machines.ScreeningVendor.transitions.ACTIVE_to_SUSPENDED
          - "errors[ERR_VENDOR_NOT_ACTIVE]"
        distinguishing_aspect: |
          Entity pair ScreeningOrder -> ScreeningVendor: the order's
          CONSENT_CAPTURED -> DISPATCHED transition is legal only while the TARGET
          vendor is ACTIVE; SUSPENDED blocks it, reinstate re-enables it.
        test_recipe:
          setup:
            - "Vendor created then SUSPENDED; order CONSENT_CAPTURED at 2026-08-05T10:00:00Z"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-CE1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
