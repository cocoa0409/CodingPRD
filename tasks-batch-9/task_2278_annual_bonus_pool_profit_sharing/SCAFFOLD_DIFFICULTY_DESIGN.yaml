      - name: per_segment_rounding_then_sum_across_transfer_and_capped_leave
        grounds:
          - calculations.participant_prorated_target
          - entities.ParticipantAward.fields.segment_count
          - entities.ParticipantAward.fields.excluded_leave_days
          - entities.ParticipantAward.fields.prorated_target_cents
          - entities.EligibilityEvent.fields.paid_leave
          - endpoints."POST /bonus-plans/{planId}/target-assignments"
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is the whole test. The two participation
          segments carry exact amounts 326,027.397 and 2,016,438.356 cents.
          Rounding per segment and summing yields 2,342,465; summing the exact
          amounts and rounding once yields 2,342,466. The 1-cent gap is only
          reachable because a mid-year TRANSFER splits the window AND a 92-day
          unpaid leave is clipped by the 30-day credit cap (62 excluded days),
          so both the segment split and the leave cap must be applied before
          the rounding order can even be observed. The events are also
          recorded out of chronological order (TRANSFER first, LEAVE second).
        test_recipe:
          setup:
            - "One unit, one plan, L3 target 10.00% and L5 target 20.00%, one pool, one participant hired 2025-06-01 at L3 with salary 10,000,000."
            - "Two eligibility events recorded out of order: first a TRANSFER effective 2026-07-01 to L5 at 20,000,000 in the same unit, then an unpaid LEAVE covering 2026-03-01..2026-05-31 (92 calendar days, 30 credited, 62 excluded)."
