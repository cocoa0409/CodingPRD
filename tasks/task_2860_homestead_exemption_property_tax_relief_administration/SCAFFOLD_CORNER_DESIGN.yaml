      - name: income_tier_resolves_before_the_asset_test_is_applied
        claim_type: cascading_validation
        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - calculations.income_relief_tier
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
          - errors[ERR_ASSET_LIMIT_EXCEEDED]
        distinguishing_aspect: "The asset test is reachable only after the income tier resolves: the first CERTIFIED certification (income 7000000 > limit 6000000) is rejected with ERR_INCOME_LIMIT_EXCEEDED even though its assets are inside the limit, and only the second certification (income 5000000, assets 5000000) gets far enough to raise ERR_ASSET_LIMIT_EXCEEDED."
        test_recipe:
          setup:
            - "DISABILITY_INCOME has income_limit_cents 6000000, asset_limit_cents 2000000 and requires_income_certification true."
            - "The taxpayer's ownership is VERIFIED and the latest VOTER_REGISTRY and DEED_REGISTRY checks are MATCH, so priorities 13 and 14 pass."
            - "Certification C1 (income 7000000, assets 1000000) is CERTIFIED via an INCOME_DOR MATCH; C2 (income 5000000, assets 5000000) is certified the same way afterwards and has the greater created_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
