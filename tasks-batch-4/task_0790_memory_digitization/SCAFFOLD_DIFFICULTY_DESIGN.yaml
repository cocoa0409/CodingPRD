              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /media-items/${mi2}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi2}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_id}", media_item_id: "${mi1}", claim_type: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "Order.${ord_id}.received_item_count == 2"
            - "Order.${ord_id}.written_off_count == 1"
            - "MediaItem.${mi1}.status == WRITTEN_OFF"
