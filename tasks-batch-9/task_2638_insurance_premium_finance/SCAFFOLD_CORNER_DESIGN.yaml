  - section: endpoints
    instances:

      - name: standard_crud_agreement_create_read_and_filtered_pagination
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/agreements
          - endpoints.GET_/agreements/{id}
          - endpoints.GET_/agreements
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The read side of the ledger: creation echoes every stored input, the single read returns
          exactly what was stored plus the common fields, and the collection read composes filtering
          with limit/offset so that total_count reflects the FILTERED population while has_more
          reflects the page. Three agreements are deliberately parked in three different statuses so a
          status filter cannot be satisfied by returning everything. The absence of any PUT or DELETE
          in §1.5 is itself asserted: the note is mutated only through named action endpoints, which is
          what makes the ledger auditable.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "three agreements are created for the same Insured and ProducerAgent"
