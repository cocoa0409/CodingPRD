            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 20000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
              captures: { closer: $.data.closed_by_user_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: { closing_window_days: 21 }
              as: AuctionOps
              as_user_id: "ops-closer-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: { closing_window_days: 21 }
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id, contract_status: $.data.contract_status, executed_by: $.data.executed_by_user_id }
          assert:
            - "${closer} == ops-closer-1"
            - "First trigger: HTTP 409 and ${err_id} == ERR_SEGREGATION_OF_DUTIES"
            - "${err_id} != ERR_FORBIDDEN_ROLE (the role is allowed; only the identity collides)"
            - "GET /auction-lots/${lot_id}/sale-contracts returned total_count == 0 after the rejection"
            - "Second trigger: HTTP 201, ${contract_status} == EXECUTED and ${executed_by} == ops-contract-2"
            - "AssetListing.${listing_id}.listing_status == SOLD_PENDING_CONTRACT and Seller.${seller_id}.settled_net_cents == 18930000"

      - name: window_containment_is_checked_before_the_reserve_rule
        claim_type: cascading_validation
        grounds:
          - validations[priority=49]
          - validations[priority=55]
          - errors[ERR_LOT_WINDOW_OUTSIDE_EVENT]
        distinguishing_aspect: "A lot-add that breaks BOTH containment (priority 49) and the reserve rule (priority 55) surfaces ERR_LOT_WINDOW_OUTSIDE_EVENT, so the scheduling frame is settled before any money rule runs; fixing only the window then exposes ERR_RESERVE_BELOW_OPENING from the very same payload."
        test_recipe:
          setup:
            - "A DISCLOSURE_READY VACANT / CLEAR asset in CA-ALAMEDA and one SCHEDULED event spanning 17:00:00Z..19:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Cascade Check Bank", seller_type: "BANK", contact_email: "c@cascadechk.example", settlement_account_ref: "ACH-CCHK" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Cascadechk Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "Cascade Check Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v1: $.data.version }
          trigger:
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T18:30:00Z", lot_window_end_at: "2026-09-15T19:30:00Z", opening_bid_cents: 20000000, reserve_price_cents: 19000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
              captures: { err_window: $.data.error_id }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T18:30:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 19000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
              captures: { err_reserve: $.data.error_id }
          assert:
            - "First trigger: HTTP 422 and ${err_window} == ERR_LOT_WINDOW_OUTSIDE_EVENT"
            - "${err_window} != ERR_RESERVE_BELOW_OPENING"
            - "Second trigger: HTTP 422 and ${err_reserve} == ERR_RESERVE_BELOW_OPENING (the window now ends exactly at the event end, which is allowed)"
            - "AuctionEvent.${event_id}.lot_count == 0 and version == ${ev_v1}"
            - "AssetListing.${listing_id}.listing_status == DISCLOSURE_READY"

      - name: lot_state_error_beats_the_deposit_error_on_a_closed_lot
        claim_type: priority_conflict
        grounds:
          - validations[priority=26]
          - validations[priority=56]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_lot_state_error_outranks_insufficient_deposit
          rationale: "The named §1.8 instance builds a bidder who is both under-funded and bidding on a closed lot and asserts that ERR_LOT_NOT_OPEN, not ERR_DEPOSIT_INSUFFICIENT, is returned."

      - name: exclusion_error_beats_the_bid_window_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=36]
          - validations[priority=44]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / county_scoped_exclusion_outranks_closed_bid_window
          rationale: "The named §1.8 instance violates the county-scoped exclusion rule and the bid-window rule in one call and asserts that the lower-priority compliance error wins."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: event_create_read_and_list_round_trip_with_filters
        claim_type: standard_crud
        grounds:
          - endpoints[POST /auction-events]
          - endpoints[GET /auction-events/{id}]
          - endpoints[GET /auction-events]
          - errors[ERR_AUCTION_EVENT_NOT_FOUND]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The read path round-trips exactly what the write path stored and the list endpoint composes county_code, event_status, limit and offset in one query (limit=1&offset=1 returns the second CA-ALAMEDA event with has_more true), while an unknown id returns ERR_AUCTION_EVENT_NOT_FOUND (404) instead of an empty object."
        test_recipe:
          setup:
            - "Two SCHEDULED events in CA-ALAMEDA (17:00..19:00 and 19:31..20:30) and one in CA-CONTRA-COSTA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events"
              payload: { title: "CRUD Event One", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { e1: $.data.id, e1_title: $.data.title, e1_status: $.data.event_status, e1_lots: $.data.lot_count }
            - call: "POST /auction-events"
              payload: { title: "CRUD Event Two", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T19:31:00Z", ends_at: "2026-09-15T20:30:00Z" }
              as: AuctionOps
              captures: { e2: $.data.id }
            - call: "POST /auction-events"
              payload: { title: "CRUD Event Three", county_code: "CA-CONTRA-COSTA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /auction-events/${e1}"
              payload: {}
              as: Anonymous
              captures: { got_id: $.data.id, got_title: $.data.title, got_start: $.data.starts_at, got_reschedules: $.data.reschedule_count }
            - call: "GET /auction-events?county_code=CA-ALAMEDA&event_status=SCHEDULED&limit=1&offset=1"
              payload: {}
              as: AuctionOps
              captures: { page_first_id: "$.data[0].id" }
            - call: "GET /auction-events/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: AuctionOps
              captures: { err_id: $.data.error_id }
          assert:
            - "${e1_title} == CRUD Event One, ${e1_status} == SCHEDULED and ${e1_lots} == 0 at creation"
            - "${got_id} == ${e1}, ${got_title} == CRUD Event One, ${got_start} == 2026-09-15T17:00:00Z and ${got_reschedules} == 0"
            - "The list call returns response_type == array with total_count == 2, has_more == false, limit == 1, offset == 1"
            - "${page_first_id} == ${e2} (offset 1 skips the earlier-created CA-ALAMEDA event; ${e3} is filtered out by county)"
            - "Third trigger: HTTP 404 and ${err_id} == ERR_AUCTION_EVENT_NOT_FOUND"

      - name: event_to_trustee_sale_link_requires_an_existing_sale
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /auction-events]
          - errors[ERR_TRUSTEE_SALE_NOT_FOUND]
          - entities.AuctionEvent.fields.trustee_sale_id
        distinguishing_aspect: "The optional trustee_sale_id is a real cross-reference: an unknown id is ERR_TRUSTEE_SALE_NOT_FOUND (404) and no event row is created, while a valid id produces an event that is reachable from BOTH directions (GET /auction-events/{id} and GET /trustee-sales/{id}/auction-events)."
        test_recipe:
          setup:
            - "One PENDING TrusteeSale in CA-ALAMEDA for 2026-09-15T18:00:00Z; the clock is 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Link Servicing", seller_type: "SERVICER", contact_email: "l@link.example", settlement_account_ref: "ACH-LINK" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Link Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /auction-events"
              payload: { title: "Dangling Link Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "00000000-0000-0000-0000-0000000000bb" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
            - call: "POST /auction-events"
              payload: { title: "Linked Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "${sale_id}" }
              as: AuctionOps
              captures: { event_id: $.data.id, linked_sale: $.data.trustee_sale_id }
            - call: "GET /trustee-sales/${sale_id}/auction-events"
              payload: {}
              as: Trustee
              captures: { back_ref: "$.data[0].id" }
          assert:
            - "First trigger: HTTP 404 and ${err_id} == ERR_TRUSTEE_SALE_NOT_FOUND"
            - "GET /auction-events?county_code=CA-ALAMEDA returns total_count == 1 after both triggers (the dangling attempt created nothing)"
            - "${linked_sale} == ${sale_id}"
            - "${back_ref} == ${event_id} with total_count == 1"
            - "TrusteeSale.${sale_id}.status == PENDING (linking an event does not confirm the sale)"

      - name: audit_assessment_requires_a_lot_and_uses_the_event_start_as_reference
        claim_type: computed_read
        grounds:
          - endpoints[GET /bidders/{id}/eligibility-assessment]
          - validations[priority=16]
          - errors[ERR_AUDIT_MODE_REQUIRES_LOT]
          - calculations.bidder_risk_score.variants
        distinguishing_aspect: "AUDIT has no reference instant without a lot, so mode=AUDIT alone is ERR_AUDIT_MODE_REQUIRES_LOT (422); supplied with the lot it reconstructs the bidder as of the EVENT's starts_at — identity verified before that instant scores 0 while the unfunded deposit still scores 10 against the lot's requirement."
        test_recipe:
          setup:
            - "A lot in a CA-ALAMEDA event starting 2026-09-15T17:00:00Z with required_deposit_cents 1000000."
            - "One bidder VERIFIED on 2026-09-10T00:00:00Z with no deposits, no exclusions and fallout_count 0; the clock is 2026-09-16T00:00:00Z at read time."
