  - section: errors
    instances:
      - name: every_bogus_path_id_and_body_fk_returns_its_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_JURISDICTION_NOT_FOUND
          - errors.ERR_TRAINING_PROVIDER_NOT_FOUND
          - errors.ERR_EXAM_FORM_NOT_FOUND
          - errors.ERR_TESTING_SITE_NOT_FOUND
          - errors.ERR_CANDIDATE_NOT_FOUND
          - errors.ERR_PROCTOR_NOT_FOUND
          - errors.ERR_ACCESS_CODE_BATCH_NOT_FOUND
          - errors.ERR_ACCESS_CODE_NOT_FOUND
          - errors.ERR_ACCOMMODATION_REQUEST_NOT_FOUND
          - errors.ERR_EXAM_SESSION_NOT_FOUND
          - errors.ERR_SCORE_REPORT_NOT_FOUND
          - errors.ERR_SECURITY_INCIDENT_NOT_FOUND
          - errors.ERR_LOCAL_REGISTRATION_NOT_FOUND
        distinguishing_aspect: |
          Every 404 in §1.6 is entity-specific: a bogus id must not collapse into a generic ERR_NOT_FOUND,
          and the entity named in the error_id must be the entity of the id that failed to resolve. The last
          two calls pin §1.4 priority 7's ordering claim: POST /exam-sessions carries THREE bad FKs at once
          (candidate_id, exam_form_id, access_code_id) and must report the leftmost one in the §1.5 input
          list, so the same request yields ERR_CANDIDATE_NOT_FOUND with a bogus candidate and
          ERR_EXAM_FORM_NOT_FOUND once only the candidate is fixed.
        test_recipe:
          setup:
            - "A jurisdiction, one training provider under it and one candidate of that provider — nothing else; every other id used below is a syntactically valid UUID that was never minted."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"] }
