            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-3700", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
