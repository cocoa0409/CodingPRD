    input: [name, jurisdiction, election_date, initial_ballot_stock]
    output: Election
    side_effects: ["unallocated_ballot_stock initialized to initial_ballot_stock"]
  - method: GET
    path: "/elections/{id}"
    description: "Fetch an election."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
