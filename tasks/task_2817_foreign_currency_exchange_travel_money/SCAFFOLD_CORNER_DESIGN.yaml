            - "${e_digits} == ERR_INVALID_REQUEST for minor_unit_digits 1, which is outside the declared 0 | 2 | 3 domain"
            - "${e_id_pair} == ERR_INVALID_REQUEST: id_document_number and id_document_expiry are required exactly when id_document_type is supplied"
            - "${e_season_window} and ${e_card_window} are both ERR_INVALID_REQUEST: season_end_date and effective_to must be STRICTLY after their starts, so a zero-length window is not a degenerate-but-legal case"
            - "${e_demand} == ERR_INVALID_REQUEST for demand_index_bps 0 (declared range 1..50000)"
            - "${e_dup_denom} == ERR_INVALID_REQUEST: two lines for the same 10000 face must be rejected rather than silently summed to 2 notes"
            - "${e_enum} == ERR_INVALID_REQUEST for direction SELL, which is not one of SELL_FX_TO_CUSTOMER | BUY_FX_FROM_CUSTOMER"
            - "nothing was written: GET /currencies returns total_count 1, GET /travel-corridors total_count 0, GET /rate-cards total_count 1, GET /exchange-transactions total_count 0 and GET /customers total_count 1"
      - name: route_status_and_region_checks_on_schedule
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 11, ERR_ROUTE_SUSPENDED]
          - validations[priority 11, ERR_ROUTE_BRANCH_NOT_SERVICED]
          - entities.ArmoredRoute.fields.region_code
        distinguishing_aspect: "Scheduling validity depends on the route row rather than on the shipment: the identical window is refused with ERR_ROUTE_SUSPENDED on a SUSPENDED SOUTH route, refused with ERR_ROUTE_BRANCH_NOT_SERVICED on an ACTIVE route whose region_code is NORTH while the branch is SOUTH, and accepted on the ACTIVE SOUTH route."
        test_recipe:
          setup:
            - "Branch BR-LHR (SOUTH) with no position yet, so its vault sits at 0 cents / 0 bps / OPEN and REPLENISHMENT creation is allowed."
            - "Three routes: RT-SOUTH-SUS (SOUTH, SUSPENDED), RT-NORTH-1 (NORTH, ACTIVE) and RT-SOUTH-1 (SOUTH, ACTIVE), each with daily_capacity_usd_cents 10000000 so capacity never binds."
            - "One REQUESTED REPLENISHMENT shipment of 5 x 10000 EUR (50000 minor, 54348 cents)."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-SOUTH-SUS", carrier_name: "Brinks", region_code: "SOUTH", daily_capacity_usd_cents: 10000000, status: "SUSPENDED" }
              as: PlatformAdmin
              captures: { rt_sus: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-NORTH-1", carrier_name: "Loomis", region_code: "NORTH", daily_capacity_usd_cents: 10000000 }
              as: PlatformAdmin
              captures: { rt_north: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-SOUTH-1", carrier_name: "Brinks", region_code: "SOUTH", daily_capacity_usd_cents: 10000000 }
              as: PlatformAdmin
              captures: { rt_south: "$.data.id" }
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 5 }] }
              as: TreasuryOfficer
              captures: { ship_id: "$.data.id" }
          trigger:
            - call: "POST /cash-shipments/${ship_id}/schedule"
              payload: { armored_route_id: "${rt_sus}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: TreasuryOfficer
              captures: { e_sus: "$.data.error_id" }
            - call: "POST /cash-shipments/${ship_id}/schedule"
              payload: { armored_route_id: "${rt_north}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: TreasuryOfficer
              captures: { e_region: "$.data.error_id" }
            - call: "POST /cash-shipments/${ship_id}/schedule"
              payload: { armored_route_id: "${rt_south}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: TreasuryOfficer
          assert:
            - "${e_sus} == ERR_ROUTE_SUSPENDED with HTTP 422 and CashShipment.${ship_id} stays REQUESTED with armored_route_id null"
            - "${e_region} == ERR_ROUTE_BRANCH_NOT_SERVICED with HTTP 422: ArmoredRoute region_code NORTH does not equal Branch region_code SOUTH"
            - "the third call returns HTTP 200 with status SCHEDULED, armored_route_id ${rt_south}, window_start 2026-08-02T08:00:00Z and window_end 2026-08-02T12:00:00Z"
            - "manifest_minor_units 50000 and manifest_usd_equivalent_cents 54348 were fixed at creation and are unchanged by scheduling"
            - "ArmoredRoute.status is input-only and immutable, so the SUSPENDED route is still SUSPENDED and no route row carries a version field"

