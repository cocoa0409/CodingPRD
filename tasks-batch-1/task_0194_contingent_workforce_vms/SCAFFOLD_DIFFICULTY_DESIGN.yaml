# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml; every setup_api_calls/trigger chain drives empty-DB -> precondition
# using only §1.5 endpoints; every formula-derived assert is a pre-computed literal.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: timesheet_pay_vs_bill_diverge_on_same_hours
        grounds:
          - calculations.timesheet_amounts
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
          - entities.Timesheet.fields.pay_amount_cents
          - entities.Timesheet.fields.bill_amount_cents
        distinguishing_aspect: |
          On a Timesheet entity, the same hours fed through pay_rate vs bill_rate
          produce two different money figures (pay 380000 != bill 551000) — the
          dual variant lives on Timesheet, a different entity domain from the
          markup variant which lives on Submittal.
        test_recipe:
          setup:
            - "Program (default_markup 0.45, max_markup 0.60, tenure_limit 180, warning 120)"
            - "Supplier tier 1, Worker, Requisition (openings 1, max_pay 20000), distributed, submittal pay 8000 default-markup bill 11600, hired -> Assignment pay 8000 bill 11600"
            - "A DRAFT timesheet with regular_hours 40, overtime_hours 5"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "Worker One", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/offer"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-06-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { asg_id: $.data.id }
            - call: "POST /vms/timesheets"
              payload: { assignment_id: "${asg_id}", week_start_date: "2026-01-05T00:00:00.000Z", regular_hours: 40, overtime_hours: 5 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /vms/timesheets/${ts_id}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /vms/timesheets/${ts_id}/approve"
              payload: {}
              as: HiringManager
              captures: { pay_amt: $.data.pay_amount_cents, bill_amt: $.data.bill_amount_cents }
          assert:
            - "Timesheet.${ts_id}.pay_amount_cents == 380000"
            - "Timesheet.${ts_id}.bill_amount_cents == 551000"
            - "Timesheet.${ts_id}.bill_amount_cents != Timesheet.${ts_id}.pay_amount_cents"

      - name: submittal_bill_rate_derived_vs_explicit_diverge
        grounds:
          - calculations.bill_rate_and_markup
          - state_machines.Submittal.SUBMITTED_to_SHORTLISTED
          - entities.Submittal.fields.bill_rate_cents
          - entities.Submittal.fields.effective_markup_pct
        distinguishing_aspect: |
          On the Submittal entity, an omitted bill_rate is derived as
          round_half_up(pay*(1+0.45))=14500 (markup 0.45) whereas an explicit
          bill_rate 16000 yields markup 0.60 — two valid approaches give different
          stored bill_rate/markup; this variant is on Submittal, not Timesheet.
        test_recipe:
          setup:
            - "Program (default_markup 0.45, max_markup 0.60), Supplier, two Workers, distributed Requisition (max_pay 20000)"
            - "Submittal A omits bill_rate (pay 10000 -> derived bill 14500, markup 0.45)"
            - "Submittal B supplies bill_rate 16000 (pay 10000 -> markup 0.60)"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W A", national_id_hash: "ha" }
              as: ProgramManager
              captures: { wkr_a: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W B", national_id_hash: "hb" }
              as: ProgramManager
              captures: { wkr_b: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 2, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
          trigger:
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_a}", pay_rate_cents: 10000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_a: $.data.id, bill_a: $.data.bill_rate_cents, mk_a: $.data.effective_markup_pct }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_b}", pay_rate_cents: 10000, bill_rate_cents: 16000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_b: $.data.id, bill_b: $.data.bill_rate_cents, mk_b: $.data.effective_markup_pct }
          assert:
            - "Submittal.${sub_a}.bill_rate_cents == 14500"
            - "Submittal.${sub_a}.effective_markup_pct == 0.45"
            - "Submittal.${sub_b}.bill_rate_cents == 16000"
            - "Submittal.${sub_b}.effective_markup_pct == 0.60"
            - "Submittal.${sub_a}.bill_rate_cents != Submittal.${sub_b}.bill_rate_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distribution_waterfall_cumulative_offsets_over_distinct_tiers
        grounds:
          - calculations.distribution_waterfall
          - state_machines.Requisition.DRAFT_to_DISTRIBUTED
          - entities.Distribution.fields.released_at
          - entities.Distribution.fields.status
        distinguishing_aspect: |
          Mode (a): >=3 inputs (distinct-tier set, per-tier interval, distribution
          clock T0) with non-linear interaction — release_offset is index-of-tier
          times interval, cumulative across DISTINCT tiers (ties share an offset),
          NOT a flat T0+interval. Three suppliers at tiers 1/2/2 collapse to two
          distinct offsets {0h, 24h}.
        test_recipe:
          setup:
            - "Program; three Suppliers at tiers 1, 2, 2; Requisition tier_release_interval_hours 24"
            - "Clock set to 2026-02-01T00:00:00Z, then distribute to all three"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/programs/${prog_id}/_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S1", tier: 1 }
              as: ProgramManager
              captures: { s1: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S2", tier: 2 }
              as: ProgramManager
              captures: { s2: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S3", tier: 2 }
              as: ProgramManager
              captures: { s3: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000, tier_release_interval_hours: 24 }
              as: ProgramManager
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${s1}", "${s2}", "${s3}"] }
              as: ProgramManager
            - call: "GET /vms/distributions"
              payload: {}
              as: ProgramManager
          assert:
            - "Distribution for s1 (tier 1): released_at == 2026-02-01T00:00:00.000Z, status == RELEASED"
            - "Distribution for s2 (tier 2): released_at == 2026-02-02T00:00:00.000Z, status == PENDING"
            - "Distribution for s3 (tier 2): released_at == 2026-02-02T00:00:00.000Z, status == PENDING"
            - "The two tier-2 distributions share the SAME released_at (one distinct offset of 24h, not 24h then 48h)"

      - name: timesheet_round_then_sum_differs_from_sum_then_round
        grounds:
          - calculations.timesheet_amounts
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
          - entities.Timesheet.fields.pay_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With pay_rate 2501,
          regular 0.5, overtime 0.5: round-then-sum = rhu(1250.5)+rhu(1875.75)
          = 1251+1876 = 3127, whereas sum-then-round = rhu(1250.5+1875.75)
          = rhu(3126.25) = 3126. The scaffold pins round-then-sum, so 3127.
        test_recipe:
          setup:
            - "Program; Assignment with pay_rate 2501, bill_rate 3626 (explicit at submittal)"
            - "DRAFT timesheet regular_hours 0.5 overtime_hours 0.5, submitted"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 2501, bill_rate_cents: 3626 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 2501, bill_rate_cents: 3626 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/offer"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-06-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { asg_id: $.data.id }
            - call: "POST /vms/timesheets"
              payload: { assignment_id: "${asg_id}", week_start_date: "2026-01-05T00:00:00.000Z", regular_hours: 0.5, overtime_hours: 0.5 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { ts_id: $.data.id }
            - call: "POST /vms/timesheets/${ts_id}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /vms/timesheets/${ts_id}/approve"
              payload: {}
              as: HiringManager
              captures: { pay_amt: $.data.pay_amount_cents }
          assert:
            - "Timesheet.${ts_id}.pay_amount_cents == 3127"
            - "Timesheet.${ts_id}.bill_amount_cents == 4533"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: submittal_rate_negotiation_cycle
        grounds:
          - state_machines.Submittal.INTERVIEWING_to_RATE_PROPOSED
          - state_machines.Submittal.RATE_PROPOSED_to_INTERVIEWING
          - entities.Submittal.fields.rounds
        distinguishing_aspect: |
          Non-linear via a cycle on the Submittal entity: INTERVIEWING ->
          RATE_PROPOSED -> INTERVIEWING returns to a prior state and increments
          rounds; after two laps rounds == 2 while status is INTERVIEWING again.
        test_recipe:
          setup:
            - "Program, Supplier, Worker, distributed Requisition, submittal advanced to INTERVIEWING"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 9000 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/counter_rate"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 9500 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/counter_rate"
              payload: {}
              as: HiringManager
              captures: { rounds_now: $.data.rounds, status_now: $.data.status }
          assert:
            - "Submittal.${sub_id}.status == INTERVIEWING"
            - "Submittal.${sub_id}.rounds == 2"

      - name: assignment_parallel_engagement_and_compliance_dimensions
        grounds:
          - state_machines.Assignment.CLEAR_to_TENURE_WARNING
          - state_machines.Assignment.ACTIVE_to_ON_HOLD
          - entities.Assignment.fields.engagement_status
          - entities.Assignment.fields.compliance_status
        distinguishing_aspect: |
          Non-linear via parallel dimensions on the Assignment entity:
          engagement_status (held -> ON_HOLD) and compliance_status (advance_clock
          -> TENURE_WARNING) move independently — after a hold then a clock
          advance the row carries engagement_status=ON_HOLD AND compliance_status=
          TENURE_WARNING at once. Different entity from the Submittal cycle.
        test_recipe:
          setup:
            - "Program (limit 180, warning 120). Worker hired into an ACTIVE assignment starting 2026-01-01"
            - "Assignment placed ON_HOLD, then clock advanced to 2026-04-30 (120 inclusive days)"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/programs/${prog_id}/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/offer"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-12-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { asg_id: $.data.id }
            - call: "POST /vms/assignments/${asg_id}/hold"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /vms/programs/${prog_id}/advance_clock"
              payload: { to_iso8601: "2026-04-30T00:00:00.000Z" }
              as: ProgramManager
            - call: "GET /vms/assignments/${asg_id}"
              payload: {}
              as: ProgramManager
              captures: { eng: $.data.engagement_status, comp: $.data.compliance_status }
          assert:
            - "Assignment.${asg_id}.engagement_status == ON_HOLD"
            - "Assignment.${asg_id}.compliance_status == TENURE_WARNING"
            - "WorkerProfile.${wkr_id}.cumulative_engaged_days == 120"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: hire_fills_requisition_revokes_distributions_and_rejects_siblings
        grounds:
          - state_machines.Submittal.OFFERED_to_HIRED
          - state_machines.Requisition.DISTRIBUTED_to_FILLED
          - entities.Distribution.fields.status
          - entities.Submittal.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from the hire trigger: hire mutates Requisition.filled_count
          (link1); filled_count reaching openings drives Requisition DISTRIBUTED->FILLED
          (link2, caused by link1); the FILLED transition itself REVOKES the remaining
          Distribution and REJECTS the sibling Submittal (link3, caused by link2).
        test_recipe:
          setup:
            - "Requisition openings 1 distributed to two suppliers; two submittals (A and B) both reach OFFERED/SUBMITTED"
            - "Submittal A is offered; submittal B remains SUBMITTED; second distribution still PENDING/RELEASED"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S1", tier: 1 }
              as: ProgramManager
              captures: { s1: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "S2", tier: 1 }
              as: ProgramManager
              captures: { s2: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W A", national_id_hash: "ha" }
              as: ProgramManager
              captures: { wkr_a: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W B", national_id_hash: "hb" }
              as: ProgramManager
              captures: { wkr_b: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000, tier_release_interval_hours: 0 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${s1}", "${s2}"] }
              as: ProgramManager
