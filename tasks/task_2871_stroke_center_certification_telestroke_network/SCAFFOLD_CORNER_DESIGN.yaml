  - name: the_routing_selector_skips_five_ineligible_candidates_and_breaks_a_rank_tie_by_load
    claim_type: selector_policy
    grounds:
    - calculations.consult_routing_selection STEP 1 clauses 2, 3, 4, 5, 7
    - calculations.consult_routing_selection STEP 2 ranking
    - endpoints.POST /stroke-network/consults
    distinguishing_aspect: 'Seven candidates are constructed so that the WINNER is the one with the worst roster_rank of the eligible set: the best-ranked neurologist is excluded by a proxy credential whose expires_at equals the clock exactly (strict >), the next by scope, the next by on-call state, the next by licensure, the next by board certification on a TIER_1_FULL agreement, and the last rank-20 tie is broken by active_consult_count. Nothing about the row ids can produce this answer, and a selector that merely sorts by roster_rank picks a different neurologist at every one of the six hurdles. The final call flips the requested scope and the winner changes.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke (state_code CA), ACTIVE TIER_1_FULL agreement with max_concurrent_consults 3.
      - 'SEVEN neurologists, all homed at the hub: Nyquist rank 5 board-certified with a CONSULT_AND_THROMBOLYSIS credential expiring exactly at 2026-09-01T08:14:00Z; Ainsley rank 10 with a CONSULT_ONLY credential; Baptiste rank 12 fully credentialed but never taken on call; Cortes rank 14 licensed only in OR; Duval rank 16 NOT board certified; Everly rank 20 and Fenwick rank 20, both board-certified and fully credentialed.'
      - Fenwick was the only ON_CALL neurologist when case X1 was activated at 08:05, so X1's consult was routed to him and his active_consult_count is 1 while Everly's is 0.
      - Nyquist, Ainsley, Cortes, Duval and Everly were then taken ON_CALL; Baptiste remains OFF_DUTY.
      - The clock stands at exactly 2026-09-01T08:14:00Z, and case X2 is activated at that instant.
