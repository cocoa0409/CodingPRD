              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (total-loss settlements are final; reopen is repair-only)"
      - name: usage_event_reverse_idempotent_second_reverse_rejected
        claim_type: idempotency
        grounds: ['state_machines.UsageEvent.RECORDED_to_REVERSED']
        distinguishing_aspect: "Reversing an already-REVERSED usage event fails with ERR_INVALID_STATE — the compensating action is not re-entrant."
        test_recipe:
          setup: ["ACTIVE policy; one usage event recorded and reversed"]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Yan", email: "yan@x.com", has_daily_driver: true, driving_record_status: CLEAN }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN106", year: 1970, make: "Ford", model: "Mustang", vehicle_class: CLASSIC, condition_grade: GOOD, storage_type: ENCLOSED_GARAGE, primary_use: PLEASURE }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vehicles/${v_id}/photos"
              payload: { photo_type: FRONT, image_ref: "img://f", captured_at: "2026-09-01T00:00:00Z" }
              as: Member
