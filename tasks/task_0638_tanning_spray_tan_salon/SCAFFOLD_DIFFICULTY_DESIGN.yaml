# =============================================================================
# Task 0638 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >= 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dose_estimate_vs_actual_on_session
        grounds:
          - calculations.uv_dose_allowed_seconds
          - entities.Session.fields.allowed_seconds
          - state_machines.Session.RESERVED_to_IN_PROGRESS
        distinguishing_aspect: "On the Member/Session dose domain: the reservation_estimate stamps Session.allowed_seconds=150 (completed_uv_session_count=1) while the start_time_actual recomputes 180 (count=2), so an unchanged requested_seconds=150 is valid under both yet the persisted estimate differs from the start-time allowance."
        test_recipe:
          setup:
            - "Plan UNLIMITED (6000 cents, weekly_uv_session_cap=0). One adult Member skin_type III, ACTIVE."
            - "Two equipment units eq1, eq2 each max_exposure_seconds=600, turnaround_seconds=600."
            - "Member completes UV session A at 2026-06-01T10:00:00Z (completed_uv_session_count becomes 1)."
            - "Clock at 2026-06-02T10:00:00Z. Member reserves session B on eq2 (req 150) — allowed_seconds stamped 150 from count=1."
            - "Member then completes another UV session C on eq1 (count becomes 2) before starting B."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, retail_discount_pct: 0.10, weekly_uv_session_cap: 0, includes_spray: true }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Bed eq1", kind: "BED", max_exposure_seconds: 600, turnaround_seconds: 600 }
              as: SalonManager
              captures: { eq1_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Bed eq2", kind: "BED", max_exposure_seconds: 600, turnaround_seconds: 600 }
              as: SalonManager
              captures: { eq2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Adult Three", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "III", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq1_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 100 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sess_a_id: $.data.id }
            - call: "POST /sessions/${sess_a_id}/start"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /sessions/${sess_a_id}/complete"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq2_id}", start_at: "2026-06-02T10:00:00Z", requested_seconds: 150 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sess_b_id: $.data.id, b_allowed: $.data.allowed_seconds }
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq1_id}", start_at: "2026-06-02T10:00:00Z", requested_seconds: 100 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sess_c_id: $.data.id }
            - call: "POST /sessions/${sess_c_id}/start"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /sessions/${sess_c_id}/complete"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /sessions/${sess_b_id}/start"
              payload: {}
              as: FrontDeskStaff
              captures: { b_status: $.data.status }
          assert:
            - "Session.${sess_b_id}.allowed_seconds == 150"
            - "Session.${sess_b_id}.status == IN_PROGRESS"
            - "Member.${m_id}.completed_uv_session_count == 2"

      - name: retail_total_per_line_then_sum_vs_sum_then_round
        grounds:
          - calculations.retail_order_total
          - entities.RetailOrder.fields.subtotal_cents
          - entities.MembershipPlan.fields.retail_discount_pct
        distinguishing_aspect: "On the RetailOrder money domain: per-line discount-then-round-then-sum yields subtotal_cents=4945, whereas the rejected sum-then-round interpretation would yield 4946 for the same two lines (1299x3 @0.10, 799x2 @0.10)."
        test_recipe:
          setup:
            - "Plan UNLIMITED with retail_discount_pct 0.10. One ACTIVE adult Member, account_credit_cents 0."
            - "Product A unit_price_cents 1299 stock 10; Product B unit_price_cents 799 stock 10."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, retail_discount_pct: 0.10, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A-1299", name: "Bronzer", unit_price_cents: 1299, initial_stock: 10 }
              as: SalonManager
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "B-0799", name: "Mist", unit_price_cents: 799, initial_stock: 10 }
              as: SalonManager
              captures: { prod_b: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Buyer One", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "POST /retail-orders"
              payload: { member_id: "${m_id}", lines: [ { product_id: "${prod_a}", quantity: 3 }, { product_id: "${prod_b}", quantity: 2 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id }
          assert:
            - "RetailOrder.${order_id}.subtotal_cents == 4945"
            - "RetailOrder.${order_id}.credit_applied_cents == 0"
            - "RetailOrder.${order_id}.charged_cents == 4945"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dose_nested_min_three_inputs
        grounds:
          - calculations.uv_dose_allowed_seconds
          - entities.Equipment.fields.max_exposure_seconds
          - entities.Member.fields.completed_uv_session_count
        distinguishing_aspect: "Mode (a): allowed_seconds = min(skin_base + completed_count*30, skin_cap, equipment_max) is a non-linear nested-min over three inputs; with skin V (base 240, cap 720) on equipment_max 100 and count 0 the equipment ceiling binds at 100, not the skin terms."
        test_recipe:
          setup:
            - "Plan UNLIMITED. One ACTIVE adult Member skin_type V (base 240, cap 720), count 0."
            - "Equipment max_exposure_seconds 100, turnaround 600."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Low cap bed", kind: "BED", max_exposure_seconds: 100, turnaround_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Five Adult", date_of_birth: "1985-01-01T00:00:00Z", skin_type: "V", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "WALK_IN", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 100 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, allowed: $.data.allowed_seconds }
          assert:
            - "Session.${sess_id}.allowed_seconds == 100"
            - "Session.${sess_id}.status == RESERVED"

      - name: retail_rounding_order_per_line_then_sum
        grounds:
          - calculations.retail_order_total
          - entities.RetailOrder.fields.subtotal_cents
          - entities.Product.fields.unit_price_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — round each discounted line to whole cents THEN sum gives 3507+1438=4945; the sum-then-round alternative gives 4946, so the scaffold's pinned per-line order is observable."
        test_recipe:
          setup:
            - "Plan PREMIUM with retail_discount_pct 0.10. One ACTIVE adult Member, account_credit 0."
            - "Product A 1299 stock 5; Product B 799 stock 5."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "PREMIUM", monthly_fee_cents: 8000, retail_discount_pct: 0.10, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RA-1299", name: "Lotion", unit_price_cents: 1299, initial_stock: 5 }
              as: SalonManager
              captures: { prod_a: $.data.id }
            - call: "POST /products"
              payload: { sku: "RB-0799", name: "Spray", unit_price_cents: 799, initial_stock: 5 }
              as: SalonManager
              captures: { prod_b: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Round Buyer", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "POST /retail-orders"
              payload: { member_id: "${m_id}", lines: [ { product_id: "${prod_a}", quantity: 3 }, { product_id: "${prod_b}", quantity: 2 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id }
          assert:
            - "RetailOrder.${order_id}.subtotal_cents == 4945"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_parallel_lifecycle_and_billing_dimensions
        grounds:
          - state_machines.Member.field.status
          - state_machines.Member.field.billing_status
          - state_machines.Member.CURRENT_to_PAST_DUE
        distinguishing_aspect: "On Member: status (ACTIVE) and billing_status (CURRENT->PAST_DUE) are independent parallel dimensions — a declined EFT moves billing_status to PAST_DUE while status remains ACTIVE, so the two axes evolve on the same row independently."
        test_recipe:
          setup:
            - "Plan BASIC 3000. One ACTIVE member, cycle_anchor 2026-06-01T00:00:00Z."
            - "Clock advanced to 2026-07-02T00:00:00Z (>= anchor+30d). EFT run returns DECLINED."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Billing Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: BillingSystem
          trigger:
            - call: "POST /_billing/run-eft"
              payload: { member_id: "${m_id}", outcome: "DECLINED" }
              as: BillingSystem
              captures: { st: $.data.status, bst: $.data.billing_status }
          assert:
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.billing_status == PAST_DUE"

      - name: session_cyclic_reserve_cancel_reserve_slot_reuse
        grounds:
          - state_machines.Session.RESERVED_to_CANCELLED
          - state_machines.Session.field.status
          - validations[priority=13]
        distinguishing_aspect: "On Session: the lifecycle is cyclic — after RESERVED->CANCELLED the freed equipment slot can be re-RESERVED by a fresh session at the identical interval, which would otherwise collide via ERR_EQUIPMENT_SLOT_CONFLICT."
        test_recipe:
          setup:
            - "Plan UNLIMITED. One ACTIVE adult Member skin IV. Equipment max 600 turnaround 600."
            - "Member reserves UV session S1 at 2026-06-15T10:00:00Z req 120, then cancels it."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Cycle bed", kind: "BED", max_exposure_seconds: 600, turnaround_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Cycle Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-15T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /sessions/${s1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-15T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s2_id: $.data.id }
          assert:
            - "Session.${s1_id}.status == CANCELLED"
            - "Session.${s2_id}.status == RESERVED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: uv_complete_bumps_counter_trips_maintenance
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - calculations.equipment_service_due
          - state_machines.Equipment.IN_USE_to_MAINTENANCE
        distinguishing_aspect: "Depth-3 chain from Session complete: A) Session->COMPLETED causes B) Equipment.sessions_since_service increments to 2, and B's reaching SERVICE_THRESHOLD=2 causes C) Equipment.status->MAINTENANCE; each link is caused by the previous, not by the original trigger."
        test_recipe:
          setup:
            - "Plan UNLIMITED. One ACTIVE adult Member skin IV. Equipment max 600 turnaround 600 SERVICE_THRESHOLD=2."
            - "Member completes UV session A at 2026-06-01T10:00:00Z (counter -> 1, equipment stays AVAILABLE)."
            - "Member reserves+starts UV session B on same unit at 2026-06-02T10:00:00Z (24h cooldown satisfied)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Service bed", kind: "BED", max_exposure_seconds: 600, turnaround_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Service Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /sessions/${sa_id}/start"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /sessions/${sa_id}/complete"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-02T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sb_id: $.data.id }
            - call: "POST /sessions/${sb_id}/start"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /sessions/${sb_id}/complete"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "Session.${sb_id}.status == COMPLETED"
            - "Equipment.${eq_id}.sessions_since_service == 2"
            - "Equipment.${eq_id}.status == MAINTENANCE"
            - "Member.${m_id}.completed_uv_session_count == 2"

      - name: refund_returns_credit_then_redefers_revenue
        grounds:
          - state_machines.RetailOrder.PAID_to_REFUNDED
          - entities.Member.fields.account_credit_cents
          - entities.SalonLedger.fields.deferred_revenue_cents
        distinguishing_aspect: "Depth-3 chain from RetailOrder refund (different trigger than the complete cascade): A) order->REFUNDED causes B) Member.account_credit_cents increases by credit_applied_cents, and B's restoration causes C) SalonLedger.deferred_revenue_cents increases by the same amount (re-deferred)."
        test_recipe:
          setup:
            - "Plan UNLIMITED retail_discount 0. One ACTIVE Member with account_credit 4000 (from a prior freeze) — see chain."
            - "Member is FROZEN to mint 4000 credit, then unfrozen back to ACTIVE so it can purchase."
            - "Product P unit_price 1000 stock 10. Order draws 1000 credit (credit_applied=1000, charged=0)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, retail_discount_pct: 0, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RF-1000", name: "Tonic", unit_price_cents: 1000, initial_stock: 10 }
              as: SalonManager
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Refund Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_after_activate: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members/${m_id}/freeze"
              payload: { expected_member_version: "${v_after_activate}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_after_freeze: $.data.version }
            - call: "POST /members/${m_id}/unfreeze"
              payload: { expected_member_version: "${v_after_freeze}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /retail-orders"
              payload: { member_id: "${m_id}", lines: [ { product_id: "${prod_id}", quantity: 1 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id, credit_used: $.data.credit_applied_cents }
          trigger:
            - call: "POST /retail-orders/${order_id}/refund"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "RetailOrder.${order_id}.status == REFUNDED"
            - "RetailOrder.${order_id}.credit_applied_cents == 1000"
            - "Member.${m_id}.account_credit_cents == 4000"
            - "SalonLedger.SALON.deferred_revenue_cents == 4000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: skin_prohibited_beats_slot_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_SKIN_TYPE_UV_PROHIBITED]
        distinguishing_aspect: "Error-category pair business_safety (priority 7, skin type I UV prohibited) vs business_temporal (priority 13, equipment slot conflict): a skin-I member booking an already-occupied UV slot fails with ERR_SKIN_TYPE_UV_PROHIBITED, not ERR_EQUIPMENT_SLOT_CONFLICT."
        test_recipe:
          setup:
            - "Plan UNLIMITED. Equipment max 600 turnaround 600 with an existing RESERVED UV session by another adult member occupying 2026-06-15T10:00:00Z..10:02:00Z."
            - "A second ACTIVE member with skin_type I books an overlapping UV slot on the same unit."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
