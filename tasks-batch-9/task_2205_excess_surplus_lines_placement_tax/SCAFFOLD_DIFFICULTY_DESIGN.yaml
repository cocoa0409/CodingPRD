              captures: { policy_id: $.data.id }
            - call: "POST /placements"
              payload: { insured_name: "Golden Bear Fabricators LLC", principal_place_of_business_state: "CA", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 300000000 }, { state_code: "NV", insured_value_cents: 300000000 }, { state_code: "CA", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_ca_id: $.data.id }
            - call: "POST /placements/${placement_ca_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_ca_id}/declinations"
              payload: { admitted_carrier_name: "Golden State Admitted Mutual", state_code: "CA", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_ca_id}/declinations"
              payload: { admitted_carrier_name: "Sierra Standard Insurance", state_code: "CA", reason_code: "CAPACITY", declined_on: "2026-07-12T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_ca_id}/declinations"
              payload: { admitted_carrier_name: "Pacific Mutual Casualty", state_code: "CA", reason_code: "UNDERWRITING", declined_on: "2026-07-14T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_ca_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_ca_v: $.data.version }
            - call: "POST /policies"
              payload: { placement_id: "${placement_ca_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0002", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 25000, broker_fee_cents: 50000, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_ca_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { policy_ca_id: $.data.id }
          trigger:
            - &c_calc_tax
              call: "POST /policies/${policy_id}/calculate-tax"
              payload: {}
