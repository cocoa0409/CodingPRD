          - errors[ERR_GEAR_NOT_SERVICEABLE]
          - entities.RiggingGear.fields.status
          - entities.GearAssignment.fields.effective_wll_lb
        distinguishing_aspect: |
          A DIFFERENT entity pair from the permit gate — GearAssignment -> RiggingGear: newly
          registered gear starts DUE_INSPECTION, so the assignment is rejected with
          ERR_GEAR_NOT_SERVICEABLE, and the identical call succeeds only after a PASS inspection
          flips the gear to SERVICEABLE.
        test_recipe:
          setup:
            - "A surveyed lift plan exists."
