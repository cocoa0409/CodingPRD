# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index (breadth probe)
# Airport Center Operations & Volunteer Staffing
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: center_create_returns_defaults
        claim_type: creation
        grounds: [entities.Center]
        distinguishing_aspect: "POST /centers with the four required inputs returns 201 with computed/system fields at their defaults."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /centers"
              payload: { name: "Tau Center", airport_code: "PHL", occupancy_cap: 25, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_posture: $.data.posture, c_occ: $.data.current_occupancy, c_ratio: $.data.coverage_ratio, c_ops: $.data.ops_run_count, c_v: $.data.version }
          assert:
            - "Center.${c_id}.posture == CLOSED (no ACTIVE agreement)"
            - "current_occupancy == 0, coverage_ratio == 0, ops_run_count == 0, version == 1"
            - "active_agreement_id is null"
      - name: volunteer_register_initial_applied
        claim_type: creation
        grounds: [entities.Volunteer]
        distinguishing_aspect: "POST /volunteers as Anonymous returns 201 with status APPLIED and zeroed counters."
        test_recipe:
          setup: ["Center exists to reference as home_center_id"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Upsilon Center", airport_code: "MDW", occupancy_cap: 25, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /volunteers"
              payload: { full_name: "V New", email: "vn@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_status: $.data.status, v_strikes: $.data.no_show_strikes, v_hours: $.data.total_hours }
          assert:
            - "Volunteer.${v_id}.status == APPLIED"
            - "no_show_strikes == 0 and total_hours == 0"
      - name: guest_register_default_eligible
        claim_type: defaults
        grounds: [entities.Guest]
        distinguishing_aspect: "Guest registration defaults eligibility_status to ELIGIBLE even with a far-future verification date."
        test_recipe:
          setup: ["Clock 2026-09-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /guests"
              payload: { full_name: "G New", category: "GUARD_RESERVE", verification_expires_on: "2028-05-01" }
              as: Anonymous
              captures: { g_id: $.data.id, g_status: $.data.eligibility_status }
          assert:
            - "Guest.${g_id}.eligibility_status == ELIGIBLE"
      - name: get_center_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Center
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown center id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database beyond clock default"]
          setup_api_calls: []
          trigger:
            - call: "GET /centers/00000000-0000-0000-0000-000000000000"
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"
      - name: center_create_missing_required_returns_400
        claim_type: required_fields
        grounds:
          - entities.Center
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required input airport_code yields ERR_VALIDATION (400) before any existence or business check."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "No Code Center", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (missing airport_code)"
      - name: shift_assignments_filtered_by_volunteer
        claim_type: listing
        grounds: [entities.ShiftAssignment.fields.volunteer_id, entities.ShiftAssignment.fields.shift_id]
        distinguishing_aspect: "GET /shift-assignments?volunteer_id=X returns exactly X's assignments (FK-filtered list), not the whole table."
        test_recipe:
          setup:
            - "Center with ACTIVE agreement; volunteers v1, v2 cleared; one shift 2026-09-03 08:00-12:00 capacity 2; both assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Phi Center", airport_code: "MCI", occupancy_cap: 25, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 500, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V One", email: "v1@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v1_id: $.data.id, v1_v: $.data.version }
            - call: "POST /volunteers/${v1_id}/screenings"
              payload: { expected_volunteer_version: "${v1_v}" }
              as: CenterManager
              captures: { s1_id: $.data.id }
            - call: "POST /screenings/${s1_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s1_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /volunteers"
              payload: { full_name: "V Two", email: "v2@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v2_id: $.data.id, v2_v: $.data.version }
            - call: "POST /volunteers/${v2_id}/screenings"
              payload: { expected_volunteer_version: "${v2_v}" }
              as: CenterManager
              captures: { s2_id: $.data.id }
            - call: "POST /screenings/${s2_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s2_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-03T08:00:00Z", end_at: "2026-09-03T12:00:00Z", role_required: "DESK", capacity: 2 }
              as: CenterManager
              captures: { sh_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v1_id}" }
              as: CenterManager
              captures: { as1_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v2_id}" }
              as: CenterManager
              captures: { as2_id: $.data.id }
          trigger:
            - call: "GET /shift-assignments"
              payload: { volunteer_id: "${v1_id}" }
              as: CenterManager
              captures: { page: $.data }
          assert:
            - "every returned ShiftAssignment has volunteer_id == ${v1_id}"
            - "exactly 1 row returned (${as1_id}); ${as2_id} not present"

  - section: state_machines
    instances:
      - name: screening_double_claim_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BackgroundScreening.SUBMITTED_to_IN_REVIEW
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Claiming an already IN_REVIEW screening is an invalid from-state transition: the second claim returns ERR_INVALID_STATE and claimed_by_user_id is unchanged."
        test_recipe:
          setup: ["Center; volunteer; open screening SUBMITTED; mgr-1 has claimed it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Chi Center", airport_code: "OAK", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "V Claim", email: "vc@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-3"
              captures: { err: $.data.error_id }
          assert:
            - "second claim rejected with ERR_INVALID_STATE (SUBMITTED -> IN_REVIEW already taken)"
            - "BackgroundScreening.${s_id}.claimed_by_user_id == mgr-1 (unchanged)"
      - name: screening_decide_before_claim_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BackgroundScreening.IN_REVIEW_to_CLEARED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Decide on a SUBMITTED (never claimed) screening fails: IN_REVIEW is the only valid from-state."
        test_recipe:
          setup: ["Center; volunteer; screening SUBMITTED, unclaimed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Psi Center", airport_code: "SMF", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "V Early", email: "ve@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
              captures: { err: $.data.error_id }
          assert:
            - "decide rejected with ERR_INVALID_STATE (from-state SUBMITTED not allowed)"
            - "BackgroundScreening.${s_id}.status == SUBMITTED"
      - name: event_confirm_after_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Event.PLANNED_to_CANCELLED
          - state_machines.Event.PLANNED_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal: confirm on a cancelled event returns ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Center; DEPLOYMENT event (min_volunteers 0) created then cancelled"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Omega Center", airport_code: "COS", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "DEPLOYMENT", name: "Unit 5 Departure", start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T10:00:00Z", min_volunteers: 0 }
              as: CenterManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/cancel"
              as: CenterManager
          trigger:
            - call: "POST /events/${ev_id}/confirm"
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "confirm on CANCELLED event rejected with ERR_INVALID_STATE"
            - "Event.${ev_id}.status == CANCELLED (read via GET /centers/${c_id}/events)"
      - name: shift_fills_at_capacity_auto
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shift.OPEN_to_FILLED
          - entities.Shift.fields.confirmed_count
        distinguishing_aspect: "The OPEN -> FILLED auto-transition fires exactly when confirmed_count reaches capacity (1), with no manual shift operation."
        test_recipe:
          setup: ["Center with ACTIVE agreement; volunteer cleared; shift tomorrow capacity 1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Aleph Center", airport_code: "BWI", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 500, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V Fill", email: "vf@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-02T08:00:00Z", end_at: "2026-09-02T12:00:00Z", role_required: "DESK", capacity: 1 }
              as: CenterManager
              captures: { sh_id: $.data.id, sh_status0: $.data.status }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v_id}" }
              as: CenterManager
              captures: { as_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${as_id}/confirm"
              as: Volunteer
              as_user_id: "${v_id}"
            - call: "GET /shifts/${sh_id}"
              as: CenterManager
              captures: { sh_status1: $.data.status, sh_count1: $.data.confirmed_count }
          assert:
            - "Shift.${sh_id}.status == OPEN at creation (${sh_status0})"
            - "after the single confirm: confirmed_count == 1 and status == FILLED"
      - name: event_initial_status_branch
        claim_type: initial_state
        grounds:
          - state_machines.Event
        excluded_because:
          difficulty_instance: event_tour_branch_vs_deploy
          rationale: "DEPLOYMENT starts PLANNED and ENTERTAINMENT_TOUR starts SECURITY_REVIEW are both asserted in the named §1.8 instance's first assert line."
      - name: lot_depleted_consume_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DonationLot.AVAILABLE_to_DEPLETED
        excluded_because:
          difficulty_instance: consume_exact_depletion_boundary
          rationale: "Consume-after-depletion ERR_INVALID_STATE is the second trigger of the named §1.8 boundary instance."

  - section: calculations
    instances:
      - name: fefo_head_enforced
        claim_type: violation_to_error
        grounds:
          - calculations.fefo_issue_order
          - "errors[ERR_FEFO_VIOLATION]"
        distinguishing_aspect: "Chronological FEFO order: consuming the later-expiry lot while an earlier-expiry lot holds stock is rejected; consuming the head succeeds."
        test_recipe:
          setup: ["Center with ACTIVE agreement; lot A expiry 2026-09-20 qty 5; lot B expiry 2026-09-10 qty 5"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Beth Center", airport_code: "DAL", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "chips", category: "FOOD", received_qty: 5, expiry_date: "2026-09-20", declared_value_cents: 300 }
              as: CenterManager
              captures: { lotA: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "fruit cups", category: "FOOD", received_qty: 5, expiry_date: "2026-09-10", declared_value_cents: 300 }
              as: CenterManager
              captures: { lotB: $.data.id }
          trigger:
            - call: "POST /donation-lots/${lotA}/consume"
              payload: { quantity: 1 }
              as: CenterManager
              captures: { err: $.data.error_id }
            - call: "POST /donation-lots/${lotB}/consume"
              payload: { quantity: 1 }
              as: CenterManager
              captures: { b_remaining: $.data.remaining_qty }
          assert:
            - "consume of lot A (expiry 09-20) rejected ERR_FEFO_VIOLATION while lot B (09-10) has stock"
            - "consume of lot B succeeds: remaining_qty == 4"
      - name: fefo_tiebreak_earliest_created
        claim_type: correct_result
        grounds:
          - calculations.fefo_issue_order
        distinguishing_aspect: "Equal expiry dates tie-break by created_at ASC (never id): the earlier-created lot is the head and the later-created one is rejected."
        test_recipe:
          setup: ["Center; lots C and D both expiry 2026-09-15, C created before D"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Gimel Center", airport_code: "HRL", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "soap", category: "HYGIENE", received_qty: 3, expiry_date: "2026-09-15", declared_value_cents: 100 }
              as: CenterManager
              captures: { lotC: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "soap", category: "HYGIENE", received_qty: 3, expiry_date: "2026-09-15", declared_value_cents: 100 }
              as: CenterManager
              captures: { lotD: $.data.id }
          trigger:
            - call: "POST /donation-lots/${lotD}/consume"
              payload: { quantity: 1 }
              as: CenterManager
              captures: { err: $.data.error_id }
            - call: "POST /donation-lots/${lotC}/consume"
              payload: { quantity: 1 }
              as: CenterManager
              captures: { c_remaining: $.data.remaining_qty }
          assert:
            - "consume of lot D rejected ERR_FEFO_VIOLATION (lot C is head via created_at tie-break)"
            - "consume of lot C succeeds: remaining_qty == 2"
      - name: waterfall_allocation_order
        claim_type: correct_result
        grounds:
          - calculations.expense_waterfall
        distinguishing_aspect: "Waterfall debits in spend_by_date ASC order: a 600-cent expense over grants 500 (spend_by 2026-10-01) and 700 (spend_by 2026-11-01) debits 500 then 100, exhausting the first grant."
        test_recipe:
          setup: ["Center with ACTIVE agreement; grant A 500 cents spend_by 2026-10-01; grant B 700 cents spend_by 2026-11-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Dalet Center", airport_code: "OKC", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor A", amount_cents: 500, spend_by_date: "2026-10-01" }
              as: PlatformAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor B", amount_cents: 700, spend_by_date: "2026-11-01" }
              as: PlatformAdmin
              captures: { gb_id: $.data.id }
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 600, description: "coffee restock", expected_center_version: "${cv}" }
              as: CenterManager
              captures: { posted: $.data.posted_cents, debits: $.data.debits }
          assert:
            - "posted_cents == 600"
            - "debits[0] allocates 500 to grant ${ga_id} (earlier spend_by first); debits[1] allocates 100 to grant ${gb_id}"
            - "grant A: spent_cents == 500, remaining_cents == 0, status EXHAUSTED (via GET /centers/${c_id}/funding-grants)"
            - "grant B: spent_cents == 100, remaining_cents == 600, status ACTIVE"
      - name: waterfall_insufficient_all_or_nothing
        claim_type: violation_to_error
        grounds:
          - calculations.expense_waterfall
          - "errors[ERR_BUDGET_EXCEEDED]"
        distinguishing_aspect: "Aggregate validation: amount 501 exceeds total remaining 500 -> ERR_BUDGET_EXCEEDED and zero debits (no partial posting)."
        test_recipe:
          setup: ["Center; single grant 500 cents spend_by 2026-12-31"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "He Center", airport_code: "TUL", occupancy_cap: 25, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor C", amount_cents: 500, spend_by_date: "2026-12-31" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 501, description: "over budget", expected_center_version: "${cv}" }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BUDGET_EXCEEDED"
            - "grant ${g_id} spent_cents == 0 afterwards (all-or-nothing; read via GET /centers/${c_id}/funding-grants)"
      - name: waterfall_exact_total_boundary
