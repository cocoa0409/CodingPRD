        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-01T00:00:00Z'
          closes_at: '2027-03-10T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v}
        as: SugarhouseManager
        captures:
          win1_id: $.data.id
      - call: GET /sugarhouse/seasons/${season_id}
        as: SugarhouseManager
        captures:
          season_v2: $.data.version
      trigger:
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-09T12:00:00Z'
          closes_at: '2027-03-12T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v2}
        as: SugarhouseManager
        captures:
          err: $.data.error_id
      - call: POST /sugarhouse/weather-windows
        payload:
          season_id: ${season_id}
          opens_at: '2027-03-10T00:00:00Z'
          closes_at: '2027-03-15T00:00:00Z'
          forecast_min_f: 28.0
          forecast_max_f: 42.0
          expected_season_version: ${season_v2}
        as: SugarhouseManager
        captures:
          win3_id: $.data.id
      assert:
      - 'overlapping window: error_id == ERR_WINDOW_OVERLAP (HTTP 409)'
      - "adjacent window (opens_at == W1.closes_at) succeeds: 201, status FORECAST \u2014 half-open semantics treat zero-gap adjacency as non-overlap"
  - name: cert_audit_fourteen_day_buffer
    grounds:
    - errors[ERR_AUDIT_TOO_CLOSE]
    distinguishing_aspect: 'Different interval semantics on a different resource: CertAudits on a

      Sugarbush enforce a 14-day minimum BUFFER between scheduled dates

      (not half-open interval intersection). 13 days apart is rejected;

      exactly 14 days apart is accepted.

