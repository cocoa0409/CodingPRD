      - name: calc_fee_ledger_running_balance_after_two_settlements
        claim_type: correct_result
        grounds:
          - "calculations.member_fee_balance_invariant"
          - "entities.FeeLedgerEntry.fields.amount_cents"
          - "entities.FeeLedgerEntry.fields.balance_after_cents"
          - "entities.Member.fields.outstanding_fee_cents"
          - "endpoints.POST /members/{member_id}/fee-settlements"
        distinguishing_aspect: >-
          outstanding_fee_cents is the signed sum of the member's entries, and balance_after_cents is the running
          sum in created_at ASC order, so the 9000-cent DAMAGE_FEE followed by settlements of 4000 and 5000 must
          produce amount_cents -4000 with balance_after_cents 5000 and then amount_cents -5000 with
          balance_after_cents 0. The settlement endpoint takes a POSITIVE amount_cents and must persist it negated
          with direction CREDIT; no entry is ever mutated, so the ledger ends with exactly three rows.
