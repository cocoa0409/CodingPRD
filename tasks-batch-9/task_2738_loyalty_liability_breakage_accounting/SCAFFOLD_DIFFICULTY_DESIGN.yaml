            - "INVARIANT: LoyaltyProgram.${prog_id}.recognized_breakage_ytd_cents == -188 again, byte-identical to its pre-soft-close value - zero drift, because the figure sums only SOFT_CLOSED and HARD_CLOSED periods"
            - "AccountingPeriod.${per1_id} is entirely unaffected: state HARD_CLOSED, closing_liability_cents 2120, breakage_recognized_cents -188, reopen_count 0 - the compensation is scoped to the reopened period"
            - "BreakageEstimate.${e2_id}.state is still APPROVED and LoyaltyProgram.${prog_id}.current_breakage_rate_bp is still 2739 - reopening a period never retracts the estimate that backed it"
            - "PointLot.${lot1_id}.points_remaining == 2000 and PointLot.${lot2_id}.points_remaining == 266 across the whole trigger - close and reopen are pure liability-ledger operations"
