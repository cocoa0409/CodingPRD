        test_recipe:
          setup:
            - "Sponsor EXPERIENCED, APPROVED, advance_eligible, with NO sites at all."
            - "One DRAFT SponsorBudget requesting operating 5000000 and admin 800000."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
