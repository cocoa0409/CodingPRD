              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sod3}", reporter_type: "BUYER", evidence_reference: "EV-SOD3-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { a1_ver: $.data.version, a1_state: $.data.state }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our supplier feed mapped compatibility attributes onto the wrong parent listing.", corrective_measures: ["Corrected the attribute mapping for every affected listing"], preventive_measures: ["Nightly automated diff of the feed against the published catalogue"], expected_enforcement_action_version: "${a1_ver}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { poa1: $.data.id, poa1_state: $.data.state }
          trigger:
            - call: "POST /plans-of-action/${poa1}/review"
              payload: { decision: "ACCEPT", review_notes: "Reviewing the action I issued." }
              as: ComplianceOfficer
              as_user_id: "inv-1"
              captures: { e_review: $.data.error_id }
            - call: "POST /plans-of-action/${poa1}/review"
              payload: { decision: "ACCEPT", review_notes: "Root cause and both measure sets are specific and verifiable." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { poa1_final: $.data.state, poa1_reviewer: $.data.reviewed_by_user_id }
          assert:
            - "${rule_sod3_poa} == true, ${a1_state} == ISSUED and ${poa1_state} == SUBMITTED"
            - "${e_review} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the officer role is permitted, the human is not"
            - "PlanOfAction.${poa1} is still SUBMITTED and reviewed_by_user_id is null after the refusal"
            - "the second call: HTTP 200, ${poa1_final} == ACCEPTED and ${poa1_reviewer} == co-1"

      - name: rbac_hold_creator_cannot_release_the_hold_it_opened
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority 60]"
          - "endpoints[POST /disbursement-holds/{id}/release]"
          - "entities.DisbursementHold.fields.created_by_user_id"
        distinguishing_aspect: |
          Money released back to a seller needs a second pair of eyes, so the guard compares X-User-ID
          against the hold's created_by_user_id even though the two operations belong to two different
          roles: the same human wearing PolicyInvestigator to open and ComplianceOfficer to release is
          exactly the loophole the rule closes, and it is the only segregation check in the domain that
          keys on a hold rather than on an action or an appeal.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-SOD4-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 cents; one violation UNDER_INVESTIGATION so the posture is RESERVE_HELD."
            - "inv-1 opens a ROLLING reserve: TIER_1 at 10% of 100000 = 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SOD4-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sod4: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sod4}", reporter_type: "BUYER", evidence_reference: "EV-SOD4-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_creator: $.data.created_by_user_id, h1_amount: $.data.held_amount_cents }
          trigger:
            - call: "POST /disbursement-holds/${h1}/release"
              payload: { release_reason: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "inv-1"
              captures: { e_release: $.data.error_id }
            - call: "POST /disbursement-holds/${h1}/release"
              payload: { release_reason: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { h1_state: $.data.state, h1_reason: $.data.release_reason }
          assert:
            - "${h1_creator} == inv-1 and ${h1_amount} == 10000"
            - "${e_release} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "after the refusal DisbursementHold.${h1}.state is still ACTIVE and Seller.${s_id}.held_balance_cents == 10000"
            - "the second call: HTTP 200, ${h1_state} == RELEASED and ${h1_reason} == MANUAL"
            - "Seller.${s_id}.available_balance_cents == 100000 and held_balance_cents == 0"
            - "Seller.${s_id}.disbursement_state is still RESERVE_HELD — the investigation is still open, only the hold is gone"

  # =========================================================================
  # SECTION 8 — Cross-cutting complexity layers (§1.2 / §1.2.1)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_hold_creation_is_refused_on_a_stale_seller_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[hold-create-stale-seller]"
          - "endpoints[POST /disbursement-holds].input"
          - "errors[ERR_STALE_SELLER_VERSION]"
        distinguishing_aspect: |
          The reserve amount is derived from the seller's balance and risk tier, so a hold computed
          against a version the caller no longer holds would freeze the wrong number of cents. The
          probe interleaves a credit between the read and the write: the version the investigator
          captured is one behind, the write must fail with 412 and file nothing, and the retry against
          the refreshed version must produce the reserve for the NEW balance (15000, not 10000).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-OCC1-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000; one violation opened for investigation so the posture is RESERVE_HELD."
            - "The investigator reads version v_stale, then the officer credits a further 50000, bumping the version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-OCC1-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_occ1: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_occ1}", reporter_type: "BUYER", evidence_reference: "EV-OCC1-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv_stale: $.data.version, avail_before: $.data.available_balance_cents }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 50000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sv_after_credit: $.data.version, avail_after: $.data.available_balance_cents }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv_stale}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv_fresh: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv_fresh}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents }
          assert:
            - "${avail_before} == 100000, ${avail_after} == 150000 and ${sv_after_credit} == ${sv_stale} + 1"
            - "first trigger: HTTP 412 and ${e_stale} == ERR_STALE_SELLER_VERSION"
            - "no DisbursementHold row exists after the refusal and Seller.${s_id}.held_balance_cents == 0"
            - "the refused call did NOT bump the version: ${sv_fresh} == ${sv_after_credit}"
            - "retry: HTTP 201 and ${h1_amount} == 15000   # 10% of the NEW 150000 balance, never 10000"
            - "Seller.${s_id}.available_balance_cents == 135000 and version == ${sv_fresh} + 1"

      - name: occ_plan_submission_is_refused_on_a_stale_action_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[poa-create-stale-action]"
          - "endpoints[POST /plans-of-action].input"
          - "errors[ERR_STALE_ACTION_VERSION]"
        distinguishing_aspect: |
          The plan's deadline and revision budget hang off the action, so a submission must be rejected
          when the action moved underneath it. The interleaving mutation here is the seller's OWN
          acknowledgement — the same actor invalidates its own snapshot, which is the case a naive
          implementation misses because it only guards against operator writes. The refusal must not
          consume the single "one open plan per action" slot.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-OCC2-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true)."
            - "inv-1 issues the action; the seller reads version v_stale, then acknowledges it, bumping the version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-OCC2-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_occ2: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_occ2}", reporter_type: "BUYER", evidence_reference: "EV-OCC2-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, av_stale: $.data.version, a1_issued: $.data.issued_at }
            - call: "POST /enforcement-actions/${a1}/acknowledge"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { a1_ack_state: $.data.state, av_after_ack: $.data.version }
          trigger:
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our supplier feed mapped compatibility attributes onto the wrong parent listing.", corrective_measures: ["Corrected the attribute mapping for every affected listing"], preventive_measures: ["Nightly automated diff of the feed against the published catalogue"], expected_enforcement_action_version: "${av_stale}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e_stale_action: $.data.error_id }
            - call: "GET /enforcement-actions/${a1}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { av_fresh: $.data.version }
            - call: "POST /plans-of-action"
              payload: { enforcement_action_id: "${a1}", root_cause: "Our supplier feed mapped compatibility attributes onto the wrong parent listing.", corrective_measures: ["Corrected the attribute mapping for every affected listing"], preventive_measures: ["Nightly automated diff of the feed against the published catalogue"], expected_enforcement_action_version: "${av_fresh}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { poa1: $.data.id, poa1_state: $.data.state, poa1_revisions: $.data.revision_count, poa1_deadline: $.data.deadline_at }
          assert:
            - "${a1_ack_state} == ACKNOWLEDGED and ${av_after_ack} == ${av_stale} + 1"
            - "first trigger: HTTP 412 and ${e_stale_action} == ERR_STALE_ACTION_VERSION"
            - "not ERR_POA_ALREADY_OPEN and not ERR_INVALID_STATE — the version check runs before the plan-slot check"
            - "no PlanOfAction row exists after the refusal, and ${av_fresh} == ${av_after_ack} (the refusal bumped nothing)"
            - "retry: HTTP 201, ${poa1_state} == SUBMITTED, ${poa1_revisions} == 0"
            - "EnforcementAction.${a1}.version == ${av_fresh} + 1"
            - "${a1_issued} == 2026-08-01T00:00:00.000Z and ${poa1_deadline} == 2026-08-18T00:00:00.000Z   # + POA_DEADLINE_DAYS 17"

      - name: cc_layer_suspension_side_effects_reach_every_dependent_row
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.cascading_side_effects"
          - "endpoints[POST /enforcement-actions].side_effects"
        excluded_because:
          difficulty_instance: transitive_cascade / suspension_cascade_walks_listings_posture_holds_and_balances
          rationale: "That §1.8 instance walks the whole four-hop cascade — listings, both posture dimensions, the release-then-mint hold sequence and the ledger — in one instance."

      - name: cc_layer_two_defensible_readings_of_the_same_inputs
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.dual_variant_calculations"
          - "calculations.order_defect_rate"
          - "calculations.reserve_requirement_cents"
        excluded_because:
          difficulty_instance: dual_variant_calc / odr_provisional_vs_final_diverge_on_two_snapshot_window
          rationale: "The §1.8 dual-variant instances construct input sets on which the two readings of the ODR and of the reserve basis produce different numbers, which is the only way to prove the declared variant was chosen."

      - name: cc_layer_rate_crossing_a_threshold_fires_the_downstream_chain
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.rate_threshold_triggers"
          - "calculations.metric_tier"
          - "endpoints[POST /sellers/{id}/health-evaluations].side_effects"
        excluded_because:
          difficulty_instance: boundary_precision_check / odr_exactly_at_breach_threshold_breaches_and_one_unit_below_does_not
          rationale: "That §1.8 instance pins the inclusive boundary of the rate trigger and the auto-violation chain it fires, one defect unit apart."

  # =========================================================================
  # SECTION 9 — Consistency model (§1.0)
  # =========================================================================
  - section: consistency_model
    instances:

      - name: consistency_every_cascade_effect_is_readable_in_the_same_breath
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /enforcement-actions].side_effects"
          - "response_envelope"
        distinguishing_aspect: |
          The domain is strictly read-your-writes: nothing is queued, retried or reconciled later, so
          the single issuance response must already carry every computed field, and the very next reads
          — with no clock movement and no other call in between — must show the completed cascade
          across five entities. The counterpart claim is that the cascade costs exactly ONE version
          increment on the seller, not one per touched row, which is what distinguishes an atomic
          transaction from a chain of independent writes.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; rule LA-CONS-1 (LISTING_ACCURACY, base_severity_weight 12.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 with one ACTIVE listing."
            - "A second violation is opened for investigation so the posture is RESERVE_HELD and inv-1 can open a 10000 ROLLING reserve first."
            - "The suspension violation is then substantiated; the seller version is recorded immediately before issuance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-CONS-1", category: "LISTING_ACCURACY", base_severity_weight: 12.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_cons: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-CONS-0001", title: "18V Cordless Drill", category_code: "TOOLS" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id, l1_state: $.data.state }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_cons}", reporter_type: "BUYER", evidence_reference: "EV-CONS-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_open: $.data.id }
            - call: "POST /violations/${v_open}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv0: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-02T00:00:00.000Z", coverage_end: "2026-08-05T00:00:00.000Z", expected_seller_version: "${sv0}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h_prior: $.data.id, h_prior_amount: $.data.held_amount_cents }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_cons}", reporter_type: "BUYER", evidence_reference: "EV-CONS-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_susp: $.data.id }
            - call: "POST /violations/${v_susp}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v_susp}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv_before: $.data.version, posture_before: $.data.disbursement_state, held_before: $.data.held_balance_cents }
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v_susp}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_type: $.data.action_type, a1_points: $.data.severity_points_applied, a1_rung: $.data.ladder_rung_computed, a1_removed: $.data.removed_listing_count }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { enf_after: $.data.enforcement_state, disb_after: $.data.disbursement_state, avail_after: $.data.available_balance_cents, held_after: $.data.held_balance_cents, sv_after: $.data.version, bal_after: $.data.severity_points_balance }
            - call: "GET /sellers/${s_id}/listings"
              payload: { state: "SUPPRESSED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { supp_id: "$.data[0].id", supp_flag: "$.data[0].suppressed_by_suspension" }
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { auto_hold: "$.data[0].id", auto_type: "$.data[0].hold_type", auto_amount: "$.data[0].held_amount_cents", auto_created: "$.data[0].auto_created" }
            - call: "GET /sellers/${s_id}/notifications"
              payload: { template_code: "FUNDS_HELD" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { funds_note_amount: "$.data[0].amount_cents" }
          assert:
            - "${l1_state} == ACTIVE, ${h_prior_amount} == 10000, ${posture_before} == RESERVE_HELD, ${held_before} == 10000"
            - "the issuance RESPONSE ITSELF already carries the computed cascade inputs: ${a1_points} == 12.00, ${a1_rung} == ACCOUNT_SUSPENSION, ${a1_type} == ACCOUNT_SUSPENSION, ${a1_removed} == 0"
            - "immediately after, with no clock movement: ${enf_after} == SUSPENDED, ${disb_after} == FULL_HOLD, ${bal_after} == 12.00"
            - "${supp_id} == ${l1} and ${supp_flag} == true — the listing sweep is visible on the next read"
            - "the prior hold is already RELEASED with release_reason SUPERSEDED_BY_FULL_HOLD (not still ACTIVE, not pending)"
            - "${auto_hold} != ${h_prior}, ${auto_type} == FULL_HOLD, ${auto_created} == true and ${auto_amount} == 100000   # release-then-mint: the swept amount includes the returned 10000"
            - "${avail_after} == 0 and ${held_after} == 100000 — funds identity preserved at every step"
            - "${funds_note_amount} == 100000 and the notification is already SENT"
            - "${sv_after} == ${sv_before} + 1 — the entire five-entity cascade costs exactly one version increment"
