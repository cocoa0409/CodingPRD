        test_recipe:
          setup: ["PUBLISHED program 2026-09-08..2026-09-09; P1 has an APPROVED window 2026-09-08..2026-09-08 and a merely REQUESTED window for 2026-09-09"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-09", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
