              captures: { ln_above: $.data.id, fee_above: $.data.service_fee_cents }
          assert:
            - "OrderLine.${ln_below}.extended_price_cents == 495000"
            - "${fee_below} == 27225"
            - "OrderLine.${ln_below}.invoice_total_cents == 522225"
            - "OrderLine.${ln_at}.extended_price_cents == 500000"
            - "${fee_at} == 0"
            - "OrderLine.${ln_at}.invoice_total_cents == 500000"
            - "OrderLine.${ln_above}.extended_price_cents == 505000"
            - "${fee_above} == 0"
            - "OrderLine.${ln_above}.invoice_total_cents == 505000"
            - "all three lines have list_unit_price_cents == 5000 (the unbounded tier never re-bands)"

      - name: indexed_cost_reset_rounds_half_up_at_exact_half_cent
        grounds:
          - calculations.market_index_cost_reset
          - entities.PriceChangeNotice.fields.new_cost_cents
          - entities.PriceChangeNotice.fields.delta_pct
          - entities.PriceChangeNotice.fields.earliest_effective_at
          - entities.Product.fields.index_baseline_cost_cents
          - endpoints["POST /nac/price-change-notices"]
        distinguishing_aspect: |
          A precision boundary on a third metric and a third endpoint:
          PriceChangeNotice.new_cost_cents at POST /nac/price-change-notices, where
          1234 * 107.75 / 100 = 1329.635 must round to 1330 (truncation gives 1329)
          and 1000 * 100.05 / 100 = 1000.5 lands on an exact half cent that must
          round to 1001 (banker's rounding gives 1000).
        test_recipe:
          setup:
            - "Operator IDX, manufacturer MWM, DC-CHI, contract INDEX-2026 ACTIVE with an unbounded DRY_GROCERY LAST_COST DOLLARS_PER_CASE 0 tier and an IN_MARKET coverage, notice_period_days 30."
            - "Two market-indexed DRY_GROCERY products: P-INDEX with last_cost_cents 1234, index_baseline_value 100.00, index_baseline_cost_cents 1234; P-HALF with last_cost_cents 1000, index_baseline_value 100.00, index_baseline_cost_cents 1000."
