          assert:
            - "${cfgR4_activator} == privacy-tuner-1"
            - "${recR4_right_state} == PENDING_MATCH_REVIEW"
            - "${linkR4_score} == 0.7700"
            - "${linkR4_cfg} == ${cfgR4_id}"
            - "${errR4} == ERR_SOD_STEWARD_IS_TUNER"
            - "${linkR4_status_mid} == PENDING_REVIEW"
            - "${linkR4_reviewer_mid} == null"
            - "${linkR4_status_after} == LINKED"
            - "${linkR4_reviewer} == privacy-steward-1"
            - "${clusterR4_right_status} == MERGED_AWAY"
            - "${clusterR4_right_merged_into} == ${clusterR4_left}"
  - section: Cross-Cutting Complexity Layers
    instances:
      - name: all_three_concurrency_rules_reject_a_stale_version_and_accept_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.data-feed-provision-stale-participant
          - concurrency_rules.consent-directive-create-stale-cluster
          - concurrency_rules.match-link-confirm-stale-cluster
          - errors.ERR_STALE_PARTICIPANT_VERSION
          - errors.ERR_STALE_CLUSTER_VERSION
        distinguishing_aspect: |
          Each of the three declared concurrency rules is exercised on its own write endpoint with its own
          occ_field, in the same run, with no forbidden notion of two clients acting at once: a first write
          advances the parent's version, then a second write that still carries the pre-advance number is
          refused at 412, then the caller re-reads and the identical body succeeds. The instance also pins
          the version arithmetic to exact integers - Participant 3 -> 4 -> 5 across create, SUBMIT and two
          feed provisions, IdentityCluster 2 -> 3 -> 4 across the review proposal, the directive and the
          confirmation - which is what proves version increments on every write rather than only on some.
        test_recipe:
          setup:
            - "An ACTIVE consent policy and an ACTIVE PROBABILISTIC_ONLY generation exist."
            - "Participant A and Participant B are both at CONFORMANCE_TESTING, so both are at version 3 (1 at create, 2 after SUBMIT_FOR_LEGAL_REVIEW, 3 after EXECUTE_AGREEMENT; the system AGREEMENT_EXECUTED -> CONFORMANCE_TESTING step declares no increment)."
          setup_api_calls:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "H1-POLICY-1", model: "OPT_OUT", sensitive_categories_segmented: ["HIV"], default_share_for_treatment: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polH1_id: $.data.id }
            - call: "POST /hie/consent-policies/${polH1_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-H1", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgH1_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgH1_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Cedarbluff Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@cedarbluff.example" }
              as: HieAdmin
              captures: { pH1_a: $.data.id, pH1_a_v_create: $.data.version }
            - call: "POST /hie/participants/${pH1_a}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pH1_a}"
              captures: { pH1_a_v_submit: $.data.version }
            - call: "POST /hie/participants/${pH1_a}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Dovewood Family Clinic", org_type: "CLINIC", declared_annual_patient_volume: 24000, primary_contact_email: "hie@dovewood.example" }
