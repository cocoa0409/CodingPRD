            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "pulled for a dealer demo, freeing the seasonal quota" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /demand-forecast-buckets/${bucket}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
