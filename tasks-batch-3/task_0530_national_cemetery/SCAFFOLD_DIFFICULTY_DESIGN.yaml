        distinguishing_aspect: |
          Gravesite interval semantics = closed-closed + 48h teardown buffer: a second interment on the
          SAME double-depth gravesite whose window starts within 48h of the first window's end conflicts
          (ERR_GRAVESITE_WINDOW_CONFLICT), even though the raw intervals do not overlap. Buffer-based
          adjacency — different arithmetic from the niche rule.
