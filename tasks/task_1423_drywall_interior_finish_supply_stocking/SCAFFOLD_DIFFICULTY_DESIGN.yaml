  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depths)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: mark_stocked_cascades_to_account_suspension
        grounds:
          - state_machines.StockingOrder.DISPATCHED_to_STOCKED
          - state_machines.DrawRequest
          - state_machines.ContractorAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /stocking-orders/{id}/mark-stocked:
          StockingOrder → auto-create DrawRequest (link 1) → DrawRequest.ISSUED
          mutates Account.ar_outstanding_cents (link 2) → if new AR exceeds
          credit_limit, Account transitions ACTIVE → SUSPENDED (link 3). Distinct
          trigger from the second cascade instance (account close).
        test_recipe:
          setup:
            - "Account with credit_limit_cents = 100000 (tight)"
            - "Stocked order that will produce a draw of 102000 + 10213 = 112213 (project at distance 10, freight final 10213, material 102000 via 50-sheet takeoff at 1700c/sheet)"
            - "After mark-stocked, Account should be SUSPENDED"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Tight Credit Co", credit_limit_cents: 100000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 50 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "PATCH /supply/products/${prod_id}"
              payload: { unit_price_cents_per_sheet: 1700 }
              as: WarehouseManager
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 3 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_id}/mark-stocked"
              payload: {}
              as: Foreman
            - call: "GET /supply/contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
              captures: { acct_status: $.data.status, acct_ar: $.data.ar_outstanding_cents }
            - call: "GET /supply/draw-requests"
              payload: { project_id: "${proj_id}" }
              as: CreditManager
              captures: { draw_requested: "$.data[0].requested_cents" }
          assert:
            - "captured draw_requested == 112213"
            - "captured acct_ar == 112213"
            - "captured acct_status == SUSPENDED"

      - name: account_close_cascades_to_orders
        grounds:
          - state_machines.ContractorAccount.ACTIVE_to_CLOSED
          - state_machines.Project
          - state_machines.StockingOrder
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /contractor-accounts/{id}/close:
          Account → non-terminal Projects transition to CANCELLED (link 1) → each
          cancelled project cascades to its DRAFT and SCHEDULED StockingOrders,
          releasing their boom-truck reservations (link 2). Distinct trigger
          (account close) from the first cascade instance (mark-stocked).
        test_recipe:
          setup:
            - "Account with zero AR"
            - "One project PLANNING, one project STOCKING_OPEN with a SCHEDULED stocking order"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Closer Co", credit_limit_cents: 9000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P-Idle", distance_miles: 10, framing_pct_complete: 10 }
              as: EstimatorUser
              captures: { proj_idle: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P-Active", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_active: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_active}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_active}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_active}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
          trigger:
            - call: "POST /supply/contractor-accounts/${acct_id}/close"
              payload: {}
              as: CreditManager
              captures: { acct_status: $.data.status }
            - call: "GET /supply/projects/${proj_idle}"
              payload: {}
              as: CreditManager
              captures: { proj_idle_status: $.data.status }
            - call: "GET /supply/projects/${proj_active}"
              payload: {}
              as: CreditManager
              captures: { proj_active_status: $.data.status }
            - call: "GET /supply/stocking-orders/${ord_id}"
              payload: {}
              as: DispatcherUser
              captures: { ord_status: $.data.status }
          assert:
            - "captured acct_status == CLOSED"
            - "captured proj_idle_status == CANCELLED"
            - "captured proj_active_status == CANCELLED"
            - "captured ord_status == CANCELLED"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_schedule
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LEAD_TIME_VIOLATION]
        distinguishing_aspect: |
          Pair = (state, business_temporal). When a stocking order is in DRAFT
          (so the transition precondition fails) AND its scheduled_date is
          earlier than today + max lead time (so the lead-time rule also fails),
          the higher-priority state check fires first with ERR_INVALID_STATE,
          not ERR_LEAD_TIME_VIOLATION.
        test_recipe:
          setup:
            - "Account ACTIVE, project STOCKING_OPEN"
            - "Locked takeoff"
            - "BoomTruck BT-01"
            - "Stocking order in DRAFT containing a FIRE_RATED drop"
            - "Logical clock at 2026-08-01; scheduled_date is 2026-08-01 (today) so lead_time is violated; separately, cancel the order first so the state is no longer DRAFT"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Prio1 Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "FIRE-4x8-5/8", board_kind: "FIRE_RATED", length_ft: 8, width_ft: 4, thickness_in: "5/8", sheets_per_bundle: 16, unit_price_cents_per_sheet: 2400, lead_time_days: 7 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 32 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-01", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 2 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/cancel"
              payload: {}
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_INVALID_STATE"

      - name: referential_vs_fiscal_on_payment
        grounds:
          - validations[priority=3]
          - validations[priority=12]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Pair = (existence, business_fiscal). A payment posted against a
          non-existent draw-request id fails at priority 3 (existence,
          ERR_NOT_FOUND) before the overpayment check (priority 12,
          ERR_OVERPAYMENT) can fire — even though the amount would exceed any
          plausible remaining balance.
        test_recipe:
          setup:
            - "Logical clock set; no other fixtures needed (the draw id is bogus)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
          trigger:
            - call: "POST /supply/draw-requests/00000000-0000-0000-0000-000000000000/payments"
              payload: { amount_cents: 99999999, method: "ACH", received_at: "2026-08-01T00:00:00Z" }
              as: AccountsReceivableUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_NOT_FOUND"

  # ------------------------------------------------------------------
