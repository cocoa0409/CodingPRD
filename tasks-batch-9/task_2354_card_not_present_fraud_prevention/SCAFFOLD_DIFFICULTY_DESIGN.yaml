  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: customer_parallel_axes_progress_independently
        grounds:
          - state_machines.Customer.ACTIVE_to_LOCKED
          - state_machines.Customer.LOCKED_to_ACTIVE
          - state_machines.Customer.CLEAR_to_WATCH
          - entities.Customer.fields.account_status
          - entities.Customer.fields.ato_posture
          - calculations.ato_score_evaluation
        distinguishing_aspect: |
          Non-linearity of the PARALLEL kind: Customer carries two state axes on one
          row and a single request moves exactly one of them. Locking the account
          leaves ato_posture CLEAR, the step-up auth event then moves ato_posture to
          WATCH while account_status stays LOCKED, and unlocking the account leaves
          ato_posture at WATCH.
        test_recipe:
          setup:
            - "A customer with home_country US exists, account_status ACTIVE and ato_posture CLEAR."
            - "A device exists that has never been paired with this customer, so device_first_seen_for_customer will be true."
            - "The account is administratively LOCKED with reason 'manual review hold' while ato_posture stays CLEAR."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "axes@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-axes-001", tz_offset_minutes: 60, emulator_flag: false }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { account_status: "LOCKED", reason: "manual review hold" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/auth-events"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", event_type: "PASSWORD_CHANGE", ip_country: "GB" }
              as: CheckoutService
              captures: { auth_id: $.data.id }
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { account_status: "ACTIVE" }
              as: PlatformAdmin
          assert:
            - "AuthEvent.${auth_id}.device_first_seen_for_customer == true"
            - "AuthEvent.${auth_id}.ato_score == 70.00"
            - "AuthEvent.${auth_id}.outcome == STEP_UP_REQUIRED"
            - "AuthEvent.${auth_id}.challenge_state == ISSUED"
            - "AuthEvent.${auth_id}.challenge_method == OTP_SMS"
            - "AuthEvent.${auth_id}.challenge_expires_at == 2026-08-01T00:15:00Z"
            - "After the auth event and before the unlock: Customer.${cust_id}.account_status == LOCKED and Customer.${cust_id}.ato_posture == WATCH"
            - "After the unlock: Customer.${cust_id}.account_status == ACTIVE and Customer.${cust_id}.ato_posture == WATCH"
            - "Customer.${cust_id}.locked_reason == null after the unlock"
            - "Customer.${cust_id}.good_customer_flag == false"

      - name: review_case_escalation_cycle_returns_to_assigned
        grounds:
          - state_machines.ReviewCase.ASSIGNED_to_ESCALATED
          - state_machines.ReviewCase.ESCALATED_to_ASSIGNED
          - calculations.review_case_priority_score
          - entities.ReviewCase.fields.escalation_count
          - concurrency_rules[case-assign-stale-analyst]
        distinguishing_aspect: |
          Non-linearity of the CYCLIC kind on a different entity: a ReviewCase
          re-enters ASSIGNED after ESCALATED, so the same state is occupied twice in
          one lifetime, and the second occupancy differs observably —
          escalation_count is 1 and priority_score has risen from 32.50 to 47.50
          through the ESCALATION_BOOST.
        test_recipe:
          setup:
            - "BOOT-W is in place; a 75000-cent order scored 50.00 and is IN_REVIEW with a QUEUED ReviewCase at priority_score 32.50."
            - "Junior analyst AN1 (skill_families [BEHAVIORAL], capacity 2) and lead analyst LEAD1 (seniority LEAD, skill_families [BEHAVIORAL], capacity 3) exist and are AVAILABLE."
            - "The case was assigned to AN1 and AN1 escalated it, so it is ESCALATED with assigned_analyst_id null and escalated_by_analyst_id == AN1."
          setup_api_calls:
            - call: "POST /fraud/customers"
