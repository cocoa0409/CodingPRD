              as_user_id: "${cap_id}"
          assert:
            - "Team.${t_id}.fee_charged_cents == 8000"
            - "Team.${t_id}.refund_issued_cents == 8000"
            - "Team.${t_id}.fee_charged_cents - Team.${t_id}.refund_issued_cents == 0 (cash conserved at zero net)"

      - name: confirmed_count_invariant_under_withdraw_then_promote
        grounds:
          - state_machines.Team.CONFIRMED_to_WITHDRAWN_LOCKED
          - state_machines.Team.WAITLISTED_to_CONFIRMED
          - entities.Division.fields.confirmed_team_count
        distinguishing_aspect: >
          Conserved quantity = Division.confirmed_team_count = 1. A CONFIRMED team withdrawing
          (-1) auto-promotes the highest-seeded WAITLISTED team (+1), leaving confirmed_team_count
          unchanged at 1 — a team-slot count invariant, a different conserved quantity than net cash.
        test_recipe:
          setup:
            - "A division team_capacity=1 with one CONFIRMED team and one WAITLISTED team (produced by season transition target=CLOSED)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "SLOT Season", sport: "SOCCER", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z", refund_full_cutoff_at: "2026-09-30T00:00:00Z" }
              as: LeagueAdmin
