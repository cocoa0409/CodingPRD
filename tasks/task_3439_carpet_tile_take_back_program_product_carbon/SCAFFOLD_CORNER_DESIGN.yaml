              payload: { architect_firm: "NO-SUCH-FIRM" }
              as: PlatformAdmin
          assert:
            - "zones?batch_id=${b1} returns exactly 1 row: ${z1}"
            - "replacement-orders?zone_id=${z1} returns exactly 1 row: ${ord1}"
            - "take-backs REQUESTED: 1 row (${tb1}); CREDITED: 0 rows with total_count 0 and has_more false"
            - "pcf-reports DRAFT: 1 row (${rep1})"
            - "carbon-claims?report_id=${rep1}: 1 row (${cl1})"
            - "spec-packages for an unknown firm: 0 rows, 200, empty array — not an error"

      - name: lots_traceability_filter_finds_cascade_created_lot
        claim_type: Computed read
        grounds:
          - endpoints."GET /carpetloop/feedstock-lots"
          - state_machines.TakeBackRequest.COLLECTED_to_CREDITED
          - entities.FeedstockLot.fields.origin_takeback_id
        distinguishing_aspect: "The cascade-created depolymerization lot is discoverable only through the filtered list: GET /carpetloop/feedstock-lots?origin_takeback_id=<tb> returns the 80 kg POST_CONSUMER_TILE lot with supplier TAKEBACK-PROGRAM in RECEIVED status."
        test_recipe:
          setup: ["Collection GAT (claim_intent NONE); site INSTALLED; take-back collected 160 kg and sorted 40/80/40/0 (CREDITED)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
