            - call: "POST /commission/consent-agreements/${ca_id}/commission-action"
              payload: { action: "WITHDRAW" }
              as: CommissionCounsel
              as_user_id: "counsel-01"
          assert:
            - "after the first COUNTER: ConsentAgreement.${ca_id}.status == COUNTERED and round_number == 1"
            - "after the first REVISE: ConsentAgreement.${ca_id}.status == OFFERED, round_number == 2, proposed_fine_cents == 150000 and counter_fine_cents == null"
            - "after the second REVISE: ConsentAgreement.${ca_id}.status == OFFERED and round_number == 3"
            - "after the third COUNTER: ConsentAgreement.${ca_id}.status == COUNTERED, round_number == 3 (a counter never advances the round) and Complaint.${c_id}.status == CONSENT_PENDING"
            - "the third REVISE returns 409 ERR_CONSENT_ROUND_LIMIT and leaves ConsentAgreement.${ca_id}.status == COUNTERED with round_number == 3 and proposed_fine_cents == 120000"
            - "the WITHDRAW returns 200 with ConsentAgreement.${ca_id}.status == REJECTED and Complaint.${c_id}.status == PROBABLE_CAUSE (the parent moves backwards out of CONSENT_PENDING)"
            - "GET /commission/complaints/${c_id}/consent-agreements returns exactly one agreement in created_at ASC order - the loop revised one row rather than creating a row per round"
  - rule_id: transitive_cascade
    instances:
      - name: hearing_revocation_cascades_five_levels_to_a_third_party_student_ce_balance
        grounds:
          - state_machines.Hearing.CONVENED_to_DECIDED
          - state_machines.Licensee.ACTIVE_to_REVOKED
          - state_machines.Instructor.APPROVED_to_SUSPENDED
          - state_machines.EducationProvider.APPROVED_to_PROBATION
          - entities.CourseCompletion.fields.credit_status
          - entities.Licensee.fields.ce_hours_valid
        distinguishing_aspect: |
          Depth 5 from a single panel-chair DECIDE: L1 issues the SanctionOrder and adjudicates the
          complaint, L2 revokes the respondent's licence, L3 suspends the instructor record that hangs
          off that licence and puts its education provider on PROBATION, L4 invalidates that
          instructor's in-lookback CourseCompletion rows, and L5 rewrites the CE balance of a student
          who is not a party to the complaint. The lookback boundary makes the L4 step conditional -
          an older completion by the same instructor survives - so the chain is not a blanket update.
