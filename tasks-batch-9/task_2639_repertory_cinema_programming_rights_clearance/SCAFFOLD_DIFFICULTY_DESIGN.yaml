  - rule_id: priority_pair_validation_conflict
    instances:

      - name: clearance_not_cleared_outranks_screen_slot_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_CLEARANCE_NOT_CLEARED]
          - errors[ERR_SCREEN_SLOT_CONFLICT]
          - calculations.screen_slot_block
        distinguishing_aspect: |
          Category pair business_safety (priority 7) versus business_temporal (priority 14): one request
          violates BOTH - it cites a clearance still in SUBMITTED and it lands inside an existing showtime's
          half-open block. The rights failure is reported and the scheduling failure is never evaluated, so
          the response carries ERR_CLEARANCE_NOT_CLEARED and not ERR_SCREEN_SLOT_CONFLICT.
