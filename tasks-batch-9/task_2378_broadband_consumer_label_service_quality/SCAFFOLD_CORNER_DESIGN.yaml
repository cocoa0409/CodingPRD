# =============================================================================
# §1.9 Scaffold Corner Design — Task 2378
# Broadband Consumer Label & Service Quality Complaints
#
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7 of
# SCAFFOLD.yaml. Corners already carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs naming the covering §1.8 instance.
#
# Shared fixture literals (identical to §1.8, recomputed from the pinned §1.3
# formulas): FIBER300 intro net 3766 / post-promotional net 7628, first-year
# 78264 vs 101436, PEAK_HOUR_MEDIAN 240.00 / 115.00 / 42 with margins
# 0.8000 / 0.8214, ALL_HOUR_P20 238.00 / 112.00 / 55, credits 942 and 500.
# Logical clock default 2026-08-01T00:00:00Z, repositioned to 2026-09-01T00:00:00Z
# by every chain below that depends on dates.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: create_service_plan_initialises_every_derived_field
        claim_type: creation
        grounds:
          - endpoints.POST_service_plans
          - entities.ServicePlan
          - response_envelope.success
        distinguishing_aspect: "A ServicePlan POST with every input field present returns 201 and the six computed fields at their declared initial values, not nulls."
        test_recipe:
          setup:
            - "Empty database; logical clock repositioned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

          trigger:
            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

          assert:
            - "201 with response_type == 'object' and meta.api_request_id / meta.api_request_timestamp present"
            - "ServicePlan.${plan_id}: plan_code == 'FIBER300', technology == 'FIBER', advertised_download_mbps == 300, monthly_price_cents == 7999, intro_price_cents == 4999, intro_term_months == 6, required_locales == ['en-US']"
            - "ServicePlan.${plan_id}.label_posture == RESTRICTED (no PUBLISHED label yet)"
            - "ServicePlan.${plan_id}.evidence_sample_total == 0, upheld_complaint_count == 0, price_disclosure_drift == false"
            - "ServicePlan.${plan_id}.active_label_version_id == null and last_price_change_at == null"
            - "ServicePlan.${plan_id}.version == 1 and created_at == updated_at == 2026-09-01T00:00:00.000Z"

      - name: get_label_version_returns_the_pinned_snapshot
        claim_type: retrieval
        grounds:
          - endpoints.GET_label_versions_id
          - entities.LabelVersion
        distinguishing_aspect: "GET on a published label returns the stored snapshot — pinned typical_* figures, the fee itemization and both first-year totals — not values re-derived from the plan at read time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
            - "Five FeeLineItems: EQUIP_RENTAL 1500 ALWAYS, NETWORK_ACCESS 700 POST_PROMO_ONLY, REG_RECOVERY 3.25% ALWAYS, STATE_USF 2.11% ALWAYS, INSTALL 9900 ONE_TIME."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A with 6 samples, 4 of them peak-hour; ServicePlan.evidence_sample_total == 6."
            - "One CERTIFIED PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214."
            - "One PUBLISHED, SUBSTANTIATED LabelVersion (version_seq 1, effective_from 2026-09-01, effective_until null, WCAG_AA, VERIFIED en-US translation, net intro 3766, net post-promotional 7628); ServicePlan.label_posture == OPEN."

          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer

            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-1", market_code: "US-TX-AUS", panel_size: 75, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_id: $.data.id }

            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_a_id: $.data.id }

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_v1: $.data.version }
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${plan_v1}" }
              as: NetworkEngineer
              captures: { att_id: $.data.id }

            - call: "POST /performance-attestations/${att_id}/certify"
              payload: {}
              as: ComplianceOfficer

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v2: $.data.version }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations"
              payload: { locale: "en-US", translated_summary: "Fiber 300 broadband consumer label", machine_translated: false }
              as: LocalizationSpecialist
              as_user_id: "loc-1"
              captures: { tr_en_id: $.data.id }
            - call: "POST /label-versions/${lv1_id}/translations/${tr_en_id}/verify"
              payload: {}
              as: LocalizationSpecialist
              as_user_id: "loc-2"

            - call: "POST /label-versions/${lv1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"

          trigger:
            - call: "GET /label-versions/${lv1_id}"
              payload: {}
              as: RetailAgent
          assert:
            - "200 with data.id == ${lv1_id}, plan_id == ${plan_id}, version_seq == 1"
            - "publication_state == PUBLISHED, substantiation_status == SUBSTANTIATED, attestation_id == ${att_id}"
            - "typical_download_mbps == 240.00, typical_upload_mbps == 115.00, typical_latency_ms == 42, methodology_url_snapshot == 'https://isp.example/methodology/v1.0'"
            - "monthly_total_intro_cents == 6766, net_monthly_intro_cents == 3766, monthly_total_post_promo_cents == 10628, net_monthly_post_promo_cents == 7628"
            - "one_time_fee_total_cents == 9900, first_year_total_promo_weighted_cents == 78264, first_year_total_post_promo_cents == 101436"
            - "etf_disclosure_cents == 12000, data_allowance_gb_snapshot == 1200, overage_rate_cents_per_gb_snapshot == 1000"
            - "fee_itemization has 5 INTRO/POST_PROMO monthly rows plus 1 ONE_TIME row; created_by_user_id == 'co-1' and published_by_user_id == 'co-2'"

      - name: list_test_runs_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_test_runs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The run list honours limit/offset alongside the plan_id and status filters, and total_count reflects the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FIBER300 with PUBLISHED MTH-2026-A and PRB-1 (max_concurrent_windows 2)."
            - "Three INCLUDED TestRuns on disjoint windows: run A (6 samples), run B (1 sample), run C (1 sample). Run C is then INVALIDATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer

            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-1", market_code: "US-TX-AUS", panel_size: 75, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_id: $.data.id }

            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_a_id: $.data.id }

            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-12T00:00:00Z", samples: [ {observed_at: "2026-08-11T19:30:00Z", download_mbps: 244, upload_mbps: 116, latency_ms: 26} ]}
              as: NetworkEngineer
              captures: { run_b_id: $.data.id }
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-13T00:00:00Z", window_end: "2026-08-14T00:00:00Z", samples: [ {observed_at: "2026-08-13T20:30:00Z", download_mbps: 236, upload_mbps: 114, latency_ms: 28} ]}
              as: NetworkEngineer
              captures: { run_c_id: $.data.id }
            - call: "POST /test-runs/${run_c_id}/invalidate"
              payload: { reason: "Panel drift on the third window" }
              as: NetworkEngineer
          trigger:
            - call: "GET /test-runs"
              payload: { plan_id: "${plan_id}", limit: 2, offset: 0 }
              as: NetworkEngineer
            - call: "GET /test-runs"
              payload: { plan_id: "${plan_id}", limit: 2, offset: 2 }
              as: NetworkEngineer
            - call: "GET /test-runs"
              payload: { plan_id: "${plan_id}", status: "INVALIDATED" }
              as: NetworkEngineer
            - call: "GET /test-runs"
              payload: {}
              as: NetworkEngineer
          assert:
            - "call 1: response_type == 'array', total_count == 3, has_more == true, limit == 2, offset == 0, data length == 2"
            - "call 2: total_count == 3, has_more == false, data length == 1"
            - "call 3: total_count == 1 and data[0].id == ${run_c_id} with status == INVALIDATED"
            - "call 4 with no filters applies the declared defaults limit == 10 and offset == 0, and returns total_count == 3"
            - "ServicePlan.${plan_id}.evidence_sample_total == 7 (6 + 1 from the two INCLUDED runs; the INVALIDATED run contributes nothing)"

      - name: unknown_ids_return_not_found_for_every_entity
        claim_type: not_found
        grounds:
          - validations.priority_30
          - errors.ERR_SERVICE_PLAN_NOT_FOUND
          - errors.ERR_TRANSLATION_NOT_FOUND
          - errors.ERR_REMEDIATION_CREDIT_NOT_FOUND
        distinguishing_aspect: "Each of the twelve domain entities answers an unknown id with its own 404 error_id, whether the id arrives in the path or in a body FK field, and existence at priority 30 outranks the state check at priority 40."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FIBER300 exists with one DRAFT LabelVersion so the translation path has a real parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v1: $.data.version }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }

          trigger:
            - call: "GET /service-plans/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e1: $.data.error_id }
            - call: "GET /methodology-documents/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NetworkEngineer
              captures: { e2: $.data.error_id }
            - call: "GET /measurement-probes/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NetworkEngineer
              captures: { e3: $.data.error_id }
            - call: "GET /test-runs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NetworkEngineer
              captures: { e4: $.data.error_id }
            - call: "GET /performance-attestations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NetworkEngineer
              captures: { e5: $.data.error_id }
            - call: "GET /label-versions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e6: $.data.error_id }
            - call: "POST /label-versions/${lv1_id}/translations/00000000-0000-4000-8000-0000000000ff/verify"
              payload: {}
              as: LocalizationSpecialist
              captures: { e7: $.data.error_id }
            - call: "GET /subscriber-accounts/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RetailAgent
              captures: { e8: $.data.error_id }
            - call: "GET /complaints/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplaintAnalyst
              captures: { e9: $.data.error_id }
            - call: "GET /remediation-credits/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e10: $.data.error_id }
            - call: "GET /regulator-inquiries/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RegulatoryLiaison
              captures: { e11: $.data.error_id }
            - call: "GET /plan-change-notices/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RetailAgent
              captures: { e12: $.data.error_id }
            - call: "POST /complaints"
              payload: { account_id: "00000000-0000-4000-8000-0000000000ff", disputed_label_version_id: "${lv1_id}", allegation_type: "FEE_MISMATCH", service_observed_date: "2026-09-01T12:00:00Z", affected_days: 1, narrative: "Body FK that does not resolve" }
              as: ComplaintAnalyst
              captures: { e13: $.data.error_id }
          assert:
            - "e1 == ERR_SERVICE_PLAN_NOT_FOUND (404), e2 == ERR_METHODOLOGY_DOCUMENT_NOT_FOUND, e3 == ERR_MEASUREMENT_PROBE_NOT_FOUND, e4 == ERR_TEST_RUN_NOT_FOUND"
            - "e5 == ERR_ATTESTATION_NOT_FOUND, e6 == ERR_LABEL_VERSION_NOT_FOUND, e8 == ERR_SUBSCRIBER_ACCOUNT_NOT_FOUND, e9 == ERR_COMPLAINT_NOT_FOUND"
            - "e10 == ERR_REMEDIATION_CREDIT_NOT_FOUND, e11 == ERR_REGULATOR_INQUIRY_NOT_FOUND, e12 == ERR_PLAN_CHANGE_NOTICE_NOT_FOUND"
            - "e7 == ERR_TRANSLATION_NOT_FOUND (404) — priority 30 answers before the priority-40 translation state check"
            - "e13 == ERR_SUBSCRIBER_ACCOUNT_NOT_FOUND (404): a body FK is resolved at the same priority as a path segment"
            - "every failure carries response_type == 'error' with data.error_id and data.message, and no row was created"

      - name: missing_required_and_conditional_fields_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_20
          - errors.ERR_INVALID_REQUEST
          - entities.FeeLineItem.fields.rate_pct
          - entities.Complaint.fields.measured_download_mbps
        distinguishing_aspect: "Priority 20 rejects both plainly absent required fields and the scaffold's conditional pairings (FIXED needs amount_cents, PCT needs rate_pct, SPEED_SHORTFALL needs measured_download_mbps, an intro price needs an intro term)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FIBER300 exists with one DRAFT LabelVersion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
