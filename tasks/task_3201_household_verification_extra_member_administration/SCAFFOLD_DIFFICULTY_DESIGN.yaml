# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 3201: Household Verification & Extra Member Administration
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: extra_member_fee_prospective_vs_prorated
        grounds:
          - calculations.extra_member_fee_cents
          - entities.ExtraMemberSlot.fields.price_cents_snapshot
        distinguishing_aspect: |
          Same account, same plan tier: a slot purchased on the billing anchor
          day uses the prospective_full_cycle variant (799) while an identical
          purchase on cycle day 15 uses the mid_cycle_prorated variant (500) —
          two valid fee algorithms on the Account billing domain producing
          different results for the same catalog data.
        test_recipe:
          setup:
            - "NA STANDARD account created at the default clock 2026-09-01T00:00:00Z, so billing_anchor_day == 1"
            - "slot A purchased on 2026-09-01 (day_index 0); clock then advanced to 2026-09-16 (day_index 15) and slot B purchased"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "dv1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_a_id: $.data.id, slot_a_price: $.data.price_cents_snapshot }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v2: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v2}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_b_id: $.data.id }
          trigger:
            - call: "GET /hv/extra-member-slots/${slot_b_id}"
              as: PlatformAdmin
              captures: { slot_b_price: $.data.price_cents_snapshot }
          assert:
            - "ExtraMemberSlot.${slot_a_id}.price_cents_snapshot == 799"
            - "ExtraMemberSlot.${slot_b_id}.price_cents_snapshot == 500"
            - "slot_b_price != slot_a_price"
            - "Account.${acc_id}.extra_member_billed_cents == 1299"

      - name: household_confidence_strict_vs_lenient
        grounds:
          - calculations.household_match_confidence_pct
          - entities.Device.fields.last_signal_at
        distinguishing_aspect: |
          Same device signals (geo match + fresh recency, network mismatch):
          the strict variant caps confidence at 50 while the lenient variant
          yields 60 — dual-variant scoring on the Device/Household risk domain,
          a different entity domain from extra-member pricing.
        test_recipe:
          setup:
            - "NA STANDARD account with a household anchored at network fp-home-1 / geo geo-home-1"
            - "device registered from network fp-away-9 but the same geo cell, with a fresh signal at the default clock (age 0 days)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "dv2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Away TV", device_type: "TV", network_fingerprint: "fp-away-9", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "GET /hv/devices/${dev_id}/confidence"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { strict_pct: $.data.strict_pct, lenient_pct: $.data.lenient_pct }
          assert:
            - "strict_pct == 50"
            - "lenient_pct == 60"
            - "strict_pct != lenient_pct"
            - "network_match == false and geo_match == true and recency_score == 30"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: slot_fee_tiered_multi_input
        grounds:
          - calculations.extra_member_fee_cents
        distinguishing_aspect: |
          Mode (a): the fee combines three inputs with non-linear interaction —
          region base (EMEA 499), tier multiplier (PREMIUM 0.75), and slot-index
          surcharge (+200 for index 2) — producing 374 for the first slot and
          574 for the second on the same account.
        test_recipe:
          setup:
            - "EMEA PREMIUM account created at the default clock 2026-09-01 (billing anchor day 1)"
            - "both slots purchased on the anchor day (prospective variant)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "cf1@x.com", region_code: "EMEA", plan_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "LOCKED", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_1_id: $.data.id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v2: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "LOCKED", expected_account_version: "${acc_v2}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_2_id: $.data.id }
          trigger:
            - call: "GET /hv/accounts/${acc_id}/extra-member-slots"
              as: PlatformAdmin
          assert:
            - "ExtraMemberSlot.${slot_1_id}.price_cents_snapshot == 374"
            - "ExtraMemberSlot.${slot_1_id}.slot_index == 1"
            - "ExtraMemberSlot.${slot_2_id}.price_cents_snapshot == 574"
            - "ExtraMemberSlot.${slot_2_id}.slot_index == 2"
            - "Account.${acc_id}.extra_member_billed_cents == 948"

      - name: revoke_credit_per_day_rounding
        grounds:
          - calculations.proration_credit_cents
          - entities.ExtraMemberSlot.fields.credit_cents
        distinguishing_aspect: |
          Mode (b): the credit rounds the per-day rate to integer cents FIRST
          (round_half_up(400/30) = 13) and then multiplies by days remaining
          (10), yielding 130 — the forbidden sum-then-round order would yield
          133; the scaffold pins the per-day order.
        test_recipe:
          setup:
            - "NA STANDARD account created 2026-09-01 (anchor day 1)"
            - "slot purchased 2026-09-16 (day_index 15, prorated fee 400), revoked 2026-09-21 (day_index 20, 10 days remaining, outside the 7-day full-credit window)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "cf2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-cf2@x.com", display_name: "Extra CF2", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hv/extra-member-slots/${slot_id}/revoke"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { credit: $.data.credit_cents, status: $.data.status }
          assert:
            - "status == REVOKED"
            - "credit == 130"
            - "Account.${acc_id}.extra_member_credit_cents == 130"
            - "Account.${acc_id}.extra_member_net_revenue_cents == 270"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: account_suspension_cycle_with_parallel_posture
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Account.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Account is cyclic (ACTIVE -> SUSPENDED -> ACTIVE) AND carries the
          parallel verification_posture dimension; after the cycle, status
          returns to ACTIVE while the posture dimension is untouched —
          two independent state axes on one entity.
        test_recipe:
          setup:
            - "NA STANDARD account, freshly created (status ACTIVE, verification_posture VERIFIED, version 1)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "sm1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/suspend"
              as: PlatformAdmin
              captures: { st1: $.data.status }
            - call: "POST /hv/accounts/${acc_id}/reactivate"
              as: PlatformAdmin
              captures: { st2: $.data.status, v2: $.data.version, posture2: $.data.verification_posture }
          assert:
            - "st1 == SUSPENDED"
            - "st2 == ACTIVE"
            - "posture2 == VERIFIED"
            - "v2 == 3"

      - name: challenge_expire_reissue_cycle
        grounds:
          - state_machines.VerificationChallenge.PENDING_to_EXPIRED
          - state_machines.VerificationChallenge.EXPIRED_to_PENDING
        distinguishing_aspect: |
          VerificationChallenge cycles PENDING -> EXPIRED -> PENDING via
          reissue (a different entity than Account): after reissue the status
          returns to PENDING with attempts_used reset to 0 and a new code.
        test_recipe:
          setup:
            - "NA STANDARD account with an EMAIL challenge issued at the default clock 2026-09-01T00:00:00Z (expires +900s)"
            - "clock advanced 16 minutes so the challenge is lazily EXPIRED, then past the 300s cooldown"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "sm2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "NEW_DEVICE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, code_1: $.data.code }
            - call: "POST /hv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "GET /hv/verification-challenges/${ch_id}"
              as: PlatformAdmin
              captures: { st_expired: $.data.status }
          trigger:
            - call: "POST /hv/verification-challenges/${ch_id}/reissue"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { st2: $.data.status, code_2: $.data.code, attempts2: $.data.attempts_used }
          assert:
            - "st_expired == EXPIRED"
            - "st2 == PENDING"
            - "attempts2 == 0"
            - "code_2 != code_1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: suspend_cascades_device_pass_metric
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Device.TRUSTED_to_UNTRUSTED
          - state_machines.TravelPass.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-3 chain from POST suspend: Account SUSPENDED mutates Device
          (TRUSTED -> UNTRUSTED); that untrust mutation itself revokes the
          device's TravelPass (ACTIVE -> REVOKED); each pass revocation itself
          creates an EnforcementMetric(CHURN_SIGNAL) on the account.
        test_recipe:
          setup:
            - "NA STANDARD account with a household (fp-home-1 / geo-home-1) and one TRUSTED device on the home network"
            - "device holds an ACTIVE 14-day travel pass starting 2026-09-01"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "tc1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "Living Room TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/devices/${dev_id}/travel-passes"
              payload: { grant_type: "TEMPORARY_14D", starts_at: "2026-09-01T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/suspend"
              as: PlatformAdmin
          assert:
            - "Device.${dev_id}.trust_status == UNTRUSTED"
            - "TravelPass.${pass_id}.status == REVOKED"
            - "GET /hv/accounts/${acc_id}/enforcement-metrics returns total_count == 1 with data[0].metric_type == CHURN_SIGNAL"
            - "Household.${hh_id}.trusted_device_count == 0"

      - name: transfer_accept_cascades_member_move_slot_revoke
        grounds:
          - state_machines.ProfileTransfer.AWAITING_ACCEPTANCE_to_COMPLETED
          - state_machines.ExtraMemberSlot.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST accept): the transfer
          completion moves the Member to a brand-new account, and that member
          move itself revokes the source account's ACTIVE ExtraMemberSlot with
          credit_cents 0.
        test_recipe:
          setup:
            - "NA STANDARD account with one slot purchased on the anchor day and assigned to an extra member"
            - "profile transfer initiated for the extra member (transfer_rights TRANSFERABLE)"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "tc2@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /hv/extra-member-slots/${slot_id}/assign"
              payload: { email: "extra-tc2@x.com", display_name: "Extra TC2", member_region: "NA" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { extra_id: $.data.member_id }
            - call: "POST /hv/accounts/${acc_id}/profile-transfers"
              payload: { member_id: "${extra_id}", target_email: "newhome-tc2@x.com" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { tr_id: $.data.id, tr_v: $.data.version }
          trigger:
            - call: "POST /hv/profile-transfers/${tr_id}/accept"
              payload: { new_account_email: "newhome-tc2@x.com", new_account_region: "NA", new_account_plan_tier: "BASIC", expected_profile_transfer_version: "${tr_v}" }
              as: PlatformAdmin
              captures: { tr_status: $.data.status, target_acc: $.data.target_account_id }
          assert:
            - "tr_status == COMPLETED"
            - "Member.${extra_id}.account_id == target_acc and member_role == OWNER and status == ACTIVE"
            - "ExtraMemberSlot.${slot_id}.status == REVOKED and credit_cents == 0"
            - "GET /hv/accounts/${acc_id}/members?status=ACTIVE returns total_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_state_beats_slot_limit
        grounds:
          - validations[priority=6]
          - validations[priority=18]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - errors[ERR_SLOT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the purchase request
          violates both the account-state gate (SUSPENDED, priority 6) and the
          slot cap (STANDARD allows 1, priority 18); the higher-priority state
          error ERR_ACCOUNT_SUSPENDED wins.
        test_recipe:
          setup:
            - "NA STANDARD account with one slot already purchased (at the STANDARD cap of 1)"
            - "account then suspended, so a further purchase fails both the state gate and the slot cap"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "pp1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v1: $.data.version }
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/accounts/${acc_id}/suspend"
              as: PlatformAdmin
            - call: "GET /hv/accounts/${acc_id}"
              as: PlatformAdmin
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /hv/accounts/${acc_id}/extra-member-slots"
              payload: { payer_member_id: "${owner_id}", transfer_rights: "TRANSFERABLE", expected_account_version: "${acc_v2}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_SUSPENDED"
            - "err != ERR_SLOT_LIMIT_EXCEEDED"
            - "Account.${acc_id}.extra_member_billed_cents == 799"

      - name: challenge_locked_safety_beats_member_referential
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_CHALLENGE_LOCKED]
          - errors[ERR_MEMBER_NOT_IN_ACCOUNT]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: the
          submit targets a LOCKED_OUT challenge (safety, priority 9) AND names
          a member of a different account (referential, priority 13); the
          safety error ERR_CHALLENGE_LOCKED wins.
        test_recipe:
          setup:
            - "account A with an EMAIL challenge that has consumed 3 wrong-code attempts and is LOCKED_OUT"
            - "account B whose owner member id is used as the foreign member_id"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "pp2a@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_a: $.data.id, owner_a: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_a}/verification-challenges"
              payload: { channel: "EMAIL", challenge_reason: "NEW_DEVICE" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /hv/verification-challenges/${ch_id}/submit"
              payload: { code: "000000", member_id: "${owner_a}" }
              as: AccountOwner
              as_user_id: "${owner_a}"
            - call: "POST /hv/verification-challenges/${ch_id}/submit"
              payload: { code: "000000", member_id: "${owner_a}" }
              as: AccountOwner
              as_user_id: "${owner_a}"
            - call: "POST /hv/verification-challenges/${ch_id}/submit"
              payload: { code: "000000", member_id: "${owner_a}" }
              as: AccountOwner
              as_user_id: "${owner_a}"
            - call: "POST /hv/accounts"
              payload: { email: "pp2b@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_b: $.data.id, owner_b: $.data.owner_member_id }
          trigger:
            - call: "POST /hv/verification-challenges/${ch_id}/submit"
              payload: { code: "000000", member_id: "${owner_b}" }
              as: AccountOwner
              as_user_id: "${owner_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CHALLENGE_LOCKED"
            - "err != ERR_MEMBER_NOT_IN_ACCOUNT"
            - "VerificationChallenge.${ch_id}.status == LOCKED_OUT"
            - "Account.${acc_a}.verification_posture == LOCKED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: stream_limit_exact_boundary
        grounds:
          - calculations.stream_admission_decision
          - errors[ERR_STREAM_LIMIT_REACHED]
        distinguishing_aspect: |
          Metric: account-wide concurrent stream count on POST
          playback-sessions. STANDARD max is 2: with 1 ACTIVE session the
          second is admitted (active < max), with 2 ACTIVE the third is
          rejected — the boundary is exactly at active == max_streams.
        test_recipe:
          setup:
            - "NA STANDARD account, household, one TRUSTED device on the home network; owner member streams"
          setup_api_calls:
            - call: "POST /hv/accounts"
              payload: { email: "bp1@x.com", region_code: "NA", plan_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /hv/accounts/${acc_id}/households"
              payload: { label: "Home", primary_location: "1 Main St", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /hv/households/${hh_id}/devices"
              payload: { device_label: "TV", device_type: "TV", network_fingerprint: "fp-home-1", geo_cell: "geo-home-1" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /hv/devices/${dev_id}/trust"
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /hv/members/${owner_id}/playback-sessions"
              payload: { device_id: "${dev_id}", requested_resolution: "HD" }
