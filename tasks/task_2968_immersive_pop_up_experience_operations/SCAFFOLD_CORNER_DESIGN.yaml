          Two ceiling checks cannot be evaluated until a prior derivation has succeeded: a slot's
          base_capacity can only be compared against run.effective_capacity once at least one room
          exists to derive that figure from, and a venue's requested_occupancy_load can only be
          compared against its egress_capacity, which is derived at venue creation from the declared
          width. An implementation that treats a room-less run as having unlimited capacity accepts
          the first slot; one that treats it as zero reports the ceiling error instead of the
          no-rooms error. Both are wrong, and only the error id distinguishes them.
