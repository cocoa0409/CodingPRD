      - name: corner_pending_approval_left_behind_by_a_round_bump_is_stale
        claim_type: cascading_validation
        grounds:
          - validations[priority=8]
          - errors.ERR_APPROVAL_ROUND_STALE
          - state_machines.ReroofProject.transitions["APPROVALS_OPEN -> APPROVALS_OPEN"].side_effects
          - state_machines.PartyApproval.transitions["APPROVED -> PENDING"]
        distinguishing_aspect: "The round-currency check can only be evaluated after the negotiation-round cascade has run, and the cascade deliberately re-bases only the approvals that were APPROVED. The system owner's never-decided approval therefore keeps round_recorded 1 while the project is on round 2, so its APPROVE is refused with ERR_APPROVAL_ROUND_STALE even though its status is a perfectly ordinary PENDING - whereas the roofer's approval, re-based to round 2 by the cascade, can approve again."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LEASE project needs three consents. The roofer approves in round 1; the solar owner then requests changes, which bumps the project to round 2, resets the roofer's APPROVED consent to PENDING at round 2, and leaves the system owner's untouched PENDING consent stranded at round 1."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "REQUEST_CHANGES", decision_note: "credit schedule needs rework" }
              as: SolarOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
              captures: { e_stale_round: $.data.error_id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
          assert:
            - "trigger call 1 returns HTTP 409 and ${e_stale_round} == ERR_APPROVAL_ROUND_STALE"
            - "trigger call 2 returns HTTP 200"
            - "ReroofProject.${p1}.negotiation_round == 2"
            - "ReroofProject.${p1}.phase == APPROVALS_OPEN"
            - "PartyApproval.${ap_sys}.status == PENDING"
            - "PartyApproval.${ap_sys}.round_recorded == 1"
            - "PartyApproval.${ap_sys}.decided_at == null"
            - "PartyApproval.${ap_roof}.status == APPROVED"
            - "PartyApproval.${ap_roof}.round_recorded == 2"
            - "PartyApproval.${ap_own}.status == CHANGES_REQUESTED"
            - "PartyApproval.${ap_own}.round_recorded == 1 (the approval that requested the changes is not re-based either; only the APPROVED ones are)"
            - "PartyApproval.${ap_own}.veto_flag == false"

