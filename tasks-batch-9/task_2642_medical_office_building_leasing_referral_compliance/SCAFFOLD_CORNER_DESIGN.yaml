          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite, one non-physician-owned INDEPENDENT_PRACTICE tenant, one DIRECT lease at 30.00 psf for 2026-09-01..2029-08-31 with SIGNED_LEASE on file."
