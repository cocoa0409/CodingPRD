      - name: keg_asset_cyclic_shape_second_lap
        claim_type: cyclic
        grounds:
          - state_machines.KegAsset.state
        excluded_because:
          difficulty_instance: keg_asset_cycles_back_through_clean_and_refill_from_a_second_run
          rationale: "The loop-back and the per-lap meter reset are the whole subject of the named §1.8 instance, including cycle_count retention."

      - name: beer_parallel_dimension_independence
        claim_type: parallel
        grounds:
          - state_machines.Beer.registration_state
          - state_machines.Beer.label_state
        excluded_because:
          difficulty_instance: beer_registration_and_label_dimensions_advance_independently
          rationale: "Independent advancement of the two dimensions and the combined derived flags are asserted there."

      - name: run_reconciliation_bubbles_up_from_child_kegs
        claim_type: Bubble up
        grounds:
          - state_machines.PackagingRun.reconciliation_state.OPEN_to_RECONCILED
        excluded_because:
          difficulty_instance: keg_return_cascades_variance_to_outstanding_count_to_run_reconciliation
          rationale: "The last-child-terminal bubble-up to RECONCILED and the roll-up sum are asserted as hops 2 and 3 there."

      - name: notice_suspension_cascade_down_to_licenses_and_orders
        claim_type: Cascade down
        grounds:
          - state_machines.Brewery.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: notice_suspension_cascades_license_to_order_to_released_run_allocation
          rationale: "The three-hop downward cascade and the non-revival of REJECTED orders are asserted there."

  # =========================================================================
  - section: calculations
    instances:
      - name: federal_tier_straddle_splits_one_period_across_cbma_and_standard_rates
        claim_type: tiered_pricing
        grounds:
          - calculations.federal_state_excise_tax
          - entities.ExciseReport.fields.ytd_bbl_before_period
          - entities.Brewery.fields.carry_in_taproom_bbl
        distinguishing_aspect: "The carry-in is parked 1.000 bbl below FED_TIER1_LIMIT_BBL, so a single 1.500 bbl period is cut by the tier edge: 1.000 bbl at 350 and 0.500 bbl at 1600. The same period also pushes ytd past SMALL_BREWER_STATE_CREDIT_LIMIT_BBL, so the 50% state credit vanishes and the state component is the raw split-rate sum."
        test_recipe:
          setup:
            - "Brewery ACTIVE with carry_in_taproom_bbl 59999.000 and carry_in_distribution_bbl 0.000, i.e. ytd_bbl_before_period == 59999.000."
            - "Beer FORMULA_EXEMPT and COLA_APPROVED; ID SELF_DISTRIBUTION license with cap 1000.00."
            - "Batch B-1001 conditioned at 16.000 bbl; one COMPLETED TAPROOM run (5.000 bbl) and one COMPLETED DISTRIBUTION run (5.000 bbl)."
            - "KEG-0001 (0.5 bbl) filled from the TAPROOM run and TAPPED at 2026-08-10T12:00:00Z, so whole-keg removal is 0.500 bbl."
            - "Order SO-6100 for 1.00 bbl allocated and SHIPPED at 2026-08-10T12:00:00Z, so distribution_bbl is 1.000."
            - "Clock advanced to 2026-09-01T00:00:00Z before the draft is prepared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BreweryAdmin
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /brewery/ytd-adjustments"
              payload: { carry_in_taproom_bbl: 59999.000, carry_in_distribution_bbl: 0.000 }
              as: ComplianceOfficer
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { tap_run_id: $.data.id }
            - call: "POST /packaging-runs/${tap_run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-DIST-1", package_type: "HALF_BBL_KEG", destination: "DISTRIBUTION", units_planned: 10, expected_batch_version: "${batch_v2}" }
              as: CellarOperator
              captures: { dist_run_id: $.data.id }
            - call: "POST /packaging-runs/${dist_run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${tap_run_id}" }
              as: CellarOperator
            - call: "POST /distribution-orders"
              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-6100", bbl_requested: 1.00, ship_to_state_code: "ID", distance_miles: 100, requested_ship_utc: "2026-08-10T12:00:00Z" }
              as: BreweryAdmin
              captures: { order_id: $.data.id }
            - call: "POST /distribution-orders/${order_id}/allocate"
              payload: {}
              as: BreweryAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: BreweryAdmin
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
            - call: "POST /distribution-orders/${order_id}/ship"
              payload: {}
              as: BreweryAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BreweryAdmin
          trigger:
            - call: "POST /excise-reports"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", taproom_basis: "WHOLE_KEG_REMOVAL" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { rep_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ExciseReport.${rep_id}.ytd_bbl_before_period == 59999.000"
            - "ExciseReport.${rep_id}.taproom_bbl == 0.500"
            - "ExciseReport.${rep_id}.distribution_bbl == 1.000"
            - "ExciseReport.${rep_id}.total_taxable_bbl == 1.500"
            - "ExciseReport.${rep_id}.federal_tax_cents == 1150 (tier1 1.000 bbl -> 350 plus tier2 0.500 bbl -> 800)"
            - "ExciseReport.${rep_id}.state_tax_cents == 1413 (543 taproom + 870 distribution; NO small-brewer credit because 59999.000 + 1.500 > 15000)"
            - "ExciseReport.${rep_id}.total_tax_due_cents == 2563"
            - "A flat 350-per-barrel federal computation would give 525 and a credited state component 707 - both wrong"

