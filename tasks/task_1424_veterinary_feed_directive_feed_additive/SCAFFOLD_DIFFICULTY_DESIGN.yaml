  # =========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2, different interval semantics, different resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vcpr_validity_interval_must_cover_vfd_issuance
        grounds:
          - validations[priority=8]
          - entities.VcpVerification.fields.expires_on
          - errors.ERR_VCPR_NOT_VERIFIED
        distinguishing_aspect: |
          Interval semantics: POINT-in-interval containment. VFD issuance
          requires that issued_on be within VCPR's [verified_on, expires_on)
          half-open window. If clock is set to expires_on exactly, the VCPR
          is treated as EXPIRED (not contained) — half-open, not closed.
          Resource = VcpVerification.
        test_recipe:
          setup:
            - "VCPR created with expires_on=2026-09-01T00:00:00Z; clock advanced to 2026-09-01T00:00:00Z exactly"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Fifteen", license_number: "LIC-C15", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Nat", license_number: "DVM-15", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P15", premise_id: "PIN-15", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 60, average_weight_lbs: 1100, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-15", label_name: "Med M", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2026-09-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Inspector
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-12-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VCPR_NOT_VERIFIED (VCPR expired at expires_on exactly; half-open window)"
            - "HTTP status == 422"

      - name: audit_window_intersection_with_record_lifetime
        grounds:
          - calculations.audit_required_records
          - entities.AuditBundle.fields.window_start
          - entities.AuditBundle.fields.window_end
        distinguishing_aspect: |
          Different interval semantics: INTERVAL-vs-INTERVAL intersection
          with half-open audit window and closed record lifetime. A record
          qualifies iff record.created_at < window_end AND (record.terminal_at
          IS NULL OR record.terminal_at >= window_start). A record created
          EXACTLY at window_end does NOT count (window is half-open at end).
          Resource = AuditBundle over record set. Different from point-in-
          interval: here two intervals overlap.
        test_recipe:
          setup:
            - "Producer P16 with: VFD A16a created 2026-07-15 (inside window); VFD A16b created exactly at window_end 2026-08-01T00:00:00Z"
            - "AuditBundle window [2026-07-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Sixteen", license_number: "LIC-C16", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. Ola", license_number: "DVM-16", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "Farm P16", premise_id: "PIN-16", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 60, average_weight_lbs: 1100, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-16", label_name: "Med N", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Inspector
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-12-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_a: $.data.id }
            - call: "POST /vfd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Inspector
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-12-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_b: $.data.id }
          trigger:
            - call: "POST /vfd/producers/${producer_id}/audit-bundles"
              payload: { window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: Inspector
              captures: { audit_id: $.data.id, req_count: $.data.required_record_count }
          assert:
            - "AuditBundle.required_record_count == 1 (VFD A16a created 2026-07-15 < window_end counts; VFD A16b created exactly AT window_end does NOT count — half-open)"
            - "VfdAuthorization.${vfd_b}.created_at == 2026-08-01T00:00:00Z (at boundary, excluded)"

  # =========================================================================
  # Rule 9 — compensating_invariant (>= 2, different conserved quantities)
  # =========================================================================
