              payload: { name: "Bistro2", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-15T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 40 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-15T10:00:00Z", qty: 10 }
              as: Manager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${order_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "BakePlanLine.${line_id}.reserved_qty == 0"
            - "BakePlanLine.${line_id}.available_qty == 40"
            - "BakePlanLine.${line_id}.par_qty == 40"

      - name: credit_balance_conservation_on_void
        grounds:
          - state_machines.DeliveryOrder.DELIVERED_to_CANCELLED
          - calculations.account_credit_balance
          - entities.WholesaleAccount.fields.credit_balance_cents
        distinguishing_aspect: "Conserved quantity is MONEY (credit_balance_cents): deliver books +360 then void reverses -360, returning credit_balance_cents to its pre-deliver value 0 — a different conserved quantity than par units."
        test_recipe:
          setup:
            - "Committed line par 10; STANDARD account; order qty 1 (line_total 360) packed then delivered (credit_balance 360)."
          setup_api_calls:
            - call: "POST /products"
