              as: AntiDopingLiaison
            - call: POST /doping-tests/${test_id}/collect
              payload: { collected_sample_ref: "COC-ONTIME" }
              as: AntiDopingLiaison
          assert:
            - "trigger call 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — window_start_at must precede window_end_at, caught by the priority 4 schema check"
            - "trigger call 2 returns HTTP 201 with status == SCHEDULED"
            - "trigger call 4 returns HTTP 422 with error_id == ERR_COLLECTION_WINDOW_INVALID — one second before the window opens is outside it"
            - "trigger call 6 returns HTTP 200 with status == COLLECTED, collected_at == \"2026-10-05T08:00:00.000Z\" and collected_sample_ref == \"COC-ONTIME\" — the window boundary is inclusive"

      - name: corner_validation_purse_line_category_combination_coherence
        claim_type: conditional_validation
        grounds:
          - entities.PurseLine.fields.place
          - entities.PurseLine.fields.threshold_seconds
          - entities.PurseLine.fields.division
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_CONFIG_DUPLICATE
        distinguishing_aspect: >-
          PurseLine is a polymorphic config row: which of place, threshold_seconds and division is
          required and which must be null depends entirely on category, so an OVERALL line carrying a
          division, a TIME_BONUS line carrying a place, and a TIME_BONUS line missing
          threshold_seconds must all be rejected — and a duplicate coordinate reports
          ERR_CONFIG_DUPLICATE rather than a schema error.
        test_recipe:
          setup:
            - "One PLANNING edition with a single OVERALL MALE place-1 line of 1,000,000 already configured."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Polymorphic Config Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 8000000, bonus_pool_cap_cents: 1000000 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
          trigger:
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 2, division: ELITE, amount_cents: 600000 }
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: TIME_BONUS, division: ELITE, gender: MALE, place: 1, threshold_seconds: 7600, amount_cents: 400000 }
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: TIME_BONUS, division: ELITE, gender: MALE, amount_cents: 400000 }
              as: ElitesDirector
              captures: { err3: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: MASTERS, gender: MALE, place: 1, amount_cents: 300000 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 999000 }
              as: ElitesDirector
              captures: { err4: "$.data.error_id" }
            - call: GET /race-editions/${ed_id}/purse-lines
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — an OVERALL line must carry a null division"
            - "trigger call 2 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — a TIME_BONUS line must carry a null place"
            - "trigger call 3 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — a TIME_BONUS line requires threshold_seconds"
            - "trigger call 4 returns HTTP 201 — a MASTERS line legitimately carries a place and a null division"
            - "trigger call 5 returns HTTP 409 with error_id == ERR_CONFIG_DUPLICATE — the (edition, OVERALL, null division, MALE, place 1, null threshold) coordinate is already taken"
            - "trigger call 6 returns total_count == 2 — only the original OVERALL line and the MASTERS line persisted"

      - name: corner_validation_mark_raced_before_race_date_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=13]
          - errors.ERR_RACE_DATE_NOT_REACHED
          - state_machines.RaceEdition.FIELD_LOCKED_to_RACED
        distinguishing_aspect: >-
          mark-raced runs the state check before the temporal one and both must pass: from
          FIELD_LOCKED with the logical clock still on 2026-10-31 it reports
          ERR_RACE_DATE_NOT_REACHED, and only once the clock reaches race day does the transition
          succeed — while from FIELD_OPEN the state error comes first regardless of the date.
        test_recipe:
          setup:
            - "One edition with race_date 2026-11-01, one ACCEPTED and bibbed ELITE MALE athlete, field NOT yet locked; the clock reads 2026-10-31T23:59:59Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Race Date Gate Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Race Day Reps", license_code: "AGT-RD-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Early Bird", country_code: USA, gender: MALE, birth_date: "1995-11-01", whereabouts_filed: true }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual RD", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-RD-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 700000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${inv_id}/assign-bib
              as: ElitesDirector
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-10-31T23:59:59Z" }
              as: TechnicalOfficial
          trigger:
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
              captures: { err1: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
              captures: { err2: "$.data.error_id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_EDITION_STATE_INVALID — the state check at priority 8 runs before the temporal check at priority 13, even though the race date is also unmet"
            - "trigger call 2 returns status == FIELD_LOCKED"
            - "trigger call 3 returns HTTP 422 with error_id == ERR_RACE_DATE_NOT_REACHED — one second before race day, with the state now satisfied so the deeper check is reached"
            - "trigger call 5 returns HTTP 200 with status == RACED at exactly 2026-11-01T00:00:00Z, so the race-day boundary is inclusive"

      - name: corner_validation_priority_state_over_fiscal
        claim_type: priority_conflict
