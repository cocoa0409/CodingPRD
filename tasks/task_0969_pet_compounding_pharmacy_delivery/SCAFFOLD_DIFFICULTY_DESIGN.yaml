        grounds:
          - calculations.cooler_conditioning_window
          - validations[priority=22]
          - state_machines.CoolerAsset.ASSIGNED_to_CONDITIONING
          - errors[ERR_COOLER_CONDITIONING]
        distinguishing_aspect: |
          Resource CoolerAsset with CLOSED + mandatory-gap semantics (different than the
          bench's half-open adjacency): after a 10:00 delivery the cooler cannot be
          reattached until clock >= 12:00 — 11:59 rejects with ERR_COOLER_CONDITIONING
          even though no interval overlaps, and exactly 12:00 attaches.
        test_recipe:
          setup:
            - "Cold-chain drug; cooler CLR-T2; order 1 delivered at clock 2026-05-02T10:00 (conditioning until 12:00); order 2 READY_TO_DISPATCH and paid"
          setup_api_calls:
