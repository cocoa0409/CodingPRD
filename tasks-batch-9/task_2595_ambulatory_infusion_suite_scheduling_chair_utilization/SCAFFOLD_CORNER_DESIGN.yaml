            directions by that §1.8 instance — refused with ERR_AUTH_NOT_APPROVED while the
            request sits PENDED, then admitted after the APPROVED decision with no other
            input changed.

      - name: schedule_and_readiness_dimensions_advance_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: readiness_reverts_to_auth_cleared_while_schedule_advances_to_checked_in
          rationale: |
            The parallel-dimension corner — two state machines on one Appointment row, where
            readiness_status walks FULLY_CLEARED -> AUTH_CLEARED on lab staleness while
            schedule_status independently reaches CHECKED_IN — is exactly that §1.8
