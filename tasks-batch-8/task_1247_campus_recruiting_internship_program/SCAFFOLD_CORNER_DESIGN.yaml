      - name: occ_school_target_stale_version
        claim_type: stale_version_occ
        grounds: ["concurrency_rules[school-target-config-stale-update]", "validations[priority=6]", "errors[ERR_STALE_SCHOOL_TARGET_VERSION]"]
        distinguishing_aspect: "PATCH /school-targets/{id} is OCC-guarded: a config edit carrying a pre-edit version is rejected 412."
        test_recipe:
          setup: ["season DRAFT; school target at version 1"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "PATCH /campus-recruiting/school-targets/${st_id}"
              payload: { tier: "CORE", expected_school_target_version: "${st_v}" }
              as: RecruitingAdmin
              captures: { st_v2: $.data.version, tier2: $.data.tier }
            - call: "PATCH /campus-recruiting/school-targets/${st_id}"
              payload: { application_cap: 5, expected_school_target_version: "${st_v}" }
              as: RecruitingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${st_v2} == 2 and ${tier2} == CORE"
            - "${err} == ERR_STALE_SCHOOL_TARGET_VERSION (stale expected version rejected)"
            - "SchoolTarget.${st_id}.application_cap remains 10 (losing write discarded)"

  # ---------------------------------------------------------------------------
