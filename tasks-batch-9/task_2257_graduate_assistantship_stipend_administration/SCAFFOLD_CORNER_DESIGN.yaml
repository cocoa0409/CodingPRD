          trigger:
            - call: "PUT /appointments/${appt_id}/funding-plan"
              payload: { allocations: [ { funding_source_id: "${src_a_id}", share_pct: 60.00 }, { funding_source_id: "${src_b_id}", share_pct: 40.00 } ], expected_appointment_version: "${appt_v2}" }
              as: DepartmentAdmin
