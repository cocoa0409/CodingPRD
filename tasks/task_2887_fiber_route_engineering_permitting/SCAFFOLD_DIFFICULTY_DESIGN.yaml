              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-25" }
              as: PermitCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /permit-applications/${p2_id}/submit"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /permit-applications/${p2_id}/review"
