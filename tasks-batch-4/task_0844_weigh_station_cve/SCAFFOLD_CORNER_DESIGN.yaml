            - "HTTP status == 403"

      - name: adjudicate_same_officer_returns_403_sod
        claim_type: segregation_of_duties
        grounds: ['validations[priority=5]', 'errors[ERR_SOD_CONFLICT]', entities.Citation.fields.issued_by_user_id]
        distinguishing_aspect: "The EnforcementOfficer who issued a citation (X-User-ID officer-1) adjudicating its own contest is denied ERR_SOD_CONFLICT (403)."
        test_recipe:
          setup: ["Active carrier; overweight inspection finalized OOS; citation issued by officer-1 and contested."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C20", legal_name: "Corner Twenty", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S20", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C20", full_name: "Cor Twenty" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C20", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { citation_id: "$.data.id" } }
            - { call: "POST /citations/${citation_id}/contest", payload: { contest_reason: "y" }, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /citations/${citation_id}/adjudicate", payload: { result: "UPHOLD", certified_gross_lbs: 86000, certified_axle_lbs: 21000 }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_SOD_CONFLICT"
            - "HTTP status == 403"

      - name: unauthenticated_missing_role_returns_401
        claim_type: exclusive_denied
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request to POST /carriers with no X-User-Role header is rejected ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB; the request carries no auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C21", legal_name: "Corner TwentyOne", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: score_snapshot_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[score-snapshot-create-stale-carrier]', 'endpoints."POST /carriers/{carrierId}/score-snapshots"']
        distinguishing_aspect: "A CERTIFIED snapshot with expected_carrier_version matching the carrier's current version succeeds (201), method CERTIFIED, is_current true, and bumps carrier.version."
        test_recipe:
          setup: ["Active carrier with no prior snapshot; current version read just before the call."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C22", legal_name: "Corner TwentyTwo", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "GET /carriers/${carrier_id}", payload: {}, as: ComplianceAdmin, captures: { cur_v: "$.data.version" } }
          trigger:
            - { call: "POST /carriers/${carrier_id}/score-snapshots", payload: { expected_carrier_version: "${cur_v}" }, as: ComplianceAdmin, captures: { snap_id: "$.data.id", snap_method: "$.data.method", snap_current: "$.data.is_current" } }
          assert:
            - "ScoreSnapshot.${snap_id}.method == CERTIFIED"
            - "ScoreSnapshot.${snap_id}.is_current == true"
            - "ScoreSnapshot.${snap_id}.iss_score == 0"

      - name: score_snapshot_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[score-snapshot-create-stale-carrier]', 'errors[ERR_STALE_CARRIER_VERSION]']
        distinguishing_aspect: "After one snapshot bumps carrier.version from 1 to 2, a second create still carrying expected_carrier_version=1 is rejected ERR_STALE_CARRIER_VERSION (412)."
        test_recipe:
          setup: ["Active carrier; version captured at create (=1); one snapshot already created (version now 2)."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C23", legal_name: "Corner TwentyThree", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id", carrier_v1: "$.data.version" } }
            - { call: "POST /carriers/${carrier_id}/score-snapshots", payload: { expected_carrier_version: "${carrier_v1}" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /carriers/${carrier_id}/score-snapshots", payload: { expected_carrier_version: "${carrier_v1}" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_STALE_CARRIER_VERSION"
            - "HTTP status == 412"

