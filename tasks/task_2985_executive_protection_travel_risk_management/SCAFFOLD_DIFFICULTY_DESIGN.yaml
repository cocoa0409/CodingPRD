            - "ProtectiveDetailAssignment.${pda_id}.status == CONFIRMED and TripLeg.${leg_id}.lead_agent_covered == true   # the chain never touches the roster, so DEGRADED here is caused only by advance_complete"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: resubmit_over_budget_trip_returns_state_error_not_fiscal_error
        grounds:
          - validations[priority=21]
          - validations[priority=49]
          - errors.ERR_TRIP_INVALID_APPROVAL_STATE
          - errors.ERR_SECURITY_BUDGET_EXCEEDED
          - state_machines.Trip.DRAFT_to_PENDING_REVIEW
          - calculations.commitment_ledgers
        distinguishing_aspect: |
          Category pair `state` (priority 21) versus `business_fiscal` (priority 49) — the
          widest gap in the ladder. The second submit-for-approval violates BOTH rules at
          once: the trip is already PENDING_REVIEW, and re-committing its 112500-cent
          provisional against a remaining budget of 37500 would overdraw the executive.
          The 409 ERR_TRIP_INVALID_APPROVAL_STATE must win over the 402
          ERR_SECURITY_BUDGET_EXCEEDED, and the HTTP status (409 vs 402) makes the
          precedence unmistakable.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one TIER_3 executive whose annual_security_budget_cents is only 150000, residential_component 10.00"
