  - rule_id: resource_temporal_overlap
    instances:
      - name: furnace_half_open_window_exclusion
        grounds:
          - validations[priority=13]
          - entities.MeltBatch.fields.furnace_id
        distinguishing_aspect: |
          Resource: furnace. Interval semantics: half-open exclusive booking —
          [start, end) intervals on the same furnace_id may TOUCH (a new batch
          starting exactly when another's window ends is allowed) but any strict
          overlap is rejected. Asserted: [12:00,14:00) succeeds against
          [10:00,12:00) (adjacency), [11:00,13:00) fails on the same furnace,
          and the same overlapping window succeeds on the other furnace —
          the resource is the furnace, the exclusion is geometric half-open.
        test_recipe:
          setup:
            - "Product P, order O (planned 30) released"
            - "Melt B1 booked on FURNACE_A [2026-09-02T10:00, 12:00); melt B2 booked on FURNACE_A [12:00, 14:00) — adjacent, allowed"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
