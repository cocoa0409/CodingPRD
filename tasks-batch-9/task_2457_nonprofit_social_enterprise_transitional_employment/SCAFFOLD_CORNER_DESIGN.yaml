          rationale: |
            That instance already approves a line whose composite score is exactly 70.00 and refuses
            the 69.99 case with ERR_VIABILITY_GATE_NOT_MET, including the weighted-rounding step that
            decides which side of the floor the score lands on. A separate corner test could only
            re-trigger the same code with a less discriminating input.

  - section: rbac
    instances:

      - name: funder_analyst_cannot_create_business_line
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.ProgramDirector.exclusive_operations
          - rbac.FunderAnalyst
          - validations[priority 2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          FunderAnalyst is a read-only reporting role: it can reach every outcome and cost read but
          must be refused on the ProgramDirector's exclusive writes, and the refusal must happen at
          priority 2 -- before the request body is validated at all, so an otherwise-perfect payload
          still returns 403 and creates nothing.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /business-lines"
              payload: { name: "Analyst Line", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: FunderAnalyst
              captures: { e_role: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" and data.message present"
            - "GET /business-lines/${any_id} finds nothing -- the refused call created no row"
            - "the same payload sent as ProgramDirector returns HTTP 201, proving the payload itself was valid and only the role decided the outcome"

      - name: job_coach_cannot_graduate_participant
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.CaseManager.exclusive_operations
          - rbac.JobCoach.exclusive_operations
          - validations[priority 2]
          - validations[priority 3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Readiness certification and graduation are split between two roles by design (that split is
          what makes segregation of duties enforceable), so the JobCoach who certifies must be refused
          on graduate -- and because priority 2 outranks priority 3, the refusal is 403 even for a
          participant id that does not exist.
        test_recipe:
          setup:
            - "Empty database; ${unknown_participant_id} matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /participants/${unknown_participant_id}/graduate"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
              captures: { e_role: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\", NOT 404 ERR_PARTICIPANT_NOT_FOUND -- priority 2 is evaluated before existence at priority 3"
            - "the mirror case holds: POST /participants/${unknown_participant_id}/certify-readiness as CaseManager also returns 403, since certify-readiness is the JobCoach's exclusive operation"

      - name: case_manager_cannot_deliver_support_activity
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.JobCoach.exclusive_operations
          - rbac.CaseManager.shared_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          CaseManager shares the CREATE of a support activity with JobCoach but not its DELIVERY --
          delivery is the act that moves money into the mission ledger and counts toward graduation,
          so it stays exclusively the coach's. A role table that grants the whole SupportActivity
          resource to both roles fails here.
        test_recipe:
          setup:
            - "Empty database; ${unknown_activity_id} matches no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /support-activities/${unknown_activity_id}/deliver"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { e_role: $.data.error_id }
            - call: "POST /support-activities/${unknown_activity_id}/void"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { e_role_void: $.data.error_id }
          assert:
            - "deliver as CaseManager: HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "void as CaseManager: HTTP 403 as well -- void is the ProgramDirector's compensating operation, not the case manager's"
            - "neither refusal is a 404, again because priority 2 precedes priority 3"

      - name: support_activity_create_shared_by_coach_and_case_manager
        claim_type: shared_operation_allowed
        grounds:
          - rbac.JobCoach.shared_operations
          - rbac.CaseManager.shared_operations
          - endpoints[POST /support-activities]
        distinguishing_aspect: |
          The shared half of the split must actually be shared: both JobCoach and CaseManager create
          activities for the same participant and both rows land in SCHEDULED with the creating user
          recorded, so the later segregation-of-duties check has two distinct actors to compare.
        test_recipe:
          setup:
            - "Launched line with an OPEN September period and one enrolled participant p1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 6000 }
              as: JobCoach
              as_user_id: "coach-1"
              captures: { act_coach_id: $.data.id }
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "CASE_MANAGEMENT", duration_minutes: 45, cost_cents: 3000 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { act_cm_id: $.data.id }
            - call: "GET /support-activities"
              payload: { participant_id: "${p1_id}" }
              as: FunderAnalyst
          assert:
            - "both creates return HTTP 201 with data.status == \"SCHEDULED\" and data.cost_entry_id == null (no ledger movement before delivery)"
            - "the coach's row records created_by_user_id \"coach-1\" and the case manager's records \"cm-1\""
            - "the list read as FunderAnalyst returns total_count == 2 -- the analyst can read what it cannot write"
            - "GET /participants/${p1_id} still reports support_minutes_total == 0 and coaching_session_count == 0: creation alone never advances graduation readiness"

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_subsidy_period_version_on_second_cost_entry_returns_412
        claim_type: optimistic_concurrency_stale_version
        grounds:
          - concurrency_rules[POST /cost-entries]
          - errors[ERR_STALE_SUBSIDY_PERIOD_VERSION]
          - validations[priority 9]
          - complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          The ledger's OCC guard is on the SubsidyPeriod, and every accepted cost entry bumps that
          version -- so a caller that batches two posts from one read is refused on the second even
          though nothing about the entry itself is wrong. Re-reading the period makes the identical
          payload succeed, which distinguishes a real version check from a no-op that just echoes the
          supplied number.
        test_recipe:
          setup:
            - "Launched line with one OPEN period 2026-09-01..2026-09-30; the create response's version is captured as the caller's snapshot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id, sp_v: $.data.version }
          trigger:
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "MATERIALS", classification: "BUSINESS", amount_cents: 40000, expected_subsidy_period_version: "${sp_v}" }
              as: ProgramDirector
              captures: { ce1_id: $.data.id }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "OVERHEAD", classification: "SHARED", amount_cents: 25000, expected_subsidy_period_version: "${sp_v}" }
              as: ProgramDirector
              captures: { e_stale: $.data.error_id }
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: ProgramDirector
              captures: { sp_v2: $.data.version }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "OVERHEAD", classification: "SHARED", amount_cents: 25000, expected_subsidy_period_version: "${sp_v2}" }
              as: ProgramDirector
              captures: { ce2_id: $.data.id }
          assert:
            - "first post: HTTP 201, and the period's version is now ${sp_v} + 1"
            - "second post reusing the snapshot: HTTP 412 with data.error_id == \"ERR_STALE_SUBSIDY_PERIOD_VERSION\""
            - "the refused post created nothing: GET /cost-entries?subsidy_period_id=${sp_id} reports total_count == 1 between the two attempts"
            - "the retry with the re-read version returns HTTP 201 with the SAME body as the refused attempt, so the only difference was the version"
            - "after the retry GET /cost-entries?subsidy_period_id=${sp_id} reports total_count == 2 and the period version is ${sp_v} + 2"

      - name: business_line_version_increments_on_every_enrolling_write
        claim_type: optimistic_concurrency_version_increment
        grounds:
          - concurrency_rules[POST /participants]
          - complexity_layers.optimistic_concurrency
          - state_machines.BusinessLine
        distinguishing_aspect: |
          The line's version is a shared counter, not a per-endpoint one: review, launch and every
          enrollment all bump it, so a caller holding a version from before ANY of those writes is
          stale. Implementations that bump only on the OCC-guarded endpoint pass a naive test and fail
          this one, because the version after launch is 3, not 1.
        test_recipe:
          setup:
            - "One DRAFT line, one TIER_1 partner and two ELIGIBLE referrals ready to enroll into 3 slots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
