      - name: the_waterfall_conserves_every_cent_on_an_underwater_sale
        claim_type: boundary_waterfall_allocation
        grounds:
          - calculations.resale_proceeds_waterfall
          - state_machines.ResaleTransaction.BUYER_CERTIFIED_to_CLOSED
        distinguishing_aspect: |
          When net proceeds fall below the seller's restricted equity basis the first bucket
          absorbs everything and buckets 2 through 4 collapse to zero, which is the degenerate
          end of the waterfall: a 32000000 sale less a 1000000 broker fee nets 31000000 against a
          32500000 basis, so seller_equity_cents is 31000000 and improvement, appreciation and
          recapture are all 0. The conservation invariant still holds exactly, and because
          city_recapture_cents is 0 the trust fund's total_recapture_cents does not move even
          though a restricted unit changed hands.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units, approval 2026-01-15) screened SUBJECT, ONSITE elected, agreement recorded with resale_formula AMI_INDEXED and owner_appreciation_share_bps 2500."
            - "OWNERSHIP 2-bedroom unit UW-101 at 5000 bps with its restriction recorded at original_purchase_price_cents 32500000; the AMI schedule is unchanged so max_resale_price_cents is 32500000."
            - "Seller household H1 (size 3, income 6000000) certified into the unit at contract_rent_cents 0; buyer household H2 (size 2, income 5000000) registered."
            - "No in-lieu fee has ever been paid, so the trust fund starts entirely empty."
