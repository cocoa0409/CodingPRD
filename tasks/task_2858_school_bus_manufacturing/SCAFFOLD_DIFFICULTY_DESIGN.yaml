              captures: { unit_tx_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "L-B1", plant_code: "PLANT-B", supported_body_classes: ["TYPE_C"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_b1_id: $.data.id, line_v0: $.data.version }
            - call: "POST /build-slots"
