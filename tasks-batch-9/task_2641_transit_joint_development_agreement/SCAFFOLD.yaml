scenario: |
  Generate task harder than expert level!

  2641. Transit Joint Development Agreement (transit agency real estate office): agency-owned
  site inventory and development readiness assessment with federal interest constraints,
  solicitation, developer selection and negotiated exclusive dealing periods, fair market value
  determination and permissible below-market transfers for transit-supportive uses, ground lease
  versus disposition structure and revenue to the agency, transit facility replacement,
  construction staging and operating impacts during development, affordable housing and joint use
  requirements, federal grant compliance and disposition approval, ongoing coordination on shared
  facilities and maintenance responsibilities
domain_name: transit-joint-development-agreement
api_prefix: "/jda"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    AgencySite, Developer, Solicitation, Proposal, ValuationDetermination and
    JointDevelopmentAgreement form a directed graph rather than a tree: a Proposal joins a
    Solicitation to a Developer, an ExclusiveNegotiationPeriod joins an AgencySite to a Proposal,
    a JointDevelopmentAgreement joins four parents (AgencySite, Developer, Proposal,
    ValuationDetermination), and StagingWindow / MaintenanceCharge join a
    JointDevelopmentAgreement to a SharedFacility that is owned by the site rather than by the
    agreement. Several URL paths are nested for readability, but ownership is many-to-many.

  state_machine_shape: parallel
  state_machine_shape_note: |
    JointDevelopmentAgreement carries two independent state dimensions on the same row
    (negotiation_status x federal_approval_status) that advance under different roles and
    different endpoints, and negotiation_status itself is cyclic
    (AGENCY_REVIEW -> REVISION_REQUESTED -> DRAFTING -> AGENCY_REVIEW). AgencySite is cyclic
    (ASSESSED -> INVENTORIED -> ASSESSED). StagingWindow is branching (REQUESTED -> {APPROVED,
    REJECTED} with divergent side-effect sets). JointDevelopmentAgreement.execute is branching
    on structure with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic_note: "none — every FK is single-typed"

  role_model: segregation_of_duties
  role_model_note: |
    Drafting, valuation certification, board approval, federal compliance and transit operations
    are five disjoint duties. In addition, the operator identity (X-User-ID) that submits an
    agreement for review MUST NOT be the operator identity that board-approves it, even though
    the two acts require different roles — the same person may legitimately hold both roles.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: AgencySite
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_code
        type: string
        source: input
        description: "Agency parcel identifier, unique across all sites"
        constraints: "1..32 chars; uniqueness violation -> ERR_DUPLICATE_SITE_CODE"
      - name: name
        type: string
        source: input
        description: "Human-readable site name"
      - name: address_line
        type: string
        source: input
        description: "Street address of the parcel"
      - name: parcel_area_sqft
        type: integer
        source: input
        description: "Parcel land area in square feet"
        constraints: ">= 1"
      - name: acquisition_funding_source
        type: enum
        source: input
        description: "How the agency acquired the parcel; drives federal interest constraints"
        constraints: "FEDERAL_GRANT | LOCAL_ONLY | MIXED"
      - name: federal_interest_pct
        type: number
        source: input
        description: "Percent of the parcel's value in which the federal grantor retains an interest"
        constraints: "0 <= federal_interest_pct <= 100; MUST be exactly 0 when acquisition_funding_source == LOCAL_ONLY, else ERR_INVALID_REQUEST"
      - name: transit_facility_present
        type: boolean
        source: input
        default: false
        description: "True when an operating transit facility sits on the parcel and must be replaced before conveyance"
      - name: status
        type: enum
        source: system
        default: INVENTORIED
        description: "Site lifecycle state"
        constraints: "INVENTORIED | ASSESSED | SOLICITATION_READY | UNDER_AGREEMENT | CONVEYED"
      - name: readiness_composite_score
        type: number
        source: computed
        default: null
        description: "Copy of the composite_score of the site's most recently CERTIFIED ReadinessAssessment; null when none exists"
      - name: readiness_tier
        type: enum
        source: computed
        default: null
        description: "Copy of the tier of the site's most recently CERTIFIED ReadinessAssessment; null when none exists"
        constraints: "READY | CONDITIONAL | NOT_READY | null"
      - name: federal_interest_basis_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(latest CERTIFIED ValuationDetermination.appraised_value_cents * federal_interest_pct / 100); 0 while no CERTIFIED valuation exists"
      - name: federal_interest_encumbered_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of FederalDispositionRequest.federal_interest_amount_cents over requests on this site's agreements whose determination IN {PENDING, APPROVED, APPROVED_WITH_CONDITIONS}"
      - name: federal_interest_unencumbered_cents
        type: integer
        source: computed
        default: 0
        description: "federal_interest_basis_cents - federal_interest_encumbered_cents; conserved-quantity partner of federal_interest_encumbered_cents"

  - name: ReadinessAssessment
    parent: AgencySite
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the assessed parcel (taken from the path, not the body)"
      - name: environmental_score
        type: integer
        source: input
        description: "Environmental clearance readiness, 0..100"
        constraints: "0 <= v <= 100"
      - name: utility_score
        type: integer
        source: input
        description: "Utility availability readiness, 0..100"
        constraints: "0 <= v <= 100"
      - name: access_score
        type: integer
        source: input
        description: "Street and pedestrian access readiness, 0..100"
        constraints: "0 <= v <= 100"
      - name: entitlement_score
        type: integer
        source: input
        description: "Local land-use entitlement readiness, 0..100"
        constraints: "0 <= v <= 100"
      - name: encumbrance_count
        type: integer
        source: input
        description: "Count of recorded easements, licenses and leases burdening the parcel"
        constraints: ">= 0"
      - name: assessment_notes
        type: string
        source: input
        default: ""
        description: "Free-text assessor notes"
      - name: composite_score
        type: number
        source: computed
        description: "Output of calculations.readiness_composite_score; PRELIMINARY variant at creation, recomputed with the CERTIFIED variant at certification"
      - name: variant_applied
        type: enum
        source: computed
        default: PRELIMINARY
        description: "Which readiness_composite_score variant produced composite_score"
        constraints: "PRELIMINARY | CERTIFIED"
      - name: tier
        type: enum
        source: computed
        default: null
        description: "Readiness tier derived from the CERTIFIED composite_score; null while status == DRAFT"
        constraints: "READY | CONDITIONAL | NOT_READY | null"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Assessment lifecycle state"
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"
      - name: certified_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which the assessment was certified"

  - name: Developer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the development entity"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"
      - name: prequalified
        type: boolean
        source: input
        default: false
        description: "True when the developer has passed agency prequalification; false costs PREQUALIFICATION_PENALTY_POINTS in proposal scoring"
      - name: debarment_status
        type: enum
        source: input
        default: CLEAR
        description: "Federal debarment posture; DEBARRED and SUSPENDED block proposal submission and agreement creation"
        constraints: "CLEAR | SUSPENDED | DEBARRED"

  - name: Solicitation
    parent: AgencySite
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the parcel being offered (taken from the path)"
      - name: solicitation_type
        type: enum
        source: input
        description: "Procurement vehicle"
        constraints: "RFP | RFQ | UNSOLICITED_RESPONSE"
      - name: response_deadline
        type: datetime
        source: input
        description: "Logical-clock instant after which proposals are refused"
      - name: benchmark_value_cents
        type: integer
        source: input
        description: "Agency benchmark value used as the denominator of proposal value scoring"
        constraints: ">= 1"
      - name: affordable_housing_min_pct
        type: number
        source: input
        description: "Minimum affordable share of total units a responsive proposal must commit"
        constraints: "0 <= v <= 100"
      - name: min_proposals_required
        type: integer
        source: input
        default: 1
        description: "Minimum count of SUBMITTED or SHORTLISTED proposals required to close the solicitation"
        constraints: ">= 1"
      - name: joint_use_required
        type: boolean
        source: input
        default: false
        description: "True when the winning project must dedicate joint-use space to the agency"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Solicitation lifecycle state"
        constraints: "DRAFT | ISSUED | CLOSED | AWARDED | CANCELLED"
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of issuance"
      - name: responsive_proposal_count
        type: integer
        source: computed
        default: 0
        description: "Count of this solicitation's Proposals whose status IN {SUBMITTED, SHORTLISTED}, refreshed on every proposal write and at close"

  - name: Proposal
    parent: Solicitation
    common_fields: true
    entity_kind: resource
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; the solicitation responded to (taken from the path)"
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the responding developer, which MUST equal X-User-ID"
      - name: proposed_structure
        type: enum
        source: input
        description: "Conveyance structure the developer proposes"
        constraints: "GROUND_LEASE | FEE_DISPOSITION"
      - name: proposed_annual_rent_cents
        type: integer
        source: input
        default: 0
        description: "Annual ground rent offered; MUST be >= 1 when proposed_structure == GROUND_LEASE"
        constraints: ">= 0"
      - name: proposed_purchase_price_cents
        type: integer
        source: input
        default: 0
        description: "Purchase price offered; MUST be >= 1 when proposed_structure == FEE_DISPOSITION"
        constraints: ">= 0"
      - name: affordable_units
        type: integer
        source: input
        description: "Count of income-restricted units offered"
        constraints: ">= 0"
      - name: total_units
        type: integer
        source: input
        description: "Total residential units in the proposed project"
        constraints: ">= 1"
      - name: transit_ridership_uplift
        type: integer
        source: input
        description: "Projected additional daily boardings attributable to the project"
        constraints: ">= 0"
      - name: design_compliance_score
        type: integer
        source: input
        description: "Agency design-guideline compliance rating, 0..100"
        constraints: "0 <= v <= 100"
      - name: joint_use_committed
        type: boolean
        source: input
        default: false
        description: "True when the proposal dedicates joint-use space to the agency"
      - name: affordable_pct
        type: number
        source: computed
        description: "round_half_up(100 * affordable_units / total_units, 2)"
      - name: evaluation_score
        type: number
        source: computed
        description: "Output of calculations.proposal_evaluation_score, computed at submission and frozen thereafter"
      - name: rank
        type: integer
        source: computed
        default: null
        description: "1-based rank within the solicitation, assigned only at solicitation close; null before close"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Proposal lifecycle state"
        constraints: "SUBMITTED | SHORTLISTED | SELECTED | REJECTED"

  - name: ExclusiveNegotiationPeriod
    parent: AgencySite
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the parcel taken off the market for the exclusive dealing period"
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the proposal granted exclusivity"
      - name: start_date
        type: string
        source: input
        description: "First day of the exclusive dealing period, inclusive"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: "Last day of the exclusive dealing period, inclusive"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; MUST be > start_date else ERR_INVALID_INTERVAL"
      - name: extension_count
        type: integer
        source: computed
        default: 0
        description: "Number of granted extensions; capped by constants.MAX_NEGOTIATION_EXTENSIONS"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Exclusive dealing period state"
        constraints: "ACTIVE | EXTENDED | EXPIRED | TERMINATED | CONVERTED"
      - name: termination_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the period is terminated early"

  - name: ValuationDetermination
    parent: AgencySite
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the appraised parcel (taken from the path)"
      - name: method
        type: enum
        source: input
        description: "Appraisal method of record"
        constraints: "INCOME_APPROACH | SALES_COMPARISON | COST_APPROACH"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Fair market value of the parcel as appraised"
        constraints: ">= 1"
      - name: transit_supportive_use_pct
        type: number
        source: input
        description: "Share of project floor area devoted to transit-supportive uses"
        constraints: "0 <= v <= 100"
      - name: affordable_units_pct
        type: number
        source: input
        description: "Affordable share of units assumed by the appraisal"
        constraints: "0 <= v <= 100"
      - name: transfer_basis
        type: enum
        source: input
        description: "Whether the transfer must recover full fair market value or may go below market for transit-supportive uses"
        constraints: "FMV_STRICT | TRANSIT_SUPPORTIVE_BELOW_MARKET"
      - name: effective_date
        type: string
        source: input
        description: "Valuation effective date"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: transit_supportive_credit_cents
        type: integer
        source: computed
        description: "Output of calculations.permissible_transfer_floor step 3; recorded under both variants"
      - name: federal_interest_floor_cents
        type: integer
        source: computed
        description: "round_half_up(appraised_value_cents * AgencySite.federal_interest_pct / 100); the below-market floor may never go under this"
      - name: permissible_floor_cents
        type: integer
        source: computed
        description: "Output of calculations.permissible_transfer_floor; the minimum consideration the agency may accept"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Valuation lifecycle state"
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"
      - name: certified_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of certification"

  - name: JointDevelopmentAgreement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the parcel conveyed or leased"
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the counterparty"
      - name: proposal_id
        type: string
        source: input
        description: "FK -> Proposal.id; the selected proposal this agreement documents"
      - name: valuation_id
        type: string
        source: input
        description: "FK -> ValuationDetermination.id; the valuation whose permissible_floor_cents governs consideration"
      - name: structure
        type: enum
        source: input
        description: "Conveyance structure of record"
        constraints: "GROUND_LEASE | FEE_DISPOSITION"
      - name: term_years
        type: integer
        source: input
        description: "Ground lease term, or amortization horizon for a fee disposition"
        constraints: ">= 1"
      - name: base_rent_cents
        type: integer
        source: input
        default: 0
        description: "Annual base rent; MUST be >= 1 when structure == GROUND_LEASE"
        constraints: ">= 0"
      - name: purchase_price_cents
        type: integer
        source: input
        default: 0
        description: "One-time purchase price; MUST be >= 1 when structure == FEE_DISPOSITION"
        constraints: ">= 0"
      - name: revenue_share_pct
        type: number
        source: input
        description: "Agency participation share of projected gross project revenue, expressed as a decimal fraction"
        constraints: "0 <= v <= 1"
      - name: projected_gross_revenue_cents
        type: integer
        source: input
        description: "Projected annual gross project revenue used for participation rent"
        constraints: ">= 0"
      - name: affordable_units_committed
        type: integer
        source: input
        description: "Income-restricted units committed by the agreement"
        constraints: ">= 0"
      - name: total_units
        type: integer
        source: input
        description: "Total units in the documented project"
        constraints: ">= 1"
      - name: site_area_share_pct
        type: number
        source: input
        description: "Share of the parcel this agreement disposes of; scales the federal interest amount"
        constraints: "0 < v <= 100"
      - name: joint_use_committed
        type: boolean
        source: input
        default: false
        description: "True when the agreement dedicates joint-use space to the agency"
      - name: capital_credit_cents
        type: integer
        source: computed
        description: "Step 5 of calculations.annual_revenue_to_agency"
      - name: annual_revenue_to_agency_cents
        type: integer
        source: computed
        description: "Output of calculations.annual_revenue_to_agency"
      - name: consideration_value_cents
        type: integer
        source: computed
        description: "Output of calculations.consideration_value; compared against ValuationDetermination.permissible_floor_cents at submit-for-review"
      - name: negotiation_status
        type: enum
        source: system
        default: DRAFTING
        description: "Negotiation dimension of the agreement's parallel state; independent of federal_approval_status"
        constraints: "DRAFTING | AGENCY_REVIEW | REVISION_REQUESTED | BOARD_APPROVED | EXECUTED"
      - name: federal_approval_status
        type: enum
        source: system
        description: "Federal disposition dimension of the agreement's parallel state; initialised to NOT_REQUIRED when AgencySite.federal_interest_pct == 0, else NOT_SUBMITTED"
        constraints: "NOT_REQUIRED | NOT_SUBMITTED | SUBMITTED | FTA_APPROVED | FTA_REJECTED"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who last submitted the agreement for review; segregation-of-duties comparand at board-approve"
      - name: board_resolution_number
        type: string
        source: system
        default: null
        description: "Board resolution number recorded at board approval"
      - name: execution_date
        type: string
        source: system
        default: null
        description: "Execution date recorded at execution"
      - name: revision_notes
        type: string
        source: system
        default: null
        description: "Notes recorded by the board when a revision is requested"

  - name: FederalDispositionRequest
    parent: JointDevelopmentAgreement
    common_fields: true
    entity_kind: resource
    fields:
      - name: jda_id
        type: string
        source: input
        description: "FK -> JointDevelopmentAgreement.id; the agreement submitted for federal disposition approval (taken from the path)"
      - name: narrative
        type: string
        source: input
        description: "Justification narrative filed with the grantor"
      - name: federal_interest_amount_cents
        type: integer
        source: computed
        description: "Output of calculations.federal_interest_amount; the slice of AgencySite.federal_interest_basis_cents this request encumbers"
      - name: determination
        type: enum
        source: system
        default: PENDING
        description: "Grantor determination"
        constraints: "PENDING | APPROVED | APPROVED_WITH_CONDITIONS | REJECTED | WITHDRAWN"
      - name: condition_notes
        type: string
        source: system
        default: null
        description: "Conditions or rejection reasons recorded with the determination"
      - name: determined_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of determination or withdrawal"

  - name: TransitFacilityReplacement
    parent: JointDevelopmentAgreement
    common_fields: true
    entity_kind: resource
    fields:
      - name: jda_id
        type: string
        source: input
        description: "FK -> JointDevelopmentAgreement.id; the agreement obligated to replace the facility (taken from the path)"
      - name: facility_type
        type: enum
        source: input
        description: "Kind of transit facility being displaced"
        constraints: "BUS_BAY | PARK_AND_RIDE | RAIL_PLATFORM | OPERATOR_FACILITY"
      - name: original_capacity
        type: integer
        source: input
        description: "Capacity of the displaced facility in native units (bays, stalls, berths)"
        constraints: ">= 1"
      - name: replacement_capacity
        type: integer
        source: input
        description: "Permanent replacement capacity promised"
        constraints: ">= 0"
      - name: interim_capacity
        type: integer
        source: input
        description: "Capacity available during construction"
        constraints: ">= 0"
      - name: milestone_date
        type: string
        source: input
        description: "Contractual date the permanent replacement must be in service"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: capacity_deficit
        type: integer
        source: computed
        description: "max(0, original_capacity - replacement_capacity)"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Replacement delivery state; a COMPLETE request with capacity_deficit > 0 is recorded as DEFICIENT instead"
        constraints: "PLANNED | INTERIM_IN_PLACE | COMPLETE | DEFICIENT"

  - name: SharedFacility
    parent: AgencySite
    common_fields: true
    entity_kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> AgencySite.id; the parcel hosting the shared facility (taken from the path)"
      - name: facility_type
        type: enum
        source: input
        description: "Kind of jointly used facility"
        constraints: "BUS_BAY | PLAZA | PARKING_STRUCTURE | ELEVATOR_BANK"
      - name: total_bay_capacity
        type: integer
        source: input
        description: "Total simultaneously occupiable units of the facility"
        constraints: ">= 1"
      - name: maintenance_responsibility
        type: enum
        source: input
        description: "Who bears maintenance cost"
        constraints: "AGENCY | DEVELOPER | SHARED"
      - name: cost_share_pct_developer
        type: number
        source: input
        default: 0
        description: "Developer's share of maintenance cost as a decimal fraction; only consulted when maintenance_responsibility == SHARED"
        constraints: "0 <= v <= 1"
      - name: available_bay_capacity
        type: integer
        source: computed
        description: "total_bay_capacity - sum(StagingWindow.bays_occupied over this facility's windows whose status == APPROVED); conserved-quantity partner of the approved windows"

  - name: StagingWindow
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: jda_id
        type: string
        source: input
        description: "FK -> JointDevelopmentAgreement.id; the agreement whose construction needs the staging area"
      - name: shared_facility_id
        type: string
        source: input
        description: "FK -> SharedFacility.id; the facility whose units the staging occupies"
      - name: start_at
        type: datetime
        source: input
        description: "Occupation start instant, inclusive"
      - name: end_at
        type: datetime
        source: input
        description: "Occupation end instant, exclusive; MUST be > start_at else ERR_INVALID_INTERVAL"
      - name: bays_occupied
        type: integer
        source: input
        description: "Units of the shared facility the staging removes from service; 0 means a non-occupying window (surveying, monitoring)"
        constraints: ">= 0"
      - name: purpose
        type: string
        source: input
        description: "Construction activity requiring the staging area"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Staging window state"
        constraints: "REQUESTED | APPROVED | REJECTED | SUSPENDED | CLOSED"
      - name: capacity_released
        type: boolean
        source: computed
        default: false
        description: "True once this window's bays_occupied have been returned to SharedFacility.available_bay_capacity; guards against double release"
      - name: rejection_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the operations manager rejects the window"

  - name: MaintenanceCharge
    parent: SharedFacility
    common_fields: false
    entity_kind: event
    fields:
      - name: shared_facility_id
        type: string
        source: input
        description: "FK -> SharedFacility.id; the facility maintained (taken from the path)"
      - name: jda_id
        type: string
        source: input
        description: "FK -> JointDevelopmentAgreement.id; the agreement charged the developer share"
      - name: period_start
        type: string
        source: input
        description: "First day of the billed period, inclusive"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "Last day of the billed period, inclusive; MUST be > period_start else ERR_INVALID_INTERVAL"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: line_items
        type: array
        source: input
        description: "Ordered array of objects { description: string, cost_cents: integer >= 0 }; array order is the pinned allocation order"
        constraints: "length >= 1 else ERR_EMPTY_LINE_ITEMS"
      - name: effective_share_applied
        type: number
        source: computed
        description: "The developer share fraction actually applied, resolved from SharedFacility.maintenance_responsibility"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Sum of line_items[].cost_cents over the whole array"
      - name: developer_share_cents
        type: integer
        source: computed
        description: "Output of calculations.maintenance_cost_allocation; per-line rounding then sum"
      - name: agency_share_cents
        type: integer
        source: computed
        description: "total_cost_cents - developer_share_cents; absorbs the rounding residue by construction"

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: AgencySite
    shape: cyclic
    initial_state: INVENTORIED
    terminal_states: [CONVEYED]
    transitions:
      - from: INVENTORIED
        to: ASSESSED
        trigger: "POST /jda/assessments/{id}/certify (system side effect of certifying the site's assessment)"
        actor: system
        preconditions:
          - "AgencySite.status == INVENTORIED (a site already in ASSESSED stays in ASSESSED; certification is idempotent with respect to site status)"
        side_effects:
          - "AgencySite.readiness_composite_score := certified ReadinessAssessment.composite_score"
          - "AgencySite.readiness_tier := certified ReadinessAssessment.tier"
          - "increments AgencySite.version by 1"
      - from: ASSESSED
        to: SOLICITATION_READY
        trigger: "POST /jda/sites/{id}/release-for-solicitation"
        actor: RealEstateOfficer
        preconditions:
          - "AgencySite.status == ASSESSED else ERR_INVALID_SITE_STATE"
          - "AgencySite.readiness_tier == READY else ERR_SITE_NOT_READY (boundary: readiness_composite_score >= READINESS_READY_THRESHOLD, i.e. 70.00 qualifies and 69.99 does not)"
        side_effects:
          - "increments AgencySite.version by 1"
      - from: ASSESSED
        to: INVENTORIED
        trigger: "POST /jda/sites/{id}/reopen-inventory"
        actor: RealEstateOfficer
        preconditions:
          - "AgencySite.status IN {ASSESSED, SOLICITATION_READY} else ERR_INVALID_SITE_STATE"
          - "no Solicitation on this site with status == ISSUED else ERR_INVALID_SITE_STATE"
        side_effects:
          - "every ReadinessAssessment on this site with status == CERTIFIED transitions CERTIFIED -> SUPERSEDED"
          - "AgencySite.readiness_composite_score := null and AgencySite.readiness_tier := null"
          - "increments AgencySite.version by 1"
        note: "Closes the site cycle INVENTORIED -> ASSESSED -> INVENTORIED; a fresh assessment must be created and certified to leave INVENTORIED again."
      - from: SOLICITATION_READY
        to: INVENTORIED
        trigger: "POST /jda/sites/{id}/reopen-inventory"
        actor: RealEstateOfficer
        preconditions:
          - "AgencySite.status IN {ASSESSED, SOLICITATION_READY} else ERR_INVALID_SITE_STATE"
          - "no Solicitation on this site with status == ISSUED else ERR_INVALID_SITE_STATE"
        side_effects:
          - "every ReadinessAssessment on this site with status == CERTIFIED transitions CERTIFIED -> SUPERSEDED"
          - "AgencySite.readiness_composite_score := null and AgencySite.readiness_tier := null"
          - "increments AgencySite.version by 1"
      - from: SOLICITATION_READY
        to: UNDER_AGREEMENT
        trigger: "POST /jda/solicitations/{id}/award or POST /jda/sites/{id}/negotiation-periods (system side effect of an ExclusiveNegotiationPeriod entering ACTIVE)"
        actor: system
        preconditions:
          - "AgencySite.status == SOLICITATION_READY (a site already UNDER_AGREEMENT stays UNDER_AGREEMENT; additional non-overlapping periods do not change site status)"
        side_effects:
          - "every other Solicitation on this site with status == ISSUED transitions ISSUED -> CANCELLED; 'other' means every ISSUED solicitation except the one that owns the Proposal held by the newly ACTIVE ExclusiveNegotiationPeriod, so a direct negotiation period never cancels its own proposal's solicitation"
          - "increments AgencySite.version by 1"
      - from: UNDER_AGREEMENT
        to: SOLICITATION_READY
        trigger: "POST /jda/negotiation-periods/{id}/terminate, or the clock-driven expiry of the last non-terminal ExclusiveNegotiationPeriod on the site"
        actor: system
        preconditions:
          - "after the triggering period leaves ACTIVE/EXTENDED, no ExclusiveNegotiationPeriod on this site has status IN {ACTIVE, EXTENDED} (conditional cascade)"
          - "no JointDevelopmentAgreement on this site has negotiation_status == EXECUTED"
        side_effects:
          - "increments AgencySite.version by 1"
      - from: UNDER_AGREEMENT
        to: CONVEYED
        trigger: "POST /jda/agreements/{id}/execute when JointDevelopmentAgreement.structure == FEE_DISPOSITION"
        actor: system
        preconditions:
          - "JointDevelopmentAgreement.structure == FEE_DISPOSITION (a GROUND_LEASE execution leaves the site in UNDER_AGREEMENT — divergent side-effect sets per branch)"
        side_effects:
          - "increments AgencySite.version by 1"

  - entity: ReadinessAssessment
    shape: linear_with_supersede
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /jda/assessments/{id}/certify"
        actor: RealEstateOfficer
        preconditions:
          - "ReadinessAssessment.status == DRAFT else ERR_ASSESSMENT_NOT_DRAFT"
          - "AgencySite.status IN {INVENTORIED, ASSESSED} else ERR_INVALID_SITE_STATE"
        side_effects:
          - "recomputes composite_score with the CERTIFIED variant of calculations.readiness_composite_score and sets variant_applied := CERTIFIED"
          - "sets tier from calculations.readiness_composite_score tier bands"
          - "sets certified_at := current logical clock"
          - "every other ReadinessAssessment on the same site with status == CERTIFIED transitions CERTIFIED -> SUPERSEDED"
          - "cascades AgencySite INVENTORIED -> ASSESSED and refreshes AgencySite.readiness_composite_score / readiness_tier"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /jda/assessments/{id}/certify on a newer assessment of the same site, or POST /jda/sites/{id}/reopen-inventory"
        actor: system
        preconditions:
          - "ReadinessAssessment.status == CERTIFIED"
        side_effects:
          - "increments ReadinessAssessment.version by 1"

  - entity: Solicitation
    shape: branching
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /jda/solicitations/{id}/issue"
        actor: RealEstateOfficer
        preconditions:
          - "Solicitation.status == DRAFT else ERR_SOLICITATION_NOT_ISSUED"
          - "AgencySite.status == SOLICITATION_READY else ERR_INVALID_SITE_STATE (cross-entity guard on the parent site)"
          - "Solicitation.response_deadline > current logical clock else ERR_RESPONSE_DEADLINE_PASSED"
        side_effects:
          - "sets issued_at := current logical clock"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /jda/solicitations/{id}/close"
        actor: RealEstateOfficer
        preconditions:
          - "Solicitation.status == ISSUED else ERR_SOLICITATION_NOT_ISSUED"
          - "responsive_proposal_count >= min_proposals_required else ERR_NO_RESPONSIVE_PROPOSALS (empty-set boundary: 0 responsive proposals against min_proposals_required 1)"
        side_effects:
          - "assigns Proposal.rank to every Proposal of this solicitation with status IN {SUBMITTED, SHORTLISTED}, ordered by calculations.proposal_ranking"
          - "leaves Proposal.rank null on proposals with status IN {REJECTED}"
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade when the parent AgencySite enters UNDER_AGREEMENT through a different solicitation or a direct negotiation period, or POST /jda/sites/{id}/reopen-inventory"
        preconditions: []
        side_effects:
          - "No proposals can exist on a DRAFT solicitation, so no proposal cascade runs"
      - from: ISSUED
        to: CANCELLED
        trigger: "system cascade when the parent AgencySite enters UNDER_AGREEMENT through a different solicitation or a direct negotiation period"
        actor: system
        preconditions:
          - "Solicitation.status == ISSUED"
          - "this Solicitation is neither the one being awarded nor the one that owns the Proposal held by the newly ACTIVE ExclusiveNegotiationPeriod"
        side_effects:
          - "every Proposal of this solicitation with status IN {SUBMITTED, SHORTLISTED} transitions to REJECTED (second hop of the award cascade)"
          - "increments Solicitation.version by 1"
      - from: CLOSED
        to: AWARDED
        trigger: "POST /jda/solicitations/{id}/award"
        actor: RealEstateOfficer
        preconditions:
          - "Solicitation.status == CLOSED else ERR_SOLICITATION_NOT_CLOSED"
          - "the referenced Proposal belongs to this Solicitation and has status IN {SUBMITTED, SHORTLISTED} else ERR_PROPOSAL_NOT_ELIGIBLE"
          - "the referenced Proposal has rank == 1, or deviation_justification is present and non-empty, else ERR_RANK_DEVIATION_UNJUSTIFIED"
          - "Developer.debarment_status == CLEAR for the proposal's developer else ERR_DEVELOPER_DEBARRED"
          - "negotiation_start_date/negotiation_end_date form a valid interval (end > start) else ERR_INVALID_INTERVAL"
          - "the new interval does not collide with any ExclusiveNegotiationPeriod on the site under closed-closed semantics else ERR_NEGOTIATION_PERIOD_OVERLAP"
        side_effects:
          - "the awarded Proposal transitions SUBMITTED|SHORTLISTED -> SELECTED (hop 1)"
          - "because that Proposal became SELECTED, a new ExclusiveNegotiationPeriod is created with status ACTIVE over [negotiation_start_date, negotiation_end_date] (hop 2)"
          - "because that ExclusiveNegotiationPeriod became ACTIVE, AgencySite transitions SOLICITATION_READY -> UNDER_AGREEMENT (hop 3)"
          - "because AgencySite became UNDER_AGREEMENT, every other Solicitation on the site with status == ISSUED transitions ISSUED -> CANCELLED (hop 4)"
          - "because those Solicitations became CANCELLED, their Proposals with status IN {SUBMITTED, SHORTLISTED} transition to REJECTED (hop 5)"
          - "every non-awarded Proposal of THIS solicitation with status IN {SUBMITTED, SHORTLISTED} transitions to REJECTED"

  - entity: Proposal
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /jda/proposals/{id}/shortlist"
        actor: RealEstateOfficer
        preconditions:
          - "Proposal.status == SUBMITTED else ERR_PROPOSAL_NOT_ELIGIBLE"
          - "parent Solicitation.status IN {ISSUED, CLOSED} else ERR_SOLICITATION_NOT_ISSUED"
        side_effects:
          - "refreshes parent Solicitation.responsive_proposal_count (SHORTLISTED remains responsive)"
      - from: SUBMITTED
        to: SELECTED
        trigger: "POST /jda/solicitations/{id}/award"
        actor: system
        preconditions:
          - "the Proposal is the award target and satisfies the award preconditions"
        side_effects:
          - "creates the ExclusiveNegotiationPeriod described in the Solicitation CLOSED -> AWARDED transition"
      - from: SHORTLISTED
        to: SELECTED
        trigger: "POST /jda/solicitations/{id}/award"
        actor: system
        preconditions:
          - "the Proposal is the award target and satisfies the award preconditions"
        side_effects:
          - "creates the ExclusiveNegotiationPeriod described in the Solicitation CLOSED -> AWARDED transition"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system cascade from solicitation award, solicitation cancellation, or termination/expiry of the ExclusiveNegotiationPeriod holding this proposal"
        actor: system
        preconditions:
          - "Proposal.status IN {SUBMITTED, SHORTLISTED}"
        side_effects:
          - "refreshes parent Solicitation.responsive_proposal_count"
          - "increments Proposal.version by 1"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "system cascade from solicitation award or solicitation cancellation"
        actor: system
        preconditions:
          - "Proposal.status IN {SUBMITTED, SHORTLISTED}"
        side_effects:
          - "refreshes parent Solicitation.responsive_proposal_count"
          - "increments Proposal.version by 1"
      - from: SELECTED
        to: REJECTED
        trigger: "POST /jda/negotiation-periods/{id}/terminate, or clock-driven expiry of the holding ExclusiveNegotiationPeriod"
        actor: system
        preconditions:
          - "Proposal.status == SELECTED"
          - "no JointDevelopmentAgreement referencing this Proposal has negotiation_status == EXECUTED"
        side_effects:
          - "increments Proposal.version by 1"

  - entity: ExclusiveNegotiationPeriod
    shape: branching_with_self_loop
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED, CONVERTED]
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /jda/negotiation-periods/{id}/extend"
        actor: RealEstateOfficer
        preconditions:
          - "status IN {ACTIVE, EXTENDED} else ERR_NEGOTIATION_PERIOD_NOT_ACTIVE"
          - "extension_count < MAX_NEGOTIATION_EXTENSIONS else ERR_MAX_EXTENSIONS_REACHED"
          - "new_end_date > end_date else ERR_INVALID_INTERVAL"
          - "[start_date, new_end_date] does not collide with any other ExclusiveNegotiationPeriod on the same site whose status IN {ACTIVE, EXTENDED} under closed-closed semantics else ERR_NEGOTIATION_PERIOD_OVERLAP"
        side_effects:
          - "end_date := new_end_date"
          - "extension_count += 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /jda/negotiation-periods/{id}/extend (second extension)"
        actor: RealEstateOfficer
        preconditions:
          - "status IN {ACTIVE, EXTENDED} else ERR_NEGOTIATION_PERIOD_NOT_ACTIVE"
          - "extension_count < MAX_NEGOTIATION_EXTENSIONS else ERR_MAX_EXTENSIONS_REACHED"
          - "new_end_date > end_date else ERR_INVALID_INTERVAL"
          - "no closed-closed collision with sibling periods on the site else ERR_NEGOTIATION_PERIOD_OVERLAP"
        side_effects:
          - "end_date := new_end_date"
          - "extension_count += 1"
        note: "Self-loop: the second extension leaves the state unchanged but advances extension_count to the MAX_NEGOTIATION_EXTENSIONS ceiling."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past end_date"
        actor: system
        preconditions:
          - "status IN {ACTIVE, EXTENDED}"
          - "date(current logical clock) > end_date"
        side_effects:
          - "the held Proposal transitions SELECTED -> REJECTED (hop 1)"
          - "because no ACTIVE/EXTENDED period remains on the site, AgencySite transitions UNDER_AGREEMENT -> SOLICITATION_READY (hop 2, conditional cascade)"
          - "every JointDevelopmentAgreement referencing the held Proposal with negotiation_status IN {DRAFTING, AGENCY_REVIEW, REVISION_REQUESTED} keeps its state but can no longer be submitted for review (ERR_NEGOTIATION_PERIOD_EXPIRED)"
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past the extended end_date"
        actor: system
        preconditions:
          - "status IN {ACTIVE, EXTENDED}"
          - "date(current logical clock) > end_date"
        side_effects:
          - "the held Proposal transitions SELECTED -> REJECTED"
          - "because no ACTIVE/EXTENDED period remains on the site, AgencySite transitions UNDER_AGREEMENT -> SOLICITATION_READY (conditional cascade)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /jda/negotiation-periods/{id}/terminate"
        actor: RealEstateOfficer
        preconditions:
          - "status IN {ACTIVE, EXTENDED} else ERR_NEGOTIATION_PERIOD_NOT_ACTIVE"
          - "no JointDevelopmentAgreement referencing the held Proposal has negotiation_status == EXECUTED else ERR_INVALID_SITE_STATE"
        side_effects:
          - "termination_reason := request body termination_reason"
          - "the held Proposal transitions SELECTED -> REJECTED (hop 1)"
          - "because no ACTIVE/EXTENDED period remains on the site, AgencySite transitions UNDER_AGREEMENT -> SOLICITATION_READY (hop 2, conditional cascade)"
      - from: EXTENDED
        to: TERMINATED
        trigger: "POST /jda/negotiation-periods/{id}/terminate"
        actor: RealEstateOfficer
        preconditions:
          - "status IN {ACTIVE, EXTENDED} else ERR_NEGOTIATION_PERIOD_NOT_ACTIVE"
          - "no JointDevelopmentAgreement referencing the held Proposal has negotiation_status == EXECUTED else ERR_INVALID_SITE_STATE"
        side_effects:
          - "termination_reason := request body termination_reason"
          - "the held Proposal transitions SELECTED -> REJECTED"
          - "because no ACTIVE/EXTENDED period remains on the site, AgencySite transitions UNDER_AGREEMENT -> SOLICITATION_READY (conditional cascade)"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /jda/agreements/{id}/execute (system side effect)"
        actor: system
        preconditions:
          - "status IN {ACTIVE, EXTENDED}"
          - "the executed JointDevelopmentAgreement references this period's proposal_id"
        side_effects:
          - "increments ExclusiveNegotiationPeriod.version by 1"
      - from: EXTENDED
        to: CONVERTED
        trigger: "POST /jda/agreements/{id}/execute (system side effect)"
        actor: system
        preconditions:
          - "status IN {ACTIVE, EXTENDED}"
          - "the executed JointDevelopmentAgreement references this period's proposal_id"
        side_effects:
          - "increments ExclusiveNegotiationPeriod.version by 1"

  - entity: ValuationDetermination
    shape: linear_with_supersede
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /jda/valuations/{id}/certify"
        actor: ValuationOfficer
        preconditions:
          - "ValuationDetermination.status == DRAFT else ERR_VALUATION_NOT_CERTIFIED"
          - "AgencySite.status IN {ASSESSED, SOLICITATION_READY, UNDER_AGREEMENT} else ERR_INVALID_SITE_STATE"
        side_effects:
          - "sets certified_at := current logical clock"
          - "every other ValuationDetermination on the same site with status == CERTIFIED transitions CERTIFIED -> SUPERSEDED"
          - "AgencySite.federal_interest_basis_cents := round_half_up(appraised_value_cents * AgencySite.federal_interest_pct / 100)"
          - "AgencySite.federal_interest_unencumbered_cents := federal_interest_basis_cents - federal_interest_encumbered_cents"
          - "increments AgencySite.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /jda/valuations/{id}/certify on a newer valuation of the same site, or POST /jda/disposition-requests/{id}/determination with determination == REJECTED"
        actor: system
        preconditions:
          - "ValuationDetermination.status == CERTIFIED"
        side_effects:
          - "increments ValuationDetermination.version by 1"

  - entity: JointDevelopmentAgreement
    dimension: negotiation_status
    shape: cyclic
    initial_state: DRAFTING
    terminal_states: [EXECUTED]
    transitions:
      - from: DRAFTING
        to: AGENCY_REVIEW
        trigger: "POST /jda/agreements/{id}/submit-for-review"
        actor: RealEstateOfficer
        preconditions:
          - "negotiation_status == DRAFTING else ERR_AGREEMENT_NOT_DRAFTING"
          - "the ExclusiveNegotiationPeriod whose proposal_id == JointDevelopmentAgreement.proposal_id has status IN {ACTIVE, EXTENDED} and date(current logical clock) <= its end_date else ERR_NEGOTIATION_PERIOD_EXPIRED"
          - "the referenced ValuationDetermination.status == CERTIFIED else ERR_VALUATION_NOT_CERTIFIED (cross-entity guard, business_referential, priority 30)"
          - "affordable_units_committed >= the selected Proposal.affordable_units else ERR_AFFORDABLE_COMMITMENT_SHORTFALL"
          - "consideration_value_cents >= ValuationDetermination.permissible_floor_cents else ERR_BELOW_PERMISSIBLE_FLOOR (business_fiscal, priority 52)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "recomputes annual_revenue_to_agency_cents, capital_credit_cents and consideration_value_cents"
      - from: AGENCY_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /jda/agreements/{id}/request-revision"
        actor: BoardSecretary
        preconditions:
          - "negotiation_status == AGENCY_REVIEW else ERR_AGREEMENT_NOT_IN_REVIEW"
        side_effects:
          - "revision_notes := request body revision_notes"
      - from: REVISION_REQUESTED
        to: DRAFTING
        trigger: "PATCH /jda/agreements/{id}"
        actor: RealEstateOfficer
        preconditions:
          - "negotiation_status IN {DRAFTING, REVISION_REQUESTED} else ERR_AGREEMENT_NOT_DRAFTING"
        side_effects:
          - "applies the supplied term amendments"
          - "recomputes capital_credit_cents, annual_revenue_to_agency_cents and consideration_value_cents"
          - "submitted_by_user_id := null"
        note: "Closes the negotiation cycle AGENCY_REVIEW -> REVISION_REQUESTED -> DRAFTING -> AGENCY_REVIEW. A PATCH while already DRAFTING amends terms without changing the state."
      - from: AGENCY_REVIEW
        to: BOARD_APPROVED
        trigger: "POST /jda/agreements/{id}/board-approve"
        actor: BoardSecretary
        preconditions:
          - "negotiation_status == AGENCY_REVIEW else ERR_AGREEMENT_NOT_IN_REVIEW"
          - "X-User-ID != submitted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "board_resolution_number := request body resolution_number"
      - from: BOARD_APPROVED
        to: REVISION_REQUESTED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == REJECTED (system cascade)"
        actor: system
        preconditions:
          - "negotiation_status == BOARD_APPROVED"
          - "the request's federal_approval_status dimension moved SUBMITTED -> FTA_REJECTED"
        side_effects:
          - "because negotiation_status became REVISION_REQUESTED, the referenced ValuationDetermination transitions CERTIFIED -> SUPERSEDED (hop 3)"
          - "because negotiation_status became REVISION_REQUESTED, every StagingWindow of this agreement with status == APPROVED transitions APPROVED -> SUSPENDED (hop 3b)"
          - "because those StagingWindows left APPROVED, each one's SharedFacility.available_bay_capacity increases by that window's bays_occupied and the window's capacity_released := true (hop 4)"
          - "revision_notes := 'federal disposition rejected: ' + condition_notes"
          - "board_resolution_number := null"
      - from: BOARD_APPROVED
        to: EXECUTED
        trigger: "POST /jda/agreements/{id}/execute"
        actor: RealEstateOfficer
        preconditions:
          - "negotiation_status == BOARD_APPROVED else ERR_AGREEMENT_NOT_BOARD_APPROVED"
          - "federal_approval_status IN {NOT_REQUIRED, FTA_APPROVED} else ERR_FEDERAL_APPROVAL_PENDING"
          - "when AgencySite.transit_facility_present == true, a TransitFacilityReplacement of this agreement has status IN {INTERIM_IN_PLACE, COMPLETE} else ERR_FACILITY_REPLACEMENT_INCOMPLETE"
          - "no TransitFacilityReplacement of this agreement has status == DEFICIENT else ERR_FACILITY_REPLACEMENT_DEFICIENT"
        side_effects:
          - "execution_date := request body execution_date"
          - "the ExclusiveNegotiationPeriod holding this agreement's proposal transitions ACTIVE|EXTENDED -> CONVERTED"
          - "when structure == FEE_DISPOSITION: AgencySite transitions UNDER_AGREEMENT -> CONVEYED (branch A side-effect set)"
          - "when structure == GROUND_LEASE: AgencySite.status is unchanged and remains UNDER_AGREEMENT for the duration of the lease (branch B side-effect set)"

  - entity: JointDevelopmentAgreement
    dimension: federal_approval_status
    shape: branching
    initial_state: NOT_SUBMITTED
    alternate_initial_state: "NOT_REQUIRED — used instead of NOT_SUBMITTED when the agreement's AgencySite.federal_interest_pct == 0 at creation time"
    terminal_states: [NOT_REQUIRED, FTA_APPROVED]
    transitions:
      - from: NOT_SUBMITTED
        to: SUBMITTED
        trigger: "POST /jda/agreements/{id}/disposition-requests"
        actor: GrantsComplianceOfficer
        preconditions:
          - "federal_approval_status == NOT_SUBMITTED else ERR_FEDERAL_APPROVAL_PENDING"
          - "negotiation_status IN {AGENCY_REVIEW, BOARD_APPROVED} else ERR_AGREEMENT_NOT_IN_REVIEW"
          - "AgencySite.federal_interest_unencumbered_cents >= calculations.federal_interest_amount for this agreement else ERR_FEDERAL_INTEREST_INSUFFICIENT"
        side_effects:
          - "creates a FederalDispositionRequest with determination == PENDING and federal_interest_amount_cents from calculations.federal_interest_amount"
          - "AgencySite.federal_interest_encumbered_cents += FederalDispositionRequest.federal_interest_amount_cents"
          - "AgencySite.federal_interest_unencumbered_cents -= FederalDispositionRequest.federal_interest_amount_cents"
          - "increments AgencySite.version by 1"
      - from: SUBMITTED
        to: FTA_APPROVED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination IN {APPROVED, APPROVED_WITH_CONDITIONS}"
        actor: GrantsComplianceOfficer
        preconditions:
          - "FederalDispositionRequest.determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
        side_effects:
          - "FederalDispositionRequest.determined_at := current logical clock"
          - "the encumbrance stays in place (AgencySite.federal_interest_encumbered_cents unchanged)"
          - "negotiation_status is untouched — the two dimensions advance independently"
      - from: SUBMITTED
        to: FTA_REJECTED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == REJECTED"
        actor: GrantsComplianceOfficer
        preconditions:
          - "FederalDispositionRequest.determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
        side_effects:
          - "FederalDispositionRequest.determination := REJECTED (hop 1) and determined_at := current logical clock"
          - "because the request was rejected, AgencySite.federal_interest_encumbered_cents -= federal_interest_amount_cents and federal_interest_unencumbered_cents += federal_interest_amount_cents"
          - "because federal_approval_status became FTA_REJECTED, negotiation_status transitions BOARD_APPROVED -> REVISION_REQUESTED (hop 2), which itself cascades to the valuation and staging windows (hops 3 and 4)"
      - from: SUBMITTED
        to: NOT_SUBMITTED
        trigger: "POST /jda/disposition-requests/{id}/withdraw"
        actor: GrantsComplianceOfficer
        preconditions:
          - "FederalDispositionRequest.determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
        side_effects:
          - "FederalDispositionRequest.determination := WITHDRAWN and determined_at := current logical clock"
          - "AgencySite.federal_interest_encumbered_cents -= federal_interest_amount_cents"
          - "AgencySite.federal_interest_unencumbered_cents += federal_interest_amount_cents"
          - "increments AgencySite.version by 1"
        note: "Compensating action for the NOT_SUBMITTED -> SUBMITTED forward action; the pair conserves federal_interest_basis_cents exactly."
      - from: FTA_REJECTED
        to: NOT_SUBMITTED
        trigger: "PATCH /jda/agreements/{id} (system side effect of amending a revision-requested agreement)"
        actor: system
        preconditions:
          - "federal_approval_status == FTA_REJECTED"
          - "negotiation_status IN {DRAFTING, REVISION_REQUESTED}"
        side_effects:
          - "increments JointDevelopmentAgreement.version by 1"
        note: "Lets a corrected agreement file a fresh FederalDispositionRequest after a rejection; the negotiation dimension moves on the same PATCH but through its own REVISION_REQUESTED -> DRAFTING transition."

  - entity: FederalDispositionRequest
    shape: branching
    initial_state: PENDING
    terminal_states: [APPROVED, APPROVED_WITH_CONDITIONS, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == APPROVED"
        actor: GrantsComplianceOfficer
        preconditions:
          - "determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
        side_effects:
          - "determined_at := current logical clock"
          - "parent JointDevelopmentAgreement.federal_approval_status transitions SUBMITTED -> FTA_APPROVED"
      - from: PENDING
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == APPROVED_WITH_CONDITIONS"
        actor: GrantsComplianceOfficer
        preconditions:
          - "determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
          - "condition_notes is present and non-empty else ERR_INVALID_REQUEST"
        side_effects:
          - "condition_notes := request body condition_notes"
          - "determined_at := current logical clock"
          - "parent JointDevelopmentAgreement.federal_approval_status transitions SUBMITTED -> FTA_APPROVED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == REJECTED"
        actor: GrantsComplianceOfficer
        preconditions:
          - "determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
          - "condition_notes is present and non-empty else ERR_INVALID_REQUEST"
        side_effects:
          - "releases the site encumbrance and cascades into the agreement as described in the federal_approval_status SUBMITTED -> FTA_REJECTED transition"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /jda/disposition-requests/{id}/withdraw"
        actor: GrantsComplianceOfficer
        preconditions:
          - "determination == PENDING else ERR_DISPOSITION_ALREADY_DETERMINED"
        side_effects:
          - "releases the site encumbrance as described in the federal_approval_status SUBMITTED -> NOT_SUBMITTED transition"

  - entity: TransitFacilityReplacement
    shape: branching
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: INTERIM_IN_PLACE
        trigger: "POST /jda/facility-replacements/{id}/status with status == INTERIM_IN_PLACE"
        actor: TransitOperationsManager
        preconditions:
          - "status == PLANNED else ERR_INVALID_REQUEST"
          - "interim_capacity (body override, else the stored value) >= 1 else ERR_INVALID_REQUEST"
        side_effects:
          - "interim_capacity := body interim_capacity when supplied"
      - from: INTERIM_IN_PLACE
        to: COMPLETE
        trigger: "POST /jda/facility-replacements/{id}/status with status == COMPLETE and capacity_deficit == 0"
        actor: TransitOperationsManager
        preconditions:
          - "status == INTERIM_IN_PLACE else ERR_INVALID_REQUEST"
          - "capacity_deficit == 0 (replacement_capacity >= original_capacity)"
        side_effects:
          - "no cascade; the agreement's execute precondition now passes on the facility test"
      - from: INTERIM_IN_PLACE
        to: DEFICIENT
        trigger: "POST /jda/facility-replacements/{id}/status with status == COMPLETE and capacity_deficit > 0"
        actor: TransitOperationsManager
        preconditions:
          - "status == INTERIM_IN_PLACE else ERR_INVALID_REQUEST"
          - "capacity_deficit > 0 (replacement_capacity < original_capacity)"
        side_effects:
          - "status is recorded as DEFICIENT rather than the requested COMPLETE (branching with divergent outcome for the same trigger)"
          - "the agreement's execute precondition now fails with ERR_FACILITY_REPLACEMENT_DEFICIENT"
      - from: DEFICIENT
        to: COMPLETE
        trigger: "POST /jda/facility-replacements/{id}/status with status == COMPLETE after the deficit is cured"
        actor: TransitOperationsManager
        preconditions:
          - "status == DEFICIENT"
          - "capacity_deficit == 0"
        side_effects:
          - "increments TransitFacilityReplacement.version by 1"
        note: "capacity_deficit is recomputed from replacement_capacity, which the operations manager cures by filing a corrected replacement record; until then the deficit blocks execution."

  - entity: StagingWindow
    shape: branching
    initial_state: REQUESTED
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /jda/staging-windows/{id}/decision with decision == APPROVE"
        actor: TransitOperationsManager
        preconditions:
          - "status == REQUESTED else ERR_STAGING_WINDOW_NOT_REQUESTED"
          - "the agreement's negotiation_status == BOARD_APPROVED else ERR_AGREEMENT_NOT_BOARD_APPROVED"
          - "when the parent AgencySite.transit_facility_present == true, a TransitFacilityReplacement of the same agreement has status IN {INTERIM_IN_PLACE, COMPLETE} else ERR_FACILITY_REPLACEMENT_INCOMPLETE (conditional cross-entity guard, matching validations priority 41); when transit_facility_present == false the guard is inert"
          - "for every instant covered by [start_at, end_at), bays_occupied plus the bays_occupied of every other APPROVED StagingWindow on the same SharedFacility whose interval strictly overlaps must be <= SharedFacility.total_bay_capacity else ERR_STAGING_CAPACITY_EXCEEDED"
        side_effects:
          - "SharedFacility.available_bay_capacity -= bays_occupied"
          - "increments SharedFacility.version by 1"
          - "capacity_released := false"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /jda/staging-windows/{id}/decision with decision == REJECT"
        actor: TransitOperationsManager
        preconditions:
          - "status == REQUESTED else ERR_STAGING_WINDOW_NOT_REQUESTED"
          - "rejection_reason is present and non-empty else ERR_INVALID_REQUEST"
        side_effects:
          - "rejection_reason := body rejection_reason"
          - "SharedFacility.available_bay_capacity is NOT changed (divergent side-effect set versus the APPROVE branch)"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /jda/disposition-requests/{id}/determination with determination == REJECTED (system cascade, hop 3b)"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "the parent agreement's negotiation_status moved BOARD_APPROVED -> REVISION_REQUESTED"
        side_effects:
          - "SharedFacility.available_bay_capacity += bays_occupied and capacity_released := true (hop 4)"
          - "increments SharedFacility.version by 1"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /jda/staging-windows/{id}/close"
        actor: TransitOperationsManager
        preconditions:
          - "status IN {APPROVED, SUSPENDED} else ERR_STAGING_WINDOW_NOT_CLOSABLE"
        side_effects:
          - "because capacity_released == false, SharedFacility.available_bay_capacity += bays_occupied and capacity_released := true"
          - "increments SharedFacility.version by 1"
        note: "Compensating action for REQUESTED -> APPROVED; the pair conserves SharedFacility.total_bay_capacity exactly."
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /jda/staging-windows/{id}/close"
        actor: TransitOperationsManager
        preconditions:
          - "status IN {APPROVED, SUSPENDED} else ERR_STAGING_WINDOW_NOT_CLOSABLE"
        side_effects:
          - "because capacity_released == true already, SharedFacility.available_bay_capacity is NOT changed a second time (conditional cascade guarded by capacity_released)"

# ============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
# write-write conflict mechanism; both entries pass the serial-observability
# filter because the second request would legitimately succeed on its own)
# ============================================================================
concurrency_rules:
  - rule_id: valuation-create-stale-site
    parent_entity: AgencySite
    write_endpoint: "POST /jda/sites/{id}/valuations"
    occ_field: "expected_site_version"
    description: |
      Creating a ValuationDetermination against an AgencySite whose version has advanced since
      the client last read it is rejected. A new valuation legitimately supersedes the prior
      CERTIFIED valuation for the same site once certified, so a second create observing the
      same site state would itself succeed; the stale-version check is what forces the valuation
      officer to re-read the site (and therefore the current federal interest basis and readiness
      tier) before pricing it again.
    error_id: ERR_STALE_SITE_VERSION
    http_status: 412
  - rule_id: staging-window-create-stale-facility
    parent_entity: SharedFacility
    write_endpoint: "POST /jda/staging-windows"
    occ_field: "expected_facility_version"
    description: |
      Requesting a StagingWindow against a SharedFacility whose version has advanced since the
      developer last read available_bay_capacity is rejected. Another window approval or closure
      has changed the facility's remaining capacity, and a second request against the same
      observed capacity would legitimately succeed; the stale-version check forces the developer
      to re-read the facility before booking against a capacity figure that no longer holds.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: readiness_composite_score
    trigger: "On POST /jda/sites/{id}/assessments (PRELIMINARY variant) and again on POST /jda/assessments/{id}/certify (CERTIFIED variant); the certify transition's side_effects list composite_score, variant_applied and tier"
    algorithm: weighted_scoring
    formula: |
      # PRELIMINARY variant — intake screen, ignores encumbrances and federal interest
      composite_score = round_half_up(
          (environmental_score + utility_score + access_score + entitlement_score) / 4, 2)

      # CERTIFIED variant — weighted, penalised
      weighted = environmental_score * W_ENVIRONMENTAL
               + utility_score       * W_UTILITY
               + access_score        * W_ACCESS
               + entitlement_score   * W_ENTITLEMENT
      encumbrance_penalty = min(ENCUMBRANCE_PENALTY_CAP,
                                ENCUMBRANCE_PENALTY_PER_ITEM * ReadinessAssessment.encumbrance_count)
      federal_penalty     = FEDERAL_PENALTY_PER_PCT * AgencySite.federal_interest_pct
      composite_score = max(0.00, round_half_up(weighted - encumbrance_penalty - federal_penalty, 2))

      # tier bands (CERTIFIED variant only; tier stays null while status == DRAFT)
      tier = READY       when composite_score >= READINESS_READY_THRESHOLD
      tier = CONDITIONAL when READINESS_CONDITIONAL_THRESHOLD <= composite_score < READINESS_READY_THRESHOLD
      tier = NOT_READY   when composite_score <  READINESS_CONDITIONAL_THRESHOLD
    input_set: "Exactly one ReadinessAssessment row (the one being created or certified) plus the federal_interest_pct of its AgencySite. No other assessment participates; SUPERSEDED assessments are never re-scored."
    constants:
      W_ENVIRONMENTAL: 0.35
      W_UTILITY: 0.25
      W_ACCESS: 0.25
      W_ENTITLEMENT: 0.15
      ENCUMBRANCE_PENALTY_PER_ITEM: 3.00
      ENCUMBRANCE_PENALTY_CAP: 12.00
      FEDERAL_PENALTY_PER_PCT: 0.10
      READINESS_READY_THRESHOLD: 70.00
      READINESS_CONDITIONAL_THRESHOLD: 50.00
    precision: "2 decimal places, round_half_up; the subtraction is performed on unrounded operands and rounded exactly once at the end"
    variants:
      - name: PRELIMINARY
        when: "At assessment creation (POST /jda/sites/{id}/assessments), while status == DRAFT"
        difference: "Unweighted arithmetic mean of the four sub-scores; encumbrance_count and AgencySite.federal_interest_pct are ignored entirely, and tier is left null"
      - name: CERTIFIED
        when: "At certification (POST /jda/assessments/{id}/certify)"
        difference: "Weighted sum with W_* weights, minus the capped encumbrance penalty, minus the federal interest penalty; assigns tier. For (80, 75, 70, 60, encumbrance_count 1, federal_interest_pct 2.5) PRELIMINARY yields 71.25 while CERTIFIED yields 70.00 from identical stored inputs."
    boundary_note: "READINESS_READY_THRESHOLD uses >= : composite_score 70.00 yields READY, 69.99 yields CONDITIONAL."

  - name: permissible_transfer_floor
    trigger: "On POST /jda/sites/{id}/valuations (at creation, so a DRAFT valuation already carries a floor) and re-evaluated unchanged on POST /jda/valuations/{id}/certify"
    algorithm: threshold
    formula: |
      # step 1 — tiered transit-supportive credit rate
      credit_rate = TSU_RATE_HIGH   when transit_supportive_use_pct >= TSU_TIER_HIGH
      credit_rate = TSU_RATE_MID    when TSU_TIER_MID  <= transit_supportive_use_pct < TSU_TIER_HIGH
      credit_rate = TSU_RATE_LOW    when TSU_TIER_LOW  <= transit_supportive_use_pct < TSU_TIER_MID
      credit_rate = 0.00            when transit_supportive_use_pct <  TSU_TIER_LOW
      # step 2 — affordable housing bonus, then hard cap
      if affordable_units_pct >= AFFORDABLE_BONUS_THRESHOLD_PCT:
          credit_rate = credit_rate + AFFORDABLE_BONUS_RATE
      credit_rate = min(credit_rate, CREDIT_RATE_CAP)
      # step 3 — credit and federal floor
      transit_supportive_credit_cents = round_half_up(appraised_value_cents * credit_rate)
      federal_interest_floor_cents    = round_half_up(appraised_value_cents
                                                      * AgencySite.federal_interest_pct / 100)
      # step 4 — variant-selected floor
      if transfer_basis == FMV_STRICT:
          permissible_floor_cents = appraised_value_cents
      else:  # TRANSIT_SUPPORTIVE_BELOW_MARKET
          permissible_floor_cents = max(appraised_value_cents - transit_supportive_credit_cents,
                                        federal_interest_floor_cents)
    input_set: "The single ValuationDetermination row being written plus AgencySite.federal_interest_pct of its site. transit_supportive_credit_cents and federal_interest_floor_cents are recorded under BOTH variants; only step 4 differs."
    constants:
      TSU_TIER_HIGH: 75
      TSU_TIER_MID: 50
      TSU_TIER_LOW: 25
      TSU_RATE_HIGH: 0.30
      TSU_RATE_MID: 0.20
      TSU_RATE_LOW: 0.10
      AFFORDABLE_BONUS_THRESHOLD_PCT: 20
      AFFORDABLE_BONUS_RATE: 0.05
      CREDIT_RATE_CAP: 0.30
    precision: "Integer cents, round_half_up applied once per money product"
    variants:
      - name: FMV_STRICT
        when: "transfer_basis == FMV_STRICT — the grantor has not concurred in a below-market transfer"
        difference: "The floor is the full appraised value; the computed transit-supportive credit is recorded but never applied. For appraised_value_cents 48500000, transit_supportive_use_pct 60, affordable_units_pct 25, federal_interest_pct 2.5 the floor is 48500000."
      - name: TRANSIT_SUPPORTIVE_BELOW_MARKET
        when: "transfer_basis == TRANSIT_SUPPORTIVE_BELOW_MARKET — the use qualifies as transit-supportive"
        difference: "The floor is appraised value minus the credit, never below the federal interest floor. For the identical inputs above the credit is 12125000 and the floor is 36375000, i.e. 12125000 cents lower than FMV_STRICT."

  - name: proposal_evaluation_score
    trigger: "On POST /jda/solicitations/{id}/proposals; the value is frozen on the Proposal row and never recomputed"
    algorithm: weighted_scoring
    formula: |
      affordable_pct = round_half_up(100 * affordable_units / total_units, 2)
      # value basis branches on the proposed structure (conditional branch on entity state)
      if proposed_structure == GROUND_LEASE:
          value_basis_cents = proposed_annual_rent_cents * LEASE_CAPITALIZATION_YEARS
      else:  # FEE_DISPOSITION
          value_basis_cents = proposed_purchase_price_cents
      value_points = min(VALUE_POINTS_CAP,
                         round_half_up(VALUE_POINTS_CAP
                                       * value_basis_cents / Solicitation.benchmark_value_cents, 2))
      affordable_points = min(AFFORDABLE_POINTS_CAP,
                              round_half_up(AFFORDABLE_POINTS_BASE
                                            + AFFORDABLE_POINTS_PER_PCT
                                              * (affordable_pct
                                                 - Solicitation.affordable_housing_min_pct), 2))
      ridership_points = min(RIDERSHIP_POINTS_CAP,
                             round_half_up(transit_ridership_uplift / RIDERSHIP_BOARDINGS_PER_POINT, 2))
      design_points = round_half_up(DESIGN_POINTS_PER_UNIT * design_compliance_score, 2)
      raw = value_points + affordable_points + ridership_points + design_points
      penalty = PREQUALIFICATION_PENALTY_POINTS when Developer.prequalified == false else 0.00
      evaluation_score = max(0.00, round_half_up(raw - penalty, 2))
    input_set: "The Proposal being created, its parent Solicitation (benchmark_value_cents, affordable_housing_min_pct) and its Developer (prequalified). Proposals of other solicitations never participate."
    constants:
      LEASE_CAPITALIZATION_YEARS: 20
      VALUE_POINTS_CAP: 40.00
      AFFORDABLE_POINTS_BASE: 15.00
      AFFORDABLE_POINTS_PER_PCT: 0.5
      AFFORDABLE_POINTS_CAP: 25.00
      RIDERSHIP_POINTS_CAP: 20.00
      RIDERSHIP_BOARDINGS_PER_POINT: 50
      DESIGN_POINTS_PER_UNIT: 0.15
      PREQUALIFICATION_PENALTY_POINTS: 10.00
    precision: "2 decimal places, round_half_up; each of the four component point values is rounded to 2dp BEFORE the min() cap and before summation — the sum is not re-rounded except to absorb the penalty subtraction"
    worked_example: |
      GROUND_LEASE, proposed_annual_rent_cents 2400000, affordable_units 50, total_units 200,
      transit_ridership_uplift 600, design_compliance_score 88, benchmark_value_cents 48500000,
      affordable_housing_min_pct 15, prequalified true:
        affordable_pct 25.00; value_points min(40.00, 39.59) = 39.59; affordable_points
        min(25.00, 15.00 + 0.5*10.00) = 20.00; ridership_points min(20.00, 12.00) = 12.00;
        design_points 13.20; raw 84.79; penalty 0.00; evaluation_score 84.79.

  - name: proposal_ranking
    trigger: "On POST /jda/solicitations/{id}/close; the close transition's side_effects list Proposal.rank assignment"
    algorithm: chronological
    formula: |
      candidates = Proposals of this Solicitation with status IN {SUBMITTED, SHORTLISTED}
      sort candidates by:
        1. evaluation_score DESC
        2. affordable_pct   DESC        (first tie-break)
        3. created_at       ASC         (final tie-break; `id` is NEVER consulted)
      assign rank = 1, 2, 3, ... in that order
      Proposals with status IN {SELECTED, REJECTED} at close time keep rank == null
    input_set: "Only proposals of the closing solicitation whose status IN {SUBMITTED, SHORTLISTED}. REJECTED proposals are excluded and are not assigned a rank."
    constants: {}
    precision: "Integer ranks starting at 1, contiguous, no gaps"
    determinism_note: "Ties on evaluation_score are broken by affordable_pct DESC, then by created_at ASC. The UUID `id` field MUST NOT participate in ordering."

  - name: annual_revenue_to_agency
    trigger: "On POST /jda/agreements, on PATCH /jda/agreements/{id}, and on POST /jda/agreements/{id}/submit-for-review; each of those transitions lists capital_credit_cents and annual_revenue_to_agency_cents in its side_effects"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER — the credit tier is keyed on the PRE-CREDIT subtotal (step 3),
      # never on the post-credit total from step 6. The dependency looks circular
      # (total = subtotal - credit, credit = f(tier(total))) and is resolved by this pin.
      # step 1 — base component branches on structure
      if structure == GROUND_LEASE:
          base_component_cents = base_rent_cents
      else:  # FEE_DISPOSITION
          base_component_cents = round_half_up(purchase_price_cents / term_years)
      # step 2
      participation_cents = round_half_up(projected_gross_revenue_cents * revenue_share_pct)
      # step 3
      subtotal_cents = base_component_cents + participation_cents
      # step 4 — tier lookup keyed on subtotal_cents (NOT on annual_revenue_to_agency_cents)
      credit_rate = CREDIT_RATE_T3 when subtotal_cents >= CREDIT_TIER_T3_CENTS
      credit_rate = CREDIT_RATE_T2 when CREDIT_TIER_T2_CENTS <= subtotal_cents < CREDIT_TIER_T3_CENTS
      credit_rate = CREDIT_RATE_T1 when CREDIT_TIER_T1_CENTS <= subtotal_cents < CREDIT_TIER_T2_CENTS
      credit_rate = 0.00           when subtotal_cents <  CREDIT_TIER_T1_CENTS
      if affordable_units_committed / total_units >= AFFORDABLE_CREDIT_THRESHOLD:
          credit_rate = credit_rate + AFFORDABLE_CREDIT_BONUS
      credit_rate = min(credit_rate, CREDIT_RATE_CEILING)
      # step 5
      capital_credit_cents = round_half_up(subtotal_cents * credit_rate)
      # step 6
      annual_revenue_to_agency_cents = subtotal_cents - capital_credit_cents
    input_set: "The single JointDevelopmentAgreement row. No sibling agreement, staging window or maintenance charge participates."
    constants:
      CREDIT_TIER_T1_CENTS: 1000000
      CREDIT_TIER_T2_CENTS: 2500000
      CREDIT_TIER_T3_CENTS: 5000000
      CREDIT_RATE_T1: 0.04
      CREDIT_RATE_T2: 0.08
      CREDIT_RATE_T3: 0.12
      AFFORDABLE_CREDIT_THRESHOLD: 0.20
      AFFORDABLE_CREDIT_BONUS: 0.03
      CREDIT_RATE_CEILING: 0.15
    precision: "Integer cents, round_half_up applied once in step 2 and once in step 5"
    worked_example: |
      GROUND_LEASE, base_rent_cents 2000000, projected_gross_revenue_cents 12000000,
      revenue_share_pct 0.05, affordable_units_committed 50, total_units 200:
        participation 600000; subtotal 2600000 (tier T2 -> 0.08, +0.03 affordable bonus -> 0.11);
        capital_credit 286000; annual_revenue_to_agency 2314000.
      The trap: keying the tier on the post-credit total (2314000, which falls in tier T1)
      yields credit_rate 0.07, capital_credit 161980 and 2438020 — a different number from the
      same inputs. The pinned order above makes 2314000 the only correct answer.

  - name: consideration_value
    trigger: "Recomputed alongside annual_revenue_to_agency on POST /jda/agreements, PATCH /jda/agreements/{id} and POST /jda/agreements/{id}/submit-for-review"
    algorithm: aggregation
    formula: |
      if structure == GROUND_LEASE:
          consideration_value_cents = annual_revenue_to_agency_cents * LEASE_CAPITALIZATION_YEARS
      else:  # FEE_DISPOSITION
          consideration_value_cents = purchase_price_cents
    input_set: "The single JointDevelopmentAgreement row, using the annual_revenue_to_agency_cents produced immediately before in the same request"
    constants:
      LEASE_CAPITALIZATION_YEARS: 20
    precision: "Integer cents; no rounding needed (integer multiplication)"
    note: "This is the value compared against ValuationDetermination.permissible_floor_cents by the business_fiscal check at submit-for-review. For the worked example above: 2314000 * 20 = 46280000, which clears a TRANSIT_SUPPORTIVE_BELOW_MARKET floor of 36375000 but not an FMV_STRICT floor of 48500000."

  - name: maintenance_cost_allocation
    trigger: "On POST /jda/shared-facilities/{id}/maintenance-charges"
    algorithm: waterfall_allocation
    formula: |
      # effective share resolved from the facility's responsibility posture
      if SharedFacility.maintenance_responsibility == DEVELOPER: effective_share_applied = 1.00
      if SharedFacility.maintenance_responsibility == AGENCY:    effective_share_applied = 0.00
      if SharedFacility.maintenance_responsibility == SHARED:
          effective_share_applied = SharedFacility.cost_share_pct_developer
      # PINNED ROUNDING ORDER: round each line to whole cents FIRST, then sum.
      # Summing first and rounding once is explicitly WRONG here.
      developer_share_cents = 0
      for line in line_items ordered by array index ASC:
          developer_share_cents += round_half_up(line.cost_cents * effective_share_applied)
      total_cost_cents  = sum(line.cost_cents for line in line_items)
      agency_share_cents = total_cost_cents - developer_share_cents
    input_set: "The line_items array submitted in this request (array order is the allocation order) plus the SharedFacility's maintenance_responsibility and cost_share_pct_developer as they stand at request time. Prior MaintenanceCharge rows never participate."
    constants: {}
    precision: "Integer cents, round_half_up per line item; agency_share_cents absorbs the residue so developer_share_cents + agency_share_cents == total_cost_cents always holds"
    worked_example: |
      maintenance_responsibility SHARED, cost_share_pct_developer 0.35,
      line_items [41250, 41250, 41250]:
        per-line 14438 each (41250*0.35 = 14437.5 -> 14438) -> developer_share_cents 43314;
        total_cost_cents 123750; agency_share_cents 80436.
      Sum-then-round would give round_half_up(123750 * 0.35) = 43313 — one cent less. With five
      identical lines the gap widens to 2 cents (72190 pinned vs 72188 sum-then-round).

  - name: federal_interest_amount
    trigger: "On POST /jda/agreements/{id}/disposition-requests; the transition's side_effects list federal_interest_amount_cents and the two AgencySite encumbrance fields"
    algorithm: aggregation
    formula: |
      federal_interest_amount_cents = round_half_up(
          AgencySite.federal_interest_basis_cents * JointDevelopmentAgreement.site_area_share_pct / 100)
      # AgencySite.federal_interest_basis_cents itself was pinned at valuation certification:
      #   round_half_up(latest CERTIFIED ValuationDetermination.appraised_value_cents
      #                 * AgencySite.federal_interest_pct / 100)
      # conserved quantity (invariant, MUST hold after every write):
      #   AgencySite.federal_interest_encumbered_cents
      # + AgencySite.federal_interest_unencumbered_cents
      # = AgencySite.federal_interest_basis_cents
    input_set: "AgencySite.federal_interest_basis_cents (frozen at the most recent valuation certification) and the requesting agreement's site_area_share_pct. FederalDispositionRequests whose determination IN {REJECTED, WITHDRAWN} contribute 0 to federal_interest_encumbered_cents; PENDING, APPROVED and APPROVED_WITH_CONDITIONS requests each contribute their full federal_interest_amount_cents."
    constants: {}
    precision: "Integer cents, round_half_up"
    worked_example: "appraised_value_cents 48500000 with federal_interest_pct 2.5 gives basis 1212500; site_area_share_pct 60 gives federal_interest_amount_cents 727500, leaving federal_interest_unencumbered_cents 485000."

  - name: staging_capacity_availability
    trigger: "On POST /jda/staging-windows/{id}/decision (both branches read it; the APPROVE branch writes it), on POST /jda/staging-windows/{id}/close, and on the APPROVED -> SUSPENDED cascade"
    algorithm: interval_merge
    formula: |
      # half-open interval semantics [start_at, end_at): two windows overlap iff
      #   a.start_at < b.end_at AND b.start_at < a.end_at
      # adjacency (a.end_at == b.start_at) is NOT an overlap.
      conflicting = StagingWindows W on the same shared_facility_id
                    with W.status == APPROVED
                    and W.id != this window's id
                    and W.start_at < this.end_at and this.start_at < W.end_at
      peak_occupancy = this.bays_occupied
                     + max over each boundary instant b in the sorted set of
                       {this.start_at} UNION {W.start_at for W in conflicting}
                       of sum(W.bays_occupied for W in conflicting where W.start_at <= b < W.end_at)
      approval passes iff peak_occupancy <= SharedFacility.total_bay_capacity
      # denormalised ledger field, refreshed on every status write:
      SharedFacility.available_bay_capacity =
          SharedFacility.total_bay_capacity
          - sum(W.bays_occupied for W in this facility's StagingWindows where W.status == APPROVED)
      # conserved quantity (invariant, MUST hold after every write):
      #   SharedFacility.available_bay_capacity
      # + sum(bays_occupied over APPROVED windows on the facility)
      # = SharedFacility.total_bay_capacity
    input_set: "StagingWindows of the same shared_facility_id whose status == APPROVED. REQUESTED, REJECTED, SUSPENDED and CLOSED windows are excluded from both the overlap test and available_bay_capacity."
    constants: {}
    precision: "Integer bay counts; a window with bays_occupied == 0 never conflicts and never changes available_bay_capacity"
    determinism_note: "Boundary instants are evaluated in ascending timestamp order; when two windows share a boundary instant their created_at ASC order is used for reporting only and cannot change the sum. `id` is never consulted."

# ============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first failing row's error_id is the response)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body shape: every required input field present, types match, enum values are members of the declared constraint set, numeric ranges honored, federal_interest_pct == 0 when acquisition_funding_source == LOCAL_ONLY, proposed_annual_rent_cents >= 1 for GROUND_LEASE and proposed_purchase_price_cents >= 1 for FEE_DISPOSITION, base_rent_cents >= 1 for a GROUND_LEASE agreement and purchase_price_cents >= 1 for a FEE_DISPOSITION agreement, condition_notes non-empty for APPROVED_WITH_CONDITIONS and REJECTED determinations, rejection_reason non-empty for a REJECT decision, pagination limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints that accept a body or query parameters"
  - priority: 4
    category: existence
    check: "Every path-segment resource exists, validated left to right: site -> assessment -> solicitation -> proposal -> negotiation-period -> valuation -> agreement -> disposition-request -> facility-replacement -> shared-facility -> staging-window"
    error_id: "ERR_SITE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_NEGOTIATION_PERIOD_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DISPOSITION_REQUEST_NOT_FOUND | ERR_FACILITY_REPLACEMENT_NOT_FOUND | ERR_SHARED_FACILITY_NOT_FOUND | ERR_STAGING_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the body exists, validated in body-field declaration order (site_id, developer_id, proposal_id, valuation_id, jda_id, shared_facility_id)"
    error_id: "ERR_SITE_NOT_FOUND | ERR_DEVELOPER_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SHARED_FACILITY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /jda/solicitations/{id}/proposals, POST /jda/sites/{id}/negotiation-periods, POST /jda/solicitations/{id}/award, POST /jda/agreements, POST /jda/staging-windows, POST /jda/shared-facilities/{id}/maintenance-charges"
  - priority: 6
    category: auth
    check: "Resource ownership for the entity_backed Developer role: on POST /jda/solicitations/{id}/proposals the body developer_id MUST equal X-User-ID; on GET /jda/proposals/{id} the proposal's developer_id MUST equal X-User-ID; on POST /jda/staging-windows the referenced agreement's developer_id MUST equal X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /jda/solicitations/{id}/proposals, GET /jda/proposals/{id}, POST /jda/staging-windows"
  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_site_version equals AgencySite.version (POST /jda/sites/{id}/valuations); expected_facility_version equals SharedFacility.version (POST /jda/staging-windows)"
    error_id: "ERR_STALE_SITE_VERSION | ERR_STALE_FACILITY_VERSION"
    http_status: 412
    applies_to: "POST /jda/sites/{id}/valuations, POST /jda/staging-windows"
  - priority: 8
    category: auth
    check: "Segregation of duties: on POST /jda/agreements/{id}/board-approve, X-User-ID MUST differ from JointDevelopmentAgreement.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /jda/agreements/{id}/board-approve"
  - priority: 10
    category: state
    check: "AgencySite.status is in the set the operation requires: ASSESSED for release-for-solicitation; {ASSESSED, SOLICITATION_READY} for reopen-inventory (and no ISSUED solicitation on the site); SOLICITATION_READY for solicitation issue; {INVENTORIED, ASSESSED} for assessment certification; {ASSESSED, SOLICITATION_READY, UNDER_AGREEMENT} for valuation certification; {SOLICITATION_READY, UNDER_AGREEMENT} for direct negotiation-period creation"
    error_id: ERR_INVALID_SITE_STATE
    http_status: 409
    applies_to: "POST /jda/sites/{id}/release-for-solicitation, POST /jda/sites/{id}/reopen-inventory, POST /jda/solicitations/{id}/issue, POST /jda/assessments/{id}/certify, POST /jda/valuations/{id}/certify, POST /jda/sites/{id}/negotiation-periods, POST /jda/negotiation-periods/{id}/terminate"
  - priority: 11
    category: state
    check: "AgencySite.readiness_tier == READY (readiness_composite_score >= 70.00)"
    error_id: ERR_SITE_NOT_READY
    http_status: 409
    applies_to: "POST /jda/sites/{id}/release-for-solicitation"
  - priority: 12
    category: state
    check: "AgencySite.status == UNDER_AGREEMENT"
    error_id: ERR_SITE_NOT_UNDER_AGREEMENT
    http_status: 409
    applies_to: "POST /jda/agreements"
  - priority: 13
    category: state
    check: "ReadinessAssessment.status == DRAFT"
    error_id: ERR_ASSESSMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /jda/assessments/{id}/certify"
  - priority: 14
    category: state
    check: "Solicitation.status == DRAFT for issue; == ISSUED for close; IN {ISSUED} for proposal submission; IN {ISSUED, CLOSED} for shortlist"
    error_id: ERR_SOLICITATION_NOT_ISSUED
    http_status: 409
    applies_to: "POST /jda/solicitations/{id}/issue, POST /jda/solicitations/{id}/close, POST /jda/solicitations/{id}/proposals, POST /jda/proposals/{id}/shortlist"
  - priority: 15
    category: state
    check: "Solicitation.status == CLOSED"
    error_id: ERR_SOLICITATION_NOT_CLOSED
    http_status: 409
    applies_to: "POST /jda/solicitations/{id}/award"
  - priority: 16
    category: state
    check: "Proposal.status == SUBMITTED for shortlist; IN {SUBMITTED, SHORTLISTED} for award and for direct negotiation-period creation; and the proposal belongs to the solicitation named in the path"
    error_id: ERR_PROPOSAL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /jda/proposals/{id}/shortlist, POST /jda/solicitations/{id}/award, POST /jda/sites/{id}/negotiation-periods"
  - priority: 17
    category: state
    check: "ExclusiveNegotiationPeriod.status IN {ACTIVE, EXTENDED}"
    error_id: ERR_NEGOTIATION_PERIOD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /jda/negotiation-periods/{id}/extend, POST /jda/negotiation-periods/{id}/terminate"
  - priority: 18
    category: state
    check: "JointDevelopmentAgreement.negotiation_status == DRAFTING for submit-for-review; IN {DRAFTING, REVISION_REQUESTED} for PATCH"
    error_id: ERR_AGREEMENT_NOT_DRAFTING
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/submit-for-review, PATCH /jda/agreements/{id}"
  - priority: 19
    category: state
    check: "JointDevelopmentAgreement.negotiation_status == AGENCY_REVIEW for request-revision and board-approve; IN {AGENCY_REVIEW, BOARD_APPROVED} for filing a federal disposition request"
    error_id: ERR_AGREEMENT_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/request-revision, POST /jda/agreements/{id}/board-approve, POST /jda/agreements/{id}/disposition-requests"
  - priority: 20
    category: state
    check: "JointDevelopmentAgreement.negotiation_status == BOARD_APPROVED for execute and for staging-window approval"
    error_id: ERR_AGREEMENT_NOT_BOARD_APPROVED
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/execute, POST /jda/staging-windows/{id}/decision"
  - priority: 21
    category: state
    check: "JointDevelopmentAgreement.federal_approval_status == NOT_SUBMITTED for filing a disposition request; IN {NOT_REQUIRED, FTA_APPROVED} for execution"
    error_id: ERR_FEDERAL_APPROVAL_PENDING
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/disposition-requests, POST /jda/agreements/{id}/execute"
  - priority: 22
    category: state
    check: "FederalDispositionRequest.determination == PENDING"
    error_id: ERR_DISPOSITION_ALREADY_DETERMINED
    http_status: 409
    applies_to: "POST /jda/disposition-requests/{id}/determination, POST /jda/disposition-requests/{id}/withdraw"
  - priority: 23
    category: state
    check: "StagingWindow.status == REQUESTED"
    error_id: ERR_STAGING_WINDOW_NOT_REQUESTED
    http_status: 409
    applies_to: "POST /jda/staging-windows/{id}/decision"
  - priority: 24
    category: state
    check: "StagingWindow.status IN {APPROVED, SUSPENDED}"
    error_id: ERR_STAGING_WINDOW_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /jda/staging-windows/{id}/close"
  - priority: 25
    category: state
    check: "TransitFacilityReplacement.status permits the requested transition: PLANNED -> INTERIM_IN_PLACE, INTERIM_IN_PLACE -> COMPLETE|DEFICIENT, DEFICIENT -> COMPLETE; any other pair is rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /jda/facility-replacements/{id}/status"
  - priority: 30
    category: business_safety
    check: "Developer.debarment_status == CLEAR for the developer submitting a proposal, being awarded, or named on an agreement"
    error_id: ERR_DEVELOPER_DEBARRED
    http_status: 409
    applies_to: "POST /jda/solicitations/{id}/proposals, POST /jda/solicitations/{id}/award, POST /jda/agreements"
  - priority: 34
    category: business_safety
    check: "Proposal.affordable_pct >= Solicitation.affordable_housing_min_pct; and for an agreement, 100 * affordable_units_committed / total_units >= the proposal's solicitation affordable_housing_min_pct"
    error_id: ERR_AFFORDABLE_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /jda/solicitations/{id}/proposals, POST /jda/agreements"
  - priority: 36
    category: business_safety
    check: "joint_use_committed == true whenever the governing Solicitation.joint_use_required == true"
    error_id: ERR_JOINT_USE_NOT_COMMITTED
    http_status: 422
    applies_to: "POST /jda/solicitations/{id}/proposals, POST /jda/agreements"
  - priority: 38
    category: business_referential
    check: "The referenced ValuationDetermination.status == CERTIFIED (valuation certify itself requires status == DRAFT)"
    error_id: ERR_VALUATION_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/submit-for-review, POST /jda/valuations/{id}/certify"
  - priority: 39
    category: business_referential
    check: "The referenced ValuationDetermination.site_id equals the agreement's site_id, and the referenced Proposal's solicitation belongs to the same site"
    error_id: ERR_VALUATION_SITE_MISMATCH
    http_status: 422
    applies_to: "POST /jda/agreements"
  - priority: 40
    category: business_referential
    check: "An ExclusiveNegotiationPeriod whose proposal_id == the agreement's proposal_id exists with status IN {ACTIVE, EXTENDED} and date(current logical clock) <= its end_date"
    error_id: ERR_NEGOTIATION_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /jda/agreements, POST /jda/agreements/{id}/submit-for-review"
  - priority: 41
    category: business_referential
    check: "When AgencySite.transit_facility_present == true, a TransitFacilityReplacement of the agreement has status IN {INTERIM_IN_PLACE, COMPLETE}"
    error_id: ERR_FACILITY_REPLACEMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/execute, POST /jda/staging-windows/{id}/decision"
  - priority: 42
    category: business_referential
    check: "No TransitFacilityReplacement of the agreement has status == DEFICIENT"
    error_id: ERR_FACILITY_REPLACEMENT_DEFICIENT
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/execute"
  - priority: 44
    category: business_temporal
    check: "Interval well-formedness: negotiation_end_date > negotiation_start_date; new_end_date > end_date; end_at > start_at; period_end > period_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /jda/solicitations/{id}/award, POST /jda/sites/{id}/negotiation-periods, POST /jda/negotiation-periods/{id}/extend, POST /jda/staging-windows, POST /jda/shared-facilities/{id}/maintenance-charges"
  - priority: 45
    category: business_temporal
    check: "Solicitation.response_deadline > current logical clock"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /jda/solicitations/{id}/issue, POST /jda/solicitations/{id}/proposals"
  - priority: 46
    category: business_temporal
    check: "The staging interval is contained in the envelope [ENP.start_date T00:00:00Z, (ENP.end_date + STAGING_TAIL_DAYS) T00:00:00Z), where ENP is the ExclusiveNegotiationPeriod whose proposal_id equals the agreement's proposal_id and STAGING_TAIL_DAYS == 180"
    error_id: ERR_STAGING_WINDOW_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /jda/staging-windows"
  - priority: 50
    category: business_constraint
    check: "AgencySite.site_code is unique across all sites"
    error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    applies_to: "POST /jda/sites"
  - priority: 52
    category: business_constraint
    check: "Closed-closed overlap: the candidate [start_date, end_date] must not satisfy candidate.start_date <= other.end_date AND other.start_date <= candidate.end_date for any other ExclusiveNegotiationPeriod on the same site whose status IN {ACTIVE, EXTENDED}; sharing a single boundary day IS a collision"
    error_id: ERR_NEGOTIATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /jda/sites/{id}/negotiation-periods, POST /jda/negotiation-periods/{id}/extend, POST /jda/solicitations/{id}/award"
  - priority: 54
    category: business_constraint
    check: "ExclusiveNegotiationPeriod.extension_count < MAX_NEGOTIATION_EXTENSIONS (2)"
    error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 409
    applies_to: "POST /jda/negotiation-periods/{id}/extend"
  - priority: 56
    category: business_constraint
    check: "Half-open aggregate capacity: peak_occupancy over [start_at, end_at) against APPROVED windows of the same SharedFacility, per calculations.staging_capacity_availability, must be <= SharedFacility.total_bay_capacity; adjacency (this.start_at == other.end_at) never conflicts"
    error_id: ERR_STAGING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /jda/staging-windows, POST /jda/staging-windows/{id}/decision"
  - priority: 57
    category: business_constraint
    check: "The number of proposals of the solicitation whose status is SUBMITTED or SHORTLISTED is >= Solicitation.min_proposals_required"
    error_id: ERR_NO_RESPONSIVE_PROPOSALS
    http_status: 409
    applies_to: "POST /jda/solicitations/{id}/close"
  - priority: 58
    category: business_constraint
    check: "The awarded Proposal.rank == 1, or deviation_justification is present and non-empty"
    error_id: ERR_RANK_DEVIATION_UNJUSTIFIED
    http_status: 422
    applies_to: "POST /jda/solicitations/{id}/award"
  - priority: 60
    category: business_constraint
    check: "line_items array length >= 1"
    error_id: ERR_EMPTY_LINE_ITEMS
    http_status: 422
    applies_to: "POST /jda/shared-facilities/{id}/maintenance-charges"
  - priority: 70
    category: business_fiscal
    check: "AgencySite.federal_interest_unencumbered_cents >= calculations.federal_interest_amount for the filing agreement"
    error_id: ERR_FEDERAL_INTEREST_INSUFFICIENT
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/disposition-requests"
  - priority: 72
    category: business_fiscal
    check: "JointDevelopmentAgreement.affordable_units_committed >= the selected Proposal.affordable_units"
    error_id: ERR_AFFORDABLE_COMMITMENT_SHORTFALL
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/submit-for-review"
  - priority: 74
    category: business_fiscal
    check: "JointDevelopmentAgreement.consideration_value_cents >= the referenced ValuationDetermination.permissible_floor_cents"
    error_id: ERR_BELOW_PERMISSIBLE_FLOOR
    http_status: 409
    applies_to: "POST /jda/agreements/{id}/submit-for-review"

validation_priority_conflicts:
  - pair: "state (priority 12, ERR_SITE_NOT_UNDER_AGREEMENT) vs business_safety (priority 30, ERR_DEVELOPER_DEBARRED)"
    endpoint: "POST /jda/agreements"
    winner: ERR_SITE_NOT_UNDER_AGREEMENT
  - pair: "business_referential (priority 38, ERR_VALUATION_NOT_CERTIFIED) vs business_fiscal (priority 74, ERR_BELOW_PERMISSIBLE_FLOOR)"
    endpoint: "POST /jda/agreements/{id}/submit-for-review"
    winner: ERR_VALUATION_NOT_CERTIFIED
  - pair: "business_temporal (priority 46, ERR_STAGING_WINDOW_OUTSIDE_TERM) vs business_constraint (priority 56, ERR_STAGING_CAPACITY_EXCEEDED)"
    endpoint: "POST /jda/staging-windows"
    winner: ERR_STAGING_WINDOW_OUTSIDE_TERM

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:

  # ---------------------------------------------------------------- reads ---
  - method: GET
    path: "/jda/sites"
    description: "List the agency-owned site inventory, ordered by site_code ASC, with optional status, readiness-tier and funding-source filters. Envelope carries total_count and has_more."
    roles: [RealEstateOfficer, ValuationOfficer, BoardSecretary, GrantsComplianceOfficer, TransitOperationsManager, Developer, SystemAdmin]
    input: ["status?", "tier?", "acquisition_funding_source?", "limit?", "offset?"]  # types: { status?: enum, tier?: enum, acquisition_funding_source?: enum, limit?: integer, offset?: integer }
    output: "AgencySite[]"
    side_effects: []
  - method: GET
    path: "/jda/sites/{id}"
    description: "Fetch one agency site with its computed readiness score, tier and federal-interest ledger fields."
    roles: [RealEstateOfficer, ValuationOfficer, BoardSecretary, GrantsComplianceOfficer, TransitOperationsManager, Developer, SystemAdmin]
    input: []
    output: "AgencySite"
    side_effects: []
  - method: GET
    path: "/jda/sites/{id}/assessments"
    description: "List the readiness assessments recorded against one site, newest first by created_at DESC then id ASC."
    roles: [RealEstateOfficer, ValuationOfficer, BoardSecretary, GrantsComplianceOfficer, TransitOperationsManager, Developer, SystemAdmin]
    input: ["status?", "limit?", "offset?"]  # types: { status?: enum, limit?: integer, offset?: integer }
    output: "ReadinessAssessment[]"
    side_effects: []
  - method: GET
