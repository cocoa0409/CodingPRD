# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2352 State Revenue Forecasting &
# Reserve Management
#
# Machine-readable index of the difficulty features SCAFFOLD.yaml (§1.1–§1.7)
# already declares, cross-referenced against the nine §0.5 Difficulty Rules.
# Nothing here adds behaviour: every `grounds:` entry resolves into
# SCAFFOLD.yaml, and every numeric literal in an `assert:` was produced by
# executing the §1.3 formula it belongs to.
#
# Fixture conventions shared by every instance below:
#   * logical clock starts at 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc)
#   * fiscal year 2027 spans 2026-07-01 .. 2027-06-30
#   * PIT source: base 1234567800, elasticities 4150 / 7825 / 640 / 1420, MEDIUM
#   * CGT source: base  312345600, elasticities    0 / 2075 /   0 / 8940, HIGH
#   * scenarios: BASELINE w6000 (150/400/300/600), OPTIMISTIC w2500
#     (300/700/600/1500), PESSIMISTIC w1500 (-100/100/-200/-1000)
#   * derived, once and for all: PIT weighted 1296456684, policy -37500000,
#     recurring 1258956684; CGT weighted 331459589, policy +4000000,
#     recurring 335459589; CGT one-time 12000000
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations, each with two variants, on two DIFFERENT entity domains:
  # consensus estimation (ConsensusRound) and reserve accounting (ReserveFund).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reconciliation_policy_variant_divergence_on_consensus_round
        grounds:
          - calculations.consensus_reconciled_total
          - calculations.consensus_variance
          - entities.ForecastCycle.fields.reconciliation_policy
          - entities.ConsensusRound.fields.reconciled_total_cents
          - state_machines.ConsensusRound.OPEN_to_COMPARED
        distinguishing_aspect: |
          Variant divergence lives in the consensus-estimation domain — the variant selector is
          ForecastCycle.reconciliation_policy and the divergent output is
          ConsensusRound.reconciled_total_cents: two cycles fed byte-identical sources, scenarios,
          policy adjustments, one-time items and body estimates reconcile to 1600916273 under
          MIDPOINT_AVERAGE and 1595416273 under LOWER_OF_TWO, a 5500000-cent delta, while both
          rounds report the same exec_total_cents 1606416273 and leg_total_cents 1595416273.
        test_recipe:
          setup:
            - "Two ACTIVE revenue sources (PIT, CGT) with the pinned bases and elasticities."
            - "Two FY2027 BASELINE forecast cycles that differ in exactly one field: cycle A carries reconciliation_policy MIDPOINT_AVERAGE, cycle B carries LOWER_OF_TWO."
            - "Each cycle carries the same three scenarios totalling 10000 bps and its own ACTIVE CGT one-time item of 12000000."
            - "Both sources carry the same two policy adjustments (PIT PRORATED decrease, CGT TIERED increase capped at 4000000) — policy adjustments hang off the source, so both cycles see them identically."
            - "Each cycle has one round whose two submission dimensions are SUBMITTED, so both rounds are COMPARED with reconciled_total_cents written."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources"
              payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_cgt: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /revenue-sources/${src_cgt}/policy-adjustments"
              payload: { statute_code: "SB-2027-003", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 20000000, effective_start_date: "2026-07-01", phase_in_type: "TIERED", first_effective_fiscal_year: 2027, cap_amount_cents: 4000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles"
              payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc_a: $.data.id }
            - call: "POST /forecast-cycles/${cyc_a}/scenarios"
              payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_a}/scenarios"
              payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_a}/scenarios"
              payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /one-time-items"
              payload: { cycle_id: "${cyc_a}", source_id: "${src_cgt}", item_type: "SETTLEMENT", amount_cents: 12000000, description: "Multistate corporate tax settlement, single payment" }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_a}/lock-inputs"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc_a_v_locked: $.data.version }
            - call: "POST /consensus-rounds"
              payload: { cycle_id: "${cyc_a}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_a_v_locked}" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { rnd_a: $.data.id }
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_a}", source_id: "${src_pit}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_a}", source_id: "${src_cgt}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_a}", source_id: "${src_pit}", judgmental_adjustment_cents: -8000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_a}", source_id: "${src_cgt}", judgmental_adjustment_cents: -3000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /consensus-rounds/${rnd_a}/submit"
              payload: {}
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /consensus-rounds/${rnd_a}/submit"
              payload: {}
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /forecast-cycles"
              payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "LOWER_OF_TWO", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc_b: $.data.id }
            - call: "POST /forecast-cycles/${cyc_b}/scenarios"
              payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_b}/scenarios"
              payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_b}/scenarios"
              payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /one-time-items"
              payload: { cycle_id: "${cyc_b}", source_id: "${src_cgt}", item_type: "SETTLEMENT", amount_cents: 12000000, description: "Multistate corporate tax settlement, single payment" }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc_b}/lock-inputs"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc_b_v_locked: $.data.version }
            - call: "POST /consensus-rounds"
              payload: { cycle_id: "${cyc_b}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_b_v_locked}" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { rnd_b: $.data.id }
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_b}", source_id: "${src_pit}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_b}", source_id: "${src_cgt}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_b}", source_id: "${src_pit}", judgmental_adjustment_cents: -8000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd_b}", source_id: "${src_cgt}", judgmental_adjustment_cents: -3000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /consensus-rounds/${rnd_b}/submit"
              payload: {}
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
          trigger:
            - call: "POST /consensus-rounds/${rnd_b}/submit"
              payload: {}
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "GET /consensus-rounds/${rnd_a}"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
          assert:
            - "ConsensusRound.${rnd_a}.status == COMPARED and ConsensusRound.${rnd_b}.status == COMPARED"
            - "ConsensusRound.${rnd_a}.exec_total_cents == 1606416273 and ConsensusRound.${rnd_b}.exec_total_cents == 1606416273"
            - "ConsensusRound.${rnd_a}.leg_total_cents == 1595416273 and ConsensusRound.${rnd_b}.leg_total_cents == 1595416273"
            - "ConsensusRound.${rnd_a}.variance_bps == 69 and ConsensusRound.${rnd_b}.variance_bps == 69"
            - "ConsensusRound.${rnd_a}.reconciled_total_cents == 1600916273   # MIDPOINT_AVERAGE: 1254956684 + 345959589"
            - "ConsensusRound.${rnd_b}.reconciled_total_cents == 1595416273   # LOWER_OF_TWO: 1250956684 + 344459589"
            - "ConsensusRound.${rnd_a}.reconciled_total_cents - ConsensusRound.${rnd_b}.reconciled_total_cents == 5500000"
            - "ConsensusRound.${rnd_a}.reconciled_total_cents is strictly between leg_total_cents 1595416273 and exec_total_cents 1606416273"
            - "ConsensusRound.${rnd_b}.reconciled_total_cents == ConsensusRound.${rnd_b}.leg_total_cents (both bodies were lower on both sources, so LOWER_OF_TWO collapses onto the legislative total)"

      - name: deposit_rule_variant_divergence_on_reserve_fund
        grounds:
          - calculations.reserve_deposit_amount
          - entities.ReserveFund.fields.deposit_rule_variant
          - entities.ReserveTransaction.fields.gross_computed_cents
          - state_machines.ForecastCycle.CONSENSUS_REACHED_to_CERTIFIED
        distinguishing_aspect: |
          Variant divergence lives in the reserve-accounting domain — the variant selector is
          ReserveFund.deposit_rule_variant and the divergent output is the CERTIFICATION_DEPOSIT
          ReserveTransaction: one and the same certification owes a GROWTH_ABOVE_TREND fund
          21958137 cents (whole recurring total against the prior baseline grown 300 bps) and a
          VOLATILE_SOURCE_CAPTURE fund 6121811 cents (HIGH-volatility CGT only, against CGT's own
          base-year receipts grown 300 bps), with both funds configured identically otherwise.
        test_recipe:
          setup:
            - "The FY2027 cycle is CONSENSUS_REACHED with reconciled_total_cents 1600916273 (MIDPOINT_AVERAGE), one-time 12000000, recurring 1588916273, prior_recurring_baseline 1500000000."
            - "Two reserve funds exist with identical cap_pct_bps 1000, trend_growth_rate_bps 300, capture_rate_bps 5000 and opening_balance_cents 0, differing only in deposit_rule_variant."
            - "CGT is the only HIGH-volatility ACTIVE source, so it alone feeds the VOLATILE_SOURCE_CAPTURE measure."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources"
              payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_cgt: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /revenue-sources/${src_cgt}/policy-adjustments"
              payload: { statute_code: "SB-2027-003", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 20000000, effective_start_date: "2026-07-01", phase_in_type: "TIERED", first_effective_fiscal_year: 2027, cap_amount_cents: 4000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles"
              payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc: $.data.id }
            - call: "POST /forecast-cycles/${cyc}/scenarios"
              payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc}/scenarios"
              payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc}/scenarios"
              payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /one-time-items"
              payload: { cycle_id: "${cyc}", source_id: "${src_cgt}", item_type: "SETTLEMENT", amount_cents: 12000000, description: "Multistate corporate tax settlement, single payment" }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles/${cyc}/lock-inputs"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { cyc_v_locked: $.data.version }
            - call: "POST /consensus-rounds"
              payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v_locked}" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { rnd: $.data.id }
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd}", source_id: "${src_pit}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd}", source_id: "${src_cgt}" }
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd}", source_id: "${src_pit}", judgmental_adjustment_cents: -8000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /source-estimates"
              payload: { round_id: "${rnd}", source_id: "${src_cgt}", judgmental_adjustment_cents: -3000000 }
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /consensus-rounds/${rnd}/submit"
              payload: {}
              as: ExecutiveEconomist
              as_user_id: "exec-eco-1"
            - call: "POST /consensus-rounds/${rnd}/submit"
              payload: {}
              as: LegislativeEconomist
              as_user_id: "leg-eco-1"
            - call: "POST /consensus-rounds/${rnd}/ratify"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /reserve-funds"
              payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 30, opening_balance_cents: 0 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { fund_g: $.data.id }
            - call: "POST /reserve-funds"
              payload: { name: "Capital Gains Volatility Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "VOLATILE_SOURCE_CAPTURE", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 30, opening_balance_cents: 0 }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { fund_v: $.data.id }
          trigger:
            - call: "POST /forecast-cycles/${cyc}/certify"
              payload: {}
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "GET /reserve-transactions"
              payload: { fund_id: "${fund_g}" }
              as: ReserveTreasurer
              as_user_id: "tr-1"
              captures: { txn_g: "$.data[0].id" }
            - call: "GET /reserve-transactions"
              payload: { fund_id: "${fund_v}" }
              as: ReserveTreasurer
              as_user_id: "tr-1"
              captures: { txn_v: "$.data[0].id" }
          assert:
            - "ForecastCycle.${cyc}.certified_total_cents == 1600916273 and certified_one_time_cents == 12000000 and certified_recurring_total_cents == 1588916273"
            - "ReserveTransaction.${txn_g}.origin == CERTIFICATION_DEPOSIT and signed_amount_cents == 21958137 and gross_computed_cents == 21958137 and overflow_returned_cents == 0"
            - "ReserveTransaction.${txn_v}.origin == CERTIFICATION_DEPOSIT and signed_amount_cents == 6121811 and gross_computed_cents == 6121811 and overflow_returned_cents == 0"
            - "ReserveTransaction.${txn_g}.source_cycle_id == ${cyc} and ReserveTransaction.${txn_v}.source_cycle_id == ${cyc}"
            - "ReserveFund.${fund_g}.balance_cents == 21958137   # GROWTH_ABOVE_TREND: trend_line 1545000000, excess 43916273, capture 5000 bps"
            - "ReserveFund.${fund_v}.balance_cents == 6121811    # VOLATILE_SOURCE_CAPTURE: measured 333959589, trend_line 321715968, excess 12243621"
            - "ReserveFund.${fund_g}.balance_cents - ReserveFund.${fund_v}.balance_cents == 15836326"
            - "ReserveFund.${fund_g}.cap_cents == 160091627 and ReserveFund.${fund_v}.cap_cents == 160091627"
            - "ReserveFund.${fund_g}.deposit_posture == ACCEPTING and ReserveFund.${fund_v}.deposit_posture == ACCEPTING"
            - "ReserveFund.${fund_g}.coverage_ratio_bps == 2763 (THIN) and ReserveFund.${fund_v}.coverage_ratio_bps == 770 (INSUFFICIENT) — the same required_reserve_cents 79445814 divided by two different balances"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Three instances in three DIFFERENT modes:
  #   (b) nested rounding order pinned      -> weighted_scenario_source_estimate
  #   (a) >=3 inputs, nested min/max, tiers -> policy_change_phase_in_amount
  #   (c) circular-looking dependency with pinned evaluation order -> reserve_adequacy
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: scenario_weighting_rounds_per_scenario_before_weighting
        grounds:
          - calculations.weighted_scenario_source_estimate
          - entities.EconomicScenario.fields.weight_bps
          - entities.RevenueSource.fields.elasticity_asset_bps
          - endpoints[GET /forecast-cycles/{id}/scenario-estimates]
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: the formula rounds three times in a fixed order
          (per-scenario growth to whole bps, then per-scenario amount to whole cents, then the
          weighted sum once), so the PIT preview must read weighted_scenario_cents 1296456684 and
          must NOT read 1296419647, the value produced by the arithmetically tempting shortcut of
          weighting the three growth rates first and applying one blended rate to the base.
        test_recipe:
          setup:
            - "One ACTIVE revenue source: PIT, base 1234567800, elasticities 4150 / 7825 / 640 / 1420."
            - "One FY2027 DRAFT cycle carrying the three pinned scenarios, weights 6000 / 2500 / 1500 = 10000 bps."
            - "One ACTIVE PIT policy adjustment: DECREASE, PRORATED, annualized 50000000, window 2026-10-01 .. 2027-07-01 exclusive, first_effective_fiscal_year 2027, uncapped."
            - "No one-time items exist, so one_time_cents must read 0."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /forecast-cycles"
              payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }
              as: ForecastDirector
              as_user_id: "dir-1"
