              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id }
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_A", reporting_asset_key: "RPT_A", clearance_level: "INTERNAL", criticality: "TIER1", required_lead_days: 5 }
              as: GovernanceAdmin
              captures: { sub_a: $.data.id }
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_B", reporting_asset_key: "RPT_B", clearance_level: "INTERNAL", criticality: "TIER2", required_lead_days: 5 }
              as: GovernanceAdmin
              captures: { sub_b: $.data.id }
          trigger:
            - call: "POST /mdm/consumer-subscriptions/${sub_a}/acknowledge"
              payload: {}
              as: ConsumerRep
              as_user_id: "${sub_b}"
              captures: { e_foreign: $.data.error_id }
            - call: "POST /mdm/consumer-subscriptions/${sub_a}/acknowledge"
              payload: {}
              as: ConsumerRep
              as_user_id: "${sub_a}"
              captures: { e_own: $.data.error_id }
          assert:
            - "${e_foreign} == ERR_NOT_SUBSCRIPTION_OWNER with HTTP 403"
            - "${e_own} == ERR_NO_PENDING_NOTIFICATION with HTTP 409 - the same call by the true owner gets past the ownership gate and fails on the business precondition instead"

