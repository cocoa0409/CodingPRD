  - rule_id: priority_pair_validation_conflict
    instances:
      - name: violation_assess_state_vs_sod
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): assessing a violation that is still CITED by the
          SAME admin who cited it fails segregation-of-duties (422 ERR_SEGREGATION_OF_DUTIES), while
          assessing a violation already in terminal CONFIRMED fails the state precondition (409
          ERR_INVALID_STATE) even when the assessor is a different admin — and when BOTH are violated
          (terminal state AND same-user), the state error wins because priority 5 < 6.
        test_recipe:
          setup:
            - "Member M ACTIVE; published effective rule R; violation V1 CITED by ra-1; violation V2 driven CITED -> ASSESSED(ra-2) -> CONFIRMED(ra-1)"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "V Bank", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/rules"
              payload:
                rule_code: "R-OPS-1"
                title: "Ops rule"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule:
                  - { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 1000 }
              as: RulesAdministrator
              captures: { r1: $.data.id }
            - call: "POST /network/rules/${r1}/publish"
              payload: {}
              as: RulesAdministrator
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r1}", subject_member_id: "${m1}", severity: "MINOR", transaction_amount_minor: 500 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v1: $.data.id }
            - call: "POST /network/rule-violations"
              payload: { rule_id: "${r1}", subject_member_id: "${m1}", severity: "MINOR", transaction_amount_minor: 500 }
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { v2: $.data.id }
            - call: "POST /network/rule-violations/${v2}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
            - call: "POST /network/rule-violations/${v2}/confirm"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-1"
          trigger:
            - call: "POST /network/rule-violations/${v1}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /network/rule-violations/${v2}/assess"
              payload: {}
              as: RulesAdministrator
              as_user_id: "ra-2"
              captures: { err_state: $.data.error_id }
          assert:
            - "Assessing CITED V1 as the citing admin -> ERR_SEGREGATION_OF_DUTIES (422)"
            - "Assessing terminal CONFIRMED V2 (as any admin, incl. the one whose SoD would also fail) -> ERR_INVALID_STATE (409) — state priority 5 beats business_safety priority 6"
            - "RuleViolation.${v1}.status == CITED"
            - "RuleViolation.${v2}.status == CONFIRMED"

      - name: bin_approve_existence_vs_program_gate
        grounds:
          - validations[priority=3]
          - validations[priority=11]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_ENABLED]
        distinguishing_aspect: |
          Error-category pair (existence vs business_referential): approving a BIN range with a
          non-existent program_id returns ERR_NOT_FOUND (404, priority 3), while the same call with an
          existing program that is merely APPROVED (not PRODUCTION_ENABLED) returns
          ERR_PROGRAM_NOT_ENABLED (422, priority 11) — and a request violating both reports the 404 first.
        test_recipe:
          setup:
            - "Issuer member M ACTIVE; BIN range B REQUESTED; program G registered but stuck at APPROVED (never production-enabled)"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Iss Bank", member_kind: "ISSUER", region: "EU" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/bin-ranges"
              payload: { bin_prefix: "422222", issuer_member_id: "${m1}" }
              as: NetworkOperator
              captures: { b1: $.data.id }
            - call: "POST /network/programs"
              payload: { name: "Prog", program_type: "CARD_PRODUCT", product_code: "PC", owner_member_id: "${m1}" }
              as: CertificationEngineer
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /network/programs/${g1}/certification-tests"
              payload: { scope: "NEW_PRODUCT" }
              as: CertificationEngineer
              captures: { ct: $.data.id }
            - call: "POST /network/certification-tests/${ct}/pass"
              payload: {}
              as: CertificationEngineer
            - call: "POST /network/programs/${g1}/approve"
              payload: { expected_program_version: "${g1_v}" }
              as: CertificationEngineer
          trigger:
            - call: "POST /network/bin-ranges/${b1}/approve"
              payload: { program_id: "00000000-0000-0000-0000-000000000000" }
              as: NetworkOperator
              captures: { err_nf: $.data.error_id }
            - call: "POST /network/bin-ranges/${b1}/approve"
              payload: { program_id: "${g1}" }
              as: NetworkOperator
              captures: { err_gate: $.data.error_id }
          assert:
            - "Non-existent program_id -> ERR_NOT_FOUND (404)"
            - "Existing but APPROVED (not PRODUCTION_ENABLED) program -> ERR_PROGRAM_NOT_ENABLED (422)"
            - "BinRange.${b1}.status == REQUESTED"

  - rule_id: boundary_precision_check
    instances:
      - name: merchant_fraud_threshold_exactly_at_100bps
        grounds:
          - calculations.merchant_fraud_rate
          - state_machines.FraudProgramCycle.SCHEDULED_to_COMPLETED
          - entities.Merchant.fields.fraud_monitoring_status
        distinguishing_aspect: |
          Numeric threshold boundary on fraud_rate_bps: a merchant whose confirmed fraud is exactly 100 bps
          of declared volume (10000 cents against 10000000) IS flagged (>= semantics) while a merchant one
          cent lower in fraud (9999 cents against 10000000 = 99.99 bps) is NOT flagged — a one-cent input
          difference flips remediation-plan creation.
        test_recipe:
          setup:
            - "Acquirer A ACTIVE; merchants Mc1 (volume 10000000, fraud 10000) and Mc2 (volume 10000000, fraud 9999), both with CONFIRMED cases inside cycle window"
            - "Cycle C window [2026-09-01, 2026-09-16), evaluated at 2026-09-20"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Acq Bank", member_kind: "ACQUIRER", region: "NA" }
              as: NetworkOperator
              captures: { m_a: $.data.id }
            - call: "POST /network/members/${m_a}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/members"
              payload: { legal_name: "Iss Bank", member_kind: "ISSUER", region: "NA" }
              as: NetworkOperator
              captures: { m_i: $.data.id }
