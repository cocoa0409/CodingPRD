            - call: "POST /foster-homes/${hb}/license"
              payload: { expected_foster_home_version: "${hb_v0}" }
              as: LicensingWorker
              as_user_id: "${lic_id}"
              captures: { hb_v1: $.data.version }
            - call: "POST /placements"
              payload: { child_id: "${child_b}", foster_home_id: "${hb}", expected_foster_home_version: "${hb_v1}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plc_b: $.data.id }
          trigger:
            - call: "POST /placements/${plc_b}/disrupt"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
          assert:
            - "FosterHome.${hb}.active_placement_count == 0"
            - "Placement.${plc_b}.status == DISRUPTED"
            - "Child.${child_b}.status == REMOVED"

      - name: objectives_met_conserved_after_revise_cycle
        grounds:
          - state_machines.CasePlan.ACTIVE_to_REVISION
          - state_machines.CasePlan.REVISION_to_ACTIVE
          - entities.CasePlan.fields.objectives_met
          - calculations.plan_compliance_pct
        distinguishing_aspect: |
          Conserved quantity #2 = objectives_met progress count (a different conserved quantity than
          bed occupancy): sending a plan ACTIVE -> REVISION (forward) then REVISION -> ACTIVE
          (compensating) leaves objectives_met and the derived compliance_pct unchanged
          (objectives_met == 4, compliance_pct == 80.00 before and after).
        test_recipe:
          setup:
            - "An ACTIVE case plan with objectives_total 5, objectives_met 4 (compliance 80.00)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /caseworkers"
              payload: { full_name: "Sara", role_type: "SCREENER", email: "sara18@x.gov" }
              as: Admin
              captures: { scr_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Ivan", role_type: "INVESTIGATOR", email: "ivan18@x.gov" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /caseworkers"
              payload: { full_name: "Cara", role_type: "CASEWORKER", email: "cara18@x.gov" }
              as: Admin
              captures: { cw_id: $.data.id }
            - call: "POST /referrals"
              payload: { reporter_type: "MANDATED", child_name: "Child G", alleged_maltreatment: "PHYSICAL_ABUSE", priority_factors: ["INJURY_VISIBLE", "PRIOR_REPORT"] }
              as: IntakeScreener
              as_user_id: "${scr_id}"
              captures: { ref_g: $.data.id }
            - call: "POST /referrals/${ref_g}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${scr_id}"
            - call: "POST /investigations"
              payload: { referral_id: "${ref_g}", investigator_id: "${inv_id}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { invn_g: $.data.id }
            - call: "POST /investigations/${invn_g}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /investigations/${invn_g}/decision"
              payload: { safety_factors: ["NO_FOOD", "MEDICAL_NEGLECT", "DRUG_ENV", "UNSAFE_SLEEP"], protective_capacity: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases"
              payload: { investigation_id: "${invn_g}" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { case_g: $.data.id }
            - call: "POST /case-plans"
              payload: { case_id: "${case_g}", required_visits_per_month: 4, objectives_total: 5 }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { plan_g: $.data.id }
            - call: "POST /hearings"
              payload: { case_id: "${case_g}", hearing_type: "DISPOSITION", scheduled_at: "2026-01-01T01:00:00Z" }
              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { hr_disp_g: $.data.id }
            - call: "POST /hearings/${hr_disp_g}/hold"
              payload: { ruling: "CONTINUE_PLACEMENT" }
              as: Judge
            - call: "POST /case-plans/${plan_g}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
            - call: "POST /case-plans/${plan_g}/objectives"
              payload: { objectives_met: 4 }
              as: Caseworker
              as_user_id: "${cw_id}"
          trigger:
            - call: "POST /case-plans/${plan_g}/revise"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
            - call: "POST /case-plans/${plan_g}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "${cw_id}"
          assert:
            - "CasePlan.${plan_g}.status == ACTIVE"
            - "CasePlan.${plan_g}.objectives_met == 4"
            - "CasePlan.${plan_g}.compliance_pct == 80.0"
