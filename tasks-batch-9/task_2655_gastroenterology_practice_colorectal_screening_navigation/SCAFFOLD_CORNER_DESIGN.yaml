  - section: errors
    instances:
      - name: missing_x_user_headers_return_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is checked before anything else, so a header-less request to a write endpoint and a request carrying a role string outside the eight declared roles both return 401 ERR_UNAUTHENTICATED rather than 403 ERR_FORBIDDEN_ROLE or 400 ERR_INVALID_REQUEST, and neither call writes a row."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-9999", birth_date: "1975-04-10", insurance_plan_id: "00000000-0000-4000-8000-000000000001" }
              as: PracticeAdmin
              captures: { eid1: $.data.error_id }
            - call: "GET /patients"
              payload: {}
              as: PracticeAdmin
              captures: { eid2: $.data.error_id }
          assert:
            - "the first call is issued with both the X-User-Role and the X-User-ID headers omitted and returns HTTP 401 with ${eid1} == ERR_UNAUTHENTICATED"
            - "the second call is issued with X-User-Role set to the undeclared string EndoscopyTech and returns HTTP 401 with ${eid2} == ERR_UNAUTHENTICATED"
            - "401 wins over the missing insurance_plan_id FK and over the role check - no Patient row exists afterwards"
            - "the error envelope has response_type error and data with keys error_id and message"
      - name: every_declared_not_found_id_is_reachable
