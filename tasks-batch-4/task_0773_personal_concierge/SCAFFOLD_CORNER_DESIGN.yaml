        distinguishing_aspect: "A Member calling POST /billing-cycles/{id}/close (a FinanceOps-exclusive op) is rejected with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["ACTIVE member + membership with an OPEN cycle 0"]
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Rb", email: "rb@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
