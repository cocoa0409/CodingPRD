scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: account_create_returns_201_with_defaults
        claim_type: creation
        grounds:
          - entities.Account.fields.card_credit_balance
          - endpoints
        distinguishing_aspect: "POST /accounts returns 201 with server-minted id, status ACTIVE, card_credit_balance 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "n1@x.com", display_name: "N1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.card_credit_balance == 0"
            - "Account.${acct_id}.version == 1"

      - name: order_create_missing_card_id_returns_400
        claim_type: required_fields
        grounds:
          - entities.Order.fields.card_id
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /orders without required card_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One account and contact."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "n2@x.com", display_name: "N2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Nc", address_line1: "1 N", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: order_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /orders/{unknown-uuid} returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"
            - "HTTP status == 404"

      - name: order_create_defaults_font_style_script
        claim_type: defaults
        grounds:
          - entities.Order.fields.font_style
        distinguishing_aspect: "POST /orders omitting font_style applies default SCRIPT."
        test_recipe:
          setup: ["Account, contact, card."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "n3@x.com", display_name: "N3" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Nc", address_line1: "1 N", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CN", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.font_style == SCRIPT"

      - name: subscription_pro_grant_sets_balance_12
        claim_type: computed_fields
        grounds:
          - calculations.account_credit_balance
          - entities.Account.fields.card_credit_balance
          - state_machines.Subscription.ACTIVE_to_ACTIVE
        distinguishing_aspect: "Creating a PRO subscription grants the full 12 monthly credits; Account.card_credit_balance computes to 12."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "n4@x.com", display_name: "N4" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
          assert:
            - "Account.${acct_id}.card_credit_balance == 12"

      - name: order_create_unknown_contact_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.Order.fields.contact_id
          - errors[ERR_CONTACT_NOT_FOUND]
        distinguishing_aspect: "POST /orders with a contact_id that does not resolve returns ERR_CONTACT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Account and card, no such contact."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "n5@x.com", display_name: "N5" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CN5", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "00000000-0000-4000-8000-000000000001", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONTACT_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------- State machines ----------------
  - section: state_machines
    instances:
      - name: schedule_order_in_pending_proof_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.PROOF_APPROVED_to_SCHEDULED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Scheduling an order still in PENDING_PROOF (proof not approved) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PRO account, VERIFIED contact, submitted order (PENDING_PROOF)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "sm1@x.com", display_name: "SM1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sm", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CSM", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/schedule"
              as: StudioOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_already_cancelled_order_returns_invalid_state
        claim_type: terminal_state
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an order already in terminal CANCELLED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["One DRAFT order, then cancelled."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "sm2@x.com", display_name: "SM2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sm2", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CSM2", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/cancel"
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: approve_proof_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Proof.PENDING_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving an already-APPROVED proof returns ERR_INVALID_STATE (409); the order does not re-transition."
        test_recipe:
          setup: ["Submitted order with APPROVED proof."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "sm3@x.com", display_name: "SM3" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sm3", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CSM3", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: shipment_delivered_cascades_order_to_delivered
        claim_type: side_effect
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - state_machines.Order.MAILED_to_DELIVERED
          - entities.Order.fields.delivered_at
        distinguishing_aspect: "Advancing a Shipment to DELIVERED cascades the owning Order MAILED -> DELIVERED and stamps Order.delivered_at."
        test_recipe:
          setup: ["Full happy path: order produced and mailed, shipment LABEL_CREATED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "sm4@x.com", display_name: "SM4" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Sm4", address_line1: "1 S", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CSM4", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "PenSM", daily_capacity: 5, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/proofs"
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id" }
            - call: "POST /proofs/${proof_id}/approve"
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/schedule"
              as: StudioOperator
            - call: "POST /orders/${order_id}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T11:00:00Z" }
              as: StudioOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders/${order_id}/produce"
              as: StudioOperator
            - call: "POST /orders/${order_id}/mail"
              payload: { carrier: "USPS" }
              as: StudioOperator
            - call: "GET /orders/${order_id}/shipment"
              as: StudioOperator
              captures: { ship_id: "$.data[0].id" }
            - call: "POST /shipments/${ship_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: StudioOperator
          trigger:
            - call: "POST /shipments/${ship_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: StudioOperator
          assert:
            - "Shipment.${ship_id}.status == DELIVERED"
            - "Order.${order_id}.status == DELIVERED"
            - "Order.${order_id}.delivered_at == 2026-04-01T00:00:00.000Z"

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: estimate_total_postage_plus_gift_no_discount
        claim_type: correct_result
        grounds:
          - calculations.order_total
          - entities.Order.fields.estimated_total_cents
        distinguishing_aspect: "At create with Card 25g/500 and Gift 800/40g qty 1 (weight 65 -> tier 450), estimated_total_cents = 450 + 800 = 1250 (no discount, no tax)."
        test_recipe:
          setup: ["Account, contact, card 25g, gift 800/40g."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "ca1@x.com", display_name: "CA1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Ca", address_line1: "1 C", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CCA", title: "Bday", category: "BIRTHDAY", base_price_cents: 500, weight_grams: 25 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /gift-items"
              payload: { sku: "GCA", title: "Choc", kind: "CHOCOLATE", price_cents: 800, weight_grams: 40 }
              as: PlatformAdmin
              captures: { gift_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z", gift_item_id: "${gift_id}", gift_quantity: 1 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.postage_cents == 450"
            - "Order.${order_id}.estimated_total_cents == 1250"

      - name: renewal_full_grant_variant
        claim_type: variant_divergence
        grounds:
          - calculations.renewal_credit_grant
        excluded_because:
          difficulty_instance: dual_variant_calc / renewal_full_grant_vs_prorated_upgrade_diverges
          rationale: "The full new_or_renew grant (12) is the contrasting variant asserted in that §1.8 instance."

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: submit_zero_credits_returns_insufficient_credits
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_INSUFFICIENT_CREDITS]
        distinguishing_aspect: "Submitting when Account.card_credit_balance == 0 (contact VERIFIED, future date, valid version) returns ERR_INSUFFICIENT_CREDITS (402)."
        test_recipe:
          setup: ["Account with 0 credits, VERIFIED contact, ACTIVE card, draft order."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vv1@x.com", display_name: "VV1" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Vv", address_line1: "1 V", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /contacts/${contact_id}/verify-address"
              payload: { result: "VERIFIED" }
              as: StudioOperator
            - call: "POST /cards"
              payload: { sku: "CVV", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: PlatformAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/submit"
              payload: { expected_account_version: "${acct_v}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_CREDITS"
            - "HTTP status == 402"

      - name: order_with_retired_card_returns_card_retired
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_CARD_RETIRED]
          - state_machines
        distinguishing_aspect: "Creating an order against a RETIRED card returns ERR_CARD_RETIRED (409)."
        test_recipe:
          setup: ["Account, contact, card retired."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vv2@x.com", display_name: "VV2" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Vv2", address_line1: "1 V", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CVV2", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /cards/${card_id}/retire"
              as: PlatformAdmin
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "hi", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CARD_RETIRED"
            - "HTTP status == 409"

      - name: produce_before_send_date_returns_too_early
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_TOO_EARLY_TO_PRODUCE]
        distinguishing_aspect: "Producing a SCHEDULED order while the logical clock (default 2026-03-01) is before scheduled_send_at (2026-04-01) returns ERR_TOO_EARLY_TO_PRODUCE (409)."
        test_recipe:
          setup: ["PRO account, VERIFIED contact, order scheduled + artist reserved, clock still at 2026-03-01 default."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vv3@x.com", display_name: "VV3" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { tier: "PRO" }
              as: PlatformAdmin
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Vv3", address_line1: "1 V", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
