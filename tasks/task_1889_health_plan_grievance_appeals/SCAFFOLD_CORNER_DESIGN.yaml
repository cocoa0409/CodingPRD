    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers yields 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /appeals/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: expedited_grievance_intake_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_EXPEDITED_NOT_ALLOWED]"]
        distinguishing_aspect: "expedited_requested=true on a GRIEVANCE intake is rejected at creation (grievances have no expedited track)."
        test_recipe:
          setup: ["Member exists"]
