      - name: error_hearing_decision_cannot_be_recorded_twice_on_one_round
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HEARING_ALREADY_DECIDED
          - validations.priority_46.ERR_HEARING_ALREADY_DECIDED
        distinguishing_aspect: "The decision endpoint is single-shot per round: after AFFIRMED is recorded the hearing is DECIDED, so a second decision — even one that would change nothing — is refused with 409 ERR_HEARING_ALREADY_DECIDED, and the citation is not moved a second time either."
