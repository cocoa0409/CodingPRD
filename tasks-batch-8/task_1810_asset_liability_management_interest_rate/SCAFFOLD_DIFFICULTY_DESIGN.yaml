  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_segregation_on_reapprove
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the target set is
          already APPROVED (no approve transition exists -> priority 6
          ERR_INVALID_STATE_TRANSITION) AND the caller is the set's creator
          (priority 7 ERR_SEGREGATION_OF_DUTIES). The state error must win.
          Sibling instance exercises business_temporal vs business_fiscal.
        test_recipe:
          setup:
            - "Book exists; PREPAYMENT set created by user an-1 (as TreasuryAnalyst), SUBMITTED, then APPROVED by ALCOChair ch-1"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { s: $.data.id } }
            - { call: "POST /assumption-sets/${s}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${s}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - call: "POST /assumption-sets/${s}/approve"
              payload: {}
              as: ALCOChair
              as_user_id: an-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (not ERR_SEGREGATION_OF_DUTIES)"
            - "AssumptionSet.${s}.status == APPROVED"

      - name: temporal_beats_fiscal_on_designate
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal: the
          designation has start_month 2026-07 (past; logical clock 2026-08)
          AND notional 150,000,000 exceeding the position balance 100,000,000.
          Priority 9 ERR_DESIGNATION_WINDOW_PAST must beat priority 10
          ERR_HEDGE_NOTIONAL_EXCEEDS_EXPOSURE. Different pair than the sibling.
        test_recipe:
          setup:
            - "Book1 ACTIVE with L1 100,000,000; hedge PROPOSED on L1 with notional 150,000,000; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 150000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h: $.data.id } }
          trigger:
            - call: "POST /hedges/${h}/designate"
              payload: { start_month: "2026-07", end_month: "2027-07", effectiveness_method: DOLLAR_OFFSET }
              as: ALCOChair
              as_user_id: ch-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DESIGNATION_WINDOW_PAST (not ERR_HEDGE_NOTIONAL_EXCEEDS_EXPOSURE)"
            - "HedgeRelationship.${h}.status == PROPOSED"

