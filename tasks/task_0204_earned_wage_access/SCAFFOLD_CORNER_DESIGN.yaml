# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — earned-wage-access
# Walks references/claim-extraction-guide.md row-by-row against this scaffold's
# §1.1-§1.7. Every setup_api_calls chain is executable from empty-DB using only
# §1.5 endpoints. Shared literals identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_employer_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Employer, endpoints]
        distinguishing_aspect: "POST /employers with required fields returns 201, posture HEALTHY, outstanding_principal_cents 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id, posture: $.data.posture, ver: $.data.version }
          assert:
            - "Response code 201; Employer.posture == HEALTHY"
            - "Employer.outstanding_principal_cents == 0; Employer.version == 1"

      - name: create_employer_missing_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Employer.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required legal_name on POST /employers returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { state_code: "CA", pay_frequency: "WEEKLY" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 400 with error_id == ERR_INVALID_REQUEST"

      - name: create_employer_invalid_pay_frequency_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Employer.fields.pay_frequency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pay_frequency outside {WEEKLY,BIWEEKLY,SEMIMONTHLY} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "DAILY" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 400 with error_id == ERR_INVALID_REQUEST"

      - name: get_employer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Employer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /employers/{id} with an unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 404 with error_id == ERR_NOT_FOUND"

      - name: list_workers_paginated_envelope
        claim_type: Listing
        grounds: [entities.Worker, response_envelope]
        distinguishing_aspect: "GET /workers returns an array with pagination fields limit/offset/total_count/has_more in meta/envelope."
        test_recipe:
          setup: ["Employer with two workers."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-2", full_name: "Walt", hourly_rate_cents: 2500, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
          trigger:
            - call: "GET /workers?employer_id=${emp_id}&limit=1&offset=0"
              payload: {}
              as: PayrollOfficer
          assert:
            - "response_type == array; data length == 1; total_count == 2; has_more == true"

      - name: computed_fields_ignored_when_supplied_on_create
        claim_type: Computed Fields
        grounds: [entities.Worker.fields.tenure_days, entities.Worker.fields.net_available_earnings_cents]
        distinguishing_aspect: "tenure_days / net_available_earnings_cents are server-computed; any client-supplied value is ignored (tenure derived from hire_date and clock)."
        test_recipe:
          setup: ["Clock 2026-06-01; worker hired 2025-06-01 => tenure 365."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id, tenure: $.data.tenure_days, avail: $.data.net_available_earnings_cents }
          assert:
            - "Worker.${w_id}.tenure_days == 365"
            - "Worker.${w_id}.net_available_earnings_cents == 0 (no time entries yet)"

      - name: duplicate_external_payroll_ref_rejected
        claim_type: Type Constraints
        grounds: [entities.Worker.fields.external_payroll_ref, "validations[priority=18]", "errors[ERR_DUPLICATE_PAYROLL_REF]"]
        distinguishing_aspect: "A second active worker with the same external_payroll_ref for one employer returns 409 ERR_DUPLICATE_PAYROLL_REF."
        test_recipe:
          setup: ["Employer with worker EMP-1 already registered (ACTIVE)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
          trigger:
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Walt", hourly_rate_cents: 2500, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_DUPLICATE_PAYROLL_REF"

      - name: time_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TimeEntry]
        distinguishing_aspect: "TimeEntry has common_fields false, so it carries id and created_at only — no version field; its only mutation is the void action."
        test_recipe:
          setup: ["One POSTED time entry."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T12:00:00Z", hours_worked: 4.0 }
              as: PayrollOfficer
              captures: { te_id: $.data.id, gross: $.data.gross_earned_cents }
          assert:
            - "TimeEntry.${te_id}.gross_earned_cents == 8000 (round(4*2000)); response has id and created_at, no version"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: advance_initial_state_is_requested
        claim_type: Initial State
        grounds: [state_machines.Advance, entities.Advance.fields.status]
        distinguishing_aspect: "A newly created Advance starts in REQUESTED."
        test_recipe:
          setup: ["Employer/policy/period/worker with earnings; fresh advance."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T18:00:00Z", hours_worked: 10.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
          trigger:
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 5000, disbursement_speed: "STANDARD", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id, st: $.data.status }
          assert:
            - "Advance.${adv_id}.status == REQUESTED"

      - name: disburse_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Advance.APPROVED_to_DISBURSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling disburse on a REQUESTED (not APPROVED) advance returns 409 ERR_INVALID_STATE; no funding debit occurs."
        test_recipe:
          setup: ["Advance REQUESTED (not yet approved)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T18:00:00Z", hours_worked: 10.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 5000, disbursement_speed: "STANDARD", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /advances/${adv_id}/disburse"
              payload: {}
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_INVALID_STATE"

      - name: declined_advance_terminal_lockdown
        claim_type: terminal_no_transition
        grounds: [state_machines.Advance, state_machines.Advance.REQUESTED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal; a second decline on a DECLINED advance returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Advance DECLINED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T18:00:00Z", hours_worked: 10.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 5000, disbursement_speed: "STANDARD", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
            - call: "POST /advances/${adv_id}/decline"
              payload: {}
              as: PayrollOfficer
          trigger:
            - call: "POST /advances/${adv_id}/decline"
              payload: {}
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_INVALID_STATE (DECLINED is terminal)"

      - name: reopen_blocked_when_batch_posted
        claim_type: precondition_violation
        grounds: [state_machines.PayPeriod.LOCKED_to_OPEN, "errors[ERR_PERIOD_HAS_POSTED_BATCH]"]
        distinguishing_aspect: "Reopen of a LOCKED period whose batch is POSTED returns 409 ERR_PERIOD_HAS_POSTED_BATCH."
        test_recipe:
          setup: ["Period LOCKED with one POSTED batch (no advances => empty waterfall)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
            - call: "POST /repayment-batches"
              payload: { pay_period_id: "${pp_id}" }
              as: PayrollOfficer
              captures: { batch_id: $.data.id }
            - call: "GET /repayment-batches/${batch_id}"
              payload: {}
              as: PayrollOfficer
              captures: { b_v: $.data.version }
            - call: "POST /repayment-batches/${batch_id}/post"
              payload: { expected_repaymentbatch_version: "${b_v}" }
              as: PayrollOfficer
              as_user_id: "officer-poster"
          trigger:
            - call: "POST /pay-periods/${pp_id}/reopen"
              payload: {}
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_PERIOD_HAS_POSTED_BATCH"

      - name: run_payday_without_posted_batch_returns_no_posted_batch
        claim_type: precondition_violation
        grounds: [state_machines.PayPeriod.LOCKED_to_DISBURSED, "errors[ERR_NO_POSTED_BATCH]"]
        distinguishing_aspect: "run-payday on a LOCKED period with no POSTED batch returns 409 ERR_NO_POSTED_BATCH."
        test_recipe:
          setup: ["Period LOCKED, no batch posted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
          trigger:
            - call: "POST /pay-periods/${pp_id}/run-payday"
              payload: {}
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_NO_POSTED_BATCH"

      - name: second_batch_post_returns_batch_already_posted
        claim_type: precondition_violation
        grounds: [state_machines.RepaymentBatch.DRAFT_to_POSTED, "validations[priority=19]", "errors[ERR_BATCH_ALREADY_POSTED]"]
        distinguishing_aspect: "Posting a second batch for a period that already has a POSTED batch returns 409 ERR_BATCH_ALREADY_POSTED."
        test_recipe:
          setup: ["Period LOCKED with one POSTED batch and a second DRAFT batch."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
            - call: "POST /repayment-batches"
              payload: { pay_period_id: "${pp_id}" }
              as: PayrollOfficer
              captures: { batch1_id: $.data.id }
            - call: "GET /repayment-batches/${batch1_id}"
              payload: {}
              as: PayrollOfficer
              captures: { b1_v: $.data.version }
            - call: "POST /repayment-batches/${batch1_id}/post"
              payload: { expected_repaymentbatch_version: "${b1_v}" }
              as: PayrollOfficer
              as_user_id: "officer-poster"
            - call: "POST /repayment-batches"
              payload: { pay_period_id: "${pp_id}" }
              as: PayrollOfficer
              captures: { batch2_id: $.data.id }
            - call: "GET /repayment-batches/${batch2_id}"
              payload: {}
              as: PayrollOfficer
              captures: { b2_v: $.data.version }
          trigger:
            - call: "POST /repayment-batches/${batch2_id}/post"
              payload: { expected_repaymentbatch_version: "${b2_v}" }
              as: PayrollOfficer
              as_user_id: "officer-poster"
              captures: { error_id: $.data.error_id }
          assert:
            - "Response 409 with error_id == ERR_BATCH_ALREADY_POSTED"

      - name: worker_terminate_blocked_with_open_advance
        claim_type: precondition_violation
        grounds: [state_machines.Worker.ACTIVE_to_TERMINATED, "errors[ERR_WORKER_HAS_OPEN_ADVANCE]"]
