  - rule_id: priority_pair_validation_conflict
    instances:

      - name: execute_state_vs_dnp_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_PAYMENT_NOT_EXECUTABLE
          - errors.ERR_DNP_FLAGGED_PAYMENT
          - endpoints.POST /payments/{paymentId}/execute
        distinguishing_aspect: "Error-category pair state vs business_safety: a HELD + FLAGGED payment violates both the execute state precondition (priority 7) and the do-not-pay safety gate (priority 8); the state error ERR_PAYMENT_NOT_EXECUTABLE must win. The sibling instance exercises the business_temporal vs business_fiscal pair."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Payee tin 111-22-3333; FULL VENDOR policy ACTIVE; a 25000-cent VENDOR payment created VERIFIED, then flagged and held by a do-not-pay record covering the current clock."
