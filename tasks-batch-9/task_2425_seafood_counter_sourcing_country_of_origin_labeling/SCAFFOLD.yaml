scenario: |
  Generate task harder than expert level!

  2425. Seafood Counter Sourcing & Country-of-Origin Labeling (supermarket seafood department): supplier lot receipt with harvest method, origin and farmed/wild designation, mandatory country-of-origin labeling at the case and in advertising, species substitution prevention and label verification sampling, fresh versus previously-frozen disclosure rules, seafood import monitoring program documentation for covered species, cold chain and ice-bed temperature verification, sustainability program certification claims at the counter, shrink from unsold fresh with cook-and-sell conversion

domain_name: "seafood-counter-cool-ops"
api_prefix: "/seafood-ops"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at `<api_prefix>/<collection>/{id}`; all
  # relationships are foreign keys carried in the child's body, never nested URLs.

  state_machine_shape: parallel
  # SupplierLot carries three independent dimensions (intake_status x label_status x
  # chargeback_status); AdvertisedItem carries a fork-join over two review dimensions
  # feeding one status; VerificationSample loops MISMATCH -> DISPUTED -> IN_LAB.

  relationship_patterns:
    - one_to_many          # Counter -> SupplierLot, SupplierLot -> VerificationSample
    - cross_aggregate      # CaseLabel/AdvertisedItem reference SustainabilityCertification across aggregates

  role_model: segregation_of_duties
  # The ComplianceOfficer who clears an AdvertisedItem's country-of-origin content
  # must not be the ComplianceOfficer who clears its sustainability claim.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Counter
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: store identifier the seafood department belongs to
        constraints: "4 characters, digits"
      - name: department_name
        type: string
        source: input
        description: display name of the service counter
      - name: case_slot_count
        type: integer
        source: input
        description: number of addressable ice-bed slots in the service case
        constraints: "1..12"
      - name: posture
        type: enum
        source: computed
        description: gating posture derived by counter_posture_derivation
        default: OPEN
        constraints: "OPEN | RESTRICTED | SUSPENDED"
      - name: open_excursion_count
        type: integer
        source: computed
        description: count of ColdChainExcursion rows for this counter with status == OPEN
        default: 0
      - name: violation_points
        type: integer
        source: computed
        description: weighted ComplianceViolation points per counter_posture_derivation
        default: 0
      - name: verification_cycle_index
        type: integer
        source: computed
        description: zero-based label-verification cycle counter, advanced by close-verification-cycle
        default: 0
      - name: last_cycle_required_samples
        type: integer
        source: computed
        description: required-sample count produced by verification_sampling_plan at the most recent cycle close
        default: 0
      - name: last_cycle_max_supplier_risk_index
        type: number
        source: computed
        description: maximum Supplier.substitution_risk_index_rolling over the candidate set at the most recent cycle close
        default: 0.00
        constraints: "2 decimal places"
      - name: shrink_gross_cents
        type: integer
        source: computed
        description: running sum of ShrinkEvent.provisional_value_cents over POSTED shrink events of this counter's lots
        default: 0
      - name: shrink_net_cents
        type: integer
        source: computed
        description: running sum of ShrinkEvent.final_value_cents over POSTED shrink events of this counter's lots
        default: 0
      - name: recovered_conversion_cents
        type: integer
        source: computed
        description: running sum of ShrinkEvent.recovery_credit_cents over POSTED shrink events of this counter's lots
        default: 0

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: supplier legal name
      - name: permit_number
        type: string
        source: input
        description: dealer permit number
      - name: status
        type: enum
        source: computed
        description: standing derived from substitution_risk_index_lifetime and chargeback settlement history
        default: GOOD_STANDING
        constraints: "GOOD_STANDING | PROBATION | SUSPENDED"
      - name: lifetime_sample_count
        type: integer
        source: computed
        description: count of VerificationSample rows on this supplier's lots whose status is MATCH or MISMATCH
        default: 0
      - name: lifetime_mismatch_count
        type: integer
        source: computed
        description: count of VerificationSample rows on this supplier's lots whose status == MISMATCH
        default: 0
      - name: substitution_risk_index_rolling
        type: number
        source: computed
        description: ROLLING_CYCLE variant of substitution_risk_index
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: substitution_risk_index_lifetime
        type: number
        source: computed
        description: LIFETIME variant of substitution_risk_index
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: chargeback_assessed_total_cents
        type: integer
        source: computed
        description: lifetime sum of SupplierLot.chargeback_assessed_cents ever assessed against this supplier
        default: 0
      - name: chargeback_outstanding_cents
        type: integer
        source: computed
        description: assessed amount neither settled nor reversed
        default: 0
      - name: chargeback_settled_cents
        type: integer
        source: computed
        description: assessed amount closed by supplier payment
        default: 0
      - name: chargeback_reversed_cents
        type: integer
        source: computed
        description: assessed amount voided by compliance reversal
        default: 0

  - name: Species
    parent: null
    common_fields: false
    fields:
      - name: market_name
        type: string
        source: input
        description: acceptable market name printed on the case label
      - name: scientific_name
        type: string
        source: input
        description: binomial name used for label verification comparison
      - name: acceptable_market_names
        type: array
        source: input
        description: full list of market names permitted for this species
      - name: simp_covered
        type: boolean
        source: input
        description: true when the species is covered by the seafood import monitoring program
      - name: high_risk_substitution
        type: boolean
        source: input
        description: true when the species is on the high-risk substitution watchlist
      - name: sustainability_program_eligible
        type: boolean
        source: input
        description: true when counter sustainability claims may be made for this species

  - name: SupplierLot
    parent: null
    common_fields: true
    fields:
      - name: counter_id
        type: string
        source: input
        description: "FK -> Counter.id; the service counter receiving the lot"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the dealer that shipped the lot"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; the species as declared by the supplier at receipt"
      - name: lot_code
        type: string
        source: input
        description: supplier lot code printed on the tote
      - name: harvest_method
        type: enum
        source: input
        description: method of harvest disclosed at receipt
        constraints: "WILD_NET | WILD_LONGLINE | WILD_TRAP | AQUACULTURE_POND | AQUACULTURE_PEN"
      - name: production_method
        type: enum
        source: input
        description: farmed/wild designation
        constraints: "WILD | FARMED"
      - name: origin_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of harvest or grow-out
        constraints: "2 uppercase letters"
      - name: processing_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of processing when different from origin
        default: null
        constraints: "2 uppercase letters or null"
      - name: previously_frozen
        type: boolean
        source: input
        description: true when the lot was frozen and thawed before display
      - name: fresh_claim
        type: boolean
        source: input
        description: true when the counter intends to advertise the lot as never-frozen fresh
      - name: received_weight_kg
        type: number
        source: input
        description: weight received at the dock
        constraints: "> 0, 3 decimal places"
      - name: remaining_weight_kg
        type: number
        source: computed
        description: received weight less recorded sales and POSTED shrink
        constraints: ">= 0, 3 decimal places"
      - name: unit_cost_cents_per_kg
        type: integer
        source: input
        description: landed cost per kilogram in cents
        constraints: "> 0"
      - name: retail_price_cents_per_kg
        type: integer
        source: input
        description: fresh case retail price per kilogram in cents
        constraints: "> 0"
      - name: cooked_retail_price_cents_per_kg
        type: integer
        source: input
        description: cook-and-sell retail price per kilogram in cents
        constraints: "> 0"
      - name: case_slot
        type: integer
        source: computed
        description: ice-bed slot the lot currently occupies, set by the case transition
        default: null
      - name: cased_at
        type: datetime
        source: computed
        description: logical-clock instant the lot entered its slot
        default: null
      - name: vacated_at
        type: datetime
        source: computed
        description: logical-clock instant the lot left its slot (DEPLETED or DISPOSED)
        default: null
      - name: received_at
        type: datetime
        source: computed
        description: logical-clock instant of receipt
      - name: intake_status
        type: enum
        source: computed
        description: physical-custody dimension of the lot
        default: RECEIVED
        constraints: "RECEIVED | CASED | HELD | DEPLETED | DISPOSED"
      - name: label_status
        type: enum
        source: computed
        description: label-verification dimension of the lot
        default: UNVERIFIED
        constraints: "UNVERIFIED | SAMPLED | VERIFIED | MISMATCHED | RELABELED"
      - name: chargeback_status
        type: enum
        source: computed
        description: supplier-recovery dimension of the lot
        default: NONE
        constraints: "NONE | ASSESSED | SETTLED | REVERSED"
      - name: chargeback_assessed_cents
        type: integer
        source: computed
        description: output of supplier_chargeback_assessment for this lot
        default: 0

  - name: CaseLabel
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SupplierLot.id; the lot the label sits above in the case"
      - name: certification_id
        type: string
        source: input
        description: "FK -> SustainabilityCertification.id; optional sustainability claim carried on the label"
        default: null
      - name: display_market_name
        type: string
        source: computed
        description: market name copied from the lot's Species per cool_label_content_derivation
      - name: origin_statement
        type: string
        source: computed
        description: country-of-origin sentence per cool_label_content_derivation
      - name: production_method_statement
        type: string
        source: computed
        description: WILD CAUGHT / FARM RAISED sentence per cool_label_content_derivation
      - name: frozen_disclosure_statement
        type: string
        source: computed
        description: previously-frozen versus fresh disclosure per cool_label_content_derivation
      - name: sustainability_claim_text
        type: string
        source: computed
        description: claim text copied from the referenced certification, null when no certification is carried
        default: null
      - name: status
        type: enum
        source: computed
        description: label lifecycle
        default: PUBLISHED
        constraints: "PUBLISHED | WITHDRAWN"
      - name: withdraw_reason
        type: enum
        source: computed
        description: why the label left the case
        default: null
        constraints: "SPECIES_MISMATCH | COLD_CHAIN_HOLD | CLAIM_REVOKED | SUPERSEDED | MANUAL | null"
      - name: published_at
        type: datetime
        source: computed
        description: logical-clock instant the label was posted at the case
      - name: withdrawn_at
        type: datetime
        source: computed
        description: logical-clock instant the label was withdrawn
        default: null

  - name: AdvertisedItem
    parent: null
    common_fields: true
    fields:
      - name: counter_id
        type: string
        source: input
        description: "FK -> Counter.id; counter whose posture gates publication"
      - name: lot_id
        type: string
        source: input
        description: "FK -> SupplierLot.id; the lot the advertisement points at"
      - name: certification_id
        type: string
        source: input
        description: "FK -> SustainabilityCertification.id; optional sustainability claim carried in the ad"
        default: null
      - name: headline
        type: string
        source: input
        description: advertisement headline copy
      - name: ad_start_at
        type: datetime
        source: input
        description: inclusive start of the advertising window
      - name: ad_end_at
        type: datetime
        source: input
        description: exclusive end of the advertising window
      - name: cool_statement
        type: string
        source: computed
        description: mandatory country-of-origin disclosure line for the ad, set when cool review clears
        default: null
      - name: status
        type: enum
        source: computed
        description: publication dimension, joined from the two review dimensions
        default: DRAFT
        constraints: "DRAFT | APPROVED | PUBLISHED | CLOSED | RETRACTED | REJECTED"
      - name: cool_review_status
        type: enum
        source: computed
        description: country-of-origin review dimension
        default: COOL_PENDING
        constraints: "COOL_PENDING | COOL_CLEARED | COOL_REJECTED"
      - name: claim_review_status
        type: enum
        source: computed
        description: sustainability-claim review dimension
        default: CLAIM_PENDING
        constraints: "CLAIM_PENDING | CLAIM_CLEARED | CLAIM_REJECTED"
      - name: cool_reviewer_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who decided the cool review
        default: null
      - name: claim_reviewer_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who decided the claim review
        default: null
      - name: retract_reason
        type: enum
        source: computed
        description: why the ad was pulled
        default: null
        constraints: "LABEL_WITHDRAWN | CLAIM_REVOKED | MANUAL | null"

  - name: IceBedReading
    parent: null
    common_fields: false
    fields:
      - name: counter_id
        type: string
        source: input
        description: "FK -> Counter.id; counter whose case was probed"
      - name: case_slot
        type: integer
        source: input
        description: ice-bed slot probed
        constraints: "1..Counter.case_slot_count"
      - name: reading_at
        type: datetime
        source: input
        description: instant of the probe, must not exceed the logical clock
      - name: temperature_c
        type: number
        source: input
        description: probe temperature in degrees Celsius
        constraints: "1 decimal place"
      - name: taken_by_user_id
        type: string
        source: input
        description: identifier of the associate who took the reading
      - name: breach
        type: boolean
        source: computed
        description: true when temperature_c exceeds ICE_BED_LIMIT_C strictly

  - name: ColdChainExcursion
    parent: null
    common_fields: true
    fields:
      - name: counter_id
        type: string
        source: system
        description: "FK -> Counter.id; counter whose slot breached, copied from the triggering IceBedReading"
      - name: case_slot
        type: integer
        source: computed
        description: ice-bed slot the excursion belongs to
      - name: started_at
        type: datetime
        source: computed
        description: earliest breaching reading_at in the excursion's breach set
      - name: ended_at
        type: datetime
        source: computed
        description: latest breaching reading_at in the excursion's breach set
      - name: exposure_minutes
        type: integer
        source: computed
        description: whole minutes between started_at and ended_at
        default: 0
      - name: peak_temperature_c
        type: number
        source: computed
        description: maximum temperature_c in the breach set
      - name: severity
        type: enum
        source: computed
        description: severity band derived from exposure_minutes
        default: MINOR
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: status
        type: enum
        source: computed
        description: excursion lifecycle
        default: OPEN
        constraints: "OPEN | RESOLVED_RELEASED | RESOLVED_DISPOSED"
      - name: resolution
        type: enum
        source: computed
        description: disposition chosen by compliance
        default: null
        constraints: "RELEASE | DISPOSE | null"
      - name: resolution_note
        type: string
        source: computed
        description: free-text disposition note
        default: null

  - name: VerificationSample
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SupplierLot.id; the sampled lot"
      - name: observed_species_id
        type: string
        source: computed
        description: "FK -> Species.id; species identified by the laboratory, null before a result is recorded"
        default: null
      - name: sampled_weight_g
        type: number
        source: input
        description: mass of the drawn sample in grams
        constraints: "> 0"
      - name: cycle_index
        type: integer
        source: computed
        description: Counter.verification_cycle_index observed when the sample was drawn
      - name: status
        type: enum
        source: computed
        description: sample lifecycle, loops on dispute
        default: DRAFT
        constraints: "DRAFT | IN_LAB | MATCH | MISMATCH | DISPUTED | VOIDED"
      - name: lab_reference
        type: string
        source: computed
        description: laboratory accession reference
        default: null
      - name: dispute_reason
        type: string
        source: computed
        description: supplier's stated grounds for retest
        default: null
      - name: retest_count
        type: integer
        source: computed
        description: number of times this sample has re-entered IN_LAB from DISPUTED
        default: 0
      - name: result_recorded_at
        type: datetime
        source: computed
        description: logical-clock instant the most recent result was recorded
        default: null

  - name: SimpDocument
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SupplierLot.id; the lot this import-monitoring record documents"
      - name: harvesting_vessel_name
        type: string
        source: input
        description: name of the harvesting vessel or farm unit
      - name: harvest_date
        type: datetime
        source: input
        description: date of harvest
      - name: landing_date
        type: datetime
        source: input
        description: date of landing or first transfer
      - name: chain_of_custody_ref
        type: string
        source: input
        description: chain-of-custody document reference
      - name: status
        type: enum
        source: computed
        description: import-monitoring document lifecycle
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | DEFICIENT"
      - name: review_note
        type: string
        source: computed
        description: reviewer note recorded on the last review decision
        default: null
      - name: reviewed_at
        type: datetime
        source: computed
        description: logical-clock instant of the last review decision
        default: null
      - name: amendment_count
        type: integer
        source: computed
        description: number of times the document has been resubmitted after a DEFICIENT decision
        default: 0

  - name: SustainabilityCertification
    parent: null
    common_fields: true
    fields:
      - name: counter_id
        type: string
        source: input
        description: "FK -> Counter.id; counter permitted to display the claim"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; certified dealer"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; certified species"
      - name: program_name
        type: string
        source: input
        description: certifying program name
      - name: certificate_number
        type: string
        source: input
        description: certificate number issued by the program
      - name: valid_from
        type: datetime
        source: input
        description: inclusive start of certificate validity
      - name: valid_until
        type: datetime
        source: input
        description: exclusive end of certificate validity
      - name: claim_text
        type: string
        source: input
        description: exact claim wording permitted at the counter
      - name: status
        type: enum
        source: computed
        description: certification lifecycle
        default: PENDING_REVIEW
        constraints: "PENDING_REVIEW | ACTIVE | REVOKED | EXPIRED"
      - name: review_note
        type: string
        source: computed
        description: reviewer note recorded on the review decision
        default: null

  - name: ShrinkEvent
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SupplierLot.id; the lot the shrink is written against"
      - name: reason
        type: enum
        source: input
        description: shrink cause
        constraints: "UNSOLD_FRESH | MISLABEL_DESTRUCTION | COLD_CHAIN_DISPOSAL"
      - name: shrink_weight_kg
        type: number
        source: input
        description: weight written off
        constraints: "> 0, 3 decimal places"
      - name: conversion_requested_kg
        type: number
        source: input
        description: weight the counter asks to divert into cook-and-sell
        default: 0.000
        constraints: ">= 0, 3 decimal places"
      - name: approved_conversion_kg
        type: number
        source: computed
        description: conversion weight granted by cook_conversion_recovery
        default: 0.000
      - name: allowance_kg
        type: number
        source: computed
        description: maximum divertible weight per cook_conversion_recovery
        default: 0.000
      - name: cook_yield_kg
        type: number
        source: computed
        description: cooked weight yielded from approved_conversion_kg
        default: 0.000
      - name: provisional_value_cents
        type: integer
        source: computed
        description: PROVISIONAL_AT_COST variant of shrink_valuation
        default: 0
      - name: final_value_cents
        type: integer
        source: computed
        description: FINAL_NET_OF_RECOVERY variant of shrink_valuation
        default: 0
      - name: recovery_credit_cents
        type: integer
        source: computed
        description: cook-and-sell credit; always equals provisional_value_cents minus final_value_cents
        default: 0
      - name: status
        type: enum
        source: computed
        description: shrink lifecycle
        default: VALUED
        constraints: "VALUED | CONVERSION_APPROVED | CONVERTED | POSTED | REVERSED"
      - name: posted_at
        type: datetime
        source: computed
        description: logical-clock instant the shrink hit the counter ledger
        default: null
      - name: reversed_at
        type: datetime
        source: computed
        description: logical-clock instant the shrink was compensated out of the counter ledger
        default: null
      - name: reversal_note
        type: string
        source: computed
        description: compliance note recorded on reversal
        default: null

  - name: ComplianceViolation
    parent: null
    common_fields: true
    fields:
      - name: counter_id
        type: string
        source: system
        description: "FK -> Counter.id; counter charged with the violation"
      - name: lot_id
        type: string
        source: system
        description: "FK -> SupplierLot.id; lot the violation was raised against, null for counter-wide findings"
        default: null
      - name: category
        type: enum
        source: computed
        description: violation category selecting its point weight
        constraints: "SPECIES_SUBSTITUTION | COOL_MISSING | FROZEN_DISCLOSURE | SIMP_DEFICIENT | COLD_CHAIN | UNSUBSTANTIATED_CLAIM"
      - name: points
        type: integer
        source: computed
        description: CATEGORY_POINTS weight assigned at creation
      - name: status
        type: enum
        source: computed
        description: violation lifecycle
        default: OPEN
        constraints: "OPEN | CURED | EXPUNGED"
      - name: detail
        type: string
        source: computed
        description: system-generated description of the finding
      - name: cure_note
        type: string
        source: computed
        description: remediation note recorded on cure
        default: null
      - name: expunge_note
        type: string
        source: computed
        description: compliance note recorded on expungement
        default: null
      - name: cured_at
        type: datetime
        source: computed
        description: logical-clock instant the violation was cured
        default: null
      - name: expunged_at
        type: datetime
        source: computed
        description: logical-clock instant the violation was expunged
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# SupplierLot carries THREE independent dimensions. Each is a separate machine
# below; state names are globally distinct so a transition reference is
# unambiguous.
state_machines:
  # --- SupplierLot dimension 1 of 3: physical custody -----------------------
  - entity: SupplierLot
    dimension: intake_status
    initial_state: RECEIVED
    terminal_states: [DEPLETED, DISPOSED]
    transitions:
      - from: RECEIVED
        to: CASED
        trigger: "POST /seafood-ops/lots/{lot_id}/case"
        actor: SeafoodManager
        preconditions:
          - "Counter.posture != SUSPENDED"
          - "case_slot between 1 and Counter.case_slot_count inclusive"
          - "no other SupplierLot on this counter with case_slot == the requested slot and intake_status IN {CASED, HELD}"
          - "for the most recent SupplierLot that vacated the requested slot, logical_clock >= vacated_at + 30 minutes"
          - "when Species.simp_covered == true, a SimpDocument exists for this lot with status == ACCEPTED"
        side_effects:
          - "set SupplierLot.case_slot to the requested slot"
          - "set SupplierLot.cased_at to the logical clock"
          - "recompute verification_sampling_plan candidate membership for Counter"
        note: "Casing is the only way a lot becomes eligible for a CaseLabel."
      - from: CASED
        to: HELD
        trigger: "system event: a ColdChainExcursion for this counter and case_slot opens (cascade B link 2)"
        actor: system
        preconditions:
          - "SupplierLot.case_slot == ColdChainExcursion.case_slot"
          - "SupplierLot.intake_status == CASED"
        side_effects:
          - "hold the lot out of sale; remaining_weight_kg unchanged"
          - "because the lot is now HELD, every CaseLabel for this lot with status == PUBLISHED transitions to WITHDRAWN with withdraw_reason == COLD_CHAIN_HOLD (cascade B link 3)"
      - from: HELD
        to: CASED
        trigger: "POST /seafood-ops/excursions/{excursion_id}/resolve with resolution == RELEASE"
        actor: ComplianceOfficer
        preconditions:
          - "ColdChainExcursion.status == OPEN"
          - "ColdChainExcursion.severity IN {MINOR, MAJOR}"
        side_effects:
          - "lot returns to sale; CaseLabels are NOT auto-republished (a new CaseLabel must be created)"
          - "Counter.open_excursion_count decreases by 1 and counter_posture_derivation reruns"
      - from: HELD
        to: DISPOSED
        trigger: "POST /seafood-ops/excursions/{excursion_id}/resolve with resolution == DISPOSE"
        actor: ComplianceOfficer
        preconditions:
          - "ColdChainExcursion.status == OPEN"
        side_effects:
          - "set SupplierLot.vacated_at to the logical clock and SupplierLot.case_slot to null"
          - "create a ShrinkEvent with reason == COLD_CHAIN_DISPOSAL, shrink_weight_kg == SupplierLot.remaining_weight_kg, conversion_requested_kg == 0.000, status == VALUED"
          - "create a ComplianceViolation with category == COLD_CHAIN and points == 3"
          - "Counter.open_excursion_count decreases by 1 and counter_posture_derivation reruns"
      - from: CASED
        to: DEPLETED
        trigger: "POST /seafood-ops/lots/{lot_id}/record-sales that brings remaining_weight_kg to exactly 0.000"
        actor: SeafoodManager
        preconditions:
          - "sold_weight_kg <= remaining_weight_kg"
        side_effects:
          - "set SupplierLot.vacated_at to the logical clock and SupplierLot.case_slot to null"
          - "every CaseLabel for this lot with status == PUBLISHED transitions to WITHDRAWN with withdraw_reason == MANUAL"
      - from: CASED
        to: DISPOSED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/post where the event's reason == MISLABEL_DESTRUCTION and shrink_weight_kg == SupplierLot.remaining_weight_kg"
        actor: SeafoodManager
        preconditions:
          - "ShrinkEvent.status IN {VALUED, CONVERTED}"
        side_effects:
          - "set SupplierLot.remaining_weight_kg to 0.000"
          - "set SupplierLot.vacated_at to the logical clock and SupplierLot.case_slot to null"

  # --- SupplierLot dimension 2 of 3: label verification (cyclic) ------------
  - entity: SupplierLot
    dimension: label_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: SAMPLED
        trigger: "POST /seafood-ops/verification-samples for this lot"
        actor: ComplianceOfficer
        preconditions:
          - "SupplierLot.intake_status IN {CASED, HELD}"
        side_effects:
          - "set VerificationSample.cycle_index to Counter.verification_cycle_index"
      - from: RELABELED
        to: SAMPLED
        trigger: "POST /seafood-ops/verification-samples for this lot after a relabel (loop back)"
        actor: ComplianceOfficer
        preconditions:
          - "SupplierLot.intake_status IN {CASED, HELD}"
        side_effects:
          - "set VerificationSample.cycle_index to Counter.verification_cycle_index"
        note: "This edge closes the verification cycle: SAMPLED -> MISMATCHED -> RELABELED -> SAMPLED."
      - from: SAMPLED
        to: VERIFIED
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/result where observed_species_id == SupplierLot.species_id"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == IN_LAB"
        side_effects:
          - "Supplier.lifetime_sample_count increases by 1; substitution_risk_index reruns for both variants"
          - "the lot leaves the verification_sampling_plan candidate set"
      - from: SAMPLED
        to: MISMATCHED
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/result where observed_species_id != SupplierLot.species_id (cascade A link 1)"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == IN_LAB"
        side_effects:
          - "Supplier.lifetime_sample_count and Supplier.lifetime_mismatch_count each increase by 1; substitution_risk_index reruns for both variants"
          - "create a ComplianceViolation with category == SPECIES_SUBSTITUTION and points == 6"
          - "because label_status is now MISMATCHED, every CaseLabel for this lot with status == PUBLISHED transitions to WITHDRAWN with withdraw_reason == SPECIES_MISMATCH (cascade A link 2)"
        note: "Idempotent guard: this edge fires only from SAMPLED. A repeat MISMATCH result on a lot whose label_status is already MISMATCHED (the retest loop) advances the VerificationSample alone -- no second ComplianceViolation, CaseLabel withdrawal, ShrinkEvent or chargeback is produced, and Supplier.lifetime_sample_count / lifetime_mismatch_count are counted once per sample, not once per result."
      - from: MISMATCHED
        to: RELABELED
        trigger: "POST /seafood-ops/lots/{lot_id}/relabel"
        actor: SeafoodManager
        preconditions:
          - "SupplierLot.label_status == MISMATCHED"
          - "corrected_species_id equals observed_species_id of the most recent VerificationSample for this lot with status == MISMATCH, ordered by result_recorded_at DESC then created_at DESC"
          - "corrected_market_name is a member of Species.acceptable_market_names for corrected_species_id"
        side_effects:
          - "set SupplierLot.species_id to corrected_species_id"
          - "every VerificationSample for this lot with status == DISPUTED transitions to VOIDED"
          - "any ComplianceViolation for this lot with category == SPECIES_SUBSTITUTION and status == OPEN remains OPEN (curing is a separate compliance act)"

  # --- SupplierLot dimension 3 of 3: supplier recovery ----------------------
  - entity: SupplierLot
    dimension: chargeback_status
    initial_state: NONE
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: NONE
        to: ASSESSED
        trigger: "system event: a ShrinkEvent with reason == MISLABEL_DESTRUCTION is created for this lot (cascade A link 4)"
        actor: system
        preconditions:
          - "SupplierLot.chargeback_status == NONE"
        side_effects:
          - "run supplier_chargeback_assessment and store the result in SupplierLot.chargeback_assessed_cents"
          - "because a chargeback was assessed, Supplier.chargeback_assessed_total_cents and Supplier.chargeback_outstanding_cents each increase by that amount and Supplier.status is recomputed (cascade A link 5)"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /seafood-ops/lots/{lot_id}/settle-chargeback"
        actor: SupplierRep
        preconditions:
          - "SupplierLot.chargeback_status == ASSESSED"
          - "payment_amount_cents == Supplier.chargeback_outstanding_cents"
        side_effects:
          - "Supplier.chargeback_outstanding_cents decreases by SupplierLot.chargeback_assessed_cents"
          - "Supplier.chargeback_settled_cents increases by SupplierLot.chargeback_assessed_cents"
      - from: ASSESSED
        to: REVERSED
        trigger: "POST /seafood-ops/lots/{lot_id}/reverse-chargeback"
        actor: ComplianceOfficer
        preconditions:
          - "SupplierLot.chargeback_status == ASSESSED"
        side_effects:
          - "Supplier.chargeback_outstanding_cents decreases by SupplierLot.chargeback_assessed_cents"
          - "Supplier.chargeback_reversed_cents increases by SupplierLot.chargeback_assessed_cents"
          - "Supplier.status is recomputed"
        note: "Compensating action for the NONE -> ASSESSED forward action; Supplier.chargeback_assessed_total_cents is never reduced, so the ledger identity assessed_total == outstanding + settled + reversed still holds."

  # --- CaseLabel ------------------------------------------------------------
  - entity: CaseLabel
    initial_state: PUBLISHED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /seafood-ops/case-labels/{label_id}/withdraw"
        actor: SeafoodManager
        preconditions:
          - "CaseLabel.status == PUBLISHED"
        side_effects:
          - "set withdraw_reason to the submitted reason and withdrawn_at to the logical clock"
          - "no ShrinkEvent is created because withdraw_reason != SPECIES_MISMATCH"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system event: POST /seafood-ops/case-labels creates a newer label for the same lot"
        actor: system
        preconditions:
          - "CaseLabel.status == PUBLISHED"
        side_effects:
          - "set withdraw_reason to SUPERSEDED"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system event: SupplierLot.label_status becomes MISMATCHED (cascade A link 2)"
        actor: system
        preconditions:
          - "CaseLabel.status == PUBLISHED"
        side_effects:
          - "set withdraw_reason to SPECIES_MISMATCH"
          - "because a PUBLISHED label was withdrawn with withdraw_reason == SPECIES_MISMATCH, create a ShrinkEvent for the lot with reason == MISLABEL_DESTRUCTION, shrink_weight_kg == SupplierLot.remaining_weight_kg, conversion_requested_kg == 0.000, status == VALUED (cascade A link 3)"
        note: "Conditional cascade: the ShrinkEvent hop fires only for withdraw_reason == SPECIES_MISMATCH."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system event: SupplierLot.intake_status becomes HELD (cascade B link 3)"
        actor: system
        preconditions:
          - "CaseLabel.status == PUBLISHED"
        side_effects:
          - "set withdraw_reason to COLD_CHAIN_HOLD"
          - "no ShrinkEvent is created (withdraw_reason != SPECIES_MISMATCH)"
          - "because a PUBLISHED label was withdrawn, every AdvertisedItem for this lot with status == PUBLISHED transitions to RETRACTED with retract_reason == LABEL_WITHDRAWN (cascade B link 4)"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system event: the referenced SustainabilityCertification leaves status ACTIVE"
        actor: system
        preconditions:
          - "CaseLabel.status == PUBLISHED"
          - "CaseLabel.certification_id is not null"
        side_effects:
          - "set withdraw_reason to CLAIM_REVOKED"
          - "create a ComplianceViolation with category == UNSUBSTANTIATED_CLAIM and points == 6"

  # --- AdvertisedItem dimension 1 of 3: publication (fork-join target) ------
  - entity: AdvertisedItem
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED, RETRACTED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "system event: cool_review_status == COOL_CLEARED AND claim_review_status == CLAIM_CLEARED (join point)"
        actor: system
        preconditions:
          - "both review dimensions have cleared"
        side_effects:
          - "advertisement becomes eligible for publication"
        note: "Join: neither branch alone advances status out of DRAFT."
      - from: DRAFT
        to: REJECTED
        trigger: "system event: cool_review_status == COOL_REJECTED OR claim_review_status == CLAIM_REJECTED"
        actor: system
        preconditions:
          - "AdvertisedItem.status == DRAFT"
        side_effects:
          - "advertisement is permanently unpublishable"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /seafood-ops/ad-items/{item_id}/publish"
        actor: MerchandisingLead
        preconditions:
          - "AdvertisedItem.status == APPROVED"
          - "Counter.posture == OPEN"
          - "a CaseLabel for AdvertisedItem.lot_id exists with status == PUBLISHED"
        side_effects:
          - "the ad window becomes live"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /seafood-ops/ad-items/{item_id}/close"
        actor: MerchandisingLead
        preconditions:
          - "AdvertisedItem.status == PUBLISHED"
          - "logical_clock >= AdvertisedItem.ad_end_at"
        side_effects:
          - "the ad window is retired normally"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /seafood-ops/ad-items/{item_id}/retract"
        actor: MerchandisingLead
        preconditions:
          - "AdvertisedItem.status == PUBLISHED"
        side_effects:
          - "set retract_reason to MANUAL"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "system event: a PUBLISHED CaseLabel for this ad's lot is withdrawn (cascade B link 4)"
        actor: system
        preconditions:
          - "AdvertisedItem.status == PUBLISHED"
        side_effects:
          - "set retract_reason to LABEL_WITHDRAWN"
          - "create a ComplianceViolation with category == COOL_MISSING and points == 4"

  # --- AdvertisedItem dimension 2 of 3: country-of-origin review branch -----
  - entity: AdvertisedItem
    dimension: cool_review_status
    initial_state: COOL_PENDING
    terminal_states: [COOL_CLEARED, COOL_REJECTED]
    transitions:
      - from: COOL_PENDING
        to: COOL_CLEARED
        trigger: "POST /seafood-ops/ad-items/{item_id}/clear-cool with decision == CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "AdvertisedItem.status == DRAFT"
          - "SupplierLot(AdvertisedItem.lot_id).intake_status IN {CASED, HELD}"
        side_effects:
          - "set cool_statement per cool_label_content_derivation"
          - "set cool_reviewer_user_id to the acting X-User-ID"
      - from: COOL_PENDING
        to: COOL_REJECTED
        trigger: "POST /seafood-ops/ad-items/{item_id}/clear-cool with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "AdvertisedItem.status == DRAFT"
          - "rejection_category is supplied and is one of {COOL_MISSING, FROZEN_DISCLOSURE}"
        side_effects:
          - "set cool_reviewer_user_id to the acting X-User-ID"
          - "create a ComplianceViolation whose category == the submitted rejection_category (points == 4 for both COOL_MISSING and FROZEN_DISCLOSURE)"
        note: "Branch-specific side effect: the cool branch raises COOL_MISSING or FROZEN_DISCLOSURE, the claim branch raises UNSUBSTANTIATED_CLAIM."

  # --- AdvertisedItem dimension 3 of 3: sustainability claim review branch --
  - entity: AdvertisedItem
    dimension: claim_review_status
    initial_state: CLAIM_PENDING
    terminal_states: [CLAIM_CLEARED, CLAIM_REJECTED]
    transitions:
      - from: CLAIM_PENDING
        to: CLAIM_CLEARED
        trigger: "POST /seafood-ops/ad-items/{item_id}/clear-claim with decision == CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "AdvertisedItem.status == DRAFT"
          - "the acting X-User-ID != AdvertisedItem.cool_reviewer_user_id"
          - "AdvertisedItem.certification_id is null, OR that SustainabilityCertification has status == ACTIVE and valid_from <= logical_clock < valid_until"
        side_effects:
          - "set claim_reviewer_user_id to the acting X-User-ID"
      - from: CLAIM_PENDING
        to: CLAIM_REJECTED
        trigger: "POST /seafood-ops/ad-items/{item_id}/clear-claim with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "AdvertisedItem.status == DRAFT"
          - "the acting X-User-ID != AdvertisedItem.cool_reviewer_user_id"
        side_effects:
          - "set claim_reviewer_user_id to the acting X-User-ID"
          - "create a ComplianceViolation with category == UNSUBSTANTIATED_CLAIM and points == 6"

  # --- ColdChainExcursion ---------------------------------------------------
  - entity: ColdChainExcursion
    initial_state: OPEN
    terminal_states: [RESOLVED_RELEASED, RESOLVED_DISPOSED]
    transitions:
      - from: OPEN
        to: RESOLVED_RELEASED
        trigger: "POST /seafood-ops/excursions/{excursion_id}/resolve with resolution == RELEASE"
        actor: ComplianceOfficer
        preconditions:
          - "ColdChainExcursion.status == OPEN"
          - "ColdChainExcursion.severity IN {MINOR, MAJOR}"
        side_effects:
          - "every SupplierLot on this counter with case_slot == ColdChainExcursion.case_slot and intake_status == HELD returns to CASED"
          - "Counter.open_excursion_count decreases by 1; counter_posture_derivation reruns"
      - from: OPEN
        to: RESOLVED_DISPOSED
        trigger: "POST /seafood-ops/excursions/{excursion_id}/resolve with resolution == DISPOSE"
        actor: ComplianceOfficer
        preconditions:
          - "ColdChainExcursion.status == OPEN"
        side_effects:
          - "every SupplierLot on this counter with case_slot == ColdChainExcursion.case_slot and intake_status == HELD becomes DISPOSED"
          - "Counter.open_excursion_count decreases by 1; counter_posture_derivation reruns"

  # --- VerificationSample (cyclic) -----------------------------------------
  - entity: VerificationSample
    initial_state: DRAFT
    terminal_states: [MATCH, VOIDED]
    transitions:
      - from: DRAFT
        to: IN_LAB
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/send-to-lab"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == DRAFT"
        side_effects:
          - "set lab_reference to the submitted value"
      - from: IN_LAB
        to: MATCH
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/result where observed_species_id == SupplierLot.species_id"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == IN_LAB"
        side_effects:
          - "set result_recorded_at to the logical clock"
          - "SupplierLot.label_status becomes VERIFIED"
      - from: IN_LAB
        to: MISMATCH
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/result where observed_species_id != SupplierLot.species_id"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == IN_LAB"
        side_effects:
          - "set result_recorded_at to the logical clock"
          - "SupplierLot.label_status becomes MISMATCHED, which starts cascade A"
      - from: MISMATCH
        to: DISPUTED
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/dispute"
        actor: SupplierRep
        preconditions:
          - "VerificationSample.status == MISMATCH"
          - "VerificationSample.retest_count < 2"
        side_effects:
          - "set dispute_reason to the submitted value"
      - from: DISPUTED
        to: IN_LAB
        trigger: "POST /seafood-ops/verification-samples/{sample_id}/send-to-lab (retest, closes the loop)"
        actor: ComplianceOfficer
        preconditions:
          - "VerificationSample.status == DISPUTED"
          - "VerificationSample.retest_count < 2"
        side_effects:
          - "retest_count increases by 1"
          - "set lab_reference to the submitted value"
        note: "Cycle: IN_LAB -> MISMATCH -> DISPUTED -> IN_LAB, bounded at retest_count == 2."
      - from: DISPUTED
        to: VOIDED
        trigger: "system event: POST /seafood-ops/lots/{lot_id}/relabel on the sampled lot"
        actor: system
        preconditions:
          - "VerificationSample.status == DISPUTED"
        side_effects:
          - "the dispute is moot once the lot has been relabelled"

  # --- SimpDocument (revision loop) ----------------------------------------
  - entity: SimpDocument
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /seafood-ops/simp-documents/{document_id}/submit"
        actor: SupplierRep
        preconditions:
          - "SimpDocument.status == DRAFT"
          - "harvest_date <= landing_date"
        side_effects:
          - "when chain_of_custody_ref is supplied it replaces the stored value"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /seafood-ops/simp-documents/{document_id}/submit (amendment)"
        actor: SupplierRep
        preconditions:
          - "SimpDocument.status == DEFICIENT"
        side_effects:
          - "amendment_count increases by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /seafood-ops/simp-documents/{document_id}/review with decision == ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "SimpDocument.status == SUBMITTED"
        side_effects:
          - "set reviewed_at to the logical clock"
          - "the lot becomes eligible for casing when its Species.simp_covered == true"
          - "any ComplianceViolation for this lot with category == SIMP_DEFICIENT and status == OPEN transitions to CURED"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /seafood-ops/simp-documents/{document_id}/review with decision == DEFICIENT"
        actor: ComplianceOfficer
        preconditions:
          - "SimpDocument.status == SUBMITTED"
        side_effects:
          - "set reviewed_at to the logical clock"
          - "create a ComplianceViolation with category == SIMP_DEFICIENT and points == 5"

  # --- SustainabilityCertification -----------------------------------------
  - entity: SustainabilityCertification
    initial_state: PENDING_REVIEW
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /seafood-ops/certifications/{certification_id}/review with decision == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "SustainabilityCertification.status == PENDING_REVIEW"
          - "Species.sustainability_program_eligible == true for the referenced species"
          - "valid_from <= logical_clock < valid_until"
        side_effects:
          - "the claim text becomes usable on CaseLabels and AdvertisedItems"
      - from: PENDING_REVIEW
        to: REVOKED
        trigger: "POST /seafood-ops/certifications/{certification_id}/review with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "SustainabilityCertification.status == PENDING_REVIEW"
        side_effects:
          - "set review_note to the submitted note"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /seafood-ops/certifications/{certification_id}/enforce where the program withdraws the certificate (decision REVOKE)"
        actor: ComplianceOfficer
        preconditions:
          - "SustainabilityCertification.status == ACTIVE"
        side_effects:
          - "every CaseLabel with certification_id == this certification and status == PUBLISHED transitions to WITHDRAWN with withdraw_reason == CLAIM_REVOKED"
          - "every AdvertisedItem with certification_id == this certification and status == PUBLISHED transitions to RETRACTED with retract_reason == CLAIM_REVOKED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /seafood-ops/certifications/{certification_id}/enforce where logical_clock >= valid_until (decision SWEEP)"
        actor: ComplianceOfficer
        preconditions:
          - "SustainabilityCertification.status == ACTIVE"
          - "logical_clock >= SustainabilityCertification.valid_until"
        side_effects:
          - "every CaseLabel with certification_id == this certification and status == PUBLISHED transitions to WITHDRAWN with withdraw_reason == CLAIM_REVOKED"
          - "every AdvertisedItem with certification_id == this certification and status == PUBLISHED transitions to RETRACTED with retract_reason == CLAIM_REVOKED"

  # --- ShrinkEvent ----------------------------------------------------------
  - entity: ShrinkEvent
    initial_state: VALUED
    terminal_states: [REVERSED]
    transitions:
      - from: VALUED
        to: CONVERSION_APPROVED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/approve-conversion"
        actor: SeafoodManager
        preconditions:
          - "ShrinkEvent.status == VALUED"
          - "ShrinkEvent.conversion_requested_kg > 0.000"
          - "ShrinkEvent.reason == UNSOLD_FRESH"
          - "SupplierLot.previously_frozen == false"
        side_effects:
          - "run cook_conversion_recovery and store allowance_kg and approved_conversion_kg"
      - from: CONVERSION_APPROVED
        to: CONVERTED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/convert"
        actor: SeafoodManager
        preconditions:
          - "ShrinkEvent.status == CONVERSION_APPROVED"
        side_effects:
          - "run cook_conversion_recovery to completion: store cook_yield_kg and recovery_credit_cents"
          - "run the FINAL_NET_OF_RECOVERY variant of shrink_valuation and store final_value_cents"
      - from: CONVERTED
        to: POSTED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/post"
        actor: SeafoodManager
        preconditions:
          - "ShrinkEvent.status == CONVERTED"
        side_effects:
          - "SupplierLot.remaining_weight_kg decreases by ShrinkEvent.shrink_weight_kg"
          - "Counter.shrink_gross_cents increases by provisional_value_cents; Counter.shrink_net_cents increases by final_value_cents; Counter.recovered_conversion_cents increases by recovery_credit_cents"
          - "set posted_at to the logical clock"
      - from: VALUED
        to: POSTED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/post with no conversion"
        actor: SeafoodManager
        preconditions:
          - "ShrinkEvent.status == VALUED"
        side_effects:
          - "final_value_cents == provisional_value_cents and recovery_credit_cents == 0"
          - "SupplierLot.remaining_weight_kg decreases by ShrinkEvent.shrink_weight_kg"
          - "Counter.shrink_gross_cents increases by provisional_value_cents; Counter.shrink_net_cents increases by final_value_cents; Counter.recovered_conversion_cents increases by 0"
          - "set posted_at to the logical clock"
      - from: POSTED
        to: REVERSED
        trigger: "POST /seafood-ops/shrink-events/{event_id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "ShrinkEvent.status == POSTED"
        side_effects:
          - "SupplierLot.remaining_weight_kg increases by ShrinkEvent.shrink_weight_kg"
          - "Counter.shrink_gross_cents decreases by provisional_value_cents; Counter.shrink_net_cents decreases by final_value_cents; Counter.recovered_conversion_cents decreases by recovery_credit_cents"
          - "set reversed_at to the logical clock and reversal_note to the submitted note"
        note: "Compensating action: because recovery_credit_cents == provisional_value_cents - final_value_cents by construction, the identity shrink_gross_cents == shrink_net_cents + recovered_conversion_cents survives both the forward post and this reversal with zero drift."

  # --- ComplianceViolation --------------------------------------------------
  - entity: ComplianceViolation
    initial_state: OPEN
    terminal_states: [EXPUNGED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /seafood-ops/violations/{violation_id}/cure"
        actor: SeafoodManager
        preconditions:
          - "ComplianceViolation.status == OPEN"
        side_effects:
          - "set cured_at to the logical clock and cure_note to the submitted note"
          - "counter_posture_derivation reruns; a CURED violation contributes ceil(points / 2) instead of points"
      - from: OPEN
        to: EXPUNGED
        trigger: "POST /seafood-ops/violations/{violation_id}/expunge"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceViolation.status == OPEN"
        side_effects:
          - "set expunged_at to the logical clock and expunge_note to the submitted note"
          - "counter_posture_derivation reruns; an EXPUNGED violation contributes 0"
      - from: CURED
        to: EXPUNGED
        trigger: "POST /seafood-ops/violations/{violation_id}/expunge"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceViolation.status == CURED"
        side_effects:
          - "set expunged_at to the logical clock and expunge_note to the submitted note"
          - "counter_posture_derivation reruns"

  # --- Counter posture (system-derived) ------------------------------------
  - entity: Counter
    dimension: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: counter_posture_derivation yields RESTRICTED"
        actor: system
        preconditions:
          - "open_excursion_count == 1 OR violation_points >= 6, and neither SUSPENDED condition holds"
        side_effects:
          - "POST /seafood-ops/lots and POST /seafood-ops/ad-items/{item_id}/publish are refused with ERR_COUNTER_RESTRICTED"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system event: counter_posture_derivation yields SUSPENDED"
        actor: system
        preconditions:
          - "open_excursion_count >= 2 OR violation_points >= 12"
        side_effects:
          - "every mutating counter-scoped operation except excursion resolve, violation cure/expunge, case-label withdraw, ad retract and close-verification-cycle is refused with ERR_COUNTER_SUSPENDED"
      - from: OPEN
        to: SUSPENDED
        trigger: "system event: counter_posture_derivation yields SUSPENDED directly"
        actor: system
        preconditions:
          - "open_excursion_count >= 2 OR violation_points >= 12"
        side_effects:
          - "same lockdown as RESTRICTED -> SUSPENDED"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system event: counter_posture_derivation reruns after remediation"
        actor: system
        preconditions:
          - "no SUSPENDED condition holds and a RESTRICTED condition still holds"
        side_effects:
          - "lockdown lifts to the restricted surface"
      - from: RESTRICTED
        to: OPEN
        trigger: "system event: counter_posture_derivation reruns after remediation"
        actor: system
        preconditions:
          - "open_excursion_count == 0 AND violation_points < 6"
        side_effects:
          - "full operating surface returns"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: case-label-publish-stale-lot
    parent_entity: SupplierLot
    write_endpoint: "POST /seafood-ops/case-labels"
    occ_field: "expected_lot_version"
    description: |
      Publishing a CaseLabel against a SupplierLot whose version has advanced
      since the client last observed it is rejected. Label creation legitimately
      supersedes any prior PUBLISHED label for the lot, so a second create is
      valid product behaviour rather than an invalid-state request; the stale
      version is what distinguishes a writer whose view of the lot's species,
      frozen disclosure or label_status predates the change it must reflect.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: cycle-close-stale-counter
    parent_entity: Counter
    write_endpoint: "POST /seafood-ops/counters/{counter_id}/close-verification-cycle"
    occ_field: "expected_counter_version"
    description: |
      Closing a verification cycle against a Counter whose version has advanced
      since the client last observed it is rejected. A cycle close is always
      legitimate from any posture, so it cannot be screened by a state
      precondition; the stale version instead detects that the sampling plan the
      caller intends to freeze was computed from an out-of-date candidate set.
    error_id: ERR_STALE_COUNTER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cool_label_content_derivation
    trigger: "on POST /seafood-ops/case-labels (all four statement fields) and on POST /seafood-ops/ad-items/{item_id}/clear-cool with decision == CLEAR (cool_statement)"
    algorithm: projection
    formula: |
      lot     = SupplierLot referenced by lot_id
      species = Species referenced by lot.species_id
      cert    = SustainabilityCertification referenced by certification_id (may be null)

      display_market_name = species.market_name

      if lot.production_method == "WILD":
        origin_statement = "Wild caught in " + lot.origin_country_code + " (" + lot.harvest_method + ")"
      else:
        if lot.processing_country_code is not null AND lot.processing_country_code != lot.origin_country_code:
          origin_statement = "Farm raised in " + lot.origin_country_code + ", processed in " + lot.processing_country_code
        else:
          origin_statement = "Farm raised in " + lot.origin_country_code

      production_method_statement = "WILD CAUGHT" if lot.production_method == "WILD" else "FARM RAISED"

      if lot.previously_frozen == true:
        frozen_disclosure_statement = "PREVIOUSLY FROZEN"
      else if lot.fresh_claim == true:
        frozen_disclosure_statement = "FRESH - NEVER FROZEN"
      else:
        frozen_disclosure_statement = "FRESH"

      sustainability_claim_text = null if cert is null else cert.claim_text

      # AdvertisedItem form, joined with " | " in exactly this order:
      cool_statement = display_market_name + " | " + production_method_statement
                       + " | " + origin_statement + " | " + frozen_disclosure_statement
    input_set: "the single SupplierLot named by lot_id (any intake_status), its Species, and the SustainabilityCertification named by certification_id when non-null"
    constants: {}
    precision: "exact string composition; no numeric rounding"

  - name: shrink_valuation
    trigger: "PROVISIONAL_AT_COST on POST /seafood-ops/shrink-events and on every system-created ShrinkEvent; FINAL_NET_OF_RECOVERY on POST /seafood-ops/shrink-events/{event_id}/convert and on POST /seafood-ops/shrink-events/{event_id}/post from VALUED"
    algorithm: aggregation
    formula: |
      lot = SupplierLot referenced by lot_id
      disposal_factor = 1.0 if reason == "UNSOLD_FRESH"
                        1.5 if reason == "MISLABEL_DESTRUCTION"
                        2.0 if reason == "COLD_CHAIN_DISPOSAL"

      # ROUNDING ORDER IS PINNED: round EACH of the three line components to whole
      # cents with round_half_up FIRST, THEN sum. The rejected alternative -- sum the
      # three unrounded products and round once -- yields a different total whenever
      # the per-kg products carry fractional cents (e.g. 15285 vs 15284 for
      # shrink_weight_kg = 8.375, unit_cost = 1700).
      line_cost_cents     = round_half_up(shrink_weight_kg * lot.unit_cost_cents_per_kg)
      line_handling_cents = round_half_up(shrink_weight_kg * HANDLING_CENTS_PER_KG)
      line_disposal_cents = round_half_up(shrink_weight_kg * DISPOSAL_CENTS_PER_KG * disposal_factor)

      provisional_value_cents = line_cost_cents + line_handling_cents + line_disposal_cents

      # FINAL variant, evaluated only after cook_conversion_recovery has produced
      # recovery_credit_cents (0 when no conversion path was taken):
      final_value_cents = provisional_value_cents - recovery_credit_cents
    input_set: "the single ShrinkEvent under mutation plus its SupplierLot; no aggregation over sibling events"
    constants:
      HANDLING_CENTS_PER_KG: 85
      DISPOSAL_CENTS_PER_KG: 40
    precision: "whole cents, round_half_up, applied per line component before summation"
    variants:
      - name: PROVISIONAL_AT_COST
        when: "at ShrinkEvent creation (client POST or system cascade), before any cook-and-sell diversion is known"
        difference: "recovery_credit_cents is treated as 0, so the stored provisional_value_cents is the full cost-plus-handling-plus-disposal figure"
      - name: FINAL_NET_OF_RECOVERY
        when: "on convert (conversion path) or on post from VALUED (no-conversion path)"
        difference: "subtracts recovery_credit_cents from the frozen provisional_value_cents; the provisional figure itself is never recomputed, so provisional_value_cents == final_value_cents + recovery_credit_cents holds by construction"

  - name: cook_conversion_recovery
    trigger: "allowance_kg and approved_conversion_kg on POST /seafood-ops/shrink-events/{event_id}/approve-conversion; cook_yield_kg and recovery_credit_cents on POST /seafood-ops/shrink-events/{event_id}/convert"
    algorithm: threshold
    formula: |
      lot = SupplierLot referenced by lot_id

      allowance_kg = round_half_up(min(shrink_weight_kg,
                                       lot.received_weight_kg * MAX_CONVERSION_SHARE), 3)

      approved_conversion_kg = round_half_up(max(0.000,
                                                 min(conversion_requested_kg, allowance_kg)), 3)

      penalty = (PREVIOUSLY_FROZEN_PENALTY if lot.previously_frozen == true else 0.00)
              + (FRESH_CLAIM_PENALTY      if lot.fresh_claim      == true else 0.00)

      cook_yield_kg = round_half_up(approved_conversion_kg * COOK_YIELD_RATIO * (1 - penalty), 3)

      gross_recovery_cents = round_half_up(cook_yield_kg * lot.cooked_retail_price_cents_per_kg)
      labor_cents          = round_half_up(approved_conversion_kg * LABOR_CENTS_PER_KG)

      recovery_credit_cents = min(provisional_value_cents,
                                  max(0, gross_recovery_cents - labor_cents))
    input_set: "the single ShrinkEvent under mutation plus its SupplierLot; only events with reason == UNSOLD_FRESH and lot.previously_frozen == false may reach approve-conversion"
    constants:
      MAX_CONVERSION_SHARE: 0.60
      COOK_YIELD_RATIO: 0.65
      PREVIOUSLY_FROZEN_PENALTY: 0.15
      FRESH_CLAIM_PENALTY: 0.05
      LABOR_CENTS_PER_KG: 90
    precision: "weights 3 decimal places round_half_up; money whole cents round_half_up"

  - name: supplier_chargeback_assessment
    trigger: "on the SupplierLot chargeback_status NONE -> ASSESSED transition (cascade A link 4)"
    algorithm: tiered_pricing
    formula: |
      # The goodwill credit lowers the bill while the goodwill TIER is keyed on the
      # bill -- a circular-looking dependency. Evaluation order is PINNED below;
      # each step reads only values frozen by earlier steps.
      lot      = SupplierLot the chargeback is assessed against
      supplier = Supplier referenced by lot.supplier_id

      STEP 1: lot_value_cents = round_half_up(lot.remaining_weight_kg * lot.retail_price_cents_per_kg)
              # remaining_weight_kg as observed BEFORE any ShrinkEvent is POSTED;
              # ShrinkEvent creation never decrements remaining_weight_kg.

      STEP 2: pre_credit_subtotal_cents = BASE_PENALTY_CENTS + lot_value_cents + RELABEL_LABOR_CENTS

      STEP 3: goodwill_rate = GOODWILL_TIER_1_RATE if pre_credit_subtotal_cents < 50000
                              GOODWILL_TIER_2_RATE if 50000 <= pre_credit_subtotal_cents < 120000
                              GOODWILL_TIER_3_RATE otherwise
              # Tier is selected on pre_credit_subtotal_cents, NEVER on the
              # post-credit net. At pre_credit_subtotal_cents == 50000 exactly the
              # boundary is inclusive-low for tier 2.
              goodwill_credit_cents = round_half_up(pre_credit_subtotal_cents * goodwill_rate)

      STEP 4: net_chargeback_cents = pre_credit_subtotal_cents - goodwill_credit_cents

      STEP 5: multiplier = PROBATION_MULTIPLIER if supplier.status == "PROBATION" else 1.00
              # supplier.status as observed BEFORE this cascade's own Supplier.status
              # recomputation (cascade A link 5).
              chargeback_assessed_cents = round_half_up(net_chargeback_cents * multiplier)
    input_set: "the single SupplierLot entering ASSESSED plus its Supplier; no aggregation over sibling lots"
    constants:
      BASE_PENALTY_CENTS: 25000
      RELABEL_LABOR_CENTS: 4000
      GOODWILL_TIER_1_RATE: 0.15
      GOODWILL_TIER_2_RATE: 0.08
      GOODWILL_TIER_3_RATE: 0.00
      PROBATION_MULTIPLIER: 1.25
    precision: "whole cents, round_half_up, once per numbered step"

  - name: substitution_risk_index
    trigger: "on POST /seafood-ops/verification-samples/{sample_id}/result (both variants, for the sampled lot's Supplier) and at step 3 of POST /seafood-ops/counters/{counter_id}/close-verification-cycle (both variants, for every Supplier with at least one SupplierLot on that Counter)"
    algorithm: decay_function
    formula: |
      mismatch_set = VerificationSample rows S where
                       SupplierLot(S.lot_id).supplier_id == supplier.id
                       AND S.status == "MISMATCH"
      # samples in DISPUTED, VOIDED, MATCH, IN_LAB or DRAFT are excluded

      # --- ROLLING_CYCLE variant -------------------------------------------
      decayed = 0
      for S in mismatch_set ordered by S.created_at ASC:
        cycle_now = Counter(SupplierLot(S.lot_id).counter_id).verification_cycle_index
        age       = cycle_now - S.cycle_index          # >= 0
        decayed  += MISMATCH_WEIGHT * (DECAY_PER_CYCLE ** age)

      high_risk_bonus = HIGH_RISK_BONUS if any S in mismatch_set has
                          Species(SupplierLot(S.lot_id).species_id).high_risk_substitution == true
                        else 0
      substitution_risk_index_rolling = round_half_up(min(INDEX_CAP, decayed + high_risk_bonus), 2)
      # The bonus is a flat adder and is NOT decayed.

      # --- LIFETIME variant -------------------------------------------------
      if supplier.lifetime_sample_count == 0:
        substitution_risk_index_lifetime = 0.00
      else:
        substitution_risk_index_lifetime = round_half_up(
            100 * supplier.lifetime_mismatch_count / supplier.lifetime_sample_count, 2)

      # --- Supplier standing (driven by the LIFETIME variant only) ----------
      if supplier.lifetime_sample_count >= 2 AND substitution_risk_index_lifetime >= 60.00:
        supplier.status = "SUSPENDED"
      else if supplier.lifetime_sample_count >= 2 AND substitution_risk_index_lifetime >= 25.00:
        supplier.status = "PROBATION"
      else:
        supplier.status = "GOOD_STANDING"
      # A supplier with exactly one sample never leaves GOOD_STANDING, however that
      # sample resolved.
    input_set: "VerificationSample rows with status == MISMATCH on lots whose supplier_id is this supplier; lifetime counters are the running Supplier.lifetime_sample_count / lifetime_mismatch_count over samples that reached MATCH or MISMATCH"
    constants:
      MISMATCH_WEIGHT: 40
      HIGH_RISK_BONUS: 10
      DECAY_PER_CYCLE: 0.5
      INDEX_CAP: 100.00
      PROBATION_LIFETIME_THRESHOLD: 25.00
      SUSPENSION_LIFETIME_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_CYCLE
        when: "used by verification_sampling_plan to size the next cycle's sampling load"
        difference: "each MISMATCH contributes MISMATCH_WEIGHT halved once per elapsed verification cycle, plus a single undecayed HIGH_RISK_BONUS; a mismatch three cycles old is worth 5 points of weight instead of 40"
      - name: LIFETIME
        when: "used to set Supplier.status (GOOD_STANDING / PROBATION / SUSPENDED)"
        difference: "a pure mismatch-rate percentage with no decay and no high-risk bonus, so it never falls as cycles elapse; identical sample history yields 50.00 lifetime against 30.00 rolling one cycle after the mismatch"

  - name: verification_sampling_plan
    trigger: "at step 1 of POST /seafood-ops/counters/{counter_id}/close-verification-cycle, writing Counter.last_cycle_required_samples and Counter.last_cycle_max_supplier_risk_index"
    algorithm: threshold
    formula: |
      candidates = SupplierLot rows L where
                     L.counter_id == counter.id
                     AND L.intake_status IN {"CASED", "HELD"}
                     AND L.label_status IN {"UNVERIFIED", "RELABELED"}

      if count(candidates) == 0:
        last_cycle_max_supplier_risk_index = 0.00
        last_cycle_required_samples        = 0        # NOT BASE_SAMPLES
        STOP

      high_risk_count = count of L in candidates where
                          Species(L.species_id).high_risk_substitution == true

      last_cycle_max_supplier_risk_index =
          max over L in candidates of Supplier(L.supplier_id).substitution_risk_index_rolling
          # read at the CURRENT counter.verification_cycle_index, i.e. BEFORE step 2
          # increments it and BEFORE step 3 re-decays the supplier indexes.

      last_cycle_required_samples = BASE_SAMPLES
                                  + ceil(high_risk_count / HIGH_RISK_DIVISOR)
                                  + (HIGH_RISK_SURCHARGE
                                     if last_cycle_max_supplier_risk_index >= RISK_SURCHARGE_THRESHOLD
                                     else 0)
      # The surcharge comparison is inclusive: exactly 40.00 triggers it.
    input_set: "SupplierLot rows on this Counter with intake_status IN {CASED, HELD} and label_status IN {UNVERIFIED, RELABELED}; an empty candidate set short-circuits to 0 required samples"
    constants:
      BASE_SAMPLES: 1
      HIGH_RISK_DIVISOR: 3
      HIGH_RISK_SURCHARGE: 2
      RISK_SURCHARGE_THRESHOLD: 40.00
    precision: "integer sample count; risk index compared at 2 decimal places"

  - name: cold_chain_exposure
    trigger: "on POST /seafood-ops/ice-bed-readings, creating or updating the OPEN ColdChainExcursion for (counter_id, case_slot)"
    algorithm: chronological
    formula: |
      reading.breach = reading.temperature_c > ICE_BED_LIMIT_C
      # STRICT greater-than: exactly 4.4 is compliant.

      last_resolved_end = max over ColdChainExcursion X where
                            X.counter_id == counter_id AND X.case_slot == case_slot
                            AND X.status IN {"RESOLVED_RELEASED", "RESOLVED_DISPOSED"}
                          of X.ended_at
                          (null when no resolved excursion exists for the slot)

      breach_set = IceBedReading rows R where
                     R.counter_id == counter_id AND R.case_slot == case_slot
                     AND R.temperature_c > ICE_BED_LIMIT_C
                     AND (last_resolved_end is null OR R.reading_at > last_resolved_end)

      if breach_set is empty:
        no OPEN ColdChainExcursion exists for the slot; STOP

      # Full chronological replay over breach_set, ordered by reading_at ASC with
      # created_at ASC as tie-break, so a reading POSTed out of order still yields
      # the same excursion as if it had arrived in time order.
      started_at         = min over breach_set of reading_at
      ended_at           = max over breach_set of reading_at
      exposure_minutes   = round_half_up((ended_at - started_at) in whole minutes)
      peak_temperature_c = max over breach_set of temperature_c

      severity = "MINOR"    if exposure_minutes <= MINOR_MAX_MINUTES
                 "MAJOR"    if exposure_minutes <= MAJOR_MAX_MINUTES
                 "CRITICAL" otherwise

      # A non-breaching reading NEVER closes an OPEN excursion; only
      # POST /seafood-ops/excursions/{excursion_id}/resolve does.
    input_set: "IceBedReading rows for the (counter_id, case_slot) pair whose temperature_c exceeds ICE_BED_LIMIT_C and whose reading_at is later than the ended_at of the slot's most recently resolved excursion"
    constants:
      ICE_BED_LIMIT_C: 4.4
      MINOR_MAX_MINUTES: 60
      MAJOR_MAX_MINUTES: 180
    precision: "temperature 1 decimal place; exposure in whole minutes, round_half_up"

  - name: counter_posture_derivation
    trigger: "on every ColdChainExcursion create or resolve, every ComplianceViolation create, cure or expunge, and at step 4 of POST /seafood-ops/counters/{counter_id}/close-verification-cycle"
    algorithm: weighted_scoring
    formula: |
      open_excursion_count = count of ColdChainExcursion X where
                               X.counter_id == counter.id AND X.status == "OPEN"

      violation_points = sum over ComplianceViolation V where V.counter_id == counter.id
                           AND V.status == "OPEN"  of CATEGORY_POINTS[V.category]
                       + sum over ComplianceViolation V where V.counter_id == counter.id
                           AND V.status == "CURED" of ceil(CATEGORY_POINTS[V.category] / 2)
      # EXPUNGED violations contribute 0.

      posture = "SUSPENDED"  if open_excursion_count >= SUSPEND_EXCURSION_COUNT
                                 OR violation_points >= SUSPEND_VIOLATION_POINTS
                "RESTRICTED" if open_excursion_count >= RESTRICT_EXCURSION_COUNT
                                 OR violation_points >= RESTRICT_VIOLATION_POINTS
                "OPEN"       otherwise
    input_set: "ColdChainExcursion rows with status == OPEN and ComplianceViolation rows with status IN {OPEN, CURED}, both filtered to this Counter"
    constants:
      SUSPEND_EXCURSION_COUNT: 2
      SUSPEND_VIOLATION_POINTS: 12
      RESTRICT_EXCURSION_COUNT: 1
      RESTRICT_VIOLATION_POINTS: 6
      CATEGORY_POINTS:
        SPECIES_SUBSTITUTION: 6
        COOL_MISSING: 4
        FROZEN_DISCLOSURE: 4
        SIMP_DEFICIENT: 5
        COLD_CHAIN: 3
        UNSUBSTANTIATED_CLAIM: 6
    precision: "integer points; ceil applied per CURED violation before summation"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when the acting role is SeafoodManager, X-User-ID equals the Counter.id that owns the target resource (Counter.id itself, SupplierLot.counter_id, CaseLabel -> SupplierLot.counter_id, ShrinkEvent -> SupplierLot.counter_id, IceBedReading.counter_id, ComplianceViolation.counter_id)"
    error_id: ERR_COUNTER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "all SeafoodManager endpoints"
  - priority: 4
    category: auth
    check: "when the acting role is SupplierRep, X-User-ID equals the Supplier.id that owns the target resource (SupplierLot.supplier_id, SimpDocument -> SupplierLot.supplier_id, SustainabilityCertification.supplier_id, VerificationSample -> SupplierLot.supplier_id)"
    error_id: ERR_SUPPLIER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "all SupplierRep endpoints"
  - priority: 5
    category: auth
    check: "segregation of duties: the acting X-User-ID on clear-claim must differ from AdvertisedItem.cool_reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /seafood-ops/ad-items/{item_id}/clear-claim"
  - priority: 6
    category: existence
    check: "Counter referenced by path or counter_id exists"
    error_id: ERR_COUNTER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a counter id"
  - priority: 7
    category: existence
    check: "Supplier referenced by path or supplier_id exists"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a supplier id"
  - priority: 8
    category: existence
    check: "Species referenced by species_id, observed_species_id or corrected_species_id exists"
    error_id: ERR_SPECIES_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a species id"
  - priority: 9
    category: existence
    check: "SupplierLot referenced by path or lot_id exists"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a lot id"
  - priority: 10
    category: existence
    check: "CaseLabel referenced by path exists"
    error_id: ERR_CASE_LABEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /seafood-ops/case-labels/{label_id}, POST /seafood-ops/case-labels/{label_id}/withdraw"
  - priority: 11
    category: existence
    check: "AdvertisedItem referenced by path exists"
    error_id: ERR_AD_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /ad-items/{item_id} endpoints"
  - priority: 12
    category: existence
    check: "IceBedReading referenced by path exists"
    error_id: ERR_READING_NOT_FOUND
    http_status: 404
    applies_to: "GET /seafood-ops/ice-bed-readings/{reading_id}"
  - priority: 13
    category: existence
    check: "ColdChainExcursion referenced by path exists"
    error_id: ERR_EXCURSION_NOT_FOUND
    http_status: 404
    applies_to: "all /excursions/{excursion_id} endpoints"
  - priority: 14
    category: existence
    check: "VerificationSample referenced by path exists"
    error_id: ERR_SAMPLE_NOT_FOUND
    http_status: 404
    applies_to: "all /verification-samples/{sample_id} endpoints"
  - priority: 15
    category: existence
    check: "SimpDocument referenced by path exists"
    error_id: ERR_SIMP_DOCUMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /simp-documents/{document_id} endpoints"
  - priority: 16
    category: existence
    check: "SustainabilityCertification referenced by path or certification_id exists"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a certification id"
  - priority: 17
    category: existence
    check: "ShrinkEvent referenced by path exists"
    error_id: ERR_SHRINK_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all /shrink-events/{event_id} endpoints"
  - priority: 18
    category: existence
    check: "ComplianceViolation referenced by path exists"
    error_id: ERR_VIOLATION_NOT_FOUND
    http_status: 404
    applies_to: "all /violations/{violation_id} endpoints"
  - priority: 19
    category: business_constraint
    check: "every required body field declared in 1.5 input is present, typed correctly, within declared numeric bounds and (for enums) a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 20
    category: state
    check: "expected_lot_version equals SupplierLot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /seafood-ops/case-labels"
  - priority: 21
    category: state
    check: "expected_counter_version equals Counter.version"
    error_id: ERR_STALE_COUNTER_VERSION
    http_status: 412
    applies_to: "POST /seafood-ops/counters/{counter_id}/close-verification-cycle"
  - priority: 22
    category: state
    check: "SupplierLot.intake_status is in the requested transition's from-set"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/lots/{lot_id}/case, /record-sales, POST /seafood-ops/verification-samples, POST /seafood-ops/shrink-events"
  - priority: 23
    category: state
    check: "SupplierLot.label_status is in the requested transition's from-set"
    error_id: ERR_LABEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/lots/{lot_id}/relabel"
  - priority: 24
    category: state
    check: "SupplierLot.chargeback_status is in the requested transition's from-set"
    error_id: ERR_CHARGEBACK_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/lots/{lot_id}/settle-chargeback, POST /seafood-ops/lots/{lot_id}/reverse-chargeback"
  - priority: 25
    category: state
    check: "CaseLabel.status == PUBLISHED"
    error_id: ERR_CASE_LABEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/case-labels/{label_id}/withdraw"
  - priority: 26
    category: state
    check: "AdvertisedItem.status and the addressed review dimension are in the requested transition's from-set"
    error_id: ERR_AD_ITEM_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/ad-items/{item_id}/clear-cool, /clear-claim, /publish, /close, /retract"
  - priority: 27
    category: state
    check: "ColdChainExcursion.status == OPEN, and resolution == RELEASE additionally requires severity IN {MINOR, MAJOR}"
    error_id: ERR_EXCURSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/excursions/{excursion_id}/resolve"
  - priority: 28
    category: state
    check: "VerificationSample.status is in the requested transition's from-set"
    error_id: ERR_SAMPLE_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/verification-samples/{sample_id}/send-to-lab, /result, /dispute"
  - priority: 29
    category: state
    check: "SimpDocument.status is in the requested transition's from-set"
    error_id: ERR_SIMP_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/simp-documents/{document_id}/submit, /review"
  - priority: 30
    category: state
    check: "SustainabilityCertification.status is in the requested transition's from-set"
    error_id: ERR_CERTIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/certifications/{certification_id}/review, /enforce"
  - priority: 31
    category: state
    check: "ShrinkEvent.status is in the requested transition's from-set"
    error_id: ERR_SHRINK_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/shrink-events/{event_id}/approve-conversion, /convert, /post, /reverse"
  - priority: 32
    category: state
    check: "ComplianceViolation.status is in the requested transition's from-set"
    error_id: ERR_VIOLATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /seafood-ops/violations/{violation_id}/cure, /expunge"
  - priority: 33
    category: state
    check: "VerificationSample.retest_count < 2"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /seafood-ops/verification-samples/{sample_id}/dispute, POST /seafood-ops/verification-samples/{sample_id}/send-to-lab from DISPUTED"
  - priority: 34
    category: business_safety
    check: "Counter.posture != SUSPENDED for every mutating counter-scoped operation except excursion resolve, violation cure/expunge, case-label withdraw, ad retract, ad close and close-verification-cycle"
    error_id: ERR_COUNTER_SUSPENDED
    http_status: 409
    applies_to: "POST /seafood-ops/lots, POST /seafood-ops/lots/{lot_id}/case, /record-sales, /relabel, POST /seafood-ops/case-labels, POST /seafood-ops/ice-bed-readings, POST /seafood-ops/verification-samples, POST /seafood-ops/shrink-events, POST /seafood-ops/ad-items, POST /seafood-ops/ad-items/{item_id}/publish"
  - priority: 35
    category: business_safety
    check: "Counter.posture != RESTRICTED for lot receipt and advertisement publication"
    error_id: ERR_COUNTER_RESTRICTED
    http_status: 409
    applies_to: "POST /seafood-ops/lots, POST /seafood-ops/ad-items/{item_id}/publish"
  - priority: 36
    category: business_safety
    check: "the Counter owning the lot has no ColdChainExcursion with status == OPEN"
    error_id: ERR_OPEN_EXCURSION_BLOCKS
    http_status: 409
    applies_to: "POST /seafood-ops/case-labels"
  - priority: 37
    category: business_safety
    check: "when Species.simp_covered == true for the lot's species, a SimpDocument for that lot exists with status == ACCEPTED"
    error_id: ERR_SIMP_DOCUMENT_MISSING
    http_status: 409
    applies_to: "POST /seafood-ops/lots/{lot_id}/case"
  - priority: 38
    category: business_safety
    check: "previously_frozen == true and fresh_claim == true may not both be submitted for the same lot"
    error_id: ERR_FROZEN_DISCLOSURE_CONFLICT
    http_status: 422
    applies_to: "POST /seafood-ops/lots"
  - priority: 39
    category: business_safety
    check: "corrected_species_id equals observed_species_id of the most recent VerificationSample for the lot with status == MISMATCH (ordered by result_recorded_at DESC, created_at DESC)"
    error_id: ERR_RELABEL_SPECIES_MISMATCH
    http_status: 422
    applies_to: "POST /seafood-ops/lots/{lot_id}/relabel"
  - priority: 40
    category: business_referential
    check: "corrected_market_name is a member of Species.acceptable_market_names for corrected_species_id"
    error_id: ERR_MARKET_NAME_NOT_ACCEPTABLE
    http_status: 422
    applies_to: "POST /seafood-ops/lots/{lot_id}/relabel"
  - priority: 41
    category: business_referential
    check: "when certification_id is supplied, the certification has status == ACTIVE and its counter_id, supplier_id and species_id all match the lot's counter_id, supplier_id and species_id"
    error_id: ERR_CLAIM_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /seafood-ops/case-labels, POST /seafood-ops/ad-items, POST /seafood-ops/ad-items/{item_id}/clear-claim"
  - priority: 42
    category: business_referential
    check: "when certification_id is supplied, valid_from <= logical_clock < valid_until"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /seafood-ops/case-labels, POST /seafood-ops/ad-items, POST /seafood-ops/ad-items/{item_id}/clear-claim"
  - priority: 43
    category: business_referential
    check: "Species.sustainability_program_eligible == true for the certified species"
    error_id: ERR_SPECIES_NOT_CLAIM_ELIGIBLE
    http_status: 422
    applies_to: "POST /seafood-ops/certifications/{certification_id}/review with decision == APPROVE"
  - priority: 44
    category: business_constraint
    check: "1 <= case_slot <= Counter.case_slot_count"
    error_id: ERR_CASE_SLOT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /seafood-ops/lots/{lot_id}/case, POST /seafood-ops/ice-bed-readings"
  - priority: 45
    category: business_temporal
    check: "slot occupancy is a CLOSED interval [cased_at, vacated_at] with a 30-minute sanitation buffer: no other SupplierLot on the counter holds the slot with intake_status IN {CASED, HELD}, and logical_clock >= vacated_at + 30 minutes for the slot's most recent occupant"
    error_id: ERR_CASE_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /seafood-ops/lots/{lot_id}/case"
  - priority: 46
    category: business_temporal
    check: "ad_end_at is strictly after ad_start_at"
    error_id: ERR_AD_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /seafood-ops/ad-items"
  - priority: 47
    category: business_temporal
    check: "the advertising window is a HALF-OPEN interval [ad_start_at, ad_end_at) with zero buffer: it must not overlap the window of another AdvertisedItem for the same lot_id whose status IN {DRAFT, APPROVED, PUBLISHED}; touching windows where one ends exactly when the next begins are permitted"
    error_id: ERR_AD_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /seafood-ops/ad-items"
  - priority: 48
    category: business_temporal
    check: "reading_at is not later than the logical clock"
    error_id: ERR_READING_IN_FUTURE
    http_status: 422
    applies_to: "POST /seafood-ops/ice-bed-readings"
  - priority: 49
    category: business_temporal
    check: "harvest_date <= landing_date"
    error_id: ERR_SIMP_DATE_ORDER
    http_status: 422
    applies_to: "POST /seafood-ops/simp-documents, POST /seafood-ops/simp-documents/{document_id}/submit"
  - priority: 50
    category: business_constraint
    check: "sold_weight_kg <= SupplierLot.remaining_weight_kg"
    error_id: ERR_INSUFFICIENT_REMAINING_WEIGHT
    http_status: 422
    applies_to: "POST /seafood-ops/lots/{lot_id}/record-sales"
  - priority: 51
    category: business_constraint
    check: "shrink_weight_kg <= SupplierLot.remaining_weight_kg"
    error_id: ERR_SHRINK_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /seafood-ops/shrink-events"
  - priority: 52
    category: business_constraint
    check: "conversion_requested_kg <= allowance_kg computed by cook_conversion_recovery"
    error_id: ERR_CONVERSION_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /seafood-ops/shrink-events/{event_id}/approve-conversion"
  - priority: 53
    category: business_constraint
    check: "cook-and-sell conversion requires reason == UNSOLD_FRESH, SupplierLot.previously_frozen == false and conversion_requested_kg > 0.000"
    error_id: ERR_CONVERSION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /seafood-ops/shrink-events/{event_id}/approve-conversion"
  - priority: 54
    category: business_fiscal
    check: "payment_amount_cents equals Supplier.chargeback_outstanding_cents exactly"
    error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /seafood-ops/lots/{lot_id}/settle-chargeback"
  - priority: 55
    category: business_fiscal
    check: "Supplier.chargeback_outstanding_cents < CREDIT_HOLD_CENTS (75000) at the moment of lot receipt"
    error_id: ERR_SUPPLIER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /seafood-ops/lots"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/seafood-ops/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ChainAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "all subsequent timestamp stamping, certification validity checks and ad-window comparisons use the new instant"

  # --- Counter --------------------------------------------------------------
  - method: POST
    path: "/seafood-ops/counters"
    description: "Registers a seafood service counter."
    roles: [ChainAdmin]
    code: 201
    input: [store_number, department_name, case_slot_count]
    output: Counter
    side_effects:
      - "posture initialised to OPEN, verification_cycle_index to 0, all ledger fields to 0"
  - method: GET
    path: "/seafood-ops/counters/{counter_id}"
    description: "Reads one counter including posture and shrink ledger."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: []
    output: Counter
    side_effects: []
  - method: GET
    path: "/seafood-ops/counters"
    description: "Lists counters with pagination."
    roles: [ChainAdmin, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: ["store_number?", "posture?", "limit?", "offset?"]
    output: Counter[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/counters/{counter_id}/close-verification-cycle"
    description: "Freezes the sampling plan for the current cycle and advances the counter to the next one. Steps run in this pinned order: (1) verification_sampling_plan at the CURRENT verification_cycle_index; (2) increment verification_cycle_index by 1; (3) rerun substitution_risk_index for every Supplier with a lot on this counter using the NEW index; (4) counter_posture_derivation; (5) increment Counter.version by 1."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_counter_version]
    output: Counter
    side_effects:
      - "writes last_cycle_required_samples and last_cycle_max_supplier_risk_index from verification_sampling_plan"
      - "increments verification_cycle_index by 1"
      - "recomputes Supplier.substitution_risk_index_rolling and substitution_risk_index_lifetime for every Supplier with a lot on this counter"
      - "recomputes posture via counter_posture_derivation"
      - "increments Counter.version by 1"

  # --- Supplier -------------------------------------------------------------
  - method: POST
    path: "/seafood-ops/suppliers"
    description: "Registers a dealer."
    roles: [ChainAdmin]
    code: 201
    input: [name, permit_number]
    output: Supplier
    side_effects:
      - "status initialised to GOOD_STANDING and all risk and chargeback ledger fields to 0"
  - method: GET
    path: "/seafood-ops/suppliers/{supplier_id}"
    description: "Reads one dealer including both substitution risk index variants and the chargeback ledger."
    roles: [ChainAdmin, ComplianceOfficer, SupplierRep, SeafoodManager]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  # --- Species --------------------------------------------------------------
  - method: POST
    path: "/seafood-ops/species"
    description: "Registers an immutable species configuration record."
    roles: [ChainAdmin]
    code: 201
    input: [market_name, scientific_name, acceptable_market_names, simp_covered, high_risk_substitution, sustainability_program_eligible]
    output: Species
    side_effects: []
  - method: GET
    path: "/seafood-ops/species/{species_id}"
    description: "Reads one species configuration record."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead, SupplierRep]
    code: 200
    input: []
    output: Species
    side_effects: []

  # --- SupplierLot ----------------------------------------------------------
  - method: POST
    path: "/seafood-ops/lots"
    description: "Receives a supplier lot at the counter with harvest, origin and farmed/wild disclosures."
    roles: [SeafoodManager]
    code: 201
    input: [counter_id, supplier_id, species_id, lot_code, harvest_method, production_method, origin_country_code, "processing_country_code?", previously_frozen, fresh_claim, received_weight_kg, unit_cost_cents_per_kg, retail_price_cents_per_kg, cooked_retail_price_cents_per_kg]
    output: SupplierLot
    side_effects:
      - "remaining_weight_kg set to received_weight_kg; received_at stamped from the logical clock"
      - "intake_status RECEIVED, label_status UNVERIFIED, chargeback_status NONE"
  - method: GET
    path: "/seafood-ops/lots/{lot_id}"
    description: "Reads one lot including all three status dimensions and its version."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead, SupplierRep]
    code: 200
    input: []
    output: SupplierLot
    side_effects: []
  - method: GET
    path: "/seafood-ops/lots"
    description: "Lists lots filtered by counter, supplier, species or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead, SupplierRep]
    code: 200
    input: ["counter_id?", "supplier_id?", "species_id?", "intake_status?", "label_status?", "chargeback_status?", "limit?", "offset?"]
    output: SupplierLot[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/lots/{lot_id}/case"
    description: "Places a received lot into an ice-bed slot."
    roles: [SeafoodManager]
    code: 200
    input: [case_slot]
    output: SupplierLot
    side_effects:
      - "intake_status RECEIVED -> CASED; case_slot and cased_at set"
  - method: POST
    path: "/seafood-ops/lots/{lot_id}/record-sales"
    description: "Records fresh-case sales against the lot."
    roles: [SeafoodManager]
    code: 200
    input: [sold_weight_kg]
    output: SupplierLot
    side_effects:
      - "remaining_weight_kg decreases by sold_weight_kg"
      - "when remaining_weight_kg reaches 0.000 the lot becomes DEPLETED, vacated_at is stamped and PUBLISHED CaseLabels are withdrawn with withdraw_reason MANUAL"
  - method: POST
    path: "/seafood-ops/lots/{lot_id}/relabel"
    description: "Corrects a mislabelled lot to the laboratory-identified species."
    roles: [SeafoodManager]
    code: 200
    input: [corrected_species_id, corrected_market_name]
    output: SupplierLot
    side_effects:
      - "species_id replaced; label_status MISMATCHED -> RELABELED"
      - "every DISPUTED VerificationSample on the lot becomes VOIDED"
  - method: POST
    path: "/seafood-ops/lots/{lot_id}/settle-chargeback"
    description: "Supplier pays the assessed mislabel chargeback in full."
    roles: [SupplierRep]
    code: 200
    input: [payment_amount_cents]
    output: SupplierLot
    side_effects:
      - "chargeback_status ASSESSED -> SETTLED"
      - "Supplier.chargeback_outstanding_cents decreases and chargeback_settled_cents increases by chargeback_assessed_cents"
  - method: POST
    path: "/seafood-ops/lots/{lot_id}/reverse-chargeback"
    description: "Compliance voids an assessed mislabel chargeback."
    roles: [ComplianceOfficer]
    code: 200
    input: [reversal_note]
    output: SupplierLot
    side_effects:
      - "chargeback_status ASSESSED -> REVERSED"
      - "Supplier.chargeback_outstanding_cents decreases and chargeback_reversed_cents increases by chargeback_assessed_cents; Supplier.status recomputed"

  # --- CaseLabel ------------------------------------------------------------
  - method: POST
    path: "/seafood-ops/case-labels"
    description: "Publishes the country-of-origin case label for a lot; supersedes any prior PUBLISHED label for the same lot."
    roles: [SeafoodManager]
    code: 201
    input: [lot_id, "certification_id?", expected_lot_version]
    output: CaseLabel
    side_effects:
      - "all four statement fields and sustainability_claim_text derived by cool_label_content_derivation"
      - "any prior PUBLISHED CaseLabel for the lot becomes WITHDRAWN with withdraw_reason SUPERSEDED"
      - "increments SupplierLot.version by 1"
  - method: GET
    path: "/seafood-ops/case-labels/{label_id}"
    description: "Reads one case label with its derived disclosure statements."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: []
    output: CaseLabel
    side_effects: []
  - method: GET
    path: "/seafood-ops/case-labels"
    description: "Lists case labels filtered by lot, certification or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: ["lot_id?", "certification_id?", "status?", "withdraw_reason?", "limit?", "offset?"]
    output: CaseLabel[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/case-labels/{label_id}/withdraw"
    description: "Pulls a case label from the service case."
    roles: [SeafoodManager, ComplianceOfficer]
    code: 200
    input: [reason]
    output: CaseLabel
    side_effects:
      - "status PUBLISHED -> WITHDRAWN with the submitted reason and withdrawn_at stamped"

  # --- AdvertisedItem -------------------------------------------------------
  - method: POST
    path: "/seafood-ops/ad-items"
    description: "Drafts an advertisement for a lot over a half-open window."
    roles: [MerchandisingLead]
    code: 201
    input: [counter_id, lot_id, "certification_id?", headline, ad_start_at, ad_end_at]
    output: AdvertisedItem
    side_effects:
      - "status DRAFT, cool_review_status COOL_PENDING, claim_review_status CLAIM_PENDING"
  - method: GET
    path: "/seafood-ops/ad-items/{item_id}"
    description: "Reads one advertisement including both review dimensions and reviewer ids."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: []
    output: AdvertisedItem
    side_effects: []
  - method: GET
    path: "/seafood-ops/ad-items"
    description: "Lists advertisements filtered by counter, lot, certification or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead]
    code: 200
    input: ["counter_id?", "lot_id?", "certification_id?", "status?", "limit?", "offset?"]
    output: AdvertisedItem[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/ad-items/{item_id}/clear-cool"
    description: "Country-of-origin branch of the advertisement review fork."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "rejection_category?", "note?"]
    output: AdvertisedItem
    side_effects:
      - "decision CLEAR: cool_review_status -> COOL_CLEARED and cool_statement derived by cool_label_content_derivation"
      - "decision REJECT: cool_review_status -> COOL_REJECTED, status -> REJECTED, and a ComplianceViolation of the submitted rejection_category is created"
      - "cool_reviewer_user_id set to the acting X-User-ID"
      - "when both review dimensions are cleared, status DRAFT -> APPROVED"
  - method: POST
    path: "/seafood-ops/ad-items/{item_id}/clear-claim"
    description: "Sustainability-claim branch of the advertisement review fork; must be decided by a different ComplianceOfficer than the country-of-origin branch."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: AdvertisedItem
    side_effects:
      - "decision CLEAR: claim_review_status -> CLAIM_CLEARED"
      - "decision REJECT: claim_review_status -> CLAIM_REJECTED, status -> REJECTED, and a ComplianceViolation of category UNSUBSTANTIATED_CLAIM is created"
      - "claim_reviewer_user_id set to the acting X-User-ID"
      - "when both review dimensions are cleared, status DRAFT -> APPROVED"
  - method: POST
    path: "/seafood-ops/ad-items/{item_id}/publish"
    description: "Publishes an approved advertisement."
    roles: [MerchandisingLead]
    code: 200
    input: []
    output: AdvertisedItem
    side_effects:
      - "status APPROVED -> PUBLISHED"
  - method: POST
    path: "/seafood-ops/ad-items/{item_id}/close"
    description: "Retires a published advertisement whose window has elapsed."
    roles: [MerchandisingLead]
    code: 200
    input: []
    output: AdvertisedItem
    side_effects:
      - "status PUBLISHED -> CLOSED"
  - method: POST
    path: "/seafood-ops/ad-items/{item_id}/retract"
    description: "Pulls a published advertisement."
    roles: [MerchandisingLead, ComplianceOfficer]
    code: 200
    input: [reason]
    output: AdvertisedItem
    side_effects:
      - "status PUBLISHED -> RETRACTED with retract_reason set to the submitted reason"

  # --- IceBedReading / ColdChainExcursion ----------------------------------
  - method: POST
    path: "/seafood-ops/ice-bed-readings"
    description: "Records an ice-bed probe reading and runs cold_chain_exposure for the slot."
    roles: [SeafoodManager]
    code: 201
    input: [counter_id, case_slot, reading_at, temperature_c, taken_by_user_id]
    output: IceBedReading
    side_effects:
      - "breach computed as temperature_c > 4.4 (strict)"
      - "when the slot's breach set is non-empty, the slot's OPEN ColdChainExcursion is created or recomputed by chronological replay (started_at, ended_at, exposure_minutes, peak_temperature_c, severity)"
      - "a newly created excursion holds every CASED lot in that slot (cascade B), which withdraws their PUBLISHED CaseLabels and retracts the dependent PUBLISHED AdvertisedItems"
      - "counter_posture_derivation reruns"
  - method: GET
    path: "/seafood-ops/ice-bed-readings/{reading_id}"
    description: "Reads one ice-bed reading."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: []
    output: IceBedReading
    side_effects: []
  - method: GET
    path: "/seafood-ops/ice-bed-readings"
    description: "Lists ice-bed readings filtered by counter and slot."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: ["counter_id?", "case_slot?", "breach?", "limit?", "offset?"]
    output: IceBedReading[]
    side_effects: []
  - method: GET
    path: "/seafood-ops/excursions/{excursion_id}"
    description: "Reads one cold-chain excursion."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: []
    output: ColdChainExcursion
    side_effects: []
  - method: GET
    path: "/seafood-ops/excursions"
    description: "Lists cold-chain excursions filtered by counter, status or severity."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: ["counter_id?", "case_slot?", "status?", "severity?", "limit?", "offset?"]
    output: ColdChainExcursion[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/excursions/{excursion_id}/resolve"
    description: "Dispositions an open excursion: RELEASE returns held lots to the case, DISPOSE destroys them."
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution, "note?"]
    output: ColdChainExcursion
    side_effects:
      - "RELEASE: status -> RESOLVED_RELEASED and every HELD lot in the slot returns to CASED"
      - "DISPOSE: status -> RESOLVED_DISPOSED, every HELD lot in the slot becomes DISPOSED with a COLD_CHAIN_DISPOSAL ShrinkEvent and a COLD_CHAIN ComplianceViolation"
      - "Counter.open_excursion_count decreases by 1 and counter_posture_derivation reruns"

  # --- VerificationSample ---------------------------------------------------
  - method: POST
    path: "/seafood-ops/verification-samples"
    description: "Draws a label-verification sample from a cased lot."
    roles: [ComplianceOfficer]
    code: 201
    input: [lot_id, sampled_weight_g]
    output: VerificationSample
    side_effects:
      - "cycle_index stamped from Counter.verification_cycle_index; status DRAFT"
      - "SupplierLot.label_status becomes SAMPLED"
  - method: GET
    path: "/seafood-ops/verification-samples/{sample_id}"
    description: "Reads one verification sample."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, SupplierRep]
    code: 200
    input: []
    output: VerificationSample
    side_effects: []
  - method: GET
    path: "/seafood-ops/verification-samples"
    description: "Lists verification samples filtered by lot, observed species or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, SupplierRep]
    code: 200
    input: ["lot_id?", "observed_species_id?", "status?", "limit?", "offset?"]
    output: VerificationSample[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/verification-samples/{sample_id}/send-to-lab"
    description: "Sends a drawn or disputed sample to the laboratory; from DISPUTED this is a retest and increments retest_count."
    roles: [ComplianceOfficer]
    code: 200
    input: [lab_reference]
    output: VerificationSample
    side_effects:
      - "status DRAFT -> IN_LAB, or DISPUTED -> IN_LAB with retest_count incremented by 1"
  - method: POST
    path: "/seafood-ops/verification-samples/{sample_id}/result"
    description: "Records the laboratory species identification; a mismatch starts cascade A."
    roles: [ComplianceOfficer]
    code: 200
    input: [observed_species_id]
    output: VerificationSample
    side_effects:
      - "status IN_LAB -> MATCH or IN_LAB -> MISMATCH; result_recorded_at stamped"
      - "Supplier lifetime counters and both substitution_risk_index variants recomputed; Supplier.status recomputed"
      - "MATCH: SupplierLot.label_status -> VERIFIED"
      - "MISMATCH: SupplierLot.label_status -> MISMATCHED, a SPECIES_SUBSTITUTION ComplianceViolation is created, PUBLISHED CaseLabels are withdrawn with SPECIES_MISMATCH, a MISLABEL_DESTRUCTION ShrinkEvent is created, the lot's chargeback is assessed and the Supplier chargeback ledger is updated"
  - method: POST
    path: "/seafood-ops/verification-samples/{sample_id}/dispute"
    description: "Supplier disputes a mismatch result and asks for a retest."
    roles: [SupplierRep]
    code: 200
    input: [dispute_reason]
    output: VerificationSample
    side_effects:
      - "status MISMATCH -> DISPUTED with dispute_reason stored"

  # --- SimpDocument ---------------------------------------------------------
  - method: POST
    path: "/seafood-ops/simp-documents"
    description: "Creates a seafood import monitoring record for a covered-species lot."
    roles: [SupplierRep]
    code: 201
    input: [lot_id, harvesting_vessel_name, harvest_date, landing_date, chain_of_custody_ref]
    output: SimpDocument
    side_effects:
      - "status DRAFT; amendment_count 0"
  - method: GET
    path: "/seafood-ops/simp-documents/{document_id}"
    description: "Reads one import monitoring record."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, SupplierRep]
    code: 200
    input: []
    output: SimpDocument
    side_effects: []
  - method: GET
    path: "/seafood-ops/simp-documents"
    description: "Lists import monitoring records filtered by lot or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, SupplierRep]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: SimpDocument[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/simp-documents/{document_id}/submit"
    description: "Submits a draft record, or amends and resubmits one previously found deficient."
    roles: [SupplierRep]
    code: 200
    input: ["chain_of_custody_ref?"]
    output: SimpDocument
    side_effects:
      - "status DRAFT -> SUBMITTED, or DEFICIENT -> SUBMITTED with amendment_count incremented by 1"
  - method: POST
    path: "/seafood-ops/simp-documents/{document_id}/review"
    description: "Accepts or rejects a submitted import monitoring record."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: SimpDocument
    side_effects:
      - "ACCEPT: status -> ACCEPTED, the lot becomes casable, any OPEN SIMP_DEFICIENT violation on the lot becomes CURED"
      - "DEFICIENT: status -> DEFICIENT and a SIMP_DEFICIENT ComplianceViolation with 5 points is created"

  # --- SustainabilityCertification -----------------------------------------
  - method: POST
    path: "/seafood-ops/certifications"
    description: "Files a sustainability program certificate for display at the counter."
    roles: [SupplierRep]
    code: 201
    input: [counter_id, supplier_id, species_id, program_name, certificate_number, valid_from, valid_until, claim_text]
    output: SustainabilityCertification
    side_effects:
      - "status PENDING_REVIEW"
  - method: GET
    path: "/seafood-ops/certifications/{certification_id}"
    description: "Reads one certification."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead, SupplierRep]
    code: 200
    input: []
    output: SustainabilityCertification
    side_effects: []
  - method: GET
    path: "/seafood-ops/certifications"
    description: "Lists certifications filtered by counter, supplier, species or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer, MerchandisingLead, SupplierRep]
    code: 200
    input: ["counter_id?", "supplier_id?", "species_id?", "status?", "limit?", "offset?"]
    output: SustainabilityCertification[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/certifications/{certification_id}/review"
    description: "Approves or rejects a filed certificate."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: SustainabilityCertification
    side_effects:
      - "APPROVE: status PENDING_REVIEW -> ACTIVE"
      - "REJECT: status PENDING_REVIEW -> REVOKED"
  - method: POST
    path: "/seafood-ops/certifications/{certification_id}/enforce"
    description: "Applies a program withdrawal (decision REVOKE) or an expiry sweep (decision SWEEP) to an active certificate and cascades to every label and advertisement carrying its claim."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: SustainabilityCertification
    side_effects:
      - "REVOKE: status ACTIVE -> REVOKED; SWEEP: status ACTIVE -> EXPIRED when logical_clock >= valid_until"
      - "every PUBLISHED CaseLabel carrying this certification becomes WITHDRAWN with withdraw_reason CLAIM_REVOKED and an UNSUBSTANTIATED_CLAIM ComplianceViolation is created"
      - "every PUBLISHED AdvertisedItem carrying this certification becomes RETRACTED with retract_reason CLAIM_REVOKED"

  # --- ShrinkEvent ----------------------------------------------------------
  - method: POST
    path: "/seafood-ops/shrink-events"
    description: "Writes unsold-fresh shrink against a lot, optionally requesting cook-and-sell diversion."
    roles: [SeafoodManager]
    code: 201
    input: [lot_id, reason, shrink_weight_kg, "conversion_requested_kg?"]
    output: ShrinkEvent
    side_effects:
      - "PROVISIONAL_AT_COST variant of shrink_valuation runs; status VALUED"
      - "remaining_weight_kg is NOT decremented until the event is posted"
  - method: GET
    path: "/seafood-ops/shrink-events/{event_id}"
    description: "Reads one shrink event with both valuation variants and the recovery credit."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects: []
  - method: GET
    path: "/seafood-ops/shrink-events"
    description: "Lists shrink events filtered by lot, reason or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: ["lot_id?", "reason?", "status?", "limit?", "offset?"]
    output: ShrinkEvent[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/shrink-events/{event_id}/approve-conversion"
    description: "Grants cook-and-sell diversion for an unsold-fresh shrink event."
    roles: [SeafoodManager]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects:
      - "allowance_kg and approved_conversion_kg written by cook_conversion_recovery; status VALUED -> CONVERSION_APPROVED"
  - method: POST
    path: "/seafood-ops/shrink-events/{event_id}/convert"
    description: "Cooks the approved weight and books the recovery credit."
    roles: [SeafoodManager]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects:
      - "cook_yield_kg and recovery_credit_cents written by cook_conversion_recovery"
      - "final_value_cents written by the FINAL_NET_OF_RECOVERY variant of shrink_valuation; status CONVERSION_APPROVED -> CONVERTED"
  - method: POST
    path: "/seafood-ops/shrink-events/{event_id}/post"
    description: "Posts the shrink to the counter ledger, from CONVERTED or directly from VALUED."
    roles: [SeafoodManager]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects:
      - "from VALUED: final_value_cents = provisional_value_cents and recovery_credit_cents = 0"
      - "SupplierLot.remaining_weight_kg decreases by shrink_weight_kg"
      - "Counter.shrink_gross_cents, shrink_net_cents and recovered_conversion_cents each increase by the matching event field; status -> POSTED"
  - method: POST
    path: "/seafood-ops/shrink-events/{event_id}/reverse"
    description: "Compensating action that backs a posted shrink out of the counter ledger."
    roles: [ComplianceOfficer]
    code: 200
    input: [reversal_note]
    output: ShrinkEvent
    side_effects:
      - "SupplierLot.remaining_weight_kg increases by shrink_weight_kg"
      - "Counter.shrink_gross_cents, shrink_net_cents and recovered_conversion_cents each decrease by the matching event field; status POSTED -> REVERSED"

  # --- ComplianceViolation --------------------------------------------------
  - method: GET
    path: "/seafood-ops/violations/{violation_id}"
    description: "Reads one compliance violation."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: []
  - method: GET
    path: "/seafood-ops/violations"
    description: "Lists compliance violations filtered by counter, lot, category or status."
    roles: [ChainAdmin, SeafoodManager, ComplianceOfficer]
    code: 200
    input: ["counter_id?", "lot_id?", "category?", "status?", "limit?", "offset?"]
    output: ComplianceViolation[]
    side_effects: []
  - method: POST
    path: "/seafood-ops/violations/{violation_id}/cure"
    description: "Records remediation of an open violation, halving its posture weight."
    roles: [SeafoodManager]
    code: 200
    input: [cure_note]
    output: ComplianceViolation
    side_effects:
      - "status OPEN -> CURED; counter_posture_derivation reruns with ceil(points / 2)"
  - method: POST
    path: "/seafood-ops/violations/{violation_id}/expunge"
    description: "Removes a violation from the posture calculation entirely."
    roles: [ComplianceOfficer]
    code: 200
    input: [expunge_note]
    output: ComplianceViolation
    side_effects:
      - "status OPEN or CURED -> EXPUNGED; counter_posture_derivation reruns with 0 points for this violation"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_COUNTER_SCOPE_FORBIDDEN
    http: 403
    condition: "SeafoodManager's X-User-ID is not the Counter.id owning the target resource"
  - id: ERR_SUPPLIER_SCOPE_FORBIDDEN
    http: 403
    condition: "SupplierRep's X-User-ID is not the Supplier.id owning the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceOfficer clearing the sustainability claim is the same user who decided the country-of-origin review"
  - id: ERR_COUNTER_NOT_FOUND
    http: 404
    condition: "counter id does not resolve"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "supplier id does not resolve"
  - id: ERR_SPECIES_NOT_FOUND
    http: 404
    condition: "species id does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot id does not resolve"
  - id: ERR_CASE_LABEL_NOT_FOUND
    http: 404
    condition: "case label id does not resolve"
  - id: ERR_AD_ITEM_NOT_FOUND
    http: 404
    condition: "advertised item id does not resolve"
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "ice bed reading id does not resolve"
  - id: ERR_EXCURSION_NOT_FOUND
    http: 404
    condition: "cold chain excursion id does not resolve"
  - id: ERR_SAMPLE_NOT_FOUND
    http: 404
    condition: "verification sample id does not resolve"
  - id: ERR_SIMP_DOCUMENT_NOT_FOUND
    http: 404
    condition: "import monitoring document id does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification id does not resolve"
  - id: ERR_SHRINK_EVENT_NOT_FOUND
    http: 404
    condition: "shrink event id does not resolve"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "compliance violation id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required body field missing, wrong type, out of declared bounds, or enum value not declared"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not match SupplierLot.version on case label publication"
  - id: ERR_STALE_COUNTER_VERSION
    http: 412
    condition: "expected_counter_version does not match Counter.version on verification cycle close"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "lot intake_status is not in the requested transition's from-set"
  - id: ERR_LABEL_STATE_INVALID
    http: 409
    condition: "lot label_status is not in the requested transition's from-set"
  - id: ERR_CHARGEBACK_STATE_INVALID
    http: 409
    condition: "lot chargeback_status is not in the requested transition's from-set"
  - id: ERR_CASE_LABEL_STATE_INVALID
    http: 409
    condition: "case label is already WITHDRAWN"
  - id: ERR_AD_ITEM_STATE_INVALID
    http: 409
    condition: "advertisement status or the addressed review dimension is not in the requested transition's from-set"
  - id: ERR_EXCURSION_STATE_INVALID
    http: 409
    condition: "excursion is already resolved, or RELEASE was requested for a CRITICAL excursion"
  - id: ERR_SAMPLE_STATE_INVALID
    http: 409
    condition: "verification sample status is not in the requested transition's from-set"
  - id: ERR_SIMP_STATE_INVALID
    http: 409
    condition: "import monitoring document status is not in the requested transition's from-set"
  - id: ERR_CERTIFICATION_STATE_INVALID
    http: 409
    condition: "certification status is not in the requested transition's from-set"
  - id: ERR_SHRINK_STATE_INVALID
    http: 409
    condition: "shrink event status is not in the requested transition's from-set"
  - id: ERR_VIOLATION_STATE_INVALID
    http: 409
    condition: "compliance violation status is not in the requested transition's from-set"
  - id: ERR_RETEST_LIMIT_REACHED
    http: 409
    condition: "sample has already been retested twice"
  - id: ERR_COUNTER_SUSPENDED
    http: 409
    condition: "counter posture is SUSPENDED and the requested operation is not on the remediation whitelist"
  - id: ERR_COUNTER_RESTRICTED
    http: 409
    condition: "counter posture is RESTRICTED and the request is a lot receipt or an advertisement publication"
  - id: ERR_OPEN_EXCURSION_BLOCKS
    http: 409
    condition: "the counter has at least one OPEN cold chain excursion when a case label publication is attempted"
  - id: ERR_SIMP_DOCUMENT_MISSING
    http: 409
    condition: "casing a covered-species lot without an ACCEPTED import monitoring document"
  - id: ERR_FROZEN_DISCLOSURE_CONFLICT
    http: 422
    condition: "lot receipt declares previously_frozen and fresh_claim both true"
  - id: ERR_RELABEL_SPECIES_MISMATCH
    http: 422
    condition: "corrected_species_id does not equal the laboratory-observed species of the latest MISMATCH sample"
  - id: ERR_MARKET_NAME_NOT_ACCEPTABLE
    http: 422
    condition: "corrected_market_name is not in the corrected species' acceptable_market_names"
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 422
    condition: "referenced certification is not ACTIVE or does not match the lot's counter, supplier and species"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "referenced certification's validity window does not contain the logical clock"
  - id: ERR_SPECIES_NOT_CLAIM_ELIGIBLE
    http: 422
    condition: "approving a certification for a species whose sustainability_program_eligible is false"
  - id: ERR_CASE_SLOT_OUT_OF_RANGE
    http: 422
    condition: "case_slot is below 1 or above Counter.case_slot_count"
  - id: ERR_CASE_SLOT_OCCUPIED
    http: 409
    condition: "requested ice bed slot is still occupied, or its 30-minute sanitation buffer has not elapsed since the previous occupant vacated"
  - id: ERR_AD_WINDOW_INVALID
    http: 422
    condition: "ad_end_at is not strictly after ad_start_at"
  - id: ERR_AD_WINDOW_OVERLAP
    http: 409
    condition: "the half-open advertising window overlaps another non-terminal advertisement for the same lot"
  - id: ERR_READING_IN_FUTURE
    http: 422
    condition: "reading_at is later than the logical clock"
  - id: ERR_SIMP_DATE_ORDER
    http: 422
    condition: "harvest_date is later than landing_date"
  - id: ERR_INSUFFICIENT_REMAINING_WEIGHT
    http: 422
    condition: "sold_weight_kg exceeds the lot's remaining_weight_kg"
  - id: ERR_SHRINK_EXCEEDS_REMAINING
    http: 422
    condition: "shrink_weight_kg exceeds the lot's remaining_weight_kg"
  - id: ERR_CONVERSION_ALLOWANCE_EXCEEDED
    http: 422
    condition: "conversion_requested_kg exceeds the allowance_kg computed by cook_conversion_recovery"
  - id: ERR_CONVERSION_NOT_PERMITTED
    http: 422
    condition: "cook-and-sell diversion requested for a previously frozen lot, a non-UNSOLD_FRESH reason, or with conversion_requested_kg of 0.000"
  - id: ERR_SETTLEMENT_AMOUNT_MISMATCH
    http: 422
    condition: "payment_amount_cents does not equal the supplier's outstanding chargeback balance"
  - id: ERR_SUPPLIER_CREDIT_HOLD
    http: 402
    condition: "supplier's outstanding chargeback balance is at least 75000 cents at lot receipt"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ChainAdmin
    description: "Chain-level configuration operator: counters, dealers, species reference data and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /seafood-ops/_clock/set_current_utc"
      - "POST /seafood-ops/counters"
      - "POST /seafood-ops/suppliers"
      - "POST /seafood-ops/species"
    shared_operations:
      - "all GET endpoints"
  - name: SeafoodManager
    description: "Department manager for one counter: lot receipt, casing, sales, case labels, ice-bed readings, shrink and violation cure. X-User-ID is the Counter id."
    identity: "entity_backed:Counter"
    exclusive_operations:
      - "POST /seafood-ops/lots"
      - "POST /seafood-ops/lots/{lot_id}/case"
      - "POST /seafood-ops/lots/{lot_id}/record-sales"
      - "POST /seafood-ops/lots/{lot_id}/relabel"
      - "POST /seafood-ops/case-labels"
      - "POST /seafood-ops/ice-bed-readings"
      - "POST /seafood-ops/shrink-events"
      - "POST /seafood-ops/shrink-events/{event_id}/approve-conversion"
      - "POST /seafood-ops/shrink-events/{event_id}/convert"
      - "POST /seafood-ops/shrink-events/{event_id}/post"
      - "POST /seafood-ops/violations/{violation_id}/cure"
    shared_operations:
      - "POST /seafood-ops/case-labels/{label_id}/withdraw"
      - "counter-scoped GET endpoints"
  - name: ComplianceOfficer
    description: "Regulatory reviewer: verification sampling, import monitoring review, certification review and enforcement, advertisement review, excursion disposition, cycle close, reversals and expungement."
    identity: "opaque"
    exclusive_operations:
      - "POST /seafood-ops/counters/{counter_id}/close-verification-cycle"
      - "POST /seafood-ops/verification-samples"
      - "POST /seafood-ops/verification-samples/{sample_id}/send-to-lab"
      - "POST /seafood-ops/verification-samples/{sample_id}/result"
      - "POST /seafood-ops/simp-documents/{document_id}/review"
      - "POST /seafood-ops/certifications/{certification_id}/review"
      - "POST /seafood-ops/certifications/{certification_id}/enforce"
      - "POST /seafood-ops/ad-items/{item_id}/clear-cool"
      - "POST /seafood-ops/ad-items/{item_id}/clear-claim"
      - "POST /seafood-ops/excursions/{excursion_id}/resolve"
      - "POST /seafood-ops/shrink-events/{event_id}/reverse"
      - "POST /seafood-ops/lots/{lot_id}/reverse-chargeback"
      - "POST /seafood-ops/violations/{violation_id}/expunge"
    shared_operations:
      - "POST /seafood-ops/case-labels/{label_id}/withdraw"
      - "POST /seafood-ops/ad-items/{item_id}/retract"
      - "all GET endpoints"
  - name: MerchandisingLead
    description: "Advertising owner: drafts, publishes, closes and retracts counter advertisements."
    identity: "opaque"
    exclusive_operations:
      - "POST /seafood-ops/ad-items"
      - "POST /seafood-ops/ad-items/{item_id}/publish"
