            - { call: "GET /reforestation/storage-units/${unit_id}", payload: {}, as: NurseryManager, captures: { load_5: $.data.current_load } }
            - { call: "GET /reforestation/storage-placements/${p2}", payload: {}, as: NurseryManager, captures: { p2_status: $.data.status, p2_wd: $.data.withdrawn_quantity } }
            - { call: "GET /reforestation/storage-placements/${p3}", payload: {}, as: NurseryManager, captures: { p3_wd: $.data.withdrawn_quantity } }
          assert:
            - "load_1 == 20000 and load_2 == 25000 (place forward actions)"
