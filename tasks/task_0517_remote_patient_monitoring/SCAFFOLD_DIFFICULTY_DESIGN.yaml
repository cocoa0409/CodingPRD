  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: breach_evaluation_multi_input_nonlinear_bands
        grounds:
          - calculations.breach_evaluation
          - entities.VitalsReading.fields.breach_flag
          - entities.ThresholdAlert.fields.severity
          - entities.CarePlan.fields.status
        distinguishing_aspect: |
          Mode (a): breach severity is a non-linear function of >=3 inputs (device_type, reading_value,
          secondary_value, and presence of an ACTIVE CarePlan) with conditional band selection — a BP
          reading of systolic 185 / diastolic 95 lands CRITICAL via the systolic>=180 branch even though
          diastolic alone is only WARNING-band, exercising nested branch interaction.
        test_recipe:
          setup:
            - "Patient ENROLLED with ACTIVE BP care plan and ACTIVE BP_CUFF device; clock in 2026-06."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Comm A", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-BR-1", full_name: "Bree Ach" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-BR-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CareCoordinator
          trigger:
            - call: "POST /patients/${pid}/vitals"
              payload: { device_id: "${dev_id}", reading_value: 185, secondary_value: 95, measured_at: "2026-06-10T08:00:00Z" }
              as: Clinician
              captures: { vr_id: $.data.id }
          assert:
            - "VitalsReading.${vr_id}.breach_flag == true"
            - "a ThresholdAlert with vitals_reading_id == ${vr_id} exists with severity == CRITICAL"

      - name: care_time_daily_cap_ordered_allocation
        grounds:
          - calculations.care_time_aggregation
          - entities.CareActivity.fields.counted_minutes
          - entities.BillingPeriod.fields.provisional_total_minutes
        distinguishing_aspect: |
          Mode (c): on a single calendar day three activities (30, 25, 20 min) sum to 75 but the 60-minute
          daily cap forces an order-pinned waterfall allocation (ascending performed_at, then created_at) —
          counted_minutes becomes 30, 25, 5; reorder would change the per-activity result, so the
          evaluation order must be explicit and the period total is a well-defined 60.
        test_recipe:
          setup:
            - "Patient ENROLLED with ACTIVE care plan, OPEN period 2026-06; clock in 2026-06."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Comm B", payer_type: "COMMERCIAL", rate_99453_cents: 2000, rate_99454_cents: 4000, rate_99457_cents: 5000 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CAP-1", full_name: "Cap Ped" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "CCM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "REVIEW", minutes: 30, performed_at: "2026-06-03T09:00:00Z" }
              as: Clinician
              captures: { ca1: $.data.id }
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "OUTREACH", minutes: 25, performed_at: "2026-06-03T11:00:00Z" }
              as: Clinician
              captures: { ca2: $.data.id }
          trigger:
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-1", activity_type: "EDUCATION", minutes: 20, performed_at: "2026-06-03T14:00:00Z" }
              as: Clinician
              captures: { ca3: $.data.id }
          assert:
            - "CareActivity.${ca1}.counted_minutes == 30"
            - "CareActivity.${ca2}.counted_minutes == 25"
            - "CareActivity.${ca3}.counted_minutes == 5"
            - "BillingPeriod.${bp_id}.provisional_total_minutes == 60"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: threshold_alert_escalated_reverts_to_acknowledged_cycle
        grounds:
          - state_machines.ThresholdAlert.OPEN_to_ESCALATED
          - state_machines.ThresholdAlert.ESCALATED_to_ACKNOWLEDGED
          - state_machines.ReviewTask.QUEUED_to_IN_REVIEW
        distinguishing_aspect: |
          ThresholdAlert is non-linear (branch+revert cycle): OPEN forks to ESCALATED, and claiming the
          spawned ReviewTask reverts ESCALATED -> ACKNOWLEDGED — a back-edge a linear pipeline cannot
          express. This cycle lives on ThresholdAlert (distinct from the Claim cycle below).
        test_recipe:
          setup:
            - "Patient ENROLLED with ACTIVE care plan + ACTIVE BP_CUFF; a CRITICAL alert escalated, spawning an URGENT ReviewTask in QUEUED."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-AL", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877 }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-AL-1", full_name: "Al Ert" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "RPM", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-AL-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/vitals"
              payload: { device_id: "${dev_id}", reading_value: 200, secondary_value: 130, measured_at: "2026-06-10T08:00:00Z" }
              as: Clinician
              captures: { vr_id: $.data.id }
            - call: "GET /alerts"
              payload: {}
              as: Clinician
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /alerts/${alert_id}/escalate"
              payload: {}
              as: Clinician
            - call: "GET /review-tasks"
              payload: {}
              as: Physician
              captures: { rt_id: "$.data[0].id" }
          trigger:
            - call: "POST /review-tasks/${rt_id}/claim"
              payload: {}
              as: Physician
              as_user_id: "phys-A"
          assert:
            - "ReviewTask.${rt_id}.status == IN_REVIEW"
            - "ThresholdAlert.${alert_id}.status == ACKNOWLEDGED"

      - name: claim_denied_then_resubmitted_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.DENIED_to_SUBMITTED
          - state_machines.BillingPeriod.FINALIZED_to_CLAIMED
        distinguishing_aspect: |
          Claim is non-linear via the SUBMITTED -> DENIED -> SUBMITTED cycle (a resubmit back-edge);
          this cyclic machine is on the Claim entity, structurally distinct from the ThresholdAlert
          branch+revert cycle above.
        test_recipe:
          setup:
            - "A FINALIZED period with finalized_total_cents == 6842 (99453+99457), claim submitted then denied (period back to FINALIZED)."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "P-CL", payer_type: "MEDICARE", rate_99453_cents: 1965, rate_99454_cents: 4774, rate_99457_cents: 4877, requires_active_consent: false }
              as: BillingSpecialist
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_id: "${payer_id}", mrn: "M-CL-1", full_name: "Cl Aim" }
              as: CareCoordinator
              captures: { pid: $.data.id }
            - call: "POST /patients/${pid}/consents"
              payload: { consent_type: "BOTH", effective_at: "2026-05-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-plans"
              payload: { diagnosis_code: "I10", goal_text: "BP", required_care_minutes: 20 }
              as: Physician
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pid}/care-plans/${plan_id}/activate"
              payload: {}
              as: Physician
            - call: "POST /patients/${pid}/enroll"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/billing-periods"
              payload: { period_year: 2026, period_month: 6 }
              as: BillingSpecialist
              captures: { bp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /patients/${pid}/devices"
              payload: { device_type: "BP_CUFF", serial_number: "SN-CL-1" }
              as: CareCoordinator
              captures: { dev_id: $.data.id }
            - call: "POST /patients/${pid}/devices/${dev_id}/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /patients/${pid}/care-activities"
              payload: { billing_period_id: "${bp_id}", clinician_user_id: "clin-2", activity_type: "REVIEW", minutes: 20, performed_at: "2026-06-03T10:00:00Z" }
              as: Clinician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bp_v: $.data.version }
            - call: "POST /billing-periods/${bp_id}/finalize"
