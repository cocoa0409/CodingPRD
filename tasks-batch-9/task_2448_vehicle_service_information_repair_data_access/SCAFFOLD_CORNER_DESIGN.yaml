        grounds:
          - state_machines.PublicationVersion.axes
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / publication_version_parallel_axes_move_independently"
          rationale: "That difficulty instance already drives review_status and distribution_status one axis at a time and asserts the four combined states, so a separate corner test would duplicate it exactly."

      - name: programming_job_cyclic_revalidation_loop
        claim_type: cyclic_loop
        grounds:
          - state_machines.ModuleProgrammingJob.REVALIDATION_REQUIRED_to_IN_PROGRESS
          - entities.ModuleProgrammingJob.fields.repin_count
        excluded_because:
          difficulty_instance: "non_linear_state_machine / programming_job_revalidation_cycle_returns_to_in_progress_on_repin"
          rationale: "The cycle back to IN_PROGRESS, the repin_count increment and the pin-count hand-off are all asserted there; repeating them here would add no independent coverage."

