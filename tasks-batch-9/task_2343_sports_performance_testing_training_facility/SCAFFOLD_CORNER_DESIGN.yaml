              payload: { start_at: "2026-09-15T16:00:00Z", end_at: "2026-09-15T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
