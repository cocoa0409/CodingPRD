# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3086_peer_group_microlending_center_meetings_joint_liability
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners §1.8 already covers appear as
# excluded_because stubs.
#
# Number pins: cycle-1 loan 100000c -> installment 4600c, savings 200c,
# floor 4801c; provisional score at disbursement 720.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Canonical fixture chain. The anchors below define the reusable call blocks
  # referenced throughout this file. Semantics: empty-DB -> clock at default
  # 2026-09-01T00:00:00Z -> Harbor Branch -> manager Dora Field -> Tuesday
  # center -> group Harbor Group -> 5 members (peers P1..P4 + applicant A)
  # -> 2 completed training sessions (group ACTIVE, members ELIGIBLE)
  # -> DRAFT 100000c application -> VOTING -> 4 unanimous APPROVE votes
  # -> APPROVED -> DISBURSED (Loan: installment 4600c, savings 200c,
  #    outstanding 110600c, next due 2026-09-08T00:00:00Z; savings account
  #    OPEN at 0; PROVISIONAL bureau report 720) -> Tuesday meeting
  #    2026-09-08T10:00:00Z OPEN, all five members PRESENT -> optional
  #    collections -> close.
  - section: entities
    instances:
      - name: fixture_anchor_chain_not_a_test
        claim_type: Creation
        grounds:
          - entities.Branch
        distinguishing_aspect: "Anchor-definition holder (the setup chain defines the YAML anchors reused across this file) that doubles as a branch round-trip check: after the full chain, GET /branches/{id} returns the branch with active_member_count == 5 and total_manager_caseload == 5."
        test_recipe:
          setup: ["Anchor definitions only."]
          setup_api_calls:
            - &c_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - &c_branch_def
              call: "POST /branches"
              payload: { name: "Harbor Branch" }
              as: ProgramAdmin
              captures: { c_branch_id: $.data.id }
            - &c_mgr
              call: "POST /center-managers"
              payload: { branch_id: "${c_branch_id}", full_name: "Dora Field", hired_on: "2026-08-01" }
              as: ProgramAdmin
              captures: { c_mgr_id: $.data.id }
            - &c_center
              call: "POST /centers"
              payload: { branch_id: "${c_branch_id}", center_manager_id: "${c_mgr_id}", name: "Harbor Center", meeting_day_of_week: 1 }
              as: ProgramAdmin
              captures: { c_center_id: $.data.id }
            - &c_group
              call: "POST /peer-groups"
              payload: { center_id: "${c_center_id}", name: "Harbor Group" }
              as: FieldOfficer
              captures: { c_group_id: $.data.id }
            - &c_m_app
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "App One", national_id: "NID-901" }
              as: FieldOfficer
              captures: { c_m1: $.data.id }
            - &c_peer_1
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Peer One", national_id: "NID-911" }
              as: FieldOfficer
              captures: { c_p1: $.data.id }
            - &c_peer_2
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Peer Two", national_id: "NID-912" }
              as: FieldOfficer
              captures: { c_p2: $.data.id }
            - &c_peer_3
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Peer Three", national_id: "NID-913" }
              as: FieldOfficer
              captures: { c_p3: $.data.id }
            - &c_peer_4
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Peer Four", national_id: "NID-914" }
              as: FieldOfficer
              captures: { c_p4: $.data.id }
            - &c_add_1
              call: "POST /peer-groups/${c_group_id}/members"
              payload: { member_id: "${c_m1}" }
              as: FieldOfficer
            - &c_add_2
              call: "POST /peer-groups/${c_group_id}/members"
              payload: { member_id: "${c_p1}" }
              as: FieldOfficer
            - &c_add_3
              call: "POST /peer-groups/${c_group_id}/members"
              payload: { member_id: "${c_p2}" }
              as: FieldOfficer
            - &c_add_4
              call: "POST /peer-groups/${c_group_id}/members"
              payload: { member_id: "${c_p3}" }
              as: FieldOfficer
            - &c_add_5
              call: "POST /peer-groups/${c_group_id}/members"
              payload: { member_id: "${c_p4}" }
              as: FieldOfficer
            - &c_tr1
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${c_group_id}", center_manager_id: "${c_mgr_id}", start_time: "2026-09-02T09:00:00Z", end_time: "2026-09-02T10:00:00Z" }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { c_tr1_id: $.data.id }
            - &c_tr1c
              call: "POST /group-training-sessions/${c_tr1_id}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_tr2
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${c_group_id}", center_manager_id: "${c_mgr_id}", start_time: "2026-09-03T09:00:00Z", end_time: "2026-09-03T10:00:00Z" }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { c_tr2_id: $.data.id }
            - &c_tr2c
              call: "POST /group-training-sessions/${c_tr2_id}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_app
              call: "POST /peer-groups/${c_group_id}/loan-applications"
              payload: { member_id: "${c_m1}", requested_amount_cents: 100000 }
              as: FieldOfficer
              captures: { c_app_id: $.data.id }
            - &c_submit
              call: "POST /loan-applications/${c_app_id}/submit"
              payload: {}
              as: FieldOfficer
            - &c_vote1
              call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p1}"
            - &c_vote2
              call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p2}"
            - &c_vote3
              call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p3}"
            - &c_vote4
              call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p4}"
            - &c_disburse
              call: "POST /loan-applications/${c_app_id}/disburse"
              payload: {}
              as: BranchManager
            - &c_loan1
              call: "GET /loan-applications/${c_app_id}/loan"
              payload: {}
              as: BranchManager
              captures: { c_loan1_id: "$.data[0].id", c_loan1_ver: "$.data[0].version" }
            - &c_mt_a
              call: "POST /center-meetings"
              payload: { center_id: "${c_center_id}", scheduled_start: "2026-09-08T10:00:00Z", scheduled_end: "2026-09-08T11:00:00Z" }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { c_mt_a_id: $.data.id }
            - &c_mt_a_open
              call: "POST /center-meetings/${c_mt_a_id}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_att1
              call: "POST /center-meetings/${c_mt_a_id}/attendance"
              payload: { member_id: "${c_m1}", present: true }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_att2
              call: "POST /center-meetings/${c_mt_a_id}/attendance"
              payload: { member_id: "${c_p1}", present: true }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_att3
              call: "POST /center-meetings/${c_mt_a_id}/attendance"
              payload: { member_id: "${c_p2}", present: true }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_att4
              call: "POST /center-meetings/${c_mt_a_id}/attendance"
              payload: { member_id: "${c_p3}", present: true }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_att5
              call: "POST /center-meetings/${c_mt_a_id}/attendance"
              payload: { member_id: "${c_p4}", present: true }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_coll_min
              call: "POST /center-meetings/${c_mt_a_id}/collections"
              payload: { member_id: "${c_m1}", loan_id: "${c_loan1_id}", amount_cents: 4801 }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { c_txn_min: $.data.id }
            - &c_coll_full
              call: "POST /center-meetings/${c_mt_a_id}/collections"
              payload: { member_id: "${c_m1}", loan_id: "${c_loan1_id}", amount_cents: 110800 }
              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { c_txn_full: $.data.id }
            - &c_mt_a_close
              call: "POST /center-meetings/${c_mt_a_id}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${c_mgr_id}"
            - &c_clock_plus30
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /branches/${c_branch_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Branch.${c_branch_id}.active_member_count == 5 (five group members, all ELIGIBLE or ACTIVE_BORROWER)"
            - "Branch.${c_branch_id}.total_manager_caseload == 5 (single manager carries the whole center)"
            - "Branch.${c_branch_id}.tier == SMALL"

  - section: entities
    instances:

      - name: branch_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Branch
          - endpoints.POST_/branches
        distinguishing_aspect: "A branch created with only a name returns 201 with tier SMALL, active_member_count 0, total_manager_caseload 0, version 1, and server-minted id/created_at/updated_at — computed fields are never client-supplied."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /branches"
              payload: { name: "Harbor Branch" }
              as: ProgramAdmin
              captures: { c_branch: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Branch.${c_branch}.tier == SMALL"
            - "Branch.${c_branch}.active_member_count == 0 and total_manager_caseload == 0"
            - "Branch.${c_branch}.version == 1 and id, created_at, updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: member_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/members
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three members on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the filtered set, and the status filter composes with pagination."
        test_recipe:
          setup:
            - "Logical clock at default. One branch; three RECRUITED members."
          setup_api_calls:
            - &c_branch
              call: "POST /branches"
              payload: { name: "Harbor Branch" }
              as: ProgramAdmin
              captures: { c_branch_id: $.data.id }
            - &c_m_a
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Ann A", national_id: "NID-A" }
              as: FieldOfficer
            - &c_m_b
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Bob B", national_id: "NID-B" }
              as: FieldOfficer
            - &c_m_c
              call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "Cat C", national_id: "NID-C" }
              as: FieldOfficer
          trigger:
            - call: "GET /members"
              payload: { branch_id: "${c_branch_id}", status: "RECRUITED" }
              query: { limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /members?branch_id=${c_branch_id}&status=RECRUITED&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /members with no parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: member_get_with_unknown_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/members/{id}
          - errors.ERR_MEMBER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated member id returns 404 ERR_MEMBER_NOT_FOUND — the entity-specific code, not a generic 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/3f6b2a1c-9e8d-4c7b-a5f4-1d2e3c4b5a69"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the response status is 404 with error_id ERR_MEMBER_NOT_FOUND"
            - "response_type is error and data.message is present"

      - name: member_create_missing_national_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.national_id
          - endpoints.POST_/members
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required national_id returns 400 ERR_INVALID_REQUEST and creates no member."
        test_recipe:
          setup: ["One branch exists."]
          setup_api_calls:
            - *c_branch
          trigger:
            - call: "POST /members"
              payload: { branch_id: "${c_branch_id}", full_name: "No Id" }
              as: FieldOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST"
            - "GET /members?branch_id=${c_branch_id} returns total_count == 0"

      - name: member_create_duplicate_national_id_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.national_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "national_id is globally unique: a second member reusing NID-A is rejected with 400 ERR_INVALID_REQUEST even under a different branch."
        test_recipe:
          setup: ["Two branches; member Ann A with national_id NID-A in branch 1."]
          setup_api_calls:
            - *c_branch
            - *c_m_a
            - call: "POST /branches"
              payload: { name: "Second Branch" }
              as: ProgramAdmin
              captures: { c_branch2: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { branch_id: "${c_branch2}", full_name: "Ann Again", national_id: "NID-A" }
              as: FieldOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST"

      - name: consensus_vote_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ConsensusVote
        distinguishing_aspect: "ConsensusVote declares common_fields: false — votes carry id and created_at only; there is no update or delete endpoint and no version field on the vote resource."
        test_recipe:
          setup:
            - "Group ACTIVE with applicant A and peer P; application in VOTING."
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
            - *c_m_app
            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_app
            - *c_submit
          trigger:
            - call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p1}"
              captures: { vote_id: $.data.id }
          assert:
            - "the response status is 201"
            - "the vote body contains id and created_at"
            - "the vote body contains no version field and no updated_at field"

      - name: savings_account_reverse_lookup_before_first_disbursement_is_empty
        claim_type: Parent Relationships
        grounds:
          - endpoints.GET_/members/{id}/savings-account
          - entities.SavingsAccount.fields.member_id
        distinguishing_aspect: "The 1:1 savings account exists only after first disbursement: before any loan, GET /members/{id}/savings-account returns an empty array (0-or-1 cardinality is always an array), not a 404."
        test_recipe:
          setup: ["One branch; one RECRUITED member with no loans."]
          setup_api_calls:
            - *c_branch
            - *c_m_a
          trigger:
            - call: "GET /members/${c_m_a_id}/savings-account"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the response status is 200, response_type is array, and data is an empty array with total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: submit_on_voting_application_returns_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.LoanApplication.DRAFT_to_VOTING
          - errors.ERR_APPLICATION_NOT_DRAFT
        distinguishing_aspect: "Submitting an already-VOTING application fails with 409 ERR_APPLICATION_NOT_DRAFT and no second voting_deadline is minted."
        test_recipe:
          setup: ["Group ACTIVE; application for applicant A in VOTING."]
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
            - *c_m_app
            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_app
            - *c_submit
          trigger:
            - call: "POST /loan-applications/${c_app_id}/submit"
              payload: {}
              as: FieldOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_APPLICATION_NOT_DRAFT"
            - "LoanApplication.${c_app_id}.status == VOTING with the original voting_deadline"

      - name: vote_on_rejected_application_returns_not_voting
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LoanApplication.VOTING_to_REJECTED
          - errors.ERR_APPLICATION_NOT_VOTING
        distinguishing_aspect: "REJECTED is terminal: a peer vote cast after a REJECT decision fails with 409 ERR_APPLICATION_NOT_VOTING."
        test_recipe:
          setup: ["Group ACTIVE; application in VOTING; peer P1 has cast REJECT."]
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
            - *c_m_app
            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_app
            - *c_submit
            - call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "REJECT" }
              as: Member
              as_user_id: "${c_p1}"
          trigger:
            - call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_APPLICATION_NOT_VOTING"
            - "LoanApplication.${c_app_id}.status == REJECTED"

      - name: double_vote_returns_already_voted
        claim_type: Idempotency
        grounds:
          - errors.ERR_ALREADY_VOTED
          - validations[priority=6]
        distinguishing_aspect: "The same voter casting twice on the same application is rejected with 409 ERR_ALREADY_VOTED — one member, one vote."
        test_recipe:
          setup: ["Group ACTIVE; application in VOTING; P1 already voted APPROVE."]
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
            - *c_m_app
            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_app
            - *c_submit
            - call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${c_p1}"
          trigger:
            - call: "POST /loan-applications/${c_app_id}/votes"
              payload: { decision: "REJECT" }
              as: Member
              as_user_id: "${c_p1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_ALREADY_VOTED"
            - "GET /loan-applications/${c_app_id}/votes returns exactly 1 vote"

      - name: meeting_close_twice_returns_meeting_not_open
        claim_type: invalid_transition
        grounds:
          - state_machines.CenterMeeting.OPEN_to_CLOSED
          - errors.ERR_MEETING_NOT_OPEN
        distinguishing_aspect: "A second close on a CLOSED meeting fails with 409 ERR_MEETING_NOT_OPEN and the absence auto-marking does not run twice (streaks unchanged)."
        test_recipe:
          setup: ["Meeting mt opened with all five members present, then closed."]
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
            - *c_m_app
            - *c_add_1
            - *c_add_2
            - *c_add_3
            - *c_add_4
            - *c_add_5
            - *c_tr1
            - *c_tr1c
            - *c_tr2
            - *c_tr2c
            - *c_mt_a
            - *c_mt_a_open
            - *c_att1
            - *c_att2
            - *c_att3
            - *c_att4
            - *c_att5
            - *c_mt_a_close
          trigger:
            - call: "POST /center-meetings/${c_mt_a_id}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${c_mgr_id}"
