# =============================================================================
# §1.9 Scaffold Corner Design — task 2404 Children's Online Privacy Compliance
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked section-by-section against
# references/claim-extraction-guide.md. Depth lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8); corners already asserted there are
# emitted here as `excluded_because:` stubs with no test_recipe.
#
# Conventions shared with §1.8:
#   * The logical clock starts at 2026-08-01T00:00:00Z (declared on
#     POST /_clock/set_current_utc); recipes that do not care about time simply
#     never move it.
#   * Every payload carrying expected_service_version reads the version with an
#     immediately preceding GET /online-services/{id}.
#   * The 7 required notice content keys are always written out in full:
#     OPERATOR_IDENTITY_CONTACT, ELEMENTS_COLLECTED, USE_PURPOSES,
#     THIRD_PARTY_DISCLOSURE, PARENTAL_RIGHTS, NO_CONDITIONING_OF_PARTICIPATION,
#     RETENTION_AND_DISPOSAL.
#   * Pre-computed literals reused below:
#       SUBJECT_MATTER MODERATE alone            -> design_score 0.60 -> MIXED_AUDIENCE
#       SUBJECT_MATTER ABSENT alone              -> design_score 0.00 -> GENERAL_AUDIENCE
#       collected_at 2026-08-01 + 30 days        -> disposal_due_at 2026-08-31T00:00:00Z
#       notice_delivered_at 2026-08-01 + 14 days -> verification_deadline_at 2026-08-15T00:00:00Z
#       certified_at 2026-08-01 + 365 days       -> expires_at 2027-08-01T00:00:00Z
#       expires_at 2027-08-01 + 30 grace days    -> LAPSED from 2027-08-31T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: service_creation_returns_declared_defaults_and_version_one
        claim_type: creation
        grounds:
          - endpoints["POST /online-services"]
          - entities.OnlineService
          - entities.OnlineService.fields.determination_status
          - entities.OnlineService.fields.compliance_posture
        distinguishing_aspect: "A freshly registered OnlineService returns 201 with every declared field present: the four input fields echoed, version 1, determination_status NOT_ASSESSED, compliance_posture OPEN, safe_harbor_status NOT_ENROLLED, design_score 0.00, audience_child_share null and all seven counters at 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock has not been moved, so it reads its declared default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services"
              payload: { name: "Fresh Register Kids", operator_organization: "Fresh Register Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id, ver: $.data.version, det: $.data.determination_status, posture: $.data.compliance_posture, score: $.data.design_score, share: $.data.audience_child_share, sh: $.data.safe_harbor_status, override: $.data.posture_override, evidence_counter: $.data.evidence_sequence_counter, run_counter: $.data.compliance_run_sequence, created: $.data.created_at }
          assert:
            - "HTTP 201 and ${svc_id} is a non-empty string"
            - "${ver} == 1 and ${created} == 2026-08-01T00:00:00Z"
            - "${det} == NOT_ASSESSED and ${posture} == OPEN and ${override} == null"
            - "${score} == 0.00 and ${share} == null and ${sh} == NOT_ENROLLED"
            - "${evidence_counter} == 0 and ${run_counter} == 0"
            - "OnlineService.${svc_id}.active_consent_count == 0, granted_disclosure_consent_count == 0, live_child_data_element_count == 0, lifetime_collected_element_count == 0, third_party_exposure_points == 0, open_audit_count == 0, audit_decision_count == 0"
            - "name == 'Fresh Register Kids', operator_organization == 'Fresh Register Media', service_category == GAME, subject_matter_code == FAMILY_MIXED"

      - name: service_retrieval_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints["GET /online-services/{id}"]
          - entities.OnlineService.fields.design_score
        distinguishing_aspect: "GET /online-services/{id} returns exactly the row the determination left behind — design_score 0.60, determination_status MIXED_AUDIENCE, determination_variant_applied DESIGN_FIRST, determination_evaluated_at 2026-08-01T00:00:00Z — without re-running any calculation or bumping version."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service with a single SUBJECT_MATTER MODERATE design row and a completed determination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Readback Kids", operator_organization: "Readback Media", service_category: "VIDEO_PLATFORM", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { ver_after_det: $.data.version }
          trigger:
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: PrivacyEngineer
              captures: { got_id: $.data.id, got_score: $.data.design_score, got_det: $.data.determination_status, got_variant: $.data.determination_variant_applied, got_eval: $.data.determination_evaluated_at, got_ver: $.data.version }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: SafeHarborCertifier
              captures: { got_ver_again: $.data.version }
          assert:
            - "${got_id} == ${svc_id} and ${got_score} == 0.60 and ${got_det} == MIXED_AUDIENCE"
            - "${got_variant} == DESIGN_FIRST (no verified PANEL sample exists) and ${got_eval} == 2026-08-01T00:00:00Z"
            - "${got_ver} == ${ver_after_det} and ${got_ver_again} == ${got_ver} (reads never advance version)"

      - name: service_listing_applies_limit_offset_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints["GET /online-services"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list endpoint reports limit, offset, total_count and has_more over the whole filtered set, not the page: with three services, limit 2 / offset 0 yields 2 rows with has_more true and total_count 3, offset 2 yields 1 row with has_more false, and omitting limit applies the declared default of 10 so has_more is false."
        test_recipe:
          setup:
            - "Exactly three OnlineService rows, created in order A, B, C at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Page A", operator_organization: "Paging Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_a: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Page B", operator_organization: "Paging Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_b: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Page C", operator_organization: "Paging Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_c: $.data.id }
          trigger:
            - call: "GET /online-services"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { p1_limit: $.meta.limit, p1_offset: $.meta.offset, p1_total: $.meta.total_count, p1_more: $.meta.has_more, p1_first: "$.data[0].id" }
            - call: "GET /online-services"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { p2_total: $.meta.total_count, p2_more: $.meta.has_more, p2_first: "$.data[0].id" }
            - call: "GET /online-services"
              payload: {}
              as: SafeHarborAssessor
              captures: { d_limit: $.meta.limit, d_offset: $.meta.offset, d_total: $.meta.total_count, d_more: $.meta.has_more }
            - call: "GET /online-services"
              payload: { determination_status: "MIXED_AUDIENCE", limit: 10, offset: 0 }
              as: ComplianceOfficer
              captures: { f_total: $.meta.total_count, f_more: $.meta.has_more }
          assert:
            - "${p1_limit} == 2 and ${p1_offset} == 0 and ${p1_total} == 3 and ${p1_more} == true and the page holds exactly 2 rows"
            - "${p1_first} == ${svc_a} (created_at ASC ordering; ids are never used as an ordering key)"
            - "${p2_total} == 3 and ${p2_more} == false and the page holds exactly 1 row with ${p2_first} == ${svc_c}"
            - "${d_limit} == 10 and ${d_offset} == 0 and ${d_total} == 3 and ${d_more} == false (declared pagination defaults)"
            - "${f_total} == 0 and ${f_more} == false (no service has been determined, so the determination_status filter empties the set)"

      - name: service_get_with_unknown_id_reports_missing_service
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_SERVICE_NOT_FOUND]
        distinguishing_aspect: "An id that resolves to no row is a 404 with ERR_SERVICE_NOT_FOUND from the priority-40 existence pass, distinct from the 422 body-shape failures and from the 403 authorization failures that sit above it."
        test_recipe:
          setup:
            - "One unrelated service exists so the collection is non-empty; the requested id belongs to no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Existing Service", operator_organization: "Existing Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
          trigger:
            - call: "GET /online-services/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ok_id: $.data.id }
          assert:
            - "${err_id} == ERR_SERVICE_NOT_FOUND with HTTP 404 and ${err_msg} is a non-empty string"
            - "The error body carries response_type 'error' and no entity fields"
            - "${ok_id} == ${svc_id} (the real id still resolves; nothing was consumed by the failed lookup)"

      - name: notice_create_missing_content_keys_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=65]
          - endpoints["POST /parental-notices"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "content_keys is a required input on POST /parental-notices with no default; omitting it is a priority-65 ERR_INVALID_REQUEST (422) and must NOT be silently treated as an empty list that then fails the priority-112 completeness check on publish."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service, version read immediately before the create so the OCC field is current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Required Field Kids", operator_organization: "Required Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice with no content keys", delivery_channel: "EMAIL", expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv_after: $.data.version }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST with HTTP 422"
            - "${sv_after} == ${sv1} (a rejected create does not advance the parent version, so the same expected_service_version is still valid)"
            - "GET /online-services/${svc_id}/parental-notices returns total_count 0"

      - name: program_create_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SafeHarborProgram.fields.annual_assessment_required
          - entities.SafeHarborProgram.fields.assessment_validity_days
          - entities.SafeHarborProgram.fields.assessment_grace_days
          - endpoints["POST /safe-harbor-programs"]
        distinguishing_aspect: "Omitting the three optional program fields yields exactly the declared defaults true / 365 / 30 — not null, not 0 — while regulator_approved has no default and must be supplied."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Default Seal Program", regulator_approved: true }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id, req: $.data.annual_assessment_required, validity: $.data.assessment_validity_days, grace: $.data.assessment_grace_days, approved: $.data.regulator_approved, ver: $.data.version }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Explicit Seal Program", regulator_approved: true, annual_assessment_required: false, assessment_validity_days: 180, assessment_grace_days: 0 }
              as: ComplianceOfficer
              captures: { prog2_id: $.data.id, req2: $.data.annual_assessment_required, validity2: $.data.assessment_validity_days, grace2: $.data.assessment_grace_days }
          assert:
            - "${req} == true and ${validity} == 365 and ${grace} == 30 and ${approved} == true and ${ver} == 1"
            - "${req2} == false and ${validity2} == 180 and ${grace2} == 0 (explicit values win over defaults, including the falsy ones)"
            - "SafeHarborProgram.${prog_id} and SafeHarborProgram.${prog2_id} are distinct rows"

      - name: service_create_with_client_supplied_computed_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - entities.OnlineService.fields.design_score
          - entities.OnlineService.fields.compliance_posture
          - entities.OnlineService.fields.determination_status
        distinguishing_aspect: "design_score, determination_status and compliance_posture are computed/system fields: values for them in the create body are ignored, the row is born 0.00 / NOT_ASSESSED / OPEN, and only POST /{id}/determination can move the score to 0.60."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /online-services"
              payload: { name: "Injected Score Kids", operator_organization: "Injection Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED", design_score: 0.99, determination_status: "GENERAL_AUDIENCE", compliance_posture: "OPEN", live_child_data_element_count: 42 }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id, score: $.data.design_score, det: $.data.determination_status, live: $.data.live_child_data_element_count }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { score_after: $.data.design_score, det_after: $.data.determination_status }
          assert:
            - "${score} == 0.00 (the supplied 0.99 is ignored) and ${det} == NOT_ASSESSED (the supplied GENERAL_AUDIENCE is ignored) and ${live} == 0 (the supplied 42 is ignored)"
            - "${score_after} == 0.60 and ${det_after} == MIXED_AUDIENCE (only the declared calculation writes these fields)"

      - name: evidence_create_stamps_system_sequence_and_timestamps
        claim_type: system_fields
        grounds:
          - entities.DeterminationEvidence.fields.evidence_sequence
          - entities.OnlineService.fields.evidence_sequence_counter
          - endpoints["POST /determination-evidence"]
        distinguishing_aspect: "evidence_sequence is a per-service monotonic system stamp taken from OnlineService.evidence_sequence_counter, not a client input and not a global counter: two services each start at 1, and a client-supplied evidence_sequence is ignored."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two services with no evidence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Sequence One", operator_organization: "Sequence Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_1: $.data.id }
            - call: "POST /online-services"
              payload: { name: "Sequence Two", operator_organization: "Sequence Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_2: $.data.id }
          trigger:
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_1}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
              captures: { e1: $.data.id, e1_seq: $.data.evidence_sequence, e1_created: $.data.created_at }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_1}", evidence_kind: "DESIGN_FACTOR", factor_code: "VISUAL_CONTENT", rating: "INCIDENTAL" }
              as: ComplianceOfficer
              captures: { e2_seq: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_2}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "STRONG" }
              as: ComplianceOfficer
              captures: { e3_seq: $.data.evidence_sequence }
            - call: "GET /online-services/${svc_1}"
              payload: {}
              as: ComplianceOfficer
              captures: { counter_1: $.data.evidence_sequence_counter }
            - call: "GET /online-services/${svc_2}"
              payload: {}
              as: ComplianceOfficer
              captures: { counter_2: $.data.evidence_sequence_counter }
          assert:
            - "${e1_seq} == 1 and ${e2_seq} == 2 (per-service monotonic) and ${e1_created} == 2026-08-01T00:00:00Z"
            - "${e3_seq} == 1 (the second service starts its own sequence at 1; the counter is not global)"
            - "${counter_1} == 2 and ${counter_2} == 1"
            - "DeterminationEvidence.${e1}.id was generated by the server and is not derived from evidence_sequence"

      - name: design_factor_evidence_carrying_sample_fields_reports_field_group_mismatch
        claim_type: type_constraints
        grounds:
          - validations[priority=65]
          - errors[ERR_EVIDENCE_FIELDS_MISMATCH]
          - errors[ERR_INVALID_REQUEST]
          - entities.DeterminationEvidence.fields.evidence_kind
        distinguishing_aspect: "The polymorphic evidence body has two mutually exclusive field groups: a DESIGN_FACTOR row carrying total_users/period bounds is ERR_EVIDENCE_FIELDS_MISMATCH, an AUDIENCE_SAMPLE row missing users_under_13 is the same mismatch, and an out-of-enum rating is the plain ERR_INVALID_REQUEST — three distinct outcomes from one priority-65 pass."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service with no evidence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Field Group Kids", operator_organization: "Field Group Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
          trigger:
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE", total_users: 1000, users_under_13: 400, period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", measurement_method: "PANEL" }
              as: ComplianceOfficer
              captures: { err_mix: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 1000, sample_verified: true }
              as: ComplianceOfficer
              captures: { err_missing_group_field: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "OVERWHELMING" }
              as: ComplianceOfficer
              captures: { err_enum: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
              captures: { ok_seq: $.data.evidence_sequence }
          assert:
            - "${err_mix} == ERR_EVIDENCE_FIELDS_MISMATCH with HTTP 422 (sample fields are forbidden on a DESIGN_FACTOR row even though each is individually well-typed)"
            - "${err_missing_group_field} == ERR_EVIDENCE_FIELDS_MISMATCH with HTTP 422 (users_under_13 is required by the AUDIENCE_SAMPLE group)"
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 422 (OVERWHELMING is outside the rating enum ABSENT|INCIDENTAL|MODERATE|STRONG)"
            - "${ok_seq} == 1 (none of the three refused calls consumed a sequence number)"
            - "OnlineService.${svc_id}.evidence_sequence_counter == 1"

      - name: determination_evidence_row_exposes_no_version_and_no_write_back
        claim_type: immutability
        grounds:
          - entities.DeterminationEvidence
          - endpoints["GET /online-services/{id}/determination-evidence"]
        distinguishing_aspect: "DeterminationEvidence is declared common_fields: false — the row carries id, created_at and evidence_sequence but NO version and NO updated_at, and §1.5 declares no PUT/PATCH/DELETE for it, so a correction is a new append that leaves the original readable at its own sequence number."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service with one AUDIENCE_SAMPLE row already appended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Append Only Kids", operator_organization: "Append Media", service_category: "VIDEO_PLATFORM", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", total_users: 1000, users_under_13: 100, sample_verified: false }
              as: ComplianceOfficer
              captures: { ev_1: $.data.id, ev_1_verified: $.data.sample_verified }
          trigger:
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 1000, users_under_13: 100, sample_verified: true }
              as: ComplianceOfficer
