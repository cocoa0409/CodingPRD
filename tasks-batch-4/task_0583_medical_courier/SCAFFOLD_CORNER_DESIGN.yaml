          setup: ["A completed route; first billing create succeeded, bumping route.version; the stale version was captured before the bump"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { rv: $.data.version } }
            - { call: "POST /med-courier/routes/${rt}/billing", payload: { expected_route_version: "${rv}" }, as: Dispatcher, captures: { bill1: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/billing", payload: { expected_route_version: "${rv}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: generate_route_from_template_cascades_stops
        claim_type: cascading_side_effects
        grounds: ["endpoints.POST /med-courier/route-templates/{id}/generate-route", "entities.Route.fields.template_id"]
        distinguishing_aspect: "Generating a route from a 2-stop template creates a PLANNED Route (template_id set) plus exactly 2 Stops synthesized from stop_specs."
        test_recipe:
          setup: ["A route template with two stop specs exists"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/route-templates", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", cadence: "WEEKDAYS", default_run_type: "SCHEDULED", stop_specs: [ { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 } ] }, as: Dispatcher, captures: { tmpl: $.data.id } }
          trigger:
            - { call: "POST /med-courier/route-templates/${tmpl}/generate-route", payload: { scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z" }, as: Dispatcher, captures: { rt: $.data.id } }
          assert:
            - "response.status == 201"
            - "Route.${rt}.template_id == ${tmpl}"
            - "GET /med-courier/stops?route_id=${rt} returns exactly 2 Stops"

      - name: route_version_increments_on_assign
        claim_type: optimistic_concurrency
        grounds: ["entities.Route.fields.version", "state_machines.Route.PLANNED_to_ASSIGNED"]
        distinguishing_aspect: "Route.version starts at 1 on create and becomes 2 after the assign mutation."
        test_recipe:
          setup: ["A PLANNED route and a valid driver/vehicle"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher, captures: { v1: $.data.version } }
          assert:
            - "captured v0 == 1"
            - "Route.${rt}.version == 2"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: assign_driver_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRIVER_NOT_FOUND]"]
        distinguishing_aspect: "Assigning a non-existent driver id returns ERR_DRIVER_NOT_FOUND (404)."
        test_recipe:
          setup: ["A PLANNED route and a real vehicle exist"]
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "00000000-0000-0000-0000-000000000000", vehicle_id: "${veh}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_DRIVER_NOT_FOUND"

  # ---------------------------------------------------------------------------
  # Excluded corners — already asserted by a §1.8 difficulty instance.
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: temperature_excursion_boundary_excluded
        claim_type: Precision
        grounds: ["calculations.temperature_excursion_eval"]
        excluded_because:
          difficulty_instance: boundary_precision_check / temp_reading_equals_max_is_inclusive
          rationale: "The inclusive [min,max] boundary (reading == max is in band) is asserted by the named §1.8 boundary instance."

      - name: provisional_vs_final_divergence_excluded
        claim_type: Variant Divergence
        grounds: ["calculations.route_charge"]
        excluded_because:
          difficulty_instance: dual_variant_calc / route_charge_provisional_vs_final
          rationale: "Provisional-vs-final divergence on the same route is asserted by the named §1.8 dual-variant instance."

  - section: state_machines
    instances:
      - name: dispatch_empty_route_excluded
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=14]"]
        excluded_because:
