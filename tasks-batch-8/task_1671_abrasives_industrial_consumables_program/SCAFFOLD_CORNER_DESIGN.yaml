# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Abrasives & Industrial Consumables Program
# Enumerates testable claims of SCAFFOLD.yaml §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: product_creation_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Product.fields.shelf_life_policy"
          - "entities.Product.fields.used_media_hazard_class"
          - "entities.InventoryLot.fields.expiry_date"
        distinguishing_aspect: "Omitting shelf_life_policy and used_media_hazard_class on a COATED product applies defaults EXACT_DAY and NONE; a COATED lot gets expiry_date NULL."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "DF-1", name: "Default Flap Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id, p_policy: $.data.shelf_life_policy, p_haz: $.data.used_media_hazard_class, p_status: $.data.status }
          trigger:
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-DF", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
              captures: { lot_id: $.data.id, lot_expiry: $.data.expiry_date, lot_qoh: $.data.qty_on_hand }
          assert:
            - "Product.${p_id}.shelf_life_policy == EXACT_DAY and used_media_hazard_class == NONE (defaults applied)"
            - "Product.${p_id}.status == ACTIVE (initial state)"
            - "InventoryLot.${lot_id}.expiry_date == null (COATED product has no shelf life)"
            - "InventoryLot.${lot_id}.qty_on_hand == 10 (initialized to qty_received)"

      - name: bonded_product_missing_shelf_life_rejected
        claim_type: required_fields
        grounds:
          - "entities.Product.fields.shelf_life_months"
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "BONDED products conditionally require shelf_life_months; omitting it is a 400 schema rejection before any state is persisted."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "BD-X", name: "Bonded No Shelf", product_form: "BONDED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (shelf_life_months required for BONDED)"

      - name: product_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.product_form"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "product_form outside {COATED, BONDED, NONWOVEN} is rejected."
        test_recipe:
          setup: ["Empty catalog"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "BD-E", name: "Bad Enum", product_form: "FLAPPY", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: lot_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "GET on a non-existent lot id returns the FIXED error envelope with ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/lots/11111111-2222-4333-8444-555555555555"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; envelope response_type == error; data.error_id == ERR_NOT_FOUND; data.message present; meta.api_request_id present"

      - name: lot_list_filter_and_pagination
        claim_type: listing
        grounds:
          - "endpoints"
          - "response_envelope"
        distinguishing_aspect: "Filtered list returns only matching lots; limit/offset pagination exposes total_count and has_more consistently across pages."
        test_recipe:
          setup: ["Product PA with 2 lots; product PB with 1 lot"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "LP-A", name: "List Prod A", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "LP-B", name: "List Prod B", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${pa_id}", lot_code: "LA1", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${pa_id}", lot_code: "LA2", manufacture_date: "2026-06-02", qty_received: 10 }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${pb_id}", lot_code: "LB1", manufacture_date: "2026-06-03", qty_received: 10 }
              as: AccountManager
          trigger:
            - call: "GET /api/lots"
              payload: { product_id: "${pa_id}", limit: 1, offset: 0 }
              as: AccountManager
            - call: "GET /api/lots"
              payload: { product_id: "${pa_id}", limit: 1, offset: 1 }
              as: AccountManager
          assert:
            - "Page 1: total_count == 2, has_more == true, exactly 1 item, item.product_id == ${pa_id}"
            - "Page 2: total_count == 2, has_more == false, exactly 1 item"
            - "No lot of product ${pb_id} appears in either filtered page"

      - name: usage_record_immutable_event
        claim_type: immutability
        grounds:
          - "entities.UsageRecord"
        distinguishing_aspect: "UsageRecord declares common_fields: false — its response carries id and created_at only, no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["COATED product rpm 6000; ACTIVE machine spindle 5000 FIXED; ACTIVE standard 0.0250 [2026-01-01, open); lot qty 100"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "UR-1", name: "Usage Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-U1", asset_tag: "GR-U1", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-U1", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 400 }
              as: AccountManager
              captures: { ur_id: $.data.id, ur_band: $.data.variance_band }
          assert:
            - "Response data contains id and created_at; contains NO version and NO updated_at keys (common_fields: false)"
            - "UsageRecord.${ur_id}.variance_band == IN_BAND (actual 10/400 == 0.0250 == standard)"
            - "InventoryLot.${lot_id}.qty_on_hand == 90 after the decrement"

      - name: machine_version_increments_on_mutation
        claim_type: system_fields
        grounds:
          - "entities.MachineAsset"
        distinguishing_aspect: "System fields: id server-minted, version starts at 1 and increments by 1 on the quarantine mutation."
        test_recipe:
          setup: ["One machine"]
          setup_api_calls:
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-V", asset_tag: "GR-V1", machine_type: "BENCH_GRINDER", spindle_max_rpm: 4000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id, m_v1: $.data.version }
          trigger:
            - call: "POST /api/machines/${m_id}/quarantine"
              as: EHSOfficer
              captures: { m_v2: $.data.version, m_status: $.data.status }
          assert:
            - "version == 1 at creation; version == 2 after quarantine (incremented by exactly 1)"
            - "MachineAsset.${m_id}.status == QUARANTINED"

      - name: lot_create_fk_product_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.InventoryLot.fields.product_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Flat-topology FK integrity: a lot referencing a non-existent product id is rejected with 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/lots"
              payload: { product_id: "11111111-2222-4333-8444-555555555555", lot_code: "L-ORPHAN", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.Product"
          - "state_machines.MachineAsset"
          - "state_machines.InventoryLot"
          - "state_machines.UsageStandard"
          - "state_machines.Contract"
          - "state_machines.BlanketOrder"
          - "state_machines.Release"
          - "state_machines.TrialCase"
        distinguishing_aspect: "Every stateful entity lands in its declared initial_state at creation: Product ACTIVE, MachineAsset ACTIVE, InventoryLot AVAILABLE, UsageStandard ACTIVE, Contract DRAFT, BlanketOrder DRAFT, Release SCHEDULED, TrialCase ACTIVE."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "IS-1", name: "Init Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id, p_st: $.data.status }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-IS", asset_tag: "GR-IS", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id, m_st: $.data.status }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-IS", manufacture_date: "2026-06-01", qty_received: 50 }
              as: AccountManager
              captures: { lot_st: $.data.status }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
              captures: { std_st: $.data.status }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-IS", contract_number: "C-IS", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id, c_st: $.data.status }
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 20 }
              as: AccountManager
              captures: { bo_id: $.data.id, bo_st: $.data.status }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_st: $.data.status }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-09-10", scheduled_end: "2026-09-12" }
              as: AccountManager
              captures: { t_st: $.data.status }
          trigger: []
          assert:
            - "Product.status == ACTIVE; MachineAsset.status == ACTIVE; InventoryLot.status == AVAILABLE; UsageStandard.status == ACTIVE"
            - "Contract.status == DRAFT at creation; BlanketOrder.status == DRAFT at creation"
            - "Release.status == SCHEDULED at creation; TrialCase.status == ACTIVE at creation"

      - name: release_ship_before_pick_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Release"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "SHIP from SCHEDULED (skipping PICKED) is not a declared transition and is rejected."
        test_recipe:
          setup: ["Contract ACTIVE; blanket order committed 10 OPEN; release qty 5 SCHEDULED"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "SP-1", name: "Ship Early Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-SP", contract_number: "C-SP", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION (release is SCHEDULED, not PICKED)"
            - "Release.${rel_id}.status remains SCHEDULED"

      - name: release_cancel_after_ship_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Release"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "SHIPPED is terminal: cancel from SHIPPED is rejected and no side effects fire."
        test_recipe:
          setup: ["Full chain to SHIPPED: committed 10, release qty 10, lot qty 10, PICKED then SHIPPED"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CS-1", name: "Cancel Ship Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-CS", contract_number: "C-CS", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-CS", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
          trigger:
            - call: "POST /api/releases/${rel_id}/cancel"
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION (SHIPPED is terminal)"
            - "Release.${rel_id}.status remains SHIPPED"

      - name: blanket_auto_close_after_final_ship
        claim_type: valid_transition
        grounds:
          - "state_machines.BlanketOrder.OPEN_to_CLOSED"
          - "calculations.blanket_remaining_qty"
          - "calculations.release_billing_total"
        distinguishing_aspect: "System auto-transition: shipping the last open release with remaining_qty == 0 closes the blanket order; billed total uses unit-first rounding at 10000c x 10 = 100000c, tier 0."
        test_recipe:
          setup: ["COATED product; contract ACTIVE (escalation 0, base 10000); blanket order committed 10 OPEN; release qty 10 (== remaining); lot qty 10"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "AC-1", name: "AutoClose Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-AC", contract_number: "C-AC", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-AC", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
          trigger:
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
              captures: { rel_st: $.data.status, rel_billed: $.data.billed_total_cents, rel_final: $.data.final_unit_price_cents }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_st: $.data.status, bo_rem: $.data.remaining_qty }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { lot_st: $.data.status, lot_qoh: $.data.qty_on_hand }
          assert:
            - "Release.${rel_id}.status == SHIPPED; final_unit_price_cents == 10000; billed_total_cents == 100000 (10 x 10000, committed 10 < 500 -> tier 0)"
            - "BlanketOrder.${bo_id}.status == CLOSED (auto: remaining_qty == 0 AND no open releases) and remaining_qty == 0"
            - "InventoryLot.${lot_id}.qty_on_hand == 0 and status == DEPLETED (decremented at pick)"

      - name: product_double_discontinue_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Product"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "DISCONTINUED is terminal: a second discontinue on the same product is rejected."
        test_recipe:
          setup: ["Products P1 (ACTIVE) and P2 (ACTIVE, replacement)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "DD-1", name: "Double Disc 1", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "DD-2", name: "Double Disc 2", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION (already DISCONTINUED)"

      - name: machine_reinstate_when_active_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.MachineAsset.QUARANTINED_to_ACTIVE"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Reinstate is only declared from QUARANTINED; calling it on an ACTIVE machine is rejected."
        test_recipe:
          setup: ["One ACTIVE machine"]
          setup_api_calls:
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-RA", asset_tag: "GR-RA", machine_type: "BENCH_GRINDER", spindle_max_rpm: 4000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/machines/${m_id}/reinstate"
              as: EHSOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"

      - name: contract_amend_draft_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Contract.ACTIVE_to_ACTIVE"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "PATCH amend requires state ACTIVE; on a DRAFT contract the OCC version matches (so ERR_STALE_VERSION does NOT fire) and the state precondition rejects it."
        test_recipe:
          setup: ["Contract in DRAFT (never activated), version 1"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "AD-1", name: "Amend Draft Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
