              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_small}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { small_v2: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_small}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${small_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_big}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { big_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_big}", charge_kg: 24.000, regrind_kg: 12.000, expected_resin_lot_version: "${big_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-charges?molding_cycle_id=${cyc}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-lots/${lot_small}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "CONFLICT CALL (both members live): charging 24.000 kg with 12.000 kg regrind from LOT-P2-SMALL returns 422 with data.error_id == \"ERR_REGRIND_LIMIT_EXCEEDED\". Member A trips because the post-add blend is round(12.000 / 24.000 * 100, 2) == 50.00 > max_regrind_pct 30.00, and member B trips because LOT-P2-SMALL.available_kg 10.000 < charge_kg 24.000."
            - "the HTTP status is 422 and NOT 409: had the fiscal member at priority 72 been evaluated first the response would have been 409 ERR_RESIN_INSUFFICIENT, so status and error_id agree on the same verdict — product safety is decided before mass availability"
            - "priority 51 ERR_RESIN_LOT_NOT_QUALIFIED is vacuous by construction (LOT-P2-SMALL matches the model on resin_grade, additive_package_code, colour and the inclusive melt-index band), so nothing between the members can be mistaken for the winner"
            - "CONTROL B (member B alone): charging 24.000 kg with 2.400 kg regrind from LOT-P2-SMALL — blend round(2.400 / 24.000 * 100, 2) == 10.00 <= 30.00, so member A is satisfied — returns 409 with data.error_id == \"ERR_RESIN_INSUFFICIENT\". Member B was therefore genuinely live in the conflict call and was suppressed by priority order alone."
            - "CONTROL A (member A alone): charging 24.000 kg with 12.000 kg regrind from LOT-P2-BIG — available_kg 500.000 >= 24.000, so member B is satisfied — returns 422 with data.error_id == \"ERR_REGRIND_LIMIT_EXCEEDED\", reproducing the conflict call's outcome from member A alone"
            - "TERMINAL: GET /resin-charges?molding_cycle_id=${cyc} returns 0 rows; MoldingCycle.${cyc}.charged_mass_kg == 0.000 and cycle_regrind_pct == 0.00; ResinLot.${lot_small} still reads available_kg 10.000 / reserved_kg 0.000 / consumed_kg 0.000 == received_kg 10.000 and ResinLot.${lot_big} still reads available_kg 500.000 / reserved_kg 0.000 — three rejected requests moved no mass and left no partial charge row"

      - name: pair5_storage_review_incomplete_beats_warranty_term_expired
        grounds:
          - validations[priority=55]
          - validations[priority=64]
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - calculations.warranty_payout
          - errors.ERR_STORAGE_REVIEW_INCOMPLETE
          - errors.ERR_WARRANTY_TERM_EXPIRED
        distinguishing_aspect: |
          A THIRD category pair, unused by PAIR-1 and PAIR-2: BUSINESS_SAFETY
          (priority 55, ERR_STORAGE_REVIEW_INCOMPLETE, 409) against
          BUSINESS_TEMPORAL (priority 64, ERR_WARRANTY_TERM_EXPIRED, 422) on
          POST /warranty-claims/{id}/approve. It is also the only one of the
          three instances whose suppressed member is a guard buried INSIDE a
          calculation (warranty_payout STEP 0), so a naive implementation that
          computes the payout before running the validation ladder returns 422
          here — the pinned answer is 409.
        test_recipe:
          setup:
            - "ProductModel PM-P5-KM: KAYAK/MID, msrp_cents 300000, warranty_basis FLAT_SCHEDULE, initial_warranty_reserve_cents 500000, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, min_cooling_minutes 30, wall_cv_max_pct 12.00, wall_thickness_min_mm 4.50, impact_test_min_joules 90.00."
            - "Mold MLD-P5-2 with cavity_count 2 and nominal_charge_kg 24.000 == 12.000 * 2 (so one cycle yields the two hulls the two claims need), OvenStation OV-1, CoolingBay CB-1 FORCED_AIR, four ACTIVE Technicians with MOLDING_OPERATOR, ASSEMBLY_TECH and QUALITY_INSPECTOR held by three distinct rows."
            - "Customer CUST-P5 is ACTIVE with storage_guidance_acknowledged_at 2026-08-01T00:00:00Z <= delivered_at 2026-08-02T00:00:00Z, so priority 56 ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED can never fire on the storage-review call that later isolates member B."
            - "Warehouse WH-P5 of 20.0000 in one zone Z-A; qualified ResinLot LOT-P5 with received_kg 500.000 and expires_on 2035-12-31, chosen so the long clock jumps below expire nothing and the clock endpoint's expired/blocked counters stay at 0."
            - "ProductionOrder PO-P5 (ordered_qty 2, no demand_bucket_id) is released, run through one cycle to DEMOLDED, and both hulls are trimmed, outfitted (HK-P5-0001 / HK-P5-0002) and inspected PASS, so the order is COMPLETE and both units are STORED in Z-A."
            - "Shipment SHP-P5 out of WH-P5 to Z2 with trailer_cube_capacity_m3 5.0000 carries both hulls at cube_utilization_pct exactly 60.00 == MIN_SEAL_UTILIZATION_PCT, departs 2026-08-01T15:00:00Z and delivers 2026-08-02T00:00:00Z, so both FinishedUnits are DELIVERED with delivered_at 2026-08-02T00:00:00Z and the approve precondition ERR_UNIT_NOT_DELIVERED is vacuous."
            - "ProductModel.warranty_reserve_cents is 500000 and warranty_paid_cents is 0 at trigger time, so ERR_WARRANTY_RESERVE_EXHAUSTED cannot fire either."
