              as: CertificationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /certification_applications/${app_id}/revise"
              payload: {}
              as: SustainabilityManager
              captures: { st_draft: $.data.status, sub_by: $.data.submitted_by }
            - call: "POST /certification_applications/${app_id}/submit"
