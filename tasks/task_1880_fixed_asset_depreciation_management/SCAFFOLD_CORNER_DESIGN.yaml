              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "Derivation run", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { inv: $.data.id, exp: $.data.expected_count }
          trigger:
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a1}", found: true, counted_location: "PLANT-1" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { s1: $.data.reconciliation_status }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a2}", found: true, counted_location: "PLANT-9" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { s2: $.data.reconciliation_status }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a3}", found: false }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { s3: $.data.reconciliation_status }
          assert:
            - "statuses: I-1 MATCHED, I-2 LOCATION_MISMATCH, I-3 MISSING"
            - "run counters: expected_count == 3, matched_count == 1, mismatch_count == 1, missing_count == 1"
            - "open_inventory_exception: I-1 false; I-2 and I-3 true"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "No X-User-Role/X-User-ID headers -> 401 before any role, existence, or state logic runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fixed-assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "401 with error_id == ERR_UNAUTHENTICATED"

      - name: clerk_create_project_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "InventoryClerk is not in POST /capital-projects roles -> 403 even with a perfectly valid payload."
        test_recipe:
          setup: ["AssetClass MACH exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-F", name: "Forbidden", asset_class_id: "${cls}" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { err: $.data.error_id }
          assert:
            - "403 with error_id == ERR_FORBIDDEN; no project persisted"

      - name: sod_self_approve_disposal_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID: a Controller wearing id u_acct_1 cannot approve a disposal requested by u_acct_1."
        test_recipe:
          setup: ["Asset A-040 IN_SERVICE; disposal REQUESTED by u_acct_1"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-040", description: "SoD asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 400000, effective_date: "2026-03-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
          trigger:
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "403 with error_id == ERR_SEGREGATION_OF_DUTIES (approver id == requested_by_user_id); disposal remains REQUESTED"
            - "The same call with as_user_id u_ctrl_1 succeeds (contrast proved by disposal_reject_resubmit_revision_cycle's approve step)"

      - name: authorization_precedes_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
        distinguishing_aspect: "A forbidden role hitting a nonexistent project gets ERR_FORBIDDEN; an authorized role hitting the same id gets ERR_NOT_FOUND — priority 2 beats priority 3."
        test_recipe:
          setup: ["empty DB (no project with the probed id)"]
          setup_api_calls: []
          trigger:
            - call: "POST /capital-projects/00000000-0000-4000-8000-000000000000/capitalize"
              payload: { asset_tag: "A-041", description: "ghost" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_role: $.data.error_id }
            - call: "POST /capital-projects/00000000-0000-4000-8000-000000000000/capitalize"
              payload: { asset_tag: "A-041", description: "ghost" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err_exist: $.data.error_id }
          assert:
            - "AssetAccountant -> 403 ERR_FORBIDDEN (authorization first)"
            - "Controller -> 404 ERR_NOT_FOUND (existence second)"

      - name: salvage_equal_cost_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INVALID_SALVAGE_VALUE]"
        distinguishing_aspect: "salvage_value_cents must be strictly less than cost: equality fails."
        test_recipe:
          setup: ["AssetClass MACH exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-042", description: "Bad salvage", asset_class_id: "${cls}", acquisition_cost_cents: 500000, salvage_value_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "422 with error_id == ERR_INVALID_SALVAGE_VALUE"

      - name: zero_amount_cost_line_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INVALID_AMOUNT]"
        distinguishing_aspect: "amount_cents must be > 0; zero is rejected at fiscal priority."
        test_recipe:
          setup: ["AssetClass MACH; OPEN project PROJ-Z"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-Z", name: "Zero line", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 0, cost_type: "OTHER", incurred_date: "2026-01-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "422 with error_id == ERR_INVALID_AMOUNT; project total_accumulated_cents remains 0"

      - name: invalid_disposal_field_combinations_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INVALID_DISPOSAL_FIELDS]"
        distinguishing_aspect: "Disposal-type-conditional fields: SALE requires explicit proceeds; TRANSFER requires a destination and forbids proceeds; effective_date cannot precede in_service_date."
        test_recipe:
          setup: ["AssetClass MACH; asset A-043 in service 2026-02-10"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-043", description: "Disposal fields", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-02-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", effective_date: "2026-03-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_sale: $.data.error_id }
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "TRANSFER", effective_date: "2026-03-01", proceeds_cents: 5 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_tr: $.data.error_id }
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SCRAP", effective_date: "2026-01-15" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err_dt: $.data.error_id }
          assert:
            - "SALE without proceeds_cents -> 422 ERR_INVALID_DISPOSAL_FIELDS"
            - "TRANSFER with proceeds 5 and no transfer_to_cost_center -> 422 ERR_INVALID_DISPOSAL_FIELDS"
            - "effective_date 2026-01-15 < in_service 2026-02-10 -> 422 ERR_INVALID_DISPOSAL_FIELDS"
            - "no Disposal rows persisted for the asset"

      - name: bonus_on_disallowing_class_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_BONUS_NOT_ALLOWED]"
        distinguishing_aspect: "Conditional validation on class configuration: bonus_elected=true only passes when the class allows it."
        test_recipe:
          setup: ["AssetClass VEH with bonus_depreciation_allowed false"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "VEH", name: "Vehicles", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_7YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-044", description: "Bonus attempt", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1", bonus_elected: true }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "422 with error_id == ERR_BONUS_NOT_ALLOWED"

      - name: disposal_into_closed_period_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_PERIOD_CLOSED]"
        distinguishing_aspect: "At creation, effective period 2026-01 with run 2026-01 already POSTED is rejected — the temporal check stands alone (no safety failure present)."
        test_recipe:
          setup: ["Asset A-045 in service 2026-01-10; run 2026-01 POSTED"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-045", description: "Closed period", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 100000, effective_date: "2026-01-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_PERIOD_CLOSED; no Disposal persisted"

      - name: begin_reconciliation_with_uncounted_lines_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.InventoryRun"
          - "errors[ERR_UNCOUNTED_LINES]"
        distinguishing_aspect: "Aggregate validation: every seeded line must have found != null before reconciliation may begin."
        test_recipe:
          setup: ["Assets A-046, A-047 IN_SERVICE; run scope ALL seeds 2 lines; only A-046 counted"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-046", description: "Counted", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a1: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-047", description: "Uncounted", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a2: $.data.id }
            - call: "POST /fixed-assets/${a1}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /fixed-assets/${a2}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "Partial count", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { inv: $.data.id }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a1}", found: true, counted_location: "PLANT-1" }
              as: InventoryClerk
              as_user_id: u_clerk_1
          trigger:
            - call: "POST /inventory-runs/${inv}/begin-reconciliation"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_UNCOUNTED_LINES; run remains COUNTING"

      - name: close_with_unresolved_items_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.InventoryRun"
          - "errors[ERR_UNRESOLVED_INVENTORY_ITEMS]"
        distinguishing_aspect: "Close is blocked while any line is MISSING/LOCATION_MISMATCH and its asset is not DISPOSED."
        test_recipe:
          setup: ["Asset A-048 IN_SERVICE; run counted it found=false (MISSING); run in RECONCILING"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-048", description: "Missing asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "Unresolved", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { inv: $.data.id }
            - call: "POST /inventory-runs/${inv}/count-lines"
              payload: { asset_id: "${a}", found: false }
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${inv}/begin-reconciliation"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
          trigger:
            - call: "POST /inventory-runs/${inv}/close"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_UNRESOLVED_INVENTORY_ITEMS; run remains RECONCILING"

      - name: duplicate_asset_tag_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_TAG]"
        distinguishing_aspect: "asset_tag uniqueness is global across all assets, including components."
        test_recipe:
          setup: ["AssetClass MACH; asset A-050 already created"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-050", description: "First", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-050", description: "Duplicate tag", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC2", location: "PLANT-2" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_DUPLICATE_TAG"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.FixedAsset.fields.book_method"
        distinguishing_aspect: "An enum value outside the declared set is a 400 malformed-payload failure, not a 422 business failure."
        test_recipe:
          setup: ["AssetClass MACH exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-051", description: "Bad enum", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1", book_method: "SIDWAYS" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"

      - name: immutable_field_patch_on_in_service_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_FIELD_IMMUTABLE]"
        distinguishing_aspect: "On an IN_SERVICE asset only prospective fields are patchable; acquisition_cost_cents is frozen."
        test_recipe:
          setup: ["Asset A-052 IN_SERVICE"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-052", description: "Immutable cost", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av: $.data.version }
          trigger:
            - call: "PATCH /fixed-assets/${a}"
              payload: { expected_asset_version: "${av}", acquisition_cost_cents: 999999 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "422 with error_id == ERR_FIELD_IMMUTABLE; acquisition_cost_cents remains 500000; version unchanged"

      - name: duplicate_schedule_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_SCHEDULE]"
        distinguishing_aspect: "The (asset_id, schedule_type, schedule_year) triple is unique; a second PROPERTY_TAX row for the same asset-year is rejected."
        test_recipe:
          setup: ["Asset A-053 created (DRAFT is fine — schedule import does not require IN_SERVICE)"]
          setup_api_calls:
