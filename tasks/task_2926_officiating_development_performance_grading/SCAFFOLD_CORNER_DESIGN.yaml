            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_station
            - &k_station_off
              call: "POST /replay-stations"
              payload: { station_code: "BOOTH-DARK", concurrent_capacity: 4, status: "OFFLINE" }
              as: OfficiatingDirector
              captures: { st_off_id: $.data.id, st_off_status: $.data.status }
          trigger:
            - call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_id}", play_ref: "Q2-P11", category: "GAME_ADMIN" }
              as: ReplayOfficial
              captures: { err_category: $.data.error_id }
            - call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_off_id}", play_ref: "Q2-P11", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { err_offline: $.data.error_id }
            - call: "POST /replay-reviews"
              payload: { game_id: "${g_id}", station_id: "${st_id}", play_ref: "Q2-P11", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { rv_ok_id: $.data.id, rv_ok_status: $.data.status }
            - call: "GET /replay-stations/${st_id}"
              payload: {}
              as: ReplayOfficial
              captures: { st_active_ok: $.data.active_review_count }
            - call: "GET /replay-stations/${st_off_id}"
              payload: {}
              as: ReplayOfficial
              captures: { st_off_active: $.data.active_review_count }
          assert:
            - "the GAME_ADMIN review returns HTTP 422 with ${err_category} == ERR_CATEGORY_NOT_REVIEWABLE — GAME_ADMIN is a declared enum member that this program did not enable"
            - "${st_off_status} == OFFLINE and the TURNOVER review there returns HTTP 409 with ${err_offline} == ERR_REPLAY_STATION_OFFLINE"
            - "the same TURNOVER review on BOOTH-1 returns 201 with ${rv_ok_status} == INITIATED"
            - "${st_active_ok} == 1 and ${st_off_active} == 0 — only the accepted review moved a counter"

      - name: screening_an_underexperienced_applicant_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=22]
          - calculations.advancement_criteria
          - errors[ERR_ADVANCEMENT_CRITERIA_NOT_MET]
        distinguishing_aspect: "Dan (TIER_2, 6 seasons) applying for TIER_1 satisfies tier adjacency, ACTIVE status, clearance and the accuracy floor but fails MIN_EXPERIENCE_FOR_TIER_1 = 8, so screening is rejected and the application stays SUBMITTED."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN."
