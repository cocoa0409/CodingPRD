  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: groomable_breed_check_beats_bay_capacity_and_slot
        grounds:
          - validations[priority=15]
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_BREED_NOT_GROOMABLE]
          - errors[ERR_BAY_SLOT_CONFLICT]
          - state_machines.ServiceBooking.REQUESTED_to_SCREENED
        distinguishing_aspect: "business_safety (priority 15) versus business_temporal (priority 9): a grooming booking for an un-groomable breed whose window also collides with an existing booking on the same bay must be refused with ERR_BREED_NOT_GROOMABLE, because the breed admissibility check runs before the interval-overlap check."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z"
            - "Store ST-0501 in CA; one GROOMING bay; member Ivo; pet Bruno (CANINE, Dogo Argentino, 42.0 kg)"
            - "BreedHandlingRule for Dogo Argentino / CANINE with risk_points 40, handling_tier HIGH_RISK, allowed_for_grooming false"
            - "A first grooming booking already occupying the window 2026-06-04T09:00:00Z–10:00:00Z, with a second GROOMING bay so that first booking does not itself collide"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
