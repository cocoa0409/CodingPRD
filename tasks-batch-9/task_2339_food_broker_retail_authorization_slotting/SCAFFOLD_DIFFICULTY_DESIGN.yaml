        grounds:
          - validations[priority=10].ERR_NO_ACTIVE_COMMISSION_AGREEMENT
          - entities.CommissionAgreement.fields.effective_end_date
          - state_machines.SlottingDeal.PROPOSED_to_ACCEPTED
