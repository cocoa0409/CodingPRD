# =============================================================================
# §1.9 Scaffold Corner Design — task_2352 State Revenue Forecasting &
# Reserve Management
#
# Breadth probe over the claim-extraction guide's nine sections, walked against
# SCAFFOLD.yaml §1.1–§1.7. §1.8 is the depth probe; every corner already carried
# by a §1.8 instance appears here as an `excluded_because:` stub instead of a
# duplicate recipe.
#
# Fixture conventions (identical to §1.8 so the two files compose):
#   * logical clock starts at 2026-08-01T00:00:00Z; FY2027 = 2026-07-01 .. 2027-06-30
#   * actors: dir-1 (ForecastDirector), exec-eco-1 / leg-eco-1 (economists),
#     tr-1 / tr-req-1 / tr-exec-9 (ReserveTreasurer), voter-01..voter-11
#     (LegislativeVoter), ra-1 (RatingAnalyst)
#   * "SHORT chain" = one ACTIVE source (PIT, base 1234567800, elasticities
#     4150 / 7825 / 640 / 1420, MEDIUM), one FY2027 BASELINE cycle
#     (MIDPOINT_AVERAGE, enacted 1650000000, prior recurring baseline
#     1500000000), the three canonical scenarios, both bodies filing an
#     unadjusted PIT estimate. Derived once and for all: PIT weighted
#     1296456684, no policy adjustment, no one-time item, so exec_total ==
#     leg_total == reconciled == certified_total == certified_recurring_total ==
#     1296456684, certified_one_time 0, variance_bps 0, shortfall_gap 353543316
#     (2142 bps). A GROWTH_ABOVE_TREND fund sees measured 1296456684 against a
#     trend line of 1545000000, so the certification owes NO deposit:
#     cap_cents 129645668, required_reserve 64822834.
#   * "FULL chain" = the §1.8 two-source fixture (PIT + CGT, both policy
#     adjustments, the 12000000 CGT one-time item): certified_total 1600916273,
#     certified_one_time 12000000, certified_recurring 1588916273, per-source
#     reconciled PIT 1254956684 / CGT 345959589, GROWTH_ABOVE_TREND gross
#     deposit 21958137, cap_cents 160091627, required_reserve 79445814.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: revenue_source_creation_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - entities.RevenueSource
          - entities.RevenueSource.fields.mape_bps
          - entities.RevenueSource.fields.posted_actual_count
          - endpoints[POST /revenue-sources]
        distinguishing_aspect: |
          A create call carrying exactly the eight declared input fields returns 201 and the four
          system fields the endpoint's side_effects promise: status ACTIVE, mape_bps 0,
          methodology_flag false, posted_actual_count 0 — with version 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
          assert:
            - "HTTP 201 and meta.response_type == \"object\""
            - "RevenueSource.${src_pit}.status == ACTIVE"
            - "RevenueSource.${src_pit}.mape_bps == 0"
            - "RevenueSource.${src_pit}.methodology_flag == false"
            - "RevenueSource.${src_pit}.posted_actual_count == 0"
            - "RevenueSource.${src_pit}.version == 1"
            - "RevenueSource.${src_pit}.base_year_receipts_cents == 1234567800 and elasticity_wage_income_bps == 7825 and volatility_class == MEDIUM"
            - "RevenueSource.${src_pit}.created_at == \"2026-08-01T00:00:00Z\" and updated_at == \"2026-08-01T00:00:00Z\""

      - name: forecast_cycle_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.ForecastCycle
          - entities.ForecastCycle.fields.certified_total_cents
          - entities.ForecastCycle.fields.shortfall_pct_bps
          - endpoints[GET /forecast-cycles/{id}]
        distinguishing_aspect: |
          GET /forecast-cycles/{id} on a freshly created cycle returns the six input fields verbatim
          AND every certification-time aggregate as null (certified_total_cents,
          certified_one_time_cents, certified_recurring_total_cents, certified_at,
          shortfall_gap_cents, shortfall_pct_bps, ratified_round_id) — no field is pre-filled with 0.
        test_recipe:
          setup:
            - "One FY2027 BASELINE cycle in DRAFT with no scenarios yet."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "GET /forecast-cycles/${cyc}", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          assert:
            - "HTTP 200; ForecastCycle.${cyc}.fiscal_year == 2027, cycle_type == BASELINE, reconciliation_policy == MIDPOINT_AVERAGE"
            - "ForecastCycle.${cyc}.enacted_appropriation_cents == 1650000000 and prior_recurring_baseline_cents == 1500000000"
            - "ForecastCycle.${cyc}.status == DRAFT, scenario_weight_total_bps == 0, reopen_count == 0, version == 1"
            - "ForecastCycle.${cyc}.supersedes_cycle_id == null and ratified_round_id == null"
            - "ForecastCycle.${cyc}.certified_total_cents == null, certified_one_time_cents == null, certified_recurring_total_cents == null, certified_at == null"
            - "ForecastCycle.${cyc}.shortfall_gap_cents == null and shortfall_pct_bps == null"

      - name: forecast_cycle_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /forecast-cycles]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three cycles stored, limit 2 / offset 0 returns 2 rows with total_count 3 and
          has_more true; limit 2 / offset 2 returns the remaining 1 row with the SAME total_count 3
          and has_more false — total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "Three DRAFT cycles created in fiscal-year order 2027, 2028, 2029."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_27: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2028, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1700000000, prior_recurring_baseline_cents: 1600000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_28: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2029, cycle_type: "BASELINE", reconciliation_policy: "LOWER_OF_TWO", enacted_appropriation_cents: 1750000000, prior_recurring_baseline_cents: 1650000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_29: $.data.id } }
          trigger:
            - { call: "GET /forecast-cycles", payload: { limit: 2, offset: 0 }, as: RatingAnalyst, as_user_id: "ra-1" }
            - { call: "GET /forecast-cycles", payload: { limit: 2, offset: 2 }, as: RatingAnalyst, as_user_id: "ra-1" }
          assert:
            - "first response: HTTP 200, meta.response_type == \"array\", 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second response: 1 row, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "the two pages are disjoint and together contain exactly ${cyc_27}, ${cyc_28} and ${cyc_29}"
            - "GET /forecast-cycles with fiscal_year 2029 returns total_count == 1 with reconciliation_policy LOWER_OF_TWO"

      - name: revenue_source_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority 4 existence]
          - errors[ERR_SOURCE_NOT_FOUND]
          - endpoints[GET /revenue-sources/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown id on the path yields ERR_SOURCE_NOT_FOUND with HTTP 404
          — the entity-specific existence code, not the generic ERR_VALIDATION.
        test_recipe:
          setup:
            - "Empty database except for the clock pin; no RevenueSource exists."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "GET /revenue-sources/00000000-0000-4000-8000-0000000000ff", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and meta.response_type == \"error\""
            - "${err} == ERR_SOURCE_NOT_FOUND"

      - name: revenue_source_missing_required_field_returns_validation_error
        claim_type: required_fields
        grounds:
          - validations[priority 6 ERR_VALIDATION]
          - errors[ERR_VALIDATION]
          - endpoints[POST /revenue-sources]
        distinguishing_aspect: |
          base_year_receipts_cents has source: input and no default, so omitting it returns
          ERR_VALIDATION 422 and NO RevenueSource row is created.
        test_recipe:
          setup:
            - "Empty database except for the clock pin."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422 and ${err} == ERR_VALIDATION"
            - "GET /revenue-sources returns total_count == 0"

      - name: reserve_fund_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.ReserveFund.fields.cap_cents
          - entities.ReserveFund.fields.required_reserve_cents
          - entities.ReserveFund.fields.adequacy_band
          - entities.ReserveFund.fields.disclosed_target_pct_bps
          - endpoints[POST /reserve-funds]
        distinguishing_aspect: |
          A fund created before any certification carries the declared defaults exactly: balance and
          fy_opening_balance both equal opening_balance_cents 50000000, fy_withdrawn 0, posture
          ACCEPTING, cap_cents null, required_reserve_cents null, volatility_index_bps 0,
          target_pct_bps 500, coverage_ratio_bps 0, adequacy_band INSUFFICIENT, cushion_credit_bps 0,
          disclosed_target_pct_bps 500, cooling_off_until null, last_transaction_at null.
        test_recipe:
          setup:
            - "Empty database except for the clock pin; no ForecastCycle is CERTIFIED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
          assert:
            - "HTTP 201; ReserveFund.${fnd}.balance_cents == 50000000 and fy_opening_balance_cents == 50000000 and fy_withdrawn_cents == 0"
            - "ReserveFund.${fnd}.deposit_posture == ACCEPTING"
            - "ReserveFund.${fnd}.cap_cents == null and required_reserve_cents == null"
            - "ReserveFund.${fnd}.volatility_index_bps == 0, target_pct_bps == 500, coverage_ratio_bps == 0, adequacy_band == INSUFFICIENT"
            - "ReserveFund.${fnd}.cushion_credit_bps == 0 and disclosed_target_pct_bps == 500"
            - "ReserveFund.${fnd}.cooling_off_until == null and last_transaction_at == null and version == 1"

      - name: one_time_item_system_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.OneTimeItem.fields.status
          - entities.OneTimeItem.fields.voided_at
          - endpoints[POST /one-time-items]
        distinguishing_aspect: |
          status and voided_at are source: system on OneTimeItem, so a create payload that smuggles
          status VOIDED and voided_at is ignored: the row is born ACTIVE with voided_at null.
        test_recipe:
          setup:
            - "One ACTIVE PIT source and one DRAFT FY2027 cycle (a one-time item is legal on a DRAFT cycle; only CERTIFIED / SUPERSEDED cycles refuse)."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_pit}", item_type: "TAX_AMNESTY", amount_cents: 5000000, description: "Amnesty programme receipts, one collection window", status: "VOIDED", voided_at: "2026-08-01T00:00:00Z" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { oti: $.data.id } }
          assert:
            - "HTTP 201; OneTimeItem.${oti}.status == ACTIVE (the supplied VOIDED is ignored)"
            - "OneTimeItem.${oti}.voided_at == null (the supplied timestamp is ignored)"
            - "OneTimeItem.${oti}.amount_cents == 5000000 and item_type == TAX_AMNESTY and version == 1"
            - "GET /one-time-items with status VOIDED returns total_count == 0"

      - name: economic_scenario_invalid_weight_rejected
        claim_type: type_constraints
        grounds:
          - entities.EconomicScenario.fields.weight_bps
          - validations[priority 6 ERR_VALIDATION]
          - endpoints[POST /forecast-cycles/{id}/scenarios]
        distinguishing_aspect: |
          weight_bps is constrained to 1..10000, so a negative weight is rejected with
          ERR_VALIDATION 422 at request-shape time and the cycle's scenario_weight_total_bps stays 0
          — the weights-total rule (ERR_SCENARIO_WEIGHTS_INVALID) is never reached.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle with no scenarios."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: -100, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422 and ${err} == ERR_VALIDATION"
            - "ForecastCycle.${cyc}.scenario_weight_total_bps == 0 and version == 1 (no side effect fired)"
            - "GET /forecast-cycles/${cyc}/scenarios returns total_count == 0"

      - name: reserve_transaction_is_immutable_and_has_no_version
        claim_type: immutability
        grounds:
          - entities.ReserveTransaction
          - entities.ReserveTransaction.fields.overflow_returned_cents
          - endpoints[POST /reserve-funds/{id}/deposits]
          - endpoints[GET /reserve-transactions/{id}]
        distinguishing_aspect: |
          ReserveTransaction declares common_fields: false, so the minted row carries id and
          created_at but NO version and NO updated_at, and §1.5 declares no PATCH or DELETE on
          /reserve-transactions/{id} — the only way to undo it is the compensating REVERSAL row.
        test_recipe:
          setup:
            - "One fund with opening_balance_cents 50000000 and no certified cycle, so cap_cents is null and no cap is enforced."
            - "One manual deposit of 10000000 posted into it, taking the balance to 60000000."
          setup_api_calls:
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
            - { call: "POST /reserve-funds/${fnd}/deposits", payload: { amount_cents: 10000000, memo: "Direct appropriation transfer" }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { txn: $.data.id } }
          trigger:
            - { call: "GET /reserve-transactions/${txn}", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1" }
          assert:
            - "HTTP 200; ReserveTransaction.${txn} exposes id and created_at but NO version field and NO updated_at field"
            - "ReserveTransaction.${txn}.origin == MANUAL_DEPOSIT, signed_amount_cents == 10000000, gross_computed_cents == 10000000, overflow_returned_cents == 0"
            - "ReserveTransaction.${txn}.reverses_transaction_id == null and source_cycle_id == null"
            - "§1.5 declares no PATCH and no DELETE for /reserve-transactions/{id}; ReserveFund.${fnd}.balance_cents == 60000000"

      - name: economic_scenario_requires_existing_parent_cycle_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EconomicScenario.fields.cycle_id
          - validations[priority 4 existence]
          - errors[ERR_CYCLE_NOT_FOUND]
          - endpoints[POST /forecast-cycles/{id}/scenarios]
        distinguishing_aspect: |
          EconomicScenario takes its cycle_id from the path, so an unknown parent id is a
          path-existence failure: ERR_CYCLE_NOT_FOUND 404 is returned before any body validation,
          even though the scenario body itself is perfectly well formed.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle exists, but the trigger addresses a different, unknown cycle id."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles/00000000-0000-4000-8000-0000000000aa/scenarios", payload: { label: "BASELINE", weight_bps: 10000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and ${err} == ERR_CYCLE_NOT_FOUND"
            - "ForecastCycle.${cyc}.scenario_weight_total_bps == 0 (the existing cycle is untouched)"

      - name: withdrawal_request_rejects_unknown_fund_fk_not_found
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.WithdrawalRequest.fields.fund_id
          - entities.WithdrawalRequest.fields.cycle_id
          - validations[priority 5 existence]
          - errors[ERR_FUND_NOT_FOUND]
          - endpoints[POST /withdrawal-requests]
        distinguishing_aspect: |
          The topology is a graph with no ownership tree, so WithdrawalRequest's two body-level
          foreign keys are validated independently: an unknown fund_id returns ERR_FUND_NOT_FOUND 404
          at priority 5 even though cycle_id resolves and expected_fund_version is the version the
          client genuinely observed on the real fund.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle and one real fund whose version 1 the client has observed."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id, fnd_v: $.data.version } }
          trigger:
            - { call: "POST /withdrawal-requests", payload: { fund_id: "00000000-0000-4000-8000-0000000000bb", cycle_id: "${cyc}", requested_amount_cents: 1000000, justification_type: "SHORTFALL_TRIGGER", deadline_date: "2026-12-31", expected_fund_version: "${fnd_v}" }, as: ReserveTreasurer, as_user_id: "tr-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and ${err} == ERR_FUND_NOT_FOUND"
            - "ReserveFund.${fnd}.version == 1 (unchanged — the create side effect that bumps the fund never ran)"
            - "GET /withdrawal-requests with fund_id ${fnd} returns total_count == 0"

      - name: source_estimate_computed_money_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.SourceEstimate.fields.estimate_amount_cents
          - endpoints[POST /source-estimates]
          - calculations.weighted_scenario_source_estimate
        distinguishing_aspect: |
          Five of SourceEstimate's money fields are computed, and the filing endpoint accepts only
          round_id, source_id and judgmental_adjustment_cents: a filing that ALSO supplies
          estimate_amount_cents 999999999, weighted_scenario_cents 1 and body EXECUTIVE is still
          created with the derived figures (1296456684 across all four terms, body LEGISLATIVE from
          the caller's role) — the extra keys are ignored, not honoured and not an error.
        test_recipe:
          setup:
            - "SHORT chain up to an OPEN round: one PIT source, one LOCKED FY2027 cycle with the 6000/2500/1500 scenario set, no policy adjustment and no one-time item."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
          trigger:
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}", estimate_amount_cents: 999999999, weighted_scenario_cents: 1, policy_adjustment_cents: 500, one_time_cents: 700, recurring_component_cents: 900, body: "EXECUTIVE", locked: true }, as: LegislativeEconomist, as_user_id: "leg-eco-1", captures: { est: $.data.id } }
          assert:
            - "HTTP 201; SourceEstimate.${est}.weighted_scenario_cents == 1296456684, policy_adjustment_cents == 0, one_time_cents == 0"
            - "SourceEstimate.${est}.recurring_component_cents == 1296456684 and estimate_amount_cents == 1296456684 — none of the five supplied money values survived"
            - "SourceEstimate.${est}.body == LEGISLATIVE (derived from the caller's role, not from the supplied \"EXECUTIVE\") and submitted_by_user_id == \"leg-eco-1\""
            - "SourceEstimate.${est}.judgmental_adjustment_cents == 0 (the one genuinely-input money field, defaulted) and locked == false"

  # ===========================================================================
  # SECTION 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: forecast_cycle_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.ForecastCycle.initial_state
          - entities.ForecastCycle.fields.status
          - endpoints[POST /forecast-cycles]
        distinguishing_aspect: |
          A newly created ForecastCycle is born in the machine's declared initial_state DRAFT with
          reopen_count 0 and no ratified round — not in INPUTS_LOCKED, even though no scenario has
          been added yet.
        test_recipe:
          setup:
            - "Empty database except for the clock pin."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          assert:
            - "HTTP 201; ForecastCycle.${cyc}.status == DRAFT"
            - "ForecastCycle.${cyc}.reopen_count == 0 and ratified_round_id == null"
            - "GET /forecast-cycles with status DRAFT returns total_count == 1"

      - name: lock_inputs_with_weights_below_total_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ForecastCycle.DRAFT_to_INPUTS_LOCKED
          - validations[priority 46 ERR_SCENARIO_WEIGHTS_INVALID]
          - errors[ERR_SCENARIO_WEIGHTS_INVALID]
          - entities.ForecastCycle.fields.scenario_weight_total_bps
        distinguishing_aspect: |
          The DRAFT -> INPUTS_LOCKED precondition is scenario_weight_total_bps == 10000 exactly; with
          two scenarios totalling 9000 bps the transition is refused with
          ERR_SCENARIO_WEIGHTS_INVALID 422 and the cycle stays DRAFT.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle carrying exactly two scenarios weighted 6000 and 3000 bps, so scenario_weight_total_bps is 9000."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 3000, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422 and ${err} == ERR_SCENARIO_WEIGHTS_INVALID"
            - "ForecastCycle.${cyc}.status == DRAFT and scenario_weight_total_bps == 9000"
            - "GET /forecast-cycles/${cyc}/scenarios returns total_count == 2 (both scenarios remain mutable)"

      - name: lock_inputs_side_effect_freezes_scenarios
        claim_type: side_effect_execution
        grounds:
          - state_machines.ForecastCycle.DRAFT_to_INPUTS_LOCKED
          - validations[priority 9 ERR_CYCLE_NOT_IN_DRAFT]
          - endpoints[PATCH /economic-scenarios/{id}]
        distinguishing_aspect: |
          The declared side effect "the cycle's EconomicScenario rows become immutable" is observable:
          after lock-inputs the same PATCH that succeeded in DRAFT returns ERR_CYCLE_NOT_IN_DRAFT 409
          and the scenario's weight_bps is unchanged at 6000.
        test_recipe:
          setup:
            - "One FY2027 cycle with the three canonical scenarios totalling 10000 bps, driven to INPUTS_LOCKED."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1", captures: { sc_base: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "PATCH /economic-scenarios/${sc_base}", payload: { weight_bps: 5000 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and ${err} == ERR_CYCLE_NOT_IN_DRAFT"
            - "EconomicScenario.${sc_base}.weight_bps == 6000 and version == 1"
            - "ForecastCycle.${cyc}.status == INPUTS_LOCKED and scenario_weight_total_bps == 10000"

      - name: certify_from_draft_cycle_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.ForecastCycle.CONSENSUS_REACHED_to_CERTIFIED
          - validations[priority 12 ERR_CYCLE_NOT_CONSENSUS_REACHED]
          - errors[ERR_CYCLE_NOT_CONSENSUS_REACHED]
        distinguishing_aspect: |
          certify is declared only from CONSENSUS_REACHED, so firing it on a DRAFT cycle returns
          ERR_CYCLE_NOT_CONSENSUS_REACHED 409 and none of the four certification side effects run:
          certified_total_cents stays null.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle with no scenarios and no rounds."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and ${err} == ERR_CYCLE_NOT_CONSENSUS_REACHED"
            - "ForecastCycle.${cyc}.status == DRAFT, certified_total_cents == null, certified_at == null, shortfall_pct_bps == null"

      - name: lock_inputs_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ForecastCycle.DRAFT_to_INPUTS_LOCKED
          - validations[priority 9 ERR_CYCLE_NOT_IN_DRAFT]
        distinguishing_aspect: |
          lock-inputs is not idempotent: the second call on an already INPUTS_LOCKED cycle returns
          ERR_CYCLE_NOT_IN_DRAFT 409 rather than a second 200, and the cycle's version does not move
          again.
        test_recipe:
          setup:
            - "One FY2027 cycle with the three canonical scenarios, already locked once (version 5 after 1 create + 3 scenario bumps + 1 lock bump)."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and ${err} == ERR_CYCLE_NOT_IN_DRAFT"
            - "ForecastCycle.${cyc}.status == INPUTS_LOCKED and version == ${cyc_v} (no further bump)"

      - name: retracted_briefing_rejects_second_retract
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RatingAgencyBriefing.terminal_states
          - state_machines.RatingAgencyBriefing.DRAFT_to_RETRACTED
          - validations[priority 23 ERR_BRIEFING_NOT_PUBLISHABLE]
          - validations[priority 24 ERR_BRIEFING_TERMINAL]
        distinguishing_aspect: |
          RETRACTED is the briefing machine's only terminal state: a second retract returns
          ERR_BRIEFING_TERMINAL 409, and an attempted publish returns ERR_BRIEFING_NOT_PUBLISHABLE 409
          because priority 23 (neither DRAFT nor STALE) is evaluated before priority 24 on the publish
          endpoint.
        test_recipe:
          setup:
            - "One fund and one DRAFT FY2027 cycle; one briefing drafted against them and then retracted."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id } }
            - { call: "POST /rating-briefings", payload: { fund_id: "${fnd}", cycle_id: "${cyc}", narrative: "Reserve adequacy walkthrough for the FY2027 baseline forecast." }, as: RatingAnalyst, as_user_id: "ra-1", captures: { brf: $.data.id } }
            - { call: "POST /rating-briefings/${brf}/retract", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { brf_v: $.data.version } }
          trigger:
            - { call: "POST /rating-briefings/${brf}/retract", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err_retract: $.data.error_id } }
            - { call: "POST /rating-briefings/${brf}/publish", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { err_publish: $.data.error_id } }
          assert:
            - "first trigger: HTTP 409 and ${err_retract} == ERR_BRIEFING_TERMINAL"
            - "second trigger: HTTP 409 and ${err_publish} == ERR_BRIEFING_NOT_PUBLISHABLE (priority 23 masks priority 24 on publish)"
            - "RatingAgencyBriefing.${brf}.status == RETRACTED, published_at == null, version == ${brf_v}"

      - name: cycle_reopen_returns_to_draft_and_supersedes_round
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ForecastCycle.IN_CONSENSUS_to_DRAFT
          - state_machines.ConsensusRound.OPEN_to_SUPERSEDED
          - entities.ForecastCycle.fields.reopen_count
          - endpoints[POST /forecast-cycles/{id}/reopen]
        distinguishing_aspect: |
          The cycle machine loops IN_CONSENSUS -> DRAFT: after reopen the cycle is DRAFT again with
          reopen_count 1 and ratified_round_id null, while its only round is driven to the terminal
          SUPERSEDED — the loop does not resurrect the round.
        test_recipe:
          setup:
            - "One ACTIVE PIT source; one FY2027 cycle with the three canonical scenarios, locked, with one OPEN round (no estimates filed), so the cycle is IN_CONSENSUS."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/reopen", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          assert:
            - "HTTP 200; ForecastCycle.${cyc}.status == DRAFT, reopen_count == 1, ratified_round_id == null"
            - "ConsensusRound.${rnd}.status == SUPERSEDED and round_number == 1"
            - "GET /forecast-cycles/${cyc}/consensus-rounds with status SUPERSEDED returns total_count == 1"
            - "ForecastCycle.${cyc}.scenario_weight_total_bps == 10000 (the scenarios survive the loop and are mutable again)"

      - name: exec_and_leg_submission_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.ConsensusRound.PENDING_to_SUBMITTED
          - entities.ConsensusRound.fields.exec_submission_status
          - entities.ConsensusRound.fields.leg_submission_status
          - calculations.consensus_variance
        distinguishing_aspect: |
          The two submission dimensions live on the same ConsensusRound row and move independently:
          after only the executive submits, exec_submission_status is SUBMITTED with exec_total_cents
          1296456684 while leg_submission_status is still PENDING, leg_total_cents null, variance_bps
          null and the round still OPEN; the legislative submit is what drives it to COMPARED with
          variance_bps 0 and reconciled_total_cents 1296456684.
        test_recipe:
          setup:
            - "SHORT chain up to both bodies having filed an unadjusted PIT estimate on an OPEN round; no submit has been issued yet."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
          trigger:
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
          assert:
            - "after the first trigger: ConsensusRound.${rnd}.exec_submission_status == SUBMITTED, leg_submission_status == PENDING, status == OPEN"
            - "after the first trigger: ConsensusRound.${rnd}.exec_total_cents == 1296456684, leg_total_cents == null, variance_bps == null, reconciled_total_cents == null"
            - "after the second trigger: ConsensusRound.${rnd}.status == COMPARED, leg_total_cents == 1296456684, variance_bps == 0, reconciled_total_cents == 1296456684, open_disagreement_count == 0"
            - "GET /disagreement-records with round_id ${rnd} returns total_count == 0"

      - name: ratify_bubbles_cycle_to_consensus_reached_and_locks_estimates
        claim_type: bubble_up
        grounds:
          - state_machines.ConsensusRound.COMPARED_to_RATIFIED
          - state_machines.ForecastCycle.IN_CONSENSUS_to_CONSENSUS_REACHED
          - entities.SourceEstimate.fields.locked
          - validations[priority 17 ERR_ESTIMATE_LOCKED]
        distinguishing_aspect: |
          Ratification bubbles up two levels in one call: the round becomes RATIFIED with ratified_at
          set, the parent cycle auto-transitions IN_CONSENSUS -> CONSENSUS_REACHED with
          ratified_round_id pointing at the round, and every SourceEstimate of the round has locked
          true — so a PATCH that was legal a moment earlier now returns ERR_ESTIMATE_LOCKED 409.
        test_recipe:
          setup:
            - "SHORT chain driven to a COMPARED round with variance_bps 0 and no open disagreements."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { est_exec: $.data.id } }
