      - name: accepted_ownership_change_renames_the_owner_and_clears_abbreviated_eligibility
        claim_type: side_effect_execution
        grounds:
          - state_machines.OwnershipChangeUpdate.FILED_to_ACCEPTED
          - entities.Facility.fields.abbreviated_renewal_eligible
          - entities.OwnershipChangeUpdate.fields.filing_deadline_at
        distinguishing_aspect: |
          The ACCEPT edge is a cross-entity side effect: it writes the new owner_operator_name onto the
          Facility, flips abbreviated_renewal_eligible from true to false (the flag that later blocks an
          ABBREVIATED renewal), appends an OWNERSHIP_CHANGE ledger entry, and increments BOTH the
          facility's and the update's version. A REJECT decision on a second filing touches none of it.
        test_recipe:
