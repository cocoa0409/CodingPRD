          - entities.RonSession.fields.scheduled_start
          - entities.RonSession.fields.scheduled_end
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: "RonSession intervals are half-open [start,end): a second session [10:30,11:30) overlaps an existing [10:00,11:00) for the same notary -> ERR_SESSION_OVERLAP; whereas an exactly-adjacent [11:00,12:00) is accepted (touching boundary, no overlap)."
