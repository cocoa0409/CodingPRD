            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /acknowledgments", payload: { item_id: "${it}" }, as: FinanceOfficer, captures: { ack1: "$.data[0].id" } }
            - { call: "POST /acknowledgments/${ack1}/issue", payload: {}, as: FinanceOfficer }
            - { call: "GET /items/${it}", payload: {}, as: ProcurementOfficer, captures: { it_v2: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 46000, fmv_source: "APPRAISAL", expected_item_version: "${it_v2}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
          trigger:
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /acknowledgments/${ack1}", payload: {}, as: FinanceOfficer, captures: { ack1_st: "$.data.status" } }
            - { call: "GET /acknowledgments", payload: { item_id: "${it}", status: "PENDING" }, as: FinanceOfficer, captures: { ack2_fmv: "$.data[0].fmv_cents" } }
            - { call: "GET /items/${it}", payload: {}, as: ProcurementOfficer, captures: { it_fmv: "$.data.current_fmv_cents" } }
          assert:
            - "hop1: Item.${it}.current_fmv_cents == 46000"
            - "hop2: DonorAcknowledgment.${ack1}.status == VOIDED (voided because it was ISSUED when the re-valuation landed)"
