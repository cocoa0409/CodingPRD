          - state_machines.EnforcementAction.fork_note
        distinguishing_aspect: |
          A third distinct error-category pair (safety vs fiscal). A TERMINATION
          EnforcementAction sitting in NOTIFIED does NOT move the Concession out of
          OPERATIONS — only settle does — so the priority-42 concession-state gate is
          satisfied and the request reaches the two rules actually in contention. The
          proposal is simultaneously frozen by the open enforcement (priority 48) and
          economically void, with new_senior_debt_cents 150000000 below
