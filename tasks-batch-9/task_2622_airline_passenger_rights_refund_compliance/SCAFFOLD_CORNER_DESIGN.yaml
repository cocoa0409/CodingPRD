              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id", ver_after_create: "$.data.version" }
          trigger:
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bk_id}", flight_segment_id: "${seg1_id}", service_type: "SEAT_SELECTION", amount_cents: 2000 }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { anc_id: "$.data.id" }
            - call: "POST /compliance/checked-bags"
              payload: { booking_id: "${bk_id}", tag_number: "BAG0000001", fee_cents: 4500, checked_at_utc: "2026-08-10T11:00:00Z", scheduled_delivery_utc: "2026-08-10T19:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bag_id: "$.data.id" }
            - call: "GET /compliance/bookings/${bk_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ver_final: "$.data.version", collected: "$.data.collected_total_cents" }
          assert:
            - "version was 1 immediately after create (${ver_after_create}) and is 4 after the three child creates (${ver_final})"
            - "collected_total_cents == 56500 (${collected}) == 50000 fare + 2000 ancillary + 4500 bag fee"
            - "segment_count == 1, unused_segment_count == 1, itinerary_scope == DOMESTIC, total_refund_obligated_cents == 0"
            - "AncillaryPurchase.${anc_id}.version == 1 and CheckedBag.${bag_id}.version == 1 — the child rows are untouched by each other's writes"
            - "An obligation create quoting expected_booking_version = 3 now fails with ERR_STALE_BOOKING_VERSION, confirming the increments are observable to the OCC guard"

      - name: election_not_auto_defaulted_at_the_exact_election_deadline_instant
        claim_type: rate_threshold_triggers
        grounds: ["calculations.refund_deadline_resolution.constants.ELECTION_WINDOW_DAYS", "calculations.compliance_sweep_recount", "state_machines.RefundObligation.transitions.PENDING_ELECTION_to_ELECTED_CASH", "entities.PolicyProfile.travel_credit_default_permitted"]
        distinguishing_aspect: "The auto-default threshold is strict: at exactly election_deadline_utc 2026-08-15T10:00:00Z the sweep defaults nothing, one second later it defaults to ELECTED_CASH with election_source AUTO_DEFAULT - and never to travel credit, which is the prohibited default practice."
        test_recipe:
          setup:
            - "Booking 50000 (CREDIT_CARD) with a segment cancelled 2026-08-10T10:00:00Z, so the cascade obligation carries election_deadline_utc 2026-08-15T10:00:00Z and is still PENDING_ELECTION."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T10:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ob_id: "$.data.data[0].id", elect_due: "$.data.data[0].election_deadline_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
          trigger:
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { defaults_at: "$.data.election_auto_defaulted_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:01Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { defaults_after: "$.data.election_auto_defaulted_count" }
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { defaults_replay: "$.data.election_auto_defaulted_count" }
          assert:
            - "election_deadline_utc == 2026-08-15T10:00:00Z (${elect_due})"
            - "The sweep at that exact instant returns election_auto_defaulted_count == 0 (${defaults_at}) and leaves election_status == PENDING_ELECTION"
            - "The sweep one second later returns election_auto_defaulted_count == 1 (${defaults_after}) with election_status == ELECTED_CASH, election_source == AUTO_DEFAULT, settlement_method == ORIGINAL_PAYMENT"
            - "election_status is never ELECTED_CREDIT and credit_bonus_cents stays 0 even though PolicyProfile.travel_credit_default_permitted is true by default"
            - "The immediately replayed sweep at the same instant returns election_auto_defaulted_count == 0 (${defaults_replay}) and does not bump RefundObligation.${ob_id}.version again — the sweep is idempotent"
            - "deadline_breach_flagged_count == 0 in all three sweeps — deadline_utc is 2026-08-17T10:00:00Z"

      - name: answered_complaint_auto_closes_only_past_thirty_days
        claim_type: rate_threshold_triggers
        grounds: ["calculations.compliance_sweep_recount.constants.AUTO_CLOSE_DAYS", "state_machines.ConsumerComplaint.transitions.ANSWERED_to_CLOSED", "entities.Passenger.open_complaint_count"]
        distinguishing_aspect: "AUTO_CLOSE_DAYS is measured from answered_at_utc with a strict comparison, so a sweep at exactly answered_at + 30 days leaves the complaint ANSWERED and reopenable, and only the next second closes it, appends the AUTO_CLOSED activity and drops the passenger's open_complaint_count to 0."
        test_recipe:
          setup:
            - "Complaint received 2026-08-05T09:00:00Z, acknowledged 2026-08-05T10:00:00Z, answered 2026-08-06T09:00:00Z, so the auto-close boundary is 2026-09-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints"
              payload: { booking_id: "${bk_id}", category: "REFUND", channel: "EMAIL", received_at_utc: "2026-08-05T09:00:00Z", summary: "Voucher pushed instead of cash." }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { cmp_id: "$.data.id" }
            - call: "POST /compliance/consumer-complaints/${cmp_id}/acknowledge"
              payload: { acknowledged_at_utc: "2026-08-05T10:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /compliance/consumer-complaints/${cmp_id}/answer"
              payload: { disposition: "POLICY_EXPLAINED", answered_at_utc: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
          trigger:
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { closed_at_boundary: "$.data.complaint_auto_closed_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:01Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { closed_after: "$.data.complaint_auto_closed_count" }
          assert:
            - "The sweep at 2026-09-05T09:00:00Z returns complaint_auto_closed_count == 0 (${closed_at_boundary}) and ConsumerComplaint.${cmp_id}.status == ANSWERED"
            - "The sweep at 2026-09-05T09:00:01Z returns complaint_auto_closed_count == 1 (${closed_after}) and status == CLOSED"
            - "GET /compliance/consumer-complaints/${cmp_id}/activities returns total_count == 4 with data[3].activity_type == AUTO_CLOSED"
            - "Passenger.${pax_id}.open_complaint_count == 0 after the close and was 1 before it"
            - "answer_breached == false and open_violation_count == 0 in both sweeps — the answer landed long inside the 60-day window"
            - "A reopen attempted after the close returns ERR_COMPLAINT_STATE_INVALID (409): CLOSED is terminal"

      - name: cascading_side_effects_depth_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: segment_cancellation_depth_four_cascade
          rationale: "The §1.8 instance verifies the four-level chain (segment status -> later siblings -> obligation mint -> booking ledger and posture) end to end from one declare-disruption call, including the ordering sensitivity that the ledger is recomputed only after the obligation is persisted."

      - name: dual_variant_calculation_both_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: denied_boarding_involuntary_statutory_vs_voluntary_negotiated
          rationale: "The §1.8 instance runs both DeniedBoardingRecord variants over identical inputs and pins the statutory 77500 against the negotiated amount plus the disclosure floor, which is exactly the both-variants-and-delta claim for this layer."

  - section: consistency_model
    instances:
      - name: whole_cancellation_cascade_is_visible_in_the_same_request_cycle
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.FlightSegment.transitions.SCHEDULED_to_CANCELLED", "calculations.booking_ledger_recompute", "endpoints[POST /compliance/flight-segments/{id}/declare-disruption]"]
        distinguishing_aspect: "Consistency is immediate, not eventual: the single declare-disruption response already carries the cancelled segment's final fields, and reads taken with no intervening delay or retry show both minted obligations, the recomputed 92000 ledger, the earliest deadline and the REFUND_OBLIGATED posture — a second identical read returns byte-identical values."
        test_recipe:
          setup:
            - "Booking total_fare_cents = 90000 (CREDIT_CARD) with segments 1 (ZQ410, 30000) and 2 (ZQ520, 60000), plus a 2000 SEAT_SELECTION ancillary on segment 1 still PENDING_DELIVERY; collected_total_cents = 92000 and nothing obligated yet."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ520", origin_iata: "DFW", destination_iata: "LAX", is_international: false, scheduled_departure_utc: "2026-08-10T16:00:00Z", scheduled_arrival_utc: "2026-08-10T18:00:00Z", segment_fare_cents: 60000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg2_id: "$.data.id" }
            - call: "POST /compliance/ancillary-purchases"
              payload: { booking_id: "${bk_id}", flight_segment_id: "${seg1_id}", service_type: "SEAT_SELECTION", amount_cents: 2000 }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { anc_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T10:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg_status: "$.data.status", seg_declared: "$.data.disruption_declared_at_utc" }
            - call: "GET /compliance/bookings/${bk_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { obligated: "$.data.total_refund_obligated_cents", earliest: "$.data.earliest_refund_deadline_utc", posture: "$.data.disruption_posture" }
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ob_first_basis: "$.data.data[0].basis" }
            - call: "GET /compliance/bookings/${bk_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { obligated_again: "$.data.total_refund_obligated_cents", posture_again: "$.data.disruption_posture" }
          assert:
            - "The declare-disruption response itself returns status == CANCELLED (${seg_status}) and disruption_declared_at_utc == 2026-08-10T10:00:00Z (${seg_declared}) — no follow-up read is needed to observe the transition"
            - "GET /compliance/refund-obligations returns total_count == 2 with data[0].basis == FARE (${ob_first_basis}): a FARE obligation of 90000 and an ANCILLARY obligation of 2000, both PROACTIVE / PENDING_ELECTION / UNSETTLED"
            - "Booking.${bk_id}.total_refund_obligated_cents == 92000 (${obligated}) on the FIRST read after the write, equal to collected_total_cents 92000"
            - "Booking.${bk_id}.earliest_refund_deadline_utc == 2026-08-17T10:00:00Z (${earliest}) and disruption_posture == REFUND_OBLIGATED (${posture})"
            - "FlightSegment.${seg2_id}.status == DISRUPTED_UNUSED, Booking.${bk_id}.unused_segment_count == 2 and suppressed_obligation_count == 0"
            - "AncillaryPurchase.${anc_id}.delivery_status == NOT_PROVIDED and refund_obligation_created == true in that same first read"
            - "The repeated booking read returns the identical 92000 (${obligated_again}) and REFUND_OBLIGATED (${posture_again}) — no denormalised field converges late"
            - "GET /compliance/bookings/${bk_id}/refund-exposure returns remaining_headroom_cents == 0 immediately, so the cascade consumed the whole collected total in one cycle"
