            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "TONSILLECTOMY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-04T09:00:00Z", end_at: "2026-08-04T10:00:00Z", physician_user_id: "u_ent_1" }
              as: PracticeAdmin
              captures: { book_id: $.data.id }
            - call: "POST /surgery-center-blocks"
              payload: { center_name: "Day Surgery East", block_start_at: "2026-08-07T08:00:00Z", block_end_at: "2026-08-07T12:00:00Z" }
              as: PracticeAdmin
              captures: { block_id: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_id}/discard"
              payload: { discard_reason: "CONTAMINATION" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /procedure-bookings/${book_id}/cancel"
              payload: { cancel_reason: "PATIENT_REQUEST" }
              as: PracticeAdmin
            - call: "POST /surgery-center-blocks/${block_id}/close"
              payload: {}
              as: PracticeAdmin
          trigger:
            - call: "POST /immunotherapy-vials/${vial_id}/discard"
              payload: { discard_reason: "CONTAMINATION" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /procedure-bookings/${book_id}/cancel"
              payload: { cancel_reason: "PATIENT_REQUEST" }
              as: PracticeAdmin
            - call: "POST /surgery-center-blocks/${block_id}/close"
              payload: {}
              as: PracticeAdmin
          assert:
            - "The second discard returns HTTP 409 with error.id == \"ERR_VIAL_STATE_INVALID\""
            - "The second cancel returns HTTP 409 with error.id == \"ERR_BOOKING_STATE_INVALID\""
            - "The second close returns HTTP 409 with error.id == \"ERR_BLOCK_STATE_INVALID\""
            - "None of the three rejections re-applied its side effects: ImmunotherapyVial.${vial_id}.volume_ml_wasted is still 5.00 (not doubled), ProcedureBooking.${book_id}.cancel_reason is still \"PATIENT_REQUEST\" and SurgeryCenterBlock.${block_id}.status is still \"CLOSED\""
            - "The vial identity still holds: 5.00 == 0.00 + 0.00 + 5.00"
            - "SurgeryCenterBlock.${block_id}.booked_minutes == 0 and utilization_bps == 0 — closing an empty block leaves its aggregates at zero"

      - name: revision_limit_reached_on_the_third_submission
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REVISION_LIMIT_REACHED
          - entities.SinuplastyCase.fields.revision_round
        excluded_because:
          difficulty_instance: non_linear_state_machine / sinuplasty_case_revision_cycle
          rationale: "The named §1.8 instance drives the INFO_REQUESTED loop to its cap and asserts that the third submission is rejected with this error while revision_round stays at 2."

      - name: epinephrine_and_washout_gates_on_skin_administration
        claim_type: violation_to_error
        grounds:
