              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: OpsAdmin
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "AUG10" }
              as: StoreClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: OpsAdmin
            - call: "POST /recalls"
              payload: { item_id: "${item_id}", severity: "HAZARD", reason: "shock hazard" }
              as: ComplianceOfficer
              captures: { recall_id: $.data.id }
            - call: "POST /recalls/${recall_id}/activate"
