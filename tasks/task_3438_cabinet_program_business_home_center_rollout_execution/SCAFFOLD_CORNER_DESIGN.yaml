        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Program.version: after a first supersede advanced the program to TRANSITIONING and bumped its version, a second line-create carrying the previously-observed version fails with 412 ERR_STALE_VERSION — the OCC check (priority 4) fires before the state gate (priority 5)."
        test_recipe:
          setup: ["Dealer account; program ACTIVE with line L1; program version captured before any supersede"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer W", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
