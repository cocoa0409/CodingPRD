      - name: both_write_roles_share_the_clock_endpoint
        claim_type: shared_operation_allowed
        grounds:
          - RBAC.StateNfipCoordinator.shared_operations
          - RBAC.FloodplainAdministrator.shared_operations
          - endpoints."POST /floodplain/_clock/set_current_utc"
        distinguishing_aspect: |
          set_current_utc is the one write shared by two roles: the coordinator moves the clock
          first and the administrator moves it again, each seeing the other's value as
          previous_utc, while the appeals board is refused 403 on the identical request.
        test_recipe:
          setup:
            - "Fresh server at the startup default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "data.previous_utc == '2026-09-01T00:00:00Z'"
            - "data.current_utc == '2026-10-01T00:00:00Z'"
            - "the same request repeated as AppealsBoardMember returns 403 ERR_ROLE_NOT_PERMITTED and leaves the clock at 2026-10-01T00:00:00Z"

      - name: coordinator_verifies_what_the_administrator_submits
        claim_type: approval_chain_step
        grounds:
          - RBAC.FloodplainAdministrator.exclusive_operations
          - RBAC.StateNfipCoordinator.exclusive_operations
          - state_machines.HigherStandard
        distinguishing_aspect: |
          The credit chain alternates roles by step: the administrator may submit but not
          verify, so the administrator's verify attempt is 403 while the coordinator's
          identical call moves the package to VERIFIED and lifts the community's verified
          points — a role that owns step N cannot perform step N+1.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; A430_FREEBOARD standard for 2026 claiming 100 points, SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 100, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 200"
            - "HigherStandard.${std_id}.documentation_status == VERIFIED"
            - "HigherStandard.${std_id}.verified_points == 100"
            - "Community.${comm_id}.crs_credit_points_verified == 100"
            - "the same verify call issued as FloodplainAdministrator returns 403 ERR_ROLE_NOT_PERMITTED and leaves documentation_status at SUBMITTED"

  # ===========================================================================
  # Guide section 8 — From Cross-Cutting Complexity Layers
  # Active layers (§1.0 complexity_profile.complexity_layers):
  #   rate_threshold_triggers, cascading_side_effects,
  #   dual_variant_calculation, optimistic_concurrency.
  # Both §1.2.1 concurrency_rules get their own stale-version instance.
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_structure_version_blocks_the_determination_case
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.determination-case-create-stale-structure
          - errors.ERR_STALE_STRUCTURE_VERSION
        distinguishing_aspect: |
          The client reads the structure, a new ledger record then advances its version, and the
          case create carrying the old expected_structure_version is refused 412
          ERR_STALE_STRUCTURE_VERSION — precisely the silent-supersession this OCC rule exists
          to stop — while the same call with the re-read version succeeds.
        test_recipe:
          setup:
            - "Canonical base fixture; one IMPROVEMENT record of 60000 on 2026-05-01."
            - "Client caches the structure version, then a second record of 45000 on 2026-06-01 is appended."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-05-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_1_id: $.data.id }
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_version_stale: $.data.version }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-06-01T00:00:00Z", cost_usd: 45000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2_id: $.data.id }
          trigger:
            - call: "POST /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}", method: "CUMULATIVE", expected_structure_version: "${struct_version_stale}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 412"
            - "data.error_id == 'ERR_STALE_STRUCTURE_VERSION'"
            - "no DeterminationCase exists for ${struct_id}"
            - "Structure.${struct_id}.anchor_record_id == '${rec_2_id}'"
            - "Structure.${struct_id}.cumulative_improvement_pct == 52.50"
            - "Structure.${struct_id}.substantial_status == NONE"
            - "repeating the create with the structure's re-read version returns 201 and a case with computed_ratio_pct null"

      - name: stale_community_version_blocks_the_credit_submission
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.higher-standard-create-stale-community
          - errors.ERR_STALE_COMMUNITY_VERSION
        distinguishing_aspect: |
          Claimed points are only meaningful against the freeboard the client observed, so after
          the adopted freeboard is amended from 1.5 to 2.5 the submission carrying the pre-amend
          community version is refused 412 ERR_STALE_COMMUNITY_VERSION — the claim is never
          silently re-based onto the newer standard.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5; the client caches its version."
            - "The administrator then amends freeboard_ft to 2.5."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version_stale: $.data.version }
            - call: "PATCH /floodplain/communities/${comm_id}"
              payload: { freeboard_ft: 2.5 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 150, expected_community_version: "${comm_version_stale}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 412"
            - "data.error_id == 'ERR_STALE_COMMUNITY_VERSION'"
            - "no HigherStandard exists for the community"
            - "Community.${comm_id}.freeboard_ft == 2.5"
            - "Community.${comm_id}.crs_credit_points_claimed == 0"
            - "repeating the create with the re-read version returns 201 with claimed_points 150 and max_points_allowed 250"

      - name: every_permit_write_advances_the_version_by_exactly_one
        claim_type: optimistic_concurrency
        grounds:
          - entities.DevelopmentPermit.common_fields
          - state_machines.DevelopmentPermit
        distinguishing_aspect: |
          The version an OCC client compares against must move on every write and only on
          writes: create leaves it at 1 and submit, review and issue take it to 2, 3 and 4,
          while the four intervening GETs leave it alone.
        test_recipe:
          setup:
            - "Canonical base fixture; a DRAFT permit."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id, permit_version_created: $.data.version }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "GET /floodplain/permits/${permit_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { permit_version_submitted: $.data.version }
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/permits/${permit_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { permit_version_approved: $.data.version }
          trigger:
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "${permit_version_created} == 1"
            - "${permit_version_submitted} == 2"
            - "${permit_version_approved} == 3"
            - "DevelopmentPermit.${permit_id}.version == 4"
            - "DevelopmentPermit.${permit_id}.status == ISSUED"
            - "two further GETs of the permit leave version at 4"

      - name: second_qualifying_claim_inside_the_window_trips_repetitive_loss
        claim_type: rate_threshold_trigger
        grounds:
          - calculations.repetitive_loss_classification.constants.RL_REPETITIVE_CLAIM_COUNT
          - entities.Property.fields.repetitive_loss_status
        distinguishing_aspect: |
          The threshold is on the rolling window count, not on money: after one 1500 claim the
          property is still NONE, and the second claim seven years later — both well below the
          500 cost floor, so cumulative_improvement_pct never moves — flips it to
          REPETITIVE_LOSS with max_window_claim_count 2.
        test_recipe:
          setup:
            - "Canonical base fixture (market_value_usd 200000)."
            - "One DAMAGE record on 2019-06-01 with cost 400 and claim 1500."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2019-06-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 1500.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_1_id: $.data.id }
            - call: "GET /floodplain/properties/${prop_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rl_status_before: $.data.repetitive_loss_status }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2026-06-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 2000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${rl_status_before} == 'NONE'"
            - "Property.${prop_id}.repetitive_loss_status == REPETITIVE_LOSS"
            - "Property.${prop_id}.qualifying_claim_count == 2"
            - "Property.${prop_id}.max_window_claim_count == 2"
            - "Property.${prop_id}.cumulative_claim_paid_usd == 3500.00"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 0"
            - "Structure.${struct_id}.cumulative_improvement_pct == 0.00"

      - name: fourth_qualifying_claim_escalates_to_severe_repetitive_loss
        claim_type: rate_threshold_trigger
        grounds:
          - calculations.repetitive_loss_classification.constants.RL_SEVERE_CLAIM_COUNT
          - entities.Property.fields.repetitive_loss_status
        distinguishing_aspect: |
          Four 1000 claims total 4000, far below the 200000 market value, so the value branch of
          the severe test cannot fire: the escalation from REPETITIVE_LOSS to
          SEVERE_REPETITIVE_LOSS is driven purely by the count reaching
          RL_SEVERE_CLAIM_COUNT 4 inside one ten-year window.
        test_recipe:
          setup:
            - "Canonical base fixture (market_value_usd 200000)."
            - "Three DAMAGE records with claim 1000 on 2020-01-01, 2022-01-01 and 2024-01-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2020-01-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 1000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2022-01-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 1000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2024-01-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 1000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/properties/${prop_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rl_status_at_three: $.data.repetitive_loss_status }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "DAMAGE", event_date: "2026-01-01T00:00:00Z", cost_usd: 400.00, claim_paid_amount_usd: 1000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_4_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${rl_status_at_three} == 'REPETITIVE_LOSS'"
            - "Property.${prop_id}.repetitive_loss_status == SEVERE_REPETITIVE_LOSS"
            - "Property.${prop_id}.qualifying_claim_count == 4"
            - "Property.${prop_id}.max_window_claim_count == 4"
            - "Property.${prop_id}.cumulative_claim_paid_usd == 4000.00"

      - name: five_hop_cascade_from_inspection_finalize
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PostDisasterInspection.ASSESSED_to_FINALIZED
        excluded_because:
          difficulty_instance: inspection_finalize_cascades_five_hops_to_permit_revision
          rationale: |
            That §1.8 cascade instance walks hops 1-5 end to end — ledger append, aggregate
            recompute, auto determination, permit revision and area staling — which is the whole
            of this layer's claim for the inspection path.

      - name: four_hop_cascade_from_remediation_order_default
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RemediationOrder.DEFAULTED
        excluded_because:
          difficulty_instance: order_default_cascades_four_hops_to_cycle_retrograde
          rationale: |
            That §1.8 cascade instance carries a defaulted order through violation escalation,
            sanction repricing and posture change to the cycle retrograde, covering the
            enforcement cascade in full.

      - name: four_hop_cascade_from_panel_activation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.FirmPanel.PENDING_REVISION_to_EFFECTIVE
        excluded_because:
          difficulty_instance: panel_activation_cascades_four_hops_to_certificate_supersession
          rationale: |
            That §1.8 cascade instance activates a revision and follows panel supersession,
            property repointing, permit re-derivation and certificate supersession, which is the
            map-revision cascade in full.

      - name: dual_variant_ratio_disagreement_on_one_ledger
        claim_type: dual_variant_calculation
        grounds:
          - calculations.substantial_ratio.variants
        excluded_because:
          difficulty_instance: si_ratio_single_event_variant_yields_not_substantial
          rationale: |
            That §1.8 dual-variant instance holds the ledger fixed and shows SINGLE_EVENT
            landing under the 50.00% threshold where CUMULATIVE clears it, which is exactly the
            variant-divergence claim of this layer.

      - name: derived_credit_reconciliation_when_a_standard_is_lowered
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints."PATCH /floodplain/communities/{communityId}"
          - state_machines.HigherStandard.VERIFIED_to_EXPIRED
        excluded_because:
          difficulty_instance: lowering_adopted_freeboard_expires_verified_credit_and_reverses_class
          rationale: |
            That §1.8 instance lowers the adopted freeboard, expires the over-large verified
            credit, re-sums the community's verified points and walks the CRS class back, which
            is the reconciliation claim end to end.

  # ===========================================================================
  # Guide section 9 — From Consistency Model
  # consistency_model: immediate — every derived value and cascade result is
  # visible without any settling delay.
  # ===========================================================================
  - section: consistency model
    instances:

      - name: finalize_cascade_is_readable_with_no_settling_delay
        claim_type: immediate_consistency
        grounds:
          - consistency_model.immediate
          - state_machines.PostDisasterInspection.ASSESSED_to_FINALIZED
        distinguishing_aspect: |
          The very next read after finalize — with no intervening write and no clock advance —
          already shows hop 1's DAMAGE record and hop 2's recomputed aggregates
          (30000/200000 = 15.00%), so nothing about this model tolerates a lagging denormalised
          field.
        test_recipe:
          setup:
            - "Canonical base fixture; sweep opened on 2026-07-15 with a 30-day window and the structure's inspection assessed at 30000."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/communities/${comm_id}/inspection-sweep"
              payload: { declaration_code: "DR-4801", event_date: "2026-07-15T00:00:00Z", inspection_window_days: 30 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/inspections"
              payload: { structure_id: "${struct_id}", status: "SCHEDULED" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { insp_id: "$.data[0].id" }
            - call: "POST /floodplain/inspections/${insp_id}/assess"
              payload: { damage_cost_usd: 30000.00, claim_paid_amount_usd: 0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/inspections/${insp_id}/finalize"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/structures/${struct_id}/improvement-summary"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "both calls return HTTP 200"
            - "PostDisasterInspection.${insp_id}.status == FINALIZED"
            - "PostDisasterInspection.${insp_id}.damage_ratio_pct == 15.00"
            - "the summary read immediately after reports counted_record_count 1 and cumulative_counted_cost_usd 30000.00"
            - "the summary read immediately after reports cumulative_improvement_pct 15.00 and single_event_improvement_pct 15.00"
            - "Structure.${struct_id}.substantial_status == NONE"

      - name: community_posture_is_current_on_the_read_that_follows_the_write
        claim_type: immediate_consistency
        grounds:
          - consistency_model.immediate
          - endpoints."GET /floodplain/communities/{communityId}/compliance-summary"
          - calculations.sanction_risk_and_posture
        distinguishing_aspect: |
          The violation write and the summary read are separate requests, yet the summary
          already carries the recomputed 12 points and the CRITICAL weight's contribution — the
          denormalised sanction fields on Community are updated inside the write, not by a
          later sweep.
        test_recipe:
          setup:
            - "Canonical base fixture with no violations; community at 0 points and GOOD_STANDING."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}/compliance-summary"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { points_before: $.data.sanction_risk_points }
          trigger:
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "ELEVATION_DEFICIENT", severity: "CRITICAL" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { viol_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}/compliance-summary"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "the create returns HTTP 201 and the summary read returns HTTP 200"
            - "${points_before} == 0"
            - "the second summary reports sanction_risk_points 12 and compliance_posture 'ON_PROBATION'"
            - "the second summary reports counted_violation_count 1 and a510_credit_applied 0"
            - "Violation.${viol_id}.status == OPEN"
            - "Violation.${viol_id}.sanction_points_contributed == 12"
            - "Community.${comm_id}.sanction_risk_points == 12"
