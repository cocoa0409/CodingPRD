              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            # first lease, attach DUP-1, take to end-of-term, return + dispose at 2026-03-01
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 1, monthly_rate_factor_bps: 2000, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
