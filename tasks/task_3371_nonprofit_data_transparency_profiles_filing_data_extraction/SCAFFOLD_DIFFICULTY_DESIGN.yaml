            - "Organization.${md_id}.version == ${md_v_pre} + 2 — the PATCH and the cascade's seal revocation each advance it"

      - name: merge_finalization_cascades_three_hops_to_surviving_funder_count
        grounds:
          - state_machines.Organization.ACTIVE_to_MERGED
          - state_machines.IdentityResolutionCase.OPEN_to_FINALIZED
          - calculations.organization_derived_counters
          - entities.IdentityResolutionCase.fields.reassigned_grant_count
          - endpoints.POST_/nonprofits/identity-cases/{id}/finalize
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger than the PATCH cascade: finalizing the
          MERGE case flips the absorbed Organization to MERGED, that flip re-points both of
          its Grant rows to the surviving organization, and that re-pointing recomputes the
          surviving organization's distinct_funder_count from 0 to 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Absorbed org Northgate Pantry has two RECORDED grants, one from funder Harborlight Fund and one from surviving org Southgate Services; surviving org Southgate Services has no grants of its own."
            - "An OPEN MERGE identity case names Northgate Pantry as subject and Southgate Services as surviving organization."
          setup_api_calls:
            - *clock
