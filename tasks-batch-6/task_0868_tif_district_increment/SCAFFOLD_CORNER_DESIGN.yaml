scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: district_create_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.TifDistrict, endpoints]
        distinguishing_aspect: "POST /tif-districts with required fields returns 201, status DRAFT, version 1, and surplus_policy defaults to GROSS when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tif-districts"
              payload: { name: "New TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "TifDistrict.${d_id}.status == DRAFT"
            - "TifDistrict.${d_id}.surplus_policy == GROSS"
            - "TifDistrict.${d_id}.version == 1"

      - name: district_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.TifDistrict, "errors[ERR_DISTRICT_NOT_FOUND]"]
        distinguishing_aspect: "GET /tif-districts/{unknown} returns ERR_DISTRICT_NOT_FOUND with 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tif-districts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISTRICT_NOT_FOUND"
            - "response HTTP status == 404"

      - name: district_create_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.TifDistrict.fields.base_eav_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tif-districts without base_eav_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tif-districts"
              payload: { name: "No Base", municipality_name: "Town", base_tax_year: 2025, term_years: 23 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response HTTP status == 422"

      - name: taxing_body_invalid_enum_body_type_returns_validation
        claim_type: Type Constraints
        grounds: [entities.TaxingBody.fields.body_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST taxing-bodies with body_type not in the enum returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A DRAFT district."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Enum TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "Bad", body_type: "FIRE_DEPT", tax_rate: 0.03 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response HTTP status == 422"

      - name: districts_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.TifDistrict, endpoints]
        distinguishing_aspect: "GET /tif-districts returns a paginated array with total_count and has_more; limit caps the page size."
        test_recipe:
          setup: ["Two districts created."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "L1", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
            - call: "POST /tif-districts"
              payload: { name: "L2", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
          trigger:
            - call: "GET /tif-districts"
              payload: { limit: 1, offset: 0 }
              as: MunicipalAdmin
          assert:
            - "response.data is an array of length 1"
            - "response meta/pagination total_count == 2 and has_more == true"

      - name: obligation_register_sets_seniority_computed
        claim_type: Computed Fields
        grounds: [entities.Obligation.fields.seniority, state_machines.Obligation.UNDER_REVIEW_to_REGISTERED]
        distinguishing_aspect: "seniority is computed at register from obligation_type (BOND->SENIOR); it is not a client input and is set even though the register body omits it."
        test_recipe:
          setup: ["Certified district; a submitted BOND obligation."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Sen TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 5000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          assert:
            - "Obligation.${ob_id}.seniority == SENIOR"
            - "Obligation.${ob_id}.status == REGISTERED"
            - "Obligation.${ob_id}.principal_remaining_cents == 5000000"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: certify_non_draft_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.TifDistrict.DRAFT_to_CERTIFIED, "errors[ERR_DISTRICT_NOT_DRAFT]"]
        distinguishing_aspect: "A second certify on an already-CERTIFIED district returns ERR_DISTRICT_NOT_DRAFT (409)."
        test_recipe:
          setup: ["A certified district."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "C TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISTRICT_NOT_DRAFT"

      - name: add_taxing_body_after_certify_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.TifDistrict.DRAFT_to_CERTIFIED, "errors[ERR_DISTRICT_NOT_DRAFT]"]
        distinguishing_aspect: "Adding a taxing body after certification returns ERR_DISTRICT_NOT_DRAFT — the taxing-body set (and aggregate rate) is frozen at certification."
        test_recipe:
          setup: ["A certified district."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Frz TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "Late County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISTRICT_NOT_DRAFT"

      - name: register_from_proposed_returns_not_in_review
        claim_type: Invalid Transitions
        grounds: [state_machines.Obligation.UNDER_REVIEW_to_REGISTERED, "errors[ERR_OBLIGATION_NOT_IN_REVIEW]"]
        distinguishing_aspect: "Register on a still-PROPOSED (never submitted) obligation returns ERR_OBLIGATION_NOT_IN_REVIEW."
        test_recipe:
          setup: ["Certified district; a PROPOSED BOND obligation (not submitted)."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Prop TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 5000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OBLIGATION_NOT_IN_REVIEW"

      - name: finalize_already_finalized_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.IncrementRecord.CERTIFIED_to_FINALIZED, "errors[ERR_INCREMENT_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED increment returns ERR_INCREMENT_INVALID_STATE."
        test_recipe:
          setup: ["Certified district; a 2026 increment finalized once."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Fin TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
              captures: { ir_id: $.data.id }
            - call: "POST /increment-records/${ir_id}/finalize"
              payload: { collection_rate: 0.95 }
              as: CountyClerk
          trigger:
            - call: "POST /increment-records/${ir_id}/finalize"
              payload: { collection_rate: 0.90 }
              as: CountyClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCREMENT_INVALID_STATE"

      - name: void_already_voided_returns_not_voidable
        claim_type: Invalid Transitions
        grounds: [state_machines.Disbursement.PAID_to_VOIDED, "errors[ERR_DISBURSEMENT_NOT_VOIDABLE]"]
        distinguishing_aspect: "Voiding an already-VOIDED disbursement returns ERR_DISBURSEMENT_NOT_VOIDABLE."
        test_recipe:
          setup: ["Certified funded district; a bond registered; one disbursement paid then voided."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Vd TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 1000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/void"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /disbursements/${disb_id}/void"
              payload: {}
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISBURSEMENT_NOT_VOIDABLE"

      - name: accept_unfiled_report_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AnnualReport.FILED_to_ACCEPTED, "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "Accept on a DRAFT (never filed) report returns ERR_REPORT_INVALID_STATE."
        test_recipe:
          setup: ["Certified district; a DRAFT annual report."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Rep TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { ar_id: $.data.id }
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
          trigger:
            - call: "POST /annual-reports/${ar_id}/accept"
              payload: { expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPORT_INVALID_STATE"

      - name: annual_report_return_cycle_valid
        claim_type: Valid Transition
        grounds: [state_machines.AnnualReport.FILED_to_DRAFT, state_machines.AnnualReport.DRAFT_to_FILED]
        distinguishing_aspect: "FILED->DRAFT (return) then DRAFT->FILED (re-file) succeeds, exercising the report return loop; status ends FILED."
        test_recipe:
          setup: ["Certified district; a filed annual report."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Cyc TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { ar_id: $.data.id }
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: CountyClerk
          trigger:
            - call: "POST /annual-reports/${ar_id}/return"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: CountyClerk
          assert:
            - "AnnualReport.${ar_id}.status == FILED"

      - name: decertify_already_decertified_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TifDistrict.CERTIFIED_to_DECERTIFIED, "errors[ERR_DISTRICT_ALREADY_DECERTIFIED]"]
        distinguishing_aspect: "A second decertify on a DECERTIFIED district returns ERR_DISTRICT_ALREADY_DECERTIFIED (terminal lockdown)."
        test_recipe:
          setup: ["A district decertified via EXPIRATION with no obligations."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Dc TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/decertify"
              payload: { termination_type: "EXPIRATION", termination_tax_year: 2048 }
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/decertify"
              payload: { termination_type: "EXPIRATION", termination_tax_year: 2049 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISTRICT_ALREADY_DECERTIFIED"

      - name: submit_rejected_obligation_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Obligation.UNDER_REVIEW_to_REJECTED, "errors[ERR_OBLIGATION_INVALID_STATE]"]
        distinguishing_aspect: "Submit on a REJECTED (terminal) obligation returns ERR_OBLIGATION_INVALID_STATE."
        test_recipe:
          setup: ["Certified district; a BOND obligation submitted then rejected."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Rj TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 5000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/reject"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OBLIGATION_INVALID_STATE"

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: obligation_interest_accrual_correct
        claim_type: Correct Result
        grounds: [calculations.obligation_interest_accrual, entities.Obligation.fields.accrued_interest_cents]
        distinguishing_aspect: "Accruing one year on a 20,000,000 principal @500bps adds round_half_up(20000000*500/10000)=1,000,000 interest; outstanding becomes 21,000,000."
        test_recipe:
          setup: ["Certified district; a registered SENIOR bond (principal 20,000,000 @500bps)."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Int TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 500, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /obligations/${ob_id}/accrue-interest"
              payload: { accrual_tax_year: 2026 }
              as: MunicipalAdmin
          assert:
            - "Obligation.${ob_id}.accrued_interest_cents == 1000000"
            - "Obligation.${ob_id}.outstanding_balance_cents == 21000000"

      - name: increment_provisional_capture_correct
        claim_type: Correct Result
        grounds: [calculations.increment_capture, entities.IncrementRecord.fields.captured_increment_cents]
        distinguishing_aspect: "Provisional capture on incremental 500,000,000 at rate 0.08: gross 40,000,000, admin fee 1,200,000, captured 38,800,000 credited to the fund."
        test_recipe:
          setup: ["Certified district base 1,000,000,000, aggregate rate 0.08."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Prov TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
              captures: { ir_id: $.data.id }
          assert:
            - "IncrementRecord.${ir_id}.incremental_eav_cents == 500000000"
            - "IncrementRecord.${ir_id}.gross_increment_cents == 40000000"
