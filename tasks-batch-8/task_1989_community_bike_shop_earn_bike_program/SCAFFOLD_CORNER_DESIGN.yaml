            - { call: "POST /training-sessions/${s2}/complete", payload: { marks: [ { attendance_id: "${a2}", outcome: "ATTENDED" } ] }, as: ShopCoordinator }
            - { call: "POST /volunteers/${v}/promote", as: ProgramDirector }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-SN", bike_type: "MTB", wheel_size_inches: 29 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/route", payload: { destination: "REFURBISH", refurb_lead_volunteer_id: "${v}" }, as: ShopCoordinator }
            - { call: "POST /parts", payload: { name: "Cassette", category: "DRIVETRAIN", unit_cost_cents: 100 }, as: ShopCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 10 }, as: ShopCoordinator, captures: { pt_v2: $.data.version } }
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 2, expected_part_version: "${pt_v2}" }, as: Volunteer, as_user_id: "${v}", captures: { u1: $.data.id } }
            - { call: "POST /parts/${pt}/restock", payload: { quantity: 5, unit_cost_cents: 250 }, as: ShopCoordinator, captures: { pt_v3: $.data.version } }
          trigger:
            - { call: "POST /bikes/${bk}/usage-logs", payload: { part_id: "${pt}", quantity: 1, expected_part_version: "${pt_v3}" }, as: Volunteer, as_user_id: "${v}", captures: { u2: $.data.id, u2_cost: $.data.unit_cost_cents } }
            - { call: "GET /usage-logs/${u1}", as: ShopCoordinator, captures: { u1_cost: $.data.unit_cost_cents } }
            - { call: "GET /bikes/${bk}", as: ShopCoordinator, captures: { pc: $.data.parts_cost_cents } }
          assert:
            - "first usage keeps snapshot unit_cost_cents == 100 after the price-raising restock"
            - "second usage snapshots unit_cost_cents == 250"
            - "DonatedBike.${bk}.parts_cost_cents == 450 (2*100 + 1*250)"

      - name: layer_dual_variant_covered
        claim_type: variant_divergence
        grounds: [calculations.donation_receipt_value, calculations.membership_billing, calculations.sale_price]
        excluded_because:
          difficulty_instance: donor_receipt_flat_vs_fmv_diverge
          rationale: "Variant divergence and selection are asserted by the three dual_variant_calc difficulty instances (donor receipt, membership billing, sale quoted/final)."

      - name: layer_cascades_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: hour_void_demotion_releases_bike
          rationale: "N-level cascade ordering is asserted by both transitive_cascade difficulty instances end-to-end."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: bikes_pagination_interaction
        claim_type: pagination
        grounds: ["endpoints[GET /bikes]", response_envelope]
        distinguishing_aspect: "Pagination envelope: with 3 bikes, limit=2 returns has_more true and total_count 3; limit=2&offset=2 returns the last item with has_more false; defaults are limit 10 / offset 0."
        test_recipe:
          setup: ["one donor; three bikes"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D PG", donor_type: "INDIVIDUAL", email: "dpg@x.org" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-P1", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-P2", bike_type: "MTB", wheel_size_inches: 29 }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-P3", bike_type: "BMX", wheel_size_inches: 20 }, as: ShopCoordinator }
          trigger:
            - { call: "GET /bikes?limit=2", as: ShopCoordinator }
            - { call: "GET /bikes?limit=2&offset=2", as: ShopCoordinator }
            - { call: "GET /bikes", as: ShopCoordinator }
          assert:
            - "limit=2: 2 items, total_count 3, has_more true, offset 0"
            - "limit=2&offset=2: 1 item, total_count 3, has_more false"
            - "no params: limit 10, offset 0, 3 items, has_more false"

      - name: bikes_filter_combination
        claim_type: filter_interaction
        grounds: ["endpoints[GET /bikes]"]
        distinguishing_aspect: "Filters compose conjunctively: status=TRIAGED&bike_type=ROAD returns only bikes matching both; donor_id filter returns that donor's bikes only."
        test_recipe:
          setup: ["two donors; bikes: ROAD/TRIAGED, ROAD/RECEIVED, MTB/TRIAGED"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D F1", donor_type: "INDIVIDUAL", email: "df1@x.org" }, as: ShopCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /donors", payload: { display_name: "D F2", donor_type: "ORGANIZATION", email: "df2@x.org" }, as: ShopCoordinator, captures: { d2: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d1}", serial_number: "SN-F1", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /bikes/${b1}/triage", payload: { condition_grade: "B", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d1}", serial_number: "SN-F2", bike_type: "ROAD", wheel_size_inches: 27 }, as: ShopCoordinator }
            - { call: "POST /bikes", payload: { donor_id: "${d2}", serial_number: "SN-F3", bike_type: "MTB", wheel_size_inches: 26 }, as: ShopCoordinator, captures: { b3: $.data.id } }
            - { call: "POST /bikes/${b3}/triage", payload: { condition_grade: "C", frame_damage: false }, as: ShopCoordinator }
          trigger:
            - { call: "GET /bikes?status=TRIAGED&bike_type=ROAD", as: ShopCoordinator }
            - { call: "GET /bikes?donor_id=${d2}", as: ShopCoordinator }
          assert:
            - "status=TRIAGED&bike_type=ROAD: total_count 1, the row is ${b1}"
            - "donor_id=${d2}: total_count 1, the row is ${b3}"

      - name: receipt_and_billing_computed_reads
        claim_type: computed_read
        grounds: ["endpoints[GET /donors/{id}/receipt]", "endpoints[GET /memberships/{id}/billing]"]
        distinguishing_aspect: "Computed reads return their declared inline shapes: receipt exposes donor_id/year/bike_count/flat_total_cents/fmv_total_cents/receipt_method/effective_total_cents; billing exposes membership_id/month/tier/session_count/amount_cents with the month defaulting to the clock month."
        test_recipe:
          setup: ["one donor with one triaged KIDS/A bike; one PRO membership with no sessions"]
          setup_api_calls:
            - { call: "POST /donors", payload: { display_name: "D CR", donor_type: "INDIVIDUAL", email: "dcr@x.org", receipt_method: "FMV_COMPARABLE" }, as: ShopCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /bikes", payload: { donor_id: "${d_id}", serial_number: "SN-CR", bike_type: "KIDS", wheel_size_inches: 20 }, as: ShopCoordinator, captures: { bk: $.data.id } }
            - { call: "POST /bikes/${bk}/triage", payload: { condition_grade: "A", frame_damage: false }, as: ShopCoordinator }
            - { call: "POST /memberships", payload: { member_name: "M CR", member_email: "mcr@x.org", tier: "PRO", end_date: "2026-12-31" }, as: ShopCoordinator, captures: { m: $.data.id } }
          trigger:
            - { call: "GET /donors/${d_id}/receipt", as: ProgramDirector, captures: { eff: $.data.effective_total_cents, meth: $.data.receipt_method } }
            - { call: "GET /memberships/${m}/billing", as: Member, as_user_id: "${m}", captures: { amt: $.data.amount_cents, cnt: $.data.session_count, mon: $.data.month } }
          assert:
            - "receipt without year param defaults to clock year 2026: receipt_method == FMV_COMPARABLE and effective_total_cents == 2400 (FMV variant selected)"
            - "billing without month param defaults to 2026-08: session_count == 0 and amount_cents == 2500 (FLAT_MONTHLY charges regardless of zero usage)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: error_envelope
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses follow the fixed envelope: response_type == error, data.error_id and data.message present, meta.api_request_id and meta.api_request_timestamp present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /bikes/00000000-0000-4000-8000-000000000000", as: ShopCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "http status 404 and data.error_id == ERR_NOT_FOUND"
            - "response_type == error; data.message is a non-empty string; meta.api_request_id and meta.api_request_timestamp are present"

      - name: err_giveaway_quota_exceeded_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_GIVEAWAY_QUOTA_EXCEEDED]"]
        excluded_because:
          difficulty_instance: giveaway_quota_fourth_ok_fifth_rejected
          rationale: "The quota error is triggered and asserted as the failure path of the named boundary difficulty instance."

      - name: err_stand_buffer_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_STAND_BUFFER_CONFLICT]"]
        excluded_because:
          difficulty_instance: stand_buffer_gap_semantics
          rationale: "The stand-buffer error is triggered twice (gap 0 and gap 14m) inside the named resource_temporal_overlap difficulty instance."

  # ---------------------------------------------------------------------------
  - section: consistency
    instances:
      - name: immediate_visibility_after_approve
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, calculations.hours_accrual]
        distinguishing_aspect: "Immediate consistency: the approve response shows HourLog APPROVED, and the very next GET /participants/{id} already reflects hours_earned 2 — no read-your-writes lag."
        test_recipe:
          setup: ["participant; one PENDING 2h log; clock 2026-08-07"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P IV", contact_email: "piv@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 2, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v1}" }, as: ShopCoordinator, as_user_id: "sc-approver-1", captures: { st: $.data.status } }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { h: $.data.hours_earned } }
          assert:
            - "approve response status == APPROVED (mutation visible in the same response)"
            - "immediate GET shows hours_earned == 2"

      - name: immutable_event_rows_have_no_update_channel
        claim_type: immediate_visibility
        grounds: [entities.PartHarvest, entities.SafetyInspection]
        excluded_because:
          difficulty_instance: part_stock_usage_void_conservation
          rationale: "Event-entity persistence and the absence of mutation side channels are exercised through the usage/harvest flows in the compensating-invariant and snapshot corner instances (only void compensation exists, by design)."
  # ---------------------------------------------------------------------------
  # Second validations block: completes error-catalog trigger coverage
  - section: validations
    instances:
      - name: award_fulfill_before_approval_returns_award_not_approved
        claim_type: precondition_enforcement
        grounds: [state_machines.GiveawayAward.APPROVED_to_FULFILLED, "errors[ERR_AWARD_NOT_APPROVED]"]
