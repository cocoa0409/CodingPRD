    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  # ---- Zone ----
  - method: POST
    path: "/parking/zones"
    description: "Create a zone in a garage"
    roles: [FacilityAdmin]
    code: 201
    input: [garage_id, code, zone_type, permit_capacity, rate_plan_id]
    output: Zone
    side_effects: ["validates Zone.code unique within garage"]
  - method: GET
    path: "/parking/zones/{id}"
    description: "Read a zone (includes computed permits_active_count)"
    roles: [FacilityAdmin, EnforcementOfficer, Merchant, Motorist]
    code: 200
    input: []
    output: Zone
    side_effects: []
  - method: GET
    path: "/parking/zones/{id}/spaces"
    description: "List spaces for a zone (reverse-reachability for Space.zone_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Space[]
    side_effects: []
  - method: GET
    path: "/parking/zones/{id}/permits"
    description: "List permits for a zone (reverse-reachability for Permit.zone_id)"
    roles: [FacilityAdmin, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: GET
    path: "/parking/zones/{id}/waitlist"
    description: "List waitlist entries for a zone, ordered by sequence ASC (reverse-reachability for PermitWaitlistEntry.zone_id)"
    roles: [FacilityAdmin, Motorist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PermitWaitlistEntry[]
    side_effects: []
  - method: POST
    path: "/parking/zones/{id}/waitlist"
    description: "Add a waitlist entry for a permit zone"
    roles: [Motorist]
    code: 201
    input: [motorist_id, plate]
