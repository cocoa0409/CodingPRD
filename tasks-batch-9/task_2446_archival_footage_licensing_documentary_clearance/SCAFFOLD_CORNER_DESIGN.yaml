            - call: "POST /productions/${prod_id}/rights-sweep"
              payload: {}
              as: ClearanceSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: ClearanceSupervisor
          trigger:
            - call: "POST /licenses/${lic_id}/renew"
              payload: { additional_term_months: 0 }
              as: ClearanceSupervisor
          assert:
            - "the licence is ACTIVE and the clock sits 45 whole days before 2027-08-15, so priority 40 is satisfied"
            - "the response is 422 ERR_INVALID_RENEWAL_TERM"
            - "License.${lic_id}.term_end_date is still 2027-08-15, term_months is still 12, renewal_count == 0 and renewal_delta_cents == 0"
            - "Production.${prod_id}.committed_fee_cents == 258750 — a refused renewal touches no ledger"

      - name: asset_creation_under_an_abandoned_production_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - state_machines.Production.transitions.DEVELOPMENT_to_ABANDONED
          - errors.ERR_PRODUCTION_NOT_IN_CLEARANCE
        distinguishing_aspect: "Priority 11 admits DEVELOPMENT as well as CLEARANCE, so the refusal must be demonstrated from a terminal ABANDONED production: the same POST that succeeds pre-abandonment is refused afterwards even though the parent still exists (404 is NOT the answer)."
        test_recipe:
          setup: ["One production created and left in DEVELOPMENT, one asset added there, then the production ABANDONED (no licences exist, so priority 31 passes)."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Shelved Film", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Pre-clearance shot", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "ABANDONED", reason: "Funding withdrawn" }
              as: ProductionAdmin
          trigger:
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Too late", timecode_in_seconds: 0, timecode_out_seconds: 30, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "doyle-frank", release_type: "APPEARANCE", depiction_from_date: "2026-03-01", depiction_to_date: "2026-03-31" }
              as: ProductionAdmin
          assert:
            - "the first setup asset was accepted at DEVELOPMENT — priority 11 admits both DEVELOPMENT and CLEARANCE"
            - "both trigger calls return 409 ERR_PRODUCTION_NOT_IN_CLEARANCE, not 404"
            - "Production.${prod_id}.status == ABANDONED and asset_count == 1"
            - "GET /assets?production_id=${prod_id} still returns exactly 1 row"

      - name: locked_production_outranks_the_overlap_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=11]
          - validations[priority=38]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / locked_production_state_error_outranks_license_term_overlap"
          rationale: "The 11-beats-38 pairing on a single request that violates both is exactly the named §1.8 instance."

      - name: stale_chart_outranks_the_cue_sheet_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_chart_referential_error_outranks_cue_sheet_safety_error"
          rationale: "The 20-beats-26 pairing, including the RESTRICTED-posture setup that keeps priority 14 out of the way, is the named §1.8 instance."

      - name: archive_suspension_blocks_execution
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / archive_suspension_blocks_execution_of_an_otherwise_valid_quoted_license"
          rationale: "ERR_ARCHIVE_SUSPENDED on an otherwise perfect QUOTED licence, plus the cure-and-retry, is the named §1.8 instance."

      - name: overlapping_license_term_detected_on_creation
        claim_type: temporal_validation
        grounds:
          - validations[priority=38]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / license_term_adjacency_allowed_but_one_day_intersection_refused"
          rationale: "Half-open adjacency acceptance and the one-day intersection refusal under ERR_LICENSE_TERM_OVERLAP are the named §1.8 instance."

      - name: depiction_window_conflict_detected_on_creation
        claim_type: temporal_validation
        grounds:
          - validations[priority=39]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / depiction_window_thirty_day_quiet_buffer_and_status_filtered_blockers"
          rationale: "The 30-day buffer, the status filter and ERR_DEPICTION_WINDOW_CONFLICT are asserted by the named §1.8 instance."

  - section: endpoints
    instances:

      - name: select_source_promotes_one_candidate_and_demotes_the_previous_winner
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/assets/{id}/select-source
          - entities.SourceCandidate.fields.selection_status
          - entities.Asset.fields.selected_source_candidate_id
        distinguishing_aspect: "Every declared side effect of the action must land, including the re-selection case: the newly chosen candidate becomes SELECTED, the PREVIOUS winner becomes REJECTED (not NOT_SELECTED), untouched candidates keep NOT_SELECTED, and Asset.version advances once per call."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second footage asset and three candidates: two AVAILABLE at two archives and one ELEMENT_MISSING."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Source Swap", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_a: $.data.id }
            - call: "POST /archives"
              payload: { name: "Getty Reels", holder_type: "STOCK_LIBRARY" }
              as: ArchiveResearcher
              captures: { arch_b: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Bridge collapse", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id, av0: $.data.version }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_a}", availability_status: "AVAILABLE", quoted_rate_per_30s_cents: 55000, provenance_confidence: 80 }
              as: ArchiveResearcher
              captures: { c1: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_b}", availability_status: "AVAILABLE", quoted_rate_per_30s_cents: 48000, provenance_confidence: 65 }
              as: ArchiveResearcher
              captures: { c2: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_a}", availability_status: "ELEMENT_MISSING", quoted_rate_per_30s_cents: 30000, provenance_confidence: 20 }
              as: ArchiveResearcher
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${c1}" }
              as: ArchiveResearcher
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${c2}" }
              as: ClearanceSupervisor
          assert:
            - "after call 1: SourceCandidate.${c1}.selection_status == SELECTED, ${c2} and ${c3} still NOT_SELECTED, Asset.${asset_id}.selected_source_candidate_id == ${c1}, Asset.version == ${av0} + 1"
            - "after call 2: ${c2} == SELECTED, ${c1} == REJECTED, ${c3} still NOT_SELECTED, Asset.selected_source_candidate_id == ${c2}, Asset.version == ${av0} + 2"
            - "Asset.${asset_id}.licensing_status is still UNCLEARED — selecting a source is research, not clearance"
            - "GET /assets/${asset_id}/source-candidates?selection_status=REJECTED returns exactly 1 row (${c1})"
            - "GET /archives/${arch_a}/source-candidates returns 2 rows (${c1}, ${c3}) — the archive-side view is unaffected by selection"

      - name: select_source_refused_when_every_candidate_is_unavailable
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/assets/{id}/select-source
          - validations[priority=32]
          - errors.ERR_NO_AVAILABLE_SOURCE
        distinguishing_aspect: "The action is gated on the candidate SET, not on the candidate named: with two candidates present but none AVAILABLE the call is refused and the asset's version must NOT move, and adding an AVAILABLE row later makes the identical request succeed."
        test_recipe:
          setup: ["A production in CLEARANCE with one 45-second footage asset carrying one ELEMENT_MISSING and one RIGHTS_UNCLEAR candidate."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "No Element", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Lost reel", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id, av0: $.data.version }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "ELEMENT_MISSING" }
              as: ArchiveResearcher
              captures: { c1: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "RIGHTS_UNCLEAR" }
              as: ArchiveResearcher
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${c1}" }
              as: ArchiveResearcher
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "00000000-0000-4000-8000-0000000000c9" }
              as: ArchiveResearcher
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { c3: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${c3}" }
              as: ArchiveResearcher
          assert:
            - "call 1 returns 409 ERR_NO_AVAILABLE_SOURCE; Asset.${asset_id}.version is still ${av0} and selected_source_candidate_id is null"
            - "call 2 returns 404 ERR_SOURCE_CANDIDATE_NOT_FOUND — body FK existence (priority 6) is settled before the availability rule at priority 32"
            - "call 4 returns 200 with selected_source_candidate_id == ${c3} and Asset.version == ${av0} + 2 (the candidate insert bumped it once, the selection once)"
            - "SourceCandidate.${c1}.selection_status and ${c2}.selection_status are both still NOT_SELECTED"

