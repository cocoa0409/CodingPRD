            - "err2 == ERR_NOT_RESOURCE_OWNER (BNRZ operator cannot file evidence on an OKTX complaint)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: error_envelope_shape_on_failure
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: "An error response carries meta.api_request_id and meta.api_request_timestamp, response_type == error, and data.error_id / data.message — never a bare status."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stb/carriers/00000000-0000-4000-8000-000000000000"
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CARRIER_NOT_FOUND and http status 404"
            - "response_type == error and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: success_envelope_on_create
        claim_type: response_envelope
        grounds:
          - response_envelope.success
        distinguishing_aspect: "A 201 creation returns response_type == object with the entity under data and the meta block populated."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          assert:
            - "http status 201, response_type == object, data.id == ${c1}"
            - "meta.api_request_id and meta.api_request_timestamp are present"

  # ===========================================================================
  - section: errors
    instances:
      - name: overpayment_rejected_and_state_unchanged
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PAYMENT_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: "PAYMENT of 79500 against an outstanding 79499 (after a 1-cent first payment) fails 402 ERR_PAYMENT_EXCEEDS_OUTSTANDING and leaves the ledger untouched."
        test_recipe:
          setup:
            - "Carrier OKTX with 2025 finding (INADEQUATE). Complaint UPHELD: award 79500, outstanding 79500."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 1 }
              as: CarrierOperator
              as_user_id: "${c1}"
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 79500 }
              as: CarrierOperator
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PAYMENT_EXCEEDS_OUTSTANDING and http status 402 (79500 > outstanding 79499)"
            - "RateComplaint.${rc1}.award_paid_cents == 1 and award_outstanding_cents == 79499 and award_status == PARTIALLY_PAID and status == DECIDED"

      - name: reversal_after_payment_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AWARD_HAS_PAYMENTS]
        distinguishing_aspect: "REVERSAL is the compensating action for an unpaid award only: once any payment posts, REVERSAL fails ERR_AWARD_HAS_PAYMENTS (409)."
        test_recipe:
          setup:
            - "Carrier OKTX with 2025 finding. Complaint UPHELD (award 79500) with a 1-cent payment posted."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
