            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "field intelligence", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
