      - name: duplicate_online_scan_and_offline_upload_on_an_online_session
        claim_type: triggerability
        grounds:
          - validations[priority=12]
          - validations[priority=23]
          - errors.ERR_DUPLICATE_SCAN
          - errors.ERR_SESSION_NOT_OFFLINE_CAPABLE
          - state_machines.DeniedEntryIncident
        distinguishing_aspect: |
          The ONLINE duplicate is the paid path of duplicate handling: unlike the offline
          batch, which downgrades a repeat to DENIED_DUPLICATE inside a 200 response, an
          ONLINE repeat is a 409 ERR_DUPLICATE_SCAN that still persists a ScanEvent, opens a
          DUPLICATE incident and books a strike. Uploading a batch through a session whose
          mode is ONLINE is refused at priority 12 even though the session is OPEN and the
          gate is SCANNING.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1; Gate G1; Ada verified with a bound PAID ticket; clock 2026-09-12T18:10:00Z; ONLINE session S1 open on G1; Ada already scanned IN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { seed: $.data.barcode_seed, bc: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "K1" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { r1: $.data.result }
          trigger:
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "K2" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_dup: $.data.error_id }
            - call: "POST /scan-sessions/${s1_id}/offline-batch"
              payload:
                scans:
                  - { presented_barcode: "${seed}-20", device_fingerprint: "DEV-ADA", direction: "OUT", dedupe_key: "B1", scanned_at: "2026-09-12T18:10:00Z" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e_mode: $.data.error_id }
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { strikes: $.data.strike_count, score: $.data.fraud_risk_score, basis: $.data.fraud_risk_basis }
          assert:
            - "${r1} == ADMITTED on the setup scan"
            - "${e_dup} == ERR_DUPLICATE_SCAN with HTTP 409 — a fresh dedupe_key does not make a second IN legal while the ticket is INSIDE"
            - "GET /scan-events?scan_session_id=${s1_id} has total_count == 2, the second with result DENIED_DUPLICATE and denied_reason_code DUPLICATE_SCAN"
            - "GET /denied-entry-incidents has total_count == 1 with category DUPLICATE, ticket_id ${t_id}, patron_id ${p_ada_id} and status OPEN"
            - "${strikes} == 1, ${score} == 20 and ${basis} == PROVISIONAL"
            - "${e_mode} == ERR_SESSION_NOT_OFFLINE_CAPABLE with HTTP 409, and no third ScanEvent was written — the mode check at priority 12 precedes every barcode adjudication"
            - "Ticket.${t_id}.admission_status is still INSIDE — a duplicate denial moves no admission dimension"

      - name: access_zone_enforcement_refuses_a_wrong_zone_and_a_non_credential_at_back_of_house
