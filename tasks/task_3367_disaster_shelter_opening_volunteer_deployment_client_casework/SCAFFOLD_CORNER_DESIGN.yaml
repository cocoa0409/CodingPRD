            - call: "POST /api/v1/client-cases/${case_id}/recovery-plans"
              payload: { expected_client_case_version: "${case_v_after}", recovery_plan_summary: "Revised recovery plan" }
              as: Caseworker
              captures: { rev_ok: $.data.recovery_plan_revision }
          assert:
            - "the stale-version plan write returns 412 with error_id ERR_STALE_VERSION"
            - "the refreshed-version plan write succeeds with recovery_plan_revision == 2"

      - name: occ_stale_operation_version_on_cost_entry
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[dro-cost-entry-stale-operation]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A cost ledger entry booked with the operation version observed before a phase advance is rejected with 412, while the refreshed version is accepted."
        test_recipe:
          setup: ["region GL, operation DR-9101 with one shelter operation so it can advance to ACTIVE, one fund pool"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id, op_v: $.data.version }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/fund-pools"
              payload: { fund_code: "DR-9101-GEN", restriction_type: "UNRESTRICTED", region_id: "${reg_gl}", total_received_cents: 100000 }
              as: FinanceOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations/${op_id}/advance-phase"
              payload: {}
              as: RegionalCoordinator
              captures: { op_v_after: $.data.version, phase_now: $.data.phase }
          trigger:
            - call: "POST /api/v1/disaster-relief-operations/${op_id}/cost-ledger-entries"
              payload: { expected_disaster_relief_operation_version: "${op_v}", fund_pool_id: "${pool_id}", cost_category: "LOGISTICS", amount_cents: 5000, entry_type: "CHARGE", incurred_at: "2026-09-04T10:00:00Z" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/disaster-relief-operations/${op_id}/cost-ledger-entries"
              payload: { expected_disaster_relief_operation_version: "${op_v_after}", fund_pool_id: "${pool_id}", cost_category: "LOGISTICS", amount_cents: 5000, entry_type: "CHARGE", incurred_at: "2026-09-04T10:00:00Z" }
              as: FinanceOfficer
              captures: { entry_amount: $.data.amount_cents }
          assert:
            - "DisasterReliefOperation.${op_id}.phase == ACTIVE after the phase advance"
            - "the stale-version ledger write returns 412 with error_id ERR_STALE_VERSION"
            - "the refreshed-version ledger write succeeds with amount_cents == 5000"

