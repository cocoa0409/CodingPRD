        grounds:
          - calculations.lot_handling_fee
          - entities.Manufacturer.fields.handling_fee_policy
          - entities.SubmissionLot.fields.handling_fee_cents
        distinguishing_aspect: |
          Under TIERED_RATE the band is chosen by THIS lot's projected unit count
          and applied to every unit in it, so the 99-unit lot pays 99 * 8 = 792
          and the 100-unit lot pays only 100 * 7 = 700: one extra unit lowers the
