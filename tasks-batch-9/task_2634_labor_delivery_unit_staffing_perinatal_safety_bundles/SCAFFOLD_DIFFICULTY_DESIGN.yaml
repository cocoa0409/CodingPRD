              captures: { tier_afs: $.data.acuity_tier, required_afs: $.data.required_coverage_units }
          trigger:
            - call: POST /labor-encounters/${e_id}/advance-phase
              payload: { target_phase: "SECOND_STAGE" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /cesarean-readiness-drills/${drill_id}/validate
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "${s_pso}"
              captures: { readiness_grant: $.data.validated_at }
            - call: POST /labor-encounters/${e_id}/advance-phase
              payload: { target_phase: "SECOND_STAGE" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { phase_final: $.data.labor_phase }
          assert:
            - "trigger[0].response.status == 422"
            - "trigger[0].response.error.code == ERR_CESAREAN_READINESS_NOT_MET"
            - "trigger[2].response.status == 200"
            - "LaborEncounter.${e_id}.labor_phase == SECOND_STAGE"
            - "LaborEncounter.${e_id}.staffing_state == ONE_TO_ONE_COVERED"
            - "LaborEncounter.${e_id}.one_to_one_required == true"
            - "LaborEncounter.${e_id}.required_coverage_units == 4.0"
            - "LaborEncounter.${e_id}.assigned_coverage_units == 4.0"
            - "CareAssignment.${ca_id}.status == ACTIVE"
            - "CareAssignment.${ca_id}.acuity_units_consumed == 4.0"
            - "ShiftAssignment.${sh_bed}.capacity_units_effective == 4.0"
            - "ShiftAssignment.${sh_bed}.assigned_acuity_load_units == 4.0"
            - "CesareanReadinessDrill.${drill_id}.status == VALIDATED"
            - "CesareanReadinessDrill.${drill_id}.measured_d2i_minutes == 18"
            - "ObstetricUnit.${unit_id}.cesarean_readiness_state == DEGRADED"
            - "ObstetricUnit.${unit_id}.current_drill_id == ${drill_id}"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"
            - "ObstetricUnit.${unit_id}.staffing_posture == OPEN"
            - "Bed.${bed_ldr_1}.status == OCCUPIED"

      - name: mobilized_cesarean_event_blocks_partner_pass_check_in_while_admitting_or_credentialed_doula_pass
        grounds:
          - validations[priority 11.6]
          - errors[ERR_VISITATION_RESTRICTED_BY_PROCEDURE]
          - state_machines.SupportPersonPass.ISSUED_to_CHECKED_IN
          - state_machines.EmergencyCesareanEvent.DECISION_DECLARED_to_TEAM_MOBILIZED
          - calculations.support_person_occupancy
          - endpoints[POST /support-person-passes/{passId}/check-in]
        distinguishing_aspect: |
          Whether a SupportPersonPass may enter CHECKED_IN is decided by the status
          of an EmergencyCesareanEvent — an entity the pass has no FK to, reachable
          only sideways through the shared encounter. The two trigger calls are the
          same endpoint against the same encounter at the same clock instant with
          the same occupancy figure, and they diverge purely on the pass's own
          credential: the PARTNER pass is refused with
          422 ERR_VISITATION_RESTRICTED_BY_PROCEDURE because an event on the
          encounter sits in TEAM_MOBILIZED, while the DOULA_CERTIFIED pass with
          or_credentialed == true is admitted. The interaction with the occupancy
          calculation is what makes this hard rather than merely conditional. A
          mobilized event forces the allowance to exactly 1 — overriding the
          BASE_SUPPORT_BY_PHASE value of 2 for ANTEPARTUM and the +1 doula bonus
          alike — so the doula's admission lands exactly on the inclusive
          allowance boundary (0 checked in + 1 <= 1) and any second visitor would
          now fail at priority 15 instead of 11.6. Implementations fail this by
          treating the OR restriction as an occupancy cap only (admitting the
          partner because 0 + 1 <= 2), by locking out the credentialed doula along
          with everyone else, by keying the restriction on the encounter's
          labor_phase (which never moves off ANTEPARTUM here), or by reporting the
          occupancy error at priority 15 for the partner instead of the visitation
          error at 11.6.
        test_recipe:
          setup: |
            A unit with one LDR bed and one OR bed, a VALIDATED 20-minute drill so
            readiness is DEGRADED (mobilize-team refuses a CATEGORY_2_URGENT team
            at NOT_READY), and ACTIVE BEDSIDE shifts for the anesthesiologist, the
            OR-qualified surgical tech and the neonatal resuscitator so the team
            composition check at 11.4 passes. One encounter, still ANTEPARTUM with
            NO care assignment (staff_in_room 0), carries two ISSUED passes: a
            PARTNER pass and a DOULA_CERTIFIED pass whose certification runs to
            2027-01-31 and whose or_credentialed flag is true. A CATEGORY_2_URGENT
            event is declared and its team mobilized, taking OR-01 to OCCUPIED and
            setting encounter.one_to_one_required, which drives
            coverage_deficit_units to 4.0 and the posture to INDUCTION_FROZEN — a
            posture that also caps the allowance at 1, so the two independent
            paths to allowance 1 agree and the boundary is unambiguous.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-25T08:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Bramblewick Shore Maternity", licensed_ldr_beds: 2, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "OR-01", bed_type: "OR" }
              as: PerinatalSafetyOfficer
              captures: { bed_or_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Isambard Ketteridge MD", staff_role: "OB_ATTENDING", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-12-31T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              captures: { s_ob: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Leontine Bruggeman MD", staff_role: "ANESTHESIOLOGIST", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-12-31T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_anes: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Thandeka Mokoena", staff_role: "SURGICAL_TECH", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-12-31T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              captures: { s_tech: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Emyr Llewellyn-Price", staff_role: "NEONATAL_RESUSCITATOR", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-12-31T00:00:00Z", or_circulating_qualified: false }
