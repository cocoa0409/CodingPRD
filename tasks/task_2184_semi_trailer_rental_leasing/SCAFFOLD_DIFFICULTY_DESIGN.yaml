          different endpoint (POST /fleet/agreements/{id}/allocate): with one serviceable trailer
          at a branch whose lease_reserve_pct is 0.25 the peak reserve holds back
          ceil(1 * 0.25) == 1 unit, leaving a pool of exactly ZERO and ERR_NO_ELIGIBLE_TRAILER;
