scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_reservation_returns_201_with_derived_fields
        claim_type: Creation
        grounds:
          - entities.Reservation.fields.trip_type
          - entities.Reservation.fields.planned_days
          - entities.Reservation.fields.quoted_total_cents
        distinguishing_aspect: |
          POST /rental/reservations with all required fields returns 201; server derives
          trip_type==ROUND_TRIP (pickup==dropoff), planned_days==2 (48h), and a quoted_total_cents.
        test_recipe:
          setup:
            - "TRUCK_15 class; HUB location; STANDARD verified customer."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "cre@x.com", full_name: "Cre Ate", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-03T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Reservation.${resv}.trip_type == ROUND_TRIP"
            - "Reservation.${resv}.planned_days == 2"
            - "Reservation.${resv}.booking_status == PENDING AND Reservation.${resv}.fulfillment_status == AWAITING_DISPATCH"

      - name: get_equipment_class_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.EquipmentClass
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /rental/equipment-classes/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rental/equipment-classes/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_location_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.RentalLocation.fields.lot_capacity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /rental/locations omitting required lot_capacity returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/locations"
              payload: { name: "NoCap", state_code: "CA" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_location_default_accepts_one_way_dropoff_true
        claim_type: Defaults
        grounds:
          - entities.RentalLocation.fields.accepts_one_way_dropoff
        distinguishing_aspect: "Omitting accepts_one_way_dropoff defaults to true; status defaults to OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/locations"
              payload: { name: "Defaulted", state_code: "CA", lot_capacity: 3 }
              as: FleetManager
              captures: { loc: $.data.id }
          assert:
            - "RentalLocation.${loc}.accepts_one_way_dropoff == true"
            - "RentalLocation.${loc}.status == OPEN"
            - "RentalLocation.${loc}.on_lot_count == 0"

      - name: equipment_computed_status_and_current_location_ignore_input
        claim_type: System Fields
        grounds:
          - entities.Equipment.fields.status
          - entities.Equipment.fields.current_location_id
        distinguishing_aspect: "On equipment create, status is system-set AVAILABLE and current_location_id is set to home_location_id; client cannot set them."
        test_recipe:
          setup: ["TRUCK_15 class; HUB location."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
          trigger:
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
          assert:
            - "Equipment.${eq}.status == AVAILABLE"
            - "Equipment.${eq}.current_location_id == ${hub}"
            - "RentalLocation.${hub}.on_lot_count == 1"

      - name: create_equipment_class_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EquipmentClass.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "EquipmentClass.category outside {TRUCK, TRAILER, TOW} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental/equipment-classes"
              payload: { code: "BOAT_30", category: "BOAT", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 0 }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: damage_report_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.DamageReport
        distinguishing_aspect: "DamageReport has common_fields:false — it is an append-only event with id+created_at only, no version, no update endpoint; it is discoverable only via GET /rental/contracts/{id}/damage-reports."
        test_recipe:
          setup:
            - "A dispatched ACTIVE contract; one DamageReport filed against it."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "dr@x.com", full_name: "Da Re", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /rental/contracts/${ctr}/damage-reports"
              payload: { assessed_cost_cents: 5000, description: "Scratch" }
              as: LocationAgent
              captures: { dr: $.data.id }
          assert:
            - "HTTP status == 201"
            - "GET /rental/contracts/${ctr}/damage-reports returns an array containing ${dr}"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a reservation already in booking_status CONFIRMED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["TRUCK_15; HUB; one TRUCK_15 home at HUB; verified customer; round-trip reservation CONFIRMED."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "cc@x.com", full_name: "Co Co", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_after_dispatch_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a reservation whose fulfillment_status is DISPATCHED returns ERR_INVALID_STATE — cancel requires AWAITING_DISPATCH."
        test_recipe:
          setup: ["TRUCK_15; HUB; one unit; verified customer; round-trip reservation CONFIRMED then DISPATCHED."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "cd@x.com", full_name: "Ca Di", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${resv}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: settle_before_return_active_contract_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RentalContract.RETURNED_CLEAN_to_SETTLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Settling an ACTIVE (not yet returned) contract returns ERR_INVALID_STATE — settle requires RETURNED_CLEAN/RETURNED_DAMAGED."
        test_recipe:
          setup: ["TRUCK_15; HUB; one unit; verified customer; round-trip reservation dispatched (contract ACTIVE, not returned)."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "se@x.com", full_name: "Se Tt", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: equipment_initial_state_available_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Equipment
          - entities.Equipment.fields.status
        distinguishing_aspect: "A newly created Equipment starts in status AVAILABLE (Equipment state machine initial_state)."
        test_recipe:
          setup: ["TRUCK_15 class; HUB location."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
          trigger:
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
          assert:
            - "Equipment.${eq}.status == AVAILABLE"

      - name: maintenance_on_dispatched_unit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Equipment.AVAILABLE_to_MAINTENANCE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Putting a DISPATCHED/IN_TRANSIT unit into MAINTENANCE returns ERR_INVALID_STATE — maintenance requires AVAILABLE."
        test_recipe:
          setup: ["TRUCK_15; HUB; one unit; verified customer; round-trip reservation dispatched (unit off-lot, IN_TRANSIT)."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "mt@x.com", full_name: "Ma In", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/equipment/${eq}/maintenance"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: transfer_complete_lands_unit_and_rebalances_lots
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DropOffTransfer.APPROVED_to_COMPLETED
          - entities.Equipment.fields.current_location_id
          - entities.RentalLocation.fields.on_lot_count
        distinguishing_aspect: "Completing an APPROVED transfer sets Equipment.current_location_id to the destination and recomputes both lot counts (from -> 0, to -> 1)."
        test_recipe:
          setup: ["TRUCK_15; FROM cap 5 holds one AVAILABLE unit (on_lot_count 1); TO cap 5 empty; transfer FROM->TO REQUESTED then APPROVED."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "FROM", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { from: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "TO", state_code: "NV", lot_capacity: 5 }
              as: FleetManager
              captures: { to: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${from}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/transfers"
              payload: { equipment_id: "${eq}", to_location_id: "${to}", reason: "FLEET_REBALANCE" }
              as: FleetManager
              captures: { t: $.data.id }
            - call: "POST /rental/transfers/${t}/approve"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /rental/transfers/${t}/complete"
              payload: {}
              as: LocationAgent
          assert:
            - "DropOffTransfer.${t}.status == COMPLETED"
            - "Equipment.${eq}.current_location_id == ${to}"
            - "RentalLocation.${from}.on_lot_count == 0 AND RentalLocation.${to}.on_lot_count == 1"

      - name: reject_transfer_leaves_equipment_available
        claim_type: Valid Transition
        grounds:
          - state_machines.DropOffTransfer.REQUESTED_to_REJECTED
          - entities.Equipment.fields.status
        distinguishing_aspect: "Rejecting a REQUESTED transfer terminates it REJECTED and leaves the Equipment AVAILABLE on its from-location (no IN_TRANSIT)."
        test_recipe:
          setup: ["TRUCK_15; FROM cap 5 holds one AVAILABLE unit; TO cap 5; transfer FROM->TO REQUESTED."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "FROM", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { from: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "TO", state_code: "NV", lot_capacity: 5 }
              as: FleetManager
              captures: { to: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${from}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/transfers"
              payload: { equipment_id: "${eq}", to_location_id: "${to}", reason: "FLEET_REBALANCE" }
              as: FleetManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /rental/transfers/${t}/reject"
              payload: {}
              as: FleetManager
          assert:
            - "DropOffTransfer.${t}.status == REJECTED"
            - "Equipment.${eq}.status == AVAILABLE AND Equipment.${eq}.current_location_id == ${from}"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: one_way_quote_uses_flat_fee_not_mileage
        claim_type: Correct Result
        grounds:
          - calculations.reservation_quote
          - entities.EquipmentClass.fields.one_way_flat_cents
        distinguishing_aspect: |
          One-way round-trip-vs-flat selection: a 1-day one-way TRUCK_15 reservation (DECLINED coverage,
          no add-ons) quotes base 4000 + one_way_flat 9900 = 13900; mileage is NOT included.
        test_recipe:
          setup: ["TRUCK_15 (daily 4000, one_way_flat 9900); PICK cap 5; DROP cap 5 accepts one-way; STANDARD verified customer."]
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
