        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-reservation]"]
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_chauffeur_duty_conserved_across_assign_then_cancel
          rationale: "OCC happy-path on POST /assignments is embedded in every §1.8 assign chain; the stale-version negative is covered by the dedicated corner instance occ_farmout_stale_reservation_version below as the representative OCC stale test for both write_endpoints sharing ERR_STALE_VERSION."

      - name: occ_farmout_stale_reservation_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[farmout-create-stale-reservation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads reservation version after CONFIRM, an in-house Assignment is created (bumps version), then POST /farm-out-orders carrying the now-stale expected_reservation_version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["CONFIRMED reservation; client captured its post-confirm version; then an Assignment was created bumping the version."]
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { company_name: "Acme", billing_email: "ap@acme.com" }
              as: DispatchAdmin
              captures: { acct: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
