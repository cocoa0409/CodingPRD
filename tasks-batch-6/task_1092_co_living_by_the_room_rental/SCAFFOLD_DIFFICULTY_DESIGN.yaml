      - name: membership_cancel_conserves_house_room_state_partition
        grounds:
          - calculations.house_room_state_counts
          - state_machines.Membership.PENDING_MOVE_IN_to_CANCELLED
          - state_machines.Room.RESERVED_to_VACANT
          - entities.House.fields.occupied_room_count
          - entities.House.fields.vacant_room_count
        distinguishing_aspect: |
          A different kind of conserved quantity from the money invariant: the House room-state
          PARTITION, pinned as total_room_count == vacant + reserved + occupied +
          notice_pending + out_of_service. Reserving a room and then cancelling the tenancy must
          restore vacant_room_count to 3 and occupied_room_count to its exact pre-creation value
          of 0 while the partition holds at every step.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; house Peachtree A with three rooms 101, 102 and 103, all VACANT."
            - "House counts read total 3, vacant 3, reserved 0, occupied 0, notice_pending 0, out_of_service 0."
            - "Ada holds an APPROVED application on room 102 and no tenancy yet."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "102", weekly_rate_cents: 20000, monthly_rate_cents: 80000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
              captures: { room2_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "103", weekly_rate_cents: 30000, monthly_rate_cents: 120000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
              captures: { room3_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Ada Reyes", email: "ada@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m1_id}", room_id: "${room2_id}", requested_move_in_date: "2026-06-04", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /co-living/applications/${app1_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-A1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /co-living/houses/${house_id}"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { vacant_before: $.data.vacant_room_count, occupied_before: $.data.occupied_room_count }
          trigger:
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-04" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/cancel"
              payload: { cancel_reason: "applicant took another room off-platform" }
              as: CommunityManager
              as_user_id: "cm-1"
          assert:
            - "before the trigger, ${vacant_before} == 3 and ${occupied_before} == 0"
            - "after the membership create, House.${house_id}.vacant_room_count == 2, reserved_room_count == 1, occupied_room_count == 0, and the five buckets sum to total_room_count == 3"
            - "after the cancel, House.${house_id}.vacant_room_count == 3, reserved_room_count == 0, notice_pending_room_count == 0, out_of_service_room_count == 0"
            - "after the cancel, House.${house_id}.occupied_room_count == 0, exactly the pre-creation value"
            - "after the cancel, House.${house_id}.total_room_count == 3 and equals vacant + reserved + occupied + notice_pending + out_of_service"
            - "Membership.${mem1_id}.tenancy_status == CANCELLED"
            - "Room.${room2_id}.occupancy_state == VACANT and Room.${room2_id}.available_from_date == null"
            - "Application.${app1_id}.status is still CONVERTED"
