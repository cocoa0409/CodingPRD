            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o2_id}", address: "1 Elm St", sale_price_cents: 44000000, sale_date: "2026-06-15", distance_miles: 0.40, site_adjustment_cents: 500000, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { c21: $.data.id }
            - { call: "POST /appraisal/comparables/${c21}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${c21}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o2_id}", address: "2 Elm St", sale_price_cents: 46000000, sale_date: "2026-06-10", distance_miles: 0.80, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: -300000 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { c22: $.data.id }
            - { call: "POST /appraisal/comparables/${c22}/verify", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - { call: "POST /appraisal/comparables/${c22}/lock", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
              payload: { order_id: "${o2_id}", address: "3 Elm St", sale_price_cents: 45000000, sale_date: "2026-05-20", distance_miles: 1.20, site_adjustment_cents: 0, gla_adjustment_cents: 0, condition_adjustment_cents: 0 }
              as: Appraiser
