        no partial mutation of the car.
      - POST /api/v1/retrofit-work-orders for [2026-10-11, 2026-10-21) returns HTTP 201 because the two
        half-open windows touch at 2026-10-11 and their intersection is empty (max(2026-10-01, 2026-10-11)
