          MIN_DOWNGRADIENT_WELLS is an inclusive floor: exactly 3 certified downgradient wells is
          sufficient and 2 is not. Two units are built side by side differing only in that one well, so an
          implementation using a strict `>` comparison certifies neither and one using `>= 2` certifies
          both.
        test_recipe:
          setup:
            - "Unit A with BG-01 plus DG-01, DG-02, DG-03 — exactly at the floor"
