              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CASH", tendered_cash_cents: 300 }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_INSUFFICIENT_CASH_TENDERED"]

      - name: error_allergen_restriction_conflict
        claim_type: Violation to Error
        grounds: ["errors[ERR_ALLERGEN_RESTRICTION_CONFLICT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_constraint_on_line_add
          rationale: "Asserted as the winning (higher-priority) error of the named §1.8 instance."

      - name: error_order_not_open_on_paid_line_add
        claim_type: Violation to Error
        grounds: ["errors[ERR_ORDER_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_temporal_on_paid_order_line
          rationale: "Asserted as the winning error when a line is added to a PAID order in the named §1.8 instance."

      - name: error_drawer_not_open_on_pay
        claim_type: Violation to Error
        grounds: ["errors[ERR_DRAWER_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pay_requires_drawer_open
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."

      - name: error_flavor_unavailable_on_start_production
        claim_type: Violation to Error
        grounds: ["errors[ERR_FLAVOR_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / startproduction_requires_flavor_available
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."

      - name: error_cart_overlap
        claim_type: Violation to Error
        grounds: ["errors[ERR_CART_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / event_cart_overlap_halfopen
          rationale: "Asserted directly by the named §1.8 overlap instance."

      - name: error_station_overlap
        claim_type: Violation to Error
        grounds: ["errors[ERR_STATION_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_overlap_buffered_touching_rejected
          rationale: "Asserted directly by the named §1.8 overlap instance."

      - name: event_cart_touching_windows_allowed
        claim_type: Satisfaction to Pass
        grounds: ["validations[priority=9]", "entities.CateringBooking.fields.event_start_utc"]
        distinguishing_aspect: "Half-open semantics: booking B [12:00,14:00) directly after A [10:00,12:00) on the same cart is ACCEPTED (touching endpoints do not overlap) -> 201 BOOKED."
        test_recipe:
          setup: ["Vanilla + 1000 ml batch; EventCart; booking A [10:00,12:00) reserving 100 ml"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 1000, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-30T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /event-carts"
              payload: { name: "Cart 1", capacity_ml: 5000 }
              as: Manager
              captures: { ec: $.data.id }
            - call: "POST /catering-bookings"
              payload: { event_cart_id: "${ec}", event_start_utc: "2026-05-02T10:00:00Z", event_end_utc: "2026-05-02T12:00:00Z", requested_items: [{ flavor_id: "${van}", volume_ml: 100 }] }
              as: Manager
              captures: { bkA: $.data.id }
          trigger:
            - call: "POST /catering-bookings"
              payload: { event_cart_id: "${ec}", event_start_utc: "2026-05-02T12:00:00Z", event_end_utc: "2026-05-02T14:00:00Z", requested_items: [{ flavor_id: "${van}", volume_ml: 100 }] }
              as: Manager
              captures: { bkB: $.data.id }
          assert:
            - "CateringBooking.${bkB}.status == BOOKED"
            - "CateringBooking.${bkB}.estimate_cents == 200"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_flavors_pagination_envelope
        claim_type: Computed read
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /flavors?limit=1&offset=0 returns response_type=array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two flavors created"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
            - call: "POST /flavors"
              payload: { name: "Chocolate", standard_cost_cents_per_ml: 1.90, par_level_ml: 300 }
              as: Manager
          trigger:
            - call: "GET /flavors"
              payload: { limit: 1, offset: 0 }
              as: Scooper
          assert:
            - "response_type == array; response.data length == 1"
            - "meta/pagination reports total_count == 2 and has_more == true"

      - name: list_batches_by_flavor_reverse_reachability
        claim_type: Standard CRUD
        grounds: [entities.Batch.fields.flavor_id, endpoints]
        distinguishing_aspect: "GET /batches?flavor_id={van} returns the single batch of that flavor (FK reverse-reachability)."
        test_recipe:
          setup: ["Vanilla flavor + one batch"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
          trigger:
            - call: "GET /batches"
              payload: { flavor_id: "${van}" }
              as: Baker
          assert:
            - "response.data is a Batch[] of length 1 whose element id == ${b}"

      - name: list_orderlines_by_order_reverse_reachability
        claim_type: Standard CRUD
        grounds: [entities.OrderLine.fields.order_id, endpoints]
        distinguishing_aspect: "GET /order-lines?order_id={ord} returns the ACTIVE line added to that order."
        test_recipe:
          setup: ["Vanilla + batch; SINGLE size; OPEN drawer + order with one line"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          trigger:
            - call: "GET /order-lines"
              payload: { order_id: "${ord}" }
              as: Scooper
          assert:
            - "response.data is an OrderLine[] of length 1 whose element id == ${ln}"

      - name: remove_line_recomputes_order_totals_immediate
        claim_type: Action endpoint
        grounds: [endpoints, entities.OrderLine.fields.status, entities.Order.fields.subtotal_cents]
        distinguishing_aspect: "Deleting the only ACTIVE line marks it REMOVED and immediately recomputes Order.subtotal_cents to 0 and releases the batch reservation."
        test_recipe:
          setup: ["Vanilla + batch 500; DOUBLE size; OPEN drawer + order with one DOUBLE line (reserves 180)"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
              captures: { ln: $.data.id }
          trigger:
            - call: "DELETE /orders/${ord}/lines/${ln}"
              payload: {}
              as: Scooper
          assert:
            - "OrderLine.${ln}.status == REMOVED"
            - "Order.${ord}.subtotal_cents == 0"
            - "Batch.${b}.reserved_volume_ml == 0"

  # ===========================================================================
  - section: rbac
    instances:
      - name: baker_cannot_create_flavor_forbidden
        claim_type: Cannot perform other role exclusive op
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Baker POST /flavors -> 403 ERR_FORBIDDEN (flavor config is Manager-exclusive)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Baker
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_FORBIDDEN"]

      - name: scooper_cannot_open_drawer_forbidden
        claim_type: Cannot perform other role exclusive op
        grounds: ["roles", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Scooper POST /cash-drawer-sessions -> 403 ERR_FORBIDDEN (drawer lifecycle is ShiftLead-exclusive)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_FORBIDDEN"]

      - name: scooper_cannot_requote_forbidden
        claim_type: Cannot perform other role exclusive op
        grounds: ["roles", "errors[ERR_FORBIDDEN]", "concurrency_rules[preorder-requote-stale]"]
        distinguishing_aspect: "Scooper POST /pre-orders/{id}/requote -> 403 ERR_FORBIDDEN (re-quote is Manager-exclusive)."
        test_recipe:
          setup: ["Vanilla + station; PreOrder QUOTED (version captured)"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id, pov: $.data.version }
          trigger:
            - call: "POST /pre-orders/${po}/requote"
              payload: { quoted_price_cents: 4500, expected_preorder_version: "${pov}" }
              as: Scooper
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_FORBIDDEN"]

      - name: missing_auth_header_unauthenticated
        claim_type: Cannot perform other role exclusive op
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers -> 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB; request sent with headers omitted"]
          setup_api_calls: []
          trigger:
            - call: "GET /flavors"
              payload: {}
              as: Scooper
              captures: { err: $.data.error_id }
          assert:
            - "With X-User-ID and X-User-Role omitted, response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: requote_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-requote-stale]", "validations[priority=12]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads PreOrder.version==1, re-quotes successfully (version->2), then re-quotes again still carrying expected_preorder_version==1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Vanilla + station; PreOrder QUOTED, version captured as pov1 (==1)"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id, pov1: $.data.version }
            - call: "POST /pre-orders/${po}/requote"
              payload: { quoted_price_cents: 4500, expected_preorder_version: "${pov1}" }
              as: Manager
              captures: { pov2: $.data.version }
          trigger:
            - call: "POST /pre-orders/${po}/requote"
              payload: { quoted_price_cents: 4800, expected_preorder_version: "${pov1}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_STALE_VERSION"]

      - name: requote_correct_version_supersedes_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-requote-stale]", "entities.PreOrder.fields.quoted_price_cents", "entities.PreOrder.fields.version"]
        distinguishing_aspect: "Re-quote carrying the current version succeeds: quoted_price_cents replaced with 4500 and version incremented from 1 to 2."
        test_recipe:
          setup: ["Vanilla + station; PreOrder QUOTED at 4000, version captured pov1 (==1)"]
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Rey", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id, pov1: $.data.version }
          trigger:
            - call: "POST /pre-orders/${po}/requote"
              payload: { quoted_price_cents: 4500, expected_preorder_version: "${pov1}" }
              as: Manager
          assert:
            - "PreOrder.${po}.quoted_price_cents == 4500"
            - "PreOrder.${po}.version == 2"

