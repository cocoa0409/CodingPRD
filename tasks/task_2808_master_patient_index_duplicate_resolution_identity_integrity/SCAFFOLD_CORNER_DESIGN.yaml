            - "Trigger call 1: HTTP 409 with $.data.error_id == \"ERR_MERGE_INVALID_STATE\"; MergeOperation.${merge_xb_id}.version stays 2 and unmerge_reason stays \"Wrong survivor chosen.\""
            - "Trigger call 2: HTTP 409 with $.data.error_id == \"ERR_OVERLAY_INVALID_STATE\"; OverlayCorrection.${ov_xb_id}.version stays 2 and GET /mpi/propagation-tasks?overlay_correction_id=${ov_xb_id} still returns exactly 1 row"
            - "Trigger call 3: HTTP 409 with $.data.error_id == \"ERR_REMEDIATION_INVALID_STATE\"; ContaminationRemediation.${rem_xb_id}.element_count_quarantined stays 30 and version stays 3"
            - "Trigger call 4: HTTP 409 with $.data.error_id == \"ERR_TASK_INVALID_STATE\" (ack requires SENT, and this task is QUEUED); PropagationTask.${task_xb_id}.version stays 1"
            - "GET /mpi/propagation-tasks?merge_operation_id=${merge_xb_id} returns exactly 1 row in state CANCELLED"
            - "PatientRecord.${rec_xb2_id}.identity_state == ACTIVE and clinical_element_count == 30 (the reversal restored it)"

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked before anything else, so a request with no X-User-Role and a request with a role outside the five declared ones both return 401 ERR_UNAUTHENTICATED even when the path id is also nonsense."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite XC-SITE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "XC-SITE", name: "Auth Clinic", region_code: "US-RI", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_xc_id: $.data.id }
          trigger:
            - call: "GET /mpi/registration-sites/${site_xc_id}"
              payload: {}
              as: "<no X-User-Role header sent; X-User-ID present>"
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "XC-OTHER", name: "Rejected Site", region_code: "US-RI", registrar_headcount: 1 }
              as: "<X-User-Role: ChiefOfStaff, which is not one of the five declared roles>"
            - call: "GET /mpi/registration-sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "<no X-User-Role header sent>"
          assert:
            - "Trigger call 1: HTTP 401 with $.data.error_id == \"ERR_UNAUTHENTICATED\""
            - "Trigger call 2: HTTP 401 with $.data.error_id == \"ERR_UNAUTHENTICATED\" (not 403: an unrecognised role never reaches the role check)"
            - "Trigger call 3: HTTP 401 with $.data.error_id == \"ERR_UNAUTHENTICATED\" (priority 1 beats the priority-5 site lookup, so the response is not ERR_SITE_NOT_FOUND)"
            - "GET /mpi/registration-sites/${site_xc_id} as MpiAdmin still returns site_code == \"XC-SITE\", and no second site was created"

