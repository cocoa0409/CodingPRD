# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0411
# 9 rule_ids × 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: patient_responsibility_estimate_vs_final_billing
        grounds:
          - calculations.patient_responsibility
          - entities.TestOrder.fields.estimated_patient_responsibility_cents
          - entities.TestOrder.fields.final_patient_responsibility_cents
          - state_machines.TestOrder.CLASSIFIED_to_SIGNED_OUT
        distinguishing_aspect: |
          For one COMMERCIAL order with allowed_amount 300000, the ESTIMATE variant
          yields estimated_patient_responsibility_cents == 30000 while the FINAL
          variant (incidental finding disclosed) yields
          final_patient_responsibility_cents == 37500 — divergent results for the
          same Billing/TestOrder financial domain.
        test_recipe:
          setup:
            - "Clock 2026-06-19T00:00:00Z; adult patient (dob 2008-06-01)."
            - "PUBLISHED COMMERCIAL panel list_price 400000, requires_consent=true, with gene BRCA1 (acmg_reportable) included."
            - "Order placed, requisition COMMERCIAL submitted (estimate computed on the AUTH_APPROVED step), auth APPROVED allowed_amount 300000."
            - "One incidental PATHOGENIC variant (gene on ACMG list, NOT on panel) classified; consent opted in; report drafted and signed out (incidental disclosed)."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "BRCA1", is_acmg_reportable: true }
              as: LabDirector
              captures: { brca1_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "MLH1", is_acmg_reportable: true }
              as: LabDirector
              captures: { mlh1_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Cancer Panel", list_price_cents: 400000, requires_consent: true }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${brca1_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "1111111111", full_name: "Dr Order" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-A", patient_dob: "2008-06-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "fam hx", insurance_payer: "COMMERCIAL" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/billing/auth-decision"
              payload: { decision: "APPROVED", allowed_amount_cents: 300000 }
              as: BillingSpecialist
            - call: "POST /lab/test-orders/${order_id}/consents"
              payload: { incidental_findings_opt_in: true, signed_by_name: "Pat A" }
              as: LabIntake
              captures: { consent_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/consents/${consent_id}/sign"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "BLOOD", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { spec_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/specimens/${spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${mlh1_id}", hgvs: "c.100C>T" }
              as: MolecularTechnologist
              captures: { var_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants/${var_id}/classify"
              payload: { classification: "PATHOGENIC" }
              as: MolecularTechnologist
              as_user_id: "tech-1"
            - call: "POST /lab/test-orders/${order_id}/classification/complete"
              payload: {}
              as: MolecularTechnologist
            - call: "POST /lab/test-orders/${order_id}/reports"
              payload: {}
              as: MolecularTechnologist
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
          assert:
            - "TestOrder.${order_id}.estimated_patient_responsibility_cents == 30000"
            - "TestOrder.${order_id}.final_patient_responsibility_cents == 37500"
            - "TestOrder.${order_id}.final_patient_responsibility_cents != TestOrder.${order_id}.estimated_patient_responsibility_cents"

      - name: incidental_disclosure_adult_vs_minor_findings
        grounds:
          - calculations.incidental_findings_policy
          - calculations.reportability_selection
          - entities.Report.fields.incidental_disclosed
          - entities.Variant.fields.is_incidental
        distinguishing_aspect: |
          For an identical incidental LIKELY_PATHOGENIC variant + opt-in consent,
          an ADULT (age 18, dob 2008-06-01) order discloses it (Report.incidental_disclosed
          == true) whereas a MINOR (age 16, dob 2010-06-19) order does NOT
          (incidental_disclosed == false) — divergent results in the clinical-findings
          (Report/Variant) domain, a different entity domain from the billing dual-variant.
        test_recipe:
          setup:
            - "Two SELF_PAY orders, both with consent opt_in=true, both with an incidental LIKELY_PATHOGENIC variant in an ACMG gene not on the panel; one adult, one minor; clock 2026-06-19."
            - "Both reach DRAFT report; signed out by a director who did not classify."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "APC", is_acmg_reportable: true }
              as: LabDirector
              captures: { apc_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "TP53", is_acmg_reportable: true }
              as: LabDirector
              captures: { tp53_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Mini Panel", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${apc_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "2222222222", full_name: "Dr Two" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            # ---- MINOR order ----
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-MINOR", patient_dob: "2010-06-19", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { minor_order_id: $.data.id }
            - call: "POST /lab/test-orders/${minor_order_id}/requisition"
              payload: { clinical_indication: "screen", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${minor_order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${minor_order_id}/consents"
              payload: { incidental_findings_opt_in: true, signed_by_name: "Guardian" }
              as: LabIntake
              captures: { minor_consent_id: $.data.id }
            - call: "POST /lab/test-orders/${minor_order_id}/consents/${minor_consent_id}/sign"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${minor_order_id}/specimens"
              payload: { specimen_type: "SALIVA", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 40 }
              as: AccessioningTech
              captures: { minor_spec_id: $.data.id }
            - call: "POST /lab/test-orders/${minor_order_id}/specimens/${minor_spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${minor_order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${minor_order_id}/variants"
              payload: { gene_id: "${tp53_id}", hgvs: "c.200G>A" }
              as: MolecularTechnologist
              captures: { minor_var_id: $.data.id }
            - call: "POST /lab/test-orders/${minor_order_id}/variants/${minor_var_id}/classify"
              payload: { classification: "LIKELY_PATHOGENIC" }
              as: MolecularTechnologist
              as_user_id: "tech-1"
            - call: "POST /lab/test-orders/${minor_order_id}/classification/complete"
              payload: {}
              as: MolecularTechnologist
            - call: "POST /lab/test-orders/${minor_order_id}/reports"
              payload: {}
              as: MolecularTechnologist
              captures: { minor_report_id: $.data.id }
            - call: "POST /lab/test-orders/${minor_order_id}/reports/${minor_report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
            # ---- ADULT order ----
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-ADULT", patient_dob: "2008-06-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { adult_order_id: $.data.id }
            - call: "POST /lab/test-orders/${adult_order_id}/requisition"
              payload: { clinical_indication: "screen", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${adult_order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${adult_order_id}/consents"
              payload: { incidental_findings_opt_in: true, signed_by_name: "Pat Adult" }
              as: LabIntake
              captures: { adult_consent_id: $.data.id }
            - call: "POST /lab/test-orders/${adult_order_id}/consents/${adult_consent_id}/sign"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${adult_order_id}/specimens"
              payload: { specimen_type: "SALIVA", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 40 }
              as: AccessioningTech
              captures: { adult_spec_id: $.data.id }
            - call: "POST /lab/test-orders/${adult_order_id}/specimens/${adult_spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${adult_order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${adult_order_id}/variants"
              payload: { gene_id: "${tp53_id}", hgvs: "c.200G>A" }
              as: MolecularTechnologist
              captures: { adult_var_id: $.data.id }
            - call: "POST /lab/test-orders/${adult_order_id}/variants/${adult_var_id}/classify"
              payload: { classification: "LIKELY_PATHOGENIC" }
              as: MolecularTechnologist
              as_user_id: "tech-1"
            - call: "POST /lab/test-orders/${adult_order_id}/classification/complete"
              payload: {}
              as: MolecularTechnologist
            - call: "POST /lab/test-orders/${adult_order_id}/reports"
              payload: {}
              as: MolecularTechnologist
              captures: { adult_report_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders/${adult_order_id}/reports/${adult_report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
          assert:
            - "Report.${adult_report_id}.incidental_disclosed == true"
            - "Report.${minor_report_id}.incidental_disclosed == false"
            - "TestOrder.${adult_order_id}.has_reportable_incidental == true"
            - "TestOrder.${minor_order_id}.has_reportable_incidental == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pathogenicity_sum_then_round_order_matters
        grounds:
          - calculations.variant_pathogenicity_score
          - entities.Variant.fields.classification
          - entities.Panel.fields.gene_count
        distinguishing_aspect: |
          MODE (b) nested-rounding-order: with gene_count 2 and two primary variants
          (PATHOGENIC=8, VUS=2), sum-then-round gives round(10/16*100)=round(62.5)=63;
          round-per-variant would give a different value. The scaffold pins sum-first,
          divide, multiply, round once -> 63.
        test_recipe:
          setup:
            - "PUBLISHED SELF_PAY panel with 2 genes; order through SEQUENCING with two primary variants classified PATHOGENIC and VUS."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GENEA", is_acmg_reportable: false }
              as: LabDirector
              captures: { ga_id: $.data.id }
            - call: "POST /lab/genes"
              payload: { symbol: "GENEB", is_acmg_reportable: false }
              as: LabDirector
              captures: { gb_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "TwoGene", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${ga_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${gb_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "3333333333", full_name: "Dr Three" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-C", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "BLOOD", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { spec_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/specimens/${spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${ga_id}", hgvs: "c.1A>G" }
              as: MolecularTechnologist
              captures: { v1_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${gb_id}", hgvs: "c.2C>T" }
              as: MolecularTechnologist
              captures: { v2_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants/${v1_id}/classify"
              payload: { classification: "PATHOGENIC" }
              as: MolecularTechnologist
          trigger:
            - call: "POST /lab/test-orders/${order_id}/variants/${v2_id}/classify"
              payload: { classification: "VUS" }
              as: MolecularTechnologist
          assert:
            - "TestOrder.${order_id} variant_pathogenicity_score derived value == 63"

      - name: patient_responsibility_nested_min_tiered_inputs
        grounds:
          - calculations.patient_responsibility
          - entities.Requisition.fields.insurance_payer
          - entities.Billing.fields.allowed_amount_cents
        distinguishing_aspect: |
          MODE (a) nonlinear ≥3-input interaction with nested min/conditional: MEDICARE
          rate 0.20 on allowed 300000 gives gross 60000, capped to ASSISTANCE_CAP 50000,
          and the FINAL with incidental adds 7500 then re-clamps to 60000 -> 57500.
          Estimate vs final and the cap interact non-linearly across rate, base, cap, surcharge.
        test_recipe:
          setup:
            - "MEDICARE order list_price 400000, auth APPROVED allowed 300000; one incidental PATHOGENIC variant, consent opt-in; signed out by non-classifier director; clock 2026-06-19."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
