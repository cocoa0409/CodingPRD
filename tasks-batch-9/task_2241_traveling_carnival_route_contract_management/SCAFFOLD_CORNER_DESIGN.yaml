              as: RouteManager
              captures: { stop_c1: "$.data.id", sv1_c1: "$.data.version" }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_c1a}", route_stop_id: "${stop_c1}", expected_route_stop_version: "${sv1_c1}" }
              as: LotBoss
              captures: { alloc_c1a: "$.data.id" }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_c1b}", route_stop_id: "${stop_c1}", expected_route_stop_version: "${sv1_c1}" }
              as: LotBoss
              captures: { e_c1: "$.data.error_id" }
            - call: "GET /route-stops/${stop_c1}"
              payload: {}
              as: LotBoss
              captures: { sv2_c1: "$.data.version" }
            - call: "POST /ride-allocations"
