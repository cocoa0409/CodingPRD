            - call: "GET /buy-backs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DistributorAdmin
              captures: { e_nf9: $.data.error_id }
            - call: "GET /allocation-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DistributorAdmin
              captures: { e_nf10: $.data.error_id }
            - call: "GET /alternate-approvals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
