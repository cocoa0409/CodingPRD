  # =========================================================================
  # R5 priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resubmit_conflict_state_error_wins_over_margin_floor_breach
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_QUOTE_NOT_DRAFT]
          - errors[ERR_MARGIN_FLOOR_BREACH]
          - state_machines.CompetitiveException.ACCEPTED_to_REVOKED
        distinguishing_aspect: |
          The colliding pair is state (priority 8, ERR_QUOTE_NOT_DRAFT, 409) against business_fiscal
          (priority 15, ERR_MARGIN_FLOOR_BREACH, 422): the quote is PENDING_APPROVAL and its margin
          0.250000 is below the 0.35 floor with no ACCEPTED exception left, so both rules are violated by
          the same submit call and the response must be ERR_QUOTE_NOT_DRAFT with HTTP 409, never the
          fiscal 422.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
