  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_bond_conservation_on_complete
        grounds:
          - state_machines.Bond.DRAFT_to_ACTIVE
          - state_machines.Bond.ACTIVE_to_RELEASED
          - entities.Carrier.fields.escrow_balance_cents
          - entities.Carrier.fields.total_escrow_deposited_cents
        distinguishing_aspect: >-
          Conserved quantity #1 (money): escrow_balance_cents + active_bond_amount_cents
          == total_escrow_deposited_cents (10000000) holds before issue, after issue
          (4000000 + 6000000), and after complete (10000000 + 0) — issue and complete
          are exact compensating actions on the escrow/bond ledger.
        test_recipe:
          setup:
            - "A SUPERLOAD permit (gross 210000, no-structure segment, one CONFIRMED POLICE escort) ISSUED against a carrier with 10000000c escrow (escrow now 4000000, active bond 6000000)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Conserve Freight", usdot_number: "USDOT-CI1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/escrow-deposits"
              payload: { amount_cents: 10000000 }
              as: DOTAdmin
            - call: "POST /pilot-cars"
              payload: { company_name: "Escort Co2", cert_number: "PC-CI1" }
              as: DOTAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/escort-assignments"
              payload: { pilot_car_id: "${pilot_id}", role: "POLICE", window_start_utc: "2026-06-05T09:00:00Z", window_end_utc: "2026-06-05T12:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { escort_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /escort-assignments/${escort_id}/confirm"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: BridgeEngineer
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: BridgeEngineer
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permits/${permit_id}/complete"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { final_status: $.data.status }
          assert:
            - "Permit.${permit_id}.status == COMPLETED"
            - "Carrier.${carrier_id}.escrow_balance_cents == 10000000"
            - "Carrier.${carrier_id}.active_bond_amount_cents == 0"
            - "Carrier.${carrier_id}.escrow_balance_cents + Carrier.${carrier_id}.active_bond_amount_cents == Carrier.${carrier_id}.total_escrow_deposited_cents"

      - name: structure_tonnage_conservation_on_complete
        grounds:
          - state_machines.RouteSegment.PLANNED_to_RESERVED
          - state_machines.RouteSegment.RESERVED_to_COMPLETED
          - entities.Structure.fields.committed_tonnage
          - entities.Structure.fields.available_tonnage
        distinguishing_aspect: >-
          Conserved quantity #2 (bridge tonnage): committed_tonnage + available_tonnage
          == rated_capacity_tonnage (200) holds after reserve (60 + 140) and after
          complete (0 + 200) — reserve and release are compensating on the structure
          capacity ledger, a different conserved quantity from money.
        test_recipe:
          setup:
            - "An OVERWEIGHT permit (gross 120000) crossing a structure (rated 200 / dead 40), ISSUED (committed 60 / available 140)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Tonnage Freight", usdot_number: "USDOT-CI2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span 200d", highway_id: "I-10", milepost: 6, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { structure_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-10", from_milepost: 0, to_milepost: 10, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${permit_id}"
              payload: {}
              as: BridgeEngineer
              captures: { ba_id: "$.data[0].id"}
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /bridge-analyses/${ba_id}/review"
              payload: { method: "LFR" }
              as: BridgeEngineer
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permits/${permit_id}/complete"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { final_status: $.data.status }
          assert:
            - "Permit.${permit_id}.status == COMPLETED"
            - "Structure.${structure_id}.committed_tonnage == 0"
            - "Structure.${structure_id}.available_tonnage == 200"
