    roles: [SalesManager]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "Unit SOLD -> DELIVERED; floor-plan SALE_PAYOFF curtailment + loan PAID_OFF; if trade: TradeIn -> TITLED + new Unit minted"

  - method: POST
    path: "/deals/{id}/cancel"
    description: "Cancel a deal (DRAFT/QUOTED -> CANCELLED)"
