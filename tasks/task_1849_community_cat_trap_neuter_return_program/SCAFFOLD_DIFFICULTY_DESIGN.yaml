          pct: $.data.sterilized_pct
          posture: $.data.monitoring_status
      assert:
      - 'Colony.${col_id}.sterilized_pct == 0.6667 (2 sterilized residents out of 3: ADOPTED cat excluded from denominator, IN_FOSTER kitten counts only in denominator)'
      - Colony.${col_id}.monitoring_status == ACTIVE (0.6667 < 0.75)
- rule_id: combinatorial_formula
  instances:
  - name: clinic_capacity_kitten_season_branching
    grounds:
    - calculations.clinic_day_effective_capacity
    - validations[priority=11]
    distinguishing_aspect: 'Mode (a): the capacity formula has >= 3 inputs (base_capacity,

      surge_capacity, cat.is_kitten, service month) with a conditional

      branch — the surge branch is reachable only when is_kitten AND

      month IN {3,4,5,6,7}; an adult in April and a kitten in August are

      both capped at base while a kitten in April reaches base+surge.

      '
    test_recipe:
      setup:
      - Clinic day in April 2027 (kitten season) with base_capacity 1, surge_capacity 1; one adult cat and one kitten
      - The single base slot is booked by the adult; only surge headroom remains
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Kit Keener
          phone: 555-3
          email: kit@x.com
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Marsh Edge
          address: 3 Marsh Ln
          caretaker_id: ${ct_id}
          estimated_population: 3
        as: ProgramCoordinator
        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: AD1
          sex: MALE
          approximate_age_months: 24
        as: ProgramCoordinator
        captures:
          adult: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: KT1
          sex: FEMALE
          approximate_age_months: 3
        as: ProgramCoordinator
        captures:
          kitten: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: MarshVet
          voucher_reimbursement_cents: 10000
        as: ProgramCoordinator
        captures:
          clin_id: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2027-04-15T00:00:00Z'
          base_capacity: 1
          surge_capacity: 1
        as: ClinicStaff
        captures:
          day_id: $.data.id
      - call: GET /tnr/clinic-days/${day_id}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot_a: $.data[0].id
          slot_b: $.data[1].id
      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
        as: ClinicStaff
        captures:
          day_id_v3: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${adult}
          clinic_slot_id: ${slot_a}
          trap_date: '2027-04-14T00:00:00Z'
          expected_clinic_day_version: ${day_id_v3}
        as: Caretaker
        as_user_id: ${ct_id}
      trigger:
      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
        as: ClinicStaff
        captures:
          day_id_v4: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${kitten}
          clinic_slot_id: ${slot_b}
          trap_date: '2027-04-14T00:00:00Z'
          expected_clinic_day_version: ${day_id_v4}
        as: Caretaker
        as_user_id: ${ct_id}
        captures:
          appt_k: $.data.id
      assert:
      - TrappingAppointment.${appt_k}.status == SCHEDULED (kitten admitted into surge slot in season)
      - ClinicDay.${day_id}.booked_count == 2 == base_capacity + surge_capacity
  - name: donation_reimbursement_rounding_order
    grounds:
    - calculations.voucher_reimbursement_amount
    - entities.PartnerClinic.fields.voucher_reimbursement_cents
    distinguishing_aspect: 'Mode (b): nested rounding where order matters — the scaffold pins

      floor(base * 0.80) computed on the capped base (min(face, cap)),

      NOT floor(face * 0.80) applied before the cap; with face 30001 and

      cap 25000 the pinned order yields floor(25000*0.8)=20000 while the

      unpinned order yields floor(30001*0.8)=24000 (which would then be

      min-capped differently). Distinct mode from sibling instance (a).

      '
    test_recipe:
      setup:
      - 'Clinic cap 25000; donation voucher face 30001 — above the caretaker''s monthly cap, so two vouchers are used: the scenario instead pins face 25001 with cap 25000 to stay under the 30000 monthly
        envelope'
      - Cat driven to surgery with the donation voucher committed
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Dee Dunning
          phone: 555-4
          email: dee@x.com
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Alley West
          address: 8 W Alley
          caretaker_id: ${ct_id}
          estimated_population: 2
        as: ProgramCoordinator
        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: T1
          sex: MALE
          approximate_age_months: 30
        as: ProgramCoordinator
        captures:
          cat1: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: CapClinic
          voucher_reimbursement_cents: 25000
        as: ProgramCoordinator
        captures:
          clin_id: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2026-08-12T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day_id: $.data.id
      - call: GET /tnr/clinic-days/${day_id}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot1: $.data[0].id
      - call: POST /tnr/vouchers
        payload:
          caretaker_id: ${ct_id}
          face_value_cents: 25001
          funding_source: DONATION_FUND
        as: ProgramCoordinator
        captures:
          v_id: $.data.id
      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
        as: ClinicStaff
        captures:
          day_id_v5: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat1}
          clinic_slot_id: ${slot1}
          trap_date: '2026-08-11T00:00:00Z'
          voucher_id: ${v_id}
          expected_clinic_day_version: ${day_id_v5}
        as: Caretaker
        as_user_id: ${ct_id}
        captures:
          appt: $.data.id
      - call: POST /tnr/appointments/${appt}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct_id}
      - call: POST /tnr/appointments/${appt}/check-in
        payload: {}
        as: ClinicStaff
      trigger:
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      assert:
      - Voucher.${v_id}.reimbursement_cents == 20000 (base = min(25001, 25000) = 25000; floor(25000 * 0.80) = 20000)
      - Voucher.${v_id}.caretaker_share_cents == 5000 (base - reimbursement; NOT floor(25001*0.8)=20000 by coincidence — the cap-before-floor order is what makes the share exactly 5000)
- rule_id: non_linear_state_machine
  instances:
  - name: cat_foster_loop_cycle
    grounds:
    - state_machines.Cat.IN_FOSTER_to_POST_SURGERY
    - state_machines.Cat.POST_SURGERY_to_IN_FOSTER
    distinguishing_aspect: 'Cat has a cycle POST_SURGERY -> IN_FOSTER -> POST_SURGERY via

      foster return: pathway is set to ADOPTION on placement and reset

      to null on return-to-program, re-opening the decision. Entity: Cat.

      '
    test_recipe:
      setup:
      - Kitten driven to POST_SURGERY, placed in foster, then returned to program
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Loo Per
          phone: 555-5
          email: loo@x.com
        as: ProgramCoordinator
        captures:
          ct_id: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Dockside
          address: 1 Dock
          caretaker_id: ${ct_id}
          estimated_population: 2
        as: ProgramCoordinator
        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: KIT
          sex: FEMALE
          approximate_age_months: 2
        as: ProgramCoordinator
        captures:
          kit: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: DockVet
          voucher_reimbursement_cents: 10000
        as: ProgramCoordinator
        captures:
          clin_id: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin_id}
          service_date: '2026-08-15T00:00:00Z'
          base_capacity: 2
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day_id: $.data.id
      - call: GET /tnr/clinic-days/${day_id}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot1: $.data[0].id
      - call: GET /tnr/clinic-days/${day_id}
        payload: {}
