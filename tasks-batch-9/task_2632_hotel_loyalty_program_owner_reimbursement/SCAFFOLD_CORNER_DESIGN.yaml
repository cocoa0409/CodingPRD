              payload: { rate_code: "BAR", rate_category: "GROUP" }
              as: HotelOwner
              as_user_id: "${hA_id}"
              captures: { e_dup_code: $.data.error_id }
            - call: "POST /loyalty/hotels/${hB_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rpB2_id: $.data.id, rpB2_code: $.data.rate_code }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${hA_id}", period_month: "2026-06" }
              as: HotelOwner
              as_user_id: "${hA_id}"
              captures: { e_dup_period: $.data.error_id }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${hA_id}", period_month: "2026-07" }
              as: ProgramAdministrator
              captures: { bA7_id: $.data.id }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${hB_id}", period_month: "2026-06" }
              as: ProgramAdministrator
              captures: { bB6_id: $.data.id }
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${hA_id}", period_month: "2026-13" }
              as: ProgramAdministrator
              captures: { e_bad_month: $.data.error_id }
          assert:
            - "${e_dup_code} == ERR_DUPLICATE_RATE_CODE with http 409 - the differing rate_category does not make BAR a new code at property A"
            - "${rpB2_code} == BAR and the row was created - the same code at property B is a different scope"
            - "${e_dup_period} == ERR_DUPLICATE_BATCH_PERIOD with http 409, and ${bA6_status} == OPEN shows the incumbent is still live"
            - "batches ${bA7_id} and ${bB6_id} were both created - a different month at the same property and the same month at a different property are both free"
            - "${e_bad_month} == ERR_INVALID_REQUEST with http 400 - the YYYY-MM shape is checked at priority 22, long before the uniqueness scan at 75"
            - "GET /loyalty/reimbursement-batches returns total_count == 3 and GET /loyalty/rate-plans returns total_count == 3"

      - name: fourth_benefit_denial_at_the_same_property_is_refused
        claim_type: aggregate_validation
        grounds:
          - validations.priority_54_ERR_BENEFIT_DENIAL_LIMIT_EXCEEDED
          - calculations.benefit_entitlement_matrix
          - state_machines.EliteBenefitDelivery
        distinguishing_aspect: |
          The ceiling is a running counter on the property, not a per-stay or per-member allowance:
          three denials spread over one PLATINUM stay exhaust it, and the fourth denial - on a
          different stay, for a different benefit type - is refused while that same delivery can
          still be honoured. The counter is program-lifetime, so nothing resets it.
        test_recipe:
          setup:
            - "One ACTIVE property; one member lifted to PLATINUM by a 50-night stay, then two more posted stays that each synthesize UPGRADE, BREAKFAST and LATE_CHECKOUT obligations."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Denialcap Tower", brand_code: "DCT", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 200, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "dc1@example.com", full_name: "Halvard Ness", enrollment_date: "2026-01-02" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-01-01", checkout_date: "2026-02-20", room_revenue_cents: 500000 }
              as: ProgramAdministrator
              captures: { s_long: $.data.id, s_long_nights: $.data.nights }
            - call: "POST /loyalty/stays/${s_long}/post"
              payload: {}
              as: ProgramAdministrator
              captures: { m_tier_after: $.data.tier_at_checkin }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-03-01", checkout_date: "2026-03-04", room_revenue_cents: 60000 }
              as: ProgramAdministrator
              captures: { sB_id: $.data.id }
            - call: "POST /loyalty/stays/${sB_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-04-01", checkout_date: "2026-04-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { sC_id: $.data.id }
            - call: "POST /loyalty/stays/${sC_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "UPGRADE" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dB_up: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "BREAKFAST" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dB_bf: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sB_id}", benefit_type: "LATE_CHECKOUT" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dB_lc: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sC_id}", benefit_type: "UPGRADE" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dC_up: "$.data[0].id" }
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${sC_id}", benefit_type: "BREAKFAST" }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { dC_bf: "$.data[0].id" }
          trigger:
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_up}/deny"
              payload: { denial_reason: "No suite inventory that week." }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { d1_status: $.data.status }
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_bf}/deny"
              payload: { denial_reason: "Restaurant closed for refurbishment." }
              as: HotelOwner
              as_user_id: "${h_id}"
              captures: { d2_status: $.data.status }
            - call: "POST /loyalty/elite-benefit-deliveries/${dB_lc}/deny"
