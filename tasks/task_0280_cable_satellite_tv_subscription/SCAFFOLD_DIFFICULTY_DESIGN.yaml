              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/billing-statements"
              payload: { cycle_index: 0, proration_mode: "FULL_CYCLE", days_in_cycle: 30 }
              as: BillingAdmin
              captures: { etf: $.data.etf_charge_cents }
          assert:
            - "BillingStatement.${etf} == 24000"

      - name: technician_adjacent_window_zero_gap_allowed
        grounds:
          - validations[priority=11]
          - entities.ServiceVisit.fields.window_start
        distinguishing_aspect: |
          Technician half-open boundary: a new visit whose window_start == an existing visit's
          window_end (zero gap, end-to-start adjacency) is ALLOWED and returns 201, distinct from
          any strictly-positive overlap which is rejected.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00Z. Technician TECH1. Account ACTIVE (PLUS) with existing SCHEDULED visit 2026-06-02T09:00-10:00 on TECH1."
          setup_api_calls:
