        claim_type: standard_crud
        grounds: ["endpoints.GET /pricing-policies"]
        distinguishing_aspect: "Two revisions share policy_code MAP-2026-A after republication, so a policy_code filter returns both while a status filter separates the PUBLISHED row from the SUPERSEDED one."
        test_recipe:
