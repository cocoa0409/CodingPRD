  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bonus_zone_same_cell_half_open_overlap_rejected_adjacency_allowed
        grounds:
          - state_machines.IncentiveProgram.DRAFT_to_ACTIVE
          - validations[priority=5]
          - errors[ERR_PROGRAM_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: pairwise half-open [start, end) overlap on
          IncentiveProgram. A second ACTIVE BONUS_ZONE on cellA overlapping
          [09-10, 09-17) is rejected, while an exactly-adjacent window
          [09-14, 09-21) (start == first window's end) is accepted — adjacency
          is NOT an overlap.
        test_recipe:
          setup:
            - "Clock default; Market EUG; zone1 ACTIVE on cellA with window [2026-09-07, 2026-09-14)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "EUG", geo_cells: ["cellA", "cellB"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z1", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 10 }
              as: IncentiveOps
              captures: { z1: $.data.id }
            - call: "POST /incentive-programs/${z1}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z2", window_start_utc: "2026-09-10T00:00:00Z", window_end_utc: "2026-09-17T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 12000, capacity: 10 }
              as: IncentiveOps
              captures: { z2: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z3", window_start_utc: "2026-09-14T00:00:00Z", window_end_utc: "2026-09-21T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 12000, capacity: 10 }
              as: IncentiveOps
              captures: { z3: $.data.id }
          trigger:
            - call: "POST /incentive-programs/${z2}/activate"
              payload: {}
              as: IncentiveOps
              captures: { err: $.data.error_id }
            - call: "POST /incentive-programs/${z3}/activate"
              payload: {}
              as: IncentiveOps
          assert:
            - "Z2 activation returns error_id == ERR_PROGRAM_WINDOW_CONFLICT (overlaps Z1 on cellA)"
            - "Z3 activation succeeds (adjacent [09-14, 09-21) touches Z1's end but half-open intervals do not overlap)"
            - "IncentiveProgram.${z3}.status == ACTIVE; IncentiveProgram.${z2}.status == DRAFT"

      - name: bonus_zone_capacity_aggregate_occupancy_blocks_extra_enrollment
        grounds:
          - validations[priority=5]
          - entities.IncentiveProgram.fields.capacity
          - state_machines.IncentiveEnrollment
        distinguishing_aspect: |
          Interval semantics: aggregate capacity (count-based occupancy of a
          zone-time bucket) on IncentiveEnrollment — NOT a pairwise interval
          check. With capacity == 1 the first enrollment fills the bucket and the
          second is rejected even though both drivers are individually eligible
          and both windows align perfectly.
        test_recipe:
          setup:
            - "Clock default; Market BHM; BONUS_ZONE ACTIVE capacity 1 cellA; two eligible drivers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /markets"
              payload: { market_code: "BHM", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Cap Carl" }
              as: IncentiveOps
              captures: { drv1: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Cap Cara" }
              as: IncentiveOps
              captures: { drv2: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "ZC", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 1 }
              as: IncentiveOps
              captures: { zone: $.data.id }
            - call: "POST /incentive-programs/${zone}/activate"
              payload: {}
              as: IncentiveOps
          trigger:
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv1}" }
              as: IncentiveOps
              captures: { enr1: $.data.id }
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv2}" }
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "First enrollment succeeds: IncentiveEnrollment.${enr1}.status == ACTIVE"
            - "Second enrollment returns error_id == ERR_PROGRAM_WINDOW_CONFLICT (aggregate capacity exhausted, not a pairwise interval collision)"

