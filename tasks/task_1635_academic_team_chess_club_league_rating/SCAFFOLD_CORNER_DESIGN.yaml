          payload:
            player_id: ${pq}
            season_id: ${sid}
          as: FederationAdmin
          captures:
            m2: $.data.id
        - call: POST /api/memberships/${m2}/waive
          payload: {}
          as: FederationAdmin
        - call: POST /api/meets
          payload:
            season_id: ${sid}
            host_club_id: ${club_a}
            away_club_id: ${club_b}
            scheduled_date: '2026-09-05'
            rounds_count: 1
            boards_count: 1
          as: FederationAdmin
          captures:
            meet_id: $.data.id
        - call: POST /api/meets/${meet_id}/schedule
          payload: {}
          as: FederationAdmin
        - call: GET /api/meets/${meet_id}
          as: FederationAdmin
          captures:
            mv: $.data.version
        - call: POST /api/meets/${meet_id}/pairings
          payload:
            round_number: 1
            board_number: 1
            white_player_id: ${pp}
            black_player_id: ${pq}
            expected_meet_version: ${mv}
          as: FederationAdmin
          captures:
