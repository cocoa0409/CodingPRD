            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "DEMOGRAPHIC", effective_start: "2026-08-05T00:00:00Z", effective_end: "2026-08-31T00:00:00Z", unit_multiplier_bps: 10750 }
