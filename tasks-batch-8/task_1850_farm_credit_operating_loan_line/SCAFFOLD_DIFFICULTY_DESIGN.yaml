# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1850)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: borrowing_base_provisional_vs_harvest_trueup
        grounds:
          - calculations.borrowing_base
          - entities.LoanAccount.fields.borrowing_base_cents
          - state_machines.CropBudget.APPROVED_to_ACTUALIZED
        distinguishing_aspect: |
          LoanAccount-domain dual variant: identical collateral (7,000,000) and
          commitment (50,000,000) yield borrowing_base 19,000,000 under the
          provisional variant (projected 20,000,000) but 13,000,000 under the
          harvest true-up variant (actual 10,000,000).
        test_recipe:
          setup:
            - "APPROVED loan, commitment 50,000,000; APPROVED budget projected_revenue 20,000,000; PERFECTED EQUIPMENT collateral appraised 10,000,000; clock 2026-03-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { bb_prov: $.data.borrowing_base_cents } }
          trigger:
            - { call: "POST /crop-budgets/${bud}/record_actuals", payload: { actual_revenue_cents: 10000000 }, as: LoanOfficer }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { bb_true: $.data.borrowing_base_cents } }
          assert:
            - "pre-actuals summary: borrowing_base_cents == 19000000  (7,000,000 collateral + 12,000,000 crop)"
            - "CropBudget.${bud}.status == ACTUALIZED"
            - "post-actuals summary: borrowing_base_cents == 13000000  (7,000,000 collateral + 6,000,000 crop)"
            - "${bb_prov} != ${bb_true} for identical collateral and commitment"

      - name: restructure_equal_installment_vs_balloon
        grounds:
          - calculations.restructure_schedule
          - entities.RestructurePlan.fields.new_installment_cents
          - state_machines.RestructurePlan.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: |
          RestructurePlan-domain dual variant (different entity domain from the
          borrowing-base instance): identical base_balance 10,100,000, rate 600
          bps and 12-month term produce installment 869,271 under
          EQUAL_INSTALLMENT but 50,500 under BALLOON.
        test_recipe:
          setup:
            - "ACTIVE loan, commitment 50,000,000, rate 720 bps; BB 13,000,000 (crop 6,000,000 + EQUIPMENT 7,000,000); draw 10,000,000 disbursed 2026-04-01; filing terminated 2026-04-02 so coverage -4,000,000 -> DELINQUENT with margin call; clock advanced to 2026-05-21 (50 days -> accrued 100,000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 720, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 500, projected_revenue_cents: 10000000, projected_expenses_cents: 8000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Combine", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer, captures: { fil: $.data.id } }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: System }
            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 10000000, purpose: "SEED" }, as: LoanOfficer, captures: { drw: $.data.id } }
            - { call: "POST /draw-requests/${drw}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw}/disburse", as: LoanOfficer }
            - { call: "POST /ucc-filings/${fil}/terminate", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: System }
            - { call: "GET /loan-accounts/${loan}", as: LoanOfficer, captures: { loan_v_pre: $.data.version } }
          trigger:
            - { call: "POST /restructure-plans", payload: { loan_account_id: "${loan}", plan_type: "STANDARD", amortization_style: "EQUAL_INSTALLMENT", extension_months: 12, new_rate_bps: 600, capitalize_interest: true, expected_loan_version: "${loan_v_pre}" }, as: LoanOfficer, as_user_id: "officer-1", captures: { pln1: $.data.id, inst1: $.data.new_installment_cents, base1: $.data.base_balance_cents } }
            - { call: "GET /loan-accounts/${loan}", as: LoanOfficer, captures: { loan_v2: $.data.version } }
            - { call: "POST /restructure-plans", payload: { loan_account_id: "${loan}", plan_type: "STANDARD", amortization_style: "BALLOON", extension_months: 12, new_rate_bps: 600, capitalize_interest: true, expected_loan_version: "${loan_v2}" }, as: LoanOfficer, as_user_id: "officer-1", captures: { pln2: $.data.id, inst2: $.data.new_installment_cents, base2: $.data.base_balance_cents } }
          assert:
            - "base1 == base2 == 10100000 (principal 10,000,000 + accrued 100,000 = 50 days x 2,000 at 720 bps)"
            - "inst1 == 869271 (annuity, round_half_up)"
            - "inst2 == 50500 (interest-only monthly)"
            - "inst1 != inst2 under identical inputs"
            - "RestructurePlan.${pln1}.status == SUPERSEDED and RestructurePlan.${pln2}.status == PROPOSED"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: borrowing_base_multi_input_nested_min_state_filter
        grounds:
          - calculations.borrowing_base
          - entities.Collateral.fields.perfection_state
        distinguishing_aspect: |
          Mode (a): five inputs (three advance-rated collaterals, prior lien,
          projected revenue) with nested max/min and state filtering — the
          UNPERFECTED CHATTEL_CROP piece (3,750,000) is excluded until its
          filing lands, moving the base from 24,400,000 to 28,150,000 while the
          commitment cap (50,000,000) never binds.
        test_recipe:
          setup:
            - "APPROVED loan commitment 50,000,000; budget projected 20,000,000 APPROVED; REAL_ESTATE 8,000,000 with prior_lien 1,000,000 PERFECTED; EQUIPMENT 10,000,000 PERFECTED; CHATTEL_CROP 5,000,000 pledged but UNPERFECTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "REAL_ESTATE", description: "160 acres", appraised_value_cents: 8000000, prior_lien_cents: 1000000 }, as: LoanOfficer, captures: { col_re: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col_re}", filing_number: "UCC-26-RE", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Combine", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col_eq: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col_eq}", filing_number: "UCC-26-EQ", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "CHATTEL_CROP", description: "Growing corn", appraised_value_cents: 5000000 }, as: LoanOfficer, captures: { col_cc: $.data.id } }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { bb1: $.data.borrowing_base_cents } }
          trigger:
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col_cc}", filing_number: "UCC-26-CC", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-06T00:00:00Z" }, as: LoanOfficer }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { bb2: $.data.borrowing_base_cents } }
          assert:
            - "before chattel perfection: borrowing_base_cents == 24400000 (5,400,000 RE net + 7,000,000 EQ + 12,000,000 crop; UNPERFECTED chattel excluded)"
            - "after chattel perfection: borrowing_base_cents == 28150000 (+ 3,750,000 at 75% advance)"
            - "commitment cap never binds: both values below 50,000,000"

      - name: interest_accrual_daily_rounding_order
        grounds:
          - calculations.interest_accrual
          - entities.LoanAccount.fields.accrued_interest_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: principal 10,000,001 at
          700 bps accrues 30 x round_half_up(1944.44...) = 58,320 under the
          pinned round-per-day-then-multiply order; the alternate
          sum-then-round order would yield 58,333 and is non-conformant.
        test_recipe:
          setup:
            - "ACTIVE loan commitment 50,000,000 with BB capped at commitment; draw 10,000,001 disbursed 2026-04-01; clock advanced 30 days to 2026-05-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 4000, projected_revenue_cents: 80000000, projected_expenses_cents: 50000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "REAL_ESTATE", description: "640 acres", appraised_value_cents: 60000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: System }
            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 10000001, purpose: "FERTILIZER" }, as: LoanOfficer, captures: { drw: $.data.id } }
            - { call: "POST /draw-requests/${drw}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw}/disburse", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: System }
          trigger:
            - { call: "POST /associations/${assoc}/run_periodic_review", as: System }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { accr: $.data.accrued_interest_cents } }
          assert:
            - "accrued_interest_cents == 58320 (30 x 1,944; pinned round-per-day-then-multiply)"
            - "accrued_interest_cents != 58333 (sum-then-round alternative rejected)"

      - name: patronage_cap_before_floor_remainder_order
        grounds:
          - calculations.patronage_allocation
          - entities.PatronageDistribution.fields.allocation_lines
        distinguishing_aspect: |
          Mode (c) pinned evaluation order over a circular-looking dependency:
          the 25%-of-interest cap is applied to raw shares BEFORE flooring and
          the capped excess is NEVER redistributed — Alpha (raw 1,153,896.77)
          lands at 224,894 and Beta (raw 3,846,103.23) at 749,604, leaving
          4,025,502 undistributed; a redistribute-first order would pay out the
          full 5,000,000 pool.
        test_recipe:
          setup:
            - "Borrowers Alpha (interest paid FY2028: 899,577) and Beta (2,998,419) in one association; each fully repaid on 2028-04-10; clock 2029-01-15; DECLARED distribution fiscal_year 2028, pool 5,000,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Prairie FCS", charter_number: "CH-1851" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Alpha Farms", tax_id: "41-1000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { b_a: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_a}", requested_commitment_cents: 6000000, rate_bps: 700, season_year: 2026, maturity_date: "2028-12-31T00:00:00Z" }, as: LoanOfficer, captures: { ln_a: $.data.id } }
            - { call: "POST /loan-accounts/${ln_a}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${ln_a}/approve", payload: { approved_commitment_cents: 6000000 }, as: CreditCommittee, captures: { v_a: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${ln_a}", season_year: 2026, crop_type: "CORN", acres: 4000, projected_revenue_cents: 80000000, projected_expenses_cents: 50000000, expected_loan_version: "${v_a}" }, as: Borrower, as_user_id: "${b_a}", captures: { bud_a: $.data.id } }
            - { call: "POST /crop-budgets/${bud_a}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${ln_a}", collateral_type: "REAL_ESTATE", description: "A-land", appraised_value_cents: 60000000 }, as: LoanOfficer, captures: { col_a: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col_a}", filing_number: "UCC-A", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${b_a}", policy_number: "POL-A", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2029-01-01T00:00:00Z", coverage_amount_cents: 60000000 }, as: LoanOfficer, captures: { pol_a: $.data.id } }
            - { call: "POST /insurance-policies/${pol_a}/assign", payload: { loan_account_id: "${ln_a}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${ln_a}/activate", as: LoanOfficer }
            - { call: "POST /draw-requests", payload: { loan_account_id: "${ln_a}", amount_cents: 6000000, purpose: "SEED" }, as: Borrower, as_user_id: "${b_a}", captures: { drw_a: $.data.id } }
            - { call: "POST /draw-requests/${drw_a}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw_a}/disburse", as: LoanOfficer }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Beta Farms", tax_id: "41-1000002", county: "BLACKHAWK" }, as: LoanOfficer, captures: { b_b: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_b}", requested_commitment_cents: 20000000, rate_bps: 700, season_year: 2026, maturity_date: "2028-12-31T00:00:00Z" }, as: LoanOfficer, captures: { ln_b: $.data.id } }
            - { call: "POST /loan-accounts/${ln_b}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${ln_b}/approve", payload: { approved_commitment_cents: 20000000 }, as: CreditCommittee, captures: { v_b: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${ln_b}", season_year: 2026, crop_type: "CORN", acres: 4000, projected_revenue_cents: 80000000, projected_expenses_cents: 50000000, expected_loan_version: "${v_b}" }, as: Borrower, as_user_id: "${b_b}", captures: { bud_b: $.data.id } }
            - { call: "POST /crop-budgets/${bud_b}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${ln_b}", collateral_type: "REAL_ESTATE", description: "B-land", appraised_value_cents: 60000000 }, as: LoanOfficer, captures: { col_b: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col_b}", filing_number: "UCC-B", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${b_b}", policy_number: "POL-B", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2029-01-01T00:00:00Z", coverage_amount_cents: 60000000 }, as: LoanOfficer, captures: { pol_b: $.data.id } }
            - { call: "POST /insurance-policies/${pol_b}/assign", payload: { loan_account_id: "${ln_b}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${ln_b}/activate", as: LoanOfficer }
            - { call: "POST /draw-requests", payload: { loan_account_id: "${ln_b}", amount_cents: 20000000, purpose: "SEED" }, as: Borrower, as_user_id: "${b_b}", captures: { drw_b: $.data.id } }
            - { call: "POST /draw-requests/${drw_b}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw_b}/disburse", as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-04-10T00:00:00Z" }, as: System }
            - { call: "POST /repayments", payload: { loan_account_id: "${ln_a}", amount_cents: 6899577, source: "HARVEST_PROCEEDS" }, as: Borrower, as_user_id: "${b_a}" }
            - { call: "POST /repayments", payload: { loan_account_id: "${ln_b}", amount_cents: 22998419, source: "HARVEST_PROCEEDS" }, as: Borrower, as_user_id: "${b_b}" }
