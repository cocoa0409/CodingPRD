              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 250, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 250 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
