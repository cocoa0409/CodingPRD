            - "a second GET /records-desk/datasets/${ds_id} returns the same CLEANING row - the transition is persisted, not response-only"

      - name: cleaning_lock_enforces_documentation_then_format_and_then_succeeds
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Dataset.CLEANING_to_CLEAN_LOCKED
          - errors[ERR_DATASET_DOCUMENTATION_INCOMPLETE]
          - errors[ERR_FORMAT_NOT_NEGOTIATED]
          - entities.Dataset.fields.documentation_status
        distinguishing_aspect: |
          Both of the lock's preconditions must be independently observable on the SAME dataset: with
          documentation incomplete AND the format refused, the documentation error (priority 250) is what
          comes back; once documentation is completed the format error (priority 260) surfaces on the very
          next call with no other change; and a sibling dataset that satisfies both locks cleanly. A
          rejected lock must leave the dataset in CLEANING with its version unchanged.
        test_recipe:
          setup:
            - "Desk, Agency, one RELEASED RecordsRequest, one Investigation."
            - "Dataset ds-refused: negotiated CSV, expected_field_count 2, delivered as XLSX (so format_negotiation_status == REFUSED), zero fields documented."
