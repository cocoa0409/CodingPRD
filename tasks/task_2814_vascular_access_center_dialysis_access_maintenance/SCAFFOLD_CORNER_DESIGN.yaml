              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_a: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a}/missed-treatments"
              payload: { missed_treatment_count: 12 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "GET /dialysis-facilities/${fac_id}"
              payload: {}
              as: CenterAdmin
            - call: "GET /referrals/${ref_a}"
              payload: {}
              as: AccessCoordinator
            - call: "POST /referrals/${ref_a}/missed-treatments"
              payload: { missed_treatment_count: 13 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "GET /dialysis-facilities/${fac_id}/partnership-metrics"
              payload: {}
              as: CenterAdmin
            - call: "POST /referrals"
              payload: { access_id: "${acc_b}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "probe referral under suspension", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_b: $.data.id }
            - call: "POST /referrals/${ref_b}/triage"
              payload: {}
              as: AccessCoordinator
          assert:
            - "referral A at 0 missed treatments left the facility at partnership_score 100, partnership_tier GOLD, contract_status ACTIVE"
            - "the update to 12 evaluates with tier_at_eval == GOLD, so grace_credit_window == floor(1 * 0.20) == 0, adjusted 12 and partnership_score 100 - 48 == 52; the facility read shows partnership_tier WATCH (52 < 70) and contract_status PROBATION (50 <= 52 <= 69)"
            - "that ACTIVE -> PROBATION drop fired cascade hop 3, so GET /referrals/${ref_a} shows status INFO_REQUESTED, hold_reason FACILITY_POSTURE_HOLD and info_request_count 1 — and the held referral still counts in the window, because Step A excludes only DECLINED"
