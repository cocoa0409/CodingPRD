      - name: the_same_profile_version_token_publishes_once_and_is_then_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[expected_profile_version]
          - errors[ERR_STALE_PROFILE_VERSION]
          - validations[priority=26]
          - endpoints[POST /ca/certificate-profiles/{id}/crl-publications]
        distinguishing_aspect: "One captured profile version is spent by the first publication — which itself bumps CertificateProfile.version by writing last_crl_number / last_crl_next_update — so replaying the identical token for the next CRL returns 412 ERR_STALE_PROFILE_VERSION. The refused replay must not consume a CRL number: after it, last_crl_number is still 1 and the accepted retry mints crl_number 2."
        test_recipe:
          setup:
            - "One ACTIVE profile with max_crl_validity_hours 24 and no publication yet; the profile version is captured once, before the first CRL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
