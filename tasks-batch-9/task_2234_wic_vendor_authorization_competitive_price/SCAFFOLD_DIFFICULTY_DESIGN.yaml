# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2234 WIC Vendor Authorization &
# Competitive Price Management. 19 instances across the nine §0.5 rules.
# Every literal below was computed from the formulas in SCAFFOLD.yaml §1.3.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: mar_provisional_vs_final_diverges_on_milk_ceiling
        grounds:
          - calculations.maximum_allowable_reimbursement
          - state_machines.PriceCycle.OPEN_to_CLOSED
          - state_machines.PriceCycle.CLOSED_to_PUBLISHED
          - entities.PriceCeiling.fields.basis
          - entities.PriceCeiling.fields.cap_binding
        distinguishing_aspect: |
          Pricing-domain divergence: the PROVISIONAL variant admits still-unreviewed
          SUBMITTED prices, so a single never-reviewed 300-cent submission both shifts
          the four-element median (334.5) and lowers the cap base (1.25 x 300 = 375),
          landing 351; the FINAL variant sees only the three ACCEPTED prices, medians
          to 349 and lands 366 on identical stored data.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ACTIVE peer group PG-SUPER-A (PEER_MEDIAN, allowance 0.05, min_submissions_for_ceiling 3)"
            - "One ACTIVE authorized food item ITEM_MILK; one OPEN price cycle 2026Q3 with window [2026-08-01, 2026-09-01)"
            - "Four IN_REVIEW supermarket vendors assigned to PG-SUPER-A, each with one milk submission: 300 (still SUBMITTED), 320, 349 and 410 (all ACCEPTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v_a: $.data.id }
            - call: "POST /vendors/${v_a}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_a}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 300 }
              as: VendorOperator
              as_user_id: "${v_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Bravo Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 7000000 }
              as: VendorUnitAnalyst
              captures: { v_b: $.data.id }
            - call: "POST /vendors/${v_b}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_b}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /price-submissions/${sub_b}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors"
              payload: { store_name: "Charlie Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 8000000 }
              as: VendorUnitAnalyst
              captures: { v_c: $.data.id }
            - call: "POST /vendors/${v_c}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_c}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 349 }
              as: VendorOperator
              as_user_id: "${v_c}"
              captures: { sub_c: $.data.id }
            - call: "POST /price-submissions/${sub_c}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors"
              payload: { store_name: "Delta Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 9000000 }
              as: VendorUnitAnalyst
              captures: { v_d: $.data.id }
            - call: "POST /vendors/${v_d}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_d}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 410 }
              as: VendorOperator
              as_user_id: "${v_d}"
              captures: { sub_d: $.data.id }
            - call: "POST /price-submissions/${sub_d}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
          trigger:
            - call: "POST /price-cycles/${cycle_q3}/close"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /price-cycles/${cycle_q3}/publish-ceilings"
              payload: {}
              as: VendorUnitSupervisor
              captures: { published_count: $.data.published_ceiling_count }
          assert:
            - "After the close call, GET /price-ceilings?peer_group_id=${pg_a}&food_item_id=${item_milk}&price_cycle_id=${cycle_q3}&status=PROVISIONAL returns total_count == 1 with mar_cents == 351, base_cents == 334.5, cap_cents == 375.00, cap_binding == false, basis == PEER_GROUP, peer_submission_count == 4, contributing_submission_count == 4"
            - "PriceCycle.${cycle_q3}.provisional_ceiling_count == 1 and PriceCycle.${cycle_q3}.status == CLOSED after the close call"
            - "After the publish call, GET /price-ceilings?peer_group_id=${pg_a}&food_item_id=${item_milk}&price_cycle_id=${cycle_q3}&status=ACTIVE returns total_count == 1 with mar_cents == 366, base_cents == 349, cap_cents == 400.00, cap_binding == false, basis == PEER_GROUP, peer_submission_count == 3, contributing_submission_count == 3"
            - "The former PROVISIONAL row now has status == SUPERSEDED and superseded_reason == PROVISIONAL_REPLACED while retaining mar_cents == 351"
            - "${published_count} == 1 and PriceCycle.${cycle_q3}.status == PUBLISHED"
            - "366 - 351 == 15: the two variants disagree by 15 cents on byte-identical submission data"

      - name: risk_score_rolling_vs_epoch_diverges_on_vendor
        grounds:
          - calculations.vendor_risk_score
          - endpoints[GET /vendors/{id}/risk-profile]
          - endpoints[POST /_ops/risk-run]
          - entities.Vendor.fields.risk_epoch_at
        distinguishing_aspect: |
          Compliance-domain divergence on a different entity and a different axis than
          the pricing variant: ROLLING evaluates the weighted score against the live
          logical clock and returns 49.0 / ELEVATED, while EPOCH replays the snapshot
          frozen by the last /_ops/risk-run, which pre-dates the failed visit and the
          adjudicated claim, and therefore still returns 0.0 / LOW.
        test_recipe:
          setup:
            - "Vendor v1 AUTHORIZED in PG-SUPER-A with an ACTIVE milk ceiling of 336 cents (statewide fallback of a single 320-cent accepted submission)"
            - "A risk run executed at 2026-08-01T00:00:00Z, before any claim or visit exists, so Vendor.risk_score is 0.0 and risk_epoch_at is 2026-08-01T00:00:00Z"
            - "Clock advanced to 2026-08-10T00:00:00Z; one ROUTINE visit conducted with zero observations (FAILED); one 5-line claim adjudicated to 3 rejected lines, 1 reduced line and 1 accepted line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/record-training"
              payload: { training_type: "INITIAL", completed_at: "2026-07-15T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_v1_milk: $.data.id }
            - call: "POST /price-submissions/${sub_v1_milk}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/authorize"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /price-cycles/${cycle_q3}/close"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /price-cycles/${cycle_q3}/publish-ceilings"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /_ops/risk-run"
              payload: {}
              as: SystemOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SystemOperator
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-10T00:00:00Z" }
              as: VendorUnitAnalyst
              captures: { visit1: $.data.id }
            - call: "POST /monitoring-visits/${visit1}/conduct"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /redemption-claims"
              payload: { vendor_id: "${v1}", claim_month: "2026-07", lines: [ { line_number: 1, upc: "00011122233", quantity: 1, charged_unit_price_cents: 300, medical_doc_on_file: false }, { line_number: 2, upc: "00011122233", quantity: 2, charged_unit_price_cents: 400, medical_doc_on_file: false }, { line_number: 3, upc: "00099999999", quantity: 1, charged_unit_price_cents: 250, medical_doc_on_file: false }, { line_number: 4, upc: "00011122233", quantity: 9, charged_unit_price_cents: 300, medical_doc_on_file: false }, { line_number: 5, upc: "00011122233", quantity: 0, charged_unit_price_cents: 300, medical_doc_on_file: false } ] }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { claim1: $.data.id }
            - call: "POST /redemption-claims/${claim1}/adjudicate"
              payload: {}
              as: VendorUnitAnalyst
          trigger:
            - call: "GET /vendors/${v1}/risk-profile?basis=ROLLING"
              payload: {}
              as: VendorUnitSupervisor
              captures: { rolling_score: $.data.risk_score, rolling_tier: $.data.risk_tier }
            - call: "GET /vendors/${v1}/risk-profile?basis=EPOCH"
              payload: {}
              as: VendorUnitSupervisor
              captures: { epoch_score: $.data.risk_score, epoch_tier: $.data.risk_tier }
          assert:
            - "RedemptionClaim.${claim1}.rejected_line_count == 3, reduced_line_count == 1, accepted_line_count == 1, line_count == 5"
            - "RedemptionClaim.${claim1}.submitted_total_cents == 4050 and adjudicated_total_cents == 972"
            - "MonitoringVisit.${visit1}.status == FAILED with outcome == FAIL_MISSING_CATEGORY and stock_compliance_pct == 0.0"
            - "${rolling_score} == 49.0 (0.40*60.0 + 0.25*20.0 + 0.20*100.0) and ${rolling_tier} == ELEVATED"
            - "GET /vendors/${v1}/risk-profile?basis=ROLLING reports evaluated_line_count == 5, evaluated_visit_count == 1, edit_rejection_rate_pct == 60.0, price_excess_pct == 20.0, failed_visit_pct == 100.0, window_start == 2026-02-11T00:00:00Z, window_end == 2026-08-10T00:00:00Z"
            - "${epoch_score} == 0.0 and ${epoch_tier} == LOW with window_end == 2026-08-01T00:00:00Z"
            - "Vendor.${v1}.risk_score == 0.0, risk_tier == LOW and risk_epoch_at == 2026-08-01T00:00:00Z — the persisted (gating) tier lags the live tier by one epoch"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: mar_statewide_cap_binds_over_percentile_75_allowance
        grounds:
          - calculations.maximum_allowable_reimbursement
          - entities.PeerGroup.fields.mar_method
          - entities.PriceCeiling.fields.cap_binding
        distinguishing_aspect: |
          Mode (a) — selection-rule x step-order interaction: the nearest-rank 75th
          percentile of [200, 250, 400] is the top element 400, the 0.08 allowance
          lifts it to 432, and only then does the statewide cap 1.25 x 200 = 250
          clamp it; a solution that applies the cap before the allowance, averages
          instead of nearest-rank, or rounds twice cannot produce 250.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; ACTIVE peer group PG-MED-B (MEDIUM_GROCERY, band [1000000, 4999999], PEER_PERCENTILE_75, allowance 0.08, min_submissions_for_ceiling 3)"
            - "One ACTIVE milk item; one OPEN cycle 2026Q3"
            - "Three IN_REVIEW medium-grocery vendors in PG-MED-B with ACCEPTED milk submissions of 200, 250 and 400 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-MED-B", store_type: "MEDIUM_GROCERY", min_monthly_redemption_cents: 1000000, max_monthly_redemption_cents: 4999999, mar_method: "PEER_PERCENTILE_75", competitive_allowance_pct: 0.08, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.0 }
              as: VendorUnitSupervisor
              captures: { pg_b: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Echo Grocery", store_type: "MEDIUM_GROCERY", reported_monthly_redemption_cents: 1200000 }
              as: VendorUnitAnalyst
              captures: { v_e: $.data.id }
            - call: "POST /vendors/${v_e}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_e}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 200 }
              as: VendorOperator
              as_user_id: "${v_e}"
              captures: { sub_e: $.data.id }
            - call: "POST /price-submissions/${sub_e}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors"
              payload: { store_name: "Foxtrot Grocery", store_type: "MEDIUM_GROCERY", reported_monthly_redemption_cents: 2200000 }
              as: VendorUnitAnalyst
              captures: { v_f: $.data.id }
            - call: "POST /vendors/${v_f}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_f}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 250 }
              as: VendorOperator
              as_user_id: "${v_f}"
              captures: { sub_f: $.data.id }
            - call: "POST /price-submissions/${sub_f}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors"
              payload: { store_name: "Golf Grocery", store_type: "MEDIUM_GROCERY", reported_monthly_redemption_cents: 3200000 }
              as: VendorUnitAnalyst
              captures: { v_g: $.data.id }
            - call: "POST /vendors/${v_g}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v_g}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 400 }
              as: VendorOperator
              as_user_id: "${v_g}"
              captures: { sub_g: $.data.id }
            - call: "POST /price-submissions/${sub_g}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /price-cycles/${cycle_q3}/close"
              payload: {}
              as: VendorUnitSupervisor
          trigger:
            - call: "POST /price-cycles/${cycle_q3}/publish-ceilings"
              payload: {}
              as: VendorUnitSupervisor
          assert:
            - "GET /price-ceilings?peer_group_id=${pg_b}&food_item_id=${item_milk}&price_cycle_id=${cycle_q3}&status=ACTIVE returns total_count == 1"
            - "That row has basis == PEER_GROUP, contributing_submission_count == 3, base_cents == 400 (nearest-rank index ceil(0.75*3) == 3)"
            - "That row has cap_cents == 250.00, cap_binding == true and mar_cents == 250"
            - "mar_cents != 432 (allowance applied but cap ignored) and mar_cents != 270 (cap applied to the allowance-free base 200 x 1.25 then re-inflated)"

      - name: adjustment_proration_rounds_per_line_then_sums
        grounds:
          - calculations.adjustment_proration
          - endpoints[POST /reimbursement-adjustments]
          - entities.ReimbursementAdjustment.fields.line_recoupments
        distinguishing_aspect: |
          Mode (b) — rounding-order mode, structurally different from mode (a)'s
          selection/step-order interaction: three lines of 124 cents at a 0.10
          recoupment rate give round_half_up(12.4) = 12 per line and 36 in total,
          whereas rounding the aggregate once gives round_half_up(372 * 0.10) = 37.
          The residual cent is explicitly not redistributed.
        test_recipe:
          setup:
            - "Vendor v1 AUTHORIZED in PG-SUPER-A; ACTIVE juice ceiling of 124 cents derived by statewide fallback from a single 118-cent accepted submission (118 * 1.05 = 123.90, cap 147.50)"
