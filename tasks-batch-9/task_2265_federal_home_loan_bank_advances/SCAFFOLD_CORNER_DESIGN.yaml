        claim_type: role_can_perform_own_operations
        grounds: ["roles.CreditOfficer.exclusive_operations", "roles.CreditOfficer.shared_operations"]
        distinguishing_aspect: "The credit officer owns the whole credit spine (activate, pledge, issue, review-eligibility, approve, fund, repay) and, unlike the treasury officer, is not scoped to a single member bank."
        test_recipe:
          setup: ["Two member banks exist: Harbor Savings and Cascade Mutual, each with a 9,600,000 / 6,000,000 MEMBERSHIP subscription created."]
