      - name: advance_interest_refreshes_on_read_and_ignores_creation_order
        claim_type: chronological
        grounds:
          - calculations.advance_interest_accrual
          - entities.Advance.fields.interest_accrued_through
        distinguishing_aspect: "Accrual depends only on advanced_on versus the clock, never on the order the rows were written: the advance created LAST has the OLDEST advanced_on and therefore the largest interest. The same rows re-read at three different clocks report three different figures, and the end-of-month clamp (D2 = min(day, 30)) makes a 2026-08-31 clock behave like the 30th."
        test_recipe:
          setup:
            - "Clock starts at 2026-06-01T00:00:00Z; trust advance_interest_rate_pct 5.0 (default)."
            - "Three PROPERTY_PROTECTION_ADVANCE rows created in reverse chronological order: 150,000.00 on 2026-04-01, then 200,000.00 on 2026-02-15, then 200,000.00 on 2026-02-01."
          setup_api_calls:
            - call: "POST /special-servicing/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V16", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
