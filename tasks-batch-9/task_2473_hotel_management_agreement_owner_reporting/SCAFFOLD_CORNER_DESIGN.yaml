              payload: { fiscal_year: 2026, budgeted_revenue_cents: 310000000, budgeted_operating_expenses_cents: 205000000, expected_agreement_version: "${wb_v2}" }
              as: HotelManagerOps
              captures: { wb_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${wb_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { wq_deemed_at: $.data.deemed_approved_budget_count }
            - call: "POST /hotel-management/budgets/${wa_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { wq_deemed_after: $.data.deemed_approved_budget_count }
            - call: "POST /hotel-management/budgets/${wb_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { wq_err: $.data.error_id }
          assert:
            - "OperatingBudget.${wa_bud}.owner_decision_deadline_utc == 2026-08-31T00:00:00Z"
            - "the first clock call reports deemed_approved_budget_count == 0 — the sweep is strict, so standing exactly on the deadline sweeps nothing"
            - "the decision at that instant returns HTTP 200 with OperatingBudget.${wa_bud}.status == APPROVED and decided_by_user_id == u-owner-1"
            - "the second clock call reports deemed_approved_budget_count == 1 and OperatingBudget.${wb_bud}.status == DEEMED_APPROVED with decided_by_user_id null"
            - "the late decision returns HTTP 409 with error.error_id == ERR_INVALID_BUDGET_STATE, not ERR_OWNER_DECISION_WINDOW_CLOSED — priority 20 is evaluated before priority 33"
            - "OperatingBudget.${wb_bud}.decided_by_user_id stays null after the rejected decision"

      - name: duplicate_service_code_versus_cap_exceeded_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=37]
          - validations[priority=44]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / duplicate_service_code_outranks_centralized_cap_exceeded
          rationale: "The named §1.8 instance already constructs a body that violates both rules and pins the priority-37 winner."

      - name: report_period_slot_uniqueness_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_PERIOD_ALREADY_REPORTED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / report_period_slot_uniqueness_rejects_only_the_same_month
          rationale: "The named §1.8 instance rejects the colliding month and accepts every adjacent one in the same run."

  # =========================================================================
  # §1.5 Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: budget_list_filters_by_agreement_fiscal_year_and_status
        claim_type: standard_crud
        grounds:
          - endpoints[GET /hotel-management/budgets]
          - entities.OperatingBudget
        distinguishing_aspect: "The cross-agreement budgets list narrows independently on agreement_id, fiscal_year and status, and each filter's total_count matches the rows that satisfy it and no others."
        test_recipe:
          setup:
            - "Agreement L holds a DRAFT FY2026 budget, a SUBMITTED FY2027 budget and an APPROVED FY2025 budget."
            - "Agreement M holds a single DRAFT FY2026 budget so that agreement_id has something to exclude."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "List Filter Hotel L", owner_entity_name: "Filter Owner L LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { lf_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${lf_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { lf_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${lf_agr}/budgets"
              payload: { fiscal_year: 2025, budgeted_revenue_cents: 280000000, budgeted_operating_expenses_cents: 190000000, expected_agreement_version: "${lf_v2}" }
              as: HotelManagerOps
              captures: { lf_b25: $.data.id, lf_v3: $.data.version }
            - call: "POST /hotel-management/budgets/${lf_b25}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${lf_b25}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${lf_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${lf_v3}" }
              as: HotelManagerOps
              captures: { lf_b26: $.data.id, lf_v4: $.data.version }
            - call: "POST /hotel-management/agreements/${lf_agr}/budgets"
              payload: { fiscal_year: 2027, budgeted_revenue_cents: 320000000, budgeted_operating_expenses_cents: 210000000, expected_agreement_version: "${lf_v4}" }
              as: HotelManagerOps
              captures: { lf_b27: $.data.id }
            - call: "POST /hotel-management/budgets/${lf_b27}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "List Filter Hotel M", owner_entity_name: "Filter Owner M LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { lm_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${lm_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { lm_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${lm_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 150000000, budgeted_operating_expenses_cents: 100000000, expected_agreement_version: "${lm_v2}" }
              as: HotelManagerOps
              captures: { lm_b26: $.data.id }
          trigger:
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${lf_agr}" }
              as: AssetManager
            - call: "GET /hotel-management/budgets"
              payload: { fiscal_year: 2026 }
              as: AssetManager
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${lf_agr}", status: "SUBMITTED" }
              as: AssetManager
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${lf_agr}", fiscal_year: 2026, status: "APPROVED" }
              as: AssetManager
          assert:
            - "the agreement_id read returns pagination.total_count == 3 and excludes ${lm_b26}"
            - "the fiscal_year read returns pagination.total_count == 2, holding ${lf_b26} and ${lm_b26} across both agreements"
            - "the status read returns pagination.total_count == 1 holding only ${lf_b27}"
            - "the three-filter read returns pagination.total_count == 0 with data == [] — FY2026 on agreement L is DRAFT, not APPROVED"
            - "OperatingBudget.${lf_b25}.status == APPROVED, ${lf_b26}.status == DRAFT and ${lf_b27}.status == SUBMITTED, each with revision_round == 0"

      - name: clock_advance_reports_every_sweep_counter
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.OperatingBudget.SUBMITTED_to_DEEMED_APPROVED
          - state_machines.WorkingCapitalCall.REQUESTED_to_OVERDUE
        distinguishing_aspect: "One clock advance returns all five sweep counters in a single envelope, two of them non-zero, and the swept rows carry the exact statuses those counters claim."
        test_recipe:
          setup:
            - "One ACTIVE agreement with owner_review_window_days 30 and funding_due_days 15."
            - "A FY2026 budget submitted at 2026-08-01, deadline 2026-08-31T00:00:00Z, still SUBMITTED."
            - "A manual FLOOR_RESTORATION call of 500000 due 2026-08-16, still REQUESTED."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Sweep Counter Hotel", owner_entity_name: "Sweep Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, owner_review_window_days: 30, funding_due_days: 15, initial_working_capital_cents: 0, working_capital_floor_cents: 0 }
              as: PlatformAdmin
              captures: { sc_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sc_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sc_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${sc_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${sc_v2}" }
              as: HotelManagerOps
              captures: { sc_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${sc_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/agreements/${sc_agr}/working-capital-calls"
              payload: { amount_cents: 500000, reason: "FLOOR_RESTORATION" }
              as: HotelManagerOps
              captures: { sc_call: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sc_now: $.data.current_utc, sc_deemed: $.data.deemed_approved_budget_count, sc_overdue: $.data.overdue_call_count, sc_lapsed: $.data.lapsed_cure_count, sc_deadlocked: $.data.deadlocked_dispute_count, sc_terminated: $.data.terminated_agreement_count }
            - call: "POST /hotel-management/working-capital-calls/${sc_call}/fund"
              payload: { funded_amount_cents: 500000 }
              as: OwnerRep
          assert:
            - "the clock call returns HTTP 200 with current_utc == 2026-09-01T00:00:00Z"
            - "deemed_approved_budget_count == 1 and overdue_call_count == 1"
            - "lapsed_cure_count == 0, deadlocked_dispute_count == 0 and terminated_agreement_count == 0 — every counter is present even at zero"
            - "OperatingBudget.${sc_bud}.status == DEEMED_APPROVED with decided_by_user_id null"
            - "WorkingCapitalCall.${sc_call} was OVERDUE before the funding call and ends FUNDED with late_funded == true and funded_amount_cents == 500000"
            - "ManagementAgreement.${sc_agr}.working_capital_balance_cents == 500000 and status == ACTIVE"

      - name: supersedes_budget_id_pointing_at_another_agreement_rejected
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /hotel-management/agreements/{id}/budgets]
          - validations[priority=16]
          - errors[ERR_SUPERSEDE_TARGET_INVALID]
        distinguishing_aspect: "supersedes_budget_id must name a budget of the same agreement and fiscal year: a foreign budget id returns ERR_SUPERSEDE_TARGET_INVALID with HTTP 422, while the agreement's own SUBMITTED FY2026 budget is a legal target and ends SUPERSEDED."
        test_recipe:
          setup:
            - "Agreement P holds a SUBMITTED FY2026 budget; agreement Q holds its own SUBMITTED FY2026 budget."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Supersede Hotel P", owner_entity_name: "Supersede Owner P LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { sp_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sp_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${sp_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${sp_v2}" }
              as: HotelManagerOps
              captures: { sp_bud: $.data.id, sp_v3: $.data.version }
            - call: "POST /hotel-management/budgets/${sp_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Supersede Hotel Q", owner_entity_name: "Supersede Owner Q LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { sq_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${sq_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sq_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${sq_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 150000000, budgeted_operating_expenses_cents: 100000000, expected_agreement_version: "${sq_v2}" }
              as: HotelManagerOps
              captures: { sq_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${sq_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /hotel-management/agreements/${sp_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 305000000, budgeted_operating_expenses_cents: 201000000, expected_agreement_version: "${sp_v3}", supersedes_budget_id: "${sq_bud}" }
              as: HotelManagerOps
              captures: { sx_err: $.data.error_id }
            - call: "POST /hotel-management/agreements/${sp_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 305000000, budgeted_operating_expenses_cents: 201000000, expected_agreement_version: "${sp_v3}", supersedes_budget_id: "${sp_bud}" }
              as: HotelManagerOps
              captures: { sp_bud2: $.data.id }
            - call: "GET /hotel-management/budgets"
              payload: { supersedes_budget_id: "${sp_bud}" }
              as: AssetManager
          assert:
            - "the foreign-target create returns HTTP 422 with error.error_id == ERR_SUPERSEDE_TARGET_INVALID and OperatingBudget.${sq_bud}.status is still SUBMITTED"
            - "the rejected create leaves the agreement version unchanged, so the identical retry with the same expected_agreement_version ${sp_v3} succeeds"
            - "the second create returns HTTP 201 with OperatingBudget.${sp_bud2}.supersedes_budget_id == ${sp_bud} and status == DRAFT"
            - "OperatingBudget.${sp_bud}.status == SUPERSEDED after the accepted create"
            - "the reverse read on supersedes_budget_id returns pagination.total_count == 1 holding only ${sp_bud2}"

      - name: cure_endpoint_requires_election_before_payment
        claim_type: conditional_action
        grounds:
          - endpoints[POST /hotel-management/performance-tests/{id}/cure]
          - state_machines.PerformanceTest.FAILED_CURABLE_to_CURE_ELECTED
          - errors[ERR_INVALID_TEST_STATE]
        distinguishing_aspect: "The same endpoint accepts two actions with different preconditions: PAY_CURE straight from FAILED_CURABLE returns ERR_INVALID_TEST_STATE with HTTP 409, and only after ELECT_CURE does the identical payment body succeed."
        test_recipe:
          setup:
            - "One FAILED_CURABLE test with cure_payment_due_cents 66280000 and cure_deadline_utc 2026-09-30T00:00:00Z, its agreement in CURE_PERIOD with distribution_hold true."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Cure Order Hotel", owner_entity_name: "Order Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0, gop_test_threshold_pct: 0.85, rpi_test_threshold: 90.0, min_benchmark_months: 1, test_periods_expected: 1, consecutive_failure_limit: 2, cure_window_days: 60 }
              as: PlatformAdmin
              captures: { co_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${co_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { co_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${co_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${co_v2}" }
              as: HotelManagerOps
              captures: { co_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${co_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${co_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${co_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { co_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${co_pkg}/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${co_pkg}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${co_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${co_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${co_agr}/performance-tests"
              payload: { fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { co_test: $.data.id }
          trigger:
            - call: "POST /hotel-management/performance-tests/${co_test}/cure"
              payload: { action: "PAY_CURE", payment_amount_cents: 66280000 }
              as: HotelManagerOps
              captures: { co_err: $.data.error_id }
            - call: "POST /hotel-management/performance-tests/${co_test}/cure"
              payload: { action: "ELECT_CURE" }
              as: HotelManagerOps
            - call: "POST /hotel-management/performance-tests/${co_test}/cure"
              payload: { action: "PAY_CURE", payment_amount_cents: 66280000 }
              as: HotelManagerOps
          assert:
            - "the premature payment returns HTTP 409 with error.error_id == ERR_INVALID_TEST_STATE"
            - "after the rejection PerformanceTest.${co_test}.status is still FAILED_CURABLE with cure_paid_cents == 0 and ManagementAgreement.${co_agr}.working_capital_balance_cents == 0"
            - "the election returns HTTP 200 with status == CURE_ELECTED and cure_deadline_utc unchanged at 2026-09-30T00:00:00Z"
            - "the replayed payment now returns HTTP 200 with status == CURED and cure_paid_cents == 66280000"
            - "a second ELECT_CURE after CURED returns HTTP 409 ERR_INVALID_TEST_STATE — CURED is terminal"

      - name: annual_true_up_returns_a_computed_projection
        claim_type: computed_read
        grounds:
          - endpoints[POST /hotel-management/agreements/{id}/annual-true-up]
          - calculations.annual_incentive_true_up
        distinguishing_aspect: "The true-up response body is a computed projection, not an entity: it carries all eight declared keys including the signed true_up_delta_cents and the id of the accrual it just created."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget and exactly one FINANCIAL-ACCEPTED (2026, 9) package whose agop is 20220000 and whose provisional incentive accrual is 1922000."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "True Up Projection Hotel", owner_entity_name: "Projection Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { tp_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${tp_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { tp_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${tp_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${tp_v2}" }
              as: HotelManagerOps
              captures: { tp_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${tp_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${tp_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${tp_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { tp_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${tp_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${tp_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${tp_agr}"
              payload: {}
              as: HotelManagerOps
              captures: { tp_v3: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${tp_agr}/annual-true-up"
