              captures: { err2: $.data.error_id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${mem_h}", participant_name: "Home Heather", participant_birth_date: "1990-01-01" }
              as: Member
              as_user_id: "${mem_h}"
              captures: { reg_h: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${mem_w}", participant_name: "Walkin Will", participant_birth_date: "1992-02-02" }
              as: Member
              as_user_id: "${mem_w}"
              captures: { reg_w: $.data.id }
          assert:
            - "at clock 2026-09-01 (session SCHEDULED) the walk-in registration returns ERR_REGISTRATION_WINDOW_CLOSED"
            - "at clock 2026-09-04 (member-priority sub-window) the walk-in registration returns ERR_MEMBER_PRIORITY_ONLY"
            - "at clock 2026-09-04 the HOME_MEMBER registration succeeds: Registration.${reg_h}.status == REGISTERED and registrant_class == HOME_MEMBER"
            - "at clock 2026-09-07 (public window) the same walk-in call succeeds: Registration.${reg_w}.registrant_class == NON_MEMBER and fee_charged_cents == 6000 (4000 * 1.5)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_buffer_blocks_adjacent_program_but_zero_buffer_maintenance_touches
        grounds:
          - state_machines.FacilityReservation.REQUESTED_to_APPROVED
          - entities.FacilityReservation.fields.buffer_minutes
        distinguishing_aspect: |
          Buffer-based interval semantics on FacilitySpace: a RENTAL carries a
          30-minute buffer on BOTH ends, so a PROGRAM (15-min buffer) whose own
          interval starts only 20 minutes after the rental ends still conflicts
          (rental buffered end 10:30 vs program buffered start 09:45+ — windows
          intersect), while a MAINTENANCE reservation (0 buffer) may start at
          the exact instant the rental ends (touching half-open intervals OK).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch with GYM space. APPROVED RENTAL reservation 09:00-10:00 (buffered window 08:30-10:30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Gym", kind: "GYM", capacity: 100, dropin_capacity: 20 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Renter Ron", email: "ron@x.com", birth_date: "1980-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { ron_id: $.data.id }
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "RENTAL", start_at: "2026-09-15T09:00:00Z", end_at: "2026-09-15T10:00:00Z", renter_member_id: "${ron_id}" }
              as: Member
              as_user_id: "${ron_id}"
              captures: { rent_id: $.data.id }
            - call: "POST /reservations/${rent_id}/approve"
              payload: {}
              as: BranchDirector
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "PROGRAM", start_at: "2026-09-15T10:20:00Z", end_at: "2026-09-15T11:00:00Z" }
              as: ProgramCoordinator
              captures: { prog_res: $.data.id }
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "MAINTENANCE", start_at: "2026-09-15T10:00:00Z", end_at: "2026-09-15T10:30:00Z" }
              as: BranchDirector
              captures: { maint_res: $.data.id }
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "MAINTENANCE", start_at: "2026-09-15T10:30:00Z", end_at: "2026-09-15T11:00:00Z" }
              as: BranchDirector
              captures: { maint_res2: $.data.id }
          trigger:
            - call: "POST /reservations/${prog_res}/approve"
              payload: {}
              as: BranchDirector
              captures: { err1: $.data.error_id }
            - call: "POST /reservations/${maint_res}/approve"
              payload: {}
              as: BranchDirector
              captures: { err2: $.data.error_id }
            - call: "POST /reservations/${maint_res2}/approve"
              payload: {}
              as: BranchDirector
          assert:
            - "PROGRAM 10:20-11:00 approve returns HTTP 409 ERR_SPACE_CONFLICT (rental buffer extends to 10:30; program buffer starts 10:05 — intersect)"
            - "MAINTENANCE 10:00-10:30 approve returns HTTP 409 ERR_SPACE_CONFLICT (zero buffer still intersects the rental's buffered window [08:30, 10:30))"
            - "MAINTENANCE 10:30-11:00 approves cleanly with 200 — its buffered start equals the rental buffered end exactly; touching half-open buffered intervals do not conflict"

      - name: session_date_intervals_overlap_only_on_shared_days_not_shared_space_names
        grounds:
          - entities.ProgramSession.fields.start_on
          - entities.ProgramSession.fields.end_on
          - state_machines.FacilityReservation
        distinguishing_aspect: |
          Date-range interval semantics on ProgramSession (inclusive day ranges
          [start_on, end_on]) differ from the datetime half-open buffered
          intervals on reservations: two sessions sharing a space on disjoint
          date ranges may hold PROGRAM reservations at the same daily times
          without conflict, because the reservation conflict check compares
          concrete datetimes, not recurring schedules.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch, STUDIO space, two sessions of the same program on disjoint weeks, each with an APPROVED PROGRAM reservation for its own concrete date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Studio 2", kind: "STUDIO", capacity: 30, dropin_capacity: 5 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Yoga", kind: "SPORTS", base_fee_cents: 2000, member_priority_days: 0 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-21", end_on: "2026-09-25", time_start: "07:00", time_end: "08:00", capacity: 12 }
              as: ProgramCoordinator
              captures: { sess_a: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-28", end_on: "2026-10-02", time_start: "07:00", time_end: "08:00", capacity: 12 }
              as: ProgramCoordinator
              captures: { sess_b: $.data.id }
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "PROGRAM", start_at: "2026-09-21T07:00:00Z", end_at: "2026-09-21T08:00:00Z", session_id: "${sess_a}" }
              as: ProgramCoordinator
              captures: { res_a: $.data.id }
            - call: "POST /reservations/${res_a}/approve"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "POST /reservations"
              payload: { space_id: "${space_id}", reservation_type: "PROGRAM", start_at: "2026-09-28T07:00:00Z", end_at: "2026-09-28T08:00:00Z", session_id: "${sess_b}" }
              as: ProgramCoordinator
              captures: { res_b: $.data.id }
            - call: "POST /reservations/${res_b}/approve"
              payload: {}
              as: BranchDirector
          assert:
            - "second reservation approves with 200 despite identical daily times — concrete datetimes are disjoint so no conflict"
            - "FacilityReservation.${res_a}.status == APPROVED and FacilityReservation.${res_b}.status == APPROVED"
            - "sessions on INCLUSIVE date ranges [09-21, 09-25] and [09-28, 10-02] are both valid on the same space; a third session with start_on 2026-09-25 end_on 2026-09-28 (touching both) is still creatable because session date ranges carry no buffer semantics"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: scholarship_refund_compensates_receive_pool_unchanged
        grounds:
          - state_machines.Donation.PLEDGED_to_RECEIVED
          - state_machines.Donation.RECEIVED_to_REFUNDED
          - calculations.pool_available_reconciliation
        distinguishing_aspect: |
          Conserved quantity: branch.scholarship_pool_available_cents. The
          forward action (receive a SCHOLARSHIP donation) and its compensating
          action (refund the same donation) must return the pool to its exact
          prior value — 200000 + 50000 - 50000 == 200000 with zero drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch pool holds 200000 RECEIVED SCHOLARSHIP cents and no obligations (available 200000). Campaign ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 4000000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 200000, designation: "SCHOLARSHIP" }
              as: BranchDirector
              captures: { don0: $.data.id }
            - call: "POST /donations/${don0}/receive"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 50000, designation: "SCHOLARSHIP" }
              as: BranchDirector
              captures: { don1: $.data.id }
            - call: "POST /donations/${don1}/receive"
              payload: {}
              as: BranchDirector
            - call: "POST /donations/${don1}/refund"
              payload: {}
              as: AssociationAdmin
          assert:
            - "after receive: Branch.${branch_id}.scholarship_pool_received_cents == 250000 and scholarship_pool_available_cents == 250000"
            - "after refund: Branch.${branch_id}.scholarship_pool_received_cents == 200000 and scholarship_pool_available_cents == 200000 (invariant restored exactly)"
            - "Donation.${don1}.status == REFUNDED; Donation.${don0}.status == RECEIVED"

      - name: membership_hold_resume_conserves_billed_amount_and_seat_counts
        grounds:
          - state_machines.Membership.ACTIVE_to_ON_HOLD
          - state_machines.Membership.ON_HOLD_to_ACTIVE
          - calculations.monthly_draft_amount
        distinguishing_aspect: |
          Conserved quantities: membership.lifetime_billed_cents and
          branch.active_membership_count. A hold followed by a resume (the
          compensating action pair) must leave lifetime_billed_cents unchanged
          (holds create HOLD_FEE drafts only when a draft is actually created)
          and active_membership_count unchanged (ON_HOLD stays counted) — a
          cancel is NOT the compensating pair and would decrement the count.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member M with ACTIVE membership (dues 8000), lifetime_billed_cents 16000 from two settled drafts, branch.active_membership_count == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "GET /memberships/${mship_id}/drafts"
              payload: {}
              as: BranchDirector
              captures: { draft1: "$.data[0].id" }
            - call: "POST /drafts/${draft1}/settle"
              payload: {}
              as: FrontDesk
            - call: "POST /memberships/${mship_id}/drafts"
              payload: {}
              as: BranchDirector
              captures: { draft2: $.data.id }
            - call: "POST /drafts/${draft2}/settle"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2026-11-01" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /memberships/${mship_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "Membership.${mship_id}.lifetime_billed_cents is identical before the hold and after the resume (hold+resume created no drafts and billed nothing)"
            - "Branch.${branch_id}.active_membership_count == 1 throughout (ON_HOLD does not decrement; resume does not double-increment)"
            - "Membership.${mship_id}.status == ACTIVE and hold_days_used_trailing_12mo == 0 (same-day hold window merged/clipped to zero length)"
