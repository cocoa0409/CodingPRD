              as_user_id: "op-1"
              captures: { start_err: $.data.error_id }
          assert:
            - "${start_err} == ERR_CYCLE_NOT_READY with HTTP 409"
            - "${start_err} != ERR_CHAMBER_UNAVAILABLE"
            - "Cycle.${cyc_id}.status == LOADING (unchanged)"
            - "Cycle.${cyc_id}.operator_user_id is null"
            - "EmissionPermit.${permit_id}.consumed_kg_ytd == 0"

      - name: release_bi_positive_safety_check_outranks_aeration_temporal_check
        grounds:
          - validations[priority=55]
          - validations[priority=80]
          - errors[ERR_BI_POSITIVE_BLOCKS_RELEASE]
          - errors[ERR_AERATION_INCOMPLETE]
          - state_machines.Lot.PENDING_AERATION_to_AERATING
        distinguishing_aspect: |
          Category pair `business_safety` (priority 55) versus `business_temporal`
          (priority 80) - a different pair from the state/business_safety conflict
          above. A lot whose governing cycle carries a POSITIVE biological
          indicator AND whose residual axis is still AERATING violates both; the
          safety rule wins, so the response is ERR_BI_POSITIVE_BLOCKS_RELEASE and
