        distinguishing_aspect: |
          A BoxItem selection's validity depends on the ProductionRun's state: with the only run for (meal, date) still SCHEDULED
          (not opened), selection is rejected ERR_MEAL_SOLD_OUT because no AVAILABLE run exists. Cross-entity pair
          BoxItem->ProductionRun, distinct from the Box->Subscription pair.
        test_recipe:
          setup:
            - "A run for (M1, 2026-03-16) created but NOT opened (status SCHEDULED); one OPEN box before cutoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
          trigger:
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEAL_SOLD_OUT"
            - "HTTP status == 409"

  - rule_id: resource_temporal_overlap
    instances:
      - name: production_line_buffer_conflict
        grounds:
          - validations[priority=7]
          - entities.ProductionRun.fields.line_code
          - entities.ProductionRun.fields.window_start
        distinguishing_aspect: |
          BUFFER interval semantics on the ProductionRun resource: two runs on line L1 whose windows are only 30 minutes apart
          ([06:00,10:00] then [10:30,14:00]) violate the LINE_BUFFER_MINUTES=60 cleaning gap and are rejected ERR_LINE_CONFLICT.
          Different resource and different semantics (buffer gap) than the half-open pause-window overlap.
        test_recipe:
          setup:
            - "One AVAILABLE-eligible run on line L1 window [2026-03-14T06:00:00Z, 2026-03-14T10:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_a_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T10:30:00Z", window_end: "2026-03-14T14:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_CONFLICT"
            - "HTTP status == 409"

      - name: pause_window_half_open_overlap
        grounds:
          - validations[priority=7]
          - entities.PauseWindow.fields.start_date
          - entities.PauseWindow.fields.end_date
        distinguishing_aspect: |
          HALF-OPEN [start,end) interval semantics on the Subscription resource: a new pause [2026-03-23,2026-04-06) overlaps
          an existing SCHEDULED pause [2026-03-16,2026-03-30) and is rejected ERR_PAUSE_OVERLAP; a back-to-back window starting
          exactly at 2026-03-30 would be allowed. Different resource and semantics (no buffer, adjacency allowed) than the line buffer.
        test_recipe:
          setup:
            - "A subscription with one SCHEDULED pause window [2026-03-16, 2026-03-30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause-windows"
              payload: { start_date: "2026-03-16", end_date: "2026-03-30" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause-windows"
              payload: { start_date: "2026-03-23", end_date: "2026-04-06" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAUSE_OVERLAP"
            - "HTTP status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: par_conservation_reserve_then_swap_out
        grounds:
          - calculations.run_par_remaining
          - entities.ProductionRun.fields.par_reserved
        distinguishing_aspect: |
          Conserved quantity = kitchen servings. Invariant run.par_total == run.par_reserved + run.par_remaining holds across a
          forward reserve (select M1 qty 3 -> run1 reserved 3) and its compensating swap-out to M2 (-> run1 reserved 0, remaining 10);
          run1 returns to par_reserved 0 with no drift. A different conserved quantity than wallet cents.
        test_recipe:
          setup:
            - "Two opened runs for 2026-03-16: run1 (M1, par 10) and run2 (M2, par 10); one OPEN box that selected M1 quantity 3 (run1 reserved 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M2", name: "Meal 2", protein_g: 35, carb_g: 40, fat_g: 12, calories: 450, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 10 }
              as: PlatformAdmin
              captures: { run1_id: $.data.id }
            - call: "POST /production-runs/${run1_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /production-runs"
              payload: { meal_id: "${m2_id}", delivery_date: "2026-03-16", line_code: "L2", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 10 }
              as: PlatformAdmin
              captures: { run2_id: $.data.id }
            - call: "POST /production-runs/${run2_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /box-items/${item_id}/swap"
              payload: { new_meal_id: "${m2_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "ProductionRun.${run1_id}.par_reserved == 0"
            - "ProductionRun.${run1_id}.par_remaining == 10"
            - "ProductionRun.${run2_id}.par_reserved == 3"
            - "ProductionRun.${run2_id}.par_remaining == 7"

      - name: wallet_conservation_apply_then_refund_restore
        grounds:
          - calculations.wallet_credit_balance
          - state_machines.Box.CHARGED_to_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity = wallet cents. Invariant wallet_credit_cents == signed sum of CreditLedger holds across a forward
          apply (seed +5000, charge consumes -5000 -> wallet 0) and its compensating pre-ship cancel (restore +5000 -> wallet 5000);
          the applied credit is fully restored with no drift. A different conserved quantity than kitchen servings.
        test_recipe:
          setup:
            - "PRO customer seeded 5000c; one box for 2026-03-16 with 12 meals; locked and charged (credit_applied 5000, total 8688); still LOCKED (not shipped)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/credits"
              payload: { amount_cents: 5000, reason: "SWAP_CREDIT" }
              as: PlatformAdmin
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 12 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_id}/lock"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/${box_id}/cancel"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Box.${box_id}.refund_cents == 8688"
            - "Box.${box_id}.refund_destination == ORIGINAL_PAYMENT"
            - "Box.${box_id}.billing_status == REFUNDED"
            - "Customer.${cust_id}.wallet_credit_cents == 5000"
