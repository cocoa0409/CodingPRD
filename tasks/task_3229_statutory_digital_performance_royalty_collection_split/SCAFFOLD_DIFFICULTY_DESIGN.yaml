              as: Admin
              captures: { rec_a: $.data.id }
            - call: "POST /recordings/${rec_w}/withdraw"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /recordings/${rec_w}/ownership-claims"
              payload: { claimant_type: "RIGHTS_OWNER", claimant_id: "${ro2}", claimed_share_pct: 100 }
              as: PayeeAdmin
              captures: { err_w: $.data.error_id }
            - call: "POST /recordings/${rec_a}/ownership-claims"
              payload: { claimant_type: "RIGHTS_OWNER", claimant_id: "${ro2}", claimed_share_pct: 100 }
