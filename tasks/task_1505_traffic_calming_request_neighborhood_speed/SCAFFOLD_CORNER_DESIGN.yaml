            - { call: "POST /api/funding-cycles/${cyc}/publish-ranking", payload: { expected_funding_cycle_version: "${cyc_v}" }, as: CityAdmin }
          trigger:
            - call: "GET /api/funding-cycles/${cyc}/ranking"
              payload: {}
              as: CityAdmin
              captures: { first_id: "$.data[0].id", first_rank: "$.data[0].citywide_rank", second_id: "$.data[1].id", second_rank: "$.data[1].citywide_rank" }
          assert:
            - "Row 0 is the score-65 request (req1) with citywide_rank == 1; row 1 is the score-60 request (req2) with citywide_rank == 2"
            - "Ordering is by citywide_rank ASC — the crash_count_3yr tie-break already ran at publish time"

      - name: response_envelope_shape_on_success_and_error
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Success bodies carry meta.api_request_id + meta.api_request_timestamp and response_type object (single) / array (list); error bodies carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["one segment"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Env Ave", speed_limit_mph: 25, household_count: 3, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
          trigger:
            - { call: "GET /api/segments/${seg}", payload: {}, as: CityAdmin }
            - { call: "GET /api/residents", payload: {}, as: CityAdmin }
            - call: "GET /api/segments/123e4567-e89b-42d3-a456-426614174000"
              payload: {}
              as: CityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Single GET: response_type == 'object', meta.api_request_id present and non-empty, meta.api_request_timestamp present"
            - "List GET: response_type == 'array', pagination fields limit/offset/total_count/has_more present"
            - "Unknown id: response_type == 'error', data.error_id == ERR_SEGMENT_NOT_FOUND, data.message present"

  # ===========================================================================
  # Section: errors (catalog-wide triggerability sweep not covered elsewhere)
  # ===========================================================================
  - section: errors
