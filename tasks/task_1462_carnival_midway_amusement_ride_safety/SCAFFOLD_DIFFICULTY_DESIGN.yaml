  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ride_daily_status_cycles_through_weather_holds
        grounds:
          - state_machines.Ride."daily_status=OPEN_to_daily_status=WEATHER_HOLD"
          - state_machines.Ride."daily_status=WEATHER_HOLD_to_daily_status=OPEN"
          - state_machines.OperatingDay.OPEN_to_WEATHER_HOLD
          - calculations.wind_shutdown_sweep
        distinguishing_aspect: |
          Entity: Ride — a cyclic machine (OPEN -> WEATHER_HOLD -> OPEN ->
          WEATHER_HOLD -> OPEN) living on a parallel state dimension alongside
          license_status (which must stay LICENSED throughout). The fair-level closure
          sweep at 45 mph additionally routes the day through WEATHER_HOLD and forces
          every OPEN ride into WEATHER_HOLD regardless of its own limit.
        test_recipe:
          setup:
            - "Permitted fair, ride THRILL limit 30 LICENSED and daily OPEN on day 2026-08-03"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway F", operator_company_name: "ShowCo", location: "Lot 6", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
