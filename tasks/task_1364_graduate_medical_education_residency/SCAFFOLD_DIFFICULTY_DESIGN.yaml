            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-04T00:00:00Z", ended_at: "2026-08-04T08:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l3: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l3}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-04T12:00:00Z", ended_at: "2026-08-04T20:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l4: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/duty-hour-logs/${l4}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/duty-hour-violations", payload: { resident_id: "${res}" }, as: ProgramDirector }
            - { call: "GET /residency-programs/remediation-plans", payload: { resident_id: "${res}" }, as: ProgramDirector, captures: { plans: "$.data" } }
            - { call: "GET /residency-programs/residents/${res}", payload: {}, as: ProgramDirector, captures: { rst: "$.data.standing_status" } }
            - { call: "GET /residency-programs/moonlighting-requests/${mr}", payload: {}, as: ProgramDirector, captures: { mst: "$.data.status", mreason: "$.data.decision_reason" } }
            - { call: "GET /residency-programs/residents/${res}/duty-hour-summary", payload: { week_start: "2026-08-03" }, as: ProgramDirector, captures: { moon: "$.data.attributed_moonlighting_hours" } }
          assert:
            - "Attests of l2, l3, l4 each create exactly one REST_8H violation (gaps 4.00h < 8.00h): total_count of violations for R == 3, all FLAGGED, measured_value == 4.00, threshold_value == 8.00"
            - "Hop 1-2: the 3rd unresolved violation auto-created exactly one RemediationPlan: trigger_source == DUTY_HOUR_VIOLATIONS, status == ACTIVE, goals == 'Automatic remediation: repeated duty-hour violations', start_date == 2026-08-05 (clock date), end_date == 2026-11-03 (start + 90 days)"
            - "Hop 3: Resident.${res}.standing_status == UNDER_REMEDIATION"
            - "Hop 4: MoonlightingRequest.${mr}.status == REVOKED with decision_reason == STANDING_CHANGE"
            - "Hop 5: duty-hour-summary week 2026-08-03 attributed_moonlighting_hours == 0.00 (was 2.00 while ACTIVE)"
            - "No HOURS_80_AVG or DAY_OFF_4_IN_28 violation exists for R (weekly total 34.00h, 2 worked days)"

      - name: survey_close_citation_program_status_cascade
        grounds:
          - state_machines.AnnualSurvey.OPEN_to_CLOSED
          - calculations.program_accreditation_status
          - state_machines.ComplementApproval.SUBMITTED_to_APPROVED
          - errors[ERR_PROGRAM_PROBATIONARY]
        distinguishing_aspect: |
          Depth-3 chain from POST /annual-surveys/{id}/close: close computes 3
          flagged areas -> creates 3 SERIOUS area citations plus 1 WARNING
          response-rate citation -> program_accreditation_status recomputes to
          PROBATIONARY (>= 2 unresolved SERIOUS) -> the derived status then
          GATES an unrelated SUBMITTED complement approval (ERR_PROGRAM_PROBATIONARY).
          Different trigger than the CCC and attest cascades (survey close).
        test_recipe:
          setup:
            - "Program with year; a ComplementApproval in SUBMITTED status awaiting DIO approval"
            - "AnnualSurvey OPEN for (program, year)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0012" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/annual-surveys", payload: { program_id: "${prog}", academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { surv: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/annual-surveys/${surv}/close", payload: { resident_response_rate: 69.99, faculty_response_rate: 90.00, area_results: [ { area_code: "DUTY_HOURS", compliance_pct: 60.00 }, { area_code: "EVALUATION", compliance_pct: 55.00 }, { area_code: "CASE_LOGS", compliance_pct: 65.00 }, { area_code: "SUPERVISION", compliance_pct: 95.00 } ] }, as: DesignatedInstitutionalOfficial, captures: { fl: "$.data.flagged_area_count", sst: "$.data.status" } }
            - { call: "GET /residency-programs/accreditation-citations", payload: { program_id: "${prog}" }, as: DesignatedInstitutionalOfficial }
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { pst: "$.data.accreditation_status" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial, captures: { err: "$.data.error_id" } }
          assert:
            - "Survey close: status == CLOSED, flagged_area_count == 3 (60.00, 55.00, 65.00 all < 70.00; 95.00 not flagged)"
            - "Hop 1: exactly 4 AccreditationCitations created (3 flagged areas + 1 for resident_response_rate 69.99 < 70.00); the 3 area citations are severity SERIOUS (flagged_area_count >= 3), the RESPONSE_RATE citation is WARNING; all have annual_survey_id == ${surv}"
            - "Hop 2: program.accreditation_status == PROBATIONARY (3 unresolved SERIOUS >= 2)"
            - "Hop 3: complement approve is rejected with error_id ERR_PROGRAM_PROBATIONARY — the derived program status gates an unrelated fiscal workflow"
            - "ComplementApproval.${comp}.status remains SUBMITTED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_error_beats_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Resident.INCOMING_to_ACTIVE
          - errors[ERR_RESIDENT_NOT_INCOMING]
          - errors[ERR_COMPLEMENT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: resident B is ON_LEAVE (state
          violation: activate requires INCOMING) AND the complement is at its
          headcount cap (fiscal violation: 2 + 1 > 2). The dual-failure request
          must surface ERR_RESIDENT_NOT_INCOMING (priority 6) and never
          ERR_COMPLEMENT_EXCEEDED (priority 11).
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement with approved_positions 2"
            - "Residents A ACTIVE, B ON_LEAVE (headcount full at 2)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0013" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "A One", email: "a@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resA: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resA}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "B Two", email: "b@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resB: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resB}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents/${resB}/place-on-leave", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /residency-programs/residents/${resB}/activate", payload: {}, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "activate B fails with error_id ERR_RESIDENT_NOT_INCOMING (state, priority 6) even though ERR_COMPLEMENT_EXCEEDED (fiscal, priority 11) also holds: headcount 2 + 1 > approved_positions 2"
            - "Resident.${resB}.lifecycle_status == ON_LEAVE (unchanged)"
            - "ComplementApproval.${comp}.filled_headcount == 2 (unchanged)"

      - name: night_float_safety_error_beats_capacity_error
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PROBATION_NIGHT_FLOAT_BLOCKED]
          - errors[ERR_ROTATION_CAPACITY_FULL]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: the target
          night-float block is full (capacity 1 already occupied by Q) AND the
          incoming resident P is ON_PROBATION. The dual-failure assignment must
          surface ERR_PROBATION_NIGHT_FLOAT_BLOCKED (403, priority 7) and never
          ERR_ROTATION_CAPACITY_FULL (409, priority 9). Different pair than
          state-vs-fiscal.
        test_recipe:
          setup:
            - "Program, ACTIVE year, APPROVED complement (4 positions), residents P and Q ACTIVE"
            - "Night-float rotation (is_night_float true, max_residents_per_block 1, min_pgy_level 1)"
            - "Q already PLANNED onto the rotation for block 1 (capacity consumed: 1 == max)"
            - "P is ON_PROBATION (manual probation case)"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0014" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 4, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "P One", email: "p@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resP: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resP}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "Q Two", email: "q@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { resQ: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${resQ}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "Night Float", min_pgy_level: 1, max_residents_per_block: 1, is_night_float: true }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { blk: "$.data[0].id" } }
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${resQ}", schedule_block_id: "${blk}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { asgQ: "$.data.id" } }
            - { call: "POST /residency-programs/probation-cases", payload: { resident_id: "${resP}", reason: "Unprofessional conduct" }, as: ProgramDirector, captures: { prob: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${resP}", schedule_block_id: "${blk}", rotation_id: "${rot}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Assignment create fails with error_id ERR_PROBATION_NIGHT_FLOAT_BLOCKED (403, safety, priority 7) even though ERR_ROTATION_CAPACITY_FULL (409, constraint, priority 9) also holds (Q occupies the single slot)"
            - "No RotationAssignment row is created for P (list filtered by resident_id ${resP} has total_count == 0)"
            - "RotationAssignment.${asgQ}.status == PLANNED (unchanged)"

      - name: existence_error_beats_year_state_error
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_ACADEMIC_YEAR_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair existence vs state: the create references a non-existent
          rotation_id AND the block's year is still PLANNING (not ACTIVE). The
          dual-failure request must surface ERR_NOT_FOUND (404, priority 4) and
          never ERR_ACADEMIC_YEAR_NOT_ACTIVE (409, priority 6). Different pair
          than state-vs-fiscal and safety-vs-constraint.
        test_recipe:
          setup:
            - "Program with TWO years: year1 ACTIVE (resident enrolled/activated there) and year2 still PLANNING with 13 CURRENT blocks"
            - "Resident R ACTIVE"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-0015" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2027-2028", start_date: "2027-07-01", end_date: "2028-06-29" }, as: ProgramCoordinator, captures: { yr2: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr2}" }, as: ProgramCoordinator, captures: { blk2: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res}", schedule_block_id: "${blk2}", rotation_id: "00000000-0000-0000-0000-000000000000" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Create fails with error_id ERR_NOT_FOUND (404, existence, priority 4) for the bogus rotation_id even though the block's year2 is PLANNING (ERR_ACADEMIC_YEAR_NOT_ACTIVE, priority 6, also holds)"
            - "HTTP status is 404, not 409"

  # ===========================================================================
