scenario: "Home Services Contracts (HVAC/Pest): service agreement/membership plan, seasonal recurring visits, dispatch/route, equipment/site history, parts/refrigerant tracking, warranty, renewal/auto-renew, priority-service SLA"
domain_name: home-services-contracts
api_prefix: /home-services

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities linked by foreign keys: Membership, Site, Equipment, ServiceVisit,
  # Technician, RefrigerantLog, PartUsage, WarrantyClaim, RenewalOffer reference each
  # other by id in request bodies; no nested-ownership URL chains beyond reverse-
  # reachability sub-resources.
  state_machine_shape: cyclic
  # Membership has a renewal cycle (RENEWAL_PENDING -> ACTIVE); ServiceVisit has a
  # reschedule/recall revert loop; WarrantyClaim branches; Equipment carries two
  # independent (parallel) status axes.
  relationship_patterns:
    - one_to_many       # Site -> Equipment; Membership -> ServiceVisit; ServiceVisit -> RefrigerantLog / PartUsage
    - cross_aggregate    # WarrantyClaim references Equipment and the originating ServiceVisit across aggregates
  role_model: peer_roles
  # ContractAdmin owns plans/memberships/renewals; Dispatcher owns visit scheduling and
  # routing; Technician owns on-site execution (refrigerant/parts/warranty findings);
  # Customer is entity-backed and owns their own memberships/sites read access + cancel.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier"
        constraints: "one of {BASIC, PLUS, PREMIUM}"
      - name: trade
        type: enum
        source: input
        description: "Service trade the plan covers"
        constraints: "one of {HVAC, PEST}"
      - name: annual_fee_cents
        type: integer
        source: input
        description: "Annual membership fee in cents, billed once per term year"
        constraints: ">= 0"
      - name: included_visits_per_year
        type: integer
        source: input
        description: "Number of seasonal recurring visits included in the annual fee"
        constraints: ">= 0"
      - name: extra_visit_fee_cents
        type: integer
        source: input
        description: "Per-visit fee charged when a visit beyond the included count is consumed"
        constraints: ">= 0"
      - name: sla_response_hours
        type: integer
        source: input
        description: "Priority-service SLA: max hours from a PRIORITY visit's requested_at to its scheduled window_start"
        constraints: ">= 1"
      - name: parts_discount_pct
        type: number
        source: input
        description: "Fraction (0..1) discount applied to PartUsage list price for members on this plan"
        constraints: "0 <= x <= 1"
      - name: auto_renew_default
        type: boolean
        source: input
        description: "Default auto_renew flag stamped onto Memberships created on this plan"
        default: true
      - name: active
        type: boolean
        source: system
        description: "Whether the plan can accept new memberships; set false by retire action"
        default: true

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer full name"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across active Customers"
        constraints: "non-empty; unique among Customers"
      - name: billing_balance_cents
        type: integer
        source: computed
        description: "Running unpaid balance: sum of all unsettled charges (membership fees, extra-visit fees, discounted part charges) minus credits applied; debited/credited by side effects"
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the owning customer of this service site"
      - name: address
        type: string
        source: input
        description: "Service address"
      - name: region_code
        type: string
        source: input
        description: "Routing region; must match a Technician.region_code for dispatch"
        constraints: "non-empty; e.g. NORTH, SOUTH, EAST, WEST"
      - name: access_notes
        type: string
        source: input
        description: "Gate codes / access instructions"
        default: ""

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the member"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this membership covers; site.customer_id must equal customer_id"
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan the member is enrolled on"
      - name: status
        type: enum
        source: system
        description: "Membership lifecycle state"
        constraints: "one of {PENDING_ACTIVATION, ACTIVE, RENEWAL_PENDING, SUSPENDED, LAPSED, CANCELLED}"
        default: PENDING_ACTIVATION
      - name: auto_renew
        type: boolean
        source: input
        description: "Whether the membership auto-accepts its RenewalOffer at term end; defaults from plan.auto_renew_default"
      - name: term_start
        type: datetime
        source: system
        description: "UTC instant the current term began; set on activation and on each renewal"
      - name: term_end
        type: datetime
        source: system
        description: "UTC instant the current term ends; term_start + 365 days (exclusive upper bound)"
      - name: visits_consumed
        type: integer
        source: computed
        description: "Count of this membership's ServiceVisits that reached COMPLETED within the current term window [term_start, term_end)"
        default: 0
      - name: term_index
        type: integer
        source: system
        description: "Number of completed renewal cycles; 1 on first activation, incremented on each renewal acceptance"
        default: 1

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site where this unit is installed"
      - name: model
        type: string
        source: input
        description: "Equipment model designation"
      - name: refrigerant_type
        type: enum
        source: input
        description: "Refrigerant chemical for HVAC units; null/NONE for non-refrigerant equipment"
        constraints: "one of {R410A, R32, R454B, NONE}"
        default: NONE
      - name: nameplate_charge_grams
        type: integer
        source: input
        description: "Full factory refrigerant charge in grams; 0 when refrigerant_type is NONE"
        constraints: ">= 0"
      - name: current_charge_grams
        type: integer
        source: computed
        description: "Live refrigerant mass on the unit; starts at nameplate_charge_grams, adjusted by each posted RefrigerantLog (ADD increases, RECOVER decreases)"
      - name: operational_status
        type: enum
        source: system
        description: "Operational axis (independent of warranty axis)"
        constraints: "one of {OPERATIONAL, NEEDS_SERVICE, DECOMMISSIONED}"
        default: OPERATIONAL
      - name: warranty_status
        type: enum
        source: system
        description: "Warranty axis (independent of operational axis)"
        constraints: "one of {IN_WARRANTY, EXPIRED, VOIDED}"
        default: IN_WARRANTY
      - name: warranty_expires_at
        type: datetime
        source: input
        description: "UTC instant the manufacturer warranty lapses; warranty_status auto-flips IN_WARRANTY->EXPIRED at this instant on read-affecting transitions"

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician name"
      - name: region_code
        type: string
        source: input
        description: "Region this technician services; must match Site.region_code to be dispatchable there"
      - name: trade
        type: enum
        source: input
        description: "Trade certification"
        constraints: "one of {HVAC, PEST}"
      - name: epa_certified
        type: boolean
        source: input
        description: "Whether the tech holds EPA 608 certification (required to post RefrigerantLog)"
        default: false
      - name: daily_visit_capacity
        type: integer
        source: input
        description: "Max ServiceVisits that may be SCHEDULED on this tech for any single UTC calendar date"
        constraints: ">= 1"

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership the visit is drawn against"
      - name: site_id
        type: string
        source: computed
        description: "FK -> Site.id; copied from membership.site_id at creation"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; assigned tech (set at dispatch; null while SCHEDULED unassigned)"
      - name: visit_kind
        type: enum
        source: input
        description: "Visit class"
        constraints: "one of {SEASONAL, PRIORITY, WARRANTY}"
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state"
        constraints: "one of {SCHEDULED, DISPATCHED, EN_ROUTE, ON_SITE, COMPLETED, CANCELLED, NO_SHOW}"
        default: SCHEDULED
      - name: requested_at
        type: datetime
        source: input
        description: "UTC instant the visit was requested (drives SLA clock for PRIORITY visits)"
      - name: window_start
        type: datetime
        source: input
        description: "UTC start of the booked arrival window"
      - name: window_end
        type: datetime
        source: input
        description: "UTC end of the booked arrival window (exclusive); must be > window_start"
      - name: sla_met
        type: boolean
        source: computed
        description: "For PRIORITY visits: true iff (window_start - requested_at) <= plan.sla_response_hours; null for non-PRIORITY"
      - name: billable_charge_cents
        type: integer
        source: computed
        description: "Charge stamped onto the visit at COMPLETED: extra_visit_fee_cents when this completion exceeds the plan's included_visits_per_year for the term, else 0; always 0 for WARRANTY visits"
        default: 0

  - name: RefrigerantLog
    parent: null
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the on-site visit during which the transaction occurred"
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id; the unit the refrigerant was moved on; equipment.site_id must equal visit.site_id"
      - name: action
        type: enum
        source: input
        description: "Refrigerant movement direction"
        constraints: "one of {ADD, RECOVER}"
      - name: grams
        type: integer
        source: input
        description: "Mass moved in grams; must be > 0"
        constraints: "> 0"
      - name: posted_by_tech_id
        type: string
        source: computed
        description: "FK -> Technician.id; copied from visit.technician_id at posting time"

  - name: PartUsage
    parent: null
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the visit on which the part was consumed"
      - name: part_name
        type: string
        source: input
        description: "Part description"
      - name: quantity
        type: integer
        source: input
        description: "Units consumed; must be > 0"
        constraints: "> 0"
      - name: list_price_cents
        type: integer
        source: input
        description: "Per-unit list price in cents before plan discount"
        constraints: ">= 0"
      - name: charged_cents
        type: integer
        source: computed
        description: "Total charge after plan discount, computed at posting from list_price_cents, quantity, and the membership plan's parts_discount_pct (rounded per the calculation rule)"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id; the unit the claim is filed against"
      - name: origin_visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id; the WARRANTY-kind visit that surfaced the defect"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, SETTLED}"
        default: SUBMITTED
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Repair cost the customer claims under warranty"
        constraints: ">= 0"
      - name: approved_amount_cents
        type: integer
        source: system
        description: "Amount the reviewer authorizes; set on APPROVED; 0 on DENIED"
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: "Free-text reason set when status becomes DENIED"
        default: ""

  - name: RenewalOffer
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership this offer renews"
      - name: offered_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan offered for the next term (may equal current plan)"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle state"
        constraints: "one of {PENDING, ACCEPTED, AUTO_ACCEPTED, DECLINED, EXPIRED}"
        default: PENDING
      - name: offered_annual_fee_cents
        type: integer
        source: computed
        description: "Snapshot of offered_plan.annual_fee_cents at offer creation (version-pinned price)"
      - name: expires_at
        type: datetime
        source: input
        description: "UTC instant after which the offer can no longer be accepted/declined; auto/manual expiry occurs on clock advance past this"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Membership
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: ContractAdmin
        preconditions:
          - "membership.status == PENDING_ACTIVATION"
          - "referenced plan.active == true"
        side_effects:
          - "set term_start = current clock; term_end = term_start + 365 days"
          - "set term_index = 1"
          - "Customer.billing_balance_cents += plan.annual_fee_cents (run AnnualFeeAccrual)"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /memberships/{id}/renewal-offers (offer creation) — membership flips when its first PENDING offer exists"
        actor: ContractAdmin
        preconditions:
          - "membership.status == ACTIVE"
          - "no existing RenewalOffer for this membership in status PENDING/ACCEPTED/AUTO_ACCEPTED"
        side_effects:
          - "create RenewalOffer{status: PENDING, offered_annual_fee_cents := offered_plan.annual_fee_cents}"
          - "set membership.status = RENEWAL_PENDING"
          - "increments Membership.version by 1"
        note: "Cycle entry; the offer's acceptance returns membership to ACTIVE."

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /renewal-offers/{id}/accept (or auto-accept on clock advance when auto_renew)"
        actor: Customer
        preconditions:
          - "membership.status == RENEWAL_PENDING"
          - "the offer being accepted is in status PENDING"
          - "current clock < offer.expires_at"
        side_effects:
          - "set offer.status = ACCEPTED (or AUTO_ACCEPTED for system auto-renew)"
          - "set membership.plan_id = offer.offered_plan_id"
          - "set term_start = previous term_end; term_end = new term_start + 365 days"
          - "increment membership.term_index by 1"
          - "Customer.billing_balance_cents += offer.offered_annual_fee_cents (run AnnualFeeAccrual on renewal)"
          - "increments Membership.version by 1"
        note: "Closes the renewal cycle back to ACTIVE; resets the included-visit allowance for the new term."

      - from: RENEWAL_PENDING
        to: LAPSED
        trigger: "POST /renewal-offers/{id}/decline (or auto-expiry on clock advance past expires_at when NOT auto_renew)"
        actor: Customer
        preconditions:
          - "membership.status == RENEWAL_PENDING"
          - "the offer being declined/expiring is in status PENDING"
        side_effects:
          - "set offer.status = DECLINED (manual) or EXPIRED (clock-driven)"
          - "set membership.status = LAPSED"
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{id}/suspend"
        actor: ContractAdmin
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "cancel all of this membership's ServiceVisits in status SCHEDULED/DISPATCHED (cascade: each -> CANCELLED)"
          - "increments Membership.version by 1"
        note: "Cross-entity cascade down into ServiceVisits."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{id}/reinstate"
        actor: ContractAdmin
        preconditions:
          - "membership.status == SUSPENDED"
        side_effects:
          - "increments Membership.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Customer
        preconditions:
          - "membership.status IN {ACTIVE, SUSPENDED, RENEWAL_PENDING}"
        side_effects:
          - "cancel all of this membership's ServiceVisits in status SCHEDULED/DISPATCHED/EN_ROUTE (cascade -> CANCELLED)"
          - "expire any PENDING RenewalOffer for this membership (set status = EXPIRED)"
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Customer
        preconditions:
          - "membership.status IN {ACTIVE, SUSPENDED, RENEWAL_PENDING}"
        side_effects:
          - "cancel all of this membership's ServiceVisits in status SCHEDULED/DISPATCHED/EN_ROUTE (cascade -> CANCELLED)"
          - "expire any PENDING RenewalOffer for this membership (set status = EXPIRED)"
          - "increments Membership.version by 1"
      - from: RENEWAL_PENDING
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Customer
        preconditions:
          - "membership.status IN {ACTIVE, SUSPENDED, RENEWAL_PENDING}"
        side_effects:
          - "cancel all of this membership's ServiceVisits in status SCHEDULED/DISPATCHED/EN_ROUTE (cascade -> CANCELLED)"
          - "expire any PENDING RenewalOffer for this membership (set status = EXPIRED)"
          - "increments Membership.version by 1"

  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /service-visits/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "visit.status == SCHEDULED"
          - "new window_end > new window_start"
          - "no SLA / capacity / overlap violation under the new window (re-run all create-time checks)"
        side_effects:
          - "set window_start, window_end to new values"
          - "recompute sla_met for PRIORITY visits (run SlaEvaluation)"
          - "increments ServiceVisit.version by 1"
        note: "Self-loop reschedule; window may move but visit stays SCHEDULED."

      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /service-visits/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "visit.status == SCHEDULED"
          - "assigned technician.region_code == visit-site.region_code"
          - "assigned technician.trade == membership-plan.trade"
        side_effects:
          - "set technician_id to the dispatched tech"
          - "increments ServiceVisit.version by 1"

      - from: DISPATCHED
        to: SCHEDULED
        trigger: "POST /service-visits/{id}/recall"
        actor: Dispatcher
        preconditions:
          - "visit.status == DISPATCHED"
        side_effects:
          - "clear technician_id (set null)"
          - "increments ServiceVisit.version by 1"
        note: "Revert edge: undo a dispatch, returning to the SCHEDULED pool."

      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "POST /service-visits/{id}/depart"
        actor: Technician
        preconditions:
          - "visit.status == DISPATCHED"
          - "acting technician.id == visit.technician_id"
        side_effects:
          - "increments ServiceVisit.version by 1"

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /service-visits/{id}/arrive"
        actor: Technician
        preconditions:
          - "visit.status == EN_ROUTE"
          - "acting technician.id == visit.technician_id"
        side_effects:
          - "increments ServiceVisit.version by 1"

      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /service-visits/{id}/complete"
        actor: Technician
        preconditions:
          - "visit.status == ON_SITE"
          - "acting technician.id == visit.technician_id"
          - "for HVAC visits, every Equipment at the site that received refrigerant this visit is mass-balance consistent (RefrigerantMassBalance invariant must hold post-completion)"
        side_effects:
          - "run VisitChargeAssessment: stamp billable_charge_cents; if > 0, Customer.billing_balance_cents += billable_charge_cents"
          - "owning membership.visits_consumed becomes recomputable as the new COMPLETED count (derived-on-read; this does NOT mutate or version-bump the Membership row) — bubble-up to Membership"
          - "if any RefrigerantLog with action RECOVER reduced an Equipment's current_charge_grams below 10% of nameplate, set that Equipment.operational_status = NEEDS_SERVICE (cascade)"
          - "increments ServiceVisit.version by 1"
        note: "Terminal; triggers billing + membership consumption bubble-up + equipment cascade."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-visits/{id}/cancel (or cascade from Membership suspend/cancel)"
        actor: Dispatcher
        preconditions:
          - "visit.status IN {SCHEDULED, DISPATCHED, EN_ROUTE}"
        side_effects:
          - "increments ServiceVisit.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /service-visits/{id}/cancel (or cascade from Membership suspend/cancel)"
        actor: Dispatcher
        preconditions:
          - "visit.status IN {SCHEDULED, DISPATCHED, EN_ROUTE}"
        side_effects:
          - "clear technician_id (set null)"
          - "increments ServiceVisit.version by 1"
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /service-visits/{id}/cancel (or cascade from Membership cancel)"
        actor: Dispatcher
        preconditions:
          - "visit.status IN {SCHEDULED, DISPATCHED, EN_ROUTE}"
        side_effects:
          - "clear technician_id (set null)"
          - "increments ServiceVisit.version by 1"

      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /service-visits/{id}/mark-no-show"
        actor: Dispatcher
        preconditions:
          - "visit.status == DISPATCHED"
          - "current clock >= visit.window_end"
        side_effects:
          - "increments ServiceVisit.version by 1"
        note: "Window elapsed without departure; boundary on clock vs window_end."

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{id}/start-review"
        actor: ContractAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "referenced Equipment.warranty_status == IN_WARRANTY"
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "Cross-entity guard: equipment must still be IN_WARRANTY at review start."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: ContractAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "approved_amount_cents <= claim.claimed_amount_cents"
        side_effects:
          - "set approved_amount_cents to the authorized amount"
          - "increments WarrantyClaim.version by 1"
        note: "Branch A of the fork."

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: ContractAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "set approved_amount_cents = 0; set denial_reason"
          - "set referenced Equipment.warranty_status = VOIDED (cascade: a denied claim voids the warranty)"
          - "increments WarrantyClaim.version by 1"
        note: "Branch B of the fork; divergent side-effect set (voids warranty)."

      - from: APPROVED
        to: SETTLED
        trigger: "POST /warranty-claims/{id}/settle"
        actor: ContractAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "Customer.billing_balance_cents -= approved_amount_cents (credit applied; CompensatingWarrantyCredit)"
          - "increments WarrantyClaim.version by 1"
        note: "Join point; settlement credits the customer ledger by exactly approved_amount_cents."

  - entity: Equipment
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPERATIONAL
        to: NEEDS_SERVICE
        trigger: "POST /equipment/{id}/flag-service (or cascade from a deep refrigerant recovery on visit completion)"
        actor: Technician
        preconditions:
          - "equipment.operational_status == OPERATIONAL"
        side_effects:
          - "increments Equipment.version by 1"
        note: "Operational axis only; warranty_status is untouched (parallel dimension)."

      - from: NEEDS_SERVICE
        to: OPERATIONAL
        trigger: "POST /equipment/{id}/clear-service"
        actor: Technician
        preconditions:
          - "equipment.operational_status == NEEDS_SERVICE"
          - "current_charge_grams >= 10% of nameplate_charge_grams (unit recharged back into spec)"
        side_effects:
          - "increments Equipment.version by 1"

      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /equipment/{id}/decommission"
        actor: ContractAdmin
        preconditions:
          - "equipment.operational_status IN {OPERATIONAL, NEEDS_SERVICE}"
          - "current_charge_grams == 0 (all refrigerant recovered before retirement)"
        side_effects:
          - "increments Equipment.version by 1"
        note: "Operational terminal. EPA recovery invariant: a unit cannot retire holding refrigerant."
      - from: NEEDS_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /equipment/{id}/decommission"
        actor: ContractAdmin
        preconditions:
          - "equipment.operational_status IN {OPERATIONAL, NEEDS_SERVICE}"
          - "current_charge_grams == 0 (all refrigerant recovered before retirement)"
        side_effects:
          - "increments Equipment.version by 1"

  - entity: RenewalOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, AUTO_ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /renewal-offers/{id}/accept"
        actor: Customer
        preconditions:
          - "offer.status == PENDING"
          - "current clock < offer.expires_at"
          - "owning membership.status == RENEWAL_PENDING"
        side_effects:
          - "drive Membership RENEWAL_PENDING -> ACTIVE (see Membership machine)"
          - "increments RenewalOffer.version by 1"
      - from: PENDING
        to: AUTO_ACCEPTED
        trigger: "POST /_clock/advance — system auto-accept when clock crosses expires_at and membership.auto_renew == true"
        actor: system
        preconditions:
          - "offer.status == PENDING"
          - "current clock >= offer.expires_at"
          - "owning membership.auto_renew == true"
        side_effects:
          - "drive Membership RENEWAL_PENDING -> ACTIVE"
          - "increments RenewalOffer.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /renewal-offers/{id}/decline"
        actor: Customer
        preconditions:
          - "offer.status == PENDING"
          - "owning membership.status == RENEWAL_PENDING"
        side_effects:
          - "drive Membership RENEWAL_PENDING -> LAPSED"
          - "increments RenewalOffer.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_clock/advance — system expiry when clock crosses expires_at and membership.auto_renew == false (also set by membership cancel)"
        actor: system
        preconditions:
          - "offer.status == PENDING"
          - "current clock >= offer.expires_at"
          - "owning membership.auto_renew == false"
        side_effects:
          - "drive Membership RENEWAL_PENDING -> LAPSED"
          - "increments RenewalOffer.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: visit-create-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /service-visits"
    occ_field: "expected_membership_version"
    description: |
      Creating a ServiceVisit against a Membership whose version has advanced
      since the client last observed it is rejected. A membership suspend or
      cancel (which bumps version and cascade-cancels visits) may have landed
      between the client's read and this create; the stale-version guard
      rejects a visit drawn against a membership view that no longer reflects
      the membership's allowance/active state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-offer-create-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /memberships/{id}/renewal-offers"
    occ_field: "expected_membership_version"
    description: |
      Creating a RenewalOffer against a Membership whose version has advanced
      since the client last observed it is rejected. Another offer creation
      (which flips the membership to RENEWAL_PENDING and bumps version) may
      legitimately supersede the client's view; the stale-version guard
      rejects the second offer drawn against the now-stale membership.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: VisitChargeAssessment
    trigger: "ServiceVisit ON_SITE -> COMPLETED"
    algorithm: threshold
    formula: |
      # Determine prior_completed = count of this membership's ServiceVisits
      # already in COMPLETED with visit_kind == SEASONAL whose completion fell
      # in the current term window [term_start, term_end), EXCLUDING this visit.
      # included = plan.included_visits_per_year
      if visit.visit_kind == WARRANTY:
          billable_charge_cents = 0
      elif visit.visit_kind == PRIORITY:
          # PRIORITY visits always bill the extra-visit fee (they are out-of-plan)
          billable_charge_cents = plan.extra_visit_fee_cents
      else:  # SEASONAL
          # the (prior_completed + 1)-th seasonal completion; charge only if it
          # EXCEEDS the included allowance (strict >, i.e. the (included+1)-th and beyond)
          if (prior_completed + 1) > included:
              billable_charge_cents = plan.extra_visit_fee_cents
          else:
              billable_charge_cents = 0
      # On charge > 0: Customer.billing_balance_cents += billable_charge_cents
    input_set: "SEASONAL ServiceVisits of the same membership in status COMPLETED whose completion clock fell within [term_start, term_end); the current visit is the (prior_completed+1)-th."
    constants:
      LOW_CHARGE_RATIO: 0.10
    precision: "integer cents; no fractional cents arise"
    variants:
      - name: seasonal_within_allowance
        when: "SEASONAL visit and (prior_completed + 1) <= included"
        difference: "billable_charge_cents = 0; balance unchanged"
      - name: seasonal_overage
        when: "SEASONAL visit and (prior_completed + 1) > included"
        difference: "billable_charge_cents = extra_visit_fee_cents; balance debited"
      - name: priority_outofplan
        when: "PRIORITY visit"
        difference: "always billable_charge_cents = extra_visit_fee_cents regardless of allowance"

  - name: WarrantyClaimSettlement
    trigger: "WarrantyClaim APPROVED -> SETTLED"
    algorithm: aggregation
    formula: |
      # Credit the customer ledger by the authorized amount.
      # approved_amount_cents was pinned at APPROVE time (<= claimed_amount_cents).
      delta = approved_amount_cents
      Customer.billing_balance_cents = Customer.billing_balance_cents - delta
      # Conserved-quantity invariant (CompensatingWarrantyCredit):
      #   for a claim that goes SUBMITTED -> ... -> SETTLED with approved A,
      #   the net ledger movement attributable to the claim is exactly -A.
      #   A DENIED claim contributes 0 to the ledger (no credit), preserving balance.
    input_set: "the single WarrantyClaim being settled; uses its approved_amount_cents."
    constants: {}
    precision: "integer cents"
    variants:
      - name: approved_full
        when: "approved_amount_cents == claimed_amount_cents"
        difference: "ledger credited by the full claimed amount"
      - name: approved_partial
        when: "0 < approved_amount_cents < claimed_amount_cents"
        difference: "ledger credited only by the partial authorized amount; the difference is NOT credited"

  - name: PartChargeRounding
    trigger: "POST /service-visits/{id}/part-usages (PartUsage creation while visit ON_SITE)"
    algorithm: tiered_pricing
    formula: |
      # Discounted per-line-item charge with rounding pinned to PER-LINE-ITEM then sum.
      # For a single PartUsage line:
      #   gross_line = list_price_cents * quantity
      #   discounted_line = gross_line * (1 - plan.parts_discount_pct)
      #   charged_cents = round_half_up(discounted_line)   # rounded at the LINE level
      # The membership-wide parts subtotal is the SUM of already-rounded line charges
      # (round-then-sum), NOT round(sum of raw discounted lines). This ordering is
      # pinned: each PartUsage.charged_cents is independently rounded, then summed.
      gross_line = list_price_cents * quantity
      discounted_line = gross_line * (1.0 - plan.parts_discount_pct)
      charged_cents = round_half_up(discounted_line)
      # On creation: Customer.billing_balance_cents += charged_cents
    input_set: "the single PartUsage line being posted; plan.parts_discount_pct comes from the visit's membership plan."
    constants: {}
    precision: "round_half_up to integer cents, applied PER LINE ITEM before summing across lines"
    variants:
      - name: no_discount
        when: "plan.parts_discount_pct == 0"
        difference: "charged_cents == list_price_cents * quantity exactly"
      - name: with_discount
        when: "plan.parts_discount_pct > 0"
        difference: "charged_cents == round_half_up(list_price_cents * quantity * (1 - pct))"

  - name: SlaEvaluation
    trigger: "ServiceVisit creation (PRIORITY) and on reschedule"
    algorithm: threshold
    formula: |
      # PRIORITY visits carry an SLA on response latency.
      # latency_hours = (window_start - requested_at) in whole/fractional hours
      # sla_met = latency_hours <= plan.sla_response_hours   (<=, inclusive boundary)
      # For non-PRIORITY visits, sla_met = null (not evaluated).
      if visit.visit_kind != PRIORITY:
          sla_met = null
      else:
          latency_hours = (window_start - requested_at).total_seconds() / 3600.0
          sla_met = (latency_hours <= plan.sla_response_hours)
    input_set: "the single ServiceVisit; plan.sla_response_hours from the visit's membership plan."
    constants: {}
    precision: "hours as fractional float; comparison is <= (inclusive)"
    variants:
      - name: priority_within_sla
        when: "latency_hours <= sla_response_hours"
        difference: "sla_met = true"
      - name: priority_breach
        when: "latency_hours > sla_response_hours"
        difference: "sla_met = false (visit is still created; breach is recorded, not rejected)"

  - name: RefrigerantMassBalance
    trigger: "RefrigerantLog posting and ServiceVisit completion (invariant check)"
    algorithm: aggregation
    formula: |
      # current_charge_grams is a running accumulator over posted RefrigerantLogs,
      # processed in created_at ASC order (tie-break created_at ASC; id never used):
      #   current_charge_grams = nameplate_charge_grams
      #                          + sum(grams for logs where action == ADD)
      #                          - sum(grams for logs where action == RECOVER)
      # Invariants enforced at posting time:
      #   - a RECOVER may not drive current_charge_grams below 0 (ERR_REFRIGERANT_BALANCE)
      #   - an ADD may not drive current_charge_grams above nameplate_charge_grams
      #     (overcharge; ERR_REFRIGERANT_BALANCE)
      # Conserved-quantity invariant (mass balance): for any visit that RECOVERS R
      # grams and then ADDs back R grams on the same equipment, current_charge_grams
      # returns to its pre-visit value (net 0). The benchmark pins this as a global
      # invariant over Equipment.current_charge_grams.
    input_set: "all RefrigerantLogs for an equipment, ordered by created_at ASC."
    constants:
      LOW_CHARGE_RATIO: 0.10
    precision: "integer grams"
    variants:
      - name: recover_then_charge_neutral
        when: "a RECOVER of R grams is followed by an ADD of R grams on the same unit"
        difference: "current_charge_grams unchanged net; mass conserved"
      - name: deep_recovery_flags_service
        when: "cumulative RECOVER leaves current_charge_grams < 10% of nameplate at visit completion"
        difference: "Equipment.operational_status cascades OPERATIONAL -> NEEDS_SERVICE"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity-backed Customer acting on a membership/site/visit, X-User-ID owns the resource (customer_id chain)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-scoped reads/cancels"

  - priority: 4
    category: existence
    check: "every path id and every FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body present, JSON-parseable, required fields present with correct types and enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 6
    category: business_referential
    check: "on Membership create: site.customer_id == body.customer_id (the site belongs to the member)"
    error_id: ERR_SITE_OWNER_MISMATCH
    http_status: 409
    applies_to: "POST /memberships"

  - priority: 7
    category: business_referential
    check: "on ServiceVisit create: the referenced Membership is in status ACTIVE; on RefrigerantLog/PartUsage create: the referenced ServiceVisit is in status ON_SITE"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /service-visits; POST /service-visits/{id}/refrigerant-logs; POST /service-visits/{id}/part-usages"

  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "on RefrigerantLog posting: acting/assigned technician.epa_certified == true (EPA 608 required to move refrigerant)"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /service-visits/{id}/refrigerant-logs"

  - priority: 10
    category: business_safety
    check: "on RefrigerantLog posting: a RECOVER may not drive current_charge_grams below 0, and an ADD may not exceed nameplate_charge_grams (mass balance)"
    error_id: ERR_REFRIGERANT_BALANCE
    http_status: 422
    applies_to: "POST /service-visits/{id}/refrigerant-logs"

  - priority: 11
    category: business_safety
    check: "on Equipment decommission: current_charge_grams == 0 (no refrigerant may remain on a retired unit)"
    error_id: ERR_REFRIGERANT_NOT_EVACUATED
    http_status: 422
    applies_to: "POST /equipment/{id}/decommission"

  - priority: 12
    category: business_constraint
    check: "on dispatch: assigned technician.region_code == visit-site.region_code AND technician.trade == membership-plan.trade"
    error_id: ERR_TECH_REGION_TRADE_MISMATCH
    http_status: 422
    applies_to: "POST /service-visits/{id}/dispatch"

  - priority: 13
    category: business_temporal
    check: "on ServiceVisit create/reschedule: window_end > window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /service-visits; POST /service-visits/{id}/reschedule"

  - priority: 14
    category: business_temporal
    check: "on dispatch: the dispatched window does not overlap (half-open [window_start, window_end) intersection) another non-terminal ServiceVisit already DISPATCHED/EN_ROUTE/ON_SITE for the same technician; touching endpoints (a.end == b.start) do NOT overlap"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /service-visits/{id}/dispatch"

  - priority: 15
    category: business_constraint
    check: "on ServiceVisit create/reschedule: count of this technician's SCHEDULED+DISPATCHED visits whose window_start falls on the same UTC calendar date does not exceed technician.daily_visit_capacity; capacity check uses calendar-date bucketing (a buffer-free, date-grain interval semantics distinct from the minute-grain overlap check)"
    error_id: ERR_TECH_DAILY_CAPACITY
    http_status: 409
    applies_to: "POST /service-visits; POST /service-visits/{id}/reschedule; POST /service-visits/{id}/dispatch"

  - priority: 16
    category: business_temporal
    check: "on PRIORITY ServiceVisit create: requested_at <= window_start (cannot book a window before the request instant)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /service-visits"

  - priority: 17
    category: business_constraint
    check: "on RenewalOffer create: no existing RenewalOffer for the membership is in status PENDING/ACCEPTED/AUTO_ACCEPTED"
    error_id: ERR_OFFER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /memberships/{id}/renewal-offers"

  - priority: 18
    category: business_temporal
    check: "on RenewalOffer accept/decline: current clock < offer.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /renewal-offers/{id}/accept; POST /renewal-offers/{id}/decline"

  - priority: 19
    category: business_constraint
    check: "on WarrantyClaim approve: approved_amount_cents <= claim.claimed_amount_cents"
    error_id: ERR_APPROVAL_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 20
    category: business_referential
    check: "on WarrantyClaim create: origin_visit.visit_kind == WARRANTY AND origin_visit.site_id == equipment.site_id (claim must derive from a warranty visit at the equipment's site)"
    error_id: ERR_CLAIM_ORIGIN_INVALID
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 21
    category: business_fiscal
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /service-visits; POST /memberships/{id}/renewal-offers"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- ServicePlan ----
  - method: POST
    path: "/home-services/service-plans"
    description: "Create a service plan template"
    roles: [ContractAdmin]
    code: 201
    input: [tier, trade, annual_fee_cents, included_visits_per_year, extra_visit_fee_cents, sla_response_hours, parts_discount_pct, "auto_renew_default?"]
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/home-services/service-plans/{id}"
    description: "Fetch a service plan"
    roles: [ContractAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/home-services/service-plans"
    description: "List service plans"
    roles: [ContractAdmin, Dispatcher, Customer]
    code: 200
    input: ["tier?", "trade?", "limit?", "offset?"]
    output: ServicePlan[]
    side_effects: []
  - method: POST
    path: "/home-services/service-plans/{id}/retire"
    description: "Retire a plan (active=false); existing memberships keep their term"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["set ServicePlan.active = false"]

  # ---- Customer ----
  - method: POST
    path: "/home-services/customers"
    description: "Create a customer"
    roles: [ContractAdmin]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: []
  - method: GET
    path: "/home-services/customers/{id}"
    description: "Fetch a customer (includes billing_balance_cents)"
    roles: [ContractAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Site ----
  - method: POST
    path: "/home-services/sites"
    description: "Create a service site for a customer"
    roles: [ContractAdmin]
    code: 201
    input: [customer_id, address, region_code, "access_notes?"]
    output: Site
    side_effects: []
  - method: GET
    path: "/home-services/sites/{id}"
    description: "Fetch a site"
    roles: [ContractAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/home-services/sites"
    description: "List sites, filterable by customer_id (FK reverse-reachability for Site.customer_id)"
    roles: [ContractAdmin, Dispatcher, Customer]
    code: 200
    input: ["customer_id?", "region_code?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/home-services/sites/{id}/equipment"
    description: "List equipment installed at a site (FK reverse-reachability for Equipment.site_id)"
    roles: [ContractAdmin, Dispatcher, Customer, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: Equipment[]
    side_effects: []

  # ---- Equipment ----
  - method: POST
    path: "/home-services/equipment"
    description: "Register equipment at a site"
    roles: [ContractAdmin]
    code: 201
    input: [site_id, model, "refrigerant_type?", nameplate_charge_grams, warranty_expires_at]
    output: Equipment
    side_effects: ["set current_charge_grams = nameplate_charge_grams; operational_status = OPERATIONAL; warranty_status = IN_WARRANTY"]
  - method: GET
    path: "/home-services/equipment/{id}"
    description: "Fetch equipment (refreshes warranty_status against clock vs warranty_expires_at)"
    roles: [ContractAdmin, Dispatcher, Customer, Technician]
    code: 200
    input: []
    output: Equipment
    side_effects: ["if clock >= warranty_expires_at and warranty_status == IN_WARRANTY, flip to EXPIRED"]
  - method: POST
    path: "/home-services/equipment/{id}/flag-service"
    description: "Flag a unit as needing service (operational axis)"
    roles: [Technician]
    code: 200
    input: []
    output: Equipment
    side_effects: ["operational_status OPERATIONAL -> NEEDS_SERVICE; increments Equipment.version by 1"]
  - method: POST
    path: "/home-services/equipment/{id}/clear-service"
    description: "Clear the service flag once recharged into spec"
    roles: [Technician]
    code: 200
    input: []
    output: Equipment
    side_effects: ["operational_status NEEDS_SERVICE -> OPERATIONAL; increments Equipment.version by 1"]
  - method: POST
    path: "/home-services/equipment/{id}/decommission"
    description: "Retire a unit (requires current_charge_grams == 0)"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["operational_status -> DECOMMISSIONED; increments Equipment.version by 1"]

  # ---- Technician ----
  - method: POST
    path: "/home-services/technicians"
    description: "Create a technician"
    roles: [ContractAdmin]
    code: 201
    input: [full_name, region_code, trade, "epa_certified?", daily_visit_capacity]
    output: Technician
    side_effects: []
  - method: GET
    path: "/home-services/technicians/{id}"
    description: "Fetch a technician"
    roles: [ContractAdmin, Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/home-services/technicians"
    description: "List technicians, filterable by region_code/trade"
    roles: [ContractAdmin, Dispatcher]
    code: 200
    input: ["region_code?", "trade?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  # ---- Membership ----
  - method: POST
    path: "/home-services/memberships"
    description: "Create a membership (PENDING_ACTIVATION) for a customer/site/plan"
    roles: [ContractAdmin]
    code: 201
    input: [customer_id, site_id, plan_id, "auto_renew?"]
    output: Membership
    side_effects: ["auto_renew defaults from plan.auto_renew_default; status = PENDING_ACTIVATION"]
  - method: GET
    path: "/home-services/memberships/{id}"
    description: "Fetch a membership (includes visits_consumed, term window, term_index)"
    roles: [ContractAdmin, Customer]
    code: 200
    input: []
    output: Membership
    side_effects: ["recompute visits_consumed against current term window"]
  - method: GET
    path: "/home-services/memberships"
    description: "List memberships, filterable by customer_id/site_id/plan_id (FK reverse-reachability)"
    roles: [ContractAdmin, Customer]
    code: 200
    input: ["customer_id?", "site_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: POST
    path: "/home-services/memberships/{id}/activate"
    description: "Activate a pending membership (starts term, accrues annual fee)"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["set term_start/term_end/term_index; AnnualFeeAccrual debits Customer.billing_balance_cents; increments Membership.version by 1"]
  - method: POST
    path: "/home-services/memberships/{id}/suspend"
    description: "Suspend an active membership (cascade-cancels SCHEDULED/DISPATCHED visits)"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["cascade-cancel visits; increments Membership.version by 1"]
  - method: POST
    path: "/home-services/memberships/{id}/reinstate"
    description: "Reinstate a suspended membership"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["increments Membership.version by 1"]
  - method: POST
    path: "/home-services/memberships/{id}/cancel"
    description: "Cancel a membership (cascade-cancels visits, expires open offer)"
    roles: [Customer, ContractAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["cascade-cancel visits; expire PENDING offer; increments Membership.version by 1"]
  - method: POST
    path: "/home-services/memberships/{id}/renewal-offers"
    description: "Create a renewal offer for a membership (flips membership to RENEWAL_PENDING)"
    roles: [ContractAdmin]
    code: 201
    input: [offered_plan_id, expires_at, expected_membership_version]
    output: RenewalOffer
    side_effects: ["create RenewalOffer{PENDING, offered_annual_fee_cents}; membership ACTIVE -> RENEWAL_PENDING; increments Membership.version by 1"]
  - method: GET
    path: "/home-services/memberships/{id}/renewal-offers"
    description: "List renewal offers for a membership (FK reverse-reachability for RenewalOffer.membership_id)"
    roles: [ContractAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenewalOffer[]
    side_effects: []
  - method: GET
    path: "/home-services/memberships/{id}/service-visits"
    description: "List service visits for a membership (FK reverse-reachability for ServiceVisit.membership_id)"
    roles: [ContractAdmin, Dispatcher, Customer]
    code: 200
    input: ["status?", "visit_kind?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []

  # ---- RenewalOffer ----
  - method: GET
    path: "/home-services/renewal-offers/{id}"
    description: "Fetch a renewal offer"
    roles: [ContractAdmin, Customer]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: []
  - method: GET
    path: "/home-services/renewal-offers"
    description: "List renewal offers, filterable by offered_plan_id/membership_id (FK reverse-reachability for RenewalOffer.offered_plan_id)"
    roles: [ContractAdmin, Customer]
    code: 200
    input: ["membership_id?", "offered_plan_id?", "status?", "limit?", "offset?"]
    output: RenewalOffer[]
    side_effects: []
  - method: POST
    path: "/home-services/renewal-offers/{id}/accept"
    description: "Customer accepts a renewal offer (renews term)"
    roles: [Customer]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["offer -> ACCEPTED; membership RENEWAL_PENDING -> ACTIVE; new term; AnnualFeeAccrual; increments RenewalOffer.version by 1"]
  - method: POST
    path: "/home-services/renewal-offers/{id}/decline"
    description: "Customer declines a renewal offer (membership lapses)"
    roles: [Customer]
    code: 200
    input: []
    output: RenewalOffer
    side_effects: ["offer -> DECLINED; membership RENEWAL_PENDING -> LAPSED; increments RenewalOffer.version by 1"]

  # ---- ServiceVisit ----
  - method: POST
    path: "/home-services/service-visits"
    description: "Create (book) a service visit against an active membership"
    roles: [Dispatcher, ContractAdmin]
    code: 201
    input: [membership_id, visit_kind, requested_at, window_start, window_end, "technician_id?", expected_membership_version]
    output: ServiceVisit
    side_effects: ["copy site_id from membership; SlaEvaluation for PRIORITY; status = SCHEDULED"]
  - method: GET
    path: "/home-services/service-visits/{id}"
    description: "Fetch a service visit"
    roles: [ContractAdmin, Dispatcher, Customer, Technician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/home-services/service-visits"
    description: "List service visits, filterable by membership_id/technician_id/status (FK reverse-reachability for ServiceVisit.technician_id and ServiceVisit.site_id)"
    roles: [ContractAdmin, Dispatcher, Technician]
    code: 200
    input: ["membership_id?", "technician_id?", "site_id?", "status?", "visit_kind?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/home-services/service-visits/{id}/reschedule"
    description: "Move a SCHEDULED visit's window (re-runs SLA/capacity/window checks)"
    roles: [Dispatcher]
    code: 200
    input: [window_start, window_end]
    output: ServiceVisit
    side_effects: ["set window; recompute sla_met; increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/dispatch"
    description: "Assign a technician and dispatch (overlap + capacity + region/trade checks)"
    roles: [Dispatcher]
    code: 200
    input: [technician_id]
    output: ServiceVisit
    side_effects: ["set technician_id; increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/recall"
    description: "Recall a dispatched visit back to SCHEDULED (clears tech)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["clear technician_id; increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/depart"
    description: "Technician departs toward the site"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/arrive"
    description: "Technician arrives on site"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/complete"
    description: "Complete the visit (charge assessment, consumption bubble-up, equipment cascade)"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["VisitChargeAssessment stamps billable_charge_cents; debit balance; bubble-up membership.visits_consumed; deep-recovery equipment cascade; increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/cancel"
    description: "Cancel a non-terminal visit"
    roles: [Dispatcher, ContractAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status -> CANCELLED; clear technician_id; increments ServiceVisit.version by 1"]
  - method: POST
    path: "/home-services/service-visits/{id}/mark-no-show"
    description: "Mark a dispatched visit as a no-show after its window elapses"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status -> NO_SHOW; increments ServiceVisit.version by 1"]

  # ---- RefrigerantLog ----
  - method: POST
    path: "/home-services/service-visits/{id}/refrigerant-logs"
    description: "Post a refrigerant ADD/RECOVER during an ON_SITE visit (EPA + mass balance enforced)"
    roles: [Technician]
    code: 201
    input: [equipment_id, action, grams]
    output: RefrigerantLog
    side_effects: ["copy posted_by_tech_id from visit.technician_id; adjust Equipment.current_charge_grams; increments Equipment.version by 1"]
  - method: GET
    path: "/home-services/service-visits/{id}/refrigerant-logs"
    description: "List refrigerant logs for a visit (FK reverse-reachability for RefrigerantLog.visit_id)"
    roles: [ContractAdmin, Technician, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: RefrigerantLog[]
    side_effects: []
  - method: GET
    path: "/home-services/refrigerant-logs/{id}"
    description: "Fetch a single refrigerant log"
    roles: [ContractAdmin, Technician, Dispatcher]
    code: 200
    input: []
    output: RefrigerantLog
    side_effects: []
  - method: GET
    path: "/home-services/refrigerant-logs"
    description: "List refrigerant logs, filterable by equipment_id/posted_by_tech_id (FK reverse-reachability for RefrigerantLog.equipment_id and RefrigerantLog.posted_by_tech_id)"
    roles: [ContractAdmin, Technician, Dispatcher]
    code: 200
    input: ["equipment_id?", "posted_by_tech_id?", "visit_id?", "limit?", "offset?"]
    output: RefrigerantLog[]
    side_effects: []

  # ---- PartUsage ----
  - method: POST
    path: "/home-services/service-visits/{id}/part-usages"
    description: "Post a part consumed during an ON_SITE visit (PartChargeRounding)"
    roles: [Technician]
    code: 201
    input: [part_name, quantity, list_price_cents]
    output: PartUsage
    side_effects: ["PartChargeRounding stamps charged_cents; Customer.billing_balance_cents += charged_cents"]
  - method: GET
    path: "/home-services/service-visits/{id}/part-usages"
    description: "List parts consumed on a visit (FK reverse-reachability for PartUsage.visit_id)"
    roles: [ContractAdmin, Technician, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: PartUsage[]
    side_effects: []

  # ---- WarrantyClaim ----
  - method: POST
    path: "/home-services/warranty-claims"
    description: "File a warranty claim from a WARRANTY visit against equipment"
    roles: [ContractAdmin, Technician]
    code: 201
    input: [equipment_id, origin_visit_id, claimed_amount_cents]
    output: WarrantyClaim
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/home-services/warranty-claims/{id}"
    description: "Fetch a warranty claim"
    roles: [ContractAdmin, Customer, Technician]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/home-services/warranty-claims"
    description: "List warranty claims, filterable by equipment_id/origin_visit_id (FK reverse-reachability for WarrantyClaim.equipment_id and WarrantyClaim.origin_visit_id)"
    roles: [ContractAdmin, Customer, Technician]
    code: 200
    input: ["equipment_id?", "origin_visit_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/home-services/warranty-claims/{id}/start-review"
    description: "Begin reviewing a submitted claim (equipment must be IN_WARRANTY)"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/home-services/warranty-claims/{id}/approve"
    description: "Approve a claim with an authorized amount"
    roles: [ContractAdmin]
    code: 200
    input: [approved_amount_cents]
    output: WarrantyClaim
    side_effects: ["set approved_amount_cents; increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/home-services/warranty-claims/{id}/deny"
    description: "Deny a claim (voids equipment warranty)"
    roles: [ContractAdmin]
    code: 200
    input: [denial_reason]
    output: WarrantyClaim
    side_effects: ["approved_amount_cents = 0; set denial_reason; Equipment.warranty_status -> VOIDED; increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/home-services/warranty-claims/{id}/settle"
    description: "Settle an approved claim (credit customer ledger)"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["Customer.billing_balance_cents -= approved_amount_cents; increments WarrantyClaim.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/home-services/_clock/set_current_utc"
    description: "Set the server's logical UTC clock (test-driving)"
    roles: [ContractAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock to the given instant"]
  - method: POST
    path: "/home-services/_clock/advance"
    description: "Advance the logical UTC clock to an instant, firing auto-accept/auto-expiry on any RenewalOffer whose expires_at the clock crosses (test-driving)"
    roles: [ContractAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set clock; for each PENDING offer with expires_at <= clock: auto-accept if membership.auto_renew else expire, driving the Membership renewal cycle"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer X-User-ID does not own the membership/site/visit being accessed"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK does not resolve to an existing resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or invalid enum value"
  - id: ERR_SITE_OWNER_MISMATCH
    http: 409
    condition: "On membership create, site.customer_id != body.customer_id"
  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 409
    condition: "ServiceVisit create against a non-ACTIVE membership, or refrigerant/part posting against a non-ON_SITE visit"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_TECH_NOT_CERTIFIED
    http: 422
    condition: "RefrigerantLog posting by a non-EPA-certified technician"
  - id: ERR_REFRIGERANT_BALANCE
    http: 422
    condition: "RECOVER would drive current_charge_grams below 0, or ADD would exceed nameplate_charge_grams"
  - id: ERR_REFRIGERANT_NOT_EVACUATED
    http: 422
    condition: "Equipment decommission attempted while current_charge_grams != 0"
  - id: ERR_TECH_REGION_TRADE_MISMATCH
    http: 422
    condition: "Dispatch to a technician whose region_code != site.region_code or trade != plan.trade"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end <= window_start, or PRIORITY visit with requested_at > window_start"
  - id: ERR_TECH_DOUBLE_BOOKED
    http: 409
    condition: "Dispatch window half-open-overlaps another DISPATCHED/EN_ROUTE/ON_SITE visit for the same technician"
  - id: ERR_TECH_DAILY_CAPACITY
    http: 409
    condition: "Technician's SCHEDULED+DISPATCHED visit count on the visit's calendar date would exceed daily_visit_capacity"
  - id: ERR_OFFER_ALREADY_OPEN
    http: 409
    condition: "A RenewalOffer in PENDING/ACCEPTED/AUTO_ACCEPTED already exists for the membership"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Accept/decline attempted on an offer at or after its expires_at"
  - id: ERR_APPROVAL_EXCEEDS_CLAIM
    http: 422
    condition: "approved_amount_cents > claim.claimed_amount_cents on approve"
  - id: ERR_CLAIM_ORIGIN_INVALID
    http: 422
    condition: "WarrantyClaim origin_visit is not visit_kind WARRANTY, or its site_id != equipment.site_id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on a guarded write"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific code (reserved fallback)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ContractAdmin
    description: "Manages plans, customers, sites, equipment registration, memberships, renewals, and warranty claim adjudication"
    identity: opaque
    exclusive_operations:
      - "create/retire ServicePlan"
      - "create Customer / Site / Equipment / Technician / Membership"
      - "activate/suspend/reinstate Membership"
      - "create RenewalOffer"
      - "decommission Equipment"
      - "start-review/approve/deny/settle WarrantyClaim"
      - "set/advance test clock"
    shared_operations:
      - "cancel Membership (shared with Customer)"
      - "create ServiceVisit (shared with Dispatcher)"
      - "cancel ServiceVisit (shared with Dispatcher)"
      - "create WarrantyClaim (shared with Technician)"
      - "GET reads on plans/customers/sites/equipment/memberships/visits/claims/offers"

  - name: Dispatcher
    description: "Owns visit scheduling, routing, dispatch, recall, reschedule, and no-show marking"
    identity: opaque
    exclusive_operations:
      - "reschedule/dispatch/recall/mark-no-show ServiceVisit"
    shared_operations:
      - "create ServiceVisit (shared with ContractAdmin)"
      - "cancel ServiceVisit (shared with ContractAdmin)"
      - "GET reads on plans/sites/equipment/technicians/visits/refrigerant-logs/part-usages"

  - name: Technician
    description: "Entity-backed field tech: executes on-site lifecycle and records refrigerant/parts/warranty findings; may only act on visits assigned to self"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "depart/arrive/complete ServiceVisit (self-assigned only)"
      - "post RefrigerantLog / PartUsage"
      - "flag-service/clear-service Equipment"
    shared_operations:
      - "create WarrantyClaim (shared with ContractAdmin)"
      - "GET reads on visits/equipment/sites/refrigerant-logs/part-usages"

  - name: Customer
    description: "Entity-backed member: reads own memberships/sites/visits/offers/claims; cancels own membership; accepts/declines own renewal offers"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "accept/decline RenewalOffer (own membership only)"
    shared_operations:
      - "cancel Membership (shared with ContractAdmin; own membership only)"
      - "GET reads scoped to own customer_id (memberships/sites/visits/offers/claims/plans)"
