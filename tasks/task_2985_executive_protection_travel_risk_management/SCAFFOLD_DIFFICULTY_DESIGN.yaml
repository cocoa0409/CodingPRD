      - name: medevac_triage_gated_on_carried_policy_type_while_shelter_branch_is_not
        grounds:
          - validations[priority=43]
          - validations[priority=40]
          - errors.ERR_INSURANCE_NOT_VERIFIED
          - state_machines.Incident.REPORTED_to_MEDEVAC_ACTIVE
          - state_machines.Incident.REPORTED_to_SHELTER_ACTIVE
