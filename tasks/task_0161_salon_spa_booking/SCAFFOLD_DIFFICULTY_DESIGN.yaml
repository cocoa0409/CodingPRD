              captures: { appt3: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T16:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /appointments/${appt1}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt2}/no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt3}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Client.${cli}.no_show_strikes == 3"
            - "Client.${cli}.status == SUSPENDED"
            - "Appointment.${appt3}.status == NO_SHOW"

      - name: void_reclassifies_appointment_to_noshow_depth2
        grounds:
          - state_machines.Checkout.SETTLED_to_VOIDED
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - entities.Appointment.fields.status
          - entities.Client.fields.no_show_strikes
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (checkout void, not no-show): void -> Checkout.status VOIDED,
          which itself sets Appointment.status COMPLETED -> NO_SHOW, which itself increments Client.no_show_strikes
          0 -> 1. The strike change is caused by the appointment reclassification (prior link), not by the void call.
        test_recipe:
          setup:
            - "Salon (no_show_fee_pct 0.0 so no deposit math noise), one stylist buffer 0, one chair, Service base 6000 deposit 0."
            - "Client with 0 strikes; appointment at 13:00 completed via checkout (no retail); clock at 14:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "Void Salon", no_show_fee_pct: 0.0, no_show_suspend_threshold: 3, tip_split_policy: "DIRECT" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", commission_pct: 0.40, buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
