            - call: "POST /housing-network/grant-applications"
              payload: { cycle_id: "${cyc}", member_id: "${m_old}", program_area: "HOMEOWNERSHIP", requested_formula_cents: 100000, requested_competitive_cents: 0, pledged_match_cents: 50000, expected_cycle_version: "${cyc_v}" }
              as: MemberAdmin
              as_user_id: "${m_old}"
              captures: { app_old: $.data.id }
            - call: "GET /housing-network/grant-cycles/${cyc}"
              payload: {}
              as: GrantOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /housing-network/grant-applications"
              payload: { cycle_id: "${cyc}", member_id: "${m_new}", program_area: "HOMEOWNERSHIP", requested_formula_cents: 100000, requested_competitive_cents: 0, pledged_match_cents: 50000, expected_cycle_version: "${cyc_v2}" }
              as: MemberAdmin
