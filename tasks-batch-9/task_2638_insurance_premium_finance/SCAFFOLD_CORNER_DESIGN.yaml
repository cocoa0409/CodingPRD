            - "${ag_count3} == 3 and ${ag_bal3} == 13491 == 4497 * 3 after three sweeps"
            - "AGGREGATE CAP BINDS on sweep 4: ${ag_r4_marked} == 1 (installment 4 is still marked past due) but ${ag_r4_fees} == 0, because late_fee_count 3 is no longer < max_late_fees_per_agreement 3"
            - "the three existing fees are on distinct installments in assessed_date order: ${ag_f1_num} == 1 and ${ag_f3_num} == 3"
            - "${ag_waived} == 'WAIVED' and ${ag_bal_after_waive} == 8994 == 13491 - 4497, but ${ag_count_after_waive} == 3 — the lifetime counter does not move backwards"
            - "${ag_stage_after_waive} == 'LATE': the waiver does not cure the delinquency because two OUTSTANDING fees and four PAST_DUE installments remain"
            - "CAP SURVIVES THE WAIVER: ${ag_r5_marked} == 1 and ${ag_r5_fees} == 0, so freed balance does not free cap headroom"
            - "${ag_count_final} == 3 and ${ag_bal_final} == 8994; GET /agreements/${ag_agr}/late-fees?status=OUTSTANDING returns total_count == 2 and the whole late-fee collection still returns total_count == 3"
            - "GET /agreements/${ag_agr}/installments?status=PAST_DUE returns total_count == 5 — installments 1 through 5 are all delinquent while only three ever carried a fee"

      - name: conditional_validation_license_required_flag_toggles_the_licensing_gate
        claim_type: conditional_validation
        grounds:
          - validations.priority_22_ERR_STATE_NOT_LICENSED
          - entities.StateRateRule.fields.license_required
          - entities.License.fields.is_effective
        distinguishing_aspect: |
          Priority 22 is guarded by a per-state configuration flag, so the SAME request is legal or
          illegal depending on the rule row it points at. Four legs isolate the flag from the data it
          guards: license_required true with no License at all is refused; adding an effective License
          makes the identical request succeed; license_required false with no License at all succeeds;
          and license_required false with a SUSPENDED License (is_effective false) still succeeds. The
          last leg is the discriminator — an implementation that checks for an effective License
          whenever one exists, rather than checking the flag first, fails only there.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15"
            - "a TX rule with license_required true and, at first, NO License rows"
            - "an AZ rule identical in every other field but with license_required false"
            - "one Insured, one ProducerAgent per state and one Insurer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { cv_tx: "$.data.id", cv_tx_flag: "$.data.license_required" }
            - call: "POST /state-rate-rules"
              payload: { state_code: "AZ", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: false }
              as: ComplianceOfficer
              captures: { cv_az: "$.data.id", cv_az_flag: "$.data.license_required" }
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { cv_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { cv_agent_tx: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Sonoran Brokers", state_code: "AZ", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { cv_agent_az: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
