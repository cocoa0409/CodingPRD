# =============================================================================
# task_2362 — Vehicle Distribution & Port Processing (vehicle processing center)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  2362. Vehicle Distribution & Port Processing (vehicle processing center): vessel discharge scheduling, damage survey on arrival and carrier claim initiation, accessory installation and port-installed option programs with kit inventory, quality inspection, wax removal and preparation to shipping condition, holding yard inventory with aging, damage and blocked-vehicle status, allocation and release to dealers with carrier assignment and delivery routing, recall or stop-ship hold application on units in the yard before release, transportation damage claims and repair authorization thresholds, storage cost and dwell-time metrics by model line

domain_name: vehicle-distribution-port-processing
api_prefix: /vpc

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a top-level collection under /vpc with foreign keys carried in
  # request bodies; no entity is addressed through a nested owner path. Ownership is
  # expressed by FK fields (Vehicle.vessel_id, ReleaseOrder.dealer_id, …), not URLs.

  state_machine_shape: parallel
  # Vehicle carries two independent state dimensions (processing_status ×
  # damage_status). CarrierClaim is cyclic (FILED → DISPUTED → FILED with a
  # revision-round ceiling). RepairOrder is branching fork-join
  # (ESTIMATED → {AUTHORIZED | ESCALATED} → AUTHORIZED → COMPLETED) with divergent
  # side-effect sets per branch. AccessoryWorkOrder is cyclic (INSTALLED → KITTED
  # on inspection failure).

  relationship_patterns:
    - one_to_many          # ProcessingCenter → Vehicle/AccessoryKit/HoldOrder, Vessel → Vehicle
    - self_referential     # ReleaseOrder.superseded_release_order_id -> ReleaseOrder.id
    - cross_aggregate      # ReleaseOrder → Dealer/TruckCarrier; RepairOrder → CarrierClaim
    - polymorphic          # HoldOrder.scope_type selects MODEL_LINE vs SINGLE_VIN targeting

  role_model: segregation_of_duties
  # Two SoD constraints keyed on X-User-ID: (1) the QualityInspector opening an
  # inspection may not be the operator recorded as installed_by_user_id on any
  # INSTALLED AccessoryWorkOrder of that vehicle; (2) the DistributionManager who
  # applied a HoldOrder may not lift it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProcessingCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Processing center name" }
      - { name: port_code, type: string, source: input, description: "Port identifier", constraints: "unique across ProcessingCenter" }
      - { name: yard_capacity_slots, type: integer, source: input, description: "Total holding-yard slots", constraints: ">= 1" }
      - { name: yard_occupied_slots, type: integer, source: computed, description: "count(Vehicle where processing_center_id == this.id AND yard_presence == IN_YARD)" }
      - { name: yard_free_slots, type: integer, source: computed, description: "= yard_capacity_slots - yard_occupied_slots" }
      - { name: yard_posture, type: enum, source: computed, description: "OPEN | CONSTRAINED | GRIDLOCK per calculations.yard_posture", constraints: "OPEN | CONSTRAINED | GRIDLOCK" }
      - { name: free_storage_days, type: integer, source: input, default: 5, description: "Storage days granted free of charge before dwell billing starts" }
      - { name: daily_storage_rate_cents, type: integer, source: input, description: "Storage rate charged per chargeable dwell day per unit" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "Accessory installation labor rate used by calculations.accessory_program_billing" }
      - { name: fuel_surcharge_pct, type: number, source: input, description: "Fuel surcharge applied to base linehaul in calculations.release_freight_settlement", constraints: "0 <= x <= 0.5, 4 decimal places" }
      - { name: provisional_storage_accrued_cents, type: integer, source: computed, description: "sum(Vehicle.storage_charge_provisional_cents) over vehicles of this center with processing_status IN {ALLOCATED, RELEASED}" }
      - { name: realized_storage_revenue_cents, type: integer, source: computed, description: "sum(Vehicle.storage_charge_final_cents) over vehicles of this center with yard_presence == DEPARTED" }
      - { name: repair_spend_cents, type: integer, source: computed, description: "sum(RepairOrder.actual_cost_cents) where RepairOrder.status == COMPLETED for vehicles of this center" }

  - name: Berth
    parent: null
    common_fields: false
    fields:
      - { name: processing_center_id, type: string, source: input, description: "FK -> ProcessingCenter.id; the center owning this berth" }
      - { name: berth_code, type: string, source: input, description: "Berth identifier", constraints: "unique within processing_center_id" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 120, description: "Mandatory idle buffer required between two berth occupations (see calculations.berth_window_conflict)" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: processing_center_id, type: string, source: input, description: "FK -> ProcessingCenter.id; discharge destination" }
      - { name: berth_id, type: string, source: input, description: "FK -> Berth.id; berth reserved for this voyage" }
      - { name: voyage_code, type: string, source: input, description: "Ocean voyage identifier", constraints: "unique within processing_center_id" }
      - { name: carrier_scac, type: string, source: input, description: "Ocean carrier SCAC used as claim respondent" }
      - { name: berth_window_start, type: datetime, source: input, description: "Berth occupation start (inclusive)" }
      - { name: berth_window_end, type: datetime, source: input, description: "Berth occupation end (exclusive)", constraints: "must be strictly after berth_window_start" }
      - { name: declared_unit_count, type: integer, source: input, description: "Units the manifest declares", constraints: ">= 1" }
      - { name: discharged_unit_count, type: integer, source: computed, description: "count(Vehicle where vessel_id == this.id)" }
      - { name: discharge_status, type: enum, source: system, description: "Voyage discharge lifecycle", constraints: "SCHEDULED | DISCHARGING | DISCHARGE_COMPLETE" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: processing_center_id, type: string, source: system, description: "FK -> ProcessingCenter.id; copied from the discharging vessel" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; voyage that discharged this unit" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number", constraints: "exactly 17 characters, unique across Vehicle" }
      - { name: model_line, type: enum, source: input, description: "Model line used by hold scoping and dwell metrics", constraints: "LX500 | TX300 | EV900" }
      - { name: pio_program_code, type: string, source: input, description: "Port-installed-option program this unit belongs to; null when the unit ships base" }
      - { name: yard_presence, type: enum, source: system, default: IN_YARD, description: "Yard occupancy dimension", constraints: "IN_YARD | DEPARTED" }
      - { name: yard_in_at, type: datetime, source: system, description: "Logical-clock instant of discharge; dwell clock origin" }
      - { name: gate_out_at, type: datetime, source: system, description: "Logical-clock instant of gate-out; null until GATED_OUT" }
      - { name: processing_status, type: enum, source: system, description: "Processing dimension (independent of damage_status)", constraints: "DISCHARGED | SURVEYED | ACCESSORY_IN_PROGRESS | INSPECTION_PASSED | SHIPPING_READY | ALLOCATED | RELEASED | GATED_OUT" }
      - { name: damage_status, type: enum, source: system, default: NONE, description: "Damage dimension (independent of processing_status)", constraints: "NONE | SURVEY_DAMAGE_OPEN | REPAIR_AUTHORIZED | REPAIRED" }
      - { name: damage_opened_at, type: datetime, source: system, description: "Instant damage_status left NONE; null when never damaged" }
      - { name: damage_cleared_at, type: datetime, source: system, description: "Instant damage_status became REPAIRED; null while damage is open" }
      - { name: severity_index, type: integer, source: computed, default: 0, description: "Latest SUBMITTED DamageSurvey severity index per calculations.damage_severity_index" }
      - { name: claim_mandatory, type: boolean, source: computed, default: false, description: "= severity_index >= 60; blocks prep-complete until a CarrierClaim exists" }
      - { name: stop_ship_blocked, type: boolean, source: system, default: false, description: "True while an OPEN HoldOrder covers this unit" }
      - { name: blocking_hold_order_id, type: string, source: system, description: "FK -> HoldOrder.id; the OPEN hold that set stop_ship_blocked, null otherwise" }
      - { name: rework_cycle_count, type: integer, source: system, default: 0, description: "Number of times a FAILED quality inspection pushed this unit back to ACCESSORY_IN_PROGRESS" }
      - { name: blocked_credit_days, type: integer, source: computed, default: 0, description: "Whole days between damage_opened_at and damage_cleared_at, credited only by the FINAL storage variant" }
      - { name: storage_charge_provisional_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant of calculations.vehicle_storage_charge, stamped at allocation, reset to 0 when an allocation is undone" }
      - { name: storage_charge_final_cents, type: integer, source: computed, default: 0, description: "FINAL variant of calculations.vehicle_storage_charge, stamped at gate-out" }
      - { name: accessory_billed_cents, type: integer, source: computed, default: 0, description: "sum(AccessoryWorkOrder.billed_cents where vehicle_id == this.id AND status == INSTALLED)" }

  - name: DamageSurvey
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; unit surveyed on arrival" }
      - { name: surveyed_by_user_id, type: string, source: system, description: "X-User-ID of the DamageSurveyor who created the survey" }
      - { name: line_items, type: array, source: input, description: "Damage lines; each { damage_zone: GLASS|BODY_PANEL|INTERIOR|UNDERBODY, severity_points: integer 1..60, repair_estimate_cents: integer >= 0 }", constraints: "at least 1 line item" }
      - { name: line_count, type: integer, source: computed, description: "= length(line_items)" }
      - { name: severity_index, type: integer, source: computed, description: "calculations.damage_severity_index over line_items" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "SURVEY_BASED variant of calculations.carrier_claim_recoverable_amount, gross of deductible" }
      - { name: status, type: enum, source: system, description: "Survey lifecycle", constraints: "DRAFT | SUBMITTED | CLAIMED" }

  - name: CarrierClaim
    parent: null
    common_fields: true
    fields:
      - { name: damage_survey_id, type: string, source: system, description: "FK -> DamageSurvey.id; survey the claim is filed from" }
      - { name: carrier_scac, type: string, source: input, description: "Respondent ocean/inland carrier code" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the DamageSurveyor who filed the claim" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "Capped survey line total, gross of deductible" }
      - { name: recoverable_amount_cents, type: integer, source: computed, description: "calculations.carrier_claim_recoverable_amount result under the active recoverable_basis" }
      - { name: recoverable_basis, type: enum, source: computed, description: "Which variant produced recoverable_amount_cents", constraints: "SURVEY_BASED | REPAIR_ACTUAL" }
      - { name: disputed_amount_cents, type: integer, source: input, description: "Amount the carrier concedes when it disputes; null unless a DISPUTE response was recorded" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Number of completed resubmissions; capped by MAX_CLAIM_REVISIONS" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Amount actually settled; null until SETTLED" }
      - { name: settled_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionManager who settled" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle (cyclic through DISPUTED)", constraints: "FILED | ACCEPTED_PENDING_SETTLEMENT | DISPUTED | DENIED | SETTLED" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; unit being repaired" }
      - { name: carrier_claim_id, type: string, source: input, description: "FK -> CarrierClaim.id; claim this repair is recovered against, null for own-account repairs" }
      - { name: description, type: string, source: input, description: "Repair scope description" }
      - { name: estimate_cents, type: integer, source: input, description: "Estimated repair cost", constraints: ">= 0" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual cost recorded at completion; null before COMPLETED" }
      - { name: authorization_tier, type: enum, source: computed, description: "AUTO when estimate_cents < REPAIR_ESCALATION_THRESHOLD_CENTS, ESCALATED at or above it", constraints: "AUTO | ESCALATED" }
      - { name: estimated_by_user_id, type: string, source: system, description: "X-User-ID of the DamageSurveyor who created the estimate" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID that authorized the repair; the system writes the estimator for AUTO tier" }
      - { name: status, type: enum, source: system, description: "Repair lifecycle (branching fork-join)", constraints: "ESTIMATED | AUTHORIZED | ESCALATED | REJECTED | COMPLETED" }

  - name: AccessoryKit
    parent: null
    common_fields: true
    fields:
      - { name: processing_center_id, type: string, source: system, description: "FK -> ProcessingCenter.id; center holding the kit stock" }
      - { name: kit_code, type: string, source: input, description: "Kit part identifier", constraints: "unique within processing_center_id" }
      - { name: program_code, type: string, source: input, description: "Port-installed-option program the kit belongs to" }
      - { name: received_qty_total, type: integer, source: input, description: "Total kits ever received into this stock record", constraints: ">= 0" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Kits physically present and not yet consumed; initialized to received_qty_total at creation, decremented by qty on install, incremented by qty on void-from-INSTALLED and on inspection-failure reopen" }
      - { name: reserved_qty, type: integer, source: computed, description: "sum(AccessoryWorkOrder.qty where accessory_kit_id == this.id AND status == KITTED)" }
      - { name: available_qty, type: integer, source: computed, description: "= on_hand_qty - reserved_qty" }
      - { name: consumed_qty, type: integer, source: computed, description: "sum(AccessoryWorkOrder.qty where accessory_kit_id == this.id AND status == INSTALLED)" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Kit parts cost per unit before markup" }
      - { name: install_minutes_per_unit, type: integer, source: input, description: "Standard installation minutes per kit unit" }

  - name: AccessoryWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; unit receiving the port-installed option" }
      - { name: accessory_kit_id, type: string, source: input, description: "FK -> AccessoryKit.id; kit consumed by this install" }
      - { name: qty, type: integer, source: input, description: "Kit units required", constraints: ">= 1" }
      - { name: billed_cents, type: integer, source: computed, default: 0, description: "calculations.accessory_program_billing result, stamped at install, reset to 0 on void or reopen" }
      - { name: installed_by_user_id, type: string, source: system, description: "X-User-ID of the AccessoryTechnician who performed the install; null before INSTALLED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Times this work order returned INSTALLED -> KITTED through inspection failure" }
      - { name: status, type: enum, source: system, description: "Work order lifecycle (cyclic through reopen)", constraints: "PLANNED | KITTED | INSTALLED | VOIDED" }

  - name: QualityInspection
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; unit inspected" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the QualityInspector who opened the inspection" }
      - { name: outcome, type: enum, source: input, description: "Recorded at completion; null while OPEN", constraints: "PASS | FAIL" }
      - { name: defect_count, type: integer, source: input, description: "Defects found; recorded at completion", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Inspection lifecycle (branching)", constraints: "OPEN | PASSED | FAILED" }

  - name: HoldOrder
    parent: null
    common_fields: true
    fields:
      - { name: processing_center_id, type: string, source: system, description: "FK -> ProcessingCenter.id; yard the hold applies to" }
      - { name: hold_type, type: enum, source: input, description: "Regulatory reason for the hold", constraints: "RECALL | STOP_SHIP" }
      - { name: scope_type, type: enum, source: input, description: "Targeting mode", constraints: "MODEL_LINE | SINGLE_VIN" }
      - { name: model_line, type: enum, source: input, description: "Model line targeted when scope_type == MODEL_LINE; null otherwise", constraints: "LX500 | TX300 | EV900" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; unit targeted when scope_type == SINGLE_VIN, null otherwise" }
      - { name: reference_code, type: string, source: input, description: "Recall / stop-ship campaign reference" }
      - { name: affected_vehicle_count, type: integer, source: computed, description: "count(Vehicle set to stop_ship_blocked == true by this hold at application time)" }
      - { name: applied_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionManager who applied the hold" }
      - { name: lifted_by_user_id, type: string, source: system, description: "X-User-ID that lifted the hold; must differ from applied_by_user_id" }
      - { name: status, type: enum, source: system, description: "Hold lifecycle", constraints: "OPEN | LIFTED" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Dealer identifier", constraints: "unique across Dealer" }
      - { name: name, type: string, source: input, description: "Dealer name" }
      - { name: route_zone, type: enum, source: input, description: "Delivery routing zone used by carrier eligibility and freight accessorials", constraints: "A | B | C" }
      - { name: distance_miles, type: integer, source: input, description: "Billable linehaul distance from the port", constraints: ">= 1" }
      - { name: allocation_quota, type: integer, source: input, description: "Maximum simultaneously open allocations for this dealer", constraints: ">= 1" }
      - { name: open_allocation_count, type: integer, source: computed, description: "count(ReleaseOrder where dealer_id == this.id AND status IN {ALLOCATED, RELEASED})" }

  - name: TruckCarrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_code, type: string, source: input, description: "Inland truck carrier identifier", constraints: "unique across TruckCarrier" }
      - { name: name, type: string, source: input, description: "Carrier name" }
      - { name: served_route_zones, type: array, source: input, description: "Route zones the carrier serves; non-empty subset of {A, B, C}" }
      - { name: linehaul_rate_cents_per_mile, type: integer, source: input, description: "Linehaul rate; primary ranking key of calculations.carrier_selection" }
      - { name: slot_capacity, type: integer, source: input, description: "Total tractor slots the carrier commits to this port", constraints: ">= 1" }
      - { name: committed_slots, type: integer, source: computed, description: "count(ReleaseOrder where truck_carrier_id == this.id AND status IN {ALLOCATED, RELEASED})" }
      - { name: available_slots, type: integer, source: computed, description: "= slot_capacity - committed_slots" }
      - { name: concurrent_load_capacity, type: integer, source: input, description: "Maximum RELEASED pickup windows that may overlap at any instant", constraints: ">= 1" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "Carrier availability for selection", constraints: "ACTIVE | SUSPENDED" }

  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; allocated unit" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; consignee dealer" }
      - { name: truck_carrier_id, type: string, source: system, description: "FK -> TruckCarrier.id; carrier chosen by calculations.carrier_selection" }
      - { name: superseded_release_order_id, type: string, source: system, description: "FK -> ReleaseOrder.id; prior ALLOCATED order this allocation superseded, null otherwise" }
      - { name: cancelled_by_hold_order_id, type: string, source: system, description: "FK -> HoldOrder.id; hold whose cascade cancelled this order, null otherwise" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Requested carrier pickup window start (inclusive)" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Requested carrier pickup window end (exclusive)", constraints: "must be strictly after pickup_window_start" }
      - { name: route_zone, type: enum, source: computed, description: "Copied from Dealer.route_zone at allocation", constraints: "A | B | C" }
      - { name: base_linehaul_cents, type: integer, source: computed, default: 0, description: "Step 1 of calculations.release_freight_settlement" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, default: 0, description: "Step 2 of calculations.release_freight_settlement" }
      - { name: zone_accessorial_cents, type: integer, source: computed, default: 0, description: "Step 3 of calculations.release_freight_settlement" }
      - { name: gross_freight_cents, type: integer, source: computed, default: 0, description: "Step 4 of calculations.release_freight_settlement; the discount tier key" }
      - { name: freight_discount_cents, type: integer, source: computed, default: 0, description: "Step 6 of calculations.release_freight_settlement" }
      - { name: freight_total_cents, type: integer, source: computed, default: 0, description: "Step 7 of calculations.release_freight_settlement" }
      - { name: allocated_at, type: datetime, source: system, description: "Logical-clock instant of allocation" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock instant of dispatch; null before RELEASED" }
      - { name: gated_out_at, type: datetime, source: system, description: "Logical-clock instant of gate-out; null before GATED_OUT" }
      - { name: status, type: enum, source: system, description: "Release lifecycle", constraints: "ALLOCATED | RELEASED | GATED_OUT | DELIVERED | CANCELLED | CANCELLED_BY_HOLD" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Vessel
    initial_state: SCHEDULED
    terminal_states: [DISCHARGE_COMPLETE]
    transitions:
      - from: SCHEDULED
        to: DISCHARGING
        trigger: "POST /vpc/vessels/{vesselId}/start-discharge"
        actor: PortOperationsPlanner
        preconditions:
          - "logical clock now >= berth_window_start (ERR_BERTH_WINDOW_NOT_OPEN)"
        side_effects:
          - "vessel becomes eligible for unit discharge via POST /vpc/vessels/{vesselId}/vehicles"

      - from: DISCHARGING
        to: DISCHARGE_COMPLETE
        trigger: "POST /vpc/vessels/{vesselId}/complete-discharge"
        actor: PortOperationsPlanner
        preconditions:
          - "discharged_unit_count >= 1 (ERR_NO_UNITS_DISCHARGED)"
        side_effects:
          - "berth occupation released: berth-window conflict checks (calculations.berth_window_conflict) ignore vessels in DISCHARGE_COMPLETE"
          - "every Vehicle of this vessel becomes eligible for POST /vpc/vehicles/{vehicleId}/prep-complete"

  - entity: Vehicle
    dimension: processing_status
    initial_state: DISCHARGED
    terminal_states: [GATED_OUT]
    note: "Dimension 1 of 2 on Vehicle. Evolves independently of damage_status; the two dimensions interact only through the explicit preconditions named below."
    transitions:
      - from: DISCHARGED
        to: SURVEYED
        trigger: "POST /vpc/damage-surveys/{surveyId}/submit"
        actor: DamageSurveyor
        preconditions:
          - "survey.status == DRAFT (ERR_INVALID_STATE)"
          - "vehicle.processing_status == DISCHARGED (ERR_INVALID_STATE)"
        side_effects:
          - "survey.status → SUBMITTED; survey.severity_index and survey.claimed_amount_cents computed"
          - "vehicle.severity_index := survey.severity_index; vehicle.claim_mandatory := (severity_index >= 60)"
          - "if survey.severity_index >= 25: vehicle.damage_status NONE → SURVEY_DAMAGE_OPEN and vehicle.damage_opened_at := logical clock now"

      - from: SURVEYED
        to: ACCESSORY_IN_PROGRESS
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/kit"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == PLANNED (ERR_INVALID_STATE)"
          - "kit.available_qty >= work_order.qty (ERR_KIT_INSUFFICIENT)"
          - "vehicle.processing_status IN {SURVEYED, ACCESSORY_IN_PROGRESS} (ERR_INVALID_STATE)"
        side_effects:
          - "work order → KITTED; kit.reserved_qty recomputed; kit.available_qty recomputed"

      - from: ACCESSORY_IN_PROGRESS
        to: INSPECTION_PASSED
        trigger: "POST /vpc/quality-inspections/{inspectionId}/complete with outcome=PASS"
        actor: QualityInspector
        preconditions:
          - "inspection.status == OPEN (ERR_INVALID_STATE)"
          - "no AccessoryWorkOrder of this vehicle is in status KITTED (ERR_ACCESSORY_WORK_OPEN)"
          - "defect_count == 0 when outcome == PASS (ERR_INVALID_REQUEST)"
        side_effects:
          - "inspection → PASSED"

      - from: SURVEYED
        to: INSPECTION_PASSED
        trigger: "POST /vpc/quality-inspections/{inspectionId}/complete with outcome=PASS"
        actor: QualityInspector
        preconditions:
          - "inspection.status == OPEN (ERR_INVALID_STATE)"
          - "vehicle has zero AccessoryWorkOrder rows (base unit, no port-installed option)"
          - "defect_count == 0 when outcome == PASS (ERR_INVALID_REQUEST)"
        side_effects:
          - "inspection → PASSED"
        note: "Base units skip the accessory stage entirely."

      - from: INSPECTION_PASSED
        to: ACCESSORY_IN_PROGRESS
        trigger: "POST /vpc/quality-inspections/{inspectionId}/complete with outcome=FAIL"
        actor: QualityInspector
        preconditions:
          - "inspection.status == OPEN (ERR_INVALID_STATE)"
          - "defect_count >= 1 when outcome == FAIL (ERR_INVALID_REQUEST)"
        side_effects:
          - "LINK 1: inspection → FAILED"
          - "LINK 2 (caused by LINK 1): vehicle.processing_status INSPECTION_PASSED → ACCESSORY_IN_PROGRESS and vehicle.rework_cycle_count += 1"
          - "LINK 3 (caused by LINK 2): every AccessoryWorkOrder of this vehicle in status INSTALLED → KITTED, reopen_count += 1, billed_cents → 0; processed in created_at ASC order"
          - "LINK 4 (caused by LINK 3): for each reopened work order kit.on_hand_qty += qty; kit.consumed_qty, kit.reserved_qty and kit.available_qty recomputed; vehicle.accessory_billed_cents recomputed"
        note: "Rework cycle — this is the cyclic edge of the processing dimension."

      - from: INSPECTION_PASSED
        to: SHIPPING_READY
        trigger: "POST /vpc/vehicles/{vehicleId}/prep-complete"
        actor: QualityInspector
        preconditions:
          - "vessel.discharge_status == DISCHARGE_COMPLETE (ERR_VESSEL_DISCHARGE_INCOMPLETE)"
          - "vehicle.damage_status IN {NONE, REPAIRED} (ERR_VEHICLE_DAMAGE_BLOCKED)"
          - "vehicle.claim_mandatory == false OR a CarrierClaim exists whose damage_survey_id belongs to this vehicle (ERR_CLAIM_REQUIRED)"
        side_effects:
          - "wax removal and preparation to shipping condition recorded; processing_status → SHIPPING_READY"

      - from: SHIPPING_READY
        to: ALLOCATED
        trigger: "POST /vpc/vehicles/{vehicleId}/allocations"
        actor: DistributionManager
        preconditions:
          - "expected_vehicle_version == vehicle.version (ERR_STALE_VEHICLE_VERSION)"
          - "vehicle.stop_ship_blocked == false (ERR_VEHICLE_STOP_SHIP_BLOCKED)"
          - "dealer.open_allocation_count < dealer.allocation_quota (ERR_DEALER_QUOTA_EXCEEDED)"
          - "calculations.carrier_selection candidate set is non-empty (ERR_NO_ELIGIBLE_CARRIER)"
        side_effects:
          - "ReleaseOrder created in ALLOCATED with truck_carrier_id from calculations.carrier_selection and route_zone copied from dealer.route_zone"
          - "truck_carrier.committed_slots and available_slots recomputed"
          - "dealer.open_allocation_count recomputed"
          - "vehicle.storage_charge_provisional_cents := calculations.vehicle_storage_charge variant PROVISIONAL"
          - "center.provisional_storage_accrued_cents recomputed"
          - "increments Vehicle.version by 1"

      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /vpc/vehicles/{vehicleId}/allocations (re-allocation that supersedes the prior order)"
        actor: DistributionManager
        preconditions:
          - "expected_vehicle_version == vehicle.version (ERR_STALE_VEHICLE_VERSION)"
          - "the existing ReleaseOrder for this vehicle is in status ALLOCATED — a RELEASED order cannot be superseded (ERR_INVALID_STATE)"
          - "vehicle.stop_ship_blocked == false (ERR_VEHICLE_STOP_SHIP_BLOCKED)"
          - "dealer.open_allocation_count < dealer.allocation_quota for the NEW dealer (ERR_DEALER_QUOTA_EXCEEDED)"
        side_effects:
          - "prior ReleaseOrder → CANCELLED; new order's superseded_release_order_id := prior order id"
          - "prior order's carrier committed_slots and prior dealer's open_allocation_count recomputed"
          - "vehicle.storage_charge_provisional_cents recomputed against the new allocation instant"
          - "increments Vehicle.version by 1"
        note: "CREATE-with-supersede — the true race guarded by concurrency_rules.allocation-create-stale-vehicle."

      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /vpc/release-orders/{releaseOrderId}/dispatch"
        actor: DistributionManager
        preconditions:
          - "release order status == ALLOCATED (ERR_INVALID_STATE)"
          - "calculations.carrier_window_capacity_conflict finds no instant where overlapping RELEASED pickup windows would exceed truck_carrier.concurrent_load_capacity (ERR_CARRIER_WINDOW_CAPACITY)"
        side_effects:
          - "release order → RELEASED; dispatched_at := logical clock now"
          - "calculations.release_freight_settlement stamps base_linehaul_cents, fuel_surcharge_cents, zone_accessorial_cents, gross_freight_cents, freight_discount_cents, freight_total_cents"

      - from: RELEASED
        to: GATED_OUT
        trigger: "POST /vpc/release-orders/{releaseOrderId}/gate-out"
        actor: DistributionManager
        preconditions:
          - "release order status == RELEASED (ERR_INVALID_STATE)"
          - "no HoldOrder with status OPEN covers this unit (ERR_VEHICLE_STOP_SHIP_BLOCKED)"
        side_effects:
          - "release order → GATED_OUT; gated_out_at := logical clock now"
          - "vehicle.yard_presence → DEPARTED; vehicle.gate_out_at := logical clock now"
          - "vehicle.storage_charge_final_cents := calculations.vehicle_storage_charge variant FINAL; storage_charge_provisional_cents → 0"
          - "center.realized_storage_revenue_cents and provisional_storage_accrued_cents recomputed"
          - "center.yard_occupied_slots, yard_free_slots and yard_posture recomputed"

      - from: ALLOCATED
        to: SHIPPING_READY
        trigger: "POST /vpc/release-orders/{releaseOrderId}/cancel, or the HoldOrder application cascade"
        actor: DistributionManager | system
        preconditions:
          - "release order status == ALLOCATED (ERR_INVALID_STATE)"
        side_effects:
          - "release order → CANCELLED (manual) or CANCELLED_BY_HOLD (cascade, with cancelled_by_hold_order_id set)"
          - "truck_carrier.committed_slots and available_slots recomputed"
          - "dealer.open_allocation_count recomputed"
          - "vehicle.storage_charge_provisional_cents → 0; center.provisional_storage_accrued_cents recomputed"

      - from: RELEASED
        to: SHIPPING_READY
        trigger: "POST /vpc/release-orders/{releaseOrderId}/cancel"
        actor: DistributionManager
        preconditions:
          - "release order status == RELEASED (ERR_INVALID_STATE)"
        side_effects:
          - "release order → CANCELLED. A hold cascade never cancels a RELEASED order: the unit is frozen instead (gate-out rejected with ERR_VEHICLE_STOP_SHIP_BLOCKED until the hold is lifted)"
          - "truck_carrier.committed_slots and available_slots recomputed; the pickup window stops occupying concurrent_load_capacity"
          - "dealer.open_allocation_count recomputed"
          - "vehicle.storage_charge_provisional_cents → 0; center.provisional_storage_accrued_cents recomputed"

  - entity: Vehicle
    dimension: damage_status
    initial_state: NONE
    terminal_states: []
    note: "Dimension 2 of 2 on Vehicle. A unit may sit in any processing_status while this dimension advances; only prep-complete and allocation read it."
    transitions:
      - from: NONE
        to: SURVEY_DAMAGE_OPEN
        trigger: "POST /vpc/damage-surveys/{surveyId}/submit with severity_index >= 25"
        actor: DamageSurveyor
        preconditions:
          - "survey.severity_index >= 25 (below 25 the unit stays NONE — cosmetic only)"
        side_effects:
          - "vehicle.damage_opened_at := logical clock now"

      - from: SURVEY_DAMAGE_OPEN
        to: REPAIR_AUTHORIZED
        trigger: "system, when a RepairOrder for this vehicle reaches AUTHORIZED (either AUTO at creation or via POST /vpc/repair-orders/{repairOrderId}/authorize)"
        actor: system
        preconditions:
          - "repair order status becomes AUTHORIZED"
        side_effects: []

      - from: REPAIR_AUTHORIZED
        to: REPAIRED
        trigger: "POST /vpc/repair-orders/{repairOrderId}/complete"
        actor: DamageSurveyor
        preconditions:
          - "repair order status == AUTHORIZED (ERR_INVALID_STATE)"
        side_effects:
          - "vehicle.damage_cleared_at := logical clock now; vehicle.blocked_credit_days recomputed"
          - "center.repair_spend_cents recomputed"
          - "if the repair order has carrier_claim_id and that claim's status IN {FILED, ACCEPTED_PENDING_SETTLEMENT, DISPUTED}: claim.recoverable_basis → REPAIR_ACTUAL and claim.recoverable_amount_cents recomputed under that variant"

  - entity: DamageSurvey
    initial_state: DRAFT
    terminal_states: [CLAIMED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vpc/damage-surveys/{surveyId}/submit"
        actor: DamageSurveyor
        preconditions:
          - "vehicle.processing_status == DISCHARGED (ERR_INVALID_STATE)"
        side_effects:
          - "severity_index, line_count and claimed_amount_cents computed; vehicle damage dimension advanced per the Vehicle damage_status machine"

      - from: SUBMITTED
        to: CLAIMED
        trigger: "POST /vpc/damage-surveys/{surveyId}/claims"
        actor: DamageSurveyor
        preconditions:
          - "expected_damage_survey_version == survey.version (ERR_STALE_SURVEY_VERSION)"
          - "survey.severity_index >= 25 (ERR_CLAIM_NOT_WARRANTED)"
          - "no CarrierClaim for this survey is in status IN {FILED, ACCEPTED_PENDING_SETTLEMENT, DISPUTED, SETTLED} (ERR_CLAIM_ALREADY_OPEN)"
        side_effects:
          - "CarrierClaim created in FILED with claimed_amount_cents and recoverable_amount_cents from the SURVEY_BASED variant"
          - "increments DamageSurvey.version by 1"
        note: "A survey already in CLAIMED accepts a re-file only when every prior claim is DENIED — see concurrency_rules.claim-create-stale-survey."

      - from: CLAIMED
        to: CLAIMED
        trigger: "POST /vpc/damage-surveys/{surveyId}/claims (re-file superseding a DENIED claim)"
        actor: DamageSurveyor
        preconditions:
          - "expected_damage_survey_version == survey.version (ERR_STALE_SURVEY_VERSION)"
          - "every existing CarrierClaim for this survey has status DENIED (ERR_CLAIM_ALREADY_OPEN)"
        side_effects:
          - "new CarrierClaim created in FILED; the DENIED predecessors are left untouched"
          - "increments DamageSurvey.version by 1"

  - entity: CarrierClaim
    initial_state: FILED
    terminal_states: [DENIED, SETTLED]
    note: "Cyclic: FILED → DISPUTED → FILED, bounded by MAX_CLAIM_REVISIONS."
    transitions:
      - from: FILED
        to: ACCEPTED_PENDING_SETTLEMENT
        trigger: "POST /vpc/carrier-claims/{claimId}/carrier-response with outcome=ACCEPT"
        actor: DistributionManager
        preconditions:
          - "claim.status == FILED (ERR_INVALID_STATE)"
        side_effects: []

      - from: FILED
        to: DISPUTED
        trigger: "POST /vpc/carrier-claims/{claimId}/carrier-response with outcome=DISPUTE"
        actor: DistributionManager
        preconditions:
          - "claim.status == FILED (ERR_INVALID_STATE)"
          - "disputed_amount_cents present and 0 <= disputed_amount_cents < claim.claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "claim.disputed_amount_cents recorded"

      - from: FILED
        to: DENIED
        trigger: "POST /vpc/carrier-claims/{claimId}/carrier-response with outcome=DENY"
        actor: DistributionManager
        preconditions:
          - "claim.status == FILED (ERR_INVALID_STATE)"
        side_effects:
          - "the survey may be re-filed against per the DamageSurvey CLAIMED → CLAIMED transition"

      - from: DISPUTED
        to: FILED
        trigger: "POST /vpc/carrier-claims/{claimId}/resubmit"
        actor: DamageSurveyor
        preconditions:
          - "claim.status == DISPUTED (ERR_INVALID_STATE)"
          - "claim.revision_round < MAX_CLAIM_REVISIONS (ERR_CLAIM_REVISION_LIMIT)"
          - "revised_claim_amount_cents <= claim.claimed_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "claim.revision_round += 1; claim.claimed_amount_cents := revised_claim_amount_cents; claim.disputed_amount_cents → null"
          - "claim.recoverable_amount_cents recomputed under the claim's current recoverable_basis"

      - from: ACCEPTED_PENDING_SETTLEMENT
        to: SETTLED
        trigger: "POST /vpc/carrier-claims/{claimId}/settle"
        actor: DistributionManager
        preconditions:
          - "claim.status == ACCEPTED_PENDING_SETTLEMENT (ERR_INVALID_STATE)"
          - "X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "settled_amount_cents <= claim.recoverable_amount_cents (ERR_SETTLEMENT_EXCEEDS_RECOVERABLE)"
        side_effects:
          - "claim.settled_amount_cents and settled_by_user_id recorded"

  - entity: RepairOrder
    initial_state: ESTIMATED
    terminal_states: [COMPLETED, REJECTED]
    note: "Branching fork-join: ESTIMATED forks on calculations.repair_authorization_tier into AUTHORIZED or ESCALATED with divergent side-effect sets, and ESCALATED rejoins at AUTHORIZED."
    transitions:
      - from: ESTIMATED
        to: AUTHORIZED
        trigger: "system, at POST /vpc/vehicles/{vehicleId}/repair-orders when estimate_cents < REPAIR_ESCALATION_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "authorization_tier == AUTO"
        side_effects:
          - "authorized_by_user_id := estimated_by_user_id"
          - "vehicle.damage_status SURVEY_DAMAGE_OPEN → REPAIR_AUTHORIZED"

      - from: ESTIMATED
        to: ESCALATED
        trigger: "system, at POST /vpc/vehicles/{vehicleId}/repair-orders when estimate_cents >= REPAIR_ESCALATION_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "authorization_tier == ESCALATED"
        side_effects:
          - "authorized_by_user_id stays null; vehicle.damage_status is NOT advanced — this is the branch-divergent side-effect set"

      - from: ESCALATED
        to: AUTHORIZED
        trigger: "POST /vpc/repair-orders/{repairOrderId}/authorize with decision=AUTHORIZE"
        actor: DistributionManager
        preconditions:
          - "repair order status == ESCALATED (ERR_INVALID_STATE)"
          - "a CarrierClaim whose damage_survey_id belongs to this vehicle has status IN {FILED, ACCEPTED_PENDING_SETTLEMENT, DISPUTED} (ERR_CLAIM_REQUIRED)"
        side_effects:
          - "authorized_by_user_id := X-User-ID"
          - "vehicle.damage_status SURVEY_DAMAGE_OPEN → REPAIR_AUTHORIZED"

      - from: ESCALATED
        to: REJECTED
        trigger: "POST /vpc/repair-orders/{repairOrderId}/authorize with decision=REJECT"
        actor: DistributionManager
        preconditions:
          - "repair order status == ESCALATED (ERR_INVALID_STATE)"
        side_effects:
          - "vehicle.damage_status stays SURVEY_DAMAGE_OPEN, so the unit remains damage-blocked for allocation"

      - from: AUTHORIZED
        to: COMPLETED
        trigger: "POST /vpc/repair-orders/{repairOrderId}/complete"
        actor: DamageSurveyor
        preconditions:
          - "repair order status == AUTHORIZED (ERR_INVALID_STATE)"
          - "actual_cost_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "vehicle.damage_status REPAIR_AUTHORIZED → REPAIRED; damage_cleared_at stamped; blocked_credit_days recomputed"
          - "center.repair_spend_cents recomputed"
          - "if carrier_claim_id is set and that claim is not terminal: claim.recoverable_basis → REPAIR_ACTUAL and recoverable_amount_cents recomputed"

  - entity: AccessoryWorkOrder
    initial_state: PLANNED
    terminal_states: [VOIDED]
    note: "Cyclic through INSTALLED → KITTED on quality-inspection failure."
    transitions:
      - from: PLANNED
        to: KITTED
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/kit"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == PLANNED (ERR_INVALID_STATE)"
          - "kit.available_qty >= qty (ERR_KIT_INSUFFICIENT)"
        side_effects:
          - "kit.reserved_qty and kit.available_qty recomputed"
          - "vehicle.processing_status SURVEYED → ACCESSORY_IN_PROGRESS on the first kitted work order"

      - from: KITTED
        to: INSTALLED
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/install"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == KITTED (ERR_INVALID_STATE)"
          - "vehicle.processing_status == ACCESSORY_IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "kit.on_hand_qty -= qty; kit.consumed_qty, reserved_qty and available_qty recomputed"
          - "billed_cents := calculations.accessory_program_billing; installed_by_user_id := X-User-ID"
          - "vehicle.accessory_billed_cents recomputed"

      - from: INSTALLED
        to: KITTED
        trigger: "system, from the POST /vpc/quality-inspections/{inspectionId}/complete outcome=FAIL cascade"
        actor: system
        preconditions:
          - "the owning vehicle re-entered ACCESSORY_IN_PROGRESS in the same request"
        side_effects:
          - "reopen_count += 1; billed_cents → 0; installed_by_user_id retained for the segregation-of-duties check"
          - "kit.on_hand_qty += qty; kit.consumed_qty, reserved_qty and available_qty recomputed"

      - from: PLANNED
        to: VOIDED
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/void"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []

      - from: KITTED
        to: VOIDED
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/void"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == KITTED (ERR_INVALID_STATE)"
        side_effects:
          - "kit.reserved_qty and available_qty recomputed (reservation released)"

      - from: INSTALLED
        to: VOIDED
        trigger: "POST /vpc/accessory-work-orders/{workOrderId}/void"
        actor: AccessoryTechnician
        preconditions:
          - "work order status == INSTALLED (ERR_INVALID_STATE)"
          - "vehicle.processing_status IN {ACCESSORY_IN_PROGRESS, INSPECTION_PASSED} (ERR_INVALID_STATE)"
        side_effects:
          - "kit.on_hand_qty += qty; consumed_qty, reserved_qty and available_qty recomputed — the compensating half of the install"
          - "billed_cents → 0; vehicle.accessory_billed_cents recomputed"

  - entity: QualityInspection
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /vpc/quality-inspections/{inspectionId}/complete with outcome=PASS"
        actor: QualityInspector
        preconditions:
          - "defect_count == 0 (ERR_INVALID_REQUEST)"
          - "no AccessoryWorkOrder of the vehicle is in status KITTED (ERR_ACCESSORY_WORK_OPEN)"
        side_effects:
          - "vehicle.processing_status → INSPECTION_PASSED"

      - from: OPEN
        to: FAILED
        trigger: "POST /vpc/quality-inspections/{inspectionId}/complete with outcome=FAIL"
        actor: QualityInspector
        preconditions:
          - "defect_count >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "the rework cascade documented on Vehicle.INSPECTION_PASSED_to_ACCESSORY_IN_PROGRESS fires when the vehicle was INSPECTION_PASSED"
          - "when the vehicle was still ACCESSORY_IN_PROGRESS the processing dimension does not move, but rework_cycle_count += 1 and INSTALLED work orders are still reopened"

  - entity: HoldOrder
    initial_state: OPEN
    terminal_states: [LIFTED]
    transitions:
      - from: OPEN
        to: LIFTED
        trigger: "POST /vpc/hold-orders/{holdOrderId}/lift"
        actor: DistributionManager
        preconditions:
          - "hold status == OPEN (ERR_INVALID_STATE)"
          - "X-User-ID != applied_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "for every Vehicle whose blocking_hold_order_id == this hold: if no other OPEN HoldOrder covers the unit, stop_ship_blocked → false and blocking_hold_order_id → null; otherwise blocking_hold_order_id is repointed to the remaining OPEN hold with the earliest created_at"
          - "release orders already CANCELLED_BY_HOLD are NOT restored — re-allocation is required"

  - entity: ReleaseOrder
    initial_state: ALLOCATED
    terminal_states: [DELIVERED, CANCELLED, CANCELLED_BY_HOLD]
    transitions:
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /vpc/release-orders/{releaseOrderId}/dispatch"
        actor: DistributionManager
        preconditions:
          - "calculations.carrier_window_capacity_conflict passes (ERR_CARRIER_WINDOW_CAPACITY)"
        side_effects:
          - "freight settlement fields stamped; dispatched_at stamped; vehicle.processing_status ALLOCATED → RELEASED"

      - from: RELEASED
        to: GATED_OUT
        trigger: "POST /vpc/release-orders/{releaseOrderId}/gate-out"
        actor: DistributionManager
        preconditions:
          - "no OPEN HoldOrder covers the unit (ERR_VEHICLE_STOP_SHIP_BLOCKED)"
        side_effects:
          - "vehicle gate-out side effects per Vehicle.RELEASED_to_GATED_OUT"

      - from: GATED_OUT
        to: DELIVERED
        trigger: "POST /vpc/release-orders/{releaseOrderId}/delivery-confirmation"
        actor: Dealer
        preconditions:
          - "release order status == GATED_OUT (ERR_INVALID_STATE)"
          - "X-User-ID == release_order.dealer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "delivery acknowledged; no yard or carrier field changes"

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /vpc/release-orders/{releaseOrderId}/cancel, or supersede by a new allocation"
        actor: DistributionManager
        preconditions:
          - "release order status == ALLOCATED (ERR_INVALID_STATE)"
        side_effects:
          - "carrier slot and dealer allocation count released; vehicle reverts to SHIPPING_READY; provisional storage accrual reversed"

      - from: RELEASED
        to: CANCELLED
        trigger: "POST /vpc/release-orders/{releaseOrderId}/cancel"
        actor: DistributionManager
        preconditions:
          - "release order status == RELEASED (ERR_INVALID_STATE)"
        side_effects:
          - "carrier slot released and the pickup window stops consuming concurrent_load_capacity; vehicle reverts to SHIPPING_READY"

      - from: ALLOCATED
        to: CANCELLED_BY_HOLD
        trigger: "system, from the POST /vpc/processing-centers/{centerId}/hold-orders cascade"
        actor: system
        preconditions:
          - "the owning vehicle had stop_ship_blocked flipped to true in the same request"
        side_effects:
          - "cancelled_by_hold_order_id set; carrier slot and dealer count released; vehicle reverts to SHIPPING_READY; provisional storage accrual reversed"


# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /vpc/vehicles/{vehicleId}/allocations"
    occ_field: "expected_vehicle_version"
    description: |
      Allocating a Vehicle whose version has advanced since the client last read it
      is rejected. This captures the case where a prior allocation already exists and
      legitimately supersedes (dealer swap per Vehicle.ALLOCATED_to_ALLOCATED), so the
      current writer's view of the unit — its allocation, provisional storage accrual
      and carrier commitment — is stale.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

  - rule_id: claim-create-stale-survey
    parent_entity: DamageSurvey
    write_endpoint: "POST /vpc/damage-surveys/{surveyId}/claims"
    occ_field: "expected_damage_survey_version"
    description: |
      Filing a CarrierClaim against a DamageSurvey whose version has advanced since the
      client last read it is rejected. A re-file after denial legitimately supersedes the
      DENIED predecessor (DamageSurvey.CLAIMED_to_CLAIMED), so a writer holding an older
      survey version is reasoning about a claim history that has already changed.
    error_id: ERR_STALE_SURVEY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: yard_posture
    trigger: "any change to ProcessingCenter.yard_occupied_slots (unit discharge, gate-out)"
    algorithm: threshold
    formula: |
      yard_occupied_slots = count(Vehicle where processing_center_id == center.id AND yard_presence == IN_YARD)
      yard_free_slots     = yard_capacity_slots - yard_occupied_slots
      occupancy_ratio     = yard_occupied_slots / yard_capacity_slots      # exact rational, no rounding
      if occupancy_ratio >= 0.95:  yard_posture = GRIDLOCK
      elif occupancy_ratio >= 0.80: yard_posture = CONSTRAINED
      else:                         yard_posture = OPEN
    input_set: "Vehicles of this center with yard_presence == IN_YARD; DEPARTED units are excluded the instant gate-out completes"
    constants:
      GRIDLOCK_RATIO: 0.95
      CONSTRAINED_RATIO: 0.80
    precision: "occupancy_ratio compared as an exact rational (occupied * 100 vs capacity * ratio_pct); no intermediate rounding"

  - name: damage_severity_index
    trigger: "POST /vpc/damage-surveys/{surveyId}/submit"
    algorithm: weighted_scoring
    formula: |
      # Mode (a) combinatorial: three inputs (per-line severity points, per-line zone
      # weight, line count) interacting non-linearly through max() then a cap.
      weighted_i   = line_items[i].severity_points * ZONE_WEIGHT[line_items[i].damage_zone]
      peak         = round_half_up(max over i of weighted_i)        # round AFTER taking the max
      breadth      = SPREAD_POINTS_PER_EXTRA_LINE * (line_count - 1)
      severity_index = min(SEVERITY_CAP, peak + breadth)
      # Consequences:
      #   severity_index >= 60 -> vehicle.claim_mandatory = true, damage_status -> SURVEY_DAMAGE_OPEN
      #   25 <= severity_index < 60 -> damage_status -> SURVEY_DAMAGE_OPEN, claim optional
      #   severity_index < 25 -> damage_status stays NONE (cosmetic)
    input_set: "All line_items of the survey being submitted; no other survey contributes"
    constants:
      ZONE_WEIGHT: { GLASS: 1.5, BODY_PANEL: 1.2, INTERIOR: 1.0, UNDERBODY: 1.8 }
      SPREAD_POINTS_PER_EXTRA_LINE: 5
      SEVERITY_CAP: 100
      CLAIM_MANDATORY_THRESHOLD: 60
      DAMAGE_OPEN_THRESHOLD: 25
    precision: "integer severity_index; round_half_up applied once, to peak, before breadth is added"

  - name: carrier_claim_recoverable_amount
    trigger: "POST /vpc/damage-surveys/{surveyId}/claims (SURVEY_BASED); POST /vpc/repair-orders/{repairOrderId}/complete when the repair carries carrier_claim_id (REPAIR_ACTUAL); POST /vpc/carrier-claims/{claimId}/resubmit (recomputed under the claim's current basis)"
    algorithm: aggregation
    formula: |
      capped_line_total = sum over survey.line_items of min(line.repair_estimate_cents, PER_ITEM_CAP_CENTS)
      claimed_amount_cents = capped_line_total                       # gross of deductible
      # variant-specific recoverable, see variants below
      recoverable_amount_cents = max(0, basis_amount_cents - CLAIM_DEDUCTIBLE_CENTS)
    input_set: "Every line_item of the claim's DamageSurvey for SURVEY_BASED; for REPAIR_ACTUAL, RepairOrder rows with carrier_claim_id == claim.id AND status == COMPLETED"
    constants:
      PER_ITEM_CAP_CENTS: 80000
      CLAIM_DEDUCTIBLE_CENTS: 25000
      MAX_CLAIM_REVISIONS: 3
    precision: "integer cents; no rounding — all inputs are integer cents"
    variants:
      - name: SURVEY_BASED
        when: "At filing (claim.recoverable_basis == SURVEY_BASED) and on every resubmit while the basis is still SURVEY_BASED"
        difference: "basis_amount_cents = claimed_amount_cents (capped survey estimates). Uses estimated repair cost, so it recovers the surveyor's projection."
      - name: REPAIR_ACTUAL
        when: "The moment a RepairOrder carrying carrier_claim_id reaches COMPLETED while the claim is non-terminal; the basis latches to REPAIR_ACTUAL and never reverts"
        difference: "basis_amount_cents = min(claimed_amount_cents, sum(RepairOrder.actual_cost_cents where carrier_claim_id == claim.id AND status == COMPLETED)). Identical survey data yields a different recoverable whenever actual cost differs from the capped estimate."

  - name: repair_authorization_tier
    trigger: "POST /vpc/vehicles/{vehicleId}/repair-orders"
    algorithm: threshold
    formula: |
      if estimate_cents >= REPAIR_ESCALATION_THRESHOLD_CENTS:
        authorization_tier = ESCALATED   # status -> ESCALATED, vehicle damage dimension NOT advanced
      else:
        authorization_tier = AUTO        # status -> AUTHORIZED, vehicle damage_status -> REPAIR_AUTHORIZED
    input_set: "The single estimate_cents supplied on creation; prior repair orders on the same vehicle do not aggregate into the tier decision"
    constants:
      REPAIR_ESCALATION_THRESHOLD_CENTS: 150000
    precision: "integer cents; the comparison is inclusive at the threshold (>=)"

  - name: accessory_program_billing
    trigger: "POST /vpc/accessory-work-orders/{workOrderId}/install"
    algorithm: tiered_pricing
    formula: |
      # Mode (b) combinatorial: nested rounding whose ORDER is pinned. Each per-unit
      # component is rounded to whole cents FIRST, then multiplied by qty. Summing the
      # unrounded per-unit components (or multiplying before rounding) produces a
      # different cent total and is WRONG.
      parts_per_unit_cents = round_half_up(kit.unit_cost_cents * (1 + PARTS_MARKUP_PCT))
      labor_per_unit_cents = round_half_up(kit.install_minutes_per_unit * center.labor_rate_cents_per_hour / 60)
      billed_cents         = (parts_per_unit_cents + labor_per_unit_cents) * work_order.qty
    input_set: "The work order's own kit and qty plus the center's labor rate at install time; reopened work orders recompute from scratch on the next install"
    constants:
      PARTS_MARKUP_PCT: 0.125
    precision: "round_half_up to whole cents applied twice — once per per-unit component — and never again after multiplying by qty"

  - name: vehicle_storage_charge
    trigger: "POST /vpc/vehicles/{vehicleId}/allocations (PROVISIONAL); POST /vpc/release-orders/{releaseOrderId}/gate-out (FINAL)"
    algorithm: chronological
    formula: |
      dwell_days  = max(1, ceil((end_instant - vehicle.yard_in_at) / 86400 seconds))
      charge_cents = max(0, dwell_days - center.free_storage_days - credit_days) * center.daily_storage_rate_cents
    input_set: "One vehicle; the dwell interval runs from yard_in_at (discharge) to the variant's end_instant. Units whose yard_presence is already DEPARTED are never recharged."
    constants:
      PROJECTED_DISPATCH_LAG_DAYS: 2
    precision: "integer cents; dwell_days uses ceil over whole 86400-second days, floor of 1 day"
    variants:
      - name: PROVISIONAL
        when: "Stamped at allocation into Vehicle.storage_charge_provisional_cents"
        difference: "end_instant = allocation instant + PROJECTED_DISPATCH_LAG_DAYS days (forward-looking projection) and credit_days = 0 — damage-open days are NOT credited because the projection cannot know whether the carrier concedes."
      - name: FINAL
        when: "Stamped at gate-out into Vehicle.storage_charge_final_cents; storage_charge_provisional_cents is reset to 0"
        difference: "end_instant = the gate-out instant (actual) and credit_days = vehicle.blocked_credit_days = floor((damage_cleared_at - damage_opened_at) / 86400) when both are non-null else 0. Same yard_in_at and same rate therefore yield a different amount than PROVISIONAL."

  - name: release_freight_settlement
    trigger: "POST /vpc/release-orders/{releaseOrderId}/dispatch"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c) combinatorial: the discount looks circular (total depends on discount,
      # discount tier depends on total). The evaluation order below is normative; the
      # tier key is gross_freight_cents from step 4, NEVER freight_total_cents.
      step 1: base_linehaul_cents   = round_half_up(dealer.distance_miles * carrier.linehaul_rate_cents_per_mile)
      step 2: fuel_surcharge_cents  = round_half_up(base_linehaul_cents * center.fuel_surcharge_pct)   # on base only
      step 3: zone_accessorial_cents = ZONE_ACCESSORIAL_CENTS[release_order.route_zone]
      step 4: gross_freight_cents   = base_linehaul_cents + fuel_surcharge_cents + zone_accessorial_cents
      step 5: discount_pct = 0.06 if gross_freight_cents >= DISCOUNT_TIER2_CENTS
                             else 0.03 if gross_freight_cents >= DISCOUNT_TIER1_CENTS
                             else 0.00
      step 6: freight_discount_cents = round_half_up(gross_freight_cents * discount_pct)
      step 7: freight_total_cents    = gross_freight_cents - freight_discount_cents
    input_set: "One release order: its dealer's distance_miles and route_zone, its selected carrier's rate, and the center's fuel_surcharge_pct read at dispatch time"
    constants:
      ZONE_ACCESSORIAL_CENTS: { A: 0, B: 4500, C: 9800 }
      DISCOUNT_TIER1_CENTS: 60000
      DISCOUNT_TIER2_CENTS: 120000
      TIER1_PCT: 0.03
      TIER2_PCT: 0.06
    precision: "round_half_up to whole cents at steps 1, 2 and 6; steps 4 and 7 are exact integer arithmetic. Tier comparisons are inclusive (>=)."

  - name: carrier_selection
    trigger: "POST /vpc/vehicles/{vehicleId}/allocations — the server picks the carrier, the client never supplies one"
    algorithm: constraint_propagation
    formula: |
      candidates = TruckCarrier rows where
          status == ACTIVE
          AND release_order.route_zone (== dealer.route_zone) IN served_route_zones
          AND (slot_capacity - committed_slots) >= 1
      rank by: linehaul_rate_cents_per_mile ASC
      tie-break 1: (slot_capacity - committed_slots) DESC
      tie-break 2: created_at ASC
      if candidates is empty: reject the allocation with ERR_NO_ELIGIBLE_CARRIER
    input_set: "All TruckCarrier rows; the eligibility filter is the explicit predicate above (status ACTIVE only, zone membership, at least one free slot)"
    precision: "integer comparison on rates and slots; created_at compared at millisecond precision. Entity `id` is never a decision input."

  - name: berth_window_conflict
    trigger: "POST /vpc/vessels"
    algorithm: interval_merge
    formula: |
      # Interval semantics A: EXCLUSIVE occupancy of one berth, half-open [start, end),
      # plus a mandatory turnaround buffer on BOTH sides. Adjacency is NOT allowed —
      # a new window must clear the neighbour by at least the buffer.
      buffer = berth.turnaround_buffer_minutes minutes
      conflict = exists Vessel v where
          v.berth_id == new.berth_id
          AND v.discharge_status IN {SCHEDULED, DISCHARGING}
          AND new.berth_window_start < (v.berth_window_end + buffer)
          AND v.berth_window_start < (new.berth_window_end + buffer)
      if conflict: reject with ERR_BERTH_WINDOW_CONFLICT
    input_set: "Vessels on the same berth_id whose discharge_status IN {SCHEDULED, DISCHARGING}; DISCHARGE_COMPLETE voyages release the berth and are excluded"
    precision: "instant comparison at second precision; the buffer is added to the neighbour's end and to the new window's end symmetrically"

  - name: carrier_window_capacity_conflict
    trigger: "POST /vpc/release-orders/{releaseOrderId}/dispatch"
    algorithm: interval_merge
    formula: |
      # Interval semantics B: AGGREGATE capacity on the carrier, half-open [start, end),
      # zero buffer, adjacency explicitly allowed (end == start does not overlap).
      # Rejection happens only when the count of simultaneously occupied windows would
      # exceed concurrent_load_capacity at some instant.
      peers = ReleaseOrder rows where truck_carrier_id == this.truck_carrier_id
              AND status == RELEASED AND id != this.id
      overlap(a, b) = a.pickup_window_start < b.pickup_window_end
                      AND b.pickup_window_start < a.pickup_window_end
      max_concurrent = max over every peer window boundary instant t in
                       [this.pickup_window_start, this.pickup_window_end) of
                       1 + count(p in peers where p occupies t)
      if max_concurrent > carrier.concurrent_load_capacity: reject with ERR_CARRIER_WINDOW_CAPACITY
    input_set: "Release orders of the same carrier in status RELEASED only; ALLOCATED, CANCELLED, CANCELLED_BY_HOLD, GATED_OUT and DELIVERED windows do not occupy capacity"
    precision: "half-open interval arithmetic at second precision; boundary instants evaluated at each peer window start inside the candidate window"

  - name: dwell_time_metrics_by_model_line
    trigger: "GET /vpc/processing-centers/{centerId}/dwell-metrics"
    algorithm: aggregation
    formula: |
      for each model_line in {LX500, TX300, EV900}, over Vehicle rows where
          processing_center_id == center.id AND yard_presence == IN_YARD:
        unit_count            = count(rows)
        dwell_days_i          = max(1, ceil((clock_now - row.yard_in_at) / 86400))
        avg_dwell_days        = round_half_up(sum(dwell_days_i) / unit_count, 1)     # 1 decimal
        aging_0_15            = count(rows where dwell_days_i <= 15)
        aging_16_30           = count(rows where 16 <= dwell_days_i <= 30)
        aging_31_plus         = count(rows where dwell_days_i >= 31)
        blocked_count         = count(rows where stop_ship_blocked == true OR damage_status IN {SURVEY_DAMAGE_OPEN, REPAIR_AUTHORIZED})
        accrued_storage_cents = sum(row.storage_charge_provisional_cents)
      rows are emitted sorted by model_line ASC; a model_line with unit_count == 0 is emitted
      with unit_count 0, avg_dwell_days 0.0 and all counters 0
    input_set: "IN_YARD vehicles of the named center only; DEPARTED units are excluded, so realized storage revenue is never double counted here"
    precision: "avg_dwell_days rounded half-up to 1 decimal; all other fields integers"

  - name: kit_inventory_reconciliation
    trigger: "every AccessoryWorkOrder transition (kit, install, void, inspection-failure reopen)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: physical kit units.
      INVARIANT K: kit.on_hand_qty + kit.consumed_qty == kit.received_qty_total
      kit.consumed_qty = sum(AccessoryWorkOrder.qty where accessory_kit_id == kit.id AND status == INSTALLED)
      kit.reserved_qty = sum(AccessoryWorkOrder.qty where accessory_kit_id == kit.id AND status == KITTED)
      kit.available_qty = kit.on_hand_qty - kit.reserved_qty
    input_set: "AccessoryWorkOrder rows of this kit in status KITTED (reserved) and INSTALLED (consumed); PLANNED and VOIDED rows contribute nothing"
    precision: "integer units; INVARIANT K must hold after every request, including the compensating void and the inspection-failure reopen"

  - name: carrier_slot_reconciliation
    trigger: "every ReleaseOrder transition (allocation, supersede, cancel, hold cascade, gate-out)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: carrier tractor slots.
      INVARIANT S: carrier.committed_slots + carrier.available_slots == carrier.slot_capacity
      carrier.committed_slots = count(ReleaseOrder where truck_carrier_id == carrier.id AND status IN {ALLOCATED, RELEASED})
      dealer.open_allocation_count = count(ReleaseOrder where dealer_id == dealer.id AND status IN {ALLOCATED, RELEASED})
    input_set: "ReleaseOrder rows in status ALLOCATED or RELEASED; GATED_OUT, DELIVERED, CANCELLED and CANCELLED_BY_HOLD release the slot"
    precision: "integer slots; INVARIANT S must hold after every request, including the allocation/cancel compensating pair"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: "ERR_CENTER_NOT_FOUND / ERR_VESSEL_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_SURVEY_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_REPAIR_ORDER_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_INSPECTION_NOT_FOUND / ERR_RELEASE_ORDER_NOT_FOUND / ERR_HOLD_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: business_referential
    check: "Body foreign keys resolve (processing_center_id, berth_id, dealer_id, accessory_kit_id, carrier_claim_id, vehicle_id on a SINGLE_VIN hold)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /vpc/vessels, POST /vpc/vehicles/{vehicleId}/accessory-work-orders, POST /vpc/vehicles/{vehicleId}/repair-orders, POST /vpc/vehicles/{vehicleId}/allocations, POST /vpc/processing-centers/{centerId}/hold-orders"

  - priority: 5
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, numeric ranges honored, VIN exactly 17 characters, interval end strictly after start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "Uniqueness: ProcessingCenter.port_code, Vessel.voyage_code within a center, Vehicle.vin, AccessoryKit.kit_code within a center, Dealer.dealer_code, TruckCarrier.carrier_code"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "all create endpoints"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_vehicle_version / expected_damage_survey_version equals the parent's current version"
    error_id: "ERR_STALE_VEHICLE_VERSION / ERR_STALE_SURVEY_VERSION"
    http_status: 412
    applies_to: "POST /vpc/vehicles/{vehicleId}/allocations, POST /vpc/damage-surveys/{surveyId}/claims"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition exists (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the QualityInspector opening an inspection is not the operator recorded as installed_by_user_id on any AccessoryWorkOrder of that vehicle in status INSTALLED or KITTED-after-reopen; the DistributionManager lifting a hold is not the one who applied it; the settler of a claim is not its filer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vpc/vehicles/{vehicleId}/quality-inspections, POST /vpc/hold-orders/{holdOrderId}/lift, POST /vpc/carrier-claims/{claimId}/settle"

  - priority: 10
    category: business_safety
    check: "Ownership: a Dealer may only act on release orders whose dealer_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /vpc/release-orders/{releaseOrderId}/delivery-confirmation"

  - priority: 11
    category: business_safety
    check: "Recall / stop-ship: the unit must not be covered by an OPEN HoldOrder"
    error_id: ERR_VEHICLE_STOP_SHIP_BLOCKED
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/allocations, POST /vpc/release-orders/{releaseOrderId}/gate-out"
    note: "A hold cascade cancels ALLOCATED orders outright, so dispatch never observes a blocked unit; the gate-out check is what freezes an already-RELEASED unit."

  - priority: 12
    category: business_safety
    check: "Damage gate: vehicle.damage_status must be NONE or REPAIRED"
    error_id: ERR_VEHICLE_DAMAGE_BLOCKED
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/prep-complete"
    note: "Only prep-complete can observe an open damage dimension: a unit cannot reach SHIPPING_READY (the allocation precondition) without having cleared damage first."

  - priority: 13
    category: business_safety
    check: "Mandatory claim: a unit with claim_mandatory == true may not be prepped to shipping condition until a CarrierClaim exists for its survey"
    error_id: ERR_CLAIM_REQUIRED
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/prep-complete, POST /vpc/repair-orders/{repairOrderId}/authorize"

  - priority: 14
    category: business_safety
    check: "Yard posture: no unit may be discharged into a yard whose yard_posture is GRIDLOCK"
    error_id: ERR_YARD_GRIDLOCK
    http_status: 409
    applies_to: "POST /vpc/vessels/{vesselId}/vehicles"

  - priority: 15
    category: business_temporal
    check: "Berth window: exclusive occupancy plus turnaround buffer per calculations.berth_window_conflict"
    error_id: ERR_BERTH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /vpc/vessels"

  - priority: 16
    category: business_temporal
    check: "Discharge may not start before the reserved berth window opens"
    error_id: ERR_BERTH_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /vpc/vessels/{vesselId}/start-discharge"

  - priority: 17
    category: business_temporal
    check: "Carrier pickup windows: aggregate concurrent capacity per calculations.carrier_window_capacity_conflict"
    error_id: ERR_CARRIER_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /vpc/release-orders/{releaseOrderId}/dispatch"

  - priority: 18
    category: business_referential
    check: "Prep to shipping condition requires the discharging vessel to be DISCHARGE_COMPLETE"
    error_id: ERR_VESSEL_DISCHARGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/prep-complete"

  - priority: 19
    category: business_referential
    check: "Quality inspection may not pass while any AccessoryWorkOrder of the unit is still KITTED"
    error_id: ERR_ACCESSORY_WORK_OPEN
    http_status: 409
    applies_to: "POST /vpc/quality-inspections/{inspectionId}/complete"

  - priority: 20
    category: business_constraint
    check: "Kit inventory: kit.available_qty >= work_order.qty at kitting time"
    error_id: ERR_KIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /vpc/accessory-work-orders/{workOrderId}/kit"

  - priority: 21
    category: business_constraint
    check: "Claim revision ceiling: revision_round < MAX_CLAIM_REVISIONS"
    error_id: ERR_CLAIM_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /vpc/carrier-claims/{claimId}/resubmit"

  - priority: 22
    category: business_constraint
    check: "Claim filing preconditions: severity_index >= 25 and no non-DENIED claim already exists for the survey"
    error_id: "ERR_CLAIM_NOT_WARRANTED / ERR_CLAIM_ALREADY_OPEN"
    http_status: 409
    applies_to: "POST /vpc/damage-surveys/{surveyId}/claims"

  - priority: 23
    category: business_constraint
    check: "Carrier selection candidate set must be non-empty per calculations.carrier_selection"
    error_id: ERR_NO_ELIGIBLE_CARRIER
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/allocations"

  - priority: 24
    category: business_constraint
    check: "A vessel may not be closed before at least one unit has been discharged"
    error_id: ERR_NO_UNITS_DISCHARGED
    http_status: 409
    applies_to: "POST /vpc/vessels/{vesselId}/complete-discharge"

  - priority: 25
    category: business_fiscal
    check: "Dealer allocation quota: dealer.open_allocation_count < dealer.allocation_quota"
    error_id: ERR_DEALER_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /vpc/vehicles/{vehicleId}/allocations"

  - priority: 26
    category: business_fiscal
    check: "Settlement ceiling: settled_amount_cents <= claim.recoverable_amount_cents"
    error_id: ERR_SETTLEMENT_EXCEEDS_RECOVERABLE
    http_status: 422
    applies_to: "POST /vpc/carrier-claims/{claimId}/settle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: /vpc/_clock/set_current_utc
    description: "Test-driving endpoint: set the logical clock. Default clock value when never set is 2026-08-01T00:00:00Z. Every datetime the server stamps (yard_in_at, allocated_at, dispatched_at, gated_out_at, damage_opened_at, damage_cleared_at) reads this clock."
    roles: &all_roles [PortOperationsPlanner, DamageSurveyor, AccessoryTechnician, QualityInspector, DistributionManager, Dealer]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects: []

  - method: GET
    path: /vpc/_clock
    description: "Read the current logical clock instant."
    roles: *all_roles
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ------------------------------------------------------- processing centers
  - method: POST
    path: /vpc/processing-centers
    description: "Register a vehicle processing center with its yard capacity and rate card."
    roles: [PortOperationsPlanner]
    code: 201
    input: ["name", "port_code", "yard_capacity_slots", "daily_storage_rate_cents", "labor_rate_cents_per_hour", "fuel_surcharge_pct", "free_storage_days?"]
    output: ProcessingCenter
    side_effects: ["yard_occupied_slots := 0; yard_free_slots := yard_capacity_slots; yard_posture := OPEN per calculations.yard_posture"]

  - method: GET
    path: /vpc/processing-centers/{centerId}
    description: "Read one processing center including live yard occupancy, posture and storage ledgers."
    roles: &ops_roles [PortOperationsPlanner, DamageSurveyor, AccessoryTechnician, QualityInspector, DistributionManager]
    code: 200
    input: []
    output: ProcessingCenter
    side_effects: []

  - method: GET
    path: /vpc/processing-centers
    description: "List processing centers."
    roles: *ops_roles
    code: 200
    input: ["port_code?", "yard_posture?", "limit?", "offset?"]
    output: ProcessingCenter[]
    side_effects: []

  - method: GET
    path: /vpc/processing-centers/{centerId}/dwell-metrics
    description: "Computed read: storage cost and dwell-time metrics by model line per calculations.dwell_time_metrics_by_model_line. Rows are sorted by model_line ASC and every declared model line is emitted, even at zero units."
    roles: *ops_roles
    code: 200
    input: []
