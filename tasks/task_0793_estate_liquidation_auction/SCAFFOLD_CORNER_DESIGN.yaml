        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bid-create-stale-lot]", "validations[priority=14]", "errors[ERR_STALE_VERSION]", entities.Lot.fields.version]
        distinguishing_aspect: "After B1's accepted bid advances Lot.version, a second bid carrying the pre-bid expected_lot_version is rejected with ERR_STALE_VERSION (412) even though its amount clears the increment."
        test_recipe:
