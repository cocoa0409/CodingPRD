          setup:
            - "Permitted fair; THRILL ride capacity 1, cycle_inspection_interval 2, LICENSED and OPEN on day 2026-08-03"
            - "Sale s1: 5 credits at 100 (total 550); cycle 1 completed (cycles_since_inspection == 1)"
            - "Redemptions r2 (queue_position 2) boarded on cycle 2 and r3 (queue_position 3) still QUEUED behind the capacity-1 cycle"
