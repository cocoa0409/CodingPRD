              as: InventoryManager
              captures: { gross: $.data.gross_cents, reb: $.data.coop_rebate_cents, net: $.data.net_cost_cents }
          assert:
            - "PurchaseOrder.${cppo}.gross_cents == 250000"
            - "PurchaseOrder.${cppo}.coop_rebate_cents == 25000"
            - "PurchaseOrder.${cppo}.net_cost_cents == 225000"

      - name: coop_rebate_below_threshold_no_rebate
        claim_type: Constants Applied
        grounds: ["calculations.coop_rebate", "entities.PurchaseOrder.fields.coop_rebate_cents"]
        distinguishing_aspect: "PO gross 100000 < COOP_MIN 200000 -> coop_rebate_cents 0, net_cost_cents 100000 (boundary just-below)."
        test_recipe:
          setup: ["ACTIVE vendor coop_rebate_pct 0.10; one Product; DRAFT PO qty 50 unit_cost 2000 (gross 100000)"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "CoopV2", coop_rebate_pct: 0.1 }
              as: InventoryManager
              captures: { cpv2: $.data.id }
            - call: "POST /products"
              payload: { sku: "CP-2", vendor_id: "${cpv2}", sell_mode: "EACH", aisle: "C2", bin: "D2", list_price_cents: 3000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { cpp2: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${cpv2}", lines: [ { product_id: "${cpp2}", qty: 50, unit_cost_cents: 2000 } ] }
              as: InventoryManager
              captures: { cppo2: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${cppo2}/submit"
              payload: {}
              as: InventoryManager
              captures: { reb2: $.data.coop_rebate_cents, net2: $.data.net_cost_cents }
          assert:
            - "PurchaseOrder.${cppo2}.coop_rebate_cents == 0"
            - "PurchaseOrder.${cppo2}.net_cost_cents == 100000"

      - name: special_order_free_ship_no_surcharge
        claim_type: Correct Result
        grounds: ["calculations.special_order_total", "entities.SpecialOrder.fields.confirmed_total_cents"]
        distinguishing_aspect: "Goods 60000 >= DROP_SHIP_FREE_THRESHOLD 50000 -> surcharge 0, confirmed_total_cents 60000 (vs the surcharged branch in §1.8)."
        test_recipe:
          setup: ["ACTIVE drop_ship vendor; ACTIVE account credit 1000000; SpecialOrder QUOTED unit 6000 qty 10"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "FreeV", drop_ship_capable: true }
              as: InventoryManager
              captures: { fv: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "FA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { fa: $.data.id }
            - call: "POST /special-orders"
              payload: { vendor_id: "${fv}", contractor_account_id: "${fa}", description: "Big window", qty: 10 }
              as: SalesAssociate
              captures: { fso: $.data.id }
            - call: "POST /special-orders/${fso}/quote"
              payload: { quoted_unit_cents: 6000 }
              as: SalesAssociate
          trigger:
            - call: "POST /special-orders/${fso}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${fa}"
              captures: { ct: $.data.confirmed_total_cents }
          assert:
            - "SpecialOrder.${fso}.confirmed_total_cents == 60000"

      - name: loyalty_accrual_floor_on_fulfill
        claim_type: Correct Result
        grounds: ["calculations.loyalty_accrual", "entities.SalesOrder.fields.points_accrued", "entities.LoyaltyLedger.fields.delta_points"]
        distinguishing_aspect: "Fulfilling a net-term order with total 58800 mints floor(58800/100)=588 points; LoyaltyLedger entry delta_points 588, account loyalty_points 588."
        test_recipe:
          setup: ["ACTIVE account credit 1000000; EACH product list 5000 on_hand 100; order one line qty 12 placed"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "LV" }
              as: InventoryManager
              captures: { lvv: $.data.id }
            - call: "POST /products"
              payload: { sku: "LY-1", vendor_id: "${lvv}", sell_mode: "EACH", aisle: "L2", bin: "P2", list_price_cents: 5000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { lyp: $.data.id }
            - call: "POST /products/${lyp}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "LA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { lya: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${lya}" }
              as: SalesAssociate
              captures: { lyo: $.data.id, lyo_v0: $.data.version }
            - call: "POST /sales-orders/${lyo}/lines"
              payload: { product_id: "${lyp}", qty: 12 }
              as: SalesAssociate
            - call: "POST /sales-orders/${lyo}/place"
              payload: { expected_sales_order_version: "${lyo_v0}" }
              as: SalesAssociate
              captures: { lyo_v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${lyo}/fulfill"
              payload: { expected_sales_order_version: "${lyo_v1}" }
              as: SalesAssociate
              captures: { pa2: $.data.points_accrued }
          assert:
            - "SalesOrder.${lyo}.points_accrued == 588"
            - "GET /contractor-accounts/${lya}/loyalty-ledger first entry delta_points == 588, reason == ORDER_ACCRUAL"
            - "ContractorAccount.${lya}.loyalty_points == 588"

  # =========================================================================
  - section: validations
    instances:
      - name: insufficient_stock_blocks_fulfill
        claim_type: Violation to Error
        grounds: ["validations[priority=17]", "errors[ERR_INSUFFICIENT_STOCK]", "state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=FULFILLED"]
        distinguishing_aspect: "Fulfilling a PLACED order whose line qty 10 exceeds Product.on_hand 5 -> ERR_INSUFFICIENT_STOCK 409; on_hand unchanged."
        test_recipe:
          setup: ["product on_hand 5; cash order one line qty 10 PLACED"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "ISV" }
              as: InventoryManager
              captures: { isv: $.data.id }
            - call: "POST /products"
              payload: { sku: "IS-1", vendor_id: "${isv}", sell_mode: "EACH", aisle: "X1", bin: "W1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { isp: $.data.id }
            - call: "POST /products/${isp}/adjust-stock"
              payload: { delta: 5 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { iso2: $.data.id, iso2_v0: $.data.version }
            - call: "POST /sales-orders/${iso2}/lines"
              payload: { product_id: "${isp}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${iso2}/place"
              payload: { expected_sales_order_version: "${iso2_v0}" }
              as: SalesAssociate
              captures: { iso2_v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${iso2}/fulfill"
              payload: { expected_sales_order_version: "${iso2_v1}" }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INSUFFICIENT_STOCK"
            - "Product.${isp}.on_hand == 5 (unchanged)"

      - name: suspended_account_blocks_place
        claim_type: Cross-entity validation
        grounds: ["validations[priority=14]", "errors[ERR_ACCOUNT_SUSPENDED]", "state_machines.SalesOrder.fulfillment_status=DRAFT_to_fulfillment_status=PLACED"]
        distinguishing_aspect: "Placing a net-term order on a SUSPENDED ContractorAccount -> ERR_ACCOUNT_SUSPENDED 409."
        test_recipe:
          setup: ["product on_hand 100; account SUSPENDED; draft order with one line"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "SU" }
              as: InventoryManager
              captures: { suv: $.data.id }
            - call: "POST /products"
              payload: { sku: "SU-1", vendor_id: "${suv}", sell_mode: "EACH", aisle: "U1", bin: "V1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { sup: $.data.id }
            - call: "POST /products/${sup}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "SUA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { sua: $.data.id }
            - call: "POST /contractor-accounts/${sua}/suspend"
              payload: {}
              as: AccountsManager
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${sua}" }
              as: SalesAssociate
              captures: { suo: $.data.id, suo_v0: $.data.version }
            - call: "POST /sales-orders/${suo}/lines"
              payload: { product_id: "${sup}", qty: 5 }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${suo}/place"
              payload: { expected_sales_order_version: "${suo_v0}" }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ACCOUNT_SUSPENDED"

      - name: offline_station_blocks_ticket_start
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_STATION_OFFLINE]", "state_machines.ServiceTicket.BOOKED_to_IN_PROGRESS"]
        distinguishing_aspect: "Starting a BOOKED ticket whose station was set OFFLINE -> ERR_STATION_OFFLINE 409."
        test_recipe:
          setup: ["station ACTIVE buffer 0; KEY_CUT ticket BOOKED; then station set OFFLINE"]
          setup_api_calls:
            - call: "POST /service-stations"
              payload: { name: "OFF-1", buffer_minutes: 0 }
              as: InventoryManager
              captures: { offs: $.data.id }
            - call: "POST /service-tickets"
              payload: { service_station_id: "${offs}", service_type: "KEY_CUT", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T09:10:00Z" }
              as: SalesAssociate
              captures: { offt: $.data.id }
            - call: "POST /service-stations/${offs}/set-offline"
              payload: { offline: true }
              as: InventoryManager
          trigger:
            - call: "POST /service-tickets/${offt}/start"
              payload: {}
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_STATION_OFFLINE"

      - name: purchase_order_inactive_vendor_blocks_submit
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_VENDOR_INACTIVE]", "state_machines.PurchaseOrder.DRAFT_to_SUBMITTED", "entities.Vendor.fields.status"]
        distinguishing_aspect: "Submitting a PO against a vendor that was deactivated -> ERR_VENDOR_INACTIVE 409."
        test_recipe:
          setup: ["vendor + product; DRAFT PO; vendor then deactivated"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "DEAD" }
              as: InventoryManager
              captures: { dv: $.data.id }
            - call: "POST /products"
              payload: { sku: "DV-1", vendor_id: "${dv}", sell_mode: "EACH", aisle: "G1", bin: "H1", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { dvp: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${dv}", lines: [ { product_id: "${dvp}", qty: 10, unit_cost_cents: 500 } ] }
              as: InventoryManager
              captures: { dvpo: $.data.id }
            - call: "POST /vendors/${dv}/deactivate"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /purchase-orders/${dvpo}/submit"
              payload: {}
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_VENDOR_INACTIVE"

      - name: empty_purchase_order_submit_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_EMPTY_PURCHASE_ORDER]", "state_machines.PurchaseOrder.DRAFT_to_SUBMITTED", "entities.PurchaseOrder.fields.lines"]
        distinguishing_aspect: "Submitting a PO with an empty lines array -> ERR_EMPTY_PURCHASE_ORDER 409 (empty-collection edge on a different endpoint than empty-order)."
        test_recipe:
          setup: ["ACTIVE vendor; DRAFT PO with empty lines"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "EV" }
              as: InventoryManager
              captures: { ev: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${ev}", lines: [] }
              as: InventoryManager
              captures: { evpo: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${evpo}/submit"
              payload: {}
              as: InventoryManager
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_EMPTY_PURCHASE_ORDER"

      - name: special_order_quote_non_drop_ship_vendor_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=12]", "errors[ERR_VENDOR_NOT_DROP_SHIP]", "state_machines.SpecialOrder.DRAFT_to_QUOTED"]
        distinguishing_aspect: "Quoting a special order against a vendor with drop_ship_capable false -> ERR_VENDOR_NOT_DROP_SHIP 409."
        test_recipe:
          setup: ["vendor drop_ship_capable false; account; SpecialOrder DRAFT"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "NDS", drop_ship_capable: false }
              as: InventoryManager
              captures: { nds: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "NA", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { na: $.data.id }
            - call: "POST /special-orders"
              payload: { vendor_id: "${nds}", contractor_account_id: "${na}", description: "Odd part", qty: 1 }
              as: SalesAssociate
              captures: { nso: $.data.id }
          trigger:
            - call: "POST /special-orders/${nso}/quote"
              payload: { quoted_unit_cents: 5000 }
              as: SalesAssociate
              captures: { e: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_VENDOR_NOT_DROP_SHIP"

