            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 380000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 350000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
          trigger:
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: OREOCommittee, as_user_id: "committee-1" }
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { c_id: $.data.id, c_gl: $.data.gain_loss } }
            - { call: "POST /api/closing-statements/${c_id}/settle", payload: {}, as: CreditOfficer }
            - { call: "GET /api/oreo-properties/${p_id}/summary", payload: {}, as: OREOAdmin, captures: { rgl: $.data.recognized_gain_loss_total } }
          assert:
            - "c_gl == -41500.00 (net_proceeds 326500.00 - carrying 368000.00)"
            - "Ledger contains LOSS_RECOGNIZED with amount -41500.00 (negative), never a positive loss figure"
            - "rgl == -41500.00; property DISPOSED"

