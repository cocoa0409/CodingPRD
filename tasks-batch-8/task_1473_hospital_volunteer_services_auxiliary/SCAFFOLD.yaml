    input: []
    output: GiftShopItem
    side_effects: []
  - method: PUT
    path: "/auxiliary/gift-shop-items/{id}"
    description: "Update price / restock / disable"
    roles: [AuxiliaryTreasurer]
    code: 200
    input: ["unit_price_cents?", "restock_qty?", "reorder_level?", "is_active?"]
    output: GiftShopItem
    side_effects: ["restock_qty increases stock_on_hand"]

  # --- Gift Shop Sales ---
  - method: POST
    path: "/auxiliary/gift-shop-sales"
    description: "Ring a sale (COMPLETED): discount max-stack, per-line rounding, stock decrement, campaign attribution"
    roles: [Volunteer, AuxiliaryTreasurer]
    code: 201
    input: [cashier_volunteer_id, "buyer_volunteer_id?", "campaign_id?", lines, tendered_cents]
    output: GiftShopSale
    side_effects: ["stock_on_hand -= qty per line", "campaign gross/raised/net recompute if attributed"]
  - method: GET
    path: "/auxiliary/gift-shop-sales"
    description: "List sales; FK reverse-lookup for Sale.cashier_volunteer_id / .campaign_id / .buyer_volunteer_id"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, AuxiliaryTreasurer, Volunteer]
    code: 200
    input: ["cashier_volunteer_id?", "campaign_id?", "buyer_volunteer_id?", "status?", "limit?", "offset?"]
    output: "GiftShopSale[]"
    side_effects: []
  - method: GET
    path: "/auxiliary/gift-shop-sales/{id}"
    description: "Get one sale"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, AuxiliaryTreasurer, Volunteer]
    code: 200
    input: []
    output: GiftShopSale
    side_effects: []
  - method: POST
    path: "/auxiliary/gift-shop-sales/{id}/void"
    description: "COMPLETED -> VOIDED within 24h; restores stock, unwinds campaign raised/net (gross unchanged)"
    roles: [AuxiliaryTreasurer, VolunteerCoordinator]
    code: 200
    input: [void_reason]
    output: GiftShopSale
    side_effects: ["stock restored per line", "campaign raised/net compensated"]

  # --- Recognition Events ---
  - method: GET
    path: "/auxiliary/recognition-events"
    description: "List recognition events; FK reverse-lookup for RecognitionEvent.volunteer_id"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, Volunteer]
    code: 200
    input: ["volunteer_id?", "limit?", "offset?"]
    output: "RecognitionEvent[]"
    side_effects: []
  - method: GET
    path: "/auxiliary/recognition-events/{id}"
    description: "Get one recognition event"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, Volunteer]
    code: 200
    input: []
    output: RecognitionEvent
    side_effects: []

  # --- Compliance ops-run checkpoint ---
  - method: POST
    path: "/auxiliary/compliance/annual-review"
    description: "Ops-run epoch sweep: expire clearances/trainings whose expires_at <= now; suspend ACTIVE volunteers whose posture is FROZEN; suspend ACTIVE volunteers whose most-recently-completed service year fell below the hour minimum; recompute recognition tiers (RecognitionEvent on change). Idempotent at a fixed clock."
    roles: [VolunteerServicesDirector]
    code: 200
    input: []
    output: "{ clearances_expired: integer, trainings_expired: integer, volunteers_suspended: integer, recognition_events_created: integer }"
    side_effects: ["clearance CLEARED -> EXPIRED sweep", "training VALID -> EXPIRED sweep", "ACTIVE -> SUSPENDED (COMPLIANCE_LAPSE / HOURS_SHORTFALL) with badge cascade", "tier recompute + RecognitionEvents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / request
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum member, qty < 1, negative amount, end_at <= start_at, decision=REJECT without rejection_reason, void/reject/reverse without reason" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Volunteer acting on another volunteer's resource, or DepartmentHead managing a request of a department they do not head" }
  - { id: ERR_SOD_CLEARANCE_ADJUDICATION, http: 403, condition: "Adjudicator X-User-ID equals Clearance.submitted_by_user_id" }
  - { id: ERR_SOD_CAMPAIGN_DISBURSEMENT, http: 403, condition: "Disbursing treasurer's X-User-ID equals FundraisingCampaign.created_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist (left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC, §1.2.1)" }
  # state
  - { id: ERR_APPLICATION_NOT_ACTIONABLE, http: 409, condition: "Application not in the required state for start-review/request-info/resubmit/decide/withdraw" }
  - { id: ERR_VOLUNTEER_INVALID_STATE, http: 409, condition: "Volunteer not in the required service_status (ONBOARDING for activate; ACTIVE for suspend/confirm/signup; SUSPENDED for reinstate; non-SEPARATED for most ops)" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "Volunteer.compliance_posture == FROZEN blocks signup, placement create/accept, reinstate" }
  - { id: ERR_POSTURE_NOT_CLEAR, http: 409, condition: "Volunteer.compliance_posture != CLEAR blocks shift-assignment confirm" }
  - { id: ERR_CLEARANCE_INVALID_STATE, http: 409, condition: "Clearance not SUBMITTED (adjudicate), not REJECTED/EXPIRED (resubmit), or not CLEARED (revoke)" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "Request not DRAFT (open) or not OPEN/FILLED (close/cancel)" }
  - { id: ERR_REQUEST_NOT_OPEN, http: 409, condition: "Placement accept/reoffer requires the request to be OPEN" }
  - { id: ERR_PLACEMENT_INVALID_STATE, http: 409, condition: "Placement not in the required state (OFFERED for accept/counter; OFFERED/COUNTERED for decline; COUNTERED for reoffer; non-terminal for rescind)" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "Shift not SCHEDULED (publish), not SCHEDULED/PUBLISHED (cancel/update), or not PUBLISHED (signup/complete)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not SIGNED_UP (confirm) or not in {SIGNED_UP,CONFIRMED,WAITLISTED} (cancel)" }
  - { id: ERR_HOUR_ENTRY_INVALID_STATE, http: 409, condition: "Entry not PENDING (approve/reject) or not APPROVED (reverse)" }
  - { id: ERR_TRAINING_RECORD_INVALID_STATE, http: 409, condition: "Training record not PENDING/EXPIRED for completion" }
  - { id: ERR_BADGE_INVALID_STATE, http: 409, condition: "No PENDING badge at activate; badge not live for revoke/replace; badge not ISSUED at confirm" }
  - { id: ERR_CAMPAIGN_INVALID_STATE, http: 409, condition: "Campaign not DRAFT (activate), not ACTIVE (close / sale attribution), not CLOSED (reconcile), not RECONCILED (disburse)" }
  - { id: ERR_SALE_ALREADY_VOIDED, http: 409, condition: "Void on a sale already VOIDED" }
  # business_safety
  - { id: ERR_ROLE_MIN_AGE_NOT_MET, http: 422, condition: "Volunteer age at the relevant service/offer date < role.minimum_age" }
  - { id: ERR_DEPARTMENT_JUNIOR_RESTRICTED, http: 422, condition: "Junior volunteer placed/assigned into a department with junior_allowed=false" }
  - { id: ERR_JUNIOR_WEEKLY_HOUR_CAP_EXCEEDED, http: 422, condition: "Junior projected ISO-week hours would exceed 16.0 (exactly 16.0 allowed)" }
  - { id: ERR_SUPERVISION_REQUIRED, http: 422, condition: "Junior confirm without supervisor_assignment_id" }
  - { id: ERR_SUPERVISOR_INELIGIBLE, http: 422, condition: "Supervisor assignment not on the same shift / not CONFIRMED / supervisor < 21 at shift date / supervisor role lacks can_supervise_juniors" }
  - { id: ERR_SUPERVISOR_RATIO_EXCEEDED, http: 422, condition: "Supervisor would exceed 3 junior supervisees on the shift (counting this confirm)" }
  - { id: ERR_TRAINING_REQUIREMENT_UNMET, http: 422, condition: "A code in the shift role's required_training_codes lacks a VALID TrainingRecord at confirm" }
  - { id: ERR_ORIENTATION_INCOMPLETE, http: 422, condition: "Activate without a VALID ORIENTATION TrainingRecord" }
  - { id: ERR_CLEARANCE_REQUIREMENTS_UNMET, http: 422, condition: "Activate without all three clearance types CLEARED (expires_at > now)" }
  # business_constraint
  - { id: ERR_NO_ACCEPTED_PLACEMENT, http: 409, condition: "Activate without at least one ACCEPTED placement" }
  - { id: ERR_DUPLICATE_ACTIVE_CLEARANCE, http: 409, condition: "Creating a clearance while a non-terminal one exists for the same (volunteer, clearance_type)" }
  - { id: ERR_DUPLICATE_PLACEMENT, http: 409, condition: "Placement offer while one exists for the same (volunteer, request) in {OFFERED, COUNTERED, ACCEPTED}" }
  - { id: ERR_PLACEMENT_LIMIT_EXCEEDED, http: 409, condition: "Volunteer already holds 2 ACCEPTED placements" }
  - { id: ERR_DUPLICATE_SHIFT_ASSIGNMENT, http: 409, condition: "Signup while an assignment for the same (volunteer, shift) exists in {WAITLISTED, SIGNED_UP, CONFIRMED}" }
  - { id: ERR_SHIFT_TIME_OVERLAP, http: 409, condition: "New shift window half-open-overlaps the volunteer's existing {SIGNED_UP, CONFIRMED} assignment shift; adjacency (end == start) is allowed" }
  - { id: ERR_SHIFT_AT_CAPACITY, http: 409, condition: "Shift filled_count == capacity and allow_waitlist == false" }
  - { id: ERR_COUNTER_ROUND_EXHAUSTED, http: 409, condition: "Counter attempted when counter_rounds == 2" }
  - { id: ERR_SHIFT_HAS_ASSIGNMENTS, http: 409, condition: "Reschedule of a shift with assignments in {WAITLISTED, SIGNED_UP, CONFIRMED}" }
  - { id: ERR_ITEM_INACTIVE, http: 409, condition: "Sale line references an item with is_active == false" }
  - { id: ERR_HOURS_EXCEED_SHIFT, http: 422, condition: "Linked entry minutes > shift duration in minutes" }
  # business_temporal
  - { id: ERR_SIGNUP_WINDOW_CLOSED, http: 409, condition: "Signup at/after shift.start_at - 24h" }
  - { id: ERR_CANCEL_WINDOW_CLOSED, http: 409, condition: "Volunteer self-cancel at/after shift.start_at - 24h (staff bypass)" }
  - { id: ERR_SHIFT_NOT_ENDED, http: 409, condition: "Shift complete before end_at" }
  - { id: ERR_VOID_WINDOW_ELAPSED, http: 409, condition: "Void after sale.created_at + 24h" }
  - { id: ERR_CAMPAIGN_WINDOW_MISMATCH, http: 422, condition: "Campaign activate outside [start_at, end_at); close before end_at; sale attribution outside window" }
  - { id: ERR_DISBURSEMENT_COOLING_OFF, http: 409, condition: "Disbursement before closed_at + 7 days" }
  - { id: ERR_SERVICE_DATE_OUT_OF_RANGE, http: 422, condition: "service_date in the future, before joined_at date, or not equal to the linked shift's calendar date" }
  # business_referential
  - { id: ERR_ASSIGNMENT_OWNERSHIP_MISMATCH, http: 422, condition: "Hour entry's shift_assignment_id belongs to a different volunteer" }
  - { id: ERR_CASHIER_NOT_GIFT_SHOP_PLACED, http: 422, condition: "cashier_volunteer_id is not an ACTIVE volunteer holding an ACCEPTED placement whose role category == GIFT_SHOP" }
  # business_fiscal
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Sale line qty > GiftShopItem.stock_on_hand" }
  - { id: ERR_INSUFFICIENT_TENDER, http: 402, condition: "tendered_cents < computed total_cents" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_BALANCE, http: 402, condition: "amount_cents > net_proceeds_cents - disbursed_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VolunteerServicesDirector
    description: "Director of Volunteer Services — application decisions, org configuration (departments/roles), separations, annual review"
    identity: opaque
    exclusive_operations:
      - "POST /auxiliary/volunteer-applications/{id}/decide"
      - "POST /auxiliary/departments, POST /auxiliary/volunteer-roles"
      - "POST /auxiliary/volunteers/{id}/separate"
      - "POST /auxiliary/compliance/annual-review"
    shared_operations:
      - "POST /auxiliary/volunteer-applications (intake)"
      - "POST /auxiliary/volunteers/{id}/suspend, /reinstate"
      - "POST /auxiliary/clearances/{id}/revoke; POST /auxiliary/department-requests/{id}/cancel"
      - "POST /auxiliary/shift-assignments/{id}/cancel (staff override)"
      - "All list/detail GETs; POST /_clock/set_current_utc"
  - name: VolunteerCoordinator
    description: "Coordinator — day-to-day operations: intake, review workflow, clearances intake, activation, shifts, assignments, hours, badges, placement offers"
    identity: opaque
    exclusive_operations:
      - "POST /auxiliary/volunteer-applications/{id}/start-review, /request-info, /resubmit, /withdraw"
      - "POST /auxiliary/volunteers/{id}/activate; PUT /auxiliary/volunteers/{id}"
      - "POST /auxiliary/shifts (CRUD + publish/cancel/complete)"
      - "POST /auxiliary/shift-assignments/{id}/confirm"
      - "POST /auxiliary/hour-entries/{id}/approve, /reject, /reverse"
      - "POST /auxiliary/badges/{id}/revoke, /replace"
      - "POST /auxiliary/placements (offer); POST /auxiliary/training-records*"
    shared_operations:
      - "POST /auxiliary/volunteer-applications; POST /auxiliary/volunteers/{id}/suspend, /reinstate, /reapply"
      - "POST /auxiliary/clearances, /resubmit"
      - "POST /auxiliary/placements/{id}/accept, /decline, /rescind"
      - "POST /auxiliary/shift-assignments, /cancel; POST /auxiliary/hour-entries"
      - "POST /auxiliary/gift-shop-sales/{id}/void"
      - "All list/detail GETs; POST /_clock/set_current_utc"
  - name: Screener
    description: "HR / Employee-Health screener — clearance submission, adjudication, revocation. Segregation of duties: cannot adjudicate own submissions"
    identity: opaque
    exclusive_operations:
      - "POST /auxiliary/clearances/{id}/adjudicate"
    shared_operations:
      - "POST /auxiliary/clearances, /resubmit, /revoke"
      - "Application/volunteer/clearance GETs; POST /_clock/set_current_utc"
  - name: DepartmentHead
    description: "Hospital department head — staffing requests and placement negotiation for departments where head_user_id == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /auxiliary/department-requests* (create/open/close/cancel — own departments only)"
      - "POST /auxiliary/placements/{id}/reoffer (own department's requests only)"
    shared_operations:
      - "POST /auxiliary/placements/{id}/rescind"
      - "Department/role/request/placement/shift/assignment GETs; POST /_clock/set_current_utc"
  - name: AuxiliaryTreasurer
    description: "Auxiliary treasurer — fundraising campaigns, gift shop catalog and sales oversight, disbursements. SoD: cannot disburse a campaign they created"
    identity: opaque
    exclusive_operations:
      - "POST /auxiliary/fundraising-campaigns* (create/activate/close/reconcile/disburse)"
      - "POST/PUT /auxiliary/gift-shop-items*"
    shared_operations:
      - "POST /auxiliary/gift-shop-sales (staff sale), /{id}/void"
      - "Campaign/item/sale/volunteer GETs; POST /_clock/set_current_utc"
  - name: Volunteer
    description: "The volunteer themself — self-service: read own record, sign up/cancel shifts, log hours, negotiate placements, ring gift-shop sales when placed"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /auxiliary/placements/{id}/counter (only the placement's own volunteer)"
    shared_operations:
      - "GET /auxiliary/volunteers/{id} and /summary (self only)"
      - "POST /auxiliary/placements/{id}/accept, /decline (own placements)"
      - "POST /auxiliary/shift-assignments (self), /{id}/cancel (self, windowed)"
      - "POST /auxiliary/hour-entries (self)"
      - "POST /auxiliary/gift-shop-sales (self as cashier)"
      - "Filtered list GETs scoped to own volunteer_id; department/role/item GETs"
