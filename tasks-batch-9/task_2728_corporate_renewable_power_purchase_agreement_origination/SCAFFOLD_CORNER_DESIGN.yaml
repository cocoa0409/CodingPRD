      - name: role_gate_outranks_the_stale_version_guard_on_a_credit_decision
        claim_type: priority_conflict
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_9_ERR_STALE_VERSION
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / role_gate_beats_stale_version_returns_403_not_412"
          rationale: |
            The §1.8 instance already drives exactly this pair: one request that is both
            made by a forbidden role and carries a stale expected_deal_version, asserting
            403 ERR_ROLE_NOT_PERMITTED rather than 412 ERR_STALE_VERSION, and then
            re-issuing it with the correct role to prove the version really was stale.
            A corner instance here would restate the same ordering claim on the same two
            priorities with no additional discrimination.

      - name: malformed_risk_window_outranks_the_overlap_check_on_a_claim
        claim_type: priority_conflict
        grounds:
          - validations.priority_17_ERR_INVALID_WINDOW
          - validations.priority_22_ERR_RISK_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / invalid_window_precedes_risk_window_overlap_on_risk_event_claim"
          rationale: |
            The §1.8 instance posts a single risk-event claim whose window is both
            inverted and overlapping an existing accepted event of the same type, and
            asserts ERR_INVALID_WINDOW at priority 17 rather than ERR_RISK_WINDOW_OVERLAP
            at 22, then repairs only the ordering to expose the overlap. That is this
            claim in full; duplicating it here would add no distinguishing aspect.

  # ---------------------------------------------------------------------------
  # Guide section 5: Endpoints. Standard CRUD (list filters + pagination
  # envelope) and cross-reference linkage are authored in full; the action,
  # computed-read and conditional-action rows are already carried by §1.8.
  # The `Bulk action` row is skipped: §1.5 declares no bulk endpoint - the
  # meter-interval loader posts one hour per request, by design, so that the
  # duplicate-hour and hour-outside-period guards are per-row observable.
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: deal_list_filters_are_conjunctive_and_compose_with_the_page_window
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/ppa/deals
          - endpoints.POST_/ppa/deals
          - entities.Deal.fields.round_count
        distinguishing_aspect: |
          Three deals across two projects, two of them DRAFT and one advanced to
          TERM_SHEET_ISSUED, make every filter discriminating rather than vacuous.
          The claims are that filters AND together (project_id of the two-deal project
          combined with the one-deal status yields zero rows, not three), that
          total_count reports the filtered population and not the page, that has_more
          is derived from offset + returned versus total_count, and that the declared
          pagination floor is enforced rather than silently clamped.
        test_recipe:
          setup:
            - "One node, one QUALIFIED buyer, two projects (100.000 MW and 50.000 MW) and three deals: two DRAFT on the first project (25.000 and 30.000 MW) and one on the second project advanced to TERM_SHEET_ISSUED by issuing a round."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
