        distinguishing_aspect: "Subscriber A reading subscriber B's account (X-User-ID mismatch with the resource owner) returns 403 ERR_FORBIDDEN_NOT_OWNER — ownership check, not role check."
        test_recipe:
          setup: ["two subscriber accounts A and B"]
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
