          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - state_machines.SupplyOrder.UNALLOCATED_to_RESERVED
        distinguishing_aspect: |
          Boundary on a CENTS metric via the order-submit endpoint: used 854050
          + new 89900 == limit 943950 exactly PASSES (the check is strictly
          greater), while one more 89900 order fails. Distinct metric and
          endpoint from the score-boundary instance.
