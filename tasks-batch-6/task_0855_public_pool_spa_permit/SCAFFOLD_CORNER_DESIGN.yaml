              captures: { err_id: $.data.error_id }
            - call: "POST /facilities/${fac_id}/compliance-artifacts"
              payload: { artifact_type: "DRAIN_CERTIFICATION", effective_on: "2026-06-15", drain_cover_model: "AquaSafe VGB-12", sva_system_type: "SVRS" }
