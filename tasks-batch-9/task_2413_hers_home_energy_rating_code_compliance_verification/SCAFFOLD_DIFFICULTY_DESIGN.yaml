              as: CertifiedRater
              as_user_id: "${r12}"
              captures: { pm12: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd12}", plan_model_id: "${pm12}", lot_number: "L-701", permit_date: "2026-08-03" }
              as: BuilderRep
              as_user_id: "${b12}"
              captures: { h12: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h12}", rater_id: "${r12}" }
              as: CertifiedRater
              as_user_id: "${r12}"
              captures: { rt12: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt12}", inspector_id: "${fi12}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-12T09:00:00Z", scheduled_end_utc: "2026-08-12T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi12}"
              captures: { in12a: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt12}", inspector_id: "${fi12}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-14T09:00:00Z", scheduled_end_utc: "2026-08-14T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi12}"
              captures: { in12b: $.data.id }
          trigger:
            - call: "POST /inspections/${in12a}/tests"
              payload: { test_type: "BLOWER_DOOR", measured_value: 1080 }
