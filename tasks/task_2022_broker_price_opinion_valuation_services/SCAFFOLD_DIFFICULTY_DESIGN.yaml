          trigger:
            - call: "POST /bpo/brokers/${brk_f}/suspend"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_f}/reinstate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Broker.${brk_f}.status == ACTIVE (after reinstate, fork-join returned to the same state)"
            - "ValuationOrder.${ord_f1}.fulfillment_status == READY_FOR_DISPATCH (was DISPATCHED; reverted)"
