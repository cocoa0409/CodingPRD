              as: CastingDirector
              captures: { offer_r3: $.data.id, offer_r3_round: $.data.round_number }
          assert:
            - "Offer.${offer_r1}.status == COUNTERED"
            - "Offer.${offer_r2}.round_number == 2 AND Offer.${offer_r3}.round_number == 3"
            - "Offer.${offer_r3}.parent_offer_id == ${offer_r2} (chain links rounds)"
            - "Offer.${offer_r3}.status == EXTENDED (new live offer after two cycles)"

      - name: submission_branching_callback_revert
        grounds:
