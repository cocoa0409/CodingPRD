            - call: "POST /panelists"
              payload: { email: "cap3@example.com", display_name: "Cap Three", address_hash: "H-CAP3", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { pc_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${pa_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
