  - rule_id: transitive_cascade
    instances:
      - name: site_disqualification_releases_queue_and_retiers_sibling
        grounds:
          - state_machines.CandidateSite.SCREENED_to_DISQUALIFIED
          - state_machines.InterconnectionApplication.SUBMITTED_to_WITHDRAWN
          - calculations.utility_capacity_ledger
          - calculations.energization_risk_tier
          - calculations.program_status_rollup
        distinguishing_aspect: |
          One disqualify call propagates five levels deep across four entity types: site ->
          its application (ENERGIZATION_COMMITTED -> WITHDRAWN) -> the serving utility's capacity
          ledger (reserved 300.0 -> 0, available 100.0 -> 400.0) -> a SIBLING site's
          energization_risk_tier (AT_RISK -> ON_TRACK) -> the program's committed_load_mw
          (300.0 -> 0). The chain leaves the disqualified site's own entity graph entirely.
        test_recipe:
          setup:
            - "Program with target_load_mw 300 and required_energization_date 2029-06-30."
            - "Utility with total_transmission_capacity_mw 400, commissioning_buffer_days 90, energization_lead_days 540."
            - "Site Alpha and Site Bravo both screened on that utility (AIR_COOLED, zero water demand)."
            - "Site Alpha's application for 300 MW walked to ENERGIZATION_COMMITTED with committed_energization_date 2029-06-30, so reserved_capacity_mw is 300.0 and available_capacity_mw is 100.0."
            - "Site Bravo has no application, so with available 100.0 < target 300 its energization_risk_tier is AT_RISK."
            - "Logical clock left at its 2026-08-01T00:00:00Z default (energization_lead_days 540 puts the earliest legal commitment at 2028-01-23)."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Bravo", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
