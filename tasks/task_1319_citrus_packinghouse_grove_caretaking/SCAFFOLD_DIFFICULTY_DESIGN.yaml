  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: quarantine_activation_cascade
        grounds:
          - state_machines.QuarantineOrder
          - state_machines.Grove.PRODUCTIVE_to_RETIRED
          - state_machines.HarvestAssignment.SCHEDULED_to_CANCELLED
          - state_machines.Delivery.regulatory_status
          - entities.Grove.fields.quarantine_posture
        distinguishing_aspect: |
          Depth-3 chain from the QUARANTINE-CREATE trigger: order creation (A)
          recomputes grove.quarantine_posture to QUARANTINED (B); the posture
          change auto-CANCELS the grove's SCHEDULED assignments (C); each
          cancellation releases the crew's committed window capacity (D) —
          proven by successfully re-booking the freed window. The same trigger
          also fan-outs CLEAR deliveries of the grove to HELD.
        test_recipe:
          setup:
            - "Clock advanced to 2026-08-02T07:00:00Z; grower with two POLK HAMLIN groves G1, G2, each with CURRENT PASS maturity (sampled 2026-07-31T10:00, expires 2026-08-05T10:00)"
            - "Pool HAMLIN wk 2026-07-27 OPEN (week covers 2026-08-02)"
            - "Crew CR-QC1 cap 400; A1: G1 window [2026-08-01T06:00,2026-08-01T18:00) planned 100, left SCHEDULED"
            - "A2: G1 window [2026-08-02T06:00,2026-08-02T18:00) planned 50, IN_PROGRESS; delivery D (50 boxes) RECEIVED x CLEAR on G1 via A2"
