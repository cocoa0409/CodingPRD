scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, defaults, computed, system, type constraints
  # =========================================================================
  - section: entities
    instances:
      - name: claim_creation_required_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Claim
        distinguishing_aspect: "POST /siu/claims with all required fields returns 201 with system-generated id, created_at, updated_at, version=1, status=PENDING, paid_amount_cents=0."
        test_recipe:
          setup:
            - "Adjuster A1 exists"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj", email: "adj@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /siu/claims"
              payload: { policy_number: "P-X", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { cid: $.data.id, cstatus: $.data.status, cpaid: $.data.paid_amount_cents, cv: $.data.version }
          assert:
            - "Claim.${cid}.status == PENDING"
            - "Claim.${cid}.paid_amount_cents == 0"
            - "Claim.${cid}.version == 1"
            - "Claim.${cid}.id is a UUID with no type prefix"

      - name: claim_missing_required_field_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - entities.Claim.fields.claimed_amount_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required claimed_amount_cents returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Adjuster A1 exists"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "Adj", email: "adj@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /siu/claims"
              payload: { policy_number: "P-X", state_code: "CA", adjuster_id: "${adj}" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: claim_get_by_id_returns_stored
        claim_type: retrieval
        grounds:
          - entities.Claim
        distinguishing_aspect: "GET /siu/claims/{id} returns the same fields posted at create."
        test_recipe:
          setup:
            - "Adjuster A1, Claim C1 created"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P-R", state_code: "NY", adjuster_id: "${adj}", claimed_amount_cents: 1234567 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
          trigger:
            - call: "GET /siu/claims/${c}"
              payload: {}
              as: SIUManager
              captures: { got_policy: $.data.policy_number, got_state: $.data.state_code, got_amt: $.data.claimed_amount_cents }
          assert:
            - "policy_number == P-R"
            - "state_code == NY"
            - "claimed_amount_cents == 1234567"

      - name: claim_list_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Claim
          - response_envelope
        distinguishing_aspect: "GET /siu/claims returns array under data with meta + pagination fields (limit, offset, total_count, has_more)."
        test_recipe:
          setup:
            - "Adjuster; 3 claims created"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P1", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 100 }
              as: Adjuster
              as_user_id: "${adj}"
            - call: "POST /siu/claims"
              payload: { policy_number: "P2", state_code: "NY", adjuster_id: "${adj}", claimed_amount_cents: 200 }
              as: Adjuster
              as_user_id: "${adj}"
            - call: "POST /siu/claims"
              payload: { policy_number: "P3", state_code: "FL", adjuster_id: "${adj}", claimed_amount_cents: 300 }
              as: Adjuster
              as_user_id: "${adj}"
          trigger:
            - call: "GET /siu/claims"
              payload: {}
              as: SIUManager
          assert:
            - "response envelope contains meta.api_request_id"
            - "response_type == array"
            - "data has 3 elements"

      - name: claim_get_non_existent_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Claim
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with valid-format but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /siu/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SIUManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: referral_computed_score_input_ignored
        claim_type: computed_field
        grounds:
          - entities.RedFlagReferral.fields.suspicion_score
        distinguishing_aspect: "suspicion_score is source=computed; client cannot inject it. POST with suspicion_score=999 must be ignored and the server computes per formula."
        test_recipe:
          setup:
            - "Adjuster, Claim"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x", suspicion_score: 999 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { sc: $.data.suspicion_score }
          assert:
            - "suspicion_score == 12 (UNWITNESSED_LOSS weight, not 999)"

      - name: investigator_active_case_count_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.Investigator.fields.active_case_count
        distinguishing_aspect: "New Investigator.active_case_count defaults to 0 and status defaults to ACTIVE."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "B1", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { iid: $.data.id, ic: $.data.active_case_count, ist: $.data.status }
          assert:
            - "Investigator.${iid}.active_case_count == 0"
            - "Investigator.${iid}.status == ACTIVE"

      - name: claim_state_code_enum_constraint
        claim_type: type_constraint
        grounds:
          - entities.Claim.fields.state_code
        distinguishing_aspect: "state_code must be a 2-letter US state; 3-letter or invalid code returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Adjuster"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CAL", adjuster_id: "${adj}", claimed_amount_cents: 100 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # Section: state_machines — invalid-from, terminal lockdown, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: referral_accept_from_declined_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RedFlagReferral.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once DECLINED, referral cannot be accepted; second action returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Referral R in DECLINED state"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 100 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/decline"
              payload: { decline_reason: "not credible" }
              as: SIUManager
          trigger:
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: closed_case_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SIUCase.terminal_states
        distinguishing_aspect: "Once CLOSED_UNSUBSTANTIATED, no further transitions (assign, close, submit) succeed."
        test_recipe:
          setup:
            - "Case closed as UNSUBSTANTIATED"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "B", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 5000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k: $.data.id }
            - call: "POST /siu/cases/${k}/open"
              payload: {}
              as: SIUManager
              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v}" }
              as: SIUManager
              captures: { k_v2: $.data.version }
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "STATEMENT", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUPPORTING", fraud_amount_cents: 0 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e: $.data.id }
            - call: "POST /siu/cases/${k}/evidence/${e}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
            - call: "POST /siu/cases/${k}/evidence/${e}/admit"
              payload: { expected_case_version: "${k_v2}" }
              as: SIUManager
            - call: "POST /siu/cases/${k}/submit-for-decision"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
            - call: "POST /siu/cases/${k}/close"
              payload: { closed_reason: "UNSUBSTANTIATED" }
              as: SIUManager
            - call: "GET /siu/cases/${k}"
              payload: {}
              as: SIUManager
              captures: { k_v_end: $.data.version }
          trigger:
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v_end}" }
              as: SIUManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: case_initial_state_is_intake
        claim_type: initial_state
        grounds:
          - state_machines.SIUCase.initial_state
        distinguishing_aspect: "Newly created SIUCase (via referral accept) starts in INTAKE, not OPEN."
        test_recipe:
          setup:
            - "Referral accepted"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 100 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
          trigger:
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k_status: $.data.status }
          assert:
            - "SIUCase.status == INTAKE"

      - name: claim_pay_from_under_siu_review_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim.transitions.PENDING_to_PAID
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: claim_pay_blocked_by_open_case
          rationale: "Same failure path asserted in §1.8 instance claim_pay_blocked_by_open_case."

      - name: evidence_admit_while_case_euo_pending_returns_state_error
        claim_type: guarded_transition
        grounds:
          - state_machines.Evidence.transitions.UNDER_REVIEW_to_ADMITTED
        excluded_because:
          difficulty_instance: evidence_admit_blocked_during_euo_pending
          rationale: "Guarded transition asserted in §1.8."

      - name: admit_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Evidence.transitions.UNDER_REVIEW_to_ADMITTED
        distinguishing_aspect: "Second admit on already-ADMITTED evidence returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Evidence E ADMITTED on case K"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "B", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 5000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k: $.data.id }
            - call: "POST /siu/cases/${k}/open"
              payload: {}
              as: SIUManager
              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v}" }
              as: SIUManager
              captures: { k_v2: $.data.version }
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUPPORTING", fraud_amount_cents: 0 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e: $.data.id }
            - call: "POST /siu/cases/${k}/evidence/${e}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
            - call: "POST /siu/cases/${k}/evidence/${e}/admit"
              payload: { expected_case_version: "${k_v2}" }
              as: SIUManager
            - call: "GET /siu/cases/${k}"
              payload: {}
              as: SIUManager
              captures: { k_v3: $.data.version }
          trigger:
            - call: "POST /siu/cases/${k}/evidence/${e}/admit"
              payload: { expected_case_version: "${k_v3}" }
              as: SIUManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (Evidence already ADMITTED, not UNDER_REVIEW)"

  # =========================================================================
  # Section: calculations — correctness, filtering, boundary
  # =========================================================================
  - section: calculations
    instances:
      - name: red_flag_score_band_boundary_20_is_medium
        claim_type: correct_result
        grounds:
          - calculations.red_flag_score
        distinguishing_aspect: "Score exactly at LOW_MAX (20) is MEDIUM not LOW (band rule: score < LOW_MAX → LOW)."
        test_recipe:
          setup:
            - "Claim under high-value threshold (claimed_amount_cents=1000000)"
            - "Codes yielding exactly 20: single INFLATED_BILLING (20) — 1 code, no bonus"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["INFLATED_BILLING"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { sc: $.data.suspicion_score, band: $.data.score_band }
          assert:
            - "suspicion_score == 20"
            - "score_band == MEDIUM (boundary: 20 is NOT < 20)"

      - name: red_flag_score_combination_bonus_at_exactly_3_codes
        claim_type: boundary_condition
        grounds:
          - calculations.red_flag_score
        distinguishing_aspect: "COMBINATION_BONUS (15) applies when len(codes) >= 3 — tested at exact threshold 3."
        test_recipe:
          setup:
            - "Claim under high-value"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 1000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["UNWITNESSED_LOSS", "POST_POLICY_BIND_CLAIM", "EXCESSIVE_TREATMENT_FREQUENCY"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { sc: $.data.suspicion_score, band: $.data.score_band }
          assert:
            - "suspicion_score == 12+15+14+15 = 56"
            - "score_band == HIGH"

      - name: substantiated_total_excludes_immaterial_evidence
        claim_type: input_set_filtering
        grounds:
          - calculations.substantiated_fraud_total
        distinguishing_aspect: "Only ADMITTED + SUBSTANTIVE evidence contributes; IMMATERIAL and SUPPORTING are excluded."
        test_recipe:
          setup:
            - "Case with 3 evidence: E1 SUBSTANTIVE 500000, E2 SUPPORTING 200000, E3 IMMATERIAL 100000, all ADMITTED"
          setup_api_calls:
            - call: "POST /siu/adjusters"
              payload: { full_name: "A", email: "a@x.com", state_licenses: ["CA"] }
              as: SIUManager
              captures: { adj: $.data.id }
            - call: "POST /siu/investigators"
              payload: { full_name: "I", email: "i@x.com", badge_number: "B", state_certifications: ["CA"], max_active_cases: 5 }
              as: SIUManager
              captures: { inv: $.data.id }
            - call: "POST /siu/claims"
              payload: { policy_number: "P", state_code: "CA", adjuster_id: "${adj}", claimed_amount_cents: 100000000 }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { c: $.data.id }
            - call: "POST /siu/referrals"
              payload: { claim_id: "${c}", submitted_by_role: "ADJUSTER", red_flag_codes: ["PRIOR_FRAUD_CONVICTION"], narrative: "x" }
              as: Adjuster
              as_user_id: "${adj}"
              captures: { r: $.data.id }
            - call: "POST /siu/referrals/${r}/triage"
              payload: {}
              as: SIUManager
            - call: "POST /siu/referrals/${r}/accept"
              payload: {}
              as: SIUManager
              captures: { k: $.data.id }
            - call: "POST /siu/cases/${k}/open"
              payload: {}
              as: SIUManager
              captures: { k_v: $.data.version }
            - call: "POST /siu/cases/${k}/assignments"
              payload: { investigator_id: "${inv}", expected_case_version: "${k_v}" }
              as: SIUManager
              captures: { k_v2: $.data.version }
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "RECORDS", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUBSTANTIVE", fraud_amount_cents: 500000 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e1: $.data.id }
            - call: "POST /siu/cases/${k}/evidence/${e1}/submit-review"
              payload: {}
              as: SIUInvestigator
              as_user_id: "${inv}"
            - call: "POST /siu/cases/${k}/evidence/${e1}/admit"
              payload: { expected_case_version: "${k_v2}" }
              as: SIUManager
              captures: { k_v3: $.data.version }
            - call: "POST /siu/cases/${k}/evidence"
              payload: { evidence_type: "STATEMENT", collected_at: "2026-08-10T00:00:00Z", custodian: "I", materiality: "SUPPORTING", fraud_amount_cents: 0 }
              as: SIUInvestigator
              as_user_id: "${inv}"
              captures: { e2: $.data.id }
