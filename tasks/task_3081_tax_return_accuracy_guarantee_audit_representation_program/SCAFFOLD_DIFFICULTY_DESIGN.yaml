              as: CaseManager
              captures: { n2: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "GET /tax/returns/${ret2}"
              as: CaseManager
              captures: { v2: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret2}", notice_id: "${n2}", expected_return_version: "${v2}" }
              as: CaseManager
              captures: { cl2: $.data.id }
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/claims/${cl2}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 5 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: CaseManager
          trigger:
            - call: "POST /tax/claims/${cl2}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-11-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CaseManager
              captures: { asg2: $.data.id }
            - call: "POST /tax/claims/${cl2}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-10-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z" }
              as: CaseManager
