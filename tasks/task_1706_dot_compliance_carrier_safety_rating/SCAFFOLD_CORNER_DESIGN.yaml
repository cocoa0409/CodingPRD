      - name: duplicate_dot_number_and_testing_period_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_DOT_NUMBER]", "errors[ERR_DUPLICATE_TESTING_PERIOD]"]
        distinguishing_aspect: "Global and per-carrier uniqueness: second carrier with the same dot_number -> ERR_DUPLICATE_DOT_NUMBER; second 2026 period for the same carrier -> ERR_DUPLICATE_TESTING_PERIOD."
        test_recipe:
          setup: ["carrier DOT-2335 with a 2026 period"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2335", legal_name: "Dup Dot", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/random-testing-periods", payload: { carrier_id: "${c_id}", program_year: 2026, avg_driver_count: 4 }, as: SafetyManager }
          trigger:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2335", legal_name: "Dup Dot 2", fleet_size: 5 }, as: SafetyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/random-testing-periods", payload: { carrier_id: "${c_id}", program_year: 2026, avg_driver_count: 10 }, as: SafetyManager, captures: { err2: $.data.error_id } }
            - { call: "POST /safety/random-testing-periods", payload: { carrier_id: "${c_id}", program_year: 2027, avg_driver_count: 10 }, as: SafetyManager, captures: { ok: $.data.id } }
          assert:
            - "duplicate dot_number -> ERR_DUPLICATE_DOT_NUMBER (409)"
            - "duplicate (carrier, program_year) -> ERR_DUPLICATE_TESTING_PERIOD (409); a different program_year succeeds"

      - name: second_open_upgrade_request_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_UPGRADE_REQUEST_EXISTS]"]
        distinguishing_aspect: "With cooling-off elapsed (temporal check passes), the one-open-request constraint fires: a second SUBMITTED request -> ERR_OPEN_UPGRADE_REQUEST_EXISTS."
        test_recipe:
          setup: ["carrier CONDITIONAL (audit 0/2 closed, cooling-off 2027-01-28); clock 2027-02-01; request R1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2336", legal_name: "Open Req Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au}/issue-findings", payload: { acute_count: 0, critical_count: 2 }, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au}/close", payload: {}, as: SafetyDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "first" }, as: SafetyManager, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "second" }, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_UPGRADE_REQUEST_EXISTS (409) — constraint fires once the temporal gate passes"

      - name: corrective_action_on_pass_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CORRECTIVE_ACTION_NOT_APPLICABLE]"]
        distinguishing_aspect: "begin-corrective-action requires an adverse proposed outcome: on a SATISFACTORY review it returns ERR_CORRECTIVE_ACTION_NOT_APPLICABLE."
        test_recipe:
          setup: ["carrier; COMPLIANCE_REVIEW audit in FINDINGS_ISSUED with proposed_outcome SATISFACTORY (0 acute, 1 critical)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2337", legal_name: "Corrective Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au}/issue-findings", payload: { acute_count: 0, critical_count: 1 }, as: SafetyAdmin }
