            - "before the sweep: DeviceModel.${m_a}.reserved_slot_count == 1, InstallmentLoan.${loan}.upgrade_hold_flag == true, UpgradeRequest.${ur1}.status == TRADE_IN_DECLARED, TradeIn.${ti1}.status == DECLARED, DeviceUnit.${dev}.possession_status == RETURN_PENDING"
            - "the daily-run response has expired_upgrade_request_count == 1, expired_quote_count == 0, defaulted_loan_count == 0, late_fees_assessed_cents == 0"
            - "UpgradeRequest.${ur1}.status == EXPIRED"
            - "DeviceModel.${m_a}.reserved_slot_count == 0 (the slot is handed back, not leaked)"
            - "InstallmentLoan.${loan}.upgrade_hold_flag == false"
            - "TradeIn.${ti1}.status == CANCELLED"
            - "DeviceUnit.${dev}.possession_status == WITH_CUSTOMER with returned_at == null"
            - "DeviceUnit.${dev}.activation_status == ACTIVATED and unlock_status == LOCKED (only the possession dimension was rolled back)"
            - "InstallmentLoan.${loan}.status == ACTIVE, delinquency_state == CURRENT, days_past_due == 0, paid_installment_count == 12"
            - "the second POST /upgrade-requests returns HTTP 201, proving the capacity-1 slot was truly released"
            - "UpgradeRequest.${ur2}.fulfillment_window_start == 2027-07-04T00:00:00Z and fulfillment_window_end == 2027-07-11T00:00:00Z"
            - "UpgradeRequest.${ur2}.status == TRADE_IN_DECLARED after the re-declaration, with eligibility_ratio_bps == 5000 and paid_installment_count_at_request == 12"
            - "DeviceModel.${m_a}.reserved_slot_count == 1 again and InstallmentLoan.${loan}.upgrade_hold_flag == true again"
            - "TradeIn.${ti2}.status == DECLARED with credit_estimate_cents == 38250 and DeviceUnit.${dev}.possession_status == RETURN_PENDING"
            - "GET /upgrade-requests?loan_id=${loan} returns total_count == 2 with statuses EXPIRED and TRADE_IN_DECLARED"
