            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-SOD-1", full_name: "Sod Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${mgr}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", av: "$.data[0].version" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 5, reason: "self grant", expected_assignment_version: "${av}" }, as: Manager, as_user_id: "${mgr}", captures: { err: "$.data.error_id" } }
          assert:
