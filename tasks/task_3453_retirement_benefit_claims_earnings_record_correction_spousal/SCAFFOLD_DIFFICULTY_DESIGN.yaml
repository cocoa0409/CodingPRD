scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: wep_vs_standard_pia_divergence
    grounds:
    - calculations.pia_bend_point
    - calculations.wep_adjusted_pia
    - entities.Worker.fields.noncovered_pension_monthly_cents
    distinguishing_aspect: Two workers with byte-identical earnings records (3 years 2021-2023 posted at AWI, AIME 13900) produce different PIAs
      because the WEP variant applies tier-1 factor 0.40 (YOC=3 < 30) while the standard variant keeps 0.90; the WEP guarantee (pension 60000/2
      = 30000) does NOT bind since the reduction 6950 is smaller. This dual variant lives in the retirement-benefit domain (Worker/claim PIA).
    test_recipe:
      setup:
      - 'Worker std: born 1964-06, no non-covered pension, earnings 2021-2023 each posted at AWI(y)'
      - 'Worker wep: born 1964-06, non-covered pension 60000/month from 2025-01, identical earnings'
      - Logical clock at startup default 2026-09-01T00:00:00Z; both claims entitled 2026-06 (age 744)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Std Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w_std: $.data.id
          w_std_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_std}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_std}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_std}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/workers
        payload:
          full_name: Wep Worker
          birth_year: 1964
          birth_month: 6
          noncovered_pension_monthly_cents: 60000
          noncovered_pension_start_month: 2025-01
        as: ClaimsSpecialist
        captures:
          w_wep: $.data.id
          w_wep_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_wep}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_wep}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_wep}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w_std}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w_std}
        captures:
          c_std: $.data.id
      - call: POST /ssa/claims
        payload:
          worker_id: ${w_wep}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w_wep}
        captures:
          c_wep: $.data.id
      trigger:
      - call: POST /ssa/claims/${c_std}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/claims/${c_wep}/approve
        payload: {}
        as: ClaimsSpecialist
      assert:
      - BenefitClaim.${c_std}.pia_cents == 12510 (standard variant)
      - BenefitClaim.${c_std}.monthly_benefit_cents == 8750
      - 'BenefitClaim.${c_wep}.pia_cents == 5560 (WEP variant: 0.40 tier-1 factor)'
      - BenefitClaim.${c_wep}.monthly_benefit_cents == 3890
      - Both claims have aime_cents == 13900 — identical inputs, variant selection driven solely by pension presence
  - name: chronological_vs_proportional_withholding
    grounds:
    - calculations.overpayment_withholding
    - entities.BenefitClaim.fields.recovery_mode
    - entities.OverpaymentCase.fields.recovered_cents
    distinguishing_aspect: 'Identical debts (case A 30000 created first, case B 20000) and identical capacity (monthly benefit 12510) allocate
      differently: FULL chronological mode drains oldest-first (A 12510, B 0) while PROPORTIONAL mode splits pro-rata with dime reconciliation
      to the earliest case (A 7510, B 5000). This dual variant lives in the overpayment-debt domain (OverpaymentCase), a different entity domain
      from the PIA variant.'
    test_recipe:
      setup:
      - 'Worker fa: born 1964-06, 3 earnings years (2021-2023 at AWI), RETIREMENT entitled 2031-06 at FRA -> monthly 12510'
      - 'Worker fb: identical record'
      - Each claim carries overpayment case A (30000, created first) and case B (20000), both past the 30-day waiver window
      - fa's claim recovery_mode FULL; fb's claim recovery_mode PROPORTIONAL
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Full Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w_fa: $.data.id
          w_fa_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fa}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fa}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fa}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w_fa}
          claim_type: RETIREMENT
          entitlement_month: 2031-06
        as: Claimant
        as_user_id: ${w_fa}
        captures:
          c_fa: $.data.id
      - call: POST /ssa/workers
        payload:
          full_name: Prop Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w_fb: $.data.id
          w_fb_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fb}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fb}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w_fb}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w_fb}
          claim_type: RETIREMENT
          entitlement_month: 2031-06
        as: Claimant
        as_user_id: ${w_fb}
        captures:
          c_fb: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2031-06-10T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/claims/${c_fa}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/claims/${c_fb}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${c_fa}
          amount_cents: 30000
          period_start_month: 2031-06
          period_end_month: 2031-06
          reason: REPORTING_ERROR
        as: ClaimsSpecialist
        captures:
          oc_fa_a: $.data.id
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${c_fa}
          amount_cents: 20000
          period_start_month: 2031-06
          period_end_month: 2031-06
          reason: SYSTEM_ERROR
        as: ClaimsSpecialist
        captures:
          oc_fa_b: $.data.id
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${c_fb}
          amount_cents: 30000
          period_start_month: 2031-06
          period_end_month: 2031-06
          reason: REPORTING_ERROR
        as: ClaimsSpecialist
        captures:
          oc_fb_a: $.data.id
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${c_fb}
          amount_cents: 20000
          period_start_month: 2031-06
          period_end_month: 2031-06
          reason: SYSTEM_ERROR
        as: ClaimsSpecialist
        captures:
          oc_fb_b: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2031-07-15T00:00:00Z'
        as: ProgramAdministrator
      - call: POST /ssa/overpayment-cases/${oc_fa_a}/begin-recovery
        payload:
          recovery_mode: FULL
        as: ClaimsSpecialist
      - call: POST /ssa/overpayment-cases/${oc_fa_b}/begin-recovery
        payload:
          recovery_mode: FULL
        as: ClaimsSpecialist
      - call: POST /ssa/overpayment-cases/${oc_fb_a}/begin-recovery
        payload:
          recovery_mode: PROPORTIONAL
        as: ClaimsSpecialist
      - call: POST /ssa/overpayment-cases/${oc_fb_b}/begin-recovery
        payload:
          recovery_mode: PROPORTIONAL
        as: ClaimsSpecialist
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2031-08-01T00:00:00Z'
        as: ProgramAdministrator
      trigger:
      - call: POST /_batch/run-monthly-cycle
        payload:
          run_month: 2031-08
        as: ProgramAdministrator
      assert:
      - 'Worker fa claim payment (month 2031-08): gross_cents == 12510, withheld_cents == 12510, net_paid_cents == 0, status == WITHHELD_FULL'
      - OverpaymentCase.${oc_fa_a}.recovered_cents == 12510 (oldest drained first); .${oc_fa_b}.recovered_cents == 0
      - 'Worker fb claim payment (month 2031-08): withheld_cents == 12510, net_paid_cents == 0'
      - OverpaymentCase.${oc_fb_a}.recovered_cents == 7510 (dime_floor(12510*30000/50000)=7500 plus 10-cent residual as earliest created_at)
      - OverpaymentCase.${oc_fb_b}.recovered_cents == 5000
- rule_id: combinatorial_formula
  instances:
  - name: bend_point_tier_saturation
    grounds:
    - calculations.pia_bend_point
    - calculations.aime_computation
    - calculations.earnings_indexation
    distinguishing_aspect: 'Mode (a): the PIA formula takes >= 3 inputs (AIME, BEND1=103000, BEND2=618000) with non-linear interaction — min(AIME,
      B1) saturates and the 0.32 tier activates. A full 35-year record at AWI level yields AIME 162500 (> B1, < B2) and PIA 111740; a 0.90-flat
      formula would give 146250, so tier saturation is observable.'
    test_recipe:
      setup:
      - 'Worker w1: born 1964-06 (eligibility year 2026), wage reports for every year 1989-2023 each exactly AWI(y)'
      - Every year indexes to exactly 1,950,000 cents (AWI(2024)); top-35 selection keeps all 35 years
      - Claim RETIREMENT entitled 2026-06 (age 744; 60 months early)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Full Career Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w1: $.data.id
          w1_ver: $.data.version
