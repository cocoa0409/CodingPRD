              captures: { g1_status: $.data.status }
            - call: "POST /network/guidance-documents"
              payload: { rule_proposal_id: "${rp}", transaction_code_id: "${tc_web}", title: "Guidance v3", body_ref: "doc://g3", effective_from: "2027-04-01", effective_until: null, supersede_prior: true, expected_transaction_code_version: "${tcv}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "G2's supersede succeeds (201): GuidanceDocument.${g1}.status == SUPERSEDED and TransactionCode.version advanced ${tcv} -> ${tcv2} (= 1 -> 2)"
            - "G3 replaying the stale expected_transaction_code_version ${tcv} fails 412 with ERR_STALE_VERSION"
            - "GuidanceDocument.${g2} remains PUBLISHED"

      - name: server_default_clock_is_2026_09_01
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "With no set_current_utc call at all, the server's logical clock reads exactly 2026-09-01T00:00:00Z — a created participant's created_at starts with 2026-09-01T00:00:00 regardless of the host wall clock."
        test_recipe:
          setup: ["Empty database; the clock endpoint is NEVER called in this test."]
          setup_api_calls: []
          trigger:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          assert:
            - "Participant.${p1}.created_at starts with \"2026-09-01T00:00:00\" — the pinned startup default, not wall-clock time"

  - section: validations
    instances:
      - name: ballot_cast_by_inactive_participant_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_PARTICIPANT_NOT_ACTIVE]
        distinguishing_aspect: "An ONBOARDING participant's VotingDelegate cannot vote: the cast fails 409 ERR_PARTICIPANT_NOT_ACTIVE — only ACTIVE participants are ballot-eligible."
        test_recipe:
          setup: ["P1 registered but left ONBOARDING; WEB code; proposal BALLOTING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Voting Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2027-01-01" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "YEA" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 with data.error_id == ERR_PARTICIPANT_NOT_ACTIVE (P1 is ONBOARDING, never activated)"
            - "no ballot exists for (${rp}, ${p1})"

      - name: audit_start_before_start_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_AUDIT_NOT_STARTED]
        distinguishing_aspect: "An audit scheduled for 2026-10-05 cannot move to IN_PROGRESS on 2026-09-01: 422 ERR_AUDIT_NOT_STARTED."
        test_recipe:
          setup: ["P1 ACTIVE; audit 2026-10-05..2026-10-09 SCHEDULED; clock 2026-09-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/audits"
              payload: { participant_id: "${p1}", start_date: "2026-10-05", end_date: "2026-10-09" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { au1: $.data.id }
          trigger:
            - call: "POST /network/audits/${au1}/transition"
              payload: { to_state: "IN_PROGRESS" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 with data.error_id == ERR_AUDIT_NOT_STARTED"
            - "AuditReport.${au1} remains SCHEDULED"

      - name: web_entry_wrong_authorization_type_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_AUTHORIZATION_REQUIREMENT_VIOLATION]
        distinguishing_aspect: "With account validation satisfied, a WEB entry carrying WRITTEN_SIGNED against the code's ORAL_RECORDED requirement fails 422 ERR_AUTHORIZATION_REQUIREMENT_VIOLATION — the constraint rule is the sole surviving failure."
        test_recipe:
          setup: ["P1 ACTIVE; O1 APPROVED; WEB code; W1; VALID account validation for acct-web-2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/account-validations"
              payload: { originator_id: "${o1}", account_number_hash: "acct-web-2", method: "COMMERCIAL_SERVICE" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
          trigger:
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_web}", amount_cents: 2000, receiver_account_number_hash: "acct-web-2", receiver_name: "R W", authorization_type: "WRITTEN_SIGNED", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 with data.error_id == ERR_AUTHORIZATION_REQUIREMENT_VIOLATION"
