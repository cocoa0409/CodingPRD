              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_MEMBER_NOT_ELIGIBLE"
            - "CarePlan.${cp_id}.plan_status == DRAFT"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: in_person_slot_single_occupancy_capacity
        grounds:
          - validations[priority=8]
          - entities.VisitSlot.fields.booked_count
          - entities.VisitSlot.fields.slot_type
          - errors[ERR_SLOT_UNAVAILABLE]
        distinguishing_aspect: "VisitSlot IN_PERSON interval semantics = aggregate capacity 1: any second booking inside the same [starts_at, ends_at) interval is rejected with ERR_SLOT_UNAVAILABLE regardless of which member. The conflict is capacity-counting on the VisitSlot resource."
        test_recipe:
          setup:
            - "IN_PERSON slot booked once (booked_count=1, FULL). Second ACTIVE member m2 on the same PCP attempts to book the same slot."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC O8a", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr M", npi: "1000000013" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-05T09:00:00Z", ends_at: "2026-06-05T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "o8a1@x.com", full_name: "M O8a1", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m1_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem1_id: "$.data[0].id" }
            - call: "POST /memberships/${mem1_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /visits"
              payload: { member_id: "${m1_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "o8a2@x.com", full_name: "M O8a2", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m2_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m2_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem2_id: "$.data[0].id" }
            - call: "POST /memberships/${mem2_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "GET /visit-slots/${slot_id}"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_v1: $.data.version }
          trigger:
            - call: "POST /visits"
              payload: { member_id: "${m2_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v1}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SLOT_UNAVAILABLE"

      - name: member_double_booked_half_open_overlap_adjacent_ok
        grounds:
          - validations[priority=9]
          - entities.Visit.fields.member_id
          - entities.VisitSlot.fields.starts_at
          - entities.VisitSlot.fields.ends_at
          - errors[ERR_MEMBER_DOUBLE_BOOKED]
        distinguishing_aspect: "Member-schedule interval semantics = half-open [starts_at, ends_at) overlap across the member's own visits: a second visit whose slot OVERLAPS an existing BOOKED one is rejected ERR_MEMBER_DOUBLE_BOOKED, while an ADJACENT slot touching at the boundary (prev.ends_at == next.starts_at) is allowed. Resource is the Member's schedule, semantics differ from IN_PERSON capacity."
        test_recipe:
          setup:
            - "ACTIVE member m on a PCP with three VIRTUAL slots (capacity 5 each): A [09:00,10:00) booked, B [09:30,10:30) overlapping A, C [10:00,11:00) adjacent to A."
          setup_api_calls:
