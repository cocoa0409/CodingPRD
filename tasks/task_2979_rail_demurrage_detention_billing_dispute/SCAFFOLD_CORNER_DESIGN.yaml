        claim_type: priority_ordering
        grounds:
          - validations.priority_40_state_band
          - validations.priority_62_dispute_window
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_invoice_state_409_outranks_expired_dispute_window_422
          rationale: |
            That §1.8 instance already builds the request that violates both
            bands at once and pins the 409 ERR_INVOICE_NOT_DISPUTABLE, plus the
            single-violation control that returns the 422. Repeating it here
            would assert the same two responses.

      - name: safety_and_fiscal_bands_disagree_on_one_release
        claim_type: priority_conflict
        grounds:
          - validations.priority_50_facility_embargo
          - validations.priority_70_credit_hold
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / facility_embargo_409_outranks_customer_credit_hold_402
          rationale: |
            The §1.8 instance embargoes the track AND puts the customer on
            credit hold in one release, pins the 409, then lifts the embargo to
            show the 402 underneath. That is exactly this claim.

      - name: role_band_outranks_the_existence_band
        claim_type: priority_ordering
        grounds:
          - validations.priority_20_role
          - validations.priority_30_path_existence
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / role_forbidden_403_outranks_missing_invoice_404
          rationale: |
            The §1.8 instance sends a wrong-role caller at a non-existent
            invoice id and pins the 403, with the right-role control returning
            the 404. Both orderings are already covered there.

  # ==========================================================================
  # §1.5 Endpoints — shape, status codes and read-side behaviour
  # ==========================================================================
  - section: endpoints
    instances:
      - name: placement_cycle_create_read_and_filtered_list_agree
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/demurrage/placement-cycles
          - endpoints.GET_/demurrage/placement-cycles/{id}
          - endpoints.GET_/demurrage/placement-cycles
        distinguishing_aspect: |
          The create response, the single read and the filtered list must all
          show the same row: 201 then 200 then 200, with the list wrapping it in
          the pagination envelope and the filter narrowing by rail_car_id.
        test_recipe:
          setup:
            - "two ORDERED cycles for two different cars at the same facility"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9P1-CUST", name: "Crud Cinnabar", serving_station_code: "STN91" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9P1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9P1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9P1-CNX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car1_id: $.data.id, car1_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9P1-CNX02", ownership: "PRIVATE" }
              as: RailroadAgent
              captures: { car2_id: $.data.id, car2_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car2_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9P1-B", expected_rail_car_version: "${car2_v}" }
              as: RailroadAgent
              captures: { cyc2_id: $.data.id }
          trigger:
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car1_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9P1-A", expected_rail_car_version: "${car1_v}" }
              as: RailroadAgent
              captures: { cyc1_id: $.data.id }
            - call: "GET /demurrage/placement-cycles/${cyc1_id}"
              payload: {}
              as: RailroadAgent
            - call: "GET /demurrage/placement-cycles?rail_car_id=${car1_id}&limit=10&offset=0"
              payload: {}
              as: RailroadAgent
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "the create returned 201 with movement_status ORDERED, billing_status UNBILLED and version 1"
            - "the single read returned 200 with a body byte-identical to the create's data object"
            - "the filtered list returned 200 with exactly one element, that same id, and total_count 1: the PRIVATE car's cycle is excluded"
            - "the list body carries the declared pagination envelope with limit 10 and offset 0"

      - name: list_pagination_defaults_apply_when_limit_and_offset_are_omitted
        claim_type: standard_crud
