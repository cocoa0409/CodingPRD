# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Corporate Archives & Heritage Program — task 2676
# Every rule_id below is verbatim from SKILL.md §0.5. Every grounds entry
# resolves into SCAFFOLD.yaml §1.1-§1.7. Every asserted formula value is a
# pre-computed literal.
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: appraisal_score_screening_vs_final_diverge_on_one_appraisal
        grounds:
          - calculations.appraisal_score
          - state_machines.AppraisalRecord.DRAFT_to_SCREENED
          - state_machines.AppraisalRecord.SCREENED_to_FINAL
          - entities.AppraisalRecord.fields.screening_score
          - entities.AppraisalRecord.fields.final_score
          - entities.AppraisalRecord.fields.brand_heritage_counted
          - entities.AppraisalRecord.fields.recommended_disposition
        distinguishing_aspect: |
          This instance's dual variant lives on the AppraisalRecord/RecordSeries
          appraisal domain: SCREENING and FINAL read the SAME row and disagree on
          two independent inputs at once (brand_heritage_value admissibility and the
          provenance multiplier), producing 70.00 versus 46.40. Its partner instance
          scores confidentiality risk on the AccessRequest/Requester access domain,
          so the scaffold exhibits dual-variant logic on two different entity domains
          rather than repeating provisional-vs-final on one subject.
        test_recipe:
          setup:
            - "One RetentionSchedule with min_appraisal_score_for_permanent 70.00 and disposition_action DESTROY."
            - "One RecordSeries spanning 1901-1980 (span 80 years, age_bonus capped at 10) with annual_volume_linear_feet 120 (volume_penalty 7), disposition_state ACTIVE."
            - "No TrademarkEvidencePackage exists for the series, so the FINAL variant is not allowed to count brand_heritage_value."
            - "One DRAFT AppraisalRecord with informational_value 8, evidential_value 7, brand_heritage_value 6, uniqueness_factor 5 and provenance_verified false."
            - "Logical clock at its default 2026-08-01T00:00:00Z, which is already past the series' retention_expiry_utc of 1990-12-31T23:59:59.000Z."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "HERI-01", retention_years: 10, disposition_action: "DESTROY", legal_citation: "Corp Records Policy 4.2", min_appraisal_score_for_permanent: 70.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Founder Correspondence", business_unit: "CORP", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 120, earliest_record_year: 1901, latest_record_year: 1980 }
              as: Archivist
              captures: { series_id: $.data.id, series_v: $.data.version }
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 8, evidential_value: 7, brand_heritage_value: 6, uniqueness_factor: 5, provenance_verified: false, expected_series_version: "${series_v}" }
              as: Archivist
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /appraisals/${appr_id}/screen"
              payload: {}
              as: Archivist
              captures: { screen_score: $.data.screening_score }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: ArchivesDirector
              captures: { final_score: $.data.final_score }
          assert:
            - "AppraisalRecord.${appr_id}.screening_score == 70.00"
            - "AppraisalRecord.${appr_id}.final_score == 46.40"
            - "AppraisalRecord.${appr_id}.status == FINAL"
            - "AppraisalRecord.${appr_id}.brand_heritage_counted == false"
            - "AppraisalRecord.${appr_id}.recommended_disposition == DESTROY"
            - "RecordSeries.${series_id}.disposition_state == ELIGIBLE_FOR_DISPOSITION"
            - "RecordSeries.${series_id}.current_appraisal_id == ${appr_id}"

      - name: confidentiality_risk_prelim_vs_post_screen_diverge_on_one_request
        grounds:
          - calculations.confidentiality_risk_score
          - entities.AccessRequest.fields.prelim_risk_score
          - entities.AccessRequest.fields.post_screen_risk_score
          - entities.RecordSeries.fields.sensitivity_ceiling
          - entities.ArchivalItem.fields.sensitivity_level
          - state_machines.ConfidentialityScreening.OPEN_to_COMPLETED
        distinguishing_aspect: |
          This instance's dual variant lives on the AccessRequest/Requester access
          domain and diverges because PRELIM substitutes the series' sensitivity_ceiling
          (CONFIDENTIAL, weight 35) for the holdings while POST_SCREEN reads the actual
          item sensitivities (INTERNAL, weight 15): 80 versus 60 on identical data.
          Its partner instance is a historical-value score on AppraisalRecord, a
          different entity domain and a different metric.
        test_recipe:
          setup:
            - "A RecordSeries with sensitivity_ceiling CONFIDENTIAL whose single accessioned ArchivalItem carries sensitivity_level INTERNAL."
            - "A MEDIA-class Requester with nda_on_file false."
            - "One AccessRequest over that single item, moved into SCREENING with an OPEN ConfidentialityScreening."
            - "No legal hold anywhere, so the POST_SCREEN hold surcharge is 0."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "PRESS-01", retention_years: 7, disposition_action: "REVIEW", legal_citation: "Media Policy 1.1", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Advertising Campaign Files", business_unit: "MKTG", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 40, earliest_record_year: 1975, latest_record_year: 1999 }
              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "VAULT-A", temperature_c: 17.0, relative_humidity_pct: 45.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Marketing Department", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 3 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "AD-BOX-1", unit_count: 3, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Transferred from Marketing shared drive inventory", transfer_instrument_reference: "IT-2026-014" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /requesters"
              payload: { display_name: "Jo Reporter", requester_class: "MEDIA", affiliation: "Metro Daily", nda_on_file: false }
              as: AccessServicesOfficer
              captures: { req_user_id: $.data.id }
            - call: "POST /access-requests"
              payload: { requester_id: "${req_user_id}", record_series_id: "${series_id}", purpose: "Feature on the company centenary", requested_item_ids: ["${item_id}"] }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ar_id: $.data.id, prelim: $.data.prelim_risk_score }
            - call: "POST /access-requests/${ar_id}/begin-screening"
              payload: {}
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { ar_v: $.data.version }
            - call: "POST /confidentiality-screenings"
              payload: { access_request_id: "${ar_id}", expected_access_request_version: "${ar_v}" }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /confidentiality-screenings/${scr_id}/complete"
              payload: { decision: "GRANT_FULL", redaction_required: false, screening_note: "No restricted material identified" }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
          assert:
            - "AccessRequest.${ar_id}.prelim_risk_score == 80"
            - "AccessRequest.${ar_id}.post_screen_risk_score == 60"
            - "ConfidentialityScreening.${scr_id}.max_item_sensitivity == INTERNAL"
            - "ConfidentialityScreening.${scr_id}.status == COMPLETED"
            - "AccessRequest.${ar_id}.status == SCREENING"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: access_service_fee_per_line_rounding_order_pinned
        grounds:
          - calculations.access_service_fee
          - state_machines.AccessRequest.SCREENING_to_APPROVED
          - entities.AccessRequest.fields.requested_page_count
          - entities.AccessRequest.fields.service_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. Three line
          items of 22, 22 and 66 pages at the MEDIA rate of 90 cents/page inside the
          7.5% tier round per line to 1832 + 1832 + 5495 = 9159, whereas the rejected
          sum-then-round order yields 9158; the scaffold pins per-line-first, so the
          answer is 26659 and not 26658. Its partner instances are mode (c) (pinned
          six-step evaluation order on migration_job_cost) and mode (a) (nested
          min/floor/clamp interaction on appraisal_score), so the three sit in three
          different modes.
        test_recipe:
          setup:
            - "One Accession with declared_unit_count 10 processed into exactly three ArchivalItems created in this order: unit_count 2, unit_count 2, unit_count 6 (created_at ASC is the billing order)."
            - "All three items carry sensitivity_level INTERNAL and the series' sensitivity_ceiling is INTERNAL, so the POST_SCREEN score is 45 + 15 = 60, below RISK_REDACTION_THRESHOLD 75 and therefore eligible for FULL scope."
            - "A MEDIA-class Requester with nda_on_file false; requested_page_count is 11 * (2+2+6) = 110, landing in the 101..500 tier at 0.075."
            - "The request cites no finding aid (finding_aid_id null), so the publication gate does not apply."
            - "Screening was opened and completed with GRANT_FULL by user officer-a; the approval is performed by user officer-b to satisfy segregation of duties."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "FEE-01", retention_years: 12, disposition_action: "REVIEW", legal_citation: "Access Fee Schedule 2.0", min_appraisal_score_for_permanent: 85.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Product Launch Photography", business_unit: "MKTG", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 20, earliest_record_year: 1980, latest_record_year: 2005 }
              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "VAULT-B", temperature_c: 16.5, relative_humidity_pct: 42.0, max_overlapping_migration_jobs: 3 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Brand Studio", transfer_instrument: "DEED_OF_GIFT", declared_unit_count: 10 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "PH-BOX-1", unit_count: 2, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item1_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "PH-BOX-2", unit_count: 2, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item2_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "PH-BOX-3", unit_count: 6, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item3_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Studio deed of gift with itemised container list", transfer_instrument_reference: "DOG-2026-002" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /requesters"
              payload: { display_name: "Ada Broadcast", requester_class: "MEDIA", affiliation: "National Wire", nda_on_file: false }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { req_user_id: $.data.id }
            - call: "POST /access-requests"
              payload: { requester_id: "${req_user_id}", record_series_id: "${series_id}", purpose: "Anniversary broadcast segment", requested_item_ids: ["${item1_id}", "${item2_id}", "${item3_id}"] }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ar_id: $.data.id, pages: $.data.requested_page_count }
            - call: "POST /access-requests/${ar_id}/begin-screening"
              payload: {}
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { ar_v: $.data.version }
            - call: "POST /confidentiality-screenings"
              payload: { access_request_id: "${ar_id}", expected_access_request_version: "${ar_v}" }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { scr_id: $.data.id }
            - call: "POST /confidentiality-screenings/${scr_id}/complete"
              payload: { decision: "GRANT_FULL", redaction_required: false }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /access-requests/${ar_id}/approve"
              payload: { approval_scope: "FULL" }
              as: AccessServicesOfficer
              as_user_id: "officer-b"
              captures: { fee: $.data.service_fee_cents }
          assert:
            - "AccessRequest.${ar_id}.requested_page_count == 110"
            - "AccessRequest.${ar_id}.post_screen_risk_score == 60"
            - "AccessRequest.${ar_id}.service_fee_cents == 26659"
            - "AccessRequest.${ar_id}.status == APPROVED"
            - "AccessRequest.${ar_id}.approval_scope == FULL"
            - "AccessRequest.${ar_id}.decided_by == officer-b"

      - name: migration_job_cost_six_step_order_pinned
        grounds:
          - calculations.migration_job_cost
          - entities.MigrationJob.fields.subtotal_cents
          - entities.MigrationJob.fields.volume_discount_pct
          - entities.MigrationJob.fields.discounted_cents
          - entities.MigrationJob.fields.handling_fee_cents
          - entities.MigrationJob.fields.condition_surcharge_cents
          - entities.MigrationJob.fields.committed_cost_cents
        distinguishing_aspect: |
          Mode (c) — the tier lookups look circular (the handling fee is keyed on the
          discounted amount, and it is tempting to re-derive the volume discount from a
          net that already includes the fee), so the scaffold pins six steps and step 2
          reads step 1 only. MAGNETIC_TAPE x 40 units in FAIR condition must yield
          exactly 168000 -> 0.06 -> 157920 -> 9000 -> 8346 -> 175266, which is not
          reproducible by any other evaluation order. Its partners are mode (b)
          (per-line rounding order) and mode (a) (nested min/floor/clamp).
        test_recipe:
          setup:
            - "A COMPLIANT StorageZone holding one ACCESSIONED ArchivalItem with original_format MAGNETIC_TAPE, unit_count 40 and condition_grade FAIR."
            - "An ACTIVE PreservationPlan on that zone with budget_cents 300000 and at_risk_unit_count 40."
            - "No migration job exists yet, so budget_committed_cents is 0."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "AV-01", retention_years: 20, disposition_action: "TRANSFER", legal_citation: "AV Retention 3.1", min_appraisal_score_for_permanent: 75.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Corporate Video Masters", business_unit: "COMMS", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 15, earliest_record_year: 1988, latest_record_year: 2001 }
              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "AV-COLD", temperature_c: 12.0, relative_humidity_pct: 35.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Communications Department", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 40 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "TAPE-PALLET-1", unit_count: 40, condition_grade: "FAIR", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Departmental transfer with tape log", transfer_instrument_reference: "IT-2026-021" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /preservation-plans"
              payload: { storage_zone_id: "${zone_id}", plan_name: "AV Reformatting 2026", budget_cents: 300000 }
              as: PreservationOfficer
              captures: { plan_id: $.data.id }
            - call: "POST /preservation-plans/${plan_id}/activate"
              payload: {}
              as: PreservationOfficer
          trigger:
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${item_id}", target_format: "PRESERVATION_MKV", units: 40, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { job_id: $.data.id }
          assert:
            - "MigrationJob.${job_id}.subtotal_cents == 168000"
            - "MigrationJob.${job_id}.volume_discount_pct == 0.06"
            - "MigrationJob.${job_id}.discounted_cents == 157920"
            - "MigrationJob.${job_id}.handling_fee_cents == 9000"
            - "MigrationJob.${job_id}.condition_surcharge_cents == 8346"
            - "MigrationJob.${job_id}.committed_cost_cents == 175266"
            - "MigrationJob.${job_id}.status == PENDING_APPROVAL"
            - "PreservationPlan.${plan_id}.budget_committed_cents == 0"
            - "PreservationPlan.${plan_id}.at_risk_unit_count == 40"

      - name: appraisal_score_nested_min_floor_clamp_interaction
        grounds:
          - calculations.appraisal_score
          - entities.RecordSeries.fields.earliest_record_year
          - entities.RecordSeries.fields.latest_record_year
          - entities.RecordSeries.fields.annual_volume_linear_feet
          - state_machines.AppraisalRecord.DRAFT_to_SCREENED
          - state_machines.AppraisalRecord.SCREENED_to_FINAL
        distinguishing_aspect: |
          Mode (a) — four weighted inputs interact non-linearly through
          min(10, floor(span/5)), a conditional volume gate at exactly
          VOLUME_PENALTY_FLOOR_LF, max(0, min(15, ...)) and a final clamp to [0,100].
          An 80-year span would earn floor(80/5) = 16 age points but the min caps it at
          10, and annual_volume_linear_feet of exactly 50 sits ON the penalty floor so
          the penalty is 0, not 0-and-a-bit: screening_score is 77.00, not 83.00.
          Its partners are mode (b) and mode (c), which turn on rounding order and
          evaluation order rather than on formula shape.
        test_recipe:
          setup:
            - "A RetentionSchedule with min_appraisal_score_for_permanent 80.00 and disposition_action REVIEW."
            - "A RecordSeries spanning 1901-1980 with annual_volume_linear_feet exactly 50, i.e. exactly on VOLUME_PENALTY_FLOOR_LF."
            - "No TrademarkEvidencePackage for the series."
            - "A DRAFT AppraisalRecord with informational_value 8, evidential_value 7, brand_heritage_value 6, uniqueness_factor 5 and provenance_verified true."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "AGE-01", retention_years: 7, disposition_action: "REVIEW", legal_citation: "Historic Records Policy 9.4", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Board Minute Books", business_unit: "CORP", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 50, earliest_record_year: 1901, latest_record_year: 1980 }
              as: Archivist
              captures: { series_id: $.data.id, series_v: $.data.version }
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 8, evidential_value: 7, brand_heritage_value: 6, uniqueness_factor: 5, provenance_verified: true, expected_series_version: "${series_v}" }
              as: Archivist
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /appraisals/${appr_id}/screen"
              payload: {}
              as: Archivist
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: ArchivesDirector
          assert:
            - "AppraisalRecord.${appr_id}.screening_score == 77.00"
            - "AppraisalRecord.${appr_id}.final_score == 65.00"
            - "AppraisalRecord.${appr_id}.brand_heritage_counted == false"
            - "AppraisalRecord.${appr_id}.recommended_disposition == REVIEW"
            - "RecordSeries.${series_id}.disposition_state == ELIGIBLE_FOR_DISPOSITION"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: access_request_revision_cycle_returns_to_screening
        grounds:
          - state_machines.AccessRequest.SCREENING_to_CHANGES_REQUESTED
          - state_machines.AccessRequest.CHANGES_REQUESTED_to_SCREENING
          - state_machines.ConfidentialityScreening.COMPLETED_to_SUPERSEDED
          - entities.AccessRequest.fields.revision_round
          - calculations.confidentiality_risk_score
        distinguishing_aspect: |
          A true cycle on ONE entity: AccessRequest leaves SCREENING for
          CHANGES_REQUESTED and comes back to SCREENING, so the same state is occupied
          twice in one lifetime and revision_round is the loop counter. Re-entry is
          driven by the Requester (not staff), the already-COMPLETED screening is
          retired to SUPERSEDED with superseded_reason REQUESTER_REVISION, and the
          PRELIM variant re-runs on the narrowed item set. This is a same-entity loop;
          its partners are a two-independent-axes machine (OralHistoryInterview) and a
          fork-join machine (DeaccessionProposal), i.e. three different entities and
          three different non-linear shapes.
        test_recipe:
          setup:
            - "A RecordSeries with sensitivity_ceiling INTERNAL holding two ACCESSIONED ArchivalItems of unit_count 2 and unit_count 6."
            - "An EXTERNAL_RESEARCHER Requester with nda_on_file false, so PRELIM is 30 + 15 - 0 = 45."
            - "An AccessRequest over BOTH items: requested_page_count 11 * 8 = 88, revision_round 0."
            - "A ConfidentialityScreening opened and completed with decision CHANGES_REQUESTED, which pushed the request SCREENING -> CHANGES_REQUESTED."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "REV-01", retention_years: 15, disposition_action: "REVIEW", legal_citation: "Reference Services Policy 4.2", min_appraisal_score_for_permanent: 72.00 }
              as: ArchivesDirector
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Plant Engineering Drawings", business_unit: "OPS", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 30, earliest_record_year: 1955, latest_record_year: 1999 }
              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "STACK-1", temperature_c: 17.0, relative_humidity_pct: 45.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Operations Records Centre", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 8 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
