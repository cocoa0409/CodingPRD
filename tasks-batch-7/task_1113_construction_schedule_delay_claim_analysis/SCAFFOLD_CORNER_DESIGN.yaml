  # =======================================================================
  # Section: validations
  # =======================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Request without X-User-Role header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /construction-projects"
              payload: { project_name: "X", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER OR ERR_INSUFFICIENT_PERMISSIONS (Anonymous lacks ContractorScheduler role)"

      - name: cycle_detected_on_relationship_insert
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_CYCLE_DETECTED]
        excluded_because:
          difficulty_instance: business_safety_vs_business_fiscal_on_relationship
          rationale: "Already covered as the failure path of the named §1.8 instance."

      - name: empty_schedule_submit_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMPTY_SCHEDULE]
          - state_machines.ScheduleVersion.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submitting a ScheduleVersion with zero activities fails with ERR_EMPTY_SCHEDULE."
        test_recipe:
          setup: ["Project + DRAFT BASELINE with NO activities"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EMPTY_SCHEDULE"

      - name: requested_days_exceed_entitlement
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_REQUESTED_DAYS_EXCEED_ENTITLEMENT]
        distinguishing_aspect: "EOT requesting more days than the apportioned entitlement is rejected at priority 12."
        test_recipe:
          setup: ["Project; TIA_ACCEPTED DelayEvent with apportioned_excusable+compensable = 5; EOT requesting 10"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-05-10T00:00:00Z", event_end_date: "2026-05-15T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 9999 }
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REQUESTED_DAYS_EXCEED_ENTITLEMENT (requested exceeds apportioned entitlement)"

      - name: invalid_partial_days_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_PARTIAL_DAYS]
          - state_machines.TimeExtensionRequest.UNDER_REVIEW_to_PARTIALLY_APPROVED
        distinguishing_aspect: "partial-approve with approved_days == requested_days is rejected (must be strictly less)."
        test_recipe:
          setup: ["EOT in UNDER_REVIEW with requested_days=5"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-05-10T00:00:00Z", event_end_date: "2026-05-15T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
