              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "PLT_POOL", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-801", product_type: "PLT_POOL", abo_type: "O", rh_type: "NEG", volume_ml: 200, collected_at: "2026-08-06T00:00:00Z", donor_id: "D-860", lot_number: "LOT-8D", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BloodBankSupervisor
          trigger:
            - call: "POST /blood-bank/_clock/sweep"
              as: BloodBankSupervisor
              captures: { sw_units: $.data.units_expired_count }
            - call: "GET /blood-bank/wastage-summary?product_type=PLT_POOL"
              as: BloodBankSupervisor
          assert:
            - "sweep: units_expired_count == 1 (PLT_POOL expired 2026-08-11T00:00:00Z, now past it)"
            - "bucket PLT_POOL:O:NEG in the summary: wasted_count == 1 (wastage created 2026-09-15, inside the window [2026-08-16, 2026-09-15])"
            - "received_count == 0 (the unit's created_at 2026-08-10 falls outside the window)"
            - "wastage_rate == 0.0000 and excessive == false (empty denominator pinned to 0.0000)"

