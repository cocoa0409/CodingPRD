scaffold_corner_design:
- section: entities
  instances:
  - name: create_patient_returns_201_all_fields
    claim_type: Creation
    grounds:
    - entities.Patient
    - endpoints
    distinguishing_aspect: POST patients with mrn, full_name, payer_policy_id returns 201, status INTAKE, latest_wound_area_cm2 default 0, and server-minted id/created_at.
    test_recipe:
      setup:
      - Center + payer policy exist.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      trigger:
      - call: POST /wound-care/patients
        payload:
          mrn: MRN-1
          full_name: Ann
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      assert:
      - response.status == 201
      - Patient.${patient_id}.status == INTAKE
      - Patient.${patient_id}.latest_wound_area_cm2 == 0
  - name: get_patient_not_found_returns_404
    claim_type: Not Found
    grounds:
    - entities.Patient
    - errors[ERR_PATIENT_NOT_FOUND]
    distinguishing_aspect: GET patient with an unknown UUID returns ERR_PATIENT_NOT_FOUND (404).
    test_recipe:
      setup:
      - Center exists; no such patient.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      trigger:
      - call: GET /wound-care/patients/00000000-0000-0000-0000-000000000000
        payload: {}
        as: IntakeCoordinator
        captures:
          err: $.data.error_id
      assert:
      - response.status == 404
      - response.data.error_id == ERR_PATIENT_NOT_FOUND
  - name: create_assessment_missing_required_field_returns_400
    claim_type: Required Fields
    grounds:
    - entities.WoundAssessment
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST wound-assessment omitting stage returns ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - Center, WOUND clinician, patient exist.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M
          full_name: P
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      trigger:
      - call: POST /wound-care/wound-assessments
        payload:
          length_cm: 2
          width_cm: 2
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          err: $.data.error_id
      assert:
      - response.status == 400
      - response.data.error_id == ERR_INVALID_REQUEST
  - name: create_assessment_bad_enum_stage_returns_400
    claim_type: Type Constraints
    grounds:
    - entities.WoundAssessment.fields.stage
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST wound-assessment with stage 'STAGE_9' (not in enum) returns ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - Center, WOUND clinician, patient exist.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M
          full_name: P
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      trigger:
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_9
          length_cm: 2
          width_cm: 2
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          err: $.data.error_id
      assert:
      - response.status == 400
      - response.data.error_id == ERR_INVALID_REQUEST
  - name: create_hbo_session_window_end_before_start_returns_400
    claim_type: Type Constraints
    grounds:
    - entities.HboSession.fields.window_end
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST hbo-session with window_end <= window_start returns ERR_INVALID_REQUEST (400), before any overlap/coverage checks.
    test_recipe:
      setup:
      - Plan ACTIVE + COVERED with a chamber; session windows inverted.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Tech H
          role_kind: HYPERBARIC
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          ht_id: $.data.id
      - call: POST /wound-care/chambers
        payload:
          label: CH1
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          chamber_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M
          full_name: P
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_2
          length_cm: 2
          width_cm: 2
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          base_asm_id: $.data.id
      - call: POST /wound-care/referrals
        payload:
          source_provider: GP
          reason: ulcer
          patient_id: ${patient_id}
        as: IntakeCoordinator
        captures:
          ref_id: $.data.id
      - call: POST /wound-care/referrals/${ref_id}/accept
        payload: {}
        as: IntakeCoordinator
      - call: POST /wound-care/treatment-plans
        payload:
          baseline_assessment_id: ${base_asm_id}
          debridement_supply_budget_cents: 100000
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_id: $.data.id
      - call: POST /wound-care/prior-authorizations
        payload:
          requested_hbo_sessions: 2
          clinical_justification: hbo
          treatment_plan_id: ${plan_id}
        as: PayerLiaison
        captures:
          auth_id: $.data.id
      - call: POST /wound-care/prior-authorizations/${auth_id}/approve
        payload: {}
        as: PayerLiaison
      - call: POST /wound-care/treatment-plans/${plan_id}/activate
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: GET /wound-care/treatment-plans/${plan_id}
        payload: {}
        as: HyperbaricTech
        as_user_id: ${ht_id}
        captures:
          plan_v: $.data.version
      trigger:
      - call: POST /wound-care/hbo-sessions
        payload:
          chamber_id: ${chamber_id}
          window_start: '2026-05-02T10:00:00Z'
          window_end: '2026-05-02T09:00:00Z'
          treatment_pressure_ata: 2.4
          expected_plan_version: ${plan_v}
          treatment_plan_id: ${plan_id}
        as: HyperbaricTech
        as_user_id: ${ht_id}
        captures:
          err: $.data.error_id
      assert:
      - response.status == 400
      - response.data.error_id == ERR_INVALID_REQUEST
  - name: system_fields_generated_on_create_input_ignored
    claim_type: System Fields
    grounds:
    - entities.Chamber.fields.occupied_slot_count
    distinguishing_aspect: 'Chamber.occupied_slot_count is computed/system: a create request cannot set it; it is 0 regardless of any client-supplied value.'
    test_recipe:
      setup:
      - Center exists.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      trigger:
      - call: POST /wound-care/chambers
        payload:
          label: CH1
          turnover_buffer_minutes: 15
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          chamber_id: $.data.id
      assert:
      - response.status == 201
      - Chamber.${chamber_id}.occupied_slot_count == 0
      - Chamber.${chamber_id}.turnover_buffer_minutes == 15
  - name: chamber_buffer_default_applied
    claim_type: Defaults
    grounds:
    - entities.Chamber.fields.turnover_buffer_minutes
    distinguishing_aspect: Omitting turnover_buffer_minutes on chamber create applies the default 30.
    test_recipe:
      setup:
      - Center exists.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      trigger:
      - call: POST /wound-care/chambers
        payload:
          label: CH1
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          chamber_id: $.data.id
      assert:
      - response.status == 201
      - Chamber.${chamber_id}.turnover_buffer_minutes == 30
  - name: assessment_immutable_no_version_field
    claim_type: Immutability
    grounds:
    - entities.WoundAssessment
    distinguishing_aspect: WoundAssessment has common_fields:false — its GET response exposes id and created_at but no version field (append-only clinical record).
    test_recipe:
      setup:
      - Center, WOUND clinician, patient, one assessment.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: C
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M
          full_name: P
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_1
          length_cm: 1
          width_cm: 1
          tissue_type: EPITHELIAL
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          asm_id: $.data.id
      trigger:
      - call: GET /wound-care/wound-assessments/${asm_id}
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
      assert:
      - response.status == 200
      - WoundAssessment.${asm_id}.severity_score == 1
      - WoundAssessment.${asm_id} has no version field
