  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unknown_enrollment_outranks_reviewer_mismatch_on_deny
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - errors[ERR_TRANSITION_REVIEWER_MISMATCH]
        distinguishing_aspect: "A deny naming an enrollment that does not exist while also naming the wrong clinician fails on the existence pair (404 ERR_RESOURCE_NOT_FOUND) rather than on the business-safety pair, because existence is checked at priority 3 and the reviewer match only at priority 7."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One clinician on file. No enrollment exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clinicians"
