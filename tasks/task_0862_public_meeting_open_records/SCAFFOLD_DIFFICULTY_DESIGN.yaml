  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_buffered_halfopen_conflict
        grounds:
          - validations[priority=11]
          - entities.Meeting.fields.venue_id
          - entities.Meeting.fields.scheduled_start
        distinguishing_aspect: "Two meetings in the same venue collide because occupancy is the buffered half-open interval [start - SETUP_BUFFER_MINUTES, end): [09:30,11:00) and [10:15,11:45) overlap -> ERR_VENUE_CONFLICT. Interval semantics = buffered half-open, resource = Venue."
        test_recipe:
          setup:
            - "Meeting A booked in venue V for 10:00-11:00; second meeting B in same V for 10:45-11:45 (different presiding member to isolate the venue rule)."
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Council N", jurisdiction_state: "MN", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "Shared V" }
              as: Clerk
              captures: { venue_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M2", seat_number: 2 }
              as: Clerk
              captures: { m2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m1_id}", title: "A", meeting_type: "REGULAR", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { meeting_a: $.data.id }
          trigger:
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${venue_id}", presiding_member_id: "${m2_id}", title: "B", meeting_type: "REGULAR", scheduled_start: "2026-06-01T10:45:00Z", scheduled_end: "2026-06-01T11:45:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VENUE_CONFLICT"
            - "http_status == 409"

      - name: presiding_closed_touching_conflict
        grounds:
          - validations[priority=11]
          - entities.Meeting.fields.presiding_member_id
        distinguishing_aspect: "Two meetings sharing a presiding member collide even when only touching at 11:00 because presiding occupancy is the closed interval [start,end] with no buffer: [10:00,11:00] and [11:00,12:00] share the endpoint -> ERR_PRESIDING_CONFLICT. Interval semantics = closed/unbuffered, resource = BodyMember (distinct from the venue rule)."
        test_recipe:
          setup:
            - "Meeting A with presiding m1 in venue V1 for 10:00-11:00; second meeting B with same m1 in a DIFFERENT venue V2 for 11:00-12:00 (venue differs to isolate the presiding rule)."
          setup_api_calls:
            - call: "POST /public-bodies"
              payload: { name: "Council O", jurisdiction_state: "WI", seat_count: 5, quorum_size: 2 }
              as: Clerk
              captures: { body_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "V1" }
              as: Clerk
              captures: { v1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/venues"
              payload: { name: "V2" }
              as: Clerk
              captures: { v2_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/members"
              payload: { full_name: "M1", seat_number: 1 }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${v1_id}", presiding_member_id: "${m1_id}", title: "A", meeting_type: "REGULAR", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Clerk
              captures: { meeting_a: $.data.id }
          trigger:
            - call: "POST /public-bodies/${body_id}/meetings"
              payload: { venue_id: "${v2_id}", presiding_member_id: "${m1_id}", title: "B", meeting_type: "REGULAR", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRESIDING_CONFLICT"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_conservation_money
        grounds:
          - calculations.fee_ledger
          - calculations.assessed_fee
          - entities.RecordsRequest.fields.amount_waived_cents
          - entities.RecordsRequest.fields.amount_paid_cents
          - entities.RecordsRequest.fields.fee_balance_cents
        distinguishing_aspect: "Conserved quantity = money (cents): after assessed_fee 2800, a waiver of 800 and a payment of 2000, the identity assessed(2800) == waived(800) + paid(2000) + balance(0) holds exactly."
        test_recipe:
          setup:
            - "Request UNDER_REVIEW; docs 30pp/20min + 40pp/50min RELEASED -> assessed 2800; determination GRANTED waiving 800; then payment 2000."
