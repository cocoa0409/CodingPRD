          assert:
            - "both route creates return 201 with route_state == \"OCCUPYING\" and consumed_area_sq_mm == 49.02"
            - "GET /cabling/links/${link} returns routed_segment_count == 2"
            - "GET /cabling/link-routes filtered by link_id ${link} returns total_count == 2 with sequence_index 1 and 2"
            - "GET /cabling/link-routes filtered by pathway_segment_id ${seg_b} returns total_count == 1"
            - "GET /cabling/pathway-segments/${seg_a} returns occupying_route_count == 1 and fill_area_used_sq_mm == 49.02"

