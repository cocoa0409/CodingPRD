      - Complaint.${cmp_id}.pattern_cluster_size == 1
- rule_id: combinatorial_formula
  instances:
  - name: sms_oral_consent_window_clamped_by_nested_min_max
    grounds:
    - calculations.effective_calling_window
    - calculations.recipient_local_minutes
    - entities.ContactAttempt.fields.effective_window_start_minutes
    - entities.ContactAttempt.fields.effective_window_end_minutes
    distinguishing_aspect: 'Mode (a): four inputs (policy bounds, consent_type, channel, recipient offset) interact non-linearly through max(base_start + 60, 480 + 30) and min(base_end - 30, 1260), producing 540/1230 rather than the policy''s 480/1260.'
    test_recipe:
      setup:
      - logical clock at 2026-08-03T16:00:00Z, contact at UTC-420 so recipient local time is exactly 09:00 (540 minutes)
      - CA policy window 08:00-21:00 (480/1260 minutes), ONE_PARTY regime, no holidays
      - ACTIVE SMS consent of type EXPRESS_ORAL (not express written) captured by SMS double opt-in
      - ACTIVE INFORMATIONAL SMS campaign (marketing purpose would additionally demand express written consent)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T16:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA SMS Script
          channel: SMS
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: SMS
          consent_type: EXPRESS_ORAL
          capture_method: SMS_DOUBLE_OPT_IN
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1-sms
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/contacts/${c1_id}/number-status-check
        payload:
          claimed_consent_date: '2026-07-15'
        as: DialerOperator
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/dialer-profiles
        payload:
          mode: PREDICTIVE
          agents_available: 5
          abandonment_limit_pct: 50.0
          amd_enabled: false
          amd_abandon_on_machine: false
          abandon_message_seconds: 2
        as: DialerOperator
        captures:
          dp_id: $.data.id
      - call: POST /compliance/dialer-profiles/${dp_id}/approve
        payload:
          waiver_reference: WVR-2026-0142
        as: ComplianceOfficer
        as_user_id: officer-profile-approver
      - call: POST /compliance/campaigns
        payload:
          name: CA Aug Service Texts
          channel: SMS
          campaign_purpose: INFORMATIONAL
          target_state_codes:
          - CA
          dialer_profile_id: ${dp_id}
          agent_script_id: ${scr_id}
        as: CampaignManager
        captures:
          camp_id: $.data.id
          camp_v: $.data.version
      - call: POST /compliance/scrub-jobs
        payload:
          campaign_id: ${camp_id}
          list_types:
          - NATIONAL
          - INTERNAL
          expected_campaign_version: ${camp_v}
        as: CampaignManager
        captures:
          job_id: $.data.id
      - call: POST /compliance/scrub-jobs/${job_id}/execute
        payload: {}
        as: CampaignManager
      - call: GET /compliance/campaigns/${camp_id}
        payload: {}
        as: CampaignManager
        captures:
          camp_v2: $.data.version
      - call: POST /compliance/campaigns/${camp_id}/launch
        payload:
          certification_note: Certified for CA outreach
          expected_campaign_version: ${camp_v2}
        as: ComplianceOfficer
        as_user_id: officer-launcher
      trigger:
      - call: POST /compliance/contact-attempts
        payload:
          campaign_id: ${camp_id}
          contact_id: ${c1_id}
          channel: SMS
        as: DialerOperator
        captures:
          a1: $.data.id
          a1_lines: $.data.max_lines_snapshot
      assert:
      - ContactAttempt.${a1}.outcome == PENDING (201 Created; 540 is admitted because the window is half-open at the start)
      - ContactAttempt.${a1}.recipient_local_minutes == 540
      - ContactAttempt.${a1}.recipient_local_time == "09:00"
      - ContactAttempt.${a1}.effective_window_start_minutes == 540
      - ContactAttempt.${a1}.effective_window_end_minutes == 1230
      - ContactAttempt.${a1}.calling_window_policy_id == ${pol_ca_id}
      - ContactAttempt.${a1}.consent_record_id == ${cons1_id}
