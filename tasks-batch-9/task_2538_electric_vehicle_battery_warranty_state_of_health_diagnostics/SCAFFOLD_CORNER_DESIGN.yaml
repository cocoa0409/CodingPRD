  - section: errors
    instances:
      - name: unknown_path_ids_each_return_their_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_PACK_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
        distinguishing_aspect: |
          Path-existence is priority 6, ahead of every body and state check, and each resource owns a
          DISTINCT code rather than a shared generic 404. The nested modules route must report the
          parent pack's code, and an action route on a missing row must 404 rather than reporting the
          state error it would have hit next.
        test_recipe:
          setup:
            - "An empty program surface - no rows of any of the probed types need exist."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /battery-warranty/battery-packs/pack_missing"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/battery-packs/pack_missing/modules"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/pack-shipments/ship_missing"
              payload: {}
              as: ProgramAdmin
            - call: "POST /battery-warranty/pack-shipments/ship_missing/tender"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech_missing"
            - call: "GET /battery-warranty/thermal-events/evt_missing"
              payload: {}
              as: RegulatoryLiaison
              as_user_id: "liaison-001"
            - call: "GET /battery-warranty/capacity-disputes/dsp_missing"
              payload: {}
              as: IndependentLab
              as_user_id: "lab-001"
          assert:
            - "the pack read returns 404 ERR_PACK_NOT_FOUND"
            - "the nested modules listing returns 404 ERR_PACK_NOT_FOUND, not an empty 200 array"
            - "the shipment read returns 404 ERR_SHIPMENT_NOT_FOUND"
            - "the tender on the missing shipment returns 404 ERR_SHIPMENT_NOT_FOUND - path existence at priority 6 precedes the priority-34 status check"
            - "the thermal event read returns 404 ERR_EVENT_NOT_FOUND"
            - "the dispute read returns 404 ERR_DISPUTE_NOT_FOUND"
            - "every failure body carries the error envelope shape { error_id, message } under data"

      - name: adjudicator_cannot_weaken_a_cell_delta_pack_recommendation
        claim_type: violation_to_error
        grounds:
          - validations[priority=49]
          - calculations.remedy_decision
          - errors[ERR_REMEDY_OVERRIDE_FORBIDDEN]
        distinguishing_aspect: |
          The override guard is ORDINAL, not equality: on a PACK_REPLACEMENT recommendation whose
          basis is CELL_DELTA both weaker remedies are refused, yet DENIED - which is ordinally
          nothing at all - is explicitly permitted. An implementation that simply pins
          approved_remedy == recommended_remedy would wrongly refuse the denial.
        test_recipe:
          setup:
            - "The canonical chain, with the NEWEST snapshot carrying max_cell_delta_mv 300 so the assessment inherits it and rung 2 of the ladder fires."
            - "No ThermalEvent exists, so rung 1 (THERMAL_HISTORY) cannot pre-empt it."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000531", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C331", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000, max_cell_delta_mv: 40 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000, max_cell_delta_mv: 40 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000, max_cell_delta_mv: 300 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_ver: $.data.version }
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver}", module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /battery-warranty/warranty-claims"
              payload: { vehicle_id: "${veh_id}", service_center_id: "${center_id}", assessment_id: "${asmt_id}", diagnosing_technician_id: "${tech_a_id}" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns"
              payload: { campaign_code: "CMP-OVR-01", target_defect: "CHARGING", software_version: "bms-4.2.1", applies_to_pack_type: "ANY", applies_to_model_code: "MX-70" }
              as: ProgramAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns/${camp_id}/release"
              payload: { release_scope: "FIELD" }
              as: ProgramAdmin
          trigger:
            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "MODULE_REPLACEMENT", override_justification: "cheaper" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "SOFTWARE_REMEDIATION", linked_campaign_id: "${camp_id}" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
            - call: "POST /battery-warranty/warranty-claims/${claim_id}/adjudicate"
              payload: { approved_remedy: "DENIED", decision_note: "owner-induced abuse" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
            - call: "GET /battery-warranty/warranty-programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the assessment reads max_cell_delta_mv 300 (the newest window row, not the mean), retention_pct 70.00 and qualifies_for_claim true"
            - "the claim was filed with recommended_remedy PACK_REPLACEMENT and recommendation_basis CELL_DELTA even though only 2 of 16 modules are faulted"
            - "the MODULE_REPLACEMENT approval returns 422 ERR_REMEDY_OVERRIDE_FORBIDDEN and leaves adjudication_status SUBMITTED"
            - "the SOFTWARE_REMEDIATION approval also returns 422 ERR_REMEDY_OVERRIDE_FORBIDDEN even though it names a genuinely FIELD_RELEASE campaign, and claim.linked_campaign_id stays null"
            - "the DENIED decision returns 200 with adjudication_status DENIED, denial_reason ADJUDICATOR_DECISION, oem_total_cents 0, owner_share_cents 0 and adjudicated_by_user_id adj-001"
            - "the program's accrued_liability_cents is still 0 - a denial accrues nothing"

      - name: s1_event_has_no_regulatory_filing_and_returns_notification_not_required
        claim_type: violation_to_error
        grounds:
          - validations[priority=66]
          - entities.ThermalEvent.fields.notification_status
          - calculations.regulatory_notification_deadline
        distinguishing_aspect: |
          Severity drives the ENTIRE regulatory dimension: an S1 event is born NOT_REQUIRED with a
          null deadline, so the filing endpoint must refuse it as not-required rather than treat the
          absent deadline as an immediately-missed one and file it LATE. No center counter may move.
        test_recipe:
          setup:
            - "One program, one center, one vehicle with an installed pack, one S1 ThermalEvent."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000541", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
