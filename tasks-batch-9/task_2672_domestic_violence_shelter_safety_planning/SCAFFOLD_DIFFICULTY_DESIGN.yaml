          Numeric threshold metric with an inclusive comparison on POST /staff-members/{id}/wellness-checks:
          secondary_trauma_index 70.0 is FROZEN because the test is >= POSTURE_FROZEN_MIN, while 69.9 - one tenth
          of a point below, produced by exposure_hours 19.8 instead of 20.0 - is only RESTRICTED.
        test_recipe:
          setup:
            - "Two HotlineAdvocates exist, Rosa Marin and Bea Cole, both with zero WellnessCheck rows, active_caseload_count 0, secondary_trauma_index 0.0 and wellness_posture OPEN."
            - "One ShelterManager (Dana Whit) exists to record the checks."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z, so a check stamped 2026-08-01T00:00:00Z has days_since 0 and decay factor 1.0."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_x: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Bea Cole", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_y: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
          trigger:
            - call: "POST /staff-members/${adv_x}/wellness-checks"
              payload: { checked_on_utc: "2026-08-01T00:00:00Z", exposure_hours: 20.0, distress_scale: 10, debrief_completed: false }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { wc_x: "$.data.id", points_x: "$.data.contribution_points" }
            - call: "POST /staff-members/${adv_y}/wellness-checks"
              payload: { checked_on_utc: "2026-08-01T00:00:00Z", exposure_hours: 19.8, distress_scale: 10, debrief_completed: false }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { wc_y: "$.data.id", points_y: "$.data.contribution_points" }
          assert:
            - "${points_x} == 70.0 and WellnessCheck.${wc_x}.contribution_points == 70.0"
            - "StaffMember.${adv_x}.secondary_trauma_index == 70.0"
            - "StaffMember.${adv_x}.wellness_posture == FROZEN (70.0 >= POSTURE_FROZEN_MIN 70.0 is inclusive)"
            - "${points_y} == 69.9 and WellnessCheck.${wc_y}.contribution_points == 69.9"
            - "StaffMember.${adv_y}.secondary_trauma_index == 69.9"
            - "StaffMember.${adv_y}.wellness_posture == RESTRICTED"
            - "StaffMember.${adv_x}.active_caseload_count == 0 and StaffMember.${adv_y}.active_caseload_count == 0 (no caseload points contribute)"

