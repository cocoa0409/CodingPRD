            - "Seller.${seller_id}.standalone_strike_points == 0.00 and cluster_strike_points == 0.00 and status == ACTIVE after the refusal"
            - "the RELEASED call returns HTTP 200 with status RELEASED, concluded_at == 2026-08-05T08:00:00Z and findings_ref FND-2"
            - "no strike and no EnforcementCase exist after the release: GET /brand-protection/cases?brand_id=${brand_id} returns total_count 0"
            - "the replayed RELEASED call returns HTTP 409 with data.error_id == ERR_INVALID_STATE and findings_ref is still FND-2"

      - name: case_closed_no_action_is_locked_against_a_second_closure
        claim_type: Idempotency
