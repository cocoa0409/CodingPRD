  - name: milestone_reallocation_preserves_the_fee_sum_around_a_frozen_paid_row
    grounds: calculations.milestone_billing_schedule (FROZEN / OPEN partition, invariant); state_machines.FeeMilestone.INVOICED
      -> PAID; state_machines.Placement.PENDING_ACCEPTANCE -> ACTIVE
    mechanism: 'Confirming the start lowers the fee from the PROVISIONAL 3349500 to the FINAL 3349499 and re-runs
      the allocation. The already-PAID ENGAGEMENT row is FROZEN at 1004850 and must not move, so the remaining 2344649
      is re-spread over the two OPEN rows by weight, with the last OPEN row absorbing the exact remainder: 1004850
      and 1339799. The sum over non-VOIDED rows still equals fee_cents.'
    naive_implementation: Re-allocate all three rows from the new fee (the PAID row would move to 1004850 - correct
      by accident - and a paid row could be silently restated), or leave the OPEN rows untouched so the three amounts
      sum to 3349500 while fee_cents reads 3349499.
