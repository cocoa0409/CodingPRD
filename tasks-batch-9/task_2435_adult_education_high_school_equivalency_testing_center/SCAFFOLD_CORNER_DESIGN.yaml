      - name: credential_composite_exactly_at_the_minimum_then_transcript_charge_tiers
        claim_type: correct_result
        grounds:
          - calculations.credential_eligibility
          - calculations.credential_eligibility.constants.COMPOSITE_MIN
          - calculations.credential_eligibility.constants.PASS_SCORE_PER_SUBTEST
          - calculations.transcript_charge
          - errors[ERR_CREDENTIAL_REQUIREMENTS_NOT_MET]
          - errors[ERR_DUPLICATE_CREDENTIAL]
          - errors[ERR_TRANSCRIPT_ORDER_NOT_QUEUED]
        distinguishing_aspect: |
          Both credential gates sit exactly on their inclusive boundary at once: every subtest is
          exactly 145 and the composite is exactly 580. Before the retake the SOCIAL_STUDIES best is
          144, so issuance is refused; the retake at 145 flips the per-subtest gate AND lands the
          composite precisely on COMPOSITE_MIN. The credential then anchors all three transcript waiver
          tiers (0%, 10%, 20%) and their two state-records fee steps in one run.
        test_recipe:
