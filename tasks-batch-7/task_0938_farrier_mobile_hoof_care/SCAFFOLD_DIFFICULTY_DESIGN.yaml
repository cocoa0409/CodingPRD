  - rule_id: cross_entity_state_dependency
    instances:

      - name: attach_refused_because_the_routes_farrier_is_decertified
        grounds:
          - state_machines.Farrier.ACTIVE_to_DECERTIFIED
          - state_machines.Route.PLANNED_to_CANCELLED
          - validations[priority=28]
          - gate_precedence
          - errors[ERR_FARRIER_INACTIVE]
        distinguishing_aspect: |
          Entity pair Route x Farrier — the Route's own transition is decided by the Farrier's
          status, and because gate 1 outranks gate 2 the caller is told ERR_FARRIER_INACTIVE
          even though the route is simultaneously CANCELLED and would otherwise report
          ERR_ROUTE_NOT_OPEN.
