# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design (breadth coverage index)
#
# Task:   task_2196_catastrophe_response_claim_surge_staffing
# Source: SCAFFOLD.yaml (§1.1 entities, §1.2 state machines, §1.2.1 concurrency rules,
#         §1.3 calculations, §1.4 validations, §1.5 endpoints, §1.6 errors, §1.7 roles)
#
# Taxonomy: references/claim-extraction-guide.md. The guide's nine sections are the
# `section:` values below; its per-section rows are the `claim_type:` values.
#
# Every non-stub instance carries a full structured `test_recipe` whose setup_api_calls
# drive an empty database into the required precondition. Every ${var} is bound by an
# earlier `captures:`; every other value is an author-determined literal. Formula-derived
# asserts are pre-computed literals, never expressions.
#
# `excluded_because:` stubs cite a §1.8 instance by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and carry no test_recipe, per §1.9.
#
# Every call carries X-User-ID (`as_user_id:`) because validations priority 1 requires
# both X-User-Role and X-User-ID on every request.

scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_entity_creation_catastrophe_event_201_envelope_and_initial_state
        claim_type: creation
        grounds:
          - entities.CatastropheEvent
          - endpoints[POST /catastrophe-events]
          - response_envelope.success
        distinguishing_aspect: |
          A single POST with all seven declared required inputs must return 201 inside the declared success
          envelope and stamp the full initial state: status MONITORING (not DECLARED), posture OPEN,
          version 1, declared_at_utc null, and every computed roll-up at its empty-database zero.
        test_recipe:
          setup:
            - "Empty database. Clock at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1001", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-25T00:00:00.000Z", exposure_count: 2000, avg_insured_value: 310000, expected_severity_index: 0.3000 }
              as: CatastropheManager
              as_user_id: "cm_1"
          assert:
            - "response HTTP status == 201"
            - "response.meta.api_request_id is present and non-empty"
            - "response.meta.api_request_timestamp is present and ISO 8601"
            - "response.response_type == object"
            - "response.data.id is a non-empty string"
            - "response.data.cat_code == CAT-2026-1001"
            - "response.data.peril_type == HURRICANE"
            - "response.data.jurisdiction_state == FL"
            - "response.data.event_start_utc == 2026-07-25T00:00:00.000Z"
            - "response.data.exposure_count == 2000"
            - "response.data.avg_insured_value == 310000"
            - "response.data.expected_severity_index == 0.3000"
            - "response.data.status == MONITORING"
            - "response.data.posture == OPEN"
            - "response.data.version == 1"
            - "response.data.declared_at_utc == null"
            - "response.data.open_claim_count == 0"
            - "response.data.case_reserve_total == 0.00"
            - "response.data.paid_total == 0.00"
            - "response.data.incurred_total == 0.00"
            - "response.data.housing_committed_cost == 0.00"
            - "response.data.deployment_settled_cost == 0.00"
            - "response.data.surge_adjuster_count == 0"
            - "response.data.moratorium_active == false"
            - "response.data.created_at == 2026-08-01T00:00:00.000Z"

      - name: corner_entity_retrieval_adjuster_by_id_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Adjuster
          - endpoints[GET /adjusters/{adjusterId}]
          - calculations.adjuster_surge_capacity_score
        distinguishing_aspect: |
          GET by id must echo every stored input field unchanged AND expose the derived axes: a brand-new
          adjuster with zero assignments and zero deployed hours scores exactly 100.00 (availability 100.0,
          credential penalty 0.0 for VALID, fatigue 0.0, cert bonus 10.0, clamped to 100.0).
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One Adjuster created with both certifications true, max_open_claims 12."
          setup_api_calls:
            - call: "POST /adjusters"
              payload: { full_name: "Dana Reyes", employment_type: "INDEPENDENT", home_state: "TX", licensed_states: ["TX", "OK", "LA"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 12, daily_rate: 700, per_diem_rate: 85, desk_certified: true, aerial_certified: true }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
          trigger:
            - call: "GET /adjusters/${adj}"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "response HTTP status == 200"
            - "response.response_type == object"
            - "response.data.id == ${adj}"
            - "response.data.full_name == Dana Reyes"
            - "response.data.employment_type == INDEPENDENT"
            - "response.data.home_state == TX"
            - "response.data.licensed_states == [TX, OK, LA]"
            - "response.data.license_expiry_utc == 2027-06-30T00:00:00.000Z"
            - "response.data.max_open_claims == 12"
            - "response.data.daily_rate == 700"
            - "response.data.per_diem_rate == 85"
            - "response.data.desk_certified == true"
            - "response.data.aerial_certified == true"
            - "response.data.credential_status == VALID"
            - "response.data.deployment_status == AVAILABLE"
            - "response.data.open_assignment_count == 0"
            - "response.data.cumulative_deployed_hours == 0.00"
            - "response.data.last_demobilized_at_utc == null"
            - "response.data.surge_capacity_score == 100.00"
            - "response.data.version == 1"

      - name: corner_entity_listing_claims_pagination_limit_offset_total_count_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /claims]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three claims exist; limit 2 / offset 0 must return 2 rows with total_count 3 and has_more true,
          and limit 2 / offset 2 must return 1 row with total_count 3 and has_more false. total_count counts
          the filtered set, not the page.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1003' (WINTER_STORM, GA) carrying exactly three Claims left in INTAKE."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1003", peril_type: "WINTER_STORM", jurisdiction_state: "GA", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 300, avg_insured_value: 200000, expected_severity_index: 0.0600 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-1003A", loss_state: "GA", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 4000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 500, estimated_damage_amount: 5000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-1003B", loss_state: "GA", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 4000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 500, estimated_damage_amount: 5000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c2: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-1003C", loss_state: "GA", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 4000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 500, estimated_damage_amount: 5000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c3: $.data.id }
          trigger:
            - call: "GET /claims"
              payload: { event_id: "${ev}", limit: 2, offset: 0 }
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "GET /claims"
              payload: { event_id: "${ev}", limit: 2, offset: 2 }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "trigger call 1 response HTTP status == 200"
            - "trigger call 1 response.response_type == array"
            - "trigger call 1 response.data contains exactly 2 rows"
            - "trigger call 1 response.meta.total_count == 3"
            - "trigger call 1 response.meta.has_more == true"
            - "trigger call 1 response.meta.limit == 2"
            - "trigger call 1 response.meta.offset == 0"
            - "trigger call 2 response.data contains exactly 1 row"
            - "trigger call 2 response.meta.total_count == 3"
            - "trigger call 2 response.meta.has_more == false"
            - "trigger call 2 response.meta.offset == 2"
            - "the union of ids across the two pages is exactly {${c1}, ${c2}, ${c3}} with no duplicates"

      - name: corner_entity_not_found_unknown_claim_id_returns_err_claim_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLAIM_NOT_FOUND]
          - endpoints[GET /claims/{claimId}]
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but non-existent claim id must return ERR_CLAIM_NOT_FOUND with HTTP 404 in
          the declared error envelope (response_type "error", data.error_id, data.message) — not 200 with a
          null body and not a generic ERR_VALIDATION.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One real Claim exists so the collection is non-empty and the failure is attributable to the id, not to an empty table."
          setup_api_calls:
            - call: "POST /claims"
              payload: { policy_number: "POL-1004A", loss_state: "FL", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 4000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 500, estimated_damage_amount: 5000 }] }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { real_claim: $.data.id }
          trigger:
            - call: "GET /claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "response HTTP status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_CLAIM_NOT_FOUND"
            - "response.data.message is a non-empty string"
            - "response.meta.api_request_id is present"
            - "GET /claims/${real_claim} still returns 200, proving the collection is reachable"

      - name: corner_entity_required_fields_missing_licensed_states_rejected
        claim_type: required_fields
        grounds:
          - entities.Adjuster.licensed_states
          - validations[priority=15]
          - errors[ERR_VALIDATION]
          - endpoints[POST /adjusters]
        distinguishing_aspect: |
          licensed_states is declared `source: input` with no default, so omitting it must fail the input
          schema check at priority 15 with ERR_VALIDATION (422) and create nothing — whereas the two
          genuinely optional booleans may be omitted freely (covered separately by the defaults instance).
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default. No adjusters exist."
          setup_api_calls: []
          trigger:
            - call: "POST /adjusters"
              payload: { full_name: "No License Listed", employment_type: "STAFF", home_state: "TX", license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 6, daily_rate: 500, per_diem_rate: 50 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "response HTTP status == 422"
            - "response.response_type == error"
            - "response.data.error_id == ERR_VALIDATION"
            - "GET /adjusters returns meta.total_count == 0 — no partial row was written"

      - name: corner_entity_defaults_claim_access_status_and_adjuster_certifications
        claim_type: defaults
        grounds:
          - entities.Claim.access_status
          - entities.Adjuster.desk_certified
          - entities.Adjuster.aerial_certified
          - endpoints[POST /claims]
          - endpoints[POST /adjusters]
        distinguishing_aspect: |
          The scaffold declares exactly three input fields with defaults: Claim.access_status (ACCESSIBLE)
          and Adjuster.desk_certified / aerial_certified (false). Omitting all three must apply those
          defaults, and the defaulted access_status must then feed calculations.claim_triage_severity_score
          with ACCESS_ADJUSTMENT 0.0 — proving the default is materialised, not merely displayed.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1006' (HAIL, TX, expected_severity_index 0.0000) so the index term contributes exactly 0.0."
            - "One Claim created WITHOUT access_status: reported_loss_amount 40000, one DWELLING line limit 100000 / deductible 0 / estimated_damage 50000."
            - "Expected severity with the default ACCESSIBLE: base = 100.0*min(1.0, 40000/100000) = 40.00; raw = 40.00*0.95 + 0.0 + 0.0 + 20.0*0.0000 = 38.00 -> STANDARD."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1006", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 400, avg_insured_value: 150000, expected_severity_index: 0.0000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Uncertified Ann", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 6, daily_rate: 500, per_diem_rate: 50 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-1006A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "response HTTP status == 200"
            - "Adjuster.${adj}.desk_certified == false"
            - "Adjuster.${adj}.aerial_certified == false"
            - "Adjuster.${adj}.surge_capacity_score == 100.00   # no cert bonus, but availability alone clamps to 100.00"
            - "Claim.${cl}.access_status == ACCESSIBLE"
            - "Claim.${cl}.severity_score == 38.00   # ACCESS_ADJUSTMENT for the defaulted ACCESSIBLE is 0.0"
            - "Claim.${cl}.triage_tier == STANDARD"
            - "Claim.${cl}.inspection_mode == FIELD"
            - "Claim.${cl}.case_reserve == 22500.00   # basis = max(40000, 50000-0) = 50000.00; round(50000.00*0.45,2)"

      - name: corner_entity_computed_fields_housing_rooms_derive_from_deployments
        claim_type: computed_fields
        grounds:
          - entities.HousingBlock.rooms_occupied
          - entities.HousingBlock.rooms_available
          - entities.HousingBlock.block_night_count
          - calculations.deployment_cost
        distinguishing_aspect: |
          rooms_occupied, rooms_available and block_night_count are `source: computed` and are absent from
          POST /housing-blocks' input list, so they can only be derived. Confirming a deployment that draws
          2 of 6 rooms must move them without any client write, and block_night_count must equal the whole
          days in the half-open block range (7 for 2026-09-01 -> 2026-09-08), not 8.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1007' (FLOOD, LA)."
            - "One ACTIVE HousingBlock: rooms_total 6, nightly_rate 150, block 2026-09-01 -> 2026-09-08."
            - "One STAFF Adjuster licensed in LA (daily_rate 600, per_diem_rate 80) with a REQUESTED FIELD Deployment 2026-09-02 -> 2026-09-05, rooms_reserved 2."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1007", peril_type: "FLOOD", jurisdiction_state: "LA", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 600, avg_insured_value: 190000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Six Room Court", city: "Metairie", rooms_total: 6, nightly_rate: 150, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-08T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id, nights_at_create: $.data.block_night_count, occupied_at_create: $.data.rooms_occupied }
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /adjusters"
              payload: { full_name: "Derive Dan", employment_type: "STAFF", home_state: "LA", licensed_states: ["LA"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 8, daily_rate: 600, per_diem_rate: 80, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-02T00:00:00.000Z", window_end_utc: "2026-09-05T00:00:00.000Z", adjuster_id: "${adj}", housing_block_id: "${hb}", rooms_reserved: 2 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /deployments/${dep}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "response HTTP status == 200"
            - "${nights_at_create} == 7   # whole days in the half-open range 2026-09-01 -> 2026-09-08"
            - "${occupied_at_create} == 0"
            - "HousingBlock.${hb}.rooms_total == 6"
            - "HousingBlock.${hb}.rooms_occupied == 2"
            - "HousingBlock.${hb}.rooms_available == 4"
            - "HousingBlock.${hb}.block_night_count == 7"
            - "HousingBlock.${hb}.status == ACTIVE   # rooms_available 4 >= 1, so no EXHAUSTED flip"
            - "Deployment.${dep}.provisional_cost == 2940.00   # base_labor round(600*1.00*3,2)=1800.00 + per_diem round(80*3*1,2)=240.00 + housing round(150*2*3,2)=900.00 = 2940.00, below PREMIUM_MID_FLOOR"
            - "Deployment.${dep}.surge_premium_tier == TIER_NONE"
            - "CatastropheEvent.${ev}.surge_adjuster_count == 1"

      - name: corner_entity_system_fields_clock_stamped_timestamps_and_version_bump
        claim_type: system_fields
        grounds:
          - entities.CatastropheEvent.declared_at_utc
          - entities.CatastropheEvent.status
          - entities.Claim.reported_at_utc
          - endpoints[POST /catastrophe-events/{eventId}/declare]
        distinguishing_aspect: |
          System fields are stamped from the logical clock at the moment of the write, not from the request
          body and not from wall time. The event is created at 2026-08-01T00:00:00Z and declared three days
          later, so created_at and declared_at_utc must differ by exactly that interval, version must go
          1 -> 2, and a Claim created after the clock move must carry the later reported_at_utc.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z; one CatastropheEvent 'CAT-2026-1008' is created there, still MONITORING with version 1 and declared_at_utc null."
            - "Clock is then moved to 2026-08-04T09:30:00Z and one Claim is taken with no event_id (cat code not yet assigned)."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1008", peril_type: "EARTHQUAKE", jurisdiction_state: "CA", event_start_utc: "2026-07-31T00:00:00.000Z", exposure_count: 900, avg_insured_value: 520000, expected_severity_index: 0.2500 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id, created_stamp: $.data.created_at, v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:30:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-1008A", loss_state: "CA", loss_date_utc: "2026-07-31T00:00:00.000Z", reported_loss_amount: 30000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 150000, deductible_amount: 2000, estimated_damage_amount: 35000 }] }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
          assert:
            - "response HTTP status == 200"
            - "${created_stamp} == 2026-08-01T00:00:00.000Z"
            - "${v1} == 1"
            - "CatastropheEvent.${ev}.status == DECLARED"
            - "CatastropheEvent.${ev}.declared_at_utc == 2026-08-04T09:30:00.000Z"
            - "CatastropheEvent.${ev}.updated_at == 2026-08-04T09:30:00.000Z"
            - "CatastropheEvent.${ev}.created_at == 2026-08-01T00:00:00.000Z"
            - "CatastropheEvent.${ev}.version == 2"
            - "Claim.${cl}.reported_at_utc == 2026-08-04T09:30:00.000Z"
            - "Claim.${cl}.event_id == null   # not yet cat-coded"
            - "Claim.${cl}.handling_status == INTAKE"
            - "Claim.${cl}.payment_status == NONE"
            - "Claim.${cl}.severity_score == 0.00   # 0.00 while INTAKE, per the field's declaration"
            - "Claim.${cl}.reopen_count == 0"
            - "Claim.${cl}.version == 1"

      - name: corner_entity_type_constraints_enum_and_numeric_range_rejections
        claim_type: type_constraints
        grounds:
          - validations[priority=15]
          - errors[ERR_VALIDATION]
          - entities.CatastropheEvent.peril_type
          - entities.HousingBlock.rooms_total
          - entities.Adjuster.max_open_claims
        distinguishing_aspect: |
          Four probes just outside the declared member sets and ranges: an unrecognised peril_type enum
          member, expected_severity_index 1.5 (declared 0.0..1.0), rooms_total 401 (declared 0..400) and
          max_open_claims 61 (declared 1..60). All four must be ERR_VALIDATION / 422 at priority 15 and none
          may create a row. Note 400 and 60 are legal, so the rejection is attributable to the excess.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
