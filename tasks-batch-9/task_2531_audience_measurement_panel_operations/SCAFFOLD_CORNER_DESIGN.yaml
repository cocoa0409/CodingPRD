              payload: { market_id: "${m57_id}", universe_estimate_id: "${ue57_id}", edit_rule_set_id: "${rs57_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m57_v2}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-57"
              captures: { run57_id: "$.data.id" }
          trigger:
            - call: "POST /processing-runs/${run57_id}/edit"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /tuning-intervals"
              payload: { household_id: "${h57a_id}" }
              as: MethodologyStatistician
            - call: "GET /tuning-intervals/${ti57c_id}"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /processing-runs/${run57_id}/weight"
              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run57_id}" }
              as: MethodologyStatistician
          assert:
            - "Trigger call 1: HTTP 200 with data.state == EDITED, data.outlier_household_count == 1, data.invalidated_interval_count == 2, data.ascribed_interval_count == 0 and data.contributing_household_count == 1"
            - "Trigger call 1: data.ascribed_interval_count is 0 because the counters are written in step 7, AFTER step 6 deleted h1's synthetic record - the ascription still had to exist during step 6, or h1's 190 raw minutes would never have crossed the 200 cap"
            - "Trigger call 1: data.limitation_disclosures == [OUTLIER_HOUSEHOLDS_EXCLUDED] and does NOT contain ASCRIBED_INTERVALS_PRESENT"
            - "Trigger call 2: total_count == 2 - both of h1's records, each with state INVALIDATED, invalidation_reason OUTLIER_HOUSEHOLD, usable_minutes 0 and processing_run_id ${run57_id}; no ascribed == true row survives for h1"
            - "Trigger call 3: h2 is untouched by its neighbour's outlier verdict: data.state == EDITED with data.usable_minutes == 60"
            - "Trigger call 4: HTTP 200 with data.state == WEIGHTED. The FINAL denominator counts only ACTIVE households that contributed usable minutes to THIS run, so the cell's denominator is 1 (h2 alone, not 2) and base_weight == round_half_up(100000 / 1, 4) == 100000.0000"
            - "Trigger call 4: n == 1, mass == 100000.0000, mean_base == 100000.0000, cap == 100000.0000 * 2.5 == 250000.0000, no row is above the cap, so data.total_weight_mass == 100000.0000 and data.excluded_cell_count == 0"
            - "Trigger call 4: contribution == round_half_up(100000.0000 * 60 / 1440, 2) == round_half_up(4166.6666..., 2) == 4166.67, so data.projected_average_audience == round_half_up(4166.67, 0) == 4167"
            - "Trigger call 4: data.intab_snapshot_count == 2 - the snapshot was frozen at run creation when BOTH households were ACTIVE, and the outlier exclusion never revises it"
            - "Trigger call 5: total_count == 1 - only h2 has a HouseholdWeight row, with weight_variant FINAL, capped false, usable_minutes 60, contribution 4166.67 and run_compliance_rate 1.0000 (evaluated_days == ceil(1440/1440) == 1, and that day's 60 credited minutes clear MIN_COMPLIANT_DAY_MINUTES)"

      - name: rolling_compliance_counts_reported_days_and_is_a_stored_snapshot
        claim_type: constants_applied
        grounds:
          - calculations.household_compliance_rate.variants.ROLLING_30
          - calculations.household_compliance_rate.constants.MIN_COMPLIANT_DAY_MINUTES
        distinguishing_aspect: "Three separate traps in one household: a day is compliant at exactly 30 credited minutes but not at 29; two short intervals on the same UTC date are SUMMED before the test; an interval that crosses midnight is credited wholly to its START date; and because the figure is only recomputed on ingest, advancing the clock past the whole 30-day window leaves the stored value untouched."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-658, RANK 158, T 2, B 1000, BUDGET 500000, PERSONS 2, SERIAL MT-002066, so h1 is ACTIVE with compliance_rate_rolling_30 == 0.0000 and recruited_at 2026-08-01T00:00:00Z."
            - "The clock is then moved to 2026-08-20T00:00:00Z, which puts the rolling window at [2026-07-21T00:00:00Z, 2026-08-20T00:00:00Z) - every interval below falls inside it."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Rolling", market_code: "DMA-658", dma_rank: 158, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m58_id: "$.data.id" }
