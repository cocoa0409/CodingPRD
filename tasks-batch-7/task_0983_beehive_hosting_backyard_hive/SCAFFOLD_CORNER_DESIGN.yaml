            - { call: "POST /api/swarm-events/${sw}/dispatch", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { st: $.data.status, who: $.data.assigned_beekeeper_id } }
          trigger:
            - { call: "POST /api/swarm-events/${sw}/capture", payload: {}, as: Beekeeper, as_user_id: "bk-1", captures: { cap: $.data.captured_hive_id, st2: $.data.status } }
            - { call: "GET /api/hives", payload: { source_swarm_event_id: "${sw}" }, as: PlatformOps }
            - { call: "GET /api/hives/${cap}", payload: {}, as: PlatformOps }
          assert:
            - "captured ${st} == DISPATCHED and ${who} == bk-1 (dispatch records the caller)"
            - "captured ${st2} == CAPTURED; ${cap} is non-null"
            - "the filtered hive list for source_swarm_event_id=${sw} contains exactly one hive, ${cap}, with lifecycle_status ACTIVE and posture STABLE"

      - name: distribute_projected_allocation_rejected
        claim_type: conditional_action
        grounds: [state_machines.HoneyAllocation.FINALIZED_to_DISTRIBUTED, "errors[ERR_ALLOCATION_NOT_DISTRIBUTABLE]"]
        distinguishing_aspect: "Distribution is gated on FINALIZED; a PROJECTED allocation rejects, and after rollover the same distribute credits the host's honey balance and settles the harvest."
        test_recipe:
          setup: ["host with no subscription and no education (effective 2500 bps, base only); one hive; one APPROVED harvest net 4.000 (allocation PROJECTED)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
