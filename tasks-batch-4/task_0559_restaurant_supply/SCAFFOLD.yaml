    roles: [WarehouseOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["delivered_at = clock now", "order → COMPLETED"]

  - method: POST
    path: "/shipments/{shipment_id}/cancel"
    description: "Cancel a quoted/booked shipment"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status → CANCELLED"]

