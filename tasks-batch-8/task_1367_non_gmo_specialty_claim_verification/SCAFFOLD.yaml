# =============================================================================
# Scaffold: Non-GMO & Specialty Claim Verification (Non-GMO Project style)
# =============================================================================

scenario: |
  Non-GMO & Specialty Claim Verification (Non-GMO Project style verifier): claim standard & threshold determination, supply-chain segregation & affidavit collection, testing (PCR) sampling plan at risk points, product enrollment & label license, audit of facility & traceability exercise, minor-ingredient exemption rules, annual renewal & scope changes, claim misuse enforcement

domain_name: non-gmo-claim-verification
api_prefix: "/"   # flat API: every resource is a top-level collection; FKs travel in request bodies

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency        # OCC on Product.version for sampling-plan create-with-supersede
    - cascading_side_effects        # enforcement substantiation -> license -> product -> brand counters
    - rate_threshold_triggers       # 0.9% PCR threshold, exemption weight threshold, probation points
    - derived_field_reconciliation  # product exposure %, ingredient compliance_status, brand counters
  entity_topology: flat             # peer entities joined by FKs; creation POSTs are all top-level
  state_machine_shape: cyclic       # Product resubmission + suspend/reinstate loops; SamplingPlan ACTIVE<->COMPLETED
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # TestSample joins SamplingPlan and Ingredient across aggregates
  role_model: segregation_of_duties # sample recorder != confirmer; case opener != resolver; auditor != decider
  consistency_model: immediate      # all side effects atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClaimStandard
    parent: null
    common_fields: true
    fields:
      - { name: claim_code, type: string, source: input, description: "Unique program claim code, e.g. NGMO", constraints: "unique across all ClaimStandards" }
      - { name: name, type: string, source: input, description: "Human-readable standard name" }
      - { name: ingredient_threshold_pct, type: number, source: input, description: "Max allowed GMO content per ingredient as percent; result <= threshold is COMPLIANT", constraints: "> 0" }
      - { name: exemption_max_weight_pct, type: number, source: input, description: "Minor-ingredient exemption: declared_weight_pct <= this value makes an ingredient exempt from PCR testing", constraints: ">= 0" }
      - { name: audit_validity_months, type: integer, source: input, default: 12, description: "A PASSED facility audit stays fresh for this many calendar months after decided_at" }
      - { name: renewal_window_days, type: integer, source: input, default: 60, description: "Renewal window opens this many days before license valid_until" }
      - { name: license_term_days, type: integer, source: input, default: 365, description: "Days added to license valid_until at issuance and at each renewal" }

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Participant company name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: lifetime_penalty_points, type: integer, source: computed, default: 0, description: "Sum of penalty_points over all SUBSTANTIATED EnforcementCases on this brand's products, all time" }
      - { name: rolling_penalty_points, type: integer, source: computed, default: 0, description: "Sum of penalty_points over SUBSTANTIATED EnforcementCases with substantiated_at > now - 365 days (strictly greater; exactly 365 days is excluded)" }
      - { name: standing_status, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | PROBATION; PROBATION iff lifetime_penalty_points >= 20" }
      - { name: verified_product_count, type: integer, source: computed, default: 0, description: "Count of this brand's Products with enrollment_status IN {VERIFIED, RENEWAL_DUE}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; enrolling brand; BrandRep caller must match" }
      - { name: standard_id, type: string, source: input, description: "FK -> ClaimStandard.id; standard the product enrolls under" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: gtin, type: string, source: input, description: "Global trade item number", constraints: "unique among all Products sharing the same standard_id" }
      - { name: annual_volume_units, type: integer, source: input, description: "Annual production volume, drives sampling plan size tiers", constraints: ">= 0" }
      - { name: enrollment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_EVALUATION | VERIFIED | REJECTED | RENEWAL_DUE | SUSPENDED | REVOKED | LAPSED" }
      - { name: rejection_reason, type: string, source: system, description: "Set on decide REJECTED; cleared on resubmit", default: null }
      - { name: provisional_exposure_pct, type: number, source: computed, default: 0, description: "Conservative exposure estimate: untested PCR-required ingredients assumed at threshold (see product_gmo_exposure, variant provisional)" }
      - { name: confirmed_exposure_pct, type: number, source: computed, default: 0, description: "Confirmed-only exposure estimate (see product_gmo_exposure, variant confirmed)" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: name, type: string, source: input, description: "Ingredient name" }
      - { name: crop_type, type: enum, source: input, description: "HIGH_RISK | LOW_RISK | NON_CROP" }
      - { name: declared_weight_pct, type: number, source: input, description: "Share of product weight in percent", constraints: "0 < value <= 100; per-product sum must stay <= 100" }
      - { name: is_exempt, type: boolean, source: computed, description: "true iff declared_weight_pct <= standard.exemption_max_weight_pct (inclusive boundary)" }
      - { name: requires_pcr, type: boolean, source: computed, description: "true iff crop_type == HIGH_RISK AND NOT is_exempt" }
      - { name: requires_affidavit, type: boolean, source: computed, description: "true iff crop_type == HIGH_RISK OR (crop_type == LOW_RISK AND NOT is_exempt); NON_CROP never requires one" }
      - { name: compliance_status, type: enum, source: computed, description: "NON_COMPLIANT if any CONFIRMED sample of this ingredient has outcome NON_COMPLIANT; else COMPLIANT if every requirement satisfied (requires_pcr => >=1 CONFIRMED COMPLIANT sample; requires_affidavit => >=1 ACCEPTED affidavit with valid_from <= now < valid_until); else EXEMPTED if NOT requires_pcr AND NOT requires_affidavit; else PENDING" }

  - name: SupplierAffidavit
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id" }
      - { name: supplier_name, type: string, source: input, description: "Supplier legal name; overlap windows are scoped per (ingredient_id, supplier_name)" }
      - { name: valid_from, type: datetime, source: input, description: "Coverage window start (inclusive); half-open interval [valid_from, valid_until)" }
      - { name: valid_until, type: datetime, source: input, description: "Coverage window end (exclusive); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | EXPIRED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting BrandRep" }

  - name: SamplingPlan
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: risk_point, type: enum, source: input, description: "INGREDIENT_INTAKE | IN_PROCESS | FINISHED_PRODUCT" }
      - { name: required_sample_count, type: integer, source: computed, description: "min(10, BASE[risk_point] + pcr_ingredient_count + volume_extra + history_extra); see required_sample_count calculation" }
      - { name: confirmed_sample_count, type: integer, source: computed, default: 0, description: "Count of this plan's TestSamples with status CONFIRMED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | CANCELLED; created ACTIVE, or COMPLETED immediately when required_sample_count == 0" }
      - { name: superseded_by_plan_id, type: string, source: system, default: null, description: "Set when this plan was CANCELLED by a newer plan for the same product" }

  - name: TestSample
    parent: null
    common_fields: true
    fields:
      - { name: sampling_plan_id, type: string, source: input, description: "FK -> SamplingPlan.id" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; ingredient must belong to the plan's product" }
      - { name: result_gmo_pct, type: number, source: input, description: "PCR result in percent, provided at record-result; null until recorded", default: null, constraints: ">= 0" }
      - { name: outcome, type: enum, source: computed, default: null, description: "null until confirm; COMPLIANT iff result_gmo_pct <= standard.ingredient_threshold_pct (inclusive), else NON_COMPLIANT; reset to null on invalidate" }
      - { name: recorded_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LabAnalyst who recorded the result" }
      - { name: confirmed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the confirming LabAnalyst; must differ from recorded_by_user_id" }
      - { name: status, type: enum, source: system, description: "COLLECTED | RESULT_RECORDED | CONFIRMED | INVALIDATED" }

  - name: FacilityAudit
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: facility_name, type: string, source: input, description: "Facility identifier; capacity gate scopes per (brand_id, facility_name)" }
      - { name: auditor_id, type: string, source: input, description: "Opaque user id of the assigned Auditor; only this user may submit the report" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned audit date" }
      - { name: lots, type: array, source: input, description: "Traceability exercise lots supplied at submit-report: [{lot_code, input_qty, recovered_qty}]; non-empty; input_qty > 0; recovered_qty >= 0", default: null }
      - { name: traceability_score_pct, type: number, source: computed, default: null, description: "round_half_up(mean(round_half_up(recovered_qty/input_qty*100, 2) per lot), 2); null until report submitted" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the PASSED/FAILED decision; staleness anchor" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REPORT_SUBMITTED | PASSED | FAILED" }

  - name: LabelLicense
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; license is cascade-created by decide VERIFIED, never by direct POST" }
      - { name: license_code, type: string, source: system, description: "LIC-<6-digit zero-padded issuance sequence starting at 000001; deterministic counter, not derived from id" }
      - { name: valid_from, type: datetime, source: system, description: "Logical-clock now at issuance" }
      - { name: valid_until, type: datetime, source: system, description: "valid_from + standard.license_term_days days; extended on renewal and on reinstatement after ENFORCEMENT suspension" }
      - { name: suspended_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when current suspension began; null when not suspended" }
      - { name: suspend_reason, type: enum, source: system, default: null, description: "ENFORCEMENT | SCOPE_CHANGE; null when not suspended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED | EXPIRED" }

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; cases may be opened against products in any enrollment_status (monitors unlicensed claim use too)" }
      - { name: source, type: enum, source: input, description: "CONSUMER_COMPLAINT | MARKETPLACE_MONITOR | RETEST_FAILURE" }
      - { name: description, type: string, source: input, description: "Free-text allegation" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the EnforcementOfficer who opened the case" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the resolving officer; must differ from opened_by_user_id" }
      - { name: sanction, type: enum, source: input, default: null, description: "Required iff resolve outcome is SUBSTANTIATED: WARNING | LICENSE_SUSPENSION | LICENSE_REVOCATION; must be absent for DISMISSED" }
      - { name: penalty_points, type: integer, source: computed, default: 0, description: "WARNING 5, LICENSE_SUSPENSION 15, LICENSE_REVOCATION 25; 0 while open or dismissed" }
      - { name: substantiated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of SUBSTANTIATED resolution; rolling-window anchor" }
      - { name: status, type: enum, source: system, description: "OPENED | DISMISSED | SUBSTANTIATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: DRAFT
    terminal_states: [REVOKED, LAPSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /products/{id}/submit"
        actor: BrandRep
        preconditions:
          - "enrollment_status == DRAFT (ERR_PRODUCT_INVALID_STATE)"
          - ">= 1 ingredient exists for this product (ERR_NO_INGREDIENTS)"
          - "every ingredient with requires_affidavit == true has >= 1 SupplierAffidavit with status == ACCEPTED and valid_from <= now < valid_until (ERR_AFFIDAVIT_MISSING)"
        side_effects:
          - "provisional_exposure_pct and confirmed_exposure_pct recomputed"
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "POST /products/{id}/begin-evaluation"
        actor: VerifierAdmin
        preconditions:
          - "enrollment_status == SUBMITTED (ERR_PRODUCT_INVALID_STATE)"
        side_effects: []
      - from: UNDER_EVALUATION
        to: VERIFIED
        trigger: "POST /products/{id}/decide with decision=VERIFIED"
        actor: VerifierAdmin
        preconditions:
          - "enrollment_status == UNDER_EVALUATION (ERR_PRODUCT_INVALID_STATE)"
          - "safety gate order: no ingredient with compliance_status == NON_COMPLIANT (ERR_NON_COMPLIANT_RESULTS_EXIST)"
          - "then: no ingredient with compliance_status == PENDING (ERR_INGREDIENTS_PENDING)"
          - "then: every SamplingPlan of this product with status != CANCELLED has status == COMPLETED (ERR_INCOMPLETE_SAMPLING)"
          - "then: >= 1 FacilityAudit of this brand with status == PASSED exists (ERR_AUDIT_NOT_PASSED)"
          - "then: no EnforcementCase of this product with status == OPENED (ERR_OPEN_ENFORCEMENT_CASE)"
          - "then: brand.rolling_penalty_points < 10 (ERR_BRAND_RECENT_PENALTIES)"
          - "temporal gate: the most recent PASSED audit (by decided_at, tie-break earliest created_at) has decided_at + standard.audit_validity_months months > now (ERR_AUDIT_STALE)"
        side_effects:
          - "if the product has no LabelLicense: create LabelLicense ACTIVE, license_code = LIC-<next 6-digit sequence>, valid_from = now, valid_until = now + standard.license_term_days days"
          - "else if the product's license is SUSPENDED with suspend_reason == SCOPE_CHANGE: license -> ACTIVE (no validity extension)"
          - "Brand.verified_product_count recomputed"
      - from: UNDER_EVALUATION
        to: REJECTED
        trigger: "POST /products/{id}/decide with decision=REJECTED"
        actor: VerifierAdmin
        preconditions:
          - "enrollment_status == UNDER_EVALUATION (ERR_PRODUCT_INVALID_STATE)"
          - "rejection_reason provided and non-empty (ERR_VALIDATION)"
        side_effects:
          - "rejection_reason stored; a SUSPENDED(SCOPE_CHANGE) license, if any, stays SUSPENDED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /products/{id}/resubmit"
        actor: BrandRep
        preconditions:
          - "enrollment_status == REJECTED (ERR_PRODUCT_INVALID_STATE)"
        side_effects:
          - "rejection_reason cleared to null"
          - "affidavit currency re-checked as in DRAFT->SUBMITTED (ERR_AFFIDAVIT_MISSING applies)"
        note: "cyclic resubmission loop"
      - from: VERIFIED
        to: RENEWAL_DUE
        trigger: "system (logical clock set: now >= license.valid_until - standard.renewal_window_days days AND now < license.valid_until AND license status == ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RENEWAL_DUE
        to: VERIFIED
        trigger: "POST /products/{id}/renew"
        actor: BrandRep
        preconditions:
          - "enrollment_status IN {VERIFIED, RENEWAL_DUE} (ERR_PRODUCT_INVALID_STATE)"
          - "no EnforcementCase of this product with status == OPENED (ERR_OPEN_ENFORCEMENT_CASE)"
          - "brand.standing_status == GOOD_STANDING (ERR_BRAND_ON_PROBATION)"
          - "brand.rolling_penalty_points < 10 (ERR_BRAND_RECENT_PENALTIES)"
          - "every ingredient with requires_affidavit == true has >= 1 ACCEPTED affidavit with valid_from <= now < valid_until (ERR_AFFIDAVIT_MISSING)"
          - ">= 1 PASSED FacilityAudit for this brand exists (ERR_AUDIT_NOT_PASSED)"
          - "renewal window open: now >= license.valid_until - renewal_window_days AND now < license.valid_until (ERR_RENEWAL_WINDOW_CLOSED)"
          - "most recent PASSED audit fresh: decided_at + audit_validity_months months > now (ERR_AUDIT_STALE)"
        side_effects:
          - "license.valid_until += standard.license_term_days days (extends from current valid_until, not from now)"
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /products/{id}/renew"
        actor: BrandRep
        preconditions: ["same as RENEWAL_DUE -> VERIFIED"]
        side_effects: ["same as RENEWAL_DUE -> VERIFIED"]
      - from: VERIFIED
        to: SUSPENDED
        trigger: "system cascade: product's LabelLicense becomes SUSPENDED via EnforcementCase resolve (sanction=LICENSE_SUSPENSION)"
        actor: system
        preconditions: []
        side_effects:
          - "Brand.verified_product_count recomputed (decreases by 1)"
      - from: RENEWAL_DUE
        to: SUSPENDED
        trigger: "system cascade: same as VERIFIED -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["Brand.verified_product_count recomputed (decreases by 1)"]
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /products/{id}/reinstate"
        actor: VerifierAdmin
        preconditions:
          - "enrollment_status == SUSPENDED (ERR_PRODUCT_INVALID_STATE)"
          - "no EnforcementCase of this product with status == OPENED (ERR_OPEN_ENFORCEMENT_CASE)"
        side_effects:
          - "license SUSPENDED -> ACTIVE; iff suspend_reason == ENFORCEMENT: license.valid_until += (now - suspended_at); SCOPE_CHANGE suspensions get no extension"
          - "license.suspended_at and suspend_reason reset to null"
          - "Brand.verified_product_count recomputed (increases by 1)"
      - from: VERIFIED
        to: REVOKED
        trigger: "system cascade: EnforcementCase resolve sanction=LICENSE_REVOCATION"
        actor: system
        preconditions: []
        side_effects:
          - "LabelLicense -> REVOKED"
          - "Brand.verified_product_count recomputed"
      - from: RENEWAL_DUE
        to: REVOKED
        trigger: "system cascade: same as VERIFIED -> REVOKED"
        actor: system
        preconditions: []
        side_effects: ["LabelLicense -> REVOKED", "Brand.verified_product_count recomputed"]
      - from: VERIFIED
        to: LAPSED
        trigger: "system (logical clock set: license ACTIVE with valid_until <= now; license -> EXPIRED and product lapses)"
        actor: system
        preconditions: []
        side_effects: ["Brand.verified_product_count recomputed"]
      - from: RENEWAL_DUE
        to: LAPSED
        trigger: "system (same clock sweep as VERIFIED -> LAPSED)"
        actor: system
        preconditions: []
        side_effects: ["Brand.verified_product_count recomputed"]
      - from: VERIFIED
        to: UNDER_EVALUATION
        trigger: "POST /ingredients for this product (scope change)"
        actor: BrandRep
        preconditions:
          - "enrollment_status IN {DRAFT, REJECTED, UNDER_EVALUATION, VERIFIED, RENEWAL_DUE} (ERR_PRODUCT_INVALID_STATE); SUBMITTED is frozen for admin triage"
        side_effects:
          - "only when prior status IN {VERIFIED, RENEWAL_DUE}: product -> UNDER_EVALUATION AND its ACTIVE LabelLicense -> SUSPENDED with suspend_reason=SCOPE_CHANGE, suspended_at=now"
        note: "cyclic scope-change loop; DRAFT/REJECTED/UNDER_EVALUATION adds stay in place"

  - entity: SupplierAffidavit
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /affidavits/{id}/review with decision=ACCEPTED"
        actor: VerifierAdmin
        preconditions: ["status == SUBMITTED (ERR_AFFIDAVIT_NOT_REVIEWABLE)"]
        side_effects: ["owning Ingredient.compliance_status recomputed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /affidavits/{id}/review with decision=REJECTED"
        actor: VerifierAdmin
        preconditions: ["status == SUBMITTED (ERR_AFFIDAVIT_NOT_REVIEWABLE)"]
        side_effects: []
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (logical clock set: valid_until <= now)"
        actor: system
        preconditions: []
        side_effects: ["owning Ingredient.compliance_status recomputed (may drop COMPLIANT -> PENDING)"]

  - entity: SamplingPlan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (on create when required_sample_count == 0; on TestSample confirm when confirmed_sample_count >= required_sample_count, inclusive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: ACTIVE
        trigger: "system (on TestSample invalidate when confirmed_sample_count drops below required_sample_count)"
        actor: system
        preconditions: []
        side_effects: []
        note: "cyclic reopen loop"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system cascade: a new SamplingPlan is created for the same product (supersede)"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_plan_id set to the new plan's id"]
      - from: COMPLETED
        to: CANCELLED
        trigger: "system cascade: same supersede rule"
        actor: system
        preconditions: []
        side_effects: ["superseded_by_plan_id set to the new plan's id"]

  - entity: TestSample
    initial_state: COLLECTED
    terminal_states: [INVALIDATED]
    transitions:
      - from: COLLECTED
        to: RESULT_RECORDED
        trigger: "POST /samples/{id}/record-result"
        actor: LabAnalyst
        preconditions: ["status == COLLECTED (ERR_SAMPLE_INVALID_STATE)", "result_gmo_pct >= 0 (ERR_VALIDATION)"]
        side_effects: ["recorded_by_user_id = X-User-ID"]
      - from: RESULT_RECORDED
        to: CONFIRMED
        trigger: "POST /samples/{id}/confirm"
        actor: LabAnalyst
        preconditions:
          - "status == RESULT_RECORDED (ERR_SAMPLE_INVALID_STATE)"
          - "parent SamplingPlan status != CANCELLED (ERR_PLAN_NOT_ACTIVE)"
          - "X-User-ID != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "outcome computed: result_gmo_pct <= standard.ingredient_threshold_pct -> COMPLIANT else NON_COMPLIANT"
          - "confirmed_by_user_id = X-User-ID"
          - "hop 1: owning Ingredient.compliance_status recomputed (NON_COMPLIANT outcome forces NON_COMPLIANT)"
          - "hop 2 (triggered by hop-1 ingredient change): Product.provisional_exposure_pct and confirmed_exposure_pct recomputed"
          - "SamplingPlan.confirmed_sample_count += 1; if >= required_sample_count the plan -> COMPLETED (bubble up)"
      - from: RESULT_RECORDED
        to: INVALIDATED
        trigger: "POST /samples/{id}/invalidate"
        actor: LabAnalyst
        preconditions: ["status IN {RESULT_RECORDED, CONFIRMED} (ERR_SAMPLE_INVALID_STATE)"]
        side_effects: ["no count change (sample was never confirmed)"]
      - from: CONFIRMED
        to: INVALIDATED
        trigger: "POST /samples/{id}/invalidate"
        actor: LabAnalyst
        preconditions: ["status IN {RESULT_RECORDED, CONFIRMED} (ERR_SAMPLE_INVALID_STATE)"]
        side_effects:
          - "outcome reset to null"
          - "SamplingPlan.confirmed_sample_count -= 1; if now < required_sample_count and plan was COMPLETED the plan -> ACTIVE (revert)"
          - "owning Ingredient.compliance_status recomputed (NON_COMPLIANT may lift to PENDING/COMPLIANT)"
          - "Product exposure fields recomputed"
        note: "compensating action for confirm; confirm+invalidate leaves confirmed_sample_count unchanged"

  - entity: FacilityAudit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: REPORT_SUBMITTED
        trigger: "POST /facility-audits/{id}/submit-report"
        actor: Auditor
        preconditions:
          - "status == SCHEDULED (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == auditor_id (ERR_NOT_ASSIGNED_AUDITOR)"
          - "lots non-empty; each input_qty > 0; each recovered_qty >= 0 (ERR_VALIDATION)"
        side_effects: ["traceability_score_pct computed (per-lot rounding, then average, then round)"]
      - from: REPORT_SUBMITTED
        to: PASSED
        trigger: "POST /facility-audits/{id}/decide with decision=PASSED"
        actor: VerifierAdmin
        preconditions:
          - "status == REPORT_SUBMITTED (ERR_AUDIT_INVALID_STATE)"
          - "traceability_score_pct >= 95.00 (ERR_TRACE_SCORE_BELOW_MIN, inclusive boundary)"
        side_effects: ["decided_at = now"]
      - from: REPORT_SUBMITTED
        to: FAILED
        trigger: "POST /facility-audits/{id}/decide with decision=FAILED"
        actor: VerifierAdmin
        preconditions: ["status == REPORT_SUBMITTED (ERR_AUDIT_INVALID_STATE)"]
        side_effects: ["decided_at = now"]
        note: "FAILED is always allowed regardless of score; PASSED is score-gated"

  - entity: LabelLicense
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: EnforcementCase resolve sanction=LICENSE_SUSPENSION (suspend_reason=ENFORCEMENT), or product scope change (suspend_reason=SCOPE_CHANGE)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_at = now; suspend_reason set"
          - "for ENFORCEMENT: product VERIFIED/RENEWAL_DUE -> SUSPENDED (hop 2 of the enforcement cascade), which triggers Brand.verified_product_count recompute (hop 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade: POST /products/{id}/reinstate (ENFORCEMENT) or decide VERIFIED after scope re-evaluation (SCOPE_CHANGE)"
        actor: system
        preconditions: []
        side_effects:
          - "iff suspend_reason == ENFORCEMENT: valid_until += (now - suspended_at); SCOPE_CHANGE: no extension"
          - "suspended_at and suspend_reason reset to null"
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade: EnforcementCase resolve sanction=LICENSE_REVOCATION"
        actor: system
        preconditions: []
        side_effects: ["product VERIFIED/RENEWAL_DUE -> REVOKED"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "system cascade: EnforcementCase resolve sanction=LICENSE_REVOCATION"
        actor: system
        preconditions: []
        side_effects: ["product -> REVOKED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock set: valid_until <= now); SUSPENDED licenses never expire"
        actor: system
        preconditions: []
        side_effects: ["product VERIFIED/RENEWAL_DUE -> LAPSED"]

  - entity: EnforcementCase
    initial_state: OPENED
    terminal_states: [DISMISSED, SUBSTANTIATED]
    transitions:
      - from: OPENED
        to: DISMISSED
        trigger: "POST /enforcement-cases/{id}/resolve with outcome=DISMISSED"
        actor: EnforcementOfficer
        preconditions:
          - "status == OPENED (ERR_CASE_NOT_OPEN)"
          - "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "sanction must be absent (ERR_VALIDATION)"
        side_effects: ["resolved_by_user_id = X-User-ID"]
      - from: OPENED
        to: SUBSTANTIATED
        trigger: "POST /enforcement-cases/{id}/resolve with outcome=SUBSTANTIATED"
        actor: EnforcementOfficer
        preconditions:
          - "status == OPENED (ERR_CASE_NOT_OPEN)"
          - "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "sanction provided, one of WARNING | LICENSE_SUSPENSION | LICENSE_REVOCATION (ERR_VALIDATION)"
        side_effects:
          - "resolved_by_user_id = X-User-ID; substantiated_at = now"
          - "penalty_points = 5 (WARNING) | 15 (LICENSE_SUSPENSION) | 25 (LICENSE_REVOCATION)"
          - "independently of the license chain: Brand.lifetime_penalty_points += penalty_points; Brand.rolling_penalty_points recomputed; Brand.standing_status recomputed (PROBATION iff lifetime >= 20)"
          - "LICENSE_SUSPENSION: hop 1 -> product's ACTIVE LabelLicense -> SUSPENDED (reason ENFORCEMENT; if already SUSPENDED(SCOPE_CHANGE), suspended_at resets to now and reason becomes ENFORCEMENT); hop 2 -> product VERIFIED/RENEWAL_DUE -> SUSPENDED; hop 3 -> Brand.verified_product_count recomputed"
          - "LICENSE_REVOCATION: LabelLicense (ACTIVE or SUSPENDED) -> REVOKED; product VERIFIED/RENEWAL_DUE -> REVOKED"
          - "conditional cascade: products without a license (DRAFT/SUBMITTED/UNDER_EVALUATION/REJECTED) keep their enrollment_status; only penalty points apply"
        note: "branching fork: DISMISSED has no side effects, SUBSTANTIATED fans into the license/product/brand cascade"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-product-version
    parent_entity: Product
    write_endpoint: "POST /sampling-plans"
    occ_field: expected_product_version
    description: |
      Creating a SamplingPlan against a Product whose version has advanced since
      the client last observed it is rejected. The new plan legitimately
      supersedes the product's current non-CANCELLED plan, so a writer holding a
      stale product version would silently cancel a plan it never saw; the OCC
      check on Product.version rejects the stale write with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ingredient_exemption_and_requirements
    trigger: "ingredient creation (and conceptually whenever the standard's exemption_max_weight_pct were to change)"
    algorithm: threshold
    formula: |
      is_exempt          = (declared_weight_pct <= standard.exemption_max_weight_pct)   # inclusive boundary
      requires_pcr       = (crop_type == HIGH_RISK) AND (NOT is_exempt)
      requires_affidavit = (crop_type == HIGH_RISK) OR ((crop_type == LOW_RISK) AND (NOT is_exempt))
      compliance_status  = NON_COMPLIANT if any CONFIRMED sample with outcome NON_COMPLIANT exists
                           else COMPLIANT if (requires_pcr => >=1 CONFIRMED COMPLIANT sample)
                                         AND (requires_affidavit => >=1 ACCEPTED affidavit with valid_from <= now < valid_until)
                           else EXEMPTED if (NOT requires_pcr) AND (NOT requires_affidavit)
                           else PENDING
    input_set: "the ingredient, its product's ClaimStandard, the ingredient's SupplierAffidavits, and its TestSamples with status CONFIRMED"
    constants:
      EXEMPTION_BOUNDARY_INCLUSIVE: true

  - name: product_gmo_exposure
    trigger: "product submit, sample confirm, sample invalidate"
    algorithm: aggregation
    formula: |
      For each ingredient i of the product:
        r_i = MAX(result_gmo_pct) over i's TestSamples with status CONFIRMED  (empty set -> no confirmed result)
      Per-ingredient weight w_i = declared_weight_pct.
      provisional variant: c_i = r_i if a confirmed result exists
                                 else standard.ingredient_threshold_pct if requires_pcr
                                 else 0
      confirmed variant:   c_i = r_i if a confirmed result exists else 0
      exposure = SUM(w_i * c_i) over all ingredients, computed exactly, then rounded.
    input_set: "all Ingredients of the product (any compliance_status) and their CONFIRMED TestSamples; INVALIDATED samples excluded"
    precision: "2 decimal places, round_half_up, applied once after the sum"
    variants:
      - name: provisional
        when: "field provisional_exposure_pct; conservative pre-testing posture shown during evaluation"
        difference: "untested PCR-required ingredients are assumed AT the standard threshold instead of 0"
      - name: confirmed
        when: "field confirmed_exposure_pct; evidence-only posture"
        difference: "untested ingredients contribute 0"
    note: "dual-variant pair on the Product domain; identical data yields different values whenever a PCR-required ingredient has no CONFIRMED sample"

  - name: required_sample_count
    trigger: "SamplingPlan creation (POST /sampling-plans)"
    algorithm: tiered_pricing
    formula: |
      required_sample_count = min(10,
          BASE[risk_point]            # INGREDIENT_INTAKE: 0, IN_PROCESS: 1, FINISHED_PRODUCT: 2
        + pcr_ingredient_count        # count of the product's Ingredients with requires_pcr == true
        + volume_extra                # annual_volume_units >= 100000 -> 2; >= 10000 -> 1; else 0
        + history_extra )             # 2 if brand has >=1 SUBSTANTIATED EnforcementCase OR >=1 FAILED FacilityAudit; else 0
    input_set: "the plan's product, that product's ingredients at creation time, the product's brand enforcement and audit history"
    constants:
      MAX_SAMPLES: 10
      BASE_INGREDIENT_INTAKE: 0
      BASE_IN_PROCESS: 1
      BASE_FINISHED_PRODUCT: 2
      VOLUME_TIER_1: 10000
      VOLUME_TIER_2: 100000
      HISTORY_EXTRA: 2
    note: "combinatorial mode (a): >= 3 inputs with nested min and tiered/state-conditional branches"

  - name: traceability_score
    trigger: "FacilityAudit submit-report"
    algorithm: aggregation
    formula: |
      per_lot_i = round_half_up(recovered_qty_i / input_qty_i * 100, 2)   # round EACH lot first
      traceability_score_pct = round_half_up( SUM(per_lot_i) / count(lots), 2 )  # then average, then round
      The alternative order (sum quantities, then divide) yields different cents and is NOT used.
      PASSED decision requires traceability_score_pct >= 95.00 (inclusive).
    input_set: "the lots array supplied at submit-report"
    precision: "2 decimal places, round_half_up at both steps, in the pinned order"
    constants:
      PASS_MIN_SCORE: 95.00
    note: "combinatorial mode (b): nested rounding where rounding order changes the result"

  - name: brand_penalty_points
    trigger: "EnforcementCase resolve SUBSTANTIATED; rolling variant also re-evaluated on every logical clock set"
    algorithm: aggregation
    formula: |
      lifetime_penalty_points = SUM(penalty_points) over all EnforcementCases on products of this brand
                                with status == SUBSTANTIATED (no time bound)
      rolling_penalty_points  = SUM(penalty_points) over the same set restricted to
                                substantiated_at > now - 365 days   # strictly greater: exactly 365 days old is EXCLUDED
      standing_status = PROBATION iff lifetime_penalty_points >= 20 else GOOD_STANDING
    input_set: "EnforcementCases joined through Product.brand_id; only status SUBSTANTIATED; DISMISSED and OPENED contribute 0"
    variants:
      - name: lifetime
        when: "drives standing_status (PROBATION gate on enrollment and renewal)"
        difference: "all-time accumulation"
      - name: rolling
        when: "drives the renewal and verification recency gate (< 10 required)"
        difference: "365-day trailing window keyed on the logical clock"
    note: "dual-variant pair on the Brand domain (distinct entity domain from product_gmo_exposure)"

  - name: license_validity_extension_on_reinstate
    trigger: "Product reinstate (SUSPENDED -> VERIFIED)"
    algorithm: chronological
    formula: |
      suspension_duration = now - license.suspended_at
      if license.suspend_reason == ENFORCEMENT:
          license.valid_until_new = license.valid_until_old + suspension_duration
      else (SCOPE_CHANGE):
          no extension
      Invariant (ENFORCEMENT): remaining validity is conserved across a suspend+reinstate pair:
          valid_until_new - reinstated_at == valid_until_old - suspended_at
    input_set: "the product's SUSPENDED LabelLicense"
    precision: "day/second-exact datetime arithmetic on the logical clock"
    note: "compensating invariant over a TIME quantity"

  - name: sampling_plan_completion
    trigger: "TestSample confirm, TestSample invalidate, plan creation"
    algorithm: threshold
    formula: |
      confirmed_sample_count = count of the plan's TestSamples with status == CONFIRMED
      plan.status = COMPLETED iff confirmed_sample_count >= required_sample_count (inclusive),
                    else ACTIVE (unless CANCELLED)
      Invariant: a confirm followed by an invalidate of the same sample leaves
                 confirmed_sample_count equal to its pre-confirm value.
    input_set: "the plan's TestSamples; INVALIDATED samples never count"
    note: "compensating invariant over a COUNT quantity; boundary: count == required completes (>=, not >)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist (left to right); body-supplied FK ids (brand_id, standard_id, product_id, ingredient_id, sampling_plan_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 4
    category: auth
    check: "BrandRep ownership: X-User-ID equals the brand_id of the target resource's brand (product, or ingredient's product's brand)"
    error_id: ERR_NOT_BRAND_RESOURCE
    http_status: 403
    applies_to: "BrandRep write endpoints: POST /products, /products/{id}/submit, /resubmit, /renew, POST /ingredients, POST /affidavits"
  - priority: 5
    category: state
    check: "OCC: expected_product_version equals Product.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sampling-plans"
  - priority: 6
    category: state
    check: "State-machine from-state preconditions (product transitions, plan ACTIVE, sample states, audit states, case OPENED, affidavit SUBMITTED)"
    error_id: "ERR_PRODUCT_INVALID_STATE | ERR_PLAN_NOT_ACTIVE | ERR_SAMPLE_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_CASE_NOT_OPEN | ERR_AFFIDAVIT_NOT_REVIEWABLE"
    http_status: 409
    applies_to: all transition endpoints
  - priority: 7
    category: business_referential
    check: "Cross-reference consistency: sample's ingredient must belong to the plan's product (ERR_CROSS_REFERENCE_MISMATCH); product has >= 1 ingredient at submit (ERR_NO_INGREDIENTS)"
    error_id: "ERR_CROSS_REFERENCE_MISMATCH | ERR_NO_INGREDIENTS"
    http_status: 409
    applies_to: "POST /samples, POST /products/{id}/submit"
  - priority: 8
    category: business_safety
    check: "Claim-integrity gates in declared sub-order: ERR_NON_COMPLIANT_RESULTS_EXIST, ERR_INGREDIENTS_PENDING, ERR_INCOMPLETE_SAMPLING, ERR_AUDIT_NOT_PASSED, ERR_OPEN_ENFORCEMENT_CASE, ERR_BRAND_ON_PROBATION, ERR_BRAND_RECENT_PENALTIES, ERR_AFFIDAVIT_MISSING; segregation of duties (ERR_SEGREGATION_OF_DUTIES 403, ERR_NOT_ASSIGNED_AUDITOR 403); ERR_TRACE_SCORE_BELOW_MIN"
    error_id: "(see check)"
    http_status: 409
    applies_to: "submit, decide, renew, reinstate, confirm, resolve, submit-report, POST /products"
  - priority: 9
    category: business_temporal
    check: "Window/freshness: renewal window open (ERR_RENEWAL_WINDOW_CLOSED); most recent PASSED audit fresh within audit_validity_months (ERR_AUDIT_STALE)"
    error_id: "ERR_RENEWAL_WINDOW_CLOSED | ERR_AUDIT_STALE"
    http_status: 409
    applies_to: "POST /products/{id}/renew, POST /products/{id}/decide"
  - priority: 10
    category: business_constraint
    check: "Affidavit window overlap per (ingredient_id, supplier_name) half-open (ERR_AFFIDAVIT_WINDOW_OVERLAP); audit capacity: at most one audit with status IN {SCHEDULED, REPORT_SUBMITTED} per (brand_id, facility_name) (ERR_AUDIT_CAPACITY_CONFLICT); gtin unique per standard (ERR_PRODUCT_GTIN_EXISTS); ingredient weight sum <= 100 (ERR_WEIGHT_SUM_EXCEEDED, 422); sample only on requires_pcr ingredient (ERR_INGREDIENT_NOT_TESTABLE); request shape: required fields, enum membership, numeric ranges, conditional fields (ERR_VALIDATION, 400 — shape errors are evaluated at priority 1.5, right after auth context)"
    error_id: "(see check)"
    http_status: 409
    applies_to: "creation and action endpoints as listed"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Claim standards ---
  - { method: POST, path: "/claim-standards", description: "Create a claim standard (thresholds configuration)", roles: [VerifierAdmin], code: 201, input: [claim_code, name, ingredient_threshold_pct, exemption_max_weight_pct, "audit_validity_months?", "renewal_window_days?", "license_term_days?"], output: ClaimStandard, side_effects: [] }
  - { method: GET, path: "/claim-standards", description: "List claim standards", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["claim_code?"], output: "ClaimStandard[]", side_effects: [] }

  # --- Brands ---
  - { method: POST, path: "/brands", description: "Register a participant brand", roles: [VerifierAdmin], code: 201, input: [name, contact_email], output: Brand, side_effects: ["standing_status GOOD_STANDING, penalty counters 0"] }
  - { method: GET, path: "/brands/{id}", description: "Get one brand (penalty points, standing, verified_product_count)", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: Brand, side_effects: [] }

  # --- Products ---
  - { method: POST, path: "/products", description: "Enroll a product (BrandRep must act for own brand; brand must be GOOD_STANDING)", roles: [BrandRep], code: 201, input: [brand_id, standard_id, name, gtin, annual_volume_units], output: Product, side_effects: ["enrollment_status = DRAFT"] }
  - { method: GET, path: "/products", description: "List products with filters and pagination", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["brand_id?", "standard_id?", "enrollment_status?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Get one product (status, exposure fields, version)", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/products/{id}/submit", description: "Submit enrollment for review (ingredient + affidavit gates)", roles: [BrandRep], code: 200, input: [], output: Product, side_effects: ["DRAFT -> SUBMITTED; exposure fields recomputed"] }
  - { method: POST, path: "/products/{id}/begin-evaluation", description: "Verifier picks up a submitted product", roles: [VerifierAdmin], code: 200, input: [], output: Product, side_effects: ["SUBMITTED -> UNDER_EVALUATION"] }
  - { method: POST, path: "/products/{id}/decide", description: "Verification decision; VERIFIED issues/reinstates the label license, REJECTED requires rejection_reason", roles: [VerifierAdmin], code: 200, input: [decision, "rejection_reason?"], output: Product, side_effects: ["VERIFIED: creates LabelLicense ACTIVE (or reinstates SCOPE_CHANGE-suspended license); brand.verified_product_count recomputed. REJECTED: stores rejection_reason"] }
  - { method: POST, path: "/products/{id}/resubmit", description: "Resubmit a rejected product (clears rejection_reason)", roles: [BrandRep], code: 200, input: [], output: Product, side_effects: ["REJECTED -> SUBMITTED"] }
  - { method: POST, path: "/products/{id}/renew", description: "Annual renewal inside the window; extends license valid_until by license_term_days", roles: [BrandRep], code: 200, input: [], output: Product, side_effects: ["license.valid_until += standard.license_term_days; RENEWAL_DUE -> VERIFIED"] }
  - { method: POST, path: "/products/{id}/reinstate", description: "Lift an enforcement suspension; ENFORCEMENT suspensions extend valid_until by the suspension duration", roles: [VerifierAdmin], code: 200, input: [], output: Product, side_effects: ["SUSPENDED -> VERIFIED; license reactivated with validity compensation per license_validity_extension_on_reinstate"] }

  # --- Ingredients ---
  - { method: POST, path: "/ingredients", description: "Add an ingredient; on a VERIFIED/RENEWAL_DUE product this is a scope change (product -> UNDER_EVALUATION, license SUSPENDED with reason SCOPE_CHANGE)", roles: [BrandRep], code: 201, input: [product_id, name, crop_type, declared_weight_pct], output: Ingredient, side_effects: ["exemption flags computed; scope-change transition when applicable"] }
  - { method: GET, path: "/ingredients", description: "List ingredients", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["product_id?"], output: "Ingredient[]", side_effects: [] }
  - { method: GET, path: "/ingredients/{id}", description: "Get one ingredient (exemption flags, compliance_status)", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: Ingredient, side_effects: [] }

  # --- Affidavits ---
  - { method: POST, path: "/affidavits", description: "Submit a supply-chain segregation affidavit; half-open windows per (ingredient_id, supplier_name) must not overlap SUBMITTED/ACCEPTED siblings", roles: [BrandRep], code: 201, input: [ingredient_id, supplier_name, valid_from, valid_until], output: SupplierAffidavit, side_effects: ["status = SUBMITTED"] }
  - { method: GET, path: "/affidavits", description: "List affidavits", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["ingredient_id?", "status?"], output: "SupplierAffidavit[]", side_effects: [] }
  - { method: GET, path: "/affidavits/{id}", description: "Get one affidavit", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: SupplierAffidavit, side_effects: [] }
  - { method: POST, path: "/affidavits/{id}/review", description: "Accept or reject a submitted affidavit", roles: [VerifierAdmin], code: 200, input: [decision], output: SupplierAffidavit, side_effects: ["SUBMITTED -> ACCEPTED | REJECTED; ingredient compliance_status recomputed"] }

  # --- Sampling plans ---
  - { method: POST, path: "/sampling-plans", description: "Create a PCR sampling plan (OCC on Product.version; supersedes the product's non-CANCELLED plans; requires product UNDER_EVALUATION)", roles: [VerifierAdmin], code: 201, input: [product_id, risk_point, expected_product_version], output: SamplingPlan, side_effects: ["required_sample_count computed; status ACTIVE, or COMPLETED immediately when required == 0; existing ACTIVE/COMPLETED plans of the product -> CANCELLED with superseded_by_plan_id; increments Product.version by 1"] }
  - { method: GET, path: "/sampling-plans", description: "List sampling plans", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["product_id?", "status?"], output: "SamplingPlan[]", side_effects: [] }
  - { method: GET, path: "/sampling-plans/{id}", description: "Get one sampling plan", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: SamplingPlan, side_effects: [] }

  # --- Test samples ---
  - { method: POST, path: "/samples", description: "Collect a sample under a plan; ingredient must belong to the plan's product and require PCR", roles: [LabAnalyst], code: 201, input: [sampling_plan_id, ingredient_id], output: TestSample, side_effects: ["status = COLLECTED"] }
  - { method: GET, path: "/samples", description: "List samples", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["sampling_plan_id?", "ingredient_id?", "status?"], output: "TestSample[]", side_effects: [] }
  - { method: GET, path: "/samples/{id}", description: "Get one sample", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: TestSample, side_effects: [] }
  - { method: POST, path: "/samples/{id}/record-result", description: "Record PCR result", roles: [LabAnalyst], code: 200, input: [result_gmo_pct], output: TestSample, side_effects: ["COLLECTED -> RESULT_RECORDED; recorded_by_user_id = X-User-ID"] }
  - { method: POST, path: "/samples/{id}/confirm", description: "Confirm a recorded result; confirmer must differ from recorder; computes outcome and cascades to ingredient/product/plan", roles: [LabAnalyst], code: 200, input: [], output: TestSample, side_effects: ["RESULT_RECORDED -> CONFIRMED; outcome computed vs threshold; ingredient compliance recompute; product exposure recompute; plan count += 1 and auto-COMPLETED at required"] }
  - { method: POST, path: "/samples/{id}/invalidate", description: "Invalidate a recorded/confirmed sample (compensates confirm)", roles: [LabAnalyst, VerifierAdmin], code: 200, input: [], output: TestSample, side_effects: ["-> INVALIDATED; if was CONFIRMED: plan count -= 1, plan may revert COMPLETED -> ACTIVE, ingredient and product recompute"] }

  # --- Facility audits ---
  - { method: POST, path: "/facility-audits", description: "Schedule a facility audit; at most one audit with status IN {SCHEDULED, REPORT_SUBMITTED} per (brand_id, facility_name)", roles: [VerifierAdmin], code: 201, input: [brand_id, facility_name, auditor_id, scheduled_date], output: FacilityAudit, side_effects: ["status = SCHEDULED"] }
  - { method: GET, path: "/facility-audits", description: "List facility audits", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["brand_id?", "status?"], output: "FacilityAudit[]", side_effects: [] }
  - { method: GET, path: "/facility-audits/{id}", description: "Get one facility audit", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: FacilityAudit, side_effects: [] }
  - { method: POST, path: "/facility-audits/{id}/submit-report", description: "Assigned auditor submits traceability exercise lots; computes traceability_score_pct", roles: [Auditor], code: 200, input: [lots], output: FacilityAudit, side_effects: ["SCHEDULED -> REPORT_SUBMITTED; traceability_score_pct computed"] }
  - { method: POST, path: "/facility-audits/{id}/decide", description: "Verifier decides audit outcome; PASSED requires traceability_score_pct >= 95.00", roles: [VerifierAdmin], code: 200, input: [decision], output: FacilityAudit, side_effects: ["REPORT_SUBMITTED -> PASSED | FAILED; decided_at = now"] }

  # --- Label licenses (read-only; lifecycle via cascades) ---
  - { method: GET, path: "/licenses", description: "List label licenses", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["product_id?", "status?"], output: "LabelLicense[]", side_effects: [] }
  - { method: GET, path: "/licenses/{id}", description: "Get one label license", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: LabelLicense, side_effects: [] }

  # --- Enforcement ---
  - { method: POST, path: "/enforcement-cases", description: "Open a claim-misuse case against any product (also covers unlicensed claim use)", roles: [EnforcementOfficer], code: 201, input: [product_id, source, description], output: EnforcementCase, side_effects: ["status = OPENED; opened_by_user_id = X-User-ID"] }
  - { method: GET, path: "/enforcement-cases", description: "List enforcement cases", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: ["product_id?", "status?"], output: "EnforcementCase[]", side_effects: [] }
  - { method: GET, path: "/enforcement-cases/{id}", description: "Get one enforcement case", roles: [VerifierAdmin, BrandRep, LabAnalyst, Auditor, EnforcementOfficer], code: 200, input: [], output: EnforcementCase, side_effects: [] }
  - { method: POST, path: "/enforcement-cases/{id}/resolve", description: "Resolve a case (resolver != opener); SUBSTANTIATED applies sanction cascades to license, product, and brand", roles: [EnforcementOfficer], code: 200, input: [outcome, "sanction?"], output: EnforcementCase, side_effects: ["OPENED -> DISMISSED | SUBSTANTIATED; on SUBSTANTIATED: penalty points, brand standing recompute, license/product cascade per sanction"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z (the clock never falls back to wall-clock time). Each set runs the sweeps: ACCEPTED affidavits with valid_until <= now -> EXPIRED (ingredient compliance recomputed); ACTIVE licenses with valid_until <= now -> EXPIRED (product -> LAPSED); VERIFIED products whose ACTIVE license enters the renewal window -> RENEWAL_DUE; brand rolling_penalty_points re-evaluated.", roles: [VerifierAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sweeps as described in description"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not recognized" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown or computed field in body, invalid enum member, numeric range violation (weight_pct outside (0,100], result_gmo_pct < 0, valid_from >= valid_until, empty lots, non-positive input_qty), missing conditional field (rejection_reason for REJECTED, sanction for SUBSTANTIATED), sanction present on DISMISSED" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_BRAND_RESOURCE, http: 403, condition: "BrandRep X-User-ID does not match the target resource's brand" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Sample confirmer equals recorder, or case resolver equals opener" }
  - { id: ERR_NOT_ASSIGNED_AUDITOR, http: 403, condition: "submit-report caller is not the audit's assigned auditor_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_PRODUCT_INVALID_STATE, http: 409, condition: "Product transition precondition on enrollment_status failed (incl. submit of non-DRAFT, decide of non-UNDER_EVALUATION, renew of non-VERIFIED/RENEWAL_DUE, reinstate of non-SUSPENDED, resubmit of non-REJECTED, ingredient add on SUBMITTED/REVOKED/LAPSED, plan creation on non-UNDER_EVALUATION, actions on terminal LAPSED/REVOKED)" }
  - { id: ERR_NO_INGREDIENTS, http: 409, condition: "Submit requires at least one ingredient" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Sample creation requires plan ACTIVE; confirm requires plan not CANCELLED" }
  - { id: ERR_SAMPLE_INVALID_STATE, http: 409, condition: "record-result requires COLLECTED; confirm requires RESULT_RECORDED; invalidate requires RESULT_RECORDED or CONFIRMED" }
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "submit-report requires SCHEDULED; decide requires REPORT_SUBMITTED" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "resolve requires case OPENED" }
  - { id: ERR_AFFIDAVIT_NOT_REVIEWABLE, http: 409, condition: "review requires affidavit SUBMITTED (ACCEPTED/REJECTED/EXPIRED are settled)" }
  - { id: ERR_AFFIDAVIT_MISSING, http: 409, condition: "An ingredient with requires_affidavit == true has no ACCEPTED affidavit with valid_from <= now < valid_until (submit, resubmit, renew)" }
  - { id: ERR_AFFIDAVIT_WINDOW_OVERLAP, http: 409, condition: "New affidavit window overlaps a SUBMITTED/ACCEPTED affidavit for the same (ingredient_id, supplier_name); half-open adjacency (valid_from == sibling valid_until) is allowed" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "now is before license.valid_until - renewal_window_days or at/after valid_until" }
  - { id: ERR_AUDIT_NOT_PASSED, http: 409, condition: "No FacilityAudit with status PASSED exists for the brand (decide VERIFIED, renew)" }
  - { id: ERR_AUDIT_STALE, http: 409, condition: "Most recent PASSED audit has decided_at + audit_validity_months months <= now" }
  - { id: ERR_OPEN_ENFORCEMENT_CASE, http: 409, condition: "An EnforcementCase with status OPENED exists for the product (decide VERIFIED, renew, reinstate)" }
  - { id: ERR_NON_COMPLIANT_RESULTS_EXIST, http: 409, condition: "decide VERIFIED: an ingredient has compliance_status NON_COMPLIANT" }
  - { id: ERR_INGREDIENTS_PENDING, http: 409, condition: "decide VERIFIED: an ingredient has compliance_status PENDING (missing confirmed PCR result or current affidavit)" }
  - { id: ERR_INCOMPLETE_SAMPLING, http: 409, condition: "decide VERIFIED: a non-CANCELLED SamplingPlan is not COMPLETED" }
  - { id: ERR_AUDIT_CAPACITY_CONFLICT, http: 409, condition: "Another audit with status IN {SCHEDULED, REPORT_SUBMITTED} exists for the same (brand_id, facility_name)" }
  - { id: ERR_TRACE_SCORE_BELOW_MIN, http: 409, condition: "decide PASSED with traceability_score_pct < 95.00" }
  - { id: ERR_PRODUCT_GTIN_EXISTS, http: 409, condition: "Another product under the same standard_id already uses this gtin" }
  - { id: ERR_INGREDIENT_NOT_TESTABLE, http: 409, condition: "Sample creation on an ingredient with requires_pcr == false" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 409, condition: "Sample's ingredient does not belong to the sampling plan's product" }
  - { id: ERR_BRAND_ON_PROBATION, http: 403, condition: "Brand standing_status == PROBATION (lifetime_penalty_points >= 20): blocks product enrollment and renewal" }
  - { id: ERR_BRAND_RECENT_PENALTIES, http: 403, condition: "brand.rolling_penalty_points >= 10: blocks decide VERIFIED and renewal" }
  - { id: ERR_WEIGHT_SUM_EXCEEDED, http: 422, condition: "Sum of declared_weight_pct over the product's ingredients would exceed 100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_product_version does not match Product.version (OCC on sampling-plan creation)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VerifierAdmin
    description: "Verifier program administrator: standards, brands, evaluation decisions, affidavit review, sampling plans, audit scheduling and decisions, reinstatements, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /claim-standards"
      - "POST /brands"
      - "POST /products/{id}/begin-evaluation"
      - "POST /products/{id}/decide"
      - "POST /products/{id}/reinstate"
      - "POST /affidavits/{id}/review"
      - "POST /sampling-plans"
      - "POST /facility-audits"
      - "POST /facility-audits/{id}/decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /samples/{id}/invalidate (with LabAnalyst)"
      - "all GET endpoints"
  - name: BrandRep
    description: "Participant company representative; X-User-ID equals the Brand id they act for"
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/submit"
      - "POST /products/{id}/resubmit"
      - "POST /products/{id}/renew"
      - "POST /ingredients"
      - "POST /affidavits"
    shared_operations: ["all GET endpoints"]
  - name: LabAnalyst
    description: "PCR laboratory analyst; the recorder of a result may not confirm it (segregation of duties by X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /samples"
      - "POST /samples/{id}/record-result"
      - "POST /samples/{id}/confirm"
    shared_operations:
      - "POST /samples/{id}/invalidate (with VerifierAdmin)"
      - "all GET endpoints"
  - name: Auditor
    description: "Field auditor; may submit the traceability report only for audits where auditor_id == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /facility-audits/{id}/submit-report"
    shared_operations: ["all GET endpoints"]
  - name: EnforcementOfficer
    description: "Claim-misuse investigator; the opener of a case may not resolve it (segregation of duties by X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement-cases"
      - "POST /enforcement-cases/{id}/resolve"
    shared_operations: ["all GET endpoints"]
