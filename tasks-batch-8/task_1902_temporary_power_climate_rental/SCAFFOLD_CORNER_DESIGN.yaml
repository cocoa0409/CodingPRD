scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_status, entities.Customer.fields.standby_contract, entities.Customer.fields.sla_response_minutes, entities.Customer.fields.loyalty_discount_pct]
        distinguishing_aspect: "Omitting all optional fields yields credit_status GOOD, standby_contract false, sla_response_minutes 240, loyalty_discount_pct 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Default Co", billing_email: "ap@default.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id, cs: $.data.credit_status, sb: $.data.standby_contract, sla: $.data.sla_response_minutes, disc: $.data.loyalty_discount_pct }
          trigger: []
          assert:
            - "response 201; credit_status == GOOD, standby_contract == false, sla_response_minutes == 240, loyalty_discount_pct == 0"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: contract_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: [entities.RentalContract.fields.expected_offhire_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /rental-contracts without expected_offhire_date fails with ERR_VALIDATION (400) before any state or business check."
        test_recipe:
          setup: ["Customer C1 and Site S1 exist"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z" }
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400; no contract persisted (GET /power-rental/rental-contracts?customer_id=${cust_id} total_count == 0)"

      - name: site_computed_tank_level_input_ignored
        claim_type: computed_fields
        grounds: [entities.Site.fields.tank_level_liters]
        distinguishing_aspect: "Client-supplied tank_level_liters on site creation is ignored; the computed field initializes to 0."
        test_recipe:
          setup: ["Customer C1 exists"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000, tank_level_liters: 999 }
              as: SalesEngineer
              captures: { lvl: $.data.tank_level_liters }
          assert:
            - "response 201 and tank_level_liters == 0 (client input for computed field ignored)"

      - name: site_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /power-rental/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_NOT_FOUND, http 404"]

      - name: accessory_kit_immutable_and_unique_code
        claim_type: immutability
        grounds: [entities.AccessoryKit, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "AccessoryKit has common_fields false: response carries id and created_at but no version/updated_at; duplicate kit_code rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Kit CABLE-400A created"]
          setup_api_calls:
            - call: "POST /power-rental/accessory-kits"
              payload: { kit_code: "CABLE-400A", description: "400A cable + distro kit", max_ampacity_a: 400, day_rate_cents: 3000, week_rate_cents: 15000, month_rate_cents: 50000 }
              as: DepotManager
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /power-rental/accessory-kits"
              payload: { kit_code: "CABLE-400A", description: "duplicate", max_ampacity_a: 400, day_rate_cents: 3000, week_rate_cents: 15000, month_rate_cents: 50000 }
              as: DepotManager
              captures: { err: $.data.error_id }
            - call: "GET /power-rental/accessory-kits/${kit_id}"
              payload: {}
              as: DepotManager
          assert:
            - "duplicate create: error_id == ERR_VALIDATION (kit_code unique)"
            - "GET response contains id and created_at but no version and no updated_at fields"

      - name: telemetry_event_append_only_and_filterable
        claim_type: immutability
        grounds: [entities.TelemetryEvent, endpoints]
        distinguishing_aspect: "TelemetryEvent exposes create/read/list only; a created event is retrievable by id and via event_type filter, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Contract K1 ON_RENT with Unit U1 DEPLOYED (standard TX chain); clock 2026-09-03"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /power-rental/telemetry-events"
              payload: { equipment_unit_id: "${unit_id}", contract_id: "${con_id}", event_type: "RUNTIME", value: 4 }
              as: FieldTechnician
              captures: { ev_id: $.data.id }
            - call: "GET /power-rental/telemetry-events/${ev_id}"
              payload: {}
              as: FieldTechnician
              captures: { ev_val: $.data.value }
            - call: "GET /power-rental/telemetry-events"
              payload: { contract_id: "${con_id}", event_type: "RUNTIME" }
              as: FieldTechnician
          assert:
            - "created event readable by id with value == 4 and created_at set; no version field (common_fields false)"
            - "filtered list by contract_id + event_type RUNTIME returns exactly 1 item"

  # ===========================================================================
  # State machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_from_quoted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RentalContract.DRAFT_to_QUOTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating quote on an already-QUOTED contract is rejected with ERR_INVALID_STATE and does not change quoted_at/version."
        test_recipe:
          setup: ["Contract K1 QUOTED with one EQUIPMENT line (TX standard chain)"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { v_after_q: $.data.version }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
            - "second quote: error_id == ERR_INVALID_STATE (409)"
            - "contract version unchanged (== ${v_after_q}) and quoted fields unmodified"

      - name: terminal_contract_mutation_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RentalContract, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Mobilizing a CANCELLED contract returns ERR_ALREADY_TERMINAL (not merely ERR_INVALID_STATE); terminal states admit no transitions."
        test_recipe:
          setup: ["Contract K1 in DRAFT, then cancelled -> CANCELLED"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/cancel"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_ALREADY_TERMINAL (409); contract remains CANCELLED"]

      - name: permit_resubmit_loop_exhaustion
        claim_type: valid_transition
        grounds: [state_machines.Permit.REJECTED_to_SUBMITTED, "errors[ERR_PERMIT_REVIEW_EXHAUSTED]"]
        distinguishing_aspect: "The REJECTED -> SUBMITTED cycle is permitted exactly while review_rounds < 3: three submissions succeed, the fourth attempt returns ERR_PERMIT_REVIEW_EXHAUSTED."
        test_recipe:
          setup: ["Contract K1 CONFIRMED (TX standard chain); Permit P1 (EMISSIONS) created for K1"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/permits"
              payload: { contract_id: "${con_id}", permit_type: "EMISSIONS" }
              as: SalesEngineer
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /power-rental/permits/${perm_id}/submit"
              payload: {}
              as: SalesEngineer
              captures: { r1: $.data.review_rounds }
            - call: "POST /power-rental/permits/${perm_id}/record-decision"
              payload: { outcome: "REJECTED" }
              as: SalesEngineer
            - call: "POST /power-rental/permits/${perm_id}/resubmit"
              payload: {}
              as: SalesEngineer
              captures: { r2: $.data.review_rounds }
            - call: "POST /power-rental/permits/${perm_id}/record-decision"
              payload: { outcome: "REJECTED" }
              as: SalesEngineer
            - call: "POST /power-rental/permits/${perm_id}/resubmit"
              payload: {}
              as: SalesEngineer
              captures: { r3: $.data.review_rounds }
            - call: "POST /power-rental/permits/${perm_id}/record-decision"
              payload: { outcome: "REJECTED" }
              as: SalesEngineer
            - call: "POST /power-rental/permits/${perm_id}/resubmit"
              payload: {}
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
            - "review_rounds progress 1, 2, 3 across the three submissions"
            - "fourth resubmit: error_id == ERR_PERMIT_REVIEW_EXHAUSTED (422); permit stays REJECTED with review_rounds == 3"

      - name: emergency_visit_happy_path_sla_boundary
        claim_type: valid_transition
        grounds: [state_machines.ServiceVisit, calculations.standby_sla_evaluation]
        distinguishing_aspect: "EMERGENCY visit runs SCHEDULED -> DISPATCHED -> ON_SITE -> COMPLETED; arriving exactly 240 minutes after request meets the SLA (<= boundary), response_minutes == 240, sla_met == true."
        test_recipe:
          setup:
            - "Customer C1 with standby_contract true, sla_response_minutes 240; contract K1 ON_RENT (TX standard chain)"
            - "All lifecycle steps execute at the default clock 2026-08-01T00:00:00Z; clock then advanced +240 minutes before arrive"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Standby Co", billing_email: "ops@standby.example", standby_contract: true, sla_response_minutes: 240 }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
          trigger:
            - call: "POST /power-rental/service-visits"
              payload: { visit_type: "EMERGENCY", contract_id: "${con_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { visit_id: $.data.id, req_at: $.data.requested_at }
            - call: "POST /power-rental/service-visits/${visit_id}/dispatch"
              payload: { assigned_technician_id: "tech-9" }
              as: FleetDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /power-rental/service-visits/${visit_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-9"
              captures: { resp: $.data.response_minutes, met: $.data.sla_met }
            - call: "POST /power-rental/service-visits/${visit_id}/complete"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-9"
              captures: { v_status: $.data.status }
          assert:
            - "requested_at == 2026-08-01T00:00:00Z (default logical clock)"
            - "response_minutes == 240 and sla_met == true (<= boundary meets SLA)"
            - "visit ends COMPLETED"

      - name: quote_expiry_sweep_releases_unit
        claim_type: side_effect_execution
        grounds: [state_machines.RentalContract.QUOTED_to_EXPIRED, endpoints]
        distinguishing_aspect: "Advancing the logical clock past quoted_at + 7 days auto-expires a QUOTED contract and runs the compensation: line RELEASED, unit back to AVAILABLE."
        test_recipe:
          setup: ["Contract K1 QUOTED at default clock 2026-08-01 with U1 RESERVED via line L1"]
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
              captures: { line_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /_clock/set_current_utc"
