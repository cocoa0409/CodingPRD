      - name: deal_price_negotiation_loops_back_through_countered_twice
        claim_type: cyclic
        grounds:
          - "state_machines.Deal[OFFER_SUBMITTED -> COUNTERED]"
          - "state_machines.Deal[COUNTERED -> OFFER_SUBMITTED]"
          - "entities.Deal.fields.offer_round"
          - "complexity_profile.state_machine_shape"
        distinguishing_aspect: "The claim is that the Deal machine's OFFER_SUBMITTED <-> COUNTERED pair is a true cycle re-enterable more than once with offer_round as the loop counter, rather than a one-shot counter step."
        excluded_because:
          difficulty_instance: "deal_offer_countered_offer_negotiation_cycle"
          rationale: "That \u00a71.8 instance already drives the cycle twice (round 1 -> counter 330000 -> re-offer 335000 -> counter 332000 -> accept), asserting offer_round 1..5, current_offer_price_cents after each hop and the ERR_COUNTER_NOT_IMPROVED guard on a non-improving counter. A separate \u00a71.9 recipe would replay the same endpoint sequence against the same deal with no new observable, so this corner is covered there in full."

      - name: license_transfer_waive_is_guarded_by_buyer_state_and_profile_reciprocity
        claim_type: guarded_transitions
        grounds:
          - "state_machines.LicenseTransfer[NOT_STARTED -> WAIVED]"
          - "errors.ERR_RECIPROCITY_NOT_AVAILABLE"
          - "endpoints[POST /license-transfers/{id}/waive]"
        distinguishing_aspect: "The claim is that NOT_STARTED -> WAIVED is a guarded transition whose guard reads two entities the transfer does not own (Buyer.license_status and StateLicenseProfile.reciprocity_states), so the same call succeeds or fails purely on the counterparties' data."
        excluded_because:
          difficulty_instance: "license_waiver_depends_on_buyer_state_and_profile_reciprocity"
          rationale: "That \u00a71.8 instance exercises all three guard outcomes on identical waive calls: a LICENSED AZ buyer against an NV profile listing AZ as reciprocal (WAIVED, waiver_basis RECIPROCITY_AZ), a PENDING-licence buyer (ERR_RECIPROCITY_NOT_AVAILABLE) and a LICENSED buyer whose state is absent from reciprocity_states (ERR_RECIPROCITY_NOT_AVAILABLE). Both guard clauses and the success path are therefore already claimed."

      - name: terminating_a_funded_deal_compensates_every_earlier_side_effect
        claim_type: compensation
        grounds:
          - "state_machines.Deal[ESCROW_FUNDED -> TERMINATED]"
          - "state_machines.EscrowAccount[FUNDED -> REFUNDED]"
          - "calculations.escrow_conservation_invariant"
          - "endpoints[POST /deals/{id}/terminate]"
        distinguishing_aspect: "The claim is that terminating a funded deal is a compensating transition: the escrow refunds every cent to the buyer, non-terminal licence transfers are CANCELLED, INTRODUCED accounts fall back to PENDING with their sequence numbers cleared and the listing returns to LISTED."
        excluded_because:
          difficulty_instance: "terminate_funded_deal_conserves_escrow_cash"
          rationale: "That \u00a71.8 instance asserts the whole compensation set from one terminate call on an ESCROW_FUNDED deal -- disbursed_to_buyer_cents == funded_amount_cents == 171000 with every other bucket at 0, both accounts back to PENDING with introduced_on and introduction_sequence_no null, the listing's introductions_completed_count recomputed to 0, the licence transfers CANCELLED and the listing back to LISTED -- plus the cash-conservation identity. A \u00a71.9 recipe would duplicate it exactly."

  - section: calculations
    note: "Table-3 claims over the fourteen 1.3 calculations: the QUARTERLY normalisation, LISTED_BASIS input-set membership, the commission/holdback constant tiers, a precision stub, variant selection at diligence and the replacement-credit reconciliation that reverses a clawback trigger."
    instances:

      - name: account_claimed_recurring_mrr_normalises_quarterly_billing
        claim_type: correct_result
        grounds:
          - "calculations.account_claimed_recurring_mrr"
          - "entities.ServiceAccount.fields.billing_frequency"
          - "entities.ServiceAccount.fields.claimed_recurring_mrr_cents"
          - "calculations.listing_claimed_mrr_conservation_invariant"
        distinguishing_aspect: "Two accounts carry byte-identical money inputs (46000 service, 3000 INCLUDED chemical, 900 repair) and differ only in billing_frequency, so the QUARTERLY divisor is the sole cause of 18333 versus 49000 -- and because the division rounds BEFORE the chemical component is added, the quarterly answer is 15333 + 3000 and not round_half_up(49000 / 3) = 16333."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, ACTIVE seller, APPROVED buyer."
            - "DRAFT listing PHX-QTR with no accounts yet."
            - "Both accounts start 2019-03-15 on different route days so no other rule interferes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-QTR", "state_code": "AZ", "asking_price_cents": 700000, "listed_mrr_cents": 67333, "listed_account_count": 2, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_q": "$.data.id"}
          trigger:
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_q}", "customer_ref": "Q1-QUARTERLY", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 46000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 900, "chemical_billing_method": "INCLUDED", "billing_frequency": "QUARTERLY"}
              as: Broker
              captures: {"q1": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_q}", "customer_ref": "Q2-MONTHLY", "service_start_date": "2019-03-15", "route_day": "WED", "monthly_service_fee_cents": 46000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 900, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"q2": "$.data.id"}
            - call: "GET /route-listings/${l_q}"
              as: Broker
          assert:
            - "Q1 (QUARTERLY): HTTP 201, data.claimed_recurring_mrr_cents == 18333 (round_half_up(46000 / 3) = 15333, plus the 3000 INCLUDED chemical)."
            - "Q1's claimed_recurring_mrr_cents is NOT 16333 -- the rounding happens on the service component alone, before the chemical is added."
            - "Q2 (MONTHLY): HTTP 201, data.claimed_recurring_mrr_cents == 49000 (46000 + 3000)."
            - "Neither account's claimed_recurring_mrr_cents includes avg_monthly_repair_cents."
            - "GET listing: claimed_recurring_mrr_cents == 67333 (18333 + 49000), claimed_repair_mrr_cents == 1800 (900 + 900, undivided) and claimed_account_count == 2."

      - name: listed_basis_valuation_filters_out_excluded_accounts_only
        claim_type: input_set_filtering
        grounds:
          - "calculations.route_valuation.variants.LISTED_BASIS"
          - "entities.RouteValuation.fields.included_account_count"
          - "endpoints[POST /route-listings/{id}/valuations]"
          - "state_machines.ServiceAccount[UNVERIFIED -> EXCLUDED]"
        distinguishing_aspect: "LISTED_BASIS membership is 'every account whose verification_status != EXCLUDED', which is a strictly weaker filter than VERIFIED_BASIS: with A3 excluded and A2 left UNVERIFIED, the unverified A2 still contributes its claimed 15000, and the drop from 463500 to 351500 is caused by A3's exclusion alone -- including the multiple falling from 10.5 to 11.0 as the weighted age rises."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, seller, buyer."
            - "DRAFT listing PHX-NE with A1 (claimed 16000, age 88, repair 1500), A2 (claimed 15000, age 38, repair 2000) and A3 (claimed 12000, age 17, repair 500)."
            - "A first LISTED_BASIS valuation over all three accounts already exists (463500)."
            - "A3 is then EXCLUDED while A2 stays UNVERIFIED, and the listing version is re-read afterwards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A1-SUNRISE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 12000, "avg_monthly_chemical_cents": 4000, "avg_monthly_repair_cents": 1500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a1_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A2-MESA", "service_start_date": "2023-06-01", "route_day": "MON", "monthly_service_fee_cents": 15000, "avg_monthly_chemical_cents": 5000, "avg_monthly_repair_cents": 2000, "chemical_billing_method": "PASS_THROUGH", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a2_id": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${listing_id}", "customer_ref": "A3-GILBERT", "service_start_date": "2025-02-10", "route_day": "WED", "monthly_service_fee_cents": 9000, "avg_monthly_chemical_cents": 3000, "avg_monthly_repair_cents": 500, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a3_id": "$.data.id"}
            - call: "GET /route-listings/${listing_id}"
              as: Broker
              captures: {"listing_v": "$.data.version"}
            - call: "POST /route-listings/${listing_id}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${listing_v}"}
              as: Broker
              captures: {"v_listed_id": "$.data.id"}
            - call: "POST /service-accounts/${a3_id}/exclude"
              payload: {"exclusion_reason_code": "DISPUTED_HISTORY"}
              as: Broker
            - call: "GET /route-listings/${listing_id}"
              as: Broker
              captures: {"listing_v3": "$.data.version"}
          trigger:
            - call: "POST /route-listings/${listing_id}/valuations"
              payload: {"basis": "LISTED_BASIS", "expected_listing_version": "${listing_v3}"}
              as: Broker
              captures: {"v_listed2": "$.data.id"}
            - call: "GET /route-valuations/${v_listed_id}"
              as: Broker
          assert:
            - "HTTP 201."
            - "data.recurring_mrr_cents == 31000 (A1 16000 + A2 15000; the UNVERIFIED A2 is IN the set, only the EXCLUDED A3 is out)."
            - "data.included_account_count == 2."
            - "data.weighted_avg_account_months == 63 (floor((16000*88 + 15000*38) / 31000))."
            - "data.base_multiple == 10.0 (31000 is in the 30000..99999 tier) and data.age_adjustment == 1.0 (63 >= 60), so data.effective_multiple == 11.0."
            - "data.recurring_component_cents == 341000 and data.repair_component_cents == 10500 (3500 repair * 3.0)."
            - "data.valuation_cents == 351500."
            - "data.basis == \"LISTED_BASIS\" and data.is_superseded == false."
            - "GET the earlier valuation ${v_listed_id}: valuation_cents == 463500 with is_superseded == true -- the 3-account number is retained for audit, not recomputed."

      - name: commission_tier_and_cash_holdback_cap_constants_applied
