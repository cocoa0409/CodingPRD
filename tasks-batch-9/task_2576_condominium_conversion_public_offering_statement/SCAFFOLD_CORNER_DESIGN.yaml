            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0, condition_rating: "EXCELLENT" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_roof: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "FOUNDATION", remaining_useful_life_years: 40, effective_age_years: 10, replacement_cost_cents: 4000000, funded_pct_bp: 0, condition_rating: "EXCELLENT", is_structural: true }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_found: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /major-components/${mc_roof}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_found}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_roof}/verification"
              payload: { verified: false }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
          assert:
            - "before the trigger: EngineeringReport.${er_id}.verified_component_count == 0"
            - "before the trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 0"
            - "after first trigger: http status == 200 and the response MajorComponent.verification_status == VERIFIED"
            - "after second trigger: http status == 200"
            - "after second trigger: EngineeringReport.${er_id}.verified_component_count == 1"
            - "after second trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 10000000"
            - "after second trigger: MajorComponent.${mc_found}.verification_status == UNVERIFIED"
            - "after third trigger: EngineeringReport.${er_id}.verified_component_count == 2"
            - "after third trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 14000000"
            - "after fourth trigger: MajorComponent.${mc_roof}.verification_status == UNVERIFIED"
            - "after fourth trigger: EngineeringReport.${er_id}.verified_component_count == 1"
            - "after fourth trigger: EngineeringReport.${er_id}.total_replacement_cost_cents == 4000000"
            - "after fourth trigger: GET /engineering-reports/${er_id}/major-components?verification_status=VERIFIED returns total_count == 1"
