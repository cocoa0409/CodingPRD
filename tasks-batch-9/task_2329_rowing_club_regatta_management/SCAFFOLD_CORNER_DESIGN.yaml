          rationale: "The state-category rule at priority 14 winning over the fiscal rule at priority 54 when both are violated is asserted by the named §1.8 instance, together with the single-violation control cases."

      - name: corner_launch_coverage_versus_driver_overbooking_ordering_covered_by_difficulty
        claim_type: priority_ordering
        grounds:
          - validations[priority=32]
          - validations[priority=36]
        excluded_because:
          difficulty_instance: clear_launch_coverage_safety_outranks_driver_overbooking_temporal
          rationale: "The safety-coverage rule at priority 32 outranking the temporal overbooking rule at priority 36 is asserted by the named §1.8 instance."

  - section: endpoints
    instances:
      - name: corner_shell_get_after_create_returns_the_stored_row
        claim_type: standard_crud
        grounds:
          - endpoints[GET /boathouse/shells/{id}]
          - endpoints[POST /boathouse/shells]
        distinguishing_aspect: "The read-back of a freshly created hull returns the same id and inputs the create call reported, including the defaults the client never sent, proving the row was persisted rather than echoed."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
          trigger:
            - call: "GET /boathouse/shells/${shell_id}"
              payload: {}
              as: ClubAdmin
          assert:
            - "the response returns HTTP 200 with data.id == ${shell_id}"
            - "data.hull_name == Kingfisher, data.boat_class == 1X, data.hull_weight_kg == 14.0 and data.home_bay == BAY-1"
            - "data.status == AVAILABLE, data.tier_restriction == ANY, data.condition_index_conservative == 100 and data.condition_index_optimistic == 100"
            - "data.version == 1 with created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: corner_damage_report_triage_action_endpoint_records_disposition
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /boathouse/damage-reports/{id}/triage]
          - state_machines.DamageReport.REPORTED_to_TRIAGED
        distinguishing_aspect: "Triage by an EquipmentManager who is not the reporter moves REPORTED -> TRIAGED and records the disposition, while the hull stays DAMAGED because only a verified repair returns it to service."
        test_recipe:
          setup:
            - "one certified coach as reporter, one EquipmentManager, one hull with one fresh MINOR report"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${coach_id}", severity: "MINOR", narrative: "loose foot stretcher" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /boathouse/damage-reports/${report_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "DamageReport.${report_id}.status == TRIAGED with triaged_by_user_id == ${equip_id} and assigned_repair_bay still null"
            - "DamageReport.${report_id}.severity_points == 6 (a fresh MINOR, no decay applied yet)"
            - "Shell.${shell_id}.status == DAMAGED and condition_index_conservative == 94"

      - name: corner_delinquency_run_sweeps_only_past_due_invoices
        claim_type: bulk_action
        grounds:
          - endpoints[POST /boathouse/ops/dues-delinquency-run]
          - state_machines.DuesInvoice.ISSUED_to_DELINQUENT
        distinguishing_aspect: "The sweep is a bulk action with a per-row predicate: of two ISSUED invoices it moves only the one whose due_at is behind the clock, returns just that row in its DuesInvoice[] payload, and leaves the second member ACTIVE."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "two RECREATIONAL members, each with one 12-month season 2026 invoice assessed at 74000"
            - "member A's invoice is due 2026-07-01 (past due), member B's is due 2026-09-01"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Anna Overdue", tier: "RECREATIONAL", body_weight_kg: 70.0 }
              as: ClubAdmin
              captures: { a_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Ben Current", tier: "RECREATIONAL", body_weight_kg: 72.0 }
              as: ClubAdmin
              captures: { b_id: $.data.id }
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "${a_id}", season_year: 2026, billable_months: 12, due_at: "2026-07-01T00:00:00Z" }
              as: ClubAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "${b_id}", season_year: 2026, billable_months: 12, due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdmin
              captures: { inv_b_id: $.data.id }
          trigger:
            - call: "POST /boathouse/ops/dues-delinquency-run"
              payload: { season_year: 2026 }
              as: ClubAdmin
          assert:
            - "the response data array holds exactly one row whose id == ${inv_a_id}"
            - "DuesInvoice.${inv_a_id}.status == DELINQUENT and DuesInvoice.${inv_b_id}.status == ISSUED"
            - "Member.${a_id}.membership_status == DUES_HOLD with boathouse_access_level == NONE"
            - "Member.${b_id}.membership_status == ACTIVE with dues_balance_cents == 74000, so a non-zero balance alone does not trigger the hold"

      - name: corner_close_entries_before_deadline_returns_409
        claim_type: conditional_action
        grounds:
          - validations[priority=22]
          - errors[ERR_INVALID_STATUS_TRANSITION]
          - state_machines.Regatta.OPEN_FOR_ENTRY_to_ENTRIES_CLOSED
        distinguishing_aspect: "OPEN_FOR_ENTRY -> ENTRIES_CLOSED is a declared transition but carries the precondition clock >= entry_deadline_at, so requesting it at the 2026-08-01 clock returns HTTP 409 ERR_INVALID_STATUS_TRANSITION — the same error the undeclared-target case uses."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default, one HOME regatta whose entry_deadline_at is 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
          trigger:
            - call: "POST /boathouse/regattas/${regatta_id}/status-transitions"
              payload: { to_status: "ENTRIES_CLOSED" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_INVALID_STATUS_TRANSITION"
            - "Regatta.${regatta_id}.status == OPEN_FOR_ENTRY and version is unchanged at 1"

      - name: corner_lineup_declaration_links_seats_to_entry_and_members
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /boathouse/regatta-entries/{id}/lineup]
          - entities.LineupSeat
        distinguishing_aspect: "The lineup call is the association endpoint between RegattaEntry and Member: it materialises one LineupSeat per declared seat with the default weigh_in_status NOT_REQUIRED and eligibility_status ELIGIBLE, and bumps the entry's version exactly once for the whole batch."
        test_recipe:
          setup:
            - "one certified coach, two rowers with current swim tests, one 2X hull, one HOME regatta, one DRAFT 2X entry at version 1"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row One", tier: "COMPETITIVE", body_weight_kg: 82.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row Two", tier: "COMPETITIVE", body_weight_kg: 83.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Grebe", boat_class: "2X", hull_weight_kg: 27.0, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Club Head Race", host_club: "Home RC", venue_kind: "HOME", race_date_at: "2026-08-12T08:00:00Z", entry_deadline_at: "2026-08-10T00:00:00Z", scratch_deadline_at: "2026-08-11T00:00:00Z", weigh_in_opens_at: "2026-08-12T06:00:00Z", weigh_in_closes_at: "2026-08-12T07:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell_id}", event_code: "M2X_OPEN", boat_class: "2X", seed_time_seconds: 400.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { entry_id: $.data.id, entry_v: $.data.version }
          trigger:
            - call: "POST /boathouse/regatta-entries/${entry_id}/lineup"
              payload: { expected_regatta_entry_version: "${entry_v}", seats: [{ member_id: "${r1_id}", seat_number: 1, seat_role: "ROWER" }, { member_id: "${r2_id}", seat_number: 2, seat_role: "ROWER" }] }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "RegattaEntry.${entry_id}.status == LINEUP_DECLARED and version == 2, one bump for the batch"
            - "GET /boathouse/lineup-seats?regatta_entry_id=${entry_id} returns total_count == 2 with member_ids ${r1_id} and ${r2_id} at seat_number 1 and 2"
            - "both LineupSeat rows have seat_role == ROWER, weigh_in_status == NOT_REQUIRED, eligibility_status == ELIGIBLE, weighed_kg == null and deadweight_kg == 0"
            - "GET /boathouse/lineup-seats?member_id=${r1_id} returns total_count == 1, so the seat is reachable from the member side too"

      - name: corner_rack_release_conditional_action_covered_by_difficulty
        claim_type: conditional_action
        grounds:
          - endpoints[POST /boathouse/trailer-loads/{id}/rack-releases]
        excluded_because:
          difficulty_instance: rack_units_conserved_across_assignment_release_cycles
          rationale: "Release-then-reassign behaviour, including the reissue of the freed contiguous slot and the conservation of rack_units_used + rack_units_free, is asserted by the named §1.8 instance."

  - section: errors
    instances:
      - name: corner_request_without_auth_headers_returns_401
        claim_type: triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "The authentication check sits at priority 1, ahead of role checks and path-id resolution, so a request with both X-Role and X-User-ID omitted returns HTTP 401 ERR_MISSING_AUTH_HEADERS even when the body is well formed."
        test_recipe:
          setup:
            - "empty database"
            - "the trigger call is issued with the X-Role and X-User-ID headers omitted entirely; the role recorded below is only the one that would otherwise have applied"
          setup_api_calls: []
          trigger:
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
          assert:
            - "the call returns HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADERS"
            - "GET /boathouse/shells with valid headers returns total_count == 0, so nothing was created"

      - name: corner_unknown_path_ids_return_entity_specific_not_found
        claim_type: triggerability
        grounds:
          - validations[priority=3]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_SHELL_NOT_FOUND]
          - errors[ERR_DUES_INVOICE_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_REGATTA_NOT_FOUND]
          - errors[ERR_ENTRY_NOT_FOUND]
          - errors[ERR_HEAT_NOT_FOUND]
          - errors[ERR_TRAILER_NOT_FOUND]
          - errors[ERR_DAMAGE_REPORT_NOT_FOUND]
          - errors[ERR_READING_NOT_FOUND]
          - errors[ERR_SEAT_NOT_FOUND]
          - errors[ERR_LANE_NOT_FOUND]
          - errors[ERR_PROTEST_NOT_FOUND]
        distinguishing_aspect: "Priority 3 resolves path ids to an entity-specific 404 rather than a generic one: the same unknown UUID produces ERR_SHELL_NOT_FOUND on the shell route, ERR_HEAT_NOT_FOUND on the heat route, and so on across every top-level collection."
        test_recipe:
          setup:
            - "empty database; the id 00000000-0000-0000-0000-000000000000 exists nowhere"
          setup_api_calls: []
          trigger:
            - call: "GET /boathouse/shells/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/dues-invoices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/water-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/regattas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/regatta-entries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/heats/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/trailer-loads/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/damage-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/water-condition-readings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/lineup-seats/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/race-lanes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/protests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
            - call: "GET /boathouse/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClubAdmin
          assert:
            - "each call returns HTTP 404"
            - "data.error_id is ERR_SHELL_NOT_FOUND, ERR_DUES_INVOICE_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_REGATTA_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_HEAT_NOT_FOUND, ERR_TRAILER_NOT_FOUND, ERR_DAMAGE_REPORT_NOT_FOUND, ERR_READING_NOT_FOUND, ERR_SEAT_NOT_FOUND, ERR_LANE_NOT_FOUND, ERR_PROTEST_NOT_FOUND and ERR_MEMBER_NOT_FOUND respectively"
            - "every response carries data.message, so the error envelope shape is uniform"

      - name: corner_session_return_before_launch_returns_409
        claim_type: triggerability
        grounds:
          - validations[priority=11]
          - errors[ERR_SESSION_NOT_LAUNCHED]
        distinguishing_aspect: "Returning a session that is only CLEARED — never LAUNCHED — yields HTTP 409 ERR_SESSION_NOT_LAUNCHED, and the athlete's logged_session_count stays 0."
        test_recipe:
          setup:
            - "one certified coach, one SafetyOfficer, one rower, one hull, one OPEN reading, one CLEARED session"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0 }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 22.0, water_temp_c: 19.0, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_id: $.data.id }
            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T07:00:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${rita_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { session_id: $.data.id }
            - call: "POST /boathouse/water-sessions/${session_id}/clear"
              payload: { reading_id: "${reading_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /boathouse/water-sessions/${session_id}/return"
              payload: { note: "back at the dock" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_SESSION_NOT_LAUNCHED"
            - "WaterSession.${session_id}.status == CLEARED with actual_return_at == null"
            - "Member.${rita_id}.logged_session_count == 0 and Shell.${shell_id}.status == ASSIGNED"

      - name: corner_schedule_repair_before_triage_returns_409
        claim_type: triggerability
        grounds:
          - validations[priority=12]
          - errors[ERR_REPORT_NOT_TRIAGED]
        distinguishing_aspect: "Reserving a repair bay for a report still in REPORTED returns HTTP 409 ERR_REPORT_NOT_TRIAGED, so no bay window is written and the temporal bay-conflict rule at priority 37 never runs."
        test_recipe:
          setup:
            - "one certified coach as reporter, one EquipmentManager, one hull with one fresh MAJOR report in REPORTED"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${coach_id}", severity: "MAJOR", narrative: "cracked rib at station 4" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /boathouse/damage-reports/${report_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-R1", repair_window_start_at: "2026-08-02T08:00:00Z", repair_window_end_at: "2026-08-02T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_REPORT_NOT_TRIAGED"
            - "DamageReport.${report_id}.status == REPORTED with assigned_repair_bay == null, repair_window_start_at == null and repair_window_end_at == null"
            - "Shell.${shell_id}.status == DAMAGED"

      - name: corner_submit_before_lineup_declared_returns_409
        claim_type: triggerability
        grounds:
          - validations[priority=15]
          - errors[ERR_ENTRY_NOT_DECLARED]
        distinguishing_aspect: "Submitting a DRAFT entry that has no seats returns HTTP 409 ERR_ENTRY_NOT_DECLARED before any fee is computed, so total_fee_cents stays 0."
        test_recipe:
          setup:
            - "one certified coach, one 1X hull, one HOME regatta, one DRAFT entry with no lineup"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Kingfisher", boat_class: "1X", hull_weight_kg: 14.0, home_bay: "BAY-1" }
              as: ClubAdmin
