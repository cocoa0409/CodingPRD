      - name: custody_triggers_from_a_state_that_does_not_declare_them_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Intake.custody_state
          - errors[ERR_INVALID_CUSTODY_STATE]
          - validations[priority=8]
        distinguishing_aspect: "From RECEIVED, neither discharge nor package is a declared trigger, and from IDENTIFIED neither package nor release is: all four return ERR_INVALID_CUSTODY_STATE while the row stays untouched."
        test_recipe:
