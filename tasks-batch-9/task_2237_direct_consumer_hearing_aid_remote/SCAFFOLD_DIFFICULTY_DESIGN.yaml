  # =======================================================================
  # 0.5 rule 8: resource_temporal_overlap
  # Three DIFFERENT interval semantics on three DIFFERENT resource entities:
  #   Provider        -> half-open, buffer-widened, STRICT both sides (adjacency OK)
  #   FirmwareCampaign-> CLOSED, NON-STRICT (touching endpoints COLLIDE)
  #   TrialPeriod     -> CLOSED pause intervals, touching allowed, aggregate budget
  # =======================================================================
  resource_temporal_overlap:

    - name: fitting_slot_buffered_adjacency_accepted_but_one_minute_earlier_collides
      grounds:
        - "calculations.fitting_slot_overlap"
        - "validations[priority=37]"
        - "entities.Provider.fields.buffer_minutes"
        - "calculations.provider_daily_capacity"
      distinguishing_aspect: >-
        INTERVAL SEMANTICS: half-open existing intervals compared against a candidate
        widened by +/- buffer_minutes with STRICT inequalities on BOTH sides, so exact
        buffered adjacency is ACCEPTED. With buffer_minutes 10 and an existing
        10:00-11:00 booking, a candidate at 11:09 widens to 10:59 and COLLIDES, while
        a candidate at 11:10 widens to exactly 11:00 and is ACCEPTED. This is the
        deliberate opposite of campaign_window_overlap in the next instance.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with telehealth_fitting_permitted true."
          - "One TELECARE_FITTER Provider licensed in CA with buffer_minutes 10 and daily_capacity_minutes 480, so capacity (priority 50) can never pre-empt the slot gate."
          - "Patient age 61 in REGISTERED status; TROUBLESHOOT sessions require no screening or order."
          - "One existing TROUBLESHOOT session 2026-08-10T10:00:00Z-11:00:00Z (60 minutes booked)."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /state-policies"
            payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 30, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1000, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "TELECARE_FITTER", npi: "1447203355", full_name: "Buff Adjacent", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 10 }
            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { prov: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "ba@example.com", full_name: "Bea Ash", age_years: 61 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T10:00:00Z", scheduled_end_utc: "2026-08-10T11:00:00Z", provider_id: "${prov}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { s1: "$.data.id" }
        trigger:
          - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T11:09:00Z", scheduled_end_utc: "2026-08-10T11:39:00Z", provider_id: "${prov}" }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat}", session_type: "TROUBLESHOOT", scheduled_start_utc: "2026-08-10T11:10:00Z", scheduled_end_utc: "2026-08-10T11:40:00Z", provider_id: "${prov}" }, as: Patient, as_user_id: "${pat}" }
          - { call: "GET /providers/${prov}", payload: {}, as: CareOpsAgent, as_user_id: "ops_1" }
        assert:
          - "Trigger call 1 (candidate widens to 10:59:00-11:49:00, so 10:59 < 11:00 strictly): HTTP 409 with data.error_id == \"ERR_PROVIDER_SLOT_CONFLICT\""
          - "Trigger call 1: data.error_id != \"ERR_PROVIDER_CAPACITY_EXCEEDED\" (60 + 30 == 90 is far under daily_capacity_minutes 480)"
          - "Trigger call 2 (candidate widens to exactly 11:00:00-11:50:00; the strict comparison accepts buffered adjacency): HTTP 201 with data.status == \"SCHEDULED\" and data.duration_minutes == 30"
          - "Trigger call 3, GET /providers/${prov}: data.booked_minutes_on_focus_date == 90 and data.utilization_pct == 18.8 (round_half_up of 18.75 to one decimal, not 18.7)"
          - "GET /remote-fitting-sessions with provider_id == ${prov} and status == \"SCHEDULED\" returns exactly 2 rows"

    - name: campaign_window_closed_interval_touching_endpoints_collide
      grounds:
        - "calculations.campaign_window_overlap"
        - "validations[priority=38]"
        - "state_machines.FirmwareCampaign.DRAFT_to_SCHEDULED"
        - "entities.FirmwareCampaign.fields.model"
      distinguishing_aspect: >-
        INTERVAL SEMANTICS: CLOSED windows compared per model with NON-STRICT
        inequalities, so touching endpoints COLLIDE - the exact opposite of
        fitting_slot_overlap. Campaign B starting on 2026-09-30T00:00:00Z, the same
        instant campaign A ends, is REJECTED with ERR_CAMPAIGN_WINDOW_CONFLICT and
        stays DRAFT; the same window on a different model (LINK) is accepted;
        and pushing B one second later to 2026-09-30T00:00:01Z is accepted.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "Campaign A 'FW-NEO-A' targets NEO 4.0.0 -> 4.1.0 over the closed window 2026-09-01T00:00:00Z to 2026-09-30T00:00:00Z and is SCHEDULED, so it participates in the conflict check."
          - "No devices, patients or plans are needed: the conflict is decided at campaign scheduling time."
          - "Three candidate campaigns are then created in DRAFT: B (NEO, starts exactly at A's end), C (LINK, identical window), D (NEO, starts one second after A's end)."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - call: "POST /firmware-campaigns"
            payload: { campaign_code: "FW-NEO-A", model: "NEO", from_version: "4.0.0", to_version: "4.1.0", window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T00:00:00Z", is_mandatory_safety: false, batch_size: 3, max_concurrent_installs: 2 }
            as: FirmwareEngineer
            as_user_id: "fw_1"
            captures: { camp_a: "$.data.id" }
          - { call: "POST /firmware-campaigns/${camp_a}/schedule", payload: {}, as: FirmwareEngineer, as_user_id: "fw_1" }
          - call: "POST /firmware-campaigns"
            payload: { campaign_code: "FW-NEO-B", model: "NEO", from_version: "4.1.0", to_version: "4.2.0", window_start_utc: "2026-09-30T00:00:00Z", window_end_utc: "2026-10-15T00:00:00Z", is_mandatory_safety: false, batch_size: 3, max_concurrent_installs: 2 }
            as: FirmwareEngineer
            as_user_id: "fw_1"
            captures: { camp_b: "$.data.id" }
          - call: "POST /firmware-campaigns"
            payload: { campaign_code: "FW-LINK-C", model: "LINK", from_version: "4.1.0", to_version: "4.2.0", window_start_utc: "2026-09-30T00:00:00Z", window_end_utc: "2026-10-15T00:00:00Z", is_mandatory_safety: false, batch_size: 3, max_concurrent_installs: 2 }
            as: FirmwareEngineer
            as_user_id: "fw_1"
            captures: { camp_c: "$.data.id" }
          - call: "POST /firmware-campaigns"
            payload: { campaign_code: "FW-NEO-D", model: "NEO", from_version: "4.1.0", to_version: "4.2.0", window_start_utc: "2026-09-30T00:00:01Z", window_end_utc: "2026-10-15T00:00:00Z", is_mandatory_safety: false, batch_size: 3, max_concurrent_installs: 2 }
            as: FirmwareEngineer
            as_user_id: "fw_1"
            captures: { camp_d: "$.data.id" }
        trigger:
          - { call: "POST /firmware-campaigns/${camp_b}/schedule", payload: {}, as: FirmwareEngineer, as_user_id: "fw_1" }
          - { call: "POST /firmware-campaigns/${camp_c}/schedule", payload: {}, as: FirmwareEngineer, as_user_id: "fw_1" }
          - { call: "POST /firmware-campaigns/${camp_d}/schedule", payload: {}, as: FirmwareEngineer, as_user_id: "fw_1" }
        assert:
          - "Trigger call 1 (B starts at exactly A's window_end_utc; closed intervals with non-strict comparison overlap): HTTP 409 with data.error_id == \"ERR_CAMPAIGN_WINDOW_CONFLICT\""
          - "After trigger call 1, GET /firmware-campaigns/${camp_b}: data.status == \"DRAFT\""
          - "Trigger call 2 (same touching window but model LINK): HTTP 200 with data.status == \"SCHEDULED\""
          - "Trigger call 3 (NEO, window_start_utc one second after A's end): HTTP 200 with data.status == \"SCHEDULED\""
          - "GET /firmware-campaigns/${camp_a}: data.status == \"SCHEDULED\" and data.window_end_utc == \"2026-09-30T00:00:00Z\" (unchanged by the rejected attempt)"
          - "GET /firmware-campaigns with status == \"SCHEDULED\" returns exactly 3 rows (FW-NEO-A, FW-LINK-C, FW-NEO-D) and does not include FW-NEO-B"

    - name: trial_pause_touching_intervals_allowed_until_aggregate_budget_exhausted
      grounds:
        - "calculations.trial_pause_interval_overlap"
        - "calculations.trial_days_used"
        - "validations[priority=53]"
        - "state_machines.RepairOrder.KIT_SENT_to_RECEIVED"
      distinguishing_aspect: >-
        INTERVAL SEMANTICS: CLOSED pause intervals on a TrialPeriod where touching
        endpoints are ALLOWED (a second repair received at exactly the instant the
        first was returned is accepted, unlike campaign windows) but where the
        aggregate paused_days budget is checked with an INCLUSIVE >= 60. After
        10 + 76 == 86 paused days, the third repair's receive is rejected with
        ERR_PAUSE_BUDGET_EXHAUSTED - not ERR_PAUSE_INTERVAL_OVERLAP, since the third
        interval would not overlap anything.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with trial_period_days 90, one InventoryPool NEO/M/OPEN with 5 units, one IN_STOCK NEO device."
          - "No CarePlanSubscription, so every RepairOrder uses the sla_days default 15 and no plan credits interfere."
          - "Patient age 69 screens clean and takes delivery on 2026-08-01T00:00:00Z, so the trial starts there."
          - "Repair 1: created and kit sent, received 2026-08-05T00:00:00Z, returned-to-patient 2026-08-15T00:00:00Z -> closed pause interval [2026-08-05, 2026-08-15] == 10 days."
          - "Repair 2: created and kit sent, received at exactly 2026-08-15T00:00:00Z (touching the end of pause 1, which is allowed), returned-to-patient 2026-10-30T00:00:00Z -> pause interval of 76 days, bringing paused_days to 86."
          - "Repair 3: created and kit sent at 2026-11-01T00:00:00Z; its receive is the trigger."
