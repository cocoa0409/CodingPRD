# =============================================================================
# SCAFFOLD.yaml — task_3096_exchange_listing_qualification_continued_listing_standards
#
# Exchange Listing Qualification & Continued Listing Standards (Nasdaq-style).
# Compliance/audit archetype: a ListingRegulator runs tier-scoped eligibility
# computations over issuer-supplied metrics, adjudicates deficiencies with
# staff determinations, issuer plans, tier transfers, hearings panels, and
# appeals, and bills issuers with two divergent fee conventions.
# =============================================================================

scenario: |
  Exchange Listing Qualification & Continued Listing Standards (Nasdaq):
  initial listing application with financial, liquidity and corporate
  governance requirements by market tier, board independence, audit committee
  and compensation committee composition verification, minimum bid price,
  market value and shareholder count monitoring with deficiency notices,
  compliance plan submission and cure periods with possible transfer to a
  lower tier, delisting determinations with hearings panel review and appeal,
  listing of transfers from another exchange and dual listings, annual and
  entry fee assessment by shares outstanding, corporate action review
  including reverse splits used to regain compliance.

domain_name: exchange-listing-standards
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - derived_field_reconciliation     # Deficiency.still_open computed from consecutive-day evidence windows
    - cascading_side_effects           # delist → fill fee obligations + finalize records; plan cure → app/listing/status cascades
    - scheduled_deferred_actions       # cure windows, panel windows, appeal windows all measured off the logical clock
    - rate_threshold_triggers          # eligibility thresholds are >=; deficiency triggers are strict < over consecutive days
  entity_topology: hybrid              # Issuer-rooted trees (applications, listings, fees, corporate actions) plus peer HearingsPanel and appeals
  state_machine_shape: cyclic          # DEFICIENT → COMPLIANT → DEFICIENT loops; review cycles; delist-stay-delist
  relationship_patterns:
    - one_to_many
    - cross_aggregate                  # Appeal -> HearingsReview; CorporateAction -> Listing; FeeAssessment -> Issuer
  role_model: segregation_of_duties    # IssuerOfficer submits; ListingAnalyst monitors/decides; HearingsOfficer only after appeal; ListingsCouncil is terminal; FinanceOfficer bills
  consistency_model: immediate         # every mutation is atomic within the request; derived fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Issuer legal name" }
      - { name: ticker_symbol, type: string, source: input, description: "Requested ticker; unique across issuers regardless of status" }
      - { name: status, type: enum, source: system, description: "PRE_LISTING → LISTED → DELISTED", constraints: "enum {PRE_LISTING, LISTED, DELISTED}" }

  - name: ListingApplication
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; owning issuer" }
      - { name: target_tier, type: enum, source: input, description: "Market tier applied for", constraints: "enum {GLOBAL_SELECT, GLOBAL, CAPITAL}" }
      - { name: is_transfer_from_exchange, type: boolean, source: input, default: false, description: "True when the issuer is transferring its listing from another exchange" }
      - { name: application_kind, type: enum, source: input, default: INITIAL, description: "INITIAL | TRANSFER | TIER_TRANSFER | READMISSION; READMISSION is system-selectable via the readmission flag on the create endpoint", constraints: "enum {INITIAL, TRANSFER, TIER_TRANSFER, READMISSION}" }
      - { name: readmission_rejected, type: boolean, source: system, default: false, description: "Set true when a READMISSION application is rejected; such an issuer can never file READMISSION again" }
      - { name: board_directors, type: array, source: input, description: "Array of {director_name, is_independent} covering the full board" }
      - { name: audit_committee, type: array, source: input, description: "Array of {director_name, is_independent, is_financial_expert}; MUST be a subset of board_directors by director_name" }
      - { name: compensation_committee, type: array, source: input, description: "Array of {director_name, is_independent}; subset of board_directors" }
      - { name: stockholders_equity_cents, type: integer, source: input, description: "Stockholders' equity in cents" }
      - { name: market_value_listed_securities_cents, type: integer, source: input, description: "Market value of listed securities in cents" }
      - { name: market_value_unrestricted_publicly_held_cents, type: integer, source: input, description: "Market value of unrestricted publicly held shares in cents" }
      - { name: total_revenue_cents, type: integer, source: input, description: "Total revenue (latest fiscal year) in cents" }
      - { name: income_from_continuing_operations_cents, type: integer, source: input, description: "Pre-tax income from continuing operations in cents" }
      - { name: bid_price_cents, type: integer, source: input, description: "Proposed closing bid price in cents" }
      - { name: publicly_held_shares, type: integer, source: input, description: "Publicly held shares outstanding" }
      - { name: unrestricted_publicly_held_shares, type: integer, source: input, description: "Unrestricted publicly held shares" }
      - { name: round_lot_holders, type: integer, source: input, description: "Round lot shareholders count" }
      - { name: total_shareholders, type: integer, source: input, description: "Total shareholders count" }
      - { name: market_makers, type: integer, source: input, description: "Registered and active market makers count" }
      - { name: operating_history_months, type: integer, source: input, description: "Months of operating history" }
      - { name: evaluated_standards, type: array, source: computed, description: "Per-tier array of {standard_code, passed, margin}; empty until evaluation runs at submit" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | REJECTED", constraints: "enum {DRAFT, SUBMITTED, APPROVED, REJECTED}" }

  - name: Listing
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; owning issuer" }
      - { name: application_id, type: string, source: system, description: "FK -> ListingApplication.id; the application whose approval created this listing" }
      - { name: tier, type: enum, source: computed, description: "Current market tier; seeded from the approving application's target_tier, mutated by plan tier-transfer cure", constraints: "enum {GLOBAL_SELECT, GLOBAL, CAPITAL}" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED → DELISTED", constraints: "enum {ACTIVE, SUSPENDED, DELISTED}" }
      - { name: suspended_at, type: datetime, source: system, description: "Set when trading is suspended on delisting execution; null otherwise" }
      - { name: delisted_at, type: datetime, source: system, description: "Set on delisting execution" }

  - name: MarketDataSnapshot
    parent: Issuer
    common_fields: false   # immutable observation log; id + created_at only
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; issuer the snapshot observes" }
      - { name: trade_date, type: string, source: input, description: "Trading date YYYY-MM-DD; must equal the logical clock's current date" }
      - { name: closing_bid_cents, type: integer, source: input, description: "Closing bid price in cents; 0 is permitted and still counts as an observation day" }
      - { name: market_value_publicly_held_cents, type: integer, source: input, description: "Market value of publicly held shares at close" }
      - { name: market_value_listed_securities_cents, type: integer, source: input, description: "Market value of listed securities at close" }
      - { name: round_lot_holders, type: integer, source: input, description: "Round lot holders observed" }
      - { name: total_shareholders, type: integer, source: input, description: "Total shareholders observed" }

  - name: Deficiency
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: standard_code, type: enum, source: system, description: "Which continued-listing standard failed", constraints: "enum {BID_PRICE, MVPHS, MVLS, ROUND_LOT_HOLDERS, TOTAL_SHAREHOLDERS, STOCKHOLDERS_EQUITY}" }
      - { name: tier_at_detection, type: enum, source: system, description: "Listing tier when the deficiency was detected", constraints: "enum {GLOBAL_SELECT, GLOBAL, CAPITAL}" }
      - { name: consecutive_days_failed, type: integer, source: computed, description: "Consecutive trading days failing, computed from the trailing snapshot window at detection" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock timestamp of detection" }
      - { name: compliance_due_at, type: datetime, source: system, description: "detected_at + 180 calendar days; cure deadline" }
      - { name: staff_determined_at, type: datetime, source: system, description: "Logical-clock timestamp of the staff delisting determination; the appeal window closes at staff_determined_at + 7 days; null until determination" }
      - { name: still_open, type: boolean, source: computed, description: "Recomputed on every monitor run for this issuer: false iff the trailing snapshot window shows >= 10 consecutive compliant days for this deficiency's standard (the same condition that drives the OPEN to REGAINED auto-transition and the ComplianceRecord the run mints); true otherwise" }
      - { name: status, type: enum, source: system, description: "OPEN → PLAN_SUBMITTED → REGAINED | STAFF_DELIST_DETERMINED → PANEL_REVIEW → DELIST_UPHELD | DELIST_REVERSED; plus direct OPEN → REGAINED and OPEN → STAFF_DELIST_DETERMINED and PLAN_SUBMITTED → REGAINED | STAFF_DELIST_DETERMINED", constraints: "enum {OPEN, PLAN_SUBMITTED, REGAINED, STAFF_DELIST_DETERMINED, PANEL_REVIEW, DELIST_UPHELD, DELIST_REVERSED}" }
      - { name: closed_at, type: datetime, source: system, description: "Set on entering any terminal state" }

  - name: ComplianceRecord
    parent: Issuer
    common_fields: false   # immutable event log
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: deficiency_id, type: string, source: system, description: "FK -> Deficiency.id; the deficiency this record closes" }
      - { name: regained_at, type: datetime, source: system, description: "Logical-clock timestamp when regain was observed" }
      - { name: qualifying_days, type: integer, source: system, description: "Consecutive compliant trading days that qualified the regain (>= 10)" }
      - { name: method, type: enum, source: system, description: "How compliance was regained", constraints: "enum {NATURAL, REVERSE_SPLIT, TIER_TRANSFER, PLAN_APPROVED}" }

  - name: CompliancePlan
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: deficiency_id, type: string, source: system, description: "FK -> Deficiency.id; exactly one plan per deficiency ever" }
      - { name: plan_text, type: string, source: input, description: "Free-form plan narrative" }
      - { name: plan_kind, type: enum, source: input, description: "CURE_IN_PLACE | TIER_TRANSFER", constraints: "enum {CURE_IN_PLACE, TIER_TRANSFER}" }
      - { name: proposed_target_tier, type: enum, source: input, description: "Required iff plan_kind == TIER_TRANSFER; must be strictly lower than the deficiency's tier_at_detection", constraints: "enum {GLOBAL_SELECT, GLOBAL, CAPITAL} or null" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW → APPROVED | REJECTED", constraints: "enum {PENDING_REVIEW, APPROVED, REJECTED}" }
      - { name: review_decision_reason, type: string, source: input, description: "Analyst rationale, captured at review" }

  - name: HearingsReview
    parent: null            # top-level; panel is an exchange organ, not issuer property
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id" }
      - { name: panel_name, type: string, source: input, description: "Hearings panel identifier" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED", constraints: "enum {OPEN, CLOSED}" }

  - name: Appeal
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: deficiency_id, type: string, source: system, description: "FK -> Deficiency.id; the delist determination being appealed; one appeal per deficiency ever" }
      - { name: review_id, type: string, source: input, description: "FK -> HearingsReview.id; the OPEN panel the appeal is filed with" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing" }
      - { name: decided_by, type: enum, source: system, description: "Which body decided; null until decision", constraints: "enum {PANEL, COUNCIL} or null" }
      - { name: status, type: enum, source: system, description: "FILED → PANEL_REVIEWING → PANEL_AFFIRMED | PANEL_REVERSED → COUNCIL_REVIEWING → COUNCIL_AFFIRMED | COUNCIL_REVERSED", constraints: "enum {FILED, PANEL_REVIEWING, PANEL_AFFIRMED, PANEL_REVERSED, COUNCIL_REVIEWING, COUNCIL_AFFIRMED, COUNCIL_REVERSED}" }

  - name: FeeAssessment
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: fee_kind, type: enum, source: system, description: "ENTRY billed at listing approval; ANNUAL billed by run-annual-fees", constraints: "enum {ENTRY, ANNUAL}" }
      - { name: tier, type: enum, source: system, description: "Tier used for rate lookup: ENTRY uses application target_tier; ANNUAL uses the listing's tier on the logical-clock date of the run", constraints: "enum {GLOBAL_SELECT, GLOBAL, CAPITAL}" }
      - { name: assessment_year, type: integer, source: system, description: "Calendar year of the fee: entry year for ENTRY; billing year for ANNUAL" }
      - { name: shares_outstanding, type: integer, source: input, description: "Share count the brackets are applied to" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed fee; ENTRY brackets are inclusive-of-entry-fee, ANNUAL brackets are exclusive-of-entry-fee" }
      - { name: delisted_mid_year, type: boolean, source: system, default: false, description: "True when the fee was filled by delisting execution rather than the annual run" }
      - { name: status, type: enum, source: system, description: "PENDING → INVOICED → PAID | WAIVED", constraints: "enum {PENDING, INVOICED, PAID, WAIVED}" }

  - name: CorporateAction
    parent: Issuer
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id" }
      - { name: action_type, type: enum, source: input, description: "Only reverse splits are modelled", constraints: "enum {REVERSE_SPLIT}" }
      - { name: split_ratio_denominator, type: integer, source: input, description: "1-for-N reverse split denominator N (>= 2)" }
      - { name: announced_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → EFFECTIVE | REJECTED | CANCELLED", constraints: "enum {SUBMITTED, EFFECTIVE, REJECTED, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: ListingApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /issuers/{issuerId}/listing-applications/{applicationId}/submit"
        actor: IssuerOfficer
        preconditions:
          - "Application is DRAFT (ERR_INVALID_STATE otherwise)"
          - "Issuer has no other SUBMITTED application (ERR_MULTIPLE_PENDING_APPLICATIONS)"
          - "application_kind == TRANSFER requires is_transfer_from_exchange == true (ERR_INVALID_REQUEST)"
          - "Governance validation runs now: board majority independent (strictly > 50% of board_directors), audit_committee >= 3 members all independent and >= 1 financial expert, compensation_committee >= 2 members all independent; committee membership must be a subset of board_directors by director_name (ERR_GOVERNANCE_COMPOSITION)"
        side_effects:
          - "evaluate_tier_standards runs against target_tier; evaluated_standards filled with the entry-standards winner variant plus per-standard margins"
          - "If no standard passes → application auto-transitions to REJECTED in the same request (the submit itself returns 200 with the REJECTED application)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /issuers/{issuerId}/listing-applications/{applicationId}/approve"
        actor: ListingAnalyst
        preconditions:
          - "Application is SUBMITTED (ERR_INVALID_STATE otherwise)"
          - "At least one evaluated standard passed at submit (an application that auto-rejected at submit is no longer SUBMITTED, so this surfaces as ERR_INVALID_STATE)"
          - "For TIER_TRANSFER applications: issuer has an ACTIVE listing and target_tier is strictly lower than the listing's current tier (ERR_TIER_TRANSFER_TARGET_INVALID); the issuer must also meet the continued (not entry) standards of the target tier, evaluated from the application's metric fields (ERR_NO_STANDARD_MET)"
          - "expected_issuer_version matches Issuer.version (ERR_STALE_VERSION)"
        side_effects:
          - "increments Issuer.version by 1"
          - "Application status SUBMITTED → APPROVED"
          - "For INITIAL / TRANSFER / READMISSION: create Listing {tier: target_tier, status: ACTIVE}; Issuer.status PRE_LISTING → LISTED; create ENTRY FeeAssessment (tier = target_tier, assessment_year = clock year, shares_outstanding = application.unrestricted_publicly_held_shares, status PENDING)"
          - "For TIER_TRANSFER: existing ACTIVE listing's tier → target_tier; no new Listing; no ENTRY fee"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /issuers/{issuerId}/listing-applications/{applicationId}/reject"
        actor: ListingAnalyst
        preconditions:
          - "Application is SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "If application_kind == READMISSION: readmission_rejected → true; issuer can never file READMISSION again (ERR_READMISSION_BARRED on future attempts)"

      - from: DRAFT
        to: REJECTED
        trigger: "system (auto-reject inside submit when no tier standard passes)"
        actor: system
        preconditions: []
        side_effects:
          - "If application_kind == READMISSION: readmission_rejected → true"

  - entity: Listing
    initial_state: ACTIVE
    terminal_states: [DELISTED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (during execute-delisting, step 1 of the same request)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_at := logical clock now"

      - from: SUSPENDED
        to: DELISTED
        trigger: "system (during execute-delisting, step 2 of the same request)"
        actor: system
        preconditions: []
        side_effects:
          - "delisted_at := logical clock now"
          - "Issuer.status LISTED → DELISTED"
          - "All FeeAssessments of the issuer in status PENDING → INVOICED"
          - "If no ANNUAL FeeAssessment exists for the clock year: create one with delisted_mid_year = true, tier = listing tier at execution, shares_outstanding from the latest ANNUAL assessment if any, else from the approving application's unrestricted_publicly_held_shares, halved (floor) per EFFECTIVE REVERSE_SPLIT corporate action in the order those actions became effective (earliest first), status PENDING then immediately → INVOICED in the same request"
          - "All OPEN / PLAN_SUBMITTED / STAFF_DELIST_DETERMINED / PANEL_REVIEW Deficiencies of the issuer → DELIST_UPHELD (closed_at set)"
          - "All FILED / PANEL_REVIEWING Appeals of the issuer → PANEL_AFFIRMED, decided_by = PANEL"
          - "All SUBMITTED CorporateActions of the issuer → CANCELLED"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [REGAINED, DELIST_UPHELD, DELIST_REVERSED]
    transitions:
      - from: OPEN
        to: REGAINED
        trigger: "system (automatic during POST /issuers/{issuerId}/deficiency-monitor/run when still_open recomputes to false via a NATURAL or REVERSE_SPLIT regain)"
        actor: system
        preconditions: []
        side_effects:
          - "Create ComplianceRecord {method: NATURAL or REVERSE_SPLIT, qualifying_days >= 10, regained_at: clock now}"
          - "closed_at := clock now"

      - from: OPEN
        to: PLAN_SUBMITTED
        trigger: "system (inside POST /issuers/{issuerId}/compliance-plans creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PLAN_SUBMITTED
        to: REGAINED
        trigger: "system (inside compliance-plan review APPROVE, or during deficiency-monitor run when regain observed while plan pending)"
        actor: system
        preconditions: []
        side_effects:
          - "Create ComplianceRecord {method: PLAN_APPROVED for review approval; TIER_TRANSFER when the approved plan was TIER_TRANSFER; qualifying_days: 0 for plan-based regain}"
          - "For TIER_TRANSFER plans: Listing.tier → proposed_target_tier"
          - "closed_at := clock now"

      - from: OPEN
        to: STAFF_DELIST_DETERMINED
        trigger: "POST /issuers/{issuerId}/deficiencies/{deficiencyId}/staff-determine-delisting"
        actor: ListingAnalyst
        preconditions:
          - "Deficiency is OPEN (ERR_INVALID_STATE otherwise)"
          - "logical clock > compliance_due_at (ERR_CURE_PERIOD_ACTIVE otherwise)"
        side_effects:
          - "staff_determined_at := logical clock now"

      - from: PLAN_SUBMITTED
        to: STAFF_DELIST_DETERMINED
        trigger: "POST /issuers/{issuerId}/deficiencies/{deficiencyId}/staff-determine-delisting"
        actor: ListingAnalyst
        preconditions:
          - "Deficiency is PLAN_SUBMITTED and its plan is REJECTED, or the clock has passed compliance_due_at (ERR_CURE_PERIOD_ACTIVE if neither)"
        side_effects:
          - "staff_determined_at := logical clock now"

      - from: STAFF_DELIST_DETERMINED
        to: PANEL_REVIEW
        trigger: "system (inside POST /issuers/{issuerId}/appeals filing)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PANEL_REVIEW
        to: DELIST_UPHELD
        trigger: "system (inside appeal panel decision AFFIRM, or inside execute-delisting when the appeal window lapses unexercised)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at := clock now"

      - from: PANEL_REVIEW
        to: DELIST_REVERSED
        trigger: "system (inside appeal panel decision REVERSE)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at := clock now"
          - "Deficiency reopens as a NEW Deficiency row: same standard_code, tier_at_detection, detected_at := clock now, compliance_due_at := clock + 180d, status OPEN (the reversal restores the issuer to the deficiency track, it does not erase it)"

      - from: STAFF_DELIST_DETERMINED
        to: DELIST_UPHELD
        trigger: "system (inside execute-delisting when no appeal was filed within the window)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at := clock now"

      - from: STAFF_DELIST_DETERMINED
        to: DELIST_REVERSED
        trigger: "system (inside appeal council decision REVERSE when appeal reached council — council acts on the deficiency that the panel left untouched)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at := clock now; new OPEN Deficiency row created as in PANEL_REVIEW → DELIST_REVERSED"

  - entity: CompliancePlan
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /issuers/{issuerId}/compliance-plans/{planId}/review with decision APPROVE"
        actor: ListingAnalyst
        preconditions:
          - "Plan is PENDING_REVIEW (ERR_PLAN_UNDER_REVIEW only when a second review is attempted on a decided plan)"
          - "Deficiency is PLAN_SUBMITTED (ERR_INVALID_STATE otherwise)"
          - "If plan_kind == TIER_TRANSFER: proposed_target_tier is strictly lower than Listing.tier AND the application's metrics embedded in the deficiency issuer's latest snapshot set meet the continued standards of proposed_target_tier (ERR_TIER_TRANSFER_TARGET_INVALID otherwise; evaluated from the issuer's most recent MarketDataSnapshot)"
        side_effects:
          - "Deficiency PLAN_SUBMITTED → REGAINED; ComplianceRecord created (method TIER_TRANSFER if plan_kind == TIER_TRANSFER else PLAN_APPROVED)"
          - "If plan_kind == TIER_TRANSFER: Listing.tier := proposed_target_tier"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /issuers/{issuerId}/compliance-plans/{planId}/review with decision REJECT"
        actor: ListingAnalyst
        preconditions:
          - "Plan is PENDING_REVIEW (ERR_PLAN_UNDER_REVIEW on second review attempt)"
        side_effects:
          - "Deficiency remains PLAN_SUBMITTED (staff may now determine delisting)"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [PANEL_AFFIRMED, PANEL_REVERSED, COUNCIL_AFFIRMED, COUNCIL_REVERSED]
    transitions:
      - from: FILED
        to: PANEL_REVIEWING
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/panel-review"
        actor: HearingsOfficer
        preconditions:
          - "Appeal is FILED (ERR_INVALID_STATE otherwise)"
          - "HearingsReview referenced by review_id is OPEN (ERR_HEARING_NOT_OPEN otherwise)"
        side_effects:
          - "Deficiency STAFF_DELIST_DETERMINED → PANEL_REVIEW (if not already)"

      - from: PANEL_REVIEWING
        to: PANEL_AFFIRMED
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/panel-decision with decision AFFIRM"
        actor: HearingsOfficer
        preconditions:
          - "Appeal is PANEL_REVIEWING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by := PANEL"
          - "Deficiency PANEL_REVIEW → DELIST_UPHELD"

      - from: PANEL_REVIEWING
        to: PANEL_REVERSED
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/panel-decision with decision REVERSE"
        actor: HearingsOfficer
        preconditions:
          - "Appeal is PANEL_REVIEWING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by := PANEL"
          - "Deficiency PANEL_REVIEW → DELIST_REVERSED (with the new OPEN deficiency row side effect)"
          - "HearingsReview remains OPEN (may serve other appeals)"

      - from: PANEL_REVERSED
        to: COUNCIL_REVIEWING
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/council-review"
        actor: ListingsCouncil
        preconditions:
          - "Appeal is PANEL_REVERSED (ERR_COUNCIL_REVIEW_NOT_AVAILABLE otherwise)"
        side_effects: []

      - from: PANEL_AFFIRMED
        to: COUNCIL_REVIEWING
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/council-review"
        actor: ListingsCouncil
        preconditions:
          - "Appeal is PANEL_AFFIRMED (ERR_COUNCIL_REVIEW_NOT_AVAILABLE otherwise)"
        side_effects: []

      - from: COUNCIL_REVIEWING
        to: COUNCIL_AFFIRMED
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/council-decision with decision AFFIRM"
        actor: ListingsCouncil
        preconditions:
          - "Appeal is COUNCIL_REVIEWING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by := COUNCIL"
          - "If the deficiency is in PANEL_REVIEW: → DELIST_UPHELD"

      - from: COUNCIL_REVIEWING
        to: COUNCIL_REVERSED
        trigger: "POST /issuers/{issuerId}/appeals/{appealId}/council-decision with decision REVERSE"
        actor: ListingsCouncil
        preconditions:
          - "Appeal is COUNCIL_REVIEWING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by := COUNCIL"
          - "Deficiency → DELIST_REVERSED (new OPEN row side effect)"

  - entity: FeeAssessment
    initial_state: PENDING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "system (immediately upon FeeAssessment creation — assessments are invoiced as they are assessed; also applied to any pre-existing PENDING rows at execute-delisting)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVOICED
        to: PAID
        trigger: "POST /issuers/{issuerId}/fee-assessments/{feeId}/mark-paid"
        actor: FinanceOfficer
        preconditions:
          - "Fee is INVOICED (ERR_INVALID_STATE otherwise)"
        side_effects: []

      - from: INVOICED
        to: WAIVED
        trigger: "POST /issuers/{issuerId}/fee-assessments/{feeId}/waive"
        actor: FinanceOfficer
        preconditions:
          - "Fee is INVOICED (ERR_INVALID_STATE otherwise)"
        side_effects: []

  - entity: CorporateAction
    initial_state: SUBMITTED
    terminal_states: [EFFECTIVE, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: EFFECTIVE
        trigger: "POST /issuers/{issuerId}/corporate-actions/{actionId}/effect"
        actor: ListingAnalyst
        preconditions:
          - "Action is SUBMITTED (ERR_INVALID_STATE otherwise)"
          - "action_type == REVERSE_SPLIT: the issuer has a Deficiency with standard_code == BID_PRICE in status OPEN or PLAN_SUBMITTED (ERR_NO_QUALIFYING_DEFICIENCY otherwise — reverse splits are only effectable as a compliance mechanism in this system)"
        side_effects:
          - "bid_price_regain_projection runs over the trailing 10-snapshot window with split-adjusted prices"
          - "If the projection finds >= 10 consecutive compliant days: the qualifying BID_PRICE deficiency (OPEN or PLAN_SUBMITTED) → REGAINED with ComplianceRecord {method: REVERSE_SPLIT, qualifying_days: run length}; if that deficiency was PLAN_SUBMITTED, its plan → REJECTED (superseded)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /issuers/{issuerId}/corporate-actions/{actionId}/reject"
        actor: ListingAnalyst
        preconditions:
          - "Action is SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /issuers/{issuerId}/corporate-actions/{actionId}/cancel, or system during execute-delisting"
        actor: IssuerOfficer
        preconditions:
          - "Action is SUBMITTED (ERR_INVALID_STATE otherwise)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: application-approve-stale-issuer
    parent_entity: Issuer
    write_endpoint: "POST /issuers/{issuerId}/listing-applications/{applicationId}/approve"
    occ_field: "expected_issuer_version"
    description: |
      Approving a SUBMITTED application against an Issuer whose version has
      advanced since the analyst last observed it is rejected. This captures
      the case where another writer has just approved a different application
      for the same issuer (which legitimately creates the issuer's listing
      first), leaving this analyst's view of the issuer stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: annual-fee-run-stale-issuer
    parent_entity: Issuer
    write_endpoint: "POST /issuers/{issuerId}/fee-assessments/run-annual-fees"
    occ_field: "expected_issuer_version"
    description: |
      Running annual fee assessment against an Issuer whose version has
      advanced since the finance officer last observed it is rejected. This
      captures the case where a delisting execution or application approval
      has just mutated the issuer (filling fee rows or changing status),
      leaving this officer's view of the issuer stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: evaluate_tier_standards
    trigger: "ListingApplication DRAFT → SUBMITTED (entry mode) and TIER_TRANSFER approval (continued mode)"
    algorithm: threshold
    formula: |
      Entry mode (initial/transfer/readmission listing). For the application's
      target_tier, evaluate each numbered standard; the tier passes iff ANY
      standard passes fully. Per-standard requirements (ALL must hold; every
      comparison is >= unless noted):

      GLOBAL_SELECT (any one of):
        S1: income_from_continuing_operations_cents >= 11_000_000_00
        S2: market_value_listed_securities_cents >= 45_000_000_000_00
            AND unrestricted_publicly_held_shares >= 1_250_000
        S3: total_revenue_cents >= 9_000_000_000_00
            AND market_value_listed_securities_cents >= 20_000_000_000_00

      GLOBAL (any one of):
        S1: stockholders_equity_cents >= 15_000_000_00
            AND market_value_unrestricted_publicly_held_cents >= 8_000_000_00
            AND round_lot_holders >= 400 AND market_makers >= 3
        S2: market_value_listed_securities_cents >= 7_500_000_000_00
            AND market_value_unrestricted_publicly_held_cents >= 20_000_000_00
            AND round_lot_holders >= 400 AND market_makers >= 3
        S3: total_revenue_cents >= 7_500_000_000_00
            AND market_value_unrestricted_publicly_held_cents >= 20_000_000_00
            AND round_lot_holders >= 400 AND market_makers >= 3

      CAPITAL (ALL of):
        bid_price_cents >= 400
        publicly_held_shares >= 1_000_000
        round_lot_holders >= 300
        market_makers >= 3
        AND (any one of):
          A1: stockholders_equity_cents >= 5_000_000_00
          A2: market_value_listed_securities_cents >= 5_000_000_000_00
          A3: income_from_continuing_operations_cents >= 750_000_00

      Continued mode (used for TIER_TRANSFER approval and compliance-plan
      TIER_TRANSFER review; thresholds are LOWER than entry — same metric set):
        GLOBAL_SELECT: market_value_listed_securities_cents >= 30_000_000_000_00
        GLOBAL:        market_value_publicly_held_cents >= 5_000_000_00
                       AND (round_lot_holders >= 400)
        CAPITAL:       market_value_publicly_held_cents >= 1_000_000_00
                       AND (round_lot_holders >= 300)
      Continued mode input set: for TIER_TRANSFER approval, the application's
      own metric fields; for plan review, the issuer's most recent
      MarketDataSnapshot (latest trade_date; tie-break impossible — trade_date
      is unique per issuer), with snapshot fields mapped onto the continued
      thresholds as: MVLS leg := market_value_listed_securities_cents, MVPHS
      leg := market_value_publicly_held_cents, holders leg := round_lot_holders
      (total_shareholders is monitored but never gates a tier transfer).
    constants:
      GS_S1_INCOME: 1100000000
      GS_S2_MVLS: 4500000000000
      GS_S2_UPHS: 1250000
      GS_S3_REV: 90000000000
      GS_S3_MVLS: 2000000000000
      G_S1_SE: 1500000000
      G_S1_MVUPH: 800000000
      G_S2_MVLS: 750000000000
      G_S2_MVUPH: 2000000000
      G_S3_REV: 750000000000
      G_S3_MVUPH: 2000000000
      G_HOLDERS: 400
      G_MM: 3
      C_BID: 400
      C_PHS: 1000000
      C_HOLDERS: 300
      C_MM: 3
      C_A1_SE: 500000000
      C_A2_MVLS: 50000000000
      C_A3_INCOME: 75000000
      CONT_GS_MVLS: 3000000000000
      CONT_G_MVPH: 500000000
      CONT_G_HOLDERS: 400
      CONT_C_MVPH: 100000000
      CONT_C_HOLDERS: 300
    precision: "integer cents; no rounding"
    variants:
      - name: entry_standards
        when: "application_kind in {INITIAL, TRANSFER, READMISSION} at submit"
        difference: "uses the higher entry thresholds; GLOBAL_SELECT and GLOBAL pass if ANY numbered standard passes"
      - name: continued_standards
        when: "TIER_TRANSFER approval and TIER_TRANSFER plan review"
        difference: "uses the lower continued thresholds; evaluated from application metrics (approval) or the latest MarketDataSnapshot (plan review)"

  - name: deficiency_streak_detection
    trigger: "POST /issuers/{issuerId}/deficiency-monitor/run"
    algorithm: chronological
    formula: |
      For each monitored standard_code in {BID_PRICE, MVPHS, MVLS,
      ROUND_LOT_HOLDERS, TOTAL_SHAREHOLDERS} (STOCKHOLDERS_EQUITY is not
      snapshot-monitored), using the issuer's MarketDataSnapshots ordered by
      trade_date DESC:
        1. Walk backward from the latest snapshot counting consecutive days
           that FAIL the tier threshold (STRICT less-than):
             BID_PRICE:            closing_bid_cents < tier_bid_threshold (always 100 at every tier)
             MVPHS:                market_value_publicly_held_cents < tier continued MVPHS threshold
             MVLS:                 market_value_listed_securities_cents < tier continued MVLS threshold
             ROUND_LOT_HOLDERS:    round_lot_holders < tier continued holders threshold
             TOTAL_SHAREHOLDERS:   total_shareholders < tier continued holders threshold
        2. Stop at the first compliant day or when snapshots run out.
        3. If consecutive_failed >= TRIGGER_DAYS for that standard (BID_PRICE:
           30; all others: 10) AND no Deficiency for (issuer, standard_code)
           exists in a non-terminal status: create Deficiency {tier_at_detection:
           Listing.tier, consecutive_days_failed: run length, detected_at: clock,
           compliance_due_at: clock + 180 days, status: OPEN}.
        4. For every non-terminal Deficiency of the issuer, recompute
           still_open and walk the trailing window for REGAIN: consecutive
           COMPLIANT days >= REGAIN_DAYS (10) → Deficiency → REGAINED with
           ComplianceRecord {method: NATURAL}.
      Tier continued thresholds:
        BID_PRICE: 100 cents at ALL tiers.
        MVPHS: GLOBAL_SELECT n/a (use MVLS), GLOBAL 5_000_000_00, CAPITAL 1_000_000_00
        MVLS:  GLOBAL_SELECT 30_000_000_000_00, GLOBAL 7_500_000_000_00 (holders leg separate), CAPITAL 5_000_000_000_00
        ROUND_LOT_HOLDERS / TOTAL_SHAREHOLDERS: GLOBAL_SELECT 400, GLOBAL 400, CAPITAL 300
    constants:
      BID_TRIGGER_DAYS: 30
      OTHER_TRIGGER_DAYS: 10
      REGAIN_DAYS: 10
      CURE_DAYS: 180
      BID_THRESHOLD_CENTS: 100
    precision: "integer day counts"

  - name: bid_price_regain_projection
    trigger: "CorporateAction SUBMITTED → EFFECTIVE (REVERSE_SPLIT)"
    algorithm: projection
    formula: |
      adjusted_bid(day) = closing_bid_cents(day) * split_ratio_denominator
      Walk the issuer's trailing MarketDataSnapshots (trade_date DESC), counting
      consecutive days with adjusted_bid >= 100. If the run length >= 10, the
      qualifying OPEN/PLAN_SUBMITTED BID_PRICE deficiency regains with
      qualifying_days = run length. Days with closing_bid_cents == 0 never
      qualify (0 * N == 0 < 100).
    constants:
      BID_THRESHOLD_CENTS: 100
      REGAIN_DAYS: 10
    precision: "integer cents"

  - name: fee_assessment
    trigger: "ListingApplication approval (ENTRY) and POST /issuers/{issuerId}/fee-assessments/run-annual-fees (ANNUAL) and execute-delisting fill (ANNUAL, delisted_mid_year = true)"
    algorithm: tiered_pricing
    formula: |
      amount_cents = clamp(shares_outstanding, BRACKET_MIN, BRACKET_MAX)
      where (BRACKET_MIN, BRACKET_MAX) is the row of the tier's bracket table
      containing shares_outstanding. Bracket membership is INCLUSIVE on both
      ends; every share count >= 1 belongs to exactly one row; counts above the
      top row's upper bound clamp to the top row's max.
      A fee row whose delisted_mid_year flag is true adds a flat MID_YEAR
      surcharge AFTER the bracket clamp: amount_cents = clamp(...) +
      MID_YEAR_SURCHARGE_CENTS (the surcharge is never bracket-adjusted).

      ENTRY table (per tier; amounts INCLUDE the entry fee):
        GLOBAL_SELECT / GLOBAL (shared):
          1 .. 50_000_000          -> [150_000_00, 250_000_00]
          50_000_001 .. 75_000_000 -> [200_000_00, 300_000_00]
          75_000_001 .. 100_000_000-> [250_000_00, 350_000_00]
          100_000_001+             -> [295_000_00, 500_000_00]
        CAPITAL:
          1 .. 5_000_000           -> [50_000_00, 75_000_00]
          5_000_001 .. 15_000_000  -> [75_000_00, 100_000_00]
          15_000_001+              -> [100_000_00, 150_000_00]

      ANNUAL table (per tier; amounts EXCLUDE the entry fee — strictly LOWER
      than the corresponding ENTRY row for the same tier and share count):
        GLOBAL_SELECT / GLOBAL (shared):
          1 .. 50_000_000          -> [45_000_00, 105_000_00]
          50_000_001 .. 75_000_000 -> [55_000_00, 125_000_00]
          75_000_001 .. 100_000_000-> [65_000_00, 145_000_00]
          100_000_001+             -> [75_000_00, 175_000_00]
        CAPITAL:
          1 .. 5_000_000           -> [30_000_00, 50_000_00]
          5_000_001 .. 15_000_000  -> [40_000_00, 65_000_00]
          15_000_001+              -> [50_000_00, 80_000_00]
    constants:
      MID_YEAR_SURCHARGE_CENTS: 1000000   # flat $10,000.00 surcharge on delisted_mid_year ANNUAL rows
    precision: "integer cents; no rounding"
    variants:
      - name: inclusive_of_entry_fee
        when: "fee_kind == ENTRY (assessed once at listing approval)"
        difference: "ENTRY bracket table — higher amounts that bundle the one-time entry fee"
      - name: exclusive_of_entry_fee
        when: "fee_kind == ANNUAL (run-annual-fees or delisting fill)"
        difference: "ANNUAL bracket table — strictly lower amounts for the same tier and share count; same shares_outstanding therefore yields a different amount_cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted on this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 2.5
    category: auth
    check: "Entity-backed ownership: when X-User-Role is IssuerOfficer, X-User-ID must equal the {issuerId} path segment"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all /issuers/{issuerId}/... endpoints"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (issuer before nested resource); unknown nested id yields its entity-specific 404"
    error_id: "ERR_ISSUER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_FEE_NOT_FOUND | ERR_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: state
    check: "Target resource must be in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must not equal the X-User-ID that performed the immediately preceding workflow step on the same resource (application submitter may not review its plan; the officer who filed an appeal may not sit on its panel decision; plan submitter != plan reviewer)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /issuers/{id}/compliance-plans/{planId}/review, POST /issuers/{id}/appeals/{appealId}/panel-decision, POST /issuers/{id}/appeals/{appealId}/council-decision"

  - priority: 6
    category: business_safety
    check: "READMISSION applications: issuer must be DELISTED and must never have had a READMISSION application rejected"
    error_id: ERR_READMISSION_BARRED
    http_status: 422
    applies_to: "POST /issuers/{id}/listing-applications (with readmission flag)"

  - priority: 7
    category: business_constraint
    check: "Governance composition at submit: board majority independent (strictly > 50%); audit committee >= 3 members, all independent, >= 1 financial expert; compensation committee >= 2 members, all independent; committee members must appear in board_directors"
    error_id: ERR_GOVERNANCE_COMPOSITION
    http_status: 422
    applies_to: "POST /issuers/{id}/listing-applications/{appId}/submit"

  - priority: 8
    category: business_constraint
    check: "Issuer must not already have a SUBMITTED application"
    error_id: ERR_MULTIPLE_PENDING_APPLICATIONS
    http_status: 409
    applies_to: "POST /issuers/{id}/listing-applications/{appId}/submit"

  - priority: 9
    category: business_constraint
    check: "Listing approval requires at least one evaluated standard passed; TIER_TRANSFER additionally requires strictly-lower target tier and continued standards met"
    error_id: ERR_NO_STANDARD_MET | ERR_TIER_TRANSFER_TARGET_INVALID
    http_status: 422
    applies_to: "POST /issuers/{id}/listing-applications/{appId}/approve"

  - priority: 10
    category: business_constraint
    check: "Market data snapshot trade_date must equal the logical clock's current date and must be unique per issuer"
    error_id: ERR_SNAPSHOT_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /issuers/{id}/market-data-snapshots"

  - priority: 11
    category: business_constraint
    check: "A compliance plan may only be filed for an OPEN deficiency whose compliance_due_at is strictly in the future, and at most one plan exists per deficiency ever"
    error_id: ERR_PLAN_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /issuers/{id}/compliance-plans"

  - priority: 12
    category: business_temporal
    check: "staff-determine-delisting requires the cure period to have lapsed (clock > compliance_due_at) unless the deficiency's plan is already REJECTED"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /issuers/{id}/deficiencies/{defId}/staff-determine-delisting"

  - priority: 13
    category: business_temporal
    check: "An appeal may only be filed while the deficiency is STAFF_DELIST_DETERMINED and filed_at <= staff_determined_at + 7 days; at most one appeal per deficiency ever"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /issuers/{id}/appeals"

  - priority: 14
    category: business_temporal
    check: "execute-delisting requires: deficiency STAFF_DELIST_DETERMINED with clock > staff_determined_at + 7 days and no appeal filed; OR deficiency DELIST_UPHELD via a decided appeal (PANEL_AFFIRMED / COUNCIL_AFFIRMED) — a PANEL_REVIEWING or COUNCIL_REVIEWING appeal blocks execution"
    error_id: ERR_DELISTING_BLOCKED
    http_status: 422
    applies_to: "POST /issuers/{id}/listings/{listingId}/execute-delisting"

  - priority: 15
    category: business_temporal
    check: "council-review is only available from PANEL_AFFIRMED or PANEL_REVERSED appeal states"
    error_id: ERR_COUNCIL_REVIEW_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /issuers/{id}/appeals/{appealId}/council-review"

  - priority: 16
    category: business_constraint
    check: "Corporate action EFFECTIVE requires a qualifying OPEN/PLAN_SUBMITTED BID_PRICE deficiency on the issuer"
    error_id: ERR_NO_QUALIFYING_DEFICIENCY
    http_status: 422
    applies_to: "POST /issuers/{id}/corporate-actions/{actionId}/effect"

  - priority: 17
    category: business_fiscal
    check: "run-annual-fees requires: issuer LISTED with an ACTIVE listing; no ANNUAL FeeAssessment already exists for the clock year; shares_outstanding >= 1"
    error_id: ERR_FEE_ALREADY_ASSESSED
    http_status: 409
    applies_to: "POST /issuers/{id}/fee-assessments/run-annual-fees"

  - priority: 18
    category: business_fiscal
    check: "mark-paid requires the fee INVOICED; a fee on a DELISTED issuer may still be paid (payment outlives listing)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /issuers/{id}/fee-assessments/{feeId}/mark-paid"

  - priority: 19
    category: business_constraint
    check: "Payload schema: required fields present, enums in closed sets, integers within declared ranges (split_ratio_denominator >= 2, counts >= 0, prices >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 20
    category: state
    check: "OCC: expected_issuer_version must equal the issuer's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /issuers/{id}/listing-applications/{appId}/approve, POST /issuers/{id}/fee-assessments/run-annual-fees"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ListingAnalyst]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: []

  # --- Issuer ---
  - method: POST
    path: "/issuers"
    description: "Register an issuer (PRE_LISTING)"
    roles: [ListingAnalyst]
    code: 201
    input: [legal_name, ticker_symbol]
    output: Issuer
    side_effects: ["status = PRE_LISTING", "ticker_symbol uniqueness enforced (ERR_INVALID_REQUEST on duplicate)"]

  - method: GET
    path: "/issuers"
    description: "List issuers"
    roles: [ListingAnalyst, IssuerOfficer, HearingsOfficer, ListingsCouncil, FinanceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Issuer[]"
    side_effects: []

  - method: GET
    path: "/issuers/{issuerId}"
    description: "Get an issuer"
    roles: [ListingAnalyst, IssuerOfficer, HearingsOfficer, ListingsCouncil, FinanceOfficer]
    code: 200
    input: []
    output: Issuer
    side_effects: []

  # --- ListingApplication ---
  - method: POST
    path: "/issuers/{issuerId}/listing-applications"
    description: "Create a listing application (DRAFT). readmission: true selects application_kind READMISSION and requires issuer DELISTED without a prior rejected readmission."
    roles: [IssuerOfficer]
    code: 201
    input: [target_tier, "is_transfer_from_exchange?", "application_kind?", "readmission?", board_directors, audit_committee, compensation_committee, stockholders_equity_cents, market_value_listed_securities_cents, market_value_unrestricted_publicly_held_cents, total_revenue_cents, income_from_continuing_operations_cents, bid_price_cents, publicly_held_shares, unrestricted_publicly_held_shares, round_lot_holders, total_shareholders, market_makers, operating_history_months]
    output: ListingApplication
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/issuers/{issuerId}/listing-applications"
    description: "List an issuer's applications"
