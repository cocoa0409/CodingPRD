        distinguishing_aspect: "Booking a CREDIT reservation (credit_cost 1) from an 8-credit ACTIVE PLUS membership: the membership read immediately afterward shows credit_balance==7 (immediate consistency)."
        test_recipe:
          setup: ["ACTIVE PLUS membership 8 credits; one CREDIT booking made; clock 2026-06-15T12:00:00Z."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
