              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_la: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Vantage Pet Supply LLC", email: "ops@vantage-petsupply.example", tax_id_hash: "TAX-VA-0001", payout_bank_token: "BANK-VA-0001", address_fingerprint: "ADDR-VA-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 300000, external_reference: "PAYOUT-CYCLE-2026-07-E" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_la}", reporter_type: "BUYER", evidence_reference: "EV-VA-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv0: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-10T00:00:00.000Z", expected_seller_version: "${sv0}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id, h1_amount: $.data.held_amount_cents }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-11T00:00:00.000Z", coverage_end: "2026-08-20T00:00:00.000Z", expected_seller_version: "${sv1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { err_code: $.data.error_id }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-11T00:00:01.000Z", coverage_end: "2026-08-20T00:00:00.000Z", expected_seller_version: "${sv1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h2: $.data.id, h2_amount: $.data.held_amount_cents }
          assert:
            - "${h1_amount} == 30000   # 0.10 x 300000"
            - "exact-24h attempt: 422 and ${err_code} == ERR_HOLD_COVERAGE_OVERLAP   # separation must be strictly GREATER than HOLD_BUFFER_HOURS"
            - "the exact-24h attempt created no row and did not move money"
            - "one-second-later attempt: 201 and ${h2_amount} == 27000   # 0.10 x the ALREADY REDUCED 270000, not 0.10 x 300000"
            - "DisbursementHold.${h2}.risk_tier == TIER_1 and reserve_basis == ROLLING"
            - "Seller.${s_id}.available_balance_cents == 243000 and Seller.${s_id}.held_balance_cents == 57000"
            - "Seller.${s_id}.version == ${sv1} + 1   # only the accepted row bumped the version"
            - "exactly two DisbursementHold rows exist for ${s_id}, both ACTIVE"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: relist_blocked_while_seller_restricted_allowed_while_watchlist
        grounds:
          - "state_machines.Listing.REMOVED_to_ACTIVE"
          - "calculations.enforcement_state_target"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: |
          Entity pair Listing <- Seller: the relist request is byte-identical for both sellers and
          both listings are REMOVED under LISTING_ACCURACY; only the PARENT seller's
          enforcement_state differs (RESTRICTED vs WATCHLIST), and that alone decides 409 vs 200.
          The two postures are produced by different routes — A's rung was computed (5.00 crosses
          4.00) while B's came from an override on a 2.00 rule — so the guard cannot be faked by
          reading action_type.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-REL-A (LISTING_ACCURACY, 5.00, removal_scope LISTING, requires_poa false) and LA-REL-B (LISTING_ACCURACY, 2.00, removal_scope LISTING, requires_poa false)."
            - "Seller A owns listing l1; a SUBSTANTIATED violation cites l1 under LA-REL-A; the action's computed rung is LISTING_REMOVAL (post_balance 5.00 >= 4.00) -> l1 REMOVED, enforcement_state RESTRICTED."
            - "Seller B owns listing l2; a SUBSTANTIATED violation cites l2 under LA-REL-B; the computed rung is WARNING (post_balance 2.00) and action_type_override LISTING_REMOVAL is accepted as strictly more severe -> l2 REMOVED, enforcement_state WATCHLIST."
            - "Neither listing carries removal_policy_category RESTRICTED_PRODUCT, so the priority-100 permanent bar does not apply."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
