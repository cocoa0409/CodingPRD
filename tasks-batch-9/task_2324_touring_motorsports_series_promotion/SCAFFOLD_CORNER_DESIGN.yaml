            - call: "PATCH /tour-stops/${stop_oma}/logistics"
              payload: { preceding_stop_id: "${stop_dal}", haul_distance_miles: 700 }
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { preceding_stop_id: "${stop_dal}" }
              as: SeriesPromoter
          assert:
            - "trigger call 1 returns HTTP 422 with ${e_self} == ERR_ROTATION_CHAIN_INVALID (self-reference)"
            - "trigger call 2 returns HTTP 422 with ${e_cross_season} == ERR_ROTATION_CHAIN_INVALID: ${stop_phx} exists and is earlier, but belongs to another season"
            - "trigger call 3 returns HTTP 422 with ${e_future} == ERR_ROTATION_CHAIN_INVALID: 2027-01-09 is after 2026-12-05, which would invert the tour"
            - "trigger call 4 returns HTTP 200 and TourStop.${stop_dal}.preceding_stop_id == \"${stop_atl}\" with haul_distance_miles == 800"
            - "trigger call 5 returns HTTP 422 with ${e_claimed} == ERR_ROTATION_CHAIN_INVALID because ${stop_atl} is already the predecessor of ${stop_dal}, so the chain stays a simple path"
            - "trigger call 6 returns HTTP 200, giving the chain ATL -> DAL -> OMA"
            - "trigger call 7 lists exactly one stop, ${stop_oma}, confirming the link is queryable and that none of the rejected PATCHes was persisted"

      - name: corner_error_marketing_ceilings_fire_in_channel_stop_then_pool_order
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_CHANNEL_CAP_EXCEEDED
          - errors.ERR_STOP_MARKETING_CAP_EXCEEDED
          - errors.ERR_MARKETING_BUDGET_EXCEEDED
          - validations[order=50]
          - validations[order=51]
          - validations[order=52]
          - calculations.marketing_allocation_admission
        distinguishing_aspect: "The three marketing ceilings are nested and must be checked channel-first, stop-second, pool-last. With a 1000000 season budget each stop may absorb 200000 (RADIO 80000 / DIGITAL 120000 / GRASSROOTS 60000), so the season pool can only be drained by filling five markets; only then can a sixth market's tiny, channel-legal, stop-legal allocation expose ERR_MARKETING_BUDGET_EXCEEDED. On an already-full stop the stop ceiling answers even though the pool is empty too."
        test_recipe:
          setup:
            - "One Season with total_marketing_budget_cents 1000000, so stop_cap == 200000 and the channel caps are RADIO 80000, DIGITAL 120000, GRASSROOTS 60000"
            - "One venue reused for six dates 30 days apart (2026-10-10, 2026-11-09, 2026-12-09, 2027-01-08, 2027-02-07, 2027-03-09), all accepted, so the market rotation cooldown of 21 days is respected"
            - "Five of the six stops are filled to exactly their 200000 cap with RADIO 80000 + DIGITAL 120000; the sixth is left untouched"
