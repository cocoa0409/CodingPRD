            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-2", effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }, as: FirmPrincipal, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_LICENSE_PERIOD_OVERLAP"
            - "HTTP status == 409"

      - name: inspection_window_within_buffer_rejected
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_INSPECTION_OVERLAP]"
          - entities.Claim.fields.inspection_start
          - entities.Claim.fields.inspection_end
        distinguishing_aspect: |
          Half-open datetime windows with a TRAVEL_BUFFER_MINUTES=60 gap on the adjuster's
          calendar (a different interval semantics and resource from License): claim B's window
          starting 30 min after claim A's window end violates the 60-min buffer -> ERR_INSPECTION_OVERLAP.
        test_recipe:
          setup:
            - "Two filed claims under the same adjuster; claim A inspection scheduled [2026-07-10T09:00, 11:00); claim B inspection scheduled [2026-07-10T11:30, 13:00) (30 min after A, inside the 60-min buffer)."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clmA: $.data.id } }
            - { call: "POST /v1/claims/${clmA}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-20T00:00:00Z", loss_state_code: "TX", peril_type: "HAIL", pa_rcv_estimate_cents: 7500000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clmB: $.data.id } }
            - { call: "POST /v1/claims/${clmB}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clmA}/schedule-inspection", payload: { inspection_start: "2026-07-10T09:00:00Z", inspection_end: "2026-07-10T11:00:00Z" }, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/claims/${clmB}/schedule-inspection", payload: { inspection_start: "2026-07-10T11:30:00Z", inspection_end: "2026-07-10T13:00:00Z" }, as: PublicAdjuster, as_user_id: "${adj}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INSPECTION_OVERLAP"
            - "HTTP status == 409"

  - rule_id: compensating_invariant
    instances:
      - name: cash_conservation_recovery_equals_fee_plus_advance_plus_client
        grounds:
          - calculations.disbursement_waterfall
          - state_machines.Payment.RECEIVED_to_CLEARED
          - state_machines.Payment.CLEARED_to_REVERSED
          - state_machines.Disbursement.PENDING_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = cash cents: a cleared payment's gross (5000000) equals
          fee(500000)+advance_recoup(0)+client(4500000); reversing the payment voids the
          disbursement and returns amount_recovered_cents to 0, leaving no cash drift.
        test_recipe:
          setup:
            - "Claim settled at 8000000; a partial payment of 5000000 cleared (claim stays SETTLED), creating a PENDING disbursement; then the payment is reversed."
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 8000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/payments", payload: { claim_id: "${clm}", amount_cents: 5000000, payment_type: "INITIAL" }, as: Carrier, captures: { pay: $.data.id } }
            - { call: "POST /v1/payments/${pay}/clear", payload: {}, as: Carrier }
            - { call: "GET /v1/disbursements", payload: { claim_id: "${clm}" }, as: FirmPrincipal, captures: { dis: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/payments/${pay}/reverse", payload: {}, as: Carrier }
            - { call: "GET /v1/claims/${clm}", payload: {}, as: FirmPrincipal }
          assert:
            - "Disbursement.${dis}.fee_cents == 500000"
            - "Disbursement.${dis}.advance_recoup_cents == 0"
            - "Disbursement.${dis}.client_cents == 4500000"
            - "Disbursement.${dis}.status == VOIDED"
            - "Claim.${clm}.amount_recovered_cents == 0"

      - name: coverage_limit_conservation_settle_then_rescind
        grounds:
          - calculations.policy_exposure
          - entities.Policy.fields.committed_cents
          - entities.Policy.fields.remaining_limit_cents
          - state_machines.Claim.OFFER_RECEIVED_to_SETTLED
          - state_machines.Claim.SETTLED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = coverage-limit capacity (distinct from cash): coverage_limit_cents
          == remaining_limit_cents + committed_cents holds after settling (100000000 == 92000000 +
          8000000) and the compensating rescind/withdraw returns committed to 0 with the identity intact.
        test_recipe:
          setup:
            - "At clock 2026-07-01, an active contract whose claim is settled at 8000000 (committed 8000000, remaining 92000000); the contract is then rescinded within the cooling-off window."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/licenses", payload: { adjuster_id: "${adj}", state_code: "TX", license_number: "TX-1", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cli: $.data.id } }
            - { call: "POST /v1/policies", payload: { client_id: "${cli}", carrier_name: "Acme", policy_number: "P1", policy_type: "HO3", coverage_limit_cents: 100000000, deductible_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: FirmPrincipal, captures: { pol: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cli}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
            - { call: "POST /v1/contracts/${con}/sign", payload: {}, as: Client, as_user_id: "${cli}" }
            - { call: "POST /v1/contracts/${con}/activate", payload: {}, as: FirmPrincipal }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol}", contract_id: "${con}", date_of_loss: "2026-06-15T00:00:00Z", loss_state_code: "TX", peril_type: "WIND", pa_rcv_estimate_cents: 10000000, depreciation_pct: 0.20 }, as: PublicAdjuster, as_user_id: "${adj}", captures: { clm: $.data.id } }
            - { call: "POST /v1/claims/${clm}/file", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
            - { call: "POST /v1/claims/${clm}/record-offer", payload: { offer_cents: 8000000 }, as: Carrier }
            - { call: "POST /v1/claims/${clm}/accept-settlement", payload: {}, as: PublicAdjuster, as_user_id: "${adj}" }
          trigger:
            - { call: "POST /v1/contracts/${con}/rescind", payload: {}, as: FirmPrincipal }
            - { call: "GET /v1/policies/${pol}", payload: {}, as: FirmPrincipal }
          assert:
            - "Claim.${clm}.status == WITHDRAWN"
            - "Policy.${pol}.committed_cents == 0"
            - "Policy.${pol}.remaining_limit_cents == 100000000"
