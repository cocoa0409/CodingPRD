            - "captured e_label == ERR_DUPLICATE_PUBLICATION_LABEL with HTTP 409"
            - "captured e_cycle == ERR_DUPLICATE_EVALUATION_CYCLE with HTTP 409"
            - "GET /governance/legal-mandates?policy_id=${pol} returns total_count == 1"

      - name: stale_version_error_returns_precondition_failed_on_agenda_write
        claim_type: Violation to Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[agenda-item-create-stale-meeting]
        distinguishing_aspect: "ERR_STALE_VERSION is the only 412 in the catalogue and it is raised by exactly the two optimistic-concurrency writes; posting an agenda item with expected_meeting_version deliberately one behind the meeting's current version returns it."
        test_recipe:
          setup:
            - "Meeting M (REGULAR, 2026-09-10T18:00:00Z) is DRAFT and already carries one CONSENT item, so its version has advanced to 2."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
