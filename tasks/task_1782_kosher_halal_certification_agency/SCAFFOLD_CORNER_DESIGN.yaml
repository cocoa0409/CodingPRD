# =============================================================================
# Task 1782 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 claims not covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.AgencyClient]
        distinguishing_aspect: "POST /api/clients returns status PROSPECT, open_nc_score 0, risk_tier LOW, total_billed_cents 0, version 1, server-minted id and ISO8601 created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Def Co", certification_scheme: "HALAL", contact_email: "d@x.com" }, as: AccountManager, captures: { cD: $.data.id, cD_st: $.data.status, cD_sc: $.data.open_nc_score, cD_tier: $.data.risk_tier, cD_b: $.data.total_billed_cents, cD_v: $.data.version } }
          trigger: []
          assert:
            - "cD_st == PROSPECT, cD_sc == 0, cD_tier == LOW, cD_b == 0, cD_v == 1"
            - "cD.id is a bare UUID (no type prefix)"

      - name: client_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AgencyClient.fields.certification_scheme, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required certification_scheme -> 400 ERR_INVALID_REQUEST; no row persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { legal_name: "Bad Co", contact_email: "b@x.com" }, as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"

      - name: client_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.AgencyClient.fields.certification_scheme, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "certification_scheme='BOTH' is not in {KOSHER, HALAL, DUAL} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { legal_name: "Enum Co", certification_scheme: "BOTH", contact_email: "e@x.com" }, as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"

      - name: computed_fields_input_ignored_on_client_create
        claim_type: computed_fields
        grounds: [entities.AgencyClient.fields.open_nc_score, entities.AgencyClient.fields.total_billed_cents]
        distinguishing_aspect: "Client-supplied open_nc_score/total_billed_cents/risk_tier values are ignored: server-computed defaults (0 / 0 / LOW) win."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { legal_name: "Sneaky Co", certification_scheme: "KOSHER", contact_email: "s@x.com", open_nc_score: 99, total_billed_cents: 500000, risk_tier: "HIGH" }, as: AccountManager, captures: { cS: $.data.id } }
            - { call: "GET /api/clients/${cS}", as: AccountManager, captures: { sc: $.data.open_nc_score, tb: $.data.total_billed_cents, tier: $.data.risk_tier } }
          assert:
            - "sc == 0 and tb == 0 and tier == LOW (input values ignored, not persisted)"

      - name: get_nonexistent_client_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> 404 ERR_NOT_FOUND with the standard error envelope (meta + data.error_id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/clients/11111111-2222-4333-8444-555555555555", as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"

      - name: list_pagination_envelope_fields_present
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /api/clients?limit=1&offset=0 with 2 clients returns exactly 1 row plus total_count == 2, has_more == true; offset=1 returns the second row with has_more == false."
        test_recipe:
          setup: ["two clients exist"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Pg A", certification_scheme: "KOSHER", contact_email: "pa@x.com" }, as: AccountManager }
            - { call: "POST /api/clients", payload: { legal_name: "Pg B", certification_scheme: "HALAL", contact_email: "pb@x.com" }, as: AccountManager }
          trigger:
            - { call: "GET /api/clients", payload: { limit: 1, offset: 0 }, as: AccountManager }
          assert:
            - "response is an array envelope with exactly 1 data row; total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: ingredient_start_review_from_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Ingredient.SUBMITTED_to_UNDER_REVIEW]
        distinguishing_aspect: "start-review is legal only from SUBMITTED; from APPROVED it fails ERR_INGREDIENT_INVALID_STATE."
        test_recipe:
          setup: ["ingredient APPROVED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM1 Co", certification_scheme: "KOSHER", contact_email: "sm1@x.com" }, as: AccountManager, captures: { c1: $.data.id } }
            - { call: "POST /api/ingredients", payload: { client_id: "${c1}", name: "I1", manufacturer: "M", source_category: "MINERAL" }, as: ClientContact, as_user_id: "${c1}", captures: { i1: $.data.id } }
            - { call: "POST /api/ingredients/${i1}/start-review", as: CertificationReviewer }
            - { call: "POST /api/ingredients/${i1}/approve", as: CertificationReviewer }
          trigger:
            - { call: "POST /api/ingredients/${i1}/start-review", as: CertificationReviewer, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INGREDIENT_INVALID_STATE (409)"]

      - name: change_notice_on_submitted_ingredient_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Ingredient.APPROVED_to_CHANGE_PENDING]
        distinguishing_aspect: "change-notices require APPROVED; from SUBMITTED -> ERR_INGREDIENT_INVALID_STATE."
        test_recipe:
          setup: ["ingredient SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM2 Co", certification_scheme: "KOSHER", contact_email: "sm2@x.com" }, as: AccountManager, captures: { c2: $.data.id } }
            - { call: "POST /api/ingredients", payload: { client_id: "${c2}", name: "I2", manufacturer: "M", source_category: "PLANT" }, as: ClientContact, as_user_id: "${c2}", captures: { i2: $.data.id } }
          trigger:
            - { call: "POST /api/ingredients/${i2}/change-notices", payload: { change_summary: "too early" }, as: ClientContact, as_user_id: "${c2}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_INGREDIENT_INVALID_STATE (409)"]

      - name: facility_double_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Facility.PENDING_REVIEW_to_APPROVED]
        distinguishing_aspect: "Second approve on an APPROVED facility -> ERR_FACILITY_INVALID_STATE."
        test_recipe:
          setup: ["facility APPROVED via equipment assess + INITIAL visit"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM3 Co", certification_scheme: "KOSHER", contact_email: "sm3@x.com" }, as: AccountManager, captures: { c3: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${c3}", name: "F3", address: "a", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${c3}", captures: { f3: $.data.id } }
            - { call: "POST /api/equipment-lines", payload: { facility_id: "${f3}", designation: "L1" }, as: ClientContact, as_user_id: "${c3}", captures: { e3: $.data.id } }
            - { call: "POST /api/equipment-lines/${e3}/assess", payload: { dedication_status: "DEDICATED" }, as: CertificationReviewer }
            - { call: "POST /api/visits", payload: { facility_id: "${f3}", visit_type: "INITIAL", inspector_user_id: "sup-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: AccountManager, captures: { v3: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${v3}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${v3}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/facilities/${f3}/approve", as: CertificationReviewer }
          trigger:
            - { call: "POST /api/facilities/${f3}/approve", as: CertificationReviewer, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FACILITY_INVALID_STATE (409)"]

      - name: visit_complete_before_start_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SupervisionVisit.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "complete from SCHEDULED (never started) -> ERR_VISIT_INVALID_STATE."
        test_recipe:
          setup: ["visit SCHEDULED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM4 Co", certification_scheme: "KOSHER", contact_email: "sm4@x.com" }, as: AccountManager, captures: { c4: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${c4}", name: "F4", address: "a", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${c4}", captures: { f4: $.data.id } }
            - { call: "POST /api/visits", payload: { facility_id: "${f4}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: AccountManager, captures: { v4: $.data.id } }
          trigger:
            - { call: "POST /api/visits/${v4}/complete", as: FieldSupervisor, as_user_id: "sup-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_VISIT_INVALID_STATE (409)"]

      - name: finding_remediation_on_verified_closed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.InspectionFinding]
        distinguishing_aspect: "VERIFIED_CLOSED is terminal: submit-remediation on it -> ERR_FINDING_INVALID_STATE."
        test_recipe:
          setup: ["finding VERIFIED_CLOSED (OPEN -> submit-remediation -> verify CLOSED by a different supervisor)"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM5 Co", certification_scheme: "KOSHER", contact_email: "sm5@x.com" }, as: AccountManager, captures: { c5: $.data.id } }
            - { call: "POST /api/facilities", payload: { client_id: "${c5}", name: "F5", address: "a", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${c5}", captures: { f5: $.data.id } }
            - { call: "POST /api/visits", payload: { facility_id: "${f5}", visit_type: "ROUTINE", inspector_user_id: "sup-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: AccountManager, captures: { v5: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${v5}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${v5}/findings", payload: { severity: "MINOR", description: "log gap", remediation_deadline: "2026-09-01T00:00:00Z" }, as: FieldSupervisor, as_user_id: "sup-1", captures: { fnd5: $.data.id } }
            - { call: "POST /api/findings/${fnd5}/submit-remediation", payload: { remediation_notes: "fixed" }, as: ClientContact, as_user_id: "${c5}" }
            - { call: "POST /api/findings/${fnd5}/verify", payload: { outcome: "CLOSED" }, as: FieldSupervisor, as_user_id: "sup-2" }
          trigger:
            - { call: "POST /api/findings/${fnd5}/submit-remediation", payload: { remediation_notes: "again" }, as: ClientContact, as_user_id: "${c5}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FINDING_INVALID_STATE (409)"]

      - name: invoice_void_on_paid_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice]
        distinguishing_aspect: "PAID is terminal for void: voiding a PAID invoice -> ERR_INVOICE_INVALID_STATE; billed cents remain."
        test_recipe:
          setup: ["client with ACTIVE agreement and PAID annual invoice"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM6 Co", certification_scheme: "KOSHER", contact_email: "sm6@x.com" }, as: AccountManager, captures: { c6: $.data.id } }
            - { call: "POST /api/clients/${c6}/submit-application", as: ClientContact, as_user_id: "${c6}", captures: { c6_v: $.data.version } }
            - { call: "POST /api/facilities", payload: { client_id: "${c6}", name: "F6", address: "a", facility_role: "OWNED" }, as: ClientContact, as_user_id: "${c6}" }
            - { call: "POST /api/agreements", payload: { client_id: "${c6}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${c6_v}" }, as: AccountManager, captures: { a6: $.data.id } }
            - { call: "POST /api/agreements/${a6}/activate", as: AccountManager }
            - { call: "POST /api/invoices", payload: { client_id: "${c6}", invoice_type: "ANNUAL_CERTIFICATION", agreement_id: "${a6}" }, as: AccountManager, captures: { inv6: $.data.id } }
            - { call: "POST /api/invoices/${inv6}/record-payment", as: AccountManager, as_user_id: "am-1" }
          trigger:
            - { call: "POST /api/invoices/${inv6}/void", as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVOICE_INVALID_STATE (409)"
            - "AgencyClient.${c6}.total_billed_cents == 120000 (unchanged)"

      - name: certificate_double_issue_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Certificate.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Second issue on an ACTIVE certificate -> ERR_CERTIFICATE_INVALID_STATE; issued_at/valid_until unchanged."
        test_recipe:
          setup: ["fully certified client with ACTIVE certificate"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM7 Co", certification_scheme: "KOSHER", contact_email: "sm7@x.com" }, as: AccountManager, captures: { c7: $.data.id } }
            - { call: "POST /api/clients/${c7}/submit-application", as: ClientContact, as_user_id: "${c7}", captures: { c7_v: $.data.version } }
