            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c2: "$.data[1].id", c3: "$.data[2].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c2}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/chart-chases/${c3}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c2}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a2: $.data.id } }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c3}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a3: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a2}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/abstractions/${a3}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "GET /hedis/abstractions/${a3}", as: QualityAnalyst, captures: { a3_ro_pre: $.data.requires_overread } }
            - { call: "GET /hedis/samples/${smp}", as: QualityAnalyst, captures: { frac_pre: $.data.required_overread_fraction } }
          trigger:
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "DISAGREE", final_result: "MISS" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "GET /hedis/abstractions/${a1}", as: QualityAnalyst, captures: { a1_st: $.data.status } }
            - { call: "GET /hedis/abstractions/${a2}", as: QualityAnalyst, captures: { a2_ro: $.data.requires_overread } }
            - { call: "GET /hedis/samples/${smp}", as: QualityAnalyst, captures: { rc_1: $.data.remediation_count, frac_1: $.data.required_overread_fraction } }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a2}", outcome: "DISAGREE", final_result: "MISS" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "GET /hedis/samples/${smp}", as: QualityAnalyst, captures: { rc_2: $.data.remediation_count, frac_2: $.data.required_overread_fraction } }
            - { call: "GET /hedis/abstractions/${a3}", as: QualityAnalyst, captures: { a3_ro_post: $.data.requires_overread } }
          assert:
            - "a3_ro_pre == false and frac_pre == 0.1 — before the cascade only a1 is flagged"
            - "a1_st == 'REMEDIATION' (link B: the DISAGREE review mutated the abstraction)"
            - "rc_1 == 1 and frac_1 == 0.1 (link C fired; a single remediation does not override)"
            - "a2_ro == true (leaving-SUBMITTED top-up flagged the next-earliest submitted abstraction)"
            - "rc_2 == 2 and frac_2 == 1.0 (C->D: remediation_count reaching 2 forces the fraction override immediately, without any evaluate-irr call)"
            - "a3_ro_post == true (D->E: the new fraction re-runs the selector and flags a3)"

      - name: supplemental_accept_numerator_gap_cascade
        grounds:
          - state_machines.SupplementalDataBatch.SCREENED_to_ACCEPTED
          - entities.PopulationEntry.fields.admin_compliant
          - state_machines.GapItem.OPEN_to_CLOSED_COMPLIANT
          - entities.Provider.fields.open_gap_count
        distinguishing_aspect: |
          Depth-3 chain rooted at POST /hedis/supplemental-batches/{id}/accept: batch ACCEPTED
          flips PopulationEntry.admin_compliant (link 1); each flipped entry auto-closes its
          OPEN or OUTREACH_DONE GapItem with closure_source AUTO_EVIDENCE (link 2); each gap
          closure decrements Provider.open_gap_count (link 3). Different triggering transition
          than the over-read cascade.
        test_recipe:
          setup:
            - "Season MY2025 OPEN, clock 2026-03-01, approved sources [LAB_FEED]; ACTIVE ADMINISTRATIVE spec CBP age 0-100 ANY"
            - "Providers P1 and P2; members M1/M2 attributed to P1, M3 attributed to P2; all enrolled all 2025"
            - "Run POPULATED (denominator 3) then RATE_COMPUTED with no evidence -> gaps G1(M1,P1), G2(M2,P1), G3(M3,P2) all OPEN; P1.open_gap_count == 2"
            - "G2 advanced to OUTREACH_DONE; a SCREENED LAB_FEED batch holds accepted A1C records for M1 (2025-05-05) and M2 (2025-05-06)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P1", name: "Provider One" }, as: QualityAdmin, captures: { p1: $.data.id } }
            - { call: "POST /hedis/providers", payload: { provider_ref: "P2", name: "Provider Two" }, as: QualityAdmin, captures: { p2: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "M", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M2", birth_date: "1990-01-01T00:00:00Z", gender: "M", attributed_provider_ref: "P1" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M3", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "P2" }, as: QualityAdmin, captures: { m3: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m3}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, captures: { den: $.data.denominator_count } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}/gap-items", as: QualityAnalyst, captures: { g1: "$.data[0].id", g1_m: "$.data[0].member_ref", g2: "$.data[1].id", g2_m: "$.data[1].member_ref", g3: "$.data[2].id", g3_m: "$.data[2].member_ref" } }
            - { call: "GET /hedis/providers/${p1}", as: QualityAnalyst, captures: { p1_gaps_pre: $.data.open_gap_count } }
            - { call: "POST /hedis/gap-items/${g2}/mark-outreach-done", as: ProviderRelations }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_id}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b}", member_ref: "M1", service_date: "2025-05-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b}", member_ref: "M2", service_date: "2025-05-06T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b}/screen", as: QualityAnalyst, captures: { acc: $.data.accepted_record_count } }
          trigger:
            - { call: "POST /hedis/supplemental-batches/${b}/accept", as: QualityAnalyst, captures: { bst: $.data.status } }
            - { call: "GET /hedis/measure-runs/${run_id}/population-entries", as: QualityAnalyst, captures: { e1c: "$.data[0].admin_compliant", e2c: "$.data[1].admin_compliant", e3c: "$.data[2].admin_compliant" } }
            - { call: "GET /hedis/measure-runs/${run_id}/gap-items", as: QualityAnalyst, captures: { g1s: "$.data[0].status", g1cs: "$.data[0].closure_source", g2s: "$.data[1].status", g2cs: "$.data[1].closure_source", g3s: "$.data[2].status" } }
            - { call: "GET /hedis/providers/${p1}", as: QualityAnalyst, captures: { p1_post: $.data.open_gap_count } }
            - { call: "GET /hedis/providers/${p2}", as: QualityAnalyst, captures: { p2_post: $.data.open_gap_count } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { anc: $.data.admin_numerator_count } }
          assert:
            - "den == 3 and acc == 2 and bst == 'ACCEPTED'"
            - "g1_m == 'M1' and g2_m == 'M2' and g3_m == 'M3' (gap list ordered by member_ref ASC mint order)"
            - "p1_gaps_pre == 2"
            - "e1c == true and e2c == true and e3c == false (link 1: accepted records flip matching entries)"
            - "g1s == 'CLOSED_COMPLIANT' and g1cs == 'AUTO_EVIDENCE' (link 2: entry flip auto-closes the OPEN gap)"
            - "g2s == 'CLOSED_COMPLIANT' and g2cs == 'AUTO_EVIDENCE' (auto-close also fires from OUTREACH_DONE)"
            - "g3s == 'OPEN' (M3 received no evidence)"
            - "p1_post == 0 (link 3: provider counter reconciled by the two closures) and p2_post == 1"
            - "anc == 2"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_beats_deadline_temporal
        grounds:
          - validations[priority=6.1]
          - validations[priority=9]
          - errors[ERR_RUN_NOT_SUBMITTABLE]
          - errors[ERR_SUBMISSION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): on a submit where the run is in
          POPULATED (not RATE_COMPUTED) AND the logical clock sits past the season deadline,
          the state error ERR_RUN_NOT_SUBMITTABLE (priority 6.1) masks
          ERR_SUBMISSION_DEADLINE_PASSED (priority 9); a second run in RATE_COMPUTED shows the
          temporal error surfacing once state passes.
        test_recipe:
          setup:
            - "Season MY2025 with submission_deadline 2026-04-01 — already BEFORE the default logical clock 2026-05-01T00:00:00Z (no set_current_utc call is ever made, so the season is never auto-closed and stays OPEN)"
            - "Two ACTIVE ADMINISTRATIVE specs D1 and D2 (age 0-100 ANY); member M1 (F 1990-01-01) enrolled all 2025"
            - "run1 (spec D1): POPULATED only (no compute-rate) — state violation armed"
            - "run2 (spec D2): POPULATED then RATE_COMPUTED — state satisfied, only the deadline violation armed"
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-04-01T00:00:00Z", admin_data_cutoff: "2026-03-01T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "D1", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { sp1: $.data.id }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { season_v2: $.data.version } }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "D2", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v2}" }
              as: QualityAdmin
              captures: { sp2: $.data.id }
            - { call: "POST /hedis/measure-specifications/${sp1}/activate", as: QualityAdmin }
            - { call: "POST /hedis/measure-specifications/${sp2}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin, captures: { sstat: $.data.status } }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${sp1}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r1: $.data.id } }
            - { call: "POST /hedis/measure-runs/${r1}/identify-population", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${sp2}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r2: $.data.id } }
            - { call: "POST /hedis/measure-runs/${r2}/identify-population", as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "GET /hedis/measure-runs/${r2}", as: QualityAnalyst, captures: { v2: $.data.version } }
            - { call: "POST /hedis/measure-runs/${r2}/compute-rate", payload: { expected_measure_run_version: "${v2}" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r2_st: $.data.reporting_status } }
          trigger:
            - { call: "POST /hedis/measure-runs/${r1}/submit", as: QualityAnalyst, as_user_id: "qa-1", captures: { e1: $.data.error_id } }
            - { call: "POST /hedis/measure-runs/${r2}/submit", as: QualityAnalyst, as_user_id: "qa-1", captures: { e2: $.data.error_id } }
          assert:
            - "sstat == 'OPEN' and r2_st == 'RATE_COMPUTED'"
            - "e1 == 'ERR_RUN_NOT_SUBMITTABLE' — state (priority 6.1) masks the deadline failure (priority 9) on the dual-failure submit"
            - "e2 == 'ERR_SUBMISSION_DEADLINE_PASSED' — with run state satisfied, the temporal check fires (season is still OPEN because the default clock was never advanced)"

      - name: accept_source_safety_beats_record_referential
        grounds:
          - validations[priority=8.2]
          - validations[priority=11]
          - errors[ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE]
          - errors[ERR_RECORD_MEMBER_NOT_IN_DENOMINATOR]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential) — distinct from the
          sibling's (state, business_temporal): accepting a batch from an unapproved source
          that ALSO references a member outside the run's denominator returns
          ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE (priority 8.2 masks priority 11); the approved
          batch with the same out-of-denominator record surfaces ERR_RECORD_MEMBER_NOT_IN_DENOMINATOR.
        test_recipe:
          setup:
            - "Season MY2025 OPEN (approved sources [LAB_FEED] only), clock 2026-03-01; ACTIVE ADMINISTRATIVE spec SCR1; member M1 enrolled all 2025"
            - "Run POPULATED with denominator 1 (only M1)"
            - "batch_badsrc: source_type PHARMACY, one record for member_ref 'M999' (not a registered member, hence not in the denominator), SCREENED"
            - "batch_ref: source_type LAB_FEED (approved), same 'M999' record, SCREENED"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "SCR1", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst, captures: { den: $.data.denominator_count } }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_id}", source_type: "PHARMACY" }, as: QualityAnalyst, captures: { b1: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b1}", member_ref: "M999", service_date: "2025-05-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b1}/screen", as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches", payload: { run_id: "${run_id}", source_type: "LAB_FEED" }, as: QualityAnalyst, captures: { b2: $.data.id } }
            - { call: "POST /hedis/supplemental-records", payload: { batch_id: "${b2}", member_ref: "M999", service_date: "2025-05-05T00:00:00Z", evidence_code: "A1C" }, as: QualityAnalyst }
            - { call: "POST /hedis/supplemental-batches/${b2}/screen", as: QualityAnalyst }
          trigger:
            - { call: "POST /hedis/supplemental-batches/${b1}/accept", as: QualityAnalyst, captures: { e1: $.data.error_id } }
            - { call: "POST /hedis/supplemental-batches/${b2}/accept", as: QualityAnalyst, captures: { e2: $.data.error_id } }
          assert:
            - "den == 1"
            - "e1 == 'ERR_UNAPPROVED_SUPPLEMENTAL_SOURCE' — the source-audit safety check (priority 8.2) masks the per-record referential failure (priority 11) although both hold"
