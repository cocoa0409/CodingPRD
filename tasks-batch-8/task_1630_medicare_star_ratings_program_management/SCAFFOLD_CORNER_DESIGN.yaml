# =============================================================================
# §1.9 Scaffold Corner Design — Medicare Star Ratings Program Management
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: measure_creation_computes_weight_and_initial_state
        claim_type: computed_fields
        grounds: [entities.Measure.fields.weight, state_machines.Measure]
        distinguishing_aspect: "measure_type drives weight: PROCESS -> 1, OUTCOME -> 3, PATIENT_EXPERIENCE -> 4; every new measure starts DRAFT with version 1; client-supplied weight is ignored."
        test_recipe:
          setup: ["Empty database; one cycle exists"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m1: $.data.id, w1: $.data.weight }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CBP", title: "Controlling Blood Pressure", domain: CHRONIC_CARE, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m2: $.data.id, w2: $.data.weight }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CNC", title: "Getting Needed Care", domain: MEMBER_EXPERIENCE, measure_type: PATIENT_EXPERIENCE, direction: HIGHER_BETTER, data_source: CAHPS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m3: $.data.id, w3: $.data.weight }
          assert:
            - "Measure.${m1}.weight == 1 and status == DRAFT and version == 1"
            - "Measure.${m2}.weight == 3"
            - "Measure.${m3}.weight == 4"

      - name: member_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Member.fields.status, state_machines.Member]
        distinguishing_aspect: "New member starts ENROLLED with version 1 and the echoed enrolled_months; id is a server-minted UUID."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/members"
              payload: { member_ref: "MBR-100", plan_contract: "H1234", enrolled_months: 6 }
              as: QualityOps
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.status == ENROLLED"
            - "Member.${mem_id}.version == 1"
            - "Member.${mem_id}.enrolled_months == 6"

      - name: care_gap_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CARE_GAP_NOT_FOUND]", "endpoints[GET /api/care-gaps/{gapId}]"]
        distinguishing_aspect: "GET with a well-formed but unknown gap id returns 404 ERR_CARE_GAP_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/care-gaps/00000000-0000-0000-0000-000000000000"
              as: QualityOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and error_id == ERR_CARE_GAP_NOT_FOUND"

      - name: cycle_year_order_constraint_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "entities.RatingCycle.fields.rating_year"]
        distinguishing_aspect: "rating_year must exceed measurement_year; 2027 <= 2028 fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2028, rating_year: 2027, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and error_id == ERR_INVALID_REQUEST"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: measure_retire_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Measure", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "From RETIRED no transition is possible: a second retire returns ERR_INVALID_STATE_TRANSITION and the measure stays RETIRED."
        test_recipe:
          setup: ["Cycle in SETUP; measure ACTIVE then RETIRED"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: RETIRED }
              as: StarsAnalyst
          trigger:
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: RETIRED }
              as: StarsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and HTTP 409"
            - "Measure.${m_id}.status == RETIRED"

      - name: cycle_skip_transition_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.RatingCycle", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "SETUP -> CUTPOINT_REVIEW is not a declared transition; the cycle rejects the skip and remains SETUP."
        test_recipe:
          setup: ["Cycle in SETUP"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "RatingCycle.${cyc_id}.status == SETUP"

      - name: begin_review_requires_all_locked
        claim_type: precondition_enforcement
        grounds: ["state_machines.RatingCycle.DATA_COLLECTION_to_CUTPOINT_REVIEW", "errors[ERR_PERFORMANCES_NOT_LOCKED]"]
        distinguishing_aspect: "DATA_COLLECTION -> CUTPOINT_REVIEW is rejected with ERR_PERFORMANCES_NOT_LOCKED while any performance of the cycle is still REPORTED."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION with one ACTIVE measure and one REPORTED performance 5/10"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 5, denominator: 10 }
              as: QualityOps
          trigger:
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERFORMANCES_NOT_LOCKED"
            - "RatingCycle.${cyc_id}.status == DATA_COLLECTION"

      - name: reopen_reverts_locked_performances
        claim_type: side_effect_execution
        grounds: [state_machines.RatingCycle.CUTPOINT_REVIEW_to_DATA_COLLECTION, state_machines.MeasurePerformance.LOCKED_to_VALIDATED]
        distinguishing_aspect: "Reopening data collection reverts every LOCKED performance of the cycle to VALIDATED (the revert leg's compensating side effect)."
        test_recipe:
          setup: ["Cycle in CUTPOINT_REVIEW; performance 5/10 LOCKED"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 5, denominator: 10 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
          trigger:
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "GET /api/measure-performances/${perf_id}"
              as: StarsAnalyst
              captures: { p_st: $.data.status }
          assert:
            - "RatingCycle.${cyc_id}.status == DATA_COLLECTION"
            - "MeasurePerformance.${perf_id}.status == VALIDATED"

      - name: publish_official_computes_official_rating
        claim_type: valid_transition
        grounds: [state_machines.RatingCycle.CUTPOINT_REVIEW_to_OFFICIAL_PUBLISHED, calculations.weighted_overall_stars, calculations.improvement_measure, calculations.rebate_projection]
        distinguishing_aspect: "Publish-official computes official_overall_stars 2.5 (published stars 3/3/3/3 plus improvement star 1 at weight 5: 38/16 = 2.375 half-star-rounded), official_improvement_star 1, official_rebate_amount 0.00; the cycle then closes and locks terminally."
        test_recipe:
          setup:
            - "4-measure fixture: published stars 3/3/3/3 (weights 1/3/4/3); M1 prior 3 improvement-eligible, M2 prior 4 improvement-eligible; all LOCKED; set P published; no members"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: true, prior_cycle_star: 3 }
              as: StarsAnalyst
              captures: { m1: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: true, prior_cycle_star: 4 }
              as: StarsAnalyst
              captures: { m2: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CNC", title: "Getting Needed Care", domain: MEMBER_EXPERIENCE, measure_type: PATIENT_EXPERIENCE, direction: HIGHER_BETTER, data_source: CAHPS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m3: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m4: $.data.id }
            - call: "POST /api/measures/${m1}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m2}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m3}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m4}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${m1}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 }, { measure_id: "${m2}", band_2_floor: 0.72, band_3_floor: 0.80, band_4_floor: 0.88, band_5_floor: 0.93 }, { measure_id: "${m3}", band_2_floor: 0.55, band_3_floor: 0.65, band_4_floor: 0.78, band_5_floor: 0.90 }, { measure_id: "${m4}", band_5_floor: 0.15, band_4_floor: 0.40, band_3_floor: 0.80, band_2_floor: 1.20 } ] }
              as: StarsAnalyst
              captures: { set_p: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m1}", numerator: 17, denominator: 20 }
              as: QualityOps
              captures: { p1: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m2}", numerator: 2123, denominator: 2500 }
              as: QualityOps
              captures: { p2: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m3}", numerator: 33, denominator: 50 }
              as: QualityOps
              captures: { p3: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m4}", numerator: 9, denominator: 20 }
              as: QualityOps
              captures: { p4: $.data.id }
            - call: "POST /api/measure-performances/${p1}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p2}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p3}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p4}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p1}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p2}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p3}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p4}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /api/cutpoint-sets/${set_p}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: StarsAdmin
          trigger:
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: OFFICIAL_PUBLISHED }
              as: StarsAdmin
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: StarsAdmin
              captures: { off_stars: $.data.official_overall_stars, off_imp: $.data.official_improvement_star, off_reb: $.data.official_rebate_amount }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CLOSED }
              as: StarsAdmin
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "RatingCycle.${cyc_id}.official_overall_stars == 2.5"
            - "RatingCycle.${cyc_id}.official_improvement_star == 1"
            - "RatingCycle.${cyc_id}.official_rebate_amount == 0.0"
            - "cycle reaches CLOSED"
            - "transition from CLOSED rejected with ERR_INVALID_STATE_TRANSITION"

      - name: payout_pay_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.IncentivePayout", "errors[ERR_PAYOUT_NOT_APPROVED]"]
        distinguishing_aspect: "A PAID payout cannot be paid again: the second pay returns ERR_PAYOUT_NOT_APPROVED and the group totals do not move twice."
        test_recipe:
          setup: ["GAP_CLOSURE group (unit 250, pool 10000) linked to a measure with 1 CLOSED gap; payout proposed by im-1, approved by im-2, then PAID"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 0, denominator: 0 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g1: $.data.id }
            - call: "POST /api/care-gaps/${g1}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/provider-groups"
              payload: { name: "Group G", program_type: GAP_CLOSURE, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay_id: $.data.id }
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: APPROVED }
              as: IncentiveManager
              as_user_id: "im-2"
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: PAID }
              as: IncentiveManager
              as_user_id: "im-2"
          trigger:
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: PAID }
              as: IncentiveManager
              as_user_id: "im-2"
              captures: { err: $.data.error_id }
            - call: "GET /api/provider-groups/${grp_id}"
              as: IncentiveManager
              captures: { paid: $.data.paid_total, rem: $.data.remaining_amount }
          assert:
            - "error_id == ERR_PAYOUT_NOT_APPROVED"
            - "IncentivePayout.${pay_id}.status == PAID"
            - "ProviderGroup.${grp_id}.paid_total == 250.00 (moved exactly once)"
            - "ProviderGroup.${grp_id}.remaining_amount == 9750.00"

      - name: care_gap_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.CareGap, entities.CareGap.fields.intervention_count]
        distinguishing_aspect: "A new gap starts OPEN with intervention_count 0, and its creation already added 1 to the linked performance denominator."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; HEDIS measure ACTIVE with performance 10/20 REPORTED; member ENROLLED"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 10, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { gap_id: $.data.id }
          assert:
            - "CareGap.${gap_id}.status == OPEN"
            - "CareGap.${gap_id}.intervention_count == 0"
            - "MeasurePerformance.${perf_id}.denominator == 21"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: forecast_excludes_reported_performances
        claim_type: input_set_filtering
        grounds: [calculations.weighted_overall_stars]
        distinguishing_aspect: "Forecast input set filters on performance status: a REPORTED performance (would-be star 1) is excluded, so measures_included == 1 and the overall is exactly the VALIDATED measure's 4.0 rather than the two-measure blend."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; measures MA (w1, draft star 4) VALIDATED and MB (w3, draft star 1) REPORTED; DRAFT set floors 0.50/0.60/0.70/0.80 for both"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { ma: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CBP", title: "Controlling Blood Pressure", domain: CHRONIC_CARE, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { mb: $.data.id }
            - call: "POST /api/measures/${ma}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${mb}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${ma}", band_2_floor: 0.50, band_3_floor: 0.60, band_4_floor: 0.70, band_5_floor: 0.80 }, { measure_id: "${mb}", band_2_floor: 0.50, band_3_floor: 0.60, band_4_floor: 0.70, band_5_floor: 0.80 } ] }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${ma}", numerator: 7, denominator: 10 }
              as: QualityOps
              captures: { pa: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${mb}", numerator: 1, denominator: 20 }
              as: QualityOps
            - call: "POST /api/measure-performances/${pa}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
          trigger:
            - call: "POST /api/rating-forecasts"
              payload: { rating_cycle_id: "${cyc_id}", basis: DRAFT_CUTPOINTS }
              as: StarsAnalyst
              captures: { fc_id: $.data.id }
          assert:
            - "RatingForecast.${fc_id}.measures_included == 1"
            - "RatingForecast.${fc_id}.projected_overall_stars == 4.0"
            - "RatingForecast.${fc_id}.improvement_star == null"

      - name: survey_response_rate_boundary_sufficient
        claim_type: constants_applied
        grounds: ["calculations.survey_response_rate", "state_machines.SurveyWave", "errors[ERR_WAVE_OUTSIDE_WINDOW]"]
        distinguishing_aspect: "Exactly 120/300 = 0.40 meets the >= 0.40 sufficiency constant (sufficient true); fielding transitions are gated by the logical clock against the half-open window (start-fielding at the 2026-08-01 default clock fails with ERR_WAVE_OUTSIDE_WINDOW)."
        test_recipe:
          setup: ["Cycle exists; vendor capacity 5; CAHPS wave [2026-09-01, 2026-10-01) sample_size 300, PLANNED; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/survey-vendors"
              payload: { name: "Vendor V", max_concurrent_waves: 5 }
              as: SurveyCoordinator
              captures: { vend_id: $.data.id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", sample_size: 300 }
              as: SurveyCoordinator
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /api/survey-waves/${wave_id}/transition"
              payload: { to_state: FIELDING }
              as: SurveyCoordinator
              captures: { err_early: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: StarsAdmin
            - call: "POST /api/survey-waves/${wave_id}/transition"
              payload: { to_state: FIELDING }
              as: SurveyCoordinator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: StarsAdmin
            - call: "POST /api/survey-waves/${wave_id}/transition"
              payload: { to_state: CLOSED_FIELD }
              as: SurveyCoordinator
            - call: "POST /api/survey-waves/${wave_id}/transition"
              payload: { to_state: SCORED, response_count: 120 }
              as: SurveyCoordinator
              captures: { rr: $.data.response_rate, suff: $.data.sufficient }
          assert:
            - "early start-fielding rejected: err_early == ERR_WAVE_OUTSIDE_WINDOW"
            - "SurveyWave.${wave_id}.status == SCORED"
            - "SurveyWave.${wave_id}.response_rate == 0.4"
            - "SurveyWave.${wave_id}.sufficient == true"

      - name: forecast_basis_set_availability_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_DRAFT_CUTPOINT_SET]", "errors[ERR_NO_PUBLISHED_CUTPOINT_SET]"]
        distinguishing_aspect: "Forecast basis with no matching cut point set: DRAFT_CUTPOINTS with no DRAFT set returns ERR_NO_DRAFT_CUTPOINT_SET; PUBLISHED_CUTPOINTS with none returns ERR_NO_PUBLISHED_CUTPOINT_SET."
        test_recipe:
          setup: ["Cycle in SETUP; no cut point sets"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/rating-forecasts"
              payload: { rating_cycle_id: "${cyc_id}", basis: DRAFT_CUTPOINTS }
              as: StarsAnalyst
              captures: { err_d: $.data.error_id }
            - call: "POST /api/rating-forecasts"
              payload: { rating_cycle_id: "${cyc_id}", basis: PUBLISHED_CUTPOINTS }
              as: StarsAnalyst
              captures: { err_p: $.data.error_id }
          assert:
            - "err_d == ERR_NO_DRAFT_CUTPOINT_SET (409)"
            - "err_p == ERR_NO_PUBLISHED_CUTPOINT_SET (409)"

      - name: attainment_payout_requires_banded_star
        claim_type: violation_to_error
        grounds: ["calculations.incentive_payout_amount", "errors[ERR_PERFORMANCE_NOT_BANDED]"]
        distinguishing_aspect: "ATTAINMENT variant needs the linked measure's published_star; with no published cut point set the star is null and the proposal is rejected with ERR_PERFORMANCE_NOT_BANDED."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; HEDIS measure ACTIVE with performance 10/20 REPORTED; no cut point set published; ATTAINMENT group linked to the measure, target 5, pool 10000"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 10, denominator: 20 }
              as: QualityOps
            - call: "POST /api/provider-groups"
              payload: { name: "Group A", program_type: ATTAINMENT, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 100.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
          trigger:
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERFORMANCE_NOT_BANDED (409)"
            - "ProviderGroup.${grp_id}.reserved_total == 0.00"

      - name: complaint_late_resolution_threshold
        claim_type: precision
        grounds: [calculations.complaint_timeliness, state_machines.ComplaintCase.FILED_to_RESOLVED_VALID]
        distinguishing_aspect: "Exactly 30 days is NOT late (strictly-greater rule); 30 days plus one second IS late and flips the complaints performance timeliness_alert to true."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; COMPLAINTS measure ACTIVE with performance 0/100 REPORTED; member; two FILED complaints filed 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 0, denominator: 100 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/complaint-cases"
              payload: { rating_cycle_id: "${cyc_id}", member_id: "${mem1}", category: BILLING, filed_at: "2026-08-01T00:00:00Z" }
              as: ComplaintsAuditor
              captures: { c1: $.data.id }
            - call: "POST /api/complaint-cases"
              payload: { rating_cycle_id: "${cyc_id}", member_id: "${mem1}", category: ENROLLMENT, filed_at: "2026-08-01T00:00:00Z" }
              as: ComplaintsAuditor
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: StarsAdmin
            - call: "POST /api/complaint-cases/${c1}/transition"
              payload: { to_state: RESOLVED_VALID }
              as: ComplaintsAuditor
              captures: { late1: $.data.late_resolution }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: StarsAdmin
            - call: "POST /api/complaint-cases/${c2}/transition"
              payload: { to_state: RESOLVED_VALID }
              as: ComplaintsAuditor
              captures: { late2: $.data.late_resolution }
            - call: "GET /api/measure-performances/${perf_id}"
              as: ComplaintsAuditor
              captures: { num: $.data.numerator, alert: $.data.timeliness_alert }
          assert:
            - "ComplaintCase.${c1}.late_resolution == false (exactly 30 days is not late)"
            - "ComplaintCase.${c2}.late_resolution == true"
            - "MeasurePerformance.${perf_id}.numerator == 2"
            - "MeasurePerformance.${perf_id}.timeliness_alert == true"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_performance_and_gap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_PERFORMANCE]", "errors[ERR_DUPLICATE_OPEN_GAP]"]
        distinguishing_aspect: "Second performance for the same (measure, cycle) returns ERR_DUPLICATE_PERFORMANCE; second OPEN gap for the same (member, measure) returns ERR_DUPLICATE_OPEN_GAP."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; HEDIS measure ACTIVE; performance 5/10 exists; member with one OPEN gap"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 5, denominator: 10 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
          trigger:
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 6, denominator: 10 }
              as: QualityOps
              captures: { err_dup_perf: $.data.error_id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { err_dup_gap: $.data.error_id }
          assert:
            - "err_dup_perf == ERR_DUPLICATE_PERFORMANCE (409)"
            - "err_dup_gap == ERR_DUPLICATE_OPEN_GAP (409)"

      - name: uniqueness_violations_member_ref_and_measure_code
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_MEMBER_REF]", "errors[ERR_DUPLICATE_MEASURE_CODE]"]
        distinguishing_aspect: "member_ref is globally unique and measure code is unique within its cycle; second uses return ERR_DUPLICATE_MEMBER_REF / ERR_DUPLICATE_MEASURE_CODE."
        test_recipe:
          setup: ["Cycle exists; member MBR-1 registered; measure code BCS present in the cycle"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
          trigger:
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H5678", enrolled_months: 6 }
              as: QualityOps
              captures: { err_mem: $.data.error_id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Duplicate Code", domain: CHRONIC_CARE, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { err_code: $.data.error_id }
          assert:
            - "err_mem == ERR_DUPLICATE_MEMBER_REF (409)"
            - "err_code == ERR_DUPLICATE_MEASURE_CODE (409)"

      - name: gap_type_measure_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_GAP_TYPE_MEASURE_MISMATCH]"]
        distinguishing_aspect: "A PHARMACY_ADHERENCE gap against a HEDIS (non-pharmacy) measure returns ERR_GAP_TYPE_MEASURE_MISMATCH and no denominator delta is applied."
        test_recipe:
          setup: ["Cycle in DATA_COLLECTION; HEDIS measure ACTIVE with performance 5/10; member ENROLLED"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 5, denominator: 10 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GAP_TYPE_MEASURE_MISMATCH (409)"
            - "MeasurePerformance.${perf_id}.denominator == 10 (unchanged)"

      - name: nonmonotonic_cutpoints_rejected_both_directions
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CUTPOINTS_NON_MONOTONIC]"]
        distinguishing_aspect: "HIGHER_BETTER rows require band_2 < band_3 < band_4 < band_5; LOWER_BETTER rows require the reverse; both violations return ERR_CUTPOINTS_NON_MONOTONIC."
        test_recipe:
          setup: ["Cycle exists; HIGHER_BETTER measure MH and LOWER_BETTER measure ML"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { mh: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { ml: $.data.id }
          trigger:
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "bad-higher", rows: [ { measure_id: "${mh}", band_2_floor: 0.70, band_3_floor: 0.60, band_4_floor: 0.80, band_5_floor: 0.90 } ] }
              as: StarsAnalyst
              captures: { err_h: $.data.error_id }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "bad-lower", rows: [ { measure_id: "${ml}", band_5_floor: 0.60, band_4_floor: 0.50, band_3_floor: 0.90, band_2_floor: 1.50 } ] }
              as: StarsAnalyst
              captures: { err_l: $.data.error_id }
          assert:
            - "err_h == ERR_CUTPOINTS_NON_MONOTONIC (400)"
            - "err_l == ERR_CUTPOINTS_NON_MONOTONIC (400)"

      - name: cutpoint_row_cycle_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH]"]
        distinguishing_aspect: "A cut point row referencing a measure from a different cycle returns ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH."
        test_recipe:
          setup: ["Cycles A and B; measure belongs to cycle B; cut point set belongs to cycle A"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_a: $.data.id }
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2025, rating_year: 2027, benchmark_pmpm: 900.0 }
              as: StarsAdmin
              captures: { cyc_b: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_b}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_b: $.data.id }
          trigger:
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_a}", label: "cross-cycle", rows: [ { measure_id: "${m_b}", band_2_floor: 0.60, band_3_floor: 0.70, band_4_floor: 0.80, band_5_floor: 0.90 } ] }
              as: StarsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH (409)"

      - name: request_shape_violations_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Bad enum member, numerator > denominator, and a missing required field each return ERR_INVALID_REQUEST (400) before any existence/state check."
        test_recipe:
          setup: ["Cycle exists; measure BCS present"]
          setup_api_calls:
