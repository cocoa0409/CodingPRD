      - name: consume_quarantine_masks_interchange
        grounds:
          - validations[priority=11]
          - validations[priority=23]
          - errors[ERR_COMPONENT_QUARANTINED]
          - errors[ERR_INTERCHANGE_INCOMPATIBLE]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (a different
          pair than the sibling instance): the component is BOTH quarantined
          (safety, priority 11) AND interchange-incompatible (referential,
          priority 23); ERR_COMPONENT_QUARANTINED must win.
        test_recipe:
          setup:
            - "Work order W (spec allows interchange group CRANK-SBC-3.48 only) reached ASSEMBLY"
            - "Component CMP salvaged from W with interchange_group GRP-UNKNOWN, inspected REUSE_OK and quarantined"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
