            - "Immediate follow-up GET /coop/sitting-assignments/${asg_id} returns identical values (no drift between write-response and read)"

      - name: accept_effects_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept]"]
        distinguishing_aspect: "Immediate consistency of the accept cascade: the accept response shows the claim ACCEPTED, and the very next GETs show the request ASSIGNED at version 2 and the assignment row present — all cascade writes are visible with no lag."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical request OPEN; F2 claim PENDING"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
