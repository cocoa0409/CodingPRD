            - { call: "POST /v1/orders/${o9}/lines", payload: { product_id: "${p_oats}", container_id: "${c9}", estimated_gross_g: 500 }, as: StoreClerk, captures: { l9: "$.data.id" } }
          trigger:
            - { call: "POST /v1/refill-lines/${l9}/fill", payload: { gross_weight_g: 500, measured_tare_g: 200 }, as: StoreClerk, captures: { err: "$.data.error_id" } }
