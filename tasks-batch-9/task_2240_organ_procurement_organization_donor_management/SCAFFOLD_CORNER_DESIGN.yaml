              payload: { expected_organ_version: "${organ_v}", primary_offer_slots: 1, candidates: [ { sequence_position: 1, center_code: "CTR-A", candidate_code: "CAND-A", acceptance_clock_minutes: 240 } ] }
              as: AllocationSpecialist
              captures: { run_id: $.data.id }
            - call: "GET /opo/match-runs/${run_id}/offers"
              payload: {}
              as: AllocationSpecialist
              captures: { offer_id: "$.data[0].id" }
          trigger:
            - call: "POST /opo/match-runs/${run_id}/offers/${offer_id}/respond"
              payload: { decision: "ACCEPT" }
              as: AllocationSpecialist
              as_user_id: "alloc-1"
              captures: { offer_status: $.data.status, ack: $.data.increased_risk_ack }
            - call: "GET /opo/organs/${organ_id}"
              payload: {}
              as: AllocationSpecialist
              captures: { organ_status: $.data.status, accepted_offer: $.data.accepted_offer_id }
            - call: "GET /opo/donor-cases/${case_id}"
              payload: {}
              as: DonorCoordinator
              captures: { alloc_status: $.data.allocation_status, accepted_count: $.data.organs_accepted_count }
          assert:
            - "${score} == 6.50 with ${tier} == STANDARD and ${snapshot} == STANDARD"
            - "the ACCEPT returns HTTP 200 with ${offer_status} == ACCEPTED and ${ack} == false (declared default, not required here)"
            - "${organ_status} == ACCEPTED with ${accepted_offer} == ${offer_id}"
            - "${alloc_status} == ALLOCATED with ${accepted_count} == 1"

      - name: contraindication_gate_versus_case_state_gate_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority 46]
          - validations[priority 60]
          - errors.ERR_SCREENING_NOT_CLEARED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_creation_state_gate_precedes_contraindication_safety_gate
          rationale: |
            The §1.8 instance already violates the state gate at priority 46 and the serology safety
            gate at 60 with a single donor-case creation and pins ERR_SCREENING_NOT_CLEARED as the
            returned code, which is exactly the priority_ordering claim for this pair; re-testing it
            here would duplicate the same call sequence.

      - name: acceptance_requires_the_donor_risk_tier_context
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 64]
          - entities.DonorCase.fields.risk_tier_snapshot
          - errors.ERR_INCREASED_RISK_ACK_REQUIRED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_acceptance_gated_by_screening_risk_tier
          rationale: |
            The violation limb of priority 64 depends on a field owned by a different entity three hops
            away (EligibilityScreening.risk_tier pinned onto DonorCase.risk_tier_snapshot), and the
            §1.8 instance already walks the INCREASED_RISK path with and without the acknowledgement;
            the satisfaction limb is covered above by
            standard_risk_acceptance_needs_no_increased_risk_acknowledgement.

      - name: transport_capacity_counts_the_collective_leg_set
        claim_type: aggregate_validation
        grounds:
          - validations[priority 80]
          - entities.TransportAsset.fields.concurrent_leg_capacity
          - errors.ERR_ASSET_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / transport_asset_closed_interval_legs_touch_at_endpoint
          rationale: |
            Each individual leg is admissible on its own; only the collective overlap count against
            concurrent_leg_capacity rejects the second one, and the §1.8 boundary instance already
            books two legs that touch at a single endpoint on a capacity-1 asset.

      - name: cold_ischemic_check_runs_after_the_window_check
        claim_type: cascading_validation
        grounds:
          - validations[priority 69]
          - validations[priority 70]
          - calculations.cold_ischemic_projection
          - errors.ERR_COLD_ISCHEMIC_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / transport_cold_ischemic_temporal_gate_precedes_asset_capacity_constraint
          rationale: |
            The projection at priority 70 can only be computed once the window rule at 69 has accepted
            the depart/arrive pair, and the §1.8 instance already orders 69, 70 and 80 on the same
            transport call, asserting which one wins when several are violable.

  - section: errors
    instances:
      - name: error_envelope_shape_and_http_status_are_pinned_per_code
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_TEAM_NOT_FOUND
          - errors.ERR_DUPLICATE_KEY
        distinguishing_aspect: |
          Three different error families raised on the same entity return the same envelope shape
          (response_type "error", data.error_id, data.message) with three different declared statuses -
          400 for the malformed body, 404 for the unknown path id, 409 for the duplicate code - so the
          status is never a blanket 400 and never carried inside data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-08T08:00:00Z."
            - "One ABDOMINAL recovery team registered with team_code ABD-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "ABD-1", specialty: "ABDOMINAL" }
              as: OpoAdmin
              captures: { team_id: $.data.id, buffer: $.data.turnaround_buffer_minutes }
          trigger:
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "THX-1" }
              as: OpoAdmin
              captures: { error_invalid: $.data.error_id, message_invalid: $.data.message }
            - call: "GET /opo/recovery-teams/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpoAdmin
              captures: { error_missing: $.data.error_id }
            - call: "POST /opo/recovery-teams"
              payload: { team_code: "ABD-1", specialty: "MULTIORGAN" }
              as: OpoAdmin
              captures: { error_dup: $.data.error_id }
          assert:
            - "${error_invalid} == ERR_INVALID_REQUEST with HTTP 400 and ${message_invalid} is a non-empty string"
            - "${error_missing} == ERR_TEAM_NOT_FOUND with HTTP 404"
            - "${error_dup} == ERR_DUPLICATE_KEY with HTTP 409: uniqueness is on team_code alone, regardless of specialty"
            - "every error response carries response_type == \"error\" with meta.api_request_id and meta.api_request_timestamp present, and data holds exactly error_id and message"
            - "${buffer} == 90 and only one RecoveryTeam exists: GET /opo/recovery-teams/${team_id} still reports specialty ABDOMINAL"

