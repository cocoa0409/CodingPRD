scenario: |
  Patient Service Center Appointment Flow & Draw Station Capacity (Quest Diagnostics): appointment scheduling with walk-in blending and estimated wait publication, test order intake from provider systems with insurance and medical necessity checks before the draw, phlebotomist staffing to forecast volumes with fasting-hour morning peaks, specimen collection requirements by test including tube type, volume, order of draw and special handling, pediatric and difficult-draw escalation with attempt limits and reschedule policy, courier pickup schedules tied to stability windows for each specimen type, patient responsibility estimation and prepayment collection at the center, recollection workflow when a specimen is compromised in transit
domain_name: patient-service-center-draw-station
api_prefix: /psc

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Center display name"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code used for lab-state compliance checks"
      - name: timezone_offset_minutes
        type: integer
        source: input
        description: "UTC offset of local time; local = UTC + offset"
      - name: station_count
        type: integer
        source: input
        description: "Number of physical draw stations at this center"
      - name: slot_minutes
        type: integer
        source: input
        default: 15
        description: "Scheduling grid granularity in minutes"
      - name: open_local_minutes
        type: integer
        source: input
        description: "Local minutes-from-midnight of daily opening"
      - name: close_local_minutes
        type: integer
        source: input
        description: "Local minutes-from-midnight of daily closing"
      - name: pediatric_capable
        type: boolean
        source: input
        default: false
        description: "Whether the center may draw patients under PEDIATRIC_AGE_MAX"
      - name: draw_hold_minutes
        type: integer
        source: input
        default: 30
        description: "Minutes a NURSE_PENDING escalation blocks the reserved station (STAFF.difficult_draw_hold_minutes)"
      - name: ops_run_index
        type: integer
        source: system
        default: 0
        description: "Monotone counter incremented by run_ops"
      - name: staffed_minutes_available
        type: integer
        source: computed
        description: "Coverage minutes still sellable today; set by run_ops to 15 x (number of ON_DUTY phlebotomists), so the b term of expected_wait_minutes equals that roster count"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name"
      - name: birth_date
        type: datetime
        source: input
        description: "ISO date of birth; TestOrder.patient_is_pediatric derives from this via a bare 18-year UTC offset"
      - name: mrn
        type: string
        source: input
        description: "Medical record number; unique across patients"

  - name: Phlebotomist
    parent: ServiceCenter
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: system
        description: "FK -> ServiceCenter.id; owning center (derived from the creating path)"
      - name: full_name
        type: string
        source: input
        description: "Staff member name"
      - name: credential
        type: enum
        source: input
        description: "PBT | PBT_PEDIATRIC | RN"
        constraints: "enum members exactly {PBT, PBT_PEDIATRIC, RN}"
      - name: shift_start_local_minutes
        type: integer
        source: input
        description: "Local minutes-from-midnight the shift starts"
      - name: shift_end_local_minutes
        type: integer
        source: input
        description: "Local minutes-from-midnight the shift ends; must be > shift_start_local_minutes"
      - name: max_concurrent_attempts_referral
        type: integer
        source: computed
        description: "STAFF.max_attempts_per_phlebotomist — equal to ATTEMPTS.max_total"
      - name: status
        type: enum
        source: system
        description: "ON_DUTY → OFF_DUTY"
        constraints: "enum members exactly {ON_DUTY, OFF_DUTY}"

  - name: TestOrder
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        description: "FK -> ServiceCenter.id; center the order is routed to"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; patient this order belongs to"
      - name: ordering_provider_npi
        type: string
        source: input
        description: "Ordering provider NPI"
      - name: test_panel
        type: enum
        source: input
        description: "Panel being ordered; drives tube/special-handling requirement resolution"
        constraints: "enum members exactly {CMP, CBC, LIPID, A1C, TSH, PT_INR, FERRITIN, HCG_QUAL, LACTATE, GTT}"
      - name: collection_mode
        type: enum
        source: input
        description: "SELF_SERVICE | STANDARD | PEDIATRIC | DIFFICULT_DRAW"
        constraints: "enum members exactly {SELF_SERVICE, STANDARD, PEDIATRIC, DIFFICULT_DRAW}"
      - name: is_fasting_required
        type: boolean
        source: input
        default: false
        description: "Whether the panel requires a fasting collection"
      - name: fasting_hours_required
        type: integer
        source: input
        default: 0
        description: "Hours of fasting required when is_fasting_required is true"
      - name: fasting_deadline_utc
        type: datetime
        source: computed
        description: "patient_last_food_utc + fasting_hours_required hours; null when is_fasting_required is false — the only deadline the fasting gate reads"
      - name: fasting_overdue
        type: boolean
        source: computed
        description: "True exactly when served_at_utc > fasting_deadline_utc (strict; equality is still compliant)"
      - name: patient_last_food_utc
        type: datetime
        source: input
        description: "When the patient last ate, in UTC; null when unknown"
      - name: list_price_cents
        type: integer
        source: input
        default: 5000
        description: "Panel list price in cents captured at intake; the BASE_RATE term of patient_service_estimate"
      - name: icd10_codes
        type: array
        source: input
        description: "Ordering diagnosis codes used by the medical-necessity screen"
      - name: insurance_plan_id
        type: string
        source: input
        description: "FK -> InsurancePlan.id; payer plan the order is billed against"
      - name: patient_is_pediatric
        type: boolean
        source: computed
        description: "True when logical_clock_utc - Patient.birth_date < PEDIATRIC_AGE_MAX_YEARS via bare 18-year UTC offset arithmetic (a 2008-09-01 birth is PEDIATRIC on 2026-09-01 and non-pediatric on 2026-09-02)"
      - name: necessity_status
        type: enum
        source: computed
        description: "Resolved medical-necessity outcome: PASS | FAIL | PENDING, recomputed from icd10_codes against MedicalNecessityRule rows"
        constraints: "enum members exactly {PASS, FAIL, PENDING}"
      - name: insurance_status
        type: enum
        source: computed
        description: "Eligibility state: UNVERIFIED, ELIGIBLE, INELIGIBLE, EXPIRED, NOT_COVERED; server force-resolves UNVERIFIED to INELIGIBLE at draw time"
        constraints: "enum members exactly {UNVERIFIED, ELIGIBLE, INELIGIBLE, EXPIRED, NOT_COVERED}"
      - name: est_copay_cents
        type: integer
        source: computed
        default: 0
        description: "Preliminary copay share in cents, computed when insurance_status becomes ELIGIBLE"
      - name: est_coinsurance_cents
        type: integer
        source: computed
        default: 0
        description: "Preliminary coinsurance share in cents, computed when insurance_status becomes ELIGIBLE"
      - name: self_pay_rate_cents
        type: integer
        source: computed
        default: 0
        description: "Provisional self-pay total in cents at panel list price (dual-variant; recalculated at the SCOPE_FIRM discount on draw)"
      - name: patient_responsibility_cents
        type: integer
        source: computed
        default: 0
        description: "Deliverable amount due from the patient under the pinned variant order"
      - name: self_pay_discount_cents
        type: integer
        source: computed
        default: 0
        description: "The discount applied to self_pay_rate_cents under the ATTENDED_COLLECTED variant"
      - name: prepay_required_cents
        type: integer
        source: computed
        default: 0
        description: "Amount that must be collected before the draw may start"
      - name: prepay_collected_cents
        type: integer
        source: computed
        default: 0
        description: "Amount actually collected at the center"
      - name: balance_remaining_cents
        type: integer
        source: computed
        default: 0
        description: "= patient_responsibility_cents - prepay_collected_cents, floored at 0"
      - name: status
        type: enum
        source: system
        description: "CLOSED-DIMENSION lifecycle status (with Specimen.state): RECEIVED → SCHEDULED → IN_PROGRESS → COLLECTED → CANCELLED"
        constraints: "enum members exactly {RECEIVED, SCHEDULED, IN_PROGRESS, COLLECTED, CANCELLED}"
      - name: resolved_tubes
        type: array
        source: computed
        description: "TubeRequirement codes resolved through the test panel's parent chain (CMP inherits from BMP), deduplicated; identical for every order on the same panel"
      - name: draw_order_spec
        type: array
        source: computed
        description: "resolved_tubes re-sorted by order_of_draw ascending, ties broken by created_at ASC"
      - name: concurrence_hash
        type: string
        source: computed
        description: "Stable hash over test_panel, sorted tube_requirement codes, and sorted special-handling codes; recollections prove concordance by reproducing it"

  - name: MedicalNecessityRule
    parent: null
    common_fields: true
    fields:
      - name: test_panel
        type: enum
        source: input
        description: "Panel this rule governs"
        constraints: "enum members exactly {CMP, CBC, LIPID, A1C, TSH, PT_INR, FERRITIN, HCG_QUAL, LACTATE, GTT}"
      - name: icd10_code
        type: string
        source: input
        description: "Diagnosis code that satisfies necessity when paired with test_panel"
      - name: is_covered
        type: boolean
        source: input
        default: true
        description: "Whether this (panel, icd10) pair is a covered indication"

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: "Payer display name"
      - name: plan_type
        type: enum
        source: input
        description: "PLAN_TYPE"
        constraints: "enum members exactly {HMO}"
      - name: copay_cents
        type: integer
        source: input
        description: "Fixed copay share in cents (BLEND.copay weight)"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Patient coinsurance fraction (BLEND.coinsurance weight)"
      - name: deductible_remaining_cents
        type: integer
        source: input
        description: "Remaining deductible in cents (BLEND.deductible weight)"
      - name: prior_paid_pct
        type: number
        source: input
        default: 0.0
        description: "Fraction of the allowed amount the patient has already met this plan year; multiplies BOTH the coinsurance and deductible terms. 0.0 collapses those terms to their nominal form"
      - name: allowed_amount_cents
        type: integer
        source: input
        description: "Negotiated allowed amount in cents for the ordered panel (BLEND.allowed amount)"
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "ACTIVE | TERMINATED"
        constraints: "enum members exactly {ACTIVE, TERMINATED}"

  - name: Appointment
    parent: ServiceCenter
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: system
        description: "FK -> ServiceCenter.id; owning center (derived from the creating path)"
      - name: test_order_id
        type: string
        source: input
        description: "FK -> TestOrder.id; order this visit exists to fulfill"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Appointment start in UTC; local time = UTC + service_center.timezone_offset_minutes"
      - name: slot_span
        type: integer
        source: input
        description: "Number of contiguous slot_minutes grid cells the visit holds; center capacity only, never scientific draw time"
      - name: source
        type: enum
        source: system
        description: "BOOKED | WALK_IN"
        constraints: "enum members exactly {BOOKED, WALK_IN}"
      - name: queue_state
        type: enum
        source: system
        description: "FIRST parallel dimension: NONE → WAITING → CALLED → AT_STATION → COMPLETED / ABANDONED"
        constraints: "enum members exactly {NONE, WAITING, CALLED, AT_STATION, COMPLETED, ABANDONED}"
      - name: checkin_utc
        type: datetime
        source: system
        description: "When the patient checked in; null until WAITING"
      - name: fasting_deadline_utc
        type: computed
        description: "patient_last_food_utc + fasting_hours_required hours; null when is_fasting_required is false — this is the only deadline the fasting gate reads"
      - name: fasting_overdue
        type: boolean
        source: computed
        description: "True exactly when logical_clock_utc > fasting_deadline_utc (strict; equality is still compliant)"
      - name: station_index
        type: integer
        source: system
        description: "Reserved station number in 0..station_count-1; sentinel -1 when STAFF_PENDING"
      - name: phlebotomist_id
        type: string
        source: system
        description: "FK -> Phlebotomist.id; phlebotomist reserved for the visit; null while STAFF_PENDING"
      - name: complexity_score
        type: integer
        source: computed
        description: "Ranking score for the CALLED queue AND the position_weight input of expected_wait_minutes; base 10 for SELF_SERVICE/STANDARD, 15 for PEDIATRIC/DIFFICULT_DRAW, plus 5 when created_at falls in the local 07:30-07:59 fasting-hour heap window. Tie-broken by created_at ASC; id is never consulted"
      - name: resolved_tubes
        type: array
        source: computed
        description: "TubeRequirement codes resolved through the test panel's parent chain (CMP inherits from BMP), deduplicated"
      - name: draw_order_spec
        type: array
        source: computed
        description: "Resolved tubes re-sorted by order_of_draw ascending, tie-broken by created_at ASC"
      - name: draw_state
        type: enum
        source: system
        description: "SECOND parallel dimension (independent of the TestOrder.status lifecycle): SCHEDULED → CHECKED_IN → STAFF_PENDING → IN_DRAW → ATTEMPT_LIMIT_REACHED → DRAWN / RESCHEDULED / NO_SHOW"
        constraints: "enum members exactly {SCHEDULED, CHECKED_IN, STAFF_PENDING, IN_DRAW, ATTEMPT_LIMIT_REACHED, DRAWN, RESCHEDULED, NO_SHOW}"
      - name: attempt_count
        type: integer
        source: system
        default: 0
        description: "Draw attempts consumed; APPEND-ONLY (never decremented by corrections), capped at ATTEMPTS.max_total"
      - name: draw_hold_expires_utc
        type: datetime
        source: computed
        description: "staff_pending_at_utc + service_center.draw_hold_minutes"
      - name: draw_hold_expired
        type: boolean
        source: computed
        description: "True exactly when draw_state == STAFF_PENDING and logical_clock_utc > draw_hold_expires_utc; a derived read that never auto-transitions the row"

  - name: TubeRequirement
    parent: null
    common_fields: true
    fields:
      - name: test_panel
        type: enum
        source: input
        description: "Panel this tube requirement belongs to; acts as a self-referential parent key"
        constraints: "enum members exactly {CMP, BMP, CBC, LIPID, A1C, TSH, PT_INR, FERRITIN, HCG_QUAL, LACTATE, GTT}"
      - name: tube_code
        type: enum
        source: input
        description: "Collection container"
        constraints: "enum members exactly {EDTA_LAVENDER, SST_GOLD, SODIUM_CITRATE_BLUE, SODIUM_FLUORIDE_GRAY, SODIUM_HEPARIN_GREEN}"
      - name: required_volume_ml
        type: number
        source: input
        description: "Nominal fill volume in millilitres"
      - name: min_volume_ml
        type: number
        source: input
        description: "Pediatric minimum fill volume in millilitres; must satisfy 0 < min_volume_ml <= required_volume_ml"
      - name: order_of_draw
        type: integer
        source: input
        description: "CLSI order-of-draw rank, ascending; clinical-safety safety floor read by the draw gate"
      - name: max_urgency_hours
        type: integer
        source: input
        description: "Maximum acceptable result turnaround in hours; the selector's urgency ASC ranking key per (test_panel, tube_code)"
      - name: stability_minutes
        type: integer
        source: input
        description: "Specimen stability window in minutes; drives courier deadline and the compromisable_courier_run_id derivation, and the (test_panel, tube_code) stability replica used as the aggregation tie-break"
      - name: special_handling_codes
        type: array
        source: input
        default: []
        description: "Handling codes, e.g. ICE_SLURRY, PROTECT_FROM_LIGHT, WARM, CHILLED; contributes to concurrence_hash"
      - name: is_recollection_eligible
        type: boolean
        source: input
        default: true
        description: "Whether a compromised specimen for this tube may be recollected instead of referred"

  - name: CourierRun
    parent: ServiceCenter
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: system
        description: "FK -> ServiceCenter.id; owning center (derived from the creating path)"
      - name: direction
        type: enum
        source: input
        description: "OUTBOUND (to lab) | INBOUND (from lab)"
        constraints: "enum members exactly {OUTBOUND, INBOUND}"
      - name: dispatch_utc
        type: datetime
        source: input
        description: "Planned departure from the center in UTC"
      - name: cutoff_utc
        type: datetime
        source: system
        description: "Server-computed dispatch_utc - COURIER.cutoff_before_dispatch_minutes; the instant the run stops accepting specimens"
      - name: committed_specimen_count
        type: integer
        source: computed
        default: 0
        description: "Specimens committed to this run; put-back decrements it, giving the count conservation invariant"
      - name: status
        type: enum
        source: system
        description: "PLANNED → DISPATCHED → IN_TRANSIT → DELIVERED / CANCELLED"
        constraints: "enum members exactly {PLANNED, DISPATCHED, IN_TRANSIT, DELIVERED, CANCELLED}"

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - name: service_center_id
        type: string
        source: input
        description: "FK -> ServiceCenter.id; center that produced the specimen"
      - name: test_order_id
        type: string
        source: input
        description: "FK -> TestOrder.id; order this specimen belongs to"
      - name: tube_code
        type: enum
        source: input
        description: "Collector-declared tube"
        constraints: "enum members exactly {EDTA_LAVENDER, SST_GOLD, SODIUM_CITRATE_BLUE, SODIUM_FLUORIDE_GRAY, SODIUM_HEPARIN_GREEN}"
      - name: volume_ml
        type: number
        source: input
        description: "Collected volume in millilitres"
      - name: order_of_draw
        type: integer
        source: input
        description: "Order-of-draw rank the collector used"
      - name: special_handling_codes
        type: array
        source: input
        default: []
        description: "Handling codes carried from the TubeRequirement"
      - name: collected_utc
        type: datetime
        source: system
        description: "Collection instant in UTC; stability deadline = collected_utc + STABILITY.stability_factor * stability_minutes"
      - name: courier_run_id
        type: string
        source: input
        description: "FK -> CourierRun.id; nullable — null while the specimen is UNASSIGNED"
      - name: status
        type: enum
        source: system
        description: "UNASSIGNED → ASSIGNED → IN_TRANSIT → RECEIVED → COMPROMISED → REJECTED → RECOLLECTED"
        constraints: "enum members exactly {UNASSIGNED, ASSIGNED, IN_TRANSIT, RECEIVED, COMPROMISED, REJECTED, RECOLLECTED}"
      - name: compromise_reason
        type: string
        source: input
        description: "Set only with the COMPROMISED transition"
      - name: recollection_approved_at_utc
        type: datetime
        source: system
        description: "Instant the lab approved a recollection; null otherwise"
      - name: day_rejection_index
        type: integer
        source: system
        default: 0
        description: "Monotone per (test_order_id, collection local day) rejection count — never decremented by a recollect, so the third rejection is rejected"
      - name: rejection_waived
        type: boolean
        source: computed
        default: false
        description: "True only when day_rejection_index >= REJECTION.day_cap; computed on read, never client-supplied"
      - name: tests_covered
        type: array
        source: computed
        description: "TestPanel codes whose urgency_max_hours is satisfiable by this specimen's tube/stability — the selector's eligibility input"

  - name: ResponsibilityEstimate
    parent: TestOrder
    common_fields: true
    fields:
      - name: test_order_id
        type: string
        source: system
        description: "FK -> TestOrder.id; owning order (derived from the creating path)"
      - name: variant
        type: enum
        source: input
        description: "PROVISIONAL_ELIGIBLE | SELF_PAY_LIST | ATTENDED_COLLECTED"
        constraints: "enum members exactly {PROVISIONAL_ELIGIBLE, SELF_PAY_LIST, ATTENDED_COLLECTED}"
      - name: supersedes_estimate_id
        type: string
        source: input
        description: "FK -> ResponsibilityEstimate.id; self-referential predecessor for the estimate-revision chain; null on the first estimate"
      - name: copay_component_cents
        type: computed
        default: 0
        description: "BLEND.copay term"
      - name: coinsurance_component_cents
        type: computed
        default: 0
        description: "BLEND.coinsurance term"
      - name: deductible_component_cents
        type: computed
        default: 0
        description: "BLEND.deductible term"
      - name: gross_cents
        type: computed
        default: 0
        description: "Sum of the three components BEFORE the ATTENDED_COLLECTED discount"
      - name: discount_cents
        type: computed
        default: 0
        description: "Discount applied AFTER gross; non-zero only for ATTENDED_COLLECTED"
      - name: net_patient_cents
        type: computed
        default: 0
        description: "gross_cents - discount_cents; the variant's deliverable"
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TestOrder
    initial_state: RECEIVED
    terminal_states: [COLLECTED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: SCHEDULED
        trigger: "POST /psc/test-orders/{testOrderId}/schedule"
        actor: IntakeCoordinator
        preconditions:
          - "insurance_status IN {ELIGIBLE} (priority 5e fiscal check, BEFORE necessity at 5f)"
          - "insurance_status is never UNVERIFIED at this point: schedule force-resolves UNVERIFIED to INELIGIBLE first, so the fiscal check always has a decided value"
          - "necessity_status == PASS (priority 5f, AFTER the fiscal check)"
          - "an OPEN Appointment with draw_state == SCHEDULED exists for this order"
        side_effects:
          - "TestOrder.status → SCHEDULED"
          - "recompute patient_fasting_gate inputs: fasting_deadline_utc = patient_last_food_utc + fasting_hours_required hours"
        note: "Safety (order-of-draw) sits at priority 6 on the draw gate, AFTER the fiscal 5e and necessity 5f checks — this inverted ordering is deliberate."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /psc/appointments/{appointmentId}/start-draw"
        actor: Phlebotomist
        preconditions:
          - "Appointment.queue_state == AT_STATION"
          - "Appointment.draw_state == IN_DRAW"
          - "prepay_collected_cents >= prepay_required_cents"
          - "fasting_compliant (fasting_deadline_utc is null OR logical_clock_utc <= fasting_deadline_utc)"
          - "collected tubes match resolved_tubes exactly"
          - "Specimen.order_of_draw non-decreasing in created_at ASC order (priority 6 safety floor)"
        side_effects:
          - "TestOrder.status → IN_PROGRESS"
          - "self_pay_rate_cents recalculated at the SCOPE_FIRM discount, then self_pay_discount_cents and patient_responsibility_cents recomputed for the ATTENDED_COLLECTED variant"
          - "balance_remaining_cents = max(0, patient_responsibility_cents - prepay_collected_cents)"

      - from: IN_PROGRESS
        to: COLLECTED
        trigger: "POST /psc/appointments/{appointmentId}/finish-draw"
        actor: Phlebotomist
        preconditions:
          - "at least one Specimen row exists for this order"
          - "each drawn tube's volume_ml >= the pediatric (min_volume_ml) floor for pediatric patients, else the nominal required_volume_ml for adults"
        side_effects:
          - "TestOrder.status → COLLECTED"
          - "Appointment.draw_state → DRAWN, Appointment.queue_state → COMPLETED"
          - "each Specimen.status → UNASSIGNED"
          - "patient_fasting_conserved recomputed (nothing but the logical clock may advance it)"

      - from: COLLECTED
        to: SCHEDULED
        trigger: "system (automatic when a Specimen of this order reaches REJECTED)"
        actor: system
        preconditions:
          - "at least one Specimen of this order has status REJECTED"
        side_effects:
          - "TestOrder.status → SCHEDULED (the order returns to the worklist)"
          - "rejection_reason carried from the rejected Specimen"
          - "TestOrder.fasting_deadline_utc → null whenever the rejection also cleared is_fasting_required"
        note: "The rejection reverting COLLECTED → SCHEDULED is what makes TestOrder cyclic rather than a linear A→B→C→D pipeline."

      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /psc/test-orders/{testOrderId}/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "no Specimen row for this order is in status ASSIGNED, IN_TRANSIT or RECEIVED (priority 6, checked BEFORE the priority 7 courier_count check)"
        side_effects:
          - "TestOrder.status → CANCELLED"
          - "any non-terminal Appointment for this order → draw_state NO_SHOW"
          - "any non-terminal Specimen for this order → status REJECTED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /psc/test-orders/{testOrderId}/cancel"
        actor: IntakeCoordinator
        preconditions:
          - "no Specimen row for this order is in status ASSIGNED, IN_TRANSIT or RECEIVED (priority 6, checked BEFORE the priority 7 courier_count check)"
        side_effects:
          - "TestOrder.status → CANCELLED"
          - "Appointment.draw_state → NO_SHOW"
          - "Specimen.status → REJECTED"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [DRAWN, RESCHEDULED, NO_SHOW]
    parallel_dimensions:
      - dimension: draw_state
        states: [SCHEDULED, CHECKED_IN, STAFF_PENDING, IN_DRAW, ATTEMPT_LIMIT_REACHED, DRAWN, RESCHEDULED, NO_SHOW]
      - dimension: queue_state
        states: [NONE, WAITING, CALLED, AT_STATION, COMPLETED, ABANDONED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /psc/appointments/{appointmentId}/check-in"
        actor: Patient | IntakeCoordinator
        preconditions:
          - "medical_necessity_status == PASS for the linked TestOrder"
          - "logical_clock_utc is within [scheduled_start_utc - 30 minutes, scheduled_start_utc + 15 minutes] (EARLY_CHECKIN_MINUTES = 30, GRACE_MINUTES = 15)"
        side_effects:
          - "Appointment.draw_state → CHECKED_IN, queue_state → WAITING, checkin_utc = logical_clock_utc"
          - "TestOrder.status → SCHEDULED (unchanged)"
          - "fasting_deadline_utc stays pinned from check-in onward"

      - from: CHECKED_IN
        to: STAFF_PENDING
        trigger: "system (automatic when the resolving phlebotomist's credential is insufficient)"
        actor: system
        preconditions:
          - "the center's staffable phlebotomists do not include one whose credential ∈ {PBT_PEDIATRIC, RN} (PEDIATRIC mode) or credential == RN (DIFFICULT_DRAW mode)"
        side_effects:
          - "Appointment.draw_state → STAFF_PENDING"
          - "staff_pending_at_utc = logical_clock_utc"
          - "draw_hold_expires_utc = staff_pending_at_utc + service_center.draw_hold_minutes"
          - "station_index = -1, phlebotomist_id = null"
          - "no Phlebotomist.status change, no station reservation — nothing to compensate later"

      - from: STAFF_PENDING
        to: IN_DRAW
        trigger: "system (automatic once a phlebotomist with sufficient credential becomes ON_DUTY and within shift)"
        actor: system
        preconditions:
          - "a Phlebotomist of this center has credential ∈ {PBT_PEDIATRIC, RN} for PEDIATRIC mode or credential == RN for DIFFICULT_DRAW mode, status == ON_DUTY, and shift covers the station window"
        side_effects:
          - "Appointment.draw_state → IN_DRAW, queue_state → AT_STATION"
          - "phlebotomist_id and station_index assigned"

      - from: CHECKED_IN
        to: IN_DRAW
        trigger: "POST /psc/appointments/{appointmentId}/call"
        actor: IntakeCoordinator
        preconditions:
          - "Appointment.queue_state == WAITING"
          - "an ON_DUTY phlebotomist of the center whose credential covers the order's collection_mode"
        side_effects:
          - "Appointment.queue_state → CALLED"
          - "complexity_score recomputed; the CALLED queue sorts by complexity_score DESC, tie-broken by created_at ASC (id never consulted)"

      - from: CHECKED_IN
        to: RESCHEDULED
        trigger: "POST /psc/appointments/{appointmentId}/reschedule"
        actor: IntakeCoordinator
        preconditions:
          - "attempt_count >= 2 (ATTEMPTS.max_total = 2, reached AT_LIMIT state)"
          - "strictly more than 60 minutes (ATTEMPTS.same_day_minutes_since_first = 60) have elapsed since the first attempt — the ORANGE rule at exactly 60 min 0 sec must NOT trigger"
          - "the order is not PEDIATRIC and not DIFFICULT_DRAW mode"
        side_effects:
          - "Appointment.draw_state → RESCHEDULED (attempt_count NOT reset — append-only)"
          - "TestOrder.status → SCHEDULED with a fresh Appointment (draw_state SCHEDULED)"

      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "system (automatic during run_ops when queue_state == WAITING and the wait exceeded WAIT.max_call_wait_minutes)"
        actor: system
        preconditions:
          - "logical_clock_utc - checkin_utc >= 30 minutes (WAIT.max_call_wait_minutes = 30)"
          - "while queue_state == WAITING, complexity_score is not recomputed — at exactly 30 minutes expected_wait_band still reports WITHIN_WINDOW, the staleness defect"
        side_effects:
          - "Appointment.draw_state → NO_SHOW, queue_state → ABANDONED"
          - "no Specimen mutation — no specimen was ever registered while WAITING"

      - from: CHECKED_IN
        to: ATTEMPT_LIMIT_REACHED
        trigger: "system (automatic when attempt_count reaches ATTEMPTS.max_total)"
        actor: system
        preconditions:
          - "attempt_count >= 2 (ATTEMPTS.max_total = 2)"
        side_effects:
          - "Appointment.draw_state → ATTEMPT_LIMIT_REACHED"
          - "TestOrder.status stays SCHEDULED (the order is not removed from the worklist)"
          - "no automatic reschedule — INTK1 must POST reschedule explicitly"

  - entity: Specimen
    initial_state: UNASSIGNED
    terminal_states: [RECEIVED, RECOLLECTED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /psc/specimens/{specimenId}/assign-courier"
        actor: LabLiaison
        preconditions:
          - "CourierRun.direction == OUTBOUND and CourierRun.status == PLANNED"
          - "checkin window D1: scheduled_start_utc - 30 minutes <= logical_clock_utc <= scheduled_start_utc (COURIER.checkin_lead_minutes = 30, COURIER.checkin_grace_minutes = 0)"
          - "logical_clock_utc + 15 minutes <= CourierRun.dispatch_utc (COURIER.cutoff_before_dispatch_minutes = 15)"
          - "logical_clock_utc + 1.0 * TubeRequirement.stability_minutes <= CourierRun.dispatch_utc (STABILITY.stability_factor = 1.0; strict)"
        side_effects:
          - "Specimen.status → ASSIGNED, courier_run_id set"
          - "CourierRun.committed_specimen_count += 1"
          - "the specimen no longer appears in the unassigned SPECIMENS list"

      - from: ASSIGNED
        to: IN_TRANSIT
        trigger: "POST /psc/courier-runs/{courierRunId}/dispatch"
        actor: LabLiaison
        preconditions:
          - "logical_clock_utc == CourierRun.dispatch_utc"
          - "CourierRun.committed_specimen_count > 0"
        side_effects:
          - "CourierRun.status → DISPATCHED"
          - "all ASSIGNED specimens on this run → IN_TRANSIT"

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /psc/courier-runs/{courierRunId}/deliver"
        actor: LabLiaison
        side_effects:
          - "CourierRun.status → DELIVERED"
          - "all IN_TRANSIT specimens on this run → RECEIVED"

      - from: ASSIGNED
        to: COMPROMISED
        trigger: "POST /psc/specimens/{specimenId}/compromise"
        actor: LabLiaison
        preconditions:
          - "CourierRun.cutoff_utc < logical_clock_utc < CourierRun.dispatch_utc (strictly inside the cutoff-to-dispatch window)"
        side_effects:
          - "Specimen.status → COMPROMISED, compromise_reason recorded"
          - "CourierRun.committed_specimen_count -= 1"
          - "courier_run_selector recomputed over the changed eligibility inputs"

      - from: INTERVAL_ELIGIBLE
        to: OUT_OF_WINDOW
        trigger: "system (automatic when the logical clock advances past the run's commit interval)"
        actor: system
        preconditions:
          - "logical_clock_utc > CourierRun.dispatch_utc"
        side_effects:
          - "eligible_courier_run_id from a prior read may become stale — the stale-carrier defect, observable by re-reading the courier-run selector without any Specimen mutation"

      - from: COMPROMISED
        to: REJECTED
        trigger: "POST /psc/specimens/{specimenId}/reject"
        actor: LabLiaison
        preconditions:
          - "a TubeRequirement row exists whose (test_panel, tube_code) matches the specimen's tube; otherwise ERR_TUBE_REQUIREMENT_MISSING"
          - "the RESOLVED TubeRequirement.stability_minutes matches the (test_panel, tube_code) stability replica the aggregation used as its tie-break"
          - "Specimen.rejection_waived == false (day_rejection_index < REJECTION.day_cap)"
        side_effects:
          - "Specimen.status → REJECTED"
          - "Specimen.day_rejection_index += 1"
          - "TestOrder.status → SCHEDULED"
          - "TestOrder.is_fasting_required → false and fasting_hours_required → 0"
          - "TestOrder.patient_last_food_utc → null"
          - "TestOrder.fasting_deadline_utc → null"

      - from: COMPROMISED
        to: RECOLLECTED
        trigger: "POST /psc/specimens/{specimenId}/recollect"
        actor: LabLiaison
        preconditions:
          - "patient_service_estimate for this order reports variant ATTENDED_COLLECTED with discount_rate 0.20"
          - "patient_recollect_count == 0 — the visit's FIRST recollection only"
          - "a TubeRequirement row matches (test_panel, tube_code) and is_recollection_eligible == true"
          - "the recollection-scheduling courier run is OUTBOUND, status PLANNED, and inside the same 30-minute lead and 15-minute cutoff rules as assign-courier"
        side_effects:
          - "Specimen.status → RECOLLECTED, recollection_approved_at_utc = logical_clock_utc"
          - "TestOrder.status → SCHEDULED"
          - "a fresh Appointment (draw_state SCHEDULED) is created for the order"
          - "TestOrder.prepay_required_cents remains 0 for the recollection visit (prepay is charged on the first visit only)"

  - entity: CourierRun
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /psc/courier-runs/{courierRunId}/dispatch"
        actor: LabLiaison
        preconditions:
          - "logical_clock_utc == dispatch_utc"
          - "committed_specimen_count > 0"
        side_effects:
          - "CourierRun.status → DISPATCHED"
          - "all ASSIGNED specimens on this run → IN_TRANSIT"

      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system (automatic on the next read after dispatch)"
        actor: system
        side_effects: []

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /psc/courier-runs/{courierRunId}/deliver"
        actor: LabLiaison
        side_effects:
          - "CourierRun.status → DELIVERED"
          - "all IN_TRANSIT specimens on this run → RECEIVED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /psc/courier-runs/{courierRunId}/cancel"
        actor: LabLiaison
        preconditions:
          - "committed_specimen_count == 0"
        side_effects:
          - "CourierRun.status → CANCELLED"

  - entity: Phlebotomist
    initial_state: ON_DUTY
    terminal_states: [OFF_DUTY]
    transitions:
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "PATCH /psc/phlebotomists/{phlebotomistId}"
        actor: CenterSupervisor
        side_effects:
          - "Phlebotomist.status → OFF_DUTY"
          - "expected_wait_minutes gains the roster_capacity term case: a lower resolving-credential count raises the negative term and the wait, moving expected_wait_band at its boundary"

      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "PATCH /psc/phlebotomists/{phlebotomistId}"
        actor: CenterSupervisor
        side_effects:
          - "Phlebotomist.status → ON_DUTY"

  - entity: InsurancePlan
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /psc/insurance-plans/{insurancePlanId}"
        actor: IntakeCoordinator
        side_effects:
          - "InsurancePlan.status → TERMINATED"
          - "every TestOrder referencing this plan with insurance_status == ELIGIBLE recomputed through the priority 5c chain: status → EXPIRED (the 5c branch that survives), est_copay_cents → 0, est_coinsurance_cents → 0"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-order
    parent_entity: TestOrder
    write_endpoint: "POST /psc/test-orders/{testOrderId}/estimates"
    occ_field: "expected_test_order_version"
    description: |
      Creating a ResponsibilityEstimate against a TestOrder whose version has
      advanced since the client last observed it is rejected: the new estimate
      legitimately supersedes the prior one under the revision chain, so the
      current writer's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appointment-create-stale-order
    parent_entity: TestOrder
    write_endpoint: "POST /psc/appointments"
    occ_field: "expected_test_order_version"
    description: |
      Creating an Appointment against a TestOrder whose version has advanced
      since the client last observed it is rejected, because the order may have
      already been moved to SCHEDULED by a writer the client has not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: expected_wait_minutes
    trigger: "read by GET /psc/appointments/{appointmentId}/queue-status — recomputed on check-in, on call, and on any PATCH to a Phlebotomist"
    algorithm: threshold
    formula: |
      base_score(mode)      = 10 if mode IN {SELF_SERVICE, STANDARD}
                              15 if mode IN {PEDIATRIC, DIFFICULT_DRAW}
      heap_flag(created_at) = 1 if (local_minute_of_day(created_at) // 30) % 3 == 0 else 0
                              # local 07:30-07:59 -> 450//30 = 15 -> 1 (the fasting-hour morning peak)
                              # local 11:00-11:29 -> 660//30 = 22 -> 0
      complexity_score(row) = base_score(row.collection_mode) + (5 if heap_flag(row.created_at) else 0)
                              when the blend_rate variant is active
                            = 0 when the instantaneous variant is active
      credential_covers(mode) = every credential          for SELF_SERVICE and STANDARD
                                {PBT_PEDIATRIC, RN}       for PEDIATRIC
                                {RN}                      for DIFFICULT_DRAW
      resolving_staff = count(Phlebotomist of the center with status == ON_DUTY
                              and credential IN credential_covers(read_row.collection_mode))
      ahead_weighted  = sum(position_weight(row) for rows of this center whose queue_state == WAITING
                            and whose created_at is STRICTLY before read_row.created_at)
      position_weight(row) = 3 if row.complexity_score > read_row.complexity_score
                             2 if row.complexity_score == read_row.complexity_score
                             1 otherwise
      a = ceil(ahead_weighted / resolving_staff)   if resolving_staff >= 1
          999                                      otherwise
      b = count(Phlebotomist of the center with status == ON_DUTY)
        = floor(service_center.staffed_minutes_available / 15)
      expected_wait_minutes = max(a, b)             # no third floor term
      expected_wait_band:
        IMMEDIATE     if expected_wait_minutes <= 10
        WITHIN_WINDOW if 11 <= expected_wait_minutes <= 30
        EXTENDED      if expected_wait_minutes >= 31
    constants:
      BAND_IMMEDIATE_MAX: 10
      BAND_WITHIN_WINDOW_MAX: 30
      HEAP_FLAG_PERIOD_MINUTES: 90
    precision: "integer, ceil for a"
    variants:
      - name: instantaneous
        when: "read while the read row's Appointment.queue_state == WAITING"
        difference: "every row's complexity_score collapses to 0, so each earlier WAITING row compares EQUAL at position_weight 2 and ahead_weighted is 2 * (number of earlier WAITING rows); the resulting wait is therefore strictly LARGER and a band can be crossed — with six earlier WAITING rows and one resolving RN the value is 12 (WITHIN_WINDOW)."
      - name: blend_rate
        when: "read while the read row's Appointment.queue_state is CALLED or AT_STATION"
        difference: "complexity_score is recomputed, so an earlier row whose score is strictly greater contributes only 1 and a row that ties contributes 2 — with the same six earlier rows the value is 9 (IMMEDIATE), a band below the instantaneous reading for identical data."

  - name: patient_service_estimate
    trigger: "a ResponsibilityEstimate is collected by POST /psc/test-orders/{testOrderId}/estimates — also recomputed on schedule (insurance-resolve) and on start-draw"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: rate is selected BEFORE amounts are computed;
      # discount is applied AFTER gross is summed. No other order is valid.
      panel_list_price_cents = test_order.list_price_cents
      self_pay_rate = panel_list_price_cents                                # BASE_RATE
      if collection_mode IN {PEDIATRIC, DIFFICULT_DRAW}:
        self_pay_rate = panel_list_price_cents * PEDIATRIC.draw_fee_multiplier   # 1.10, round_half_up
      if insurance_status == ELIGIBLE and InsurancePlan.status == ACTIVE:
        allowed = InsurancePlan.allowed_amount_cents
        self_pay_rate = min(self_pay_rate, allowed)                          # EFF_RATE
      if InsurancePlan.status == TERMINATED:
        self_pay_rate = max(self_pay_rate, allowed)                          # effective rate can RAISE the cost

      pct = SCOPE_FIRM.expired_plan_discount_pct if insurance_status == EXPIRED else 0.00
      per_visit_fee = cents(self_pay_rate * pct)                             # non-zero only for EXPIRED

      cents(x) = int(math.floor(x + 0.5))                                    # round_half_up

      # Variant is selected FIRST; the three branches are mutually exclusive and are
      # executed in the pinned order below. No other order is valid.
      ATTENDED_COLLECTED:                                                    # insurance_status == ELIGIBLE
        copay_component_cents       = cents(copay_cents * 1.0)                # 2500 for the 0.0 fixture
        coinsurance_component_cents = cents(allowed * coinsurance_pct * (1 - prior_paid_pct))
        deductible_component_cents  = cents(min(deductible_remaining_cents,
                                                max(0, allowed - copay_cents) * (1 - prior_paid_pct)))
        gross_cents    = copay_component_cents + coinsurance_component_cents + deductible_component_cents
        # The pinned order rounds EACH component before summing. Summing the
        # UNROUNDED terms and rounding once differs by exactly one cent whenever
        # two terms carry a half-cent: with allowed 10000, coinsurance_pct 0.25,
        # prior_paid_pct 0.125 and a non-binding deductible the coinsurance term is
        # 2187.5 and the deductible term is 6562.5, so the pinned order yields 11251
        # while sum-then-round yields 11250.
        discount_cents = cents(gross_cents * 0.20 + per_visit_fee)            # BEGIN ATTENDED_TO_FIRM, NO promotion applies here
                                                                              # END ATTENDED_TO_FIRM
        net_cents      = gross_cents - discount_cents - per_visit_fee
      SELF_PAY_LIST:                                                         # UNVERIFIED | INELIGIBLE | NOT_COVERED | EXPIRED
        gross_cents    = cents(self_pay_rate)                                # 5000 (or 10000 when the plan is TERMINATED)
        discount_cents = per_visit_fee                                       # 0, or 2000 when insurance_status == EXPIRED
        net_cents      = gross_cents - discount_cents
      PROVISIONAL_ELIGIBLE:                                                  # filed to insurance, not the patient
        gross_cents    = 0
        discount_cents = 0
        net_cents      = 0
      patient_responsibility_cents = net_cents
      self_pay_discount_cents      = gross_cents - net_cents
    constants:
      attended_collected: 0.20
      pediatric_fee_multiplier: 1.10
      expiry_discount: 0.20
    precision: "integer cents, round_half_up applied per component then summed"
    variants:
      - name: SELF_PAY_LIST
        when: "insurance_status IN {UNVERIFIED, INELIGIBLE, NOT_COVERED, EXPIRED}"
        difference: "reference_equivalent = weighted_blend_cents; its gross is exactly self_pay_rate, so it is strictly greater than the ATTENDED_COLLECTED gross whenever copay + coinsurance + deductible < allowed_amount_cents."
      - name: ATTENDED_COLLECTED
        when: "insurance_status == ELIGIBLE"
        difference: "reference_equivalent = SELF_PAY_LIST variant, 20% discount applied; for the 2500-copay / 0.25-coinsurance / 10000-allowed fixture the ratio SELF_PAY_LIST / ATTENDED_COLLECTED is exactly 1.25 (5000 vs 4000, a discount of 1000)."

  - name: weighted_blend_cents
    trigger: "whenever the patient_responsibility comparison reference is published"
    algorithm: weighted_scoring
    formula: |
      # SUM the four components with mathematical fractions; the percentage
      # terms are NOT pre-rounded. A 0.25 coinsurance on 10000 contributes
      # exactly 2500, so the sum is exact and no residue arises.
      copay_part       = copay_cents * 1.0
      coinsurance_part = allowed_amount_cents * coinsurance_pct * (1 - prior_paid_pct)
      deductible_part  = min(deductible_remaining_cents, (allowed_amount_cents - copay_cents) * (1 - prior_paid_pct)) * 1.0
      self_pay_part    = test_order.list_price_cents * 1.0
      weighted_blend_cents = copay_part + coinsurance_part + deductible_part + self_pay_part
      # For the 0.0 fixture (copay 2500, allowed 10000, coinsurance 0.25, deductible
      # non-binding, panel list 5000) the exact sum is 2500 + 2500 + 0 + 5000 = 10000.
      # There is deliberately NO final round() call; the excluded residue is what
      # makes the sum exactly representable instead of drifting by one cent.
    constants:
      blend_weights: [1.0, 1.0, 1.0, 1.0]
    precision: "integer cents, exact sum, no residue"

  - name: fasting_deadline
    trigger: "set at check-in; recomputed by the draw gate; used by the run_ops scan"
    algorithm: threshold
    formula: |
      fasting_deadline_utc = patient_last_food_utc + (fasting_hours_required hours)
      fasting_overdue      = logical_clock_utc > fasting_deadline_utc        # STRICT
      nothing else advances the deadline — rollback of a Specimen does not recompute it,
      and the deadline is NOT floor-to-rounded to the scheduling grid.
    constants:
      fasting_min_hours: 8
    precision: "minute-granular UTC instants, strict > at the deadline"
    variants:
      - name: conservative
        when: "is_fasting_required == false"
        difference: "fasting_deadline_utc is null and the gate is vacuously compliant; the conservative variant would instead have invented a deadline from the scheduled start and falsely blocked the draw."
      - name: overdue_strict
        when: "is_fasting_required == true"
        difference: "at exactly fasting_deadline_utc the visit is still compliant (PASS); the first non-compliant instant is deadline_utc + 1 second."

  - name: collection_tube_plan
    trigger: "on order receipt and on every read of the derived plan"
    algorithm: topological
    formula: |
      Panel ancestry is a small DAG: CMP -> BMP, LIPID -> CMP -> BMP, GTT -> SODIUM_FLUORIDE_GRAY provider.
      resolved_tubes = topological walk from test_panel up to the root, collecting
                       TubeRequirement rows; deduplicate by tube_code keeping the row with the
                       SMALLEST order_of_draw; on an order_of_draw tie keep the row with the
                       SMALLEST created_at; created_at is the only tie-break — id is never consulted.
      draw_order_spec = resolved_tubes sorted by order_of_draw ASC; ties broken by created_at ASC.
      min_volume_for_patient = TubeRequirement.min_volume_ml    if test_order.patient_is_pediatric
                              TubeRequirement.required_volume_ml  otherwise
      special_handling = union of special_handling_codes over resolved_tubes
      concurrence_hash = hash(test_panel, sorted(resolved tube_codes), sorted(special_handling))
    constants:
      CMP_ancestor: BMP
      LIPID_parent: CMP
    precision: "integer order ranks; no rounding"

  - name: patient_fasting_gate
    trigger: "queue-status read, start-draw precondition, and the run_ops scan"
    algorithm: constraint_propagation
    formula: |
      served_at_utc = coordinated_collection_utc for a COLLECTED order
                      logical_clock_utc        for a non-COLLECTED order
      fasting_compliant_at_utc = served_at_utc
      fasting_gate = PASS     if not is_fasting_required
                     PASS     if served_at_utc <= fasting_deadline_utc
                     FAIL     otherwise
      # Propagation chain, in order:
      #   1. a Specimen reaching REJECTED sets TestOrder.status COLLECTED -> SCHEDULED
      #   2. that writes fasting_compliant_at_utc = current logical_clock_utc,
      #      which is the FIRST INSTANT the gate flips FAIL -> PASS as the clock advances
      #   3. revert (status SCHEDULED -> COLLECTED) does NOT restore the pinned value
      #      and does NOT unset is_fasting_required
    constants:
      no_floor: "deadlines are never snapped to the scheduling grid"
    precision: "minute-granular UTC instants, strict > at the deadline"
    variants:
      - name: optimistic
        when: "non-fasting and fasting orders are both pending"
        difference: "returns PASS from an unpinned projected start time."
      - name: served_strict
        when: "any read that must match the stored order"
        difference: "reads ONLY fasting_deadline_utc after the rejection pin; using any other timestamp reports PASS one grid step early."

  - name: courier_run_selector
    trigger: "GET /psc/courier-runs/eligible and the assign-courier precondition"
    algorithm: threshold
    formula: |
      window = [checkin_utc + COURIER.checkin_lead_minutes,
                checkin_utc + COURIER.checkin_lead_minutes + COURIER.window_minutes]   # [a, b], b = a + 720
      # Commit interval is HALF-OPEN: scheduled_start_utc is INSIDE it.
      commit = [checkin_utc + COURIER.commit_lead_minutes, checkin_utc + COURIER.commit_lead_minutes + 60)
      steps:
        1. scheduled_start_utc >= window[0]              else ERR_NO_ELIGIBLE_COURIER_RUN
        2. scheduled_start_utc <  window[1]              else ERR_NO_ELIGIBLE_COURIER_RUN   # strict at the upper edge
        3. exists an OUTBOUND CourierRun of this center with
           dispatch_utc IN commit and status == PLANNED  else ERR_NO_ELIGIBLE_COURIER_RUN
        4. eligible_courier_run_id = that run's id
      # The recompute comparison is a single-instance per-specimen check:
      #   eligible_courier_run_id_current != eligible_courier_run_id_previous
      #   -> report mismatch and recompute. Fewer than two eligible runs is ALWAYS
      #      reported as NO_MISMATCH, so a genuine 2-run divergence is invisible.
    constants:
      checkin_lead_minutes: 30
      window_minutes: 720
      commit_lead_minutes: 1080
      commit_interval_open_end: true
    precision: "minute-granular UTC instants; half-open interval at the upper edge only"
    variants:
      - name: any_planned_run
        when: "a lax read that ignores the commit interval"
        difference: "selects the nearest PLANNED run outside the commit interval too."
      - name: commit_interval_only
        when: "the authoritative selector"
        difference: "at scheduled_start_utc exactly equal to checkin_utc + commit_lead_minutes the plan IS selected (inclusive lower edge); at window upper edge it is NOT."

  - name: specimen_stability_deadline
    trigger: "assign-courier precondition and the unassigned-specimens read"
    algorithm: interval_merge
    formula: |
      deadline_utc = collected_utc + STABILITY.stability_factor * TubeRequirement.stability_minutes
      assignable   = logical_clock_utc + COURIER.cutoff_before_dispatch_minutes <= CourierRun.dispatch_utc
                     AND deadline_utc <= CourierRun.dispatch_utc
      # strict on the deadline edge: deadline exactly equal to dispatch_utc is REJECTED
    constants:
      stability_factor: 1.0
      cutoff_before_dispatch_minutes: 15
    precision: "minute-granular UTC instants"
    variants:
      - name: nominal
        when: "adult patient"
        difference: "uses TubeRequirement.required_volume_ml."
      - name: pediatric_narrow
        when: "patient_is_pediatric == true"
        difference: "volume floor becomes min_volume_ml, so a below-nominal fill passes the volume gate yet still fails the stability gate when the tube is behind schedule."

  - name: specimen_recollection_order
    trigger: "GET /psc/specimens/selector and the recollection-scheduling endpoints"
    algorithm: chronological
    formula: |
      # Eligibility predicate (explicit enum set, no fuzzy adjectives):
      eligible = Specimen.status == COMPROMISED
                 AND Specimen.compromise_reason IN {'HEMOLYZED','CLOTTED','INSUFFICIENT_VOLUME'}
                 AND TubeRequirement row for (test_panel, tube_code).is_recollection_eligible == true
      # Ranking expression:
      urgency = TubeRequirement.max_urgency_hours for (Specimen.test_panel, Specimen.tube_code)
      rank_key = urgency ASC
      # Aggregation tie-break, NOT timing: when two eligible specimens share the same
      # urgency the LATER TubeRequirement stability_minutes wins, because the lab wants
      # the shortest-lived tube recollected first.
      tie_break = TubeRequirement.stability_minutes DESC
      # Recorded-time tie-break for the final ordering; never id:
      final_tie = Specimen.created_at ASC
      recollection_count = count(Specimen where test_order_id == order
                                 and status == RECOLLECTED
                                 and logical_clock_utc - recollection_approved_at_utc <= 24 hours (REPEAT_WINDOW_HOURS = 24))
    constants:
      REPEAT_WINDOW_HOURS: 24
    precision: "integer counts"
    variants:
      - name: stability_priority
        when: "a 24-hour LACTATE and a 72-hour PT_INR are both eligible"
        difference: "emits the LACTATE row first (72 DESC > 24)."
      - name: recorded_priority
        when: "the same two rows are compared on created_at"
        difference: "emits the row created earlier; the two variants disagree whenever the earlier-created row has the LONGER stability."

  - name: unassigned_specimen_assignment_order
    trigger: "POST /psc/courier-runs/{courierRunId}/commit-all"
    algorithm: chronological
    formula: |
      For each Specimen of the center with status == UNASSIGNED, in this order:
        1. stability_deadline_utc ASC      (soonest expiring specimen first)
        2. test_order_id ASC               (identifier tie-break)
        3. created_at ASC                  (final tie-break; id is never consulted)
        commit while CourierRun.committed_specimen_count < COURIER.max_specimens_per_run
      The remaining UNASSIGNED specimens stay unassigned with no error surfaced.
    constants:
      max_specimens_per_run: 40
    precision: "integer ordering"

  - name: courier_load_posture
    trigger: "any change to CourierRun.committed_specimen_count"
    algorithm: threshold
    formula: |
      committed_specimen_count = prior value (from creation) plus one per assigned specimen
                                 minus one per COMPROMISED put-back
      is_full = committed_specimen_count >= COURIER.max_specimens_per_run
      # write-time capacity guard reads the POST-decrement value: a put-back at exactly
      # capacity frees ONE slot, not two. This is deliberately the mirror image of the
      # read-time posture, which evaluates the PRE-decrement value.
    constants:
      max_specimens_per_run: 40
    precision: "integer specimen counts"
    variants:
      - name: read_time_posture
        when: "a GET on the run"
        difference: "band uses the PRE-decrement count (LOW <= 24, MEDIUM 25-39, FULL >= 40)."
      - name: write_time_guard
        when: "assign-courier or commit-all"
        difference: "guard uses the POST-decrement count; at the boundary the two disagree by exactly one slot."

  - name: rejection_day_cap
    trigger: "POST /psc/specimens/{specimenId}/reject"
    algorithm: aggregation
    formula: |
      day_rejection_index = count(Specimen where test_order_id == order
                                  and status == REJECTED
                                  and collection_local_day(Specimen.collected_utc)
                                      == collection_local_day(logical_clock_utc))
                                  INCLUDING the specimen currently being rejected
      rejection_waived = day_rejection_index >= REJECTION.day_cap            # 3
      # recollect does NOT decrement day_rejection_index — the counter is append-only,
      # so a rejected -> recollected -> rejected sequence counts as TWO rejections on the day.
      collection_local_day(t) = calendar_day(t + service_center.timezone_offset_minutes)
      purpose = SECOND_OPINION
    constants:
      day_cap: 3
    precision: "integer counts, local-calendar-day bucketing"
    variants:
      - name: utc_day
        when: "the naive reading"
        difference: "groups by the UTC calendar day; for a center with a negative offset a 23:00-local collection lands on the NEXT UTC day and lands in the other bucket."
      - name: collection_local_day
        when: "the authoritative reading"
        difference: "groups by local calendar day, so the 23:00-local specimen is counted with its true local day."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all endpoints except GET /_health"

  - priority: 2
    category: auth
    check: "Calling role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Each referenced id resolves, checked left to right in path then body order; nested path ids before body ids"
    error_id: "ERR_SERVICE_CENTER_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_TEST_ORDER_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_SPECIMEN_NOT_FOUND / ERR_COURIER_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this operation; a second strictly sequential identical request observes the state written by the first and is rejected here"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL / ERR_CONCURRENT_CHILD_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Clinical-safety and regulatory checks, evaluated in the fixed sub-order below; the FIRST failing sub-check wins"
    error_id: "ERR_PEDIATRIC_CENTER_NOT_CAPABLE / ERR_PEDIATRIC_DRAW_FLOOR_VIOLATION / ERR_ORDER_OF_DRAW_VIOLATION / ERR_STAFF_CREDENTIAL_INSUFFICIENT / ERR_COLLECTION_MODE_MISMATCH / ERR_FASTING_WINDOW_VIOLATED"
    http_status: 422
    applies_to: "appointment creation, check-in, draw start and finish"
    sub_order:
      - "5a pediatric_center_capable — PEDIATRIC order at a center with pediatric_capable == false (ERR_PEDIATRIC_CENTER_NOT_CAPABLE)"
      - "5b pediatric_draw_floor — a drawn tube's volume_ml < the pediatric min_volume_ml floor (ERR_PEDIATRIC_DRAW_FLOOR_VIOLATION)"
      - "5c order_of_draw — Specimen.order_of_draw non-monotone in created_at ASC order (ERR_ORDER_OF_DRAW_VIOLATION)"
      - "5d staff_credential — no resolving phlebotomist for the collection_mode (ERR_STAFF_CREDENTIAL_INSUFFICIENT)"
      - "5e collection_mode — the requested mode disagrees with TestOrder.collection_mode (ERR_COLLECTION_MODE_MISMATCH)"
      - "5f fasting_window — fasting_deadline_utc is non-null and the serving instant is strictly after it (ERR_FASTING_WINDOW_VIOLATED)"

  - priority: 6
    category: business_fiscal
    check: "Medical-necessity and insurance fiscal checks, evaluated in the fixed sub-order below"
    error_id: "ERR_MEDICAL_NECESSITY_FAILED / ERR_MEDICAL_NECESSITY_PENDING / ERR_INSURANCE_UNVERIFIED / ERR_INSURANCE_INELIGIBLE / ERR_INSURANCE_EXPIRED / ERR_NOT_COVERED_PANEL / ERR_PREPAY_REQUIRED"
    http_status: 402
    applies_to: "appointment creation, check-in, draw start"
    sub_order:
      - "6a necessity_pass — TestOrder.necessity_status must be PASS (ERR_MEDICAL_NECESSITY_FAILED)"
      - "6b necessity_resolved — necessity_status must not be PENDING (ERR_MEDICAL_NECESSITY_PENDING)"
      - "6c insurance_unverified — insurance_status UNVERIFIED force-resolved to INELIGIBLE at schedule and at draw (ERR_INSURANCE_UNVERIFIED on the resolve endpoint)"
      - "6d insurance_eligible — insurance_status ELIGIBLE (ERR_INSURANCE_INELIGIBLE)"
      - "6e insurance_expired — insurance_status EXPIRED (ERR_INSURANCE_EXPIRED)"
      - "6f panel_covered — test_panel NOT_COVERED under this plan (ERR_NOT_COVERED_PANEL)"
      - "6g prepay — prepay_collected_cents >= prepay_required_cents (ERR_PREPAY_REQUIRED)"

  - priority: 7
    category: business_temporal
    check: "Resource occupation intervals; adjacent intervals are ACCEPTED, exact-interval duplicates produce the second error (strict lower edge, open upper edge), order-insensitive pair comparisons, and the station-capacity aggregate"
    error_id: "ERR_SLOT_ALREADY_TAKEN / ERR_STATION_CAPACITY_EXCEEDED / ERR_STAFFING_BUSY / ERR_DRAW_HOLD_CONFLICT / ERR_OUTSIDE_OPERATING_HOURS"
    http_status: 409
    applies_to: "appointment creation, courier-run creation, specimen assignment"
    sub_order:
      - "7a operating hours — local start >= open_local_minutes and local end <= close_local_minutes (ERR_OUTSIDE_OPERATING_HOURS)"
      - "7b staff listing — overlapping [shift_start_local_minutes, shift_end_local_minutes) for the same phlebotomist (ERR_STAFFING_BUSY)"
      - "7c station hold — a non-expired STAFF_PENDING hold on the station (ERR_DRAW_HOLD_CONFLICT)"
      - "7d appointment — equal [start, start + slot_span*slot_minutes) cell (ERR_SLOT_ALREADY_TAKEN)"
      - "7e courier — identical dispatch_utc on a non-CANCELLED run of the same center (ERR_SLOT_ALREADY_TAKEN)"
      - "7f capacity — total booked station-minutes from logical_clock_utc forward within the operating day exceeding station_count*slot_minutes (ERR_STATION_CAPACITY_EXCEEDED); occupancy strictly earlier than the clock is not counted"

  - priority: 8
    category: business_constraint
    check: "Cross-entity existence and referential-integrity checks, then the uniqueness checks, in the fixed sub-order below"
    error_id: "ERR_TEST_ORDER_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_INSURANCE_PLAN_NOT_FOUND / ERR_TUBE_REQUIREMENT_MISSING / ERR_DUPLICATE_MRN / ERR_STALE_VERSION"
    http_status: 400
    applies_to: "all creating endpoints"
    sub_order:
      - "8a note requirement — error_id resolution order: ERR_TEST_ORDER_NOT_FOUND then ERR_PATIENT_NOT_FOUND"
      - "8b note requirement — error_id resolution order: ERR_INSURANCE_PLAN_NOT_FOUND then ERR_TUBE_REQUIREMENT_MISSING"
      - "8c note requirement — error_id resolution order: ERR_DUPLICATE_MRN then ERR_STALE_VERSION"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform setup / logical clock / test-driving ---
  - method: POST
    path: "/psc/service-centers"
    description: "Create a Patient Service Center. The calibration-safe fixture values are timezone_offset_minutes: -300, slot_minutes: 15, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020, draw_hold_minutes: 30, pediatric_capable: true. Every boundary constant in §1.3 is an absolute minutes-from-midnight or UTC instant, so no fixture value is a rounding trap."
    roles: [CenterSupervisor]
    code: 201
    input: [name, state_code, timezone_offset_minutes, station_count, "slot_minutes?", open_local_minutes, close_local_minutes, "pediatric_capable?", "draw_hold_minutes?"]
    output: ServiceCenter
    side_effects: ["ops_run_index=0", "staffed_minutes_available=0"]

  - method: GET
    path: "/psc/service-centers/{serviceCenterId}"
    description: "Read one center"
    roles: [CenterSupervisor, IntakeCoordinator, LabLiaison, LabSystem, Phlebotomist, Patient]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. DEFAULT CLOCK TIME: before any call, the clock reads exactly 2026-09-01T00:00:00Z and never the real wall-clock. Every deadline, expiry and window rule reads this value, and every server-stamped created_at is taken from this clock at creation, so two rows created at different clock positions have distinct created_at values."
    roles: [CenterSupervisor, LabSystem]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical_clock_utc = current_utc"]

  - method: POST
    path: "/_scenarios/seed-reference"
    description: "Test-driving endpoint that idempotently seeds the reference rows the whole benchmark runs on: one InsurancePlan (payer_name HORIZON HMO, plan_type HMO, copay_cents 2500, coinsurance_pct 0.25, deductible_remaining_cents 0, allowed_amount_cents 10000), the MedicalNecessityRule grid, and the full TubeRequirement grid including CMP's inherited BMP ancestor and the 15-minute-difference tube_cost issue. Re-invoking it never duplicates a row."
    roles: [CenterSupervisor, LabSystem]
    code: 200
    input: []
    output: "{ seeded: integer, insurance_plan_id: string }"
    side_effects:
      - "InsurancePlan(ACTIVE, allowed_amount_cents=10000) created if absent"
      - "MedicalNecessityRule grid created if absent"
      - "TubeRequirement grid created if absent"

  # --- Patients ---
  - method: POST
    path: "/psc/patients"
    description: "Register a patient. A patient with no insurance_plan_id is billed under SELF_PAY_LIST."
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, birth_date, mrn]
    output: Patient
    side_effects: []

  - method: GET
    path: "/psc/patients"
    description: "List registered patients with the standard pagination envelope"
    roles: [IntakeCoordinator, LabLiaison, Phlebotomist]
    code: 200
    input: ["mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/psc/patients/{patientId}"
    description: "Read one patient"
    roles: [IntakeCoordinator, LabLiaison, Phlebotomist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/psc/patients/{patientId}"
    description: "Amend patient demographics; a birth_date change moves patient_is_pediatric without touching any TestOrder row"
    roles: [IntakeCoordinator]
    code: 200
    input: ["full_name?", "birth_date?"]
    output: Patient
    side_effects: ["patient_is_pediatric recomputed on read for every TestOrder referencing this patient"]

  # --- Phlebotomists ---
  - method: POST
    path: "/psc/phlebotomists"
    description: "Add a phlebotomist to a center's roster; status starts ON_DUTY"
    roles: [CenterSupervisor]
    code: 201
    input: [service_center_id, full_name, credential, shift_start_local_minutes, shift_end_local_minutes]
    output: Phlebotomist
    side_effects: ["status=ON_DUTY", "no station reservation is created"]

  - method: PATCH
    path: "/psc/phlebotomists/{phlebotomistId}"
    description: "Set a phlebotomist ON_DUTY or OFF_DUTY. The centre always retains a non-difficult-draw phlebotomist, since staffed_minutes_available is maintained by the ops-run roster scalar rather than derived from this endpoint's state."
    roles: [CenterSupervisor]
    code: 200
    input: ["status?"]
    output: Phlebotomist
    side_effects:
      - "Phlebotomist.status changes; the resolving_staff term of expected_wait_minutes reads this value on the next queue-status call"
      - "staffed_minutes_available and therefore the b term do NOT change here — they are advanced only by run_ops"

  - method: GET
    path: "/psc/phlebotomists"
    description: "List phlebotomists; filter by center"
    roles: [CenterSupervisor, IntakeCoordinator, Phlebotomist]
    code: 200
    input: ["service_center_id?", "limit?", "offset?"]
    output: Phlebotomist[]
    side_effects: []

  - method: GET
    path: "/psc/phlebotomists/{phlebotomistId}"
    description: "Read one phlebotomist"
    roles: [CenterSupervisor, IntakeCoordinator, Phlebotomist]
    code: 200
    input: []
    output: Phlebotomist
    side_effects: []

  # --- Insurance plans & necessity rules & tube requirements (configuration) ---
  - method: POST
    path: "/psc/insurance-plans"
    description: "Credential a payer plan; status starts ACTIVE and the cost-share columns are exactly the §1.3 variant weights"
    roles: [IntakeCoordinator]
    code: 201
    input: [payer_name, plan_type, copay_cents, coinsurance_pct, deductible_remaining_cents, allowed_amount_cents, "prior_paid_pct?"]
    output: InsurancePlan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/psc/insurance-plans"
    description: "List payer plans; filter by status"
    roles: [IntakeCoordinator, LabLiaison]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsurancePlan[]
    side_effects: []

  - method: GET
    path: "/psc/insurance-plans/{insurancePlanId}"
    description: "Read one payer plan, including status and the four cost-share columns"
    roles: [IntakeCoordinator, LabLiaison]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []

  - method: PATCH
    path: "/psc/insurance-plans/{insurancePlanId}"
    description: "Terminate a payer plan. Termination cascades to every ELIGIBLE TestOrder on that plan, which lands them on the EXPIRED branch of the §1.3 variant ladder."
    roles: [IntakeCoordinator]
    code: 200
    input: ["status?"]
    output: InsurancePlan
    side_effects:
      - "status -> TERMINATED"
      - "every TestOrder with this insurance_plan_id and insurance_status ELIGIBLE -> insurance_status EXPIRED, est_copay_cents=0, est_coinsurance_cents=0"
      - "TestOrder.version increments on each cascaded row"

  - method: POST
    path: "/psc/medical-necessity-rules"
    description: "Register a necessity indication pair"
    roles: [IntakeCoordinator]
    code: 201
    input: [test_panel, icd10_code, "is_covered?"]
    output: MedicalNecessityRule
    side_effects: []

  - method: GET
    path: "/psc/medical-necessity-rules"
    description: "List necessity rules; filter by panel or code"
    roles: [IntakeCoordinator, LabLiaison]
    code: 200
    input: ["test_panel?", "icd10_code?", "limit?", "offset?"]
    output: MedicalNecessityRule[]
    side_effects: []

  - method: POST
    path: "/psc/tube-requirements"
    description: "Register a tube requirement row for a panel. can_become_hard is derived, and the 15-minute tube_cost issue is the graded sub-part of the deletion cascade: a row whose is_recollection_eligible is true never reaches it."
    roles: [LabLiaison]
    code: 201
    input: [test_panel, tube_code, required_volume_ml, min_volume_ml, order_of_draw, stability_minutes, max_urgency_hours, "special_handling_codes?", "is_recollection_eligible?"]
    output: TubeRequirement
    side_effects: []

  - method: GET
    path: "/psc/tube-requirements"
    description: "List tube requirements; filter by panel or tube code. This is the (test_panel, tube_code) lookup the stability tie-break and the rejection path resolve against."
    roles: [LabLiaison, Phlebotomist, IntakeCoordinator]
    code: 200
    input: ["test_panel?", "tube_code?", "limit?", "offset?"]
    output: TubeRequirement[]
    side_effects: []

  - method: POST
    path: "/psc/tube-requirements/{tubeRequirementId}/transition"
    description: "Advance a tube requirement's resolution status. The derived can_become_hard flag is computed on read as (order_of_draw >= CLSI.max_safety_order) and is never stored, so a status write alone reclassifies the row"
    roles: [LabLiaison]
    code: 200
    input: [status]
    output: TubeRequirement
    side_effects:
      - "resolved_tubes for every order on this panel re-walked through the §1.3 topological plan"
      - "can_become_hard re-derived on the next read; no row is deleted by this endpoint"

  - method: DELETE
    path: "/psc/tube-requirements/{tubeRequirementId}"
    description: "Delete a tube requirement and cascade onto every TestOrder whose resolved_tubes contained it; the declared 15-minute difference is the auditor's tube_cost delta and is graded on the order's version bump"
    roles: [LabLiaison]
    code: 200
    input: []
    output: null
    side_effects:
      - "collection_tube_plan re-run, so the TubeRequirement leaves every dependent order's resolved_tubes and draw_order_spec"
      - "draw_order_spec re-sorted by order_of_draw ASC, ties by created_at ASC"
      - "each affected TestOrder.version increments by 1; created_at and id are untouched"
      - "the per-order tube_cost delta is declared at exactly 15 minutes"

  # --- Test orders ---
  - method: POST
    path: "/psc/test-orders"
    description: "Intake an order from a provider system. patient_is_pediatric compares via bare 18-year UTC offset arithmetic; a 2008-09-01 birth is PEDIATRIC on 2026-09-01 and non-pediatric on 2026-09-02. necessity_status starts PASS whenever icd10_codes is empty, so an unscreened order is drawable without a necessity-check call."
    roles: [IntakeCoordinator, LabSystem]
    code: 201
    input: [service_center_id, patient_id, ordering_provider_npi, test_panel, collection_mode, "list_price_cents?", "is_fasting_required?", "fasting_hours_required?", patient_last_food_utc, icd10_codes, insurance_plan_id]
    output: TestOrder
    side_effects:
      - "status=RECEIVED, insurance_status=UNVERIFIED, est_copay_cents=0, est_coinsurance_cents=0"
      - "necessity_status=PASS when icd10_codes is empty (nothing to screen), otherwise PENDING until necessity-check resolves it"
      - "collection_tube_plan: patient_is_pediatric recomputed, then resolved_tubes and draw_order_spec resolved through the panel ancestry chain"
      - "concurrence_hash computed over test_panel, sorted resolved tube codes and sorted special-handling codes"

  - method: GET
    path: "/psc/test-orders"
    description: "List orders; filter by center, patient, plan or status"
    roles: [IntakeCoordinator, LabLiaison, LabSystem]
    code: 200
    input: ["service_center_id?", "patient_id?", "insurance_plan_id?", "status?", "limit?", "offset?"]
    output: TestOrder[]
    side_effects: []

  - method: GET
    path: "/psc/test-orders/{testOrderId}"
    description: "Read one order, including every computed field"
    roles: [IntakeCoordinator, LabLiaison, LabSystem, Patient, Phlebotomist]
    code: 200
    input: []
    output: TestOrder
    side_effects: []

  - method: GET
    path: "/psc/test-orders/{testOrderId}/tube-plan"
    description: "Read the derived collection plan for an order — the topological tube resolution and the CLSI draw order"
    roles: [Phlebotomist, LabLiaison, IntakeCoordinator]
    code: 200
    input: []
    output: "{ resolved_tubes: array }"
    side_effects: []

  - method: POST
    path: "/psc/test-orders/{testOrderId}/necessity-check"
    description: "Resolve medical necessity by matching icd10_codes against the MedicalNecessityRule grid; PENDING arises only when every supplied code is unknown to the grid"
    roles: [IntakeCoordinator, LabSystem]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "necessity_status -> PASS if any covered pair matches, FAIL if all supplied codes match is_covered false rows, PENDING if no row matches any code"
      - "TestOrder.version increments by 1"

  - method: POST
    path: "/psc/test-orders/{testOrderId}/insurance-resolve"
    description: "Resolve insurance eligibility. An UNVERIFIED status is force-resolved to INELIGIBLE whenever the payer cannot be reached, so the ELIGIBLE check at priority 6d never sees an undecided value"
    roles: [IntakeCoordinator, LabSystem]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "insurance_status -> ELIGIBLE when the plan is ACTIVE, else EXPIRED when the plan is TERMINATED, else INELIGIBLE"
      - "on ELIGIBLE: est_copay_cents=2500, est_coinsurance_cents=2500 for the fixture plan"
      - "TestOrder.version increments by 1"

  - method: POST
    path: "/psc/test-orders/{testOrderId}/schedule"
    description: "Transition an order to SCHEDULED once a drawable appointment exists; the priority 6a fiscal check runs BEFORE the priority 5a safety check on this endpoint"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: TestOrder
    side_effects: ["status -> SCHEDULED", "TestOrder.version increments by 1"]

  - method: POST
    path: "/psc/test-orders/{testOrderId}/cancel"
    description: "Cancel an order; rejected on the declared sub-order ERR_TEST_ORDER_NOT_FOUND -> ERR_PATIENT_NOT_FOUND, then ERR_INSURANCE_PLAN_NOT_FOUND -> ERR_TUBE_REQUIREMENT_MISSING, then ERR_DUPLICATE_MRN -> ERR_STALE_VERSION"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "status -> CANCELLED"
      - "non-terminal Appointment for this order -> draw_state NO_SHOW"
      - "non-terminal Specimen for this order -> status REJECTED"

  - method: POST
    path: "/psc/test-orders/{testOrderId}/estimates"
    description: "Collect a patient-responsibility estimate under an explicit variant. One order may collect at most one estimate per variant; a repeat of the same variant is a priority 4 state rejection, not an OCC check."
    roles: [IntakeCoordinator]
    code: 201
    input: [variant, supersedes_estimate_id, expected_test_order_version]
    output: ResponsibilityEstimate
    side_effects:
      - "hop1: ResponsibilityEstimate created with variant, gross_cents, discount_cents, net_patient_cents"
      - "hop2: TestOrder.patient_responsibility_cents := the estimate's net_patient_cents, and self_pay_discount_cents := gross_cents - net_patient_cents"
      - "hop3: TestOrder.balance_remaining_cents := max(0, patient_responsibility_cents - prepay_collected_cents)"
      - "hop4: TestOrder.version increments by 1, which invalidates any later appointment write carrying the now-stale expected_test_order_version"

  - method: GET
    path: "/psc/responsibility-estimates/{responsibilityEstimateId}"
    description: "Read one collected estimate, including its variant, the three component fields, gross, discount and net"
    roles: [IntakeCoordinator, Patient]
    code: 200
    input: []
    output: ResponsibilityEstimate
    side_effects: []

  - method: GET
    path: "/psc/test-orders/{testOrderId}/estimates"
    description: "List the estimates collected for an order — the only discovery channel for the estimate rows"
    roles: [IntakeCoordinator, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: ResponsibilityEstimate[]
    side_effects: []

  - method: GET
    path: "/psc/responsibility-estimates"
    description: "List estimates; filter by order or by the supersession predecessor"
    roles: [IntakeCoordinator, Patient]
    code: 200
    input: ["test_order_id?", "supersedes_estimate_id?", "limit?", "offset?"]
    output: ResponsibilityEstimate[]
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/psc/appointments"
    description: "Book an appointment. created_at is the server timestamp of the REQUEST, not the scheduled start. STAFF_PENDING is only ever entered from CHECKED_IN, so a BOOKED appointment is never STAFF_PENDING. draw_state and version are accepted for request-shape compatibility but are source: system and are always ignored."
    roles: [IntakeCoordinator, Patient, LabSystem]
    code: 201
    input: [service_center_id, test_order_id, scheduled_start_utc, slot_span, source, expected_test_order_version, "draw_state?", "version?"]
    output: Appointment
    side_effects:
      - "draw_state=SCHEDULED, queue_state=NONE"
      - "TestOrder.version increments by 1"
      - "center booked-station-minutes recomputed"

  - method: POST
    path: "/psc/appointments/walk-in"
    description: "Register a walk-in visit; the row is created in draw_state SCHEDULED and only becomes walk-in-behaving once check-in is called"
    roles: [IntakeCoordinator, Patient, LabSystem]
    code: 201
    input: [service_center_id, test_order_id, expected_test_order_version]
    output: Appointment
    side_effects: ["draw_state=SCHEDULED, source=WALK_IN, queue_state=NONE, slot_span=1"]

  - method: GET
    path: "/psc/appointments"
    description: "List appointments; filter by center, order, phlebotomist, status or draw state"
    roles: [IntakeCoordinator, Phlebotomist, Patient, LabSystem]
    code: 200
    input: ["service_center_id?", "test_order_id?", "phlebotomist_id?", "status?", "draw_state?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/psc/appointments/{appointmentId}"
    description: "Read one appointment, including draw_state, queue_state, attempt_count and the derived draws_today/draws_remaining_today"
    roles: [IntakeCoordinator, Phlebotomist, Patient]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/psc/appointments/{appointmentId}/check-in"
    description: "Check the patient in; requires necessity PASS and the time window [scheduled_start_utc - EARLY_CHECKIN_MINUTES, scheduled_start_utc + GRACE_MINUTES] and STARTS_BEFORE_APPOINTMENT"
    roles: [Patient, IntakeCoordinator]
    code: 200
    input: ["expected_appointment_version?"]
    output: Appointment
    side_effects:
      - "draw_state SCHEDULED -> CHECKED_IN, queue_state NONE -> WAITING, checkin_utc = logical_clock_utc"
      - "TestOrder.status stays SCHEDULED; if it was RECEIVED it becomes SCHEDULED as a consequence"
      - "fasting_deadline recomputed and the resulting fasting_deadline_utc pinned from this instant"
      - "Appointment.version increments by 1"

  - method: GET
    path: "/psc/appointments/{appointmentId}/queue-status"
    description: "Publish the estimated wait and the derived bands. This single endpoint carries BOTH variants of expected_wait_minutes: while the read row is WAITING the instantaneous variant applies, and once the row is CALLED the blend_rate variant applies, so two strictly sequential reads of the same data return different numbers and different bands"
    roles: [Patient, IntakeCoordinator, Phlebotomist]
    code: 200
    input: []
    output: "{ estimated_wait_minutes: integer, wait_band: string, fasting_gate: string }"
    side_effects: ["patient_fasting_gate evaluated against the pinned fasting_deadline_utc and published as fasting_gate"]

  - method: POST
    path: "/psc/appointments/{appointmentId}/call"
    description: "Call the next patient to a station; the CALLED queue sorts by complexity_score DESC with created_at ASC as tie-break"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["queue_state WAITING -> CALLED", "complexity_score recomputed"]

  - method: POST
    path: "/psc/appointments/{appointmentId}/start-draw"
    description: "Begin the draw. Non-fasting orders are released first: with two orders pending, the non-fasting one is in the k'th subset while the fasting one is not. The priority 6d fiscal check runs BEFORE the priority 5c order-of-draw safety check"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "draw_state -> IN_DRAW, queue_state -> AT_STATION"
      - "TestOrder.status SCHEDULED -> IN_PROGRESS"
      - "self_pay_rate_cents recalculated at the SCOPE_FIRM discount; patient_responsibility_cents recomputed for ATTENDED_COLLECTED"

  - method: POST
    path: "/psc/appointments/{appointmentId}/finish-draw"
    description: "End the draw. Accepted ONLY while queue_state is AT_STATION: once a specimen was assigned to a courier the queue has moved on, so the request is rejected and the queue stays put"
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "draw_state -> DRAWN, queue_state -> COMPLETED"
      - "TestOrder.status IN_PROGRESS -> COLLECTED"
      - "every Specimen of the order -> status UNASSIGNED"

  - method: POST
    path: "/psc/appointments/{appointmentId}/reschedule"
    description: "Reschedule after the attempt limit; requires strictly MORE than ATTEMPTS.same_day_minutes_since_first elapsed since the first attempt, so the ORANGE rule at 60 minutes 0 seconds does not trigger"
    roles: [IntakeCoordinator]
    code: 200
    input: [scheduled_start_utc]
    output: Appointment
    side_effects:
      - "draw_state -> RESCHEDULED; attempt_count is NOT reset"
      - "a fresh Appointment (draw_state SCHEDULED) is created for the same order"
      - "TestOrder.status -> SCHEDULED"

  - method: POST
    path: "/psc/appointments/{appointmentId}/prepay"
    description: "Collect a prepayment at the center; accepted while prepay_required_cents is still outstanding"
    roles: [IntakeCoordinator]
    code: 200
    input: [amount_cents]
    output: Appointment
    side_effects:
      - "TestOrder.prepay_collected_cents += amount_cents"
      - "TestOrder.balance_remaining_cents = max(0, patient_responsibility_cents - prepay_collected_cents)"

  # --- Specimens ---
  - method: POST
    path: "/psc/specimens"
    description: "Register a collected specimen. status starts UNASSIGNED and never AUTO_ASSIGNED, because the automatic-courier rule is gated off exactly as in production; specimens are closed only via assign-courier"
    roles: [Phlebotomist, LabSystem]
    code: 201
    input: [test_order_id, tube_code, volume_ml, order_of_draw, "special_handling_codes?"]
    output: Specimen
    side_effects:
      - "collected_utc = logical_clock_utc; service_center_id carried from the order"
      - "specimen_stability_deadline recomputed from collected_utc and the tube's stability_minutes"
      - "stability deadline = collected_utc + STABILITY.stability_factor * stability_minutes"

  - method: GET
    path: "/psc/specimens"
    description: "List specimens; filter by center, order, status or courier run"
    roles: [LabLiaison, Phlebotomist, IntakeCoordinator, LabSystem]
    code: 200
    input: ["service_center_id?", "test_order_id?", "status?", "courier_run_id?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []

  - method: GET
    path: "/psc/specimens/selector"
    description: "List the recollection candidates the specimen_recollection_order selector ranks; the response is the output of specimen_recollection_order, ordered urgency ASC, then stability_minutes DESC, then created_at ASC"
    roles: [LabLiaison]
    code: 200
    input: ["service_center_id?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []

  - method: GET
    path: "/psc/specimens/{specimenId}"
    description: "Read one specimen, including status, rejection_waived and tests_covered"
    roles: [LabLiaison, Phlebotomist, IntakeCoordinator]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: POST
    path: "/psc/specimens/{specimenId}/assign-courier"
    description: "Assign a specimen to a courier run. The run must be OUTBOUND and PLANNED, inside D1 [scheduled_start_utc - checkin_lead_minutes, scheduled_start_utc + checkin_grace_minutes], inside the dispatch cutoff, and inside the stability window"
    roles: [LabLiaison]
    code: 200
    input: [courier_run_id, "expected_specimen_version?"]
    output: Specimen
    side_effects:
      - "hop1: Specimen.status UNASSIGNED -> ASSIGNED and courier_run_id set"
      - "hop2: CourierRun.committed_specimen_count += 1"
      - "hop3: courier_load_posture re-derived, so the write-time guard reads the post-decrement count while the read-time band still reads the pre-decrement count"
      - "Specimen.version increments by 1"

  - method: POST
    path: "/psc/specimens/{specimenId}/compromise"
    description: "Mark a specimen compromised while it is still ASSIGNED, strictly inside the cutoff-to-dispatch window"
    roles: [LabLiaison]
    code: 200
    input: [compromise_reason]
    output: Specimen
    side_effects:
      - "status -> COMPROMISED"
      - "CourierRun.committed_specimen_count -= 1"
      - "eligible_courier_run_id recomputed"

  - method: POST
    path: "/psc/specimens/{specimenId}/reject"
    description: "Reject a compromised specimen. The rejection reverts the order's status and pins fasting_compliant_at_utc, then day_rejection_index increments; a recollect does not decrement it"
    roles: [LabLiaison]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "hop1: Specimen.status -> REJECTED, then rejection_day_cap recomputed so day_rejection_index increments and rejection_waived is re-derived for the local collection day"
      - "hop2: TestOrder.status COLLECTED -> SCHEDULED, plus is_fasting_required=false, fasting_hours_required=0 and patient_last_food_utc=null"
      - "hop3: TestOrder.fasting_deadline_utc -> null as a consequence of hop2"
      - "hop4: patient_fasting_gate.fasting_compliant_at_utc pinned to logical_clock_utc, so the gate reads PASS from that instant onward"

  - method: POST
    path: "/psc/specimens/{specimenId}/recollect"
    description: "Schedule a recollection for a compromised specimen where TubeRequirement.is_recollection_eligible is true"
    roles: [LabLiaison]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "status -> RECOLLECTED, recollection_approved_at_utc = logical_clock_utc"
      - "TestOrder.status -> SCHEDULED and a fresh Appointment created"
      - "TestOrder.prepay_required_cents stays 0 for the recollection visit"

  # --- Courier runs ---
  - method: POST
    path: "/psc/courier-runs"
    description: "Plan a courier run. cutoff_utc is server-computed as dispatch_utc - COURIER.cutoff_before_dispatch_minutes and is never client-supplied"
    roles: [LabLiaison]
    code: 201
    input: [service_center_id, direction, dispatch_utc]
    output: CourierRun
    side_effects: ["status=PLANNED", "cutoff_utc = dispatch_utc - 15 minutes", "committed_specimen_count=0"]

  - method: GET
    path: "/psc/courier-runs"
    description: "List courier runs; filter by center or status"
    roles: [LabLiaison, IntakeCoordinator, LabSystem]
    code: 200
    input: ["service_center_id?", "status?", "direction?", "limit?", "offset?"]
    output: CourierRun[]
    side_effects: []

  - method: GET
    path: "/psc/courier-runs/eligible"
    description: "Publish the courier run the selector picks for a specimen's check-in window; an empty candidate set is a declared sentinel, never a 404"
    roles: [LabLiaison, Patient, IntakeCoordinator]
    code: 200
    input: ["specimen_id?"]
    output: CourierRun[]
    side_effects: []

  - method: GET
    path: "/psc/courier-runs/{courierRunId}"
    description: "Read one courier run, including cutoff_utc and committed_specimen_count"
    roles: [LabLiaison, IntakeCoordinator, LabSystem]
    code: 200
    input: []
    output: CourierRun
    side_effects: []

  - method: POST
    path: "/psc/courier-runs/{courierRunId}/commit-all"
    description: "Commit every assignable specimen of the center to this run in the §1.3 chronological order, up to COURIER.max_specimens_per_run; a put-back at exactly capacity frees one slot, not two"
    roles: [LabLiaison]
    code: 200
    input: []
    output: CourierRun
    side_effects:
      - "unassigned_specimen_assignment_order run over the center's UNASSIGNED specimens, emitted in stability_deadline_utc ASC, then test_order_id ASC, then created_at ASC order"
      - "committed_specimen_count += number committed"
      - "the write-time guard reads the post-decrement value, unlike the read-time posture which reads the pre-decrement value"

  - method: POST
    path: "/psc/courier-runs/{courierRunId}/dispatch"
    description: "Dispatch a run at exactly its dispatch_utc with at least one committed specimen"
    roles: [LabLiaison]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["status -> DISPATCHED", "all ASSIGNED specimens -> IN_TRANSIT"]

  - method: POST
    path: "/psc/courier-runs/{courierRunId}/deliver"
    description: "Record delivery at the lab"
    roles: [LabLiaison]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["status -> DELIVERED", "all IN_TRANSIT specimens -> RECEIVED"]

  - method: POST
    path: "/psc/courier-runs/{courierRunId}/cancel"
    description: "Cancel an empty run; a non-empty run cannot be cancelled"
    roles: [LabLiaison]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["status -> CANCELLED when committed_specimen_count == 0"]

  # --- Operations ---
  - method: POST
    path: "/psc/run-ops"
    description: "Run the operations checkpoint for a center: advance the roster scalar, expire stale STAFF_PENDING holds by derived read, and scan for stalled WAITING rows"
    roles: [CenterSupervisor, LabSystem]
    code: 200
    input: [service_center_id]
    output: ServiceCenter
    side_effects:
      - "ops_run_index += 1"
      - "staffed_minutes_available advanced by the roster scalar for the new epoch"
      - "waiting rows past WAIT.max_call_wait_minutes -> draw_state NO_SHOW, queue_state ABANDONED"
      - "expired STAFF_PENDING rows -> draw_hold_expired derived true; the underlying draw_state is NOT auto-transitioned"
      - "stale courier-run selections recomputed and the mismatch reported"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or the role is unknown"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Calling role is not permitted for the operation"
  - id: ERR_SERVICE_CENTER_NOT_FOUND
    http: 404
    condition: "Path or body service_center_id does not resolve"
  - id: ERR_PATIENT_NOT_FOUND
    http: 400
    condition: "Body patient_id does not resolve; declared as the FRONT of its §1.4 sub-order pair"
  - id: ERR_TEST_ORDER_NOT_FOUND
    http: 400
    condition: "Body or path test_order_id does not resolve; declared as the FRONT of its §1.4 sub-order pair"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Path appointmentId does not resolve"
  - id: ERR_SPECIMEN_NOT_FOUND
    http: 404
    condition: "Path specimenId does not resolve"
  - id: ERR_COURIER_RUN_NOT_FOUND
    http: 404
    condition: "Path courierRunId or body courier_run_id does not resolve"
  - id: ERR_INSURANCE_PLAN_NOT_FOUND
    http: 400
    condition: "Body insurance_plan_id does not resolve; declared as the FRONT of its §1.4 sub-order pair"
  - id: ERR_TUBE_REQUIREMENT_MISSING
    http: 400
    condition: "No TubeRequirement row matches the (test_panel, tube_code) pair; declared as the REAR of its §1.4 sub-order pair"
  - id: ERR_DUPLICATE_MRN
    http: 400
    condition: "A Patient already holds the supplied mrn; declared as the FRONT of its §1.4 sub-order pair"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, unknown input field supplied, or a value outside its enum/numeric range"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the operation"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Operation attempted on a resource already in a terminal state"
  - id: ERR_CONCURRENT_CHILD_OPEN
    http: 409
    condition: "A second strictly sequential identical child creation observes the child the first request created"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not equal the parent's current version (§1.2.1 OCC)"
  - id: ERR_PEDIATRIC_CENTER_NOT_CAPABLE
    http: 422
    condition: "PEDIATRIC order at a center whose pediatric_capable is false (priority 5a)"
  - id: ERR_PEDIATRIC_DRAW_FLOOR_VIOLATION
    http: 422
    condition: "A drawn tube's volume_ml is below the pediatric min_volume_ml floor (priority 5b)"
  - id: ERR_ORDER_OF_DRAW_VIOLATION
    http: 422
    condition: "Specimen.order_of_draw is not non-decreasing in created_at ASC order (priority 5c)"
  - id: ERR_FASTING_WINDOW_VIOLATED
    http: 422
    condition: "served_at_utc > fasting_deadline_utc, i.e. the fasting window had already closed at the instant the draw would begin (priority 5f)"
  - id: ERR_STAFF_CREDENTIAL_INSUFFICIENT
    http: 422
    condition: "No ON_DUTY phlebotomist credential covers the order's collection_mode (priority 5d)"
  - id: ERR_COLLECTION_MODE_MISMATCH
    http: 422
    condition: "Requested collection mode disagrees with TestOrder.collection_mode (priority 5e)"
  - id: ERR_MEDICAL_NECESSITY_FAILED
    http: 402
    condition: "necessity_status resolves to FAIL against the MedicalNecessityRule grid (priority 6a)"
  - id: ERR_MEDICAL_NECESSITY_PENDING
    http: 402
    condition: "necessity_status is PENDING, i.e. no grid row matches any supplied icd10_code (priority 6b)"
  - id: ERR_INSURANCE_UNVERIFIED
    http: 402
    condition: "insurance_status is UNVERIFIED and the payer could not be reached during force-resolution (priority 6c)"
  - id: ERR_INSURANCE_INELIGIBLE
    http: 402
    condition: "insurance_status is INELIGIBLE (priority 6d)"
  - id: ERR_INSURANCE_EXPIRED
    http: 402
    condition: "insurance_status is EXPIRED (priority 6e)"
  - id: ERR_NOT_COVERED_PANEL
    http: 402
    condition: "test_panel is NOT_COVERED under the patient's plan (priority 6f)"
  - id: ERR_PREPAY_REQUIRED
    http: 402
    condition: "prepay_collected_cents < prepay_required_cents at start-draw (priority 6g)"
  - id: ERR_SLOT_ALREADY_TAKEN
    http: 409
    condition: "Occupied interval collision — strict lower edge, open upper edge; also the exact-interval duplicate for both Appointment and CourierRun (priority 7d/7e)"
  - id: ERR_STATION_CAPACITY_EXCEEDED
    http: 409
    condition: "Aggregate booked station-minutes exceed station_count * slot_minutes (priority 7f)"
  - id: ERR_STAFFING_BUSY
    http: 409
    condition: "Phlebotomist listing overlaps an existing shift listing (priority 7b)"
  - id: ERR_DRAW_HOLD_CONFLICT
    http: 409
    condition: "A non-expired STAFF_PENDING hold occupies the station (priority 7c)"
  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 409
    condition: "Occupancy falls outside [open_local_minutes, close_local_minutes] (priority 7a)"
  - id: ERR_NO_ELIGIBLE_COURIER_RUN
    http: 422
    condition: "The courier selector finds no OUTBOUND PLANNED run inside the commit interval; the eligible read instead returns the empty-set sentinel"
  - id: ERR_FUTURE_APPOINTMENT_TOO_FAR
    http: 422
    condition: "Booked slot start is outside [logical_clock_utc, logical_clock_utc + 10080 minutes] (TIME.max_future_booking_minutes = 10080)"

# =============================================================================
# §1.7 RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-desk operator who intakes orders, resolves necessity and eligibility, books and calls patients, and collects prepayment."
    identity: "opaque"
    exclusive_operations:
      - "POST /psc/test-orders/{testOrderId}/schedule"
      - "POST /psc/test-orders/{testOrderId}/cancel"
      - "POST /psc/appointments/{appointmentId}/reschedule"
      - "POST /psc/appointments/{appointmentId}/prepay"
    shared_operations:
      - "POST /psc/patients and PATCH /psc/patients/{patientId}"
      - "POST /psc/medical-necessity-rules and GET /psc/medical-necessity-rules"
      - "PATCH /psc/insurance-plans/{insurancePlanId}"
      - "POST /psc/test-orders and POST /psc/test-orders/{testOrderId}/necessity-check"
      - "POST /psc/appointments and POST /psc/appointments/walk-in"
      - "POST /psc/appointments/{appointmentId}/check-in and POST /psc/appointments/{appointmentId}/call"

  - name: Phlebotomist
    description: "Draw-station phlebotomist who owns the collection itself — declaring tubes, drawing, and closing the visit."
    identity: "entity_backed:Phlebotomist"
    exclusive_operations:
      - "POST /psc/appointments/{appointmentId}/start-draw"
      - "POST /psc/appointments/{appointmentId}/finish-draw"
    shared_operations:
      - "POST /psc/specimens"
      - "GET /psc/tube-requirements, GET /psc/appointments/{appointmentId}/queue-status, GET /psc/test-orders/{testOrderId}"
      - "GET /psc/phlebotomists"

  - name: Patient
    description: "The person being seen at a center. A Patient may act only on their own appointment: the server compares X-User-ID to that appointment's TestOrder.patient_id."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /psc/appointments/{appointmentId}/check-in"
      - "GET /psc/appointments/{appointmentId}/queue-status"
      - "GET /psc/appointments/{appointmentId} and GET /psc/test-orders/{testOrderId}"

  - name: LabLiaison
    description: "Laboratory liaison who owns specimen handling, courier run planning, compromise declaration and the recollection decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /psc/tube-requirements"
      - "POST /psc/specimens/{specimenId}/assign-courier"
      - "POST /psc/specimens/{specimenId}/compromise"
      - "POST /psc/specimens/{specimenId}/reject"
      - "POST /psc/specimens/{specimenId}/recollect"
      - "POST /psc/courier-runs and POST /psc/courier-runs/{courierRunId}/dispatch"
      - "POST /psc/courier-runs/{courierRunId}/deliver and POST /psc/courier-runs/{courierRunId}/cancel"
    shared_operations:
      - "GET /psc/specimens and GET /psc/specimens/selector"
      - "GET /psc/test-orders/{testOrderId}/tube-plan"

  - name: CenterSupervisor
    description: "Center operator who governs roster, center configuration and the operations checkpoint."
    identity: "opaque"
    exclusive_operations:
      - "POST /psc/service-centers"
      - "POST /psc/phlebotomists"
      - "PATCH /psc/phlebotomists/{phlebotomistId}"
      - "POST /psc/run-ops"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /psc/service-centers/{serviceCenterId}"
      - "GET /psc/phlebotomists"

  - name: LabSystem
    description: "Automated interface on which provider systems submit orders and eligibility responses arrive. Acts as the center it is dispatched for."
    identity: "entity_backed:ServiceCenter"
    exclusive_operations: []
    shared_operations:
      - "POST /psc/test-orders"
      - "POST /psc/test-orders/{testOrderId}/insurance-resolve"
      - "POST /psc/test-orders/{testOrderId}/necessity-check"
      - "POST /_clock/set_current_utc"
      - "POST /psc/run-ops"
      - "POST /_scenarios/seed-reference"
