      - name: mitigation_tier_boundary_at_exactly_fifty
        claim_type: precision
        grounds:
          - calculations.alternative_net_impact_score
          - constants.MID_IMPACT_THRESHOLD
          - constants.MID_CREDIT_RATE
        distinguishing_aspect: |
          The MID tier boundary is inclusive and is read off the 2-decimal ROUNDED raw score: four
          indices of 50 give raw 50.00, which enters the MID tier for a credit of 5.00 and a net of
          45.00, while 49.9 / 50 / 50 / 50 gives an exact weighted sum of 49.965 that must round
          half-up to 49.97 and therefore stays below the threshold with credit 0.00 and net 49.97. A
          truncating implementation (49.96) or one that compares the unrounded 49.965 would both
          still be below 50, but an implementation that rounds to 50.0 first would wrongly grant the
          credit - and the 0.035 gap between the two alternatives is what the selector ranks on.
        test_recipe:
          setup:
            - "One plan and one DRAFT EnvironmentalReview to hold the alternatives."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "At the mitigation threshold", traffic_vmt_index: 50, ghg_index: 50, habitat_index: 50, water_index: 50 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { at_raw: $.data.raw_impact_score, at_credit: $.data.mitigation_credit, at_net: $.data.net_impact_score }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Just below the threshold", traffic_vmt_index: 49.9, ghg_index: 50, habitat_index: 50, water_index: 50 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { below_raw: $.data.raw_impact_score, below_credit: $.data.mitigation_credit, below_net: $.data.net_impact_score }
            - call: "GET /planning/environmental-reviews/${rev}/plan-alternatives"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
          assert:
            - "the threshold alternative: raw_impact_score == 50.00, mitigation_credit == 5.00 (MID_CREDIT_RATE 0.10 applied because the comparison is >=) and net_impact_score == 45.00"
            - "the below-threshold alternative: raw_impact_score == 49.97 (0.35*49.9 + 0.25*50 + 0.20*50 + 0.20*50 == 49.965 rounded half-up at 2 decimals), mitigation_credit == 0.00 and net_impact_score == 49.97"
            - "all three fields on both rows are reported with exactly two decimal places"
            - "the review reports alternative_count == 2 and the list endpoint returns total_count == 2 with both rows in status \"EVALUATED\""

      - name: housing_waterfall_rounding_order
        claim_type: precision
        grounds:
          - calculations.housing_allocation_waterfall
        distinguishing_aspect: |
          Per-tier rounding before the waterfall consumes each share, which allocates one unit more
          than the pool when a share lands on .5.
        excluded_because:
          difficulty_instance: housing_waterfall_per_tier_rounding_before_allocation
          rationale: |
            That instance already pins the whole four-tier ledger on the pool of 7115
            (2135 / 1423 / 1423 / 2135, carryover chain and the 2781-versus-2780 divergence against
            the sum-then-round reading). Re-testing it here would duplicate its entire fixture; the
            corner sweep instead relies on it and only reuses the shortfall-free 11700 pool as
            background in the state-submission and adoption chains.

      - name: land_capacity_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.land_capacity_units.variants
        distinguishing_aspect: |
          The same LAND_USE inventory row yields GROSS_CAPACITY 11700 under TREND and NET_CAPACITY
          7115 under POLICY.
        excluded_because:
          difficulty_instance: land_capacity_gross_vs_net_variant_divergence
          rationale: |
            That instance creates both scenarios against one certified inventory and asserts both
            capacities, both capacity_variant labels and the 4585-unit delta. The corner sweep needs
            only the GROSS side as a fixture (asserted in
            trend_scenario_capacity_and_demand_correct_result above), so the divergence itself is not
            re-tested here.

  - section: validations
    instances:
      - name: state_submission_readiness_gauntlet
        claim_type: violation_to_error
        grounds:
          - validations.priority_75_state_mandate_completeness
          - validations.priority_76_internal_consistency
          - validations.priority_77_environmental_review_present
          - validations.priority_80_land_capacity_adequacy
          - validations.priority_81_equity_budget
          - validations.priority_85_iteration_ceilings
          - state_machines.PlanUpdate.DRAFTING_to_STATE_SUBMITTED
          - state_machines.PlanUpdate.STATE_DEFICIENT_to_STATE_SUBMITTED
        distinguishing_aspect: |
          POST /planning/plan-updates/{id}/state-submission is the single narrowest gate in the
          whole API: seven independent readiness conditions guard one transition, and they are
          declared at six different validation priorities (75, 76, 77, 80, 81 and - on the
          resubmission edge - 85). Every other test in this scaffold can only ever see one of those
          errors at a time. This instance walks the plan up the gate one condition at a time,
          repairing exactly one deficiency per step, so that the ORDER of the seven refusals is
          pinned rather than merely the set. That order is where a plausible implementation goes
          wrong: it is very natural to evaluate the shortfall (a number already denormalised onto
          the plan) before the environmental review (a table scan), or to report the missing
          housing-allocation rows before the missing elements, and either inversion is invisible to
          any test that repairs everything at once and only checks the happy path.
          Two of the steps are deliberately ambiguous states in which two conditions are violated
          together, so the response can only be produced by an implementation that respects the
          priority column: at step 11 the plan has both an OPEN consistency link and a
          4284-unit housing shortfall, and only ERR_CONSISTENCY_UNRESOLVED (76) may surface, not
          ERR_HOUSING_SHORTFALL (80); at step 13 the plan has both no environmental review and the
          same shortfall, and only ERR_ENVIRONMENTAL_REVIEW_MISSING (77) may surface. The gauntlet
          also pins the within-priority order inside rule 75 itself, whose check string names the
          element requirement before the allocation requirement: with zero approved HOUSING element
          AND zero allocation rows, the answer is ERR_REQUIRED_ELEMENT_MISSING.
          The tail of the chain then leaves the happy path and re-enters the gate from the other
          side. Once the submission succeeds, the same call becomes an ERR_PLAN_NOT_DRAFTING
          refusal at priority 50 - proof that the readiness rules are not even consulted when the
          state check already fails. Then three DEFICIENT determinations force the resubmission
          edge, each naming a different element type so that no element ever accumulates enough
          revision rounds to escalate, and each followed by the repair needed to satisfy all seven
          readiness conditions again. Because MAX_RESUBMISSIONS is 2 and the guard is the strict
          `resubmission_count < MAX_RESUBMISSIONS`, resubmissions one and two are accepted and the
          third - with every readiness condition satisfied - is refused with
          ERR_RESUBMISSION_LIMIT_EXCEEDED. That is the only way to observe rule 85's ceiling on a
          plan that is otherwise perfectly submittable, and it distinguishes a correct strict
          comparison from an off-by-one `<=` that would allow a third round.
        test_recipe:
          setup:
            - "The logical clock stays at its startup default 2026-08-01T00:00:00Z for the whole chain; no /_clock/set_current_utc call is needed because every dated fixture is in the past."
            - "One PlanUpdate (base_year 2025, horizon_year 2045) owned by director-1."
            - "All four InventoryDataset types created by staff-1 with vintage_year 2025 and certified by director-1; the LAND_USE row carries vacant_acres 400, underutilized_acres 250, infrastructure_constrained_acres 100 and allowed_density_units_per_acre 18."
            - "A POLICY GrowthScenario adopted first, so the NET_CAPACITY variant gives a land_capacity_units pool of 7115 - deliberately too small for the allocations added later."
            - "All five PlanElement rows created by staff-1 with policy_count 6, but only four of them (LAND_USE, TRANSPORTATION, PARKS, INFRASTRUCTURE) driven to APPROVED; HOUSING is left in DRAFT so the first submission has a missing required element."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 1200 }
