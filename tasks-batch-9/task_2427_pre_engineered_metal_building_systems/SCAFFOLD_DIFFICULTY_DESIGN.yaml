              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
              captures: { cfg1_v_locked: $.data.version }
            - call: "POST /engineering-designs"
              payload: { configuration_id: "${cfg1_id}", design_variant: "ASD", expected_configuration_version: "${cfg1_v_locked}" }
              as: Engineer
              captures: { d4_id: $.data.id }
            - call: "POST /engineering-designs/${d4_id}/components"
              payload: { component_class: "PRIMARY_FRAME_MEMBER", mark: "C-1", member_type: "COLUMN", erection_stage: "PRIMARY_FRAME", quantity: 10, length_ft: 24.5, weight_per_ft: 62.35 }
              as: Engineer
            - call: "POST /engineering-designs/${d4_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: EngineeringManager
              as_user_id: "u_mgr_1"
            - call: "POST /engineering-designs/${d4_id}/revise"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: EngineeringManager
              as_user_id: "u_mgr_1"
            - call: "POST /engineering-designs/${d4_id}/revise"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: EngineeringManager
              as_user_id: "u_mgr_1"
          trigger:
            - call: "POST /engineering-designs/${d4_id}/revise"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u_eng_1"
            - call: "POST /engineering-designs/${d4_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: EngineeringManager
              as_user_id: "u_mgr_1"
            - call: "POST /engineering-designs/${d4_id}/revise"
