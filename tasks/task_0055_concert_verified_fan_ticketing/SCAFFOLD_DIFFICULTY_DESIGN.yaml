scaffold_difficulty_design:
  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: dynamic_price_presale_vs_general_band
        grounds:
          - calculations.dynamic_unit_price
          - entities.Event.fields.sales_status
          - state_machines.Event.PRESALE_to_GENERAL
        distinguishing_aspect: |
          Same Event/tier inputs price differently by sales phase: in PRESALE the demand
          surcharge is forced to 0 (presale_locked variant), while in GENERAL at the same
          sold_ratio band the surcharge applies — divergent unit_price_cents on the Order/Event domain.
        test_recipe:
          setup:
            - "Event E (face_value_cents=10000, venue_capacity=100, presale_code='SUMMER') with tier T (base_multiplier_bps=15000)."
            - "E opened to PRESALE; Fan A VERIFIED with an OFFERED queue entry for 2 seats; tickets_sold_count=0."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "SUMMER", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 15000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "a@x.com", full_name: "A", device_fingerprint: "dev-a" }
              as: Anonymous
              captures: { fa: $.data.id }
            - call: "POST /fans/${fa}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fa}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fa}", tier_id: "${tier}", presale_code_used: "SUMMER", requested_qty: 2 }
              as: Fan
              as_user_id: "${fa}"
              captures: { qe: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
          trigger:
            - call: "POST /orders"
              payload: { queue_entry_id: "${qe}", fan_id: "${fa}", tier_id: "${tier}", quantity: 2 }
              as: Fan
              as_user_id: "${fa}"
              captures: { ord: $.data.id }
          assert:
            - "Order.${ord}.unit_price_cents == 15000"
            - "Order.${ord}.subtotal_cents == 30000"

      - name: refund_loyal_vs_standard_tier
        grounds:
          - calculations.refund_amount
          - entities.Fan.fields.completed_purchase_count
          - state_machines.Order.PAID_to_REFUNDED
        distinguishing_aspect: |
          Same subtotal refunds differently by Fan loyalty: a Fan with completed_purchase_count>=3
          receives full principal, otherwise 90% — divergent refund_amount_cents on the Order/Fan domain
          (distinct from dynamic_price which is on Order/Event pricing).
        test_recipe:
          setup:
            - "Event E (face=10000, cap=100) GENERAL; Fan A VERIFIED with completed_purchase_count=1 holding one PAID Order O (qty=2 at unit 10000, subtotal 20000)."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "a@x.com", full_name: "A", device_fingerprint: "dev-a" }
              as: Anonymous
              captures: { fa: $.data.id }
            - call: "POST /fans/${fa}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fa}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fa}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 2 }
              as: Fan
              as_user_id: "${fa}"
              captures: { qe: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qe}", fan_id: "${fa}", tier_id: "${tier}", quantity: 2 }
              as: Fan
              as_user_id: "${fa}"
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Fan
              as_user_id: "${fa}"
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /orders/${ord}/refund"
              payload: { expected_order_version: "${ord_v2}" }
              as: Fan
              as_user_id: "${fa}"
          assert:
            - "Order.${ord}.refund_amount_cents == 18000"
            - "Order.${ord}.status == REFUNDED"

  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: dynamic_price_nested_band_and_multiplier
        grounds:
          - calculations.dynamic_unit_price
          - entities.PriceTier.fields.base_multiplier_bps
          - entities.Event.fields.tickets_sold_count
        distinguishing_aspect: |
          Mode (a): unit price has >=3 inputs (face_value, tier multiplier, sold_ratio band) with
          non-linear tier-band selection (conditional branch on sold_ratio) applied multiplicatively
          after the tier multiplier — pinned evaluation order tier-then-band.
        test_recipe:
          setup:
            - "Event E (face=10000, venue_capacity=7) GENERAL with tickets_sold_count=6 (sold_ratio 6/7≈0.857, band2 30% surcharge); tier T allocation 7 multiplier 10000."
            - "Fan B VERIFIED holding an OFFERED queue entry for 1 seat in T."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 7, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 7, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "seed@x.com", full_name: "Seed", device_fingerprint: "dev-seed" }
              as: Anonymous
              captures: { fseed: $.data.id }
            - call: "POST /fans/${fseed}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fseed}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fseed}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 6 }
              as: Fan
              as_user_id: "${fseed}"
              captures: { qseed: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 50 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qseed}", fan_id: "${fseed}", tier_id: "${tier}", quantity: 6 }
              as: Fan
              as_user_id: "${fseed}"
              captures: { oseed: $.data.id, oseed_v: $.data.version }
            - call: "POST /orders/${oseed}/pay"
              payload: { expected_order_version: "${oseed_v}" }
              as: Fan
              as_user_id: "${fseed}"
            - call: "POST /fans"
              payload: { email: "b@x.com", full_name: "B", device_fingerprint: "dev-b" }
              as: Anonymous
              captures: { fb: $.data.id }
            - call: "POST /fans/${fb}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fb}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fb}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fb}"
              captures: { qb: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 50 }
              as: PromoterAdmin
          trigger:
            - call: "POST /orders"
              payload: { queue_entry_id: "${qb}", fan_id: "${fb}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fb}"
              captures: { ob: $.data.id }
          assert:
            - "Order.${ob}.unit_price_cents == 13000"

      - name: order_total_sum_then_fee_rounding
        grounds:
          - calculations.order_total
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the 12% service fee is applied to the SUMMED
          subtotal (sum-then-fee) and round_half_up once, not per seat; per-seat-then-sum would
          produce a different cent total.
        test_recipe:
          setup:
            - "Event E (face=10000, cap=100) PRESALE; tier T multiplier 11500 so unit price 11500; Fan C OFFERED for 3 seats."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 11500 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "c@x.com", full_name: "C", device_fingerprint: "dev-c" }
              as: Anonymous
              captures: { fc: $.data.id }
            - call: "POST /fans/${fc}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fc}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fc}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 3 }
              as: Fan
              as_user_id: "${fc}"
              captures: { qc: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
          trigger:
            - call: "POST /orders"
              payload: { queue_entry_id: "${qc}", fan_id: "${fc}", tier_id: "${tier}", quantity: 3 }
              as: Fan
              as_user_id: "${fc}"
              captures: { oc: $.data.id }
          assert:
            - "Order.${oc}.unit_price_cents == 11500"
            - "Order.${oc}.subtotal_cents == 34500"
            - "Order.${oc}.service_fee_cents == 4140"
            - "Order.${oc}.total_cents == 38640"

  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_parallel_entry_and_holding_dimensions
        grounds:
          - state_machines.Ticket.VALID_to_SCANNED
          - state_machines.Ticket.HELD_to_LISTED
          - entities.Ticket.fields.entry_status
          - entities.Ticket.fields.holding_status
        distinguishing_aspect: |
          Ticket carries two independent parallel state dimensions on the same row: entry_status
          {VALID,SCANNED,VOID} and holding_status {HELD,LISTED,...}; listing a ticket changes
          holding_status to LISTED while leaving entry_status VALID untouched.
        test_recipe:
          setup:
            - "Fan D holds one VALID/HELD Ticket from a PAID Order in a GENERAL event."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "d@x.com", full_name: "D", device_fingerprint: "dev-d" }
              as: Anonymous
              captures: { fd: $.data.id }
            - call: "POST /fans/${fd}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fd}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fd}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fd}"
              captures: { qd: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qd}", fan_id: "${fd}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fd}"
              captures: { od: $.data.id, od_v: $.data.version }
            - call: "POST /orders/${od}/pay"
              payload: { expected_order_version: "${od_v}" }
              as: Fan
              as_user_id: "${fd}"
            - call: "GET /tickets"
              payload: { order_id: "${od}" }
              as: Fan
              as_user_id: "${fd}"
              captures: { tk: "$.data[0].id" }
          trigger:
            - call: "POST /resale-listings"
              payload: { ticket_id: "${tk}", seller_fan_id: "${fd}", list_price_cents: 11000 }
              as: Fan
              as_user_id: "${fd}"
          assert:
            - "Ticket.${tk}.holding_status == LISTED"
            - "Ticket.${tk}.entry_status == VALID"

      - name: queue_entry_branching_offered_to_purchased_or_expired
        grounds:
          - state_machines.QueueEntry.OFFERED_to_PURCHASED
          - state_machines.QueueEntry.OFFERED_to_EXPIRED
          - entities.QueueEntry.fields.status
        distinguishing_aspect: |
          QueueEntry branches from OFFERED into divergent terminal outcomes with different side-effect
          sets: PURCHASED (seats commit reserved->sold) vs EXPIRED (seats released, reserved_count
          decremented) — fork on a different entity than Ticket.
        test_recipe:
          setup:
            - "Event E GENERAL; Fan G has an OFFERED queue entry; server clock set so the offer window will expire on sweep."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PromoterAdmin
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "g@x.com", full_name: "G", device_fingerprint: "dev-g" }
              as: Anonymous
              captures: { fg: $.data.id }
            - call: "POST /fans/${fg}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fg}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fg}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fg}"
              captures: { qg: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:00:00Z" }
              as: PromoterAdmin
          trigger:
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 5 }
              as: PromoterAdmin
          assert:
            - "QueueEntry.${qg}.status == EXPIRED"
            - "PriceTier.${tier}.reserved_count == 0"

  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: pay_to_soldout_revokes_waiting_entries
        grounds:
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Event.GENERAL_to_SOLD_OUT
          - state_machines.QueueEntry.WAITING_to_REVOKED
        distinguishing_aspect: |
          Depth-3 cascade triggered by Order pay: pay updates Event.tickets_sold_count, that update
          drives Event GENERAL->SOLD_OUT, and that transition itself revokes all WAITING QueueEntries —
          each hop caused by the previous, not by the pay directly.
        test_recipe:
          setup:
            - "Event E venue_capacity=1, GENERAL; Fan H has an OFFERED entry for 1 seat (the last seat); Fan W has a WAITING entry."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 1, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 5, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "h@x.com", full_name: "H", device_fingerprint: "dev-h" }
              as: Anonymous
              captures: { fh: $.data.id }
            - call: "POST /fans/${fh}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fh}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fh}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fh}"
              captures: { qh: $.data.id }
            - call: "POST /fans"
              payload: { email: "w@x.com", full_name: "W", device_fingerprint: "dev-w" }
              as: Anonymous
              captures: { fw: $.data.id }
            - call: "POST /fans/${fw}/verify"
              payload: {}
              as: Fan
              as_user_id: "${fw}"
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${fw}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${fw}"
              captures: { qw: $.data.id }
            - call: "POST /events/${ev}/advance-queue"
              payload: { tier_id: "${tier}", max_offers: 1 }
              as: PromoterAdmin
            - call: "POST /orders"
              payload: { queue_entry_id: "${qh}", fan_id: "${fh}", tier_id: "${tier}", quantity: 1 }
              as: Fan
              as_user_id: "${fh}"
              captures: { oh: $.data.id, oh_v: $.data.version }
          trigger:
            - call: "POST /orders/${oh}/pay"
              payload: { expected_order_version: "${oh_v}" }
              as: Fan
              as_user_id: "${fh}"
          assert:
            - "Event.${ev}.sales_status == SOLD_OUT"
            - "QueueEntry.${qw}.status == REVOKED"
            - "Event.${ev}.tickets_sold_count == 1"

      - name: flag_fan_revokes_queue_holds_releases_seats
        grounds:
          - state_machines.Fan.VERIFIED_to_FLAGGED
          - state_machines.QueueEntry.OFFERED_to_REVOKED
          - calculations.bot_risk_score
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (queue-join risk recompute): a queue join recomputes
          risk_score, that flip drives Fan VERIFIED->FLAGGED, and that transition revokes the fan's
          live OFFERED/WAITING entries (and releases their reserved seats) — distinct origin from the pay cascade.
        test_recipe:
          setup:
            - "Fan F registered VERIFIED on unique device dev-f; three other fans then register on dev-f (so F's shared count becomes 3); F has made two WAITING queue joins in the velocity window."
          setup_api_calls:
            - call: "POST /events"
              payload: { title: "E", venue_capacity: 100, presale_code: "S", face_value_cents: 10000, resale_cap_pct: 110 }
              as: PromoterAdmin
              captures: { ev: $.data.id, ev_v: $.data.version }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "FLOOR", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "MEZZ", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier2: $.data.id }
            - call: "POST /price-tiers"
              payload: { event_id: "${ev}", name: "BALC", allocation: 50, base_multiplier_bps: 10000 }
              as: PromoterAdmin
              captures: { tier3: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
              payload: { email: "f@x.com", full_name: "F", device_fingerprint: "dev-f" }
              as: Anonymous
              captures: { ff: $.data.id }
            - call: "POST /fans/${ff}/verify"
              payload: {}
              as: Fan
              as_user_id: "${ff}"
            - call: "POST /fans"
              payload: { email: "f2@x.com", full_name: "F2", device_fingerprint: "dev-f" }
              as: Anonymous
            - call: "POST /fans"
              payload: { email: "f3@x.com", full_name: "F3", device_fingerprint: "dev-f" }
              as: Anonymous
            - call: "POST /fans"
              payload: { email: "f4@x.com", full_name: "F4", device_fingerprint: "dev-f" }
              as: Anonymous
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${ff}", tier_id: "${tier}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${ff}"
              captures: { qf1: $.data.id }
            - call: "POST /queue-entries"
              payload: { event_id: "${ev}", fan_id: "${ff}", tier_id: "${tier2}", presale_code_used: "S", requested_qty: 1 }
              as: Fan
              as_user_id: "${ff}"
              captures: { qf2: $.data.id }
          trigger:
