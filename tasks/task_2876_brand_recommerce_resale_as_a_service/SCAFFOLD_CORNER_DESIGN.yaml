      - name: logical_clock_defaults_and_then_stamps_every_write
        claim_type: action_endpoint
        grounds:
          - global_constants.DEFAULT_CLOCK_UTC
          - endpoints[POST /recommerce/_clock/set_current_utc]
          - entities.Customer.created_at
        distinguishing_aspect: "Before any clock call the server is at 2026-08-01T00:00:00Z, so the first customer's created_at is exactly that; after the clock is moved to 2026-08-05T06:30:00Z every new row and every state stamp uses the new instant rather than wall time, and the earlier row's created_at is untouched."
        test_recipe:
          setup:
            - "A pristine server with no clock call yet."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { c1_id: "$.data.id", c1_created: "$.data.created_at", c1_updated: "$.data.updated_at", c1_ver: "$.data.version" }
            - call: "POST /recommerce/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:30:00Z" }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { clk: "$.data.current_utc" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${c1_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { ti_created: "$.data.created_at", ti_deadline: "$.data.receive_deadline_at" }
            - call: "GET /recommerce/customers/${c1_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { c1_created_again: "$.data.created_at", c1_ver_again: "$.data.version" }
          assert:
            - "${c1_created} == 2026-08-01T00:00:00Z and ${c1_updated} == 2026-08-01T00:00:00Z with ${c1_ver} == 1  # DEFAULT_CLOCK_UTC applies before any clock call"
            - "${clk} == 2026-08-05T06:30:00Z and the endpoint answers 200 for a MerchandisingManager — every role may move the clock"
            - "${ti_created} == 2026-08-05T06:30:00Z and ${ti_deadline} == 2026-08-26T06:30:00Z  # 21 days from the new logical instant, preserving the time of day"
