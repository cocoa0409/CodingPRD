              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { o1: $.data.id }
            - call: "POST /dealer-orders/${o1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d}"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${s}" }
