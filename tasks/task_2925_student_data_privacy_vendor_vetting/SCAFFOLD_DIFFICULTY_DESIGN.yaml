              payload: { vendor_id: "${v_id}", incident_type: "SUBPROCESSOR_BREACH", detected_at: "2026-08-08T00:00:00Z", affected_student_count: 5, max_data_tier: 1 }
              as: PrivacyOfficeAdmin
