              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
