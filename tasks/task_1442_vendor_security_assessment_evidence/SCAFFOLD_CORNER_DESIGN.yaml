  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: version_pinning_template_on_cycle_issuance
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile, state_machines.AssessmentCycle.DRAFT_to_ISSUED, entities.AssessmentCycle.fields.template_version]
        distinguishing_aspect: "Issuance pins cycle.template_version to the template's published_version at that instant; a later re-publication (published_version 2) does not change the pinned value — scoring uses the pinned item set."
        test_recipe:
          setup: ["Template published (v1), cycle issued; template revised and republished (v2) with different weights; scoring still uses v1 weights"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/questionnaire-templates/${t_id}/revise"
              payload: {}
              as: RiskAnalyst
              captures: { t2_id: $.data.id }
          trigger:
            - call: "GET /vsa/cycles/${c_id}"
              payload: {}
              as: RiskAnalyst
              captures: { pinned_ver: $.data.template_version }
          assert:
            - "AssessmentCycle.${c_id}.template_version == 1 (pinned at issuance)"
            - "the revised DRAFT template ${t2_id} exists independently and does not perturb the pinned cycle"

      - name: scheduled_deferred_clock_default
        claim_type: side_effect_coverage
        grounds: ["endpoints[POST /vsa/_clock/set_current_utc]", state_machines.RiskAcceptance.APPROVED_to_EXPIRED]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z; deadlines computed at issuance use that default, making sweeps deterministic."
        test_recipe:
          setup: ["No clock-set call issued; cycle issued at default time"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
          assert:
            - "AssessmentCycle.${c_id}.issued_at == 2026-08-01T00:00:00Z (default clock)"
            - "AssessmentCycle.${c_id}.response_due_at == 2026-09-15T00:00:00Z (TIER_1 +45d)"

