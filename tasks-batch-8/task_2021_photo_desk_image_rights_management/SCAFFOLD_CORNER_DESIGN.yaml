    instances:
      - name: photographer_cannot_clear_image
        claim_type: role_denial
        grounds: [roles.RightsManager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Clearing is RightsManager-exclusive: a Photographer calling clear is rejected with ERR_FORBIDDEN."
        test_recipe:
