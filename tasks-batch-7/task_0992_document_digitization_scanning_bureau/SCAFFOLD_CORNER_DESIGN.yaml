        distinguishing_aspect: "The disposition branch is pinned by return_requested: begin-destruction on a return-requested box and mark-returned on a non-requested box are both 409s with distinct codes."
        test_recipe:
          setup:
            - "delivered batch (retention 30) with two STORED boxes A and B; box A return-requested (STORED -> AWAITING_DISPOSITION); clock advanced past disposition_at (retention 5 in fixture) so box B is swept to AWAITING_DISPOSITION"
