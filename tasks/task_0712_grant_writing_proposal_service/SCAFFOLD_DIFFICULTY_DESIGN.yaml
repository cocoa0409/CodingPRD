  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_owner_on_request_changes_nonexistent_proposal
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Category pair = existence (priority 3, ERR_NOT_FOUND) vs business_referential ownership
          (priority 4, ERR_NOT_RESOURCE_OWNER). A ClientContact who does not own a NON-EXISTENT
          proposal triggers both; priority 3 wins so ERR_NOT_FOUND is returned, not ERR_NOT_RESOURCE_OWNER.
          Distinct category pair from instance #2 (state vs business_temporal).
        test_recipe:
          setup:
            - "A valid ClientContact identity exists (a client created) but no proposal with the targeted id exists."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Prio Org", ein: "11-1110009", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c9@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /grant-desk/proposals/00000000-0000-4000-8000-000000000000/request-changes"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: invalid_state_beats_temporal_on_withdraw_already_accepted_submission
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OPPORTUNITY_CLOSED]
        distinguishing_aspect: |
          Category pair = state (priority 6, ERR_INVALID_STATE) vs business_temporal (priority 9,
          ERR_OPPORTUNITY_CLOSED). Withdrawing a Submission that is already ACCEPTED while the clock
          is also past the opportunity deadline triggers both; the lower-numbered state check wins so
          ERR_INVALID_STATE is returned. Distinct category pair from instance #1 (existence vs owner).
