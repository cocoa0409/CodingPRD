# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Companion to SCAFFOLD.yaml for
#   task_2990_retiree_medical_medicare_coordination
#
# Nine rule_id blocks, 19 instances. Every instance grounds only in elements
# already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file leaves the
# declared behaviour identical.
#
# Shared fixture vocabulary used across instances (values are pinned literals):
#   PlanYear 2027 - open enrollment [2026-10-15T00:00:00Z, 2026-11-15T00:00:00Z),
#     coverage_start 2027-01-01T00:00:00Z, hra_credit_pre_medicare_cents 185000,
#     hra_credit_medicare_cents 209500, carryover_cap_pct 0.5,
#     premium_grace_period_days 31, reinstatement_window_days 60,
#     notice_lead_days 60, discount_rate_bps 500,
#     assumed_annual_subsidy_cents 240000, assumed_payment_years 20
#   PlanOption PRE65-CORE  - PRE_MEDICARE_GROUP,   monthly_premium_cents 74500,
#     requires_medicare_part_b false, subsidy_vehicle NONE
#   PlanOption MED-WRAP    - MEDICARE_GROUP_WRAP,  monthly_premium_cents 32900,
#     requires_medicare_part_b true,  subsidy_vehicle EGWP
#   Retiree R1 "Rosa Alvarez"     birth 1963-06-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 150
#     -> GRANDFATHERED_A, age 63, service_years 12, points 75  -> ELIGIBLE
#   Retiree R2 "Walter Nkemelu"   birth 1958-03-01, hire 1988-09-01,
#     retirement 2023-03-31, credited_service_months 402, MEDICARE_ENROLLED,
#     part B 2023-04-01, other_group_coverage_employer_size 25, active
#     -> GRANDFATHERED_A, age 65, service_years 33, points 98 -> ELIGIBLE
#   Retiree R3 "Priya Raghunathan" birth 1963-06-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 143
#     -> GRANDFATHERED_A, age 63, service_years 11, points 74 -> INELIGIBLE
#   Retiree R4 "Bertrand Okonkwo"  birth 1961-01-01, hire 1990-06-01,
#     retirement 2026-12-31, credited_service_months 402
#     -> GRANDFATHERED_A, age 65, service_years 33, points 98 -> ELIGIBLE
#
# Segregation-of-duties user ids (opaque roles): admin-01, analyst-01,
# analyst-02, counselor-01, counselor-02, hra-admin-01, hra-admin-02,
# billing-01, actuary-01, compliance-01.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: hra_claim_provisional_versus_final_eligible_amount
        grounds:
          - calculations.hra_claim_eligible_amount
          - entities.ReimbursementClaim.fields.provisional_eligible_cents
          - entities.ReimbursementClaim.fields.eligible_cents
          - entities.HraAccount.fields.pending_hold_cents
          - entities.HraAccount.fields.available_balance_cents
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity domain ReimbursementClaim: the PROVISIONAL variant caps the
          submitted 30000 cents only against the account balance and yields
          30000, while the FINAL variant applies the DENTAL_VISION_PREMIUM
          50% category cap first and yields 15000 from byte-identical claim
          data, so provisional_eligible_cents and eligible_cents differ by
          exactly 15000 on the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z."
            - "PlanYear 2027 in status OPEN with hra_credit_medicare_cents 209500 and carryover_cap_pct 0.5."
            - "Retiree R2 exists with medicare_status MEDICARE_ENROLLED and a CERTIFIED, ELIGIBLE determination for plan year 2027."
            - "An OPEN HraAccount for (R2, 2027) with covered_months 7, so annual_credit_cents 122206, funded_cents 122206 and available_balance_cents 122206; the four spent buckets are all 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Walter Nkemelu", birth_date: "1958-03-01", hire_date: "1988-09-01", retirement_date: "2023-03-31", credited_service_months: 402, medicare_status: "MEDICARE_ENROLLED", medicare_part_b_effective_date: "2023-04-01", other_group_coverage_employer_size: 25, active_employment_flag: true }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r2_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det2_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det2_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", covered_months: 7 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra2_id: $.data.id, hra2_v: $.data.version }
          trigger:
            - call: "POST /retiree-benefits/reimbursement-claims"
              payload: { hra_account_id: "${hra2_id}", expense_category: "DENTAL_VISION_PREMIUM", service_date: "2027-03-10", submitted_cents: 30000, documentation_reference: "RCPT-2027-0310-A", expected_hra_account_version: "${hra2_v}" }
              as: Retiree
              as_user_id: "${r2_id}"
              captures: { clm_id: $.data.id }
            - call: "POST /retiree-benefits/reimbursement-claims/${clm_id}/review"
              payload: { decision: "APPROVE" }
              as: HraAdministrator
              as_user_id: "hra-admin-02"
          assert:
            - "Immediately after creation ReimbursementClaim.${clm_id}.provisional_eligible_cents == 30000"
            - "Immediately after creation ReimbursementClaim.${clm_id}.eligible_cents == 30000"
            - "Immediately after creation HraAccount.${hra2_id}.pending_hold_cents == 30000"
            - "Immediately after creation HraAccount.${hra2_id}.available_balance_cents == 92206"
            - "After the APPROVE review ReimbursementClaim.${clm_id}.eligible_cents == 15000"
            - "After the APPROVE review ReimbursementClaim.${clm_id}.provisional_eligible_cents is still 30000"
            - "After the APPROVE review HraAccount.${hra2_id}.pending_hold_cents == 15000"
            - "After the APPROVE review HraAccount.${hra2_id}.available_balance_cents == 107206"
            - "HraAccount.${hra2_id}.funded_cents == 122206 both before and after the review"
            - "hra_ledger_conservation holds after the review: 122206 == 107206 + 15000 + 0 + 0 + 0"

      - name: liability_valuation_projected_unit_credit_versus_full_eligibility
        grounds:
          - calculations.retiree_medical_liability_valuation
          - entities.PlanYear.fields.liability_method
          - entities.PlanYear.fields.apbo_total_cents
          - entities.PlanYear.fields.epbo_total_cents
          - entities.PlanYear.fields.service_cost_total_cents
          - entities.PlanYear.fields.measured_retiree_count
        distinguishing_aspect: |
          Entity domain PlanYear: run against the identical one-retiree cohort
          (R1, GRANDFATHERED_A, 150 credited service months) the
          PROJECTED_UNIT_CREDIT variant attributes over 20 years and writes
          apbo_total_cents 2742856, while ATTRIBUTION_TO_FULL_ELIGIBILITY
          attributes over 15 years and writes 3657142 - a delta of exactly
          914286 cents with epbo_total_cents unchanged at 4571428.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z."
            - "PlanYear 2027 in status OPEN with discount_rate_bps 500, assumed_annual_subsidy_cents 240000 and assumed_payment_years 20."
            - "Exactly one retiree, R1, holds a CERTIFIED determination with outcome ELIGIBLE for plan year 2027; no other retiree exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /retiree-benefits/plan-years/${py_id}/liability-valuation"
              payload: { method: "PROJECTED_UNIT_CREDIT" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /retiree-benefits/plan-years/${py_id}/liability-valuation"
              payload: { method: "ATTRIBUTION_TO_FULL_ELIGIBILITY" }
              as: Actuary
              as_user_id: "actuary-01"
          assert:
            - "After the first valuation PlanYear.${py_id}.liability_method == PROJECTED_UNIT_CREDIT"
            - "After the first valuation PlanYear.${py_id}.measured_retiree_count == 1"
            - "After the first valuation PlanYear.${py_id}.epbo_total_cents == 4571428"
            - "After the first valuation PlanYear.${py_id}.apbo_total_cents == 2742856"
            - "After the first valuation PlanYear.${py_id}.service_cost_total_cents == 228571"
            - "After the second valuation PlanYear.${py_id}.liability_method == ATTRIBUTION_TO_FULL_ELIGIBILITY"
            - "After the second valuation PlanYear.${py_id}.apbo_total_cents == 3657142"
            - "After the second valuation PlanYear.${py_id}.epbo_total_cents is still 4571428"
            - "After the second valuation PlanYear.${py_id}.service_cost_total_cents is still 228571"
            - "3657142 - 2742856 == 914286, so the two variants disagree on identical input data"
            - "PlanYear.${py_id}.liability_valued_at == 2026-10-20T00:00:00.000Z after both calls"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: hra_funding_monthly_floor_before_multiply
        grounds:
          - calculations.hra_annual_funding_and_carryover
          - entities.PlanYear.fields.hra_credit_medicare_cents
          - entities.HraAccount.fields.covered_months
          - entities.HraAccount.fields.annual_credit_cents
          - entities.HraAccount.fields.funded_cents
          - entities.HraAccount.fields.available_balance_cents
        distinguishing_aspect: |
          Mode (b) rounding-order divergence: with hra_credit_medicare_cents
          209500 and covered_months 7 the pinned order floor(209500/12)=17458
          then x7 yields annual_credit_cents 122206, whereas the plausible
          alternative floor(209500*7/12) yields 122208, so a 2-cent gap
          falsifies any implementation that multiplies before flooring.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z."
            - "PlanYear 2027 in status OPEN with hra_credit_pre_medicare_cents 185000 and hra_credit_medicare_cents 209500."
            - "Retiree R2 (MEDICARE_ENROLLED) and retiree R1 (PRE_MEDICARE) each hold a CERTIFIED, ELIGIBLE determination for plan year 2027."
            - "Neither retiree yet has an HraAccount for plan year 2027."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Walter Nkemelu", birth_date: "1958-03-01", hire_date: "1988-09-01", retirement_date: "2023-03-31", credited_service_months: 402, medicare_status: "MEDICARE_ENROLLED", medicare_part_b_effective_date: "2023-04-01", other_group_coverage_employer_size: 25, active_employment_flag: true }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r2_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det2_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det2_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", covered_months: 7 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra2_id: $.data.id }
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", covered_months: 12 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra1_id: $.data.id }
          assert:
            - "HraAccount.${hra2_id}.annual_credit_cents == 122206 (not 122208)"
            - "HraAccount.${hra2_id}.carryover_in_cents == 0"
            - "HraAccount.${hra2_id}.funded_cents == 122206"
            - "HraAccount.${hra2_id}.available_balance_cents == 122206"
            - "HraAccount.${hra2_id}.pending_hold_cents == 0 and substantiated_paid_cents == 0 and premium_offset_cents == 0 and forfeited_cents == 0"
            - "HraAccount.${hra2_id}.status == OPEN"
            - "HraAccount.${hra1_id}.annual_credit_cents == 184992 (not 185000), because the pre-Medicare credit 185000 also loses cents to the per-month floor"
            - "HraAccount.${hra1_id}.funded_cents == 184992 and available_balance_cents == 184992"

      - name: premium_invoice_fee_exclusive_and_service_tiered_subsidy
        grounds:
          - calculations.premium_invoice_assembly
          - entities.PremiumInvoice.fields.admin_fee_cents
          - entities.PremiumInvoice.fields.gross_premium_cents
          - entities.PremiumInvoice.fields.employer_subsidy_bps
          - entities.PremiumInvoice.fields.retiree_share_cents
          - entities.PremiumInvoice.fields.net_due_cents
          - entities.Enrollment.fields.monthly_retiree_premium_cents
        distinguishing_aspect: |
          Mode (c) evaluation-order and branch-combination divergence: the
          administrative fee is fee-exclusive, so from monthly_premium_cents
          74500 admin_fee_cents is 2607 and gross_premium_cents 77107 rather
          than the fixed-point reading 2702 / 77202; and against that single
          gross figure two GRANDFATHERED_A retirees receive 8000 bps
          (service_years 12) versus 9000 bps (service_years 33), producing
          retiree_share_cents 15422 and 7711 on the same plan option.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z, inside the annual open enrollment window."
            - "PlanYear 2027 in status OPEN with premium_grace_period_days 31."
            - "PlanOption PRE65-CORE is ACTIVE with monthly_premium_cents 74500 and subsidy_vehicle NONE."
            - "Retiree R1 (GRANDFATHERED_A, service_years 12) and retiree R4 (GRANDFATHERED_A, service_years 33) each hold a CERTIFIED, ELIGIBLE determination and a PENDING Enrollment on PRE65-CORE with coverage_effective_date 2027-01-01T00:00:00Z."
            - "Neither retiree has an HraAccount, so hra_applied_cents must be 0 on both invoices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "PRE65-CORE", coverage_class: "PRE_MEDICARE_GROUP", monthly_premium_cents: 74500, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B", "STANDARD_C"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_pre_id: $.data.id }
            - call: "POST /retiree-benefits/plan-options/${po_pre_id}/activate"
              payload: {}
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/election-events"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", requested_plan_option_id: "${po_pre_id}", event_type: "ANNUAL_OPEN", event_date: "2026-10-20" }
              as: EnrollmentCounselor
              as_user_id: "counselor-01"
              captures: { ee1_id: $.data.id }
            - call: "POST /retiree-benefits/election-events/${ee1_id}/review"
              payload: {}
              as: EnrollmentCounselor
              as_user_id: "counselor-02"
            - call: "POST /retiree-benefits/election-events/${ee1_id}/decision"
              payload: { decision: "APPROVE" }
              as: EnrollmentCounselor
              as_user_id: "counselor-02"
              captures: { enr1_id: $.data.resulting_enrollment_id }
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Bertrand Okonkwo", birth_date: "1961-01-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 402 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r4_id: $.data.id, r4_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r4_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r4_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det4_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det4_id}/certify"
              payload: {}
