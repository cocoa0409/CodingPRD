              as: FlowManager
          assert:
            - "ASSIGNED slot multiset invariant: before == after == {13:00, 13:10, 13:20, 13:30, 13:40}; count(ASSIGNED) == 5 on both sides"
            - "f1_cta == 2026-09-15T13:30:00Z with f1_delay == 25; f3_cta == 2026-09-15T13:00:00Z with f3_delay == 0"
            - "two SUBSTITUTION_SWAP transactions exist with delay_delta +25 (F1) and -10 (F3)"
            - "ledger(${op_a}).attributed_delay_minutes == 25 (delay is NOT conserved; only the slot inventory is)"

      - name: cancel_restores_delay_ledgers
        grounds:
          - calculations.provisional_vs_final_delay
          - state_machines.TrafficManagementInitiative.ACTIVE_to_CANCELLED
          - entities.OperatorDelayLedger.fields.reversed_delay_minutes
        distinguishing_aspect: |
          Conserved quantity: the global delay-delta sum. The forward actions (initial
          assignment + substitution) paired with the compensating cancel MUST leave
          SUM(SlotTransaction.delay_delta_minutes) == 0 over the whole program log, with
          every operator ledger attributed == 0 and cumulative_delay_minutes back at its
          pre-activation value. Distinct conserved quantity from
          substitution_conserves_slot_inventory.
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, window 13:00-15:00Z; flights F1(13:05),F2(13:10),F3(13:20) op_a; F4(13:15),F5(13:26) op_b"
            - "A substitution F1<->F3 has already run (op_a attributed now 25; program total delay 44)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
