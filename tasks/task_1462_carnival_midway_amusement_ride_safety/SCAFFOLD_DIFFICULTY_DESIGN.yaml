scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Permit vs OperatingDay)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_estimated_vs_final_diverge_on_inventory_change
        grounds:
          - calculations.permit_fee
          - state_machines.Fair.SETUP_to_PERMIT_REQUESTED
          - state_machines.Permit.PENDING_to_APPROVED
          - entities.Permit.fields.estimated_fee_cents
          - entities.Permit.fields.final_fee_cents
        distinguishing_aspect: |
          Entity domain: Permit/Fair. The estimated variant freezes the qualifying-ride
          set at request time (1 THRILL ride -> 25000 + 14000 = 39000); the final variant
          re-evaluates at approval time after a FAMILY ride is added and verified
          (25000 + 14000 + 9000 = 48000), so the two variants of the same fee rule
          produce different values for the same permit.
        test_recipe:
          setup:
            - "Fair (setup 2026-08-01, opening 2026-08-03, closing 2026-08-05, teardown 2026-08-07) with SUPERVISOR sup, CREW crew, OPERATOR op, CLERK clerk"
            - "Ride r1 THRILL SETUP_VERIFIED; permit requested (estimated fee frozen with one qualifying ride)"
            - "Ride r2 FAMILY created after the request and SETUP_VERIFIED while fair is PERMIT_REQUESTED"
            - "FAIR_WIDE appointment on 2026-08-02 completed PASS by inspector 1; clock at 2026-08-02T10:00:00Z"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway A", operator_company_name: "ShowCo", location: "Lot 7", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 500 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup One", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew One", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp One", license_number: "LIC-D1-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp Two", license_number: "LIC-D1-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-D1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 3, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride1_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 12, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride1_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id", est_fee: "$.data.estimated_fee_cents" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Swings", manufacturer: "MFG", model: "S2", serial_number: "SN-D1-2", ride_class: "FAMILY", capacity_per_cycle: 8, min_rider_height_in: 40, max_rider_height_in: 84, wind_limit_mph: 25, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride2_id: "$.data.id" } }
            - { call: "POST /midway/rides/${ride2_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
          trigger:
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}", captures: { final_fee: "$.data.final_fee_cents", billable: "$.data.billable_ride_count", fails: "$.data.reinspection_failure_count" } }
          assert:
            - "Permit.${permit_id}.estimated_fee_cents == 39000"
            - "Permit.${permit_id}.final_fee_cents == 48000"
            - "Permit.${permit_id}.billable_ride_count == 2"
            - "Permit.${permit_id}.reinspection_failure_count == 0"
            - "Fair.${fair_id}.status == PERMITTED"
            - "Ride.${ride1_id}.license_status == LICENSED and Ride.${ride2_id}.license_status == LICENSED"

      - name: settlement_projected_vs_recognized_diverge_on_breakage
        grounds:
          - calculations.daily_settlement
          - state_machines.OperatingDay.OPEN_to_CLOSED
          - state_machines.OperatingDay.CLOSED_to_RECONCILED
          - entities.OperatingDay.fields.projected_revenue_cents
          - entities.OperatingDay.fields.recognized_revenue_cents
        distinguishing_aspect: |
          Entity domain: OperatingDay (different from the Permit domain of the sibling
          instance). One bundle sale of 10 credits at 100 (subtotal 990, fee 59, total
          1049) with 3 credits redeemed: the projected variant recognizes the full 1049
          at close-gates, while the chronological recognized variant yields
          59 + round_half_up(990 * 3/10) = 356, leaving breakage 693 — same sales data,
          two defensible algorithms, different revenue.
        test_recipe:
          setup:
            - "Permitted fair with licensed THRILL ride r1 (capacity 4, interval 3), certified operator op, clerk clerk"
            - "OperatingDay 2026-08-03 posture OPEN (checklist countersigned), product BUNDLE base 100"
            - "Sale s1: 10 credits (total 1049); 3 redemptions boarded on one completed cycle (credits_redeemed 3, credits_remaining 7)"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway B", operator_company_name: "ShowCo", location: "Lot 9", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 500 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup B", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Op B", functions: ["OPERATOR"] }, as: FairManager, as_user_id: "${sup_id}", captures: { op_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Clerk B", functions: ["CLERK"] }, as: FairManager, as_user_id: "${sup_id}", captures: { clerk_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew B", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp B1", license_number: "LIC-D2-1" }, as: StateProgramAdmin, captures: { insp1_id: "$.data.id" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp B2", license_number: "LIC-D2-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-D2-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 3, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "POST /midway/operator-certifications", payload: { staff_id: "${op_id}", ride_class: "THRILL", issued_on: "2026-08-01", expires_on: "2026-12-31" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_id}", date: "2026-08-03", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { day_id: "$.data.id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days/${day_id}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}", items_total: 5 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_id: "$.data.id" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/submit", payload: { items_passed: 5 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/countersign", payload: { expected_checklist_version: "${chk_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/operating-days/${day_id}/open-gates", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_id}", name: "Credits", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { prod_id: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 10, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-cycles", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { cyc_id: "$.data.id" } }
            - { call: "POST /midway/ride-cycles/${cyc_id}/load", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-cycles/${cyc_id}/dispatch", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ride-cycles/${cyc_id}/complete", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /midway/operating-days/${day_id}/close-gates", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { projected: "$.data.projected_revenue_cents", gross: "$.data.gross_sales_cents", voided: "$.data.voided_cents" } }
            - { call: "POST /midway/operating-days/${day_id}/reconcile", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { recognized: "$.data.recognized_revenue_cents", breakage: "$.data.breakage_cents", flagged: "$.data.reconciliation_flagged" } }
          assert:
            - "OperatingDay.${day_id}.gross_sales_cents == 1049"
            - "OperatingDay.${day_id}.voided_cents == 0"
            - "OperatingDay.${day_id}.projected_revenue_cents == 1049"
            - "OperatingDay.${day_id}.recognized_revenue_cents == 356"
            - "OperatingDay.${day_id}.breakage_cents == 693"
            - "OperatingDay.${day_id}.reconciliation_flagged == false"
            - "TicketSale.${sale_id}.credits_forfeited == 7 and credits_remaining == 0 and status == EXPIRED"

  # =================================================================
  # Rule 2 — combinatorial_formula (three different modes a/b/c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_tiers_surcharge_and_cap_eval_order
        grounds:
          - calculations.permit_fee
          - state_machines.InspectionAppointment.SCHEDULED_to_COMPLETED_FAIL
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with tiered class rates, a conditional
          reinspection surcharge, and a nested min() cap whose evaluation order is
          pinned (class rates summed first, surcharge next, cap last). One KIDDIE plus
          one EXTREME ride with one prior FAIR_WIDE failure must yield exactly
          min(25000 + 5000 + 20000 + 7500, 200000) = 57500.
        test_recipe:
          setup:
            - "Fair with KIDDIE ride k1 and EXTREME ride k2 both SETUP_VERIFIED before the permit request"
            - "Permit requested (estimated 50000); first FAIR_WIDE appointment FAIL (inspector 1), second PASS (inspector 2, chosen by the load-based selector)"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway C", operator_company_name: "ShowCo", location: "Lot 3", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup C", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew C", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp C1", license_number: "LIC-C1-1" }, as: StateProgramAdmin, captures: { insp1_id: "$.data.id" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp C2", license_number: "LIC-C1-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Kiddie Train", manufacturer: "MFG", model: "K1", serial_number: "SN-C1-1", ride_class: "KIDDIE", capacity_per_cycle: 6, min_rider_height_in: 30, max_rider_height_in: 60, wind_limit_mph: 35, cycle_inspection_interval: 10, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride1_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Drop Tower", manufacturer: "MFG", model: "E9", serial_number: "SN-C1-2", ride_class: "EXTREME", capacity_per_cycle: 4, min_rider_height_in: 52, max_rider_height_in: 84, wind_limit_mph: 20, cycle_inspection_interval: 2, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride2_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 12, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride1_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/rides/${ride2_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id", est_fee: "$.data.estimated_fee_cents" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt1_id: "$.data.id", appt1_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt1_id}/complete", payload: { outcome: "FAIL", findings: " restraint sensor fault" }, as: StateInspector, as_user_id: "${appt1_insp}" }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 13, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt2_id: "$.data.id", appt2_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/inspection-appointments/${appt2_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt2_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
          trigger:
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp1_id}", captures: { final_fee: "$.data.final_fee_cents", fails: "$.data.reinspection_failure_count" } }
          assert:
            - "Permit.${permit_id}.estimated_fee_cents == 50000"
            - "Permit.${permit_id}.reinspection_failure_count == 1"
            - "Permit.${permit_id}.final_fee_cents == 57500"
            - "InspectionAppointment.${appt2_id}.inspector_id == ${insp2_id} (load-based selector bypasses inspector 1 who already holds one appointment that date)"

      - name: bundle_marginal_tiers_with_per_unit_pre_rounding
        grounds:
          - calculations.credit_bundle_subtotal
          - entities.TicketSale.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the discounted per-unit price
          is rounded half-up BEFORE multiplying by the tier count. 30 credits at base 95
          must yield 9*95 + 15*round_half_up(85.5)=86 + 6*round_half_up(76.0)=76, i.e.
          855 + 1290 + 456 = 2601; a sum-then-round implementation produces 2600 or 2603.
        test_recipe:
          setup:
            - "Permitted fair with an OPEN operating day 2026-08-03 and a CREDIT_BUNDLE product at base_price_cents 95"
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway D", operator_company_name: "ShowCo", location: "Lot 4", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup D", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew D", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Clerk D", functions: ["CLERK"] }, as: FairManager, as_user_id: "${sup_id}", captures: { clerk_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Op D", functions: ["OPERATOR"] }, as: FairManager, as_user_id: "${sup_id}", captures: { op_id: "$.data.id" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp D1", license_number: "LIC-C2-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp D2", license_number: "LIC-C2-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
