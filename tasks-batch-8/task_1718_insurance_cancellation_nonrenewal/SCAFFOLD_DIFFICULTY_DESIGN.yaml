  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: dependencies across DIFFERENT entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_issuance_gated_on_profile_active
        grounds:
          - state_machines.StateFilingProfile.transitions
          - state_machines.CancellationCase.DRAFT_to_PENDING_APPROVAL
          - entities.Policy.fields.state_profile_id
        distinguishing_aspect: |
          Entity pair Policy -> StateFilingProfile: a policy can only be issued against an
          ACTIVE profile (DRAFT rejected with ERR_INVALID_STATE), and separately a
          CancellationCase cannot be opened unless the Policy is ACTIVE
          (ERR_POLICY_NOT_ACTIVE) — Policy issuance gated on profile state, cancellation
          gated on policy state: two links in one dependency chain.
        test_recipe:
          setup:
            - "KS profile exists in DRAFT (not activated); policyholder exists"
          setup_api_calls:
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "KS", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ks: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ks Insured", mailing_address: "1 Ks St", email: "ks@x.com" }
              as: Underwriter
              captures: { ph_ks: $.data.id }
          trigger:
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ks}", state_profile_id: "${prof_ks}", policy_number: "P-KS-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { err_ks: $.data.error_id }
            - call: "POST /carrier/state-profiles/${prof_ks}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ks}", state_profile_id: "${prof_ks}", policy_number: "P-KS-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_ks: $.data.id }
          assert:
            - "First issuance error_id == ERR_INVALID_STATE (profile DRAFT blocks Policy creation — pair Policy->StateFilingProfile)"
            - "After activation, issuance succeeds: Policy.${pol_ks}.status == ACTIVE"

      - name: profile_retire_gated_on_live_policy_references
        grounds:
          - state_machines.StateFilingProfile.ACTIVE_to_RETIRED
          - errors[ERR_STATE_PROFILE_IN_USE]
          - entities.RegulatoryReport.fields.state_profile_id
        distinguishing_aspect: |
          Entity pair StateFilingProfile -> Policy (distinct from Policy ->
          StateFilingProfile above): retiring an ACTIVE profile is rejected
          ERR_STATE_PROFILE_IN_USE while any policy with status IN {ACTIVE,
          CANCEL_PENDING, NONRENEWAL_PENDING} references it, and succeeds once the only
          referencing policy reaches terminal CANCELLED.
        test_recipe:
          setup:
            - "ACTIVE MO profile; one MO policy ACTIVE then cancelled EFFECTIVE 2026-08-20"
            - "Retire attempted while policy ACTIVE (fails), then again after policy CANCELLED (succeeds)"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "MO", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_mo: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_mo}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Mo Insured", mailing_address: "1 Mo St", email: "mo@x.com" }
              as: Underwriter
              captures: { ph_mo: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_mo}", state_profile_id: "${prof_mo}", policy_number: "P-MO-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_mo: $.data.id, pol_mo_v: $.data.version }
            - call: "POST /carrier/state-profiles/${prof_mo}/retire"
              payload: {}
              as: ComplianceOfficer
              captures: { err_mo: $.data.error_id }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_mo}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_mo_v}" }
              as: Underwriter
              captures: { case_mo: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_mo}/approve"
              payload: { scheduled_effective_date: "2026-08-20" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_mo}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-01", tracking_code: "T-MO-1" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /carrier/state-profiles/${prof_mo}/retire"
              payload: {}
              as: ComplianceOfficer
              captures: { prof_mo_status: $.data.status }
          assert:
            - "First retire error_id == ERR_STATE_PROFILE_IN_USE with http 409 (live ACTIVE policy references profile)"
            - "After sweep makes the policy CANCELLED (terminal), retire succeeds: captured status == RETIRED"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: open_cancellation_case_excludes_second_case_same_policy
        grounds:
          - state_machines.CancellationCase.DRAFT_to_PENDING_APPROVAL
          - errors[ERR_CANCELLATION_ALREADY_OPEN]
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics = state-set occupation on the Policy resource (not date
          arithmetic): a CancellationCase occupies its policy while status IN {DRAFT,
          PENDING_APPROVAL, APPROVED, NOTICE_SENT}; a second case create is rejected
          ERR_CANCELLATION_ALREADY_OPEN, but once the first reaches terminal WITHDRAWN
          the occupation releases and a fresh case succeeds — adjacency (terminal ->
          new open) is permitted, overlap is not.
        test_recipe:
          setup:
            - "ACTIVE NE profile; ACTIVE NE policy; first NONPAYMENT case open (PENDING_APPROVAL), then withdrawn"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
