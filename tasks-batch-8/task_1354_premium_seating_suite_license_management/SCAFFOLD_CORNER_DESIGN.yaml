            - "TransferRequest == COMPLETED; original agreement == TRANSFERRED"
            - "Successor agreement exists: account_id == ${ac2}, status == ACTIVE, fee_schedule_cents == [12360000] (the remaining tail; term_seasons == 1 covering S2)"
            - "Suite stays LICENSED with current_agreement_id == the successor's id (no AVAILABLE interlude)"

      - name: transfer_sublease_complete_keeps_agreement_active
        claim_type: side_effect_execution
        grounds: ["state_machines.TransferRequest.APPROVED_to_COMPLETED", "entities.LicenseAgreement.fields.active_sublease_account_id"]
        distinguishing_aspect: "SUBLEASE completion takes the other branch: the agreement stays ACTIVE under the original account and active_sublease_account_id is set to the sublessee; fee is max(50000, 5% of asking 8000000) == 400000."
        test_recipe:
          setup: ["Active agreement (ac1), sublessee account ac2 ACTIVE (CORPORATE); SUBLEASE transfer APPROVED and its 400000 TRANSFER_FEE invoice PAID"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac1: $.data.id } }
            - { call: "POST /api/accounts/${ac1}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/accounts", payload: { legal_name: "Sub Co", account_type: CORPORATE, tax_id: "T-600", billing_email: "ap@sub.example" }, as: PremiumSalesRep, captures: { ac2: $.data.id } }
            - { call: "POST /api/accounts/${ac2}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac1}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac1}" }
            - { call: "POST /api/transfer-requests", payload: { agreement_id: "${ag}", from_account_id: "${ac1}", to_account_id: "${ac2}", transfer_type: SUBLEASE, asking_price_cents: 8000000 }, as: AccountHolder, as_user_id: "${ac1}", captures: { tr: $.data.id } }
            - { call: "POST /api/transfer-requests/${tr}/set_status", payload: { target_status: "UNDER_REVIEW" }, as: PremiumSalesRep, captures: { fee: $.data.transfer_fee_cents } }
            - { call: "POST /api/transfer-requests/${tr}/set_status", payload: { target_status: "APPROVED" }, as: PremiumSalesRep }
            - { call: "GET /api/invoices", payload: { account_id: "${ac1}", invoice_type: "TRANSFER_FEE" }, as: FinanceController, captures: { tf: "$.data[0].id" } }
            - { call: "POST /api/payments", payload: { account_id: "${ac1}", amount_cents: 400000, method: WIRE, allocations: [ { invoice_id: "${tf}", amount_cents: 400000 } ] }, as: FinanceController, captures: { p: $.data.id } }
            - { call: "POST /api/payments/${p}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController }
          trigger:
            - { call: "POST /api/transfer-requests/${tr}/complete", payload: {}, as: PremiumSalesRep, captures: { tst: $.data.status } }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { agst: $.data.status, sub: $.data.active_sublease_account_id, owner: $.data.account_id } }
          assert:
            - "transfer_fee_cents == 400000 (SUBLEASE branch: 5% of asking 8000000, above the 50000 floor)"
            - "After complete: agreement status stays ACTIVE, account_id still ${ac1}, active_sublease_account_id == ${ac2}"
            - "Suite stays LICENSED under the same agreement (no successor agreement is created for SUBLEASE)"

      - name: agreement_renewed_at_final_season_settle
        claim_type: side_effect_execution
        grounds: ["state_machines.LicenseAgreement.EXPIRING_to_RENEWED", "state_machines.LicenseAgreement.RENEWED"]
        distinguishing_aspect: "Term bookkeeping with an accepted renewal: settle of the last covered season moves the agreement to RENEWED (not EXPIRED) and the suite stays available for the DRAFT renewal agreement (which has not executed yet)."
        test_recipe:
          setup: ["Term-1 agreement ACTIVE on GOLD suite (license fee PAID); renewal offer for S2 ACCEPTED at 2026-12-10 (creates DRAFT renewal agreement and sets renewal_agreement_id); clock 2027-02-20; S1 has no events"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way" }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
