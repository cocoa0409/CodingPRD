            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 2860", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
