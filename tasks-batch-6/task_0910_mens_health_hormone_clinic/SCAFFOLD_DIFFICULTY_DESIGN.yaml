            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { base_panel: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${base_panel}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${base_panel}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${base_panel}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${base_panel}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "MONITORING" }, as: Clinician, as_user_id: "${clinician_id}", captures: { mon_panel: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${mon_panel}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${mon_panel}/result", payload: { total_testosterone_ng_dl: 500, psa_ng_ml: 1.5, hematocrit_pct: 56.0, drawn_at: "2026-04-28T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${mon_panel}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "GET /clinic/prescriptions/${rx_id}", payload: {}, as: ClinicAdmin, captures: { rx_v: "$.data.version" } }
          trigger:
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PRESCRIPTION_SUSPENDED"
            - "http_status == 409"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: telehealth_clinician_buffer_overlap
        grounds:
          - validations[priority=7.0]
          - entities.TelehealthVisit.fields.start_at
          - errors[ERR_CLINICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Buffer interval semantics on Clinician calendar: a second SCHEDULED visit starting only 10 minutes
          after the first ends (< 15-minute buffer) is rejected — buffer geometry, not raw overlap.
        test_recipe:
          setup:
            - "Clinician C with a SCHEDULED visit 10:00-10:30; a new visit 10:40-11:00 (10-min gap < 15-min buffer)."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr C", npi: "1000000016", dea_number: "AB1616161" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Fourteen", date_of_birth: "1978-04-18", sex: "MALE", email: "p14@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/telehealth-visits", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z", reason: "consult" }, as: ClinicAdmin, captures: { visit1_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/telehealth-visits", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", start_at: "2026-05-02T10:40:00Z", end_at: "2026-05-02T11:00:00Z", reason: "consult2" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CLINICIAN_DOUBLE_BOOKED"
            - "http_status == 409"

      - name: lab_draw_station_capacity_overlap
        grounds:
          - validations[priority=7.1]
          - entities.DrawStation.fields.concurrent_capacity
          - errors[ERR_DRAW_STATION_AT_CAPACITY]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on a different resource (DrawStation, capacity=1): a half-open
          interval overlapping an existing SCHEDULED appointment is rejected, while a touching interval
          (adjacency) would be allowed — different geometry than the buffer rule.
        test_recipe:
          setup:
            - "DrawStation capacity 1; patient membership has >=2 lab-draw credits; one SCHEDULED appointment 10:00-10:30; new appointment 10:15-10:45 overlaps."
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Fifteen", date_of_birth: "1974-05-19", sex: "MALE", email: "p15@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/draw-stations", payload: { name: "Station 1", concurrent_capacity: 1 }, as: ClinicAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /clinic/lab-draw-appointments", payload: { patient_id: "${patient_id}", draw_station_id: "${station_id}", start_at: "2026-05-03T10:00:00Z", end_at: "2026-05-03T10:30:00Z" }, as: ClinicAdmin, captures: { appt1_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/lab-draw-appointments", payload: { patient_id: "${patient_id}", draw_station_id: "${station_id}", start_at: "2026-05-03T10:15:00Z", end_at: "2026-05-03T10:45:00Z" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DRAW_STATION_AT_CAPACITY"
            - "http_status == 409"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: refill_reverse_conserves_refills_remaining
        grounds:
          - state_machines.RefillOrder.PENDING_REVIEW_to_DISPENSED
          - state_machines.RefillOrder.DISPENSED_to_REVERSED
          - entities.ControlledSubstancePrescription.fields.refills_remaining
        distinguishing_aspect: |
          Conserved quantity: prescription.refills_remaining. Dispense (3->2) then reverse (2->3) leaves the
          invariant refills_authorized == refills_remaining + non_reversed_dispensed_count intact (3 == 3 + 0).
        test_recipe:
          setup:
            - "ISSUED prescription refills_authorized=3; one refill dispensed then reversed."
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr A", npi: "1000000017", dea_number: "AB1717171" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/pharmacists", payload: { full_name: "Ph B", license_number: "PH-17" }, as: ClinicAdmin, captures: { pharmacist_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Sixteen", date_of_birth: "1973-06-20", sex: "MALE", email: "p16@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { base_panel: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${base_panel}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${base_panel}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${base_panel}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${base_panel}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id", rx_v: "$.data.version" } }
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { refill_id: "$.data.id" } }
            - { call: "POST /clinic/refill-orders/${refill_id}/dispense", payload: { dispensed_quantity_units: 8 }, as: Pharmacist, as_user_id: "${pharmacist_id}" }
          trigger:
            - { call: "POST /clinic/refill-orders/${refill_id}/reverse", payload: {}, as: Pharmacist, as_user_id: "${pharmacist_id}" }
          assert:
            - "ControlledSubstancePrescription ${rx_id}.refills_remaining == 3"
            - "ControlledSubstancePrescription ${rx_id}.status == ISSUED"
            - "RefillOrder ${refill_id}.status == REVERSED"

      - name: labdraw_cancel_conserves_credits
        grounds:
          - state_machines.LabDrawAppointment.SCHEDULED_to_CANCELLED
          - calculations.lab_draw_credit_ledger
          - entities.Membership.fields.lab_draw_credits_remaining
        distinguishing_aspect: |
          Different conserved quantity: Membership.lab_draw_credits_remaining. Booking (4->3) then cancelling
          (3->4) restores the count to the plan's included_lab_draw_credits (4).
        test_recipe:
          setup:
            - "Membership with included_lab_draw_credits=4; one appointment booked then cancelled."
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Pat Seventeen", date_of_birth: "1972-07-21", sex: "MALE", email: "p17@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/draw-stations", payload: { name: "Station 2", concurrent_capacity: 2 }, as: ClinicAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /clinic/lab-draw-appointments", payload: { patient_id: "${patient_id}", draw_station_id: "${station_id}", start_at: "2026-05-04T10:00:00Z", end_at: "2026-05-04T10:30:00Z" }, as: ClinicAdmin, captures: { appt_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/lab-draw-appointments/${appt_id}/cancel", payload: {}, as: ClinicAdmin }
          assert:
            - "Membership ${membership_id}.lab_draw_credits_remaining == 4"
            - "LabDrawAppointment ${appt_id}.status == CANCELLED"
