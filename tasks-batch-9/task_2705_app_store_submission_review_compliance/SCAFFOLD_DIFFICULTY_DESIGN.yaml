            - { call: "GET /expedite-requests?submission_id=${sub_a_id}", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_b: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_b}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 11, version_string: "1.0.1", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_b_id: "$.data.id" } }
            - { call: "POST /expedite-requests", payload: { submission_id: "${sub_b_id}", justification_category: "SECURITY_FIX", justification: "Rebuilt 1.0.1 carries the same plaintext token logging fix and must ship fast." }, as: ReleaseManager, as_user_id: "u-release-1", captures: { exp4_id: "$.data.id" } }
