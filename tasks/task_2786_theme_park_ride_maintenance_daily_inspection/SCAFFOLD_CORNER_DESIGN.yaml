          trigger:
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-01T09:00:00.000Z", cause_category: "ELECTRICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d_id: "$.data.id" }
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a_id}", part_number: "PN-INIT", quantity: 1, unit_cost_cents: 25000, needed_by_date: "2026-08-15" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r_id: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-INIT-1", manufacturer: "Intamin", model_code: "IS-1", severity: "ADVISORY", issued_date: "2026-07-15", compliance_deadline_date: "2026-11-30" }
              as: ParkOpsAdmin
