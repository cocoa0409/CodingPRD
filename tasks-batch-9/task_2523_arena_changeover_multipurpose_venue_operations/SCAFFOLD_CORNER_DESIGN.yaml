              captures: { committed: $.data.rigging_committed_load_kg }
          assert:
            - "the confirm of ${bk_b} returns HTTP 200, because its closed window [2026-09-12T00:00:00Z, 2026-09-12T03:00:00Z] shares no instant with booking A's window, so the capacity check sees 0 + 5000 <= 20000"
