scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: insurance_allowed_in_network_vs_out_of_network
        grounds:
          - calculations.insurance_responsibility
          - entities.Claim.fields.allowed_amount_cents
          - entities.PayerContract.fields.in_network
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: >-
          Same CPT 90834 billed at 15000c yields a different allowed_amount and patient split
          on a Claim depending solely on PayerContract.in_network: in-network caps allowed at
          the contracted 13000c, out-of-network uses the full 15000c — divergence lives on the
          Claim/PayerContract entity domain.
        test_recipe:
          setup:
            - "An in-network payer contract (90834 contracted 13000c) and an out-of-network contract."
            - "Two patients, each with an INSURANCE policy (COINSURANCE 0.20, deductible 0) on one contract."
            - "Each patient has one COMPLETED 90834 insurance appointment with a SUBMITTED claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Indie" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "L1", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "InNet", in_network: true, contracted_rate_90791_cents: 18000, contracted_rate_90834_cents: 13000 }
              as: Biller
              captures: { c_in_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { payer_name: "OutNet", in_network: false, contracted_rate_90791_cents: 0, contracted_rate_90834_cents: 0 }
              as: Biller
              captures: { c_out_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P In", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_in_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P Out", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_out_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_in_id}", contract_id: "${c_in_id}", cost_share_model: "COINSURANCE", coinsurance_rate: 0.20, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_in_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_out_id}", contract_id: "${c_out_id}", cost_share_model: "COINSURANCE", coinsurance_rate: 0.20, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_out_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_in_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-01T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_in_id}" }
              as: FrontDesk
              captures: { a_in_id: $.data.id, a_in_v: $.data.version }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_out_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-01T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_out_id}" }
              as: FrontDesk
              captures: { a_out_id: $.data.id, a_out_v: $.data.version }
            - call: "POST /appointments/${a_in_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_out_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_in_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_in_id: $.data.id }
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_out_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_out_id: $.data.id }
            - call: "POST /clinical-notes/${n_in_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes/${n_out_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_in_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_in_v2: $.data.version }
            - call: "POST /appointments/${a_out_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_out_v2: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_in_id}", expected_appointment_version: "${a_in_v2}" }
              as: Biller
              captures: { cl_in_id: $.data.id, cl_in_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_out_id}", expected_appointment_version: "${a_out_v2}" }
              as: Biller
              captures: { cl_out_id: $.data.id, cl_out_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl_in_id}/adjudicate"
              payload: { expected_claim_version: "${cl_in_v}" }
              as: Biller
            - call: "POST /claims/${cl_out_id}/adjudicate"
              payload: { expected_claim_version: "${cl_out_v}" }
              as: Biller
          assert:
            - "Claim.${cl_in_id}.allowed_amount_cents == 13000"
            - "Claim.${cl_in_id}.patient_responsibility_cents == 2600"
            - "Claim.${cl_out_id}.allowed_amount_cents == 15000"
            - "Claim.${cl_out_id}.patient_responsibility_cents == 3000"

      - name: supervision_hours_verified_vs_projected
        grounds:
          - calculations.supervision_direct_hours
          - entities.Therapist.fields.verified_direct_hours
          - entities.Therapist.fields.projected_direct_hours
          - state_machines.Appointment.RENDERED_to_COMPLETED
        distinguishing_aspect: >-
          On a single Therapist, projected_direct_hours counts a SCHEDULED appointment plus a
          COMPLETED one (1.50h) while verified_direct_hours counts only the COMPLETED+CO_SIGNED
          one (0.75h) — same appointment population, two totals, on the Therapist entity domain
          (distinct from the Claim domain of the first dual-variant instance).
        test_recipe:
          setup:
            - "One INDEPENDENT supervisor and one ASSOCIATE supervisee."
            - "The associate has one COMPLETED+CO_SIGNED 90834 and one still-SCHEDULED 90834."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Sup" }
              as: ClinicalDirector
              captures: { sup_id: $.data.id, sup_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${sup_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${sup_id}", state_code: "CA", license_number: "LS", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${sup_id}/promote"
              payload: { expected_therapist_version: "${sup_v}" }
              as: ClinicalDirector
              captures: { sup_v2: $.data.version }
            - call: "POST /therapists/${sup_id}/promote"
              payload: { expected_therapist_version: "${sup_v2}" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Assoc", supervisor_id: "${sup_id}" }
              as: ClinicalDirector
              captures: { as_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { therapist_id: "${as_id}", state_code: "CA", license_number: "LA", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${as_id}", patient_id: "${pt_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-02T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { ap1_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${as_id}", patient_id: "${pt_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-09T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { ap2_id: $.data.id }
            - call: "POST /appointments/${ap1_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${as_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${ap1_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${as_id}"
              captures: { note1_id: $.data.id }
            - call: "POST /clinical-notes/${note1_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${as_id}"
            - call: "POST /clinical-notes/${note1_id}/cosign"
              payload: {}
              as: Therapist
              as_user_id: "${sup_id}"
            - call: "POST /appointments/${ap1_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${as_id}"
          trigger:
            - call: "GET /therapists/${as_id}"
              payload: {}
              as: ClinicalDirector
          assert:
            - "Therapist.${as_id}.verified_direct_hours == 0.75"
            - "Therapist.${as_id}.projected_direct_hours == 1.50"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: crisis_weighted_score_nonlinear_band
        grounds:
          - calculations.crisis_risk_score
          - entities.CrisisAssessment.fields.risk_score
          - entities.CrisisAssessment.fields.risk_band
          - state_machines.CrisisAssessment.OPEN_to_OPEN
        distinguishing_aspect: >-
          Mode (a): four weighted factor inputs (0.30/0.30/0.25/0.15) combine non-linearly with a
          conditional band selection (>=70 HIGH, >=40 MODERATE) so scores 3/2/2/0 -> 66.67 MODERATE
          and 3/2/2/1 -> 71.67 HIGH straddle the band branch on the CrisisAssessment entity.
        test_recipe:
          setup:
            - "One ACTIVE patient and one assessing therapist."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr C" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt C", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 3, plan_score: 2, means_access_score: 2, prior_attempts_score: 1 }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { ca_id: $.data.id }
          assert:
            - "CrisisAssessment.${ca_id}.risk_score == 71.67"
            - "CrisisAssessment.${ca_id}.risk_band == HIGH"

      - name: insurance_rounding_order_deductible_then_coinsurance
        grounds:
          - calculations.insurance_responsibility
          - entities.Claim.fields.patient_responsibility_cents
          - entities.Claim.fields.deductible_applied_cents
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: >-
          Mode (b): the formula pins deductible-first then round(after_deductible * coinsurance)
          to cents BEFORE adding the integer deductible_applied; with allowed 13000c, deductible
          5000c, coinsurance 0.175, the pinned order yields patient 6458c (round(8333*0.175)=1458,
          +5000) — a different cent total than rounding the full-allowed product first.
        test_recipe:
          setup:
            - "An INDEPENDENT therapist licensed in CA."
            - "An in-network policy: 90834 contracted 13333c, deductible_total 5000c, coinsurance 0.175."
            - "One COMPLETED 90834 insurance appointment with a SUBMITTED claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Ind" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "L9", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "RoundNet", in_network: true, contracted_rate_90791_cents: 18000, contracted_rate_90834_cents: 13333 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt R", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COINSURANCE", coinsurance_rate: 0.175, deductible_total_cents: 5000 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-03T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v}" }
              as: Biller
          assert:
            - "Claim.${cl_id}.allowed_amount_cents == 13000"
            - "Claim.${cl_id}.deductible_applied_cents == 5000"
            - "Claim.${cl_id}.patient_responsibility_cents == 6458"
            - "Claim.${cl_id}.payer_paid_cents == 6542"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_revert_loop_denied_resubmit_adjudicate
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.DENIED_to_RESUBMITTED
          - state_machines.Claim.RESUBMITTED_to_ADJUDICATED
        distinguishing_aspect: >-
          The Claim machine is cyclic: SUBMITTED -> DENIED -> RESUBMITTED -> ADJUDICATED loops back
          into the adjudication state, distinct from any linear pipeline; the same claim reaches
          ADJUDICATED after a deny/resubmit round.
        test_recipe:
          setup:
            - "A COMPLETED insurance appointment with a SUBMITTED claim (OON, no deductible, copay 2500c)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr L" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LL", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "OON2", in_network: false, contracted_rate_90791_cents: 0, contracted_rate_90834_cents: 0 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt L", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COPAY", copay_cents: 2500, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-04T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v0: $.data.version }
            - call: "POST /claims/${cl_id}/deny"
              payload: { expected_claim_version: "${cl_v0}" }
              as: Biller
              captures: { cl_v1: $.data.version }
            - call: "POST /claims/${cl_id}/resubmit"
              payload: { expected_claim_version: "${cl_v1}" }
              as: Biller
              captures: { cl_v2: $.data.version }
          trigger:
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v2}" }
              as: Biller
          assert:
            - "Claim.${cl_id}.status == ADJUDICATED"
            - "Claim.${cl_id}.patient_responsibility_cents == 2500"
            - "Claim.${cl_id}.payer_paid_cents == 12500"

      - name: appointment_branch_completed_to_claimed_or_writtenoff
        grounds:
          - state_machines.Appointment.COMPLETED_to_CLAIMED
          - state_machines.Appointment.COMPLETED_to_WRITTEN_OFF
          - entities.Appointment.fields.payment_path
        distinguishing_aspect: >-
          The Appointment machine forks at COMPLETED with divergent side-effect sets: the SELF_PAY
          branch -> WRITTEN_OFF zeroes patient_charge_cents, the INSURANCE branch -> CLAIMED spawns
          a Claim — a branching shape on the Appointment entity, distinct from the Claim cycle.
        test_recipe:
          setup:
            - "Two COMPLETED appointments by an INDEPENDENT CA therapist: one SELF_PAY, one INSURANCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr B" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LB", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "Net3", in_network: true, contracted_rate_90791_cents: 18000, contracted_rate_90834_cents: 13000 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt B", location_state_code: "CA", annual_household_income: 30000, household_size: 2 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COPAY", copay_cents: 2000, deductible_total_cents: 0 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
