scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pay_provisional_vs_final_divergence_on_train_deadhead
        grounds:
          - calculations.agreement_pay
          - state_machines.PayRecord.DRAFT_to_SUBMITTED
          - state_machines.PayRecord.SUBMITTED_to_FINALIZED
        distinguishing_aspect: |
          Entity domain = PayRecord fiscal amounts. The PROVISIONAL variant
          (round per component then sum) yields 74867 cents while the FINAL
          variant (sum exact then round once) yields 74866 cents for the same
          claim (claimed_minutes=600, claimed_deadhead_minutes=100,
          deadhead_mode=TRAIN) — a 1-cent divergence caused purely by the
          pinned rounding order.
        test_recipe:
          setup:
            - "Employee E (CONDUCTOR) on board B at terminal CHI; Job J (craft CONDUCTOR, origin CHI, crew_required 1)"
            - "Call C issued to E and accepted with deadhead_minutes=100, deadhead_mode=TRAIN, producing Assignment A"
            - "A on-duty then tied up; the auto-created DRAFT PayRecord P is resubmission-amended to claimed_minutes=600, claimed_deadhead_minutes=100"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E1001", full_name: "Pat Conductor", craft: "CONDUCTOR", seniority_date: "2010-05-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-01", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHIGAL-01", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-02T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}", deadhead_minutes: 100, deadhead_mode: "TRAIN" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T18:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /api/pay-records?assignment_id=${asg_id}"
              payload: {}
              as: CrewManager
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /api/pay-records/${pay_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { prov_pay: $.data.gross_pay_cents, pay_v2: $.data.version }
          trigger:
            - call: "POST /api/pay-records/${pay_id}/finalize"
              payload: { expected_pay_record_version: "${pay_v2}" }
              as: CrewManager
              captures: { final_pay: $.data.gross_pay_cents }
          assert:
            - "captured prov_pay == 74867 (rhu(30010)+rhu(11253.75)+rhu(33602.708) = 30010+11254+33603)"
            - "captured final_pay == 74866 (rhu(74866.4583))"
            - "prov_pay != final_pay (rounding-order divergence of exactly 1 cent)"

      - name: hos_chronological_vs_forward_looking_gate
        grounds:
          - calculations.hos_duty_accumulation
          - state_machines.Call.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Entity domain = Employee duty-time ledger (not money). The
          chronological variant (persisted cumulative_duty_minutes_month) reads
          16080 while the forward_looking variant (cumulative + job projected
          tour) reads 16560 for the same employee at the same instant; the
          forward value is what the accept gate enforces, so a default-tour
          job accept passes at cumulative 16080 (16560 <= 16560) while the
          chronological ledger alone stays 16080 until the next tie-up.
        test_recipe:
          setup:
            - "Employee E (ENGINEER) with one completed 16080-minute tour in August (single on-duty 2026-08-01T00:00Z, tie-up 2026-08-12T07:00Z)"
            - "cumulative_duty_minutes_month == 16080; fatigue 48.6 (< 80) so call issue is eligible"
            - "Job J2 (craft ENGINEER, origin CHI) with default projected tour 480, call C2 offered to E"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E2001", full_name: "Sam Engineer", craft: "ENGINEER", seniority_date: "2012-03-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-ENGR-01", craft: "ENGINEER", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHISTL-01", craft: "ENGINEER", origin_terminal: "CHI", report_time: "2026-08-01T00:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job1_id: $.data.id, job1_v0: $.data.version }
            - call: "POST /api/jobs/${job1_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call1_id: $.data.id }
            - call: "POST /api/calls/${call1_id}/accept"
              payload: { expected_job_version: "${job1_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg1_id: $.data.id }
            - call: "POST /api/assignments/${asg1_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T07:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg1_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T17:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees/${emp_id}/mark-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { emp_cum: $.data.cumulative_duty_minutes_month }
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHISTL-02", craft: "ENGINEER", origin_terminal: "CHI", report_time: "2026-08-12T20:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job2_id: $.data.id, job2_v0: $.data.version }
            - call: "POST /api/jobs/${job2_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call2_id: $.data.id }
          trigger:
            - call: "POST /api/calls/${call2_id}/accept"
              payload: { expected_job_version: "${job2_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg2_id: $.data.id }
          assert:
            - "captured emp_cum == 16080 (chronological ledger value before the new tour)"
            - "trigger succeeds (HTTP 201): forward_looking projection 16080 + 480 == 16560 <= MAX_DUTY_MINUTES_PER_MONTH"
            - "Assignment.${asg2_id}.assignment_status == MARKED_UP"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pay_rounding_order_per_component_vs_sum
        grounds:
          - calculations.agreement_pay
        distinguishing_aspect: |
          Mode (b) nested rounding order: rounding each of basic/overtime/
          deadhead separately then summing (74867) differs from summing exact
          then rounding once (74866) for claimed=600/deadhead=100/TRAIN — the
          scaffold pins PROVISIONAL = per-component-round at submit and
          FINAL = round-once at finalize.
        test_recipe:
          setup:
            - "Employee E (CONDUCTOR) with Assignment A (deadhead_mode TRAIN) tied up"
            - "DRAFT PayRecord P amended to claimed_minutes=479, claimed_deadhead_minutes=3 via dispute/resubmit"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E3001", full_name: "Lee Brakeman", craft: "CONDUCTOR", seniority_date: "2015-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-02", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "Y-CHI-03", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-02T06:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}", deadhead_minutes: 3, deadhead_mode: "TRAIN" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T14:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /api/pay-records?assignment_id=${asg_id}"
              payload: {}
              as: CrewManager
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /api/pay-records/${pay_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/pay-records/${pay_id}/dispute"
              payload: {}
              as: CrewManager
            - call: "POST /api/pay-records/${pay_id}/resubmit"
              payload: { claimed_minutes: 479, claimed_deadhead_minutes: 3 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { prov_pay: $.data.gross_pay_cents, pay_v: $.data.version }
          trigger:
            - call: "POST /api/pay-records/${pay_id}/finalize"
              payload: { expected_pay_record_version: "${pay_v}" }
              as: CrewManager
              captures: { final_pay: $.data.gross_pay_cents }
          assert:
            - "captured prov_pay == 30955 (rhu(29947.396) + rhu(0) + rhu(1008.02) = 29947 + 0 + 1008)"
            - "captured final_pay == 30956 (rhu(30955.5604))"
            - "final_pay - prov_pay == 1"

      - name: fatigue_weighted_scoring_multifactor
        grounds:
          - calculations.fatigue_index
          - entities.Employee.fields.fatigue_score
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: fatigue combines
          cumulative duty ratio (0.5 weight, normalized by the 16560 cap),
          consecutive-duty-day streak (0.3 weight, step of 10 per day), and
          disturbed-rest count (0.2 weight, step of 15) — inputs interact
          through weighted sum then a clamp at [0,100]; the same employee
          reads 0.0 before any duty and 48.6 after one 16080-minute tour whose
          on-duty day streak is broken (streak 0 because today has no
          on_duty_at).
        test_recipe:
          setup:
            - "Employee E (ENGINEER), freshly created: fatigue_score == 0.0"
            - "One 16080-minute tour completed (on-duty 2026-08-01T00:00Z, tie-up 2026-08-12T07:00Z); no disturbed rests; streak 0 on 2026-08-12"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E4001", full_name: "Ada Engineer", craft: "ENGINEER", seniority_date: "2011-07-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id, fatigue_initial: $.data.fatigue_score }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-ENGR-02", craft: "ENGINEER", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHISTL-04", craft: "ENGINEER", origin_terminal: "CHI", report_time: "2026-08-01T00:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /api/assignments/${asg_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T07:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /api/employees/${emp_id}"
              payload: {}
              as: CrewManager
              captures: { fatigue_after: $.data.fatigue_score, cum_after: $.data.cumulative_duty_minutes_month }
          assert:
            - "captured fatigue_initial == 0.0"
            - "captured cum_after == 16080"
            - "captured fatigue_after == 48.6 (rhu1(0.5*16080/16560*100 + 0.3*0 + 0.2*0) = rhu1(48.5507))"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: employee_availability_cycle_markup_layoff
        grounds:
          - state_machines.Employee.AVAILABLE_to_MARKED_OFF
          - state_machines.Employee.MARKED_OFF_to_AVAILABLE
        distinguishing_aspect: |
          Entity = Employee: a true cycle AVAILABLE -> MARKED_OFF -> AVAILABLE
          (and ON_REST -> AVAILABLE) with position-restoring side effects —
          laying off freezes (not vacates) the board slot, and mark-up
          restores the FROZEN slot at its remembered standing_position.
        test_recipe:
          setup:
            - "Employee E (CONDUCTOR) holds the single ACTIVE slot (position 1) on board B"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E5001", full_name: "Cy Conductor", craft: "CONDUCTOR", seniority_date: "2009-09-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-03", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
              captures: { slot_id: $.data.id, slot_pos_initial: $.data.standing_position }
          trigger:
            - call: "POST /api/employees/${emp_id}/lay-off"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { avail_after_off: $.data.availability_status }
            - call: "GET /api/extra-board-slots?board_id=${board_id}"
              payload: {}
              as: CrewManager
              captures: { slot_status_frozen: "$.data[0].slot_status" }
            - call: "POST /api/employees/${emp_id}/mark-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { avail_after_up: $.data.availability_status }
            - call: "GET /api/extra-board-slots?board_id=${board_id}"
              payload: {}
              as: CrewManager
              captures: { slot_status_restored: "$.data[0].slot_status", slot_pos_restored: "$.data[0].standing_position" }
          assert:
            - "captured slot_pos_initial == 1"
            - "captured avail_after_off == MARKED_OFF"
            - "captured slot_status_frozen == FROZEN"
            - "captured avail_after_up == AVAILABLE (cycle closed)"
            - "captured slot_status_restored == ACTIVE"
            - "captured slot_pos_restored == 1 (position restored, not appended)"

      - name: payrecord_dispute_resubmit_cycle
        grounds:
          - state_machines.PayRecord.SUBMITTED_to_DISPUTED
          - state_machines.PayRecord.DISPUTED_to_SUBMITTED
        distinguishing_aspect: |
          Entity = PayRecord (different entity from Employee): a negotiation
          loop SUBMITTED -> DISPUTED -> SUBMITTED that may iterate; the loop
          recomputes provisional gross_pay_cents against amended minutes on
          each resubmit (260100 for 480 min vs 264270 for 490 min claimed).
        test_recipe:
          setup:
            - "Employee E (CONDUCTOR) with tied-up Assignment A and auto-created DRAFT PayRecord P (claimed_minutes = elapsed 480)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E6001", full_name: "Dee Conductor", craft: "CONDUCTOR", seniority_date: "2013-11-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-04", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "Y-CHI-06", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-02T06:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T14:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /api/pay-records?assignment_id=${asg_id}"
              payload: {}
              as: CrewManager
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /api/pay-records/${pay_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { pay_v1: $.data.version, prov_480: $.data.gross_pay_cents }
          trigger:
            - call: "POST /api/pay-records/${pay_id}/dispute"
              payload: {}
              as: CrewManager
              captures: { status_disputed: $.data.record_status }
            - call: "POST /api/pay-records/${pay_id}/resubmit"
              payload: { claimed_minutes: 490 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { status_resubmitted: $.data.record_status, prov_490: $.data.gross_pay_cents }
          assert:
            - "captured prov_480 == 30010 (480 min basic day, provisional)"
            - "captured status_disputed == DISPUTED"
            - "captured status_resubmitted == SUBMITTED (loop closed)"
            - "captured prov_490 == 30948 (rhu(30010) + rhu(1.5*30010*10/480)=rhu(937.8125)=938; 30010+938)"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: leave_award_cascades_employee_board_positions
        grounds:
          - state_machines.LeaveBid.SUBMITTED_to_AWARDED
          - state_machines.Employee.AVAILABLE_to_ON_LEAVE
          - calculations.board_rotation
        distinguishing_aspect: |
          Depth-3 cascade triggered by LeaveBid award: award -> Employee
          AVAILABLE->ON_LEAVE -> that employee's ACTIVE ExtraBoardSlot ->
          VACATED -> board_rotation renumbers the surviving ACTIVE slots
          (survivor at position 2 shifts up to 1). Each link is caused by the
          previous link, not by the award directly.
        test_recipe:
          setup:
            - "Board B (CONDUCTOR/CHI) with E1 at position 1 and E2 at position 2, both AVAILABLE"
            - "LeaveBid LB by E1 for 2026-08-10..2026-08-12 SUBMITTED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E7001", full_name: "Fran First", craft: "CONDUCTOR", seniority_date: "2008-01-01T00:00:00Z", home_terminal: "CHI" }
