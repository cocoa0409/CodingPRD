          setup:
            - "two ADMITTED residents, each assessed with interest_domains containing PHYSICAL, each with an ACTIVE plan"
            - "resident A's plan has domain_frequency_targets PHYSICAL 0 (cascade applies); resident B's plan has PHYSICAL 2 (cascade must be skipped)"
