      - name: facility_approval_without_an_executed_contract_has_no_eligible_collateral
        claim_type: aggregate_validation
        grounds:
          - validations[priority=74]
          - errors.ERR_NO_ELIGIBLE_COLLATERAL
          - calculations.presale_discounted_advance
        distinguishing_aspect: |
          The lender may PROPOSE a facility against a film with no contracts at all, but approval sums
          the discounted unpaid milestones of EXECUTED contracts only: with an empty collateral set the
          sum is 0.00 and approval is refused rather than approving a zero-dollar facility.
        test_recipe:
          setup:
            - "A DEVELOPMENT film with no agency agreement, no contracts and one PROPOSED facility."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
