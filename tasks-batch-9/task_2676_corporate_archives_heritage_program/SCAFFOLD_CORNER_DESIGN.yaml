              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 412"
            - "${err} == ERR_STALE_ACCESS_REQUEST_VERSION"
            - "${ar_v1} == 1"
            - "${ar_v2} == 2"
            - "AccessRequest.${ar_id}.status == SCREENING"
            - "AccessRequest.${ar_id}.current_screening_id is null"
            - "GET /confidentiality-screenings?access_request_id=${ar_id} returns total_count 0"

      - name: layers_occ_correct_version_succeeds_and_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appraisal-create-stale-series]
          - state_machines.AppraisalRecord.SCREENED_to_FINAL
          - calculations.appraisal_score
        distinguishing_aspect: "The positive half of the OCC contract: posting the appraisal with the correct expected_series_version 1 succeeds, and each subsequent write bumps its own row's version - the appraisal goes 1 (create) -> 2 (screen) -> 3 (finalize) while the series only bumps to 2 when finalize writes current_appraisal_id. Both variants score 34.00 here (brand_heritage_value 0, provenance verified), so the version arithmetic is not confounded by a score change."
        setup_notes: "span_years 1950-2010 is 61, so age_bonus is min(10, 12) = 10; core is 9 + 9 + 0 + 6 = 24 and raw is 34, above the 30.00 permanence threshold."
        test_recipe:
          setup:
            - "Fresh ACTIVE series at version 1 with no prior appraisal."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "CL-03", retention_years: 62, disposition_action: "REVIEW", legal_citation: "Corp Policy 8.3", min_appraisal_score_for_permanent: 30.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Executive Correspondence", business_unit: "Office of the CEO", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 20, earliest_record_year: 1950, latest_record_year: 2010 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id, series_v1: $.data.version }
            - call: "POST /appraisals"
              payload: { record_series_id: "${series_id}", informational_value: 3, evidential_value: 3, brand_heritage_value: 0, uniqueness_factor: 3, provenance_verified: true, expected_series_version: "${series_v1}" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { appr_id: $.data.id, appr_v1: $.data.version }
            - call: "POST /appraisals/${appr_id}/screen"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
              captures: { appr_v2: $.data.version, screening_score: $.data.screening_score }
          trigger:
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { appr_v3: $.data.version, final_score: $.data.final_score }
          assert:
            - "HTTP status is 200"
            - "${series_v1} == 1"
            - "${appr_v1} == 1"
            - "${appr_v2} == 2"
            - "${appr_v3} == 3"
            - "${screening_score} == 34.00"
            - "${final_score} == 34.00"
            - "AppraisalRecord.${appr_id}.status == FINAL"
            - "AppraisalRecord.${appr_id}.recommended_disposition == PERMANENT"
            - "RecordSeries.${series_id}.version == 2"
            - "RecordSeries.${series_id}.disposition_state == PERMANENT"
            - "RecordSeries.${series_id}.current_appraisal_id == ${appr_id}"

      - name: layers_temporal_windowing_check_out_exactly_at_window_start_succeeds
        claim_type: temporal_windowing
        grounds:
          - state_machines.ExhibitLoan.CONFIRMED_to_OUT
