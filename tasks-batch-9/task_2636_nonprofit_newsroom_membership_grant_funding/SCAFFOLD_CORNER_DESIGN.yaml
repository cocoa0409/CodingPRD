      - name: sm_grant_proposal_revision_cycle_is_bounded_at_three_rounds
        claim_type: Idempotency
        grounds:
          - state_machines.GrantProposal.INDEPENDENCE_REVIEW_to_REVISION_REQUESTED
          - validations[priority=26]
          - errors[ERR_REVISION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: >-
          The DRAFT / INDEPENDENCE_REVIEW / REVISION_REQUESTED loop is legal three times and
          the fourth REQUEST_REVISION is refused, and REVISION_REQUESTED can re-enter review
          either directly via SUBMIT_FOR_REVIEW or through a REVISE hop back to DRAFT.
        test_recipe:
          setup: "An UNRESTRICTED proposal on a CLEARED foundation funder, cycled through three revision rounds and left in INDEPENDENCE_REVIEW with revision_round_count == 3."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
