  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: claim_exhausts_at_exactly_zero_balance
        grounds:
          - state_machines.Claim.MONETARILY_ELIGIBLE_to_EXHAUSTED
          - calculations.weekly_payable_amount
          - entities.Claim.fields.remaining_balance_cents
        distinguishing_aspect: |
