        distinguishing_aspect: >-
          The comparison is <= against round_half_up(list * 1.1), so a quote of exactly 11000 against a
          10000 list clears the ceiling and prices the line, while 11001 on an otherwise identical line
          is refused. Satisfaction must produce a full price-lock with the money rolled up, not merely
          the absence of an error.
        test_recipe:
          setup:
            - "An Insurer on the default parts_price_ceiling_pct 1.1 and a zero-discount OEM vendor."
            - "A locked order (BODY 4.5 h; labor 27000, supplies 1080) with two OEM PartsLines, both list 10000 qty 1: L1 quoted at 11000 and L2 quoted at 11001."
