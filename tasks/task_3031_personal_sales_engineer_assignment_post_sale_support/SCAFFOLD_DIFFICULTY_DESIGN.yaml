          assert:
            - "the response status is 422 and data.error_id == ERR_INSPECTION_NOT_PASSED"
            - "the response error_id is not ERR_QUOTE_NOT_RESERVED even though InstrumentUnit.${unit_a_id}'s quote is SUBMITTED rather than RESERVED"
            - "InstrumentUnit.${unit_a_id}.setup_status is still INSPECTED and inspection_overall == FAIL, so no ship side effect fired"
            - "Quote.${quote_a_id}.status == ${quote_status_pre} == SUBMITTED unchanged by the rejected call"

      - name: accept_assignment_authorization_beats_book_and_overlap
        grounds:
