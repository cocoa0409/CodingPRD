# =============================================================================
# SCAFFOLD — task_3167_host_railroad_track_access_time_performance_dispatch
# §1.0–§1.7 seed tables (difficulty & corner designs live in sibling files)
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Host Railroad Track Access, On-Time Performance & Dispatch Priority (Amtrak): operating agreements with freight railroads granting access over host-owned track with incentive and penalty structures, schedule construction with running time allowances negotiated against host capacity, dispatch priority disputes when passenger trains are held for freight with delay minute coding, on-time performance measurement by segment with root cause attribution to host, mechanical or station causes, capital investment agreements funding sidings and signal improvements to support additional frequencies, state-supported route funding agreements with cost allocation methodologies, equipment cycling and maintenance windows constraining schedules, service disruption bus bridging and passenger reaccommodation

domain_name: host-railroad-dispatch
api_prefix: /rail

complexity_profile:
  primary_archetype: temporal_windowing        # track occupancy windows, maintenance windows, schedule slots
  secondary_archetype: pricing_engine          # incentive/penalty settlement, cost allocation
  complexity_layers:
    - optimistic_concurrency                   # OCC on OperatingAgreement.version for amend & capital approval
    - cascading_side_effects                   # disruption bridge and agreement suspension cascades
    - dual_variant_calculation                 # OTP endpoint-only vs all-stations; gross vs net delay minutes
    - rate_threshold_triggers                  # OTP tier multipliers, on-time threshold, equipment allowance
    - derived_field_reconciliation             # attributed minutes, segment capacity recomputes
  entity_topology: hybrid                      # flat FK-linked peers + event-log style incidents under runs
  state_machine_shape: branching               # cyclic timetable review loop + fork-join dispute resolution
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # disputes join incidents + runs; projects join agreements + segments
  role_model: peer_roles                       # HostRailroadRep vs PassengerOperator vs StateSponsor vs SystemAdmin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: HostRailroad
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the freight railroad" }
      - { name: reporting_mark, type: string, source: input, description: "AAR reporting mark, e.g. UP, BNSF" }

  - name: Corridor
    parent: null
    common_fields: true
    fields:
      - { name: host_railroad_id, type: string, source: input, description: "FK -> HostRailroad.id; railroad that owns the track" }
      - { name: code, type: string, source: input, description: "Short corridor code, e.g. LSL-MO" }
      - { name: name, type: string, source: input, description: "Human-readable corridor name" }
      - { name: endpoint_a, type: string, source: input, description: "Origin terminal station code" }
      - { name: endpoint_b, type: string, source: input, description: "Destination terminal station code" }
      - { name: service_type, type: enum, source: input, description: "LONG_DISTANCE | STATE_SUPPORTED" }
      - { name: annual_cost_cents, type: integer, source: input, description: "Annualized allocatable route cost in cents, basis for state funding allocation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: TrackSegment
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; corridor this segment belongs to" }
      - { name: sequence_no, type: integer, source: input, description: "Order of the segment along the corridor, ascending from origin" }
      - { name: milepost_start, type: number, source: input, description: "Start milepost" }
      - { name: milepost_end, type: number, source: input, description: "End milepost; must be > milepost_start" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code the segment lies in; drives funding allocation" }
      - { name: track_class, type: enum, source: input, description: "SINGLE | DOUBLE; SINGLE forbids overlapping actual occupancy" }
      - { name: capacity_trains_per_day, type: integer, source: input, description: "Max passenger trains per service day the host grants on this segment" }
      - { name: pure_run_minutes, type: integer, source: input, description: "Unimpeded running time across this segment" }
      - { name: dwell_after_minutes, type: integer, source: input, description: "Station dwell scheduled after this segment", default: 0 }
      - { name: status, type: enum, source: system, description: "OPERABLE | CAPITAL_HOLD", default: OPERABLE }

  - name: OperatingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: host_railroad_id, type: string, source: input, description: "FK -> HostRailroad.id; grantor of track access" }
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; corridor covered by this agreement" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement effective start (ISO 8601)" }
      - { name: effective_to, type: datetime, source: input, description: "Agreement effective end (ISO 8601)" }
      - { name: on_time_threshold_minutes, type: integer, source: input, description: "Arrival delay <= this counts as on time" }
      - { name: penalty_rate_cents_per_minute, type: integer, source: input, description: "Penalty per host-attributed delay minute" }
      - { name: incentive_rate_cents_per_train_mile, type: integer, source: input, description: "Incentive rate per completed train-mile when OTP target is met" }
      - { name: otp_target_pct, type: number, source: input, description: "OTP fraction target, e.g. 0.80" }
      - { name: running_time_allowance_pct, type: number, source: input, description: "Host-negotiated schedule pad as a fraction of pure run time" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED", default: DRAFT }
      - { name: amendment_seq, type: integer, source: system, description: "Number of accepted amendments, starts 0", default: 0 }

  - name: Timetable
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; corridor being scheduled" }
      - { name: operating_agreement_id, type: string, source: input, description: "FK -> OperatingAgreement.id; agreement authorizing this timetable" }
      - { name: service_date_start, type: string, source: input, description: "First service date, YYYY-MM-DD" }
      - { name: service_date_end, type: string, source: input, description: "Last service date inclusive, YYYY-MM-DD" }
      - { name: trains_per_day, type: integer, source: input, description: "Number of daily frequencies" }
      - { name: departure_time_of_day, type: string, source: input, description: "First departure local UTC time, HH:MM" }
      - { name: headway_minutes, type: integer, source: input, description: "Minutes between successive daily departures" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | UNDER_REVIEW | RATIFIED | PUBLISHED | SUSPENDED | SUPERSEDED", default: DRAFT }
      - { name: revision_no, type: integer, source: system, description: "Increments each UNDER_REVIEW -> PROPOSED revision loop", default: 0 }

  - name: TrainRun
    parent: null
    common_fields: true
    fields:
      - { name: timetable_id, type: string, source: system, description: "FK -> Timetable.id; timetable that materialized this run" }
      - { name: train_number, type: string, source: system, description: "Sequence-based train number assigned at publish" }
      - { name: service_date, type: string, source: system, description: "Service date YYYY-MM-DD" }
      - { name: scheduled_departure_at, type: datetime, source: computed, description: "Planned origin departure instant" }
      - { name: scheduled_arrival_at, type: datetime, source: computed, description: "Planned destination arrival instant" }
      - { name: actual_departure_at, type: datetime, source: input, description: "Actual origin departure, set at depart" }
      - { name: actual_arrival_at, type: datetime, source: input, description: "Actual destination arrival, set at complete" }
      - { name: origin_departure_delay_minutes, type: integer, source: computed, description: "max(0, actual_departure_at - scheduled_departure_at) in whole minutes, truncated" }
      - { name: destination_arrival_delay_minutes, type: integer, source: computed, description: "max(0, actual_arrival_at - scheduled_arrival_at) in whole minutes, truncated" }
      - { name: on_time_endpoint, type: boolean, source: computed, description: "destination_arrival_delay_minutes <= on_time_threshold_minutes" }
      - { name: on_time_all_stations, type: boolean, source: computed, description: "on_time_endpoint AND every ACTUALIZED SegmentPassage exit delay <= threshold" }
      - { name: attributed_host_delay_minutes, type: integer, source: computed, description: "Sum of delay_minutes over this run's CONFIRMED host-attributable DelayIncidents; recomputed on confirm/reverse" }
      - { name: cancellation_reason, type: enum, source: system, description: "OPERATOR_CANCEL | AGREEMENT_SUSPENDED | DISRUPTION; null unless CANCELLED/DISRUPTED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | COMPLETED | CANCELLED | DISRUPTED" }

  - name: SegmentPassage
    parent: null
    common_fields: true
    fields:
      - { name: train_run_id, type: string, source: system, description: "FK -> TrainRun.id; owning run" }
      - { name: track_segment_id, type: string, source: system, description: "FK -> TrackSegment.id; segment being traversed" }
      - { name: segment_sequence_no, type: integer, source: system, description: "Copied from TrackSegment.sequence_no at materialization; list ordering key" }
      - { name: planned_entry_at, type: datetime, source: computed, description: "Planned segment entry instant from schedule_feasibility" }
      - { name: planned_exit_at, type: datetime, source: computed, description: "Planned segment exit instant from schedule_feasibility" }
      - { name: actual_entry_at, type: datetime, source: input, description: "Actual entry instant, set at actualize; null while PLANNED" }
      - { name: actual_exit_at, type: datetime, source: input, description: "Actual exit instant, set at actualize; null while PLANNED" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTUALIZED | SKIPPED" }

  - name: DelayIncident
    parent: null
    common_fields: true
    fields:
      - { name: train_run_id, type: string, source: input, description: "FK -> TrainRun.id; run the delay is coded against" }
      - { name: segment_passage_id, type: string, source: input, description: "FK -> SegmentPassage.id; optional passage where the delay occurred; when present must belong to train_run_id" }
      - { name: cause_code, type: enum, source: input, description: "HOST_FREIGHT_HOLD | HOST_SIGNAL | HOST_TRACK | MECHANICAL | STATION_DWELL | WEATHER | DISRUPTION" }
      - { name: delay_minutes, type: integer, source: input, description: "Coded delay minutes; >= 0" }
      - { name: host_attributable, type: boolean, source: computed, description: "true iff cause_code in {HOST_FREIGHT_HOLD, HOST_SIGNAL, HOST_TRACK}" }
      - { name: origin, type: enum, source: system, description: "CODED | SYSTEM_DISRUPTION; SYSTEM_DISRUPTION rows are auto-created by the bridge cascade" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISPUTED | REVERSED" }

  - name: DispatchPriorityDispute
    parent: null
    common_fields: true
    fields:
      - { name: delay_incident_id, type: string, source: system, description: "FK -> DelayIncident.id; incident under dispute" }
      - { name: train_run_id, type: string, source: system, description: "FK -> TrainRun.id; denormalized from the incident" }
      - { name: reason, type: string, source: input, description: "Free-text filing reason" }
      - { name: resolution, type: enum, source: input, description: "UPHELD | OVERTURNED; null until resolved" }
      - { name: resolved_at, type: datetime, source: system, description: "Resolution timestamp; null until resolved" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | ESCALATED | RESOLVED" }

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - { name: operating_agreement_id, type: string, source: input, description: "FK -> OperatingAgreement.id; agreement funding this project" }
      - { name: track_segment_id, type: string, source: input, description: "FK -> TrackSegment.id; segment being improved" }
      - { name: project_type, type: enum, source: input, description: "SIDING | SIGNAL | DOUBLE_TRACK" }
      - { name: funded_amount_cents, type: integer, source: input, description: "Committed capital amount in cents" }
      - { name: added_frequency_capacity, type: integer, source: input, description: "Additional trains/day this project unlocks on the segment" }
      - { name: status, type: enum, source: system, description: "PROPOSED | FUNDED | IN_PROGRESS | SUSPENDED | COMPLETED" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: track_segment_id, type: string, source: input, description: "FK -> TrackSegment.id; segment taken out of service" }
      - { name: window_start_at, type: datetime, source: input, description: "Window start instant" }
      - { name: window_end_at, type: datetime, source: input, description: "Window end instant; must be > window_start_at" }
      - { name: clearance_buffer_minutes, type: integer, source: input, description: "Safety clearance applied on both sides of the window", default: 15 }
      - { name: equipment_unit_id, type: string, source: input, description: "Maintenance equipment unit consuming weekly hours" }
      - { name: window_hours, type: number, source: computed, description: "(window_end_at - window_start_at) in hours, 2 decimals round_half_up" }
      - { name: equipment_week_hours_available, type: number, source: computed, description: "40.00 minus hours of this unit's LOCKED windows whose start falls in the same ISO week (Monday 00:00Z boundary) as this window" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | RELEASED" }

  - name: ServiceDisruption
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; disrupted corridor" }
      - { name: disruption_type, type: enum, source: input, description: "WEATHER | TRACK_FAILURE | GRADE_CROSSING | SECURITY" }
      - { name: started_at, type: datetime, source: input, description: "Disruption start instant" }
      - { name: cleared_at, type: datetime, source: system, description: "Set at recover; null while open" }
      - { name: reaccommodation_policy, type: enum, source: input, description: "BUS_BRIDGE | REFUND | REBOOK_NEXT" }
      - { name: bus_bridge_active, type: boolean, source: system, description: "true between bridge and recover", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | BRIDGED | RECOVERED" }

  - name: FundingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: corridor_id, type: string, source: input, description: "FK -> Corridor.id; STATE_SUPPORTED corridor being funded" }
      - { name: state_code, type: string, source: input, description: "Funding state; must match at least one segment's state_code" }
      - { name: period_start, type: string, source: input, description: "Funding period start date YYYY-MM-DD" }
      - { name: period_end, type: string, source: input, description: "Funding period end date inclusive YYYY-MM-DD" }
      - { name: allocated_cost_cents, type: integer, source: computed, description: "This state's rounded per-line share from funding_cost_allocation; computed at commit" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTED | SETTLED" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: operating_agreement_id, type: string, source: input, description: "FK -> OperatingAgreement.id; agreement being settled" }
      - { name: period_start, type: string, source: input, description: "Statement period start date YYYY-MM-DD" }
      - { name: period_end, type: string, source: input, description: "Statement period end date inclusive YYYY-MM-DD" }
      - { name: computation_variant, type: enum, source: system, description: "GROSS on create/issue; NET on reissue" }
      - { name: completed_run_count, type: integer, source: computed, description: "COMPLETED TrainRuns on the agreement's corridor with service_date in period" }
      - { name: train_miles, type: number, source: computed, description: "completed_run_count * corridor total miles (sum of segment milepost_end - milepost_start)" }
      - { name: otp_pct, type: number, source: computed, description: "100 * on-time runs / completed_run_count, 4 decimals round_half_up; null when completed_run_count == 0" }
      - { name: host_delay_minutes, type: integer, source: computed, description: "Attributed host minutes per host_delay_attribution; GROSS or NET per computation_variant" }
      - { name: penalty_cents, type: integer, source: computed, description: "Per incentive_penalty_settlement; 0 when otp_pct is null or >= target" }
      - { name: incentive_cents, type: integer, source: computed, description: "Per incentive_penalty_settlement; 0 when otp_pct is null or < target" }
      - { name: net_cents, type: integer, source: computed, description: "incentive_cents - penalty_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | REISSUED | PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OperatingAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rail/operating-agreements/{id}/activate"
        actor: HostRailroadRep
        preconditions:
          - "acting HostRailroadRep's X-User-ID == host_railroad_id of the agreement"
        side_effects:
          - "increments OperatingAgreement.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rail/operating-agreements/{id}/amend"
        actor: PassengerOperator
        preconditions:
          - "expected_operating_agreement_version == current OperatingAgreement.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "amendment_seq += 1"
          - "increments OperatingAgreement.version by 1"
          - "cascade: Timetables of this agreement in PROPOSED or UNDER_REVIEW -> DRAFT (link 1)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rail/operating-agreements/{id}/suspend"
        actor: HostRailroadRep
        preconditions:
          - "acting HostRailroadRep owns the agreement"
        side_effects:
          - "increments OperatingAgreement.version by 1"
          - "cascade link 1: PUBLISHED Timetables of this agreement -> SUSPENDED"
          - "cascade link 2: each SUSPENDED Timetable's SCHEDULED TrainRuns -> CANCELLED with cancellation_reason=AGREEMENT_SUSPENDED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaches effective_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Timetable
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /rail/timetables/{id}/propose"
        actor: PassengerOperator
        preconditions:
          - "schedule_feasibility passes: no planned-passage overlap on SINGLE segments, per-day per-segment count <= capacity_trains_per_day, no LOCKED maintenance-window clearance conflict"
        side_effects: []
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /rail/timetables/{id}/review"
        actor: HostRailroadRep
        preconditions:
          - "acting HostRailroadRep owns the corridor's host railroad"
        side_effects: []
      - from: UNDER_REVIEW
        to: PROPOSED
        trigger: "POST /rail/timetables/{id}/revise"
        actor: PassengerOperator
        preconditions: []
        side_effects:
          - "revision_no += 1"
      - from: UNDER_REVIEW
        to: RATIFIED
        trigger: "POST /rail/timetables/{id}/ratify"
        actor: HostRailroadRep
        preconditions:
          - "OperatingAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "acting HostRailroadRep owns the corridor's host railroad"
        side_effects: []
      - from: RATIFIED
        to: PUBLISHED
        trigger: "POST /rail/timetables/{id}/publish"
        actor: PassengerOperator
        preconditions:
          - "no planned passage conflicts with a LOCKED MaintenanceWindow on the same segment under clearance-buffer semantics"
          - "no planned passage overlaps a passage of another PUBLISHED timetable on the same SINGLE segment (half-open)"
        side_effects:
          - "materializes one TrainRun per service_date in [service_date_start, service_date_end] per daily frequency, status SCHEDULED"
          - "materializes one SegmentPassage per TrainRun per TrackSegment ordered by sequence_no, with planned_entry_at/planned_exit_at per schedule_feasibility"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "system (OperatingAgreement suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 2: SCHEDULED TrainRuns -> CANCELLED with cancellation_reason=AGREEMENT_SUSPENDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (another timetable for the same corridor publishes with overlapping service dates)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, DISRUPTED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /rail/train-runs/{id}/depart"
        actor: HostRailroadRep
        preconditions:
          - "acting HostRailroadRep owns the run's host railroad"
        side_effects:
          - "origin_departure_delay_minutes computed"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /rail/train-runs/{id}/complete"
        actor: HostRailroadRep
        preconditions:
          - "every SegmentPassage of the run is ACTUALIZED or SKIPPED (ERR_RUN_PASSAGES_OPEN)"
        side_effects:
          - "destination_arrival_delay_minutes, on_time_endpoint, on_time_all_stations computed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rail/train-runs/{id}/cancel"
        actor: PassengerOperator
        preconditions: []
        side_effects:
          - "cancellation_reason = OPERATOR_CANCEL"
      - from: SCHEDULED
        to: DISRUPTED
        trigger: "system (ServiceDisruption bridge; cascade link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "cancellation_reason = DISRUPTION"
          - "cascade link 2: this run's PLANNED SegmentPassages -> SKIPPED"
          - "cascade link 3: when the run's final PLANNED SegmentPassage flips to SKIPPED, a DelayIncident is auto-created with cause_code=DISRUPTION, origin=SYSTEM_DISRUPTION, delay_minutes = whole minutes from disruption started_at to scheduled_arrival_at (min 0), status OPEN"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (OperatingAgreement suspended; cascade link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "cancellation_reason = AGREEMENT_SUSPENDED"

  - entity: SegmentPassage
    initial_state: PLANNED
    terminal_states: [ACTUALIZED, SKIPPED]
    transitions:
      - from: PLANNED
        to: ACTUALIZED
        trigger: "POST /rail/segment-passages/{id}/actualize"
        actor: HostRailroadRep
        preconditions:
          - "owning TrainRun is EN_ROUTE"
          - "no LOCKED MaintenanceWindow on this segment whose clearance-expanded interval intersects [actual_entry_at, actual_exit_at) (ERR_MAINTENANCE_CONFLICT)"
          - "on SINGLE-track segments, [actual_entry_at, actual_exit_at) does not overlap any other ACTUALIZED passage on the same segment; half-open, so exact adjacency is allowed (ERR_SEGMENT_OCCUPANCY_CONFLICT)"
        side_effects: []
      - from: PLANNED
        to: SKIPPED
        trigger: "system (maintenance lock conflict or disruption cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "when this skip completes a disrupted run's passage set, triggers DelayIncident auto-creation (cascade link 3)"

  - entity: DelayIncident
    initial_state: OPEN
    terminal_states: [CONFIRMED, REVERSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /rail/delay-incidents/{id}/confirm"
        actor: PassengerOperator
        preconditions: []
        side_effects:
          - "TrainRun.attributed_host_delay_minutes recomputed"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /rail/delay-incidents/{id}/dispute"
        actor: "PassengerOperator | HostRailroadRep"
        preconditions:
          - "incident has no DispatchPriorityDispute yet (guaranteed while status == OPEN; a resolved dispute returns the incident to CONFIRMED or REVERSED, which the state check rejects first)"
        side_effects:
          - "creates DispatchPriorityDispute in UNDER_REVIEW"
      - from: DISPUTED
        to: CONFIRMED
        trigger: "system (dispute resolved UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "TrainRun.attributed_host_delay_minutes recomputed"
      - from: DISPUTED
        to: REVERSED
        trigger: "system (dispute resolved OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "TrainRun.attributed_host_delay_minutes recomputed"

  - entity: DispatchPriorityDispute
    initial_state: UNDER_REVIEW
    terminal_states: [RESOLVED]
    transitions:
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /rail/disputes/{id}/escalate"
        actor: PassengerOperator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /rail/disputes/{id}/resolve"
        actor: SystemAdmin
        preconditions:
          - "resolution == UPHELD (OVERTURNED requires ESCALATED, else ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at set; DelayIncident -> CONFIRMED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /rail/disputes/{id}/resolve"
        actor: SystemAdmin
        preconditions:
          - "resolution in {UPHELD, OVERTURNED}"
        side_effects:
          - "UPHELD: DelayIncident -> CONFIRMED"
          - "OVERTURNED: DelayIncident -> REVERSED and TrainRun.attributed_host_delay_minutes recomputed"

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [COMPLETED]
    transitions:
      - from: PROPOSED
        to: FUNDED
        trigger: "POST /rail/capital-projects/{id}/approve"
        actor: HostRailroadRep
        preconditions:
          - "expected_operating_agreement_version == current OperatingAgreement.version (OCC, ERR_STALE_VERSION)"
          - "OperatingAgreement.status == ACTIVE"
        side_effects:
          - "increments OperatingAgreement.version by 1 (approval pins the agreement terms)"
      - from: FUNDED
        to: IN_PROGRESS
        trigger: "POST /rail/capital-projects/{id}/start"
        actor: HostRailroadRep
        preconditions: []
        side_effects:
          - "TrackSegment.status -> CAPITAL_HOLD"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /rail/capital-projects/{id}/start"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /rail/capital-projects/{id}/suspend"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /rail/capital-projects/{id}/complete"
        actor: HostRailroadRep
        preconditions: []
        side_effects:
          - "TrackSegment.capacity_trains_per_day += added_frequency_capacity (exactly once per project)"
          - "TrackSegment.status -> OPERABLE"

  - entity: MaintenanceWindow
    initial_state: PLANNED
    terminal_states: [RELEASED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /rail/maintenance-windows/{id}/lock"
        actor: HostRailroadRep
        preconditions:
          - "consumed equipment hours for this unit's ISO week + window_hours <= 40.00 (ERR_EQUIPMENT_ALLOWANCE_EXCEEDED)"
        side_effects:
          - "consumes window_hours of the equipment unit's weekly allowance"
          - "cross-entity cascade: PLANNED SegmentPassages on this segment whose clearance-expanded planned interval intersects the window -> SKIPPED"
      - from: PLANNED
        to: RELEASED
        trigger: "POST /rail/maintenance-windows/{id}/release"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: RELEASED
        trigger: "POST /rail/maintenance-windows/{id}/release"
        actor: HostRailroadRep
        preconditions: []
        side_effects:
          - "restores window_hours to the equipment unit's weekly allowance (equipment_week_hours_available recomputed)"

  - entity: ServiceDisruption
    initial_state: OPEN
    terminal_states: [RECOVERED]
    transitions:
      - from: OPEN
        to: BRIDGED
        trigger: "POST /rail/service-disruptions/{id}/bridge"
        actor: HostRailroadRep
        preconditions: []
        side_effects:
          - "bus_bridge_active = true"
          - "cascade link 1: SCHEDULED and EN_ROUTE TrainRuns on this corridor whose scheduled_departure_at >= started_at and service_date overlaps the disruption -> DISRUPTED with cancellation_reason=DISRUPTION"
      - from: BRIDGED
        to: RECOVERED
        trigger: "POST /rail/service-disruptions/{id}/recover"
        actor: HostRailroadRep
        preconditions: []
        side_effects:
          - "bus_bridge_active = false"
          - "cleared_at set to current logical clock"

  - entity: FundingAgreement
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /rail/funding-agreements/{id}/commit"
        actor: StateSponsor
        preconditions:
          - "no other COMMITTED FundingAgreement for the same corridor_id + state_code with overlapping [period_start, period_end] (ERR_FUNDING_PERIOD_OVERLAP)"
        side_effects:
          - "allocated_cost_cents computed via funding_cost_allocation"
      - from: COMMITTED
        to: SETTLED
        trigger: "POST /rail/funding-agreements/{id}/settle"
        actor: StateSponsor
        preconditions: []
        side_effects: []

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rail/settlement-statements/{id}/issue"
        actor: PassengerOperator
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /rail/settlement-statements/{id}/dispute"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: REISSUED
        trigger: "POST /rail/settlement-statements/{id}/reissue"
        actor: PassengerOperator
        preconditions: []
        side_effects:
          - "computation_variant flips GROSS -> NET; otp_pct, host_delay_minutes, penalty_cents, incentive_cents, net_cents recomputed from current CONFIRMED incidents"
      - from: ISSUED
        to: PAID
        trigger: "POST /rail/settlement-statements/{id}/pay"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []
      - from: REISSUED
        to: PAID
        trigger: "POST /rail/settlement-statements/{id}/pay"
        actor: HostRailroadRep
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: oa-amend-stale-version
    parent_entity: OperatingAgreement
    write_endpoint: "POST /rail/operating-agreements/{id}/amend"
    occ_field: expected_operating_agreement_version
    description: |
      Amending an OperatingAgreement whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. A prior
      accepted amend or capital-project approval advances the version, so a
      second writer carrying the old expected version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: project-approve-stale-agreement
    parent_entity: OperatingAgreement
    write_endpoint: "POST /rail/capital-projects/{id}/approve"
    occ_field: expected_operating_agreement_version
    description: |
      Approving capital funding pins the agreement terms observed by the
      approver. If the OperatingAgreement's version has advanced since the
      client read it (e.g. an amend landed first), the approval is rejected
      with ERR_STALE_VERSION because it would pin superseded terms.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: otp_measurement
    trigger: "TrainRun completion; settlement statement creation/reissue"
    algorithm: aggregation
    formula: |
      destination_arrival_delay_minutes = max(0, floor((actual_arrival_at - scheduled_arrival_at) / 60))
      passage_exit_delay(p) = max(0, floor((p.actual_exit_at - p.planned_exit_at) / 60))
      variant endpoint_only:  on_time = (destination_arrival_delay_minutes <= agreement.on_time_threshold_minutes)
      variant all_stations:   on_time = endpoint_only AND for every ACTUALIZED passage p of the run: passage_exit_delay(p) <= threshold
      OTP% over a statement period = 100 * count(COMPLETED runs with on_time true) / completed_run_count,
        computed with the endpoint_only variant, 4 decimal places round_half_up.
      When completed_run_count == 0, otp_pct is null (not 0, not an error).
    input_set: "COMPLETED TrainRuns of the agreement's corridor with service_date in [period_start, period_end] inclusive"
    precision: "otp_pct 4 decimal places, round_half_up; delays integer minutes, truncated"
    variants:
      - name: endpoint_only
        when: "settlement banding and statement otp_pct"
        difference: "only destination arrival delay is measured"
      - name: all_stations
        when: "published per-run punctuality flag on_time_all_stations"
        difference: "additionally requires every intermediate segment exit within threshold; identical run data can yield on_time_endpoint=true and on_time_all_stations=false"

  - name: host_delay_attribution
    trigger: "SettlementStatement create/issue (GROSS) and reissue (NET); TrainRun.attributed_host_delay_minutes recompute on incident confirm/reverse"
    algorithm: aggregation
    formula: |
      host_set = DelayIncidents on COMPLETED runs of the corridor, service_date in period,
                 status == CONFIRMED, host_attributable == true
      non_host_set = same but host_attributable == false
      GROSS: host_delay_minutes = sum(host_set.delay_minutes)
      NET:   host_delay_minutes = max(0, sum(host_set.delay_minutes) - sum(non_host_set.delay_minutes))
      TrainRun.attributed_host_delay_minutes = sum(CONFIRMED host-attributable incident minutes for that run only)
    input_set: "DelayIncidents keyed by train_run service_date; DISPUTED and REVERSED incidents are excluded from both sets"
    precision: "integer minutes"
    variants:
      - name: gross
        when: "statement created and issued (computation_variant = GROSS)"
        difference: "raw sum of confirmed host-attributable minutes"
      - name: net
        when: "statement reissued after dispute (computation_variant = NET)"
        difference: "subtracts confirmed non-host minutes as a recovery offset; identical incident data yields NET <= GROSS"

  - name: incentive_penalty_settlement
    trigger: "SettlementStatement create and reissue"
    algorithm: tiered_pricing
    formula: |
      inputs: otp_pct (fraction = otp_pct/100, null allowed), agreement.otp_target_pct,
              host_delay_minutes (per variant), train_miles,
              agreement.penalty_rate_cents_per_minute, agreement.incentive_rate_cents_per_train_mile
      if otp_pct is null:
        penalty_cents = 0; incentive_cents = 0
      elif otp >= otp_target_pct:
        incentive_cents = round_half_up(incentive_rate_cents_per_train_mile * train_miles * (otp - otp_target_pct))
        penalty_cents = 0
      else:
        tier_multiplier = 1 if otp >= otp_target_pct - 0.05
                          else 2 if otp >= otp_target_pct - 0.15
                          else 3
        penalty_cents = round_half_up(penalty_rate_cents_per_minute * host_delay_minutes * tier_multiplier)
        incentive_cents = 0
      net_cents = incentive_cents - penalty_cents
    input_set: "one SettlementStatement row; otp from otp_measurement endpoint_only variant"
    constants:
      TIER1_BAND: 0.05
      TIER2_BAND: 0.15
    precision: "integer cents, round_half_up"

  - name: funding_cost_allocation
    trigger: "FundingAgreement commit"
    algorithm: waterfall_allocation
    formula: |
      days = inclusive day count of [period_start, period_end]
      period_cost_cents = round_half_up(corridor.annual_cost_cents * days / 365)          # rounding step 1
      total_miles = sum over corridor segments of (milepost_end - milepost_start)
      state_miles(S) = sum over corridor segments with state_code == S of (milepost_end - milepost_start)
      per-state line(S) = round_half_up(period_cost_cents * state_miles(S) / total_miles) # rounding step 2, PER LINE FIRST
      allocated_cost_cents for the committed agreement = line(its state_code)
      The authoritative corridor total is the SUM OF ROUNDED PER-STATE LINES; the rounding
      remainder is NOT redistributed, so the total may differ from period_cost_cents.
    input_set: "TrackSegments of the corridor (any status)"
    precision: "integer cents; rounding order pinned: round period cost first, then round each state line, then sum"

  - name: schedule_feasibility
    trigger: "Timetable propose; SegmentPassage materialization at publish; MaintenanceWindow lock"
    algorithm: interval_merge
    formula: |
      For run k (0-based), scheduled_departure = service_date + departure_time_of_day + k * headway_minutes.
      Walk segments in ascending sequence_no (chronological, no ties possible since sequence_no is unique per corridor):
        planned_entry(1) = scheduled_departure
        planned_exit(i)  = planned_entry(i) + ceil(pure_run_minutes(i) * (1 + running_time_allowance_pct)) minutes
        planned_entry(i+1) = planned_exit(i) + dwell_after_minutes(i)
      Overlap rule (SINGLE segments): passages p, q conflict iff p.entry < q.exit AND q.entry < p.entry
        (half-open; p.exit == q.entry is NOT a conflict). DOUBLE segments never conflict.
      Capacity rule: per segment per service_date, count of runs crossing the segment must be <= capacity_trains_per_day.
      Maintenance rule: passage p conflicts with LOCKED window w (buffer b) on the same segment iff
        p.entry < w.end + b minutes AND p.exit > w.start - b minutes (clearance-expanded; exact buffer equality is NOT a conflict).
      Feasibility failures: overlap -> ERR_SCHEDULE_INFEASIBLE; capacity -> ERR_CAPACITY_EXCEEDED.
      The same rules apply to ACTUALIZED passages at actualize time using actual instants.
    input_set: "TrackSegments of the corridor ordered by sequence_no; LOCKED MaintenanceWindows; ACTUALIZED/PLANNED SegmentPassages on the same segment"
    precision: "whole minutes; ceil applied to padded run time before adding dwell"

  - name: equipment_hours_budget
    trigger: "MaintenanceWindow lock and release"
    algorithm: threshold
    formula: |
      window_hours(w) = round_half_up((w.window_end_at - w.window_start_at) / 3600 seconds, 2 decimals)
      ISO week of w = week containing w.window_start_at, weeks start Monday 00:00:00Z
      consumed(unit, week) = sum of window_hours over LOCKED windows of equipment_unit_id == unit whose start is in week
      lock allowed iff consumed + window_hours(w) <= WEEKLY_EQUIPMENT_ALLOWANCE_HOURS (exactly 40.00 is allowed)
      equipment_week_hours_available(w) = WEEKLY_EQUIPMENT_ALLOWANCE_HOURS - consumed(unit, week of w)
      release of a LOCKED window restores exactly its window_hours.
    input_set: "LOCKED MaintenanceWindows sharing equipment_unit_id and ISO week"
    constants:
      WEEKLY_EQUIPMENT_ALLOWANCE_HOURS: 40.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: format
    check: "Request body is valid JSON; all required fields present; enum fields hold declared members; numeric fields in range (milepost_end > milepost_start, window_end_at > window_start_at, delay_minutes >= 0)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 3
    category: authz
    check: "Role is permitted for the endpoint; for HostRailroadRep, X-User-ID must equal the id of the HostRailroad that owns the target resource (via corridor/agreement chain)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 4
    category: existence
    check: "Every id in the path and every FK id in the body exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints

  - priority: 5
    category: concurrency
    check: "expected_operating_agreement_version equals the agreement's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rail/operating-agreements/{id}/amend, POST /rail/capital-projects/{id}/approve"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints

  - priority: 7
    category: state
    check: "OperatingAgreement must be ACTIVE to ratify a timetable or approve a capital project"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rail/timetables/{id}/ratify, POST /rail/capital-projects/{id}/approve, POST /rail/settlement-statements"

  - priority: 8
    category: state
    check: "All SegmentPassages of a TrainRun must be ACTUALIZED or SKIPPED before complete"
    error_id: ERR_RUN_PASSAGES_OPEN
    http_status: 409
    applies_to: "POST /rail/train-runs/{id}/complete"

  - priority: 9
    category: business_safety
    check: "Actualized passage or published timetable must not intersect a LOCKED maintenance window under clearance-buffer semantics"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 409
    applies_to: "POST /rail/segment-passages/{id}/actualize, POST /rail/timetables/{id}/publish"

  - priority: 10
    category: business_temporal
    check: "On SINGLE-track segments, actual occupancy intervals must not overlap (half-open); planned schedule must be internally non-overlapping"
    error_id: ERR_SEGMENT_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /rail/segment-passages/{id}/actualize"

  - priority: 11
    category: business_temporal
    check: "Proposed timetable must be internally feasible (no planned SINGLE-track overlaps)"
    error_id: ERR_SCHEDULE_INFEASIBLE
    http_status: 422
    applies_to: "POST /rail/timetables/{id}/propose"

  - priority: 12
    category: business_constraint
    check: "Per-segment per-day run count must not exceed capacity_trains_per_day"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /rail/timetables/{id}/propose"

  - priority: 13
    category: business_constraint
    check: "Equipment unit weekly hours after lock must be <= 40.00"
    error_id: ERR_EQUIPMENT_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /rail/maintenance-windows/{id}/lock"

  - priority: 14
    category: business_referential
    check: "Cross-references must be internally consistent: Timetable.corridor_id == OperatingAgreement.corridor_id; DelayIncident.segment_passage_id must belong to DelayIncident.train_run_id; CapitalProject.track_segment_id must belong to the agreement's corridor"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /rail/timetables, POST /rail/delay-incidents, POST /rail/capital-projects"

  - priority: 15
    category: business_fiscal
    check: "Statement period must lie within the agreement's effective range and must not overlap an existing ISSUED/PAID statement for the same agreement"
    error_id: ERR_SETTLEMENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /rail/settlement-statements"

  - priority: 16
    category: business_fiscal
    check: "No two COMMITTED FundingAgreements for the same corridor + state may have overlapping periods"
    error_id: ERR_FUNDING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rail/funding-agreements/{id}/commit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- infrastructure ---
  - method: POST
    path: "/rail/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["OperatingAgreements whose effective_to has been reached transition ACTIVE -> EXPIRED"]

  # --- HostRailroad ---
  - method: POST
    path: "/rail/host-railroads"
    description: "Register a host freight railroad"
    roles: [SystemAdmin]
    code: 201
    input: [name, reporting_mark]
    output: HostRailroad
    side_effects: []

  - method: GET
    path: "/rail/host-railroads/{id}"
    description: "Get one host railroad"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: HostRailroad
    side_effects: []

  # --- Corridor ---
  - method: POST
    path: "/rail/corridors"
    description: "Create a corridor on a host railroad"
    roles: [SystemAdmin]
    code: 201
    input: [host_railroad_id, code, name, endpoint_a, endpoint_b, service_type, annual_cost_cents]
    output: Corridor
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/rail/corridors"
    description: "List corridors"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "host_railroad_id?", "status?"]
    output: Corridor[]
    side_effects: []

  - method: GET
    path: "/rail/corridors/{id}"
    description: "Get one corridor"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: Corridor
    side_effects: []

  # --- TrackSegment ---
  - method: POST
    path: "/rail/track-segments"
    description: "Add a track segment to a corridor"
    roles: [SystemAdmin]
    code: 201
    input: [corridor_id, sequence_no, milepost_start, milepost_end, state_code, track_class, capacity_trains_per_day, pure_run_minutes, "dwell_after_minutes?"]
    output: TrackSegment
    side_effects: ["status = OPERABLE"]

  - method: GET
    path: "/rail/track-segments"
    description: "List segments, sorted by corridor then sequence_no ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "corridor_id?", "state_code?", "status?"]
    output: TrackSegment[]
    side_effects: []

  - method: GET
    path: "/rail/track-segments/{id}"
    description: "Get one segment"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: TrackSegment
    side_effects: []

  # --- OperatingAgreement ---
  - method: POST
    path: "/rail/operating-agreements"
    description: "Draft an operating agreement"
    roles: [PassengerOperator]
    code: 201
    input: [host_railroad_id, corridor_id, effective_from, effective_to, on_time_threshold_minutes, penalty_rate_cents_per_minute, incentive_rate_cents_per_train_mile, otp_target_pct, running_time_allowance_pct]
    output: OperatingAgreement
    side_effects: ["status = DRAFT, amendment_seq = 0"]

  - method: GET
    path: "/rail/operating-agreements"
    description: "List operating agreements"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "host_railroad_id?", "corridor_id?", "status?"]
    output: OperatingAgreement[]
    side_effects: []

  - method: GET
    path: "/rail/operating-agreements/{id}"
    description: "Get one agreement"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: OperatingAgreement
    side_effects: []

  - method: POST
    path: "/rail/operating-agreements/{id}/activate"
    description: "Host accepts the drafted agreement"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: OperatingAgreement
    side_effects: ["DRAFT -> ACTIVE", "increments OperatingAgreement.version by 1"]

  - method: POST
    path: "/rail/operating-agreements/{id}/amend"
    description: "Amend commercial terms; OCC-guarded; returns in-flight timetables to DRAFT"
    roles: [PassengerOperator]
    code: 200
    input: [expected_operating_agreement_version, "penalty_rate_cents_per_minute?", "incentive_rate_cents_per_train_mile?", "otp_target_pct?", "running_time_allowance_pct?"]
    output: OperatingAgreement
    side_effects: ["amendment_seq += 1", "increments OperatingAgreement.version by 1", "cascade: PROPOSED/UNDER_REVIEW Timetables of this agreement -> DRAFT"]

  - method: POST
    path: "/rail/operating-agreements/{id}/suspend"
    description: "Host suspends access; cascades to published timetables and their scheduled runs"
    roles: [HostRailroadRep]
    code: 200
    input: ["reason?"]
    output: OperatingAgreement
    side_effects: ["ACTIVE -> SUSPENDED", "increments OperatingAgreement.version by 1", "cascade link 1: PUBLISHED Timetables -> SUSPENDED", "cascade link 2: their SCHEDULED TrainRuns -> CANCELLED (AGREEMENT_SUSPENDED)"]

  # --- Timetable ---
  - method: POST
    path: "/rail/timetables"
    description: "Create a draft timetable under an operating agreement"
    roles: [PassengerOperator]
    code: 201
    input: [corridor_id, operating_agreement_id, service_date_start, service_date_end, trains_per_day, departure_time_of_day, headway_minutes]
    output: Timetable
    side_effects: ["status = DRAFT, revision_no = 0"]

  - method: GET
    path: "/rail/timetables"
    description: "List timetables"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "corridor_id?", "operating_agreement_id?", "status?"]
    output: Timetable[]
    side_effects: []

  - method: GET
    path: "/rail/timetables/{id}"
    description: "Get one timetable"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: Timetable
    side_effects: []

  - method: POST
    path: "/rail/timetables/{id}/propose"
    description: "Submit draft timetable for host review; runs schedule_feasibility"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: Timetable
    side_effects: ["DRAFT -> PROPOSED"]

  - method: POST
    path: "/rail/timetables/{id}/review"
    description: "Host opens review of a proposed timetable"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: Timetable
    side_effects: ["PROPOSED -> UNDER_REVIEW"]

  - method: POST
    path: "/rail/timetables/{id}/revise"
    description: "Return an under-review timetable to proposed for another negotiation round"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: Timetable
    side_effects: ["UNDER_REVIEW -> PROPOSED", "revision_no += 1"]

  - method: POST
    path: "/rail/timetables/{id}/ratify"
    description: "Host ratifies the reviewed timetable; requires ACTIVE agreement"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: Timetable
    side_effects: ["UNDER_REVIEW -> RATIFIED"]

  - method: POST
    path: "/rail/timetables/{id}/publish"
    description: "Publish a ratified timetable; materializes TrainRuns and SegmentPassages; supersedes overlapping published timetables of the same corridor"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: Timetable
    side_effects: ["RATIFIED -> PUBLISHED", "materializes TrainRuns (SCHEDULED) and SegmentPassages (PLANNED) per schedule_feasibility", "overlapping PUBLISHED timetables of the corridor -> SUPERSEDED"]

  # --- TrainRun ---
  - method: GET
    path: "/rail/train-runs"
    description: "List train runs, sorted by scheduled_departure_at ASC then created_at ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "timetable_id?", "service_date?", "status?"]
    output: TrainRun[]
    side_effects: []

  - method: GET
    path: "/rail/train-runs/{id}"
    description: "Get one train run"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: TrainRun
    side_effects: []

  - method: POST
    path: "/rail/train-runs/{id}/depart"
    description: "Record actual origin departure"
    roles: [HostRailroadRep]
    code: 200
    input: [actual_departure_at]
    output: TrainRun
    side_effects: ["SCHEDULED -> EN_ROUTE", "origin_departure_delay_minutes computed"]

  - method: POST
    path: "/rail/train-runs/{id}/complete"
    description: "Record actual destination arrival; requires all passages final"
    roles: [HostRailroadRep]
    code: 200
    input: [actual_arrival_at]
    output: TrainRun
    side_effects: ["EN_ROUTE -> COMPLETED", "destination_arrival_delay_minutes, on_time_endpoint, on_time_all_stations computed"]

  - method: POST
    path: "/rail/train-runs/{id}/cancel"
    description: "Operator cancels a scheduled run"
    roles: [PassengerOperator]
    code: 200
    input: ["reason?"]
    output: TrainRun
    side_effects: ["SCHEDULED -> CANCELLED (OPERATOR_CANCEL)"]

  # --- SegmentPassage ---
  - method: GET
    path: "/rail/segment-passages"
    description: "List passages, sorted by segment_sequence_no ASC then created_at ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "train_run_id?", "track_segment_id?", "status?"]
    output: SegmentPassage[]
    side_effects: []

  - method: GET
    path: "/rail/segment-passages/{id}"
    description: "Get one passage"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: SegmentPassage
    side_effects: []

  - method: POST
    path: "/rail/segment-passages/{id}/actualize"
    description: "Record actual occupancy of a segment; enforces maintenance clearance and SINGLE-track occupancy rules"
    roles: [HostRailroadRep]
    code: 200
    input: [actual_entry_at, actual_exit_at]
    output: SegmentPassage
    side_effects: ["PLANNED -> ACTUALIZED"]

  # --- DelayIncident / Dispute ---
  - method: POST
    path: "/rail/delay-incidents"
    description: "Code delay minutes against a run with a root-cause code"
    roles: [HostRailroadRep]
    code: 201
    input: [train_run_id, cause_code, delay_minutes, "segment_passage_id?"]
    output: DelayIncident
    side_effects: ["status = OPEN", "host_attributable derived from cause_code", "origin = CODED"]

  - method: GET
    path: "/rail/delay-incidents"
    description: "List delay incidents, sorted by created_at ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "train_run_id?", "segment_passage_id?", "status?", "cause_code?"]
    output: DelayIncident[]
    side_effects: []

  - method: GET
    path: "/rail/delay-incidents/{id}"
    description: "Get one incident"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: DelayIncident
    side_effects: []

  - method: POST
    path: "/rail/delay-incidents/{id}/confirm"
    description: "Passenger operator countersigns the host's coding"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: DelayIncident
    side_effects: ["OPEN -> CONFIRMED", "TrainRun.attributed_host_delay_minutes recomputed"]

  - method: POST
    path: "/rail/delay-incidents/{id}/dispute"
    description: "Open a dispatch-priority dispute on an incident"
    roles: [PassengerOperator, HostRailroadRep]
    code: 201
    input: ["reason?"]
    output: DispatchPriorityDispute
    side_effects: ["DelayIncident OPEN -> DISPUTED", "creates DispatchPriorityDispute in UNDER_REVIEW"]

  - method: GET
    path: "/rail/disputes"
    description: "List disputes, sorted by created_at ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "train_run_id?", "delay_incident_id?", "status?"]
    output: DispatchPriorityDispute[]
    side_effects: []

  - method: GET
    path: "/rail/disputes/{id}"
    description: "Get one dispute"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: DispatchPriorityDispute
    side_effects: []

  - method: POST
    path: "/rail/disputes/{id}/escalate"
    description: "Escalate a dispute to formal adjudication"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: DispatchPriorityDispute
    side_effects: ["UNDER_REVIEW -> ESCALATED"]

  - method: POST
    path: "/rail/disputes/{id}/resolve"
    description: "Arbiter resolves; UPHELD from UNDER_REVIEW or ESCALATED, OVERTURNED only from ESCALATED"
    roles: [SystemAdmin]
    code: 200
    input: [resolution]
    output: DispatchPriorityDispute
    side_effects: ["UPHELD: incident -> CONFIRMED", "OVERTURNED: incident -> REVERSED and attributed minutes recomputed"]

  # --- CapitalProject ---
  - method: POST
    path: "/rail/capital-projects"
    description: "Propose a capital improvement (siding/signal/double-track)"
    roles: [PassengerOperator]
    code: 201
    input: [operating_agreement_id, track_segment_id, project_type, funded_amount_cents, added_frequency_capacity]
    output: CapitalProject
    side_effects: ["status = PROPOSED"]

  - method: GET
    path: "/rail/capital-projects"
    description: "List capital projects"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "operating_agreement_id?", "track_segment_id?", "status?"]
    output: CapitalProject[]
    side_effects: []

  - method: GET
    path: "/rail/capital-projects/{id}"
    description: "Get one capital project"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []

  - method: POST
    path: "/rail/capital-projects/{id}/approve"
    description: "Host approves funding; OCC-pins the agreement terms observed"
    roles: [HostRailroadRep]
    code: 200
    input: [expected_operating_agreement_version]
    output: CapitalProject
    side_effects: ["PROPOSED -> FUNDED", "increments OperatingAgreement.version by 1"]

  - method: POST
    path: "/rail/capital-projects/{id}/start"
    description: "Begin (or resume) construction"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["FUNDED -> IN_PROGRESS or SUSPENDED -> IN_PROGRESS", "TrackSegment.status -> CAPITAL_HOLD"]

  - method: POST
    path: "/rail/capital-projects/{id}/suspend"
    description: "Pause construction"
    roles: [HostRailroadRep]
    code: 200
    input: ["reason?"]
    output: CapitalProject
    side_effects: ["IN_PROGRESS -> SUSPENDED"]

  - method: POST
    path: "/rail/capital-projects/{id}/complete"
    description: "Finish construction; adds frequency capacity to the segment"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["IN_PROGRESS -> COMPLETED", "TrackSegment.capacity_trains_per_day += added_frequency_capacity", "TrackSegment.status -> OPERABLE"]

  # --- MaintenanceWindow ---
  - method: POST
    path: "/rail/maintenance-windows"
    description: "Plan a maintenance window for an equipment unit on a segment"
    roles: [HostRailroadRep]
    code: 201
    input: [track_segment_id, window_start_at, window_end_at, equipment_unit_id, "clearance_buffer_minutes?"]
    output: MaintenanceWindow
    side_effects: ["status = PLANNED", "window_hours computed"]

  - method: GET
    path: "/rail/maintenance-windows"
    description: "List maintenance windows, sorted by window_start_at ASC then created_at ASC"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "track_segment_id?", "equipment_unit_id?", "status?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: GET
    path: "/rail/maintenance-windows/{id}"
    description: "Get one maintenance window"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: POST
    path: "/rail/maintenance-windows/{id}/lock"
    description: "Lock the window; consumes weekly equipment hours; skips conflicting planned passages"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["PLANNED -> LOCKED", "conflicting PLANNED SegmentPassages on the segment -> SKIPPED"]

  - method: POST
    path: "/rail/maintenance-windows/{id}/release"
    description: "Release the window; restores equipment hours"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["PLANNED or LOCKED -> RELEASED", "equipment_week_hours_available recomputed"]

  # --- ServiceDisruption ---
  - method: POST
    path: "/rail/service-disruptions"
    description: "Declare a service disruption on a corridor"
    roles: [HostRailroadRep]
    code: 201
    input: [corridor_id, disruption_type, started_at, reaccommodation_policy]
    output: ServiceDisruption
    side_effects: ["status = OPEN, bus_bridge_active = false"]

  - method: GET
    path: "/rail/service-disruptions"
    description: "List disruptions"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "corridor_id?", "status?"]
    output: ServiceDisruption[]
    side_effects: []

  - method: GET
    path: "/rail/service-disruptions/{id}"
    description: "Get one disruption"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: ServiceDisruption
    side_effects: []

  - method: POST
    path: "/rail/service-disruptions/{id}/bridge"
    description: "Activate bus bridging; cascades to runs, passages, and auto-coded incidents"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: ServiceDisruption
    side_effects: ["OPEN -> BRIDGED", "bus_bridge_active = true", "cascade link 1: affected TrainRuns -> DISRUPTED (DISRUPTION)", "cascade link 2: their PLANNED passages -> SKIPPED", "cascade link 3: auto DelayIncident (DISRUPTION, SYSTEM_DISRUPTION) per fully-skipped run"]

  - method: POST
    path: "/rail/service-disruptions/{id}/recover"
    description: "Mark the disruption recovered"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: ServiceDisruption
    side_effects: ["BRIDGED -> RECOVERED", "bus_bridge_active = false", "cleared_at set"]

  # --- FundingAgreement ---
  - method: POST
    path: "/rail/funding-agreements"
    description: "Draft a state funding agreement for a corridor"
    roles: [StateSponsor]
    code: 201
    input: [corridor_id, state_code, period_start, period_end]
    output: FundingAgreement
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/rail/funding-agreements"
    description: "List funding agreements"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "corridor_id?", "state_code?", "status?"]
    output: FundingAgreement[]
    side_effects: []

  - method: GET
    path: "/rail/funding-agreements/{id}"
    description: "Get one funding agreement"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: FundingAgreement
    side_effects: []

  - method: POST
    path: "/rail/funding-agreements/{id}/commit"
    description: "Commit funding; computes the state's allocated cost share"
    roles: [StateSponsor]
    code: 200
    input: []
    output: FundingAgreement
    side_effects: ["DRAFT -> COMMITTED", "allocated_cost_cents computed via funding_cost_allocation"]

  - method: POST
    path: "/rail/funding-agreements/{id}/settle"
    description: "Settle a committed funding agreement"
    roles: [StateSponsor]
    code: 200
    input: []
    output: FundingAgreement
    side_effects: ["COMMITTED -> SETTLED"]

  # --- SettlementStatement ---
  - method: POST
    path: "/rail/settlement-statements"
    description: "Generate a settlement statement for an agreement and period (GROSS variant)"
    roles: [PassengerOperator]
    code: 201
    input: [operating_agreement_id, period_start, period_end]
    output: SettlementStatement
    side_effects: ["status = DRAFT, computation_variant = GROSS", "otp_pct, train_miles, host_delay_minutes, penalty_cents, incentive_cents, net_cents computed"]

  - method: GET
    path: "/rail/settlement-statements"
    description: "List settlement statements"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: ["limit?", "offset?", "operating_agreement_id?", "status?"]
    output: SettlementStatement[]
    side_effects: []

  - method: GET
    path: "/rail/settlement-statements/{id}"
    description: "Get one settlement statement"
    roles: [SystemAdmin, PassengerOperator, HostRailroadRep, StateSponsor]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []

  - method: POST
    path: "/rail/settlement-statements/{id}/issue"
    description: "Issue a draft statement"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["DRAFT -> ISSUED"]

  - method: POST
    path: "/rail/settlement-statements/{id}/dispute"
    description: "Host disputes an issued statement"
    roles: [HostRailroadRep]
    code: 200
    input: ["reason?"]
    output: SettlementStatement
    side_effects: ["ISSUED -> DISPUTED"]

  - method: POST
    path: "/rail/settlement-statements/{id}/reissue"
    description: "Recompute a disputed statement with the NET variant"
    roles: [PassengerOperator]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["DISPUTED -> REISSUED", "computation_variant -> NET; all computed fields refreshed from current CONFIRMED incidents"]

  - method: POST
    path: "/rail/settlement-statements/{id}/pay"
    description: "Host pays an issued or reissued statement"
    roles: [HostRailroadRep]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["ISSUED|REISSUED -> PAID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed JSON, missing required field, invalid enum member, or numeric range violation (milepost_end <= milepost_start, window_end_at <= window_start_at, negative delay_minutes)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or HostRailroadRep acting on a resource owned by a different HostRailroad" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_operating_agreement_version does not match the agreement's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared from the resource's current state (incl. OVERTURNED from a non-escalated dispute, double confirm, terminal-state writes)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "OperatingAgreement must be ACTIVE for ratify / capital approve / settlement creation" }
  - { id: ERR_RUN_PASSAGES_OPEN, http: 409, condition: "TrainRun complete attempted while a SegmentPassage is still PLANNED" }
  - { id: ERR_MAINTENANCE_CONFLICT, http: 409, condition: "Occupancy intersects a LOCKED maintenance window under clearance-buffer semantics" }
  - { id: ERR_SEGMENT_OCCUPANCY_CONFLICT, http: 409, condition: "Actual occupancy overlaps another ACTUALIZED passage on the same SINGLE-track segment (half-open intervals)" }
  - { id: ERR_SCHEDULE_INFEASIBLE, http: 422, condition: "Proposed timetable has planned SINGLE-track passage overlaps" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Proposed timetable exceeds a segment's capacity_trains_per_day for a service date" }
  - { id: ERR_EQUIPMENT_ALLOWANCE_EXCEEDED, http: 409, condition: "Locking the window would push the equipment unit past 40.00 hours in its ISO week" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Cross-reference mismatch: timetable corridor vs agreement corridor, incident passage vs run, project segment vs agreement corridor" }
  - { id: ERR_SETTLEMENT_PERIOD_INVALID, http: 422, condition: "Statement period outside the agreement's effective range or overlapping an existing ISSUED/PAID statement" }
  - { id: ERR_FUNDING_PERIOD_OVERLAP, http: 409, condition: "A COMMITTED FundingAgreement already covers an overlapping period for this corridor + state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; registers railroads/corridors/segments, drives the logical clock, arbitrates escalated disputes"
    identity: opaque
    exclusive_operations:
      - "POST /rail/_clock/set_current_utc"
      - "POST /rail/host-railroads"
      - "POST /rail/corridors"
      - "POST /rail/track-segments"
      - "POST /rail/disputes/{id}/resolve"
    shared_operations:
      - "All GET endpoints"

  - name: PassengerOperator
    description: "The passenger railroad (Amtrak); drafts agreements, builds and publishes timetables, codes/confirms incidents, files disputes, drafts capital projects and settlement statements"
    identity: opaque
    exclusive_operations:
      - "POST /rail/operating-agreements"
      - "POST /rail/operating-agreements/{id}/amend"
      - "POST /rail/timetables (+ propose / revise / publish)"
      - "POST /rail/train-runs/{id}/cancel"
      - "POST /rail/delay-incidents/{id}/confirm"
      - "POST /rail/disputes/{id}/escalate"
      - "POST /rail/capital-projects"
      - "POST /rail/settlement-statements (+ issue / reissue)"
    shared_operations:
      - "POST /rail/delay-incidents/{id}/dispute"
      - "All GET endpoints"

  - name: HostRailroadRep
    description: "Dispatching representative of a host freight railroad; X-User-ID is the HostRailroad id and ownership is enforced through the corridor/agreement chain"
    identity: "entity_backed:HostRailroad"
    exclusive_operations:
      - "POST /rail/operating-agreements/{id}/activate"
      - "POST /rail/operating-agreements/{id}/suspend"
      - "POST /rail/timetables/{id}/review and /ratify"
      - "POST /rail/train-runs/{id}/depart and /complete"
      - "POST /rail/segment-passages/{id}/actualize"
      - "POST /rail/delay-incidents (delay coding)"
      - "POST /rail/capital-projects/{id}/approve, /start, /suspend, /complete"
      - "POST /rail/maintenance-windows (+ lock / release)"
      - "POST /rail/service-disruptions (+ bridge / recover)"
      - "POST /rail/settlement-statements/{id}/dispute and /pay"
    shared_operations:
      - "POST /rail/delay-incidents/{id}/dispute"
      - "All GET endpoints"

  - name: StateSponsor
    description: "State DOT funding partner for state-supported corridors"
    identity: opaque
    exclusive_operations:
      - "POST /rail/funding-agreements (+ commit / settle)"
    shared_operations:
      - "All GET endpoints"
