            - "Chargeback amount_cents == 1200000 (full clawback at 0 whole months)"
            - "EARNED_ADJUSTMENT amount_cents == 0"

      - name: cancel_after_twelve_months_creates_no_chargeback
        claim_type: input_set_filtering
        grounds: ["calculations.chargeback_unearned_commission"]
        distinguishing_aspect: "Zero-quantity edge: cancel effective 2027-08-01 earns all 12 months; unearned == 0 so NO Chargeback row is created (chargebacks list empty), while the EARNED_ADJUSTMENT carries the full 1200000."
        test_recipe:
