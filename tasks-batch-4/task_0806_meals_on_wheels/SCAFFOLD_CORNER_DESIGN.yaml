      - name: error_route_capacity_exceeded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / route_capacity_boundary_at_max
          rationale: "Capacity overflow is asserted at the boundary by that §1.8 instance."
      - name: error_hold_overlap_stub
