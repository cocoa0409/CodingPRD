# =============================================================================
# task_1069 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All literals pre-computed.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: appreciation_share_sale_vs_buyout
        grounds:
          - calculations.appreciation_share
          - state_machines.Agreement.EXIT_INITIATED_to_SETTLEMENT_PROPOSED
          - entities.Settlement.fields.appreciation_share_cents
        distinguishing_aspect: |
          On the Settlement entity domain: for an identical ending value of 120000000, the SALE
          variant is APR-capped to 3800000 while the BUYOUT variant is uncapped at 12000000 — same
          agreement, two algorithms, different results (distinct from offer_max_investment on the Offer domain).
        test_recipe:
          setup:
            - "Fund F1 total_capital 50000000; Homeowner HO; Application APPROVED with an AVM valuation of 80000000"
            - "Offer investment 10000000 / option 0.25 / risk_adj 0.10 accepted -> Agreement AGR (adjusted_start_value 72000000), Lien RECORDED, AGR ACTIVE then EXIT_INITIATED"
            - "Clock at 2028-07-01 (24 whole months after funded_at 2026-07-01)"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F1", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho1@x.com", full_name: "Ho One" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "1 Main St", property_type: "SINGLE_FAMILY", homeowner_estimated_value_cents: 80000000, existing_mortgage_balance_cents: 40000000, requested_investment_cents: 10000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements?offer_id=${offer_id}"
              payload: {}
              as: InvestmentAnalyst
              captures: { agr_id: "$.data[0].id" }
            - call: "GET /hei/liens?agreement_id=${agr_id}"
              payload: {}
              as: ClosingAgent
              captures: { lien_id: "$.data[0].id" }
            - call: "POST /hei/liens/${lien_id}/record"
              payload: { title_status: "CLEAR", lien_position: 2 }
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/activate"
              payload: {}
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/initiate-exit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /hei/agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /hei/agreements/${agr_id}/settlements"
              payload: { settlement_type: "SALE", sale_price_cents: 120000000, mortgage_payoff_cents: 40000000, expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { s_sale_id: $.data.id }
            - call: "GET /hei/agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v2: $.data.version }
            - call: "POST /hei/agreements/${agr_id}/settlements"
              payload: { settlement_type: "BUYOUT", current_appraised_value_cents: 120000000, mortgage_payoff_cents: 40000000, expected_agreement_version: "${agr_v2}" }
              as: ComplianceOfficer
              captures: { s_buyout_id: $.data.id }
          assert:
            - "Settlement.${s_sale_id}.appreciation_share_cents == 3800000"
            - "Settlement.${s_buyout_id}.appreciation_share_cents == 12000000"
            - "Settlement.${s_sale_id}.appreciation_share_cents != Settlement.${s_buyout_id}.appreciation_share_cents"

      - name: offer_max_investment_provisional_vs_final
        grounds:
          - calculations.offer_max_investment
          - state_machines.Offer.PRESENTED
          - validations[priority=12]
          - errors[ERR_INVESTMENT_EXCEEDS_LTV_CAP]
        distinguishing_aspect: |
          On the Offer entity domain: an identical investment_amount_cents of 25000000 is REJECTED on the
          provisional AVM basis (max floor(0.30*80000000)=24000000) but ACCEPTED on the final APPRAISAL
          basis (max floor(0.30*90000000)=27000000) — provisional vs final, a different entity domain than appreciation_share.
        test_recipe:
          setup:
            - "Application APPROVED; a COMPLETED AVM valuation of 80000000 AND a COMPLETED APPRAISAL valuation of 90000000 both exist"
            - "Fund available 50000000 so capital never binds; only the LTV cap differs by basis"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F2", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
              payload: { email: "ho2@x.com", full_name: "Ho Two" }
              as: InvestmentAnalyst
              captures: { ho_id: $.data.id }
            - call: "POST /hei/applications"
              payload: { homeowner_id: "${ho_id}", fund_id: "${fund_id}", property_address: "2 Main St", property_type: "CONDO", homeowner_estimated_value_cents: 90000000, existing_mortgage_balance_cents: 20000000, requested_investment_cents: 25000000 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "AVM", valued_amount_cents: 80000000, confidence_score: 0.9 }
              as: InvestmentAnalyst
              captures: { val_avm: $.data.id }
            - call: "POST /hei/applications/${app_id}/valuations"
              payload: { method: "APPRAISAL" }
              as: InvestmentAnalyst
              captures: { val_appr: $.data.id }
            - call: "POST /hei/appraisers"
              payload: { full_name: "Ann Appr", region_code: "CA-BAY" }
              as: InvestmentAnalyst
              captures: { appr_id: $.data.id }
            - call: "POST /hei/appraisal-appointments"
              payload: { appraiser_id: "${appr_id}", valuation_id: "${val_appr}", region_code: "CA-BAY", scheduled_start: "2026-07-05T10:00:00Z", scheduled_end: "2026-07-05T11:00:00Z" }
              as: InvestmentAnalyst
              captures: { appt_id: $.data.id }
            - call: "POST /hei/appraisal-appointments/${appt_id}/complete"
              payload: { valued_amount_cents: 90000000 }
              as: Appraiser
              as_user_id: "${appr_id}"
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
          trigger:
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_avm}", investment_amount_cents: 25000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { rej_error: $.data.error_id }
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_appr}", investment_amount_cents: 25000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { ok_offer_id: $.data.id }
          assert:
            - "trigger[0] response error_id == ERR_INVESTMENT_EXCEEDS_LTV_CAP (HTTP 422)"
            - "trigger[1] response status 201; Offer.${ok_offer_id}.status == PRESENTED"
            - "Offer.${ok_offer_id}.investment_amount_cents == 25000000"

  - rule_id: combinatorial_formula
    instances:
      - name: appreciation_share_nonlinear_cap_binds
        grounds:
          - calculations.appreciation_share
          - entities.Agreement.fields.capped_annual_rate
          - entities.Settlement.fields.appreciation_share_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula. appreciation_share = min( option*max(0, ending-adjusted_start),
          investment*rate*elapsed_months/12 ). With elapsed_months=6 the cap 950000 binds below the raw 12000000,
          so the nested min/max and the month input all matter (distinct mode from settlement_fee's rounding order).
        test_recipe:
          setup:
            - "AGR built exactly as appreciation_share_sale_vs_buyout (adjusted_start 72000000, investment 10000000, option 0.25, capped_annual_rate 0.19), EXIT_INITIATED"
            - "Clock at 2027-01-01 = 6 whole months after funded_at 2026-07-01"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F3", total_capital_cents: 50000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
