      - name: terminal_rows_reject_every_further_trigger_across_five_machines
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[Incident].terminal_states
          - state_machines[HazardPattern].terminal_states
          - state_machines[SectionReport].terminal_states
          - state_machines[ReportabilityEvaluation].terminal_states
          - errors.ERR_INCIDENT_STATE_INVALID
          - errors.ERR_PATTERN_STATE_INVALID
          - errors.ERR_SECTION_REPORT_STATE_INVALID
          - errors.ERR_EVALUATION_STATE_INVALID
        distinguishing_aspect: |
          Lockdown is checked on FOUR different machines whose terminal states were
          reached by four different routes — disposal (MERGED_DUPLICATE),
          adjudication (DISMISSED), review acceptance (ACCEPTED) and determination
          (REPORTABLE) — and each must answer with its OWN 409 code. Two of those
          four states are reached by a FORK branch rather than by the machine's main
          line, which is exactly where a guard written as "reject the state the
          happy path ends in" leaves a hole.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "fixture chain F1 carried to a REPORTABLE evaluation and an ACCEPTED SectionReport, plus one incident disposed as MERGED_DUPLICATE, plus a second model whose pattern was DISMISSED"
          setup_api_calls:
