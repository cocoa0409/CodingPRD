      - name: attendance_window_and_excuse_duty_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVENT_NOT_STARTED]
          - errors[ERR_EXCUSE_WINDOW_CLOSED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 53]
          - validations[priority 56]
          - validations[priority 57]
        distinguishing_aspect: |
          Three time-and-duty guards, three ids. Recording attendance while the logical
          clock is strictly before event.start_at is 422 ERR_EVENT_NOT_STARTED - the register
          cannot be taken in advance. An excuse request is legal only while the clock is
          strictly before end_at + EXCUSE_REQUEST_WINDOW_HOURS (48h); at exactly
          2026-10-09T20:00:00Z, the instant the second rehearsal's 48-hour window closes, it
          is 422 ERR_EXCUSE_WINDOW_CLOSED. And the registrar whose X-User-ID recorded the
          absence may not also rule on the excuse: registrar-1 gets 403
          ERR_SEGREGATION_OF_DUTIES while registrar-2's identical decision succeeds, which
          proves the refusal keys on the acting identity, not on the payload.
        test_recipe:
          setup:
            - "Season in IN_SEASON; Ada Strings is seated in the Philharmonic VIOLIN section"
            - "with standing_status CLEAR. Two rehearsals exist: 2026-10-05 18:00-20:00 and"
            - "2026-10-07 18:00-20:00 (both HALL-A, no overlap on Ada's calendar), and Ada is"
            - "rostered on both with attendance_status NOT_RECORDED."
            - "The logical clock reads 2026-08-05T09:00:00Z - two months before either event."
