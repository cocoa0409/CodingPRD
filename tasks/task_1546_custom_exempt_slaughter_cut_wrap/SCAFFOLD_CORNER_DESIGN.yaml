            - { call: "POST /locker/animals/${anA}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${anA}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${anA}/shares", payload: { owner_customer_id: "${cA}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${cA}", captures: { sA: $.data.id } }
            - { call: "POST /locker/animals/${anA}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/appointments", payload: { customer_id: "${cB}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${cB}", captures: { apptB: $.data.id } }
            - { call: "POST /locker/appointments/${apptB}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${cB}" }
