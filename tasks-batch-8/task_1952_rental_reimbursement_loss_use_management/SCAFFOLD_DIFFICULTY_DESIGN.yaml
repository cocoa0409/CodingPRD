            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { bal0: $.data.rental_reserve_cents } }
          trigger:
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { bal1: $.data.rental_reserve_cents } }
            - { call: "POST /rental-reservations/${res_id}/cancel", payload: {}, as: RentalDeskAgent }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { bal2: $.data.rental_reserve_cents } }
          assert:
            - "Claim.rental_reserve_cents before authorize == 120000 (initial: limit 6000 x cap 20)"
            - "After authorize == 60000 (120000 - estimate 60000)"
            - "After cancel == 120000 — forward + compensating action leaves the conserved quantity unchanged (no drift)"
            - "Claim.authorized_days_total == 0 after cancel (CANCELLED reservations leave the aggregate)"

      - name: recovery_payment_waive_conservation
        grounds:
          - calculations.rental_reserve_reconciliation
          - state_machines.RecoveryCase
          - entities.RecoveryCase.fields.outstanding_amount_cents
        distinguishing_aspect: |
          Conserved quantity = RecoveryCase.assessed_amount_cents partitioned as
          recovered + waived + outstanding (a DIFFERENT conserved quantity than
          the reserve — a per-case decomposition invariant). A 5000 payment
          followed by waiving the remainder conserves 12000 == 5000 + 7000 + 0
          and drives Claim.recovery_balance_cents back to 0.
        test_recipe:
          setup:
            - "Base fixture; repair completed 2026-08-14; vehicle returned 2026-08-17 -> unnecessary_days 2, RecoveryCase OPEN assessed 12000"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-15", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { res_id: $.data.id } }
            - { call: "POST /rental-reservations/${res_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/activate", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T15:00:00Z" }, as: SystemAdmin }
            - { call: "POST /repair-orders/${ro_id}/complete", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-reservations/${res_id}/return", payload: {}, as: RentalPartner, as_user_id: "${rp_id}" }
            - { call: "GET /claims/${cl_id}/recovery-cases", payload: {}, as: RecoverySpecialist, captures: { rc_id: "$.data[0].id", assessed: "$.data[0].assessed_amount_cents" } }
          trigger:
            - { call: "POST /recovery-cases/${rc_id}/record-payment", payload: { amount_cents: 5000 }, as: RecoverySpecialist, captures: { st1: $.data.status, out1: $.data.outstanding_amount_cents } }
            - { call: "POST /recovery-cases/${rc_id}/waive", payload: {}, as: RecoverySpecialist, captures: { st2: $.data.status, rec2: $.data.recovered_amount_cents, wa2: $.data.waived_amount_cents, out2: $.data.outstanding_amount_cents } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: RecoverySpecialist, captures: { bal: $.data.recovery_balance_cents } }
          assert:
            - "RecoveryCase.assessed_amount_cents == 12000 (2 unnecessary days x 6000)"
            - "After payment of 5000: status == PARTIAL_RECOVERY, outstanding_amount_cents == 7000"
            - "After waive: status == WAIVED, recovered == 5000, waived == 7000, outstanding == 0"
            - "Conservation: 12000 == 5000 (recovered) + 7000 (waived) + 0 (outstanding)"
            - "Claim.recovery_balance_cents == 0 after the case reaches a terminal state"
