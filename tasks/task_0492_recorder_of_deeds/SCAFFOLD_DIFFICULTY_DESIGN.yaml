            - "RecordedDocument.${rd_id}.status == CORRECTED_VOID"
            - "RecordingOffice.${off_id}.total_indexed_entries == 0"

      - name: void_correction_conserves_documents_in_book_count
        grounds:
          - state_machines.RecordedDocument.RECORDED_to_CORRECTED_VOID
          - entities.RecordingOffice.fields.documents_in_current_book
          - entities.RecordingOffice.fields.daily_collected_cents
        distinguishing_aspect: |
          Conserved quantity = documents-in-book count (a different conserved
          quantity from index-entry count). Invariant: documents_in_current_book ==
          count(RecordedDocument WHERE book==current_book AND status==RECORDED).
          Recording one DEED (total 3500) raises documents_in_current_book to 1 and
          daily_collected_cents to 3500; the same-day void returns both to 0.
        test_recipe:
          setup:
            - "Office; ACTIVE submitter with escrow; one DEED package recorded today → documents_in_current_book==1, daily_collected_cents==3500."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${pkg_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_v2: $.data.version }
            - call: "POST /packages/${pkg_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${pkg_v2}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
              captures: { rd_id: $.data.id }
          trigger:
            - call: "POST /recorded-documents/${rd_id}/void-correction"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
          assert:
            - "RecordedDocument.${rd_id}.status == CORRECTED_VOID"
            - "RecordingOffice.${off_id}.documents_in_current_book == 0"
            - "RecordingOffice.${off_id}.daily_collected_cents == 0"
