scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_plan_returns_201_with_all_counters_zeroed
        claim_type: creation
        grounds:
          - entities.EsopPlan
          - endpoints.POST /plans
        distinguishing_aspect: "A plan created with only the eight required fields returns 201 with plan_status OPEN, version 1 and every share and cash counter at 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Corner Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP 201"
            - "EsopPlan.${plan_id}.plan_status == OPEN and EsopPlan.${plan_id}.version == 1"
            - "EsopPlan.${plan_id}.total_plan_shares == 0, suspense_shares == 0, unallocated_released_shares == 0, unallocated_forfeiture_shares == 0, reacquired_shares == 0, allocated_shares_total == 0"
            - "EsopPlan.${plan_id}.repurchase_reserve_cents == 0, committed_repurchase_cents == 0, cumulative_repurchase_funding_cents == 0, cumulative_repurchase_settled_cents == 0"
            - "EsopPlan.${plan_id}.current_share_price_cents == 0, open_valuation_count == 0, draft_run_count == 0"
            - "EsopPlan.${plan_id}.repurchase_posture == FUNDED and forfeiture_posture == CLEAR"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: plan_optional_fields_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.EsopPlan.fields.annual_compensation_limit_cents
          - entities.EsopPlan.fields.annual_additions_limit_cents
          - entities.EsopPlan.fields.sweep_mode
          - entities.EsopPlan.fields.normal_retirement_age
        distinguishing_aspect: "Omitting every optional plan field yields annual_compensation_limit_cents 34500000, annual_additions_limit_cents 6900000, sweep_mode STRICT_ORDER, normal_retirement_age 65, diversification_min_age 55, diversification_min_years 10, repurchase_reserve_floor_cents 0 and forfeiture_sweep_threshold_shares 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Default Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "CLIFF_3YR", service_measurement_method: "PLAN_YEAR_END_MEASURE", forfeiture_policy: "REDUCE_CONTRIBUTION", distribution_policy: "LUMP_SUM" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
          assert:
            - "EsopPlan.${plan_id}.annual_compensation_limit_cents == 34500000"
            - "EsopPlan.${plan_id}.annual_additions_limit_cents == 6900000"
            - "EsopPlan.${plan_id}.sweep_mode == STRICT_ORDER"
            - "EsopPlan.${plan_id}.normal_retirement_age == 65"
            - "EsopPlan.${plan_id}.diversification_min_age == 55 and diversification_min_years == 10"
            - "EsopPlan.${plan_id}.repurchase_reserve_floor_cents == 0 and forfeiture_sweep_threshold_shares == 0"

      - name: create_plan_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting distribution_policy, a required input with no default, returns ERR_INVALID_REQUEST (400) and persists no plan."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Broken Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "response_type == error"

      - name: create_plan_invalid_enum_member_rejected
        claim_type: type_constraints
        grounds:
          - entities.EsopPlan.fields.vesting_schedule
          - validations[priority=3]
        distinguishing_aspect: "vesting_schedule CLIFF_5YR is not a declared member of {CLIFF_3YR, GRADED_6YR} and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Enum Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "CLIFF_5YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "LUMP_SUM" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: get_plan_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PLAN_NOT_FOUND]
          - endpoints.GET /plans/{plan_id}
        distinguishing_aspect: "A well-formed UUID that matches no EsopPlan returns ERR_PLAN_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "GET /plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_PLAN_NOT_FOUND with HTTP 404"

      - name: participant_computed_and_system_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - entities.Participant.fields.status
          - entities.Participant.fields.allocated_shares
          - entities.Participant.fields.diversification_first_eligible_plan_year
          - endpoints.POST /participants
        distinguishing_aspect: "A newly enrolled participant starts ACTIVE with allocated_shares 0, vested_shares 0, vested_percentage 0 and diversification_first_eligible_plan_year computed as max(1968 + 55, 2010 + 10) = 2023 - none of which the client supplied."
        test_recipe:
          setup: ["One OPEN plan with diversification_min_age 55 and diversification_min_years 10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Census Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-900", date_of_birth: "1968-05-20", hire_date: "2010-08-15", eligible_compensation_cents: 30000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201 and Participant.${p_id}.status == ACTIVE"
            - "Participant.${p_id}.allocated_shares == 0, vested_shares == 0, vested_percentage == 0, years_of_service == 0"
            - "Participant.${p_id}.distributed_shares_cumulative == 0, tendered_shares_cumulative == 0, diversified_shares_cumulative == 0"
            - "Participant.${p_id}.termination_date is null and termination_reason is null"
            - "Participant.${p_id}.diversification_first_eligible_plan_year == 2023 and diversification_eligible == true"
            - "Participant.${p_id}.put_window_open_date, put_window_close_date and last_put_window_close_date are all null"
            - "Participant.${p_id}.id is a bare UUID with no type prefix and Participant.${p_id}.version == 1"

      - name: participant_annual_hours_default_applied
        claim_type: defaults
        grounds:
          - entities.Participant.fields.annual_hours
          - entities.Participant.fields.eligible_compensation_cents
        distinguishing_aspect: "Omitting annual_hours and eligible_compensation_cents yields 2000 and 0 respectively."
        test_recipe:
          setup: ["One OPEN plan."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Hours Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-901", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_id: $.data.id }
          assert:
            - "Participant.${p_id}.annual_hours == 2000"
            - "Participant.${p_id}.eligible_compensation_cents == 0"

      - name: create_participant_with_unknown_plan_id_returns_plan_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that names no EsopPlan returns ERR_PLAN_NOT_FOUND (404), proving flat-topology FK integrity is enforced on the body, not just on path segments."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", employee_number: "E-902", date_of_birth: "1990-01-01", hire_date: "2020-01-01" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_PLAN_NOT_FOUND with HTTP 404"

      - name: list_participants_paginates_and_filters_by_plan
        claim_type: listing
        grounds:
          - endpoints.GET /participants
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three participants in plan A and one in plan B, GET /participants?plan_id=A&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Two OPEN plans; plan A holds participants E-001, E-002 and E-003 created in that order, plan B holds E-010."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "List Plan A", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_a_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "List Plan B", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_b_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", employee_number: "E-001", date_of_birth: "1980-04-11", hire_date: "2015-01-05", eligible_compensation_cents: 40000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pa_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", employee_number: "E-002", date_of_birth: "1982-09-23", hire_date: "2016-06-01", eligible_compensation_cents: 20000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pb_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", employee_number: "E-003", date_of_birth: "1990-02-14", hire_date: "2019-03-15", eligible_compensation_cents: 10000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pc_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_b_id}", employee_number: "E-010", date_of_birth: "1985-01-01", hire_date: "2018-01-01", eligible_compensation_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pz_id: $.data.id }
          trigger:
            - call: "GET /participants?plan_id=${plan_a_id}&limit=2&offset=0"
              payload: { plan_id: "${plan_a_id}", limit: 2, offset: 0 }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response_type == array with exactly 2 elements"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the returned ids are drawn only from ${pa_id}, ${pb_id} and ${pc_id}; ${pz_id} never appears"
            - "GET /participants?plan_id=${plan_b_id} returns exactly 1 element with total_count 1 and has_more false"

      - name: loan_payment_is_immutable_event_without_version_field
        claim_type: immutability
        grounds:
          - entities.LoanPayment
          - endpoints.GET /loan-payments/{payment_id}
        distinguishing_aspect: "LoanPayment is declared common_fields false, so a fetched payment exposes id and created_at but no version and no updated_at, and no endpoint mutates it."
        test_recipe:
          setup: ["One OPEN plan with one PRINCIPAL_ONLY loan and one recorded payment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
            - call: "POST /plans"
              payload: { plan_name: "Immutable Plan", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_ONLY" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_id: $.data.id }
            - call: "POST /loan-payments"
              payload: { loan_id: "${loan_id}", payment_date: "2026-06-30", principal_cents: 400000000, interest_cents: 200000000 }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /loan-payments/${pay_id}"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
          assert:
            - "HTTP 200 with LoanPayment.${pay_id}.id and LoanPayment.${pay_id}.created_at present"
            - "the response body carries no version field and no updated_at field"
            - "LoanPayment.${pay_id}.released_shares == 60000 and release_method_applied == PRINCIPAL_ONLY"

      - name: forfeiture_events_discoverable_only_through_reverse_lookup
        claim_type: retrieval
        grounds:
          - entities.ForfeitureEvent
          - endpoints.GET /forfeiture-events
          - endpoints.GET /forfeiture-events/{forfeiture_id}
        distinguishing_aspect: "ForfeitureEvent rows are created only as a cascade of terminate and never appear in any creation response, so the filtered list keyed on participant_id is their sole discovery channel; the id it returns then resolves through the single-resource GET."
        test_recipe:
          setup:
            - "A GRADED_6YR / TERMINATION_DATE_MEASURE plan in ALLOCATION_LOCKED whose participant held 968 shares and has just been terminated on 2026-01-15 at 60 percent vesting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Forfeit Lookup", sponsor_name: "Northgate Tooling Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT", annual_additions_limit_cents: 6900000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-201", date_of_birth: "1985-06-10", hire_date: "2021-03-01", eligible_compensation_cents: 34500000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pf_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { plan_v_priced: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 968, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run_id: $.data.id }
            - call: "POST /allocation-runs/${run_id}/finalize"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-02"
            - call: "POST /participants/${pf_id}/terminate"
              payload: { termination_date: "2026-01-15", termination_reason: "TERMINATION" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "GET /forfeiture-events?participant_id=${pf_id}"
              payload: { participant_id: "${pf_id}" }
              as: Trustee
              as_user_id: "trustee-01"
              captures: { forf_id: "$.data[0].id" }
            - call: "GET /forfeiture-events/${forf_id}"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
          assert:
            - "the filtered list returns exactly 1 element with total_count 1"
            - "ForfeitureEvent.${forf_id}.participant_id == ${pf_id} and ForfeitureEvent.${forf_id}.plan_id == ${plan_id}"
            - "ForfeitureEvent.${forf_id}.forfeited_shares == 388 and plan_year == 2026"
            - "ForfeitureEvent.${forf_id}.status == PENDING_REALLOCATION and reallocated_in_run_id is null"
            - "GET /forfeiture-events?reallocated_in_run_id=${run_id} returns an empty array with total_count 0"

      - name: duplicate_employee_number_within_plan_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_EMPLOYEE_NUMBER]
        distinguishing_aspect: "employee_number E-001 may exist once per plan: a second enrolment with the same number in the same plan returns ERR_DUPLICATE_EMPLOYEE_NUMBER (409), while the same number in a different plan is accepted."
        test_recipe:
          setup: ["Two OPEN plans; plan A already holds participant E-001."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Dup Plan A", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_a_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "Dup Plan B", sponsor_name: "Corner Corp", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_b_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", employee_number: "E-001", date_of_birth: "1980-04-11", hire_date: "2015-01-05", eligible_compensation_cents: 40000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", employee_number: "E-001", date_of_birth: "1991-11-11", hire_date: "2021-01-01", eligible_compensation_cents: 1000000 }
