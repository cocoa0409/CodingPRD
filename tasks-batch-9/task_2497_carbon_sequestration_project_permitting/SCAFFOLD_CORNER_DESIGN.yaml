            - "InjectionWellPermit.${permit_id}.submitted_at == null"
            - "InjectionWellPermit.${permit_id}.version == 1"

  # ===========================================================================
  # §1.9 corner coverage, section 7 of 9
  # ===========================================================================
  - section: rbac
    instances:
      - name: program_admin_creates_storage_project_allowed
        claim_type: role_allowed
        grounds:
          - rbac.ProgramAdmin
          - endpoints[POST /ccs/storage-projects]
        distinguishing_aspect: |
          Project creation is reserved to ProgramAdmin and succeeds for that role with 201, the system
          fields initialised to status DRAFT, operational_posture OPEN and version 1, which is the
          positive half of the pair whose negative half is the developer's 403.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "no projects yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id, st: $.data.status, posture: $.data.operational_posture, ver: $.data.version }
          assert:
            - "the trigger call returns HTTP 201"
            - "${st} == DRAFT"
            - "${posture} == OPEN"
            - "${ver} == 1"
            - "StorageProject.${proj_id}.created_at == 2026-08-01T00:00:00Z"
            - "StorageProject.${proj_id}.unitization_status == NOT_FILED"

      - name: project_developer_cannot_create_storage_project_unauthorized
        claim_type: role_denied
        grounds:
          - rbac.ProjectDeveloper
          - validations[priority 20 ERR_UNAUTHORIZED]
          - endpoints[POST /ccs/storage-projects]
        distinguishing_aspect: |
          The developer authors everything else in the domain yet cannot open a project: an otherwise
          perfectly valid body is refused with 403 ERR_UNAUTHORIZED and no project row is created, so the
          project listing stays empty.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "no projects yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the trigger call returns HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "the project listing reports total_count 0"

      - name: regulatory_reviewer_cannot_verify_tax_credit_claim_unauthorized
        claim_type: exclusive_operations
        grounds:
          - rbac.IndependentVerifier
          - validations[priority 20 ERR_UNAUTHORIZED]
          - endpoints[POST /ccs/tax-credit-claims/{id}/verify]
        distinguishing_aspect: |
          Verification is the IndependentVerifier's only action and no other role inherits it: the
          reviewer who may approve permits, plans and closures is refused with 403 ERR_UNAUTHORIZED, and
          because the priority-20 role gate runs ahead of the priority-40 existence checks the answer is
          403 rather than 404 even for a claim id that does not exist.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "no tax credit claims exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ccs/tax-credit-claims/00000000-0000-0000-0000-000000000000/verify"
              payload: { decision: "ALLOW", verification_note: "independent verification of secure geologic storage" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
          assert:
            - "the trigger call returns HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "the response body carries no claim payload"

      - name: landowner_responds_only_on_own_tract_forbidden
        claim_type: peer_roles
        grounds:
          - rbac.Landowner
          - validations[priority 21 ERR_NOT_TRACT_LANDOWNER]
          - endpoints[POST /ccs/pore-space-tracts/{id}/respond]
        distinguishing_aspect: |
          Holding the Landowner role is not enough: the caller's X-User-ID must equal the tract's
          landowner_user_id, so landowner-2 answering landowner-1's offer is refused with 403
          ERR_NOT_TRACT_LANDOWNER while the tract stays in OFFER_SENT with negotiation_round_count 1.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
            - "tract T1 owned by landowner-1 in lease_status OFFER_SENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
