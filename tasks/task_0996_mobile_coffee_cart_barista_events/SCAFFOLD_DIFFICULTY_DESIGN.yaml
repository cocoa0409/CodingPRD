  # -------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_submit_requires_cart_active
        grounds:
          - state_machines.EventBooking.QUOTE_to_PENDING_DEPOSIT
          - validations[priority=6]
        distinguishing_aspect: |
          Pair (EventBooking, CoffeeCart): submit precondition depends on CoffeeCart.status == ACTIVE. A booking whose referenced cart is in MAINTENANCE is rejected with ERR_CART_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z"
            - "Cart CART-B with status=MAINTENANCE (created directly with that state via OpsMgr creating then transitioning; or in this scaffold simulate via a cart that was never ACTIVE — simplify by introducing cart then asserting it must be ACTIVE)"
            - "Booking in QUOTE referencing CART-B"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
