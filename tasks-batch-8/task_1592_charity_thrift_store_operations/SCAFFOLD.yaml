  - method: GET
    path: "/api/pickup-stops/{stop_id}"
    description: "Get a pickup stop"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: []
    output: PickupStop
    side_effects: []
  - method: GET
    path: "/api/pickup-stops"
    description: "List/filter stops (FK reverse for PickupStop.donor_id and .completed_batch_id)"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: ["donor_id?", "route_id?", "completed_batch_id?", "status?", "limit?", "offset?"]
    output: PickupStop[]
    side_effects: []
  - method: POST
    path: "/api/pickup-routes/{route_id}/publish"
    description: "DRAFT -> PUBLISHED (requires >= 1 SCHEDULED stop)"
    roles: [StoreManager]
    code: 200
    input: []
    output: PickupRoute
    side_effects: ["PickupRoute.version += 1"]
  - method: POST
    path: "/api/pickup-routes/{route_id}/unpublish"
    description: "PUBLISHED -> DRAFT (only while every stop still SCHEDULED)"
    roles: [StoreManager]
    code: 200
    input: []
    output: PickupRoute
    side_effects: ["PickupRoute.version += 1"]
  - method: POST
    path: "/api/pickup-routes/{route_id}/start"
    description: "PUBLISHED -> IN_PROGRESS"
    roles: [StoreManager]
    code: 200
    input: []
    output: PickupRoute
    side_effects: ["PickupRoute.version += 1"]
  - method: POST
    path: "/api/pickup-routes/{route_id}/complete"
    description: "IN_PROGRESS -> COMPLETED (all stops terminal)"
    roles: [StoreManager]
    code: 200
