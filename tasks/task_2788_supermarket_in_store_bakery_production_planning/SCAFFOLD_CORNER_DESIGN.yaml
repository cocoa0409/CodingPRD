              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "CAKE-8", name: "8 Inch Round Base", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 1800, shelf_life_hours: 48, is_custom_cake_base: true }
              as: RegionalAdmin
              captures: { cake_prod_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 10 }
              as: CakeDesk
              captures: { slot_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders"
              payload: { bake_day_id: "${bd_id}", product_id: "${cake_prod_id}", pickup_slot_id: "${slot_id}", customer_name: "Ida Bloom", decoration_complexity: "STANDARD", tier_count: 2 }
              as: CakeDesk
              captures: { cake_big_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders"
              payload: { bake_day_id: "${bd_id}", product_id: "${cake_prod_id}", pickup_slot_id: "${slot_id}", customer_name: "Ravi Patel", decoration_complexity: "SIMPLE", tier_count: 2 }
              as: CakeDesk
              captures: { cake_mid_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders"
              payload: { bake_day_id: "${bd_id}", product_id: "${cake_prod_id}", pickup_slot_id: "${slot_id}", customer_name: "Lena Ortiz", decoration_complexity: "SIMPLE", tier_count: 1 }
              as: CakeDesk
              captures: { cake_small_id: $.data.id }
            - call: "POST /bakery/custom-cake-orders/${cake_big_id}/confirm"
              payload: {}
              as: CakeDesk
          trigger:
            - call: "POST /bakery/custom-cake-orders/${cake_mid_id}/confirm"
