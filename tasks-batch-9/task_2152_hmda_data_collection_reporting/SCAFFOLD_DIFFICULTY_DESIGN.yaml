              as_user_id: "officer-alpha"
            - call: "POST /hmda/submissions/${sub_id}/certify"
              payload: { attestation_text: "Cycle two attestation." }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /hmda/submissions/${sub_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          assert:
            - "FilingSubmission.${sub_id}.status == FILED"
            - "FilingSubmission.${sub_id}.resubmission_count == 1"
            - "FilingSubmission.${sub_id}.final_record_count == 1"
            - "FilingSubmission.${sub_id}.is_late == false"
            - "FilingSubmission.${sub_id}.late_by_days == 0"
            - "FilingSubmission.${sub_id}.rejection_reason == Census tract assignment could not be reconciled against the FFIEC file."
            - "Application.${app_id}.stage == ARCHIVED"
            - "Institution.${inst_id}.filing_posture == CLOSED_YEAR"
            - "GET /hmda/submissions/${sub_id}/disclosure-statements returns 4 rows (two per filing cycle)"

      - name: application_stage_and_lar_status_are_independent_dimensions
        grounds:
          - state_machines.Application.stage.DECISIONED_to_REGISTER_LOCKED
          - state_machines.Application.lar_status.EXCEPTION_FLAGGED_to_CLEARED
          - entities.Application.fields.stage
          - entities.Application.fields.lar_status
          - calculations.edit_check_evaluation
        distinguishing_aspect: |
          The Application row carries two state dimensions that move on different
          triggers: stage reaches REGISTER_LOCKED through LoanOfficer advances,
          while lar_status walks PENDING_FIELDS -> COMPLETE -> EXCEPTION_FLAGGED
          -> CLEARED through the edit run and the analyst's verification. The
          verify call changes lar_status from EXCEPTION_FLAGGED to CLEARED and
          leaves stage at REGISTER_LOCKED untouched. This is PARALLEL DIMENSIONS
          on Application, structurally different from the cyclic FilingSubmission.
        test_recipe:
          setup:
            - "One non partial-exempt Institution and one CensusTract."
            - "One Application with application_date 2026-01-05 and action_taken_date 2026-07-20 (196-day lag) so quality edit Q615 fires; advanced to REGISTER_LOCKED before the run."
            - "Edit run 1 flags the record: stage REGISTER_LOCKED, lar_status EXCEPTION_FLAGGED."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
