            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /renewal-applications/${ra}/submit", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "GET /grants/${g1}/renewal-applications", payload: {}, as: GrantsOfficer, captures: { rst: "$.data[0].status" } }
          assert:
