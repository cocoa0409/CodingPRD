    code: 200
    input: []
    output: TenderOption
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/tender_options/{tenderId}/exercise"
    description: "Exercise a PENDING TenderOption within its window"
    roles: [Agent]
    code: 200
    input: []
    output: TenderOption
    side_effects: ["status: PENDING -> EXERCISED; exercised_at = now"]

  # --- Grievance ---
  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances"
    description: "File a Grievance"
    roles: [Agent]
    code: 201
    input: [filed_by_agent_id, category, description, claimed_amount_cents]
    output: Grievance
    side_effects: ["status=FILED"]

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances"
    description: "List Grievances for a Contract"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "Grievance[]"
    side_effects: []

  - method: GET
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}"
    description: "Get a Grievance"
    roles: [LeagueOfficer, AgencyManager, Agent, Player]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/start_review"
    description: "Move grievance FILED -> UNDER_REVIEW"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/return_for_cure"
    description: "Return UNDER_REVIEW -> FILED (revert loop)"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/escalate"
    description: "Escalate UNDER_REVIEW -> ARBITRATION"
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/resolve"
    description: "Resolve ARBITRATION -> RESOLVED; if outcome UPHELD, emits fee adjustment"
    roles: [LeagueOfficer]
    code: 200
    input: [resolution_outcome]
    output: Grievance
    side_effects:
      - "status -> RESOLVED"
      - "if resolution_outcome == UPHELD: emit FeeLedgerEntry kind=TRANSITION_ADJUSTMENT for claimed_amount_cents * fee_cap_pct to filing agent"

  - method: POST
    path: "/agencies/{agencyId}/clients/{clientId}/contracts/{contractId}/grievances/{grievanceId}/withdraw"
    description: "Filing agent withdraws a FILED or UNDER_REVIEW grievance"
    roles: [Agent]
    code: 200
    input: []
    output: Grievance
    side_effects: ["status -> WITHDRAWN"]

  # --- FeeLedgerEntry ---
  - method: GET
    path: "/agencies/{agencyId}/fee_ledger_entries"
