      - name: error_authorization_invalid_state_on_verifying_an_already_verified_order
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUTHORIZATION_INVALID_STATE]", "validations[priority=8]", "state_machines.MedicationAuthorization.UNVERIFIED_to_VERIFIED"]
        distinguishing_aspect: "The clinical dimension admits VERIFY only from UNVERIFIED or SUSPENDED, so a second VERIFY on an already VERIFIED order returns 409 ERR_AUTHORIZATION_INVALID_STATE while consent_status stays CONSENT_PENDING."
        test_recipe:
          setup:
            - "One School, one RN and one ENROLLED student; one ALBUTEROL order already moved to clinical_status VERIFIED and left at consent_status CONSENT_PENDING."
          setup_api_calls:
            - call: "POST /health-office/schools"
