              payload: { partner_id: "${pa_id}", trigger_reason: "VOLUNTARY", end_user_funds_disposition: "TRANSFER_TO_SUCCESSOR", notice_days: 60, target_completion_date: "2026-11-15T00:00:00Z", milestones: ["NOTIFY_END_USERS", "FINAL_SETTLEMENT", "RETURN_FUNDS", "CLOSE_CUSTODY"] }
