              payload: { suspended: true, suspension_reason: "attempt to suspend a closed matter" }
              as: EngagementManager
              captures: { err_suspend: $.data.error_id }
          assert:
            - "first call: HTTP 409 with error_id \"ERR_INVALID_STATE\"; Batch.${bf_id}.released_at is unchanged"
            - "second call: HTTP 409 with error_id \"ERR_INVALID_STATE\"; Matter.${m_id}.status is still \"CLOSED\" and suspension_reason == null"
            - "Matter.${m_id}.committed_spend_cents == 127800 — no ledger row was added by either refusal"
            - "Assignment.${af_id}.status == \"COMPLETED\""

      - name: close_refused_while_documents_remain_unbatched
        claim_type: guarded_transition
        grounds:
          - validations[priority=42]
          - errors[ERR_MATTER_NOT_CLOSEABLE]
          - state_machines.Matter.QC_CLOSEOUT_to_IN_REVIEW
        distinguishing_aspect: "Closing is guarded by a THREE-part conjunction, and violating only the unbatched clause is enough: with 1 document still unbatched the QC_CLOSEOUT matter is refused with ERR_MATTER_NOT_CLOSEABLE, and carving that last document drags the matter back from QC_CLOSEOUT to IN_REVIEW."
        test_recipe:
          setup:
            - "the core matter with a single Batch covering 599 of its 600 documents, released after a clean 60-document sample and two accepted privilege entries"
            - "the matter is therefore in QC_CLOSEOUT with unbatched_document_count 1"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 599, priority_rank: 5 }
              as: EngagementManager
              captures: { b599_id: $.data.id, b599_v: $.data.version }
            - call: "POST /batches/${b599_id}/assignments"
              payload: { expected_batch_version: "${b599_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a599_id: $.data.id }
            - call: "POST /assignments/${a599_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /batches/${b599_id}/privilege-log-entries"
              payload: { document_ref: "NW-000117", privilege_basis: "ATTORNEY_CLIENT", disposition: "WITHHOLD" }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { pl3_id: $.data.id }
            - call: "POST /batches/${b599_id}/privilege-log-entries"
              payload: { document_ref: "NW-000482", privilege_basis: "WORK_PRODUCT", disposition: "REDACT" }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { pl4_id: $.data.id }
            - call: "POST /assignments/${a599_id}/progress"
              payload: { documents_coded: 599, minutes_logged: 650, privilege_hits_logged: 2 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a599_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - *c_rev_c
            - call: "POST /batches/${b599_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { s599_id: $.data.id }
            - call: "POST /qc-samples/${s599_id}/validate"
              payload: { coding_error_count: 0, privilege_error_count: 0 }
              as: QCLead
            - call: "POST /privilege-log-entries/${pl3_id}/validate"
              payload: { accepted: true }
              as: QCLead
            - call: "POST /privilege-log-entries/${pl4_id}/validate"
              payload: { accepted: true }
              as: QCLead
            - call: "POST /batches/${b599_id}/release"
              payload: {}
              as: QCLead
          trigger:
            - call: "POST /matters/${m_id}/close"
              payload: {}
              as: EngagementManager
              captures: { err_close: $.data.error_id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 1, priority_rank: 1 }
              as: EngagementManager
              captures: { b_last_id: $.data.id }
          assert:
            - "before the trigger: Matter.${m_id}.status == \"QC_CLOSEOUT\" and unbatched_document_count == 1"
            - "first trigger call: HTTP 409 with error_id \"ERR_MATTER_NOT_CLOSEABLE\" — the batch clause and the privilege clause are satisfied but unbatched_document_count != 0"
            - "Matter.${m_id}.status is still \"QC_CLOSEOUT\" after the refusal"
            - "second trigger call: HTTP 201; Matter.${m_id}.status == \"IN_REVIEW\" — carving a batch during closeout reverts the matter"
            - "Matter.${m_id}.unbatched_document_count == 0 and Batch.${b_last_id}.document_count == 1"
            - "Assignment.${a599_id}.status == \"COMPLETED\" and billable_amount_cents == 127587 (599 * 213)"

      - name: cascade_down_side_effects_of_a_failed_sample
        claim_type: side_effect_execution
        grounds:
          - state_machines.QCSample.PENDING_to_FAILED
        excluded_because:
          difficulty_instance: transitive_cascade / qc_failure_to_strike_to_removal_to_void_sweep
          rationale: "Every side effect of the FAILED sample transition — batch QC_FAILED, assignment REOPENED, the three ScorecardEvent appends, removal and the void sweep — is asserted link by link in the named §1.8 instance."

      - name: reviewer_two_axes_move_independently
        claim_type: parallel_shape
        grounds:
          - state_machines.Reviewer.VERIFIED_to_LAPSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / credential_gate_precedes_capacity_gate
          rationale: "That instance drives credential_status VERIFIED -> LAPSED while engagement_status stays ENGAGED and asserts both axes, which is exactly the parallel-shape claim."

      - name: batch_rework_loop_terminates_without_rebilling
        claim_type: cyclic_shape
        grounds:
          - state_machines.Batch.QC_FAILED_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_rework_cycle_is_non_billable
          rationale: "The loop back through IN_PROGRESS and the strict-subset side effects of the second submit are asserted there."

      - name: void_compensates_the_commitment_it_created
        claim_type: compensation
        grounds:
          - state_machines.Assignment.ASSIGNED_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / commitment_then_void_returns_ledger_to_zero
          rationale: "The compensation claim (ledger sums to 0, no row deleted, batch re-staffable) is the whole content of that instance."

  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: auto_assign_picks_the_higher_scoring_reviewer
        claim_type: correct_result
        grounds:
          - calculations.reviewer_selection_rank
          - endpoints[POST /batches/{id}/auto-assign]
        distinguishing_aspect: "With two otherwise identical eligible reviewers the only differing term decides: the subject-matter match is worth 0.10, so Ada scores 0.7000 against Dara's 0.6000 and is selected without any tie-break being consulted."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol; Batch 1 (400 documents) is CREATED"
            - "Reviewer A (subject tag ANTITRUST, matching the matter) is VERIFIED, CLEARED and EXECUTED"
            - "Reviewer D is identical except her subject tag is SECURITIES, which the matter does not require"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - &c_rev_d
              call: "POST /reviewers"
              payload:
                full_name: "Dara Okonkwo"
                bar_admissions: ["NY"]
                languages: ["EN", "JA"]
                subject_matter_tags: ["SECURITIES"]
                tier: "FIRST_PASS"
                hourly_cost_cents: 6100
                max_concurrent_batches: 2
                remote_work_authorized: false
              as: StaffingCoordinator
              captures: { rd_id: $.data.id }
            - &c_rev_d_verify
              call: "POST /reviewers/${rd_id}/credential-status"
              payload: { to_status: "VERIFIED", bar_admissions: ["NY"] }
              as: StaffingCoordinator
            - &c_screen_d
              call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${rd_id}", matter_id: "${m_id}", declared_adverse_parties: [] }
              as: StaffingCoordinator
              captures: { sd_id: $.data.id }
            - &c_screen_d_clear
              call: "POST /conflicts-screenings/${sd_id}/decision"
              payload: { outcome: "CLEARED", decision_note: "no adverse party overlap" }
              as: StaffingCoordinator
            - &c_ca_d
              call: "POST /confidentiality-agreements"
              payload:
                reviewer_id: "${rd_id}"
                matter_id: "${m_id}"
                coverage_start_utc: "2026-08-01T00:00:00Z"
                coverage_end_utc: "2026-10-31T00:00:00Z"
                remote_work_addendum: false
              as: StaffingCoordinator
              captures: { cad_id: $.data.id }
            - &c_ca_d_exec
              call: "POST /confidentiality-agreements/${cad_id}/execute"
              payload: { signature_name: "Dara Okonkwo" }
              as: Reviewer
              as_user_id: "${rd_id}"
            - *c_batch1
          trigger:
            - call: "POST /batches/${b1_id}/auto-assign"
              payload: { expected_batch_version: "${b1_v}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { auto_a_id: $.data.id }
          assert:
            - "HTTP 201 with response.data.reviewer_id == ${ra_id} — score 0.45*1.0000 + 0.30*0 + 0.15*1 + 0.10*1 = 0.7000 beats Dara's 0.6000"
            - "response.data.effective_per_document_cents == 213 and committed_amount_cents == 85200"
            - "Batch.${b1_id}.status == \"ASSIGNED\" and version == 2"
            - "Reviewer.${ra_id}.engagement_status == \"ENGAGED\" while Reviewer.${rd_id}.engagement_status is still \"CLEARED\""
            - "Matter.${m_id}.committed_spend_cents == 85200 and staffed_reviewer_count == 2"

      - name: capacity_saturated_reviewer_leaves_the_pool_empty
        claim_type: input_set_filtering
        grounds:
          - calculations.reviewer_selection_rank
          - errors[ERR_NO_ELIGIBLE_REVIEWER]
          - validations[priority=36]
        distinguishing_aspect: "The capacity clause EXCLUDES rather than penalises: Ada would score 0.7000, but holding 2 of her 2 permitted concurrent assignments removes her from the pool entirely, so auto-assign on a third batch returns ERR_NO_ELIGIBLE_REVIEWER instead of assigning her."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A VERIFIED, CLEARED and EXECUTED (max_concurrent_batches 2)"
            - "Batch 1 (400 documents) and Batch 2 (150 documents) are both ASSIGNED to Reviewer A and neither is submitted"
            - "Batch 3 (50 documents) is CREATED and unassigned"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_batch1
            - *c_assign_a1
            - &c_batch2
              call: "POST /matters/${m_id}/batches"
              payload: { document_count: 150, priority_rank: 4 }
              as: EngagementManager
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - &c_assign_a2
              call: "POST /batches/${b2_id}/assignments"
              payload: { expected_batch_version: "${b2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a2_id: $.data.id }
            - &c_batch3
              call: "POST /matters/${m_id}/batches"
