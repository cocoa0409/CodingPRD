            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Regulated SKU pushes this over the S1 line." }, captures: { adj: "$.data.adjudicated_severity_score", band: "$.data.adjudicated_severity_band", reg: "$.data.regulatory_status" } }
            - { call: "GET /regulatory-reports", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { complaint_id: "${cp1}" }, captures: { rr1: "$.data[0].id", due: "$.data[0].due_at" } }
            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { rel_after: "$.data.release_status", adj_after: "$.data.adjudicated_complaint_count" } }
            - { call: "GET /consumers/${c1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { sent_after: "$.data.sentiment_index" } }
          assert:
            - "hop 1: provisional_severity_score == 87.00 with band \"S2\"; adjudicated_severity_score == 93.53 with band \"S1\" — the band FLIPS, and every later hop keys off the flipped band"
            - "hop 2: ProductionLot.release_status was \"RELEASED\" before and is \"HOLD\" after, because the ADJUDICATED band is S1 (the provisional S2 would not have held the lot)"
            - "hop 2: ProductionLot.provisional_complaint_count 1 -> 0 and adjudicated_complaint_count 0 -> 1, with linked_complaint_count constant at 1"
            - "hop 3: exactly one RegulatoryReport exists, status \"OPEN\", escalated_at == \"2026-08-01T00:00:00Z\", due_at == \"2026-08-02T00:00:00Z\" (S1_DEADLINE_HOURS 24)"
            - "the ordering trap: deriving due_at from the pre-triage S2 band would give the STANDARD_DEADLINE_HOURS 72 branch and due_at \"2026-08-04T00:00:00Z\", which must NOT be returned"
            - "hop 3: Complaint.regulatory_status == \"ESCALATED\" while handling_status == \"TRIAGED\""
            - "hop 4: Consumer.sentiment_index was 33.00 before (BAND_PENALTY S2 12 + PROVISIONAL_SURCHARGE 5) and is 30.00 after (BAND_PENALTY S1 20, no surcharge)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    rule_summary: "A single request violates two validation rules at different priorities; only the higher-priority error may be returned."
    instances:

      - name: remedy_state_beats_authority_tier
        grounds: "§1.4 priority 18 ERR_REMEDY_STATE_INVALID (state) vs priority 45 ERR_AUTHORITY_TIER_INSUFFICIENT (business_fiscal)"
        distinguishing_aspect: "state vs business_fiscal, 27 priority levels apart, on POST /remedies/{id}/decide. The intuitive answer is the money error because the acting supervisor is plainly under-ranked; the correct answer is the lifecycle error."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1, SUP1 (CareSupervisor, TIER_3) and SUP2 (CareSupervisor, TIER_1) all exist and are active."
            - "One QUALITY Complaint on the RELEASED regulated lot A1B-2026-0710 carries units_claimed 2."
            - "One Remedy of remedy_type REFUND with requested_value_cents 4900 on that complaint has ALREADY been approved by SUP1, so its status is APPROVED, its payout_cents is 5390 and its authority_tier_required is TIER_2."
            - "Consumer C-1 therefore holds goodwill_authorized_cents 5390 and goodwill_outstanding_cents 5390."
            - "No SampleKit exists on the complaint, so the in-flight-kit rule at priority 31 is NOT violated and cannot compete with the pair under test."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP2", full_name: "Sol Vance", role: CARE_SUPERVISOR, authority_tier: TIER_1 }, captures: { sup2: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Two stale packs, want a refund." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710", units_claimed: 2 }, captures: { cp1: "$.data.id", cp1_v: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: REFUND, requested_value_cents: 4900, expected_complaint_version: "${cp1_v}" }, captures: { rm1: "$.data.id" } }
            - { call: "POST /remedies/${rm1}/submit", as: CareAgent, as_user_id: "${ag1}", payload: { submit_note: "Refund for two packs." } }
            - { call: "POST /remedies/${rm1}/decide", as: CareSupervisor, as_user_id: "${sup1}", payload: { decision: APPROVE, decision_note: "Approved by a TIER_3 supervisor." } }
