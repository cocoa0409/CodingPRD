        grounds:
          - state_machines.ErrorResolutionCase.INVESTIGATING_to_RESOLVED_CORRECTED
          - state_machines.EscrowAnalysisCycle.EFFECTIVE_to_REOPENED
          - state_machines.PaymentChangeNotice.SENT_to_VOIDED
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (error-case resolve CORRECTED): resolve posts an
          ERROR_CORRECTION ledger entry (link 1); the entry recomputes EscrowAccount.balance_cents
          (link 2); the balance change reopens the EFFECTIVE analysis (link 3); the reopen voids its
          SENT payment-change notice (link 4). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Setup A account (TAX 240000 x2 from 2026-12-15; HAZARD 120000 x1 2027-03-01; deposit 60000 eff 2026-08-10; balance 60000)"
            - "Analysis 2027 (projection 2026-09-01, PROSPECTIVE) COMPUTED -> STATEMENT_ISSUED -> EFFECTIVE; its notice SENT"
            - "Error case ANALYSIS_ERROR acknowledged and assigned to investigator ea_9"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
