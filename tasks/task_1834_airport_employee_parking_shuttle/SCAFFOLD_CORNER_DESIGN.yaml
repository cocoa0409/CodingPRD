            - "GET /parking/tow-events?permit_id=${p1} returns zero rows"
      - name: capacity_patch_below_occupancy_then_increase_promotes
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CAPACITY_BELOW_OCCUPANCY]"
          - "entities.ParkingLot.fields.capacity"
        distinguishing_aspect: "PATCH capacity to 0 with 1 occupied slot fails with ERR_CAPACITY_BELOW_OCCUPANCY; PATCH to 2 succeeds and the same call's promotion pass flips the waitlisted E2 to OFFERED."
        test_recipe:
          setup: ["Program ttl 72; CORE lot capacity 1; OPEN August cycle; E1 ACTIVE permit; E2 WAITLISTED"]
          setup_api_calls:
