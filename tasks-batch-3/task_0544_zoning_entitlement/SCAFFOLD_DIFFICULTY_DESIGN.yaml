              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "$.data.error_id == ERR_HEARING_CALENDAR_CONFLICT"

      - name: parcel_review_window_overlap
        grounds:
          - validations[priority=12]
          - entities.EntitlementApplication.fields.submitted_at
          - entities.EntitlementApplication.fields.review_window_closed_at
          - errors[ERR_PARCEL_REVIEW_CONFLICT]
        distinguishing_aspect: "Half-open interval-overlap semantics (no buffer) on the Parcel resource: a second application whose active review interval [submitted_at, open) overlaps an already-active application on the same parcel is rejected -> ERR_PARCEL_REVIEW_CONFLICT (distinct semantics from the Hearing buffer rule)."
        test_recipe:
          setup:
            - "One VARIANCE application on parcel P already SUBMITTED (active, review window open); a second application on the same parcel P created in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
