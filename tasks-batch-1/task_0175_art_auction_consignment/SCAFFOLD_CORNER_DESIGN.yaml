  - section: consistency_model
    instances:
      - name: immediate_invoice_visible_in_response
        claim_type: immediate
        grounds: [state_machines.Lot.NONE_to_INVOICED, entities.Invoice.fields.total_due_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_buyers_premium_vs_seller_net_diverge
          rationale: "The invoice's computed total_due_cents is visible immediately in the same request response and asserted in that §1.8 instance."
