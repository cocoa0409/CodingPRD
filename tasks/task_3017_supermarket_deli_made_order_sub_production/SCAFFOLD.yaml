# =============================================================================
# PRD Benchmark Seed Tables — Supermarket Deli & Made-to-Order Sub Production
# Task: task_3017_supermarket_deli_made_order_sub_production
# Difficulty band: BEYOND_EXPERT (deliberately above the §0.4 Expert ceiling)
# =============================================================================

scenario: |
  Supermarket Deli & Made-to-Order Sub Production (Publix): daily production planning for hot bar,
  cold cuts and rotisserie with pull-and-hold discard rules, made-to-order sub queue with digital
  ordering, ticketing and promised-time management, weekly featured-sub promotions driving forecast
  spikes and bread supply coordination, slicer sanitation cycles and allergen changeover between
  products, catering platter orders with lead times and pickup windows, weight-based labeling with
  scale price file synchronization, associate certification for slicer operation and food handling,
  waste tracking with markdown-before-discard sequencing

domain_name: supermarket-deli-sub-production
api_prefix: /deli

# =============================================================================
# Table 0: Complexity Profile (SKILL.md §0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: beyond_expert
  entity_count: 14
  state_machine_count: 12
  calculation_count: 12
  validation_count: 17
  endpoint_count: 72
  error_code_count: 35
  role_count: 5
  concurrency_rule_count: 3

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# Foreign keys use the canonical `FK -> {Parent}.id` description prefix.
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_number, type: string, source: input, description: "Human store number, unique across the chain", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: deli_case_capacity_lbs, type: number, source: input, description: "Total refrigerated deli case capacity in pounds", constraints: "> 0" }
      - { name: hot_bar_capacity_lbs, type: number, source: input, description: "Hot bar holding capacity in pounds", constraints: "> 0" }
      - { name: sub_station_count, type: integer, source: input, description: "Number of staffed made-to-order sub stations", constraints: ">= 1" }
      - { name: haccp_safety_flag, type: boolean, source: input, default: false, description: "Sanitation-authority hold flag; when true the store posture derives HALT" }
      - { name: case_on_hand_lbs, type: number, source: computed, default: 0, description: "Sum of produced_lbs over ProductionBatch rows with hold_status in {HOLDING, MARKED_DOWN} for this store (aggregation, status-filtered)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | HALT — derived aggregate posture that gates every child operation (see calculations.store_deli_posture)" }
      - { name: posture_gate_flag, type: boolean, source: input, default: false, description: "Operator-controlled posture gate; when true the derived posture is forced to HALT with reason POSTURE_GATE_TRIGGERED" }
      - { name: posture_reason, type: string, source: computed, description: "Enum token naming the single predicate that produced the current posture" }
      - { name: certified_slicer_operator_count, type: integer, source: computed, default: 0, description: "Count of Associate rows in this store holding at least one ACTIVE SLICER_OPERATION Certification not past expires_at" }
      - { name: active_price_file_id, type: string, source: computed, description: "ScalePriceFile id resolved by calculations.price_file_resolution; null when no candidate resolves" }
      - { name: targeted_promo_id, type: string, source: computed, description: "The ACTIVE Promotion whose half-open week contains the logical clock, ranked by week_start_date ASC then created_at ASC; null when none is ACTIVE" }
      - { name: covered_allergen_set, type: array, source: computed, description: "Union of allergen_flags over DeliItem rows this store currently produces; the superset against which a ticket's allergy requirement is checked" }
      - { name: available_bread_units, type: integer, source: computed, default: 0, description: "Sum of BreadSupplyOrder committed_units for this store in status DELIVERED minus the units already reserved by BREAD_HOLD tickets" }
      - { name: verified_waste_liability_cents, type: integer, source: computed, default: 0, description: "Sum of total_liability_cents over this store's VERIFIED WasteRecord rows" }
      - { name: pending_waste_verification_count, type: integer, source: computed, default: 0, description: "Count of WasteRecord rows in this store with status in {DRAFT, MARKED_DOWN, DISCARDED}" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone production-day counter, increments by 1 on POST /deli/run-production-day" }
      - { name: logical_clock_at_last_run, type: datetime, source: system, description: "Value of the logical clock when run_production_day last executed" }

  # ---------------------------------------------------------------------------
  - name: DeliItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU, unique across the chain", constraints: "unique; non-empty" }
      - { name: name, type: string, source: input, description: "Item display name" }
      - { name: category, type: enum, source: input, description: "HOT_BAR | COLD_CUT | ROTISSERIE | SUB | BREAD | CATERING_PLATTER" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed cost per pound in integer cents", constraints: ">= 0" }
      - { name: retail_price_per_lb_cents, type: integer, source: input, description: "Shelf retail price per pound in integer cents", constraints: ">= 0" }
      - { name: case_life_minutes, type: integer, source: input, description: "Pull-and-hold window in minutes from produced_at to hold_expires_at", constraints: "> 0" }
      - { name: markdown_window_minutes, type: integer, source: input, description: "Half-open pre-expiry window during which markdown is permitted", constraints: ">= 0; <= case_life_minutes" }
      - { name: allergen_flags, type: array, source: input, description: "Subset of MILK | WHEAT | SOY | EGG | FISH | SESAME", constraints: "may be empty" }
      - { name: slicer_required, type: boolean, source: input, description: "True when production of this item must occupy a SlicerAsset" }
      - { name: servings_per_platter, type: integer, source: input, default: 12, description: "Servings contributed by one platter unit for CATERING_PLATTER items" }
      - { name: bread_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; the BREAD catalog row this SUB item is served on; null for every non-SUB item", constraints: "the referenced row must have category=BREAD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  # ---------------------------------------------------------------------------
  - name: ProductionBatch
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store of this batch" }
      - { name: deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; the item being produced" }
      - { name: slicer_id, type: string, source: input, description: "FK -> SlicerAsset.id; slicer reserved for this batch (required when the item has slicer_required=true)", required: false }
      - { name: produced_by_associate_id, type: string, source: input, description: "FK -> Associate.id; associate who performed the production run" }
      - { name: rework_of_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch this one was reworked from; null for first-run batches", required: false }
      - { name: batch_code, type: string, source: input, description: "Human batch code, unique within the store", constraints: "unique per (store_id, batch_code)" }
      - { name: planned_lbs, type: number, source: input, description: "Planned production weight in pounds", constraints: "> 0" }
      - { name: produced_lbs, type: number, source: input, default: 0, description: "Actual produced weight recorded on completion", constraints: ">= 0" }
      - { name: produced_at, type: datetime, source: system, description: "Logical-clock instant stamped when the batch entered ON_LINE" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "produced_at + deli_item.case_life_minutes (see calculations.hold_window_state)" }
      - { name: production_status, type: enum, source: system, description: "Parallel dimension 1: PLANNED | IN_PRODUCTION | ON_LINE" }
      - { name: hold_status, type: enum, source: system, description: "Parallel dimension 2: HOLDING | MARKED_DOWN | DISCARDED" }
      - { name: markdown_sold_lbs, type: number, source: computed, default: 0, description: "Pounds moved at markdown price from this batch" }
      - { name: markdown_cents, type: integer, source: computed, default: 0, description: "Retail value recovered through markdown on this batch" }
      - { name: discard_lbs, type: number, source: computed, default: 0, description: "Pounds discarded, summed over VERIFIED WasteRecord rows for this batch" }
      - { name: temperature_breach, type: boolean, source: input, default: false, description: "True when the case temperature breached the safe band while holding" }
      - { name: case_yield_cost_provisional_cents, type: integer, source: computed, description: "Provisional variant output of calculations.batch_case_yield_cost" }
      - { name: case_yield_cost_final_cents, type: integer, source: computed, description: "Final variant output of calculations.batch_case_yield_cost" }

  # ---------------------------------------------------------------------------
  - name: SlicerAsset
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store of this slicer" }
      - { name: assigned_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; item this slicer is currently reserved for", required: false }
      - { name: last_sliced_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; last item actually sliced on this asset (allergen-changeover baseline)", required: false }
      - { name: assigned_operator_id, type: string, source: input, description: "FK -> Associate.id; associate certified to operate this slicer", required: false }
      - { name: asset_tag, type: string, source: input, description: "Physical asset tag, unique within the store", constraints: "unique per (store_id, asset_tag)" }
      - { name: sanitation_cycle_limit, type: integer, source: input, default: 25, description: "Cut count at which a ROUTINE sanitation cycle becomes mandatory", constraints: ">= 1" }
      - { name: sanitation_status, type: enum, source: system, description: "CLEAN | IN_USE | NEEDS_SANITATION | SANITIZING (cyclic)" }
      - { name: cuts_since_sanitation, type: integer, source: computed, default: 0, description: "Monotone cut counter reset to 0 by the SANITIZING -> CLEAN transition" }
      - { name: in_use_minutes, type: integer, source: computed, default: 0, description: "Minutes accumulated in IN_USE since the last sanitation completion" }
      - { name: last_sanitized_at, type: datetime, source: system, description: "Logical-clock instant of the last CLEAN entry" }
      - { name: open_sanitation_cycle_id, type: string, source: computed, description: "id of the single OPEN SanitationCycle on this asset; null when none is OPEN" }

  # ---------------------------------------------------------------------------
  - name: SanitationCycle
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store of this cycle" }
      - { name: slicer_id, type: string, source: input, description: "FK -> SlicerAsset.id; the asset being sanitized" }
      - { name: production_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch whose completion forced this cycle; null for pre-emptive cycles", required: false }
      - { name: allergen_cleared_from_item_id, type: string, source: input, description: "FK -> DeliItem.id; item whose allergen residue this cycle clears", required: false }
      - { name: verified_by_associate_id, type: string, source: input, description: "FK -> Associate.id; associate who verifies the cycle on completion", required: false }
      - { name: cycle_type, type: enum, source: input, description: "ROUTINE | ALLERGEN_CHANGEOVER | TIMED" }
      - { name: cycle_minutes, type: integer, source: input, default: 10, description: "Occupancy of the asset in minutes", constraints: ">= 1" }
      - { name: buffer_minutes, type: integer, source: input, default: 5, description: "Quarantine buffer appended to the interval before the asset may re-enter IN_USE", constraints: ">= 0" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant the cycle was opened" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the cycle completed" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETE | ABORTED" }

  # ---------------------------------------------------------------------------
  - name: SubTicket
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store fulfilling this ticket" }
      - { name: deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; the SUB item ordered" }
      - { name: bread_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; BREAD catalog row required to build this ticket" }
      - { name: order_channel, type: enum, source: input, description: "IN_STORE | DIGITAL | PHONE" }
      - { name: placed_by_customer_ref, type: string, source: input, description: "Opaque app customer reference for DIGITAL tickets; never an entity id", required: false }
      - { name: lines, type: array, source: input, description: "Ordered array of { deli_item_id, half_lb_units } objects; line order is the client-supplied line_sequence_number order", constraints: ">= 1 element; half_lb_units >= 1" }
      - { name: creation_sequence, type: integer, source: system, description: "Monotone per-store ticket sequence assigned at creation; the ordering tie-break for every selector over tickets" }
      - { name: ticket_number, type: integer, source: system, description: "Customer-facing ticket number, equals creation_sequence" }
      - { name: queue_position, type: integer, source: computed, description: "1-based rank of this ticket among its store's non-terminal tickets ordered by creation_sequence ASC" }
      - { name: weight_lbs, type: number, source: computed, description: "Sum over lines of half_lb_units * 0.5" }
      - { name: status, type: enum, source: system, description: "QUEUED | TICKETED | IN_PROGRESS | COMPLETED | PICKED_UP | REMADE | BREAD_HOLD | ABANDONED" }
      - { name: promised_at, type: datetime, source: computed, description: "Output of calculations.promised_time_sla" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the ticket entered COMPLETED" }
      - { name: line_total_cents, type: integer, source: computed, description: "Output of calculations.sub_ticket_line_total" }
      - { name: lateness_minutes, type: integer, source: computed, default: 0, description: "max(0, completed_at - promised_at) in whole minutes" }
      - { name: remake_count, type: integer, source: computed, default: 0, description: "Number of REMADE -> QUEUED cycles this ticket has completed" }
      - { name: label_id, type: string, source: computed, description: "id of the ISSUED Label generated when this ticket was completed" }

  # ---------------------------------------------------------------------------
  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: promo_code, type: string, source: input, description: "Weekly featured-sub promotion code, unique across the chain", constraints: "unique" }
      - { name: deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; the featured SUB item" }
      - { name: week_start_date, type: datetime, source: input, description: "Start of the promotional week (inclusive)" }
      - { name: week_end_date, type: datetime, source: input, description: "End of the promotional week (exclusive)", constraints: "> week_start_date" }
      - { name: forecast_uplift_pct, type: number, source: input, description: "Provisional demand uplift applied to trailing_baseline_units", constraints: "0 <= x <= 2" }
      - { name: trailing_baseline_units, type: integer, source: input, description: "Units of the featured sub sold in the trailing 14-day window", constraints: ">= 0" }
      - { name: required_bread_units, type: integer, source: computed, description: "Provisional variant output of calculations.promo_bread_demand" }
      - { name: settled_bread_units, type: integer, source: computed, default: 0, description: "Final variant output of calculations.promo_bread_demand, stamped at settlement" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | DEGRADED | SETTLED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: BreadSupplyOrder
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; receiving store" }
      - { name: bread_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; BREAD catalog row being ordered" }
      - { name: promotion_id, type: string, source: input, description: "FK -> Promotion.id; promotion whose forecast drives this order" }
      - { name: committed_units, type: integer, source: input, description: "Units committed by the bakery coordinator", constraints: ">= 0" }
      - { name: required_units, type: integer, source: computed, description: "Copy of promotion.required_bread_units at the moment of recomputation" }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Units actually delivered" }
      - { name: shortfall_units, type: integer, source: computed, default: 0, description: "max(0, required_units - committed_units)" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Rolls reserved by this store's TICKETED and IN_PROGRESS tickets for this bread item (see calculations.bread_forecast_coverage)" }
      - { name: unreserved_required_units, type: integer, source: computed, default: 0, description: "max(0, committed_units - reserved_units)" }
      - { name: submit_by_at, type: datetime, source: computed, description: "promotion.week_start_date - 48 hours (see calculations.bread_forecast_coverage)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | DELIVERED | SHORT | RECONCILED" }

  # ---------------------------------------------------------------------------
  - name: ScalePriceFile
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store whose scales this file drives" }
      - { name: file_label, type: string, source: input, description: "Version label of the price file", constraints: "unique per (store_id, file_label)" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the file's active interval" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the file's active interval", constraints: "> effective_from" }
      - { name: item_price_count, type: integer, source: input, description: "Number of item prices carried in the file", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant the file became ACTIVE" }
      - { name: synced_scale_count, type: integer, source: computed, default: 0, description: "Count of Label rows written against this file" }

  # ---------------------------------------------------------------------------
  - name: Label
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store that issued the label" }
      - { name: sub_ticket_id, type: string, source: input, description: "FK -> SubTicket.id; ticket this label was issued for; null for batch/platter labels", required: false }
      - { name: price_file_id, type: string, source: computed, description: "FK -> ScalePriceFile.id; the ACTIVE file resolved by calculations.price_file_resolution", required: false }
      - { name: subject_type, type: enum, source: input, description: "SUB_TICKET | PRODUCTION_BATCH | CATERING_PLATTER (polymorphic label subject)" }
      - { name: subject_ref_id, type: string, source: input, description: "Polymorphic reference to the labelled subject; the entity named by subject_type" }
      - { name: net_weight_lbs, type: number, source: input, description: "Net weight printed on the label", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-pound price resolved from the ACTIVE scale price file", constraints: ">= 0" }
      - { name: total_price_cents, type: integer, source: computed, description: "round_half_up(net_weight_lbs * unit_price_cents)" }
      - { name: printed_at, type: datetime, source: system, description: "Logical-clock instant the label was issued" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: CateringOrder
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: platter_deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; the CATERING_PLATTER item ordered" }
      - { name: parent_order_id, type: string, source: input, description: "FK -> CateringOrder.id; order this one was split from; null when it is itself a root order", required: false }
      - { name: certified_planner_associate_id, type: string, source: input, description: "FK -> Associate.id; associate accountable for the platter build" }
      - { name: customer_name, type: string, source: input, description: "Customer name on the catering order" }
      - { name: platter_count, type: integer, source: input, description: "Number of platter units ordered", constraints: ">= 1" }
      - { name: headcount, type: integer, source: input, description: "Expected guest headcount", constraints: ">= 1" }
      - { name: lead_time_hours, type: integer, source: input, description: "Hours between order confirmation and the pickup window start", constraints: ">= 0" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Inclusive start of the customer pickup window" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Exclusive end of the customer pickup window", constraints: "> pickup_window_start; <= pickup_window_start + 2 hours" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit taken at confirmation", constraints: ">= 0" }
      - { name: quote_total_cents, type: integer, source: computed, description: "Output of calculations.catering_platter_quote" }
      - { name: pickup_bucket_key, type: string, source: computed, description: "10-minute pre-window staging buffer applied before bucketing: truncate_to_quarter_hour(pickup_window_start - 10 minutes); this key, not the raw window, decides aggregate bucket occupancy" }
      - { name: status, type: enum, source: system, description: "INQUIRY | CONFIRMED | IN_PRODUCTION | READY | PICKED_UP | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: Associate
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store the associate works in" }
      - { name: employee_number, type: string, source: input, description: "Payroll employee number, unique across the chain", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Associate full name" }
      - { name: primary_role, type: enum, source: input, description: "DELI_CLERK | DELI_MANAGER | BAKERY_COORDINATOR" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: allergy_set, type: array, source: input, default: [], description: "Declared allergen set this associate is cleared to handle (subset of MILK | WHEAT | SOY | EGG | FISH | SESAME); a deli clerk cannot ticket a product whose allergen set is not a subset of the store's covered_allergen_set" }
      - { name: active_certification_count, type: integer, source: computed, default: 0, description: "Count of Certification rows for this associate with status=ACTIVE and expires_at strictly after the logical clock" }
      - { name: assigned_slicer_id, type: string, source: computed, description: "id of the SlicerAsset currently assigned to this associate; null when none" }

  # ---------------------------------------------------------------------------
  - name: Certification
    parent: Associate
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store scope of the certification" }
      - { name: associate_id, type: string, source: input, description: "FK -> Associate.id; certified associate" }
      - { name: deli_item_id, type: string, source: input, description: "FK -> DeliItem.id; allergen scope of the certification; null means store-wide", required: false }
      - { name: revoked_by_manager_id, type: string, source: input, description: "FK -> Associate.id; manager who revoked this certification; null unless revoked", required: false }
      - { name: cert_type, type: enum, source: input, description: "SLICER_OPERATION | FOOD_HANDLING | ALLERGEN_MANAGEMENT" }
      - { name: issued_at, type: datetime, source: input, description: "Inclusive start of the certification validity interval" }
      - { name: expires_at, type: datetime, source: input, description: "Exclusive end of the certification validity interval", constraints: "> issued_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED | RENEWED" }
      - { name: grace_reminder, type: boolean, source: computed, default: false, description: "True when an ACTIVE certification expires within 72 hours of the logical clock" }

  # ---------------------------------------------------------------------------
  - name: WasteRecord
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store that owns the waste event" }
      - { name: production_batch_id, type: string, source: input, description: "FK -> ProductionBatch.id; batch the waste is drawn from" }
      - { name: markdown_by_associate_id, type: string, source: input, description: "FK -> Associate.id; associate who applied the markdown" }
      - { name: verifier_associate_id, type: string, source: input, description: "FK -> Associate.id; associate who verifies the discard (segregation of duties: must differ from the producer and the markdown associate)" }
      - { name: verified_by_certification_id, type: string, source: input, description: "FK -> Certification.id; certification presented at verification" }
      - { name: discard_lbs, type: number, source: input, description: "Pounds to be discarded", constraints: "> 0" }
      - { name: reason, type: enum, source: input, description: "HOLD_EXPIRED | TEMPERATURE_BREACH | ALLERGEN_CONTAMINATION | QUALITY | UNCLAIMED_PLATTER (UNCLAIMED_PLATTER rows are excluded from store_waste_liability)" }
      - { name: markdown_sold_lbs, type: number, source: input, default: 0, description: "Pounds moved at markdown price before discard", required: false }
      - { name: markdown_cents, type: integer, source: computed, default: 0, description: "Retail value recovered by the markdown" }
      - { name: markdown_recorded_at, type: datetime, source: system, description: "Logical-clock instant markdown was recorded" }
      - { name: discarded_at, type: datetime, source: system, description: "Logical-clock instant the discard was recorded" }
      - { name: discard_value_cents, type: integer, source: computed, description: "round_half_up(discard_lbs * deli_item.unit_cost_cents)" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "Tier fee computed from discard_value_cents (see calculations.waste_markdown_liability)" }
      - { name: total_liability_cents, type: integer, source: computed, description: "discard_value_cents + handling_fee_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | MARKED_DOWN | DISCARDED | VERIFIED | VOIDED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# All time arithmetic uses the logical clock (POST /_clock/set_current_utc).
# Every hold-window comparison is HALF-OPEN: [produced_at, hold_expires_at).
# Every pickup/sanitation/certification interval is HALF-OPEN as well.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Store — derived posture (compound / posture_driven)
  # ---------------------------------------------------------------------------
  - entity: Store
    initial_state: OPEN
    terminal_states: [HALT]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when the Store posture_reason computes RESTRICTED)"
        actor: system
        preconditions:
          - "store_deli_posture.reason == INVENTORY_TRIGGERED or REVOCATION_TRIGGERED or NO_ACTIVE_PRICE_FILE (see calculations.store_deli_posture)"
        side_effects:
          - "posture_reason records the predicate token"
          - "New ProductionBatch creates rejected with ERR_POSTURE_RESTRICTED until posture returns to OPEN"
      - from: RESTRICTED
        to: HALT
        trigger: "system (automatic when the Store posture_reason computes HALT)"
        actor: system
        preconditions:
          - "store_deli_posture.reason == CERTIFICATION_TRIGGERED"
        side_effects:
          - "All non-terminal SubTicket rows for this store move to ABANDONED (cascade level 1)"
          - "Every SubTicket moved to ABANDONED by this transition releases its reserved BreadSupplyOrder units (cascade level 2)"
          - "Releasing those units pushes each affected Promotion to DEGRADED when its units_short reaches 0 (cascade level 3)"
          - "Every ACTIVE Certification in this store is revoked with status=REVOKED"
      - from: HALT
        to: RESTRICTED
        trigger: "system (automatic when every Associate in the store regains an ACTIVE SLICER_OPERATION Certification and haccp_safety_flag is false)"
        actor: system
        preconditions:
          - "At least one Associate holds an ACTIVE SLICER_OPERATION Certification whose expires_at is strictly after the logical clock"
        side_effects:
          - "posture_reason == REVOCATION_TRIGGERED or INVENTORY_TRIGGERED depending on the remaining predicates"
      - from: RESTRICTED
        to: OPEN
        trigger: "system (automatic when case_on_hand_lbs <= deli_case_capacity_lbs, at least one ACTIVE ScalePriceFile exists, and at least one Associate holds an ACTIVE SLICER_OPERATION Certification)"
        actor: system
        preconditions:
          - "store_deli_posture.reason == OK"
        side_effects:
          - "posture_reason == OK"

  # ---------------------------------------------------------------------------
  # ProductionBatch — PARALLEL state dimensions (production_status x hold_status)
  # Dimension transitions never cross-update the other dimension.
  # ---------------------------------------------------------------------------
  - entity: ProductionBatch
    initial_state: "production_status=PLANNED x hold_status=HOLDING"
    terminal_states: [DISCARDED]
    transitions:
      - from: production_status=PLANNED
        to: production_status=IN_PRODUCTION
        trigger: POST /deli/production-batches/{batchId}/start
        actor: DeliClerk
        preconditions:
          - "batch.production_status == PLANNED (ERR_INVALID_STATE otherwise)"
          - "batch.store_id == storeId"
          - "store.posture must be OPEN; RESTRICTED or HALT rejects with ERR_POSTURE_RESTRICTED"
          - "slicer_id is required when deli_item.slicer_required is true (ERR_SLICER_REQUIRED)"
          - "produced_by_associate_id must hold an ACTIVE SLICER_OPERATION Certification when the item has slicer_required=true (ERR_ASSOCIATE_NOT_CERTIFIED)"
          - "slicer.sanitation_status must be CLEAN (ERR_SLICER_NOT_SANITIZED)"
          - "slicer.allergen_flags must not introduce any allergen absent from the item's declared allergen set (ERR_ALLERGEN_CHANGEOVER_REQUIRED)"
          - "the slicer must not be committed in the half-open interval [clock, clock + item.case_life_minutes) (ERR_SLICER_WINDOW_CONFLICT)"
          - "store.pending_waste_verification_count < 3, otherwise ERR_UNVERIFIED_WASTE_BACKLOG (business_fiscal fires before the safety-screened slicer checks because the fiscal backlog check is priority 9 and the temporal slicer checks are priority 12)"
        side_effects:
          - "slicer.sanitation_status -> IN_USE"
          - "slicer.assigned_deli_item_id -> batch.deli_item_id"
          - "case_on_hand_lbs recomputed; posture recomputed"
      - from: production_status=IN_PRODUCTION
        to: production_status=ON_LINE
        trigger: POST /deli/production-batches/{batchId}/complete
        actor: DeliClerk
        preconditions:
          - "batch.production_status == IN_PRODUCTION"
          - "produced_lbs > 0 (ERR_INVALID_REQUEST when zero or negative)"
        side_effects:
          - "produced_at is stamped from the logical clock"
          - "hold_expires_at = produced_at + deli_item.case_life_minutes"
          - "case_yield_cost_provisional_cents recomputed (calculations.batch_case_yield_cost, provisional variant)"
          - "case_yield_cost_final_cents recomputed (calculations.batch_case_yield_cost, final variant)"
          - "slicer.sanitation_status -> NEEDS_SANITATION"
          - "slicer cuts_since_sanitation incremented by ceil(batch.produced_lbs / 5)"
          - "slicer.last_sliced_deli_item_id -> batch.deli_item_id"
          - "store.case_on_hand_lbs recomputed; store.posture recomputed; store.version incremented"
          - "if the batch allergen set differs from the previous last_sliced_deli_item_id set, the allergen_changeover_required rule makes every queued ticket in the allergen set un-buildable (cascade level 1); each such ticket moves to BREAD_HOLD (cascade level 2); each affected Promotion is pushed to DEGRADED when its units_short reaches 0 (cascade level 3)"
      - from: production_status=ON_LINE
        to: production_status=ON_LINE
        trigger: POST /deli/production-batches/{batchId}/rework
        actor: DeliClerk
        preconditions:
          - "hold_status == DISCARDED (ERR_INVALID_STATE otherwise)"
          - "rework_of_batch_id must reference a batch whose hold_status == DISCARDED"
        side_effects:
          - "a successor ProductionBatch is created with rework_of_batch_id set and production_status=PLANNED"
          - "hold_status of the successor starts at HOLDING"
          - "the DISCARDED predecessor is left untouched (no state reversal)"
        note: "Rework is forward-only: the same row never leaves DISCARDED. This is the induced cycle ProductionBatch -> WasteRecord -> ProductionBatch."
      - from: hold_status=HOLDING
        to: hold_status=MARKED_DOWN
        trigger: POST /deli/production-batches/{batchId}/mark-down
        actor: DeliClerk
        preconditions:
          - "production_status == ON_LINE (ERR_INVALID_STATE otherwise)"
          - "logical clock t must satisfy produced_at + case_life_minutes - markdown_window_minutes <= t < hold_expires_at (half-open markdown window; ERR_MARKDOWN_WINDOW_CLOSED outside it)"
          - "markdown_chain_of_custody_blocked: an existing WasteRecord for the same batch with status in {DRAFT, MARKED_DOWN} rejects with ERR_WASTE_SEQUENCE_VIOLATION"
          - "recorded_by_associate_id must differ from the batch's produced_by_associate_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "markdown_sold_lbs accumulated; markdown_cents accumulated"
          - "store.posture recomputed"
      - from: hold_status=HOLDING
        to: hold_status=DISCARDED
        trigger: "system (automatic side effect of POST /deli/waste-records/{wasteRecordId}/discard; a batch never discards itself)"
        actor: system
        preconditions:
          - "a WasteRecord for this batch has entered DISCARDED"
          - "either deli_item.markdown_window_minutes == 0 or the half-open markdown window is closed at the logical clock"
        side_effects: []
      - from: hold_status=MARKED_DOWN
        to: hold_status=DISCARDED
        trigger: "system (automatic side effect of POST /deli/waste-records/{wasteRecordId}/discard)"
        actor: system
        preconditions:
          - "the batch's WasteRecord has entered DISCARDED from MARKED_DOWN"
        side_effects: []
      - from: hold_status=DISCARDED
        to: hold_status=DISCARDED
        trigger: system (run_production_day sweep, no-op self-loop when a VERIFIED WasteRecord already exists)"
        actor: system
        preconditions:
          - "a WasteRecord for this batch with status=VERIFIED already exists"
        side_effects: []

  # ---------------------------------------------------------------------------
  # SlicerAsset — INDUCED CYCLE: IN_USE -> NEEDS_SANITATION -> SANITIZING -> CLEAN -> IN_USE
  # ---------------------------------------------------------------------------
  - entity: SlicerAsset
    initial_state: CLEAN
    terminal_states: []
    transitions:
      - from: CLEAN
        to: IN_USE
        trigger: POST /deli/production-batches/{batchId}/start (batch claims this asset)"
        actor: DeliClerk
        preconditions:
          - "slicer.sanitation_status == CLEAN"
          - "slicer.assigned_operator_id references an Associate with a non-expired SLICER_OPERATION Certification"
        side_effects:
          - "assigned_deli_item_id set; no second IN_USE entry is possible while sanitizing"
      - from: IN_USE
        to: NEEDS_SANITATION
        trigger: POST /deli/production-batches/{batchId}/complete
        actor: DeliClerk
        preconditions:
          - "the batch slice cycle finished"
        side_effects:
          - "cuts_since_sanitation += batch.cuts"
          - "last_sliced_deli_item_id -> batch.deli_item_id"
          - "in_use_minutes += batch slicing minutes"
      - from: NEEDS_SANITATION
        to: SANITIZING
        trigger: POST /deli/sanitation-cycles
        actor: DeliClerk
        preconditions:
          - "no other OPEN SanitationCycle exists for this slicer (ERR_SLICER_WINDOW_CONFLICT)"
          - "for cycle_type=ROUTINE: cuts_since_sanitation >= sanitation_cycle_limit (ERR_SANITATION_CYCLE_NOT_DUE otherwise)"
          - "for cycle_type=TIMED: in_use_minutes >= sanitation_cycle_limit * 3 (ERR_SANITATION_CYCLE_NOT_DUE otherwise)"
          - "for cycle_type=ALLERGEN_CHANGEOVER: allergen_cleared_from_item_id must be non-null and its allergen_flags must be a proper subset of last_sliced_deli_item_id's allergen_flags (ERR_ALLERGEN_CHANGEOVER_REQUIRED otherwise)"
          - "the requested cycle_type must be ALLERGEN_CHANGEOVER whenever the next batch's item allergen set diverges from last_sliced_deli_item_id's set (ERR_ALLERGEN_CHANGEOVER_REQUIRED)"
        side_effects:
          - "a SanitationCycle row is created with status=OPEN"
          - "slicer.sanitation_status -> SANITIZING (this is a mechanical consequence of the SlicerAsset sub-state SANITIZING, not a second SlicerAsset state dimension)"
          - "the slicer is committed for [clock, clock + cycle_minutes) (interval semantics: half-open, no buffer)"
      - from: SANITIZING
        to: CLEAN
        trigger: POST /deli/sanitation-cycles/{cycleId}/complete
        actor: DeliClerk
        preconditions:
          - "cycle.status == OPEN"
          - "clock >= cycle.started_at + cycle.cycle_minutes (ERR_CYCLE_NOT_COMPLETE otherwise)"
          - "verified_by_associate_id must hold an ACTIVE ALLERGEN_MANAGEMENT Certification for cycle_type=ALLERGEN_CHANGEOVER (ERR_ASSOCIATE_NOT_CERTIFIED otherwise)"
        side_effects:
          - "cycle.status -> COMPLETE; completed_at stamped"
          - "slicer.sanitation_status -> CLEAN"
          - "slicer.cuts_since_sanitation reset to 0"
          - "slicer.in_use_minutes reset to 0"
          - "slicer.last_sanitized_at stamped"
          - "certification.active_certification_count recomputed"
      - from: SANITIZING
        to: NEEDS_SANITATION
        trigger: "system (abort_path: the OPEN cycle is aborted)"
        actor: system
        preconditions:
          - "cycle.aborted == true"
        side_effects:
          - "cycle.status -> ABORTED"
          - "the asset still needs a sanitation cycle; no counter reset occurs"

  # ---------------------------------------------------------------------------
  # SanitationCycle — branching with revert (converging on a second revert edge)
  # ---------------------------------------------------------------------------
  - entity: SanitationCycle
    initial_state: OPEN
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - from: OPEN
        to: COMPLETE
        trigger: POST /deli/sanitation-cycles/{cycleId}/complete
        actor: DeliClerk
        preconditions:
          - "clock >= started_at + cycle_minutes (ERR_CYCLE_NOT_COMPLETE otherwise)"
        side_effects:
          - "slicer.sanitation_status -> CLEAN"
      - from: COMPLETE
        to: ABORTED
        trigger: POST /deli/sanitation-cycles/{cycleId}/reopen
        actor: DeliManager
        preconditions:
          - "the manager asserts the cycle evidence is invalid"
          - "slicer.sanitation_status must currently be CLEAN (ERR_INVALID_STATE otherwise)"
          - "a reopened cycle must not exceed 2 reopenings per slicer per production day (ERR_REOPEN_LIMIT_EXCEEDED)"
        side_effects:
          - "the cycle's status returns to ABORTED with a reopen_count increment"
          - "slicer.sanitation_status -> NEEDS_SANITATION"
          - "slicer.cuts_since_sanitation is NOT reset (no credit for an invalid cycle)"
      - from: OPEN
        to: ABORTED
        trigger: POST /deli/sanitation-cycles/{cycleId}/abort
        actor: DeliManager
        preconditions:
          - "cycle.status == OPEN"
        side_effects:
          - "slicer.sanitation_status -> NEEDS_SANITATION"
      - from: ABORTED
        to: OPEN
        trigger: "system (a new sanitation cycle is opened on the same slicer, which supersedes the aborted attempt)"
        actor: system
        preconditions:
          - "the previous cycle is ABORTED and no other OPEN cycle exists for the slicer"
        side_effects: []
        note: "Cycle-abort, re-open for a second attempt; the abort_count lives on the aborted cycle, which keeps its ABORTED status forever (rework-forward)."

  # ---------------------------------------------------------------------------
  # ScalePriceFile — INDUCED CYCLE: PENDING -> ACTIVE -> SUPERSEDED -> PENDING -> ACTIVE
  # ---------------------------------------------------------------------------
  - entity: ScalePriceFile
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: POST /deli/price-files/{priceFileId}/activate
        actor: DeliManager
        preconditions:
          - "no other price file for this store may already be ACTIVE for an interval overlapping [effective_from, effective_to), unless this file is a re-price (effective_from strictly later than the incumbent's while effective_to is identical) — ERR_PRICE_FILE_OVERLAP otherwise"
        side_effects:
          - "activated_at stamped from the logical clock"
          - "status -> ACTIVE; the previously ACTIVE file, if any, moves to SUPERSEDED (cascade level 1)"
          - "superseding the previous file voids every ISSUED Label written against it (cascade level 2)"
          - "voiding those labels forces each originating SubTicket to REMADE (cascade level 3)"
          - "store.active_price_file_id recomputed (calculations.price_file_resolution); store.version incremented"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another file for the same store becomes ACTIVE)"
        actor: system
        preconditions:
          - "a successor file has entered ACTIVE for an overlapping interval"
        side_effects:
          - "every Label with price_file_id == this file and status == ISSUED -> VOIDED"
          - "each SubTicket whose label was voided -> REMADE"
      - from: SUPERSEDED
        to: PENDING
        trigger: POST /deli/price-files/{priceFileId}/reactivate
        actor: DeliManager
        preconditions:
          - "the currently ACTIVE file is expired relative to the logical clock"
          - "this file's effective interval contains the logical clock"
        side_effects:
          - "status -> PENDING then immediately ACTIVE via the PENDING -> ACTIVE edge"
          - "store.active_price_file_id recomputed"
        note: "Forward-only reactivation: a superseded file re-enters rotation through PENDING, never by reverting the SUPERSEDED row."
      - from: ACTIVE
        to: PENDING
        trigger: POST /deli/price-files/{priceFileId}/retract
        actor: DeliManager
        preconditions:
          - "no ISSUED Label references this file (ERR_PRICE_FILE_IN_USE otherwise)"
          - "the associated promotion is CANCELLED before the price file may be withdrawn (ERR_PROMO_STATE_BLOCKS_FILE_WITHDRAWAL otherwise)"
        side_effects:
          - "store.active_price_file_id recomputed"
        note: "A withdrawn rotation returns to PENDING rather than a dead end — supported by splitting [PENDING, ACTIVE] x [DRAFT, SUPERSEDED]."

  # ---------------------------------------------------------------------------
  # Promotion — cyclic revision loop
  # ---------------------------------------------------------------------------
  - entity: Promotion
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: POST /deli/promotions/{promotionId}/activate
        actor: DeliManager
        preconditions:
          - "clock must be within [week_start_date, week_end_date) (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "required_bread_units recomputed (calculations.promo_bread_demand, provisional variant)"
          - "store.targeted_promo_id recomputed"
      - from: ACTIVE
        to: DEGRADED
        trigger: "system (automatic when its units_short reaches 0)"
        actor: system
        preconditions:
          - "bread_forecast_coverage.units_short > 0.5 * required_bread_units"
        side_effects:
          - "promotion stays ACTIVE for pricing but is marked DEGRADED"
      - from: DEGRADED
        to: ACTIVE
        trigger: "POST /deli/bread-supply-orders/{breadOrderId}/confirm or system (automatic when bread reserves are released by ticket abandonment, completion or pickup)"
        actor: BakeryCoordinator
        preconditions:
          - "bread_forecast_coverage.units_short == 0 after the confirmation or after the release"
        side_effects:
          - "promotion returns to full ACTIVE coverage; required_bread_units recomputed"
      - from: ACTIVE
        to: SETTLED
        trigger: POST /deli/promotions/{promotionId}/settle
        actor: DeliManager
        preconditions:
          - "clock >= week_end_date (ERR_INVALID_STATE otherwise)"
          - "no BreadSupplyOrder referencing this promotion may be in {SUBMITTED, CONFIRMED} (ERR_INVALID_STATE otherwise) — the promotion cannot settle while bread commitments are still open"
        side_effects:
          - "status -> SETTLED; settled_bread_units = the Settled variant of calculations.promo_bread_demand (uplift capped at 0.35 before forecasting)"
          - "promotion_settlement computes actual_units and final settlement cents"
      - from: SETTLED
        to: ACTIVE
        trigger: POST /deli/promotions/{promotionId}/reopen
        actor: DeliManager
        preconditions:
          - "the weeks-old settlement is under revision"
        side_effects:
          - "settled_bread_units is cleared; required_bread_units recomputed provisionally"
        note: "Settle -> reopen -> re-settle; the promotion settles again permanently the second time."
      - from: SETTLED
        to: CANCELLED
        trigger: POST /deli/promotions/{promotionId}/cancel
        actor: DeliManager
        preconditions:
          - "no BreadSupplyOrder with status in {SUBMITTED, CONFIRMED, DELIVERED} references this promotion (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "store.targeted_promo_id recomputed"
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /deli/promotions/{promotionId}/cancel
        actor: DeliManager
        preconditions:
          - "no BreadSupplyOrder with status in {SUBMITTED, CONFIRMED, DELIVERED} references this promotion"
        side_effects:
          - "status -> CANCELLED"
          - "every BreadSupplyOrder referencing this promotion -> RECONCILED"
          - "store.targeted_promo_id recomputed"

  # ---------------------------------------------------------------------------
  # BreadSupplyOrder — linear with a late-stage revision edge (cycle)
  # ---------------------------------------------------------------------------
  - entity: BreadSupplyOrder
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/submit
        actor: BakeryCoordinator
        preconditions:
          - "clock < submit_by_at (ERR_LEAD_TIME_VIOLATED otherwise)"
          - "required_units > 0 (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "required_units copied from promotion.required_bread_units"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/confirm
        actor: BakeryCoordinator
        preconditions:
          - "committed_units >= required_units * 0.8 (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "shortfall_units recomputed (calculations.bread_supply_shortfall)"
          - "if shortfall_units > 0, the referenced Promotion -> DEGRADED"
      - from: CONFIRMED
        to: DELIVERED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/deliver
        actor: BakeryCoordinator
        preconditions:
          - "delivered_units >= 0"
        side_effects:
          - "delivered_units recorded"
          - "if delivered_units < required_units * 0.9 then status -> SHORT after delivery"
      - from: CONFIRMED
        to: SHORT
        trigger: system (automatic on delivery shortfall)
        actor: system
        preconditions:
          - "delivered_units < required_units * 0.9"
        side_effects:
          - "the referenced Promotion -> DEGRADED"
      - from: DELIVERED
        to: SUBMITTED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/reopen
        actor: DeliManager
        preconditions:
          - "the delivered load was rejected at receiving"
        side_effects:
          - "status returns to SUBMITTED for a second bakery commitment"
        note: "Deliver -> reopen -> re-confirm -> re-deliver; the order returns through SUBMITTED rather than reverting the DELIVERED row."
      - from: SHORT
        to: SUBMITTED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/reopen
        actor: DeliManager
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: RECONCILED
        trigger: "system (run_production_day closeout for the promotion week)"
        actor: system
        side_effects:
          - "the referenced Promotion, when its week_end_date has passed and no open order remains, is eligible to settle"
      - from: SHORT
        to: RECONCILED
        trigger: "system (run_production_day closeout when the promotion is SETTLED or CANCELLED)"
        actor: system
        side_effects: []

  # ---------------------------------------------------------------------------
  # SubTicket — parallel dimensions (fulfillment_status x bread_status) + cycle
  # fulfillment_status: QUEUED -> TICKETED -> IN_PROGRESS -> COMPLETED -> PICKED_UP
  # bread_status:       QUEUED -> BREAD_HOLD -> QUEUED (revert edge)
  # ---------------------------------------------------------------------------
  - entity: SubTicket
    initial_state: "fulfillment_status=QUEUED x bread_status=QUEUED"
    terminal_states: [PICKED_UP, ABANDONED]
    transitions:
      - from: fulfillment_status=QUEUED
        to: fulfillment_status=TICKETED
        trigger: POST /deli/sub-tickets/{ticketId}/ticket
        actor: DeliClerk
        preconditions:
          - "store.posture must not be HALT (ERR_POSTURE_RESTRICTED when HALT)"
          - "store.certified_slicer_operator_count >= 1 (ERR_NO_CERTIFIED_STAFF otherwise)"
          - "every line's deli_item_id that has slicer_required=true must have at least one CLEAN slicer in the store (ERR_NO_CLEAN_SLICER otherwise)"
          - "bread_status must be QUEUED (ERR_BREAD_UNAVAILABLE while the ticket sits in BREAD_HOLD)"
        side_effects:
          - "status -> TICKETED; ticket_number assigned"
          - "promised_at recomputed (calculations.promised_time_sla)"
          - "queue_position recomputed for every non-terminal ticket in the store"
      - from: fulfillment_status=TICKETED
        to: fulfillment_status=IN_PROGRESS
        trigger: "system (automatic when the assigned station begins the build)"
        actor: system
        preconditions:
          - "the deli_item's production prerequisites hold (a CLEAN slicer for slicer-required items)"
        side_effects:
          - "the slicer used enters IN_USE"
      - from: fulfillment_status=IN_PROGRESS
        to: fulfillment_status=COMPLETED
        trigger: POST /deli/sub-tickets/{ticketId}/complete
        actor: DeliClerk
        preconditions:
          - "store.active_price_file_id must not be null (ERR_PRICE_FILE_STALE otherwise)"
          - "the price file's interval must contain the logical clock (ERR_PRICE_FILE_STALE otherwise)"
          - "bread_status must be QUEUED (ERR_BREAD_UNAVAILABLE otherwise)"
          - "store.case_on_hand_lbs >= weight_lbs * 0.5 for every line's item (ERR_SHELF_OUT otherwise)"
        side_effects:
          - "status -> COMPLETED; completed_at stamped; lateness_minutes recomputed"
          - "a Label is synthesized with subject_type=SUB_TICKET and status=ISSUED"
          - "line_total_cents recomputed (calculations.sub_ticket_line_total)"
          - "price_file.synced_scale_count recomputed"
          - "queue_position recomputed for the remaining non-terminal tickets"
      - from: fulfillment_status=COMPLETED
        to: fulfillment_status=PICKED_UP
        trigger: POST /deli/sub-tickets/{ticketId}/pickup
        actor: DeliClerk
        preconditions:
          - "status == COMPLETED (ERR_INVALID_STATE otherwise)"
          - "the label issued for this ticket must still be ISSUED (ERR_LABEL_STALE otherwise)"
        side_effects:
          - "counter pickup recorded"
      - from: fulfillment_status=QUEUED
        to: fulfillment_status=ABANDONED
        trigger: POST /deli/sub-tickets/{ticketId}/abandon
        actor: DeliClerk
        preconditions:
          - "status == QUEUED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "queue_position recomputed for the remaining non-terminal tickets"
      - from: fulfillment_status=TICKETED
        to: fulfillment_status=ABANDONED
        trigger: "system (Store HALT cascade when the store posture becomes HALT)"
        actor: system
        preconditions:
          - "store.posture == HALT"
        side_effects:
          - "any reserved BreadSupplyOrder units for this ticket are released"
      - from: fulfillment_status=COMPLETED
        to: fulfillment_status=REMADE
        trigger: "system (automatic when the label issued for this ticket is voided)"
        actor: system
        preconditions:
          - "ticket.label_id references a Label whose status became VOIDED"
        side_effects:
          - "remake_count += 1"
          - "the ticket's status returns to QUEUED through a fresh fulfillment cycle on the same row"
          - "idempotency_key carry-forward: the remake reuses the original ticket_number"
      - from: fulfillment_status=REMADE
        to: fulfillment_status=QUEUED
        trigger: POST /deli/sub-tickets/{ticketId}/requeue
        actor: DeliClerk
        preconditions:
          - "such a transition is only reachable via the REMADE state (ERR_INVALID_STATE when status != REMADE)"
        side_effects:
          - "the ticket re-enters the queue without a new ticket_number"
      - from: bread_status=QUEUED
        to: bread_status=BREAD_HOLD
        trigger: "system (automatic when the ticket's bread item is unavailable or the store posture is RESTRICTED)"
        actor: system
        preconditions:
          - "the ticket's bread_deli_item_id is not available from the store's bread supply"
        side_effects:
          - "any reserved bread units for this ticket are released"
      - from: bread_status=BREAD_HOLD
        to: bread_status=QUEUED
        trigger: POST /deli/bread-supply-orders/{breadOrderId}/deliver
        actor: BakeryCoordinator
        side_effects:
          - "every BREAD_HOLD ticket whose bread item was delivered returns to QUEUED (cascade level 2 from the bread delivery)"
          - "reserving bread units pushes each affected Promotion to DEGRADED when its units_short reaches 0 (cascade level 3)"

  # ---------------------------------------------------------------------------
  # CateringOrder — branching with revert
  # ---------------------------------------------------------------------------
  - entity: CateringOrder
    initial_state: INQUIRY
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: INQUIRY
        to: CONFIRMED
        trigger: POST /deli/catering-orders/{orderId}/confirm
        actor: DeliClerk
        preconditions:
          - "lead_time_hours >= 24 unless the acting associate holds an ACTIVE FOOD_HANDLING Certification (ERR_LEAD_TIME_VIOLATED otherwise)"
          - "certified_planner_associate_id must hold an ACTIVE FOOD_HANDLING Certification (ERR_ASSOCIATE_NOT_CERTIFIED otherwise)"
          - "the pickup window must not push the quarter-hour bucket past its aggregate capacity (ERR_PICKUP_CAPACITY_EXCEEDED otherwise)"
          - "clock + lead_time_hours <= pickup_window_start (ERR_LEAD_TIME_VIOLATED otherwise)"
          - "store.posture must be OPEN"
        side_effects:
          - "pickup_bucket_key assigned"
          - "the 15-minute bucket headcount accumulator increases"
          - "quote_total_cents recomputed (calculations.catering_platter_quote)"
      - from: CONFIRMED
        to: INQUIRY
        trigger: POST /deli/catering-orders/{orderId}/revise
        actor: DeliClerk
        preconditions:
          - "the customer requested a change of platter count or pickup window"
          - "the order is not yet IN_PRODUCTION"
        side_effects:
          - "the bucket headcount accumulator increases"
          - "quote_total_cents recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /deli/catering-orders/{orderId}/cancel
        actor: DeliClerk
        preconditions:
          - "the order is not yet IN_PRODUCTION"
        side_effects:
          - "the bucket headcount accumulator decreases"
      - from: INQUIRY
        to: CANCELLED
        trigger: POST /deli/catering-orders/{orderId}/cancel
        actor: DeliClerk
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: POST /deli/catering-orders/{orderId}/start-production
        actor: DeliClerk
        side_effects: []
      - from: IN_PRODUCTION
        to: READY
        trigger: POST /deli/catering-orders/{orderId}/mark-ready
        actor: DeliClerk
        preconditions:
          - "the store must be within the pickup window start minus 2 hours"
        side_effects:
          - "a Label is synthesized with subject_type=CATERING_PLATTER"
      - from: READY
        to: PICKED_UP
        trigger: POST /deli/catering-orders/{orderId}/pickup
        actor: DeliClerk
        preconditions:
          - "clock must be strictly inside [pickup_window_start, pickup_window_end) (ERR_PICKUP_WINDOW_MISSED at or after pickup_window_end)"
        side_effects:
          - "the bucket headcount accumulator decreases"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: POST /deli/catering-orders/{orderId}/cancel
        actor: DeliManager
        side_effects:
          - "the bucket headcount accumulator decreases"
      - from: READY
        to: CANCELLED
        trigger: POST /deli/catering-orders/{orderId}/cancel
        actor: DeliManager
        side_effects:
          - "an unclaimed-platter WasteRecord is synthesized against the platter's batch"
          - "catering waste is excluded from calculations.store_waste_liability because reason=UNCLAIMED_PLATTER is excluded from the input set"

  # ---------------------------------------------------------------------------
  # Associate — branching with revert
  # ---------------------------------------------------------------------------
  - entity: Associate
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /deli/associates/{associateId}/suspend
        actor: DeliManager
        preconditions:
          - "reason in {CERTIFICATION_EXPIRED, SAFETY_VIOLATION, TRANSFER}"
        side_effects:
          - "every Certification held by the associate -> REVOKED (cascade level 1a)"
          - "store.certified_slicer_operator_count recomputed"
          - "the Store -> HALT transition fires whenever certified_slicer_operator_count == 0 after the recompute (cascade level 1b)"
          - "every non-terminal SubTicket in the store moves to ABANDONED (cascade level 2)"
          - "each ABANDONED ticket releases its reserved BreadSupplyOrder units (cascade level 3)"
          - "each affected Promotion -> DEGRADED when its units_short reaches 0 (cascade level 4)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /deli/associates/{associateId}/reinstate
        actor: DeliManager
        preconditions:
          - "the associate presents a renewed SLICER_OPERATION Certification before reinstatement"
        side_effects:
          - "certified_slicer_operator_count recomputed"

  # ---------------------------------------------------------------------------
  # Certification — cyclic renewal chain
  # ---------------------------------------------------------------------------
  - entity: Certification
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic at run_production_day when the logical clock reaches expires_at)"
        actor: system
        side_effects:
          - "associate.active_certification_count recomputed"
          - "store.certified_slicer_operator_count recomputed; Store posture recomputed"
      - from: EXPIRED
        to: RENEWED
        trigger: POST /deli/certifications/{certificationId}/renew
        actor: DeliManager
        side_effects:
          - "a successor Certification is created with status=ACTIVE and a later expires_at"
          - "associate.active_certification_count recomputed"
      - from: ACTIVE
        to: REVOKED
        trigger: POST /deli/certifications/{certificationId}/revoke
        actor: DeliManager
        preconditions:
          - "revoked_by_manager_id must differ from associate_id (a manager cannot revoke their own certification)"
        side_effects:
          - "store.certified_slicer_operator_count recomputed"
          - "when the count reaches 0, the Store -> HALT is induced"
      - from: RENEWED
        to: ACTIVE
        trigger: POST /deli/certifications/{certificationId}/reopen
        actor: DeliManager
        side_effects:
          - "the successor's validity window is recomputed from the logical clock"
        note: "Renew opens a successor; reopen re-enters the successor through ACTIVE rather than reverting the RENEWED row."

  # ---------------------------------------------------------------------------
  # WasteRecord — strict forward sequence DRAFT -> MARKED_DOWN -> DISCARDED -> VERIFIED
  # ---------------------------------------------------------------------------
  - entity: WasteRecord
    initial_state: DRAFT
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: MARKED_DOWN
        trigger: POST /deli/waste-records/{wasteRecordId}/mark-down
        actor: DeliClerk
        preconditions:
          - "the parent batch's hold_status must be MARKED_DOWN (ERR_MARKDOWN_REQUIRED_BEFORE_DISCARD otherwise)"
          - "logical clock t must satisfy produced_at + case_life_minutes - markdown_window_minutes <= t < hold_expires_at (ERR_MARKDOWN_WINDOW_CLOSED otherwise)"
          - "markdown_by_associate_id must differ from the batch's produced_by_associate_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "status -> MARKED_DOWN"
          - "markdown_sold_lbs and markdown_cents recorded"
          - "the batch's markdown_sold_lbs and markdown_cents recomputed"
      - from: DRAFT
        to: DISCARDED
        trigger: POST /deli/waste-records/{wasteRecordId}/discard
        actor: DeliClerk
        preconditions:
          - "the parent batch's hold_status is HOLDING and either the item's markdown_window_minutes is 0 or the half-open markdown window is closed (ERR_MARKDOWN_REQUIRED_BEFORE_DISCARD while the window is open)"
        side_effects:
          - "status -> DISCARDED; discarded_at stamped"
          - "the parent batch's hold_status -> DISCARDED"
          - "discard_value_cents, handling_fee_cents and total_liability_cents recomputed"
      - from: MARKED_DOWN
        to: DISCARDED
        trigger: POST /deli/waste-records/{wasteRecordId}/discard
        actor: DeliClerk
        preconditions:
          - "the batch's hold_status must be in {HOLDING, MARKED_DOWN} (ERR_INVALID_STATE otherwise) — a discarded batch cannot be marked down because that is the reverse of the mandated sequence"
        side_effects:
          - "status -> DISCARDED; discarded_at stamped from the logical clock"
          - "discard_value_cents recomputed"
          - "handling_fee_cents recomputed (tiered; the tier base reads prior records' settled totals)"
          - "total_liability_cents recomputed"
          - "store_waste_liability recomputed"
          - "the parent batch's hold_status -> DISCARDED"
      - from: DISCARDED
        to: VERIFIED
        trigger: POST /deli/waste-records/{wasteRecordId}/verify
        actor: DeliManager
        preconditions:
          - "verifier_associate_id must differ from the batch's produced_by_associate_id and from markdown_by_associate_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "verified_by_certification_id must reference an ACTIVE FOOD_HANDLING certification belonging to verifier_associate_id (ERR_ASSOCIATE_NOT_CERTIFIED otherwise)"
        side_effects:
          - "the batch's discard_lbs recomputed"
          - "the batch's case_yield_cost_final_cents recomputed (final variant)"
          - "store_waste_liability recomputed; case_yield_cost_final_cents is now settled"
          - "store.pending_waste_verification_count recomputed"
          - "verified_waste_liability_cents is incremented on the store"
      - from: VERIFIED
        to: DISCARDED
        trigger: POST /deli/waste-records/{wasteRecordId}/unverify
        actor: DeliManager
        preconditions:
          - "the verification is under review"
        side_effects:
          - "verified_waste_liability_cents decremented; total_liability_cents recomputed"
        note: "Unverify -> re-verify: the record re-enters VERIFIED through DISCARDED, never by reverting the verified row in place."
      - from: DRAFT
        to: VOIDED
        trigger: POST /deli/waste-records/{wasteRecordId}/void
        actor: DeliManager
        preconditions:
          - "no discard has been recorded yet"
        side_effects: []
      - from: MARKED_DOWN
        to: VOIDED
        trigger: POST /deli/waste-records/{wasteRecordId}/void
        actor: DeliManager
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1)
# Only true races — a strictly sequential second request observes the parent's
# version advanced by the intervening legitimate supersede, so it is resolved by
# OCC on the parent's `version`, never by wall-clock or lock framing.
# =============================================================================
concurrency_rules:
  - rule_id: start-batch-stale-store
    parent_entity: Store
    write_endpoint: "POST /deli/production-batches/{batchId}/start"
    occ_field: "expected_store_version"
    description: |
      Starting a production batch against a Store whose version has advanced
      since the client last observed it is rejected. The batch's start claims a
      slicer and recomputes case_on_hand_lbs, which correctly supersedes the
      store state the client was holding; a writer still carrying the observed
      version is stale even though its own request would otherwise be legal.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: verify-waste-stale-batch
    parent_entity: ProductionBatch
    write_endpoint: "POST /deli/waste-records/{wasteRecordId}/verify"
    occ_field: "expected_batch_version"
    description: |
      Verifying a waste record against a ProductionBatch whose version has
      advanced since the client last observed it is rejected. Verification
      settles case_yield_cost_final_cents, which legitimately supersedes the
      cost the client was quoting; a later writer holding the observed version
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: confirm-bread-stale-promotion
    parent_entity: Promotion
    write_endpoint: "POST /deli/bread-supply-orders/{breadOrderId}/confirm"
    occ_field: "expected_promotion_version"
    description: |
      Confirming a bread supply order against a Promotion whose version has
      advanced since the client last observed it is rejected. The confirmation
      legitimately recomputes required_bread_units, superseding the forecast the
      client was holding; a writer still carrying the observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:

  - name: batch_case_yield_cost
    trigger: "POST /deli/production-batches/{batchId}/complete (ON_LINE entry) and again on POST /deli/waste-records/{wasteRecordId}/verify"
    algorithm: dual_variant
    formula: |
      # precision is pinned: round ONCE for each output, never per component.
      lb_cost = produced_lbs * deli_item.unit_cost_cents
              + (RETAIL_LABOR_LOAD_CENTS if production_status == ON_LINE else 0)
              + (0 if slicer is null else floor(slicer.cuts_since_sanitation / SLICER_CUTS_PER_FEE_UNIT) * FEE_PER_CUT_UNIT_CENTS)

      case_yield_cost_provisional_cents = round_half_up(lb_cost - WASTE_RECOVERY_RATE * discard_lbs * deli_item.unit_cost_cents, 2)

      case_yield_cost_final_cents = round_half_up(lb_cost - WASTE_RECOVERY_RATE * discard_lbs * deli_item.unit_cost_cents, 2)
                                  + round_half_up(sum(w.handling_fee_cents for w in WasteRecord
                                                     where w.production_batch_id == batch.id and w.status == VERIFIED), 2)
                                  + NET_MARKDOWN_RATE * deli_item.retail_price_per_lb_cents * markdown_sold_lbs
    input_set: "the batch itself; discard_lbs and markdown_sold_lbs of that batch only; handling_fee_cents of VERIFIED WasteRecord rows for that batch only. DISCARDED-but-unverified rows contribute nothing to the final variant."
    constants:
      RETAIL_LABOR_LOAD_CENTS: 45
      SLICER_CUTS_PER_FEE_UNIT: 20
      FEE_PER_CUT_UNIT_CENTS: 6
      WASTE_RECOVERY_RATE: 0.70
      NET_MARKDOWN_RATE: 0.50
    precision: "2 decimal places, round_half_up, applied once per output"
    variants:
      - name: Operating
        when: "reported while no VERIFIED WasteRecord exists for the batch — writes case_yield_cost_provisional_cents"
        difference: "excludes the handling fee and the net markdown recovery entirely"
      - name: WASTE_LEDGER
        when: "reported once at least one VERIFIED WasteRecord exists for the batch — writes case_yield_cost_final_cents"
        difference: "adds round_half_up(sum of VERIFIED WasteRecord.handling_fee_cents, 2) and 0.50 * retail_price_per_lb_cents * markdown_sold_lbs"

  - name: sub_ticket_line_total
    trigger: "POST /deli/sub-tickets (creation) and POST /deli/sub-tickets/{ticketId}/complete (recomputation against the ACTIVE price file)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round per line to whole cents, THEN sum.
      # Summing then rounding diverges by up to (line_count - 1) cents.
      promotion_uplift_pct = store.targeted_promo_id.forecast_uplift_pct when the store has a targeted promo, else 0.0
      price_file_unit_price_cents = deli_item.retail_price_per_lb_cents   # the ACTIVE price file gates freshness only

      for each distinct line_sequence_number L present in ticket.lines:
        line_extent_lbs   = sum(l.half_lb_units for l in ticket.lines where l.line_sequence_number == L) * HALF_LB_UNIT
        line_cost_cents   = round_half_up(line_extent_lbs * price_file_unit_price_cents, 0)
        line_promo_cents  = round_half_up(line_cost_cents * promotion_uplift_pct, 0)
        line_total_cents(L) = line_cost_cents - line_promo_cents

      ticket.line_total_cents = sum(line_total_cents(L) for every distinct line_sequence_number L)
    input_set: "lines of this ticket only, grouped by client-supplied line_sequence_number; the store's ACTIVE price file; the store's targeted promotion uplift. A ticket with zero lines is rejected at creation by validation priority 32."
    constants:
      HALF_LB_UNIT: 0.5
    precision: "per-line round_half_up to 0 decimal places, then integer sum"
    variants: []

  - name: promo_bread_demand
    trigger: "POST /deli/promotions/{promotionId}/activate (provisional) and POST /deli/promotions/{promotionId}/settle (final)"
    algorithm: dual_variant
    formula: |
      baseline_units      = trailing_baseline_units
      raw_uplift          = promotion_uplift_pct                                  # Provisional
      raw_uplift          = min(promotion_uplift_pct, SETTLEMENT_UPLIFT_CAP)      # Settled
      forecast_units      = round_half_up(baseline_units * (1 + raw_uplift), 0)
      bread_units         = forecast_units + round_half_up(forecast_units * BREAD_WASTE_FACTOR, 0)
      required_bread_units = ceil(bread_units / UNITS_PER_CASE) * UNITS_PER_CASE
    input_set: "the promotion's own trailing_baseline_units and promotion_uplift_pct; no ticket or order data enters this calculation. Promotions in CANCELLED status are excluded."
    constants:
      BREAD_WASTE_FACTOR: 0.12
      UNITS_PER_CASE: 12
      SETTLEMENT_UPLIFT_CAP: 0.35
    precision: "round_half_up to 0 decimal places at forecast_units and at bread_units; ceil at the case round-up"
    variants:
      - name: Provisional
        when: "a promotion is ACTIVE and its week has not closed — writes required_bread_units"
        difference: "applies the full forecast_uplift_pct, which over-orders bread for promotions whose uplift is above the settlement cap"
      - name: Settled
        when: "a promotion is settled after week_end_date — writes settled_bread_units"
        difference: "caps the uplift at 0.35 before forecasting, so identical input data yields a smaller bread demand"

  - name: diffusion_index
    trigger: "any change to certification state, waste verification backlog, or slicer sanitation counters for a store"
    algorithm: weighted_scoring
    formula: |
      cert_expired_count  = count(Associate in store with status == ACTIVE
                                  and no Certification in {SLICER_OPERATION} with status == ACTIVE and expires_at > clock)
      fiscal_backlog_count = count(WasteRecord in store with status in {DRAFT, MARKED_DOWN, DISCARDED})
      slicer_due_count    = count(SlicerAsset in store with sanitation_status in {NEEDS_SANITATION})

      protection_index = BASE - CERT_WEIGHT * cert_expired_count - FISCAL_WEIGHT * fiscal_backlog_count - SLICER_WEIGHT * slicer_due_count
      protection_index = max(protection_index, PROTECTION_FLOOR)   # clamped floor; never negative
      diffusion_index  = BASE - protection_index                   # so diffusion_index is capped at 100
    input_set: "only the three counted sets above. Certifications in {EXPIRED, REVOKED, RENEWED} contribute nothing to protection. Slicers in {CLEAN, IN_USE, SANITIZING} contribute nothing."
    constants:
      BASE: 100
      CERT_WEIGHT: 12
      FISCAL_WEIGHT: 6
      SLICER_WEIGHT: 4
      PROTECTION_FLOOR: 0
    precision: "integer; the clamp is applied before diffusion_index is derived"
    variants: []

  - name: store_deli_posture
    trigger: "any change to protection_index, certified_slicer_operator_count, case_on_hand_lbs, active_price_file_id, or haccp_safety_flag"
    algorithm: constraint_propagation
    formula: |
      # predicates are evaluated against the CLAMPED protection_index
      if certified_slicer_operator_count == 0 or haccp_safety_flag == true:
          posture = HALT
          posture_reason = CERTIFICATION_TRIGGERED
      else if posture_gate_flag == true:
          posture = HALT
          posture_reason = POSTURE_GATE_TRIGGERED
      else if (case_on_hand_lbs > deli_case_capacity_lbs
               or protection_index <= 30
               or active_price_file_id is null):
          posture = RESTRICTED
          posture_reason = INVENTORY_TRIGGERED     if case_on_hand_lbs > deli_case_capacity_lbs
          posture_reason = REVOCATION_TRIGGERED    if protection_index <= 30
          posture_reason = NO_ACTIVE_PRICE_FILE    if active_price_file_id is null
      else:
          posture = OPEN
          posture_reason = OK
    input_set: "the store's own derived counters (see diffusion_index) plus case_on_hand_lbs, deli_case_capacity_lbs, active_price_file_id, haccp_safety_flag, and certified_slicer_operator_count. No per-batch or per-ticket detail enters."
    constants:
      PROTECTION_RESTRICTED_AT_OR_BELOW: 30
    precision: "exact integer comparison; the posture predicate uses <= (RESTRICTED at exactly 30, OPEN at 31)"
    variants: []

  - name: hold_window_state
    trigger: "evaluated on every mark-down and discard request, and swept by POST /deli/run-production-day"
    algorithm: interval_merge
    formula: |
      window   = [produced_at, produced_at + deli_item.case_life_minutes)    # half-open
      t        = logical clock
      if t < produced_at:
          state = PENDING
      else if t < produced_at + deli_item.case_life_minutes - deli_item.markdown_window_minutes:
          state = HOLDING
      else if t < produced_at + deli_item.case_life_minutes:
          state = MARKDOWN_WINDOW
      else:
          state = EXPIRED

      markdown_allowed = state in {HOLDING, MARKDOWN_WINDOW}
      discard_allowed  = state == EXPIRED
    input_set: "the batch's produced_at and hold_status, and the deli_item's case_life_minutes and markdown_window_minutes. Batches whose hold_status is already DISCARDED are excluded."
    constants:
      HALF_OPEN_SEMANTICS: "expiry instant itself is EXPIRED, not MARKDOWN_WINDOW"
    precision: "exact minute arithmetic on the logical clock"
    variants: []

  - name: sanitation_cycle_due
    trigger: "POST /deli/sanitation-cycles"
    algorithm: threshold
    formula: |
      if cycle_type == ROUTINE:
          due = (cuts_since_sanitation >= slicer.sanitation_cycle_limit)
      if cycle_type == TIMED:
          due = (in_use_minutes >= slicer.sanitation_cycle_limit * TIMED_MULTIPLIER)
      if cycle_type == ALLERGEN_CHANGEOVER:
          due = true          # always permitted when the allergen sets diverge
      if not due and cycle_type != ALLERGEN_CHANGEOVER:
          reject ERR_SANITATION_CYCLE_NOT_DUE
    input_set: "the slicer's cuts_since_sanitation, in_use_minutes and sanitation_cycle_limit, plus the requested cycle_type. cuts_since_sanitation is incremented on every production-batch completion by ceil(produced_lbs / CUTS_PER_BATCH_DIVISOR), and by nothing else."
    constants:
      TIMED_MULTIPLIER: 3
      CUTS_PER_BATCH_DIVISOR: 5
    precision: "inclusive >= at the threshold — a slicer at exactly the limit IS due"
    variants: []

  - name: price_file_resolution
    trigger: "any Label-generating request, POST /deli/price-files/{priceFileId}/activate, and GET /deli/active-price-file"
    algorithm: threshold
    formula: |
      candidate_set = { f in ScalePriceFile :
                        f.store_id == store.id
                        and f.status == ACTIVE
                        and f.effective_from <= logical clock < f.effective_to }
      ranking       = f.effective_from DESC
      tie_break     = f.activated_at DESC, then f.created_at ASC
      winner        = first element of candidate_set sorted by (ranking, tie_break)
      if candidate_set is empty:
          store.active_price_file_id = null
          every Label-generating call returns ERR_PRICE_FILE_STALE (409)
          store_deli_posture reason becomes NO_ACTIVE_PRICE_FILE
    input_set: "ACTIVE ScalePriceFile rows for this store whose half-open interval contains the logical clock. PENDING and SUPERSEDED rows are excluded from the candidate set entirely."
    constants:
      INTERVAL_SEMANTICS: "effective_from inclusive, effective_to exclusive"
    precision: "datetime comparison"
    variants: []

  - name: sub_queue_order
    trigger: "POST /deli/sub-tickets, .../ticket, .../complete, .../pickup, .../abandon, and GET /deli/sub-queue"
    algorithm: topological
    formula: |
      gate_ok(t) = (t.fulfillment_status in {TICKETED, IN_PROGRESS}) and (t.bread_status == QUEUED)

      ordered = [ t for t in SubTicket where t.store_id == store.id and gate_ok(t) ]
                sorted by (t.promised_at ASC, t.creation_sequence ASC)

      queue_position(ticket) = 1-based index of ticket in `ordered`, or 0 when gate_ok(ticket) is false
      queue_depth(store)     = len(ordered)          # 0 for an empty eligible set
    input_set: "non-terminal tickets of this store in the two gate-eligible status combinations. Tickets in {QUEUED, COMPLETED, PICKED_UP, REMADE, ABANDONED} and every ticket with bread_status == BREAD_HOLD carry queue_position 0."
    constants:
      ORDER_KEY_1: "promised_at ASC"
      TIE_BREAK: "creation_sequence ASC"
      EMPTY_SET_FALLBACK: "queue_depth = 0"
    precision: "integer rank"
    variants: []

  - name: promised_time_sla
    trigger: "POST /deli/sub-tickets/{ticketId}/ticket and every recomputation of queue_position"
    algorithm: chronological
    formula: |
      prep_minutes  = MINUTES_PER_REQUIRED_BATCH * (count of distinct production batches the ticket's lines require)
                      + ceil(weight_lbs / HALF_LB_UNIT) * MINUTES_PER_HALF_LB
      promised_at   = logical clock at ticketing + prep_minutes minutes
      lateness_minutes = max(0, floor((completed_at - promised_at).total_seconds() / 60))   # only once completed_at exists

      slip_ok(ticket, T) = lateness_minutes(ticket) <= T
      slip_stamp(store, T) = true iff every ticket in the store with fulfillment_status == COMPLETED
                             satisfies slip_ok(ticket, T)
    input_set: "the ticket's own lines and weight; COMPLETED tickets only for the store-level stamp. Tickets in PICKED_UP keep their recorded lateness_minutes and still constrain the stamp."
    constants:
      MINUTES_PER_REQUIRED_BATCH: 12
      MINUTES_PER_HALF_LB: 1
    precision: "integer minutes, floor, clamped at 0"
    variants: []

  - name: catering_platter_quote
    trigger: "POST /deli/catering-orders and POST /deli/catering-orders/{orderId}/confirm"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is pinned: pick the tier from the UNADJUSTED platter count,
      # compute base_total from the tier rate, apply the percentage adjustment, and
      # only then add the flat rush fee.
      base_per_platter_cents = TIER_1_RATE_CENTS if platter_count < TIER_2_MIN
                             = TIER_2_RATE_CENTS if TIER_2_MIN <= platter_count <= TIER_2_MAX
                             = TIER_3_RATE_CENTS if platter_count > TIER_2_MAX

      associate_adjustment_pct = CERTIFIED_ADJUSTMENT_PCT if (lead_time_hours < RUSH_LIMIT_HOURS
                                           and certified_planner_associate_id holds an ACTIVE FOOD_HANDLING Certification)
                               = 0.0 otherwise

      base_total_cents  = platter_count * base_per_platter_cents
      service_fee_cents = round_half_up(base_total_cents * associate_adjustment_pct, 0)
      rush_cents        = RUSH_FEE_CENTS if lead_time_hours < RUSH_LIMIT_HOURS else 0
      quote_total_cents = base_total_cents + service_fee_cents + rush_cents
    input_set: "the order's platter_count, lead_time_hours, and whether the named planner holds an ACTIVE FOOD_HANDLING certification. Cancelled orders are excluded from recomputation."
    constants:
      TIER_1_RATE_CENTS: 1800
      TIER_2_RATE_CENTS: 1650
      TIER_3_RATE_CENTS: 1500
      TIER_2_MIN: 3
      TIER_2_MAX: 6
      RUSH_LIMIT_HOURS: 24
      RUSH_FEE_CENTS: 2600
      CERTIFIED_ADJUSTMENT_PCT: -0.05
    precision: "round_half_up to 0 decimal places, applied only to service_fee_cents"
    variants: []

  - name: waste_markdown_liability
    trigger: "POST /deli/waste-records/{wasteRecordId}/discard"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is pinned; the tier base reads a value this calculation
      # itself produces for EARLIER records, so the order removes the circularity.
      step 1: value_cents = round_half_up(discard_lbs * deli_item.unit_cost_cents, 0)

      step 2: prior_verified_cents = sum(w.total_liability_cents
                                         for w in WasteRecord
                                         where w.store_id == store.id
                                           and w.id != waste.id
                                           and (w.status == VERIFIED or w.status in {DISCARDED, MARKED_DOWN})
                                           and w.created_at < waste.created_at)
              # ordered by w.created_at ASC; w.created_at == waste.created_at is EXCLUDED

      step 3: discounted_base_cents = round_half_up(DISCOUNTED_BASE_RATE * value_cents
                                                     + PRIOR_TIER_RATE * prior_verified_cents, 0)

      step 4: handling_fee_cents = FEE_TIER_1_CENTS if discounted_base_cents < TIER_1_MAX_EXCLUSIVE_CENTS
                                 = FEE_TIER_2_CENTS if discounted_base_cents < TIER_2_MAX_EXCLUSIVE_CENTS
                                 = FEE_TIER_3_CENTS otherwise

      step 5: total_liability_cents = value_cents + handling_fee_cents

      markdown_cents = round_half_up(markdown_sold_lbs * deli_item.retail_price_per_lb_cents, 0)
    input_set: "this WasteRecord plus every other WasteRecord of the same store with created_at strictly before this record's created_at. Rows with reason == UNCLAIMED_PLATTER are excluded from step 2."
    constants:
      DISCOUNTED_BASE_RATE: 0.70
      PRIOR_TIER_RATE: 0.30
      TIER_1_MAX_EXCLUSIVE_CENTS: 5000
      TIER_2_MAX_EXCLUSIVE_CENTS: 15000
      FEE_TIER_1_CENTS: 0
      FEE_TIER_2_CENTS: 250
      FEE_TIER_3_CENTS: 600
    precision: "round_half_up to 0 decimal places at steps 1 and 3; no rounding at steps 4 and 5"
    variants: []

  - name: store_waste_liability
    trigger: "POST /deli/waste-records/{wasteRecordId}/discard and .../verify"
    algorithm: aggregation
    formula: |
      input_set = { w in WasteRecord :
                    w.store_id == store.id
                    and w.status in {DISCARDED, VERIFIED}
                    and w.created_at < logical clock          # created_at == clock is EXCLUDED
                    and w.reason != UNCLAIMED_PLATTER }
      store_waste_liability_cents = sum(w.total_liability_cents for w in input_set)

      verified_waste_liability_cents = sum(w.total_liability_cents
                                           for w in input_set where w.status == VERIFIED)
    input_set: "see the predicate above. DRAFT and VOIDED rows contribute nothing; unclaimed-platter waste is excluded so that a cancelled catering order never inflates the deli waste liability."
    constants:
      WINDOW: "created_at < logical clock, exclusive"
      TIE_BREAK: "not order-sensitive (sum)"
    precision: "integer cents"
    variants: []

  - name: bread_forecast_coverage
    trigger: "POST /deli/bread-supply-orders (creation), .../submit, .../confirm, .../deliver, and every ticket ticketing, abandonment, completion or pickup"
    algorithm: aggregation
    formula: |
      units_reserved = count of SubTicket rows in this store whose bread_deli_item_id == order.bread_deli_item_id
                       and whose fulfillment_status in {TICKETED, IN_PROGRESS}
      units_short    = max(0, required_units - committed_units) + max(0, units_reserved - committed_units)
      DEGRADED       iff units_short > 0
      back to ACTIVE iff units_short == 0
    input_set: "only the TICKETED and IN_PROGRESS tickets of the same store for this bread item. Tickets in {QUEUED, COMPLETED, PICKED_UP, REMADE, ABANDONED} reserve nothing — a COMPLETED ticket has already consumed its roll."
    constants:
      RESERVING_STATUSES: "{TICKETED, IN_PROGRESS}"
    precision: "integer counts"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority — lower fires first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is known"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc and POST /_payments/simulate"

  - priority: 2
    category: auth
    check: "The role is on the endpoint's roles: list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "The Store in the path exists and its store_id matches the child's store_id (validated left-to-right in the path)"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "every /deli/stores/{storeId}/... endpoint"

  - priority: 4
    category: existence
    check: "The addressed resource exists under that store"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "The resource is in the state the operation requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "A FIFO, half-open pickup-window lockout is active for this store (a catering order past its pickup_window_end but short of PICKED_UP)"
    error_id: ERR_HACCP_WINDOW_FREEZE
    http_status: 409
    applies_to: "POST .../sub-tickets, .../ticket, .../production-batches, .../start, .../production-batches/{batchId}/complete"

  - priority: 7
    category: business_safety
    check: "The store's haccp_safety_flag is true"
    error_id: ERR_HACCP_HOLD
    http_status: 409
    applies_to: "all write endpoints for the store"

  - priority: 8
    category: business_safety
    check: "store.posture == HALT; every fresh work item in the store is blocked"
    error_id: ERR_POSTURE_HALT
    http_status: 409
    applies_to: "POST /deli/sub-tickets, .../production-batches"

  - priority: 9
    category: business_fiscal
    check: "store.pending_waste_verification_count < 3; a fourth unverified waste row blocks new production"
    error_id: ERR_UNVERIFIED_WASTE_BACKLOG
    http_status: 409
    applies_to: "POST .../production-batches, POST .../production-batches/{batchId}/start"

  - priority: 10
    category: business_safety
    check: "store.posture == RESTRICTED (new production-batch creation only; sub-ticket creation is NOT blocked by RESTRICTED)"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /deli/production-batches"

  - priority: 11
    category: business_safety
    check: "The assigned operator holds an ACTIVE SLICER_OPERATION Certification whose expires_at is strictly after the logical clock"
    error_id: ERR_ASSOCIATE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST .../production-batches/{batchId}/start, POST .../catering-orders/{orderId}/confirm, POST .../waste-records/{wasteRecordId}/verify, POST .../sanitation-cycles/{cycleId}/complete"

  - priority: 12
    category: business_safety
    check: "Allergen changeover: the slicer's last allergen set must be cleared by an ALLERGEN_CHANGEOVER sanitation cycle before it can slice an item whose allergen set diverges"
    error_id: ERR_ALLERGEN_CHANGEOVER_REQUIRED
    http_status: 409
    applies_to: "POST .../production-batches/{batchId}/start"

  - priority: 13
    category: business_temporal
    check: "The slicer is not already committed in the same half-open interval required by this operation"
    error_id: ERR_SLICER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../production-batches/{batchId}/start, POST .../slicers/{slicerId}/sanitation-cycles"

  - priority: 14
    category: business_constraint
    check: "The slicer's sanitation_status is CLEAN, or NEEDS_SANITATION with the cycle now due; a slicer still SANITIZING cannot be claimed"
    error_id: ERR_SLICER_NOT_SANITIZED
    http_status: 409
    applies_to: "POST .../production-batches/{batchId}/start"

  - priority: 15
    category: business_safety
    check: "A slicer-required item must name a slicer_id"
    error_id: ERR_SLICER_REQUIRED
    http_status: 400
    applies_to: "POST .../production-batches, POST .../production-batches/{batchId}/start"

  - priority: 16
    category: business_safety
    check: "At least one Associate in the store holds an ACTIVE SLICER_OPERATION Certification at ticketing time"
    error_id: ERR_NO_CERTIFIED_STAFF
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/ticket"

  - priority: 17
    category: business_constraint
    check: "At least one CLEAN slicer exists in the store for a slicer-required line"
    error_id: ERR_NO_CLEAN_SLICER
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/ticket"

  - priority: 18
    category: business_constraint
    check: "Allergen coverage: the completing associate's allergy_set must be a superset of every line's deli_item.allergen_flags"
    error_id: ERR_ALLERGY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/complete"

  - priority: 19
    category: business_constraint
    check: "store.case_on_hand_lbs is sufficient for every line's required weight"
    error_id: ERR_SHELF_OUT
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/complete"

  - priority: 20
    category: business_fiscal
    check: "The resolved ACTIVE scale price file's half-open interval contains the logical clock and its item price set covers every line's item"
    error_id: ERR_PRICE_FILE_STALE
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/complete, POST .../sub-tickets/{ticketId}/pickup, POST .../catering-orders/{orderId}/mark-ready"

  - priority: 21
    category: business_fiscal
    check: "The existing Label for this ticket is still ISSUED; a voided label forces the ticket to REMADE first"
    error_id: ERR_LABEL_STALE
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/pickup"

  - priority: 22
    category: business_constraint
    check: "Bread supply: the ticket's bread item must be available; a ticket in bread_status=BREAD_HOLD cannot be ticketed or completed"
    error_id: ERR_BREAD_UNAVAILABLE
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/ticket, POST .../sub-tickets/{ticketId}/complete"

  - priority: 23
    category: business_temporal
    check: "Pickup must occur strictly inside [pickup_window_start, pickup_window_end); at or after pickup_window_end the pickup window is closed"
    error_id: ERR_PICKUP_WINDOW_MISSED
    http_status: 409
    applies_to: "POST .../catering-orders/{orderId}/pickup"

  - priority: 24
    category: business_fiscal
    check: "Catering lead time: clock + lead_time_hours <= pickup_window_start, and lead_time_hours >= 24 unless the planner is certified"
    error_id: ERR_LEAD_TIME_VIOLATED
    http_status: 409
    applies_to: "POST .../catering-orders, POST .../catering-orders/{orderId}/confirm, POST .../bread-supply-orders/{breadOrderId}/submit"

  - priority: 25
    category: business_constraint
    check: "The pickup-window aggregate capacity: the sum of headcount over catering orders sharing a pickup_bucket_key must stay within BUCKET_HEADCOUNT_LIMIT = 40, where the bucket key is truncate_to_quarter_hour(pickup_window_start - 10 minutes) (aggregate validation — each order passes alone, the collection fails)"
    error_id: ERR_PICKUP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST .../catering-orders/{orderId}/confirm, POST .../catering-orders/{orderId}/revise"

  - priority: 26
    category: business_temporal
    check: "The requested price file must not overlap an already-ACTIVE file for the same store on half-open intervals, except in the re-price shape where this file's effective_from is strictly later than the incumbent's while effective_to is identical (a mid-window re-price legitimately supersedes the incumbent). Abutting intervals (incumbent effective_to == new effective_from) are always permitted."
    error_id: ERR_PRICE_FILE_OVERLAP
    http_status: 409
    applies_to: "POST .../price-files/{priceFileId}/activate"

  - priority: 27
    category: business_referential
    check: "A price file with ISSUED labels cannot be withdrawn; the associated promotion must be CANCELLED first"
    error_id: ERR_PRICE_FILE_IN_USE
    http_status: 409
    applies_to: "POST .../price-files/{priceFileId}/retract"

  - priority: 28
    category: business_temporal
    check: "The promotion week has not begun for the requested price-file withdrawal and the promotion is still CANCELLED-gated"
    error_id: ERR_PROMO_STATE_BLOCKS_FILE_WITHDRAWAL
    http_status: 409
    applies_to: "POST .../price-files/{priceFileId}/retract"

  - priority: 29
    category: business_constraint
    check: "Markdown before discard: a batch's markdown window must be open, and no second OPEN WasteRecord may exist for the same batch"
    error_id: ERR_MARKDOWN_REQUIRED_BEFORE_DISCARD
    http_status: 409
    applies_to: "POST /deli/waste-records/{wasteRecordId}/discard, POST /deli/waste-records/{wasteRecordId}/mark-down"

  - priority: 30
    category: business_temporal
    check: "The markdown window is half-open [produced_at + case_life_minutes - markdown_window_minutes, held_expires_at); at or after hold_expires_at markdown is closed"
    error_id: ERR_MARKDOWN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST .../production-batches/{batchId}/mark-down, POST .../waste-records/{wasteRecordId}/mark-down"

  - priority: 31
    category: business_constraint
    check: "Segregation of duties: the verifier must differ from the producer; the markdown associate must differ from the producer and from the verifier"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST .../waste-records/{wasteRecordId}/verify, POST .../waste-records/{wasteRecordId}/mark-down"

  - priority: 32
    category: business_constraint
    check: "Ticket line count must be >= 1 and every half_lb_units >= 1; empty tickets are rejected"
    error_id: ERR_EMPTY_CART
    http_status: 400
    applies_to: "POST .../sub-tickets"

  - priority: 33
    category: business_constraint
    check: "A sanitation cycle cannot be opened before it is due; the ROUTINE threshold is inclusive (cuts_since_sanitation >= sanitation_cycle_limit)"
    error_id: ERR_SANITATION_CYCLE_NOT_DUE
    http_status: 409
    applies_to: "POST .../slicers/{slicerId}/sanitation-cycles"

  - priority: 34
    category: business_constraint
    check: "A sanitation cycle cannot be completed before its cycle_minutes have elapsed"
    error_id: ERR_CYCLE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST .../sanitation-cycles/{cycleId}/complete"

  - priority: 35
    category: business_constraint
    check: "A slicer may be reopened at most twice per production day"
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST .../sanitation-cycles/{cycleId}/reopen"

  - priority: 36
    category: business_constraint
    check: "The scale-locked label weight must be > 0 and <= 10 lbs"
    error_id: ERR_LABEL_WEIGHT_EXCEEDED
    http_status: 400
    applies_to: "POST .../labels"

  - priority: 37
    category: business_constraint
    check: "request_id must be unique across the store; a repeated request_id is a replayed request rather than a new one (check ordering note: this existence check fires before the deeper state checks, so a replay never surfaces a state error)"
    error_id: ERR_DUPLICATE_REQUEST
    http_status: 409
    applies_to: "POST /deli/catering-orders"

  - priority: 38
    category: business_fiscal
    check: "OCC: the client's expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../production-batches/{batchId}/start, .../waste-records/{wasteRecordId}/verify, .../bread-supply-orders/{breadOrderId}/confirm"

  - priority: 39
    category: business_safety
    check: "Every prior COMPLETED ticket in the same store must have lateness_minutes == 0; on the store's first completion the check passes vacuously (the empty set is the pass case, and the store's newest completed lateness is read as 0)"
    error_id: ERR_NO_COMPLETED_TICKET_YET
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/complete"

  - priority: 40
    category: business_constraint
    check: "Slip-lock: once a ticket has completed late by T minutes, every later ticket in that store must complete within T minutes of its own promised_at"
    error_id: ERR_SLIP_LOCK_VIOLATED
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/complete"

  - priority: 41
    category: business_constraint
    check: "A SubTicket cannot be ticketed while its store's eligible queue already holds >= 8 gate-eligible tickets (the queue-depth gate counts only TICKETED and IN_PROGRESS tickets in the same store)"
    error_id: ERR_QUEUE_DEPTH_BREACH
    http_status: 409
    applies_to: "POST .../sub-tickets/{ticketId}/ticket"

  - priority: 42
    category: business_constraint
    check: "Every line's deli_item_id must exist and be ACTIVE; DISCONTINUED items are rejected"
    error_id: ERR_DELI_ITEM_UNAVAILABLE
    http_status: 409
    applies_to: "POST .../sub-tickets, POST .../production-batches"
# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# Topology is FLAT: every collection is addressed at /deli/<collection>/... with
# FK fields in the body and `<fk_field>?` query filters on the list endpoints.
# Store-scoped stores are addressed by the required `store_id?` filter instead
# of a nested path, which is what makes every FK reverse-reachable from §1.5.
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:

  # --- logical clock and payment simulation (test-driving endpoints, §1.5 rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server starts at the fixed default 2026-09-01T00:00:00Z and never falls back to wall-clock time; every deadline, expiry, markdown window and pickup window is computed against this value."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["Every derived window is re-evaluated on the next read; expired Certifications move to EXPIRED and posture is recomputed on the next posture read."]

  - method: POST
    path: "/_rbac/role-permissions"
    description: "Replace the permission list attached to a role for this installation (attribute-based RBAC control used to test denial paths). The acting role's entry is the authoritative permission set for authorization checks."
    roles: [PlatformAdmin]
    code: 200
    input: [role, permissions]
    output: { role: string, permissions: array, active_role_count: integer }
    side_effects:
      - "the role's permissions are replaced, so endpoints whose required permission is absent now return ERR_UNAUTHORIZED for that role"
      - "active_role_count reflects the number of roles with a non-empty permission list"

  - method: POST
    path: "/_payments/simulate"
    description: "Simulate the external payment outcome for a catering deposit."
    roles: [PlatformAdmin]
    code: 200
    input: [catering_order_id, outcome]
    output: { catering_order_id: string, outcome: string }
    side_effects: ["Records the simulated payment outcome; no state transition."]

  # --- Store ---
  - method: POST
    path: "/deli/stores"
    description: "Create a store"
    roles: [PlatformAdmin, DeliManager]
    code: 201
    input: [store_number, name, deli_case_capacity_lbs, hot_bar_capacity_lbs, sub_station_count, "haccp_safety_flag?"]
    output: Store
    side_effects: ["posture=OPEN, posture_reason=OK, case_on_hand_lbs=0, ops_run_index=0", "version=1"]

  - method: GET
    path: "/deli/stores/{id}"
    description: "Get a store"
    roles: [PlatformAdmin, DeliManager, DeliClerk, BakeryCoordinator, ScaleOperator]
