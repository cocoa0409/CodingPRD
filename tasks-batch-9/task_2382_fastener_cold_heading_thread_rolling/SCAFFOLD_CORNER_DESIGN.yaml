              as: ProcessEngineer
              captures: { tool_err: $.data.error_id }
            - call: "POST /production-lots"
              payload: { lot_code: "L-OK", part_spec_id: "${spec_id}", wire_lot_id: "${wire_big}", heading_tool_id: "${tool_id}", press_code: "PRESS-7", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T10:00:00Z", planned_pieces: 900, expected_wire_lot_version: "${big_v}" }
              as: ProcessEngineer
              captures: { lot_ok: $.data.id }
          assert:
            - "L-BOTH returns 422 ERR_WIRE_MASS_INSUFFICIENT: required_kg 105.000 exceeds available 100.000, and the die also lacks life for ceil(5000 * 1.05) == 5250 pieces"
            - "L-TOOL returns 422 ERR_TOOL_LIFE_EXHAUSTED: the 500.0 kg lot covers 105.000 kg but remaining die life is 1000 < 5250"
            - "WireLot.${wire_small} keeps available_mass_kg 100.000 / reserved 0.000 at version 2, and WireLot.${wire_big} keeps available 500.000 / reserved 0.000 at version 2 — neither refusal touched a ledger"
            - "L-OK returns 201: required_kg 18.900 (900 * 20.0 * 1.05 / 1000) and ceil(945) == 945 <= 1000, so wire_reserved_kg is 18.900 and WireLot.${wire_big} moves to available 481.100 / reserved 18.900 at version 3"
            - "The two refused lot codes L-BOTH and L-TOOL do not appear in GET /production-lots (total_count 1)"

      - name: tool_transition_guards_reject_every_out_of_order_verb
        claim_type: Error triggerable
        grounds:
          - errors[ERR_INVALID_TOOL_STATE]
          - validations[priority=10, error_id=ERR_INVALID_TOOL_STATE]
          - calculations.tool_effective_life
        distinguishing_aspect: >
          Mount needs AVAILABLE, condemn needs MOUNTED and regrind needs WORN, so five out-of-order verbs
          all answer ERR_INVALID_TOOL_STATE; the one legal regrind then recomputes the life budgets from a
          zero-piece closed cycle — rated_derated 102000 but observed_avg 0.00, which drives
          conservative_life_pieces to 0 and would starve any aerospace lot on this die.
        test_recipe:
          setup:
            - "Die DIE-4S-002 registered with rated_life_pieces 120000 and the default max_regrinds 3, status AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-002", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
          trigger:
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
              captures: { regrind_available_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CHIPPED_STATION_2" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { condemn_available_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-5" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-6" }
              as: ProcessEngineer
              captures: { remount_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
              captures: { regrind_mounted_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CHIPPED_STATION_2" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CRACKED_STATION_3" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { recondemn_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-5" }
              as: ProcessEngineer
              captures: { mount_worn_err: $.data.error_id }
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
              captures: { regrind_repeat_err: $.data.error_id }
          assert:
            - "regrind and condemn on the AVAILABLE die both return 409 ERR_INVALID_TOOL_STATE with version still 1"
            - "The first mount returns 200 with status MOUNTED and mounted_press_code PRESS-5; the second mount returns 409 ERR_INVALID_TOOL_STATE and mounted_press_code stays PRESS-5"
            - "regrind on the MOUNTED die returns 409 ERR_INVALID_TOOL_STATE"
            - "condemn returns 200 with status WORN and condemn_reason CHIPPED_STATION_2; the second condemn returns 409 and condemn_reason is unchanged"
            - "mount on the WORN die returns 409 ERR_INVALID_TOOL_STATE"
            - "The regrind returns 200: status AVAILABLE, regrind_count 1, cycle_pieces_history [0], cumulative_pieces_current_cycle 0, rated_derated_life_pieces 102000 (floor(120000 * 0.85)), observed_avg_cycle_pieces 0.00 and conservative_life_pieces 0"
            - "The immediate second regrind returns 409 ERR_INVALID_TOOL_STATE — the die is AVAILABLE again, not WORN"

      - name: bake_window_and_capacity_and_ceiling_errors
        claim_type: Error triggerable
        excluded_because:
          difficulty_instance: relief_bake_delay_exactly_four_hours_passes_one_minute_later_fails
          rationale: >
            ERR_HE_BAKE_WINDOW_MISSED, ERR_FURNACE_CAPACITY_EXCEEDED, ERR_LOT_ON_HOLD and
            ERR_RISK_SCORE_TOO_HIGH are each triggered inside §1.8 instances that pin their boundary or
            their priority interaction (the 4.000 h bake window, the hold-versus-capacity ordering and the
            segregation-versus-ceiling ordering), so a plain triggerability corner adds nothing.

  - section: rbac
    instances:
      - name: plant_admin_registers_master_data_but_cannot_operate_the_process
        claim_type: Role boundary
        grounds:
          - rbac[PlantAdmin]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=2]
        distinguishing_aspect: >
          PlantAdmin holds no exclusive operation at all: it registers and revises master data and reads
          everything, yet release, mount, lot creation, destructive testing and packing each answer 403
          ERR_ROLE_NOT_PERMITTED — and the refusal lands at priority 2, before any state or referential
          check on the lot it aimed at.
        test_recipe:
          setup:
            - "PlantAdmin registers the part spec, heat, wire lot, die and furnace; the inspector verifies and releases the wire; the engineer mounts the die and opens lot L-RB01 (SETUP)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
