# =============================================================================
# SCAFFOLD.yaml — Conservation Program Cost-Share (NRCS/EQIP-style)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files per skill spec.
# =============================================================================

scenario: |
  Conservation Program Cost-Share (NRCS/EQIP): applicant ranking & pool funding,
  practice selection & payment schedule rate, contract obligation & implementation
  deadline, practice certification & spot check, payment request & documentation,
  contract modification & extension, historically-underserved advance payment,
  lifespan maintenance obligation

domain_name: eqip-cost-share
api_prefix: /eqip

complexity_profile:
  primary_archetype: quota / allocation          # finite funding pools: obligated, paid, released, restored
  secondary_archetype: compliance / audit        # spot checks, segregation of duties, lifespan maintenance recoupment
  complexity_layers:
    - optimistic_concurrency                     # OCC on Contract.version and ContractPracticeItem.version
    - cascading_side_effects                     # spot-check failure cascade depth 4; termination cascade depth 3
    - dual_variant_calculation                   # provisional vs verified ranking; scheduled vs certified payment
    - rate_threshold_triggers                    # advance 50% cap, 90-day expenditure clock, spot-check modulus
  entity_topology: hybrid                        # program-scoped config tree + flat cross-aggregate FK web
  state_machine_shape: compound                  # contract/item/payment machines interlock; contract + obligation cyclic, item parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # certifier != payment approver != spot-checker; reporter != confirmer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ConservationProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Program display name" }
      - { name: fiscal_year, type: integer, source: input, description: "Federal fiscal year, e.g. 2026" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; application-window overlap is enforced per state_code" }
      - { name: window_start, type: datetime, source: input, description: "Application window open instant (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Application window close instant (inclusive; submissions accepted at exactly window_end)" }
      - { name: spot_check_modulus, type: integer, source: input, default: 5, description: "Every Nth payment request per program (by sequence_number) is sampled for mandatory spot check" }
      - { name: advance_cap_pct, type: number, source: input, default: 0.5, description: "Fraction of a practice item's scheduled_amount_cents issuable as HU advance (0 < pct <= 1)" }
      - { name: status, type: enum, source: system, description: "SETUP -> OPEN -> CLOSED; sweep auto-closes OPEN programs when clock > window_end", constraints: "SETUP|OPEN|CLOSED" }
      - { name: ranking_run_count, type: integer, source: system, default: 0, description: "Number of completed ranking runs; run-ranking allowed only while 0" }

  - name: FundingPool
    parent: ConservationProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ConservationProgram.id" }
      - { name: pool_type, type: enum, source: input, description: "GENERAL | HU_BEGINNING_FARMER | HU_SOCIALLY_DISADVANTAGED | HU_LIMITED_RESOURCE | HU_VETERAN", constraints: "GENERAL|HU_BEGINNING_FARMER|HU_SOCIALLY_DISADVANTAGED|HU_LIMITED_RESOURCE|HU_VETERAN" }
      - { name: allocated_cents, type: integer, source: input, description: "Appropriated amount; >= 1" }
      - { name: obligated_cents, type: integer, source: computed, default: 0, description: "Sum reserved by DRAFT-obligated contracts and not yet disbursed or released" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Net cash disbursed (advances + disbursements - applicant repayments)" }
      - { name: available_cents, type: integer, source: computed, description: "= allocated_cents - obligated_cents - paid_cents; invariant: allocated == available + obligated + paid at all times" }

  - name: PaymentScheduleRate
    parent: ConservationProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ConservationProgram.id" }
      - { name: practice_code, type: enum, source: input, description: "COVER_CROP | PRESCRIBED_GRAZING | WATERING_FACILITY | FENCE | NUTRIENT_MANAGEMENT; unique per program", constraints: "COVER_CROP|PRESCRIBED_GRAZING|WATERING_FACILITY|FENCE|NUTRIENT_MANAGEMENT" }
      - { name: unit, type: enum, source: input, description: "ACRE | FOOT | EACH", constraints: "ACRE|FOOT|EACH" }
      - { name: standard_rate_cents, type: integer, source: input, description: "Rate per unit for non-HU applicants; >= 1" }
      - { name: hu_rate_cents, type: integer, source: input, description: "Rate per unit for historically-underserved applicants; >= standard_rate_cents" }
      - { name: lifespan_years, type: integer, source: input, description: "Practice lifespan; maintenance obligation end = certified_at + lifespan_years * 365 days; >= 1" }

  - name: RankingCriterion
    parent: ConservationProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ConservationProgram.id" }
      - { name: criterion_code, type: string, source: input, description: "Factor code, unique per program" }
      - { name: weight, type: number, source: input, description: "Multiplier applied to points; > 0" }
      - { name: max_points, type: integer, source: input, description: "Points cap for this criterion; >= 1" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Producer legal name" }
      - { name: hu_category, type: enum, source: input, default: "NONE", description: "NONE | BEGINNING_FARMER | SOCIALLY_DISADVANTAGED | LIMITED_RESOURCE | VETERAN", constraints: "NONE|BEGINNING_FARMER|SOCIALLY_DISADVANTAGED|LIMITED_RESOURCE|VETERAN" }
      - { name: historically_underserved, type: boolean, source: computed, description: "= (hu_category != NONE); drives HU payment rate and advance-payment eligibility" }
      - { name: parcel_ids, type: array, source: input, description: "Land parcel identifiers the applicant controls; applications must reference one of these" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ConservationProgram.id" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; must equal X-User-ID when role is Applicant" }
      - { name: parcel_id, type: string, source: input, description: "Parcel the practices apply to; must be an element of applicant.parcel_ids" }
      - { name: planned_practices, type: array, source: input, description: "[{practice_code, quantity}]; non-empty; each code must have a PaymentScheduleRate in the program" }
      - { name: self_reported_answers, type: object, source: input, description: "{criterion_code: points}; points clamped to [0, max_points] of the criterion; unknown codes rejected" }
      - { name: verified_answers, type: object, source: system, description: "Planner-verified {criterion_code: points} recorded at screening" }
      - { name: provisional_score, type: number, source: computed, description: "ranking_score formula over self_reported_answers, computed at submit" }
      - { name: ranking_score, type: number, source: computed, description: "ranking_score formula over verified_answers, computed at screening; basis of run-ranking selection" }
      - { name: estimated_obligation_cents, type: integer, source: computed, description: "Sum over planned_practices of round_half_up(quantity * applicable rate); applicable rate = hu_rate_cents iff applicant.historically_underserved" }
      - { name: funded_pool_id, type: string, source: system, description: "FK -> FundingPool.id; nullable; pool assigned by run-ranking waterfall" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> SCREENED_IN -> SELECTED -> CONTRACTED -> OBLIGATED; branches: SCREENED_OUT, NOT_SELECTED, WITHDRAWN", constraints: "DRAFT|SUBMITTED|SCREENED_IN|SCREENED_OUT|SELECTED|NOT_SELECTED|CONTRACTED|OBLIGATED|WITHDRAWN" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ConservationProgram.id; copied from application" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; one contract per application" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; copied from application" }
      - { name: pool_id, type: string, source: system, description: "FK -> FundingPool.id; copied from application.funded_pool_id" }
      - { name: obligated_amount_cents, type: integer, source: computed, description: "Sum of items' scheduled_amount_cents (per-item rounding pinned by obligated_amount calculation)" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Sum of computed_amount_cents over this contract's DISBURSED payment requests" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OBLIGATED <-> MODIFICATION_PENDING cycle -> COMPLETED | TERMINATED", constraints: "DRAFT|OBLIGATED|MODIFICATION_PENDING|COMPLETED|TERMINATED" }

  - name: ContractPracticeItem
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: payment_schedule_rate_id, type: string, source: system, description: "FK -> PaymentScheduleRate.id; resolved from practice_code at creation" }
      - { name: practice_code, type: enum, source: input, description: "Practice code; for contracts in DRAFT it must appear in the source application's planned_practices", constraints: "COVER_CROP|PRESCRIBED_GRAZING|WATERING_FACILITY|FENCE|NUTRIENT_MANAGEMENT" }
      - { name: planned_quantity, type: number, source: input, description: "Planned units; > 0; must not exceed the quantity planned for this code in the application" }
      - { name: unit, type: string, source: system, description: "Copied from the resolved PaymentScheduleRate" }
      - { name: applicable_rate_cents, type: integer, source: computed, description: "Snapshot: hu_rate_cents iff contract applicant historically_underserved else standard_rate_cents; frozen at item creation" }
      - { name: scheduled_amount_cents, type: integer, source: computed, description: "= round_half_up(planned_quantity * applicable_rate_cents); recomputed by PATCH" }
      - { name: implementation_deadline, type: datetime, source: input, description: "Certification must occur at or before this instant; sweep expires the item when clock passes it" }
      - { name: certification_status, type: enum, source: system, description: "PLANNED -> INSTALLED -> CERTIFIED | CERTIFICATION_FAILED -> INSTALLED (retry cycle); CANCELLED | EXPIRED | CERTIFICATION_REVOKED terminal", constraints: "PLANNED|INSTALLED|CERTIFIED|CERTIFICATION_FAILED|CANCELLED|EXPIRED|CERTIFICATION_REVOKED" }
      - { name: certified_quantity, type: number, source: system, description: "Quantity certified by planner; nullable until certified" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying planner; segregation-of-duties reference" }
      - { name: certified_at, type: datetime, source: system, description: "Logical clock instant of certification; basis of freshness and maintenance window" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> ADVANCE_HELD -> PAID -> RECOUPMENT_PENDING -> RECOUPED; independent parallel dimension to certification_status", constraints: "UNPAID|ADVANCE_HELD|PAID|RECOUPMENT_PENDING|RECOUPED" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Computed (certified) amount disbursed-or-offset for this item" }

  - name: PaymentRequest
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ConservationProgram.id; copied from contract; scopes sequence_number" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: practice_item_id, type: string, source: input, description: "FK -> ContractPracticeItem.id; must belong to contract_id" }
      - { name: documented_cost_cents, type: integer, source: input, description: "Producer-documented actual cost; >= 1" }
      - { name: documentation_refs, type: array, source: input, description: "Receipt/photo references; must contain >= 1 element" }
      - { name: sequence_number, type: integer, source: system, description: "Per-program creation ordinal across all payment requests (1-based, assigned at creation in created_at order)" }
      - { name: sampled, type: boolean, source: computed, description: "= (sequence_number % program.spot_check_modulus == 0); sampled requests require a PASSED SpotCheck before disburse" }
      - { name: computed_amount_cents, type: integer, source: computed, description: "= min(round_half_up(certified_quantity * applicable_rate_cents), documented_cost_cents)" }
      - { name: advance_offset_cents, type: integer, source: computed, default: 0, description: "Advance outstanding applied at disbursement = min(computed_amount_cents, advance outstanding for the item)" }
      - { name: disbursed_amount_cents, type: integer, source: computed, default: 0, description: "= computed_amount_cents - advance_offset_cents; new cash paid at disbursement" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "PaymentOfficer X-User-ID from approve; segregation reference" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED -> DISBURSED; UNDER_REVIEW -> REJECTED; DISBURSED -> REVOKED (spot-check failure cascade)", constraints: "SUBMITTED|UNDER_REVIEW|APPROVED|DISBURSED|REJECTED|REVOKED" }

  - name: AdvancePayment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; copied from contract" }
      - { name: practice_item_id, type: string, source: input, description: "FK -> ContractPracticeItem.id; at most one advance ever per practice item" }
      - { name: issued_cents, type: integer, source: input, description: "Advance amount; 1 <= amount <= round_half_up(program.advance_cap_pct * item.scheduled_amount_cents)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock instant of issuance" }
      - { name: expenditure_due_date, type: datetime, source: computed, description: "= issued_at + 90 days" }
      - { name: applied_cents, type: integer, source: computed, default: 0, description: "Portion liquidated by offset against the item's certified payment" }
      - { name: returned_cents, type: integer, source: computed, default: 0, description: "Portion returned by applicant (directly or via recoupment payment)" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= issued_cents - applied_cents - returned_cents; invariant: issued == applied + returned + outstanding" }
      - { name: status, type: enum, source: system, description: "ISSUED -> RETURN_DUE (sweep at due date, or forced on item EXPIRED / contract TERMINATED) -> ESCALATED (sweep +30d, spawns RecoupmentDemand); -> CLOSED terminal", constraints: "ISSUED|RETURN_DUE|ESCALATED|CLOSED" }

  - name: ContractModification
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: kind, type: enum, source: input, description: "EXTEND_DEADLINE | ADD_PRACTICE | DROP_PRACTICE", constraints: "EXTEND_DEADLINE|ADD_PRACTICE|DROP_PRACTICE" }
      - { name: practice_item_id, type: string, source: input, description: "FK -> ContractPracticeItem.id; nullable; required for EXTEND_DEADLINE and DROP_PRACTICE" }
      - { name: new_deadline, type: datetime, source: input, description: "Nullable; required for EXTEND_DEADLINE and ADD_PRACTICE" }
      - { name: new_practice_code, type: enum, source: input, description: "Nullable; required for ADD_PRACTICE", constraints: "COVER_CROP|PRESCRIBED_GRAZING|WATERING_FACILITY|FENCE|NUTRIENT_MANAGEMENT" }
      - { name: new_quantity, type: number, source: input, description: "Nullable; required for ADD_PRACTICE; > 0" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED | REJECTED", constraints: "REQUESTED|APPROVED|REJECTED" }

  - name: SpotCheck
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: practice_item_id, type: string, source: input, description: "FK -> ContractPracticeItem.id; must belong to contract_id" }
      - { name: payment_request_id, type: string, source: input, description: "FK -> PaymentRequest.id; nullable; required when the check gates a sampled disbursement" }
      - { name: inspector_user_id, type: string, source: system, description: "QualityAssuranceOfficer X-User-ID who recorded creation; the same officer records the result" }
      - { name: failure_reason, type: string, source: system, description: "Recorded on FAIL; nullable" }
      - { name: status, type: enum, source: system, description: "PENDING -> PASSED | FAILED", constraints: "PENDING|PASSED|FAILED" }

  - name: MaintenanceObligation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; copied from certified item" }
      - { name: practice_item_id, type: string, source: system, description: "FK -> ContractPracticeItem.id; one obligation per certification" }
      - { name: parcel_id, type: string, source: system, description: "Copied from the source application" }
      - { name: practice_code, type: string, source: system, description: "Copied from the certified item" }
      - { name: start_date, type: datetime, source: system, description: "= item.certified_at" }
      - { name: end_date, type: datetime, source: computed, description: "= start_date + rate.lifespan_years * 365 days; interval is half-open [start_date, end_date)" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of violation reporter; segregation reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VIOLATION_REVIEW -> ACTIVE (dismiss, cycle) | VIOLATION_CONFIRMED (terminal); ACTIVE -> SATISFIED (sweep past end_date); ACTIVE -> VOID (certification revoked)", constraints: "ACTIVE|VIOLATION_REVIEW|VIOLATION_CONFIRMED|SATISFIED|VOID" }

  - name: RecoupmentDemand
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: maintenance_obligation_id, type: string, source: system, description: "FK -> MaintenanceObligation.id; nullable; set when source is a confirmed violation" }
      - { name: advance_payment_id, type: string, source: system, description: "FK -> AdvancePayment.id; nullable; set when source is advance escalation" }
      - { name: payment_request_id, type: string, source: system, description: "FK -> PaymentRequest.id; nullable; set when source is a spot-check revocation" }
      - { name: amount_cents, type: integer, source: computed, description: "Source-pinned: revoked request computed_amount_cents | violating item paid_amount_cents | advance outstanding_cents" }
      - { name: due_date, type: datetime, source: computed, description: "= created logical instant + 30 days" }
      - { name: status, type: enum, source: system, description: "DEMANDED -> ESCALATED (sweep past due_date) -> PAID; DEMANDED -> PAID", constraints: "DEMANDED|ESCALATED|PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConservationProgram
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /eqip/programs/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - ">= 1 FundingPool, >= 1 PaymentScheduleRate, >= 1 RankingCriterion exist for the program (ERR_PROGRAM_INCOMPLETE_CONFIG)"
        side_effects: ["status -> OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /eqip/programs/{id}/close"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> CLOSED"]
      - from: OPEN
        to: CLOSED
        trigger: "system sweep (POST /_clock/set_current_utc advances clock past window_end)"
        actor: system
        preconditions: ["clock > window_end"]
        side_effects: ["status -> CLOSED"]

  - entity: Application
    initial_state: DRAFT
    terminal_states: [SCREENED_OUT, NOT_SELECTED, OBLIGATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /eqip/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "program.status == OPEN (ERR_PROGRAM_NOT_OPEN) and clock <= program.window_end"
          - "every planned_practices code has a PaymentScheduleRate in the program (ERR_RATE_NOT_FOUND)"
          - "parcel_id is an element of applicant.parcel_ids (ERR_PARCEL_NOT_REGISTERED)"
        side_effects:
          - "provisional_score computed over self_reported_answers (calculation ranking_score, variant provisional)"
      - from: SUBMITTED
        to: SCREENED_IN
        trigger: "POST /eqip/applications/{id}/screen with decision=SCREENED_IN"
        actor: ConservationPlanner
        preconditions: ["verified_answers payload present"]
        side_effects:
          - "verified_answers recorded"
          - "ranking_score computed over verified_answers (calculation ranking_score, variant verified)"
          - "estimated_obligation_cents computed (calculation estimated_obligation)"
      - from: SUBMITTED
        to: SCREENED_OUT
        trigger: "POST /eqip/applications/{id}/screen with decision=SCREENED_OUT"
        actor: ConservationPlanner
        preconditions: []
        side_effects: []
      - from: SCREENED_IN
        to: SELECTED
        trigger: "system (during POST /eqip/programs/{id}/run-ranking waterfall)"
        actor: system
        preconditions: ["waterfall assigns a pool: estimated_obligation_cents <= pool.available_cents"]
        side_effects: ["funded_pool_id set to the assigned pool"]
      - from: SCREENED_IN
        to: NOT_SELECTED
        trigger: "system (during run-ranking; no pool fits)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SELECTED
        to: CONTRACTED
        trigger: "POST /eqip/contracts (creates the DRAFT contract)"
        actor: ConservationPlanner
        preconditions: []
        side_effects: ["status -> CONTRACTED"]
      - from: CONTRACTED
        to: OBLIGATED
        trigger: "POST /eqip/contracts/{id}/obligate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> OBLIGATED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /eqip/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /eqip/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: SCREENED_IN
        to: WITHDRAWN
        trigger: "POST /eqip/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OBLIGATED
        trigger: "POST /eqip/contracts/{id}/obligate"
        actor: ProgramAdmin
        preconditions:
          - ">= 1 ContractPracticeItem exists (ERR_CONTRACT_EMPTY)"
          - "obligated_amount_cents <= pool.available_cents (ERR_POOL_INSUFFICIENT_FUNDS)"
        side_effects:
          - "pool.obligated_cents += obligated_amount_cents"
          - "pool.available_cents -= obligated_amount_cents"
          - "application.status -> OBLIGATED"
          - "contract.version += 1"
      - from: OBLIGATED
        to: MODIFICATION_PENDING
        trigger: "POST /eqip/contracts/{id}/modifications"
        actor: Applicant
        preconditions: []
        side_effects:
          - "contract.version += 1"
          - "note: while MODIFICATION_PENDING the contract is frozen — payment requests, advances, certifications, terminations are rejected"
      - from: MODIFICATION_PENDING
        to: OBLIGATED
        trigger: "POST /eqip/modifications/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "modification.status == REQUESTED (ERR_MODIFICATION_NOT_REQUESTED)"
          - "expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION, OCC)"
          - "for ADD_PRACTICE: new item scheduled_amount_cents <= pool.available_cents (ERR_POOL_INSUFFICIENT_FUNDS)"
          - "for EXTEND_DEADLINE: item certification_status in {PLANNED, INSTALLED, CERTIFICATION_FAILED} (ERR_ITEM_NOT_EXTENDABLE); clock <= item.implementation_deadline (ERR_EXTENSION_WINDOW_CLOSED); new_deadline > item.implementation_deadline and new_deadline <= item.implementation_deadline + 365 days (ERR_EXTENSION_TOO_LONG)"
        side_effects:
          - "EXTEND_DEADLINE: item.implementation_deadline := new_deadline; item.version += 1"
          - "ADD_PRACTICE: new ContractPracticeItem created (PLANNED/UNPAID) with snapshot rate; contract.obligated_amount_cents += new scheduled; pool.obligated_cents += scheduled; pool.available_cents -= scheduled"
          - "DROP_PRACTICE: item -> CANCELLED; item's remaining obligation (scheduled_amount_cents - advance net outstanding) released: pool.obligated_cents -= released, pool.available_cents += released; if an advance on the item has outstanding_cents > 0, advance -> RETURN_DUE with expenditure_due_date := clock"
          - "contract.status -> OBLIGATED; contract.version += 1"
      - from: MODIFICATION_PENDING
        to: OBLIGATED
        trigger: "POST /eqip/modifications/{id}/reject"
        actor: ProgramAdmin
        preconditions:
          - "modification.status == REQUESTED (ERR_MODIFICATION_NOT_REQUESTED)"
          - "expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION, OCC)"
        side_effects:
          - "modification.status -> REJECTED"
          - "contract.status -> OBLIGATED; contract.version += 1"
      - from: OBLIGATED
        to: COMPLETED
        trigger: "POST /eqip/contracts/{id}/complete"
        actor: ProgramAdmin
        preconditions:
          - "every item terminal: (certification_status == CERTIFIED and payment_status in {PAID, RECOUPED}) or certification_status in {CANCELLED, EXPIRED} (ERR_ITEMS_NOT_TERMINAL -> use ERR_CONTRACT_NOT_OBLIGATED-family error ERR_ITEMS_NOT_FINAL)"
          - "no AdvancePayment of this contract with status in {ISSUED, RETURN_DUE, ESCALATED} (ERR_ADVANCE_OUTSTANDING)"
          - "no PaymentRequest of this contract in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_PAYMENT_REQUEST_ACTIVE)"
          - "no ContractModification of this contract in REQUESTED (ERR_MODIFICATION_NOT_REQUESTED-family: ERR_PENDING_MODIFICATION_EXISTS)"
        side_effects:
          - "contract.status -> COMPLETED; contract.version += 1"
          - "any residual obligation released: pool.obligated_cents -= residual; pool.available_cents += residual"
      - from: OBLIGATED
        to: TERMINATED
        trigger: "POST /eqip/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "no PaymentRequest of this contract in DISBURSED (ERR_DISBURSED_PAYMENTS_EXIST)"
        side_effects:
          - "every item with certification_status in {PLANNED, INSTALLED, CERTIFICATION_FAILED} -> CANCELLED; hop 2: each cancellation releases its remaining pool obligation (pool.obligated_cents -= released, pool.available_cents += released)"
          - "hop 2: every advance with outstanding_cents > 0 -> RETURN_DUE with expenditure_due_date := clock (its later ESCALATED sweep spawns a RecoupmentDemand = hop 3)"
          - "non-terminal payment requests (SUBMITTED | UNDER_REVIEW | APPROVED) -> REJECTED"
          - "REQUESTED modification -> REJECTED"
          - "application.status stays OBLIGATED (historical record); contract.version += 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /eqip/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["items -> CANCELLED; contract.version += 1"]

  - entity: ContractPracticeItem
    initial_state: PLANNED
    terminal_states: [CANCELLED, EXPIRED, CERTIFICATION_REVOKED]
    note: "Parallel dimensions: certification_status (this machine) x payment_status (next machine) on the same row."
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /eqip/practice-items/{id}/report-installed"
        actor: Applicant
        preconditions:
          - "contract.status == OBLIGATED (ERR_CONTRACT_NOT_PAYABLE)"
          - "clock <= implementation_deadline (ERR_DEADLINE_PASSED)"
        side_effects: ["item.version += 1"]
      - from: CERTIFICATION_FAILED
        to: INSTALLED
        trigger: "POST /eqip/practice-items/{id}/report-installed"
        actor: Applicant
        preconditions:
          - "contract.status == OBLIGATED (ERR_CONTRACT_NOT_PAYABLE)"
          - "clock <= implementation_deadline (ERR_DEADLINE_PASSED)"
        side_effects: ["item.version += 1"]
      - from: INSTALLED
        to: CERTIFIED
        trigger: "POST /eqip/practice-items/{id}/certify"
        actor: ConservationPlanner
        preconditions:
          - "1 <= certified_quantity <= planned_quantity (ERR_CERTIFIED_QUANTITY_INVALID)"
          - "clock <= implementation_deadline (ERR_DEADLINE_PASSED)"
          - "no MaintenanceObligation with same (parcel_id, practice_code) in status ACTIVE or VIOLATION_REVIEW whose end_date > certification instant (half-open: end_date == certified_at is allowed) (ERR_OBLIGATION_OVERLAP)"
        side_effects:
          - "certification_status -> CERTIFIED; certified_quantity, certified_by_user_id, certified_at recorded; item.version += 1"
          - "MaintenanceObligation created: start_date = certified_at, end_date = certified_at + lifespan_years*365d, status ACTIVE"
      - from: INSTALLED
        to: CERTIFICATION_FAILED
        trigger: "POST /eqip/practice-items/{id}/fail-certification"
        actor: ConservationPlanner
        preconditions: []
        side_effects: ["item.version += 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (DROP_PRACTICE modification approval or contract termination)"
        actor: system
        preconditions: []
        side_effects: ["remaining pool obligation released (obligated -= scheduled - advance_net, available += same)"]
      - from: INSTALLED
        to: CANCELLED
        trigger: "system (contract termination)"
        actor: system
        preconditions: []
        side_effects: ["remaining pool obligation released"]
      - from: CERTIFICATION_FAILED
        to: CANCELLED
        trigger: "system (contract termination)"
        actor: system
        preconditions: []
        side_effects: ["remaining pool obligation released"]
      - from: PLANNED
        to: EXPIRED
        trigger: "system sweep (clock > implementation_deadline)"
        actor: system
        preconditions:
          - "contract is NOT MODIFICATION_PENDING (a contract under modification review freezes the expiry sweep, keeping ERR_EXTENSION_WINDOW_CLOSED reachable at approve time)"
        side_effects:
          - "remaining pool obligation released (pool.obligated_cents -= scheduled - advance_net, pool.available_cents += same)"
          - "advance on the item with outstanding > 0 -> RETURN_DUE, expenditure_due_date := clock"
      - from: INSTALLED
        to: EXPIRED
        trigger: "system sweep (clock > implementation_deadline)"
        actor: system
        preconditions: ["contract NOT MODIFICATION_PENDING (same freeze as PLANNED -> EXPIRED)"]
        side_effects: ["same as PLANNED -> EXPIRED"]
      - from: CERTIFICATION_FAILED
        to: EXPIRED
        trigger: "system sweep (clock > implementation_deadline)"
        actor: system
        preconditions: ["contract NOT MODIFICATION_PENDING (same freeze as PLANNED -> EXPIRED)"]
        side_effects: ["same as PLANNED -> EXPIRED"]
      - from: CERTIFIED
        to: CERTIFICATION_REVOKED
        trigger: "system (spot-check failure cascade)"
        actor: system
        preconditions: []
        side_effects: ["MaintenanceObligation for this item -> VOID"]

  - entity: ContractPracticeItem_payment
    note: "Second parallel state dimension on ContractPracticeItem (field payment_status). Declared as separate machine entry; same underlying row."
    entity_field: payment_status
    initial_state: UNPAID
    terminal_states: [RECOUPED]
    transitions:
      - from: UNPAID
        to: ADVANCE_HELD
        trigger: "POST /eqip/contracts/{id}/advance-payments"
        actor: PaymentOfficer
        preconditions: []
        side_effects: []
      - from: UNPAID
        to: PAID
        trigger: "POST /eqip/payment-requests/{id}/disburse (no advance outstanding on the item)"
        actor: PaymentOfficer
        preconditions: []
        side_effects: ["paid_amount_cents := request.computed_amount_cents"]
      - from: ADVANCE_HELD
        to: PAID
        trigger: "POST /eqip/payment-requests/{id}/disburse"
        actor: PaymentOfficer
        preconditions: []
        side_effects: ["paid_amount_cents := request.computed_amount_cents; advance.applied_cents += advance_offset_cents"]
      - from: PAID
        to: RECOUPMENT_PENDING
        trigger: "system (spot-check failure cascade, or maintenance violation confirmation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOUPMENT_PENDING
        to: RECOUPED
        trigger: "POST /eqip/recoupment-demands/{id}/pay (full amount)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: UNPAID
        to: UNPAID
        trigger: "terminal bookkeeping: items that reach CANCELLED/EXPIRED never leave UNPAID unless ADVANCE_HELD"
        actor: system
        preconditions: []
        side_effects: []
        note: "No-op marker documenting that cancellation/expiry does not mutate payment_status."

  - entity: PaymentRequest
    initial_state: SUBMITTED
    terminal_states: [DISBURSED, REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /eqip/payment-requests/{id}/review"
        actor: PaymentOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /eqip/payment-requests/{id}/approve"
        actor: PaymentOfficer
        preconditions:
          - "approver X-User-ID != item.certified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["reviewed_by_user_id := approver X-User-ID"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /eqip/payment-requests/{id}/reject"
        actor: PaymentOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /eqip/payment-requests/{id}/disburse"
        actor: PaymentOfficer
        preconditions:
          - "if request.sampled: a SpotCheck linked to this payment_request_id with status == PASSED exists (ERR_SPOT_CHECK_REQUIRED)"
          - "disburse clock <= item.certified_at + 365 days (ERR_CERTIFICATION_STALE)"
        side_effects:
          - "advance_offset_cents := min(computed_amount_cents, item advance outstanding); disbursed_amount_cents := computed_amount_cents - advance_offset_cents"
          - "pool.obligated_cents -= (item.scheduled_amount_cents - advance issued_cents net for the item); pool.paid_cents += disbursed_amount_cents"
          - "advance.applied_cents += advance_offset_cents; advance outstanding reduced; if outstanding == 0 -> advance CLOSED; else -> advance RETURN_DUE with expenditure_due_date := clock"
          - "item.payment_status -> PAID; item.paid_amount_cents := computed_amount_cents; item.version += 1"
          - "contract.paid_amount_cents += computed_amount_cents; contract.version += 1"
      - from: DISBURSED
        to: REVOKED
        trigger: "system (spot-check failure cascade: POST /eqip/spot-checks/{id}/record-result result=FAIL on a spot check linked to this request)"
        actor: system
        preconditions: []
        side_effects:
          - "hop 2: item.certification_status CERTIFIED -> CERTIFICATION_REVOKED; item.payment_status PAID -> RECOUPMENT_PENDING; item.version += 1"
          - "hop 3: the item's MaintenanceObligation -> VOID"
          - "hop 4: RecoupmentDemand created, amount_cents := this request's computed_amount_cents, due_date := clock + 30 days, payment_request_id := this request"
          - "note: pool funds are NOT restored until the RecoupmentDemand is paid"

  - entity: AdvancePayment
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: CLOSED
        trigger: "POST /eqip/advance-payments/{id}/return (amount == outstanding) or disbursement offset reducing outstanding to 0"
        actor: Applicant | system
        preconditions: []
        side_effects: ["return: pool.paid_cents -= amount"]
      - from: ISSUED
        to: RETURN_DUE
        trigger: "system sweep (clock > expenditure_due_date and outstanding_cents > 0); also forced by item EXPIRED / contract TERMINATED / DROP_PRACTICE approval / disbursement leaving residual"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURN_DUE
        to: CLOSED
        trigger: "POST /eqip/advance-payments/{id}/return (amount == outstanding)"
        actor: Applicant
        preconditions: []
        side_effects: ["pool.paid_cents -= amount"]
      - from: RETURN_DUE
        to: ESCALATED
        trigger: "system sweep (clock > expenditure_due_date + 30 days and outstanding_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["RecoupmentDemand created: amount_cents := outstanding_cents, advance_payment_id := this advance, due_date := clock + 30 days"]
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /eqip/recoupment-demands/{id}/pay for the linked demand (full amount)"
        actor: Applicant
        preconditions: []
        side_effects: ["returned_cents += amount; outstanding_cents -> 0; pool.paid_cents -= amount"]

  - entity: ContractModification
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /eqip/modifications/{id}/approve"
        actor: ProgramAdmin
        preconditions: ["see Contract MODIFICATION_PENDING -> OBLIGATED transition"]
        side_effects: ["kind-specific effects per Contract transition"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /eqip/modifications/{id}/reject"
        actor: ProgramAdmin
        preconditions: ["expected_contract_version == contract.version (OCC)"]
        side_effects: []

  - entity: SpotCheck
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /eqip/spot-checks/{id}/record-result with result=PASS"
        actor: QualityAssuranceOfficer
        preconditions:
          - "actor X-User-ID == inspector_user_id (ERR_SPOT_CHECK_NOT_PENDING-family: ERR_INSPECTOR_MISMATCH)"
          - "actor X-User-ID != item.certified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: PENDING
        to: FAILED
        trigger: "POST /eqip/spot-checks/{id}/record-result with result=FAIL"
        actor: QualityAssuranceOfficer
        preconditions:
          - "actor X-User-ID == inspector_user_id (ERR_INSPECTOR_MISMATCH)"
          - "actor X-User-ID != item.certified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "failure_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "if linked payment_request is DISBURSED: revocation cascade per PaymentRequest DISBURSED -> REVOKED (4 hops)"
          - "if linked payment_request is APPROVED (pre-disburse): request stays APPROVED but disburse is blocked until a different PASSED spot check exists (a FAILED linked check satisfies no gate)"

  - entity: MaintenanceObligation
    initial_state: ACTIVE
    terminal_states: [SATISFIED, VIOLATION_CONFIRMED, VOID]
    transitions:
      - from: ACTIVE
        to: VIOLATION_REVIEW
        trigger: "POST /eqip/maintenance-obligations/{id}/report-violation"
        actor: ConservationPlanner
        preconditions: []
        side_effects: ["reported_by_user_id := actor X-User-ID"]
      - from: VIOLATION_REVIEW
        to: ACTIVE
        trigger: "POST /eqip/maintenance-obligations/{id}/dismiss-violation"
        actor: QualityAssuranceOfficer
        preconditions: []
        side_effects: []
      - from: VIOLATION_REVIEW
        to: VIOLATION_CONFIRMED
        trigger: "POST /eqip/maintenance-obligations/{id}/confirm-violation"
        actor: QualityAssuranceOfficer
        preconditions:
          - "confirmer X-User-ID != reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "if item.paid_amount_cents > 0: RecoupmentDemand created (amount := item.paid_amount_cents, maintenance_obligation_id set, due := clock + 30 days)"
          - "item.payment_status PAID -> RECOUPMENT_PENDING"
      - from: ACTIVE
        to: SATISFIED
        trigger: "system sweep (clock >= end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VOID
        trigger: "system (certification revoked via spot-check failure cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RecoupmentDemand
    initial_state: DEMANDED
    terminal_states: [PAID]
    transitions:
      - from: DEMANDED
        to: ESCALATED
        trigger: "system sweep (clock > due_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEMANDED
        to: PAID
        trigger: "POST /eqip/recoupment-demands/{id}/pay (amount == amount_cents exactly)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "pool.paid_cents -= amount_cents (funds restored to the contract's pool)"
          - "linked item in RECOUPMENT_PENDING -> RECOUPED"
          - "linked advance (escalation source): returned_cents += amount, outstanding -> 0, advance -> CLOSED"
      - from: ESCALATED
        to: PAID
        trigger: "POST /eqip/recoupment-demands/{id}/pay (amount == amount_cents exactly)"
        actor: Applicant
        preconditions: []
        side_effects: ["same as DEMANDED -> PAID"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: modification-approve-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /eqip/modifications/{id}/approve"
    occ_field: expected_contract_version
    description: |
      Approving a modification carries the contract version the approver last
      observed. Between the modification request and this approval, legitimate
      writes (e.g., a payment disbursement) may have advanced contract.version;
      approval under a stale view of the contract is rejected. A second approval
      attempt carrying the pre-disbursement version fails even though the
      modification is still REQUESTED and the contract still MODIFICATION_PENDING.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: modification-reject-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /eqip/modifications/{id}/reject"
    occ_field: expected_contract_version
    description: |
      Rejecting a modification under a contract version the reviewer no longer
      holds is rejected; the reviewer must re-read the contract and re-issue.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: practice-item-patch-stale-item
    parent_entity: ContractPracticeItem
    write_endpoint: "PATCH /eqip/practice-items/{id}"
    occ_field: expected_item_version
    description: |
      Editing planned_quantity or implementation_deadline while the contract is
      DRAFT requires the item version the editor last observed; an edit carrying
      an older version (another edit already landed, silently changing
      scheduled_amount_cents) is rejected as stale.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ranking_score
    trigger: "application submit (variant provisional, over self_reported_answers) and screening (variant verified, over verified_answers)"
    algorithm: weighted_scoring
    formula: |
      1. base = SUM over each RankingCriterion c of the program:
           min(points[c], c.max_points) * c.weight
         (points from the applicable answer set; missing keys count as 0;
          unknown keys rejected at input validation)
      2. tier bonus, keyed on base ONLY (evaluation order pinned: base first,
         tier lookup second, addition third, cap fourth — the bonus must NOT be
         re-derived from the already-bonused total):
           base >= 60  -> bonus = 10
           40 <= base < 60 -> bonus = 5
           base < 40   -> bonus = 0
      3. score = min(100, base + bonus)
    input_set: "All RankingCriterion rows of the program; answers = self_reported_answers (provisional) or verified_answers (verified)"
    constants:
      TIER_HIGH: 60
      TIER_HIGH_BONUS: 10
      TIER_MID: 40
      TIER_MID_BONUS: 5
      SCORE_CAP: 100
    precision: "score kept as number; base may be fractional (weights like 0.5); no rounding until step 3, then round_half_up to 2 decimals"
    variants:
      - name: provisional
        when: "at submit; over self_reported_answers"
        difference: "stores provisional_score; uses unverified producer claims"
      - name: verified
        when: "at screening decision=SCREENED_IN; over verified_answers"
        difference: "stores ranking_score; planner-adjusted points usually differ, so verified != provisional for the same application"

  - name: estimated_obligation
    trigger: "screening (decision=SCREENED_IN)"
    algorithm: aggregation
    formula: |
      applicable_rate(code) = hu_rate_cents if applicant.historically_underserved else standard_rate_cents
      estimated_obligation_cents = SUM over planned_practices: round_half_up(quantity * applicable_rate(practice_code))
      Rounding order pinned: round each practice line FIRST (round_half_up to whole cents), then sum.
    input_set: "application.planned_practices; PaymentScheduleRate of the program per practice_code"
    precision: "integer cents, round_half_up per line"

  - name: scheduled_amount
    trigger: "practice item creation, PATCH /eqip/practice-items/{id}, ADD_PRACTICE modification approval"
    algorithm: aggregation
    formula: |
      scheduled_amount_cents = round_half_up(planned_quantity * applicable_rate_cents)
      applicable_rate_cents snapshot rule: hu_rate_cents iff the contract's applicant.historically_underserved
      is true AT ITEM CREATION; the snapshot never changes afterwards (rate row edits do not retrofit).
    input_set: "single ContractPracticeItem + resolved PaymentScheduleRate"
    precision: "integer cents, round_half_up"

  - name: obligated_amount
    trigger: "contract obligate; ADD_PRACTICE approval; DROP_PRACTICE approval; item EXPIRED/CANCELLED release; PATCH of an item while DRAFT"
    algorithm: aggregation
    formula: |
      obligated_amount_cents = SUM over non-terminal items of scheduled_amount_cents
      Rounding order pinned: per-item round_half_up happens inside scheduled_amount (never re-round
      the contract-level sum). Note the deliberate divergence: sum-of-rounded != round-of-sum
      when quantity * rate yields fractional cents (e.g. 2.5 * 15001 twice = 75006 vs 75005).
    input_set: "ContractPracticeItem rows of the contract with certification_status NOT IN {CANCELLED, EXPIRED, CERTIFICATION_REVOKED}"
    precision: "integer cents"

  - name: certified_payment
    trigger: "payment request creation (computes fields); disbursement (applies offsets)"
    algorithm: threshold
    formula: |
      1. computed_amount_cents = min(round_half_up(certified_quantity * applicable_rate_cents), documented_cost_cents)
         — non-linear: nested min() over >= 3 inputs (certified_quantity, HU-conditional applicable_rate_cents,
         documented_cost_cents) plus the advance offset below.
      2. advance_offset_cents = min(computed_amount_cents, advance.outstanding_cents for the item's advance, 0 if none)
      3. disbursed_amount_cents = max(0, computed_amount_cents - advance_offset_cents)
      Evaluation order pinned: computed first, offset second, disbursement third.
    input_set: "the ContractPracticeItem (CERTIFIED), the PaymentRequest payload, the item's AdvancePayment (any status with outstanding > 0)"
    precision: "integer cents, round_half_up"
    variants:
      - name: scheduled_estimate
        when: "before certification (contract drafting / obligation)"
        difference: "uses planned_quantity and ignores documented cost: scheduled = round_half_up(planned_quantity * applicable_rate)"
      - name: certified_final
        when: "at payment request creation"
        difference: "uses certified_quantity and the documented-cost cap: can be lower than scheduled_estimate; the pool releases the difference at disbursement"

  - name: pool_available
    trigger: "every pool mutation (obligate, disburse, advance issue, release, recoupment pay, advance return)"
    algorithm: aggregation
    formula: |
      available_cents = allocated_cents - obligated_cents - paid_cents
      Invariant (compensating pairs preserve it): allocated_cents == available_cents + obligated_cents + paid_cents
      Forward/compensating pairs: obligate <-> release (cancel/expire/terminate/drop); disburse <-> recoupment pay;
      advance issue <-> advance return.
    input_set: "single FundingPool row"
    precision: "integer cents"

  - name: ranking_selection_waterfall
    trigger: "POST /eqip/programs/{id}/run-ranking (program CLOSED, ranking_run_count == 0)"
    algorithm: waterfall_allocation
    formula: |
      1. Candidate set: applications with status == SCREENED_IN.
      2. Order: ranking_score DESC, then estimated_obligation_cents ASC, then created_at ASC (id never used).
      3. For each application in order, pool selection:
           a. If applicant.historically_underserved: try the pool whose pool_type == "HU_" + applicant.hu_category FIRST;
           b. then (or for non-HU applicants, only) the GENERAL pool.
           A pool fits iff estimated_obligation_cents <= pool.available_cents (<= : exact fit succeeds).
      4. Fit -> application SELECTED, funded_pool_id := pool, pool.available_cents reserved:
         pool.obligated_cents += estimated_obligation_cents.
         Wait — reservation happens at contract obligation instead; the waterfall only checks fit against a
         running shadow availability. Pinned: selection itself does NOT mutate pool fields; it computes a
         running shadow_available per pool (starting at available_cents) so selections within one run see
         prior selections. Pool mutation occurs at contract obligate.
      5. No fit -> NOT_SELECTED. Non-fitting applications are SKIPPED (later, smaller applications may still fit).
      6. ranking_run_count -> 1; second run rejected (ERR_RANKING_ALREADY_RUN).
    input_set: "applications status == SCREENED_IN; pools of the program"
    precision: "integer cents comparisons"

  - name: spot_check_sampling
    trigger: "payment request creation"
    algorithm: threshold
    formula: |
      sequence_number = 1 + count of all PaymentRequest rows (any status) already existing for the program
      sampled = (sequence_number % program.spot_check_modulus == 0)   # modulus 5 -> requests 5, 10, 15, ... sampled
      Boundary pinned: the sampled set is exactly the multiples; sequence 4 no, 5 yes, 6 no.
    input_set: "PaymentRequest rows of the program"
    constants: {}
    precision: "integer modulus"

  - name: advance_cap
    trigger: "advance payment creation"
    algorithm: threshold
    formula: |
      cap_cents = round_half_up(program.advance_cap_pct * item.scheduled_amount_cents)
      issued_cents <= cap_cents required (<= : an advance of exactly cap_cents succeeds; cap_cents + 1 fails)
    input_set: "program.advance_cap_pct, item.scheduled_amount_cents"
    precision: "integer cents, round_half_up"

  - name: advance_outstanding
    trigger: "advance creation, disbursement offset, return, recoupment pay"
    algorithm: aggregation
    formula: |
      outstanding_cents = issued_cents - applied_cents - returned_cents
      Invariant: issued_cents == applied_cents + returned_cents + outstanding_cents at all times.
      Compensating pair: issue (outstanding := issued) vs full return (outstanding := 0) leaves pool.paid_cents
      unchanged net-net across the pair.
    input_set: "single AdvancePayment row"
    precision: "integer cents"

  - name: maintenance_window
    trigger: "certification (creation); sweep (SATISFIED evaluation); overlap check at certification"
    algorithm: interval_merge
    formula: |
      obligation interval = [start_date, end_date), half-open:
        start_date = item.certified_at
        end_date   = certified_at + lifespan_years * 365 days
      SATISFIED sweep fires when clock >= end_date (at exactly end_date the obligation is already satisfied).
      Overlap at certification: an existing obligation O on the same (parcel_id, practice_code) with
      O.status IN {ACTIVE, VIOLATION_REVIEW} blocks iff O.end_date > new certified_at
      (adjacency O.end_date == certified_at does NOT block — half-open semantics).
    input_set: "MaintenanceObligation rows sharing (parcel_id, practice_code)"
    precision: "datetime, second precision"

  - name: recoupment_amount
    trigger: "spot-check revocation cascade; maintenance violation confirmation; advance escalation sweep"
    algorithm: aggregation
    formula: |
      source = payment_request revocation -> amount_cents = request.computed_amount_cents
      source = maintenance violation      -> amount_cents = item.paid_amount_cents (demand created only if > 0)
      source = advance escalation         -> amount_cents = advance.outstanding_cents
      due_date = creation clock + 30 days; ESCALATED sweep when clock > due_date.
    input_set: "source entity per branch"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role authorized for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (program -> child -> grandchild); body FK references exist"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PRACTICE_ITEM_NOT_FOUND | ERR_PAYMENT_REQUEST_NOT_FOUND | ERR_ADVANCE_PAYMENT_NOT_FOUND | ERR_MODIFICATION_NOT_FOUND | ERR_SPOT_CHECK_NOT_FOUND | ERR_MAINTENANCE_OBLIGATION_NOT_FOUND | ERR_RECOUPMENT_DEMAND_NOT_FOUND (pattern ERR_{RESOURCE}_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path params or body FKs"
  - priority: 4
    category: auth
    check: "Applicant-role actors act only on their own resources: payload/derived applicant_id == X-User-ID (applications, contract children, payment requests, advances, modifications, recoupment payments)"
    error_id: ERR_APPLICANT_NOT_OWNER
    http_status: 403
    applies_to: "applicant write endpoints"
  - priority: 5
    category: state
    check: "Target resource state permits the operation (per §1.2 from-state and frozen-posture rules: contract MODIFICATION_PENDING rejects payment/advance/certification/termination work; terminal states reject everything)"
    error_id: "state-specific: ERR_PROGRAM_NOT_OPEN | ERR_PROGRAM_NOT_CLOSED | ERR_PROGRAM_NOT_IN_SETUP | ERR_RANKING_ALREADY_RUN | ERR_APPLICATION_NOT_WITHDRAWABLE | ERR_APPLICATION_NOT_SUBMITTED | ERR_APPLICATION_NOT_SELECTED | ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_EMPTY | ERR_CONTRACT_NOT_OBLIGATED | ERR_CONTRACT_NOT_MODIFIABLE | ERR_CONTRACT_NOT_PAYABLE | ERR_ITEM_NOT_INSTALLABLE | ERR_ITEM_NOT_INSTALLED | ERR_ITEM_NOT_CERTIFIED | ERR_ITEM_NOT_EXTENDABLE | ERR_ITEM_NOT_PLANNED | ERR_REQUEST_NOT_SUBMITTED | ERR_REQUEST_NOT_UNDER_REVIEW | ERR_REQUEST_NOT_APPROVED | ERR_ADVANCE_NOT_RETURNABLE | ERR_MODIFICATION_NOT_REQUESTED | ERR_SPOT_CHECK_NOT_PENDING | ERR_OBLIGATION_NOT_ACTIVE | ERR_OBLIGATION_NOT_IN_REVIEW | ERR_DEMAND_NOT_PAYABLE | ERR_ITEMS_NOT_FINAL | ERR_PENDING_MODIFICATION_EXISTS"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: payment approver != item certifier; spot-check recorder != item certifier; violation confirmer != violation reporter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /eqip/payment-requests/{id}/approve, POST /eqip/spot-checks/{id}/record-result, POST /eqip/maintenance-obligations/{id}/confirm-violation"
  - priority: 7
    category: business_safety
    check: "Sampled payment request has a linked SpotCheck with status PASSED (a PENDING or FAILED check does not satisfy the gate)"
    error_id: ERR_SPOT_CHECK_REQUIRED
    http_status: 409
    applies_to: "POST /eqip/payment-requests/{id}/disburse"
  - priority: 8
    category: business_constraint
    check: "Shape/uniqueness/cardinality: required fields present and typed (ERR_INVALID_REQUEST); documentation_refs non-empty (ERR_DOCUMENTATION_INCOMPLETE); duplicate rate/criterion per program (ERR_DUPLICATE_RATE/ERR_DUPLICATE_CRITERION); certified_quantity within [1, planned_quantity] (ERR_CERTIFIED_QUANTITY_INVALID); one active payment request per item (ERR_PAYMENT_REQUEST_ACTIVE); one advance per item ever and no outstanding advance on the contract (ERR_ADVANCE_ALREADY_ISSUED / ERR_ADVANCE_OUTSTANDING); exact-amount repayments (ERR_RETURN_AMOUNT_MISMATCH / ERR_REPAYMENT_AMOUNT_MISMATCH)"
    error_id: "ERR_INVALID_REQUEST | ERR_DOCUMENTATION_INCOMPLETE | ERR_DUPLICATE_RATE | ERR_DUPLICATE_CRITERION | ERR_CERTIFIED_QUANTITY_INVALID | ERR_PAYMENT_REQUEST_ACTIVE | ERR_ADVANCE_ALREADY_ISSUED | ERR_ADVANCE_OUTSTANDING | ERR_RETURN_AMOUNT_MISMATCH | ERR_REPAYMENT_AMOUNT_MISMATCH"
    http_status: 422
    applies_to: "write endpoints"
  - priority: 9
    category: business_temporal
    check: "Clock-dependent rules: submit within window; certify/report at or before implementation_deadline (ERR_DEADLINE_PASSED); extension requested before deadline and <= +365 days (ERR_EXTENSION_WINDOW_CLOSED / ERR_EXTENSION_TOO_LONG); disbursement within 365 days of certified_at (ERR_CERTIFICATION_STALE)"
    error_id: "ERR_DEADLINE_PASSED | ERR_EXTENSION_WINDOW_CLOSED | ERR_EXTENSION_TOO_LONG | ERR_CERTIFICATION_STALE"
    http_status: 409
    applies_to: "submit, report-installed, certify, modifications, disburse"
  - priority: 10
    category: business_referential
    check: "Cross-entity link validity: application parcel registered to applicant (ERR_PARCEL_NOT_REGISTERED); every planned practice has a rate (ERR_RATE_NOT_FOUND); item practice_code in application's planned_practices and quantity <= planned (ERR_PRACTICE_NOT_IN_APPLICATION / ERR_QUANTITY_EXCEEDS_APPLICATION); payment request's item belongs to its contract; spot check's item belongs to its contract; obligation overlap at certification (ERR_OBLIGATION_OVERLAP); program window overlap per state_code at creation (ERR_WINDOW_OVERLAP)"
    error_id: "ERR_PARCEL_NOT_REGISTERED | ERR_RATE_NOT_FOUND | ERR_PRACTICE_NOT_IN_APPLICATION | ERR_QUANTITY_EXCEEDS_APPLICATION | ERR_OBLIGATION_OVERLAP | ERR_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "creation endpoints"
  - priority: 11
    category: business_fiscal
    check: "Funds: obligated_amount <= pool.available at obligate and ADD_PRACTICE approval (ERR_POOL_INSUFFICIENT_FUNDS); advance <= round_half_up(advance_cap_pct * scheduled) (ERR_ADVANCE_CAP_EXCEEDED); advance applicant historically_underserved (ERR_NOT_HISTORICALLY_UNDERSERVED)"
    error_id: "ERR_POOL_INSUFFICIENT_FUNDS | ERR_ADVANCE_CAP_EXCEEDED | ERR_NOT_HISTORICALLY_UNDERSERVED"
    http_status: 402
    applies_to: "obligate, modification approve, advance-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- ConservationProgram ---
  - method: POST
    path: "/eqip/programs"
    description: "Create a conservation program (status SETUP). Application windows must not overlap another program's [window_start, window_end] for the same state_code (inclusive endpoints: touching windows conflict)."
    roles: [ProgramAdmin]
    code: 201
    input: [program_name, fiscal_year, state_code, window_start, window_end, "spot_check_modulus?", "advance_cap_pct?"]
    output: ConservationProgram
    side_effects: ["status := SETUP; ranking_run_count := 0"]
  - method: GET
    path: "/eqip/programs"
    description: "List programs"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: "ConservationProgram[]"
    side_effects: []
  - method: GET
    path: "/eqip/programs/{id}"
    description: "Get one program"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: ConservationProgram
    side_effects: []
  - method: POST
    path: "/eqip/programs/{id}/open"
    description: "SETUP -> OPEN; requires at least one pool, rate, and ranking criterion"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ConservationProgram
    side_effects: ["status := OPEN"]
  - method: POST
    path: "/eqip/programs/{id}/close"
    description: "OPEN -> CLOSED (manual close; sweep also closes when clock passes window_end)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ConservationProgram
    side_effects: ["status := CLOSED"]
  - method: POST
    path: "/eqip/programs/{id}/run-ranking"
    description: "Run the ranking selection waterfall once (program must be CLOSED). Marks SCREENED_IN applications SELECTED (funded_pool_id set) or NOT_SELECTED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { ranked_count: integer, selected_count: integer, not_selected_count: integer }
    side_effects: ["ranking_selection_waterfall", "ranking_run_count := 1"]

  # --- FundingPool ---
  - method: POST
    path: "/eqip/programs/{id}/pools"
    description: "Create a funding pool (program SETUP only)"
    roles: [ProgramAdmin]
    code: 201
    input: [pool_type, allocated_cents]
    output: FundingPool
    side_effects: ["obligated_cents := 0; paid_cents := 0; available_cents := allocated_cents"]
  - method: GET
    path: "/eqip/programs/{id}/pools"
    description: "List pools of a program (FK reverse-reachability: FundingPool.program_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["pool_type?", "limit?", "offset?"]
    output: "FundingPool[]"
    side_effects: []
  - method: GET
    path: "/eqip/pools/{id}"
    description: "Get one pool (balances)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: FundingPool
    side_effects: []

  # --- PaymentScheduleRate ---
  - method: POST
    path: "/eqip/programs/{id}/rates"
    description: "Create a payment schedule rate (program SETUP only; practice_code unique per program -> ERR_DUPLICATE_RATE)"
    roles: [ProgramAdmin]
    code: 201
    input: [practice_code, unit, standard_rate_cents, hu_rate_cents, lifespan_years]
    output: PaymentScheduleRate
    side_effects: []
  - method: GET
    path: "/eqip/programs/{id}/rates"
    description: "List rates of a program (FK reverse-reachability)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["practice_code?", "limit?", "offset?"]
    output: "PaymentScheduleRate[]"
    side_effects: []

  # --- RankingCriterion ---
  - method: POST
    path: "/eqip/programs/{id}/ranking-criteria"
    description: "Create a ranking criterion (program SETUP only; criterion_code unique per program -> ERR_DUPLICATE_CRITERION)"
    roles: [ProgramAdmin]
    code: 201
    input: [criterion_code, weight, max_points]
    output: RankingCriterion
    side_effects: []
  - method: GET
    path: "/eqip/programs/{id}/ranking-criteria"
    description: "List ranking criteria (FK reverse-reachability)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "RankingCriterion[]"
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/eqip/applicants"
    description: "Register a producer (staff-side registration; historically_underserved computed from hu_category)"
    roles: [ProgramAdmin, ConservationPlanner]
    code: 201
    input: [legal_name, hu_category, parcel_ids]
    output: Applicant
    side_effects: []
  - method: GET
    path: "/eqip/applicants/{id}"
    description: "Get one applicant"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/eqip/applications"
    description: "Create DRAFT application (Applicant role: applicant_id must equal X-User-ID)"
    roles: [Applicant]
    code: 201
    input: [program_id, applicant_id, parcel_id, planned_practices, self_reported_answers]
    output: Application
    side_effects: []
  - method: GET
    path: "/eqip/applications/{id}"
    description: "Get one application"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/eqip/applications"
    description: "List/filter applications (FK reverse-reachability for program_id, applicant_id, funded_pool_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["program_id?", "applicant_id?", "funded_pool_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: POST
    path: "/eqip/applications/{id}/submit"
    description: "DRAFT -> SUBMITTED; computes provisional_score; window/rate/parcel validation"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["provisional_score computed (ranking_score variant provisional)"]
  - method: POST
    path: "/eqip/applications/{id}/withdraw"
    description: "DRAFT|SUBMITTED|SCREENED_IN -> WITHDRAWN (owner only)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/eqip/applications/{id}/screen"
    description: "SUBMITTED -> SCREENED_IN (verified_answers required; computes ranking_score and estimated_obligation_cents) or SCREENED_OUT"
    roles: [ConservationPlanner]
    code: 200
    input: [decision, "verified_answers?"]
    output: Application
    side_effects: ["verified_answers recorded; ranking_score + estimated_obligation_cents computed when SCREENED_IN"]

  # --- Contract ---
  - method: POST
    path: "/eqip/contracts"
    description: "Create DRAFT contract from a SELECTED application; copies program_id, applicant_id, pool_id := application.funded_pool_id; application -> CONTRACTED"
    roles: [ConservationPlanner]
    code: 201
    input: [application_id]
    output: Contract
    side_effects: ["application.status -> CONTRACTED"]
  - method: GET
    path: "/eqip/contracts/{id}"
    description: "Get one contract"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/eqip/contracts"
    description: "List/filter contracts (FK reverse-reachability for program_id, application_id, applicant_id, pool_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["program_id?", "application_id?", "applicant_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: POST
    path: "/eqip/contracts/{id}/practice-items"
    description: "Add a practice item while contract DRAFT; resolves rate, snapshots applicable_rate_cents, computes scheduled_amount_cents"
    roles: [ConservationPlanner]
    code: 201
    input: [practice_code, planned_quantity, implementation_deadline]
    output: ContractPracticeItem
    side_effects: ["scheduled_amount computed; contract.obligated_amount_cents recomputed; contract.version += 1"]
  - method: GET
    path: "/eqip/contracts/{id}/practice-items"
    description: "List items of a contract (FK reverse-reachability: ContractPracticeItem.contract_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContractPracticeItem[]"
    side_effects: []
  - method: POST
    path: "/eqip/contracts/{id}/obligate"
    description: "DRAFT -> OBLIGATED; reserves funds from the contract's pool; exact-fit allowed (obligated == available succeeds)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["pool.obligated_cents += obligated_amount_cents", "application.status -> OBLIGATED", "contract.version += 1"]
  - method: POST
    path: "/eqip/contracts/{id}/terminate"
    description: "OBLIGATED|MODIFICATION_PENDING|DRAFT -> TERMINATED; cascades to items, advances, requests, modification"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["items -> CANCELLED with pool release", "outstanding advances -> RETURN_DUE", "non-terminal requests -> REJECTED", "REQUESTED modification -> REJECTED"]
  - method: POST
    path: "/eqip/contracts/{id}/complete"
    description: "OBLIGATED -> COMPLETED; requires all items final, no outstanding advances, no active requests or modifications"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["residual obligation released to pool"]

  # --- ContractPracticeItem ---
  - method: GET
    path: "/eqip/practice-items/{id}"
    description: "Get one practice item"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: ContractPracticeItem
    side_effects: []
  - method: GET
    path: "/eqip/practice-items"
    description: "List/filter practice items (FK reverse-reachability for payment_schedule_rate_id; also contract_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "payment_schedule_rate_id?", "certification_status?", "payment_status?", "limit?", "offset?"]
    output: "ContractPracticeItem[]"
    side_effects: []
  - method: PATCH
    path: "/eqip/practice-items/{id}"
    description: "Edit planned_quantity and/or implementation_deadline while contract DRAFT; OCC on item version"
    roles: [ConservationPlanner]
    code: 200
    input: ["planned_quantity?", "implementation_deadline?", expected_item_version]
    output: ContractPracticeItem
    side_effects: ["scheduled_amount_cents recomputed", "contract.obligated_amount_cents recomputed", "item.version += 1"]
  - method: POST
    path: "/eqip/practice-items/{id}/report-installed"
    description: "PLANNED|CERTIFICATION_FAILED -> INSTALLED (owner applicant; contract must be OBLIGATED; deadline not passed)"
    roles: [Applicant]
    code: 200
    input: []
    output: ContractPracticeItem
    side_effects: ["item.version += 1"]
  - method: POST
    path: "/eqip/practice-items/{id}/certify"
    description: "INSTALLED -> CERTIFIED; records certified_quantity/certified_by/certified_at; creates ACTIVE MaintenanceObligation; half-open obligation-overlap check"
    roles: [ConservationPlanner]
    code: 200
    input: [certified_quantity]
    output: ContractPracticeItem
    side_effects: ["MaintenanceObligation created", "item.version += 1"]
  - method: POST
    path: "/eqip/practice-items/{id}/fail-certification"
    description: "INSTALLED -> CERTIFICATION_FAILED"
    roles: [ConservationPlanner]
    code: 200
    input: []
    output: ContractPracticeItem
    side_effects: ["item.version += 1"]

  # --- PaymentRequest ---
  - method: POST
    path: "/eqip/payment-requests"
    description: "Create payment request for a CERTIFIED item (owner applicant; contract OBLIGATED; no active request for the item; documentation required). Computes sequence_number, sampled, computed_amount_cents."
    roles: [Applicant]
    code: 201
    input: [contract_id, practice_item_id, documented_cost_cents, documentation_refs]
    output: PaymentRequest
    side_effects: ["sequence_number assigned", "sampled computed", "computed_amount_cents computed"]
  - method: GET
    path: "/eqip/payment-requests/{id}"
    description: "Get one payment request"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: []
  - method: GET
    path: "/eqip/payment-requests"
    description: "List/filter payment requests (FK reverse-reachability for program_id, contract_id, practice_item_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["program_id?", "contract_id?", "practice_item_id?", "status?", "limit?", "offset?"]
    output: "PaymentRequest[]"
    side_effects: []
  - method: POST
    path: "/eqip/payment-requests/{id}/review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [PaymentOfficer]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: []
  - method: POST
    path: "/eqip/payment-requests/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED; segregation: approver != item certifier"
    roles: [PaymentOfficer]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: ["reviewed_by_user_id recorded"]
  - method: POST
    path: "/eqip/payment-requests/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [PaymentOfficer]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: []
  - method: POST
    path: "/eqip/payment-requests/{id}/disburse"
    description: "APPROVED -> DISBURSED; gates: sampled -> PASSED spot check; certification freshness <= 365d. Moves pool funds, applies advance offset, pays item."
    roles: [PaymentOfficer]
    code: 200
    input: []
    output: PaymentRequest
    side_effects: ["pool.obligated_cents/paid_cents moved per certified_payment", "advance offset applied (advance -> CLOSED or RETURN_DUE)", "item.payment_status -> PAID", "contract.paid_amount_cents += computed_amount_cents", "contract.version += 1"]

  # --- AdvancePayment ---
  - method: POST
    path: "/eqip/contracts/{id}/advance-payments"
    description: "Issue HU advance: applicant HU, contract OBLIGATED, item PLANNED, amount <= 50% cap (exact allowed), no prior advance for the item, no outstanding advance on the contract"
    roles: [PaymentOfficer]
    code: 201
    input: [practice_item_id, issued_cents]
    output: AdvancePayment
    side_effects: ["pool.obligated_cents -= issued_cents; pool.paid_cents += issued_cents", "item.payment_status UNPAID -> ADVANCE_HELD", "issued_at := clock; expenditure_due_date := clock + 90 days"]
  - method: GET
    path: "/eqip/contracts/{id}/advance-payments"
    description: "List advances of a contract (FK reverse-reachability: AdvancePayment.contract_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "AdvancePayment[]"
    side_effects: []
  - method: GET
    path: "/eqip/advance-payments/{id}"
    description: "Get one advance"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: AdvancePayment
    side_effects: []
  - method: GET
    path: "/eqip/advance-payments"
    description: "List/filter advances (FK reverse-reachability for applicant_id, practice_item_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "applicant_id?", "practice_item_id?", "status?", "limit?", "offset?"]
    output: "AdvancePayment[]"
    side_effects: []
  - method: POST
    path: "/eqip/advance-payments/{id}/return"
    description: "Applicant returns exactly the outstanding amount (ISSUED or RETURN_DUE -> CLOSED); restores pool.paid_cents"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: AdvancePayment
    side_effects: ["returned_cents += amount_cents; outstanding -> 0; status -> CLOSED; pool.paid_cents -= amount_cents"]

  # --- ContractModification ---
  - method: POST
    path: "/eqip/contracts/{id}/modifications"
    description: "Request a modification (owner applicant; contract OBLIGATED -> MODIFICATION_PENDING). Kind-specific required fields. EXTEND_DEADLINE bounds are validated at request: new_deadline must be > item.implementation_deadline and <= item.implementation_deadline + 365 days (ERR_EXTENSION_TOO_LONG), and item must be in {PLANNED, INSTALLED, CERTIFICATION_FAILED} (ERR_ITEM_NOT_EXTENDABLE); a failed request leaves the contract OBLIGATED. The clock-based window check (clock <= current deadline) is re-evaluated at approve time (ERR_EXTENSION_WINDOW_CLOSED)."
    roles: [Applicant]
    code: 201
    input: [kind, "practice_item_id?", "new_deadline?", "new_practice_code?", "new_quantity?"]
    output: ContractModification
    side_effects: ["contract.status -> MODIFICATION_PENDING", "contract.version += 1"]
  - method: GET
    path: "/eqip/contracts/{id}/modifications"
    description: "List modifications of a contract (FK reverse-reachability: ContractModification.contract_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContractModification[]"
    side_effects: []
  - method: GET
    path: "/eqip/modifications/{id}"
    description: "Get one modification"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: ContractModification
    side_effects: []
  - method: GET
    path: "/eqip/modifications"
    description: "List/filter modifications (FK reverse-reachability for practice_item_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "practice_item_id?", "kind?", "status?", "limit?", "offset?"]
    output: "ContractModification[]"
    side_effects: []
  - method: POST
    path: "/eqip/modifications/{id}/approve"
    description: "Approve REQUESTED modification; OCC expected_contract_version; kind-specific effects; contract -> OBLIGATED"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version]
    output: ContractModification
    side_effects: ["kind effects (extend/add/drop) per Contract transition", "contract.status -> OBLIGATED", "increments Contract.version by 1"]
  - method: POST
    path: "/eqip/modifications/{id}/reject"
    description: "Reject REQUESTED modification; OCC expected_contract_version; contract -> OBLIGATED"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version]
    output: ContractModification
    side_effects: ["modification.status -> REJECTED", "contract.status -> OBLIGATED", "increments Contract.version by 1"]

  # --- SpotCheck ---
  - method: POST
    path: "/eqip/spot-checks"
    description: "QA officer opens a spot check on a contract practice item (optionally linked to a payment request); creator becomes inspector_user_id; item must be CERTIFIED (ERR_ITEM_NOT_CERTIFIED) and belong to contract_id; payment_request_id if present must belong to the item"
    roles: [QualityAssuranceOfficer]
    code: 201
    input: [contract_id, practice_item_id, "payment_request_id?"]
    output: SpotCheck
    side_effects: ["inspector_user_id := actor X-User-ID"]
  - method: GET
    path: "/eqip/spot-checks/{id}"
    description: "Get one spot check"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: SpotCheck
    side_effects: []
  - method: GET
    path: "/eqip/spot-checks"
    description: "List/filter spot checks (FK reverse-reachability for contract_id, practice_item_id, payment_request_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "practice_item_id?", "payment_request_id?", "status?", "limit?", "offset?"]
    output: "SpotCheck[]"
    side_effects: []
  - method: POST
    path: "/eqip/spot-checks/{id}/record-result"
    description: "PENDING -> PASSED | FAILED (actor must be the inspector and != item certifier). FAIL on a DISBURSED linked request fires the 4-hop revocation cascade."
    roles: [QualityAssuranceOfficer]
    code: 200
    input: [result, "failure_reason?"]
    output: SpotCheck
    side_effects: ["FAIL + DISBURSED linked request -> request REVOKED -> item CERTIFICATION_REVOKED + RECOUPMENT_PENDING -> obligation VOID -> RecoupmentDemand created"]

  # --- MaintenanceObligation ---
  - method: GET
    path: "/eqip/maintenance-obligations/{id}"
    description: "Get one maintenance obligation"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: MaintenanceObligation
    side_effects: []
  - method: GET
    path: "/eqip/maintenance-obligations"
    description: "List/filter obligations (FK reverse-reachability for contract_id, practice_item_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "practice_item_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceObligation[]"
    side_effects: []
  - method: POST
    path: "/eqip/maintenance-obligations/{id}/report-violation"
    description: "ACTIVE -> VIOLATION_REVIEW"
    roles: [ConservationPlanner]
    code: 200
    input: []
    output: MaintenanceObligation
    side_effects: ["reported_by_user_id recorded"]
  - method: POST
    path: "/eqip/maintenance-obligations/{id}/confirm-violation"
    description: "VIOLATION_REVIEW -> VIOLATION_CONFIRMED; confirmer != reporter; creates RecoupmentDemand = item.paid_amount_cents (when > 0); item PAID -> RECOUPMENT_PENDING"
    roles: [QualityAssuranceOfficer]
    code: 200
    input: []
    output: MaintenanceObligation
    side_effects: ["RecoupmentDemand created when paid_amount_cents > 0", "item.payment_status -> RECOUPMENT_PENDING"]
  - method: POST
    path: "/eqip/maintenance-obligations/{id}/dismiss-violation"
    description: "VIOLATION_REVIEW -> ACTIVE"
    roles: [QualityAssuranceOfficer]
    code: 200
    input: []
    output: MaintenanceObligation
    side_effects: []

  # --- RecoupmentDemand ---
  - method: GET
    path: "/eqip/recoupment-demands/{id}"
    description: "Get one recoupment demand"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: []
    output: RecoupmentDemand
    side_effects: []
  - method: GET
    path: "/eqip/recoupment-demands"
    description: "List/filter demands (FK reverse-reachability for contract_id, maintenance_obligation_id, advance_payment_id, payment_request_id)"
    roles: [ProgramAdmin, ConservationPlanner, PaymentOfficer, QualityAssuranceOfficer, Applicant]
    code: 200
    input: ["contract_id?", "maintenance_obligation_id?", "advance_payment_id?", "payment_request_id?", "status?", "limit?", "offset?"]
    output: "RecoupmentDemand[]"
    side_effects: []
  - method: POST
    path: "/eqip/recoupment-demands/{id}/pay"
    description: "Applicant pays exactly amount_cents; restores pool.paid_cents; item RECOUPMENT_PENDING -> RECOUPED; advance-linked demands close the advance"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: RecoupmentDemand
    side_effects: ["pool.paid_cents -= amount_cents", "item -> RECOUPED", "advance -> CLOSED when advance-sourced"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock runs the deadline sweep: program auto-close (clock > window_end), item EXPIRED (clock > implementation_deadline), advance RETURN_DUE (clock > expenditure_due_date) and ESCALATED (clock > due + 30d, spawns RecoupmentDemand), obligation SATISFIED (clock >= end_date), demand ESCALATED (clock > due_date). Clock may only move forward (ERR_INVALID_REQUEST on regression)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sweep transitions per §1.2 system-sweep triggers"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / request shape ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-Role or X-User-ID header missing or X-User-Role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_APPLICANT_NOT_OWNER, http: 403, condition: "Applicant-role actor's X-User-ID does not match the resource's owning applicant_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ mistyped required field, invalid enum, empty planned_practices, unknown criterion key, modification kind-specific field missing, clock regression, or result=FAIL without failure_reason" }
  # --- existence ---
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "programId (path) or program_id (body) does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "poolId does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "applicantId (path) or applicant_id (body) does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "applicationId (path) or application_id (body) does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contractId (path) or contract_id (body) does not exist" }
  - { id: ERR_PRACTICE_ITEM_NOT_FOUND, http: 404, condition: "itemId (path) or practice_item_id (body) does not exist" }
  - { id: ERR_PAYMENT_REQUEST_NOT_FOUND, http: 404, condition: "requestId (path) or payment_request_id (body) does not exist" }
  - { id: ERR_ADVANCE_PAYMENT_NOT_FOUND, http: 404, condition: "advanceId does not exist" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "modificationId does not exist" }
  - { id: ERR_SPOT_CHECK_NOT_FOUND, http: 404, condition: "spotCheckId does not exist" }
  - { id: ERR_MAINTENANCE_OBLIGATION_NOT_FOUND, http: 404, condition: "obligationId does not exist" }
  - { id: ERR_RECOUPMENT_DEMAND_NOT_FOUND, http: 404, condition: "demandId does not exist" }
  # --- state ---
  - { id: ERR_PROGRAM_NOT_IN_SETUP, http: 409, condition: "Pool/rate/criterion creation requires program SETUP" }
  - { id: ERR_PROGRAM_INCOMPLETE_CONFIG, http: 409, condition: "open requires >= 1 pool, >= 1 rate, >= 1 ranking criterion" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Application submit requires program OPEN (incl. already auto-closed by sweep)" }
  - { id: ERR_PROGRAM_NOT_CLOSED, http: 409, condition: "run-ranking requires program CLOSED" }
  - { id: ERR_RANKING_ALREADY_RUN, http: 409, condition: "ranking_run_count != 0" }
  - { id: ERR_APPLICATION_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires DRAFT, SUBMITTED, or SCREENED_IN" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "screen requires SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_SELECTED, http: 409, condition: "contract creation requires application SELECTED" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "item add / item PATCH / second obligate require contract DRAFT" }
  - { id: ERR_CONTRACT_EMPTY, http: 409, condition: "obligate requires >= 1 practice item" }
  - { id: ERR_CONTRACT_NOT_OBLIGATED, http: 409, condition: "modification request or advance issuance requires contract OBLIGATED" }
  - { id: ERR_CONTRACT_NOT_MODIFIABLE, http: 409, condition: "modification approve/reject requires contract MODIFICATION_PENDING" }
  - { id: ERR_CONTRACT_NOT_PAYABLE, http: 409, condition: "payment request / report-installed requires contract OBLIGATED (not MODIFICATION_PENDING, COMPLETED, TERMINATED, or DRAFT)" }
  - { id: ERR_ITEMS_NOT_FINAL, http: 409, condition: "complete requires every item terminal (CERTIFIED+PAID/RECOUPED, CANCELLED, or EXPIRED)" }
  - { id: ERR_PENDING_MODIFICATION_EXISTS, http: 409, condition: "complete blocked while a modification is REQUESTED" }
  - { id: ERR_ITEM_NOT_INSTALLABLE, http: 409, condition: "report-installed requires certification_status PLANNED or CERTIFICATION_FAILED" }
  - { id: ERR_ITEM_NOT_INSTALLED, http: 409, condition: "certify / fail-certification require INSTALLED" }
  - { id: ERR_ITEM_NOT_CERTIFIED, http: 409, condition: "payment request requires item CERTIFIED" }
  - { id: ERR_ITEM_NOT_EXTENDABLE, http: 409, condition: "EXTEND_DEADLINE requires item certification_status in {PLANNED, INSTALLED, CERTIFICATION_FAILED}" }
  - { id: ERR_ITEM_NOT_PLANNED, http: 409, condition: "Advance issuance requires item certification_status PLANNED" }
  - { id: ERR_REQUEST_NOT_SUBMITTED, http: 409, condition: "review requires SUBMITTED" }
  - { id: ERR_REQUEST_NOT_UNDER_REVIEW, http: 409, condition: "approve / reject require UNDER_REVIEW" }
  - { id: ERR_REQUEST_NOT_APPROVED, http: 409, condition: "disburse requires APPROVED" }
  - { id: ERR_ADVANCE_NOT_RETURNABLE, http: 409, condition: "return requires advance ISSUED or RETURN_DUE" }
  - { id: ERR_MODIFICATION_NOT_REQUESTED, http: 409, condition: "approve / reject require modification REQUESTED" }
  - { id: ERR_SPOT_CHECK_NOT_PENDING, http: 409, condition: "record-result requires PENDING" }
  - { id: ERR_INSPECTOR_MISMATCH, http: 403, condition: "record-result actor must equal inspector_user_id" }
  - { id: ERR_OBLIGATION_NOT_ACTIVE, http: 409, condition: "report-violation requires ACTIVE" }
  - { id: ERR_OBLIGATION_NOT_IN_REVIEW, http: 409, condition: "confirm / dismiss require VIOLATION_REVIEW" }
  - { id: ERR_DEMAND_NOT_PAYABLE, http: 409, condition: "pay requires DEMANDED or ESCALATED" }
  - { id: ERR_DISBURSED_PAYMENTS_EXIST, http: 409, condition: "terminate blocked while any request is DISBURSED" }
  # --- business ---
  - { id: ERR_RATE_NOT_FOUND, http: 422, condition: "No PaymentScheduleRate for a requested practice_code in the program" }
  - { id: ERR_DUPLICATE_RATE, http: 409, condition: "A rate for this practice_code already exists in the program" }
  - { id: ERR_DUPLICATE_CRITERION, http: 409, condition: "A criterion with this criterion_code already exists in the program" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New program's [window_start, window_end] intersects (inclusive) another program's window for the same state_code" }
  - { id: ERR_OBLIGATION_OVERLAP, http: 409, condition: "Certification would overlap (half-open) an ACTIVE/VIOLATION_REVIEW obligation on the same parcel and practice_code" }
  - { id: ERR_PARCEL_NOT_REGISTERED, http: 422, condition: "application.parcel_id is not an element of applicant.parcel_ids" }
  - { id: ERR_PRACTICE_NOT_IN_APPLICATION, http: 422, condition: "Item practice_code absent from the source application's planned_practices" }
  - { id: ERR_QUANTITY_EXCEEDS_APPLICATION, http: 422, condition: "Item planned_quantity exceeds the quantity planned for that code in the application" }
  - { id: ERR_CERTIFIED_QUANTITY_INVALID, http: 422, condition: "certified_quantity < 1 or > planned_quantity" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "report-installed / certify with clock > implementation_deadline" }
  - { id: ERR_CERTIFICATION_STALE, http: 409, condition: "disburse with clock > certified_at + 365 days" }
  - { id: ERR_SPOT_CHECK_REQUIRED, http: 409, condition: "sampled request lacks a linked PASSED spot check at disburse" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user on both sides of a segregated pair (certify/approve, certify/spot-check, report/confirm)" }
  - { id: ERR_NOT_HISTORICALLY_UNDERSERVED, http: 422, condition: "Advance payment requires applicant.historically_underserved == true" }
  - { id: ERR_ADVANCE_CAP_EXCEEDED, http: 422, condition: "issued_cents > round_half_up(advance_cap_pct * scheduled_amount_cents)" }
  - { id: ERR_ADVANCE_ALREADY_ISSUED, http: 409, condition: "The practice item already has an advance (any status)" }
  - { id: ERR_ADVANCE_OUTSTANDING, http: 409, condition: "Contract has an advance with outstanding_cents > 0 (blocks new advance and contract completion)" }
  - { id: ERR_PAYMENT_REQUEST_ACTIVE, http: 409, condition: "Item already has a request in SUBMITTED, UNDER_REVIEW, APPROVED, or DISBURSED" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 422, condition: "documentation_refs empty" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "EXTEND_DEADLINE approved after the current implementation_deadline has passed" }
  - { id: ERR_EXTENSION_TOO_LONG, http: 422, condition: "new_deadline > implementation_deadline + 365 days, or new_deadline <= implementation_deadline" }
  - { id: ERR_RETURN_AMOUNT_MISMATCH, http: 422, condition: "advance return amount_cents != outstanding_cents" }
  - { id: ERR_REPAYMENT_AMOUNT_MISMATCH, http: 422, condition: "demand payment amount_cents != demand.amount_cents" }
  - { id: ERR_POOL_INSUFFICIENT_FUNDS, http: 402, condition: "obligate / ADD_PRACTICE approval would exceed pool.available_cents" }
  # --- concurrency ---
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != contract.version" }
  - { id: ERR_STALE_ITEM_VERSION, http: 412, condition: "expected_item_version != item.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "NRCS state office administrator: configures programs, pools, rates, criteria; opens/closes windows; runs ranking; obligates, terminates, completes contracts; adjudicates modifications; operates the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /eqip/programs, /open, /close, /run-ranking"
      - "POST /eqip/programs/{id}/pools, /rates, /ranking-criteria"
      - "POST /eqip/contracts/{id}/obligate, /terminate, /complete"
      - "POST /eqip/modifications/{id}/approve, /reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /eqip/applicants (with ConservationPlanner)"
      - "All GET endpoints (read-all staff access)"
  - name: ConservationPlanner
    description: "Field office planner: registers applicants, screens applications, builds contracts and practice items, certifies or fails installations, reports maintenance violations."
    identity: opaque
    exclusive_operations:
      - "POST /eqip/applications/{id}/screen"
      - "POST /eqip/contracts and /eqip/contracts/{id}/practice-items"
      - "PATCH /eqip/practice-items/{id}"
      - "POST /eqip/practice-items/{id}/certify, /fail-certification"
      - "POST /eqip/maintenance-obligations/{id}/report-violation"
    shared_operations:
      - "POST /eqip/applicants (with ProgramAdmin)"
      - "All GET endpoints"
  - name: PaymentOfficer
    description: "Financial specialist: reviews/approves/rejects/disburse payment requests and issues HU advance payments. May never certify (segregation)."
    identity: opaque
    exclusive_operations:
      - "POST /eqip/payment-requests/{id}/review, /approve, /reject, /disburse"
      - "POST /eqip/contracts/{id}/advance-payments"
    shared_operations:
      - "All GET endpoints"
  - name: QualityAssuranceOfficer
    description: "QA inspector: opens spot checks and records results (must differ from the certifier); confirms or dismisses maintenance violations (confirmer must differ from reporter)."
    identity: opaque
    exclusive_operations:
      - "POST /eqip/spot-checks, /eqip/spot-checks/{id}/record-result"
      - "POST /eqip/maintenance-obligations/{id}/confirm-violation, /dismiss-violation"
    shared_operations:
      - "All GET endpoints"
  - name: Applicant
    description: "Producer: owns applications, reports installation, requests payments and modifications, returns advances, pays recoupment demands. X-User-ID must equal the Applicant entity id."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /eqip/applications, /submit, /withdraw"
      - "POST /eqip/practice-items/{id}/report-installed"
      - "POST /eqip/payment-requests"
      - "POST /eqip/contracts/{id}/modifications"
      - "POST /eqip/advance-payments/{id}/return"
      - "POST /eqip/recoupment-demands/{id}/pay"
    shared_operations:
      - "All GET endpoints (ownership not enforced on reads)"
