            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Boundary Bea", date_of_birth: "1986-06-06", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500000 }, as: MembershipOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/members/${m1}/tier-review", as: OperationsOfficer, captures: { tier: "$.data.tier", tenure: "$.data.tenure_months", } }
          assert:
            - "tenure == 12 (2025-07-01 -> 2026-07-01, exact anniversary counts)"
            - "tier == SELECT (balance boundary 500,000 >= 500,000 and tenure 12 >= 12)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: share_account_open_gated_by_member_status
        grounds:
          - state_machines.ShareAccount.OPEN_to_CLOSED
          - state_machines.Member
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (ShareAccount -> Member): account opening is gated on the Member being
          ACTIVE; the same request fails in GRACE_PERIOD and succeeds after a late cure
          returns the member to ACTIVE.
        test_recipe:
          setup:
            - "Member approved 2026-07-01; review flagged by co-1, confirmed by co-2 on 2026-08-01 -> GRACE_PERIOD (grace_end 2026-10-30); member has no share accounts yet"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Gated Gail", date_of_birth: "1994-04-04", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev1: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500 }, as: MembershipOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev2: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev2}/cure", payload: { resolution_note: "documents re-verified" }, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500 }, as: MembershipOfficer, captures: { acct: "$.data.id", acct_status: "$.data.status" } }
          assert:
            - "err == ERR_MEMBER_NOT_ACTIVE while GRACE_PERIOD"
            - "after late cure the member is ACTIVE and the second open succeeds: acct_status == OPEN with balance_cents == 500 (par boundary)"

      - name: product_enrollment_gated_by_member_tier
        grounds:
          - entities.ProductEnrollment.fields.required_tier
          - calculations.member_tier_evaluation
          - errors[ERR_TIER_REQUIREMENT_NOT_MET]
        distinguishing_aspect: |
          Pair (ProductEnrollment -> Member), distinct from (ShareAccount -> Member):
          enrollment evaluates the member's tier cross-entity at enrollment time; a
          balance-rich but tenure-poor member is denied while a tenured member with the
          same product succeeds.
        test_recipe:
          setup:
            - "Member A approved 2026-07-15, PRIMARY 600,000 (tenure 0 at evaluation)"
            - "Member B approved 2025-07-01, PRIMARY 500,000 (tenure 13 at evaluation on 2026-08-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Tenured Tom", date_of_birth: "1984-04-04", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appB: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appB}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mB: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${mB}", account_type: "PRIMARY", initial_deposit_cents: 500000 }, as: MembershipOfficer, captures: { acctB: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Rich Rick", date_of_birth: "1996-06-06", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appA: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appA}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mA: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${mA}", account_type: "PRIMARY", initial_deposit_cents: 600000 }, as: MembershipOfficer, captures: { acctA: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/product-enrollments", payload: { member_id: "${mA}", product_code: "MONEY_MARKET", funding_share_account_id: "${acctA}" }, as: MembershipOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/product-enrollments", payload: { member_id: "${mB}", product_code: "MONEY_MARKET", funding_share_account_id: "${acctB}" }, as: MembershipOfficer, captures: { enrB: "$.data.id", tierB: "$.data.tier_at_enrollment" } }
          assert:
            - "err == ERR_TIER_REQUIREMENT_NOT_MET (403) for member A: balance 600,000 qualifies but tenure 0 < 12 forces STANDARD"
            - "tierB == SELECT and enrollment ${enrB} is created with status ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: dividend_period_closed_interval_overlap_vs_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_DIVIDEND_PERIOD_OVERLAP]
          - entities.DividendDeclaration.fields.period_end
        distinguishing_aspect: |
          Closed-interval semantics on DividendDeclaration periods: [2026-07-31, ...]
          overlaps [2026-07-01, 2026-07-31] because 07-31 is inside both (inclusive ends),
          while [2026-08-01, 2026-08-31] is merely adjacent and MUST be accepted.
        test_recipe:
          setup:
            - "Declaration D1 DECLARED for 2026-07-01..2026-07-31"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id" } }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-31", period_end: "2026-08-15", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-20" }, as: BoardDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-08-01", period_end: "2026-08-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-09-05" }, as: BoardDirector, captures: { decl3: "$.data.id", st3: "$.data.status" } }
          assert:
            - "err == ERR_DIVIDEND_PERIOD_OVERLAP (shared endpoint day 2026-07-31 counts as overlap)"
            - "st3 == DECLARED for ${decl3} (adjacency period_start = prior period_end + 1 day is allowed)"

      - name: meeting_minimum_gap_strict_vs_exact_30_days
        grounds:
          - validations[priority=11]
          - errors[ERR_MEETING_TOO_CLOSE]
          - entities.AnnualMeeting.fields.meeting_date
        distinguishing_aspect: |
          Different interval semantics than the dividend closed-interval overlap and a
          different resource (AnnualMeeting): a strict minimum gap of 30 days between
          meeting dates — 29 days apart is rejected, exactly 30 days apart is accepted.
        test_recipe:
          setup:
            - "Meeting M1 scheduled for 2026-09-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-09-15", record_date: "2026-08-20", voting_open_date: "2026-08-25", quorum_threshold: 1 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
          trigger:
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-10-14", record_date: "2026-09-20", voting_open_date: "2026-09-25", quorum_threshold: 1 }, as: BoardDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-10-15", record_date: "2026-09-20", voting_open_date: "2026-09-25", quorum_threshold: 1 }, as: BoardDirector, captures: { mtg3: "$.data.id", st3: "$.data.status" } }
          assert:
            - "err == ERR_MEETING_TOO_CLOSE (2026-10-14 is 29 days after 2026-09-15; gap < 30)"
            - "st3 == SCHEDULED for ${mtg3} (2026-10-15 is exactly 30 days after; >= boundary allowed)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: declare_then_void_conserves_share_balances
        grounds:
          - state_machines.DividendDeclaration.DECLARED_to_VOIDED
          - calculations.dividend_accrual
          - entities.ShareAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = money: declaration + accrual followed by void MUST leave
          SUM(ShareAccount.balance_cents) unchanged (accrual never moves money), and zero
          payment rows may remain in a non-VOIDED state; the voided period is freed for
          re-declaration because the overlap check ignores VOIDED declarations.
        test_recipe:
          setup:
            - "Member approved 2026-06-15; PRIMARY 100,000 constant through July (accrual 510 cents at 600 bps ADB)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Conserve Kay", date_of_birth: "1989-09-09", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/share-accounts/${acct1}", as: BoardDirector, captures: { bal_before: "$.data.balance_cents" } }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id", pool1: "$.data.declared_pool_cents" } }
            - { call: "POST /credit-union/dividend-declarations/${decl1}/void", as: BoardDirector, captures: { st_void: "$.data.status" } }
            - { call: "GET /credit-union/dividend-declarations/${decl1}/payments", as: BoardDirector, captures: { pay_status: "$.data[0].status" } }
            - { call: "GET /credit-union/share-accounts/${acct1}", as: BoardDirector, captures: { bal_after: "$.data.balance_cents" } }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "MINIMUM_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl2: "$.data.id", st2: "$.data.status" } }
          assert:
            - "pool1 == 510 and st_void == VOIDED and pay_status == VOIDED"
            - "bal_before == 100000 and bal_after == 100000 (SUM of share balances conserved across declare+void)"
            - "st2 == DECLARED for ${decl2} (VOIDED declarations do not block re-declaration of the same period)"

      - name: adjourn_reconvene_conserves_distinct_voter_count
        grounds:
          - state_machines.AnnualMeeting.ADJOURNED_NO_QUORUM_to_SCHEDULED
          - calculations.quorum_and_tally
          - errors[ERR_BALLOT_ALREADY_CAST_IN_CHAIN]
        distinguishing_aspect: |
          Conserved quantity = distinct-voter count (not money): adjournment followed by
          reconvene MUST neither lose nor duplicate ballots — the adjourned meeting's
          snapshot stays 2, a re-cast attempt on the successor is rejected, and the chain
          tally counts each member exactly once (2 + 1 new = 3).
        test_recipe:
          setup:
            - "Three members approved 2026-07-01; meeting M1 (record 2026-07-05, voting_open 2026-07-10, meeting 2026-07-20, quorum 3); Ava (FOR_SLATE_A) and Ben (ABSTAIN) cast on M1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ava", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appA: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appA}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mA: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ben", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appB: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appB}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mB: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Cy", date_of_birth: "1990-03-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appC: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appC}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mC: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 3 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${mA}" }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "ABSTAIN" }, as: Member, as_user_id: "${mB}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { st1: "$.data.status", bc1: "$.data.ballots_counted" } }
          trigger:
            - { call: "POST /credit-union/annual-meetings/${mtg1}/reconvene", payload: { meeting_date: "2026-07-25", voting_open_date: "2026-07-16" }, as: BoardDirector, captures: { mtg2: "$.data.id" } }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg2}", choice: "FOR_SLATE_B" }, as: Member, as_user_id: "${mA}", captures: { dup_err: "$.data.error_id" } }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg2}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${mC}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg2}/close-and-tally", as: BoardDirector, captures: { st2: "$.data.status", bc2: "$.data.ballots_counted", va2: "$.data.votes_for_slate_a", vab2: "$.data.votes_abstain" } }
            - { call: "GET /credit-union/annual-meetings/${mtg1}", as: BoardDirector, captures: { bc1_after: "$.data.ballots_counted", st1_after: "$.data.status" } }
          assert:
            - "st1 == ADJOURNED_NO_QUORUM and bc1 == 2 before reconvene"
            - "dup_err == ERR_BALLOT_ALREADY_CAST_IN_CHAIN (chain-wide uniqueness compensates the carry-over)"
            - "bc1_after == 2 and st1_after == ADJOURNED_NO_QUORUM (adjourned snapshot is immutable; reconvene did not rewrite history)"
            - "st2 == HELD, bc2 == 3, va2 == 2, vab2 == 1 (distinct-voter count conserved: 2 carried + 1 new, zero duplicates)"
