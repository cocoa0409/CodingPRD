            - "AuthorizationLetter.${loa_pending_id}.status == ACTIVE and Member.${m_pending_id}.enrollment_status == PENDING are both unchanged"
            - "After activating the member, the identical request returns ERR_INVALID_CASE_QUANTITY with 422 — proving rule 29 was reachable and merely outranked"

      - name: p16_claim_not_reconciled_beats_p41_member_payout_held
        grounds:
