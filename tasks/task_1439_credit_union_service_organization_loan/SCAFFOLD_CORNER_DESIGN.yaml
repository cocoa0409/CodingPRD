            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /network/sweeps/run", payload: {}, as: NetworkAdmin, captures: { late: "$.data.remittances_marked_late", esc: "$.data.exceptions_escalated", exp: "$.data.offerings_expired" } }
          assert:
            - "late == 0 and esc == 0 and exp == 0"

      - name: offering_remaining_principal_derived_after_commit
        claim_type: derived_field_reconciliation
        grounds: ["entities.ParticipationOffering.fields.remaining_principal_cents", "calculations.concentration_share"]
        distinguishing_aspect: "After a 20,000,000 commitment into a 100,000,000 pool, the offering's committed_principal_cents == 20,000,000 and remaining_principal_cents == 80,000,000 (recomputed on the write, immediate)."
        test_recipe:
