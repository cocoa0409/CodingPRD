      \ gate and the credit-limit gate\n(total 12500c vs limit 1000c); ERR_RX_AUTHORIZATION_REQUIRED\n(priority 5) MUST win over ERR_CREDIT_LIMIT_EXCEEDED (priority 7.1).\n"
    test_recipe:
