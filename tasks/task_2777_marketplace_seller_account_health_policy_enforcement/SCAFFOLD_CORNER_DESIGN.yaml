            - call: "POST /sellers/${s_id}/health-evaluations"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { ev_id: $.data.id, ev_tier: $.data.metric_tier }
          assert:
            - "the four denials: HTTP 403 and ${e_rule_inv}, ${e_snap_inv}, ${e_credit_inv}, ${e_link_ar} are ERR_UNAUTHORIZED"
            - "${e_link_ar} is ERR_UNAUTHORIZED and not ERR_LINK_NOT_FOUND"
            - "no PolicyRule LA-RB4-1 exists; exactly one MetricSnapshot (${snap1}) exists; Seller.${s_id}.available_balance_cents == 0"
            - "the last call: HTTP 201, ${ev_tier} == HEALTHY and health_score == 100.00 — health evaluation is shared with the investigator"

      - name: rbac_registration_is_anonymous_only_and_anonymous_cannot_read
        claim_type: exclusive_operations
        grounds:
          - "roles.Anonymous.exclusive_operations"
          - "roles.Anonymous.shared_operations"
          - "endpoints[POST /sellers].roles"
        distinguishing_aspect: |
          Anonymous is an inverted role: it holds exactly one operation and shares none, so the
          registration endpoint refuses every authenticated role while every other endpoint refuses
          Anonymous. That asymmetry is easy to get wrong by treating Anonymous as a permissive
          fallback that can also read the public rulebook — it cannot read anything at all.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one policy rule exists so the read probe has data to leak."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-RB5-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rb5: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Officer Registered LLC", email: "ops@officer-registered.example", tax_id_hash: "TAX-OR-0001", payout_bank_token: "BANK-OR-0001", address_fingerprint: "ADDR-OR-0001" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_reg_co: $.data.error_id }
            - call: "POST /sellers"
              payload: { legal_name: "Seller Registered LLC", email: "ops@seller-registered.example", tax_id_hash: "TAX-SR-0001", payout_bank_token: "BANK-SR-0001", address_fingerprint: "ADDR-SR-0001" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e_reg_seller: $.data.error_id }
            - call: "GET /policy-rules"
              payload: {}
              as: Anonymous
              captures: { e_read_rules: $.data.error_id }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: Anonymous
              captures: { e_read_seller: $.data.error_id }
          assert:
            - "all four triggers: HTTP 403 with ERR_UNAUTHORIZED"
            - "${e_reg_co} and ${e_reg_seller} are ERR_UNAUTHORIZED — registration is Anonymous-exclusive even for the strongest role"
            - "${e_read_rules} and ${e_read_seller} are ERR_UNAUTHORIZED — Anonymous shares no read"
            - "GET /sellers as ComplianceOfficer returns total_count 1 — only the Anonymous registration created a row"

      - name: rbac_operator_reads_are_shared_except_two_asymmetric_paths
