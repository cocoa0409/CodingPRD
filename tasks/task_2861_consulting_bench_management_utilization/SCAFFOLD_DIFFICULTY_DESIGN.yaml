# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_2861_consulting_bench_management_utilization
#
# §1.8 Test Targeting Index for SCAFFOLD.yaml. Every instance grounds only in elements
# already declared in §1.1–§1.7 of SCAFFOLD.yaml; deleting this file leaves the declared
# behaviour identical.
#
# Calendar facts used by the pinned literals (all verified by code):
#   2026-08-03 Mon, 2026-08-10 Mon, 2026-08-16 Sun, 2026-08-17 Mon, 2026-08-28 Fri,
#   2026-08-29 Sat, 2026-08-31 Mon, 2026-09-01 Tue, 2026-09-14 Mon, 2026-09-15 Tue.
#   Mon–Fri counts: [08-03,08-29) = 20; [08-03,08-17) = 10; [08-17,08-31) = 10;
#   [08-03,08-10) = 5; [08-03,08-11) = 6; [09-01,09-15) = 10; inclusive 08-03..08-28 = 20.
# Logical clock default is 2026-08-01T00:00:00Z; every instance sets it explicitly.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: utilization_dual_basis_diverges_on_holiday_period
        grounds:
          - calculations.utilization_period_metrics
          - calculations.utilization_period_metrics.variants.TARGET_BASIS
          - calculations.utilization_period_metrics.variants.AVAILABLE_BASIS
          - entities.UtilizationPeriod.fields.utilization_pct_target_basis
          - entities.UtilizationPeriod.fields.utilization_pct_available_basis
          - entities.UtilizationPeriod.fields.utilization_pct_of_record
          - entities.UtilizationPeriod.fields.variance_pp
          - state_machines.UtilizationPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          This instance carries the dual variant on the CONSULTANT TIME-CAPACITY domain
          (UtilizationPeriod hour buckets): the same 96.00 billable hours report 60.00 on
          TARGET_BASIS and 63.16 on AVAILABLE_BASIS purely because 8.00 holiday hours leave
          the capacity denominator but stay in the target denominator.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One PracticeGroup 'Cloud NA' (geography NA, level_targets omitted so CONSULTANT falls back to target_utilization_pct 75.00)."
            - "One CONSULTANT-level consultant with cost_rate 120.00, holding an ACTIVE proficiency-4 assertion on the demand's skill."
            - "One QUALIFIED, INTERNAL demand 2026-08-03..2026-08-28, standard 250.00 / requested 240.00."
            - "One CONFIRMED BILLABLE assignment at 60.00% over the HALF-OPEN interval [2026-08-03, 2026-08-29), i.e. all 20 workdays of the period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: FinanceController
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00, travel_max_nights_per_week: 3 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 60.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
          trigger:
            - call: "POST /consultants/${c1_id}/utilization-periods"
              payload: { period_start_on: "2026-08-03", period_end_on: "2026-08-28", holiday_hours: 8.00 }
              as: FinanceController
              captures: { up1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: FinanceController
            - call: "POST /consultants/${c1_id}/utilization-periods/${up1_id}/close"
              payload: {}
              as: FinanceController
          assert:
            - "UtilizationPeriod.${up1_id}.period_workdays == 20"
            - "UtilizationPeriod.${up1_id}.capacity_hours == 160.00"
            - "UtilizationPeriod.${up1_id}.net_available_hours == 152.00"
            - "UtilizationPeriod.${up1_id}.billable_hours == 96.00"
            - "UtilizationPeriod.${up1_id}.investment_hours == 0.00"
            - "UtilizationPeriod.${up1_id}.bench_hours == 56.00"
            - "UtilizationPeriod.${up1_id}.hour_overallocated == false"
            - "UtilizationPeriod.${up1_id}.target_utilization_pct == 75.00"
            - "UtilizationPeriod.${up1_id}.utilization_pct_target_basis == 60.00"
            - "UtilizationPeriod.${up1_id}.utilization_pct_available_basis == 63.16"
            - "on the create response (status == OPEN): UtilizationPeriod.${up1_id}.utilization_pct_of_record == 63.16 and variance_pp == -11.84"
            - "on the close response (status == CLOSED): UtilizationPeriod.${up1_id}.utilization_pct_of_record == 60.00 and variance_pp == -15.00"
            - "billable_hours == 96.00 both before and after the close: the two variants differ by exactly 3.16 percentage points with no hour changing"

      - name: realization_booked_vs_earned_diverges_on_investment_mix
        grounds:
          - calculations.rate_realization
          - calculations.rate_realization.variants.BOOKED
          - calculations.rate_realization.variants.EARNED
          - entities.DemandOpportunity.fields.booked_realization_pct
          - entities.DemandOpportunity.fields.earned_realization_pct
          - entities.DemandOpportunity.fields.blended_cost_rate_usd_per_hour
          - entities.DemandOpportunity.fields.blended_margin_pct
          - entities.Assignment.fields.category
          - endpoints[POST /assignments/{id}/confirm]
        distinguishing_aspect: |
          This instance carries the dual variant on the DEMAND PRICING domain
          (DemandOpportunity rate realization): with an equal BILLABLE/INVESTMENT hour mix,
          BOOKED stays at the pure price ratio 96.00 while EARNED halves to 48.00, because
          the 40 zero-rate investment hours sit in the EARNED denominator only.
        test_recipe:
          setup:
            - "Clock at 2026-08-17 so both assignments have delivered all 10 of their workdays before anything is measured."
            - "Two consultants in one NA group: Ada (cost 120.00, proficiency 4) and Grace (cost 140.00, proficiency 3), both with ACTIVE assertions on the demand's skill."
            - "One QUALIFIED, INTERNAL demand standard 250.00 / requested 240.00 (no approved rate, so effective_rate == 240.00)."
            - "Assignment A1 BILLABLE 50.00% over [2026-08-03, 2026-08-17) — bill_rate pinned to 240.00; assignment A2 INVESTMENT 50.00% over the same interval — bill_rate pinned to 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: FinanceController
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00, travel_max_nights_per_week: 3 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Grace Hopper", email: "grace.hopper@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 140.00, standard_bill_rate_usd_per_hour: 300.00, travel_max_nights_per_week: 3 }
              as: ResourceManager
              captures: { c2_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c2_id}", skill_id: "${sk_id}", proficiency_level: 3 }
              as: ResourceManager
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 50.00, start_date: "2026-08-03", end_date: "2026-08-17", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
            - call: "GET /consultants/${c2_id}"
              payload: {}
              as: ResourceManager
              captures: { c2_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c2_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 50.00, start_date: "2026-08-03", end_date: "2026-08-17", category: "INVESTMENT", expected_consultant_version: "${c2_v}" }
              as: ResourceManager
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /assignments/${a2_id}/confirm"
              payload: {}
              as: ResourceManager
          assert:
            - "Assignment.${a1_id}.bill_rate_usd_per_hour == 240.00 and Assignment.${a1_id}.cost_rate_usd_per_hour == 120.00"
            - "Assignment.${a2_id}.bill_rate_usd_per_hour == 0.00 and Assignment.${a2_id}.cost_rate_usd_per_hour == 140.00"
            - "DemandOpportunity.${d1_id}.effective_rate_usd_per_hour == 240.00"
            - "DemandOpportunity.${d1_id}.booked_realization_pct == 96.00"
            - "DemandOpportunity.${d1_id}.earned_realization_pct == 48.00"
            - "DemandOpportunity.${d1_id}.blended_cost_rate_usd_per_hour == 130.00"
            - "DemandOpportunity.${d1_id}.blended_margin_pct == 45.83"
            - "DemandOpportunity.${d1_id}.margin_breach == false"
            - "DemandOpportunity.${d1_id}.covered_internal_fte == 1.00 and open_fte == 0.00 and staffing_status == COVERED"
            - "the two variants differ by exactly 48.00 percentage points on identical rate inputs"

      - name: forecast_weighted_vs_committed_diverges_on_probability_floor
        grounds:
          - calculations.weighted_pipeline_demand
          - calculations.weighted_pipeline_demand.variants.WEIGHTED
          - calculations.weighted_pipeline_demand.variants.COMMITTED
          - entities.HiringForecast.fields.basis
          - entities.HiringForecast.fields.weighted_demand_fte
          - entities.HiringForecast.fields.gap_fte
          - entities.DemandOpportunity.fields.weighted_fte
          - endpoints[POST /hiring-forecasts]
        distinguishing_aspect: |
          This instance carries the dual variant on the PIPELINE FORECAST domain
          (HiringForecast): the three 33%-probability demands contribute 0.08 each under
          WEIGHTED but are dropped whole by the COMMITTED_PROBABILITY_FLOOR_PCT of 70, while
          the surviving 80% demand jumps from 0.80 to its full 1.00 — 1.04 versus 1.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA PracticeGroup, one CLOUD_ARCH skill, no consultants at all (internal_supply_fte must be 0.00) and no external placements."
            - "Three QUALIFIED demands with required_fte 0.25 and win_probability_pct 33, plus one QUALIFIED demand with required_fte 1.00 and win_probability_pct 80; all four run 2026-09-01..2026-12-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: FinanceController
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Tail One", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 0.25, win_probability_pct: 33, start_date: "2026-09-01", end_date: "2026-12-15", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { da_id: $.data.id }
            - call: "POST /demand-opportunities/${da_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities"
              payload: { client_name: "Tail Two", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 0.25, win_probability_pct: 33, start_date: "2026-09-01", end_date: "2026-12-15", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { db_id: $.data.id }
            - call: "POST /demand-opportunities/${db_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities"
              payload: { client_name: "Tail Three", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 0.25, win_probability_pct: 33, start_date: "2026-09-01", end_date: "2026-12-15", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { dc_id: $.data.id }
            - call: "POST /demand-opportunities/${dc_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities"
              payload: { client_name: "Anchor Bank", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 80, start_date: "2026-09-01", end_date: "2026-12-15", industry_code: "BANKING", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { dd_id: $.data.id }
            - call: "POST /demand-opportunities/${dd_id}/qualify"
              payload: {}
              as: SalesLead
          trigger:
            - call: "POST /hiring-forecasts"
              payload: { skill_code: "CLOUD_ARCH", geography_code: "NA", horizon_start_on: "2026-08-01", horizon_end_on: "2026-12-31", basis: "WEIGHTED" }
              as: FinanceController
              captures: { fc_w_id: $.data.id }
            - call: "POST /hiring-forecasts"
              payload: { skill_code: "CLOUD_ARCH", geography_code: "NA", horizon_start_on: "2026-08-01", horizon_end_on: "2026-12-31", basis: "COMMITTED" }
              as: FinanceController
              captures: { fc_c_id: $.data.id }
          assert:
            - "DemandOpportunity.${da_id}.weighted_fte == 0.08"
            - "DemandOpportunity.${dd_id}.weighted_fte == 0.80"
            - "HiringForecast.${fc_w_id}.basis == WEIGHTED and HiringForecast.${fc_w_id}.weighted_demand_fte == 1.04"
            - "HiringForecast.${fc_c_id}.basis == COMMITTED and HiringForecast.${fc_c_id}.weighted_demand_fte == 1.00"
            - "HiringForecast.${fc_w_id}.internal_supply_fte == 0.00 and external_supply_fte == 0.00"
            - "HiringForecast.${fc_c_id}.internal_supply_fte == 0.00 and external_supply_fte == 0.00"
            - "HiringForecast.${fc_w_id}.gap_fte == 1.04 and HiringForecast.${fc_c_id}.gap_fte == 1.00"
            - "HiringForecast.${fc_w_id}.recommended_hires == 2 and HiringForecast.${fc_c_id}.recommended_hires == 2"
            - "HiringForecast.${fc_w_id}.generated_at == 2026-08-03T00:00:00Z (stamped from the logical clock, not wall time)"

  - rule_id: combinatorial_formula
    instances:

      - name: match_score_six_input_nonlinear_with_cost_clamp
        grounds:
          - calculations.match_score
          - entities.Assignment.fields.match_score
          - entities.Consultant.fields.industry_experience
          - entities.Consultant.fields.development_goal_skill_id
          - entities.SkillAssertion.fields.certification_code
          - endpoints[POST /assignments]
        distinguishing_aspect: |
          MODE (a) — a single ≥3-input non-linear formula: match_score combines six inputs
          (proficiency, industry years, development goal, onsite nights, cost rate,
          certification) through min/max clamps and conditional branches, so Ada scores
          0.8780 while Turing, differing only in cost rate and profile, scores 0.4700
          because max(0.0, …) clamps his negative cost_fit to 0.0000.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill."
            - "Ada: cost 120.00, travel_max 3, industry_experience [{RETAIL, 5.0}], development_goal_skill_id == the demand's required skill; ACTIVE proficiency-4 assertion carrying certification AWS_SA_PRO expiring 2027-01-31."
            - "Turing: cost 300.00 (above the demand's 250.00 standard rate), travel_max 3, no industry experience, no development goal; ACTIVE proficiency-5 assertion with no certification."
            - "One QUALIFIED, INTERNAL demand: min_proficiency_level 3, industry_code RETAIL, onsite_nights_per_week 2, is_international false, standard 250.00 / requested 240.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00, travel_max_nights_per_week: 3, travel_willing_international: false, development_goal_skill_id: "${sk_id}", industry_experience: [{ industry_code: "RETAIL", years: 5.0 }] }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Alan Turing", email: "alan.turing@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 300.00, standard_bill_rate_usd_per_hour: 500.00, travel_max_nights_per_week: 3 }
              as: ResourceManager
              captures: { c3_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4, certification_code: "AWS_SA_PRO", certification_expires_on: "2027-01-31" }
              as: ResourceManager
              captures: { sa1_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c3_id}", skill_id: "${sk_id}", proficiency_level: 5 }
              as: ResourceManager
              captures: { sa3_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 2.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 50.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "GET /consultants/${c3_id}"
              payload: {}
              as: ResourceManager
              captures: { c3_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c3_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 50.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c3_v}" }
              as: ResourceManager
              captures: { a3_id: $.data.id }
          assert:
            - "SkillAssertion.${sa1_id}.assertion_status == ACTIVE"
            - "Assignment.${a1_id}.match_score == 0.8780"
            - "Assignment.${a3_id}.match_score == 0.4700"
            - "Assignment.${a3_id}.match_score reflects cost_fit == 0.0000: Turing's raw ratio (250.00 - 300.00) / 250.00 is negative and the max(0.0, …) clamp, not the min(1.0, …) clamp, is what fires"
            - "Assignment.${a1_id}.match_score - Assignment.${a3_id}.match_score == 0.4080"
            - "both rows are status == PROPOSED, so neither match_score depended on any confirmation side effect"

      - name: forecast_round_per_opportunity_then_sum
        grounds:
          - calculations.weighted_pipeline_demand
          - entities.HiringForecast.fields.weighted_demand_fte
          - entities.HiringForecast.fields.recommended_hires
          - entities.DemandOpportunity.fields.weighted_fte
          - endpoints[POST /hiring-forecasts]
        distinguishing_aspect: |
          MODE (b) — nested rounding order: three demands of required_fte 0.25 at
          win_probability_pct 33 must round to 0.08 EACH before summing, giving
          weighted_demand_fte 0.24; summing first (0.2475) and rounding once would report
          0.25, and the ceil in recommended_hires then re-rounds the already-rounded gap.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, zero consultants and zero placements so supply is exactly 0.00 and the gap equals the demand."
