        claim_type: segregation_of_duties
        grounds: [ state_machines.Settlement, "errors[ERR_SEGREGATION_OF_DUTIES]", "roles[IntegratorAdmin]"]
        distinguishing_aspect: "Money movement is two-person: the IntegratorAdmin who approved cannot pay (403); a second admin pays and Grower.lifetime_paid_cents moves by exactly total_pay_cents."
