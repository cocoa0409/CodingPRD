            - call: "GET /programs/${prog_id}/claims"
              payload: { policy_id: "${pol2_id}" }
              as: ClaimsAdjuster
              captures: { claim2_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/claims/${claim1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
          trigger:
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/blacklist"
              payload: {}
              as: FraudAnalyst
            - call: "GET /programs/${prog_id}/claims/${claim1_id}"
              payload: {}
              as: FraudAnalyst
              captures: { claim1_status: $.data.status }
            - call: "GET /programs/${prog_id}/claims/${claim2_id}"
              payload: {}
              as: FraudAnalyst
              captures: { claim2_status: $.data.status }
          assert:
            - "Policyholder.${holder_id}.status == BLACKLISTED (hop 1)"
            - "PayoutClaim.${claim2_id}.status (${claim2_status}) == VOIDED (hop 2: GENERATED claim cascaded)"
            - "PayoutClaim.${claim1_id}.status (${claim1_status}) == APPROVED (conditional cascade spares committed claims)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_bind_unpaid_and_over_exposure
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: |
          business_fiscal-vs-business_fiscal priority conflict on policy bind:
          the policy IS in QUOTED (state checks pass), the invoice is UNPAID
          (priority-14 fiscal violation) AND binding would breach the program
          exposure limit (priority-13 fiscal violation). The pinned priority
          ordering resolves the dual failure to ERR_EXPOSURE_LIMIT_EXCEEDED
          (priority 13), never ERR_PREMIUM_NOT_PAID (priority 14).
        test_recipe:
          setup:
            - "Program ACTIVE with exposure_limit_cents = 1,000,000 (deliberately small), ADMITTED"
            - "Index ACTIVE freq 0.20 elr 0.60; holder ACTIVE"
            - "Policy quoted with sum_insured_cents = 2,000,000 (retained share 2,000,000 > limit 1,000,000) and invoice 306,000 left UNPAID"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-PP1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-P1", exposure_limit_cents: 1000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/stations"
              payload: { station_code: "ST-PP1", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
            - call: "POST /programs/${prog_id}/index-definitions"
              payload: { index_code: "IDX-PP1", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-PP1", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_id: $.data.id }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_id}/policyholders"
              payload: { legal_name: "H-PP1", tax_id: "T-PP1", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_id: $.data.id }
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies"
              payload: { index_definition_id: "${idx_id}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/policyholders/${holder_id}/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id (${err_id}) == ERR_EXPOSURE_LIMIT_EXCEEDED (priority 13 fiscal-exposure beats priority 14 fiscal-premium)"
            - "HTTP status == 402"
            - "Policy remains lifecycle_status == QUOTED"

      - name: business_safety_vs_business_referential_on_observation_and_sod
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          business_safety (priority 6, segregation of duties) vs
          business_referential (priority 7, cross-aggregate integrity): a
          release-payment attempted by the SAME user id that approved the claim
          must fail with ERR_SOD_VIOLATION even though the payment is otherwise
          fully valid; contrasted within the same instance family with an
          observation whose station belongs to a DIFFERENT program failing with
          ERR_CROSS_REFERENCE_INVALID — two different error-category pairs
          exercised by two triggers in one rule instance set.
        test_recipe:
          setup:
            - "Program A ACTIVE with claim approved by adjuster user 'adjuster-1' (final 500,000, no treaties)"
            - "Program B ACTIVE with its own station ST-B; an index in program A is targeted with an observation naming ST-B (cross-program reference)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-PP2A", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-P2A", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_a: $.data.id }
            - call: "POST /programs/${prog_a}/stations"
              payload: { station_code: "ST-A", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_a: $.data.id }
            - call: "POST /programs/${prog_a}/index-definitions"
              payload: { index_code: "IDX-A", measurement_unit: "mm", aggregation_window_days: 30, data_source_agreement_ref: "DSA-A", source_priority_mode: "STATION_PRIMARY", trigger_thresholds: [ { tier: 1, threshold_value: 50, payout_fraction: 0.25 } ], strike_direction: "BELOW", historical_breach_frequency: 0.2, expected_loss_ratio: 0.6 }
              as: Actuary
              captures: { idx_a: $.data.id }
            - call: "POST /programs/${prog_a}/index-definitions/${idx_a}/activate"
              payload: {}
              as: Actuary
            - call: "POST /programs/${prog_a}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /programs/${prog_a}/policyholders"
              payload: { legal_name: "H-PP2A", tax_id: "T-PP2A", basis_risk_disclosure_acknowledged: true }
              as: ServicingAgent
              captures: { holder_a: $.data.id }
            - call: "POST /programs/${prog_a}/policyholders/${holder_a}/policies"
              payload: { index_definition_id: "${idx_a}", sum_insured_cents: 2000000, policy_start_date: "2026-01-01", policy_end_date: "2026-12-31" }
              as: Underwriter
              captures: { pol_a: $.data.id }
            - call: "GET /programs/${prog_a}/invoices"
              payload: { policy_id: "${pol_a}" }
              as: ServicingAgent
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /programs/${prog_a}/invoices/${inv_a}/payments"
              payload: { amount_cents: 306000 }
              as: ServicingAgent
            - call: "POST /programs/${prog_a}/policyholders/${holder_a}/policies/${pol_a}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /programs/${prog_a}/index-definitions/${idx_a}/observations"
              payload: { station_id: "${st_a}", window_end_date: "2026-06-30", measured_value: 40 }
              as: DataOperations
            - call: "GET /programs/${prog_a}/trigger-events"
              payload: { index_definition_id: "${idx_a}" }
              as: ClaimsAdjuster
              captures: { ev_a: "$.data[0].id" }
            - call: "POST /programs/${prog_a}/index-definitions/${idx_a}/trigger-events/${ev_a}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_a}/index-definitions/${idx_a}/trigger-events/${ev_a}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /programs/${prog_a}/claims"
              payload: { policy_id: "${pol_a}" }
              as: ClaimsAdjuster
              captures: { claim_a: "$.data[0].id" }
            - call: "POST /programs/${prog_a}/claims/${claim_a}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-1"
            - call: "POST /programs"
              payload: { program_code: "PRG-PP2B", peril_type: "WINDSPEED", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-P2B", exposure_limit_cents: 100000000 }
              as: ProgramManager
              captures: { prog_b: $.data.id }
            - call: "POST /programs/${prog_b}/stations"
              payload: { station_code: "ST-B", station_kind: "PHYSICAL_STATION", reliability_weight: 1.0 }
              as: DataOperations
              captures: { st_b: $.data.id }
          trigger:
            - call: "POST /programs/${prog_a}/claims/${claim_a}/release-payment"
