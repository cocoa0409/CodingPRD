  - section: errors
    instances:

      - name: every_remaining_not_found_error_is_reachable_through_its_own_read_endpoint
        claim_type: error_triggerability
        grounds:
          - errors[ERR_COURSE_NOT_FOUND]
          - errors[ERR_ATTAINMENT_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_MEETING_NOT_FOUND]
          - errors[ERR_EXPENDITURE_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_EDUCATOR_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          Seven of the thirteen declared 404s are not reachable from any other instance in this design, and each names a
          different entity, so a handler that collapses them into one generic not-found — or that leans on whichever
          parent error is nearest — is invisible until all seven are probed side by side against a well-formed but
          unknown id. Each read is issued by a role that is genuinely allowed on that endpoint, so a 403 in place of a
          404 is also caught.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CteDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "GET /cte/sequence-courses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/credential-attainments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchoolRegistrar
              as_user_id: "u_reg_1"
            - call: "GET /cte/committee-members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/committee-meetings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/expenditures/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
            - call: "GET /cte/improvement-plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/educators/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
          assert:
            - "the sequence-courses read returns error_id == ERR_COURSE_NOT_FOUND with HTTP status 404"
            - "the credential-attainments read returns error_id == ERR_ATTAINMENT_NOT_FOUND with HTTP status 404"
            - "the committee-members read returns error_id == ERR_MEMBER_NOT_FOUND with HTTP status 404"
            - "the committee-meetings read returns error_id == ERR_MEETING_NOT_FOUND with HTTP status 404"
            - "the expenditures read returns error_id == ERR_EXPENDITURE_NOT_FOUND with HTTP status 404"
