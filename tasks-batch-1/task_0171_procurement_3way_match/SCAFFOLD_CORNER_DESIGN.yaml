        claim_type: Computed read
        grounds:
          - endpoints[GET /procurement/vendors]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /vendors with limit=1 over two vendors returns response_type=array, exactly one item, total_count=2, has_more=true."
        test_recipe:
          setup:
            - "Two vendors registered."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "V1", tax_id: "TAX-PG1" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "V2", tax_id: "TAX-PG2" }
              as: ProcurementAdmin
          trigger:
            - call: "GET /procurement/vendors?limit=1&offset=0"
              payload: {}
              as: ProcurementAdmin
          assert:
            - "response_type == array"
            - "len(data) == 1"
            - "meta/pagination total_count == 2 and has_more == true"

