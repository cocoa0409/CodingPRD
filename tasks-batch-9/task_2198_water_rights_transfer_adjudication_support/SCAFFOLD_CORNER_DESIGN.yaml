            - {call: "POST /lease-assignments/${lease}/resume", as: WaterRightsAnalyst, captures: {e2: "$.data.error_id"}}
            - {call: "POST /lease-assignments/${lease}/cancel", payload: {cancellation_reason: "attempt to claw back settlement credit after completion"}, as: WaterRightsAnalyst, captures: {e3: "$.data.error_id"}}
