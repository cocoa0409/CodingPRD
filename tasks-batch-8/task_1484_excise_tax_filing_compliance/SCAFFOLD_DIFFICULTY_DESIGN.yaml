            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-09-05T00:00:00Z", quantity_units: 1000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-09" }, as: TaxAnalyst, captures: { depA: "$.data[0].id", depB: "$.data[1].id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /deposits/${depA}/pay", payload: { amount_cents: 10000 }, as: TaxAnalyst, captures: { pA: $.data.penalty_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-16T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /deposits/${depB}/pay", payload: { amount_cents: 10000 }, as: TaxAnalyst, captures: { pB: $.data.penalty_cents } }
          assert:
            - "Deposit.${depA}.penalty_cents == 200 (paid 2026-09-30 vs due 2026-09-25 = exactly 5 days: 2% tier is <= 5 inclusive)"
            - "Deposit.${depB}.penalty_cents == 500 (paid 2026-10-16 vs due 2026-10-10 = exactly 6 days: 5% tier)"
            - "The 5/6-day boundary is exact: 200 != 500 for a single day of difference"

      - name: certificate_valid_to_inclusive_boundary
        grounds:
          - entities.ExemptionCertificate.fields.valid_to
          - validations[priority=27]
          - calculations.event_tax_determination
        distinguishing_aspect: |
          Metric: date equality on POST /taxable-events/{id}/rate. The certificate window is a
          CLOSED interval: an event dated exactly valid_to (2026-08-31) is exempt (tax 0), while
          valid_to + 1 day (2026-09-01) fails ERR_CERTIFICATE_NOT_APPLICABLE.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration bonded 1500000"
            - "Certificate RESALE for CUST-1 covering [2026-03-01, 2026-08-31], verified ACTIVE"
            - "Two 1000-unit events for CUST-1 dated 2026-08-31 (evIn) and 2026-09-01 (evOut), both CLASSIFIED"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-1", certificate_type: "RESALE", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-08-31T00:00:00Z" }, as: TaxAnalyst, captures: { crt: $.data.id } }
            - { call: "POST /exemption-certificates/${crt}/verify", payload: {}, as: TaxReviewer }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-31T00:00:00Z", quantity_units: 1000, customer_reference: "CUST-1" }, as: TaxAnalyst, captures: { evIn: $.data.id } }
            - { call: "POST /taxable-events/${evIn}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-09-01T00:00:00Z", quantity_units: 1000, customer_reference: "CUST-1" }, as: TaxAnalyst, captures: { evOut: $.data.id } }
            - { call: "POST /taxable-events/${evOut}/classify", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /taxable-events/${evIn}/rate", payload: { exemption_certificate_id: "${crt}" }, as: TaxAnalyst, captures: { t_in: $.data.tax_cents, g_in: $.data.gross_tax_cents } }
            - { call: "POST /taxable-events/${evOut}/rate", payload: { exemption_certificate_id: "${crt}" }, as: TaxAnalyst, captures: { err_out: $.data.error_id } }
          assert:
            - "Event dated exactly valid_to: rate succeeds with tax_cents == 0 and gross_tax_cents == 24300 (closed interval: valid_to is INCLUSIVE)"
            - "Event dated valid_to + 1 day: 422 with error_id == ERR_CERTIFICATE_NOT_APPLICABLE"

      - name: underpayment_safe_harbor_exact_90_percent
        grounds:
          - calculations.return_settlement
          - entities.TaxReturn.fields.penalty_cents
        distinguishing_aspect: |
          Metric: cents ratio on POST /returns/{id}/file. deposits_applied == ceil(0.9 x tax)
          exactly (90000 of 100000) triggers NO underpayment penalty; one cent below (89999)
          triggers round_half_up(0.10 x 10001) = 1000. The >= boundary is exact.
        test_recipe:
          setup:
            - "Two jurisdictions CA-BOE and NV-TX; SPIRITS@25000mc in both; one registrant with ACTIVE SAFE_HARBOR registrations in both, bonded 1500000 each"
            - "Each registration: one 4000-unit SPIRITS event rated (tax 100000) in 2026-08"
            - "CA depA paid 90000; NV depA paid 89999"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur_ca: $.data.id } }
