  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — approve-triggered plan->request->cycle (depth 3)
  # vs clock-sweep-triggered ballot->request (depth 2). Different triggers.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: plan_approval_rebaselines_budget_depth3
        grounds:
          - state_machines.TreatmentPlan.SUBMITTED_FOR_REVIEW_to_APPROVED
          - state_machines.TrafficCalmingRequest.DESIGN_IN_PROGRESS_to_BALLOT_READY
          - calculations.plan_approval_rebaseline
        distinguishing_aspect: |
          Depth-3 chain triggered by plan approval: (1) TreatmentPlan
          SUBMITTED_FOR_REVIEW -> APPROVED; (2) that approval moves the request
          DESIGN_IN_PROGRESS -> BALLOT_READY; (3) the request's arrival in
          BALLOT_READY itself triggers the FundingCycle budget re-baseline
          (committed 21500 -> 32250). Link 3 is caused by link 2's mutation, not
          by the approve call directly.
        test_recipe:
          setup:
            - "Segment (30 mph, 4 households), 3 residents; request requested_budget_cents 20000, certified score 60"
            - "Cycle 2026 budget 80000; publish -> FUNDED with provisional allocated_cents 21500 (20000 + 1500)"
            - "Plan estimated_cost_cents 30000 submitted for review"
