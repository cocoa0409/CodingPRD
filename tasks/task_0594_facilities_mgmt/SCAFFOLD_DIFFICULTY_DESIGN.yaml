scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_provisional_estimate_vs_final_settlement
        grounds:
          - calculations.work_order_billable_amount
          - entities.WorkOrder.fields.estimated_amount
          - entities.WorkOrder.fields.billable_amount
          - state_machines.WorkOrder.NEW_to_DISPATCHED
          - state_machines.WorkOrder.IN_PROGRESS_to_PENDING_QA
        distinguishing_aspect: |
          Dual-variant on the WorkOrder cost-accounting domain: the provisional_estimate variant
          (STANDARD_LABOR_RATE at create, vendor.hourly_rate at dispatch, estimated hours/parts, no
          SLA penalty) and the final_settlement variant (actual hours/parts plus SLA penalty credit)
          write two different fields on the same order for the same job — 860.00, then 960.00, then
          1410.00 — so the order's estimated_amount and billable_amount are never equal here.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z (business hours, no after-hours multiplier)."
            - "Building BLD-1 (OPEN posture), HVAC/STANDARD asset, HVAC vendor with hourly_rate 100.00, SLA 60/240 minutes."
            - "One CORRECTIVE P1 work order on that asset, estimated 4 labour hours and 400.00 parts."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/assets"
              payload: { building_id: "${b1}", asset_tag: "AHU-01", category: "HVAC", criticality: "STANDARD" }
              as: FacilityManager
              captures: { a1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", asset_id: "${a1}", wo_type: "CORRECTIVE", priority: "P1", estimated_labor_hours: 4, estimated_parts_cost: 400.00, chargeable: true }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version, wo1_est_at_create: $.data.estimated_amount }
          trigger:
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 6, actual_parts_cost: 600.00 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "${wo1_est_at_create} == 860.00 (provisional at create: 4*80.00 labour + 25% P1 surcharge + 400.00*1.15 parts)"
            - "WorkOrder.${wo1}.estimated_amount == 960.00 (provisional re-run at dispatch with vendor.hourly_rate 100.00)"
            - "WorkOrder.${wo1}.billable_amount == 1410.00 (final_settlement: 6*100.00 + 25% + 600.00*1.10, penalty_pct 0)"
            - "WorkOrder.${wo1}.estimated_amount != WorkOrder.${wo1}.billable_amount"
            - "Dispatch.${d1}.sla_response_met == true and Dispatch.${d1}.sla_resolve_met == true and Dispatch.${d1}.penalty_pct == 0"
            - "WorkOrder.${wo1}.status == PENDING_QA"

      - name: vendor_rolling_window_vs_lifetime_performance_score
        grounds:
          - calculations.vendor_performance_score
          - entities.Vendor.fields.performance_score
          - entities.Vendor.fields.lifetime_performance_score
          - state_machines.Dispatch.ACCEPTED_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant on a different entity domain — Vendor risk/performance scoring, not WorkOrder
          cost: with four COMPLETED dispatches of which only the oldest breached the response SLA,
          the rolling_window variant (last 3 by completed_at) scores 100.00 while the lifetime variant
          scores 90.00 on exactly the same rows.
        test_recipe:
          setup:
            - "One vendor with SLA 60/240; four CORRECTIVE P3 work orders with no asset (so no trade check)."
            - "Dispatch 1 is accepted 120 minutes after dispatch (response breach) but resolved inside 240 minutes; dispatches 2, 3 and 4 meet both legs."
            - "Vendor accumulates exactly one strike, so it stays ACTIVE (PROBATION needs 2)."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wa: $.data.id, wa_v: $.data.version }
            - call: "POST /fm/work-orders/${wa}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wa_v}" }
              as: FacilityManager
              captures: { da: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${da}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${da}/complete"
              payload: { actual_labor_hours: 1, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wb: $.data.id, wb_v: $.data.version }
            - call: "POST /fm/work-orders/${wb}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wb_v}" }
              as: FacilityManager
              captures: { db: $.data.id }
            - call: "POST /fm/dispatches/${db}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${db}/complete"
              payload: { actual_labor_hours: 1, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wc: $.data.id, wc_v: $.data.version }
            - call: "POST /fm/work-orders/${wc}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wc_v}" }
              as: FacilityManager
              captures: { dc: $.data.id }
            - call: "POST /fm/dispatches/${dc}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T13:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${dc}/complete"
              payload: { actual_labor_hours: 1, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wd: $.data.id, wd_v: $.data.version }
            - call: "POST /fm/work-orders/${wd}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wd_v}" }
              as: FacilityManager
              captures: { dd: $.data.id }
            - call: "POST /fm/dispatches/${dd}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T14:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fm/dispatches/${dd}/complete"
              payload: { actual_labor_hours: 1, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/vendors/${v1}"
              payload: {}
              as: FacilityManager
          assert:
            - "Vendor.${v1}.completed_dispatch_count == 4"
            - "Vendor.${v1}.performance_score == 100.00 (rolling_window over dispatches db, dc, dd — the three most recent completed_at)"
            - "Vendor.${v1}.lifetime_performance_score == 90.00 (0.4*0.75 + 0.3*1.0 + 0.3*1.0, scaled by 100)"
            - "Vendor.${v1}.performance_score != Vendor.${v1}.lifetime_performance_score"
            - "Vendor.${v1}.strike_count == 1 and Vendor.${v1}.status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: statement_round_per_line_then_sum_not_sum_then_round
        grounds:
          - calculations.chargeback_statement_total
          - entities.ChargebackStatement.fields.utility_share
          - entities.ChargebackStatement.fields.total_amount
          - state_machines.ChargebackStatement.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents: two allocation lines each pro-rate
          1000.00 of utility cost over 100/3000 of the building, i.e. 33.3333 each. Rounding per line
          then summing gives utility_share 66.66 and total 2066.66; summing then rounding would give
          66.67 / 2066.67. The scaffold pins per-line rounding, so 2066.66 is the only correct answer.
        test_recipe:
          setup:
            - "Building of 3000 sqm with two 100 sqm spaces; one lease at 10.00 per sqm per month holding 100% of both spaces for all of May 2026."
            - "One ELECTRIC utility reading of 1000.00 cost whose period is fully contained in May 2026."
            - "No closed chargeable work orders, so om_share is 0.00."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 3000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S2", floor: 2, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s2: $.data.id }
            - call: "POST /fm/utility-readings"
              payload: { building_id: "${b1}", meter_type: "ELECTRIC", period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", consumption_kwh: 4000, cost: 1000.00 }
              as: SustainabilityAnalyst
            - call: "POST /fm/leases"
              payload: { building_id: "${b1}", tenant_name: "Acme", base_rate_per_sqm_month: 10.00, start_date: "2026-05-01T00:00:00Z", end_date: "2027-04-30T23:59:59Z" }
              as: FinanceController
              captures: { l1: $.data.id }
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s1}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/allocations"
              payload: { space_id: "${s2}", share_pct: 100, effective_from: "2026-05-01T00:00:00Z", effective_to: "2027-04-30T23:59:59Z" }
              as: FinanceController
            - call: "POST /fm/leases/${l1}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /fm/leases/${l1}"
              payload: {}
              as: FinanceController
              captures: { l1_v: $.data.version }
          trigger:
            - call: "POST /fm/leases/${l1}/statements"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-05-31T23:59:59Z", expected_lease_version: "${l1_v}" }
              as: FinanceController
              captures: { st1: $.data.id }
          assert:
            - "ChargebackStatement.${st1}.base_rent == 2000.00 (two lines of round(100*1.0*10.00, 2) = 1000.00)"
            - "ChargebackStatement.${st1}.utility_share == 66.66 (two lines of round(1000.00*100/3000, 2) = 33.33; NOT 66.67)"
            - "ChargebackStatement.${st1}.om_share == 0.00"
            - "ChargebackStatement.${st1}.total_amount == 2066.66"
            - "ChargebackStatement.${st1}.status == DRAFT"

      - name: capital_contingency_tier_keyed_on_base_cost_not_budget
        grounds:
          - calculations.capital_project_budget
          - entities.CapitalProject.fields.contingency_pct
          - entities.CapitalProject.fields.budget_amount
          - endpoints["POST /fm/capital-projects"]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: budget_amount is
          base_cost + contingency, and the contingency tier LOOKS like a function of the budget, but the
          scaffold pins the tier lookup to base_cost. With base_cost 95000.00 the tier is 0.10 (not the
          0.07 that a budget-keyed lookup on 104500.00 would select), so budget_amount is 104500.00,
          never 101650.00.
        test_recipe:
          setup:
            - "One building; a capital project proposed with base_cost 95000.00, which sits just under the 100000.00 tier edge on the base but above it once the contingency is added."
          setup_api_calls:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Chiller replacement", base_cost: 95000.00 }
              as: FacilityManager
              as_user_id: "fm-1"
              captures: { p1: $.data.id }
          assert:
            - "CapitalProject.${p1}.contingency_pct == 0.10"
            - "CapitalProject.${p1}.contingency_amount == 9500.00"
            - "CapitalProject.${p1}.budget_amount == 104500.00"
            - "CapitalProject.${p1}.remaining_amount == 104500.00"
            - "CapitalProject.${p1}.committed_amount == 0 and CapitalProject.${p1}.spent_amount == 0"
            - "CapitalProject.${p1}.status == PROPOSED and CapitalProject.${p1}.proposed_by_user_id == fm-1"

      - name: work_order_after_hours_multiplier_with_tiered_parts_markup
        grounds:
          - calculations.work_order_billable_amount
          - entities.WorkOrder.fields.estimated_amount
          - state_machines.WorkOrder.NEW_to_DISPATCHED
        distinguishing_aspect: |
          Mode (a) — a four-input non-linear formula: the labour leg multiplies a capped hour count by
          the vendor rate and an after-hours factor, the surcharge is a percentage OF the multiplied
          labour (not of the base), and the parts leg selects a markup tier from the parts amount. At
          19:00 UTC with 14 requested hours (capped at 12), rate 100.00, P2 and 2500.00 parts the
          estimate is 2100.00 + 210.00 + 2625.00 = 4935.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T19:00:00Z — after hours (>= 18), so the 1.5 multiplier applies."
            - "Vendor at hourly_rate 100.00; work order requests 14 labour hours (above the 12-hour cap) and 2500.00 of parts (top markup tier 0.05) at priority P2 (surcharge 0.10)."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P2", estimated_labor_hours: 14, estimated_parts_cost: 2500.00 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
          trigger:
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "WorkOrder.${wo1}.estimated_amount == 4935.00 (min(14,12)*100.00*1.5 = 2100.00 labour; 2100.00*0.10 = 210.00 surcharge; 2500.00*1.05 = 2625.00 parts)"
            - "WorkOrder.${wo1}.status == DISPATCHED"
            - "WorkOrder.${wo1}.version == ${wo1_v} + 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_qa_fail_rework_cycle_returns_dispatch_to_accepted
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_IN_PROGRESS
          - state_machines.Dispatch.COMPLETED_to_ACCEPTED
          - entities.WorkOrder.fields.failed_qa_count
          - entities.WorkOrder.fields.billable_amount
        distinguishing_aspect: |
          Cycle on the WorkOrder entity: PENDING_QA -> IN_PROGRESS -> PENDING_QA. A QA FAIL walks the
          order backwards, drags the COMPLETED dispatch back to ACCEPTED, clears billable_amount, and
          on the second completion the order returns to PENDING_QA with failed_qa_count still 1.
        test_recipe:
          setup:
            - "One work order dispatched, accepted and completed inside SLA, sitting in PENDING_QA with billable_amount set."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 100.00 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 2, actual_parts_cost: 100.00 }
              as: VendorTech
              as_user_id: "${v1}"
          trigger:
            - call: "POST /fm/work-orders/${wo1}/qa"
              payload: { outcome: "FAIL" }
              as: FacilityManager
            - call: "GET /fm/dispatches/${d1}"
              payload: {}
              as: FacilityManager
            - call: "POST /fm/dispatches/${d1}/complete"
              payload: { actual_labor_hours: 3, actual_parts_cost: 100.00 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "GET /fm/work-orders/${wo1}"
              payload: {}
              as: FacilityManager
          assert:
            - "Immediately after the QA FAIL: WorkOrder.${wo1}.status == IN_PROGRESS, failed_qa_count == 1, billable_amount == null"
            - "Immediately after the QA FAIL: Dispatch.${d1}.status == ACCEPTED, completed_at == null, sla_resolve_met == null, penalty_pct == 0"
            - "After the second completion: WorkOrder.${wo1}.status == PENDING_QA and failed_qa_count == 1"
            - "After the second completion: WorkOrder.${wo1}.billable_amount == 415.00 (3*100.00 = 300.00 labour, P3 surcharge 0.00, 100.00*1.15 = 115.00 parts; penalty_pct 0)"

      - name: statement_issue_dispute_reissue_cycle_recomputes_totals
        grounds:
          - state_machines.ChargebackStatement.ISSUED_to_DISPUTED
          - state_machines.ChargebackStatement.DISPUTED_to_ISSUED
          - calculations.chargeback_statement_total
          - entities.ChargebackStatement.fields.dispute_reason
        distinguishing_aspect: |
          Cycle on a different entity than the WorkOrder rework loop: ChargebackStatement runs
          ISSUED -> DISPUTED -> ISSUED, and the re-issue leg recomputes every money line from CURRENT
          data — a utility reading appended during the dispute raises utility_share from 66.66 to
          100.00 and total_amount from 2066.66 to 2100.00, while dispute_reason is retained.
        test_recipe:
          setup:
            - "The statement of instance statement_round_per_line_then_sum_not_sum_then_round, ISSUED and then DISPUTED by the tenant."
            - "A second ELECTRIC reading of 500.00 cost, fully contained in May 2026, appended while the statement is DISPUTED."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 3000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S1", floor: 1, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
              captures: { s1: $.data.id }
            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "S2", floor: 2, area_sqm: 100, space_type: "OFFICE" }
              as: FacilityManager
