# =============================================================================
# SCAFFOLD.yaml — task_2008_builder_warranty_homeowner_callback
# §1.0–§1.7 seed tables (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  2008. Builder Warranty & Homeowner Callback Management (production builder warranty department): warranty term structure (workmanship/systems/structural) & coverage rules, service request intake & trade dispatch, response/completion SLA & customer follow-up, non-warrantable item determination & homeowner education, subcontractor chargeback for callbacks, warranty reserve accounting & trend analysis, third-party warranty administrator interface, dispute/arbitration handling

domain_name: builder-warranty
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Homeowner legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" , default: null }

  - name: Home
    parent: null
    common_fields: true
    fields:
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; owning homeowner" }
      - { name: lot_number, type: string, source: input, description: "Lot identifier within community" }
      - { name: community_name, type: string, source: input, description: "Community / subdivision name" }
      - { name: sale_price_cents, type: integer, source: input, description: "Home sale price in cents; drives reserve accrual" , constraints: "> 0" }
      - { name: closing_date, type: string, source: input, description: "ISO8601 date of title transfer; warranty anchor for all tiers" }
      - { name: warranty_program, type: enum, source: input, description: "STANDARD | THIRD_PARTY_ADMINISTERED" }
      - { name: workmanship_end_date, type: string, source: computed, description: "closing_date + 12 months; coverage end is EXCLUSIVE (half-open window)" }
      - { name: systems_end_date, type: string, source: computed, description: "closing_date + 24 months; EXCLUSIVE" }
      - { name: structural_end_date, type: string, source: computed, description: "closing_date + 120 months; EXCLUSIVE" }

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> Home.id; warranted home" }
      - { name: homeowner_id, type: string, source: system, description: "FK -> Homeowner.id; reporter, copied from X-User-ID" }
      - { name: item_category, type: enum, source: input, description: "DRYWALL_PAINT | FLOORING | PLUMBING | ELECTRICAL | HVAC | FOUNDATION | FRAMING | LANDSCAPING | APPLIANCE | ROUTINE_MAINTENANCE" }
      - { name: severity, type: enum, source: input, description: "EMERGENCY | URGENT | STANDARD" }
      - { name: description, type: string, source: input, description: "Homeowner problem description" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp at intake; coverage judged on this instant" }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPROVED | IN_SERVICE | PENDING_FOLLOWUP | CLOSED | DENIED | DISPUTED | REOPENED" }
      - { name: determined_tier, type: enum, source: system, default: null, description: "WORKMANSHIP | SYSTEMS | STRUCTURAL; set on warrantable assess from category map" }
      - { name: denied_at, type: datetime, source: system, default: null, description: "Timestamp of denial" }
      - { name: denial_reason_code, type: enum, source: input, default: null, description: "OUT_OF_TERM | EXCLUDED_CATEGORY | HOMEOWNER_CAUSED | NORMAL_MAINTENANCE; required when warrantable=false" }
      - { name: education_packet_code, type: string, source: input, default: null, description: "Homeowner-education packet identifier; required on every denial" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Homeowner's stated grounds for dispute" }
      - { name: dispute_outcome, type: enum, source: system, default: null, description: "BUILDER_UPHELD | HOMEOWNER_PREVAILS | SETTLED; set by resolve-dispute" }
      - { name: dispute_deadline_at, type: datetime, source: computed, default: null, description: "= denied_at + 30 days (inclusive deadline: dispute accepted when now <= deadline)" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Timestamp of warrantable assess; completion-SLA anchor" }
      - { name: response_due_at, type: datetime, source: computed, description: "= reported_at + RESPONSE_SLA_HOURS[severity]; recomputed on reopen" }
      - { name: completion_due_at, type: datetime, source: computed, default: null, description: "= approved_at + COMPLETION_SLA_DAYS[severity]" }
      - { name: response_breached, type: boolean, source: system, default: false, description: "true once first assess happens after response_due_at, or sweep finds RECEIVED past due" }
      - { name: completion_breached, type: boolean, source: system, default: false, description: "true when entry into PENDING_FOLLOWUP is after completion_due_at, or sweep finds APPROVED/IN_SERVICE past due" }
      - { name: escalation_level, type: integer, source: system, default: 0, description: "0 none; 1 response breach or reopened; 2 completion breach" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Sum of actual_cost_cents over this request's work orders in status COMPLETED or ACCEPTED" }
      - { name: followup_entered_at, type: datetime, source: system, default: null, description: "When status entered PENDING_FOLLOWUP; sweep auto-closes 14 days later" }
      - { name: satisfaction_score, type: integer, source: input, default: null, description: "1..5 recorded at follow-up" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Timestamp of closure" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Increments each time the request re-enters REOPENED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; parent request" }
      - { name: trade_partner_id, type: string, source: input, description: "FK -> TradePartner.id; dispatched subcontractor" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled visit window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled visit window end (UTC); must be after window_start" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (window_end - window_start) in whole minutes" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Dispatch-time repair cost estimate; provisional chargeback basis" , constraints: ">= 0" }
      - { name: defect_responsibility, type: enum, source: input, description: "SUBCONTRACTOR | BUILDER | HOMEOWNER; triage attribution of fault" }
      - { name: actual_cost_cents, type: integer, source: input, default: null, description: "Final invoiced cost recorded at completion" , constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | ACCEPTED | REJECTED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Completion timestamp" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required when homeowner verify outcome is REJECT" }

  - name: TradePartner
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Subcontractor company name" }
      - { name: trade, type: enum, source: input, description: "PLUMBING | ELECTRICAL | HVAC | DRYWALL | FLOORING | GENERAL" }
      - { name: contact_email, type: string, source: input, description: "Dispatch contact email" }
      - { name: daily_capacity_minutes, type: integer, source: input, default: 480, description: "Max sum of SCHEDULED visit minutes per UTC calendar day" , constraints: "> 0" }
      - { name: outstanding_chargeback_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_cents over this partner's chargebacks in status ISSUED | APPROVED | CONTESTED | UPHELD | REDUCED" }
      - { name: open_work_order_count, type: integer, source: computed, default: 0, description: "Count of this partner's work orders in status SCHEDULED" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; callback work being recovered (unique: at most one non-VOID chargeback per work order)" }
      - { name: trade_partner_id, type: string, source: system, description: "FK -> TradePartner.id; denormalized from the work order at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPROVED | CONTESTED | UPHELD | REDUCED | PAID | WAIVED | VOID" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "chargeback_amount(work_order.estimated_cost_cents) at issuance" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "chargeback_amount(work_order.actual_cost_cents) once the work order completes; REDUCED overwrites with manager-set amount" }
      - { name: amount_basis, type: enum, source: system, description: "PROVISIONAL | FINAL" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "= final_amount_cents when amount_basis == FINAL else provisional_amount_cents" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Sum of recorded payments" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= payable_amount_cents - collected_cents (0 while ISSUED/CONTESTED amounts are recomputed; WAIVED/VOID force 0)" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp" }
      - { name: contest_deadline_at, type: datetime, source: computed, description: "= issued_at + 10 days (inclusive: contest accepted when now <= deadline)" }
      - { name: contest_reason, type: string, source: input, default: null, description: "Trade partner's contest grounds" }
      - { name: resolution_notes, type: string, source: input, default: null, description: "Manager notes on resolve" }

  - name: WarrantyReserve
    parent: null
    common_fields: true
    fields:
      - { name: home_id, type: string, source: system, description: "FK -> Home.id; exactly one reserve per home (created with the home)" , constraints: "unique" }
      - { name: expected_lifetime_accrual_cents, type: integer, source: computed, description: "= round_half_up(sale_price_cents * ACCRUAL_RATE); TRUE_UP recomputes with revised rate" }
      - { name: accrued_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of ACCRUAL + TRUE_UP entry amounts" }
      - { name: drawn_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of absolute values of DRAW entries (draws stored negative)" }
      - { name: recovered_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of RECOVERY entry amounts" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "= signed sum of ALL ReserveEntry.amount_cents for this reserve (ledger conservation invariant)" }
      - { name: last_accrual_month_index, type: integer, source: system, default: 0, description: "Number of monthly accruals already posted; sweep posts months last_accrual_month_index+1 .. months_elapsed" }
      - { name: alert_status, type: enum, source: computed, description: "NORMAL | ELEVATED | DEPLETED — reserve_trend_alert thresholds" }

  - name: ReserveEntry
    parent: null
    common_fields: false
    fields:
      - { name: reserve_id, type: string, source: system, description: "FK -> WarrantyReserve.id; owning reserve" }
      - { name: kind, type: enum, source: system, description: "ACCRUAL | TRUE_UP | MANUAL_ADJUSTMENT | DRAW | RECOVERY" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: ACCRUAL/TRUE_UP/RECOVERY positive, DRAW negative, MANUAL_ADJUSTMENT either" }
      - { name: month_index, type: integer, source: system, default: null, description: "Accrual month number (1..120) for ACCRUAL entries" }
      - { name: work_order_ref, type: string, source: system, default: null, description: "Related work order id for DRAW entries (audit trail only)" }
      - { name: chargeback_ref, type: string, source: system, default: null, description: "Related chargeback id for RECOVERY entries (audit trail only)" }
      - { name: claim_ref, type: string, source: system, default: null, description: "Related administrator claim id for RECOVERY entries (audit trail only)" }
      - { name: note, type: string, source: system, default: null, description: "Free-text note for manual entries" }

  - name: AdministratorClaim
    parent: null
    common_fields: true
    fields:
      - { name: service_request_id, type: string, source: input, description: "FK -> ServiceRequest.id; structural request being claimed (unique: at most one claim per service request)" }
      - { name: home_id, type: string, source: system, description: "FK -> Home.id; denormalized from the service request at creation" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount filed with the third-party administrator" , constraints: "> 0" }
      - { name: external_reference, type: string, source: input, default: null, description: "Administrator's claim number, if known at filing" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PAID | DENIED" }
      - { name: approved_amount_cents, type: integer, source: input, default: null, description: "Amount the administrator agrees to pay; 0 < approved <= claimed" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Required when administrator denies" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Decision timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceRequest
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /service-requests/{id}/assess with warrantable=true"
        actor: WarrantyRep
        preconditions:
          - "coverage_determination(item_category, reported_at, home.closing_date) says covered: category tier map hit AND reported_at within [closing_date, tier end) (end EXCLUSIVE)"
          - "item_category not in EXCLUDED set {LANDSCAPING, APPLIANCE, ROUTINE_MAINTENANCE}"
        side_effects:
          - "determined_tier := CATEGORY_TIER_MAP[item_category]; approved_at := now; completion_due_at := approved_at + COMPLETION_SLA_DAYS[severity]"
          - "if now > response_due_at then response_breached := true and escalation_level := max(escalation_level, 1)"
        note: "warrantable=true on an out-of-term or excluded item is rejected (ERR_OUT_OF_WARRANTY / ERR_ITEM_NOT_COVERED), it does NOT silently deny"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /service-requests/{id}/assess with warrantable=false"
        actor: WarrantyRep
        preconditions:
          - "denial_reason_code present (enum OUT_OF_TERM | EXCLUDED_CATEGORY | HOMEOWNER_CAUSED | NORMAL_MAINTENANCE)"
          - "education_packet_code present (non-warrantable determination ALWAYS ships homeowner education)"
        side_effects:
          - "denied_at := now; dispute_deadline_at := denied_at + 30 days"
          - "if now > response_due_at then response_breached := true and escalation_level := max(escalation_level, 1)"
      - from: REOPENED
        to: APPROVED
        trigger: "POST /service-requests/{id}/assess with warrantable=true"
        actor: WarrantyRep
        preconditions: ["same coverage checks as RECEIVED -> APPROVED, evaluated against the ORIGINAL reported_at"]
        side_effects:
          - "determined_tier := CATEGORY_TIER_MAP[item_category]; approved_at := now; completion_due_at := approved_at + COMPLETION_SLA_DAYS[severity]"
      - from: REOPENED
        to: DENIED
        trigger: "POST /service-requests/{id}/assess with warrantable=false"
        actor: WarrantyRep
        preconditions: ["denial_reason_code present", "education_packet_code present"]
        side_effects:
          - "denied_at := now; dispute_deadline_at := denied_at + 30 days; dispute_outcome := null"
      - from: APPROVED
        to: IN_SERVICE
        trigger: "system (automatic when the first WorkOrder for this request is created by POST /work-orders)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: PENDING_FOLLOWUP
        trigger: "system (automatic bubble-up when the last non-CANCELLED WorkOrder of this request reaches ACCEPTED)"
        actor: system
        preconditions: ["every WorkOrder w of this request has w.status in {ACCEPTED, CANCELLED} AND at least one is ACCEPTED"]
        side_effects:
          - "followup_entered_at := now"
          - "if now > completion_due_at then completion_breached := true and escalation_level := 2"
      - from: PENDING_FOLLOWUP
        to: CLOSED
        trigger: "POST /service-requests/{id}/follow-up"
        actor: WarrantyRep
        preconditions: ["satisfaction_score present in 1..5"]
        side_effects: ["closed_at := now"]
      - from: PENDING_FOLLOWUP
        to: CLOSED
        trigger: "system (POST /ops/run-sweep auto-closes when now >= followup_entered_at + 14 days)"
        actor: system
        preconditions: []
        side_effects: ["closed_at := now"]
      - from: DENIED
        to: DISPUTED
        trigger: "POST /service-requests/{id}/dispute"
        actor: Homeowner
        preconditions:
          - "now <= dispute_deadline_at (deadline INCLUSIVE)"
          - "acting homeowner owns the request (homeowner_id == X-User-ID)"
        side_effects: ["dispute_reason := payload.dispute_reason"]
      - from: DISPUTED
        to: REOPENED
        trigger: "POST /service-requests/{id}/resolve-dispute with outcome=HOMEOWNER_PREVAILS"
        actor: WarrantyManager
        preconditions: []
        side_effects:
          - "dispute_outcome := HOMEOWNER_PREVAILS; reopened_count += 1"
          - "response_due_at := now + RESPONSE_SLA_HOURS[severity]; response_breached := false; escalation_level := max(escalation_level, 1)"
          - "completion_due_at := null; approved_at := null; determined_tier := null (coverage must be re-assessed against original reported_at)"
        note: "this is the arbitration-overturn cycle: DENIED -> DISPUTED -> REOPENED -> assess -> ..."
      - from: DISPUTED
        to: DENIED
        trigger: "POST /service-requests/{id}/resolve-dispute with outcome=BUILDER_UPHELD"
        actor: WarrantyManager
        preconditions: []
        side_effects: ["dispute_outcome := BUILDER_UPHELD; denied_at := now; dispute_deadline_at := denied_at + 30 days"]
      - from: DISPUTED
        to: CLOSED
        trigger: "POST /service-requests/{id}/resolve-dispute with outcome=SETTLED"
        actor: WarrantyManager
        preconditions: []
        side_effects: ["dispute_outcome := SETTLED; closed_at := now"]

  - entity: WorkOrder
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: TradePartner
        preconditions:
          - "acting trade partner is the dispatched one (trade_partner_id == X-User-ID)"
          - "actual_cost_cents present and >= 0"
        side_effects:
          - "actual_cost_cents := payload.actual_cost_cents; completed_at := now"
          - "CASCADE L2: ServiceRequest.actual_cost_cents recomputed (sum of actual_cost_cents over its work orders in {COMPLETED, ACCEPTED})"
          - "CASCADE L3: WarrantyReserve of the request's home posts ReserveEntry kind=DRAW amount=-actual_cost_cents; balance_cents, drawn_to_date_cents recomputed; alert_status re-evaluated (reserve_trend_alert)"
          - "if a linked Chargeback exists with amount_basis == PROVISIONAL and status in {ISSUED, CONTESTED}: recompute final_amount_cents = chargeback_amount(actual_cost_cents); amount_basis := FINAL; if final_amount_cents == 0 the chargeback auto-transitions ISSUED/CONTESTED -> VOID"
      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /work-orders/{id}/verify with outcome=ACCEPT"
        actor: Homeowner
        preconditions: ["acting homeowner owns the parent request's home"]
        side_effects:
          - "bubble-up: if every sibling work order of the parent request is in {ACCEPTED, CANCELLED} and at least one is ACCEPTED, the ServiceRequest auto-transitions IN_SERVICE -> PENDING_FOLLOWUP"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /work-orders/{id}/verify with outcome=REJECT"
        actor: Homeowner
        preconditions: ["rejection_reason present", "acting homeowner owns the parent request's home"]
        side_effects: []
        note: "workmanship rework loop: REJECTED -> reschedule -> SCHEDULED -> complete again"
      - from: REJECTED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/reschedule"
        actor: WarrantyRep
        preconditions: ["new window passes ERR_INVALID_REQUEST shape, ERR_INVALID_WINDOW (not in the past), ERR_TRADE_CAPACITY_EXCEEDED, ERR_HOME_VISIT_OVERLAP checks"]
        side_effects:
          - "window_start/window_end/duration_minutes replaced; TradePartner.open_work_order_count += 1 (re-entering SCHEDULED)"
          - "completed_at := null; actual_cost_cents retained for audit but EXCLUDED from ServiceRequest.actual_cost_cents until re-completed (status REJECTED/SCHEDULED not in {COMPLETED, ACCEPTED}); ServiceRequest.actual_cost_cents recomputed"
          - "reserve impact of the earlier completion is NOT reversed (DRAW entries are append-only); the re-completion posts a second DRAW for the new actual cost"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/reschedule"
        actor: WarrantyRep
        preconditions: ["same window validations as REJECTED -> SCHEDULED"]
        side_effects: ["window fields replaced; open_work_order_count unchanged (stays SCHEDULED)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: WarrantyRep
        preconditions: []
        side_effects:
          - "TradePartner.open_work_order_count -= 1"
          - "a linked Chargeback in status ISSUED with amount_basis == PROVISIONAL auto-transitions ISSUED -> VOID"

  - entity: Chargeback
    initial_state: ISSUED
    terminal_states: [PAID, WAIVED, VOID]
    transitions:
      - from: ISSUED
        to: APPROVED
        trigger: "POST /chargebacks/{id}/approve (manual) OR system sweep auto-approval"
        actor: WarrantyManager
        preconditions:
          - "manual path: none beyond state"
          - "sweep path (chargeback_auto_approval_gate): now > contest_deadline_at AND payable_amount_cents <= AUTO_APPROVE_CAP_CENTS"
        side_effects: []
        note: "branch point 1 of the fork: straight-through approval vs contest"
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /chargebacks/{id}/contest"
        actor: TradePartner
        preconditions:
          - "now <= contest_deadline_at (INCLUSIVE)"
          - "acting trade partner is the charged one (trade_partner_id == X-User-ID)"
        side_effects: ["contest_reason := payload.contest_reason"]
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /chargebacks/{id}/resolve with outcome=UPHELD"
        actor: WarrantyManager
        preconditions: []
        side_effects: ["resolution_notes := payload.resolution_notes"]
        note: "branch fork: UPHELD leads to payment + reserve recovery; WAIVED leads to zero recovery — divergent side-effect sets"
      - from: CONTESTED
        to: REDUCED
        trigger: "POST /chargebacks/{id}/resolve with outcome=REDUCED"
        actor: WarrantyManager
        preconditions: ["reduced_amount_cents present AND 0 < reduced_amount_cents < payable_amount_cents"]
        side_effects:
          - "final_amount_cents := reduced_amount_cents; amount_basis := FINAL; outstanding_cents recomputed"
          - "TradePartner.outstanding_chargeback_cents recomputed"
      - from: CONTESTED
        to: WAIVED
        trigger: "POST /chargebacks/{id}/resolve with outcome=WAIVED"
        actor: WarrantyManager
        preconditions: []
        side_effects:
          - "outstanding_cents := 0"
          - "TradePartner.outstanding_chargeback_cents recomputed"
          - "NO reserve entry is posted (compensation branch: nothing was ever drawn for a chargeback, so waiver posts nothing)"
      - from: APPROVED
        to: PAID
        trigger: "POST /chargebacks/{id}/payments when collected_cents + amount_cents == outstanding_cents"
        actor: FinanceAdmin
        preconditions: ["0 < amount_cents <= outstanding_cents (else ERR_OVERPAYMENT)"]
        side_effects:
          - "CASCADE L2: WarrantyReserve of the chargeback's home posts ReserveEntry kind=RECOVERY amount=+amount_cents (chargeback_ref set); balance_cents, recovered_to_date_cents recomputed; alert_status re-evaluated"
          - "TradePartner.outstanding_chargeback_cents recomputed (drops to remaining over remaining open chargebacks)"
        note: "partial payment (collected+amount < outstanding) records the payment, recomputes outstanding_cents, and leaves status unchanged — no transition"
      - from: UPHELD
        to: PAID
        trigger: "POST /chargebacks/{id}/payments (same completion rule as APPROVED -> PAID)"
        actor: FinanceAdmin
        preconditions: ["0 < amount_cents <= outstanding_cents"]
        side_effects: ["same RECOVERY cascade as APPROVED -> PAID"]
      - from: REDUCED
        to: PAID
        trigger: "POST /chargebacks/{id}/payments (same completion rule)"
        actor: FinanceAdmin
        preconditions: ["0 < amount_cents <= outstanding_cents"]
        side_effects: ["same RECOVERY cascade as APPROVED -> PAID"]
      - from: ISSUED
        to: VOID
        trigger: "system (auto when provisional chargeback's final amount recomputes to 0 at work-order completion, or when the linked work order is cancelled while still PROVISIONAL)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_cents := 0; TradePartner.outstanding_chargeback_cents recomputed"]
      - from: CONTESTED
        to: VOID
        trigger: "system (auto when the final amount recomputes to 0 at work-order completion while under contest)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_cents := 0; TradePartner.outstanding_chargeback_cents recomputed"]

  - entity: AdministratorClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: PAID
        trigger: "POST /administrator-claims/{id}/decide with outcome=ACCEPT"
        actor: WarrantyAdministrator
        preconditions: ["approved_amount_cents present AND 0 < approved_amount_cents <= claimed_amount_cents"]
        side_effects:
          - "decided_at := now"
          - "WarrantyReserve of the claim's home posts ReserveEntry kind=RECOVERY amount=+approved_amount_cents (claim_ref set); balance_cents, recovered_to_date_cents recomputed; alert_status re-evaluated"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /administrator-claims/{id}/decide with outcome=DENY"
        actor: WarrantyAdministrator
        preconditions: ["denial_reason present"]
        side_effects: ["decided_at := now"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: reserve-adjust-stale-version
    parent_entity: WarrantyReserve
    write_endpoint: "POST /warranty-reserves/{id}/adjustments"
    occ_field: expected_reserve_version
    description: |
      Posting a manual adjustment or true-up against a WarrantyReserve whose
      version has advanced since the client last observed it (e.g., a sweep
      posted ACCRUAL entries, or a work-order completion posted a DRAW, after
      the client read the reserve) is rejected. The client must re-read the
      reserve and resubmit with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: coverage_determination
    trigger: "POST /service-requests/{id}/assess with warrantable=true"
    algorithm: threshold
    formula: |
      tier = CATEGORY_TIER_MAP[item_category]          # EXCLUDED categories have no tier
      if item_category in {LANDSCAPING, APPLIANCE, ROUTINE_MAINTENANCE}: reject ERR_ITEM_NOT_COVERED
      window_start = home.closing_date  (00:00:00Z)
      window_end   = closing_date + TERM_MONTHS[tier] months   # EXCLUSIVE (half-open)
      covered = (window_start <= reported_at_instant) and (reported_at_instant < window_end)
      if not covered: reject ERR_OUT_OF_WARRANTY
    input_set: "the ServiceRequest being assessed; its Home (closing_date); tier windows anchored at closing_date"
    constants:
      TERM_MONTHS: { WORKMANSHIP: 12, SYSTEMS: 24, STRUCTURAL: 120 }
      CATEGORY_TIER_MAP:
        DRYWALL_PAINT: WORKMANSHIP
        FLOORING: WORKMANSHIP
        PLUMBING: SYSTEMS
        ELECTRICAL: SYSTEMS
        HVAC: SYSTEMS
        FOUNDATION: STRUCTURAL
        FRAMING: STRUCTURAL
    precision: "instant comparison at second precision; end boundary EXCLUSIVE (reported_at == end_date instant => NOT covered)"
    variants: []

  - name: reserve_accrual_schedule
    trigger: "POST /ops/run-sweep (posts one ACCRUAL entry per fully elapsed, not-yet-posted month per home) and POST /warranty-reserves/{id}/adjustments kind=TRUE_UP"
    algorithm: aggregation
    formula: |
      expected_lifetime_accrual_cents = round_half_up(sale_price_cents * ACCRUAL_RATE)
      months_elapsed = number of monthly anniversaries of closing_date that are <= current clock date,
                       capped at ACCRUAL_TERM_MONTHS (anniversary day counts when clock date >= anniversary)
      monthly(m) = round_half_up(expected_lifetime_accrual_cents / ACCRUAL_TERM_MONTHS)   for m in 1..ACCRUAL_TERM_MONTHS-1
      monthly(ACCRUAL_TERM_MONTHS) = expected_lifetime_accrual_cents - sum(monthly(1..ACCRUAL_TERM_MONTHS-1))
      PINNED ROUNDING ORDER: each month is rounded to whole cents INDIVIDUALLY (round-half-up),
      months 1..119 take the rounded value, and month 120 takes the remainder.
      The alternative (sum exact fractions then round once) yields different cents and is FORBIDDEN.
      sweep posts entries for months last_accrual_month_index+1 .. months_elapsed, then
      last_accrual_month_index := months_elapsed (idempotent: re-running posts nothing new).
    input_set: "all Homes (each has exactly one WarrantyReserve); ReserveEntry rows kind=ACCRUAL per reserve"
    constants:
      ACCRUAL_RATE: 0.005
      ACCRUAL_TERM_MONTHS: 120
    precision: "integer cents; division rounding round_half_up per month"
    variants:
      - name: provisional_schedule
        when: "default monthly accrual posted by the sweep"
        difference: "straight-line schedule at ACCRUAL_RATE over 120 months as above"
      - name: true_up_schedule
        when: "FinanceAdmin posts kind=TRUE_UP with revised_accrual_rate (actuarial re-rating)"
        difference: "expected_lifetime recomputed = round_half_up(sale_price_cents * revised_accrual_rate); a single TRUE_UP entry of (months_already_elapsed * round_half_up(new_expected/120) - accrued_to_date_cents) is posted so accrual-to-date matches the NEW schedule for elapsed months; future months accrue at the new monthly amount. Identical home + identical elapsed months => different accrued_to_date than the provisional schedule."

  - name: chargeback_amount
    trigger: "POST /chargebacks (provisional, from estimated_cost_cents) and POST /work-orders/{id}/complete (final, from actual_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      recoverable = max(0, cost_cents - CHARGEBACK_DEDUCTIBLE_CENTS)
      capped      = min(recoverable, CHARGEBACK_CAP_CENTS)
      admin_fee   = min(round_half_up(capped * ADMIN_FEE_RATE), ADMIN_FEE_MAX_CENTS)
      total       = capped + admin_fee
      if total == 0: chargeback auto-VOIDs (no-charge below-or-at deductible)
    input_set: "single Chargeback; cost basis is work_order.estimated_cost_cents (provisional) or work_order.actual_cost_cents (final)"
    constants:
      CHARGEBACK_DEDUCTIBLE_CENTS: 25000
      CHARGEBACK_CAP_CENTS: 500000
      ADMIN_FEE_RATE: 0.10
      ADMIN_FEE_MAX_CENTS: 15000
    precision: "integer cents; fee rounding round_half_up AFTER the 10% multiply, BEFORE the min with ADMIN_FEE_MAX_CENTS"
    variants:
      - name: provisional_amount
        when: "chargeback issued before the work order completes"
        difference: "cost basis = estimated_cost_cents; recorded in provisional_amount_cents with amount_basis=PROVISIONAL"
      - name: final_amount
        when: "work order completes (actual cost known) or manager resolves REDUCED"
        difference: "cost basis = actual_cost_cents (or manager-set reduced amount); recorded in final_amount_cents with amount_basis=FINAL; same chargeback + same formula but different cost basis => different payable amount"

  - name: sla_deadline_tracking
    trigger: "POST /service-requests (anchor response SLA), POST assess (evaluate response SLA, anchor completion SLA), sweep (raise breach flags), entry into PENDING_FOLLOWUP (evaluate completion SLA)"
    algorithm: threshold
    formula: |
      response_due_at   = reported_at + RESPONSE_SLA_HOURS[severity]        # REOPENED: re-anchored at reopen instant
      completion_due_at = approved_at + COMPLETION_SLA_DAYS[severity]
      response breach:   first assess instant > response_due_at   (strictly greater; assess exactly AT the due instant is MET)
      completion breach: followup_entered_at > completion_due_at  (strictly greater; exactly AT due is MET)
      sweep sets response_breached=true / completion_breached=true for requests still in
      RECEIVED (resp. APPROVED or IN_SERVICE) whose due instant is strictly before now;
      escalation_level := 1 on response breach, := 2 on completion breach.
    input_set: "ServiceRequest rows in non-terminal status at evaluation instant"
    constants:
      RESPONSE_SLA_HOURS: { EMERGENCY: 4, URGENT: 24, STANDARD: 72 }
      COMPLETION_SLA_DAYS: { EMERGENCY: 3, URGENT: 7, STANDARD: 30 }
    precision: "second precision; due instant itself counts as MET (boundary is inclusive-met, exclusive-breach: breach iff evaluated_at > due)"
    variants: []

  - name: reserve_trend_alert
    trigger: "after every ReserveEntry insert (DRAW, RECOVERY, ACCRUAL, TRUE_UP, MANUAL_ADJUSTMENT) recompute the owning reserve's alert_status"
    algorithm: threshold
    formula: |
      if balance_cents < 0:                                              alert_status = DEPLETED
      elif balance_cents < round_half_up(expected_lifetime_accrual_cents * ALERT_FRACTION):  alert_status = ELEVATED
      else:                                                              alert_status = NORMAL
      Both thresholds are STRICTLY-below triggers: balance exactly == 0 is ELEVATED-or-better
      (0 < threshold when expected > 0, so balance == 0 yields ELEVATED); balance exactly
      == round_half_up(expected * ALERT_FRACTION) is NORMAL.
    input_set: "all ReserveEntry rows of the reserve (signed sum => balance_cents); expected_lifetime_accrual_cents"
    constants:
      ALERT_FRACTION: 0.20
    precision: "integer cents; threshold rounding round_half_up"
    variants: []

  - name: chargeback_auto_approval_gate
    trigger: "POST /ops/run-sweep"
    algorithm: threshold
    formula: |
      for each Chargeback in status ISSUED (ordered by issued_at ASC, tie-break created_at ASC):
        if now > contest_deadline_at AND payable_amount_cents <= AUTO_APPROVE_CAP_CENTS:
          status := APPROVED   (auto)
      boundary: payable exactly == AUTO_APPROVE_CAP_CENTS IS auto-approved (inclusive <=);
      contest_deadline is EXCLUSIVE for the sweep (now must be strictly later).
    input_set: "Chargeback rows with status == ISSUED"
    constants:
      AUTO_APPROVE_CAP_CENTS: 100000
      CONTEST_WINDOW_DAYS: 10
    precision: "integer cents; second-precision deadline comparison"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ownership: Homeowner may only act on service requests/work orders of homes where home.homeowner_id == X-User-ID; TradePartner may only complete its own work orders and contest its own chargebacks"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /service-requests, POST /service-requests/{id}/dispute, POST /work-orders/{id}/complete, POST /work-orders/{id}/verify, POST /chargebacks/{id}/contest"
  - priority: 4
    category: existence
    check: "path and body identifiers resolve, validated left-to-right: home, then service request, then work order, then trade partner, then chargeback, then reserve, then claim"
    error_id: ERR_HOME_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {id} under /homes or with home_id in body"
  - priority: 5
    category: existence
    check: "service request id resolves"
    error_id: ERR_SERVICE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /service-requests/{id} or with service_request_id in body"
  - priority: 6
    category: existence
    check: "work order id resolves"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /work-orders/{id} or with work_order_id in body"
  - priority: 7
    category: existence
    check: "trade partner id resolves"
    error_id: ERR_TRADE_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /work-orders (trade_partner_id in body)"
  - priority: 8
    category: existence
    check: "chargeback id resolves"
    error_id: ERR_CHARGEBACK_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /chargebacks/{id}"
  - priority: 9
    category: existence
    check: "warranty reserve id resolves"
    error_id: ERR_RESERVE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /warranty-reserves/{id}"
  - priority: 10
    category: existence
    check: "administrator claim id resolves"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints under /administrator-claims/{id}"
  - priority: 11
    category: existence
    check: "homeowner id resolves (home creation body, homeowner fetch path)"
    error_id: ERR_HOMEOWNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /homes, GET /homeowners/{id}"
  - priority: 12
    category: business_constraint
    check: "request shape: all required input fields present; enum values in-domain; integer cents within constraints (sale_price_cents > 0, estimated/actual >= 0, claimed > 0, satisfaction 1..5); window_end strictly after window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 13
    category: state
    check: "target resource is in a state from which the requested transition exists (e.g., assess requires RECEIVED|REOPENED; complete requires SCHEDULED; contest requires ISSUED; approve requires ISSUED; resolve requires CONTESTED; dispute requires DENIED; resolve-dispute requires DISPUTED; follow-up requires PENDING_FOLLOWUP; dispatch requires APPROVED; decide requires SUBMITTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 14
    category: state
    check: "target resource is in a TERMINAL state (ServiceRequest CLOSED; WorkOrder ACCEPTED|CANCELLED; Chargeback PAID|WAIVED|VOID; AdministratorClaim PAID|DENIED) — distinct from a merely wrong non-terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 15
    category: state
    check: "OCC: expected_reserve_version equals the reserve's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /warranty-reserves/{id}/adjustments"
  - priority: 16
    category: business_constraint
    check: "category coverage: assess with warrantable=true requires item_category not in EXCLUDED set {LANDSCAPING, APPLIANCE, ROUTINE_MAINTENANCE} (excluded categories have no tier window at all, so this check precedes the temporal one)"
    error_id: ERR_ITEM_NOT_COVERED
    http_status: 422
    applies_to: "POST /service-requests/{id}/assess"
  - priority: 17
    category: business_temporal
    check: "coverage window: for a tier-mapped category, assess with warrantable=true requires reported_at within [closing_date, tier end) — end EXCLUSIVE"
    error_id: ERR_OUT_OF_WARRANTY
    http_status: 422
    applies_to: "POST /service-requests/{id}/assess"
  - priority: 18
    category: business_constraint
    check: "denial completeness: assess with warrantable=false requires both denial_reason_code AND education_packet_code (missing reason code is ERR_INVALID_REQUEST at priority 12; reason code present but education packet missing fails here)"
    error_id: ERR_EDUCATION_PACKET_REQUIRED
    http_status: 422
    applies_to: "POST /service-requests/{id}/assess"
  - priority: 19
    category: business_temporal
    check: "dispute filing window: now <= dispute_deadline_at (INCLUSIVE)"
    error_id: ERR_DISPUTE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /service-requests/{id}/dispute"
  - priority: 20
    category: business_temporal
    check: "schedule sanity: window_start must not be strictly before the current clock (window_end <= window_start is a shape error at priority 12)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /work-orders, POST /work-orders/{id}/reschedule"
  - priority: 21
    category: business_constraint
    check: "trade daily capacity: sum of duration_minutes over the partner's SCHEDULED work orders whose window_start UTC calendar date equals the new window_start's UTC date, plus the new duration, must be <= daily_capacity_minutes (== allowed)"
    error_id: ERR_TRADE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders, POST /work-orders/{id}/reschedule"
  - priority: 22
    category: business_constraint
    check: "home visit overlap: no half-open interval overlap between the new window and any SCHEDULED work order of the same home: overlap iff new_start < existing_end AND existing_start < new_end (adjacent back-to-back windows are ALLOWED)"
    error_id: ERR_HOME_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /work-orders, POST /work-orders/{id}/reschedule"
  - priority: 23
    category: business_constraint
    check: "chargeback uniqueness: at most one chargeback in any non-VOID status per work order"
    error_id: ERR_DUPLICATE_CHARGEBACK
    http_status: 409
    applies_to: "POST /chargebacks"
  - priority: 24
    category: business_constraint
    check: "claim uniqueness: at most one administrator claim per service request"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /administrator-claims"
  - priority: 25
    category: business_referential
    check: "chargeback eligibility: the work order's defect_responsibility must be SUBCONTRACTOR and the work order must be in SCHEDULED (provisional issuance) — chargebacks on COMPLETED-or-later work orders are rejected so provisional-vs-final stays observable"
    error_id: ERR_NOT_CHARGEBACKABLE
    http_status: 422
    applies_to: "POST /chargebacks"
  - priority: 26
    category: business_referential
    check: "program eligibility: the service request's home must have warranty_program == THIRD_PARTY_ADMINISTERED"
    error_id: ERR_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /administrator-claims"
  - priority: 27
    category: business_referential
    check: "tier eligibility: the service request must be APPROVED with determined_tier == STRUCTURAL"
    error_id: ERR_CLAIM_TIER_INELIGIBLE
    http_status: 422
    applies_to: "POST /administrator-claims"
  - priority: 28
    category: business_temporal
    check: "contest window: now <= contest_deadline_at (INCLUSIVE)"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /chargebacks/{id}/contest"
  - priority: 29
    category: business_fiscal
    check: "payment bounds: 0 < amount_cents (shape) and amount_cents <= outstanding_cents (overpayment rejected)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /chargebacks/{id}/payments"
  - priority: 30
    category: business_fiscal
    check: "adjustment bounds: MANUAL_ADJUSTMENT requires non-zero amount_cents; TRUE_UP requires revised_accrual_rate > 0 (missing/wrong field for the kind is ERR_INVALID_REQUEST at priority 12)"
    error_id: ERR_INVALID_ADJUSTMENT
    http_status: 422
    applies_to: "POST /warranty-reserves/{id}/adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /homeowners
    description: "Register a homeowner"
    roles: [WarrantyManager]
    code: 201
    input: [full_name, email, "phone?"]
    output: Homeowner
    side_effects: []
  - method: GET
    path: /homeowners/{id}
    description: "Fetch a homeowner"
    roles: [WarrantyManager, WarrantyRep, Homeowner]
    code: 200
    input: []
    output: Homeowner
    side_effects: []
  - method: POST
    path: /homes
    description: "Create a warranted home; auto-creates its WarrantyReserve (balance 0, expected accrual computed) and computes the three tier end dates"
    roles: [WarrantyManager]
    code: 201
    input: [homeowner_id, lot_number, community_name, sale_price_cents, closing_date, warranty_program]
    output: Home
    side_effects: ["WarrantyReserve created (version 1)", "tier end dates computed from closing_date"]
  - method: GET
    path: /homes/{id}
    description: "Fetch a home"
    roles: [WarrantyManager, WarrantyRep, FinanceAdmin, Homeowner]
    code: 200
    input: []
    output: Home
    side_effects: []
  - method: GET
    path: /homes
    description: "List homes with filters"
    roles: [WarrantyManager, WarrantyRep, FinanceAdmin]
    code: 200
    input: ["homeowner_id?", "community_name?", "limit?", "offset?"]
    output: "Home[]"
    side_effects: []
  - method: POST
    path: /service-requests
    description: "Homeowner intake of a warranty service request; reported_at stamped from the logical clock; response SLA anchored"
    roles: [Homeowner]
    code: 201
    input: [home_id, item_category, severity, description]
    output: ServiceRequest
    side_effects: ["status RECEIVED", "response_due_at computed", "homeowner_id copied from X-User-ID"]
  - method: GET
    path: /service-requests/{id}
    description: "Fetch a service request"
    roles: [WarrantyManager, WarrantyRep, FinanceAdmin, Homeowner]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: /service-requests
    description: "List service requests with filters"
    roles: [WarrantyManager, WarrantyRep, FinanceAdmin, Homeowner]
    code: 200
    input: ["home_id?", "homeowner_id?", "status?", "severity?", "limit?", "offset?"]
    output: "ServiceRequest[]"
    side_effects: []
  - method: POST
    path: /service-requests/{id}/assess
    description: "Triage: coverage determination. warrantable=true -> APPROVED (tier, SLA anchors); warrantable=false -> DENIED (reason + mandatory education packet)"
    roles: [WarrantyRep]
    code: 200
    input: [warrantable, "denial_reason_code?", "education_packet_code?", "assess_notes?"]
    output: ServiceRequest
    side_effects: ["coverage_determination", "sla_deadline_tracking (response leg evaluated)", "denial sets dispute window"]
  - method: POST
    path: /service-requests/{id}/follow-up
    description: "Record customer follow-up and close the request"
    roles: [WarrantyRep]
    code: 200
    input: [satisfaction_score, "notes?"]
    output: ServiceRequest
    side_effects: ["status PENDING_FOLLOWUP -> CLOSED"]
  - method: POST
    path: /service-requests/{id}/dispute
    description: "Homeowner disputes a denial (arbitration intake) within the 30-day window"
    roles: [Homeowner]
    code: 200
    input: [dispute_reason]
    output: ServiceRequest
    side_effects: ["status DENIED -> DISPUTED"]
  - method: POST
    path: /service-requests/{id}/resolve-dispute
    description: "Record dispute/arbitration outcome: HOMEOWNER_PREVAILS reopens, BUILDER_UPHELD re-denies, SETTLED closes"
    roles: [WarrantyManager]
    code: 200
    input: [outcome, resolution_notes]
    output: ServiceRequest
    side_effects: ["status DISPUTED -> REOPENED | DENIED | CLOSED", "on REOPENED: response SLA re-anchored"]
  - method: POST
    path: /work-orders
    description: "Dispatch a trade partner to an APPROVED service request with a visit window"
    roles: [WarrantyRep]
    code: 201
    input: [service_request_id, trade_partner_id, window_start, window_end, estimated_cost_cents, defect_responsibility]
    output: WorkOrder
    side_effects: ["window validations (past, capacity, overlap)", "TradePartner.open_work_order_count += 1", "parent request APPROVED -> IN_SERVICE on first dispatch"]
  - method: GET
    path: /work-orders/{id}
    description: "Fetch a work order"
    roles: [WarrantyManager, WarrantyRep, TradePartner, Homeowner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: /work-orders
    description: "List work orders with filters"
    roles: [WarrantyManager, WarrantyRep, TradePartner, Homeowner]
    code: 200
    input: ["service_request_id?", "trade_partner_id?", "status?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: POST
    path: /work-orders/{id}/complete
    description: "Trade partner marks the visit complete with actual invoiced cost; fires the cost cascade (request cost, reserve DRAW, chargeback finalization)"
    roles: [TradePartner]
    code: 200
    input: [actual_cost_cents]
    output: WorkOrder
    side_effects: ["status SCHEDULED -> COMPLETED", "CASCADE: ServiceRequest.actual_cost_cents recompute", "CASCADE: reserve DRAW entry + alert re-eval", "CASCADE: linked provisional chargeback finalized (auto-VOID at zero)"]
  - method: POST
    path: /work-orders/{id}/verify
    description: "Homeowner accepts or rejects completed work (rejection drives the rework loop)"
    roles: [Homeowner]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: WorkOrder
    side_effects: ["status COMPLETED -> ACCEPTED | REJECTED", "bubble-up to PENDING_FOLLOWUP when all siblings settled"]
  - method: POST
    path: /work-orders/{id}/reschedule
    description: "Move a SCHEDULED or REJECTED work order to a new visit window (full window revalidation)"
    roles: [WarrantyRep]
    code: 200
    input: [window_start, window_end]
    output: WorkOrder
    side_effects: ["window fields replaced", "REJECTED -> SCHEDULED re-enters capacity accounting"]
  - method: POST
    path: /work-orders/{id}/cancel
    description: "Cancel a SCHEDULED work order"
    roles: [WarrantyRep]
    code: 200
    input: ["cancel_reason?"]
    output: WorkOrder
    side_effects: ["status SCHEDULED -> CANCELLED", "open_work_order_count -= 1", "provisional linked chargeback auto-VOIDs"]
  - method: POST
    path: /trade-partners
    description: "Register a subcontractor"
    roles: [WarrantyManager]
    code: 201
    input: [company_name, trade, contact_email, "daily_capacity_minutes?"]
    output: TradePartner
    side_effects: []
  - method: GET
    path: /trade-partners/{id}
    description: "Fetch a trade partner"
    roles: [WarrantyManager, WarrantyRep, TradePartner, FinanceAdmin]
    code: 200
    input: []
    output: TradePartner
    side_effects: []
  - method: POST
    path: /chargebacks
    description: "Issue a subcontractor chargeback on a SCHEDULED, SUBCONTRACTOR-responsible work order; provisional amount from the estimate"
    roles: [WarrantyRep]
    code: 201
    input: [work_order_id]
    output: Chargeback
    side_effects: ["provisional_amount_cents computed", "contest_deadline_at = issued_at + 10 days", "TradePartner.outstanding_chargeback_cents recomputed"]
  - method: GET
    path: /chargebacks/{id}
    description: "Fetch a chargeback"
    roles: [WarrantyManager, WarrantyRep, TradePartner, FinanceAdmin]
    code: 200
    input: []
    output: Chargeback
    side_effects: []
  - method: GET
    path: /chargebacks
    description: "List chargebacks with filters"
    roles: [WarrantyManager, WarrantyRep, TradePartner, FinanceAdmin]
    code: 200
    input: ["work_order_id?", "trade_partner_id?", "status?", "limit?", "offset?"]
    output: "Chargeback[]"
    side_effects: []
  - method: POST
    path: /chargebacks/{id}/approve
    description: "Manager approval of an issued chargeback (required above the auto-approval cap)"
    roles: [WarrantyManager]
    code: 200
    input: ["approve_notes?"]
    output: Chargeback
    side_effects: ["status ISSUED -> APPROVED"]
  - method: POST
    path: /chargebacks/{id}/contest
    description: "Trade partner contests the chargeback within the 10-day window"
    roles: [TradePartner]
    code: 200
    input: [contest_reason]
    output: Chargeback
    side_effects: ["status ISSUED -> CONTESTED"]
  - method: POST
    path: /chargebacks/{id}/resolve
    description: "Manager resolves a contested chargeback: UPHELD / REDUCED (new amount) / WAIVED"
    roles: [WarrantyManager]
    code: 200
    input: [outcome, "reduced_amount_cents?", resolution_notes]
    output: Chargeback
    side_effects: ["status CONTESTED -> UPHELD | REDUCED | WAIVED", "REDUCED overwrites final_amount_cents", "TradePartner.outstanding_chargeback_cents recomputed"]
  - method: POST
    path: /chargebacks/{id}/payments
    description: "Record a subcontractor payment; full settlement transitions to PAID and credits the reserve"
    roles: [FinanceAdmin]
    code: 200
    input: [amount_cents, "payment_reference?"]
    output: Chargeback
    side_effects: ["collected_cents += amount_cents", "status -> PAID when fully collected", "CASCADE: reserve RECOVERY entry + alert re-eval"]
  - method: GET
    path: /warranty-reserves/{id}
    description: "Fetch a warranty reserve"
    roles: [WarrantyManager, FinanceAdmin, WarrantyRep]
    code: 200
    input: []
    output: WarrantyReserve
    side_effects: []
  - method: GET
    path: /warranty-reserves
    description: "List reserves (home_id filter finds a home's 1:1 reserve; array of length 0 or 1)"
    roles: [WarrantyManager, FinanceAdmin, WarrantyRep]
    code: 200
    input: ["home_id?", "alert_status?", "limit?", "offset?"]
    output: "WarrantyReserve[]"
    side_effects: []
  - method: GET
    path: /warranty-reserves/{id}/entries
    description: "Ledger entries of a reserve, chronological"
    roles: [WarrantyManager, FinanceAdmin, WarrantyRep]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "ReserveEntry[]"
    side_effects: []
  - method: POST
    path: /warranty-reserves/{id}/adjustments
    description: "Post a MANUAL_ADJUSTMENT (signed amount) or TRUE_UP (revised accrual rate) entry; OCC-guarded"
    roles: [FinanceAdmin]
    code: 201
    input: [kind, "amount_cents?", "revised_accrual_rate?", expected_reserve_version, "note?"]
    output: ReserveEntry
    side_effects: ["entry appended", "reserve balance/accrued recomputed", "TRUE_UP replaces expected_lifetime_accrual_cents", "alert re-eval", "increments WarrantyReserve.version by 1"]
  - method: POST
    path: /administrator-claims
    description: "File a structural claim with the third-party warranty administrator (created already SUBMITTED)"
    roles: [WarrantyRep]
    code: 201
    input: [service_request_id, claimed_amount_cents, "external_reference?"]
    output: AdministratorClaim
    side_effects: ["status SUBMITTED"]
  - method: GET
    path: /administrator-claims/{id}
    description: "Fetch an administrator claim"
    roles: [WarrantyManager, WarrantyRep, WarrantyAdministrator, FinanceAdmin]
    code: 200
    input: []
    output: AdministratorClaim
    side_effects: []
  - method: GET
    path: /administrator-claims
    description: "List administrator claims with filters"
    roles: [WarrantyManager, WarrantyRep, WarrantyAdministrator, FinanceAdmin]
    code: 200
    input: ["service_request_id?", "home_id?", "status?", "limit?", "offset?"]
    output: "AdministratorClaim[]"
    side_effects: []
  - method: POST
    path: /administrator-claims/{id}/decide
    description: "Administrator accepts (with approved amount; reserve RECOVERY posted, claim PAID) or denies"
    roles: [WarrantyAdministrator]
    code: 200
    input: [outcome, "approved_amount_cents?", "denial_reason?"]
    output: AdministratorClaim
    side_effects: ["status SUBMITTED -> PAID | DENIED", "on ACCEPT: reserve RECOVERY entry + alert re-eval"]
  - method: POST
    path: /ops/run-sweep
    description: "Operations checkpoint: post due monthly accruals (idempotent per month), raise SLA breach flags/escalations, auto-approve eligible chargebacks, auto-close stale PENDING_FOLLOWUP requests"
    roles: [WarrantyManager]
    code: 200
    input: []
    output: { accrual_entries_posted: integer, chargebacks_auto_approved: integer, requests_marked_response_breached: integer, requests_marked_completion_breached: integer, requests_auto_closed: integer }
    side_effects: ["reserve_accrual_schedule (each ACCRUAL post re-evaluates reserve_trend_alert)", "sla_deadline_tracking sweep leg", "chargeback_auto_approval_gate", "auto-close"]
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; the server NEVER falls back to wall-clock time."
    roles: [WarrantyManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock replaced; all timestamps/deadlines derive from it"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed role acting on a resource it does not own" }
  - { id: ERR_HOME_NOT_FOUND, http: 404, condition: "home id does not resolve" }
  - { id: ERR_SERVICE_REQUEST_NOT_FOUND, http: 404, condition: "service request id does not resolve" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "work order id does not resolve" }
  - { id: ERR_TRADE_PARTNER_NOT_FOUND, http: 404, condition: "trade partner id does not resolve" }
  - { id: ERR_CHARGEBACK_NOT_FOUND, http: 404, condition: "chargeback id does not resolve" }
  - { id: ERR_RESERVE_NOT_FOUND, http: 404, condition: "warranty reserve id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "administrator claim id does not resolve" }
  - { id: ERR_HOMEOWNER_NOT_FOUND, http: 404, condition: "homeowner id does not resolve (home creation)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, out-of-domain enum, violated numeric constraint, or window_end <= window_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not defined from the resource's current non-terminal state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "resource is in a terminal state; no further transitions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reserve_version does not match the reserve's current version (OCC)" }
  - { id: ERR_OUT_OF_WARRANTY, http: 422, condition: "warrantable assess but reported_at outside [closing_date, tier end) — end exclusive" }
  - { id: ERR_ITEM_NOT_COVERED, http: 422, condition: "warrantable assess on an EXCLUDED category (LANDSCAPING | APPLIANCE | ROUTINE_MAINTENANCE)" }
  - { id: ERR_EDUCATION_PACKET_REQUIRED, http: 422, condition: "denial attempted without education_packet_code" }
  - { id: ERR_DISPUTE_DEADLINE_PASSED, http: 422, condition: "dispute filed after dispute_deadline_at" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start is strictly before the current clock" }
  - { id: ERR_TRADE_CAPACITY_EXCEEDED, http: 409, condition: "partner's SCHEDULED minutes for that UTC day plus new duration exceed daily_capacity_minutes" }
  - { id: ERR_HOME_VISIT_OVERLAP, http: 409, condition: "new window half-open-overlaps an existing SCHEDULED work order at the same home" }
  - { id: ERR_DUPLICATE_CHARGEBACK, http: 409, condition: "a non-VOID chargeback already exists for the work order" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "an administrator claim already exists for the service request" }
  - { id: ERR_NOT_CHARGEBACKABLE, http: 422, condition: "work order's defect_responsibility is not SUBCONTRACTOR, or the work order has already left SCHEDULED" }
  - { id: ERR_PROGRAM_MISMATCH, http: 422, condition: "claim filed for a home whose warranty_program is not THIRD_PARTY_ADMINISTERED" }
  - { id: ERR_CLAIM_TIER_INELIGIBLE, http: 422, condition: "claim filed for a request that is not APPROVED with determined_tier == STRUCTURAL" }
  - { id: ERR_CONTEST_WINDOW_CLOSED, http: 422, condition: "contest attempted after contest_deadline_at" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "payment amount exceeds the chargeback's outstanding_cents" }
  - { id: ERR_INVALID_ADJUSTMENT, http: 422, condition: "MANUAL_ADJUSTMENT with amount_cents == 0, or TRUE_UP with revised_accrual_rate <= 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "Warranty holder; reports callbacks, verifies completed work, disputes denials"
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /service-requests"
      - "POST /service-requests/{id}/dispute"
      - "POST /work-orders/{id}/verify"
    shared_operations:
      - "GET /homes/{id}, GET /service-requests/{id}, GET /service-requests, GET /work-orders/{id}, GET /work-orders, GET /homeowners/{id}"
  - name: WarrantyRep
    description: "Warranty department representative; triage, dispatch, follow-up, chargeback issuance, claim filing"
    identity: opaque
    exclusive_operations:
      - "POST /service-requests/{id}/assess"
      - "POST /service-requests/{id}/follow-up"
      - "POST /work-orders, POST /work-orders/{id}/reschedule, POST /work-orders/{id}/cancel"
      - "POST /chargebacks"
      - "POST /administrator-claims"
    shared_operations:
      - "GET reads across homes, requests, work orders, chargebacks, reserves, entries, claims, homeowners"
  - name: TradePartner
    description: "Subcontractor; completes dispatched work orders, contests chargebacks"
    identity: "entity_backed:TradePartner"
    exclusive_operations:
      - "POST /work-orders/{id}/complete"
      - "POST /chargebacks/{id}/contest"
    shared_operations:
      - "GET /work-orders/{id}, GET /work-orders, GET /chargebacks/{id}, GET /chargebacks, GET /trade-partners/{id}"
  - name: WarrantyManager
    description: "Warranty department manager; master data, chargeback approval/resolution, dispute resolution, ops sweep, clock"
    identity: opaque
    exclusive_operations:
      - "POST /homeowners, POST /homes, POST /trade-partners"
      - "POST /chargebacks/{id}/approve, POST /chargebacks/{id}/resolve"
      - "POST /service-requests/{id}/resolve-dispute"
      - "POST /ops/run-sweep, POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
  - name: FinanceAdmin
    description: "Warranty finance; reserve adjustments/true-ups and chargeback cash application (segregated from issuance and approval)"
    identity: opaque
    exclusive_operations:
      - "POST /warranty-reserves/{id}/adjustments"
      - "POST /chargebacks/{id}/payments"
    shared_operations:
      - "GET reads across homes, requests, chargebacks, reserves, entries, claims, trade partners"
  - name: WarrantyAdministrator
    description: "External third-party warranty administrator; decides structural claims"
    identity: opaque
    exclusive_operations:
      - "POST /administrator-claims/{id}/decide"
    shared_operations:
      - "GET /administrator-claims/{id}, GET /administrator-claims"
