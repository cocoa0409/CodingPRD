# =============================================================================
# §1.9 Scaffold Corner Design — task_1631_life_coaching_accountability_program
# Breadth coverage of testable claims not already probed by §1.8.
# Claim taxonomy from references/claim-extraction-guide.md.
# Standard date plan mirrors §1.8 (activation 2026-08-03, window ends 2026-09-28).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: coach_creation_success_and_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Coach]
        distinguishing_aspect: "POST /coaches with valid input returns 201; credential_status defaults to PENDING_VERIFICATION, ethics_status to ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coaching/coaches"
              payload: { display_name: "New Coach", email: "new.coach@x.com", credential_level: "ACC", credential_expires_on: "2027-06-01", max_concurrent_clients: 5 }
              as: PracticeManager
              captures: { nc_id: $.data.id, nc_cred: $.data.credential_status, nc_eth: $.data.ethics_status, nc_ver: $.data.version }
          assert:
            - "HTTP 201; credential_status == PENDING_VERIFICATION; ethics_status == ACTIVE; version == 1"

      - name: coach_creation_invalid_enum_credential_level_rejected
        claim_type: type_constraints
        grounds: [entities.Coach.fields.credential_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "credential_level outside {ACC, PCC, MCC} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coaching/coaches"
              payload: { display_name: "Bad Enum", email: "bad.enum@x.com", credential_level: "PHD", credential_expires_on: "2027-06-01", max_concurrent_clients: 5 }
              as: PracticeManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 400; no Coach persisted"

      - name: coach_creation_duplicate_email_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Second coach with the same email violates uniqueness -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["one coach with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "First", email: "dup@x.com", credential_level: "ACC", credential_expires_on: "2027-06-01", max_concurrent_clients: 5 }
              as: PracticeManager
          trigger:
            - call: "POST /coaching/coaches"
              payload: { display_name: "Second", email: "dup@x.com", credential_level: "PCC", credential_expires_on: "2027-06-01", max_concurrent_clients: 5 }
              as: PracticeManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RESOURCE; HTTP 409"

      - name: client_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{id} with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /coaching/clients/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PracticeManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; HTTP 404"

      - name: session_booking_with_nonexistent_enrollment_returns_404
        claim_type: parent_relationships
        grounds: [entities.Session.fields.enrollment_id, "validations[priority=3]"]
        distinguishing_aspect: "FK integrity: booking under an absent enrollment id fails existence (404) before any business rule."
        test_recipe:
          setup: ["one client exists; no enrollments"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/clients"
              payload: { full_name: "Client NF", email: "cnf@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_nf: $.data.id }
          trigger:
            - call: "POST /coaching/enrollments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/sessions"
              payload: { scheduled_start: "2026-08-10T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_nf}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; HTTP 404"

      - name: enrollment_creation_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Enrollment.fields.sessions_consumed, entities.Enrollment.fields.paid_cents]
        distinguishing_aspect: "Client-supplied sessions_consumed/paid_cents in the create body are ignored; computed fields initialize to 0."
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor, Client I; Tier PKG-8; discovery call COMPLETED with PROCEED fit"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client I", email: "ci@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_i: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_i: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_i}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_i}"
              captures: { dc_i: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_i}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_i}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 70 }
              as: Coach
              as_user_id: "${coach_b}"
          trigger:
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_i}", coach_id: "${coach_a}", program_tier_id: "${tier_i}", discovery_call_id: "${dc_i}", installment_count: 1, sessions_consumed: 99, paid_cents: 999999 }
              as: Client
              as_user_id: "${client_i}"
              captures: { enr_i: $.data.id, enr_consumed: $.data.sessions_consumed, enr_paid: $.data.paid_cents, enr_lc: $.data.lifecycle_status }
          assert:
            - "HTTP 201; sessions_consumed == 0 and paid_cents == 0 (input ignored)"
            - "lifecycle_status == PENDING_PAYMENT (initial state); sessions_total == 8; sessions_total_price_basis == 80000"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_cancelled_session_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Session.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Complete from CANCELLED is not in the transition list -> ERR_INVALID_STATE; no derived fields change."
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor, Client IC; Tier PKG-8; Enrollment EIC ACTIVE with one session booked then cancelled by client"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client IC", email: "cic@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_ic: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_ic: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_ic}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_ic}"
              captures: { dc_ic: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_ic}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_ic}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 70 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_ic}", coach_id: "${coach_a}", program_tier_id: "${tier_ic}", discovery_call_id: "${dc_ic}", installment_count: 1 }
              as: Client
              as_user_id: "${client_ic}"
              captures: { enr_ic: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_ic}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/enrollments/${enr_ic}/sessions"
              payload: { scheduled_start: "2026-08-06T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_ic}"
              captures: { sess_ic: $.data.id }
            - call: "POST /coaching/sessions/${sess_ic}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_ic}"
          trigger:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/sessions/${sess_ic}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; HTTP 409"
            - "Session.${sess_ic}.session_status == CANCELLED; Enrollment.sessions_consumed == 0"

      - name: cancel_completed_enrollment_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment.transitions, entities.Enrollment.fields.lifecycle_status]
        distinguishing_aspect: "COMPLETED is terminal: cancel from COMPLETED -> ERR_INVALID_STATE (the OCC version may be current; state lockdown fires)."
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor, Client TC; Tier SINGLE-1 (SINGLE, session_count 1, price 15000, duration 30, installments 1, cap 0)"
            - "Enrollment ETC ACTIVE, its single session completed -> auto-COMPLETED bubble-up"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client TC", email: "ctc@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_tc: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "SINGLE-1", tier_type: "SINGLE", session_count: 1, price_cents: 15000, duration_days: 30, installment_count_allowed: 1, reschedule_cap: 0 }
              as: PlatformAdmin
              captures: { tier_tc: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_tc}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_tc}"
              captures: { dc_tc: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_tc}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_tc}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 70 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_tc}", coach_id: "${coach_a}", program_tier_id: "${tier_tc}", discovery_call_id: "${dc_tc}", installment_count: 1 }
              as: Client
              as_user_id: "${client_tc}"
              captures: { enr_tc: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_tc}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/enrollments/${enr_tc}/sessions"
              payload: { scheduled_start: "2026-08-05T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_tc}"
              captures: { sess_tc: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/sessions/${sess_tc}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "GET /coaching/enrollments/${enr_tc}"
              as: Client
              as_user_id: "${client_tc}"
              captures: { enr_tc_lc: $.data.lifecycle_status, enr_tc_v: $.data.version }
          trigger:
            - call: "POST /coaching/enrollments/${enr_tc}/cancel"
              payload: { expected_enrollment_version: "${enr_tc_v}" }
              as: Client
              as_user_id: "${client_tc}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Enrollment auto-COMPLETED after its only session completed (bubble-up): lifecycle_status == COMPLETED"
            - "Cancel from COMPLETED -> error_id == ERR_INVALID_STATE; HTTP 409"

      - name: third_pause_rejected_at_pause_limit
        claim_type: precondition_enforcement
        grounds: [state_machines.Enrollment.ACTIVE_to_PAUSED]
        distinguishing_aspect: "pauses_used reaches PAUSE_LIMIT (2) after two pauses; the third ACTIVE->PAUSED attempt is rejected ERR_INVALID_STATE — a threshold guard on a cyclic transition."
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B assessor, Client PL; Tier PKG-8; Enrollment EPL ACTIVE; pause-resume twice"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client PL", email: "cpl@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_pl: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_pl: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_pl}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_pl}"
              captures: { dc_pl: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_pl}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_pl}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 70 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_pl}", coach_id: "${coach_a}", program_tier_id: "${tier_pl}", discovery_call_id: "${dc_pl}", installment_count: 1 }
              as: Client
              as_user_id: "${client_pl}"
              captures: { enr_pl: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_pl}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /coaching/enrollments/${enr_pl}"
              as: Client
              as_user_id: "${client_pl}"
              captures: { pl_v1: $.data.version }
            - call: "POST /coaching/enrollments/${enr_pl}/pause"
              payload: { expected_enrollment_version: "${pl_v1}" }
              as: Client
              as_user_id: "${client_pl}"
            - call: "GET /coaching/enrollments/${enr_pl}"
              as: Client
              as_user_id: "${client_pl}"
              captures: { pl_v2: $.data.version }
            - call: "POST /coaching/enrollments/${enr_pl}/resume"
              payload: { expected_enrollment_version: "${pl_v2}" }
              as: Client
              as_user_id: "${client_pl}"
            - call: "GET /coaching/enrollments/${enr_pl}"
              as: Client
              as_user_id: "${client_pl}"
              captures: { pl_v3: $.data.version }
            - call: "POST /coaching/enrollments/${enr_pl}/pause"
              payload: { expected_enrollment_version: "${pl_v3}" }
              as: Client
              as_user_id: "${client_pl}"
            - call: "GET /coaching/enrollments/${enr_pl}"
              as: Client
              as_user_id: "${client_pl}"
              captures: { pl_v4: $.data.version, pl_pauses: $.data.pauses_used }
            - call: "POST /coaching/enrollments/${enr_pl}/resume"
              payload: { expected_enrollment_version: "${pl_v4}" }
              as: Client
              as_user_id: "${client_pl}"
            - call: "GET /coaching/enrollments/${enr_pl}"
              as: Client
              as_user_id: "${client_pl}"
              captures: { pl_v5: $.data.version }
          trigger:
            - call: "POST /coaching/enrollments/${enr_pl}/pause"
              payload: { expected_enrollment_version: "${pl_v5}" }
              as: Client
              as_user_id: "${client_pl}"
              captures: { err_id: $.data.error_id }
          assert:
            - "pauses_used == 2 after two completed cycles"
            - "Third pause -> error_id == ERR_INVALID_STATE (pauses_used < PAUSE_LIMIT fails); HTTP 409"

      - name: discovery_call_no_show_cycle_back_to_scheduled
        claim_type: cyclic_shape
        grounds: [state_machines.DiscoveryCall.NO_SHOW_to_SCHEDULED]
        distinguishing_aspect: "Cyclic edge: SCHEDULED -> NO_SHOW -> (PUT reschedule) -> SCHEDULED; the rescheduled call can then be completed normally."
        test_recipe:
          setup:
