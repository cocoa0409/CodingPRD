scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: settlement_accrual_fullmonth_vs_dayproration_variants
        grounds:
          - calculations.panel_revenue_accrual
          - state_machines.MonthlySettlement.OPEN_to_CLOSED_PROVISIONAL
          - state_machines.MonthlySettlement.CLOSED_PROVISIONAL_to_FINALIZED
          - entities.MonthlySettlement.fields.accrued_revenue_cents
        distinguishing_aspect: "Same center-month, two accrual variants on the settlement ledger: close-provisional uses full-month member months (any ACTIVE day in period counts 1), finalize re-rates with day proration (days ACTIVE / days in month); a patient activated mid-month and disenrolled late-month produces different member_months under the two variants and therefore a non-zero delta."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Center C1 opened 2026-01-01, OPEN, one team T1 (cap 300). Plan P1 FULL_RISK, base_pmpm_cents 90000, risk_adjust_factor 1.00, revenue_share_pct 1.00."
            - "Patient PA (risk 1.00) attribution effective 2026-09, activated 2026-09-15; patient PB (risk 1.00) attribution effective 2026-09, activated 2026-09-01."
            - "Settlement for 2026-09 exists in OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /senior-care/centers"
              payload: { name: "South Side", neighborhood_code: "CHI-SOUTH-04", opened_on: "2026-01-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
            - call: "POST /senior-care/centers/${c_id}/care-teams"
              payload: { team_label: "Blue", panel_cap: 300, physician_count: 2, chw_count: 2, behavioral_count: 1 }
              as: NetworkOperator
              captures: { t_id: $.data.id }
            - call: "POST /senior-care/centers/${c_id}/rooms"
              payload: { room_label: "R1", supports_behavioral: true }
              as: NetworkOperator
            - call: "POST /senior-care/centers/${c_id}/open"
              payload: {}
              as: NetworkOperator
            - call: "POST /senior-care/health-plans"
              payload: { plan_name: "MA Gold", contract_type: "FULL_RISK", base_pmpm_cents: 90000, risk_adjust_factor: 1.00, revenue_share_pct: 1.00 }
              as: FinanceController
              captures: { plan_id: $.data.id }
            - call: "POST /senior-care/patients"
              payload: { full_name: "Ana", date_of_birth: "1950-06-01", zip_code: "60601", risk_score: 1.00 }
              as: EnrollmentCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /senior-care/patients"
              payload: { full_name: "Bob", date_of_birth: "1948-03-01", zip_code: "60601", risk_score: 1.00 }
              as: EnrollmentCoordinator
              captures: { pb_id: $.data.id }
            - call: "POST /senior-care/patient-attributions"
              payload: { patient_id: "${pa_id}", health_plan_id: "${plan_id}", care_team_id: "${t_id}", effective_month: "2026-09" }
              as: EnrollmentCoordinator
              captures: { attr_a: $.data.id }
            - call: "POST /senior-care/patient-attributions"
              payload: { patient_id: "${pb_id}", health_plan_id: "${plan_id}", care_team_id: "${t_id}", effective_month: "2026-09" }
              as: EnrollmentCoordinator
              captures: { attr_b: $.data.id }
            - call: "POST /senior-care/patient-attributions/${attr_b}/activate"
              payload: { expected_care_team_version: "${team_v1}" }
              as: EnrollmentCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /senior-care/patient-attributions/${attr_a}/activate"
              payload: { expected_care_team_version: "${team_v2}" }
              as: EnrollmentCoordinator
            - call: "POST /senior-care/monthly-settlements"
              payload: { center_id: "${c_id}", period_month: "2026-09" }
              as: FinanceAnalyst
              captures: { stl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/monthly-settlements/${stl_id}/close-provisional"
              payload: { expected_center_version: "${c_v_pre}" }
              as: FinanceAnalyst
              captures: { prov_rev: $.data.accrued_revenue_cents }
            - call: "POST /senior-care/monthly-settlements/${stl_id}/finalize"
              payload: {}
              as: FinanceController
              captures: { final_rev: $.data.accrued_revenue_cents }
          assert:
            - "provisional accrued_revenue_cents == 180000 (two patients x full-month 90000 x 1.00 x 1.00)"
            - "final accrued_revenue_cents == 138000 (PA: round(90000 * 16/30) = 48000; PB: 90000; per-patient round_half_up then sum)"
            - "MonthlySettlement.${stl_id}.contribution_cents at finalize == final_rev - total_cost_of_care_cents"
            - "Center.${c_id}.cumulative_contribution_cents reflects the provisional posting then the finalize delta, netting to the final contribution"

      - name: panel_value_outcome_bonus_vs_penalty_variants
        grounds:
          - calculations.outcome_adjusted_panel_value
          - calculations.ed_diversion_rate
          - entities.Center.fields.ed_referral_count_current_month
        distinguishing_aspect: "Panel value is priced on the CareTeam/clinical-outcome domain (not the claim cost domain): identical accrued revenue yields a 5% bonus when the month's ED-diversion rate is >= 0.8000 and a 3% penalty when it is below 0.6000 — two divergent valuations of the same panel month."
        test_recipe:
          setup:
            - "Center C1 OPEN with team T1, settlement month with accrued revenue 100000; month M1 has 10 diverted + 0 ED + 0 expired triage cases (rate 1.0000); month M2 has 5 diverted + 4 ED + 1 expired (rate 0.5000)."
            - "Each case opened and resolved via the triage endpoints; self-care resolutions excluded from the rate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /senior-care/centers"
              payload: { name: "North", neighborhood_code: "CHI-NORTH-01", opened_on: "2025-01-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
            - call: "POST /senior-care/centers/${c_id}/care-teams"
              payload: { team_label: "Red", panel_cap: 300, physician_count: 2, chw_count: 2, behavioral_count: 1 }
              as: NetworkOperator
              captures: { t_id: $.data.id }
            - call: "POST /senior-care/centers/${c_id}/rooms"
              payload: { room_label: "R1", supports_behavioral: false }
              as: NetworkOperator
            - call: "POST /senior-care/centers/${c_id}/open"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/triage-cases"
              payload: { patient_id: "${p1}", channel: "AFTER_HOURS_LINE", severity: "LOW" }
              as: TriageNurse
              captures: { case_id: $.data.id }
            - call: "POST /senior-care/triage-cases/${case_id}/divert"
              payload: { urgent_appointment_id: "${urgent_appt}" }
              as: TriageNurse
          assert:
            - "Month with 100% diversion yields panel_value_cents == round(100000 * 1.05) + round(staffing_score * 150) = 105000 + 450 = 105450 for staffing_score 3.00"
            - "Month with 50% diversion yields panel_value_cents == round(100000 * 0.97) + 450 = 97450"
            - "RESOLVED_SELF_CARE cases change neither numerator nor denominator of ed_diversion_rate"

  - rule_id: combinatorial_formula
    instances:
      - name: quote_nonlinear_three_input_tier_branch
        grounds:
          - calculations.risk_adjusted_pmpm_quote
          - entities.HealthPlan.fields.risk_adjust_factor
          - entities.Center.fields.profitability_tier
        distinguishing_aspect: "Mode (a): quote = base x risk_score x risk_adjust_factor x tier_multiplier with a conditional branch on the center's profitability_tier — three multiplicative inputs plus a state-dependent branch; a RAMP center and a MATURE center quote different cents for the same plan and patient risk."
        test_recipe:
          setup:
            - "Plan base 90000, risk_adjust_factor 1.20. Patient risk 2.00. Center A in RAMP (multiplier 0.95), Center B matured to MATURE (multiplier 1.05)."
          setup_api_calls:
            - call: "POST /senior-care/health-plans"
              payload: { plan_name: "MA Silver", contract_type: "FULL_RISK", base_pmpm_cents: 90000, risk_adjust_factor: 1.20, revenue_share_pct: 0.90 }
              as: FinanceController
              captures: { plan_id: $.data.id }
            - call: "POST /senior-care/centers"
              payload: { name: "A", neighborhood_code: "CHI-A", opened_on: "2026-06-01" }
              as: NetworkOperator
              captures: { ca_id: $.data.id }
          trigger:
            - call: "GET /senior-care/health-plans/${plan_id}/quote"
              payload: { risk_score: 2.00, center_id: "${ca_id}" }
              as: FinanceAnalyst
          assert:
            - "RAMP quote == round_half_up(90000 * 2.00 * 1.20 * 0.95) == 205200"
            - "Same inputs against a MATURE center quote == round_half_up(90000 * 2.00 * 1.20 * 1.05) == 226800"

      - name: booking_line_then_sum_rounding_vs_sum_then_round
        grounds:
          - calculations.cost_of_care_booking
          - calculations.panel_revenue_accrual
        distinguishing_aspect: "Mode (b): nested rounding order pinned — cost_of_care_booking rounds each booked line (per appointment, per ride) half-up before aggregation, and panel_revenue_accrual rounds each per-patient contribution before summing; with a 0.5-duration no-show PRIMARY (18000*0.5*0.5 = 4500) plus a 60-minute BEHAVIORAL (22000*1.5 = 33000) the per-line-then-sum total 37500 differs from any order that rounds only once at the end when fractional cents arise (e.g., risk 1.33 x 90000 = 119700.00 exact vs per-patient split 119700 + 48000.00 across proration boundaries)."
        test_recipe:
          setup:
            - "One completed no-show PRIMARY 20-minute appointment (books 18000 * 0.5 * 0.5 = 4500) and one completed BEHAVIORAL 60-minute appointment (books 22000 * 1.5 = 33000) in the same period; one DELIVERED ride (3200)."
          setup_api_calls:
            - call: "POST /senior-care/appointments"
              payload: { care_team_id: "${t_id}", patient_id: "${p_id}", room_id: "${r_id}", start_utc: "2026-09-10T14:00:00Z", duration_minutes: 20, kind: "PRIMARY" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /senior-care/appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /senior-care/appointments/${appt_id}/complete"
              payload: {}
              as: CareTeamLead
              as_user_id: "${t_id}"
          assert:
            - "MonthlySettlement.total_cost_of_care_cents == 4500 + 33000 + 3200 == 40700 with per-line rounding applied before aggregation"

  - rule_id: non_linear_state_machine
    instances:
      - name: attribution_disenroll_reattribute_cycle
        grounds:
          - state_machines.PatientAttribution.ACTIVE_to_DISENROLLED
          - state_machines.PatientAttribution.DISENROLLED_to_REATTRIBUTED
        distinguishing_aspect: "PatientAttribution is cyclic across rows: ACTIVE -> DISENROLLED -> REATTRIBUTED chains the old row to a new PENDING attribution which can itself activate — a revision-loop shape, not a linear pipeline."
        test_recipe:
          setup:
            - "Patient attributed and ACTIVE in 2026-09; disenrolled in 2026-10; a new PENDING attribution effective 2026-11 exists."
          setup_api_calls:
            - call: "POST /senior-care/patient-attributions/${attr1}/disenroll"
              payload: {}
              as: EnrollmentCoordinator
            - call: "POST /senior-care/patient-attributions"
              payload: { patient_id: "${p_id}", health_plan_id: "${plan_id}", care_team_id: "${t_id}", effective_month: "2026-11" }
              as: EnrollmentCoordinator
              captures: { attr2: $.data.id }
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr1}/reattribute"
              payload: { new_attribution_id: "${attr2}" }
              as: EnrollmentCoordinator
          assert:
            - "old attribution status == REATTRIBUTED"
            - "new attribution ${attr2} remains PENDING and is activatable in 2026-11"
            - "reattribute with effective_month <= disenrolled_month fails with ERR_REATTRIBUTION_MONTH_NOT_AFTER_DISENROLL"

      - name: ride_request_failed_recovery_loop
        grounds:
          - state_machines.RideRequest.EN_ROUTE_to_FAILED_NO_SHOW
          - state_machines.RideRequest.FAILED_NO_SHOW_to_RECOVERED
          - state_machines.RideRequest.REQUESTED_to_DISPATCHED
        distinguishing_aspect: "RideRequest contains a recovery loop (EN_ROUTE -> FAILED_NO_SHOW -> REQUESTED again via RECOVERED transient) on the same row — the ride can cycle through dispatch more than once with failure_count incrementing, a cycle shape on an entity distinct from PatientAttribution."
        test_recipe:
          setup:
            - "Appointment scheduled in future window; ride created, dispatched, en-route; patient fails pickup once."
          setup_api_calls:
            - call: "POST /senior-care/appointments/${appt_id}/ride-requests"
              payload: {}
              as: TransportDispatcher
              captures: { ride_id: $.data.id }
            - call: "POST /senior-care/ride-requests/${ride_id}/dispatch"
              payload: { vehicle_id: "${veh_id}" }
              as: TransportDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T13:00:00Z" }
              as: NetworkOperator
            - call: "POST /senior-care/ride-requests/${ride_id}/start-pickup"
              payload: {}
              as: TransportDispatcher
            - call: "POST /senior-care/ride-requests/${ride_id}/mark-no-show"
              payload: {}
              as: TransportDispatcher
          trigger:
            - call: "POST /senior-care/ride-requests/${ride_id}/recover"
              payload: {}
              as: TransportDispatcher
          assert:
            - "RideRequest.${ride_id}.status == REQUESTED after recovery"
            - "RideRequest.${ride_id}.failure_count == 1"
            - "Ride can be dispatched a second time; a second failure raises failure_count to 2"

  - rule_id: transitive_cascade
    instances:
      - name: activation_panel_breach_saturates_center_and_waitlists
        grounds:
          - state_machines.PatientAttribution.PENDING_to_ACTIVE
          - state_machines.Center.OPEN_to_SATURATED
          - state_machines.PatientAttribution.PENDING_to_WAITLISTED
        distinguishing_aspect: "Depth-3 cascade: attribution activation -> CareTeam.active_panel_count reaches panel_cap -> Center panel_fill_ratio reaches 1.0000 -> Center flips SATURATED -> remaining PENDING attributions to the full team flip WAITLISTED. Each link is caused by the previous mutation, not by the original call."
        test_recipe:
          setup:
            - "Center with one team cap 2; two ACTIVE patients; two more PENDING attributions to the same team."
          setup_api_calls:
            - call: "POST /senior-care/patient-attributions/${attr3}/activate"
              payload: { expected_care_team_version: "${t_v}" }
              as: EnrollmentCoordinator
          trigger:
            - call: "GET /senior-care/care-teams/${t_id}"
              payload: {}
              as: NetworkOperator
          assert:
            - "Center.status == SATURATED"
            - "CareTeam.accepting == false"
            - "Attribution ${attr3} and ${attr4} status == WAITLISTED"
            - "CareTeam.waitlist_depth == 2"

      - name: ed_referral_threshold_breach_flags_profitability_review
        grounds:
          - state_machines.TriageCase.OPEN_to_RESOLVED_ED
          - calculations.ed_diversion_rate
          - calculations.profitability_ramp_tier
          - entities.Center.fields.ed_referral_count_current_month
        distinguishing_aspect: "Depth-3 cascade from a different trigger: triage refer-ed -> Center.ed_referral_count_current_month increments -> counter crosses ED_DIVERSION_FLOOR (10) -> next settlement finalize recomputes profitability_tier with the diversion-penalty branch — clinical event propagates into the fiscal tier."
        test_recipe:
          setup:
            - "Center with 10 patients attributed; 10 OPEN triage cases exist for attributed patients."
          setup_api_calls:
            - call: "POST /senior-care/triage-cases/${c1}/refer-ed"
              payload: {}
              as: TriageNurse
            - call: "POST /senior-care/triage-cases/${c2}/refer-ed"
              payload: {}
              as: TriageNurse
          trigger:
            - call: "POST /senior-care/triage-cases/${c10}/refer-ed"
              payload: {}
              as: TriageNurse
            - call: "POST /senior-care/monthly-settlements/${stl}/finalize"
              payload: {}
              as: FinanceController
          assert:
            - "Center.ed_referral_count_current_month == 11 after the 11th referral (crossing the floor of 10)"
            - "profitability_ramp_tier recompute at finalize reflects the diversion review flag"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_stale_state_vs_panel_quota_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.PatientAttribution.PENDING_to_ACTIVE
        distinguishing_aspect: "State vs business_constraint pair: an activation attempted on a DISENROLLED attribution targeting a full team must return the state error (ERR_INVALID_STATE / ERR_ATTRIBUTION_NOT_PENDING at priority 6), not the quota error (ERR_PANEL_CAP_REACHED / ERR_QUOTA_EXCEEDED at priority 10)."
        test_recipe:
          setup:
            - "Attribution already DISENROLLED; target team at panel_cap."
          setup_api_calls:
            - call: "POST /senior-care/patient-attributions/${attr}/disenroll"
              payload: {}
              as: EnrollmentCoordinator
          trigger:
            - call: "POST /senior-care/patient-attributions/${attr}/activate"
              payload: { expected_care_team_version: "${t_v}" }
              as: EnrollmentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ATTRIBUTION_NOT_PENDING (state, priority 6) and NOT ERR_PANEL_CAP_REACHED / ERR_QUOTA_EXCEEDED (priority 10)"

      - name: adjudicate_wrong_amount_vs_finalized_settlement_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - state_machines.CostOfCareClaim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: "business_constraint vs business_fiscal pair: adjudicating with adjudicated_amount_cents > amount_cents on a claim whose settlement is FINALIZED must return ERR_ADJUDICATED_AMOUNT_INVALID (priority 4 input legality), not the fiscal gate ERR_SETTLEMENT_FINALIZED (priority 11) — a different category pair from the state-vs-quota instance."
        test_recipe:
          setup:
            - "Claim SUBMITTED for 2026-08 amount 5000; settlement for 2026-08 is FINALIZED."
          setup_api_calls:
            - call: "POST /senior-care/cost-claims"
              payload: { center_id: "${c_id}", patient_id: "${p_id}", service_month: "2026-08", category: "ED_VISIT", amount_cents: 5000 }
              as: ClaimsAdjudicator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /senior-care/cost-claims/${claim_id}/adjudicate"
              payload: { adjudicated_amount_cents: 9000 }
              as: ClaimsAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ADJUDICATED_AMOUNT_INVALID (priority 4) and NOT ERR_SETTLEMENT_FINALIZED (priority 11)"

  - rule_id: boundary_precision_check
    instances:
      - name: panel_fill_ratio_exactly_one_triggers_saturation
        grounds:
          - state_machines.Center.OPEN_to_SATURATED
          - entities.Center.fields.panel_fill_ratio
          - validations[priority=10]
        distinguishing_aspect: "Numeric threshold metric: the Center flips SATURATED exactly when panel_fill_ratio >= 1.0000 — with a cap-2 team and 2 ACTIVE patients the ratio is exactly 1.0000 and the flip MUST occur; at 1 ACTIVE of cap 2 (0.5000) it must not."
        test_recipe:
          setup:
            - "Team cap 2; one patient ACTIVE; second attribution PENDING."
          setup_api_calls:
            - call: "POST /senior-care/patient-attributions/${attr2}/activate"
              payload: { expected_care_team_version: "${t_v}" }
              as: EnrollmentCoordinator
          trigger:
            - call: "GET /senior-care/centers/${c_id}"
              payload: {}
              as: NetworkOperator
          assert:
            - "After the second activation panel_fill_ratio == 1.0000 and Center.status == SATURATED"
            - "Before the second activation (ratio 0.5000) Center.status == OPEN"

      - name: no_show_strike_count_exactly_three_suspends_transport
        grounds:
          - entities.Patient.fields.no_show_strikes
          - state_machines.Appointment.SCHEDULED_to_COMPLETED_NO_SHOW
        distinguishing_aspect: "Zero/count-edge metric on a different endpoint: ride creation is rejected only when no_show_strikes >= 3 — at exactly 2 strikes the request succeeds, at exactly 3 it fails with ERR_TRANSPORT_PRIVILEGE_SUSPENDED; distinct metric (strike count) and endpoint (ride create) from the fill-ratio boundary."
        test_recipe:
          setup:
            - "Patient with two COMPLETED_NO_SHOW appointments (strikes = 2); a third SCHEDULED appointment whose window passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/appointments/${appt_id}/ride-requests"
              payload: {}
              as: TransportDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "With strikes == 2 the ride request succeeds (201)"
            - "After the third no-show (strikes == 3) the same request fails with ERR_TRANSPORT_PRIVILEGE_SUSPENDED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: center_open_gated_on_team_and_room_existence
        grounds:
          - state_machines.Center.PRE_OPEN_to_OPEN
          - entities.CareTeam.fields.center_id
          - entities.CenterRoom.fields.center_id
        distinguishing_aspect: "Center -> CareTeam/CenterRoom pair: the PRE_OPEN -> OPEN transition depends on the existence of at least one child CareTeam and one child CenterRoom — a cross-entity precondition, not a self-state check."
        test_recipe:
          setup:
            - "Center created with one room but zero care teams."
          setup_api_calls:
            - call: "POST /senior-care/centers"
              payload: { name: "X", neighborhood_code: "CHI-X", opened_on: "2026-01-01" }
              as: NetworkOperator
              captures: { c_id: $.data.id }
            - call: "POST /senior-care/centers/${c_id}/rooms"
              payload: { room_label: "R1" }
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/centers/${c_id}/open"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CENTER_HAS_NO_TEAMS; Center remains PRE_OPEN"

      - name: triage_divert_gated_on_urgent_appointment_state
        grounds:
          - state_machines.TriageCase.OPEN_to_RESOLVED_DIVERTED
          - state_machines.Appointment
          - entities.TriageCase.fields.disposition
        distinguishing_aspect: "TriageCase -> Appointment pair: OPEN -> RESOLVED_DIVERTED requires the payload urgent_appointment_id to reference an Appointment in SCHEDULED state of kind PRIMARY within 24h — a dependency on a different entity pair than Center->CareTeam."
        test_recipe:
          setup:
            - "OPEN triage case, severity MODERATE; the supplied urgent appointment is already CANCELLED."
          setup_api_calls:
            - call: "POST /senior-care/triage-cases"
              payload: { patient_id: "${p_id}", channel: "WALK_IN", severity: "MODERATE" }
              as: TriageNurse
              captures: { case_id: $.data.id }
            - call: "POST /senior-care/appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /senior-care/triage-cases/${case_id}/divert"
              payload: { urgent_appointment_id: "${appt_id}" }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_URGENT_SLOT_INVALID; TriageCase remains OPEN"

  - rule_id: resource_temporal_overlap
    instances:
      - name: room_half_open_adjacency_free_but_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.CenterRoom
          - entities.Appointment.fields.start_utc
        distinguishing_aspect: "Half-open interval semantics on CenterRoom: an appointment ending at 14:40 and another starting at 14:40 in the same room coexist (adjacency free, [start,end)); a start at 14:39 overlaps and is rejected with ERR_SCHEDULE_CONFLICT."
        test_recipe:
          setup:
            - "Room R1 has a SCHEDULED appointment 14:00-14:40."
          setup_api_calls:
            - call: "POST /senior-care/appointments"
              payload: { care_team_id: "${t_id}", patient_id: "${p1}", room_id: "${r_id}", start_utc: "2026-09-10T14:00:00Z", duration_minutes: 40, kind: "PRIMARY" }
              as: FrontDesk
          trigger:
            - call: "POST /senior-care/appointments"
              payload: { care_team_id: "${t_id}", patient_id: "${p2}", room_id: "${r_id}", start_utc: "2026-09-10T14:40:00Z", duration_minutes: 40, kind: "PRIMARY" }
              as: FrontDesk
              captures: { appt2: $.data.id }
            - call: "POST /senior-care/appointments"
              payload: { care_team_id: "${t_id}", patient_id: "${p3}", room_id: "${r_id}", start_utc: "2026-09-10T14:20:00Z", duration_minutes: 40, kind: "PRIMARY" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "14:40 appointment succeeds (201) — adjacency at exactly end == start is free"
            - "14:20 appointment fails with ERR_SCHEDULE_CONFLICT"

      - name: vehicle_capacity_overlap_aggregate_seats
        grounds:
          - calculations.vehicle_capacity_overlap
          - entities.Vehicle.fields.seat_capacity
          - state_machines.RideRequest.REQUESTED_to_DISPATCHED
        distinguishing_aspect: "Aggregate-capacity interval semantics on Vehicle (different resource and different geometry from room half-open): dispatch is rejected only when concurrent occupied seats across overlapping pickup windows + 1 > seat_capacity — a 2-seat vehicle accepts two rides with overlapping windows and rejects the third; windows that touch at exactly one endpoint do not overlap."
        test_recipe:
          setup:
            - "Vehicle seat_capacity 2; two DISPATCHED rides with pickup windows 13:00-14:00 (appointments at 14:30); a third ride whose appointment is at 14:30 (same window)."
          setup_api_calls:
            - call: "POST /senior-care/ride-requests/${r1}/dispatch"
              payload: { vehicle_id: "${veh_id}" }
              as: TransportDispatcher
            - call: "POST /senior-care/ride-requests/${r2}/dispatch"
              payload: { vehicle_id: "${veh_id}" }
              as: TransportDispatcher
          trigger:
            - call: "POST /senior-care/ride-requests/${r3}/dispatch"
              payload: { vehicle_id: "${veh_id}" }
              as: TransportDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Third dispatch fails with ERR_VEHICLE_CAPACITY_EXCEEDED"
            - "A fourth ride whose pickup window starts exactly when the first window ends dispatches successfully"

  - rule_id: compensating_invariant
    instances:
      - name: settlement_void_leaves_contribution_unchanged
        grounds:
          - state_machines.MonthlySettlement.OPEN_to_VOIDED
          - entities.Center.fields.cumulative_contribution_cents
        distinguishing_aspect: "Conserved quantity: Center.cumulative_contribution_cents. Opening a MonthlySettlement (posts nothing) followed by voiding it before provisional close MUST leave cumulative_contribution_cents bit-identical to its value before the open."
        test_recipe:
          setup:
            - "Center with cumulative_contribution_cents == C0 after a prior finalized month; a new OPEN settlement for the next period with no claims."
          setup_api_calls:
            - call: "POST /senior-care/monthly-settlements"
              payload: { center_id: "${c_id}", period_month: "2026-10" }
              as: FinanceAnalyst
              captures: { stl_id: $.data.id }
          trigger:
            - call: "POST /senior-care/monthly-settlements/${stl_id}/void"
              payload: {}
              as: FinanceController
          assert:
            - "MonthlySettlement.${stl_id}.status == VOIDED"
            - "Center.cumulative_contribution_cents unchanged (== C0) after open+void round trip"

      - name: disenroll_then_reattribute_preserves_panel_count
        grounds:
          - state_machines.PatientAttribution.ACTIVE_to_DISENROLLED
          - state_machines.PatientAttribution.DISENROLLED_to_REATTRIBUTED
          - entities.CareTeam.fields.active_panel_count
        distinguishing_aspect: "Conserved quantity: CareTeam.active_panel_count. Disenrolling an ACTIVE attribution (count -1) followed by reattributing via a new PENDING attribution that then activates (count +1) MUST restore the original count — a different conserved quantity (panel headcount) from the ledger-cents invariant."
        test_recipe:
          setup:
            - "Team with active_panel_count == N; one ACTIVE attribution A1 for patient P."
          setup_api_calls:
            - call: "POST /senior-care/patient-attributions/${a1}/disenroll"
              payload: {}
              as: EnrollmentCoordinator
            - call: "POST /senior-care/patient-attributions"
              payload: { patient_id: "${p_id}", health_plan_id: "${plan_id}", care_team_id: "${t_id}", effective_month: "2026-11" }
              as: EnrollmentCoordinator
              captures: { a2: $.data.id }
            - call: "POST /senior-care/patient-attributions/${a1}/reattribute"
              payload: { new_attribution_id: "${a2}" }
              as: EnrollmentCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /senior-care/patient-attributions/${a2}/activate"
              payload: { expected_care_team_version: "${t_v}" }
              as: EnrollmentCoordinator
          assert:
            - "Immediately after disenroll: CareTeam.active_panel_count == N - 1"
            - "After reattribute + activate of the successor: CareTeam.active_panel_count == N"
            - "No drift: waitlist_depth unchanged (0) throughout"
