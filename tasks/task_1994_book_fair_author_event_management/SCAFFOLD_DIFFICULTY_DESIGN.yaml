# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1994_book_fair_author_event_management
# 22 instances across the nine Difficulty Rules (>= 2 per rule; 4 rules carry 3).
# All numeric asserts were pre-computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reconciliation_provisional_vs_final_variance
        grounds:
          - calculations.reconciliation_variance
          - entities.Reconciliation.fields.provisional_lines
          - entities.Reconciliation.fields.total_abs_variance
          - state_machines.Reconciliation.OPEN_to_VARIANCE_REVIEW
        distinguishing_aspect: |
          Inventory domain: for the same physical stock the provisional variant
          (system-derived expected_on_hand from event counters) yields 8 while the
          final variant (physical count) yields 7 — two valid algorithms, different
          results; the delta (-1) drives the VARIANCE_REVIEW branch.
        test_recipe:
          setup:
            - "Fair progressed to RECONCILING with one FRONTLIST line (list 1000, discount 0.40, delivered 10) and one TENDERED sale of qty 2"
            - "Reconciliation OPEN with provisional expected_on_hand = 10 - 2 = 8"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 10 }, as: Organizer, captures: { line_id: "$.data.id" } }
            - { call: "POST /stock-lines/${line_id}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_id}/deliver", payload: { qty_delivered: 10 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_id}", qty: 2 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
            - { call: "POST /sales/${sale_id}/tender", payload: { tendered_amount_cents: 2000 }, as: Cashier }
            - { call: "POST /fairs/${fair_id}/close-sales", payload: {}, as: Organizer, as_user_id: "org_lead_1" }
            - { call: "GET /reconciliations", payload: { fair_id: "${fair_id}" }, as: Organizer, captures: { recon_id: "$.data[0].id", recon_v: "$.data[0].version" } }
          trigger:
            - call: "POST /reconciliations/${recon_id}/counts"
              payload: { lines: [{ stock_line_id: "${line_id}", qty_on_hand: 7 }], expected_reconciliation_version: "${recon_v}" }
              as: Organizer
          assert:
            - "Reconciliation.${recon_id}.provisional_lines entry for ${line_id} has expected_on_hand == 8"
            - "Reconciliation.${recon_id}.variance_lines entry for ${line_id} has variance == -1"
            - "Reconciliation.${recon_id}.total_abs_variance == 1"
            - "provisional (8) != final counted (7) for identical underlying stock"

      - name: payout_cash_vs_scrip_variant_divergence
        grounds:
          - calculations.school_payout
          - entities.ProfitSharePayout.fields.cash_amount_cents
          - entities.ProfitSharePayout.fields.scrip_amount_cents
          - state_machines.ProfitSharePayout.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Payout domain (distinct from the inventory-domain reconciliation instance):
          identical fair financials yield cash_amount_cents == 400 and
          scrip_amount_cents == 460 — the SCRIP variant applies the 1.15 multiplier,
          so the two variants provably diverge on the same data.
        test_recipe:
          setup:
            - "Fair through RECONCILING with one FRONTLIST line (list 1000, discount 0.40, delivered 10), one TENDERED sale qty 5 (gross 5000)"
            - "Reconciliation ACCEPTED with zero variance (counts match provisional 5); publisher_remittance_cents == 3000"
