              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/order-sets/${os_id}/adherence-measurements
              payload: { measurement_period_start: "2026-09-01T00:00:00Z", measurement_period_end: "2026-10-01T00:00:00Z", unit_observations: [{ unit_code: "MED-A", eligible_orders: 100, adherent_orders: 60, unintended_events: 3 }, { unit_code: "ICU-B", eligible_orders: 10, adherent_orders: 8, unintended_events: 1 }] }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { am_id: $.data.id, pp: $.data.adherence_pct_per_protocol, inc: $.data.included_unit_count }
            - call: POST /cds/adherence-measurements/${am_id}/finalize
              payload: { verdict: "SUSTAIN", finalization_note: "Looks like a pass on the stored number" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: POST /cds/adherence-measurements/${am_id}/finalize
              payload: { verdict: "REVISE", finalization_note: "Pooled adherence is below the floor" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { itt: $.data.adherence_pct_intention_to_treat, rate: $.data.unintended_event_rate_per_100 }
            - call: POST /cds/adherence-measurements/${am_id}/finalize
              payload: { verdict: "RETIRE", finalization_note: "Second thoughts" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "call 1 returns HTTP 422 with error_id ERR_INVALID_OBSERVATION_COUNTS (adherent_orders 12 > eligible_orders 10) and creates nothing"
            - "call 2 returns HTTP 201 with ${pp} == 70.00 (mean of 0.6000 and 0.8000), ${inc} == 2, excluded_unit_count == 0, measurement_state == PROVISIONAL and adherence_pct_intention_to_treat == null"
            - "call 3 returns HTTP 422 with error_id ERR_ADHERENCE_VERDICT_UNSUPPORTED: the pooled intention-to-treat value 61.82 is below ADHERENCE_SUCCESS_FLOOR 70.00 even though the stored per-protocol value equals it exactly"
            - "call 4 returns HTTP 200 with ${itt} == 61.82 (100 * 68 / 110) and ${rate} == 3.64 (100 * 4 / 110), unintended_event_count == 4, verdict REVISE and measurement_state FINALIZED"
            - "GET /cds/order-sets/${os_id} shows latest_adherence_pct == 61.82 and publication_state still PUBLISHED (only a RETIRE verdict would push it to EXPIRING)"
            - "call 5 returns HTTP 409 with error_id ERR_MEASUREMENT_NOT_PROVISIONAL and the recorded verdict stays REVISE"

  - section: rbac
    instances:

      - name: rbac_committee_chair_exclusive_triage_is_forbidden_to_the_informatics_builder
        claim_type: exclusive_operations
        grounds:
          - rbac.CommitteeChair.exclusive_operations
          - rbac.InformaticsBuilder
        distinguishing_aspect: "Triage is exclusive to CommitteeChair: an InformaticsBuilder acting under their own real identity is refused with ERR_UNAUTHORIZED (403), which is the endpoint-level refusal and not the ERR_ROLE_IDENTITY_MISMATCH returned when the header identity lacks the claimed role."
        test_recipe:
          setup:
            - "One sponsor, one chair, one builder and one INTAKE_SUBMITTED request."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: POST /cds/clinicians
              payload: { full_name: "Ada Sponsor MD", npi: "1000000001", specialty: "CARDIOLOGY", credential: "MD", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Cyd Chair MD", npi: "1000000002", specialty: "INTERNAL_MEDICINE", credential: "MD", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: POST /cds/clinicians
              payload: { full_name: "Bo Builder MD", npi: "1000000003", specialty: "INFORMATICS", credential: "MD", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: POST /cds/content-requests
              payload: { title: "Triage authority test", request_type: "ORDER_SET", clinical_domain: "CARDIOLOGY", urgency: "ROUTINE", evidence_grade: "B", clinical_sponsor_id: "${sponsor_id}", evidence_citations: [{ citation: "Guideline A", peer_reviewed: true }, { citation: "Guideline B", peer_reviewed: true }] }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
          trigger:
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Not my call" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
            - call: POST /cds/content-requests/${cr_id}/triage
              payload: { decision: "ACCEPT", triage_note: "Committee accepts" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "the builder call returns HTTP 403 with error_id ERR_UNAUTHORIZED and leaves status INTAKE_SUBMITTED with version 1"
            - "the identical call by the chair returns HTTP 200 with status TRIAGE_ACCEPTED, priority_score_basis COMMITTEE_CALIBRATED and version 2"

