            - "the trigger returns ERR_PERMIT_NOT_ACTIVE with HTTP 409 — the child cannot be created because of the parent's status alone"
            - "no ERR_TAKE_LIMIT_EXCEEDED and no ERR_REPORTING_PERIOD_OVERLAP: 0.10 <= 0.40 and [2027-01-01, 2027-03-31) does not overlap R1's [2026-10-01, 2026-12-31)"
            - "GET /incidental-take-permits/${permit_id}/monitoring-reports still returns exactly one row, and take_consumed_units is still 3.60"
            - "POST /monitoring-reports/${r1_id}/adjudication with decision 'REJECT' as fws-user-adjudicator returns the permit to 'ACTIVE' with take_consumed_units 0.00, take_remaining_units 4.00 and suspension_count still 1, and the plan to 'IMPLEMENTING' with assurance_review_required false"
            - "re-sending the identical trigger body with the then-current expected_permit_version now returns 201 with MonitoringReport.status 'SUBMITTED' and take_consumed_units 0.10 — the same payload that was refused is accepted once the parent's state changes"
            - "the same error id covers the other non-ACTIVE status: on a permit whose term_end has passed (status 'EXPIRED') the same request also returns ERR_PERMIT_NOT_ACTIVE (409), and EXPIRED is terminal so no adjudication can revive it"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: survey_windows_on_a_habitat_unit_are_closed_intervals_with_a_buffer
        grounds:
          - calculations.interval_conflict_detection
          - calculations.interval_conflict_detection.constants.SURVEY_DISTURBANCE_BUFFER_DAYS
          - validations[priority 20]
          - errors["ERR_SURVEY_WINDOW_CONFLICT"]
          - entities.PresenceDetermination.fields.survey_window_start
          - endpoints["POST /project-actions/{id}/presence-determinations"]
        distinguishing_aspect: >-
          RESOURCE: CriticalHabitatUnit. SEMANTICS: CLOSED intervals widened by a
          3-day disturbance buffer on BOTH sides, and contended across ALL project
          actions because the buffer protects the habitat rather than the project.
          Two windows three days apart therefore collide while four days apart do
          not — the opposite of the reporting-period rule, where exact adjacency
          is legal.
        test_recipe:
          setup:
            - "SP-E is registered with two critical habitat units, CHU-1 and CHU-2, both FINAL in county 06037."
            - "Action A carries a FIELD_SURVEY DETECTED determination citing CHU-1 with the window 2026-05-04..2026-05-08, so the protected span for CHU-1 becomes 2026-05-01..2026-05-11 once the 3-day buffer is applied on both sides."
            - "Action B belongs to the same proponent and has not yet been screened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-2", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu2_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_a_id: "$.data.id"}
            - call: "POST /project-actions/${action_a_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd1_id: "$.data.id", pd1_start: "$.data.survey_window_start", pd1_end: "$.data.survey_window_end"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase II", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_b_id: "$.data.id"}
          trigger:
            - call: "POST /project-actions/${action_b_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 5.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-11", survey_window_end: "2026-05-15"}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${pd1_start} == '2026-05-04' and ${pd1_end} == '2026-05-08'"
            - "the trigger returns ERR_SURVEY_WINDOW_CONFLICT with HTTP 409: the new start 2026-05-11 is exactly existing_end 2026-05-08 plus the 3-day buffer, and the comparison is <=, so touching the buffer edge conflicts"
            - "the conflict crosses project actions: the two determinations belong to different ProjectAction rows and are still contended, because the input set is scoped by critical_habitat_unit_id only"
            - "moving the window one day later to 2026-05-12..2026-05-16 succeeds with 201 (4 days apart clears the buffer) and its presence_status is 'PRESENT' with survey_in_season true"
            - "the buffer applies on the LEFT as well: 2026-04-28..2026-05-01 returns ERR_SURVEY_WINDOW_CONFLICT because new_end 2026-05-01 plus 3 days reaches existing_start 2026-05-04, while 2026-04-27..2026-04-30 succeeds"
            - "the conflict is resource-scoped: the original 2026-05-11..2026-05-15 window succeeds when it cites ${chu2_id} instead, and GET /species/${species_e_id}/critical-habitat-units confirms the two units are distinct rows of the same species"
            - "non-participants never conflict: a DATABASE_QUERY determination (no window at all) and a FIELD_SURVEY determination with critical_habitat_unit_id null both succeed with windows squarely inside 2026-05-04..2026-05-08"
            - "an exactly identical window 2026-05-04..2026-05-08 citing CHU-1 also returns ERR_SURVEY_WINDOW_CONFLICT, so the buffered comparison subsumes plain containment"

      - name: reporting_periods_on_a_permit_are_half_open_and_may_be_adjacent
        grounds:
          - calculations.interval_conflict_detection
          - validations[priority 21]
          - errors["ERR_REPORTING_PERIOD_OVERLAP"]
          - entities.MonitoringReport.fields.period_start
          - entities.MonitoringReport.fields.period_end
          - endpoints["POST /incidental-take-permits/{id}/monitoring-reports"]
        distinguishing_aspect: >-
          RESOURCE: IncidentalTakePermit, a different entity from the habitat
          unit. SEMANTICS: BARE HALF-OPEN [period_start, period_end) with NO
          buffer, contended only within the same permit and only against reports
          in SUBMITTED or ACCEPTED. Back-to-back periods that share an endpoint
          are legal here, which is exactly the case the buffered closed
