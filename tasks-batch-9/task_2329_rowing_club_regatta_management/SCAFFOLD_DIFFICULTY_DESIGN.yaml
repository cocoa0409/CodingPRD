      - name: clear_launch_coverage_safety_outranks_driver_overbooking_temporal
        grounds:
          - validations[priority=32]
          - validations[priority=36]
          - errors[ERR_LAUNCH_COVERAGE_INSUFFICIENT]
          - errors[ERR_LAUNCH_DRIVER_OVERBOOKED]
          - calculations.session_launch_requirement
