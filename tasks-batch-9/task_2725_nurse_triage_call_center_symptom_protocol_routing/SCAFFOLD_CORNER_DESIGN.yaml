      - name: suspending_a_practice_blocks_new_intake_and_new_patients
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=16]        # ERR_PRACTICE_SUSPENDED
          - entities.Practice.fields.status
          - endpoints[PATCH /practices/{id}/status]
        distinguishing_aspect: "One parent flag closes three unrelated write paths at once — intake, patient registration and coverage-window creation — and reinstating the practice reopens all three, proving the check is read live from the parent rather than copied onto the child at creation time."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; one ACTIVE practice with one registered patient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
