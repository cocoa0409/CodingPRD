            - "ServicePart.${p1}.reserved_qty == 0"
            - "ServicePart.${p1}.on_hand_qty + reserved_qty == 1 (identical to the pre-approval total)"
            - "ServicePart.${p1}.stock_state == LOW"
            - "Distributor.${dist}.warranty_credit_cents == 0"
            - "WarrantyClaim.${c2}.claim_state == SUBMITTED"
            - "WarrantyClaim.${c2}.block_reason == NONE"
            - "Distributor.${dist}.open_claim_count == 1"

      - name: quote_line_delete_restores_money_identity
        grounds:
          - calculations.quote_money_rollup
          - entities.PackageQuote.fields.line_subtotal_cents
          - entities.PackageQuote.fields.discount_cents
          - entities.PackageQuote.fields.total_cents
          - validations[priority=32]
          - errors[ERR_STALE_QUOTE_VERSION]
        distinguishing_aspect: |
          A different conserved quantity on a different resource: money. The identity
          total_cents == line_subtotal_cents - discount_cents + freight_cents must hold after the deletion exactly
          as it held before it, recomputed from the surviving lines rather than patched by subtracting the removed
          line's share — 4818063 - 240903 + 250000 == 4827160 before, 2500000 - 125000 + 250000 == 2625000 after.
          Freight survives the deletion and the package discount re-rounds against the smaller subtotal.
        test_recipe:
          setup:
            - "Models VND-40-C (list 780000) and OPL-60-A (list 1250000)"
            - "PackageQuote in DRAFT, package_discount_pct 5.00, freight_cents 250000"
            - "Two lines: 3 x VND-40-C with CARD and 2.50% line discount (2318063), 2 x OPL-60-A (2500000)"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-40-C", product_line: "VENDED", capacity_rating_lb: 40, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN", "CARD", "MOBILE"], list_price_cents: 780000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m2: $.data.id }
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "TERM_60", down_payment_cents: 0, package_discount_pct: 5.00, freight_cents: 250000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1: $.data.id, q1_v0: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m2}", quantity: 3, payment_module: "CARD", line_discount_pct: 2.50, expected_quote_version: "${q1_v0}" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { ln1: $.data.id }
            - call: "GET /clm/quotes/${q1}"
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1_v1: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m1}", quantity: 2, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q1_v1}" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { ln2: $.data.id }
            - call: "GET /clm/quotes/${q1}"
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1_v2: $.data.version }
          trigger:
            - call: "DELETE /clm/quotes/${q1}/lines/${ln1}"
              payload: { expected_quote_version: "${q1_v2}" }
              as: Distributor
              as_user_id: "${dist}"
          assert:
            - "PackageQuote.${q1}.line_count == 1"
            - "PackageQuote.${q1}.line_subtotal_cents == 2500000"
            - "PackageQuote.${q1}.discount_cents == 125000"
            - "PackageQuote.${q1}.total_cents == 2625000"
            - "PackageQuote.${q1}.quote_state == DRAFT"
            - "PackageQuote.${q1}.origination_fee_cents == 0 (no financing has been computed yet)"
            - "QuoteLine.${ln2}.line_total_cents == 2500000 (the surviving line is untouched)"
            - "GET /clm/quote-lines?quote_id=${q1} returns 1 item"
