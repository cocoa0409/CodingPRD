          - calculations.cycle_plan_charge
          - calculations.protection_fee_net
          - entities.Cycle.fields.discount_cents
          - state_machines.Cycle.SCHEDULED_to_OPEN
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency whose evaluation order the scaffold pins.
          The volume-discount tier is keyed on a gross (11500 + 900 = 12400) that itself
          contains the protection fee the discount will then reduce. Pinning tier selection to
          the UNDISCOUNTED gross yields plan_charge 10350; re-evaluating the tier on the
          discounted total (10925 + 855 = 11780, below the 12000 tier-1 floor) would yield 10925.
        test_recipe:
          setup:
            - "A PLUS plan with a monthly fee of 11500 cents and a base discount_pct of 0.05."
            - "One ACTIVE member enrolled in the protection add-on, so the 900-cent protection fee enters the gross."
