              as: SeriesPromoter
              captures: { v9: "$.data.version" }
            - call: "POST /tour-stops/${s5}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 80000, expected_season_version: "${v9}" }
              as: SeriesPromoter
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { v10: "$.data.version" }
            - call: "POST /tour-stops/${s5}/marketing-allocations"
              payload: { channel: "DIGITAL", amount_cents: 120000, expected_season_version: "${v10}" }
              as: SeriesPromoter
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
              captures: { v11: "$.data.version" }
          trigger:
            - call: "POST /tour-stops/${s6}/marketing-allocations"
              payload: { channel: "RADIO", amount_cents: 80001, expected_season_version: "${v11}" }
              as: SeriesPromoter
              captures: { e_channel: "$.data.error_id" }
            - call: "POST /tour-stops/${s1}/marketing-allocations"
              payload: { channel: "GRASSROOTS", amount_cents: 1, expected_season_version: "${v11}" }
              as: SeriesPromoter
              captures: { e_stop: "$.data.error_id" }
            - call: "POST /tour-stops/${s6}/marketing-allocations"
              payload: { channel: "DIGITAL", amount_cents: 1, expected_season_version: "${v11}" }
              as: SeriesPromoter
              captures: { e_pool: "$.data.error_id" }
            - call: "GET /seasons/${season}"
              payload: {}
              as: SeriesPromoter
            - call: "DELETE /marketing-allocations/${alloc_release}"
              payload: {}
              as: SeriesPromoter
          assert:
            - "after the setup the season ledger reads marketing_allocated_cents == 1000000 and marketing_unallocated_cents == 0, and each of ${s1}..${s5} has marketing_spend_committed_cents == 200000"
            - "trigger call 1 returns HTTP 409 with ${e_channel} == ERR_CHANNEL_CAP_EXCEEDED: 80001 > ROUND_HALF_UP(200000 * 0.4), and the channel ceiling is reported even though the empty pool would also reject it"
            - "trigger call 2 returns HTTP 409 with ${e_stop} == ERR_STOP_MARKETING_CAP_EXCEEDED: one cent of GRASSROOTS is far inside the 60000 channel cap but pushes ${s1} to 200001 > 200000, and the stop ceiling outranks the empty pool"
            - "trigger call 3 returns HTTP 409 with ${e_pool} == ERR_MARKETING_BUDGET_EXCEEDED: on the untouched sixth stop one cent of DIGITAL clears both the channel cap and the stop cap, leaving only the exhausted season pool to refuse it"
            - "trigger call 4 confirms Season.${season}.version did not move across the three rejections, so no partial ledger write occurred"
            - "trigger call 5 releases the RADIO allocation ${alloc_release} on ${s1} and returns HTTP 200 with state == RELEASED; Season.marketing_allocated_cents drops to 920000, marketing_unallocated_cents rises to 80000 and TourStop.${s1}.marketing_spend_committed_cents drops to 120000, after which the previously refused one-cent DIGITAL allocation on ${s6} becomes admissible"

      - name: corner_error_negotiation_rounds_exhausted_code
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
          - validations[order=14]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / booking_negotiation_cycles_until_the_round_cap_bites"
          rationale: "That §1.8 instance walks counter/revise around the TERMS_PROPOSED <-> COUNTERED loop until MAX_NEGOTIATION_ROUNDS is reached and asserts the 409 on the next counter."

      - name: corner_error_tech_attempt_codes
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_TECH_ATTEMPTS_EXHAUSTED
          - errors.ERR_ENTRY_TECH_HELD
          - validations[order=21]
          - validations[order=22]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / tech_inspection_self_loops_on_failure_then_falls_out_to_tech_held"
          rationale: "The FAILED self-loop up to MAX_TECH_ATTEMPTS and the following ERR_TECH_ATTEMPTS_EXHAUSTED are asserted there, and the cross-entity blocking of a TECH_HELD entry is asserted in cross_entity_state_dependency / a_tech_held_vehicle_entry_blocks_run_order_and_branding_writes_on_other_entities."

      - name: corner_error_sales_window_and_seat_pool_codes
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_SALES_NOT_OPEN
          - errors.ERR_TIER_SOLD_OUT
          - validations[order=12]
          - validations[order=48]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / sales_not_open_outranks_tier_sold_out_on_the_same_order"
          rationale: "Both codes are triggered there on one order that violates the two rules at once and then on the repaired order that violates only the seat pool."

      - name: corner_error_occupancy_and_rotation_cooldown_codes
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_VENUE_DATE_CONFLICT
          - errors.ERR_MARKET_ROTATION_COOLDOWN
          - validations[order=30]
          - validations[order=37]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / venue_date_conflict_outranks_market_rotation_cooldown_on_one_booking"
          rationale: "One candidate booking trips the padded occupancy interval and the cooldown simultaneously there, and each is then isolated so both codes are observed."

      - name: corner_error_haul_buffer_violation_code
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_HAUL_BUFFER_VIOLATION
          - validations[order=31]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / haul_buffer_is_a_one_sided_distance_derived_window_between_consecutive_stops"
          rationale: "The derived transport window between consecutive stops is tested there at the exact buffer and one minute inside it."

      - name: corner_error_show_window_exceeded_code
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_SHOW_WINDOW_EXCEEDED
          - validations[order=39]
        excluded_because:
          difficulty_instance: "boundary_precision_check / run_order_exact_fit_at_the_show_window_then_one_more_segment_overruns"
          rationale: "The run order is packed to exactly show_window_minutes there, including the floor-reset gaps, and the next segment is refused with this code."
  - section: rbac
    instances:
      - name: corner_rbac_each_role_can_perform_its_own_exclusive_operation
        claim_type: Exclusive Operations
        grounds:
          - roles.SeriesPromoter.exclusive_operations
          - roles.VenueManager.exclusive_operations
          - roles.SafetyOfficial.exclusive_operations
          - roles.TicketingManager.exclusive_operations
          - roles.FinanceController.exclusive_operations
          - roles.CompetitorTeam.shared_operations
          - roles.SponsorRep.shared_operations
        distinguishing_aspect: "The positive half of the role matrix: every one of the seven roles has at least one operation it is allowed to perform, and the allow-list is proven by a non-403 response. The FinanceController case is deliberately proven by a 409 business error rather than a 201 — reaching validations order 27 at all is proof that authorization passed, which is the only way to separate 'role rejected' from 'role accepted but state wrong'."
        test_recipe:
          setup:
            - "One season with two bookings: ATL 2026-11-14 accepted into a TourStop, and DAL 2026-12-05 left in TERMS_PROPOSED so the building can counter it"
            - "One competitor and one sponsor so the entity-backed roles have something of their own"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
