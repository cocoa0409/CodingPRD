    side_effects: []

  - method: POST
    path: "/trustee/assets/{id}/investigate"
    description: "SCHEDULED -> UNDER_INVESTIGATION"
    roles: [Trustee]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: POST
    path: "/trustee/assets/{id}/mark_for_sale"
