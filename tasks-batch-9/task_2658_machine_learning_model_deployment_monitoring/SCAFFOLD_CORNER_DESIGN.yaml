          assert:
            - "MLEngineer on POST /model-versions/{id}/decision returns HTTP 403 'ERR_ROLE_NOT_PERMITTED' — the version stays PENDING_REVIEW"
            - "ModelApprover on POST /model-versions returns HTTP 403 'ERR_ROLE_NOT_PERMITTED', and on PATCH /model-versions/{id}/documentation likewise"
            - "PlatformAdmin on POST /model-versions/{id}/submit-for-review returns HTTP 403 'ERR_ROLE_NOT_PERMITTED' — submission is exclusive to MLEngineer"
            - "NOT A SUPERUSER: PlatformAdmin is refused on POST /deployments and POST /deployments/{id}/ramp with HTTP 403 'ERR_ROLE_NOT_PERMITTED'"
            - "the same two calls from their rightful holders succeed: ModelApprover decides the version to 'APPROVED' with decided_by_user_id 'u_appr_1', and ReliabilityEngineer ramps the deployment to traffic_pct 5.00"
            - "the six refusals mutated nothing — the successful decision still finds the version in PENDING_REVIEW and the ramp still starts from 0.00"

      - name: peer_roles_cannot_operate_the_platform_or_data_lifecycle_of_another_role
        claim_type: Role exclusive operation
        grounds:
          - roles.DataSteward.exclusive_operations
          - roles.ReliabilityEngineer.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The four business roles are peers, not a hierarchy, so every pair is mutually walled off: the
          steward cannot touch traffic, the reliability engineer cannot decide a snapshot, and neither can
          drive the platform's clock or sweep. Crucially the refusal precedes every business rule — the
          clock refusal happens even though the requested instant would have been perfectly valid.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED version with a PENDING REALTIME deployment, and one PENDING_APPROVAL dataset awaiting a steward decision"
