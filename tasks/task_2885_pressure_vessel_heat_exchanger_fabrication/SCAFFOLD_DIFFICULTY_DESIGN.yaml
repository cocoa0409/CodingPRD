          trigger:
            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-001", joint_category: "B", joint_type: "BUTT", thickness_in: 1.4990, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { w1_id: $.data.id, w1_pct: $.data.required_volumetric_pct, w1_method: $.data.volumetric_method }
            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-002", joint_category: "B", joint_type: "BUTT", thickness_in: 1.5000, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
