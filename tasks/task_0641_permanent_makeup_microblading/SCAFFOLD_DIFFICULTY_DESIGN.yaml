              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client N", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client N" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T11:00:00Z" }
              as: StudioAdmin
            - call: "POST /appointments/${appt1_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-08T10:00:00Z" }
              as: FrontDesk
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-08T11:00:00Z" }
              as: StudioAdmin
            - call: "POST /appointments/${appt2_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-10T10:00:00Z" }
              as: FrontDesk
              captures: { appt3_id: $.data.id }
            - call: "POST /appointments/${appt3_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T11:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /appointments/${appt3_id}/no-show"
              payload: {}
              as: FrontDesk
            - call: "GET /clients/${client_id}"
              payload: {}
              as: FrontDesk
              captures: { strikes_after: $.data.no_show_strikes, status_after: $.data.client_status }
          assert:
            - "Client.${client_id}.no_show_strikes == 3"
            - "Client.${client_id}.client_status == BLOCKED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_consent_missing_beats_cooling_off
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_CONSENT_MISSING]
          - errors[ERR_COOLING_OFF_VIOLATION]
        distinguishing_aspect: "business_safety (consent, priority 7) outranks business_temporal (cooling-off, priority 9): a booking that both lacks PROCEDURE_CONSENT and violates the 48h cooling-off returns ERR_CONSENT_MISSING, not ERR_COOLING_OFF_VIOLATION."
        test_recipe:
          setup:
            - "Client with NO consent record and a patch test READ only 1h ago (cooling-off not met); booking violates both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
