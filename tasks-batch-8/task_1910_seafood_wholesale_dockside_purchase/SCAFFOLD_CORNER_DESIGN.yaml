          assert:
            - "error_id == ERR_SUBSTITUTION_GROUP_MISMATCH (422); SubstitutionApproval.${sub_id}.status stays REQUESTED"

      - name: val_second_hold_on_same_lot_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_HOLD_ALREADY_ACTIVE]"
          - "validations[priority=9]"
        distinguishing_aspect: "One active hold per lot: a second POST /inspection-holds against an ON_HOLD lot is rejected; after release a new hold can be placed."
        test_recipe:
          setup: ["Lot 50.00 kg ACTIVE with one PLACED hold"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
