scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_subscription_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.SubscriptionPlan
          - endpoints["POST /subscription-plans"]
        distinguishing_aspect: "POST /subscription-plans with all required fields returns 201; response carries id, tier, monthly_fee_cents, status defaulted ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "ESSENTIAL", monthly_fee_cents: 60000, included_miles_per_cycle: 800, free_buffer_miles: 50, overage_tier1_rate_cents: 20, overage_tier2_rate_cents: 30, included_swaps_per_term: 0, min_term_months: 3, deposit_base_cents: 50000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; SubscriptionPlan.${plan_id}.tier == ESSENTIAL; monthly_fee_cents == 60000; status == ACTIVE"

      - name: free_buffer_miles_default_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SubscriptionPlan.fields.free_buffer_miles
        distinguishing_aspect: "Omitting free_buffer_miles applies default 0; included_swaps_per_term default 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "ESSENTIAL", monthly_fee_cents: 60000, included_miles_per_cycle: 800, overage_tier1_rate_cents: 20, overage_tier2_rate_cents: 30, min_term_months: 3, deposit_base_cents: 50000 }
              as: PlatformAdmin
              captures: { buf: $.data.free_buffer_miles, sw: $.data.included_swaps_per_term }
          assert:
            - "SubscriptionPlan.free_buffer_miles == 0 (default); included_swaps_per_term == 0 (default)"

      - name: get_vehicle_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Vehicle
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /vehicles/{id}"]
        distinguishing_aspect: "GET /vehicles/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: create_vehicle_missing_required_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Vehicle.fields.vin
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /vehicles"]
        distinguishing_aspect: "Missing required vin on POST /vehicles -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A fleet and plan exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "RF", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST (missing vin)"

      - name: applicant_invalid_history_flag_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.history_flag
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "history_flag outside {CLEAN,MINOR,SEVERE} -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Bad", email: "bad@x.com", credit_score: 700, monthly_income_cents: 300000, history_flag: "UNKNOWN" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST (history_flag not in enum)"

      - name: vehicle_system_fields_status_active_subscription_generated
        claim_type: System Fields
        grounds:
          - entities.Vehicle.fields.status
          - entities.Vehicle.fields.active_subscription_id
        distinguishing_aspect: "New Vehicle is created AVAILABLE with active_subscription_id null; client cannot pre-set status."
        test_recipe:
          setup: ["A fleet and plan exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "SF", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "SF-1", model_label: "XC40", odometer_miles: 12 }
              as: FleetOperator
              captures: { st: $.data.status, asub: $.data.active_subscription_id, ver: $.data.version }
          assert:
            - "Vehicle.status == AVAILABLE; active_subscription_id == null; version == 1"

      - name: list_plans_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.SubscriptionPlan
          - endpoints["GET /subscription-plans"]
        distinguishing_aspect: "GET /subscription-plans returns an array response_type with pagination meta total_count/has_more."
        test_recipe:
          setup: ["Two plans created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "ESSENTIAL", monthly_fee_cents: 60000, included_miles_per_cycle: 800, overage_tier1_rate_cents: 20, overage_tier2_rate_cents: 30, min_term_months: 3, deposit_base_cents: 50000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscription-plans"
              payload: { limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array; total_count == 2; has_more == false"

      - name: invoice_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Invoice
          - endpoints["GET /invoices/{id}"]
        distinguishing_aspect: "Invoice has common_fields:false — it carries id + created_at only, no version field, and has no update endpoint."
        test_recipe:
          setup: ["A subscription closed one billing cycle, producing a CYCLE invoice."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "IM", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "IM-1", model_label: "XC40", odometer_miles: 1000 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "im@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "GET /subscriptions/${sub_id}/billing-cycles"
              payload: { status: "OPEN" }
              as: BillingAdmin
              captures: { cyc_id: $.data.0.id }
            - call: "POST /billing-cycles/${cyc_id}/close"
              payload: { odometer_end_miles: 1500 }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}/invoices"
              payload: { source_kind: "CYCLE" }
              as: BillingAdmin
              captures: { inv_id: $.data.0.id }
          trigger:
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: BillingAdmin
              captures: { amt: $.data.amount_cents, sk: $.data.source_kind }
          assert:
            - "Invoice.${inv_id}.source_kind == CYCLE; amount_cents == 80000 (no overage; delta 500 < 1050)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_swap_from_completed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SwapRequest.APPROVED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
          - endpoints["POST /swap-requests/{id}/reject"]
        distinguishing_aspect: "A COMPLETED SwapRequest is terminal; rejecting it returns ERR_INVALID_STATE; no vehicle changes."
        test_recipe:
          setup: ["A swap completed (free upgrade), SwapRequest in COMPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 95000, included_miles_per_cycle: 1500, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 100000 }
              as: PlatformAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "TS", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plus_id}", vin: "TS-A", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { vA: $.data.id, vA_v0: $.data.version }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${prem_id}", vin: "TS-B", model_label: "XC60", odometer_miles: 0 }
              as: FleetOperator
              captures: { vB: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "ts@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plus_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plus_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${vA}", expected_vehicle_version: "${vA_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/swap-requests"
              payload: { to_vehicle_id: "${vB}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sw: $.data.id }
            - call: "GET /vehicles/${vB}"
              payload: {}
              as: FleetOperator
              captures: { vB_v: $.data.version }
            - call: "POST /swap-requests/${sw}/approve"
              payload: { expected_vehicle_version: "${vB_v}" }
              as: FleetOperator
            - call: "POST /swap-requests/${sw}/complete"
              payload: {}
              as: FleetOperator
          trigger:
            - call: "POST /swap-requests/${sw}/reject"
              payload: {}
              as: FleetOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (COMPLETED is terminal)"

      - name: initiate_return_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Subscription.ACTIVE_to_RETURN_PENDING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "initiate-return is only defined from ACTIVE; calling it on a DRAFT subscription -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT subscription (no vehicle assigned)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "dr@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/initiate-return"
              payload: {}
              as: Member
              as_user_id: "${appl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (initiate-return undefined from DRAFT)"

      - name: subscription_initial_state_draft_current
        claim_type: Initial State
        grounds:
          - entities.Subscription.fields.lifecycle_status
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: "Newly created Subscription starts lifecycle_status DRAFT and billing_status CURRENT."
        test_recipe:
          setup: ["An eligible applicant and a plan exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "is@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
          trigger:
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { ls: $.data.lifecycle_status, bs: $.data.billing_status }
          assert:
            - "Subscription.lifecycle_status == DRAFT; billing_status == CURRENT; deposit_held_cents == 0; swaps_used == 0"

      - name: maintenance_complete_returns_vehicle_to_available
        claim_type: Valid Transition
        grounds:
          - state_machines.Vehicle.MAINTENANCE_to_AVAILABLE
          - endpoints["POST /vehicles/{id}/maintenance-complete"]
        distinguishing_aspect: "A MAINTENANCE vehicle returns to AVAILABLE on maintenance-complete; version increments."
        test_recipe:
          setup: ["A vehicle ASSIGNED to an ACTIVE subscription, then moved to MAINTENANCE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "MT", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "MT-1", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "mt@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /vehicles/${veh_id}/maintenance"
              payload: {}
              as: FleetOperator
          trigger:
            - call: "POST /vehicles/${veh_id}/maintenance-complete"
              payload: {}
              as: FleetOperator
              captures: { st: $.data.status }
          assert:
            - "Vehicle.${veh_id}.status == AVAILABLE after maintenance-complete"

      - name: settle_cascade_already_covered_stub
        claim_type: Cross-entity
        grounds:
          - state_machines.ReturnInspection.ASSESSED_to_SETTLED
        excluded_because:
          difficulty_instance: transitive_cascade / settle_cascade_depth3_inspection_vehicle_fleet
          rationale: "The settle -> vehicle -> fleet cross-entity cascade is asserted end-to-end by the named §1.8 instance."

      - name: swap_reject_compensation_already_covered_stub
        claim_type: Compensation
        grounds:
          - state_machines.SwapRequest.APPROVED_to_REJECTED
        excluded_because:
          difficulty_instance: compensating_invariant / fleet_in_use_count_conservation_swap_approve_then_reject
          rationale: "The approve-then-reject compensation reversing the target reservation is the body of the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: eligibility_approved_boundary_at_080_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.eligibility_score
          - entities.Applicant.fields.eligibility_status
        distinguishing_aspect: "Applicant cs 720, income 480000, CLEAN on PLUS(80000) scores 0.8818 >= 0.80 -> APPROVED, required_deposit 80000 (1x)."
        test_recipe:
          setup: ["A PLUS plan exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
