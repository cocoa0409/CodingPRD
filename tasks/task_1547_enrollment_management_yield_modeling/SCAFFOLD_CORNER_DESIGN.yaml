  # ==================================================== endpoints
  - section: endpoints
    instances:
      - name: forecast_default_variant_is_historical
        claim_type: computed_read
        grounds: [calculations.yield_forecast, endpoints]
        distinguishing_aspect: "GET forecast without the variant query param defaults to historical_band (echoed in the response variant field)."
        test_recipe:
          setup: ["Cycle OPEN, zero applications"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - { call: "POST /enrollment/programs", payload: { cycle_id: "${c_id}", name: "DEF", capacity_seats: 4, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
          trigger:
            - call: "GET /enrollment/cycles/${c_id}/forecast"
              payload: {}
              as: EnrollmentManager
              captures: { variant_used: $.data.variant, proj: $.data.projected_enrollment }
          assert:
            - "${variant_used} == historical_band"
            - "${proj} == 0 (empty pipeline, zero bases)"

      - name: response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success list responses carry meta.api_request_id/api_request_timestamp, response_type 'array', and data with limit/offset/total_count/has_more; error responses carry response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["One cycle"]
          setup_api_calls:
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /enrollment/applications"
              payload: {}
              as: EnrollmentManager
            - call: "GET /enrollment/cycles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EnrollmentManager
              captures: { err: $.data.error_id }
          assert:
            - "List response: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'array', data exposes limit/offset/total_count/has_more with total_count == 0 and defaults limit 10 offset 0"
            - "Error response: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"

