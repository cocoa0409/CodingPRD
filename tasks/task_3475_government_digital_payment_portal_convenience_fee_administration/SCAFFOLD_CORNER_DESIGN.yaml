              payload: { quote_id: "${qs1}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { ts1: $.data.id }
            - call: "POST /portal/payment-transactions/${ts1}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-county"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc2_id}", amount_cents: 2000, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { qs2: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${qs2}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { ts2: $.data.id }
            - call: "POST /portal/payment-transactions/${ts2}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-county"
          trigger:
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { entry_id: $.data.id }
          assert:
            - "SelfFundingLedgerEntry.${entry_id}.absorbed_billed_cents == 12559 (12495 + 64)"
            - "the straddle line is round_half_up(1000*0.025 + 1000*0.019) + 20 == 64 — 1000 cents in band 1 (inclusive of cent 500000), 1000 in band 2"
            - "SelfFundingLedgerEntry.${entry_id}.absorbed_billed_flat_cents == 9549 (501000 @ 190bp + 2 x 15)"

      - name: min_fee_floor_on_small_card_amount
        claim_type: Constants Applied
        grounds:
          - calculations.convenience_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_floor_bucket_tier_nested_min_max
          rationale: "The MIN_FEE_CENTS=100 floor binding at amount 1000 (grossed 66 -> charged 100) is asserted verbatim in the named §1.8 instance."

      - name: value_date_recomputed_on_represent
        claim_type: Correct Result
        grounds:
          - calculations.value_date
        excluded_because:
          difficulty_instance: non_linear_state_machine / transaction_ach_return_represent_cycle
          rationale: "The +2 day ECHECK recomputation at re-present (value_date == 2026-09-17) is asserted in the named §1.8 instance."

      - name: statutory_fee_cap_enforcement
        claim_type: Precision
        grounds:
          - calculations.convenience_fee
        excluded_because:
          difficulty_instance: boundary_precision_check / statutory_cap_exact_allowed_over_rejected
          rationale: "Cap-equal acceptance and cap-exceeded rejection are both asserted in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: call_with_unknown_role_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT
        distinguishing_aspect: "Priority 1 rejects an X-User-Role value that names no declared role with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT before any role-permission check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /portal/agencies"
              payload: { legal_name: "Ghost Agency", agency_type: "STATE", default_fee_model: "ABSORBED" }
              as: SuperUser
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"
            - "err_id != ERR_FORBIDDEN_FOR_ROLE (authentication of the role value itself failed)"

      - name: authorize_body_fks_checked_in_declared_input_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - endpoints.POST_/portal/payment-transactions
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_INSTRUMENT_NOT_FOUND
        distinguishing_aspect: "With BOTH quote_id and instrument_id unknown, the 404 names the quote — the endpoint's input list declares quote_id first and body existence checks run in that order."
        test_recipe:
          setup:
            - "One registered payer (existence of the caller is fine; both body FKs dangle)."
          setup_api_calls:
            - *c_clock
            - *c_payer
          trigger:
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "00000000-0000-4000-8000-000000000001", instrument_id: "00000000-0000-4000-8000-000000000002" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "00000000-0000-4000-8000-000000000001", instrument_id: "00000000-0000-4000-8000-000000000002" }
              as: PlatformAdmin
              captures: { err_admin: $.data.error_id }
          assert:
            - "the first response is 404 with err_both == ERR_QUOTE_NOT_FOUND (not ERR_INSTRUMENT_NOT_FOUND)"
            - "the second (PlatformAdmin) response is also 404 ERR_QUOTE_NOT_FOUND — ordering is role-independent"

      - name: refund_create_on_unknown_transaction_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_TRANSACTION_NOT_FOUND
        distinguishing_aspect: "Existence (priority 3) precedes the refund state machine: an unknown transaction_id is 404 ERR_TRANSACTION_NOT_FOUND, never 409."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /portal/refunds"
              payload: { transaction_id: "00000000-0000-4000-8000-000000000009", amount_cents: 100, reason: "ghost" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_TRANSACTION_NOT_FOUND"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: error_envelope_shape_on_failures
        claim_type: Standard CRUD
        grounds:
          - response_envelope
        distinguishing_aspect: "Every failure carries the fixed envelope: response_type == error, data.error_id and data.message present, and meta.api_request_id / api_request_timestamp populated — verified on a 404 and a 409."
        test_recipe:
          setup:
            - "CF agency created."
          setup_api_calls:
            - *c_clock
            - *c_agency
          trigger:
            - call: "GET /portal/agencies/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err_404: $.data.error_id }
            - call: "POST /portal/agencies/${ag_id}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { err_409: $.data.error_id }
          assert:
            - "both responses have response_type == error and non-empty data.message, plus meta.api_request_id and meta.api_request_timestamp"
            - "err_404 == ERR_AGENCY_NOT_FOUND; err_409 == ERR_INVALID_STATE (suspend on ONBOARDING agency)"

      - name: transactions_list_filter_by_funds_status
        claim_type: Computed read
        grounds:
          - endpoints.GET_/portal/payment-transactions
        distinguishing_aspect: "Combining funds_status and payer_id filters returns only matching rows: after one void and one live authorize, funds_status=VOIDED returns exactly the voided transaction."
        test_recipe:
          setup:
            - "CF agency base chain; two authorized transactions for one payer; the first then voided."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 20000, method: "CARD" }
              as: Payer
