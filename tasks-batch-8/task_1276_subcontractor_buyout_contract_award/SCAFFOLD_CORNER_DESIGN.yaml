      - name: gcadmin_cannot_publish_package_forbidden
        claim_type: violation_to_error
        grounds:
          - "roles.\"GCAdmin"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "GCAdmin (project lifecycle role) is NOT in the publish role list — even the platform admin is denied BuyoutLead-exclusive transitions (403), proving the matrix is not an admin-superset model."
        test_recipe:
          setup: ["project BUYOUT_OPEN; package DRAFT"]
