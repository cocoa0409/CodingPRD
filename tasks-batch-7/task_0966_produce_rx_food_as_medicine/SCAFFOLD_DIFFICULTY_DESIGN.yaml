          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE (state priority 6 beats referential pool check priority 10)"
            - "No voucher exists for the enrollment (GET /vouchers?enrollment_id -> total_count 0)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: education_session_venue_buffer_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_VENUE_CONFLICT]
          - entities.EducationSession.fields.venue
        distinguishing_aspect: |
          Interval semantics WITH a 30-minute turnover buffer on the venue
          resource: a session starting 15 minutes after another ends CONFLICTS
          (15 < 30), while exactly 30 minutes of gap is ALLOWED (buffer is >=
          30); a different venue never conflicts.
        test_recipe:
          setup:
            - "Program ACTIVE; session A at venue RM-1, 2026-05-10T10:00-11:00Z, SCHEDULED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "A", venue: "RM-1", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { sa: $.data.id } }
          trigger:
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "B", venue: "RM-1", starts_at: "2026-05-10T11:15:00Z", ends_at: "2026-05-10T12:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { err_b: $.data.error_id } }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "C", venue: "RM-1", starts_at: "2026-05-10T11:30:00Z", ends_at: "2026-05-10T12:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { sc: $.data.id } }
            - { call: "POST /programs/${pg}/education-sessions", payload: { topic: "D", venue: "RM-2", starts_at: "2026-05-10T10:30:00Z", ends_at: "2026-05-10T11:00:00Z", capacity: 10, educator_ref: "ed-1" }, as: Educator, captures: { sd: $.data.id } }
          assert:
            - "session B rejected with ERR_VENUE_CONFLICT (gap 15 min < 30-min buffer)"
            - "session C created (gap exactly 30 min satisfies the >= 30 buffer boundary)"
            - "session D created despite full time overlap with A (different venue)"

      - name: benefit_cycle_adjacent_periods_allowed_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.BenefitCycle.fields.start_date
        distinguishing_aspect: |
          Different interval semantics from the venue rule: cycle periods are
          half-open [start_date, end_date) on the PROGRAM CALENDAR resource
          with NO buffer — exact adjacency (end == next start) is allowed,
          while any interior overlap is rejected.
        test_recipe:
          setup:
            - "Program (DRAFT is fine for cycle creation); cycle 1 [2026-05-01, 2026-06-01) created"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 2, start_date: "2026-06-01", end_date: "2026-07-01" }, as: ProgramAdmin, captures: { c2: $.data.id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 3, start_date: "2026-05-15", end_date: "2026-06-15" }, as: ProgramAdmin, captures: { err_c3: $.data.error_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 4, start_date: "2026-07-01", end_date: "2026-08-01" }, as: ProgramAdmin, captures: { c4: $.data.id } }
          assert:
            - "cycle 2 created (start 2026-06-01 == cycle 1 end; adjacency allowed under half-open semantics)"
            - "cycle 3 rejected with ERR_PERIOD_OVERLAP (overlaps both cycle 1 and cycle 2 interiors)"
            - "cycle 4 created (adjacent to cycle 2)"

  - rule_id: compensating_invariant
    instances:
      - name: funding_pool_conservation_across_redemption_void
        grounds:
          - state_machines.Redemption.SETTLED_to_VOIDED
          - entities.FundingPool.fields.available_cents
          - entities.FundingPool.fields.reserved_cents
          - entities.FundingPool.fields.disbursed_cents
        distinguishing_aspect: |
          Conserved quantity: FUNDING POOL cents — available + reserved +
          disbursed == committed (500000) at every snapshot: after issuance
          (487500+12500+0), after a 3000-cent redemption (487500+9500+3000),
          and after its void (487500+12500+0). Zero drift end-to-end.
        test_recipe:
          setup:
            - "Standard ACTIVE program, pool committed 500000, enrollment face 12500, voucher ISSUED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", contact_email: "f1@x.org", total_commitment_cents: 1000000 }, as: ProgramAdmin, captures: { fu: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", start_date: "2026-05-01", end_date: "2026-10-31", base_monthly_benefit_cents: 10000, household_increment_cents: 2500, max_household_size: 6, double_up_multiplier: 1.0, double_up_daily_cap_cents: 100000, double_up_pool_cents: 200000, tier2_completions: 3, tier3_completions: 6, renewal_window_days: 30, outcome_improvement_threshold: 0.5 }, as: ProgramAdmin, captures: { pg: $.data.id } }
            - { call: "POST /funding-pools", payload: { program_id: "${pg}", funder_id: "${fu}", committed_cents: 500000 }, as: ProgramAdmin, captures: { pl: $.data.id } }
            - { call: "POST /funding-pools/${pl}/fund", payload: {}, as: FunderAnalyst, as_user_id: "${fu}" }
            - { call: "POST /programs/${pg}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /clinics", payload: { name: "C1", npi_number: "1111111111", max_active_referrals: 50 }, as: ProgramAdmin, captures: { cl: $.data.id } }
            - { call: "POST /retailers", payload: { name: "R1", kind: "GROCERY", double_up_eligible: true }, as: ProgramAdmin, captures: { rt: $.data.id } }
            - { call: "POST /patients", payload: { clinic_id: "${cl}", full_name: "Pat One", date_of_birth: "1980-01-15", household_size: 2 }, as: ClinicStaff, as_user_id: "${cl}", captures: { pt: $.data.id } }
            - { call: "POST /patients/${pt}/grant-consent", payload: {}, as: ClinicStaff, as_user_id: "${cl}" }
            - { call: "POST /referrals", payload: { clinic_id: "${cl}", patient_id: "${pt}", program_id: "${pg}", diagnosis_code: "E11.9", priority: "STANDARD" }, as: ClinicStaff, as_user_id: "${cl}", captures: { rf: $.data.id } }
            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /cycles/${cy}/issue", payload: {}, as: ProgramAdmin }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { av0: $.data.available_cents, rs0: $.data.reserved_cents, ds0: $.data.disbursed_cents } }
          trigger:
            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 2000 }, { category: "STAPLE", amount_cents: 3000 } ] }, as: RetailerStaff, as_user_id: "${rt}", captures: { rd: $.data.id } }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { av1: $.data.available_cents, rs1: $.data.reserved_cents, ds1: $.data.disbursed_cents } }
            - { call: "POST /redemptions/${rd}/void", payload: { reason: "register error" }, as: RetailerStaff, as_user_id: "${rt}" }
            - { call: "GET /funding-pools/${pl}", payload: {}, as: ProgramAdmin, captures: { av2: $.data.available_cents, rs2: $.data.reserved_cents, ds2: $.data.disbursed_cents } }
          assert:
            - "after issue: available 487500 + reserved 12500 + disbursed 0 == 500000"
            - "after redemption: available 487500 + reserved 9500 + disbursed 3000 == 500000"
            - "after void: available 487500 + reserved 12500 + disbursed 0 == 500000 (full compensation, no drift)"

      - name: double_up_pool_conservation_across_redemption_void
        grounds:
          - state_machines.Redemption.SETTLED_to_VOIDED
          - entities.Program.fields.double_up_matched_cents
          - entities.Program.fields.double_up_remaining_cents
        distinguishing_aspect: |
          Different conserved quantity from the funding-pool instance: the
