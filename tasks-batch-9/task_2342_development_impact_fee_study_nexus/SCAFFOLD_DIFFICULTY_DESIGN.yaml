      - name: application_not_found_outranks_invalid_request
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors.ERR_DEVELOPMENT_APPLICATION_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The request breaks existence at priority 7 (the path id belongs to no
          application) and schema at priority 12 (valuation_method MARKET is outside the
          enum and improvement_value_cents is negative). The existence error must win with
          404 ERR_DEVELOPMENT_APPLICATION_NOT_FOUND, which forces the path id to be
          resolved before the body is parsed - the opposite of the usual
          validate-then-lookup instinct.
        test_recipe:
          setup:
            - "HARBOR program with the PARKS standard; no DevelopmentApplication has ever been created."
            - "The id 00000000-0000-0000-0000-0000000009ff belongs to no row of any entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
