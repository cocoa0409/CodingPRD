  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: orphan_certification_rule_three_channels_thirty_days
        claim_type: correct_result
        grounds: [calculations.desk_constants, entities.Asset.fields.orphan_status]
        distinguishing_aspect: "orphan_status flips to ORPHAN_CERTIFIED only with >= 3 distinct channels, all NO_RESULT, spanning >= 30 days; two logs or a 29-day span leave it DILIGENCE_PENDING."
        test_recipe:
          setup: ["Holder-less asset; log1 COPYRIGHT_OFFICE at clock 2026-08-01; log2 PERFORMING_RIGHTS_ORG at 2026-08-20 (span 19d — not enough); log3 UNION_GUILD at 2026-08-31 (span exactly 30d)"]
          setup_api_calls:
            - call: "POST /rights/assets"
              payload: { title: "Orphan Work", work_kind: STILL_IMAGE, permitted_media: [PRINT] }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/diligence-logs"
              payload: { search_channel: COPYRIGHT_OFFICE, outcome: NO_RESULT, notes: "l1" }
              as: AssetCurator
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/assets/${asset_id}/diligence-logs"
              payload: { search_channel: PERFORMING_RIGHTS_ORG, outcome: NO_RESULT, notes: "l2" }
              as: AssetCurator
          trigger:
            - call: "GET /rights/assets/${asset_id}"
              payload: {}
              as: AssetCurator
              captures: { mid_status: "$.data.orphan_status" }
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AssetCurator
            - call: "POST /rights/assets/${asset_id}/diligence-logs"
              payload: { search_channel: UNION_GUILD, outcome: NO_RESULT, notes: "l3" }
              as: AssetCurator
            - call: "GET /rights/assets/${asset_id}"
              payload: {}
              as: AssetCurator
              captures: { final_status: "$.data.orphan_status", final_posture: "$.data.posture" }
          assert:
            - "mid_status == DILIGENCE_PENDING  (span 19d < 30d after two logs)"
            - "final_status == ORPHAN_CERTIFIED  (3 channels, span exactly 30d — >= boundary)"
            - "final_posture == CLEAR  (no licenses, no notices, orphan certified)"

      - name: orphan_certified_asset_can_advance_without_holder
        claim_type: correct_result
        grounds: [calculations.asset_posture, state_machines.ClearanceRequest.HOLDER_REVIEW_to_NEGOTIATING]
        distinguishing_aspect: "HOLDER_REVIEW→NEGOTIATING passes with null rights_holder_id iff orphan_status == ORPHAN_CERTIFIED; a DILIGENCE_PENDING asset fails ERR_ORPHAN_DILIGENCE_INCOMPLETE at SUBMITTED→HOLDER_REVIEW."
        test_recipe:
          setup: ["Two holder-less assets: A_cert certified via 3 logs spanning 30d; A_pend with 1 log"]
          setup_api_calls:
            - call: "POST /rights/assets"
              payload: { title: "Cert Orphan", work_kind: STILL_IMAGE, permitted_media: [PRINT] }
              as: AssetCurator
              captures: { a_cert: "$.data.id" }
