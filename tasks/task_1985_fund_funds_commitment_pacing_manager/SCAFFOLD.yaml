  # --- DueDiligenceReview ---
  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews"
    description: "Open a new DD review round on a vehicle in IN_DILIGENCE (round_index = prior max + 1); required when a prior round was WITHDRAWN or COMPLETED and diligence must rerun"
    roles: [Analyst]
    code: 201
    input: []
    output: DueDiligenceReview
    side_effects: ["round_index assigned", "status = DRAFT"]

  - method: GET
    path: "/fof/vehicles/{id}/dd-reviews"
    description: "List DD reviews for a vehicle"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "DueDiligenceReview[]"
    side_effects: []

  - method: GET
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}"
    description: "Get one DD review"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: []

  - method: PUT
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}"
    description: "Update scores while DRAFT or INFO_REQUESTED"
    roles: [Analyst]
    code: 200
    input: ["score_strategy_fit?", "score_track_record?", "score_operations?", "score_compliance?"]
    output: DueDiligenceReview
    side_effects: ["increments DueDiligenceReview.version by 1"]

  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}/submit"
    description: "Submit review; computes composite score"
    roles: [Analyst]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: ["status -> SUBMITTED", "composite_score computed", "increments DueDiligenceReview.version by 1"]

  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}/request-info"
    description: "IC kicks review back for more info (cycle)"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: ["status -> INFO_REQUESTED", "increments DueDiligenceReview.version by 1"]

  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}/resubmit"
    description: "Resubmit after info request; recomputes composite"
    roles: [Analyst]
    code: 200
    input: []
    output: DueDiligenceReview
    side_effects: ["status -> SUBMITTED", "composite_score recomputed", "increments DueDiligenceReview.version by 1"]

  - method: POST
    path: "/fof/vehicles/{id}/dd-reviews/{reviewId}/complete"
