        test_recipe:
          setup: ["Inn tax 0; Room base 10000; Package flat 5000 + per_night 2000; 3-night booking."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "S Inn", lodging_tax_rate_bps: 0 }
