      - name: cap_decision_by_the_fitness_determiner_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 9]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.CorrectiveActionPlan.PENDING_DECISION_to_ACCEPTED
        distinguishing_aspect: |
          The decision is blocked for exactly one identity — the auditor recorded in
          carrier.fitness_determined_by_user_id — while any other auditor may decide the same plan; the
          successful ACCEPT then upgrades the carrier one step (CONDITIONAL -> SATISFACTORY) rather than
          jumping straight to SATISFACTORY from UNSATISFACTORY.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) put at CONDITIONAL by auditor_bob."
            - "CAP cap1 for c1 with one action item taken to VERIFIED, both branch reviews CLEARED by auditor_carl and auditor_dave, so cap1 sits in PENDING_DECISION with completion_pct 100.0."
