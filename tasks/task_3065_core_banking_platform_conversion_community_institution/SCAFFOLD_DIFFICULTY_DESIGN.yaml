# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3065_core_banking_platform_conversion_community_institution
# 9 rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is reproducible from empty-DB via the
# structured setup_api_calls chains below.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: accrual_interest_mock_run_vs_cutover_variant
        grounds:
          - calculations.accrual_interest
          - calculations.accrual_interest.variants.mock_run_variant
          - calculations.accrual_interest.variants.cutover_variant
          - state_machines.ConversionProject.CUTOVER_PLANNED_to_LIVE
        distinguishing_aspect: |
          The same account, same principal and same accrual inputs produce a
          DIFFERENT cutoff_accrued_interest_cents depending on which variant
          runs: the mock-run variant computes at the mock finalize clock date
          (2026-09-10), the cutover variant recomputes authoritatively at
          cutoff_business_date (2026-09-20) — 10 extra days of accrual
          (3650 cents vs 7300 cents at 365 cents/day).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; project created (created_at = 2026-09-01T00:00:00Z)."
            - "DEPOSIT product ACT_365 rate 0.03 ACTIVE; GL GL-1000."
            - "Account L-1001: principal 10000000 cents, accrual_start 2026-09-01, MAPPED."
            - "Project in MOCK_CONVERSION; MOCK-1 finalized at 2026-09-10 PASSED."
            - "Cutover planned for 2026-09-20 with one task; ancillary system CARDS-1 VERIFIED; plan GO; task COMPLETE."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { proj_id: $.data.id, proj_created_at: $.data.created_at }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${proj_id}",  product_code: "DDA-STD", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.03, statement_frequency: "MONTHLY", monthly_fee_cents: 0 }
              as: ConversionEngineer
              captures: { pt_id: $.data.id }
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${proj_id}",  gl_code: "GL-1000", description: "Demand deposits" }
              as: ConversionEngineer
              captures: { gl_id: $.data.id }
            - call: "POST /api/v1/product-types/${pt_id}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${proj_id}",  legacy_account_number: "L-1001", account_type: "DEPOSIT", product_type_id: "${pt_id}", opening_principal_cents: 10000000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct_id: $.data.id }
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
            - call: "POST /api/v1/accounts/${acct_id}/map"
              payload: { gl_account_id: "${gl_id}", expected_project_version: "${pv}" }
              as: ConversionEngineer
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/conversions/${proj_id}/advance"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/mock-runs"
              payload: {project_id: "${proj_id}",  run_label: "MOCK-1" }
              as: ConversionEngineer
              captures: { run_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/mock-runs/${run_id}/finalize"
              payload: {}
              as: ConversionEngineer
              captures: { run_outcome: $.data.outcome, mock_accrued: $.data.converted_total_cents }
            - call: "POST /api/v1/accounts/${acct_id}/flag-exception"
              payload: { note: "stub exception to certify clearing" }
              as: ConversionEngineer
            - call: "POST /api/v1/accounts/${acct_id}/clear-exception"
              payload: { resolution_note: "certified" }
              as: ConversionEngineer
            - call: "POST /api/v1/ancillary-systems"
              payload: {project_id: "${proj_id}",  name: "CARDS-1", category: "CARDS", interface_version: "v2" }
              as: OperationsLead
              captures: { sys_id: $.data.id }
            - call: "POST /api/v1/ancillary-systems/${sys_id}/start-integration"
              payload: {}
              as: OperationsLead
            - call: "POST /api/v1/ancillary-systems/${sys_id}/verify"
              payload: {}
              as: OperationsLead
            - call: "POST /api/v1/conversions/${proj_id}/plan-cutover"
              payload: { cutover_scheduled_date: "2026-09-20", file_freeze_start: "2026-09-19T18:00:00Z", go_no_go_checkpoint: "2026-09-19T20:00:00Z", reopen_target: "2026-09-21T06:00:00Z" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { plan_id: $.data.id }
            - call: "POST /api/v1/tasks"
              payload: {plan_id: "${plan_id}",  task_name: "extract", sequence: 1, conversion_window_start: "2026-09-19T19:00:00Z", conversion_window_end: "2026-09-19T21:00:00Z", owner_role: "CONVERSION_ENGINEER" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { task_id: $.data.id }
            - call: "POST /api/v1/plans/${plan_id}/schedule"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-19T20:30:00Z" }
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/plans/${plan_id}/go"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/tasks/${task_id}/start"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/tasks/${task_id}/complete"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: "pm-alice"
          trigger:
            - call: "POST /api/v1/conversions/${proj_id}/go-live"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "GET /api/v1/accounts/${acct_id}"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { acct_status: $.data.status, acct_conv_bal: $.data.conversion_balance_cents, acct_accrued: $.data.cutoff_accrued_interest_cents, acct_daily: $.data.daily_interest_cents }
          assert:
            - "run_outcome == \"PASSED\""
            - "acct_daily == 822 (round_half_up(10000000 * 0.03 / 365) = round_half_up(821.917808) = 822)"
            - "acct_accrued == 15618 (cutover variant: cutoff_business_date = 2026-09-19 = clock date minus one; 822 * 19 days, 2026-09-01..2026-09-19 inclusive)"
            - "acct_conv_bal == 10015618 (opening principal + accrued, DEPOSIT)"
            - "acct_status == \"CONVERTED\""
            - "the mock variant had computed 822 * 10 = 8220 at the 2026-09-10 finalize; the cutover variant recomputed 15618 at cutoff_business_date — same formula, different computation date, different result"

      - name: comm_wave_schedule_vs_comm_backoff_variants
        grounds:
          - calculations.comm_wave_schedule
          - calculations.comm_wave_schedule.variants.wave_schedule_variant
          - calculations.comm_wave_schedule.variants.comm_backoff_variant
          - state_machines.CustomerComm.FAILED_to_SENT
        distinguishing_aspect: |
          Two different entity domains than accrual: CustomerComm scheduling.
          The wave_schedule variant sets scheduled_send_date = send_after
          (wave 2 -> 2026-09-02T00:00:00Z), while the comm_backoff variant on
          resend shifts the same comm to send_after + resend_count days
          (2026-09-03T00:00:00Z after one resend) — the identical comm object
          yields two different schedules under the two variants.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; project created at that instant."
            - "Product DDA-STD ACTIVE, GL-1000, account L-2001 DEPOSIT MAPPED (comm schedule requires account MAPPED/EXCEPTION/CLEARED and unfrozen)."
            - "CustomerComm wave 2 on the account; scheduled; sent at 2026-09-02; failed; resent at 2026-09-02T12:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { proj_id: $.data.id }
            - call: "POST /api/v1/product-types"
              payload: {project_id: "${proj_id}",  product_code: "DDA-STD", kind: "DEPOSIT", accrual_method: "ACT_365", rate: 0.03, statement_frequency: "MONTHLY", monthly_fee_cents: 0 }
              as: ConversionEngineer
              captures: { pt_id: $.data.id }
            - call: "POST /api/v1/product-types/${pt_id}/activate"
              payload: {}
              as: ConversionEngineer
            - call: "POST /api/v1/gl-accounts"
              payload: {project_id: "${proj_id}",  gl_code: "GL-1000", description: "Demand deposits" }
              as: ConversionEngineer
              captures: { gl_id: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${proj_id}",  legacy_account_number: "L-2001", account_type: "DEPOSIT", product_type_id: "${pt_id}", opening_principal_cents: 500000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { acct_id: $.data.id }
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: ConversionEngineer
              captures: { pv: $.data.version }
            - call: "POST /api/v1/accounts/${acct_id}/map"
              payload: { gl_account_id: "${gl_id}", expected_project_version: "${pv}" }
              as: ConversionEngineer
            - call: "POST /api/v1/customer-comms"
              payload: {project_id: "${proj_id}",  account_id: "${acct_id}", comm_type: "ACCOUNT_NUMBER_CHANGE", wave: 2 }
              as: CommunicationsOfficer
              captures: { comm_id: $.data.id, comm_send_after: $.data.send_after }
            - call: "GET /api/v1/conversions/${proj_id}"
              payload: {}
              as: CommunicationsOfficer
              captures: { proj_v: $.data.version }
            - call: "POST /api/v1/customer-comms/${comm_id}/schedule"
              payload: { expected_project_version: "${proj_v}" }
              as: CommunicationsOfficer
              captures: { comm_sched: $.data.scheduled_send_date }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: ProjectManager
              as_user_id: "pm-alice"
            - call: "POST /api/v1/customer-comms/${comm_id}/send"
              payload: {}
              as: CommunicationsOfficer
            - call: "POST /api/v1/customer-comms/${comm_id}/fail"
              payload: {}
              as: CommunicationsOfficer
          trigger:
            - call: "POST /api/v1/customer-comms/${comm_id}/resend"
              payload: {}
              as: CommunicationsOfficer
              captures: { comm_status: $.data.status, comm_resends: $.data.resend_count, comm_sched2: $.data.scheduled_send_date }
          assert:
            - "comm_send_after == \"2026-09-02T00:00:00Z\" (wave_schedule variant: created_at + (2-1) days)"
            - "comm_sched == \"2026-09-02T00:00:00Z\" (schedule copies send_after, backoff 0)"
            - "comm_status == \"SENT\" and comm_resends == 1"
            - "comm_sched2 == \"2026-09-03T00:00:00Z\" (comm_backoff variant: send_after + resend_count days) — differs from the wave_schedule result for the same comm"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: defect_triage_priority_multifactor_threshold
        grounds:
          - calculations.defect_triage_priority
          - state_machines.Defect.OPEN_to_TRIAGED
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — capped
          age weight (min(age_hours//24, 3) * 10) plus severity weight,
          tiered against inclusive thresholds. A SEV1 aged 48h (score 120)
          triages to priority 1 while an identical SEV1 aged 24h (score 110)
          also yields 1 but a SEV1 aged 0h (score 100) yields 2 — the age cap
          and the >=110 boundary interact.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; project in LIVE (reached via full happy path); two SEV1 defects D1 (opened 2026-09-25T00:00:00Z) and D2 (opened 2026-09-27T00:00:00Z)."
            - "Triage runs at 2026-09-28T00:00:00Z: D1 age 72h -> age_weight capped at 30 -> score 130 -> priority 1; D2 age 24h -> score 110 -> priority 1 (inclusive boundary); D3 opened 2026-09-28T00:00:00Z -> score 100 -> priority 2."
          setup_api_calls:
