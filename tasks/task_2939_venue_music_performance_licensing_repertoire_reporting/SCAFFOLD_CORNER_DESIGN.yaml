            - call: "GET /licensing/societies/${bmi_id}"
              payload: {}
              as: LicensingAdmin
              captures: { soc_count: "$.data.licensed_venue_count" }
          assert:
            - "${lic1_cov0} was PENDING_ACTIVATION, ${share_before} was 0, ${posture_before} was UNCOVERED and ${out_before} was 0"
            - "The activation response alone already shows ${cov_after} == ACTIVE, ${bill_after} == INVOICED and ${fee_after} == 90017"
            - "${share_after} is 4600, ${posture_after} is PARTIALLY_COVERED and ${out_after} is 90017 on the very first read after the write, with no retry or delay"
            - "${soc_count} is 1, so the society-side denormalised count is current too"
            - "The ANNUAL_TERM CoverageWindow and the INITIAL FeeAssessment both exist immediately: GET /licensing/licenses/${lic1_id}/coverage-windows and GET /licensing/fee-assessments?license_id=${lic1_id} each return total_count == 1"
            - "Repeating all three reads returns byte-identical values, so nothing settled asynchronously between them"

      - name: corner_consistency_immediate_across_a_multi_link_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_rate_publish_supersede_repin_trueup_ledger
          rationale: "That §1.8 instance reads every downstream row immediately after the publish call and asserts the fully settled values, which is exactly the immediate-consistency claim for a four-link cascade."
