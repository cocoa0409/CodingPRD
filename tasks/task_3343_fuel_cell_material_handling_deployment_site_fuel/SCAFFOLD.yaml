    roles: [SiteManager, ConversionTechnician]
    code: 200
    input: []
    output: ConversionPlan
    side_effects: []
  - method: POST
    path: "/api/sites/{id}/conversion-plans/{pid}/schedule"
    description: "Schedule a plan (DRAFT -> SCHEDULED); OCC-guarded on plan version."
    roles: [SiteManager]
    code: 200
    input: [expected_plan_version]
    output: ConversionPlan
    side_effects: ["plan.status -> SCHEDULED", "increments plan.version by 1"]
  - method: POST
    path: "/api/sites/{id}/conversion-plans/{pid}/revert"
    description: "Revert a scheduled plan to DRAFT."
    roles: [SiteManager]
    code: 200
    input: []
