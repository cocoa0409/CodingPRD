  - rule_id: cross_entity_state_dependency
    instances:
      - name: construction_start_blocked_until_every_required_permit_is_approved
        grounds:
          - validations[priority 12 ERR_PERMIT_READINESS_UNMET]
          - entities.BuildZone.fields.required_permit_types
          - state_machines.PermitApplication.status.SUBMITTED_to_APPROVED
          - state_machines.BuildZone.construction_status.SEQUENCED_to_IN_CONSTRUCTION
          - endpoints["POST /build-zones/{id}/construction-start"]
        distinguishing_aspect: |
          Entity pair BuildZone x PermitApplication: the zone's own fields are all in order
          (QUALIFIED, SEQUENCED, pole ATTACHED) yet construction-start is refused because a *child of
          a different entity* — the TRAFFIC_CONTROL application — is not APPROVED; approving that
          sibling row, with nothing on the zone touched, makes the very same call succeed.
