      - name: program_cancellation_cascade_loan_payoff_device_unlock_carrier_port_eligible
        grounds:
          - state_machines.InstallmentLoan.status.ACTIVE_to_PAID_OFF
          - state_machines.DeviceUnit.unlock_status
          - state_machines.CarrierAccount.activation_state
          - state_machines.Installment.to_VOIDED
          - calculations.payoff_quote.variants.early_cancellation
          - endpoints.POST_/loans/{id}/cancellation
        distinguishing_aspect: |
          A depth-3 chain fired from a completely different transition than the default
          cascade — the customer-initiated POST /loans/{id}/cancellation rather than the
          collections sweep: (1) settling the EARLY_CANCELLATION quote for exactly 36659 moves
          the loan ACTIVE -> PAID_OFF with closure_reason PROGRAM_CANCELLATION; (2) because the
          loan left ACTIVE its DeviceUnit.unlock_status goes LOCKED -> UNLOCKED, skipping
          UNLOCK_REQUESTED entirely and bypassing every unlock precondition (only 12 paid
          installments and no carrier policy window check); (3) because the handset became
          UNLOCKED its CarrierAccount.activation_state becomes PORT_ELIGIBLE. Link 2 is the
          discriminator: an implementation that routes closure through the normal unlock
          request path leaves the device in LOCKED or UNLOCK_REQUESTED and the carrier in
          ACTIVATED.
