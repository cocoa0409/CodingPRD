# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the claim-extraction-guide sections. Setup uses
# StoreManager unless a specific role is under test.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ entities
  - section: entities
    instances:
      - name: create_order_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "POST /orders with customer_name returns 201; fulfillment_status defaults DRAFT, payment_status UNPAID, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /orders", payload: { customer_name: "Walk-in" }, as: StoreManager, captures: { o: "$.data.id" } }
          assert:
            - "Order.${o}.fulfillment_status == \"DRAFT\""
            - "Order.${o}.payment_status == \"UNPAID\""
            - "Order.${o}.version == 1"

      - name: get_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/00000000-0000-0000-0000-000000000000", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_NOT_FOUND\" (http 404)"

      - name: create_order_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Order.fields.customer_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /orders without customer_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /orders", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_REQUEST\" (http 422)"

      - name: create_order_bad_trade_account_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Order.fields.trade_account_id", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /orders with a non-existent trade_account_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /orders", payload: { customer_name: "x", trade_account_id: "11111111-1111-1111-1111-111111111111" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_FK_NOT_FOUND\" (http 404)"

      - name: order_line_computed_unit_price_and_sku_from_options
        claim_type: Computed Fields
        grounds: [calculations.line_unit_price, entities.OrderLine.fields.unit_price_cents, entities.OrderLine.fields.configured_sku]
        distinguishing_aspect: "unit_price_cents = base 20000 + selected option O1 delta 3000 = 23000; configured_sku = sku_base + selected suffix = \"F-OPT-BN\"."
        test_recipe:
          setup: ["Fixture with two options; a line selects option O1 only."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-OPT", category: "CEILING_FAN", base_price_cents: 20000, base_wattage: 60, options: [ { option_id: "O1", group: "FINISH", label: "Brushed Nickel", price_delta_cents: 3000, wattage_delta: 0, sku_suffix: "-BN" }, { option_id: "O2", group: "DOWNROD", label: "24in", price_delta_cents: 1500, wattage_delta: 0, sku_suffix: "-24" } ] }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "OPT" }, as: StoreManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1, selected_option_ids: ["O1"] }, as: StoreManager, captures: { line: "$.data.id" } }
          assert:
            - "OrderLine.${line}.unit_price_cents == 23000"
            - "OrderLine.${line}.configured_sku == \"F-OPT-BN\""

      - name: order_line_invalid_option_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.OrderLine.fields.selected_option_ids", "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "A selected_option_ids value not present in the fixture's options[] returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Fixture with no matching option; line selects a bogus option id."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-BADOPT", category: "PENDANT", base_price_cents: 10000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "BO" }, as: StoreManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1, selected_option_ids: ["NOPE"] }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_REQUEST\" (http 422)"

      - name: order_line_zero_quantity_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.OrderLine.fields.quantity", "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "quantity 0 (boundary below the >=1 rule) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A fixture and a DRAFT order."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-Q0", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "Q0" }, as: StoreManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 0 }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_REQUEST\" (http 422)"

      - name: list_order_lines_filtered_by_order_id
        claim_type: Listing
        grounds: [entities.OrderLine.fields.order_id]
        distinguishing_aspect: "GET /order-lines?order_id=... returns the array (length 2) with pagination fields total_count/has_more (reverse-reachability of OrderLine.order_id)."
        test_recipe:
          setup: ["An order with two lines."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-LST", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "LST" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
          trigger:
            - { call: "GET /order-lines", payload: { order_id: "${o}" }, as: StoreManager }
          assert:
            - "response_type == array; data length == 2; meta pagination total_count == 2, has_more == false"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: confirm_draft_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Order.QUOTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a DRAFT (never quoted) order returns ERR_INVALID_STATE (409) — confirm requires QUOTED."
        test_recipe:
          setup: ["A freshly created DRAFT order (no quote)."]
          setup_api_calls:
            - { call: "POST /orders", payload: { customer_name: "DRF" }, as: StoreManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\" (http 409)"

      - name: cancel_already_cancelled_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Order.QUOTED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already CANCELLED order returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Order created and cancelled once."]
          setup_api_calls:
            - { call: "POST /orders", payload: { customer_name: "TC" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/cancel", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/cancel", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\" (http 409)"

      - name: add_line_to_quoted_order_returns_order_not_draft
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=9]", "errors[ERR_ORDER_NOT_DRAFT]"]
        distinguishing_aspect: "Adding a line to a QUOTED order returns ERR_ORDER_NOT_DRAFT (409); lines may only be added while DRAFT."
        test_recipe:
          setup: ["Order with one line, quoted."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-ND", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "ND" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_ORDER_NOT_DRAFT\" (http 409)"

      - name: special_order_complete_from_requested_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SpecialOrder.CONFIRMED_to_READY", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a SpecialOrder still in REQUESTED (never confirmed) returns ERR_INVALID_STATE (409); complete requires CONFIRMED."
        test_recipe:
          setup: ["Order confirmed; SpecialOrder created (REQUESTED) but not confirmed."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-SR", category: "PENDANT", base_price_cents: 9000, base_wattage: 40, special_order_only: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "SR" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { line: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /special-orders", payload: { order_id: "${o}", order_line_id: "${line}", supplier_lead_days: 15 }, as: StoreManager, captures: { so: "$.data.id" } }
          trigger:
            - { call: "POST /special-orders/${so}/complete", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\" (http 409)"

      - name: design_consult_approve_from_requested_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.DesignConsult.IN_REVIEW_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a DesignConsult in REQUESTED (skipping IN_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A design consult in REQUESTED."]
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "DC2", contact_email: "dc2@x.com" }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /design-consults", payload: { trade_account_id: "${acct}", room_type: "BATH" }, as: StoreManager, captures: { dc: "$.data.id" } }
          trigger:
            - { call: "POST /design-consults/${dc}/approve", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INVALID_STATE\" (http 409)"

      - name: cascade_order_cancel_chain
        claim_type: Side Effect Execution
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: "transitive_cascade / order_cancel_voids_delivery_withdraws_install_frees_installer"
          rationale: "The Order-cancel -> DeliveryJob VOIDED -> InstallReferral WITHDRAWN -> Installer count cascade is the depth-3 §1.8 instance."

  # ---------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: restock_changed_mind_within_grace_zero_fee
        claim_type: Correct Result
        grounds: [calculations.restocking_refund, entities.ReturnRequest.fields.restocking_fee_cents, entities.ReturnRequest.fields.refund_cents]
        distinguishing_aspect: "CHANGED_MIND with no delivery (days_since_delivery treated as 0 <= grace 14): restocking_fee_cents == 0 and refund_cents == full line value 10000."
        test_recipe:
          setup: ["Order (line 5000 x2 = 10000) confirmed and DEPOSIT paid; CHANGED_MIND return filed; no delivery."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-WG", category: "PENDANT", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "WG" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 2 }, as: StoreManager, captures: { l1: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /orders/${o}/payments", payload: { kind: "DEPOSIT", amount_cents: 2000 }, as: StoreManager }
            - { call: "POST /return-requests", payload: { order_id: "${o}", order_line_id: "${l1}", reason: "CHANGED_MIND" }, as: StoreManager, captures: { rr: "$.data.id" } }
          trigger:
            - { call: "POST /return-requests/${rr}/approve", payload: {}, as: StoreManager }
            - { call: "POST /return-requests/${rr}/refund", payload: {}, as: StoreManager }
          assert:
            - "ReturnRequest.${rr}.restocking_fee_cents == 0"
            - "ReturnRequest.${rr}.refund_cents == 10000"

      - name: restock_changed_mind_beyond_grace_20pct_fee
        claim_type: Correct Result
        grounds: [calculations.restocking_refund, entities.ReturnRequest.fields.restocking_fee_cents]
        distinguishing_aspect: "CHANGED_MIND 18 days after delivery (> grace 14): restocking_fee_cents == round_half_up(10000*0.20)=2000 and refund_cents == 8000."
        test_recipe:
          setup: ["Order (line 5000 x2) settled and DELIVERED at 2026-07-02; clock advanced to 2026-07-20 (18 days later); CHANGED_MIND return filed."]
          setup_api_calls:
            - { call: "POST /delivery-trucks", payload: { name: "TRG" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-BG", category: "PENDANT", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "BG" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 2 }, as: StoreManager, captures: { l1: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /orders/${o}/payments", payload: { kind: "SETTLEMENT", amount_cents: 10000 }, as: StoreManager }
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-02T08:00:00Z", window_end: "2026-07-02T10:00:00Z" }, as: StoreManager, captures: { dj: "$.data.id" } }
            - { call: "POST /delivery-jobs/${dj}/deliver", payload: {}, as: StoreManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: StoreManager }
            - { call: "POST /return-requests", payload: { order_id: "${o}", order_line_id: "${l1}", reason: "CHANGED_MIND" }, as: StoreManager, captures: { rr: "$.data.id" } }
          trigger:
            - { call: "POST /return-requests/${rr}/approve", payload: {}, as: StoreManager }
            - { call: "POST /return-requests/${rr}/refund", payload: {}, as: StoreManager }
          assert:
            - "ReturnRequest.${rr}.restocking_fee_cents == 2000"
            - "ReturnRequest.${rr}.refund_cents == 8000"

      - name: order_pricing_estimate_vs_final_divergence
        claim_type: Variant Divergence
        grounds: [calculations.order_pricing]
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_estimate_vs_final_tier_upgrade"
          rationale: "Estimate-vs-final divergence via tier upgrade is the §1.8 dual-variant instance."

  # ----------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: rebate_approve_over_budget_returns_budget_exceeded
        claim_type: Violation to Error
        grounds: ["validations[priority=35]", "errors[ERR_REBATE_BUDGET_EXCEEDED]", "state_machines.RebateClaim.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "Approving a claim (claimed 150) against a program with budget_remaining 100 returns ERR_REBATE_BUDGET_EXCEEDED (409)."
        test_recipe:
          setup: ["Program budget_total 100; order with one eligible ENERGY STAR line (claimed 150); claim SUBMITTED."]
          setup_api_calls:
            - { call: "POST /rebate-programs", payload: { name: "Tiny", rebate_rate: 0.075, wattage_ceiling: 100, budget_total_cents: 100 }, as: StoreManager, captures: { prog: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-BX", category: "RECESSED", base_price_cents: 2000, base_wattage: 50, energy_star: true }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "BX" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "POST /rebate-claims", payload: { order_id: "${o}", rebate_program_id: "${prog}" }, as: StoreManager, captures: { claim: "$.data.id" } }
          trigger:
            - { call: "POST /rebate-claims/${claim}/approve", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_REBATE_BUDGET_EXCEEDED\" (http 409)"

      - name: confirm_insufficient_credit_single_failure
        claim_type: Violation to Error
        grounds: ["validations[priority=40]", "errors[ERR_INSUFFICIENT_CREDIT]", "state_machines.Order.QUOTED_to_CONFIRMED"]
        distinguishing_aspect: "Confirming a QUOTED trade order whose estimate (300000) exceeds available_credit (100000) returns ERR_INSUFFICIENT_CREDIT (402); state passes, only fiscal fails."
        test_recipe:
          setup: ["Trade account credit_limit 100000; order subtotal 300000 quoted."]
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Short", contact_email: "s@x.com", credit_limit_cents: 100000 }, as: StoreManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-IC", category: "CHANDELIER", base_price_cents: 300000, base_wattage: 100 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "IC", trade_account_id: "${acct}" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_INSUFFICIENT_CREDIT\" (http 402)"

      - name: return_approve_unpaid_order_returns_not_returnable
        claim_type: Cross-entity validation
        grounds: ["validations[priority=38]", "errors[ERR_LINE_NOT_RETURNABLE]", "state_machines.ReturnRequest.REQUESTED_to_APPROVED"]
        distinguishing_aspect: "Approving a return when the parent Order.payment_status is UNPAID returns ERR_LINE_NOT_RETURNABLE (409)."
        test_recipe:
          setup: ["Order confirmed but UNPAID; a return request filed on its line."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-NR", category: "PENDANT", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "NR" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager, captures: { l1: "$.data.id" } }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
            - { call: "POST /return-requests", payload: { order_id: "${o}", order_line_id: "${l1}", reason: "DAMAGE" }, as: StoreManager, captures: { rr: "$.data.id" } }
          trigger:
            - { call: "POST /return-requests/${rr}/approve", payload: {}, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_LINE_NOT_RETURNABLE\" (http 409)"

      - name: delivery_job_window_end_before_start_returns_validation
        claim_type: Violation to Error
        grounds: ["errors[ERR_VALIDATION]", "entities.DeliveryJob.fields.window_end"]
        distinguishing_aspect: "POST /delivery-jobs with window_end <= window_start returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A truck and a CONFIRMED order."]
          setup_api_calls:
            - { call: "POST /delivery-trucks", payload: { name: "TW" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-WW", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "WW" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-14T12:00:00Z", window_end: "2026-07-14T10:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_VALIDATION\" (http 422)"

      - name: delivery_create_order_not_confirmed_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=28]", "errors[ERR_ORDER_NOT_CONFIRMED]"]
        distinguishing_aspect: "Creating a DeliveryJob for an order still QUOTED (not CONFIRMED/COMPLETED) returns ERR_ORDER_NOT_CONFIRMED (409)."
        test_recipe:
          setup: ["A truck and a QUOTED order."]
          setup_api_calls:
            - { call: "POST /delivery-trucks", payload: { name: "TQ" }, as: StoreManager, captures: { truck: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-DQ", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "DQ" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          trigger:
            - { call: "POST /delivery-jobs", payload: { order_id: "${o}", delivery_truck_id: "${truck}", window_start: "2026-07-15T10:00:00Z", window_end: "2026-07-15T12:00:00Z" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_ORDER_NOT_CONFIRMED\" (http 409)"

  # ------------------------------------------------------------------ endpoints
  - section: endpoints
    instances:
      - name: patch_trade_account_credit_limit_recomputes_available
        claim_type: Standard CRUD
        grounds: [entities.TradeAccount.fields.credit_limit_cents, entities.TradeAccount.fields.available_credit_cents]
        distinguishing_aspect: "PATCH /trade-accounts/{id} setting credit_limit_cents 500000 makes available_credit_cents 500000 (no committed orders)."
        test_recipe:
          setup: ["Trade account created with credit_limit 0."]
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "Patch", contact_email: "p@x.com", credit_limit_cents: 0 }, as: StoreManager, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "PATCH /trade-accounts/${acct}", payload: { credit_limit_cents: 500000 }, as: StoreManager }
          assert:
            - "TradeAccount.${acct}.credit_limit_cents == 500000"
            - "TradeAccount.${acct}.available_credit_cents == 500000"

  # -------------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: associate_create_fixture_model_returns_unauthorized
        claim_type: Cannot perform other role ops
        grounds: ["roles.ShowroomAssociate", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ShowroomAssociate calling POST /fixture-models (StoreManager-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /fixture-models", payload: { sku_base: "F-UZ", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: ShowroomAssociate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_UNAUTHORIZED\" (http 403)"

      - name: designer_acts_on_other_accounts_order_returns_forbidden
        claim_type: Peer role isolation
        grounds: ["roles.Designer", "validations[priority=42]", "errors[ERR_ACCOUNT_FORBIDDEN]"]
        distinguishing_aspect: "Designer whose X-User-ID is account B adding a line to an order owned by account A returns ERR_ACCOUNT_FORBIDDEN (403)."
        test_recipe:
          setup: ["Accounts A and B; an order owned by A."]
          setup_api_calls:
            - { call: "POST /trade-accounts", payload: { business_name: "AcctA", contact_email: "a@x.com", credit_limit_cents: 1000000 }, as: StoreManager, captures: { acctA: "$.data.id" } }
            - { call: "POST /trade-accounts", payload: { business_name: "AcctB", contact_email: "b@x.com", credit_limit_cents: 1000000 }, as: StoreManager, captures: { acctB: "$.data.id" } }
            - { call: "POST /fixture-models", payload: { sku_base: "F-OWN", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "OwnedByA", trade_account_id: "${acctA}" }, as: StoreManager, captures: { o: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: Designer, as_user_id: "${acctB}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_ACCOUNT_FORBIDDEN\" (http 403)"

      - name: unknown_role_returns_unauthenticated
        claim_type: Auth
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request whose X-User-Role is not one of the four declared roles returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB. The request omits/garbles auth headers."]
          setup_api_calls: []
          trigger:
            - { call: "GET /orders/00000000-0000-0000-0000-000000000000", payload: {}, as: ShowroomAssociate, captures: { err: "$.data.error_id" } }
          assert:
            - "With no/invalid X-User-Role or X-User-ID headers, response.data.error_id == \"ERR_UNAUTHENTICATED\" (http 401)"

  # ------------------------------------------------------ cross_cutting_layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_quote_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-supersede-stale-order]", "errors[ERR_STALE_VERSION]", "validations[priority=8]"]
        distinguishing_aspect: "After a successful quote bumps Order.version, a second quote still carrying the pre-quote expected_order_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Order with one line; version captured before first quote."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-OCC", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "OCC" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          trigger:
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == \"ERR_STALE_VERSION\" (http 412)"

      - name: occ_correct_version_quote_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-supersede-stale-order]", "entities.Order.fields.version"]
        distinguishing_aspect: "A quote with the current expected_order_version succeeds and increments Order.version by 1 (from the captured value to captured+1)."
        test_recipe:
          setup: ["Order with one line; version captured."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-OCC2", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "OCC2" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
          assert:
            - "Order.${o}.fulfillment_status == \"QUOTED\""
            - "Order.${o}.version == captured ${ov} + 1"

      - name: cascade_side_effects_multilevel
        claim_type: cascading_side_effects
        grounds: [state_machines.DeliveryJob.SCHEDULED_to_VOIDED]
        excluded_because:
          difficulty_instance: "transitive_cascade / order_cancel_voids_delivery_withdraws_install_frees_installer"
          rationale: "N-level cascade ordering verified by the depth-3 §1.8 cascade instance."

  # -------------------------------------------------------------- consistency
  - section: consistency_model
    instances:
      - name: immediate_consistency_confirm_reflects_in_read
        claim_type: immediate
        grounds: [entities.Order.fields.fulfillment_status]
        distinguishing_aspect: "After POST /orders/{id}/confirm, an immediate GET /orders/{id} shows fulfillment_status CONFIRMED in the same synchronous flow (no lag)."
        test_recipe:
          setup: ["Retail order quoted."]
          setup_api_calls:
            - { call: "POST /fixture-models", payload: { sku_base: "F-IM", category: "SCONCE", base_price_cents: 5000, base_wattage: 40 }, as: StoreManager, captures: { fx: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_name: "IM" }, as: StoreManager, captures: { o: "$.data.id" } }
            - { call: "POST /orders/${o}/lines", payload: { fixture_model_id: "${fx}", quantity: 1 }, as: StoreManager }
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager, captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o}/quote", payload: { expected_order_version: "${ov}" }, as: StoreManager }
            - { call: "POST /orders/${o}/confirm", payload: {}, as: StoreManager }
          trigger:
            - { call: "GET /orders/${o}", payload: {}, as: StoreManager }
          assert:
            - "Order.${o}.fulfillment_status == \"CONFIRMED\""
