              payload: { dealer_id: "${dealer_id}", vin: "VIN2842UNQ000001", model_code: "SDN3", trim_code: "SPORT", build_date: "2026-06-02T00:00:00.000Z", msrp_cents: 3200000, sale_date: "2026-08-06T00:00:00.000Z", customer_region_code: "ZZUNQ", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { err_vin: $.data.error_id }
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "CRN-B-UNQ", region_code: "ZZUNQ", period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-09-15T00:00:00.000Z", scheduled_pay_date: "2026-09-25T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_batch_code: $.data.error_id }
            - call: "POST /incentives/payment-batches"
