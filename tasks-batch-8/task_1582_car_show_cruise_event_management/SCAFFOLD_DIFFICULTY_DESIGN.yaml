            - { call: "POST /registrants/${p2}/vehicles", payload: { year: 1967, make: "Chevrolet", model: "Nova" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p2}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
            - { call: "POST /registrations/${r2}/payments", payload: { amount_cents: 3000, method: "CARD" }, as: RegistrationDesk }
            - { call: "POST /registrants", payload: { full_name: "N3", email: "n3@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p3: $.data.id } }
            - { call: "POST /registrants/${p3}/vehicles", payload: { year: 1966, make: "Plymouth", model: "Barracuda" }, as: Organizer, captures: { v3: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p3}", vehicle_id: "${v3}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r3: $.data.id } }
            - { call: "POST /registrations/${r3}/payments", payload: { amount_cents: 3000, method: "CARD" }, as: RegistrationDesk }
