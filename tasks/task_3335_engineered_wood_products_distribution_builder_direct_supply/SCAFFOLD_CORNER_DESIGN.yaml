  - section: validations
    instances:
      - name: missing_role_header_returns_context_header_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 400 ERR_MISSING_OR_INVALID_CONTEXT_HEADER before any role or existence check runs — even for a nonexistent resource id."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_CONTEXT_HEADER"
            - "no ERR_NOT_FOUND is surfaced (auth outranks existence)"

      - name: confirm_nonexistent_order_existence_beats_state
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST confirm on a nonexistent order id returns 404 ERR_NOT_FOUND — existence (priority 3) outranks state checks (priority 5), so no state error can mask the missing resource."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/confirm"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

