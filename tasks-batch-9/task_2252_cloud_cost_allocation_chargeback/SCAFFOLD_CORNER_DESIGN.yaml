          claim_type: Variant Selection
          grounds: "§1.3 forecast_accuracy_and_variance selects MAPE_BASIS or PERIOD_END_BASIS from the Budget's accuracy_basis field, recording the choice in accuracy_basis_applied."
          excluded_because:
            difficulty_instance: budget_forecast_accuracy_mape_vs_period_end_divergence
            rationale: "The §1.8 dual_variant_calc instance already builds one revision trail and evaluates it under both bases (80.95 versus 66.67), asserting accuracy_basis_applied each time, which is exactly the variant-selection claim."

        - name: reopen_reconciliation_of_provisional_and_final_ledger_deltas
          claim_type: Reconciliation
          grounds: "§1.3 allocation_run_totals FINAL variant carries the compensating invariant total_allocated_cents == scoped_effective_cost_cents; §1.2 AllocationRun PUBLISHED -> REOPENED -> COMPUTED_FINAL voids and re-issues invoices."
          excluded_because:
            difficulty_instance: reopen_then_recompute_preserves_allocated_equals_effective_identity
            rationale: "The §1.8 compensating_invariant instance already reopens a published run, recomputes under FINAL, and proves the identity plus the invoice/balance reconciliation holds before and after (26967 both times, balances back to 0, republished invoice gross unchanged)."

