      - name: sanctions_rule_beats_the_ownership_coverage_rule
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: sanctions_safety_beats_ownership_coverage_constraint
          rationale: "The priority-27 versus priority-30 conflict on advance-to-underwriting is exactly that §1.8 instance, including the post-fix retry."
      - name: tranche_cooling_rule_beats_the_release_amount_rule
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: tranche_cooling_temporal_beats_release_amount_fiscal
          rationale: "That §1.8 instance pits the priority-40 cooling rule against the priority-53 amount rule on the same release request and asserts the temporal error is the one returned."
