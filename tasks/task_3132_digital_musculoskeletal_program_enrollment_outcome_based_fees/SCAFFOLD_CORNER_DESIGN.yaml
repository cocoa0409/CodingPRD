# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3132_digital_musculoskeletal_program_enrollment_outcome_based_fees
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no recipe.
# Logical clock default: 2026-09-01T00:00:00Z. Week 1 begins 2026-09-07T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # section: entities
  # ===========================================================================
  - section: entities
    instances:

      - name: client_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.ClientAccount
          - endpoints.POST_/msk/clients
          - state_machines.ClientAccount.initial_state
        distinguishing_aspect: "A client created with just a legal name and a counterparty type comes back 201 with account_status ACTIVE, version 1, the contracted defaults for engagement rate and savings share, and server-stamped id and timestamps."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
          trigger:
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ClientAccount.${hw_id}.legal_name == \"Halewood Utilities\" and client_type == HEALTH_PLAN"
            - "ClientAccount.${hw_id}.account_status == ACTIVE"
            - "ClientAccount.${hw_id}.billing_model == ENGAGEMENT_MILESTONE"
            - "ClientAccount.${hw_id}.expected_monthly_engagement_rate == 0.60 and savings_share_rate == 0.30"
            - "ClientAccount.${hw_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at, and meta.api_request_id is present"

      - name: member_get_round_trips_roster_screening_fields
        claim_type: Retrieval
        grounds:
          - entities.Member
          - endpoints.GET_/msk/members/{id}
          - entities.Member.fields.red_flag_multipliers
        distinguishing_aspect: "Every roster screening field round-trips through GET unchanged, including the two-element red_flag_multipliers array and the fractional baseline scores."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client and one roster file on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0001", full_name: "Ilse Marchetti", date_of_birth: "1977-05-23T00:00:00Z", musculo_condition_code: "SHOULDER", baseline_pain_score: 6.5, baseline_function_score: 51.5, red_flag_multipliers: [1.25, 1.10] }
              as: EnrollmentOps
              captures: { m_i: $.data.id }
          assert:
            - "the response status is 201"
            - "GET /msk/members/${m_i} reports musculo_condition_code == SHOULDER and external_member_ref == \"HW-0001\""
            - "GET /msk/members/${m_i} reports baseline_pain_score == 6.5 and baseline_function_score == 51.5"
            - "GET /msk/members/${m_i} reports red_flag_multipliers == [1.25, 1.10]"
            - "GET /msk/members/${m_i} reports member_status == PENDING_ELIGIBILITY"

      - name: enrollments_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/msk/enrollments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three enrollments on file, limit=2 offset=0 returns two rows with total_count 3 and has_more true, while offset=2 returns the remaining row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with three enrolled members, each enrollment in PENDING_CLINICAL_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id, hw_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0002", full_name: "Jonas Riedel", date_of_birth: "1981-01-14T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 7.0, baseline_function_score: 48.0 }
              as: EnrollmentOps
              captures: { m_j: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0003", full_name: "Karin Vogel", date_of_birth: "1979-09-30T00:00:00Z", musculo_condition_code: "HIP", baseline_pain_score: 6.0, baseline_function_score: 55.0 }
              as: EnrollmentOps
              captures: { m_k: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0004", full_name: "Lars Petrov", date_of_birth: "1985-07-07T00:00:00Z", musculo_condition_code: "NECK", baseline_pain_score: 5.5, baseline_function_score: 60.0 }
              as: EnrollmentOps
              captures: { m_l: $.data.id }
          trigger:
            - call: "GET /msk/enrollments"
              payload: { member_id: "${m_j}", limit: 2, offset: 0 }
              as: EnrollmentOps
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /msk/enrollments?member_id=${m_j}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /msk/enrollments with no query parameters returns 3 rows with limit 10 and offset 0"
            - "GET /msk/enrollments?enrollment_status=ACTIVE returns 0 rows with total_count == 0"
            - "GET /msk/enrollments?eligibility_file_id=${f_id} returns 3 rows with total_count == 3"

      - name: member_get_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/msk/members/{id}
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the member path produces the shared 404 ERR_RESOURCE_NOT_FOUND rather than a 400 or a 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No member has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
          trigger:
            - call: "GET /msk/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: EnrollmentOps
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "the response envelope carries response_type == error and a non-empty message"

      - name: member_create_missing_condition_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Member.fields.musculo_condition_code
          - endpoints.POST_/msk/members
          - response_envelope.error
        distinguishing_aspect: "Omitting the condition code, which is declared with no default, is refused before any row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client and one roster file on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0005", full_name: "Nils Ohlsson", date_of_birth: "1980-03-03T00:00:00Z", baseline_pain_score: 5.0, baseline_function_score: 60.0 }
              as: EnrollmentOps
              captures: { req_err: $.data.error_id }
          assert:
            - "the response envelope reports response_type == \"error\" with a data.error_id, not a created Member"
            - "GET /msk/members?eligibility_file_id=${f_id} still returns 0 rows, so nothing was written"
            - "the same payload carrying musculo_condition_code KNEE_OA returns 201, proving the omission was the blocker"

      - name: program_track_defaults_min_adherence_rate_to_seventy_percent
        claim_type: Defaults
        grounds:
          - entities.ProgramTrack.fields.min_adherence_rate
          - endpoints.POST_/msk/program-tracks
        distinguishing_aspect: "Omitting the minimum adherence rate leaves the declared 0.70 default in force on the created track."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
          trigger:
            - call: "POST /msk/program-tracks"
              payload: { track_code: "CHRONIC", base_fee_per_member_cents: 12000, expected_sessions_per_week: 3, pain_reduction_target_points: 3.0, function_gain_target_points: 20.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ProgramTrack.${tr_id}.min_adherence_rate == 0.70, the declared default"
            - "ProgramTrack.${tr_id}.track_code == CHRONIC and severity_weights == { LOW: 0.2, HIGH: 0.5 }"

      - name: member_red_flag_weight_is_computed_and_client_input_is_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.red_flag_weight
          - entities.Member.fields.coach_escalated
          - calculations.spine_red_flags_weight
        distinguishing_aspect: "red_flag_weight and coach_escalated are derived on read: a client-supplied value for either is ignored and the server's own sum of the multipliers is reported instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client and one roster file on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0006", full_name: "Oda Sommer", date_of_birth: "1974-04-19T00:00:00Z", musculo_condition_code: "LOW_BACK", baseline_pain_score: 7.0, baseline_function_score: 47.0, red_flag_multipliers: [1.25, 1.25] }
              as: EnrollmentOps
              captures: { m_o: $.data.id }
          trigger:
            - call: "GET /msk/members/${m_o}"
              payload: {}
              as: EnrollmentOps
          assert:
            - "the response status is 200"
            - "Member.${m_o}.red_flag_weight == 0.50, computed from the two 1.25 multipliers"
            - "Member.${m_o}.member_status == PENDING_ELIGIBILITY and Member.${m_o}.eligibility_basis is null: neither is client-supplied"

      - name: member_system_fields_are_server_stamped_and_versioned
        claim_type: System Fields
        grounds:
          - entities.Member.common_fields
          - endpoints.POST_/msk/members
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on creation and ignore any client-supplied value; the id is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client and one roster file on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0007", full_name: "Petra Nowak", date_of_birth: "1983-08-08T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 6.0, baseline_function_score: 54.0 }
              as: EnrollmentOps
              captures: { m_p2: $.data.id, m_v: $.data.version }
          assert:
            - "Member.${m_p2}.id matches ^[0-9a-f-]{36}$ and carries no type prefix"
            - "Member.${m_p2}.version == 1"
            - "Member.${m_p2}.created_at and Member.${m_p2}.updated_at are non-null ISO 8601 UTC strings with three fractional digits"
            - "Member.${m_p2}.created_at == Member.${m_p2}.updated_at at creation"
            - "after POST /msk/eligibility-files/${f_id}/screen advances this member, GET /msk/members/${m_p2} reports version == 2 and updated_at strictly later than created_at"

      - name: enrollment_pain_score_above_ten_is_refused
        claim_type: Type Constraints
        grounds:
          - entities.OutcomeMeasurement.fields.pain_score
          - entities.OutcomeMeasurement.fields.function_score
          - validations[priority=6]
          - errors[ERR_VITALS_OUT_OF_RANGE]
        distinguishing_aspect: "A pain score of 10.5 and a function score of 120 are both outside their declared ranges and both refused with the vitals error rather than a generic invalid-request error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with one member whose enrollment is ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id, hw_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0008", full_name: "Rafael Sandoval", date_of_birth: "1976-06-16T00:00:00Z", musculo_condition_code: "HIP", baseline_pain_score: 6.0, baseline_function_score: 56.0 }
              as: EnrollmentOps
              captures: { m_r: $.data.id }
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
            - call: "POST /msk/eligibility-files/${f_id}/assign-tracks"
              payload: { expected_client_account_version: "${hw_v}" }
              as: EnrollmentOps
              captures: { f_v: $.data.version }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Dana Whitfield", discipline: "PHYSICAL_THERAPIST", license_number: "PT-88123", weekly_capacity_slots: 20 }
              as: ClinicalOps
              captures: { dana_id: $.data.id }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Leo Farrow", discipline: "PHYSICIAN", license_number: "MD-44120", weekly_capacity_slots: 12 }
              as: ClinicalOps
              captures: { leo_id: $.data.id }
            - call: "GET /msk/enrollments"
              payload: { member_id: "${m_r}" }
              as: EnrollmentOps
              captures: { e_r: "$.data[0].id"}
            - call: "POST /msk/clinical-reviews"
              payload: { enrollment_id: "${e_r}", reviewer_id: "${dana_id}", review_notes: "Hip OA, acute track" }
              as: EnrollmentOps
              captures: { cr_r: $.data.id }
            - call: "POST /msk/clinical-reviews/${cr_r}/conduct"
              payload: { review_decision: "APPROVE", reviewed_track_id: "${tr_acute}" }
              as: Clinician
              as_user_id: "${dana_id}"
            - call: "POST /msk/transition-reviews/${e_r}/approve"
              payload: { approving_clinician_id: "${leo_id}", expected_eligibility_file_version: "${f_v}" }
              as: Clinician
              as_user_id: "${leo_id}"
          trigger:
            - call: "POST /msk/outcome-measurements"
              payload: { enrollment_id: "${e_r}", measurement_week: 2, pain_score: 10.5, function_score: 120.0 }
              as: Member
              as_user_id: "${m_r}"
              captures: { vit_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_VITALS_OUT_OF_RANGE"
            - "GET /msk/outcome-measurements?enrollment_id=${e_r} still returns 0 rows, so neither out-of-range score was stored"

      - name: program_track_carries_only_identity_and_created_at
        claim_type: Immutability
        grounds:
          - entities.ProgramTrack.common_fields
          - endpoints.GET_/msk/program-tracks/{id}
        distinguishing_aspect: "ProgramTrack is declared with common_fields false, so it carries id and created_at but no version and no updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
          trigger:
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_id2: $.data.id }
          assert:
            - "GET /msk/program-tracks/${tr_id2} returns id and created_at"
            - "GET /msk/program-tracks/${tr_id2} reports no version field and no updated_at field"
            - "PUT /msk/program-tracks/${tr_id2} is not a declared endpoint, so the configuration row cannot be mutated after creation"
            - "ProgramTrack.${tr_id2}.min_adherence_rate == 0.70 and base_fee_per_member_cents == 9000 are stable across two reads"

  # ===========================================================================
  # section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: client_close_twice_returns_invalid_state_and_fires_no_cascade
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ClientAccount.terminal_states
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/msk/clients/{id}/close
        distinguishing_aspect: "A second close on an already CLOSED client is refused with the state error and fires none of the coverage-end cascade, so the members' statuses stay exactly as the first close left them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with one member still PENDING_ELIGIBILITY, already closed once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0009", full_name: "Sofia Aguirre", date_of_birth: "1984-02-28T00:00:00Z", musculo_condition_code: "NECK", baseline_pain_score: 5.0, baseline_function_score: 62.0 }
              as: EnrollmentOps
              captures: { m_s: $.data.id }
            - call: "POST /msk/clients/${hw_id}/close"
              payload: {}
              as: BillingOps
          trigger:
            - call: "POST /msk/clients/${hw_id}/close"
              payload: {}
              as: BillingOps
              captures: { close_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "GET /msk/clients/${hw_id} still reports account_status == CLOSED and an unchanged version from the first close"
            - "GET /msk/members/${m_s} reports member_status == INELIGIBLE with eligibility_basis == COVERAGE_TERM, exactly as the first close set it"

      - name: newly_created_enrollment_starts_pending_clinical_review
        claim_type: Initial State
        grounds:
          - state_machines.Enrollment.initial_state
          - state_machines.Enrollment.PENDING_SCREENING_to_PENDING_CLINICAL_REVIEW
