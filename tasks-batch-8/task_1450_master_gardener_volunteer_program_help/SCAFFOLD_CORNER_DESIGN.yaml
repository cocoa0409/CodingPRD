          assert:
            - "captured err == ERR_NO_SEATS_AVAILABLE"
            - "Application.${app2}.status == SCORED   (unchanged)"
            - "ProgramCycle.${cyc}.accepted_count == 1"

      - name: explicit_referral_specialty_mismatch_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPECIALTY_MISMATCH]", "validations[priority=12]"]
        distinguishing_aspect: "An explicit specialist whose specialty neither matches the inquiry category nor is GENERAL fails with ERR_SPECIALTY_MISMATCH when capacity is NOT the issue (cap 5, open 0)."
        test_recipe:
