        distinguishing_aspect: |
          The scarce resource is the CURB at one virtual stop, not a vehicle or a driver, so the count
          is an AGGREGATE over every non-terminal assignment sharing the origin stop and the same
          floor(epoch_minutes / 15) bucket — here spread deliberately across three different blocks so
          any per-block counter passes when it should fail. Promised pickups at 07:00 and 07:05 fill
