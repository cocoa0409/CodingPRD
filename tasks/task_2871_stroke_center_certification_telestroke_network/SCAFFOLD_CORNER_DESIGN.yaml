      - ${hm_cst2} == CLOSED with ${hm_disp2} == DRIP_AND_SHIP_TRANSFER and ${hn_cst2} == CLOSED with ${hn_disp2} == TRANSFER_ONLY
  - name: a_suspended_center_cannot_publish_its_already_accepted_report
    claim_type: cross_entity_validation
    grounds:
    - validations priority 79 -> ERR_CENTER_NOT_CERTIFIED (409)
    - state_machines.CertificationReport ACCEPTED -> PUBLISHED
    - state_machines.StrokeCenter CONDITIONAL -> SUSPENDED
    distinguishing_aspect: 'The report itself is beyond reproach — ACCEPTED with a CONDITIONAL decision — so the refusal can only come from the CENTRE''s state, read live at publication time. The report was accepted while the centre was CONDITIONAL, which is exactly the trap: a check performed at decision time instead of publication time would let the suspended facility publish.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, an ACTIVE TIER_1_FULL agreement (max 3 concurrent) and one board-certified ON_CALL Neurologist (rank 10, limit 2, licensed CA).
      - 'Three CodeStrokeCases Q1/Q2/Q3 at the SPOKE, each carried the whole way: imaging at door+10 (door_to_imaging_minutes 10), a consult requested and accepted exactly 120 seconds later with one 240 s HD video session and completed, all four inclusion items, an ELIGIBLE determination, a thrombolytic, then CLOSED.'
      - 'Their needle times differ on purpose: Q1 door_to_needle_minutes 50, Q2 55, Q3 70 — so exactly two of three meet DTN_TARGET_MIN 60 and Q3 also carries an OPEN SYSTEM_DETECTED DTN_EXCEEDED MAJOR deviation that is never substantiated.'
      - Each case carries three DRAFT abstractions (STK_DTN_60, STK_DTI_45, STK_TELESTROKE_RESPONSE) created by qa_bob while the case was still open, nine in total.
      - The consult requests are spaced more than NEUROLOGIST_COOLDOWN_MIN apart so the single neurologist is always eligible.
      - The report has been SUBMITTED at 11:40:00Z and DECIDED at 11:45:00Z by cr_dana, giving composite 82.33, decision CONDITIONAL, report status ACCEPTED and centre certification_status CONDITIONAL.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
