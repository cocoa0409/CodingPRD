              payload: { appraiser_name: "AX", start_at: "2026-05-10T10:30:00Z", end_at: "2026-05-10T11:30:00Z" }
              as: Appraiser
              captures: { err: $.data.error_id }
            - call: "POST /appraisals/${appr_id}/inspection-appointments"
