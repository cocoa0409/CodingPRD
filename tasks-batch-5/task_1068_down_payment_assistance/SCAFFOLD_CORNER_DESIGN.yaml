        grounds: ["errors[ERR_AWARD_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_allocation
          rationale: "ERR_AWARD_NOT_APPROVED is asserted as the winning error of that §1.8 priority-conflict instance."
      - name: error_insufficient_funds_on_allocation
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_FUNDS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / funding_zero_available_pool_rejected
          rationale: "ERR_INSUFFICIENT_FUNDS is asserted by that §1.8 zero-pool boundary instance."
      - name: error_segregation_of_duties_on_approve
        claim_type: violation_to_error
