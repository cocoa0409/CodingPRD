            - call: "GET /host-agency/advisor-agreements"
              payload: { split_schedule_id: "${sched_id}" }
              as: HostOperations
          assert:
            - "UNKNOWN CONSORTIUM: HTTP 404 and err_con == ERR_CONSORTIUM_NOT_FOUND; no advisor row was created for ghost.member@example.com"
            - "UNKNOWN SCHEDULE: HTTP 404 and err_sched == ERR_SPLIT_SCHEDULE_NOT_FOUND; the advisor's version is still ${adv_v0}, so the rejected write did not consume the OCC token"
            - "LINKED: linked_con == ${con_id} and AdvisorAgreement.${agr_id}.split_schedule_id == ${sched_id}"
            - "REVERSE LOOKUP A: the consortium-filtered advisor list returns exactly 1 row, ${adv_id}"
            - "REVERSE LOOKUP B: the schedule-filtered agreement list returns exactly 1 row, ${agr_id}"

      - name: corner_empty_settlement_run_may_still_be_posted
        claim_type: conditional_action
        grounds:
          - validations[priority=92]
          - endpoints["POST /host-agency/settlement-runs/{id}/calculate"]
          - endpoints["POST /host-agency/settlement-runs/{id}/post"]
        distinguishing_aspect: "The post action is conditional on the run being CALCULATED, not on it having any statements: a run whose calculate produced statement_count == 0 still posts successfully with every total 0, while posting a run that was never calculated is rejected with ERR_INVALID_RUN_STATE."
        test_recipe:
          setup:
            - "One split schedule and one ACTIVE advisor with no bookings at all, so the run has nothing to settle."
            - "Two settlement runs: 2026-06 (left OPEN) and 2026-07 (to be calculated then posted)."
          setup_api_calls:
