scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bearing_capacity_provisional_vs_final
        grounds:
          - calculations.allowable_bearing_capacity
          - entities.FoundationAnalysis.fields.bearing_capacity_provisional_psf
          - entities.FoundationAnalysis.fields.bearing_capacity_final_psf
        distinguishing_aspect: |
          Engineering-capacity domain: identical subsurface data (avg_n60=12, qu=4000 psf,
          fs=3.0) yields 4800 psf under the provisional SPT-correlation variant but 6000 psf
          under the final lab-verified variant; both values coexist on the same
          FoundationAnalysis row after VERIFIED.
        test_recipe:
          setup:
            - "Project P in FIELDWORK with boring B-1 DRILLED (avg_n60=12)"
            - "Sample S-1 LAB_RECEIVED then UNCONFINED_COMPRESSION order ACCEPTED with qu_psf=4000"
            - "FoundationAnalysis created PRELIMINARY with footing_width_ft=6, applied_bearing_psf=3000"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/samples", payload: { depth_top_ft: 10, depth_bottom_ft: 11.5, sampler_type: "SHELBY", recovery_pct: 95 }, as: FieldGeologist, captures: { sm_id: "$.data.id" } }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "IN_TRANSIT" }, as: FieldGeologist }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "LAB_RECEIVED" }, as: LabTechnician }
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "UNCONFINED_COMPRESSION", priority: "STANDARD" }, as: LabManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "AUTHORIZED" }, as: LabManager }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "IN_TEST" }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/results", payload: { qu_psf: 4000 }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "ACCEPTED" }, as: LabManager }
            - { call: "POST /geo/projects/${p_id}/foundation-analyses", payload: { method: "ALLOWABLE_STRESS", fs_required: 3.0, footing_width_ft: 6, applied_bearing_psf: 3000 }, as: SeniorEngineer, captures: { a_id: "$.data.id", a_prov: "$.data.bearing_capacity_provisional_psf" } }
          trigger:
            - { call: "POST /geo/foundation-analyses/${a_id}/transition", payload: { to: "VERIFIED" }, as: SeniorEngineer, captures: { a_final: "$.data.bearing_capacity_final_psf", a_settle: "$.data.settlement_est_in", a_deep: "$.data.deep_foundation_required" } }
          assert:
            - "captured a_prov == 4800 (provisional: min(400*12, 8000))"
            - "captured a_final == 6000 (final: min(max(9*(4000/2)/3.0, 1500), 12000))"
            - "a_prov != a_final (identical inputs, two variants, different results)"
            - "captured a_settle == 1.25 (3000*6/(1200*12))"
            - "captured a_deep == true (1.25 >= 1.0)"

      - name: claim_quantum_report_baseline_vs_site_observed
        grounds:
          - calculations.changed_condition_quantum
          - entities.ChangedConditionClaim.fields.quantum_report_baseline_cents
          - entities.ChangedConditionClaim.fields.quantum_site_observed_cents
        distinguishing_aspect: |
          Financial-claim domain (distinct from bearing-capacity engineering domain): the same
          claim (claimed 120000c, baseline 6000 psf, observed 4000 psf) yields 40000c under the
          report_baseline variant (cap 50%) but 50000c under the site_observed variant
          (1.25x multiplier, cap 75%).
        test_recipe:
          setup:
            - "Project P fully issued and in CONSTRUCTION_SUPPORT (VERIFIED analysis final bearing 6000 psf)"
            - "ObservationVisit V performed, findings DIFFERING with observed_bearing_psf=4000"
            - "Manual ChangedConditionClaim SUBMITTED with claimed_amount_cents=120000 linked to V; baseline snapshot 6000"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/samples", payload: { depth_top_ft: 10, depth_bottom_ft: 11.5, sampler_type: "SHELBY", recovery_pct: 95 }, as: FieldGeologist, captures: { sm_id: "$.data.id" } }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "IN_TRANSIT" }, as: FieldGeologist }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "LAB_RECEIVED" }, as: LabTechnician }
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "UNCONFINED_COMPRESSION", priority: "STANDARD" }, as: LabManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "AUTHORIZED" }, as: LabManager }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "IN_TEST" }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/results", payload: { qu_psf: 4000 }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "ACCEPTED" }, as: LabManager }
            - { call: "POST /geo/projects/${p_id}/foundation-analyses", payload: { method: "ALLOWABLE_STRESS", fs_required: 3.0, footing_width_ft: 6, applied_bearing_psf: 3000 }, as: SeniorEngineer, captures: { a_id: "$.data.id" } }
            - { call: "POST /geo/foundation-analyses/${a_id}/transition", payload: { to: "VERIFIED" }, as: SeniorEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "LOGGED" }, as: FieldGeologist }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLOSED" }, as: StaffEngineer }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "LAB_ANALYSIS" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "REPORT_REVIEW" }, as: SeniorEngineer }
            - { call: "POST /geo/projects/${p_id}/reports", payload: {}, as: SeniorEngineer, as_user_id: "se-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /geo/reports/${r_id}/transition", payload: { to: "TECH_REVIEW" }, as: SeniorEngineer }
            - { call: "POST /geo/reports/${r_id}/transition", payload: { to: "PE_REVIEW" }, as: ProjectManager }
            - { call: "GET /geo/reports/${r_id}", payload: {}, as: PrincipalEngineer, captures: { r_v: "$.data.version" } }
            - { call: "POST /geo/reports/${r_id}/issue", payload: { expected_report_version: "${r_v}" }, as: PrincipalEngineer, as_user_id: "pe-9" }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "ISSUED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "CONSTRUCTION_SUPPORT" }, as: ClientRep, as_user_id: "${c_id}" }
            - { call: "POST /geo/projects/${p_id}/observation-visits", payload: { visit_date: "2026-08-10T00:00:00Z" }, as: ProjectManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /geo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /geo/observation-visits/${v_id}/transition", payload: { to: "PERFORMED" }, as: StaffEngineer }
            - { call: "POST /geo/observation-visits/${v_id}/transition", payload: { to: "FINDINGS_FILED", findings: "DIFFERING", observed_bearing_psf: 4000 }, as: StaffEngineer }
            - { call: "POST /geo/projects/${p_id}/claims", payload: { claimed_amount_cents: 120000, basis_text: "Soft subgrade vs report baseline", observation_visit_id: "${v_id}" }, as: ProjectManager, captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /geo/claims/${claim_id}/transition", payload: { to: "UNDER_REVIEW" }, as: SeniorEngineer, captures: { q_rb: "$.data.quantum_report_baseline_cents", q_so: "$.data.quantum_site_observed_cents" } }
          assert:
            - "captured q_rb == 40000 (round_half_up(120000 * min((6000-4000)/6000, 0.5)))"
            - "captured q_so == 50000 (round_half_up(120000 * min((1/3)*1.25, 0.75)))"
            - "q_rb != q_so (identical claim inputs, two variants, different amounts)"

  - rule_id: combinatorial_formula
    instances:
      - name: drilling_cost_tiered_rock_surcharge_min
        grounds:
          - calculations.drilling_cost_estimate
          - entities.Boring.fields.drilling_cost_cents
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: depth-band tiers x rock multiplier x access
          surcharge x per-boring minimum x first-boring mobilization. A 40-ft boring with 10 ft
          of rock and difficult access as the plan's first drill yields 45000 + max(25000,
          207000 + 54400 + 15000) = 321400 cents.
        test_recipe:
          setup:
            - "Project in FIELDWORK, plan APPROVED (mobilization not yet charged), boring B-1 CLEARED, rig MOBILIZED"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 40, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 40, access_difficult: true }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
          trigger:
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 40, rock_depth_ft: 10, groundwater_depth_ft: 12, avg_n60: 20 }, as: DrillingSub, as_user_id: "${s_id}", captures: { b_cost: "$.data.drilling_cost_cents" } }
          assert:
            - "captured b_cost == 321400 (45000 mobilization + max(25000, 25*4200 + 15*6800 + 10*6800*0.8 + 15000))"
      - name: lab_invoice_per_line_rounding_pinned
        grounds:
          - calculations.lab_invoice_total
          - entities.Project.fields.testing_invoice_cents
          - entities.LabTestOrder.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: RUSH MOISTURE_CONTENT fee is round_half_up(4533*1.5)=6800 per
          line; two such lines total 13600 cents, whereas the forbidden sum-then-round order
          would yield round(2*6799.5)=13599. The scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Project in FIELDWORK with one DRILLED boring and one LAB_RECEIVED sample"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/clearances/${cl_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 12, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b_id}/samples", payload: { depth_top_ft: 10, depth_bottom_ft: 11.5, sampler_type: "SPT", recovery_pct: 80 }, as: FieldGeologist, captures: { sm_id: "$.data.id" } }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "IN_TRANSIT" }, as: FieldGeologist }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "LAB_RECEIVED" }, as: LabTechnician }
          trigger:
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "MOISTURE_CONTENT", priority: "RUSH" }, as: LabManager, captures: { o1_fee: "$.data.fee_cents" } }
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "MOISTURE_CONTENT", priority: "RUSH" }, as: LabManager, captures: { o2_fee: "$.data.fee_cents" } }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: LabManager, captures: { inv: "$.data.testing_invoice_cents" } }
          assert:
            - "captured o1_fee == 6800 and o2_fee == 6800 (per-line round_half_up of 6799.5)"
            - "captured inv == 13600 (per-line rounding; sum-then-round would give 13599)"
      - name: project_fee_discount_tier_on_prediscount_gross
        grounds:
          - calculations.project_total_fee
          - entities.Project.fields.total_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the 5% discount tier keys on the PRE-discount
          gross (base+testing), so gross exactly 500000 cents qualifies and the discounted total
          lands below the tier at 490000 cents; evaluation order is pinned 1..4.
        test_recipe:
          setup:
            - "Project in FIELDWORK, base_fee_cents=300000, with orders summing exactly 200000 cents (2x DIRECT_SHEAR 55000, 2x SIEVE_ANALYSIS 18500, 1x PROCTOR 21000, 1x UNCONFINED_COMPRESSION 32000, all STANDARD)"
          setup_api_calls:
