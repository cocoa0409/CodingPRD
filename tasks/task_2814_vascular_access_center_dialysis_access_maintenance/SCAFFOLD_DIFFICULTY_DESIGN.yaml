              as: CenterAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Cody Bell", clinician_role: "CODER", npi: "1000000003", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { coder_id: $.data.id }
            - call: "POST /procedure-rooms"
              payload: { room_code: "ANGIO-1", room_type: "ANGIO_SUITE", turnover_buffer_min: 30, daily_case_cap: 6, recovery_bay_count: 3 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /device-lots"
