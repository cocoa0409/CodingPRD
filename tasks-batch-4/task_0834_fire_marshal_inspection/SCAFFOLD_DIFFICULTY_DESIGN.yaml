scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_estimated_vs_final
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.estimated_fee_cents
          - entities.PermitApplication.fields.final_fee_cents
        distinguishing_aspect: "On PermitApplication, estimated_fee_cents is frozen at submit with resubmit_count=0 (20640) while final_fee_cents at issuance uses actual resubmit_count=1 (25640); same inputs, two variants, different totals."
        test_recipe:
          setup:
            - "A CONSTRUCTION application (valuation 100080) submitted, sent through one corrections cycle (resubmit_count=1), all three disciplines approved, fee 25640 paid."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "1 A St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-1", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-1"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-1"
              captures: { est_fee: $.data.estimated_fee_cents }
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "CORRECTIONS_REQUIRED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/resubmit-corrections"
              payload: {}
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 25640 }
              as: Applicant
              as_user_id: "app-1"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { perm_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.estimated_fee_cents == 20640"
            - "PermitApplication.${app_id}.final_fee_cents == 25640"
            - "PermitApplication.${app_id}.final_fee_cents != PermitApplication.${app_id}.estimated_fee_cents"

      - name: occupant_load_net_vs_gross
        grounds:
          - calculations.occupant_load
          - entities.Property.fields.occupant_load
          - entities.Property.fields.design_occupant_load
        distinguishing_aspect: "On Property (a different entity domain than the fee), posted occupant_load uses NET area (0.85) yielding 85 while design_occupant_load uses GROSS area yielding 100 for the same EDUCATIONAL, 2000 sqft building."
        test_recipe:
          setup:
            - "One EDUCATIONAL property with 2000 sqft."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "2 B St", owner_name: "O", occupancy_classification: "EDUCATIONAL", construction_type: "TYPE_III", total_floor_area_sqft: 2000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /api/properties/${prop_id}"
              payload: {}
              as: FireMarshal
              captures: { net_ol: $.data.occupant_load }
          assert:
            - "Property.${prop_id}.occupant_load == 85"
            - "Property.${prop_id}.design_occupant_load == 100"
            - "Property.${prop_id}.occupant_load != Property.${prop_id}.design_occupant_load"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: required_fire_flow_min_max_tiers
        grounds:
          - calculations.required_fire_flow_gpm
          - entities.Property.fields.required_fire_flow_gpm
        distinguishing_aspect: "Mode (a): required_fire_flow_gpm combines three inputs (area 20000, construction_type TYPE_V factor 1.5, occupancy FACTORY hazard 1.25) through nested min/max clamp then ceil-to-250, giving exactly 3500."
        test_recipe:
          setup:
            - "One FACTORY / TYPE_V property with 20000 sqft."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "3 C St", owner_name: "O", occupancy_classification: "FACTORY", construction_type: "TYPE_V", total_floor_area_sqft: 20000, stories: 2 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /api/properties/${prop_id}"
              payload: {}
              as: FireMarshal
              captures: { ff: $.data.required_fire_flow_gpm }
          assert:
            - "Property.${prop_id}.required_fire_flow_gpm == 3500"

      - name: permit_fee_rounding_order
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.final_fee_cents
        distinguishing_aspect: "Mode (b): the three fee components (500.4, 100.08, 40.032 cents) are round_half_up PER COMPONENT then summed = 20640; the wrong sum-then-round order gives 20641. Order is pinned."
        test_recipe:
          setup:
            - "A CONSTRUCTION application (valuation 100080) approved with zero corrections, fee 20640 paid, permit issued so final_fee_cents is materialised."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "4 D St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-2", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-2"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-2"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-2"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { perm_id: $.data.id }
          assert:
            - "PermitApplication.${app_id}.final_fee_cents == 20640"
            - "PermitApplication.${app_id}.final_fee_cents != 20641"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_review_parallel_axes_independent
        grounds:
          - state_machines.PlanReview.OPEN_to_OPEN
          - entities.PlanReview.fields.sprinkler_status
          - entities.PlanReview.fields.alarm_status
          - entities.PlanReview.fields.egress_status
        distinguishing_aspect: "PlanReview carries three independent parallel discipline axes; approving only SPRINKLER leaves ALARM and EGRESS at UNDER_REVIEW and overall_status OPEN (parallel dimensions, not a linear pipeline)."
        test_recipe:
          setup:
            - "A submitted application whose PlanReview has all three axes UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "5 E St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-3", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-3"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-3"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
              captures: { ov: $.data.overall_status }
          assert:
            - "PlanReview.${pr_id}.sprinkler_status == APPROVED"
            - "PlanReview.${pr_id}.alarm_status == UNDER_REVIEW"
            - "PlanReview.${pr_id}.egress_status == UNDER_REVIEW"
            - "PlanReview.${pr_id}.overall_status == OPEN"

      - name: permit_application_cyclic_corrections
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_CORRECTIONS_REQUIRED
          - state_machines.PermitApplication.CORRECTIONS_REQUIRED_to_UNDER_REVIEW
          - entities.PermitApplication.fields.resubmit_count
        distinguishing_aspect: "PermitApplication (a different entity than PlanReview) cycles UNDER_REVIEW -> CORRECTIONS_REQUIRED -> UNDER_REVIEW; the loop increments resubmit_count to 1."
        test_recipe:
          setup:
            - "A submitted application put into CORRECTIONS_REQUIRED by a SPRINKLER corrections decision."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "6 F St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-4", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-4"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-4"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "CORRECTIONS_REQUIRED" }
              as: PlanReviewer
          trigger:
            - call: "POST /api/plan-reviews/${pr_id}/resubmit-corrections"
              payload: {}
              as: Applicant
              as_user_id: "app-4"
          assert:
            - "PermitApplication.${app_id}.status == UNDER_REVIEW"
            - "PermitApplication.${app_id}.resubmit_count == 1"
            - "PlanReview.${pr_id}.sprinkler_status == UNDER_REVIEW"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: imminent_hazard_cascade_depth3
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.Violation.OPEN_to_OPEN
          - state_machines.Certificate.VALID_to_SUSPENDED
          - entities.Certificate.fields.occupancy_status
          - entities.Certificate.fields.placard_status
        distinguishing_aspect: "Depth-3 chain from an Inspection FAILED trigger: Inspection.FAILED creates an IMMINENT_HAZARD Violation, whose creation auto-issues an AbatementOrder, whose issuance suspends the Certificate (occupancy SUSPENDED, placard RED); each hop is caused by the prior."
        test_recipe:
          setup:
            - "A property with an active Certificate (VALID/GREEN) and a scheduled periodic inspection; no prior violations."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "7 G St", owner_name: "O", occupancy_classification: "ASSEMBLY", construction_type: "TYPE_V", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/certificates"
              payload: { property_id: "${prop_id}" }
              as: FireMarshal
              captures: { cert_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_5003", severity: "IMMINENT_HAZARD" } ] }
              as: Inspector
          assert:
            - "Certificate.${cert_id}.occupancy_status == SUSPENDED"
            - "Certificate.${cert_id}.placard_status == RED"
            - "Property.${prop_id}.open_violation_count == 1"
            - "GET /api/abatement-orders?violation_id=<created violation> returns exactly one AbatementOrder with status ISSUED and is_active true"

      - name: overdue_escalation_cascade_depth2
        grounds:
          - state_machines.AbatementOrder.ISSUED_to_OVERDUE
          - state_machines.Violation.OPEN_to_ESCALATED
          - state_machines.Certificate.VALID_to_SUSPENDED
          - entities.Certificate.fields.placard_status
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (the overdue sweep): AbatementOrder ISSUED->OVERDUE forces its Violation OPEN->ESCALATED, which forces the Certificate placard RED (and occupancy SUSPENDED)."
        test_recipe:
          setup:
            - "A property with a Certificate, a FAILED periodic inspection creating a MAJOR Violation, a manually issued AbatementOrder (deadline 2026-03-31), and the clock advanced past the deadline to 2026-05-01."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "8 H St", owner_name: "O", occupancy_classification: "ASSEMBLY", construction_type: "TYPE_III", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/certificates"
              payload: { property_id: "${prop_id}" }
              as: FireMarshal
              captures: { cert_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_9001", severity: "MAJOR" } ] }
              as: Inspector
            - call: "GET /api/violations?inspection_id=${insp_id}"
              payload: {}
              as: Inspector
              captures: { v_id: "$.data[0].id", v_ver: "$.data[0].version" }
            - call: "POST /api/violations/${v_id}/abatement-orders"
              payload: { expected_violation_version: "${v_ver}" }
              as: Inspector
              captures: { ao_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /api/_ops/process-overdue-orders"
              payload: {}
              as: FireMarshal
              captures: { processed: $.data.processed_count }
          assert:
            - "AbatementOrder.${ao_id}.status == OVERDUE"
            - "Violation.${v_id}.status == ESCALATED"
            - "Certificate.${cert_id}.placard_status == RED"
            - "Certificate.${cert_id}.occupancy_status == SUSPENDED"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_permit_state_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors[ERR_APPLICATION_NOT_APPROVED]
          - errors[ERR_FEE_UNPAID]
        distinguishing_aspect: "On POST /api/permits the state check (application not APPROVED, priority 9) and the business_fiscal check (fee unpaid, priority 16) both fail; the state error ERR_APPLICATION_NOT_APPROVED wins."
        test_recipe:
          setup:
            - "A submitted CONSTRUCTION application still UNDER_REVIEW (not APPROVED) with amount_paid_cents 0."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "9 I St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-5", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-5"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-5"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_APPROVED"
            - "response error_id != ERR_FEE_UNPAID"

      - name: flow_test_temporal_beats_constraint
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - errors[ERR_FLOW_TEST_WINDOW_OVERLAP]
          - errors[ERR_INVALID_FLOW_READINGS]
        distinguishing_aspect: "On POST /api/flow-tests the business_temporal window-overlap check (priority 12) and the business_constraint invalid-readings check (residual 60 >= static 50, priority 14) both fail; the temporal error ERR_FLOW_TEST_WINDOW_OVERLAP wins."
        test_recipe:
          setup:
            - "A hydrant with one valid flow test dated 2026-03-01 (window [2026-03-01, 2027-03-01))."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "10 J St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "NE corner", main_size_inches: 8 }
              as: Inspector
              captures: { hyd_id: $.data.id }
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 70, residual_psi: 50, measured_flow_gpm: 1500 }
              as: Inspector
              captures: { ft_id: $.data.id }
          trigger:
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-06-01T00:00:00Z", static_psi: 50, residual_psi: 60, measured_flow_gpm: 1000 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FLOW_TEST_WINDOW_OVERLAP"
            - "response error_id != ERR_INVALID_FLOW_READINGS"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: occupant_load_exit_threshold_50
        grounds:
          - calculations.required_exits
          - entities.Property.fields.required_exits
          - entities.Property.fields.occupant_load
        distinguishing_aspect: "The required_exits breakpoint is >= 50 inclusive on a numeric metric via POST /api/properties: EDUCATIONAL net occupant_load 49 (area 1176) -> 1 exit, 50 (area 1177) -> 2 exits."
        test_recipe:
          setup:
            - "Two EDUCATIONAL properties straddling the occupant_load=50 breakpoint."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "11 K St", owner_name: "O", occupancy_classification: "EDUCATIONAL", construction_type: "TYPE_III", total_floor_area_sqft: 1176, stories: 1 }
              as: FireMarshal
              captures: { prop_lo: $.data.id }
          trigger:
            - call: "POST /api/properties"
              payload: { address: "12 L St", owner_name: "O", occupancy_classification: "EDUCATIONAL", construction_type: "TYPE_III", total_floor_area_sqft: 1177, stories: 1 }
              as: FireMarshal
              captures: { prop_hi: $.data.id }
          assert:
            - "Property.${prop_lo}.occupant_load == 49"
            - "Property.${prop_lo}.required_exits == 1"
            - "Property.${prop_hi}.occupant_load == 50"
            - "Property.${prop_hi}.required_exits == 2"

      - name: plan_review_empty_pending_set_approval
        grounds:
          - state_machines.PlanReview.OPEN_to_APPROVED
          - entities.PlanReview.fields.overall_status
        distinguishing_aspect: "A different metric (empty-collection edge) on a different endpoint (POST /api/plan-reviews/{id}/discipline-decision): overall_status flips to APPROVED only when the count of non-APPROVED axes is exactly 0; with 1 axis still pending it stays OPEN."
        test_recipe:
          setup:
            - "A submitted application with SPRINKLER already APPROVED and ALARM/EGRESS still UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "13 M St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-6", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-6"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-6"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
          trigger:
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
              captures: { ov_after2: $.data.overall_status }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
              captures: { ov_after3: $.data.overall_status }
          assert:
            - "the ALARM-decision response (2 of 3 axes APPROVED, 1 still pending) had overall_status == OPEN"
            - "PlanReview.${pr_id}.overall_status == APPROVED"
            - "PermitApplication.${app_id}.status == APPROVED"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_requires_application_approved
        grounds:
          - state_machines.PermitApplication.APPROVED_to_ISSUED
          - validations[priority=9]
          - entities.PermitApplication.fields.status
        distinguishing_aspect: "Permit (entity A) issuance depends on PermitApplication.status (entity B) == APPROVED; with the fee already fully paid, issuing while the application is UNDER_REVIEW is still rejected ERR_APPLICATION_NOT_APPROVED. Pair Permit/PermitApplication."
        test_recipe:
          setup:
            - "A submitted CONSTRUCTION application UNDER_REVIEW with the full 20640 fee already paid (isolating the state dependency from the fiscal check)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "14 N St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-7", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-7"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-7"
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-7"
          trigger:
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_APPROVED"

      - name: certificate_reinstate_requires_no_open_violations
        grounds:
          - state_machines.Certificate.SUSPENDED_to_VALID
          - validations[priority=11]
          - entities.Violation.fields.status
        distinguishing_aspect: "Certificate (entity A) reinstate depends on Violation (entity B) states on the Property; an OPEN violation blocks reinstate with ERR_OPEN_VIOLATIONS. Pair Certificate/Violation (a different pair than Permit/PermitApplication)."
        test_recipe:
          setup:
            - "A property whose Certificate is SUSPENDED by an IMMINENT_HAZARD violation that is still OPEN."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "15 O St", owner_name: "O", occupancy_classification: "ASSEMBLY", construction_type: "TYPE_V", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/certificates"
              payload: { property_id: "${prop_id}" }
              as: FireMarshal
              captures: { cert_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_5003", severity: "IMMINENT_HAZARD" } ] }
              as: Inspector
          trigger:
            - call: "POST /api/certificates/${cert_id}/reinstate"
              payload: {}
              as: FireMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_VIOLATIONS"
            - "Certificate.${cert_id}.occupancy_status == SUSPENDED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: flow_test_window_overlap_halfopen
        grounds:
          - validations[priority=12]
          - entities.FlowTest.fields.valid_until
          - entities.FlowTest.fields.test_date
        distinguishing_aspect: "FlowTest windows on a Hydrant use half-open [test_date, test_date+365d) geometry; a second test dated inside the first window is rejected. Adjacency (a test dated exactly at the prior valid_until) would be allowed. Resource Hydrant."
        test_recipe:
          setup:
            - "A hydrant with a valid flow test dated 2026-03-01 (window ends 2027-03-01)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "16 P St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/hydrants"
              payload: { property_id: "${prop_id}", location_desc: "SW corner", main_size_inches: 8 }
              as: Inspector
              captures: { hyd_id: $.data.id }
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-03-01T00:00:00Z", static_psi: 70, residual_psi: 50, measured_flow_gpm: 1500 }
              as: Inspector
              captures: { ft_id: $.data.id }
          trigger:
            - call: "POST /api/flow-tests"
              payload: { hydrant_id: "${hyd_id}", test_date: "2026-09-01T00:00:00Z", static_psi: 70, residual_psi: 50, measured_flow_gpm: 1500 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FLOW_TEST_WINDOW_OVERLAP"

      - name: inspection_buffer_too_close
        grounds:
          - validations[priority=13]
          - entities.Inspection.fields.scheduled_date
        distinguishing_aspect: "Inspections on a Property use a symmetric 14-day buffer around a point date (reject if abs(days) < 14) - a different interval semantic and a different resource (Property) than the flow-test half-open window; scheduling 2026-03-20 within 10 days of 2026-03-10 is rejected."
        test_recipe:
          setup:
            - "A property with one SCHEDULED periodic inspection dated 2026-03-10."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "17 Q St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-10T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-20T00:00:00Z" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSPECTION_TOO_CLOSE"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_balance_conserved_on_revoke
        grounds:
          - state_machines.PermitApplication.APPROVED_to_ISSUED
          - state_machines.Permit.ISSUED_to_REVOKED
          - entities.Property.fields.fees_paid_cents
        distinguishing_aspect: "Conserved quantity is money (Property.fees_paid_cents): issuing the permit adds final_fee_cents 20640 and revoking refunds it, returning fees_paid_cents to its pre-issuance value 0; refunded_cents equals 20640."
        test_recipe:
          setup:
            - "A CONSTRUCTION application approved (zero corrections), fee 20640 paid, permit issued (fees_paid_cents 20640)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "18 R St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/permit-applications"
              payload: { property_id: "${prop_id}", applicant_user_id: "app-8", permit_type: "CONSTRUCTION", project_valuation_cents: 100080, scope_area_sqft: 5000 }
              as: Applicant
              as_user_id: "app-8"
              captures: { app_id: $.data.id }
            - call: "POST /api/permit-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "app-8"
            - call: "GET /api/plan-reviews?application_id=${app_id}"
              payload: {}
              as: PlanReviewer
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "SPRINKLER", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "ALARM", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/plan-reviews/${pr_id}/discipline-decision"
              payload: { discipline: "EGRESS", decision: "APPROVED" }
              as: PlanReviewer
            - call: "POST /api/permit-applications/${app_id}/pay-fee"
              payload: { amount_cents: 20640 }
              as: Applicant
              as_user_id: "app-8"
            - call: "POST /api/permits"
              payload: { application_id: "${app_id}" }
              as: FireMarshal
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /api/permits/${perm_id}/revoke"
              payload: {}
              as: FireMarshal
          assert:
            - "before the revoke Property.${prop_id}.fees_paid_cents == 20640"
            - "after the revoke Property.${prop_id}.fees_paid_cents == 0"
            - "PermitApplication.${app_id}.refunded_cents == 20640"

      - name: open_violation_count_conserved_on_reopen
        grounds:
          - state_machines.Violation.OPEN_to_ABATED
          - state_machines.Violation.ABATED_to_OPEN
          - entities.Property.fields.open_violation_count
        distinguishing_aspect: "Conserved quantity is an integer count (Property.open_violation_count), not money: complying the abatement order decrements it to 0 and a failed re-inspection reopen increments it back to 1, so comply+reopen leaves it at the pre-comply value 1."
        test_recipe:
          setup:
            - "A property with a FAILED periodic inspection creating one MAJOR Violation (open_violation_count 1), an issued AbatementOrder, then a comply (count 0), then a re-inspection scheduled for 2026-03-25."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { address: "19 S St", owner_name: "O", occupancy_classification: "BUSINESS", construction_type: "TYPE_II", total_floor_area_sqft: 5000, stories: 1 }
              as: FireMarshal
              captures: { prop_id: $.data.id }
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "PERIODIC", scheduled_date: "2026-03-05T00:00:00Z" }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/record-result"
              payload: { result: "FAILED", findings: [ { code_section: "IFC_9001", severity: "MAJOR" } ] }
              as: Inspector
            - call: "GET /api/violations?inspection_id=${insp_id}"
              payload: {}
              as: Inspector
              captures: { v_id: "$.data[0].id", v_ver: "$.data[0].version" }
            - call: "POST /api/violations/${v_id}/abatement-orders"
              payload: { expected_violation_version: "${v_ver}" }
              as: Inspector
              captures: { ao_id: $.data.id }
            - call: "POST /api/abatement-orders/${ao_id}/comply"
              payload: {}
              as: Inspector
            - call: "POST /api/inspections"
              payload: { property_id: "${prop_id}", inspection_type: "RE_INSPECTION", scheduled_date: "2026-03-25T00:00:00Z" }
              as: Inspector
              captures: { reinsp_id: $.data.id }
          trigger:
            - call: "POST /api/inspections/${reinsp_id}/record-result"
              payload: { result: "FAILED" }
              as: Inspector
          assert:
            - "Violation.${v_id}.status == OPEN"
            - "Property.${prop_id}.open_violation_count == 1"
