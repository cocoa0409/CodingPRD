      - name: corner_treatment_family_gates_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_NO_TREATMENT_INDICATED]", "errors[ERR_TREATMENT_RECOMMENDATION_EXPIRED]", "errors[ERR_TREATMENT_RECOMMENDATION_INVALID_STATE]", "errors[ERR_WATER_TEST_INVALID_STATE]", "errors[ERR_WATER_TEST_HOLD_TIME_EXCEEDED]"]
        distinguishing_aspect: "A clean CHEMICAL panel founds no recommendation (ERR_NO_TREATMENT_INDICATED); a recommendation whose source sample is 180 days old is EXPIRED as of read time (ERR_TREATMENT_RECOMMENDATION_EXPIRED); a second lab-result on an analysed test gives ERR_WATER_TEST_INVALID_STATE; and a confirmatory sample analysed 31 hours after collection gives ERR_WATER_TEST_HOLD_TIME_EXCEEDED."
        test_recipe:
          setup:
            - "One account, one property with household_size 4, TWO wells, one technician."
            - "Well ONE: a clean CHEMICAL panel (every analyte under its trigger). Well TWO: a CHEMICAL panel with hardness 20.0 gpg sampled 2026-06-01T00:00:00Z founding a recommendation that expires 2026-11-28T00:00:00Z, and a presumptive-positive BACTERIOLOGICAL panel."
            - "The clock is later advanced to 2026-11-28T00:00:00Z, exactly the expiry instant."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Treatment Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "tr@corner.example" }
              as: PlatformAdmin
