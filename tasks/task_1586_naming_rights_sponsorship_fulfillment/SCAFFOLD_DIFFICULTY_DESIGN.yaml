# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Naming Rights & Sponsorship Fulfillment
# 9 rules x 2 instances = 18 instances. Every setup chain replays against
# SCAFFOLD.yaml §1.5 from empty DB. All money in integer cents.
# Standard fixture: venue current_season starts 2026; contract terms below.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: escalator_compound_vs_simple_contract_fee
        grounds:
          - calculations.season_fee_cents
          - calculations.contract_total_value_cents
          - entities.SponsorshipContract.fields.escalator_mode
        distinguishing_aspect: |
          Contract-domain dual variant: identical base_fee_cents, escalator_pct and
          term, but escalator_mode COMPOUND vs SIMPLE yields different
          scheduled_total_cents (30,909,000 vs 30,900,000) and different SIGNING
          installments (12,363,600 vs 12,360,000) at countersign.
        test_recipe:
          setup:
            - "Venue V (current_season 2026); two ACTIVE sponsors S1, S2"
            - "Contract C1: base 10,000,000, escalator 0.03 COMPOUND, term 2026-2028, countersigned"
            - "Contract C2: base 10,000,000, escalator 0.03 SIMPLE, term 2026-2028, countersigned"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp1_id: $.data.id } }
            - { call: "POST /sponsors/${sp1_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /sponsors", payload: { legal_name: "SparkWater Inc", display_name: "SparkWater", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp2_id: $.data.id } }
            - { call: "POST /sponsors/${sp2_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp1_id}", title: "Naming Rights COMPOUND", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c1_id: $.data.id } }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c1_v: $.data.version } }
            - { call: "POST /contracts/${c1_id}/countersign", payload: { expected_contract_version: "${c1_v}" }, as: SponsorContact, as_user_id: "${sp1_id}" }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp2_id}", title: "Naming Rights SIMPLE", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c2_id: $.data.id } }
            - { call: "POST /contracts/${c2_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c2_v: $.data.version } }
            - { call: "POST /contracts/${c2_id}/countersign", payload: { expected_contract_version: "${c2_v}" }, as: SponsorContact, as_user_id: "${sp2_id}" }
          trigger:
            - { call: "GET /contracts/${c1_id}", as: SponsorshipSales, captures: { c1_total: $.data.scheduled_total_cents } }
            - { call: "GET /contracts/${c2_id}", as: SponsorshipSales, captures: { c2_total: $.data.scheduled_total_cents } }
            - { call: "GET /invoices", payload: { contract_id: "${c1_id}" }, as: FinanceManager, captures: { c1_inv1_amount: "$.data[0].amount_cents" } }
            - { call: "GET /invoices", payload: { contract_id: "${c2_id}" }, as: FinanceManager, captures: { c2_inv1_amount: "$.data[0].amount_cents" } }
          assert:
            - "SponsorshipContract.${c1_id}.scheduled_total_cents == 30909000"
            - "SponsorshipContract.${c2_id}.scheduled_total_cents == 30900000"
            - "c1_inv1_amount == 12363600 (COMPOUND SIGNING installment)"
            - "c2_inv1_amount == 12360000 (SIMPLE SIGNING installment)"
            - "c1_total != c2_total — identical inputs, different variant outputs"

      - name: delivered_value_provisional_vs_final_media_value
        grounds:
          - calculations.delivered_value
          - entities.ValuationReport.fields.delivered_value_provisional_cents
          - entities.ValuationReport.fields.delivered_value_final_cents
        distinguishing_aspect: |
          Deliverable-domain dual variant (distinct from Rule-1 instance 1's Contract
          fee domain): the same approved_units are valued provisionally at rate card
          (1,070,000) and finally at audited impressions x CPM (7,500,000) on one
          ValuationReport.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C ACTIVE, base 10,000,000 SIMPLE 0.03, term 2026-2026"
            - "Asset A1 LED: rate 50,000, impressions 120,000, cpm 2,500; Asset A2 digital: rate 80,000, impressions 200,000, cpm 3,000"
            - "D1 on A1 season 2026 contracted 10, approved 7; D2 on A2 season 2026 contracted 10, approved 9 (both FULFILLED? no — MISSED after season close)"
            - "Venue advanced to season 2027 so season 2026 is closed (D1, D2 -> MISSED, auto-credits created)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a1_id: $.data.id } }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "App Banner Block", asset_class: "DIGITAL", rate_card_unit_cents: 80000, avg_impressions_per_unit: 200000, cpm_cents: 3000 }, as: VenueAdmin, captures: { a2_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming Rights", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a1_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d1_id: $.data.id } }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a2_id}", season: 2026, unit_kind: "IMPRESSION_BLOCK", contracted_units: 10 }, as: ActivationManager, captures: { d2_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d1_id}", units_claimed: 7, evidence_uri: "s3://pop/d1-games.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e1_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e1_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d2_id}", units_claimed: 9, evidence_uri: "s3://pop/d2-imp.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e2_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e2_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin }
          trigger:
            - { call: "POST /valuation-reports", payload: { contract_id: "${c_id}", season: 2026 }, as: ActivationManager, captures: { rep_id: $.data.id, prov: $.data.delivered_value_provisional_cents, fin: $.data.delivered_value_final_cents, pct: $.data.fulfillment_pct } }
          assert:
            - "ValuationReport.${rep_id}.delivered_value_provisional_cents == 1070000  # 7*50000 + 9*80000"
            - "ValuationReport.${rep_id}.delivered_value_final_cents == 7500000       # round(7*120000*2500/1000) + round(9*200000*3000/1000) = 2100000 + 5400000"
            - "ValuationReport.${rep_id}.fulfillment_pct == 0.8                       # (7+9)/(10+10)"
            - "provisional != final for identical approved_units — variant divergence on the Deliverable domain"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (b) rounding, (a) tiered)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: installment_split_remainder_absorption
        grounds:
          - calculations.installment_split
          - entities.Invoice.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: scheduled_total 9,999,999 split 40/30/30 must
          round per line in seq order and force the LAST installment to absorb the
          remainder (2,999,999), because naive per-line rounding of all three lines
          would sum to 10,000,000 != total.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C base 9,999,999, escalator 0 SIMPLE, term 2026-2026, countersigned"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Odd-Total Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 9999999, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
          trigger:
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { a1: "$.data[0].amount_cents", a2: "$.data[1].amount_cents", a3: "$.data[2].amount_cents", l1: "$.data[0].installment_label", l2: "$.data[1].installment_label", l3: "$.data[2].installment_label" } }
          assert:
            - "invoice[0] (SIGNING, seq 1) amount_cents == 4000000    # round_half_up(9999999*0.40)=round_half_up(3999999.6)"
            - "invoice[1] (MID_SEASON, seq 2) amount_cents == 3000000  # round_half_up(9999999*0.30)=round_half_up(2999999.7)"
            - "invoice[2] (POST_SEASON, seq 3) amount_cents == 2999999 # remainder: 9999999-4000000-3000000"
            - "l1 == SIGNING and l2 == MID_SEASON and l3 == POST_SEASON (list order = created_at ASC = seq order)"
            - "a1 + a2 + a3 == 9999999 == contract scheduled_total_cents (remainder absorbed, no drift)"

      - name: make_good_tier_multiplier_with_season_cap
        grounds:
          - calculations.make_good_credit
          - entities.MakeGoodCredit.fields.requested_amount_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula (distinct mode from instance 1's (b)):
          tiered multiplier selected by fulfillment pct boundary (>=0.90 -> 1.00,
          >=0.70 -> 1.25, else 1.50) wrapped in min(credit, season_fee cap): approved 7/10
          yields 187,500 (1.25 tier), approved 9/10 yields 50,000 (0.90 boundary tier),
          approved 0/10 on a small contract hits the min() cap at 600,000.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; asset LED rate 50,000"
            - "Contract C1 base 10,000,000 SIMPLE 0, term 2026-2026 ACTIVE; D1 contracted 10 approved 7; D2 contracted 10 approved 9"
            - "Contract C2 base 600,000 SIMPLE 0, term 2026-2026 ACTIVE (sponsor S); D3 contracted 10, approved 0"
            - "Venue advanced to 2027 -> D1, D2, D3 all MISSED with auto-created REQUESTED credits"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Big", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c1_id: $.data.id } }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c1_v: $.data.version } }
            - { call: "POST /contracts/${c1_id}/countersign", payload: { expected_contract_version: "${c1_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c1_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d1_id: $.data.id } }
            - { call: "POST /deliverables", payload: { contract_id: "${c1_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d2_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d1_id}", units_claimed: 7, evidence_uri: "s3://pop/d1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e1_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e1_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d2_id}", units_claimed: 9, evidence_uri: "s3://pop/d2.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e2_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e2_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Small", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 600000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c2_id: $.data.id } }
            - { call: "POST /contracts/${c2_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c2_v: $.data.version } }
            - { call: "POST /contracts/${c2_id}/countersign", payload: { expected_contract_version: "${c2_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c2_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c2_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d3_id: $.data.id } }
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin }
          trigger:
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d1_id}" }, as: FinanceManager, captures: { mg1: "$.data[0].requested_amount_cents" } }
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d2_id}" }, as: FinanceManager, captures: { mg2: "$.data[0].requested_amount_cents" } }
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d3_id}" }, as: FinanceManager, captures: { mg3: "$.data[0].requested_amount_cents" } }
          assert:
            - "mg1 == 187500   # pct 0.70 -> 1.25 tier: (10-7)*50000*1.25"
            - "mg2 == 50000    # pct 0.90 exactly -> 1.00 tier (>= boundary): (10-9)*50000*1.00"
            - "mg3 == 600000   # pct 0 -> 1.50 tier gives 750000, capped by min() at season_fee 600000"
            - "All three auto-credits have credit_status == REQUESTED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_revision_cycle_and_parallel_rights_dimension
        grounds:
          - state_machines.SponsorshipContract.PROPOSED_to_DRAFT
          - state_machines.SponsorshipContract
          - entities.SponsorshipContract.fields.rights_status
        distinguishing_aspect: |
          Contract exhibits TWO non-linear shapes at once: a DRAFT<->PROPOSED
          revision cycle (contract_status) and an independent parallel dimension
          (rights_status CLEAR<->CONTESTED driven by RightsWindow cascades) that
          changes while contract_status stays ACTIVE.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C term 2026-2028 with BEVERAGE grant G [2026,2028]; C cycled DRAFT->PROPOSED->DRAFT->PROPOSED before countersign; then COUNTERSIGNED, grant ACTIVATEd, contract ACTIVE"
            - "LEAGUE RightsWindow W BEVERAGE [2027,2029] created and ACTIVATEd -> G CONFLICTED, C CONTESTED while contract_status remains ACTIVE"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "REVISE" }, as: SponsorshipSales, captures: { c_back_draft: $.data.contract_status } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c_id}", category: "BEVERAGE", first_season: 2026, last_season: 2028 }, as: SponsorshipSales, captures: { g_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /exclusivity-grants/${g_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /rights-windows", payload: { venue_id: "${v_id}", holder: "LEAGUE", category: "BEVERAGE", first_season: 2027, last_season: 2029 }, as: VenueAdmin, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "GET /contracts/${c_id}", as: SponsorshipSales, captures: { c_status: $.data.contract_status, c_rights: $.data.rights_status } }
            - { call: "GET /exclusivity-grants/${g_id}", as: VenueAdmin, captures: { g_status: $.data.grant_status } }
          assert:
            - "c_back_draft == DRAFT (revision cycle DRAFT->PROPOSED->DRAFT succeeded)"
            - "After league window ACTIVATE: g_status == CONFLICTED (overlap on 2027-2028)"
            - "c_rights == CONTESTED while c_status == ACTIVE — parallel dimension moved independently"
      - name: evidence_reject_resubmit_cycle
        grounds:
          - state_machines.EvidenceSubmission.REJECTED_to_SUBMITTED
          - state_machines.EvidenceSubmission.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          EvidenceSubmission (different entity than instance 1's Contract) cycles
          SUBMITTED->REJECTED->SUBMITTED->APPROVED; resubmission replaces
          evidence_uri and submitted_by_user_id, so the original reviewer may
          approve the resubmission only if they did not resubmit it.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; asset LED; deliverable D contracted 10 season 2026 (IN_PROGRESS)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 4, evidence_uri: "s3://pop/v1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "REJECT", review_note: "blurry photos" }, as: ActivationManager, as_user_id: "am-2" }
          trigger:
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "RESUBMIT", evidence_uri: "s3://pop/v2.pdf" }, as: ActivationManager, as_user_id: "am-2", captures: { e_state: $.data.submission_status, e_submitter: $.data.submitted_by_user_id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-1", captures: { e_final: $.data.submission_status } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_units: $.data.approved_units } }
          assert:
            - "e_state == SUBMITTED after RESUBMIT (cycle REJECTED->SUBMITTED)"
            - "e_submitter == 'am-2' — resubmission re-baselines the SoD submitter"
            - "e_final == APPROVED — original submitter am-1 may approve am-2's resubmission (SoD satisfied)"
            - "Deliverable.${d_id}.approved_units == 4"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sponsor_block_three_hop_termination
        grounds:
          - state_machines.SponsorAccount.ACTIVE_to_BLOCKED
          - state_machines.SponsorshipContract.ACTIVE_to_TERMINATED
          - state_machines.Deliverable.IN_PROGRESS_to_CANCELLED
          - state_machines.EvidenceSubmission.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chained cascade from a SINGLE sponsor BLOCK: contract -> TERMINATED
          (hop 1), which itself cancels deliverables (hop 2), which itself voids their
          SUBMITTED evidence (hop 3) — each hop caused by the previous hop's mutation,
          not by the BLOCK directly.
        test_recipe:
          setup:
            - "Venue V (2026); sponsor S ACTIVE; contract C ACTIVE term 2026-2028 with DRAFT invoices from countersign"
            - "Deliverable D season 2026 contracted 10 IN_PROGRESS with one SUBMITTED evidence E (4 units, unapproved)"
            - "One PENDING grant G on C; one manually REQUESTED make-good credit MG on C (for a second MISSED deliverable D2 is not needed — MG requested manually against D)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c_id}", category: "BEVERAGE", first_season: 2026, last_season: 2028 }, as: SponsorshipSales, captures: { g_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /exclusivity-grants/${g_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 4, evidence_uri: "s3://pop/e.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /make-good-credits", payload: { contract_id: "${c_id}", deliverable_id: "${d_id}", requested_amount_cents: 50000 }, as: ActivationManager, captures: { mg_id: $.data.id } }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { inv1_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "BLOCK" }, as: SponsorshipSales }
            - { call: "GET /contracts/${c_id}", as: SponsorshipSales, captures: { c_status: $.data.contract_status } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_status: $.data.deliverable_status } }
            - { call: "GET /evidence-submissions/${e_id}", as: ActivationManager, captures: { e_status: $.data.submission_status } }
            - { call: "GET /exclusivity-grants/${g_id}", as: VenueAdmin, captures: { g_status: $.data.grant_status } }
            - { call: "GET /make-good-credits/${mg_id}", as: FinanceManager, captures: { mg_status: $.data.credit_status } }
            - { call: "GET /invoices/${inv1_id}", as: FinanceManager, captures: { inv1_status: $.data.invoice_status } }
          assert:
            - "c_status == TERMINATED (hop 1: sponsor BLOCK -> contract TERMINATED)"
            - "d_status == CANCELLED (hop 2: contract termination -> deliverable CANCELLED)"
            - "e_status == VOIDED (hop 3: deliverable cancellation -> SUBMITTED evidence VOIDED)"
            - "g_status == RELEASED (hop 2 sibling: grant released)"
            - "mg_status == VOIDED (hop 2 sibling: REQUESTED credit voided)"
            - "inv1_status == VOID (hop 2 sibling: DRAFT invoice voided)"

      - name: advance_season_missed_deliverable_auto_credit
        grounds:
          - state_machines.Deliverable.IN_PROGRESS_to_MISSED
          - calculations.make_good_credit
          - "endpoints[POST /venues/{venue_id}/advance-season]"
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (advance-season, not sponsor
          BLOCK): epoch advance flips the under-delivered deliverable to MISSED
          (hop 1), and that flip itself auto-creates a REQUESTED MakeGoodCredit
          carrying the formula amount 187,500 (hop 2).
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2028, asset LED rate 50,000"
            - "Deliverable D season 2026 contracted 10 with approved 7 (IN_PROGRESS)"
            - "Second deliverable D-future season 2027 contracted 5 (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 7, evidence_uri: "s3://pop/e.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2027, unit_kind: "GAME_DISPLAY", contracted_units: 5 }, as: ActivationManager, captures: { df_id: $.data.id } }
          trigger:
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin, captures: { new_season: $.data.current_season } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_status: $.data.deliverable_status } }
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d_id}" }, as: FinanceManager, captures: { mg_amt: "$.data[0].requested_amount_cents", mg_status: "$.data[0].credit_status" } }
            - { call: "GET /deliverables/${df_id}", as: ActivationManager, captures: { df_status: $.data.deliverable_status } }
          assert:
            - "new_season == 2027"
            - "d_status == MISSED (hop 1: epoch advance closed season 2026 with 7 < 10)"
            - "mg_status == REQUESTED and mg_amt == 187500 (hop 2: MISSED flip auto-created the credit: pct 0.70 -> 1.25 x 3 x 50000)"
            - "df_status == IN_PROGRESS (season-2027 deliverable entered the new current season)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: credit_approve_state_beats_fiscal_cap
        grounds:
          - "validations[priority=5]"
          - "validations[priority=10]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CREDIT_EXCEEDS_CAP]"
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: approving an already-DECLINED credit with
          an over-cap amount violates priority-5 (wrong from-state) and priority-10
          (ERR_CREDIT_EXCEEDS_CAP); priority-5's ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; asset LED rate 50,000; deliverable D contracted 10, approved 7, then venue advanced to 2027 so D MISSED and auto-credit MG (REQUESTED, 187,500) exists"
            - "MG then DECLINED by FinanceManager"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 7, evidence_uri: "s3://pop/e.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin }
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d_id}" }, as: FinanceManager, captures: { mg_id: "$.data[0].id" } }
            - { call: "POST /make-good-credits/${mg_id}/transition", payload: { action: "DECLINE" }, as: FinanceManager }
          trigger:
            - { call: "POST /make-good-credits/${mg_id}/transition", payload: { action: "APPROVE", approved_amount_cents: 999999999 }, as: FinanceManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (priority 5 state beats priority 10 fiscal cap, http 409 not 422)"
            - "MakeGoodCredit.${mg_id}.credit_status == DECLINED (unchanged)"

      - name: grant_activate_safety_beats_exclusivity_constraint
        grounds:
          - "validations[priority=6]"
          - "validations[priority=8]"
          - "errors[ERR_RIGHTS_CONFLICT]"
          - "errors[ERR_CATEGORY_EXCLUSIVITY_CONFLICT]"
        distinguishing_aspect: |
          Pair business_safety-vs-business_constraint (different pair from
          instance 1): grant G2's ACTIVATE overlaps BOTH an ACTIVE LEAGUE rights
          window (p5) and another sponsor's ACTIVE exclusivity grant (p7);
          ERR_RIGHTS_CONFLICT must win.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsors S1, S2"
            - "C1 (S1, term 2026-2027) ACTIVE with grant G1 BEVERAGE [2026,2027] ACTIVE"
            - "C2 (S2, term 2026-2030) COUNTERSIGNED with grant G2 BEVERAGE [2026,2030] PENDING"
            - "LEAGUE RightsWindow W BEVERAGE [2029,2030] ACTIVE (does not overlap G1, so G1 stays ACTIVE; does overlap G2)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp1_id: $.data.id } }
            - { call: "POST /sponsors/${sp1_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /sponsors", payload: { legal_name: "SparkWater Inc", display_name: "SparkWater", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp2_id: $.data.id } }
            - { call: "POST /sponsors/${sp2_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp1_id}", title: "C1", term_first_season: 2026, term_last_season: 2027, base_fee_cents: 1000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c1_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c1_id}", category: "BEVERAGE", first_season: 2026, last_season: 2027 }, as: SponsorshipSales, captures: { g1_id: $.data.id } }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c1_v: $.data.version } }
            - { call: "POST /contracts/${c1_id}/countersign", payload: { expected_contract_version: "${c1_v}" }, as: SponsorContact, as_user_id: "${sp1_id}" }
            - { call: "POST /exclusivity-grants/${g1_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp2_id}", title: "C2", term_first_season: 2026, term_last_season: 2030, base_fee_cents: 2000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c2_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c2_id}", category: "BEVERAGE", first_season: 2026, last_season: 2030 }, as: SponsorshipSales, captures: { g2_id: $.data.id } }
            - { call: "POST /contracts/${c2_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c2_v: $.data.version } }
            - { call: "POST /contracts/${c2_id}/countersign", payload: { expected_contract_version: "${c2_v}" }, as: SponsorContact, as_user_id: "${sp2_id}" }
            - { call: "POST /rights-windows", payload: { venue_id: "${v_id}", holder: "LEAGUE", category: "BEVERAGE", first_season: 2029, last_season: 2030 }, as: VenueAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
          trigger:
            - { call: "POST /exclusivity-grants/${g2_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RIGHTS_CONFLICT (priority 6 business_safety beats priority 8 business_constraint)"
            - "ExclusivityGrant.${g2_id}.grant_status == PENDING (unchanged)"
            - "ExclusivityGrant.${g1_id}.grant_status == ACTIVE (W does not overlap G1, so no contest cascade)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: evidence_exact_units_fulfills_deliverable
        grounds:
          - state_machines.Deliverable.IN_PROGRESS_to_FULFILLED
          - "validations[priority=8]"
          - "errors[ERR_OVER_DELIVERY]"
        distinguishing_aspect: |
          Unit-count metric via the evidence transition endpoint: approval landing
          EXACTLY on contracted_units (10 == 10) flips the deliverable FULFILLED,
          while one unit beyond (11 > 10) is rejected with ERR_OVER_DELIVERY —
          the >= boundary is inclusive at equality.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; asset LED; deliverable D contracted 10, approved 6 (IN_PROGRESS); a pending submission E1 of 5 units exists (would over-deliver), and E2 of 4 units (exact)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 6, evidence_uri: "s3://pop/e0.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e0_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e0_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 5, evidence_uri: "s3://pop/e1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e1_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 4, evidence_uri: "s3://pop/e2.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e2_id: $.data.id } }
          trigger:
            - { call: "POST /evidence-submissions/${e1_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2", captures: { over_err: $.data.error_id } }
            - { call: "POST /evidence-submissions/${e2_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2", captures: { ok_state: $.data.submission_status } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_units: $.data.approved_units, d_status: $.data.deliverable_status } }
          assert:
            - "over_err == ERR_OVER_DELIVERY (6 + 5 = 11 > 10 rejected)"
            - "ok_state == APPROVED and d_units == 10 — equality on contracted_units is allowed"
            - "d_status == FULFILLED — the >= boundary fires exactly at 10 == 10"

      - name: payment_exact_balance_marks_paid
        grounds:
          - state_machines.Invoice.PARTIALLY_PAID_to_PAID
          - state_machines.Invoice.ISSUED_to_PARTIALLY_PAID
          - "validations[priority=10]"
          - "errors[ERR_PAYMENT_EXCEEDS_BALANCE]"
        distinguishing_aspect: |
          Money-cents metric via the payments endpoint (different metric and
          endpoint than instance 1): paying amount-1 leaves PARTIALLY_PAID, paying
          the final 1 cent flips PAID at exact equality, and overpaying the
          remaining balance by 1 cent is rejected ERR_PAYMENT_EXCEEDS_BALANCE.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C base 10,000,000 COMPOUND 0.03 term 2026-2028, COUNTERSIGNED then ACTIVE; SIGNING invoice I1 (12,363,600) ISSUED"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager }
          trigger:
            - { call: "POST /invoices/${i1_id}/payments", payload: { amount_cents: 12363599, method: "ACH" }, as: FinanceManager, captures: { st1: $.data.invoice_status, paid1: $.data.paid_cents_after } }
            - { call: "POST /invoices/${i1_id}/payments", payload: { amount_cents: 2, method: "ACH" }, as: FinanceManager, captures: { excess_err: $.data.error_id } }
            - { call: "POST /invoices/${i1_id}/payments", payload: { amount_cents: 1, method: "ACH" }, as: FinanceManager, captures: { st2: $.data.invoice_status, paid2: $.data.paid_cents_after } }
          assert:
            - "st1 == PARTIALLY_PAID and paid1 == 12363599 (1 cent short of 12363600)"
            - "excess_err == ERR_PAYMENT_EXCEEDS_BALANCE (remaining 1, attempted 2)"
            - "st2 == PAID and paid2 == 12363600 — equality with amount_cents flips PAID"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deliverable_create_requires_active_contract
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CONTRACT_NOT_ACTIVE]"
          - state_machines.SponsorshipContract
        distinguishing_aspect: |
          Pair Deliverable->Contract: deliverable creation is gated on the
          referenced contract being ACTIVE — rejected on a COUNTERSIGNED contract,
          accepted after ACTIVATE, and rejected again once TERMINATED.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C term 2026-2028 COUNTERSIGNED (not yet ACTIVE); asset LED AVAILABLE"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
          trigger:
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { early_err: $.data.error_id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "TERMINATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 3 }, as: ActivationManager, captures: { late_err: $.data.error_id } }
          assert:
            - "early_err == ERR_CONTRACT_NOT_ACTIVE (COUNTERSIGNED is not ACTIVE)"
            - "Deliverable ${d_id} created with deliverable_status == IN_PROGRESS after ACTIVATE (season == current_season 2026)"
            - "late_err == ERR_CONTRACT_NOT_ACTIVE after TERMINATE"

      - name: grant_activate_blocked_by_league_window
        grounds:
          - state_machines.ExclusivityGrant.PENDING_to_ACTIVE
          - "errors[ERR_RIGHTS_CONFLICT]"
          - calculations.grant_season_overlap
        distinguishing_aspect: |
          Pair ExclusivityGrant->RightsWindow (different pair than instance 1):
          grant ACTIVATE is gated on the ABSENCE of an overlapping ACTIVE LEAGUE
          window — while the league window is RESERVED the grant activates; once
          the window is ACTIVE the same grant activation is rejected.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C term 2026-2028 COUNTERSIGNED with PENDING grant G BEVERAGE [2026,2028]"
            - "LEAGUE RightsWindow W BEVERAGE [2027,2029] exists, still RESERVED"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c_id}", category: "BEVERAGE", first_season: 2026, last_season: 2028 }, as: SponsorshipSales, captures: { g_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /rights-windows", payload: { venue_id: "${v_id}", holder: "LEAGUE", category: "BEVERAGE", first_season: 2027, last_season: 2029 }, as: VenueAdmin, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /exclusivity-grants/${g_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin, captures: { g_err: $.data.error_id } }
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "RELEASE" }, as: VenueAdmin }
            - { call: "POST /exclusivity-grants/${g_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin, captures: { g_status: $.data.grant_status } }
          assert:
            - "g_err == ERR_RIGHTS_CONFLICT while the LEAGUE window is ACTIVE (overlap on 2027-2028)"
            - "g_status == ACTIVE after the window is RELEASED — the gate follows RightsWindow state"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: grant_season_overlap_shared_season_vs_adjacent
        grounds:
          - calculations.grant_season_overlap
          - "errors[ERR_CATEGORY_EXCLUSIVITY_CONFLICT]"
        distinguishing_aspect: |
          Plain inclusive integer-season semantics on the (venue, category)
          resource: a second ACTIVE grant sharing even ONE season (2028) conflicts,
          while a back-to-back grant on the SAME category starting at
          last_season+1 (2029) is allowed — adjacency is not overlap here.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsors S1, S2; C1 (S1, term 2026-2028) ACTIVE with grant G1 BEVERAGE [2026,2028] ACTIVE"
            - "C2 (S2, term 2026-2031) COUNTERSIGNED with PENDING grant G2a BEVERAGE [2028,2030] (overlaps G1 at 2028)"
            - "C3 (S2, term 2026-2031) COUNTERSIGNED with PENDING grant G3 BEVERAGE [2029,2031] (adjacent to G1: first 2029 == G1.last 2028 + 1)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp1_id: $.data.id } }
            - { call: "POST /sponsors/${sp1_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /sponsors", payload: { legal_name: "SparkWater Inc", display_name: "SparkWater", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp2_id: $.data.id } }
            - { call: "POST /sponsors/${sp2_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp1_id}", title: "C1", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 1000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c1_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c1_id}", category: "BEVERAGE", first_season: 2026, last_season: 2028 }, as: SponsorshipSales, captures: { g1_id: $.data.id } }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c1_v: $.data.version } }
            - { call: "POST /contracts/${c1_id}/countersign", payload: { expected_contract_version: "${c1_v}" }, as: SponsorContact, as_user_id: "${sp1_id}" }
            - { call: "POST /exclusivity-grants/${g1_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /contracts/${c1_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp2_id}", title: "C2", term_first_season: 2026, term_last_season: 2031, base_fee_cents: 2000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c2_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c2_id}", category: "BEVERAGE", first_season: 2028, last_season: 2030 }, as: SponsorshipSales, captures: { g2a_id: $.data.id } }
            - { call: "POST /contracts/${c2_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c2_v: $.data.version } }
            - { call: "POST /contracts/${c2_id}/countersign", payload: { expected_contract_version: "${c2_v}" }, as: SponsorContact, as_user_id: "${sp2_id}" }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp2_id}", title: "C3", term_first_season: 2026, term_last_season: 2031, base_fee_cents: 3000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c3_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c3_id}", category: "BEVERAGE", first_season: 2029, last_season: 2031 }, as: SponsorshipSales, captures: { g3_id: $.data.id } }
            - { call: "POST /contracts/${c3_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c3_v: $.data.version } }
            - { call: "POST /contracts/${c3_id}/countersign", payload: { expected_contract_version: "${c3_v}" }, as: SponsorContact, as_user_id: "${sp2_id}" }
          trigger:
            - { call: "POST /exclusivity-grants/${g2a_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin, captures: { overlap_err: $.data.error_id } }
            - { call: "POST /exclusivity-grants/${g3_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin, captures: { adj_status: $.data.grant_status } }
          assert:
            - "overlap_err == ERR_CATEGORY_EXCLUSIVITY_CONFLICT — shared season 2028 with G1"
            - "adj_status == ACTIVE — G3 BEVERAGE [2029,2031] starts at G1.last+1; back-to-back seasons are not an overlap"
            - "ExclusivityGrant.${g2a_id}.grant_status == PENDING (unchanged)"

      - name: suite_booking_turnaround_buffer_overlap
        grounds:
          - calculations.suite_date_conflict
          - "errors[ERR_SUITE_DATE_CONFLICT]"
          - entities.Deliverable.fields.checkin_date
        distinguishing_aspect: |
          Buffered closed-date semantics on the Asset resource (different geometry
          than instance 1's plain integer seasons): a SUITE_NIGHT deliverable blocks
          [checkin, checkout + 1 day]; a booking checking in on checkout+1 CONFLICTS
          (buffer day) while checkout+2 is allowed.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2028; HOSPITALITY asset 'Suite 12'"
            - "D1 SUITE_NIGHT 2026-10-10..2026-10-12 created (blocks through 2026-10-13)"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Suite 12", asset_class: "HOSPITALITY", rate_card_unit_cents: 250000, avg_impressions_per_unit: 0, cpm_cents: 0 }, as: VenueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Suite package", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 5000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${s_id}", season: 2026, unit_kind: "SUITE_NIGHT", contracted_units: 1, checkin_date: "2026-10-10", checkout_date: "2026-10-12" }, as: ActivationManager, captures: { d1_id: $.data.id } }
          trigger:
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${s_id}", season: 2026, unit_kind: "SUITE_NIGHT", contracted_units: 1, checkin_date: "2026-10-13", checkout_date: "2026-10-14" }, as: ActivationManager, captures: { buf_err: $.data.error_id } }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${s_id}", season: 2026, unit_kind: "SUITE_NIGHT", contracted_units: 1, checkin_date: "2026-10-14", checkout_date: "2026-10-16" }, as: ActivationManager, captures: { d3_id: $.data.id } }
          assert:
            - "buf_err == ERR_SUITE_DATE_CONFLICT — checkin 2026-10-13 falls inside D1's buffer day (checkout 2026-10-12 + 1)"
            - "Deliverable ${d3_id} created — checkin 2026-10-14 == checkout + 2 clears the turnaround buffer"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_then_void_restores_receivable
        grounds:
          - calculations.receivable_cents
          - state_machines.Invoice.PAID_to_PARTIALLY_PAID
          - "endpoints[POST /invoices/{invoice_id}/payments/{payment_id}/void]"
        distinguishing_aspect: |
          Conserved quantity: invoice paid_cents / contract receivable_cents
          (money). Posting a 5,000,000 payment then voiding it must return
          paid_cents to 0, invoice_status to ISSUED, and contract receivable to
          exactly its pre-payment value 12,363,600 — zero drift.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C base 10,000,000 COMPOUND 0.03 term 2026-2028 ACTIVE; SIGNING invoice I1 (12,363,600) ISSUED; receivable == 12,363,600"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { recv_before: $.data.receivable_cents } }
          trigger:
            - { call: "POST /invoices/${i1_id}/payments", payload: { amount_cents: 5000000, method: "ACH" }, as: FinanceManager, captures: { pay_id: $.data.payment_id, mid_status: $.data.invoice_status, mid_paid: $.data.paid_cents_after } }
            - { call: "POST /invoices/${i1_id}/payments/${pay_id}/void", payload: {}, as: FinanceManager, captures: { end_status: $.data.invoice_status, end_paid: $.data.paid_cents_after, end_voided: $.data.voided } }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { recv_after: $.data.receivable_cents } }
          assert:
            - "recv_before == 12363600"
            - "mid_status == PARTIALLY_PAID and mid_paid == 5000000 (forward action)"
            - "end_voided == true and end_paid == 0 and end_status == ISSUED (compensating action)"
            - "recv_after == 12363600 == recv_before — post+void leaves receivable unchanged"

      - name: credit_approve_then_redeem_restores_outstanding
        grounds:
          - calculations.make_good_outstanding_cents
          - state_machines.MakeGoodCredit.APPROVED_to_REDEEMED
          - state_machines.Deliverable.MISSED_to_COMPED
        distinguishing_aspect: |
          Conserved quantity: contract make_good_outstanding_cents (credit balance,
          a different quantity than instance 1's receivable money). APPROVE raises
          it to 187,500; REDEEM of the same credit returns it to exactly 0, flips
          the deliverable MISSED->COMPED, and applies 187,500 to the oldest payable
          invoice.
        test_recipe:
          setup:
            - "Venue V (2026); ACTIVE sponsor S; contract C base 10,000,000 SIMPLE 0 term 2026-2026 ACTIVE; SIGNING invoice I1 (4,000,000) ISSUED"
            - "Deliverable D contracted 10, approved 7; venue advanced to 2027 -> D MISSED, auto-credit MG REQUESTED 187,500"
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 7, evidence_uri: "s3://pop/e.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /venues/${v_id}/advance-season", payload: {}, as: VenueAdmin }
            - { call: "GET /make-good-credits", payload: { deliverable_id: "${d_id}" }, as: FinanceManager, captures: { mg_id: "$.data[0].id" } }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { out_before: $.data.make_good_outstanding_cents } }
          trigger:
            - { call: "POST /make-good-credits/${mg_id}/transition", payload: { action: "APPROVE", approved_amount_cents: 187500 }, as: FinanceManager, captures: { mid_out_status: $.data.credit_status } }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { out_mid: $.data.make_good_outstanding_cents } }
            - { call: "POST /make-good-credits/${mg_id}/transition", payload: { action: "REDEEM" }, as: FinanceManager, captures: { end_status: $.data.credit_status, redeemed_inv: $.data.redeemed_against_invoice_id } }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { out_after: $.data.make_good_outstanding_cents, recv_after: $.data.receivable_cents } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_status: $.data.deliverable_status } }
            - { call: "GET /invoices/${i1_id}", as: FinanceManager, captures: { i1_credits: $.data.credits_applied_cents, i1_status: $.data.invoice_status } }
          assert:
            - "out_before == 0 and out_mid == 187500 (APPROVE raises outstanding)"
            - "end_status == REDEEMED and redeemed_inv == i1_id (oldest payable invoice selected)"
            - "out_after == 0 == out_before — approve+redeem leaves outstanding unchanged"
            - "i1_credits == 187500 and i1_status == PARTIALLY_PAID; recv_after == 3812500 (4000000 - 187500)"
            - "d_status == COMPED (MISSED deliverable comped by the redemption)"
