          assert:
            - "L1: IncentiveMetric.${m2_id}.status == CERTIFIED, payout_factor_pct == 100.00, original_payout_factor_pct == 100.00"
            - "L2: PayoutAward.${ai_award_id}.certified_factor_pct == 130.00 and earned_amount_usd == 2340000.00"
