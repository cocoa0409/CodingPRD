            - "Job.${job_id}.lifecycle_status == SOLD"

      - name: occ_install_order_create_stale_job
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[install-order-create-stale-job]
          - errors[ERR_STALE_VERSION]
          - entities.Job.fields.financing_status
        distinguishing_aspect: "A genuine supersede race resolved by OCC: the client reads job_version while the Job is SOLD with financing APPLIED, then the FinancePartner approves financing (financing_status APPLIED->APPROVED bumps Job.version but the Job stays SOLD); an install-order create still carrying the pre-approval job_version returns ERR_STALE_VERSION (412). State precondition (SOLD + financing resolved) passes, so only OCC rejects it."
        test_recipe:
          setup:
            - "A SOLD Job (PRIME) with a SUBMITTED financing application; the client recorded job_version before financing was approved."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "G3", email: "g3@x.com", credit_band: "PRIME" }
              as: Estimator
              captures: { ho_id: $.data.id }
            - call: "POST /jobs"
              payload: { homeowner_id: "${ho_id}", property_address: "702 St", structure_type: "BASEMENT", footprint_sqft: 600 }
              as: Estimator
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections"
              payload: { moisture_pct: 65, structural_findings_count: 0 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /jobs/${job_id}/inspections/${insp_id}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /jobs/${job_id}/quotes"
              payload: { includes_sump: true }
              as: Estimator
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Estimator
              captures: { qv: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${qv}" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /financing-applications"
              payload: { job_id: "${job_id}", quote_id: "${quote_id}", term_months: 36 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: Scheduler
              captures: { stale_jv: $.data.version }
            - call: "POST /financing-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: FinancePartner
          trigger:
            - call: "POST /jobs/${job_id}/install-orders"
              payload: { scheduled_start: "2026-05-20T08:00:00Z", scheduled_end: "2026-05-20T17:00:00Z", expected_job_version: "${stale_jv}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Job.${job_id}.lifecycle_status == SOLD"

      - name: warranty_transfer_limit_reached
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=16]
          - errors[ERR_TRANSFER_LIMIT_REACHED]
          - entities.Warranty.fields.transfer_count
        distinguishing_aspect: "After MAX_TRANSFERS (3) completed transfers, a 4th transfer returns ERR_TRANSFER_LIMIT_REACHED (422); the cumulative-count threshold at exactly the ceiling."
        test_recipe:
          setup:
            - "A WARRANTED Job whose warranty has already been transferred 3 times (transfer_count==3)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "G4", email: "g4@x.com", credit_band: "PRIME" }
