# =============================================================================
# §1.9 Scaffold Corner Design — Structural Steel Fabricator & Erector
# Breadth coverage of every testable claim in §1.1–§1.7 not already probed by
# §1.8. Sections and claim_type values follow the claim-extraction guide.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # From Table 1 (Entities)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: job_creation_defaults_applied
        claim_type: creation_defaults
        grounds: ["entities.Job.fields.requires_aisc_hold", "entities.Job.fields.status"]
        distinguishing_aspect: "Omitting requires_aisc_hold yields false; new job starts ESTIMATING with all aggregates 0 and retainage_releasable_cents 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jobs", payload: { name: "Job D", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jd: $.data.id, st: $.data.status, hold: $.data.requires_aisc_hold } }
          assert:
            - "st == ESTIMATING (initial state)"
            - "hold == false (default applied)"
            - "Job.${jd}.total_weight_lbs == 0 and billed_to_date_cents == 0 and retainage_releasable_cents == 0"

      - name: shop_drawing_creation_revision_one
        claim_type: creation
        grounds: ["entities.ShopDrawing.fields.revision", "entities.ShopDrawing.fields.supersedes_id", "state_machines.ShopDrawing"]
        distinguishing_aspect: "A created drawing starts DRAFT with revision 1 and supersedes_id null; id is a server-minted prefix-free UUID."
        test_recipe:
          setup: ["one job exists"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job E", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { je: $.data.id } }
          trigger:
            - { call: "POST /shop-drawings", payload: { job_id: "${je}", drawing_number: "D-100" }, as: DETAILER, captures: { de: $.data.id, rev: $.data.revision, st: $.data.status, sup: $.data.supersedes_id } }
          assert:
            - "rev == 1 and st == DRAFT and sup == null"
            - "GET /shop-drawings/${de} returns the same row (retrieval)"

      - name: piece_stale_revision_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Piece.fields.stale_revision"]
        distinguishing_aspect: "stale_revision is computed; a client-supplied stale_revision=true on create is ignored and the piece is created with stale_revision=false."
        test_recipe:
          setup: ["job with one drawing (DRAFT) and one sequence (PLANNED)"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job G", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jg: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jg}", drawing_number: "D-1" }, as: DETAILER, captures: { dg: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jg}", seq_number: 1 }, as: FOREMAN, captures: { sg: $.data.id } }
          trigger:
            - { call: "POST /pieces", payload: { job_id: "${jg}", piece_mark: "G-P1", weight_lbs: 800, drawing_id: "${dg}", sequence_id: "${sg}", stale_revision: true }, as: FOREMAN, captures: { stale: $.data.stale_revision } }
          assert:
            - "stale == false (computed field, client input ignored)"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: ["entities.Job.fields.billing_basis", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_basis 'TONS' is not in {WEIGHT, COUNT} and is rejected at request-shape validation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jobs", payload: { name: "Job H", contract_value_cents: 10000000, billing_basis: "TONS" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Job.fields.contract_value_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /jobs without contract_value_cents fails with ERR_INVALID_REQUEST; no job row is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jobs", payload: { name: "Job H2", billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /jobs]"]
        distinguishing_aspect: "GET /jobs with limit=1 over two jobs returns exactly one row with total_count 2 and has_more true; offset=1 returns the second."
        test_recipe:
          setup: ["two jobs P and Q exist"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job P", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN }
            - { call: "POST /jobs", payload: { name: "Job Q", contract_value_cents: 20000000, billing_basis: "COUNT" }, as: FABRICATOR_ADMIN }
          trigger:
            - { call: "GET /jobs", payload: { limit: 1, offset: 0 }, as: DETAILER }
            - { call: "GET /jobs", payload: { limit: 1, offset: 1 }, as: DETAILER }
          assert:
            - "First page: data length == 1, total_count == 2, has_more == true"
            - "Second page: data length == 1, has_more == false"
            - "Success envelope carries meta.api_request_id and response_type == array"

      - name: piece_mark_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.Piece.fields.piece_mark", "errors[ERR_PIECE_MARK_NOT_UNIQUE]"]
        distinguishing_aspect: "Second piece reusing piece_mark within the same job is rejected; the same mark in a different job is allowed."
        test_recipe:
          setup: ["job with drawing + sequence and one existing piece mark 'P-1'"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job Q1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jq: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jq}", drawing_number: "D-1" }, as: DETAILER, captures: { dq: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jq}", seq_number: 1 }, as: FOREMAN, captures: { sq: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jq}", piece_mark: "P-1", weight_lbs: 100, drawing_id: "${dq}", sequence_id: "${sq}" }, as: FOREMAN }
          trigger:
            - { call: "POST /pieces", payload: { job_id: "${jq}", piece_mark: "P-1", weight_lbs: 200, drawing_id: "${dq}", sequence_id: "${sq}" }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PIECE_MARK_NOT_UNIQUE"

      - name: cross_job_fk_reference_rejected
        claim_type: parent_relationships
        grounds: ["entities.Piece.fields.drawing_id", "errors[ERR_CROSS_JOB_REFERENCE]", "validations[priority=8]"]
        distinguishing_aspect: "Piece create whose drawing_id belongs to a different job than job_id fails with ERR_CROSS_JOB_REFERENCE."
        test_recipe:
          setup: ["Job A with sequence; Job B with drawing"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job CA", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jca: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jca}", seq_number: 1 }, as: FOREMAN, captures: { sca: $.data.id } }
            - { call: "POST /jobs", payload: { name: "Job CB", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jcb: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jcb}", drawing_number: "D-B" }, as: DETAILER, captures: { dcb: $.data.id } }
          trigger:
            - { call: "POST /pieces", payload: { job_id: "${jca}", piece_mark: "X-1", weight_lbs: 100, drawing_id: "${dcb}", sequence_id: "${sca}" }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CROSS_JOB_REFERENCE"

  # ---------------------------------------------------------------------------
  # From Table 2 (State Machines)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: drawing_decide_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ShopDrawing", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide on a DRAFT drawing (never submitted) is rejected; the machine only allows decide from SUBMITTED."
        test_recipe:
          setup: ["job with DRAFT drawing"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j1: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${j1}", drawing_number: "D-1" }, as: DETAILER, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /shop-drawings/${d1}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ShopDrawing.${d1}.status remains DRAFT"

      - name: drawing_double_submit_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ShopDrawing.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED drawing fails; no duplicate submission is recorded."
        test_recipe:
          setup: ["drawing already SUBMITTED"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j2: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${j2}", drawing_number: "D-1" }, as: DETAILER, captures: { d2: $.data.id } }
            - { call: "POST /shop-drawings/${d2}/submit", as: DETAILER, as_user_id: "det-1" }
          trigger:
            - { call: "POST /shop-drawings/${d2}/submit", as: DETAILER, as_user_id: "det-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: billing_paid_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.ProgressBilling", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PAID billing accepts no further transitions; void on PAID returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Job SM3 with single 1000-lb piece ERECTED; billing approved then paid"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM3", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j3: $.data.id } }
            - { call: "POST /jobs/${j3}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${j3}", drawing_number: "D-1" }, as: DETAILER, captures: { d3: $.data.id } }
            - { call: "POST /shop-drawings/${d3}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${d3}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${j3}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${j3}", seq_number: 1 }, as: FOREMAN, captures: { s3: $.data.id } }
            - { call: "POST /erection-sequences/${s3}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${j3}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { m3: $.data.id } }
            - { call: "POST /mill-orders/${m3}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${j3}", piece_mark: "P1", weight_lbs: 1000, drawing_id: "${d3}", sequence_id: "${s3}" }, as: FOREMAN, captures: { p3: $.data.id } }
            - { call: "POST /pieces/${p3}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${j3}", kind: "FINAL_PIECE", piece_id: "${p3}" }, as: QC_INSPECTOR, captures: { i3: $.data.id } }
            - { call: "POST /inspections/${i3}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${j3}", load_number: "L-1", laydown_slot: "Y-SM3", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { l3: $.data.id } }
            - { call: "POST /shipping-loads/${l3}/lines", payload: { piece_id: "${p3}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${l3}/ship", as: FOREMAN }
            - { call: "POST /pieces/${p3}/erect", as: FOREMAN }
            - { call: "GET /jobs/${j3}", as: FABRICATOR_ADMIN, captures: { jv3: $.data.version } }
            - { call: "POST /progress-billings", payload: { job_id: "${j3}", period_label: "2026-08", expected_job_version: "${jv3}" }, as: FABRICATOR_ADMIN, captures: { b3: $.data.id } }
            - { call: "POST /progress-billings/${b3}/submit", as: FABRICATOR_ADMIN }
            - { call: "POST /progress-billings/${b3}/approve", as: GC_PM }
            - { call: "POST /progress-billings/${b3}/pay", as: GC_PM }
          trigger:
            - { call: "POST /progress-billings/${b3}/void", as: GC_PM, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (PAID is terminal)"
            - "ProgressBilling.${b3}.status remains PAID"

      - name: weld_ndt_before_visual_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Weld", "endpoints[POST /inspections]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Creating a WELD_NDT inspection for a weld still WELDED (visual not passed) is rejected — NDT requires VISUAL_PASSED."
        test_recipe:
          setup: ["piece IN_SHOP with one WELDED weld"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM4", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j4: $.data.id } }
            - { call: "POST /jobs/${j4}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${j4}", drawing_number: "D-1" }, as: DETAILER, captures: { d4: $.data.id } }
            - { call: "POST /shop-drawings/${d4}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${d4}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${j4}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${j4}", seq_number: 1 }, as: FOREMAN, captures: { s4: $.data.id } }
            - { call: "POST /erection-sequences/${s4}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${j4}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { m4: $.data.id } }
            - { call: "POST /mill-orders/${m4}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${j4}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${d4}", sequence_id: "${s4}" }, as: FOREMAN, captures: { p4: $.data.id } }
            - { call: "POST /pieces/${p4}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Four", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { w4: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${p4}", welder_id: "${w4}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${w4}", captures: { wl4: $.data.id } }
          trigger:
            - { call: "POST /inspections", payload: { job_id: "${j4}", kind: "WELD_NDT", weld_id: "${wl4}" }, as: QC_INSPECTOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (weld must be VISUAL_PASSED first)"

      - name: final_inspection_requires_welds_complete
        claim_type: precondition_enforcement
        grounds: ["state_machines.Piece.IN_SHOP_to_AWAITING_INSPECTION", "errors[ERR_WELDS_INCOMPLETE]"]
        distinguishing_aspect: "FINAL_PIECE inspection creation on a piece whose weld is not NDT_PASSED fails with ERR_WELDS_INCOMPLETE and the piece stays IN_SHOP."
        test_recipe:
          setup: ["piece IN_SHOP with one weld still WELDED"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM5", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j5: $.data.id } }
            - { call: "POST /jobs/${j5}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${j5}", drawing_number: "D-1" }, as: DETAILER, captures: { d5: $.data.id } }
            - { call: "POST /shop-drawings/${d5}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${d5}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${j5}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${j5}", seq_number: 1 }, as: FOREMAN, captures: { s5: $.data.id } }
            - { call: "POST /erection-sequences/${s5}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${j5}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { m5: $.data.id } }
            - { call: "POST /mill-orders/${m5}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${j5}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${d5}", sequence_id: "${s5}" }, as: FOREMAN, captures: { p5: $.data.id } }
            - { call: "POST /pieces/${p5}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Five", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { w5: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${p5}", welder_id: "${w5}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${w5}" }
          trigger:
            - { call: "POST /inspections", payload: { job_id: "${j5}", kind: "FINAL_PIECE", piece_id: "${p5}" }, as: QC_INSPECTOR, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WELDS_INCOMPLETE"
            - "Piece.${p5}.status remains IN_SHOP"

      - name: sequence_auto_erected_bubble_up
        claim_type: side_effect_execution
        grounds: ["state_machines.ErectionSequence.RELEASED_to_ERECTED", "state_machines.Piece.SHIPPED_to_ERECTED"]
        distinguishing_aspect: "Erecting the last un-erected piece of a sequence flips the sequence RELEASED -> ERECTED in the same request (bubble-up)."
        test_recipe:
          setup: ["job ERECTING (sequence released before start-erection); single piece shipped; no billings or backcharges so far"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM6", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j6: $.data.id } }
            - { call: "POST /jobs/${j6}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${j6}", drawing_number: "D-1" }, as: DETAILER, captures: { d6: $.data.id } }
            - { call: "POST /shop-drawings/${d6}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${d6}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${j6}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${j6}", seq_number: 1 }, as: FOREMAN, captures: { s6: $.data.id } }
            - { call: "POST /erection-sequences/${s6}/release", as: FOREMAN }
            - { call: "POST /jobs/${j6}/start-erection", as: FABRICATOR_ADMIN }
            - { call: "POST /mill-orders", payload: { job_id: "${j6}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { m6: $.data.id } }
            - { call: "POST /mill-orders/${m6}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${j6}", piece_mark: "P1", weight_lbs: 1000, drawing_id: "${d6}", sequence_id: "${s6}" }, as: FOREMAN, captures: { p6: $.data.id } }
            - { call: "POST /pieces/${p6}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${j6}", kind: "FINAL_PIECE", piece_id: "${p6}" }, as: QC_INSPECTOR, captures: { i6: $.data.id } }
            - { call: "POST /inspections/${i6}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${j6}", load_number: "L-1", laydown_slot: "Y-SM6", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { l6: $.data.id } }
            - { call: "POST /shipping-loads/${l6}/lines", payload: { piece_id: "${p6}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${l6}/ship", as: FOREMAN }
          trigger:
            - { call: "POST /pieces/${p6}/erect", as: FOREMAN, captures: { pst: $.data.status } }
