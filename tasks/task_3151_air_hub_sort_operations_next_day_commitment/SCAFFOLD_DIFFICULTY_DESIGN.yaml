            - "hop 3 (Hub -> LaborShift): ${hop3_posture} == SATURATED and ${hop3_variance} == 0.1842 — the shift moved off its pre-cascade GREEN"
            - "hop 4 (LaborShift -> Package/endpoint): ${hop4_triage} == THROTTLE_INDUCTION and ${hop4_posture} == SATURATED"
            - "the pre-cascade baseline is pinned by contrast: with the package still diverted the live total was 350000 and the same shift read GREEN"
            - "each hop is caused by the previous hop, not by the clear-contingency call itself"

      - name: ops_advance_three_hop_reroute_and_aircraft_reinstatement_cascade
        grounds:
          - state_machines.OpsRun.transitions.HELD_to_ADVANCED
          - state_machines.Package.transitions.DOWNGRADED_to_REROUTED
          - state_machines.Aircraft.transitions.CANCELLED_to_IN_FLIGHT
          - endpoints.POST_/airhub/ops-runs/{ops_run_id}/advance
        distinguishing_aspect: "Depth 3 from a different seed than the clear-contingency cascade: advancing a held checkpoint re-routes every DOWNGRADED package (OpsRun -> Package), and in the same chain reinstates every grounded aircraft (OpsRun -> Aircraft), whose empty arrival stamps are then a consequence of the aircraft hop itself rather than of the advance call."
