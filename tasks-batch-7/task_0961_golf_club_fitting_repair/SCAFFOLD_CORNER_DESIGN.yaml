              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Tina Tech", staff_role: "REPAIR_TECHNICIAN" }
              as: ShopAdmin
              captures: { tech_id: $.data.id }
