              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/customers"
              payload: { full_name: "CC", email: "cc@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-CC" }
              as: ProgramManager
