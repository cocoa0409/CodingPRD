# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2618 — Gift Card Fraud & Balance Protection
#
# 9 rule_ids x 2 instances = 18 instances.
# Every numeric literal in an `assert:` line was computed by executing the
# relevant §1.3 formula against the pinned setup inputs.
# The logical clock stays at its default 2026-08-01T00:00:00Z unless an
# instance explicitly moves it.
# ============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reserve_provisional_vs_final_basis_and_rate_on_liability_period
        grounds:
          - calculations.unauthorized_redemption_reserve
          - calculations.alert_exposure_snapshot
          - state_machines.LiabilityPeriod.OPEN_to_CLOSED
          - state_machines.LiabilityPeriod.CLOSED_to_RESTATED
          - concurrency_rules.period-restate-stale-period
          - entities.LiabilityPeriod.fields.provisional_reserve_cents
          - entities.LiabilityPeriod.fields.final_reserve_cents
          - entities.LiabilityPeriod.fields.reserve_basis_alert_count
        distinguishing_aspect: |
          The provisional variant sums exposure over alerts in {OPEN, TRIAGED,
          CONFIRMED} at 3500 bps while the final variant sums exposure over
          CONFIRMED alerts only at 1000 bps, so on the same three-alert
          population the same period stores 21004 and 3001 and its
          reserve_basis_alert_count is rewritten from 3 to 1 — the two numbers
          are not related by any single scale factor.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore with one CardRack whose expected_card_count is 10."
            - "Three ACTIVE PHYSICAL GiftCards with face values 10001, 20003 and 30007 cents and no redemptions, so each card's exposure snapshot equals its face value."
            - "One OPEN LiabilityPeriod spanning [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "Three DrainingAlerts, one per card: the 10001 alert left OPEN, the 20003 alert TRIAGED, the 30007 alert TRIAGED then CONFIRMED (which also freezes that card's risk_posture)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Riverbend Market", region_code: "NW", address_line: "18 Riverbend Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-A", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1001" }
              as: PosAssociate
              captures: { cardA_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10001, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardA_id}", pos_terminal_id: "T-01", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irA_id: $.data.id }
            - call: "POST /issuance-requests/${irA_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1002" }
              as: PosAssociate
              captures: { cardB_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 20003, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardB_id}", pos_terminal_id: "T-01", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irB_id: $.data.id }
            - call: "POST /issuance-requests/${irB_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1003" }
              as: PosAssociate
              captures: { cardC_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 30007, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardC_id}", pos_terminal_id: "T-01", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irC_id: $.data.id }
            - call: "POST /issuance-requests/${irC_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /liability-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              as_user_id: "acct-1"
              captures: { period_id: $.data.id }
            - call: "POST /draining-alerts"
              payload: { card_id: "${cardA_id}", detection_basis: "MANUAL_REVIEW", note: "left open on purpose" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { alertA_id: $.data.id, alertA_exposure: $.data.exposure_cents }
            - call: "POST /draining-alerts"
              payload: { card_id: "${cardB_id}", detection_basis: "MANUAL_REVIEW", note: "to be triaged only" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { alertB_id: $.data.id, alertB_exposure: $.data.exposure_cents }
            - call: "POST /draining-alerts/${alertB_id}/triage"
              payload: { triage_note: "pattern reviewed", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /draining-alerts"
              payload: { card_id: "${cardC_id}", detection_basis: "MANUAL_REVIEW", note: "to be confirmed" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { alertC_id: $.data.id, alertC_exposure: $.data.exposure_cents }
            - call: "POST /draining-alerts/${alertC_id}/triage"
              payload: { triage_note: "pattern reviewed", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-1"
            - call: "POST /draining-alerts/${alertC_id}/resolve"
              payload: { resolution: "CONFIRM", resolution_note: "confirmed fraud" }
              as: RiskManager
              as_user_id: "risk-1"
          trigger:
            - call: "POST /liability-periods/${period_id}/close"
              payload: { close_note: "provisional close" }
              as: LiabilityAccountant
              as_user_id: "acct-1"
              captures: { p_v_after_close: $.data.version, prov_reserve: $.data.provisional_reserve_cents, gross_at_close: $.data.gross_exposure_cents, count_at_close: $.data.reserve_basis_alert_count }
            - call: "POST /liability-periods/${period_id}/restate"
              payload: { restatement_note: "final basis after confirmation", expected_liability_period_version: "${p_v_after_close}" }
              as: LiabilityAccountant
              as_user_id: "acct-1"
              captures: { final_reserve: $.data.final_reserve_cents, gross_at_restate: $.data.gross_exposure_cents, count_at_restate: $.data.reserve_basis_alert_count }
          assert:
            - "DrainingAlert.${alertA_id}.exposure_cents == 10001"
            - "DrainingAlert.${alertB_id}.exposure_cents == 20003"
            - "DrainingAlert.${alertC_id}.exposure_cents == 30007"
            - "close response: LiabilityPeriod.${period_id}.state == CLOSED"
            - "close response: LiabilityPeriod.${period_id}.gross_exposure_cents == 60011"
            - "close response: LiabilityPeriod.${period_id}.reserve_basis_alert_count == 3"
            - "close response: LiabilityPeriod.${period_id}.provisional_reserve_cents == 21004"
            - "close response: LiabilityPeriod.${period_id}.final_reserve_cents == null"
            - "close response: LiabilityPeriod.${period_id}.outstanding_liability_cents == 60011"
            - "restate response: LiabilityPeriod.${period_id}.state == RESTATED"
            - "restate response: LiabilityPeriod.${period_id}.final_reserve_cents == 3001"
            - "restate response: LiabilityPeriod.${period_id}.gross_exposure_cents == 30007"
            - "restate response: LiabilityPeriod.${period_id}.reserve_basis_alert_count == 1"
            - "restate response: LiabilityPeriod.${period_id}.provisional_reserve_cents == 21004 (NOT overwritten by the restatement)"
            - "restate response: LiabilityPeriod.${period_id}.restatement_count == 1"
            - "${prov_reserve} != ${final_reserve} and 21004 - 3001 == 18003"

      - name: drain_score_inquiry_vs_redemption_variant_on_gift_card
        grounds:
          - calculations.card_drain_risk_score
          - calculations.card_balance_projection
          - calculations.inquiry_velocity_count
          - state_machines.GiftCard.WATCH_to_RESTRICTED
          - entities.GiftCard.fields.drain_risk_score_inquiry
          - entities.GiftCard.fields.drain_risk_score_redemption
          - entities.BalanceInquiry.fields.drain_score_at_inquiry
          - entities.DrainingAlert.fields.basis_drain_score
        distinguishing_aspect: |
          On one identical card the inquiry_weighted variant reads
          {velocity 3, drawdown 0.60, merchants 2} to 64 while the
          redemption_weighted variant reads {drawdown 0.60, merchants 2,
          recent redemptions 3} to 73 — different input sets, different weights,
          two live columns on the same row, and this is risk scoring on a
          GiftCard, an entirely different entity domain from the LiabilityPeriod
          reserve accounting of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Two RetailStores so redemptions can span two distinct merchants."
            - "One ACTIVE PHYSICAL GiftCard with face value 20000 cents."
            - "Three redemptions of 4000 cents each, taken at store1, store2 and store1, leaving current_balance_cents 8000, total_redeemed_cents 12000, drawdown_ratio 0.60, distinct_merchant_count 2 and recent_redemption_count 3."
            - "Three balance inquiries, so velocity_count_at_inquiry reaches 3 — below the breach threshold of 5, so no alert is auto-created."
            - "One manually raised DrainingAlert in state OPEN with detection_basis REDEMPTION_PATTERN."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Harbor Plaza", region_code: "NE", address_line: "9 Harbor Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Westgate Annex", region_code: "NE", address_line: "77 Westgate Blvd" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-H1", expected_card_count: 12 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-2001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 20000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-11", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-11", memo: "leg 1" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4000, merchant_store_id: "${store2_id}", pos_terminal_id: "T-21", memo: "leg 2" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-11", memo: "leg 3" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "IVR", requester_ip_hash: "iph-aaa" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "IVR", requester_ip_hash: "iph-aaa" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "IVR", requester_ip_hash: "iph-aaa" }
              as: PosAssociate
              captures: { inq3_velocity: $.data.velocity_count_at_inquiry, inq3_score: $.data.drain_score_at_inquiry }
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "REDEMPTION_PATTERN", note: "three legs across two merchants" }
              as: FraudAnalyst
              as_user_id: "analyst-7"
              captures: { alert_id: $.data.id }
          trigger:
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "redemption pattern reviewed", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-7"
              captures: { basis_score: $.data.basis_drain_score }
          assert:
            - "${inq3_velocity} == 3"
            - "${inq3_score} == 64"
            - "GiftCard.${card_id}.drawdown_ratio == 0.60"
            - "GiftCard.${card_id}.distinct_merchant_count == 2"
            - "GiftCard.${card_id}.recent_redemption_count == 3"
            - "GiftCard.${card_id}.current_balance_cents == 8000"
            - "GiftCard.${card_id}.total_redeemed_cents == 12000"
            - "GiftCard.${card_id}.drain_risk_score_inquiry == 64"
            - "GiftCard.${card_id}.drain_risk_score_redemption == 73"
            - "DrainingAlert.${alert_id}.basis_drain_score == 73"
            - "DrainingAlert.${alert_id}.state == TRIAGED"
            - "GiftCard.${card_id}.risk_posture == RESTRICTED"
            - "the two variants diverge on identical data: 73 - 64 == 9"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: digital_issuance_score_nonlinear_component_composition_with_bulk_surcharge
        grounds:
          - calculations.digital_issuance_risk_score
          - calculations.bulk_order_total
          - state_machines.IssuanceRequest.SUBMITTED_to_APPROVED
          - state_machines.IssuanceRequest.SUBMITTED_to_HELD_FOR_REVIEW
          - entities.IssuanceRequest.fields.screening_score
          - entities.IssuanceRequest.fields.screening_components
          - validations[priority=25]
        distinguishing_aspect: |
          MODE (a) — four raw signals pass through four DIFFERENT non-linear
          transforms (linear inversion, a 4-band step function, a categorical
          lookup, a capped floor-division staircase) before a weighted blend,
          and a post-blend conditional surcharge keyed on a DIFFERENT entity's
          state flips the identical signal set from 39/APPROVED to
          54/HELD_FOR_REVIEW; no linear model over the raw inputs reproduces
          both numbers.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore."
            - "One BulkPurchaseOrder of 10 cards at 12500 cents each, left in state PENDING_IDENTITY because its total of 127813 cents is at or above the 50000-cent identity threshold."
            - "Two DIGITAL IssuanceRequests with IDENTICAL risk signals — device_reputation_score 42, email_age_days 45, payment_risk_band MEDIUM, face_value_cents 12500 — one attached to the unverified bulk order and one standalone."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Cedar Point Store", region_code: "SE", address_line: "300 Cedar Point Dr" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 10, face_value_cents_each: 12500, purchaser_name: "Acme Rewards LLC", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { bulk_id: $.data.id, bulk_total: $.data.total_cents, bulk_state: $.data.state }
            - call: "POST /issuance-requests"
              payload: { channel: "DIGITAL", face_value_cents: 12500, device_reputation_score: 42, email_age_days: 45, payment_risk_band: "MEDIUM", recipient_email_hash: "eh-standalone" }
              as: PosAssociate
              captures: { ir_solo_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "DIGITAL", face_value_cents: 12500, bulk_order_id: "${bulk_id}", device_reputation_score: 42, email_age_days: 45, payment_risk_band: "MEDIUM", recipient_email_hash: "eh-bulk" }
              as: PosAssociate
              captures: { ir_bulk_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests/${ir_solo_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { solo_score: $.data.screening_score, solo_state: $.data.state, solo_card_id: $.data.card_id }
            - call: "POST /issuance-requests/${ir_bulk_id}/screen"
              payload: {}
              as: PosAssociate
              captures: { bulk_score: $.data.screening_score, bulk_ir_state: $.data.state }
          assert:
            - "BulkPurchaseOrder.${bulk_id}.face_value_subtotal_cents == 125000"
            - "BulkPurchaseOrder.${bulk_id}.fee_rate_bps == 225"
            - "BulkPurchaseOrder.${bulk_id}.activation_fee_cents == 2813"
            - "BulkPurchaseOrder.${bulk_id}.total_cents == 127813"
            - "BulkPurchaseOrder.${bulk_id}.state == PENDING_IDENTITY"
            - "IssuanceRequest.${ir_solo_id}.screening_components.device == 58"
            - "IssuanceRequest.${ir_solo_id}.screening_components.email == 45"
            - "IssuanceRequest.${ir_solo_id}.screening_components.payment == 25"
            - "IssuanceRequest.${ir_solo_id}.screening_components.amount == 10"
            - "IssuanceRequest.${ir_solo_id}.screening_components.base == 39"
            - "IssuanceRequest.${ir_solo_id}.screening_components.bulk_surcharge == 0"
            - "IssuanceRequest.${ir_solo_id}.screening_score == 39"
            - "IssuanceRequest.${ir_solo_id}.state == APPROVED"
            - "IssuanceRequest.${ir_solo_id}.decline_reason == null"
            - "GiftCard.${solo_card_id}.channel == DIGITAL"
            - "GiftCard.${solo_card_id}.activation_state == ACTIVE"
            - "GiftCard.${solo_card_id}.current_balance_cents == 12500"
            - "GiftCard.${solo_card_id}.store_id == null"
            - "IssuanceRequest.${ir_bulk_id}.screening_components.base == 39"
            - "IssuanceRequest.${ir_bulk_id}.screening_components.bulk_surcharge == 15"
            - "IssuanceRequest.${ir_bulk_id}.screening_score == 54"
            - "IssuanceRequest.${ir_bulk_id}.state == HELD_FOR_REVIEW"
            - "IssuanceRequest.${ir_bulk_id}.card_id == null"
            - "identical signals, different outcome: ${solo_score} == 39 and ${bulk_score} == 54"

      - name: bulk_order_fee_tier_pinned_to_pre_fee_subtotal
        grounds:
          - calculations.bulk_order_total
          - entities.BulkPurchaseOrder.fields.face_value_subtotal_cents
          - entities.BulkPurchaseOrder.fields.fee_rate_bps
          - entities.BulkPurchaseOrder.fields.activation_fee_cents
          - entities.BulkPurchaseOrder.fields.total_cents
          - state_machines.BulkPurchaseOrder.PENDING_IDENTITY_to_IDENTITY_VERIFIED
        distinguishing_aspect: |
          MODE (c) — total depends on fee and the fee tier is keyed on a
          subtotal band, so the evaluation order must be pinned: 4 cards at
          24975 cents subtotal to 99900, one cent under the 100000 boundary, and
          the pinned pre-fee tier of 150 bps yields fee 1499 and total 101399,
          whereas re-selecting the tier from the resulting total would read the
          225 bps band and produce fee 2248 and total 102148.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore and no other data — the whole point is that the arithmetic is decided at creation time from the two quantity inputs alone."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Northline Depot", region_code: "MW", address_line: "44 Northline Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
          trigger:
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 4, face_value_cents_each: 24975, purchaser_name: "Nadia Okonjo", payment_method: "CREDIT" }
              as: PosAssociate
              captures: { bulk_id: $.data.id, subtotal: $.data.face_value_subtotal_cents, bps: $.data.fee_rate_bps, fee: $.data.activation_fee_cents, total: $.data.total_cents }
          assert:
            - "BulkPurchaseOrder.${bulk_id}.face_value_subtotal_cents == 99900"
            - "BulkPurchaseOrder.${bulk_id}.fee_rate_bps == 150"
            - "BulkPurchaseOrder.${bulk_id}.activation_fee_cents == 1499"
            - "BulkPurchaseOrder.${bulk_id}.total_cents == 101399"
            - "BulkPurchaseOrder.${bulk_id}.state == PENDING_IDENTITY"
            - "BulkPurchaseOrder.${bulk_id}.identity_id_number_hash == null"
            - "BulkPurchaseOrder.${bulk_id}.info_request_count == 0"
            - "the tier came from the PRE-FEE subtotal: ${bps} == 150, not the 225 a tier-on-total reading of 101399 would select"
            - "the fee was rounded ONCE on the whole order: ${fee} == 1499, not 4 * round_half_up(24975 * 0.015) == 4 * 375 == 1500"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: gift_card_parallel_activation_and_posture_dimensions_diverge
        grounds:
          - state_machines.GiftCard.activation_state
          - state_machines.GiftCard.risk_posture
          - state_machines.GiftCard.ACTIVE_to_DEPLETED
          - state_machines.GiftCard.DEPLETED_to_ACTIVE
          - calculations.card_balance_projection
          - validations[priority=46]
          - entities.GiftCard.fields.activation_state
          - entities.GiftCard.fields.risk_posture
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on one GiftCard row: a reversal moves
          activation_state DEPLETED -> ACTIVE while risk_posture stays FROZEN,
          proving the two dimensions advance on disjoint triggers — and the
          reversal endpoint is deliberately exempt from the FROZEN gate that
          blocks every other value movement.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents."
            - "One redemption of the full 5000 cents, which drives activation_state to DEPLETED with current_balance_cents 0."
            - "A RiskManager posture override forcing risk_posture to FROZEN while the card is DEPLETED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Lakeside Mart", region_code: "NW", address_line: "5 Lakeside Loop" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-L1", expected_card_count: 8 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-3001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-31", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 5000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-31", memo: "drained in one shot" }
              as: PosAssociate
              captures: { redemption_event_id: $.data.id }
            - call: "POST /gift-cards/${card_id}/posture"
              payload: { risk_posture: "FROZEN", reason: "suspected drain" }
              as: RiskManager
              as_user_id: "risk-3"
              captures: { posture_after_freeze: $.data.risk_posture, activation_after_freeze: $.data.activation_state }
          trigger:
            - call: "POST /ledger-events/${redemption_event_id}/reverse"
              payload: { reversal_reason: "unauthorized redemption, victim made whole" }
              as: RiskManager
              as_user_id: "risk-3"
              captures: { reversal_event_id: $.data.id, reversal_signed: $.data.signed_amount_cents }
          assert:
            - "${activation_after_freeze} == DEPLETED and ${posture_after_freeze} == FROZEN — the freeze did not touch the funding dimension"
            - "LedgerEvent.${reversal_event_id}.type == REDEMPTION_REVERSAL"
            - "LedgerEvent.${reversal_event_id}.reverses_event_id == ${redemption_event_id}"
            - "LedgerEvent.${reversal_event_id}.amount_cents == 5000"
            - "LedgerEvent.${reversal_event_id}.signed_amount_cents == 5000"
            - "GiftCard.${card_id}.activation_state == ACTIVE"
            - "GiftCard.${card_id}.risk_posture == FROZEN"
            - "GiftCard.${card_id}.current_balance_cents == 5000"
            - "GiftCard.${card_id}.total_redeemed_cents == 0"
            - "GiftCard.${card_id}.total_loaded_cents == 10000"
            - "GiftCard.${card_id}.drawdown_ratio == 0.00"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 3"
            - "the reversal succeeded despite risk_posture FROZEN — p46 ERR_CARD_FROZEN does not apply to POST /ledger-events/{id}/reverse"

      - name: victim_claim_evidence_cycle_returns_to_submitted_twice
        grounds:
          - state_machines.VictimClaim.SUBMITTED_to_EVIDENCE_REQUESTED
          - state_machines.VictimClaim.EVIDENCE_REQUESTED_to_SUBMITTED
          - validations[priority=69]
          - entities.VictimClaim.fields.evidence_round
          - entities.VictimClaim.fields.purchase_receipt_ref
          - entities.VictimClaim.fields.packaging_photo_ref
        distinguishing_aspect: |
          CYCLE on VictimClaim — a different entity from the parallel-dimension
          GiftCard of the sibling instance: SUBMITTED -> EVIDENCE_REQUESTED ->
          SUBMITTED traversed twice returns the row to its original state while
          the monotone evidence_round counter reaches 2, so the loop is bounded
          rather than free.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 9000 cents."
            - "One VictimClaim in state SUBMITTED with evidence_round 0 and both evidence refs null, taken in by user pos-9."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Old Town Grocers", region_code: "SW", address_line: "21 Old Town Sq" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-O1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-4001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 9000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-41", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Priya Raman", claimant_contact: "priya@example.com", disputed_amount_cents: 3000, purchased_at: "2026-08-01T00:00:00Z" }
              as: PosAssociate
              as_user_id: "pos-9"
              captures: { claim_id: $.data.id, claim_v0: $.data.version, round0: $.data.evidence_round }
          trigger:
            - call: "POST /victim-claims/${claim_id}/request-evidence"
              payload: { missing_evidence_kinds: ["PURCHASE_RECEIPT"] }
              as: FraudAnalyst
              as_user_id: "analyst-4"
              captures: { state_r1: $.data.state, round1: $.data.evidence_round }
            - call: "POST /victim-claims/${claim_id}/resubmit-evidence"
              payload: { purchase_receipt_ref: "RCPT-0001" }
              as: PosAssociate
              as_user_id: "pos-9"
              captures: { state_s1: $.data.state, round1b: $.data.evidence_round }
            - call: "POST /victim-claims/${claim_id}/request-evidence"
              payload: { missing_evidence_kinds: ["PACKAGING_PHOTO"] }
              as: FraudAnalyst
              as_user_id: "analyst-4"
              captures: { state_r2: $.data.state, round2: $.data.evidence_round }
            - call: "POST /victim-claims/${claim_id}/resubmit-evidence"
              payload: { packaging_photo_ref: "PHOTO-0001" }
              as: PosAssociate
              as_user_id: "pos-9"
              captures: { state_s2: $.data.state, round2b: $.data.evidence_round, claim_v_final: $.data.version }
          assert:
            - "${round0} == 0"
            - "${state_r1} == EVIDENCE_REQUESTED and ${round1} == 1"
            - "${state_s1} == SUBMITTED and ${round1b} == 1 — resubmission does NOT reset the counter"
            - "${state_r2} == EVIDENCE_REQUESTED and ${round2} == 2"
            - "${state_s2} == SUBMITTED and ${round2b} == 2"
            - "VictimClaim.${claim_id}.state == SUBMITTED — the row returned to its starting state"
            - "VictimClaim.${claim_id}.evidence_round == 2"
            - "VictimClaim.${claim_id}.purchase_receipt_ref == RCPT-0001"
            - "VictimClaim.${claim_id}.packaging_photo_ref == PHOTO-0001"
            - "VictimClaim.${claim_id}.version == 5 (created at 1, four cycle mutations)"
            - "VictimClaim.${claim_id}.intake_user_id == pos-9 — unchanged by the cycle"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: claim_approval_four_hop_cascade_to_open_liability_period
        grounds:
          - state_machines.VictimClaim.SUBMITTED_to_APPROVED
          - calculations.claim_reissue_amount
          - calculations.card_balance_projection
          - state_machines.GiftCard.ACTIVE_to_CLOSED
          - state_machines.DrainingAlert.state
          - entities.GiftCard.fields.reissued_from_card_id
          - entities.LiabilityPeriod.fields.unauthorized_writeoff_cents
          - validations[priority=77]
        distinguishing_aspect: |
          DEPTH 4 on the VictimClaim.SUBMITTED -> APPROVED trigger, each link
          CAUSED by the previous one: (1) approving the claim recovery-factors
          the three unauthorized ledger lines into reissue_amount_cents; (2)
          because a reissue amount exists, a replacement GiftCard is minted and
          funded with reissue + residual; (3) because a replacement exists, the
          original card is CLOSED and swept to zero; (4) because the original
          was written off, the OPEN LiabilityPeriod covering the approval
          instant absorbs the write-off. Remove hop 1 and hops 2-4 cannot
          happen — there is nothing to fund the replacement with.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Two RetailStores — store1 sells the card, store2 is where the drain redemptions land."
            - "One CardRack at store1 and one ACTIVE PHYSICAL GiftCard with face value 20000 cents."
            - "Three unauthorized redemptions of 1010, 1030 and 1050 cents at store2, leaving current_balance_cents 16910."
            - "One OPEN LiabilityPeriod covering 2026-08-01 through 2026-09-01 (half-open)."
            - "One VictimClaim in state SUBMITTED with disputed_amount_cents 3090 and both evidence refs supplied, taken in by pos-7."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Harbor Gifts", region_code: "NE", address_line: "9 Harbor Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Transit Kiosk", region_code: "NE", address_line: "1 Transit Plz" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-H1", expected_card_count: 12 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-5001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 20000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-51", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1010, merchant_store_id: "${store2_id}", memo: "drain 1" }
              as: PosAssociate
              captures: { ev1_id: $.data.id }
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1030, merchant_store_id: "${store2_id}", memo: "drain 2" }
              as: PosAssociate
              captures: { ev2_id: $.data.id }
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1050, merchant_store_id: "${store2_id}", memo: "drain 3" }
              as: PosAssociate
              captures: { ev3_id: $.data.id }
            - call: "POST /liability-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              captures: { period_id: $.data.id }
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Marcus Diallo", claimant_contact: "marcus@example.com", disputed_amount_cents: 3090, purchased_at: "2026-08-01T00:00:00Z", purchase_receipt_ref: "RCPT-5001", packaging_photo_ref: "PHOTO-5001" }
              as: PosAssociate
              as_user_id: "pos-7"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /victim-claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "packaging tampered, receipt matches activation" }
              as: RiskManager
              as_user_id: "risk-7"
              captures: { claim_state: $.data.state, reissue_cents: $.data.reissue_amount_cents, new_card_id: $.data.reissued_card_id }
          assert:
            - "HOP 1 — VictimClaim.${claim_id}.state == APPROVED"
            - "VictimClaim.${claim_id}.unauthorized_line_count == 3"
            - "VictimClaim.${claim_id}.gross_reissue_cents == 2628 (per-line ROUND_HALF_UP at 8500 bps: 859 + 876 + 893)"
            - "VictimClaim.${claim_id}.reissue_amount_cents == 2628 (below the 100000-cent reissue cap)"
            - "VictimClaim.${claim_id}.residual_transfer_cents == 16910"
            - "VictimClaim.${claim_id}.decided_by_user_id == risk-7"
            - "rounding order proof: 2628 != 2627, which is what ROUND_HALF_UP(3090 * 0.85) on the summed lines would give"
            - "HOP 2 — GiftCard.${new_card_id} exists, activation_state == ACTIVE, channel == PHYSICAL"
            - "GiftCard.${new_card_id}.reissued_from_card_id == ${card_id}"
            - "GiftCard.${new_card_id}.current_balance_cents == 19538 (2628 reissue + 16910 residual)"
            - "GiftCard.${new_card_id}.total_loaded_cents == 19538"
            - "GiftCard.${new_card_id}.total_redeemed_cents == 0"
            - "GiftCard.${new_card_id}.risk_posture == CLEAR"
            - "HOP 3 — GiftCard.${card_id}.activation_state == CLOSED"
            - "GiftCard.${card_id}.current_balance_cents == 0"
            - "GiftCard.${card_id}.closed_at is not null"
            - "HOP 4 — LiabilityPeriod.${period_id}.unauthorized_writeoff_cents == 2628"
            - "LiabilityPeriod.${period_id}.state == OPEN — the write-off landed without closing the period"
            - "GET /gift-cards?reissued_from_card_id=${card_id} returns total_count == 1"
            - "GET /victim-claims?reissued_card_id=${new_card_id} returns total_count == 1"

      - name: rack_tamper_three_hop_cascade_suspends_store_and_voids_inactive_cards
        grounds:
          - calculations.rack_tamper_classification
          - state_machines.CardRack.INTACT_to_TAMPERED
          - calculations.store_floor_posture
          - state_machines.RetailStore.OPEN_to_SUSPENDED
          - state_machines.GiftCard.INACTIVE_to_VOIDED
          - entities.CardRack.fields.missing_card_count
          - entities.RetailStore.fields.tampered_rack_count
        distinguishing_aspect: |
          DEPTH 3 on a DIFFERENT triggering transition — a rack audit, not a
          claim decision: (1) the shrink of 3 cards at the rack_shrink_threshold
          classifies the rack TAMPERED; (2) because a rack went TAMPERED the
          store's tampered_rack_count reaches 1 and the floor posture jumps
          straight to SUSPENDED; (3) because the rack is TAMPERED its still
          un-activated stock is VOIDED and FROZEN, while the one card already
          activated off that rack is untouched — proving the third hop is
          state-filtered rather than a blanket sweep.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore with floor_posture OPEN and one CardRack with expected_card_count 10 and tamper_state INTACT."
            - "Four GiftCards created against that rack; one of them is activated with face value 5000 cents (which nulls its rack_id) and the other three stay INACTIVE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Riverbend Pharmacy", region_code: "MW", address_line: "77 Riverbend Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-R1", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id, rack_v0: $.data.version }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6001" }
              as: PosAssociate
              captures: { card_live_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6002" }
              as: PosAssociate
              captures: { card_i1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6003" }
              as: PosAssociate
              captures: { card_i2_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6004" }
              as: PosAssociate
              captures: { card_i3_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_live_id}", pos_terminal_id: "T-61", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
          trigger:
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 7, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { rack_state: $.data.tamper_state, missing: $.data.missing_card_count }
          assert:
            - "HOP 1 — CardRack.${rack1_id}.missing_card_count == 3 (10 expected - 7 observed)"
            - "CardRack.${rack1_id}.seal_breaks_observed == 0"
            - "CardRack.${rack1_id}.tamper_state == TAMPERED (shrink 3 is AT the rack_shrink_threshold of 3, not above it)"
            - "CardRack.${rack1_id}.last_audit_at == 2026-08-01T00:00:00Z"
            - "CardRack.${rack1_id}.observed_card_count == 7 — the audit inputs are persisted verbatim so the classification is reproducible"
            - "HOP 2 — RetailStore.${store1_id}.tampered_rack_count == 1"
            - "RetailStore.${store1_id}.floor_posture == SUSPENDED — one TAMPERED rack skips HEIGHTENED entirely"
            - "HOP 3 — GiftCard.${card_i1_id}.activation_state == VOIDED and risk_posture == FROZEN"
            - "GiftCard.${card_i2_id}.activation_state == VOIDED and risk_posture == FROZEN"
            - "GiftCard.${card_i3_id}.activation_state == VOIDED and risk_posture == FROZEN"
            - "state-filtered, not blanket: GiftCard.${card_live_id}.activation_state == ACTIVE, risk_posture == CLEAR, current_balance_cents == 5000"
            - "GET /gift-cards?activation_state=VOIDED returns total_count == 3"
            - "GET /card-racks?tamper_state=TAMPERED returns total_count == 1"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_card_state_error_beats_insufficient_balance_fiscal_error
        grounds:
          - validations[priority=46]
          - validations[priority=75]
          - errors.ERR_CARD_FROZEN
          - errors.ERR_INSUFFICIENT_BALANCE
          - state_machines.GiftCard.risk_posture
        distinguishing_aspect: |
          Pairs category STATE (p46 ERR_CARD_FROZEN) against category
          BUSINESS_FISCAL (p75 ERR_INSUFFICIENT_BALANCE) — a single redemption
          of 9000 cents on a FROZEN card holding 5000 violates BOTH, and the
          lower-priority number must win, so a naive balance-first
          implementation returns 422 ERR_INSUFFICIENT_BALANCE instead of 409
          ERR_CARD_FROZEN.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 5000 cents."
            - "A RiskManager posture override to FROZEN, so the card simultaneously fails the posture gate and cannot cover the requested amount."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Summit Fuel", region_code: "SW", address_line: "12 Summit Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-S1", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-7001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-71", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/posture"
              payload: { risk_posture: "FROZEN", reason: "confirmed drain ring" }
              as: RiskManager
              as_user_id: "risk-5"
              captures: { posture: $.data.risk_posture, balance_before: $.data.current_balance_cents }
          trigger:
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 9000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-71" }
              as: PosAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CARD_FROZEN"
            - "${err} != ERR_INSUFFICIENT_BALANCE — p46 (state) outranks p75 (business_fiscal)"
            - "${posture} == FROZEN and ${balance_before} == 5000 — both violations were live at trigger time"
            - "GiftCard.${card_id}.current_balance_cents == 5000 — nothing moved"
            - "GiftCard.${card_id}.total_redeemed_cents == 0"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 1 (the activation load only)"

      - name: suspended_floor_safety_error_beats_missing_identity_referential_error
        grounds:
          - validations[priority=57]
          - validations[priority=60]
          - errors.ERR_STORE_FLOOR_SUSPENDED
          - errors.ERR_IDENTITY_VERIFICATION_REQUIRED
          - state_machines.BulkPurchaseOrder.PENDING_IDENTITY_to_APPROVED
          - calculations.store_floor_posture
        distinguishing_aspect: |
          A DIFFERENT error-category pair from the sibling instance — category
          BUSINESS_SAFETY (p57 ERR_STORE_FLOOR_SUSPENDED) against category
          BUSINESS_REFERENTIAL (p60 ERR_IDENTITY_REQUIRED) — on a
          bulk-order approval where the store was suspended by an unrelated
          rack audit AND the purchaser never presented identity.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore and one CardRack with expected_card_count 10."
            - "One BulkPurchaseOrder for 5 cards at 12000 cents each — total 60900 cents, above the 50000-cent identity threshold — left in PENDING_IDENTITY with NO identity verification recorded."
            - "A rack audit showing 3 missing cards, which drives the rack TAMPERED and the store floor_posture to SUSPENDED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Junction Market", region_code: "MW", address_line: "8 Junction St" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-J1", expected_card_count: 10 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 5, face_value_cents_each: 12000, purchaser_name: "Vantage Logistics", payment_method: "CREDIT" }
              as: PosAssociate
              captures: { bulk_id: $.data.id, bulk_total: $.data.total_cents, bulk_state0: $.data.state, bulk_v0: $.data.version }
            - call: "POST /card-racks/${rack1_id}/audits"
              payload: { observed_card_count: 7, seal_breaks_observed: 0 }
              as: PosAssociate
              captures: { rack_state: $.data.tamper_state }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-4"
              captures: { floor: $.data.floor_posture }
          trigger:
            - call: "POST /bulk-purchase-orders/${bulk_id}/decide"
              payload: { decision: "APPROVE", decision_note: "regular corporate customer" }
              as: RiskManager
              as_user_id: "risk-4"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_STORE_FLOOR_SUSPENDED"
            - "${err} != ERR_IDENTITY_VERIFICATION_REQUIRED — p57 (business_safety) outranks p60 (business_referential)"
            - "${bulk_total} == 60900 and ${bulk_state0} == PENDING_IDENTITY — the identity violation was genuinely live"
            - "${floor} == SUSPENDED — the safety violation was genuinely live"
            - "BulkPurchaseOrder.${bulk_id}.state == PENDING_IDENTITY — the rejected decision did not advance the order"
            - "BulkPurchaseOrder.${bulk_id}.version == ${bulk_v0} — a rejected write is not a mutation"
            - "BulkPurchaseOrder.${bulk_id}.decided_by_user_id == null"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: inquiry_velocity_alert_fires_exactly_at_fifth_inquiry
        grounds:
          - calculations.inquiry_velocity_count
          - calculations.card_drain_risk_score
          - state_machines.GiftCard.WATCH_to_RESTRICTED
          - state_machines.DrainingAlert.initial_state
          - entities.BalanceInquiry.fields.velocity_count_at_inquiry
          - entities.DrainingAlert.fields.basis_velocity_count
        distinguishing_aspect: |
          METRIC = the inquiry-velocity COUNT within the 60-minute window,
          probed at exactly threshold-1 and threshold on ENDPOINT
          POST /gift-cards/{id}/balance-inquiries: the fourth inquiry yields
          count 4 / score 48 with NO alert, the fifth yields count 5 / score 60
          and fires the alert, so the comparison must be `>=` on 5 and not `>`.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z and never advanced, so all inquiries fall inside one 60-minute window."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents and NO redemptions, so the redemption half of the drain score contributes zero."
            - "Exactly FOUR balance inquiries — one below the velocity threshold of 5."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Beltway Convenience", region_code: "SE", address_line: "410 Beltway Cir" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-B1", expected_card_count: 9 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-8001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-81", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "IVR", requester_ip_hash: "iph-1" }
              as: ResellerPartner
              as_user_id: "partner-8"
              captures: { q1_count: $.data.velocity_count_at_inquiry, q1_score: $.data.drain_score_at_inquiry }
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "IVR", requester_ip_hash: "iph-1" }
              as: ResellerPartner
              as_user_id: "partner-8"
              captures: { q2_count: $.data.velocity_count_at_inquiry }
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-2" }
              as: ResellerPartner
              as_user_id: "partner-8"
              captures: { q3_count: $.data.velocity_count_at_inquiry, q3_score: $.data.drain_score_at_inquiry }
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-2" }
              as: ResellerPartner
              as_user_id: "partner-8"
              captures: { q4_count: $.data.velocity_count_at_inquiry, q4_score: $.data.drain_score_at_inquiry }
            - call: "GET /draining-alerts"
              payload: { card_id: "${card_id}" }
              as: FraudAnalyst
              as_user_id: "analyst-8"
          trigger:
            - call: "POST /gift-cards/${card_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-3" }
              as: FraudAnalyst
              as_user_id: "analyst-8"
              captures: { q5_count: $.data.velocity_count_at_inquiry, q5_score: $.data.drain_score_at_inquiry, q5_balance: $.data.balance_disclosed_cents }
          assert:
            - "AT THRESHOLD-1 — ${q4_count} == 4 and ${q4_score} == 48, and the setup GET /draining-alerts?card_id=${card_id} returns total_count == 0 — NO alert at four inquiries"
            - "the ladder below the boundary still moved posture: ${q3_score} == 36 (below the watch threshold of 40) while ${q4_score} == 48 crossed it"
            - "AT THRESHOLD — ${q5_count} == 5 and ${q5_score} == 60, and exactly one DrainingAlert now exists for the card"
            - "BalanceInquiry (trigger).balance_disclosed_cents == 10000"
            - "GET /gift-cards/${card_id}/balance-inquiries returns 5 rows whose velocity_count_at_inquiry values are 1, 2, 3, 4, 5"
            - "GiftCard.${card_id}.drain_risk_score_inquiry == 60"
            - "GiftCard.${card_id}.risk_posture == RESTRICTED — the velocity breach forces RESTRICTED even though 60 is below the restrict score threshold of 70"
            - "GET /draining-alerts?card_id=${card_id} returns total_count == 1"
            - "that DrainingAlert has state == OPEN"
            - "that DrainingAlert has detection_basis == INQUIRY_VELOCITY"
            - "that DrainingAlert has basis_velocity_count == 5 and basis_drain_score == 60"
            - "that DrainingAlert has exposure_cents == 10000 and reopen_count == 0"
            - "GET /gift-cards/${card_id}/balance-inquiries returns total_count == 5"

      - name: empty_alert_set_yields_zero_reserve_at_period_close
        grounds:
          - calculations.unauthorized_redemption_reserve
          - calculations.net_funded_liability_invariant
          - state_machines.LiabilityPeriod.OPEN_to_CLOSED
          - entities.LiabilityPeriod.fields.provisional_reserve_cents
          - entities.LiabilityPeriod.fields.reserve_basis_alert_count
        distinguishing_aspect: |
          A DIFFERENT metric — the CARDINALITY of the reserve basis set — probed
          at its degenerate value of zero, on a DIFFERENT endpoint
          (POST /liability-periods/{id}/close): an empty alert set must produce
          provisional_reserve_cents 0 rather than a null, a crash on an empty
          aggregate, or a reserve computed off the outstanding liability.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 7500 cents and no redemptions."
            - "One OPEN LiabilityPeriod covering 2026-08-01 through 2026-09-01 with ZERO DrainingAlerts anywhere in the system."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Quiet Corner Store", region_code: "NE", address_line: "3 Quiet Corner" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-Q1", expected_card_count: 4 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-9001" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 7500, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-91", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /liability-periods"
              payload: { label: "2026-08-quiet", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              captures: { period_id: $.data.id, period_state0: $.data.state }
            - call: "GET /draining-alerts"
              payload: {}
              as: RiskManager
              as_user_id: "risk-9"
          trigger:
            - call: "POST /liability-periods/${period_id}/close"
              payload: { close_note: "clean month, no fraud alerts" }
              as: LiabilityAccountant
              captures: { period_state: $.data.state, gross: $.data.gross_exposure_cents, basis_n: $.data.reserve_basis_alert_count, prov: $.data.provisional_reserve_cents, fin: $.data.final_reserve_cents }
          assert:
            - "the basis really was empty: GET /draining-alerts returns total_count == 0"
            - "${period_state0} == OPEN and LiabilityPeriod.${period_id}.state == CLOSED"
            - "LiabilityPeriod.${period_id}.gross_exposure_cents == 0"
            - "LiabilityPeriod.${period_id}.reserve_basis_alert_count == 0"
            - "LiabilityPeriod.${period_id}.provisional_reserve_cents == 0 — an integer zero, not null"
            - "LiabilityPeriod.${period_id}.final_reserve_cents == null — the final variant only exists after a restatement"
            - "LiabilityPeriod.${period_id}.unauthorized_writeoff_cents == 0"
