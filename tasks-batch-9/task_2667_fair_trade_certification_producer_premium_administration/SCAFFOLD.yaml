scenario: |
  Generate task harder than expert level!

  2667. Fair Trade Certification & Producer Premium Administration (Fair Trade USA): supply chain mapping and certificate holder registration at each node, minimum price and community development premium calculation on volumes, premium fund governance by producer committees and approved use categories, mass-balance versus physical-traceability accounting for certified volume, audit scheduling, nonconformity grading and corrective action deadlines, label licensing fees and mark usage approval, volume reporting reconciliation across buyers and sellers, decertification and transition handling
domain_name: fair-trade-certification-premium-administration
api_prefix: "/fairtrade"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  entity_topology_note: |
    SupplyChainNode is self-referential (upstream_node_id -> SupplyChainNode.id) and forms a
    rooted DAG per product chain; TradeTransaction is an edge entity referencing two nodes;
    PremiumLedgerEntry is polymorphic-ish (fund_id always, plus exactly one of
    trade_transaction_id / proposal_id). No URL nesting expresses ownership for the graph part —
    nodes and transactions are peer collections joined by FK.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Three non-linear machines: CertificateHolder (CERTIFIED<->SUSPENDED reinstatement cycle plus a
    SUSPENDED->{TRANSITIONING, DECERTIFIED} branch), TradeTransaction (two independent state
    dimensions verification_status x settlement_status evolving on one row), PremiumUseProposal
    (UNDER_VOTE->REVISION_REQUESTED->DRAFT->UNDER_VOTE revision loop with a three-way close-vote
    fork), Nonconformity (CAP_SUBMITTED->CAP_REJECTED->CAP_SUBMITTED resubmission loop) and
    PremiumCommittee (ACTIVE<->RESTRICTED balance-threshold cycle).

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  role_model_note: |
    The Auditor who raised a Nonconformity may never review its corrective action plan
    (X-User-ID inequality check); the ProducerRepresentative who submits a CAP may never
    review it; CommitteeChair proposes and closes votes but may not cast a ballot in the
    round it closes, and CertificationOfficer alone disburses.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: CertificateHolder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the certificate holder organization
        constraints: non-empty, max 200 chars
      - name: holder_type
        type: enum
        source: input
        description: position of this organization in the certified supply chain
        constraints: "one of {PRODUCER_ORG, PROCESSOR, EXPORTER, IMPORTER, BRAND}"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of registration
        constraints: exactly 2 uppercase letters
      - name: product_code
        type: enum
        source: input
        description: certified product scope of this holder
        constraints: "one of {COFFEE_ARABICA, COCOA, BANANA}"
      - name: certificate_status
        type: enum
        source: system
        description: certification lifecycle state driven by the CertificateHolder state machine
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED, SUSPENDED, TRANSITIONING, DECERTIFIED}"
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant at which certificate_status first became CERTIFIED; null while PENDING
        default: null
      - name: suspension_reason
        type: enum
        source: system
        description: why the holder was last suspended; reset to NONE on reinstate
        default: NONE
        constraints: "one of {NONE, NONCONFORMITY_ESCALATION, VOLUME_VARIANCE, MANUAL}"
      - name: transition_deadline_at
        type: datetime
        source: system
        description: end of the sell-down window granted when certificate_status became TRANSITIONING; null otherwise
        default: null
      - name: compliance_score
        type: integer
        source: computed
        description: "derived per calculations.holder_compliance_score_and_deadline; 0..100"
        default: 100
      - name: open_critical_count
        type: integer
        source: computed
        description: count of Nonconformity rows on this holder's audits with grade CRITICAL and status IN {OPEN, CAP_SUBMITTED, CAP_REJECTED, OVERDUE, ESCALATED}
        default: 0
      - name: open_major_count
        type: integer
        source: computed
        description: same filter as open_critical_count but grade MAJOR
        default: 0
      - name: open_minor_count
        type: integer
        source: computed
        description: same filter as open_critical_count but grade MINOR
        default: 0
      - name: next_audit_due_at
        type: datetime
        source: computed
        description: "derived per calculations.holder_compliance_score_and_deadline step 5; null until the first Audit reaches CLOSED"
        default: null
      - name: annual_certified_volume_kg
        type: number
        source: computed
        description: sum of TradeTransaction.volume_kg for transactions whose seller_node belongs to this holder, settlement_status == SETTLED, and contract_date inside the holder's current license_year; 3 decimals
        default: 0
      - name: label_license_status
        type: enum
        source: system
        description: state of the FAIRTRADE mark licence held by this organization
        default: NONE
        constraints: "one of {NONE, ACTIVE, SUSPENDED, TERMINATED}"
      - name: license_year
        type: integer
        source: system
        description: calendar year the current licence covers; null when label_license_status == NONE
        default: null
      - name: licensed_volume_kg
        type: number
        source: system
        description: volume declared for the licence year, the input to the tiered licence fee
        default: null
      - name: license_tier
        type: enum
        source: computed
        description: "derived per calculations.label_license_fee; null when label_license_status == NONE"
        default: null
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: license_fee_cents
        type: integer
        source: computed
        description: "derived per calculations.label_license_fee"
        default: 0
      - name: license_fee_paid_cents
        type: integer
        source: system
        description: cumulative licence-fee payments recorded for license_year
        default: 0
      - name: license_fee_settled
        type: boolean
        source: computed
        description: "true iff license_fee_paid_cents >= license_fee_cents AND license_fee_cents > 0"
        default: false

  - name: SupplyChainNode
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the certificate holder that operates this node"
      - name: upstream_node_id
        type: string
        source: input
        description: "FK -> SupplyChainNode.id; immediate upstream node supplying this one; null for chain-origin nodes (node_role IN {FARM, COOPERATIVE})"
        default: null
      - name: node_role
        type: enum
        source: input
        description: function of this node in the certified chain
        constraints: "one of {FARM, COOPERATIVE, PROCESSOR, EXPORTER, IMPORTER, MANUFACTURER, BRAND_NODE}"
      - name: traceability_mode
        type: enum
        source: input
        description: accounting model used for certified volume at this node
        constraints: "one of {PHYSICAL, MASS_BALANCE}"
      - name: status
        type: enum
        source: system
        description: node lifecycle state driven by the SupplyChainNode state machine
        default: REGISTERED
        constraints: "one of {REGISTERED, ACTIVE, SUSPENDED, RETIRED}"
      - name: chain_depth
        type: integer
        source: computed
        description: "0 when upstream_node_id is null, otherwise upstream node chain_depth + 1; capped by MAX_CHAIN_DEPTH"
        default: 0
      - name: conversion_ratio
        type: number
        source: input
        description: processing yield applied to inbound certified volume when it is booked as certified input at this node
        default: 1.000
        constraints: 3 decimals, 0.001 <= value <= 1.000
      - name: certified_input_kg
        type: number
        source: system
        description: cumulative certified volume booked into this node (harvest declarations plus settled inbound transactions after conversion_ratio); 3 decimals
        default: 0
      - name: reserved_output_kg
        type: number
        source: system
        description: certified volume reserved by TradeTransaction rows created from this node and not yet settled, voided or rejected; 3 decimals
        default: 0
      - name: claimed_output_kg
        type: number
        source: system
        description: certified volume permanently claimed out of this node by SETTLED transactions; 3 decimals
        default: 0
      - name: available_credit_kg
        type: number
        source: computed
        description: "invariant field: certified_input_kg - claimed_output_kg - reserved_output_kg; 3 decimals; may not go below 0 on a MASS_BALANCE node, which is why those nodes are credit-gated at transaction create time"
        default: 0

  - name: PremiumCommittee
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the producer organization whose premium fund this committee governs"
      - name: chair_user_id
        type: string
        source: input
        description: opaque X-User-ID of the elected chair; compared against the acting CommitteeChair header, never against any entity id
      - name: member_count
        type: integer
        source: input
        description: number of elected committee members; the denominator of the turnout calculation
        constraints: integer >= 3
      - name: quorum_pct
        type: number
        source: input
        description: minimum turnout percentage required for a vote round to be tallied as decisive
        default: 60.00
        constraints: 2 decimals, 0.00 < value <= 100.00
      - name: approved_use_categories
        type: array
        source: input
        description: "premium use categories this committee is authorised to spend on; subset of {EDUCATION, HEALTHCARE, INFRASTRUCTURE, PRODUCTIVITY_TOOLS, WORKING_CAPITAL, CASH_DISTRIBUTION}, at least 1 element"
      - name: status
        type: enum
        source: system
        description: committee governance state driven by the PremiumCommittee state machine
        default: FORMING
        constraints: "one of {FORMING, ACTIVE, RESTRICTED, DISSOLVED}"
      - name: open_proposal_count
        type: integer
        source: computed
        description: count of PremiumUseProposal rows on this committee with status IN {DRAFT, UNDER_VOTE, REVISION_REQUESTED, APPROVED}
        default: 0

  - name: PremiumFund
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the producer organization that owns this community development premium fund"
      - name: fiscal_year
        type: integer
        source: system
        description: calendar year of the logical clock when the fund was minted
      - name: total_accrued_cents
        type: integer
        source: system
        description: "conserved quantity: sum of PremiumLedgerEntry.signed_amount_cents over all entries of this fund"
        default: 0
      - name: balance_cents
        type: integer
        source: system
        description: premium accrued and not yet committed to an approved proposal
        default: 0
      - name: committed_cents
        type: integer
        source: system
        description: premium committed to APPROVED proposals that have not been disbursed
        default: 0
      - name: disbursed_cents
        type: integer
        source: system
        description: premium paid out against DISBURSED proposals
        default: 0
      - name: pending_proposal_count
        type: integer
        source: system
        description: count of PremiumUseProposal rows against this fund's committee with status IN {DRAFT, UNDER_VOTE, REVISION_REQUESTED}; bumped on proposal creation so the fund version advances
        default: 0

  - name: PremiumLedgerEntry
    parent: PremiumFund
    common_fields: false
    entity_kind: event
    fields:
      - name: fund_id
        type: string
        source: system
        description: "FK -> PremiumFund.id; the fund this append-only entry belongs to"
      - name: trade_transaction_id
        type: string
        source: system
        description: "FK -> TradeTransaction.id; set for entry_type IN {ACCRUAL, REVERSAL}, null otherwise"
        default: null
      - name: proposal_id
        type: string
        source: system
        description: "FK -> PremiumUseProposal.id; set for entry_type IN {COMMITMENT, RELEASE, DISBURSEMENT}, null otherwise"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: kind of fund movement recorded
        constraints: "one of {ACCRUAL, REVERSAL, COMMITMENT, RELEASE, DISBURSEMENT}"
      - name: amount_cents
        type: integer
        source: system
        description: positive magnitude of the movement
        constraints: integer > 0
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents when entry_type == ACCRUAL, -amount_cents when entry_type == REVERSAL, 0 for COMMITMENT / RELEASE / DISBURSEMENT (internal moves that do not change total_accrued_cents)"
      - name: balance_after_cents
        type: integer
        source: system
        description: PremiumFund.balance_cents immediately after this entry was applied
      - name: memo
        type: string
        source: system
        description: human-readable provenance string stamped by the writing transition

  - name: TradeTransaction
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: seller_node_id
        type: string
        source: input
        description: "FK -> SupplyChainNode.id; node releasing certified volume"
      - name: buyer_node_id
        type: string
        source: input
        description: "FK -> SupplyChainNode.id; node receiving certified volume; must declare seller_node_id as its upstream_node_id"
      - name: product_code
        type: enum
        source: input
        description: product traded
        constraints: "one of {COFFEE_ARABICA, COCOA, BANANA}"
      - name: quality_grade
        type: enum
        source: input
        description: quality band used to select the quality differential
        constraints: "one of {STANDARD, SPECIALTY}"
      - name: is_organic
        type: boolean
        source: input
        description: whether the lot carries an organic certification on top of fair trade
        default: false
      - name: volume_kg
        type: number
        source: input
        description: certified volume transacted; 3 decimals
        constraints: number > 0
      - name: declared_unit_price_cents_per_kg
        type: integer
        source: input
        description: price per kg the parties contracted, before the fair trade minimum floor is applied
        constraints: integer >= 0
      - name: contract_date
        type: string
        source: input
        description: contract date in YYYY-MM-DD; used for volume-report period membership and license-year attribution
      - name: applied_floor_cents_per_kg
        type: integer
        source: computed
        description: "derived per calculations.minimum_price_floor step 1"
      - name: settled_unit_price_cents_per_kg
        type: integer
        source: computed
        description: "derived per calculations.minimum_price_floor step 2"
      - name: floor_topup_cents
        type: integer
        source: computed
        description: "derived per calculations.minimum_price_floor step 3"
      - name: gross_value_cents
        type: integer
        source: computed
        description: "derived per calculations.minimum_price_floor step 4"
      - name: premium_basis
        type: enum
        source: computed
        description: "which variant of calculations.community_development_premium was applied; copied from seller node traceability_mode at creation time"
        constraints: "one of {PHYSICAL_TRACEABILITY, MASS_BALANCE}"
      - name: premium_volume_kg
        type: number
        source: computed
        description: "volume the premium was assessed on per calculations.community_development_premium; 3 decimals"
      - name: premium_cents
        type: integer
        source: computed
        description: "derived per calculations.community_development_premium; frozen at creation and never recomputed afterwards"
      - name: verification_status
        type: enum
        source: system
        description: first independent state dimension; evolves via verify / dispute / reject
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, DISPUTED, REJECTED}"
      - name: settlement_status
        type: enum
        source: system
        description: second independent state dimension; evolves via settle / void
        default: PENDING
        constraints: "one of {PENDING, SETTLED, REVERSED}"
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant verification_status last became VERIFIED
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant settlement_status became SETTLED
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant settlement_status became REVERSED
        default: null

  - name: VolumeReport
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the holder filing this periodic volume declaration"
      - name: counterparty_holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the trading counterparty whose books this report is reconciled against"
      - name: period_start
        type: string
        source: input
        description: first day of the reporting period in YYYY-MM-DD, inclusive
      - name: period_end
        type: string
        source: input
        description: exclusive end of the reporting period in YYYY-MM-DD; the period is the half-open interval [period_start, period_end)
      - name: declared_volume_kg
        type: number
        source: input
        description: certified volume the filer claims moved between the two holders in the period; 3 decimals
        constraints: number >= 0
      - name: basis
        type: enum
        source: system
        description: reconciliation basis chosen at reconcile time; null while reconciliation_status == SUBMITTED
        default: null
        constraints: "one of {SELLER_BASIS, BUYER_BASIS}"
      - name: counterparty_volume_kg
        type: number
        source: computed
        description: "derived per calculations.volume_reconciliation_variance; null while reconciliation_status == SUBMITTED"
        default: null
      - name: variance_pct
        type: number
        source: computed
        description: "derived per calculations.volume_reconciliation_variance; 2 decimals, signed; null while reconciliation_status == SUBMITTED"
        default: null
      - name: reconciliation_status
        type: enum
        source: system
        description: outcome of reconciliation
        default: SUBMITTED
        constraints: "one of {SUBMITTED, MATCHED, VARIANCE_FLAGGED}"
      - name: reconciled_at
        type: datetime
        source: system
        description: logical-clock instant reconciliation succeeded
        default: null

  - name: PremiumUseProposal
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> PremiumCommittee.id; the committee that owns this proposal"
      - name: title
        type: string
        source: input
        description: short title of the proposed premium use
        constraints: non-empty, max 200 chars
      - name: use_category
        type: enum
        source: input
        description: premium use category requested
        constraints: "one of {EDUCATION, HEALTHCARE, INFRASTRUCTURE, PRODUCTIVITY_TOOLS, WORKING_CAPITAL, CASH_DISTRIBUTION}"
      - name: requested_amount_cents
        type: integer
        source: input
        description: amount of premium requested
        constraints: integer > 0
      - name: use_period_start
        type: string
        source: input
        description: first day the spend is planned for, YYYY-MM-DD, inclusive
      - name: use_period_end
        type: string
        source: input
        description: exclusive end of the planned spend window, YYYY-MM-DD; the window is the half-open interval [use_period_start, use_period_end)
      - name: status
        type: enum
        source: system
        description: proposal governance state driven by the PremiumUseProposal state machine
        default: DRAFT
        constraints: "one of {DRAFT, UNDER_VOTE, REVISION_REQUESTED, APPROVED, REJECTED, DISBURSED, CANCELLED}"
      - name: current_round
        type: integer
        source: system
        description: voting round counter; 0 while the proposal has never been opened for a vote, incremented on every open-vote; ballots are scoped to the round that was open when they were cast
        default: 0
      - name: turnout_pct
        type: number
        source: computed
        description: "derived per calculations.proposal_vote_tally; 2 decimals; null until the first close-vote"
        default: null
      - name: approval_pct
        type: number
        source: computed
        description: "derived per calculations.proposal_vote_tally; 2 decimals; null until the first close-vote"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant status became APPROVED
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: logical-clock instant status became DISBURSED
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant status became CANCELLED
        default: null

  - name: CommitteeVote
    parent: PremiumUseProposal
    common_fields: false
    entity_kind: event
    fields:
      - name: proposal_id
        type: string
        source: system
        description: "FK -> PremiumUseProposal.id; the proposal this ballot belongs to"
      - name: voter_user_id
        type: string
        source: system
        description: opaque X-User-ID header of the balloting committee member, copied from the request; unique per (proposal_id, round_number)
      - name: ballot
        type: enum
        source: input
        description: the member's ballot
        constraints: "one of {APPROVE, REJECT, ABSTAIN}"
      - name: round_number
        type: integer
        source: system
        description: copied from PremiumUseProposal.current_round at the instant the ballot is accepted
      - name: rationale
        type: string
        source: input
        description: optional free-text rationale recorded with the ballot
        default: null
      - name: cast_at
        type: datetime
        source: system
        description: logical-clock instant the ballot was accepted

  - name: Audit
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the holder being audited"
      - name: auditor_user_id
        type: string
        source: input
        description: opaque X-User-ID of the assigned auditor; the occupied scheduling resource for the auditor-window overlap rule
      - name: audit_type
        type: enum
        source: input
        description: audit category
        constraints: "one of {INITIAL, SURVEILLANCE, FOLLOW_UP, UNANNOUNCED}"
      - name: window_start
        type: string
        source: input
        description: first day of the on-site window in YYYY-MM-DD, inclusive
      - name: window_end
        type: string
        source: input
        description: exclusive end of the on-site window in YYYY-MM-DD; the holder-side overlap rule treats it as the half-open interval [window_start, window_end)
      - name: status
        type: enum
        source: system
        description: audit lifecycle state driven by the Audit state machine
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, REPORT_PENDING, CLOSED, CANCELLED}"
      - name: nonconformity_count
        type: integer
        source: computed
        description: count of all Nonconformity rows with audit_id == this audit
        default: 0
      - name: open_nonconformity_count
        type: integer
        source: computed
        description: count of Nonconformity rows with audit_id == this audit and status IN {OPEN, CAP_SUBMITTED, CAP_REJECTED, OVERDUE, ESCALATED}
        default: 0
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant status became IN_PROGRESS
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant status became CLOSED
        default: null

  - name: Nonconformity
    parent: Audit
    common_fields: true
    entity_kind: resource
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> Audit.id; the audit that raised this finding"
      - name: clause_code
        type: string
        source: input
        description: standard clause reference the finding is written against
        constraints: non-empty, max 40 chars
      - name: grade
        type: enum
        source: input
        description: severity grade driving the corrective action deadline and the escalation path
        constraints: "one of {CRITICAL, MAJOR, MINOR, OBSERVATION}"
      - name: description
        type: string
        source: input
        description: narrative of the finding
        constraints: non-empty, max 1000 chars
      - name: raised_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the Auditor who raised the finding; the segregation-of-duties comparison key for cap-review
      - name: compliance_score_at_raise
        type: integer
        source: computed
        description: "holder compliance_score evaluated BEFORE this finding was inserted, per calculations.holder_compliance_score_and_deadline step 1"
      - name: deadline_at
        type: datetime
        source: computed
        description: "corrective action deadline, derived per calculations.holder_compliance_score_and_deadline step 3"
      - name: escalation_grace_days
        type: integer
        source: computed
        description: "grace days added to deadline_at before a sweep may escalate, pinned at raise time per calculations.holder_compliance_score_and_deadline step 4"
      - name: status
        type: enum
        source: system
        description: finding lifecycle state driven by the Nonconformity state machine
        default: OPEN
        constraints: "one of {OPEN, CAP_SUBMITTED, CAP_REJECTED, CLOSED, OVERDUE, ESCALATED}"
      - name: cap_round
        type: integer
        source: system
        description: number of corrective action plans submitted so far
        default: 0
      - name: cap_narrative
        type: string
        source: system
        description: narrative of the most recent corrective action plan submission
        default: null
      - name: cap_submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent CAP submission
        default: null
      - name: cap_reviewed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent CAP review decision
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant status became CLOSED
        default: null

  - name: MarkUsageRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: brand_holder_id
        type: string
        source: input
        description: "FK -> CertificateHolder.id; the licensee requesting mark usage"
      - name: sku_code
        type: string
        source: input
        description: retail SKU the mark would appear on
        constraints: non-empty, max 40 chars
      - name: artwork_ref
        type: string
        source: input
        description: reference id of the submitted artwork proof
        constraints: non-empty, max 80 chars
      - name: claim_type
        type: enum
        source: input
        description: on-pack claim requested; FT_CERTIFIED_100 requires an all-PHYSICAL upstream chain
        constraints: "one of {FT_CERTIFIED_100, FT_INGREDIENT_MASS_BALANCE}"
      - name: requested_volume_kg
        type: number
        source: input
        description: annual volume the SKU is expected to carry; 3 decimals
        constraints: number > 0
      - name: status
        type: enum
        source: system
        description: approval state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, WITHDRAWN}"
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CertificationOfficer who decided the request
        default: null
      - name: decision_reason
        type: string
        source: system
        description: reason recorded with the decision, or the cascade that withdrew the request
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision
        default: null

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: CertificateHolder
    dimension: certificate_status
    shape: branching_with_cycle
    initial_state: PENDING
    terminal_states: [DECERTIFIED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /fairtrade/certificate-holders/{id}/certify"
        actor: CertificationOfficer
        preconditions:
          - "certificate_status == PENDING"
          - "the holder has at least 1 SupplyChainNode with status == REGISTERED"
        side_effects:
          - "certified_at = clock_now"
          - "every SupplyChainNode with holder_id == this holder and status == REGISTERED transitions REGISTERED -> ACTIVE, ordered by created_at ASC"
          - "recompute compliance_score per calculations.holder_compliance_score_and_deadline (no findings yet, so 100)"
          - "version += 1 on the holder and on each cascaded node"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /fairtrade/certificate-holders/{id}/suspend OR system escalation inside POST /fairtrade/compliance-sweeps step 3"
        actor: CertificationOfficer | system
        preconditions:
          - "certificate_status == CERTIFIED"
        side_effects:
          - "suspension_reason = request body reason for the manual trigger, NONCONFORMITY_ESCALATION for the sweep trigger"
          - "every SupplyChainNode with holder_id == this holder and status == ACTIVE transitions ACTIVE -> SUSPENDED, ordered by created_at ASC"
          - "each node that just became SUSPENDED releases its open reservations: every TradeTransaction with seller_node_id == that node, verification_status == UNVERIFIED and settlement_status == PENDING moves verification_status UNVERIFIED -> DISPUTED and decrements that node's reserved_output_kg by the transaction volume_kg, ordered by TradeTransaction.created_at ASC"
          - "if label_license_status == ACTIVE then label_license_status = SUSPENDED and every MarkUsageRequest with brand_holder_id == this holder and status == SUBMITTED moves SUBMITTED -> WITHDRAWN with decision_reason = 'HOLDER_SUSPENDED', ordered by created_at ASC"
          - "version += 1 on the holder and on every mutated node, transaction and mark usage request"
        note: "cascade depth 3 measured from the holder mutation: holder -> node -> transaction"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /fairtrade/certificate-holders/{id}/reinstate"
        actor: CertificationOfficer
        preconditions:
          - "certificate_status == SUSPENDED"
          - "open_critical_count == 0"
          - "no Nonconformity on this holder's audits has status == ESCALATED"
        side_effects:
          - "suspension_reason = NONE"
          - "every SupplyChainNode with holder_id == this holder and status == SUSPENDED transitions SUSPENDED -> ACTIVE, ordered by created_at ASC"
          - "if license_year is not null and label_license_status == SUSPENDED then label_license_status = ACTIVE"
          - "version += 1 on the holder and on each cascaded node"
        note: "closes the CERTIFIED -> SUSPENDED -> CERTIFIED cycle; WITHDRAWN MarkUsageRequest rows are NOT resurrected by design"
      - from: SUSPENDED
        to: TRANSITIONING
        trigger: "POST /fairtrade/certificate-holders/{id}/transition"
        actor: CertificationOfficer
        preconditions:
          - "certificate_status == SUSPENDED"
        side_effects:
          - "transition_deadline_at = clock_now + TRANSITION_WINDOW_DAYS days"
          - "every SupplyChainNode with holder_id == this holder and status == SUSPENDED transitions SUSPENDED -> ACTIVE so remaining certified stock can be sold down, ordered by created_at ASC"
          - "version += 1 on the holder and on each cascaded node"
        note: "sell-down branch; the sibling branch from SUSPENDED is the immediate decertify below"
      - from: SUSPENDED
        to: DECERTIFIED
        trigger: "POST /fairtrade/certificate-holders/{id}/decertify"
        actor: CertificationOfficer
        preconditions:
          - "certificate_status == SUSPENDED"
        side_effects:
          - "every SupplyChainNode with holder_id == this holder and status != RETIRED transitions to RETIRED, ordered by created_at ASC"
          - "each node that just became RETIRED rejects its open pipeline: every TradeTransaction with seller_node_id == that node and settlement_status == PENDING moves verification_status to REJECTED and decrements that node's reserved_output_kg by the transaction volume_kg, ordered by TradeTransaction.created_at ASC"
          - "every Audit with holder_id == this holder and status == SCHEDULED transitions SCHEDULED -> CANCELLED, ordered by created_at ASC"
          - "every PremiumCommittee with holder_id == this holder and status != DISSOLVED transitions to DISSOLVED"
          - "if label_license_status IN {ACTIVE, SUSPENDED} then label_license_status = TERMINATED"
          - "version += 1 on every mutated row"
        note: "divergent side-effect set versus the TRANSITIONING branch, which reactivates nodes instead of retiring them"
      - from: TRANSITIONING
        to: DECERTIFIED
        trigger: "system, inside POST /fairtrade/compliance-sweeps step 6, when transition_deadline_at <= clock_now"
        actor: system
        preconditions:
          - "certificate_status == TRANSITIONING"
          - "transition_deadline_at <= clock_now"
        side_effects:
          - "identical cascade to the SUSPENDED -> DECERTIFIED transition above"
      - from: PENDING
        to: DECERTIFIED
        trigger: "POST /fairtrade/certificate-holders/{id}/decertify"
        actor: CertificationOfficer
        preconditions:
          - "certificate_status == PENDING"
        side_effects:
          - "application denied; every SupplyChainNode with holder_id == this holder transitions to RETIRED, ordered by created_at ASC"
          - "version += 1 on every mutated row"

  - entity: SupplyChainNode
    dimension: status
    shape: cyclic
    note: "SupplyChainNode has no direct action endpoint; every transition is either a creation-time branch or a cascade from CertificateHolder"
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: null
        to: REGISTERED
        trigger: "POST /fairtrade/supply-chain-nodes when the owning holder certificate_status == PENDING"
        actor: ProducerRepresentative | BrandLicensee | CertificationOfficer
        preconditions:
          - "owning CertificateHolder certificate_status == PENDING"
        side_effects:
          - "chain_depth computed from upstream_node_id"
          - "available_credit_kg = 0"
      - from: null
        to: ACTIVE
        trigger: "POST /fairtrade/supply-chain-nodes when the owning holder certificate_status IN {CERTIFIED, TRANSITIONING}"
        actor: ProducerRepresentative | BrandLicensee | CertificationOfficer
        preconditions:
          - "owning CertificateHolder certificate_status IN {CERTIFIED, TRANSITIONING}"
        side_effects:
          - "chain_depth computed from upstream_node_id"
      - from: REGISTERED
        to: ACTIVE
        trigger: "system cascade from CertificateHolder PENDING -> CERTIFIED"
        actor: system
        preconditions:
          - "status == REGISTERED"
        side_effects:
          - "version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from CertificateHolder CERTIFIED -> SUSPENDED"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "every TradeTransaction with seller_node_id == this node, verification_status == UNVERIFIED and settlement_status == PENDING moves verification_status UNVERIFIED -> DISPUTED"
          - "reserved_output_kg -= sum of volume_kg over those transactions, so available_credit_kg rises back"
          - "version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade from CertificateHolder SUSPENDED -> CERTIFIED (reinstate) or SUSPENDED -> TRANSITIONING"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "version += 1"
        note: "closes the ACTIVE -> SUSPENDED -> ACTIVE cycle; released reservations are NOT re-reserved"
      - from: REGISTERED
        to: RETIRED
        trigger: "system cascade from CertificateHolder PENDING -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == REGISTERED"
        side_effects:
          - "version += 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system cascade from CertificateHolder {SUSPENDED, TRANSITIONING} -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "every TradeTransaction with seller_node_id == this node and settlement_status == PENDING moves verification_status to REJECTED"
          - "reserved_output_kg -= sum of volume_kg over those transactions"
          - "version += 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "system cascade from CertificateHolder SUSPENDED -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "every TradeTransaction with seller_node_id == this node and settlement_status == PENDING moves verification_status to REJECTED"
          - "reserved_output_kg -= sum of volume_kg over those transactions"
          - "version += 1"

  - entity: TradeTransaction
    dimension: verification_status
    shape: parallel_dimension_with_cycle
    initial_state: UNVERIFIED
    terminal_states: [REJECTED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /fairtrade/trade-transactions/{id}/verify with outcome = VERIFIED"
        actor: Auditor
        preconditions:
          - "verification_status == UNVERIFIED"
          - "seller SupplyChainNode status == ACTIVE"
        side_effects:
          - "verified_at = clock_now"
          - "version += 1"
        note: "settlement_status is untouched — the two dimensions advance independently"
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /fairtrade/trade-transactions/{id}/verify with outcome = DISPUTED, OR system cascade from seller node ACTIVE -> SUSPENDED"
        actor: Auditor | system
        preconditions:
          - "verification_status == UNVERIFIED"
        side_effects:
          - "version += 1"
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /fairtrade/trade-transactions/{id}/verify with outcome = VERIFIED"
        actor: Auditor
        preconditions:
          - "verification_status == DISPUTED"
          - "seller SupplyChainNode status == ACTIVE"
          - "seller node available_credit_kg >= volume_kg (the reservation released when the transaction was disputed must still be re-reservable)"
        side_effects:
          - "verified_at = clock_now"
          - "seller node reserved_output_kg += volume_kg (re-reservation), version += 1 on the node"
          - "version += 1"
        note: "closes the UNVERIFIED -> DISPUTED -> VERIFIED cycle"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /fairtrade/trade-transactions/{id}/verify with outcome = REJECTED"
        actor: Auditor
        preconditions:
          - "verification_status == DISPUTED"
          - "settlement_status == PENDING"
        side_effects:
          - "version += 1"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "system cascade from seller node {ACTIVE, SUSPENDED} -> RETIRED"
        actor: system
        preconditions:
          - "verification_status == UNVERIFIED"
          - "settlement_status == PENDING"
        side_effects:
          - "seller node reserved_output_kg -= volume_kg"
          - "version += 1"
      - from: DISPUTED
        to: REJECTED
        trigger: "system cascade from seller node {ACTIVE, SUSPENDED} -> RETIRED"
        actor: system
        preconditions:
          - "verification_status == DISPUTED"
          - "settlement_status == PENDING"
        side_effects:
          - "version += 1"

  - entity: TradeTransaction
    dimension: settlement_status
    shape: parallel_dimension_linear_with_compensation
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /fairtrade/trade-transactions/{id}/settle"
        actor: CertificationOfficer
        preconditions:
          - "settlement_status == PENDING"
          - "verification_status == VERIFIED"
          - "seller SupplyChainNode status == ACTIVE"
          - "seller node holder certificate_status IN {CERTIFIED, TRANSITIONING}"
        side_effects:
          - "settled_at = clock_now"
          - "seller node: reserved_output_kg -= volume_kg and claimed_output_kg += volume_kg, so available_credit_kg is unchanged; node version += 1"
          - "buyer node: certified_input_kg += round_half_up(volume_kg * buyer_node.conversion_ratio, 3); node version += 1"
          - "a PremiumLedgerEntry with entry_type = ACCRUAL, amount_cents = premium_cents, trade_transaction_id = this transaction and fund_id = the seller holder's PremiumFund is appended"
          - "that ledger append itself drives the fund: total_accrued_cents += premium_cents, balance_cents += premium_cents, balance_after_cents stamped on the entry, fund version += 1"
          - "the fund balance change itself drives the committee: if the seller holder has a PremiumCommittee with status == FORMING and balance_cents >= COMMITTEE_ACTIVATION_THRESHOLD_CENTS it transitions FORMING -> ACTIVE; if status == RESTRICTED and balance_cents >= LOW_BALANCE_THRESHOLD_CENTS it transitions RESTRICTED -> ACTIVE"
          - "seller holder annual_certified_volume_kg recomputed; holder version += 1"
        note: "cascade depth 3: transaction -> ledger entry / fund -> committee"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /fairtrade/trade-transactions/{id}/void"
        actor: CertificationOfficer
        preconditions:
          - "settlement_status == SETTLED"
          - "the seller holder's PremiumFund balance_cents >= premium_cents"
        side_effects:
          - "voided_at = clock_now"
          - "seller node: claimed_output_kg -= volume_kg, so available_credit_kg returns to its pre-creation value; node version += 1"
          - "buyer node: certified_input_kg -= round_half_up(volume_kg * buyer_node.conversion_ratio, 3); node version += 1"
          - "a PremiumLedgerEntry with entry_type = REVERSAL, amount_cents = premium_cents is appended; total_accrued_cents -= premium_cents, balance_cents -= premium_cents, fund version += 1"
          - "if the committee status == ACTIVE and balance_cents < LOW_BALANCE_THRESHOLD_CENTS it transitions ACTIVE -> RESTRICTED"
          - "seller holder annual_certified_volume_kg recomputed; holder version += 1"
        note: "compensating action for the settle transition; verification_status is deliberately left untouched"

  - entity: PremiumUseProposal
    dimension: status
    shape: branching_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [REJECTED, DISBURSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: UNDER_VOTE
        trigger: "POST /fairtrade/premium-use-proposals/{id}/open-vote"
        actor: CommitteeChair
        preconditions:
          - "status == DRAFT"
          - "acting X-User-ID == committee chair_user_id"
          - "committee status == ACTIVE"
          - "committee holder certificate_status IN {CERTIFIED, TRANSITIONING}"
        side_effects:
          - "version += 1"
      - from: UNDER_VOTE
        to: APPROVED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/close-vote when calculations.proposal_vote_tally yields outcome APPROVED"
        actor: CommitteeChair
        preconditions:
          - "status == UNDER_VOTE"
          - "acting X-User-ID == committee chair_user_id"
          - "turnout_pct >= committee quorum_pct AND approval_pct >= APPROVAL_PCT"
          - "the fund balance_cents >= requested_amount_cents"
        side_effects:
          - "turnout_pct and approval_pct stamped; approved_at = clock_now"
          - "a PremiumLedgerEntry with entry_type = COMMITMENT, amount_cents = requested_amount_cents, proposal_id = this proposal is appended"
          - "that ledger append itself drives the fund: balance_cents -= requested_amount_cents, committed_cents += requested_amount_cents, total_accrued_cents unchanged, pending_proposal_count -= 1, fund version += 1"
          - "the fund balance change itself drives the committee: if committee status == ACTIVE and balance_cents < LOW_BALANCE_THRESHOLD_CENTS the committee transitions ACTIVE -> RESTRICTED"
          - "the committee restriction itself drives the siblings: every other PremiumUseProposal of that committee with status == DRAFT transitions DRAFT -> CANCELLED with cancelled_at = clock_now, ordered by created_at ASC"
          - "version += 1 on every mutated row"
        note: "cascade depth 4: proposal -> ledger entry / fund -> committee -> sibling DRAFT proposals"
      - from: UNDER_VOTE
        to: REJECTED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/close-vote when calculations.proposal_vote_tally yields outcome REJECTED"
        actor: CommitteeChair
        preconditions:
          - "status == UNDER_VOTE"
          - "acting X-User-ID == committee chair_user_id"
          - "turnout_pct >= committee quorum_pct AND approval_pct < APPROVAL_PCT"
        side_effects:
          - "turnout_pct and approval_pct stamped"
          - "fund pending_proposal_count -= 1, fund version += 1"
          - "no ledger entry is written and balance_cents is untouched"
          - "version += 1"
        note: "divergent side-effect set versus the APPROVED branch of the same fork"
      - from: UNDER_VOTE
        to: REVISION_REQUESTED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/close-vote when calculations.proposal_vote_tally yields outcome REVISION_REQUESTED (turnout below quorum)"
        actor: CommitteeChair
        preconditions:
          - "status == UNDER_VOTE"
          - "acting X-User-ID == committee chair_user_id"
          - "turnout_pct < committee quorum_pct"
        side_effects:
          - "turnout_pct and approval_pct stamped"
          - "current_round += 1"
          - "no ledger entry is written; pending_proposal_count is untouched"
          - "version += 1"
        note: "third branch of the same fork; ballots from the previous round remain but no longer count because they carry the old round_number"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /fairtrade/premium-use-proposals/{id}/revise"
        actor: CommitteeChair
        preconditions:
          - "status == REVISION_REQUESTED"
          - "acting X-User-ID == committee chair_user_id"
        side_effects:
          - "requested_amount_cents, title and use_category replaced by the request body"
          - "turnout_pct = null, approval_pct = null"
          - "version += 1"
        note: "closes the UNDER_VOTE -> REVISION_REQUESTED -> DRAFT -> UNDER_VOTE revision loop"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/disburse"
        actor: CertificationOfficer
        preconditions:
          - "status == APPROVED"
          - "committee holder certificate_status != SUSPENDED"
          - "the fund committed_cents >= requested_amount_cents"
        side_effects:
          - "disbursed_at = clock_now"
          - "a PremiumLedgerEntry with entry_type = DISBURSEMENT, amount_cents = requested_amount_cents is appended"
          - "fund: committed_cents -= requested_amount_cents, disbursed_cents += requested_amount_cents, total_accrued_cents and balance_cents unchanged, fund version += 1"
          - "version += 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/cancel"
        actor: CommitteeChair
        preconditions:
          - "status == APPROVED"
          - "acting X-User-ID == committee chair_user_id"
        side_effects:
          - "cancelled_at = clock_now"
          - "a PremiumLedgerEntry with entry_type = RELEASE, amount_cents = requested_amount_cents is appended"
          - "fund: committed_cents -= requested_amount_cents, balance_cents += requested_amount_cents, total_accrued_cents unchanged, fund version += 1"
          - "if committee status == RESTRICTED and balance_cents >= LOW_BALANCE_THRESHOLD_CENTS the committee transitions RESTRICTED -> ACTIVE"
          - "version += 1"
        note: "compensating action for the APPROVED commitment; leaves total_accrued_cents == balance_cents + committed_cents + disbursed_cents intact and restores balance_cents exactly"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fairtrade/premium-use-proposals/{id}/cancel OR system cascade from committee ACTIVE -> RESTRICTED"
        actor: CommitteeChair | system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "cancelled_at = clock_now"
          - "fund pending_proposal_count -= 1, fund version += 1"
          - "no ledger entry is written"
          - "version += 1"

  - entity: PremiumCommittee
    dimension: status
    shape: cyclic
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "system cascade from TradeTransaction settle when the fund balance_cents crosses COMMITTEE_ACTIVATION_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "status == FORMING"
          - "fund balance_cents >= COMMITTEE_ACTIVATION_THRESHOLD_CENTS"
        side_effects:
          - "version += 1"
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system cascade from PremiumUseProposal UNDER_VOTE -> APPROVED, or from TradeTransaction void, when the fund balance_cents drops below LOW_BALANCE_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "fund balance_cents < LOW_BALANCE_THRESHOLD_CENTS"
        side_effects:
          - "every PremiumUseProposal of this committee with status == DRAFT transitions DRAFT -> CANCELLED, ordered by created_at ASC"
          - "version += 1 on the committee and on each cancelled proposal"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system cascade from TradeTransaction settle or PremiumUseProposal APPROVED -> CANCELLED when the fund balance_cents returns to LOW_BALANCE_THRESHOLD_CENTS or above"
        actor: system
        preconditions:
          - "status == RESTRICTED"
          - "fund balance_cents >= LOW_BALANCE_THRESHOLD_CENTS"
        side_effects:
          - "version += 1"
        note: "closes the ACTIVE -> RESTRICTED -> ACTIVE cycle"
      - from: FORMING
        to: DISSOLVED
        trigger: "system cascade from CertificateHolder -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == FORMING"
        side_effects:
          - "version += 1"
      - from: ACTIVE
        to: DISSOLVED
        trigger: "system cascade from CertificateHolder -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "version += 1"
      - from: RESTRICTED
        to: DISSOLVED
        trigger: "system cascade from CertificateHolder -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == RESTRICTED"
        side_effects:
          - "version += 1"

  - entity: Audit
    dimension: status
    shape: linear_with_branch
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /fairtrade/audits/{id}/start"
        actor: Auditor
        preconditions:
          - "status == SCHEDULED"
          - "acting X-User-ID == auditor_user_id"
          - "clock_now date >= window_start"
          - "holder certificate_status IN {CERTIFIED, SUSPENDED, TRANSITIONING}"
        side_effects:
          - "started_at = clock_now"
          - "version += 1"
      - from: IN_PROGRESS
        to: REPORT_PENDING
        trigger: "system, on the first successful POST /fairtrade/audits/{id}/nonconformities"
        actor: system
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "nonconformity_count and open_nonconformity_count recomputed"
          - "version += 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /fairtrade/audits/{id}/close"
        actor: CertificationOfficer
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "closed_at = clock_now"
          - "holder compliance_score and next_audit_due_at recomputed per calculations.holder_compliance_score_and_deadline steps 4 and 5; holder version += 1"
          - "version += 1"
      - from: REPORT_PENDING
        to: CLOSED
        trigger: "POST /fairtrade/audits/{id}/close"
        actor: CertificationOfficer
        preconditions:
          - "status == REPORT_PENDING"
          - "open_nonconformity_count == 0, i.e. no Nonconformity of this audit has status IN {OPEN, CAP_SUBMITTED, CAP_REJECTED, OVERDUE, ESCALATED}, per validation priority 34"
        side_effects:
          - "closed_at = clock_now"
          - "holder compliance_score and next_audit_due_at recomputed; holder version += 1"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from CertificateHolder -> DECERTIFIED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "version += 1"

  - entity: Nonconformity
    dimension: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLOSED, ESCALATED]
    transitions:
      - from: OPEN
        to: CAP_SUBMITTED
        trigger: "POST /fairtrade/nonconformities/{id}/cap-submissions"
        actor: ProducerRepresentative
        preconditions:
          - "status == OPEN"
          - "acting X-User-ID == the audit's holder_id"
          - "clock_now <= deadline_at"
        side_effects:
          - "cap_round += 1, cap_narrative = request narrative, cap_submitted_at = clock_now"
          - "audit open_nonconformity_count recomputed"
          - "version += 1"
      - from: CAP_REJECTED
        to: CAP_SUBMITTED
        trigger: "POST /fairtrade/nonconformities/{id}/cap-submissions"
        actor: ProducerRepresentative
        preconditions:
          - "status == CAP_REJECTED"
          - "acting X-User-ID == the audit's holder_id"
          - "clock_now <= deadline_at"
        side_effects:
          - "cap_round += 1, cap_narrative replaced, cap_submitted_at = clock_now"
          - "version += 1"
        note: "closes the CAP_SUBMITTED -> CAP_REJECTED -> CAP_SUBMITTED resubmission loop"
      - from: CAP_SUBMITTED
        to: CAP_REJECTED
        trigger: "POST /fairtrade/nonconformities/{id}/cap-review with decision = REJECT"
        actor: Auditor | CertificationOfficer
        preconditions:
          - "status == CAP_SUBMITTED"
          - "acting X-User-ID != raised_by_user_id"
        side_effects:
          - "cap_reviewed_at = clock_now"
          - "version += 1"
      - from: CAP_SUBMITTED
        to: CLOSED
        trigger: "POST /fairtrade/nonconformities/{id}/cap-review with decision = ACCEPT"
        actor: Auditor | CertificationOfficer
        preconditions:
          - "status == CAP_SUBMITTED"
          - "acting X-User-ID != raised_by_user_id"
        side_effects:
          - "closed_at = clock_now, cap_reviewed_at = clock_now"
          - "audit nonconformity_count and open_nonconformity_count recomputed; audit version += 1"
          - "holder compliance_score, open_*_count and next_audit_due_at recomputed; holder version += 1"
          - "version += 1"
      - from: OPEN
        to: OVERDUE
        trigger: "system, inside POST /fairtrade/compliance-sweeps step 1, when deadline_at < clock_now"
        actor: system
        preconditions:
          - "status == OPEN"
          - "deadline_at < clock_now"
        side_effects:
          - "version += 1"
      - from: CAP_SUBMITTED
        to: OVERDUE
        trigger: "system, inside POST /fairtrade/compliance-sweeps step 1, when deadline_at < clock_now"
        actor: system
        preconditions:
          - "status == CAP_SUBMITTED"
          - "deadline_at < clock_now"
        side_effects:
          - "version += 1"
      - from: CAP_REJECTED
        to: OVERDUE
        trigger: "system, inside POST /fairtrade/compliance-sweeps step 1, when deadline_at < clock_now"
        actor: system
        preconditions:
          - "status == CAP_REJECTED"
          - "deadline_at < clock_now"
        side_effects:
          - "version += 1"
      - from: OVERDUE
        to: ESCALATED
        trigger: "system, inside POST /fairtrade/compliance-sweeps step 2, applied to rows that step 1 just moved to OVERDUE as well as rows already OVERDUE, when clock_now >= deadline_at + escalation_grace_days days"
        actor: system
        preconditions:
          - "status == OVERDUE"
          - "clock_now >= deadline_at + escalation_grace_days days"
        side_effects:
          - "if grade IN {CRITICAL, MAJOR} then the audit's CertificateHolder transitions CERTIFIED -> SUSPENDED with suspension_reason = NONCONFORMITY_ESCALATION, which itself cascades to nodes and then to transactions per the CertificateHolder machine"
          - "holder open_*_count and compliance_score recomputed"
          - "version += 1"
        note: "second hop of the sweep cascade; caused by the OVERDUE hop, not directly by the sweep request"
  - entity: MarkUsageRequest
    dimension: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fairtrade/mark-usage-requests/{id}/decide with decision = APPROVE"
        actor: CertificationOfficer
        preconditions:
          - "status == SUBMITTED"
          - "brand holder label_license_status == ACTIVE"
          - "brand holder license_fee_settled == true"
          - "when claim_type == FT_CERTIFIED_100, calculations.upstream_traceability_chain returns chain_mode == ALL_PHYSICAL for the brand holder"
        side_effects:
          - "decided_by_user_id = acting X-User-ID, decided_at = clock_now, decision_reason = request body reason"
          - "version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fairtrade/mark-usage-requests/{id}/decide with decision = REJECT"
        actor: CertificationOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_by_user_id = acting X-User-ID, decided_at = clock_now, decision_reason = request body reason"
          - "version += 1"
        note: "divergent side-effect set: the REJECT branch skips every licence and traceability precondition of the APPROVE branch"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system cascade from CertificateHolder CERTIFIED -> SUSPENDED"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decision_reason = 'HOLDER_SUSPENDED', decided_at = clock_now"
          - "version += 1"

# =====================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's version only)
# =====================================================================
concurrency_rules:
  - rule_id: proposal-create-stale-fund
    parent_entity: PremiumFund
    write_endpoint: "POST /fairtrade/premium-use-proposals"
    occ_field: "expected_fund_version"
    description: |
      Creating a PremiumUseProposal against a PremiumFund whose version has advanced since the
      client last read it is rejected. Proposal creation is gated on the fund's balance_cents and
      bumps pending_proposal_count, so a client that drafted its request against an earlier fund
      snapshot may be asking for money another approved proposal has already committed. The rule
      is a stale-version check, not a timing rule: a client that reads fund.version, creates one
      proposal (advancing the version), then submits a second create still carrying the old
      version is deterministically rejected.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
  - rule_id: transaction-create-stale-seller-node
    parent_entity: SupplyChainNode
    write_endpoint: "POST /fairtrade/trade-transactions"
    occ_field: "expected_seller_node_version"
    description: |
      Creating a TradeTransaction against a seller SupplyChainNode whose version has advanced
      since the client last read it is rejected. Transaction creation reserves mass-balance credit
      out of available_credit_kg and bumps the node's version, so a create carrying a stale node
      version is asking to reserve credit that a previously created transaction may already hold.
      Sequential requests suffice to trigger it: read node.version, create one transaction, then
      submit a second create still carrying the pre-create version.
    error_id: ERR_STALE_NODE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: minimum_price_floor
    trigger: "on POST /fairtrade/trade-transactions, before the transaction row is persisted; the four outputs are frozen at creation and never recomputed"
    algorithm: threshold
    formula: |
      # step 1 — applied floor (3 additive inputs, two of them conditional)
      applied_floor_cents_per_kg =
          MIN_FOB_PRICE_CENTS_PER_KG[product_code]
        + (ORGANIC_DIFFERENTIAL_CENTS_PER_KG if is_organic else 0)
        + QUALITY_DIFFERENTIAL_CENTS_PER_KG[quality_grade]

      # step 2 — the fair trade floor never lowers a freely negotiated higher price
      settled_unit_price_cents_per_kg = max(declared_unit_price_cents_per_kg,
                                            applied_floor_cents_per_kg)

      # step 3 — the top-up the buyer owes because of the floor
      floor_topup_cents = round_half_up(
          (settled_unit_price_cents_per_kg - declared_unit_price_cents_per_kg) * volume_kg, 0)

      # step 4 — contract value at the settled price
      gross_value_cents = round_half_up(settled_unit_price_cents_per_kg * volume_kg, 0)
    input_set: "exactly one TradeTransaction request body plus the two constant tables; no other rows are read"
    constants:
      MIN_FOB_PRICE_CENTS_PER_KG: { COFFEE_ARABICA: 320, COCOA: 260, BANANA: 45 }
      ORGANIC_DIFFERENTIAL_CENTS_PER_KG: 80
      QUALITY_DIFFERENTIAL_CENTS_PER_KG: { STANDARD: 0, SPECIALTY: 40 }
    precision: "cents, integer; round_half_up on the absolute value then reapply the sign; volume_kg carries 3 decimals"

  - name: community_development_premium
    trigger: "on POST /fairtrade/trade-transactions, immediately after calculations.minimum_price_floor; premium_cents, premium_volume_kg and premium_basis are frozen at creation and are NOT recomputed at verify, settle or void"
    algorithm: tiered_pricing
    formula: |
      # shared base rate (uplift is a conditional multiplier, not an additive tier)
      base_rate_cents_per_kg = PREMIUM_RATE_CENTS_PER_KG[product_code]
                             * (1 + ORGANIC_PREMIUM_UPLIFT_PCT if is_organic else 1)

      # variant selection is structural: it is the SELLER node's traceability_mode
      premium_basis = "PHYSICAL_TRACEABILITY" if seller_node.traceability_mode == "PHYSICAL"
                      else "MASS_BALANCE"

      if premium_basis == "PHYSICAL_TRACEABILITY":
          premium_volume_kg = volume_kg
          premium_cents = round_half_up(base_rate_cents_per_kg * volume_kg, 0)
      else:
          # mass balance is accounted lot by lot; ROUNDING ORDER IS PINNED:
          # round each full lot to whole cents FIRST, then multiply by the lot count,
          # then round the remainder lot separately and add. Summing the exact products
          # and rounding once at the end is WRONG and yields a different figure.
          full_lots      = floor(volume_kg / MASS_BALANCE_LOT_SIZE_KG)
          remainder_kg   = volume_kg - full_lots * MASS_BALANCE_LOT_SIZE_KG
          per_lot_cents  = round_half_up(base_rate_cents_per_kg * MASS_BALANCE_LOT_SIZE_KG
                                         * MASS_BALANCE_ATTRIBUTION_FACTOR, 0)
          remainder_cents = round_half_up(base_rate_cents_per_kg * remainder_kg
                                          * MASS_BALANCE_ATTRIBUTION_FACTOR, 0)
          premium_volume_kg = volume_kg
          premium_cents = full_lots * per_lot_cents + remainder_cents
    input_set: "the TradeTransaction request body plus seller_node.traceability_mode read at creation time; no other rows"
    constants:
      PREMIUM_RATE_CENTS_PER_KG: { COFFEE_ARABICA: 80, COCOA: 60, BANANA: 15 }
      ORGANIC_PREMIUM_UPLIFT_PCT: 0.25
      MASS_BALANCE_LOT_SIZE_KG: 1000
      MASS_BALANCE_ATTRIBUTION_FACTOR: 0.9725
    precision: "cents, integer; round_half_up per the pinned order above"
    variants:
      - name: PHYSICAL_TRACEABILITY
        when: "seller_node.traceability_mode == PHYSICAL"
        difference: "the whole shipment volume is premium-bearing and the product is rounded exactly once, at the end"
      - name: MASS_BALANCE
        when: "seller_node.traceability_mode == MASS_BALANCE"
        difference: "the shipment is decomposed into MASS_BALANCE_LOT_SIZE_KG lots, each lot's premium is discounted by MASS_BALANCE_ATTRIBUTION_FACTOR and rounded to whole cents before the lots are summed; for identical inputs this yields a strictly smaller premium than PHYSICAL_TRACEABILITY"

  - name: label_license_fee
    trigger: "on POST /fairtrade/certificate-holders/{id}/label-license; recomputed in full on every re-issue for a new license_year"
    algorithm: tiered_pricing
    formula: |
      v = licensed_volume_kg
      t1_kg = min(v, LICENSE_TIER_1_CAP_KG)
      t2_kg = max(0, min(v, LICENSE_TIER_2_CAP_KG) - LICENSE_TIER_1_CAP_KG)
      t3_kg = max(0, v - LICENSE_TIER_2_CAP_KG)

      # ROUNDING ORDER IS PINNED: each marginal tier fee is rounded to whole cents
      # BEFORE the tiers are summed.
      t1_cents = round_half_up(t1_kg * LICENSE_TIER_1_RATE_CENTS_PER_KG, 0)
      t2_cents = round_half_up(t2_kg * LICENSE_TIER_2_RATE_CENTS_PER_KG, 0)
      t3_cents = round_half_up(t3_kg * LICENSE_TIER_3_RATE_CENTS_PER_KG, 0)
      volume_fee_cents = t1_cents + t2_cents + t3_cents

      subtotal_cents   = LICENSE_BASE_FEE_CENTS + volume_fee_cents
      surcharge_cents  = round_half_up(subtotal_cents * LICENSE_ADMIN_SURCHARGE_PCT, 0)
      license_fee_cents = subtotal_cents + surcharge_cents

      # tier label uses <= at both breakpoints
      license_tier = "TIER_1" if v <= LICENSE_TIER_1_CAP_KG
                     else ("TIER_2" if v <= LICENSE_TIER_2_CAP_KG else "TIER_3")
      license_fee_settled = (license_fee_paid_cents >= license_fee_cents) and (license_fee_cents > 0)
    input_set: "licensed_volume_kg from the request body only; annual_certified_volume_kg is NOT used here"
    constants:
      LICENSE_TIER_1_CAP_KG: 100000
      LICENSE_TIER_2_CAP_KG: 500000
      LICENSE_TIER_1_RATE_CENTS_PER_KG: 1.20
      LICENSE_TIER_2_RATE_CENTS_PER_KG: 0.80
      LICENSE_TIER_3_RATE_CENTS_PER_KG: 0.45
      LICENSE_BASE_FEE_CENTS: 250000
      LICENSE_ADMIN_SURCHARGE_PCT: 0.035
    precision: "cents, integer, round_half_up; marginal (not average) rates"

  - name: proposal_vote_tally
    trigger: "on POST /fairtrade/premium-use-proposals/{id}/close-vote"
    algorithm: aggregation
    formula: |
      # (a) source rows: CommitteeVote where proposal_id == P.id AND round_number == P.current_round.
      #     Ballots carrying an earlier round_number are excluded, no time window applies,
      #     and the aggregation is order-insensitive (pure counts), so no tie-break is needed.
      ballots       = count(rows)
      approve_count = count(rows where ballot == "APPROVE")

      # (b) turnout denominator is the committee's elected member_count, NOT the ballot count
      turnout_pct = round_half_up(ballots / committee.member_count * 100, 2)

      # (c) approval denominator is the ballot count INCLUDING ABSTAIN ballots
      approval_pct = 0.00 if ballots == 0
                     else round_half_up(approve_count / ballots * 100, 2)

      # (d) three-way outcome; both comparisons are >= at the boundary
      if turnout_pct < committee.quorum_pct:      outcome = "REVISION_REQUESTED"
      elif approval_pct >= APPROVAL_PCT:          outcome = "APPROVED"
      else:                                      outcome = "REJECTED"
    input_set: "CommitteeVote rows for the proposal filtered to round_number == current_round; committee.member_count and committee.quorum_pct"
    constants:
      APPROVAL_PCT: 66.67
    precision: "percentages to 2 decimals, round_half_up; the empty-ballot case yields turnout_pct 0.00 and approval_pct 0.00"

  - name: volume_reconciliation_variance
    trigger: "on POST /fairtrade/volume-reports/{id}/reconcile, where the request body pins the basis"
    algorithm: aggregation
    formula: |
      # candidate transactions for BOTH variants: seller_node.holder_id == report.holder_id
      # AND buyer_node.holder_id == report.counterparty_holder_id
      # AND period_start <= contract_date < period_end   (half-open window)
      # The aggregation is a pure sum, so it is order-insensitive; no tie-break applies.

      if basis == "SELLER_BASIS":
          # the seller's books recognise volume only once it is both verified and paid
          rows = candidates where verification_status == "VERIFIED"
                              AND settlement_status  == "SETTLED"
      else:  # BUYER_BASIS
          # the buyer's books recognise volume on receipt, disputes and unpaid invoices included,
          # and exclude only rows the certification body has finally rejected or reversed
          rows = candidates where verification_status IN {"VERIFIED", "DISPUTED"}
                              AND settlement_status  IN {"PENDING", "SETTLED"}

      counterparty_volume_kg = round_half_up(sum(rows.volume_kg), 3)

      variance_pct = 0.00 if counterparty_volume_kg == 0
                     else round_half_up((declared_volume_kg - counterparty_volume_kg)
                                        / counterparty_volume_kg * 100, 2)

      if abs(variance_pct) > MAX_VARIANCE_HARD_PCT:
          reject the whole request with ERR_VOLUME_VARIANCE_EXCEEDED; no field is written
      elif abs(variance_pct) <= VARIANCE_TOLERANCE_PCT:
          reconciliation_status = "MATCHED"
      else:
          reconciliation_status = "VARIANCE_FLAGGED"
    input_set: "TradeTransaction rows joined to their seller and buyer nodes, filtered by the holder pair, the half-open contract_date window and the basis-specific status sets"
    constants:
      VARIANCE_TOLERANCE_PCT: 2.00
      MAX_VARIANCE_HARD_PCT: 10.00
    precision: "counterparty_volume_kg 3 decimals; variance_pct 2 decimals signed, round_half_up applied to the absolute value then the sign reapplied"
    variants:
      - name: SELLER_BASIS
        when: "request body basis == SELLER_BASIS"
        difference: "counts only VERIFIED and SETTLED rows, so disputed or unpaid shipments shrink the counterparty total and push variance_pct positive"
      - name: BUYER_BASIS
        when: "request body basis == BUYER_BASIS"
        difference: "counts DISPUTED and still-PENDING rows too, so the same underlying rows produce a larger counterparty total and a different, typically negative, variance_pct — and can flip the outcome between MATCHED, VARIANCE_FLAGGED and outright rejection"

  - name: holder_compliance_score_and_deadline
    trigger: "steps 1 to 4 on POST /fairtrade/audits/{id}/nonconformities; steps 4 and 5 again on Nonconformity CAP_SUBMITTED -> CLOSED and on Audit -> CLOSED; step 4 again inside POST /fairtrade/compliance-sweeps whenever a finding changes status"
    algorithm: constraint_propagation
    formula: |
      # ---- EVALUATION ORDER IS PINNED. The score feeds the deadline and the deadline's own
      # ---- finding feeds the score, so the order below is the only well-defined reading.

      # step 1: score the holder BEFORE the new finding is inserted
      open_filter = status IN {OPEN, CAP_SUBMITTED, CAP_REJECTED, OVERDUE, ESCALATED}
      n_critical = count(Nonconformity where audit.holder_id == H AND grade == CRITICAL AND open_filter)
      n_major    = same with grade == MAJOR
      n_minor    = same with grade == MINOR
      compliance_score_before = max(0, 100 - (SCORE_WEIGHT_CRITICAL * n_critical
                                            + SCORE_WEIGHT_MAJOR    * n_major
                                            + SCORE_WEIGHT_MINOR    * n_minor))
      # OBSERVATION findings carry weight 0 and never move the score.

      # step 2: pick the deadline multiplier and the escalation grace from THAT score
      if   compliance_score_before >= 90: multiplier, grace_days = 1.5, 14
      elif compliance_score_before >= 70: multiplier, grace_days = 1.0, 7
      else:                               multiplier, grace_days = 0.5, 0

      # step 3: freeze the finding's deadline and grace on the row
      compliance_score_at_raise = compliance_score_before
      escalation_grace_days     = grace_days
      deadline_at = clock_now + floor(BASE_CAP_DAYS[grade] * multiplier) days

      # step 4: ONLY NOW insert the finding and recompute the holder aggregates INCLUDING it
      holder.open_critical_count / open_major_count / open_minor_count = recount with open_filter
      holder.compliance_score = max(0, 100 - (40*n_critical' + 15*n_major' + 5*n_minor'))

      # step 5: audit cadence follows the post-insert score, anchored on the latest CLOSED audit
      #         (anchor = max(window_end) over Audit rows with status == CLOSED for this holder;
      #          ties on window_end are broken by created_at ASC; null when no audit is CLOSED)
      if holder.compliance_score >= 90:  interval_months = 24
      elif holder.compliance_score >= 70: interval_months = 12
      else:                               interval_months = 6
      holder.next_audit_due_at = anchor_window_end + interval_months months, or null when anchor is null
    input_set: "all Nonconformity rows reachable through Audit.holder_id == H, filtered by open_filter; the finding being raised is excluded in step 1 and included from step 4 onward"
    constants:
      SCORE_WEIGHT_CRITICAL: 40
      SCORE_WEIGHT_MAJOR: 15
      SCORE_WEIGHT_MINOR: 5
      SCORE_WEIGHT_OBSERVATION: 0
      BASE_CAP_DAYS: { CRITICAL: 7, MAJOR: 30, MINOR: 90, OBSERVATION: 180 }
    precision: "compliance_score integer 0..100; deadline_at truncated to whole days via floor() on the multiplied day count; months added calendar-wise, clamping to the last day of the target month"

  - name: upstream_traceability_chain
    trigger: "on POST /fairtrade/supply-chain-nodes (cycle and depth guards), on POST /fairtrade/mark-usage-requests/{id}/decide with decision APPROVE, and on GET /fairtrade/certificate-holders/{id}/traceability-summary"
    algorithm: topological
    formula: |
      # walk upstream_node_id from a start node until it is null
      def walk(start_node):
          seen = []
          cur  = start_node
          while cur is not null:
              # a repeat id is unreachable through the API: upstream_node_id is input-only at
              # create time and always names a pre-existing row, so the graph is acyclic by
              # construction; the length guard below is the only traversal bound.
              seen.append(cur.id)
              if len(seen) > MAX_CHAIN_DEPTH + 1: raise ERR_SUPPLY_CHAIN_DEPTH_EXCEEDED
              cur = node(cur.upstream_node_id)
          return seen                       # ordered from start upward, deterministic

      chain_depth(node) = 0 if node.upstream_node_id is null
                          else chain_depth(node.upstream_node_id) + 1

      # brand-side claim eligibility: the brand holder's BRAND_NODE rows and everything above them
      brand_nodes = SupplyChainNode where holder_id == H AND node_role == "BRAND_NODE"
                    AND status IN {ACTIVE, SUSPENDED}, ordered by created_at ASC
      chain_nodes = union of walk(n) for n in brand_nodes
      chain_mode  = "ALL_PHYSICAL" if every node in chain_nodes has traceability_mode == "PHYSICAL"
                    else "CONTAINS_MASS_BALANCE"
      chain_node_count = count(chain_nodes)
      # empty brand_nodes set is NOT ALL_PHYSICAL: chain_mode = "NO_CHAIN" and an
      # FT_CERTIFIED_100 approval is refused with ERR_TRACEABILITY_MODE_MISMATCH.
    input_set: "SupplyChainNode rows reachable by transitive upstream_node_id from the holder's BRAND_NODE rows whose status IN {ACTIVE, SUSPENDED}; RETIRED and REGISTERED nodes are excluded from the start set but are still traversed when they appear upstream"
    constants:
      MAX_CHAIN_DEPTH: 6
    precision: "integer counts; traversal is deterministic because upstream_node_id is single-valued"

  - name: mass_balance_credit_ledger
    trigger: "on POST /fairtrade/supply-chain-nodes/{id}/harvest-declarations, POST /fairtrade/trade-transactions, and every TradeTransaction verification or settlement transition that touches a node"
    algorithm: aggregation
    formula: |
      # the conserved physical-volume identity, enforced after EVERY mutation of any of the three
      # stored quantities; a mutation that would break it is a defect, not a rounding artefact
      available_credit_kg = round_half_up(certified_input_kg - claimed_output_kg
                                         - reserved_output_kg, 3)
      INVARIANT: available_credit_kg >= 0 for every SupplyChainNode whose traceability_mode is
                 MASS_BALANCE, at all times. A PHYSICAL node is not credit-gated at create time,
                 so its available_credit_kg MAY go negative; the field is still stored and
                 reported with the same formula and precision.

      # writers, in the order the transitions apply them
      harvest declaration:  certified_input_kg += certified_volume_kg
      transaction create:   reserved_output_kg += volume_kg
      verify -> DISPUTED:   reserved_output_kg -= volume_kg
      DISPUTED -> VERIFIED: reserved_output_kg += volume_kg
      -> REJECTED:          reserved_output_kg -= volume_kg   (only from a reserved state)
      settle:               reserved_output_kg -= volume_kg ; claimed_output_kg += volume_kg
                            buyer.certified_input_kg += round_half_up(volume_kg
                                                        * buyer.conversion_ratio, 3)
      void:                 claimed_output_kg -= volume_kg
                            buyer.certified_input_kg -= round_half_up(volume_kg
                                                        * buyer.conversion_ratio, 3)

      # the gate applied at transaction create time, ONLY for mass-balance sellers
      if seller_node.traceability_mode == "MASS_BALANCE" and volume_kg > seller_node.available_credit_kg:
          reject with ERR_MASS_BALANCE_CREDIT_EXCEEDED
      # PHYSICAL sellers are not credit-gated at create time: physical traceability is proven by
      # the chain, not by a running balance.
    input_set: "the three stored quantities on a single SupplyChainNode row plus the volume_kg of the transaction being applied"
    precision: "kilograms, 3 decimals, round_half_up; the create-time gate uses > (strictly greater) so volume_kg exactly equal to available_credit_kg is accepted"

  - name: premium_fund_conservation
    trigger: "after every PremiumLedgerEntry append, i.e. on TradeTransaction settle and void, and on PremiumUseProposal close-vote APPROVED, disburse and cancel"
    algorithm: aggregation
    formula: |
      signed_amount_cents(entry) = +amount_cents if entry_type == "ACCRUAL"
                                   -amount_cents if entry_type == "REVERSAL"
                                   0             for COMMITMENT, RELEASE, DISBURSEMENT

      # conserved money identity, enforced after EVERY fund mutation
      INVARIANT A: total_accrued_cents == sum(signed_amount_cents over all entries of the fund)
      INVARIANT B: total_accrued_cents == balance_cents + committed_cents + disbursed_cents
      INVARIANT C: balance_cents >= 0 and committed_cents >= 0 and disbursed_cents >= 0

      balance_after_cents is stamped on each entry as the fund's balance_cents immediately
      after the entry is applied; entries are appended in a single deterministic order per
      request and read back ordered by created_at ASC.
    input_set: "all PremiumLedgerEntry rows with fund_id == F, no status filter (the ledger is append-only and has no status)"
    precision: "cents, integer, exact; no rounding occurs in this calculation"

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the declared role list of the endpoint contains X-User-Role"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present, types match, enum members legal, numeric ranges honored (volume_kg > 0, declared_unit_price_cents_per_kg >= 0, requested_amount_cents > 0, member_count >= 3, 0.001 <= conversion_ratio <= 1.000, approved_use_categories non-empty), dates parse as YYYY-MM-DD, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints and all list endpoints"
  - priority: 4
    category: existence
    check: "every path-templated resource exists, validated left to right"
    error_id: "ERR_HOLDER_NOT_FOUND | ERR_NODE_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_NONCONFORMITY_NOT_FOUND | ERR_VOLUME_REPORT_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_MARK_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in declaration order of the endpoint input list"
    error_id: "ERR_HOLDER_NOT_FOUND | ERR_NODE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fairtrade/supply-chain-nodes, POST /fairtrade/premium-committees, POST /fairtrade/trade-transactions, POST /fairtrade/volume-reports, POST /fairtrade/premium-use-proposals, POST /fairtrade/mark-usage-requests, POST /fairtrade/audits"
  - priority: 6
    category: auth
    check: "ownership for entity_backed roles: a ProducerRepresentative or BrandLicensee X-User-ID must equal the CertificateHolder id that owns the target resource, resolved as holder_id for SupplyChainNode / VolumeReport / PremiumCommittee, brand_holder_id for MarkUsageRequest, seller node holder_id for TradeTransaction creation, and the audit's holder_id for a CAP submission"
    error_id: ERR_HOLDER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /fairtrade/supply-chain-nodes, POST /fairtrade/supply-chain-nodes/{id}/harvest-declarations, POST /fairtrade/trade-transactions, POST /fairtrade/volume-reports, POST /fairtrade/mark-usage-requests, POST /fairtrade/nonconformities/{id}/cap-submissions, POST /fairtrade/certificate-holders/{id}/label-license/payments"
  - priority: 7
    category: auth
    check: "chair binding: a CommitteeChair X-User-ID must equal the target committee's chair_user_id; auditor binding: an Auditor starting an audit must have X-User-ID equal to that audit's auditor_user_id"
    error_id: ERR_HOLDER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /fairtrade/premium-use-proposals, POST /fairtrade/premium-use-proposals/{id}/open-vote, POST /fairtrade/premium-use-proposals/{id}/close-vote, POST /fairtrade/premium-use-proposals/{id}/revise, POST /fairtrade/premium-use-proposals/{id}/cancel, POST /fairtrade/audits/{id}/start"
  - priority: 8
    category: auth
    check: "segregation of duties: the X-User-ID reviewing a corrective action plan must differ from the reviewed Nonconformity's raised_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fairtrade/nonconformities/{id}/cap-review"
  - priority: 9
    category: auth
    check: "segregation of duties: the CommitteeChair closing a vote must not appear as a voter_user_id among the ballots of the round being closed"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fairtrade/premium-use-proposals/{id}/close-vote"
  - priority: 10
    category: state
    check: "optimistic concurrency: expected_fund_version equals the target PremiumFund.version, and expected_seller_node_version equals the seller SupplyChainNode.version"
    error_id: "ERR_STALE_FUND_VERSION | ERR_STALE_NODE_VERSION"
    http_status: 412
    applies_to: "POST /fairtrade/premium-use-proposals, POST /fairtrade/trade-transactions"
  - priority: 11
    category: state
    check: "the target resource's own state permits the requested transition per the §1.2 machine for that entity and dimension"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 12
    category: state
    check: "cross-entity: both the seller and the buyer SupplyChainNode must have status == ACTIVE when a TradeTransaction is created, verified out of DISPUTED, or settled"
    error_id: ERR_NODE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fairtrade/trade-transactions, POST /fairtrade/trade-transactions/{id}/verify, POST /fairtrade/trade-transactions/{id}/settle"
  - priority: 13
    category: state
    check: "cross-entity: the committee's CertificateHolder certificate_status must be in {CERTIFIED, TRANSITIONING} before a vote may be opened, and the seller node's holder must be in {CERTIFIED, TRANSITIONING} before a transaction may be settled"
    error_id: ERR_HOLDER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /fairtrade/premium-use-proposals/{id}/open-vote, POST /fairtrade/trade-transactions/{id}/settle"
  - priority: 14
    category: state
    check: "cross-entity: the committee status must be ACTIVE before a vote may be opened on one of its proposals; a FORMING or RESTRICTED committee may draft and revise but not vote"
    error_id: ERR_COMMITTEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fairtrade/premium-use-proposals/{id}/open-vote"
  - priority: 15
    category: business_safety
    check: "the committee's CertificateHolder certificate_status must not be SUSPENDED when a premium use proposal is created or disbursed"
    error_id: ERR_PREMIUM_USE_BLOCKED_BY_SUSPENSION
    http_status: 409
    applies_to: "POST /fairtrade/premium-use-proposals, POST /fairtrade/premium-use-proposals/{id}/disburse"
  - priority: 16
    category: business_safety
    check: "no Nonconformity reachable through the seller node's holder may have status == ESCALATED when a TradeTransaction is created"
    error_id: ERR_OPEN_CRITICAL_NONCONFORMITY
    http_status: 409
    applies_to: "POST /fairtrade/trade-transactions"
  - priority: 17
    category: business_safety
    check: "the brand holder's label_license_status must be ACTIVE both when a mark usage request is created and when it is approved"
    error_id: ERR_LABEL_LICENSE_INACTIVE
    http_status: 409
    applies_to: "POST /fairtrade/mark-usage-requests, POST /fairtrade/mark-usage-requests/{id}/decide"
  - priority: 18
    category: business_safety
    check: "approving an FT_CERTIFIED_100 claim requires calculations.upstream_traceability_chain to return chain_mode == ALL_PHYSICAL; registering a PHYSICAL node directly downstream of a MASS_BALANCE node is likewise refused"
    error_id: ERR_TRACEABILITY_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /fairtrade/mark-usage-requests/{id}/decide, POST /fairtrade/supply-chain-nodes"
  - priority: 19
    category: business_referential
    check: "the buyer node must declare the seller node as its upstream_node_id"
    error_id: ERR_SUPPLY_CHAIN_LINK_MISSING
    http_status: 422
    applies_to: "POST /fairtrade/trade-transactions"
  - priority: 20
    category: business_referential
    check: "the new node's chain_depth, computed as upstream.chain_depth + 1, must not exceed MAX_CHAIN_DEPTH"
    error_id: "ERR_SUPPLY_CHAIN_DEPTH_EXCEEDED"
    http_status: 422
    applies_to: "POST /fairtrade/supply-chain-nodes"
  - priority: 21
    category: business_referential
    check: "ballot uniqueness: no CommitteeVote may already exist with the same (proposal_id, voter_user_id, round_number)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /fairtrade/premium-use-proposals/{id}/votes"
  - priority: 22
    category: business_referential
    check: "exactly one PremiumCommittee may exist per CertificateHolder with status != DISSOLVED, and a committee may only be created for a holder with holder_type == PRODUCER_ORG"
    error_id: ERR_COMMITTEE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /fairtrade/premium-committees"
  - priority: 23
    category: business_temporal
    check: "window_end must be strictly after window_start and window_start must not be earlier than the logical clock's current date"
    error_id: ERR_INVALID_AUDIT_WINDOW
    http_status: 422
    applies_to: "POST /fairtrade/audits"
  - priority: 24
    category: business_temporal
    check: "auditor resource exclusion with a travel buffer: reject when the same auditor_user_id already holds an Audit with status IN {SCHEDULED, IN_PROGRESS, REPORT_PENDING} such that new.window_start <= existing.window_end + AUDITOR_TRAVEL_BUFFER_DAYS AND new.window_end >= existing.window_start - AUDITOR_TRAVEL_BUFFER_DAYS (both ends inclusive, buffer applied on both sides, AUDITOR_TRAVEL_BUFFER_DAYS = 3)"
    error_id: ERR_AUDITOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fairtrade/audits"
  - priority: 25
    category: business_temporal
    check: "holder resource exclusion with half-open intervals and no buffer: reject when the same holder_id already holds an Audit with status IN {SCHEDULED, IN_PROGRESS, REPORT_PENDING} such that new.window_start < existing.window_end AND existing.window_start < new.window_end; back-to-back windows that merely touch (existing.window_end == new.window_start) are accepted"
    error_id: ERR_HOLDER_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fairtrade/audits"
  - priority: 26
    category: business_temporal
    check: "a corrective action plan may only be submitted while clock_now <= deadline_at; OVERDUE and ESCALATED findings refuse submissions"
    error_id: ERR_CAP_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /fairtrade/nonconformities/{id}/cap-submissions"
  - priority: 27
    category: business_temporal
    check: "volume report periods may not overlap for the same (holder_id, counterparty_holder_id) pair: reject when new.period_start < existing.period_end AND existing.period_start < new.period_end over reports with reconciliation_status IN {SUBMITTED, MATCHED, VARIANCE_FLAGGED}; period_end must be strictly after period_start"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fairtrade/volume-reports"
  - priority: 28
    category: business_temporal
    check: "aggregate interval capacity on the fund: taking the half-open window [use_period_start, use_period_end) of the proposal being approved together with every already-APPROVED proposal of the same committee whose window overlaps it (new.start < other.end AND other.start < new.end; touching windows do not overlap), the sum of requested_amount_cents over that overlapping set including this proposal must not exceed total_accrued_cents * FUND_WINDOW_CAPACITY_PCT / 100"
    error_id: ERR_FUND_PERIOD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fairtrade/premium-use-proposals/{id}/close-vote"
  - priority: 29
    category: business_constraint
    check: "use_category must be a member of the committee's approved_use_categories array"
    error_id: ERR_USE_CATEGORY_NOT_APPROVED
    http_status: 422
    applies_to: "POST /fairtrade/premium-use-proposals, POST /fairtrade/premium-use-proposals/{id}/revise"
  - priority: 30
    category: business_constraint
    check: "mass-balance credit gate: when the seller node traceability_mode == MASS_BALANCE, volume_kg must not be strictly greater than seller_node.available_credit_kg"
    error_id: ERR_MASS_BALANCE_CREDIT_EXCEEDED
    http_status: 422
    applies_to: "POST /fairtrade/trade-transactions"
  - priority: 31
    category: business_fiscal
    check: "the PremiumFund balance_cents must be at least requested_amount_cents at proposal creation and again at vote approval; committed_cents must be at least requested_amount_cents at disbursement; balance_cents must be at least premium_cents when a settled transaction is voided"
    error_id: ERR_FUND_BALANCE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /fairtrade/premium-use-proposals, POST /fairtrade/premium-use-proposals/{id}/close-vote, POST /fairtrade/premium-use-proposals/{id}/disburse, POST /fairtrade/trade-transactions/{id}/void"
  - priority: 32
    category: business_fiscal
    check: "license_fee_settled must be true before a mark usage request may be approved"
    error_id: ERR_LICENSE_FEE_UNPAID
    http_status: 402
    applies_to: "POST /fairtrade/mark-usage-requests/{id}/decide"
  - priority: 33
    category: business_fiscal
    check: "reconciliation hard cap: abs(variance_pct) must not exceed MAX_VARIANCE_HARD_PCT; when it does, nothing is written and the report stays SUBMITTED"
    error_id: ERR_VOLUME_VARIANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /fairtrade/volume-reports/{id}/reconcile"
  - priority: 34
    category: business_safety
    check: "audit closure completeness: an audit may only be closed when its open_nonconformity_count is 0, i.e. every Nonconformity it raised has status CLOSED"
    error_id: ERR_AUDIT_HAS_OPEN_NONCONFORMITIES
    http_status: 409
    applies_to: "POST /fairtrade/audits/{id}/close"

# =====================================================================
# Global constants referenced by §1.2 / §1.4 (the §1.3 tables hold the rest)
# =====================================================================
global_constants:
  AUDITOR_TRAVEL_BUFFER_DAYS: 3
  TRANSITION_WINDOW_DAYS: 90
  COMMITTEE_ACTIVATION_THRESHOLD_CENTS: 1000000
  LOW_BALANCE_THRESHOLD_CENTS: 200000
  FUND_WINDOW_CAPACITY_PCT: 80
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- CertificateHolder ------------------------------------------------
  - method: POST
    path: "/fairtrade/certificate-holders"
    description: "register a certificate holder at a supply chain node position; the holder starts PENDING"
    roles: [CertificationOfficer]
    code: 201
    input: [legal_name, holder_type, country_code, product_code]
    output: CertificateHolder
    side_effects:
      - "certificate_status = PENDING, compliance_score = 100, label_license_status = NONE"
      - "when holder_type == PRODUCER_ORG a PremiumFund row is minted for the holder with total_accrued_cents / balance_cents / committed_cents / disbursed_cents / pending_proposal_count all 0 and fiscal_year = the logical clock's calendar year"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/certify"
    description: "grant certification; PENDING -> CERTIFIED and every REGISTERED node of the holder becomes ACTIVE"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificateHolder
    side_effects:
      - "certificate_status = CERTIFIED, certified_at = clock_now"
      - "cascades REGISTERED -> ACTIVE on every SupplyChainNode of the holder, ordered by created_at ASC"
      - "increments CertificateHolder.version by 1 and each cascaded node's version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/suspend"
    description: "suspend a certified holder; cascades to nodes, then to their unverified transactions, then to licence and mark usage"
    roles: [CertificationOfficer]
    code: 200
    input: [reason]
    output: CertificateHolder
    side_effects:
      - "certificate_status = SUSPENDED, suspension_reason = reason"
      - "cascades ACTIVE -> SUSPENDED on every node, then UNVERIFIED -> DISPUTED with reservation release on those nodes' pending transactions"
      - "label_license_status ACTIVE -> SUSPENDED and SUBMITTED -> WITHDRAWN on the holder's mark usage requests"
      - "increments CertificateHolder.version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/reinstate"
    description: "lift a suspension; SUSPENDED -> CERTIFIED and every SUSPENDED node returns to ACTIVE"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificateHolder
    side_effects:
      - "certificate_status = CERTIFIED, suspension_reason = NONE"
      - "cascades SUSPENDED -> ACTIVE on every node; label_license_status SUSPENDED -> ACTIVE when a licence year is set"
      - "increments CertificateHolder.version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/transition"
    description: "grant a sell-down transition window instead of immediate decertification; SUSPENDED -> TRANSITIONING"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificateHolder
    side_effects:
      - "certificate_status = TRANSITIONING, transition_deadline_at = clock_now + TRANSITION_WINDOW_DAYS days"
      - "cascades SUSPENDED -> ACTIVE on every node so remaining certified stock can be sold"
      - "increments CertificateHolder.version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/decertify"
    description: "decertify the holder; retires nodes, rejects pending transactions, cancels scheduled audits, dissolves the committee, terminates the licence"
    roles: [CertificationOfficer]
    code: 200
    input: [reason]
    output: CertificateHolder
    side_effects:
      - "certificate_status = DECERTIFIED"
      - "cascades node -> RETIRED, then pending transactions -> verification_status REJECTED with reservation release"
      - "SCHEDULED audits -> CANCELLED, committee -> DISSOLVED, label_license_status -> TERMINATED"
      - "increments CertificateHolder.version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/label-license"
    description: "issue or renew the FAIRTRADE mark licence for a licence year and price it from the tiered volume schedule"
    roles: [CertificationOfficer]
    code: 200
    input: [license_year, licensed_volume_kg]
    output: CertificateHolder
    side_effects:
      - "label_license_status = ACTIVE, license_year and licensed_volume_kg stored, license_fee_paid_cents reset to 0"
      - "runs calculations.label_license_fee to set license_tier, license_fee_cents and license_fee_settled"
      - "increments CertificateHolder.version by 1"
  - method: POST
    path: "/fairtrade/certificate-holders/{id}/label-license/payments"
    description: "record a licence fee payment against the current licence year"
    roles: [BrandLicensee]
    code: 201
    input: [amount_cents]
    output: CertificateHolder
    side_effects:
      - "license_fee_paid_cents += amount_cents"
      - "license_fee_settled recomputed as license_fee_paid_cents >= license_fee_cents AND license_fee_cents > 0"
      - "increments CertificateHolder.version by 1"
  - method: GET
    path: "/fairtrade/certificate-holders/{id}"
    description: "read one certificate holder including every computed compliance and licence field"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: CertificateHolder
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders"
    description: "list certificate holders with filtering and pagination"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee, CommitteeChair, CommitteeMember]
    code: 200
    input: ["holder_type?", "certificate_status?", "country_code?", "product_code?", "limit?", "offset?"]
    output: CertificateHolder[]
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/traceability-summary"
    description: "computed read of the holder's certified-volume position and the traceability mode of its whole upstream chain"
    roles: [CertificationOfficer, Auditor, BrandLicensee, ProducerRepresentative]
    code: 200
    input: []
    output: { holder_id: string, chain_mode: string, chain_node_count: integer, brand_node_count: integer, physical_node_count: integer, mass_balance_node_count: integer, total_available_credit_kg: number }
    side_effects: []

  # ---- SupplyChainNode --------------------------------------------------
  - method: POST
    path: "/fairtrade/supply-chain-nodes"
    description: "register a node in the certified supply chain, optionally linked to an upstream node"
    roles: [CertificationOfficer, ProducerRepresentative, BrandLicensee]
    code: 201
    input: [holder_id, node_role, traceability_mode, "upstream_node_id?", "conversion_ratio?"]
    output: SupplyChainNode
    side_effects:
      - "status = ACTIVE when the holder is CERTIFIED or TRANSITIONING, otherwise REGISTERED"
      - "chain_depth = 0 for a root node, else upstream.chain_depth + 1 after the cycle and MAX_CHAIN_DEPTH checks pass"
      - "certified_input_kg / reserved_output_kg / claimed_output_kg = 0 and available_credit_kg = 0"
  - method: POST
    path: "/fairtrade/supply-chain-nodes/{id}/harvest-declarations"
    description: "declare certified input volume arriving at a node, which raises the node's mass-balance credit"
    roles: [ProducerRepresentative]
    code: 201
    input: [certified_volume_kg, harvest_season]
    output: SupplyChainNode
    side_effects:
      - "certified_input_kg += certified_volume_kg"
      - "available_credit_kg recomputed per calculations.mass_balance_credit_ledger"
      - "the holder's annual_certified_volume_kg is increased by certified_volume_kg"
      - "increments SupplyChainNode.version by 1"
  - method: GET
    path: "/fairtrade/supply-chain-nodes/{id}"
    description: "read one supply chain node including its computed credit position"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: []
    output: SupplyChainNode
    side_effects: []
  - method: GET
    path: "/fairtrade/supply-chain-nodes"
    description: "list supply chain nodes filtered by owning holder, upstream parent, status or traceability mode"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: ["holder_id?", "upstream_node_id?", "status?", "traceability_mode?", "node_role?", "limit?", "offset?"]
    output: SupplyChainNode[]
    side_effects: []

  # ---- PremiumCommittee / PremiumFund -----------------------------------
  - method: POST
    path: "/fairtrade/premium-committees"
    description: "constitute the producer committee that governs the holder's premium fund"
    roles: [CertificationOfficer]
    code: 201
    input: [holder_id, chair_user_id, member_count, approved_use_categories, "quorum_pct?"]
    output: PremiumCommittee
    side_effects:
      - "status = FORMING, open_proposal_count = 0"
      - "quorum_pct defaults to 60.00 when omitted"
  - method: GET
    path: "/fairtrade/premium-committees/{id}"
    description: "read one premium committee"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: []
    output: PremiumCommittee
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/premium-committees"
    description: "list the premium committees constituted for one certificate holder"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PremiumCommittee[]
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/premium-funds"
    description: "list the premium funds held by one certificate holder, one per fiscal year"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: PremiumFund[]
    side_effects: []
  - method: GET
    path: "/fairtrade/premium-ledger-entries/{id}"
    description: "read one immutable premium fund ledger entry"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: []
    output: PremiumLedgerEntry
    side_effects: []
  - method: GET
    path: "/fairtrade/premium-ledger-entries"
    description: "list premium fund ledger entries filtered by fund, source transaction, source proposal or entry type"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: ["fund_id?", "trade_transaction_id?", "proposal_id?", "entry_type?", "limit?", "offset?"]
    output: PremiumLedgerEntry[]
    side_effects: []

  # ---- TradeTransaction -------------------------------------------------
  - method: POST
    path: "/fairtrade/trade-transactions"
    description: "record a certified trade between two supply chain nodes, pricing the minimum floor and the community development premium"
    roles: [ProducerRepresentative]
    code: 201
    input: [seller_node_id, buyer_node_id, product_code, quality_grade, volume_kg, declared_unit_price_cents_per_kg, contract_date, expected_seller_node_version, "is_organic?"]
    output: TradeTransaction
    side_effects:
      - "runs calculations.minimum_price_floor to set applied_floor_cents_per_kg, settled_unit_price_cents_per_kg, floor_topup_cents and gross_value_cents"
      - "runs calculations.community_development_premium to set premium_basis, premium_volume_kg and premium_cents"
      - "verification_status = UNVERIFIED, settlement_status = PENDING"
      - "seller node reserved_output_kg += volume_kg and available_credit_kg is recomputed"
      - "increments the seller SupplyChainNode.version by 1 (optimistic concurrency parent)"
  - method: POST
    path: "/fairtrade/trade-transactions/{id}/verify"
    description: "auditor verification outcome for a recorded trade: VERIFIED, DISPUTED or REJECTED"
    roles: [Auditor]
    code: 200
    input: [outcome]
    output: TradeTransaction
    side_effects:
      - "verification_status = outcome, verified_at = clock_now when outcome == VERIFIED"
      - "on DISPUTED or REJECTED the seller node's reserved_output_kg is reduced by volume_kg and available_credit_kg is recomputed"
      - "on a DISPUTED -> VERIFIED re-verification the reservation is re-applied to the seller node"
      - "increments TradeTransaction.version by 1"
  - method: POST
    path: "/fairtrade/trade-transactions/{id}/settle"
    description: "settle a verified trade, accrue its premium into the producer premium fund and possibly activate the committee"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: TradeTransaction
    side_effects:
      - "settlement_status = SETTLED, settled_at = clock_now"
      - "seller node reserved_output_kg -= volume_kg and claimed_output_kg += volume_kg; the buyer node's certified_input_kg += round_half_up(volume_kg * buyer.conversion_ratio, 3), per calculations.mass_balance_credit_ledger"
      - "writes an ACCRUAL PremiumLedgerEntry for premium_cents and raises the fund's total_accrued_cents and balance_cents"
      - "committee FORMING -> ACTIVE when the fund's balance_cents reaches COMMITTEE_ACTIVATION_THRESHOLD_CENTS"
      - "increments TradeTransaction.version by 1"
  - method: POST
    path: "/fairtrade/trade-transactions/{id}/void"
    description: "compensating reversal of a settled trade: reverses the premium accrual and unwinds the claimed volume"
    roles: [CertificationOfficer]
    code: 200
    input: [reason]
    output: TradeTransaction
    side_effects:
      - "settlement_status = REVERSED, voided_at = clock_now"
      - "writes a REVERSAL PremiumLedgerEntry for premium_cents and lowers the fund's total_accrued_cents and balance_cents by the same amount"
      - "the seller node's claimed_output_kg -= volume_kg and the buyer node's certified_input_kg -= round_half_up(volume_kg * buyer.conversion_ratio, 3), exactly unwinding what the settlement applied, per calculations.mass_balance_credit_ledger"
      - "increments TradeTransaction.version by 1"
  - method: GET
    path: "/fairtrade/trade-transactions/{id}"
    description: "read one trade transaction with its priced floor, premium and status fields"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: []
    output: TradeTransaction
    side_effects: []
  - method: GET
    path: "/fairtrade/trade-transactions"
    description: "list trade transactions filtered by seller node, buyer node, verification status or settlement status"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: ["seller_node_id?", "buyer_node_id?", "verification_status?", "settlement_status?", "product_code?", "limit?", "offset?"]
    output: TradeTransaction[]
    side_effects: []

  # ---- VolumeReport -----------------------------------------------------
  - method: POST
    path: "/fairtrade/volume-reports"
    description: "submit a certified volume report for a half-open reporting period against a named counterparty"
    roles: [ProducerRepresentative, BrandLicensee]
    code: 201
    input: [holder_id, counterparty_holder_id, period_start, period_end, declared_volume_kg]
    output: VolumeReport
    side_effects:
      - "reconciliation_status = SUBMITTED, counterparty_volume_kg = 0, variance_pct = 0.00"
  - method: POST
    path: "/fairtrade/volume-reports/{id}/reconcile"
    description: "reconcile the report against the counterparty's settled trades on the chosen basis, flagging variance beyond tolerance"
    roles: [CertificationOfficer]
    code: 200
    input: [basis]
    output: VolumeReport
    side_effects:
      - "runs calculations.volume_reconciliation_variance to set basis, counterparty_volume_kg, variance_pct and reconciliation_status"
      - "reconciled_at = clock_now"
      - "on VARIANCE_FLAGGED the holder's certificate_status CERTIFIED -> SUSPENDED with suspension_reason = VOLUME_VARIANCE and the node cascade of suspension runs"
      - "increments VolumeReport.version by 1"
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/volume-reports"
    description: "list the volume reports a holder filed, or those filed against it as counterparty"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: ["role_in_report?", "reconciliation_status?", "limit?", "offset?"]
    output: VolumeReport[]
    side_effects: []
  - method: GET
    path: "/fairtrade/volume-reports/{id}"
    description: "read one volume report with its reconciliation outcome"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative, BrandLicensee]
    code: 200
    input: []
    output: VolumeReport
    side_effects: []

  # ---- PremiumUseProposal / CommitteeVote -------------------------------
  - method: POST
    path: "/fairtrade/premium-use-proposals"
    description: "committee chair proposes a use of premium funds within an approved use category and a half-open use period"
    roles: [CommitteeChair]
    code: 201
    input: [committee_id, title, use_category, requested_amount_cents, use_period_start, use_period_end, expected_fund_version]
    output: PremiumUseProposal
    side_effects:
      - "status = DRAFT, current_round = 0, turnout_pct = 0.00, approval_pct = 0.00"
      - "the committee's open_proposal_count and the fund's pending_proposal_count each increase by 1"
      - "increments the PremiumFund.version by 1 (optimistic concurrency parent)"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/open-vote"
    description: "open a voting round on a draft proposal"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: PremiumUseProposal
    side_effects:
      - "status = UNDER_VOTE and current_round += 1"
      - "increments PremiumUseProposal.version by 1"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/votes"
    description: "a committee member casts one ballot in the proposal's open round"
    roles: [CommitteeMember]
    code: 201
    input: [ballot, "rationale?"]
    output: CommitteeVote
    side_effects:
      - "records voter_user_id from the X-User-ID header, round_number = the proposal's current_round and cast_at = clock_now"
      - "recomputes the proposal's turnout_pct and approval_pct per calculations.proposal_vote_tally"
      - "increments PremiumUseProposal.version by 1"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/close-vote"
    description: "close the open round and fork on the tally into APPROVED, REJECTED or REVISION_REQUESTED"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: PremiumUseProposal
    side_effects:
      - "runs calculations.proposal_vote_tally, then sets status = APPROVED when quorum and approval are both met, REJECTED when quorum is met and approval is not, and REVISION_REQUESTED when quorum is not met"
      - "on APPROVED: approved_at = clock_now, a COMMITMENT PremiumLedgerEntry is written, the fund's balance_cents falls and committed_cents rises by requested_amount_cents"
      - "on APPROVED: the committee moves ACTIVE -> RESTRICTED when the fund's remaining balance_cents is below LOW_BALANCE_THRESHOLD_CENTS, and every sibling DRAFT proposal of that committee is CANCELLED in created_at ASC order"
      - "on APPROVED or REJECTED the committee's open_proposal_count and the fund's pending_proposal_count each fall by 1"
      - "increments PremiumUseProposal.version by 1"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/revise"
    description: "return a revision-requested proposal to DRAFT with amended terms"
    roles: [CommitteeChair]
    code: 200
    input: [title, use_category, requested_amount_cents]
    output: PremiumUseProposal
    side_effects:
      - "status = DRAFT and the amended title, use_category and requested_amount_cents are stored"
      - "increments PremiumUseProposal.version by 1"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/disburse"
    description: "disburse an approved premium use, moving committed funds out of the fund"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: PremiumUseProposal
    side_effects:
      - "status = DISBURSED, disbursed_at = clock_now"
      - "writes a DISBURSEMENT PremiumLedgerEntry and moves requested_amount_cents from the fund's committed_cents to its disbursed_cents, leaving balance_cents unchanged"
      - "the committee returns RESTRICTED -> ACTIVE when the fund's balance_cents is at or above LOW_BALANCE_THRESHOLD_CENTS"
      - "increments PremiumUseProposal.version by 1"
  - method: POST
    path: "/fairtrade/premium-use-proposals/{id}/cancel"
    description: "cancel a draft, revision-requested or approved proposal, releasing any committed funds"
    roles: [CommitteeChair]
    code: 200
    input: ["reason?"]
    output: PremiumUseProposal
    side_effects:
      - "status = CANCELLED, cancelled_at = clock_now"
      - "when the proposal was APPROVED a RELEASE PremiumLedgerEntry is written and requested_amount_cents moves from the fund's committed_cents back to its balance_cents"
      - "when the proposal was DRAFT or REVISION_REQUESTED the committee's open_proposal_count and the fund's pending_proposal_count each fall by 1"
      - "increments PremiumUseProposal.version by 1"
  - method: GET
    path: "/fairtrade/premium-use-proposals/{id}"
    description: "read one premium use proposal with its tally fields"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: []
    output: PremiumUseProposal
    side_effects: []
  - method: GET
    path: "/fairtrade/premium-committees/{id}/premium-use-proposals"
    description: "list the proposals raised in one committee"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember, ProducerRepresentative]
    code: 200
    input: ["status?", "use_category?", "limit?", "offset?"]
    output: PremiumUseProposal[]
    side_effects: []
  - method: GET
    path: "/fairtrade/premium-use-proposals/{id}/votes"
    description: "list the ballots cast on one proposal across all rounds"
    roles: [CertificationOfficer, Auditor, CommitteeChair, CommitteeMember]
    code: 200
    input: ["round_number?", "ballot?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []

  # ---- Audit / Nonconformity --------------------------------------------
  - method: POST
    path: "/fairtrade/audits"
    description: "schedule an audit for a holder inside a half-open window, respecting auditor travel buffers and holder window exclusivity"
    roles: [CertificationOfficer]
    code: 201
    input: [holder_id, auditor_user_id, audit_type, window_start, window_end]
    output: Audit
    side_effects:
      - "status = SCHEDULED, nonconformity_count = 0, open_nonconformity_count = 0"
      - "the holder's next_audit_due_at is recomputed per calculations.holder_compliance_score_and_deadline"
  - method: POST
    path: "/fairtrade/audits/{id}/start"
    description: "the assigned auditor opens the audit on site"
    roles: [Auditor]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "status = IN_PROGRESS, started_at = clock_now"
      - "increments Audit.version by 1"
  - method: POST
    path: "/fairtrade/audits/{id}/nonconformities"
    description: "raise a graded nonconformity, whose corrective action deadline depends on grade and on the holder's compliance score at the moment of raising; callable while the audit status IN {IN_PROGRESS, REPORT_PENDING}, and the audit itself moves IN_PROGRESS -> REPORT_PENDING on the first finding only"
    roles: [Auditor]
    code: 201
    input: [clause_code, grade, description]
    output: Nonconformity
    side_effects:
      - "status = OPEN, cap_round = 0, raised_by_user_id from the X-User-ID header"
      - "compliance_score_at_raise snapshots the holder's compliance_score BEFORE this nonconformity is counted, and deadline_at plus escalation_grace_days are derived from that snapshot per calculations.holder_compliance_score_and_deadline"
      - "the audit's nonconformity_count and open_nonconformity_count each increase by 1 and the audit moves IN_PROGRESS -> REPORT_PENDING"
      - "the holder's open_critical_count / open_major_count / open_minor_count and compliance_score are then recomputed, and next_audit_due_at is re-derived from the new score"
      - "increments Audit.version and CertificateHolder.version by 1 each"
  - method: POST
    path: "/fairtrade/audits/{id}/close"
    description: "close an audit once every nonconformity it raised is closed"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "status = CLOSED, closed_at = clock_now"
      - "increments Audit.version by 1"
  - method: POST
    path: "/fairtrade/nonconformities/{id}/cap-submissions"
    description: "the producer submits a corrective action plan against an open or rejected nonconformity"
    roles: [ProducerRepresentative]
    code: 201
    input: [narrative]
    output: Nonconformity
    side_effects:
      - "status = CAP_SUBMITTED, cap_narrative = narrative, cap_submitted_at = clock_now, cap_round += 1"
      - "increments Nonconformity.version by 1"
  - method: POST
    path: "/fairtrade/nonconformities/{id}/cap-review"
    description: "review a submitted corrective action plan: ACCEPT closes the nonconformity, REJECT returns it for another round"
    roles: [Auditor, CertificationOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: Nonconformity
    side_effects:
      - "on ACCEPT status = CLOSED and closed_at = clock_now; on REJECT status = CAP_REJECTED"
      - "cap_reviewed_at = clock_now"
      - "on ACCEPT the audit's open_nonconformity_count falls by 1 and the holder's open grade counters, compliance_score and next_audit_due_at are recomputed"
      - "increments Nonconformity.version by 1"
  - method: GET
    path: "/fairtrade/audits/{id}"
    description: "read one audit with its nonconformity counters"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/audits"
    description: "list the audits scheduled against one certificate holder"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative]
    code: 200
    input: ["status?", "audit_type?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/fairtrade/nonconformities/{id}"
    description: "read one nonconformity with its derived deadline and grace window"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative]
    code: 200
    input: []
    output: Nonconformity
    side_effects: []
  - method: GET
    path: "/fairtrade/audits/{id}/nonconformities"
    description: "list the nonconformities raised in one audit"
    roles: [CertificationOfficer, Auditor, ProducerRepresentative]
    code: 200
    input: ["grade?", "status?", "limit?", "offset?"]
    output: Nonconformity[]
    side_effects: []

  # ---- MarkUsageRequest -------------------------------------------------
  - method: POST
    path: "/fairtrade/mark-usage-requests"
    description: "a brand licensee requests approval to apply the FAIRTRADE mark to a SKU for a declared volume"
    roles: [BrandLicensee]
    code: 201
    input: [brand_holder_id, sku_code, artwork_ref, claim_type, requested_volume_kg]
    output: MarkUsageRequest
    side_effects:
      - "status = SUBMITTED"
      - "the brand holder's label_license_status must be ACTIVE (validation priority 17) before the row is created; licence fee settlement (priority 32) and claim_type / chain traceability_mode compatibility (priority 18) are enforced later, at decide time"
  - method: POST
    path: "/fairtrade/mark-usage-requests/{id}/decide"
    description: "certification officer approves or rejects a mark usage request"
    roles: [CertificationOfficer]
    code: 200
    input: [decision, "reason?"]
    output: MarkUsageRequest
    side_effects:
      - "status = APPROVED or REJECTED, decided_at = clock_now, decided_by_user_id from the X-User-ID header, decision_reason = reason"
      - "increments MarkUsageRequest.version by 1"
  - method: GET
    path: "/fairtrade/mark-usage-requests/{id}"
    description: "read one mark usage request"
    roles: [CertificationOfficer, Auditor, BrandLicensee]
    code: 200
    input: []
    output: MarkUsageRequest
    side_effects: []
  - method: GET
    path: "/fairtrade/certificate-holders/{id}/mark-usage-requests"
    description: "list the mark usage requests filed by one brand certificate holder"
    roles: [CertificationOfficer, Auditor, BrandLicensee]
    code: 200
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: MarkUsageRequest[]
    side_effects: []

  # ---- Sweep + logical clock -------------------------------------------
  - method: POST
    path: "/fairtrade/compliance-sweeps"
    description: "run the deadline sweep: overdue corrective actions, escalation past the grace window, suspension of the escalated holder and its chain, dispute of that chain's pending trades, and decertification of expired transition windows"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: { swept_at: string, overdue_count: integer, escalated_count: integer, suspended_holder_count: integer, suspended_node_count: integer, disputed_transaction_count: integer, decertified_holder_count: integer }
    side_effects:
      - "step 1: every OPEN / CAP_SUBMITTED / CAP_REJECTED Nonconformity whose deadline_at is strictly before the clock becomes OVERDUE, processed in deadline_at ASC then created_at ASC order"
      - "step 2: every OVERDUE Nonconformity whose deadline_at + escalation_grace_days is strictly before the clock becomes ESCALATED"
      - "step 3: the holder of each escalated nonconformity moves CERTIFIED -> SUSPENDED with suspension_reason = NONCONFORMITY_ESCALATION"
      - "step 4: every ACTIVE SupplyChainNode of a suspended holder moves to SUSPENDED, in created_at ASC order"
      - "step 5: every UNVERIFIED / PENDING TradeTransaction whose seller node was just suspended moves to verification_status DISPUTED and its reservation is released from the seller node"
      - "step 6: every TRANSITIONING holder whose transition_deadline_at is at or before the clock moves to DECERTIFIED with the full decertification cascade"
      - "increments the version of every entity it mutates by 1"
  - method: POST
    path: "/fairtrade/_clock/set_current_utc"
    description: "set the deterministic logical clock used for every timestamp, deadline and window comparison in this service; when never set the clock reads 2026-08-01T00:00:00Z"
    roles: [CertificationOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "replaces the logical now for all later requests; performs no business mutation of its own"

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent or empty on any endpoint other than the clock endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the called endpoint's roles"
  - id: ERR_HOLDER_OWNERSHIP_MISMATCH
    http: 403
    condition: "a ProducerRepresentative or BrandLicensee whose X-User-ID is not the target CertificateHolder.id acts on that holder, its nodes, its reports, its nonconformities or its mark usage requests; a CommitteeChair whose X-User-ID is not the target committee's chair_user_id acts on that committee's proposals; an Auditor whose X-User-ID is not the audit's auditor_user_id starts that audit"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID would review a corrective action plan it raised, verify a trade it recorded, decide a mark usage request it filed, or vote on a proposal whose committee it chairs"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, a request body field has the wrong JSON type for its declared entity field type, an enum value is outside its declared constraint set, a numeric value is outside its declared range, or period_end is not strictly after period_start"
  # --- existence ---
  - id: ERR_HOLDER_NOT_FOUND
    http: 404
    condition: "the referenced CertificateHolder id (path id, holder_id, counterparty_holder_id or brand_holder_id) does not exist"
  - id: ERR_NODE_NOT_FOUND
    http: 404
    condition: "the referenced SupplyChainNode id (path id, seller_node_id, buyer_node_id or upstream_node_id) does not exist"
  - id: ERR_COMMITTEE_NOT_FOUND
    http: 404
    condition: "the referenced PremiumCommittee id does not exist"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "the referenced PremiumUseProposal id does not exist"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "the referenced PremiumLedgerEntry id does not exist"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "the referenced TradeTransaction id does not exist"
  - id: ERR_VOLUME_REPORT_NOT_FOUND
    http: 404
    condition: "the referenced VolumeReport id does not exist"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "the referenced Audit id does not exist"
  - id: ERR_NONCONFORMITY_NOT_FOUND
    http: 404
    condition: "the referenced Nonconformity id does not exist"
  - id: ERR_MARK_REQUEST_NOT_FOUND
    http: 404
    condition: "the referenced MarkUsageRequest id does not exist"
  # --- optimistic concurrency ---
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version on POST /fairtrade/premium-use-proposals does not equal the PremiumFund's current version"
  - id: ERR_STALE_NODE_VERSION
    http: 412
    condition: "expected_seller_node_version on POST /fairtrade/trade-transactions does not equal the seller SupplyChainNode's current version"
  # --- state machine ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the targeted entity's current state has no transition for the requested trigger (e.g. certify on a CERTIFIED holder, close-vote on a DRAFT proposal, start on a CLOSED audit, decide on a decided mark usage request)"
  - id: ERR_NODE_NOT_ACTIVE
    http: 409
    condition: "a trade transaction names a seller or buyer SupplyChainNode whose status is not ACTIVE, or a harvest declaration targets a node whose status is not ACTIVE"
  - id: ERR_HOLDER_NOT_CERTIFIED
    http: 409
    condition: "an operation requires the owning CertificateHolder.certificate_status to be CERTIFIED (or CERTIFIED/TRANSITIONING where the rule allows sell-down) and it is not"
  - id: ERR_COMMITTEE_NOT_ACTIVE
    http: 409
    condition: "a proposal is created, opened for vote, voted on or closed while its PremiumCommittee.status is not ACTIVE"
  - id: ERR_PREMIUM_USE_BLOCKED_BY_SUSPENSION
    http: 409
    condition: "a premium use proposal is created while the committee's CertificateHolder.certificate_status is SUSPENDED, TRANSITIONING or DECERTIFIED"
  - id: ERR_OPEN_CRITICAL_NONCONFORMITY
    http: 409
    condition: "a TradeTransaction is created while any Nonconformity reachable through the seller node's holder has status ESCALATED"
  - id: ERR_AUDIT_HAS_OPEN_NONCONFORMITIES
    http: 409
    condition: "an audit is closed while its open_nonconformity_count is greater than 0"
  - id: ERR_LABEL_LICENSE_INACTIVE
    http: 409
    condition: "a mark usage request is filed or approved while the brand holder's label_license_status is not ACTIVE"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the acting X-User-ID has already cast a ballot in the proposal's current voting round"
  - id: ERR_COMMITTEE_ALREADY_EXISTS
    http: 409
    condition: "the CertificateHolder already has a PremiumCommittee whose status is not DISSOLVED"
  - id: ERR_CAP_DEADLINE_PASSED
    http: 409
    condition: "a corrective action plan is submitted after the nonconformity's deadline_at, or the nonconformity's status is OVERDUE or ESCALATED"
  # --- temporal / interval ---
  - id: ERR_INVALID_AUDIT_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start, or window_start is strictly before the logical clock"
  - id: ERR_AUDITOR_WINDOW_CONFLICT
    http: 409
    condition: "the named auditor_user_id already has a SCHEDULED or IN_PROGRESS audit whose window, widened by AUDITOR_TRAVEL_BUFFER_DAYS on both sides and compared as a CLOSED interval, intersects the requested window"
  - id: ERR_HOLDER_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "the holder already has a SCHEDULED or IN_PROGRESS audit whose window intersects the requested window under half-open [start, end) comparison, so exact adjacency is permitted"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "the holder already has a VolumeReport against the same counterparty whose half-open [period_start, period_end) window intersects the requested window"
  - id: ERR_FUND_PERIOD_CAPACITY_EXCEEDED
    http: 409
    condition: "at vote close, the closing proposal's requested_amount_cents plus the requested_amount_cents of every already-APPROVED proposal of the same committee whose half-open use period overlaps it exceeds total_accrued_cents * FUND_WINDOW_CAPACITY_PCT / 100"
  # --- traceability / volume ---
  - id: ERR_TRACEABILITY_MODE_MISMATCH
    http: 422
    condition: "a PHYSICAL SupplyChainNode is registered directly downstream of a MASS_BALANCE node, or an FT_CERTIFIED_100 mark usage request is approved while calculations.upstream_traceability_chain returns a chain_mode other than ALL_PHYSICAL"
  - id: ERR_SUPPLY_CHAIN_LINK_MISSING
    http: 422
    condition: "the buyer node's upstream_node_id chain does not contain the seller node, so no certified link exists between them"
  - id: ERR_SUPPLY_CHAIN_DEPTH_EXCEEDED
    http: 422
    condition: "linking to the requested upstream node would give the new node a chain_depth greater than MAX_CHAIN_DEPTH"
  - id: ERR_MASS_BALANCE_CREDIT_EXCEEDED
    http: 422
    condition: "volume_kg is strictly greater than the seller node's available_credit_kg"
  - id: ERR_USE_CATEGORY_NOT_APPROVED
    http: 422
    condition: "the proposal's use_category is not a member of the committee's approved_use_categories"
  - id: ERR_VOLUME_VARIANCE_EXCEEDED
    http: 409
    condition: "the absolute reconciled variance_pct exceeds MAX_VARIANCE_HARD_PCT, so the report cannot be reconciled at all"
  # --- money ---
  - id: ERR_FUND_BALANCE_INSUFFICIENT
    http: 402
    condition: "requested_amount_cents exceeds the PremiumFund's balance_cents at proposal creation or at vote close"
  - id: ERR_LICENSE_FEE_UNPAID
    http: 402
    condition: "a mark usage request is filed or approved while the brand holder's license_fee_settled is false"

# =====================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =====================================================================
roles:
  - name: CertificationOfficer
    description: "Fair Trade USA certification staff: registers holders, moves the certification lifecycle, prices licences, settles and voids trades, reconciles volume reports, schedules and closes audits, decides mark usage, disburses approved premium uses and runs the compliance sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /fairtrade/certificate-holders"
      - "POST /fairtrade/certificate-holders/{id}/certify"
      - "POST /fairtrade/certificate-holders/{id}/suspend"
      - "POST /fairtrade/certificate-holders/{id}/reinstate"
      - "POST /fairtrade/certificate-holders/{id}/transition"
      - "POST /fairtrade/certificate-holders/{id}/decertify"
      - "POST /fairtrade/certificate-holders/{id}/label-license"
      - "POST /fairtrade/premium-committees"
      - "POST /fairtrade/trade-transactions/{id}/settle"
      - "POST /fairtrade/trade-transactions/{id}/void"
      - "POST /fairtrade/volume-reports/{id}/reconcile"
      - "POST /fairtrade/premium-use-proposals/{id}/disburse"
      - "POST /fairtrade/audits"
      - "POST /fairtrade/audits/{id}/close"
      - "POST /fairtrade/mark-usage-requests/{id}/decide"
      - "POST /fairtrade/compliance-sweeps"
      - "POST /fairtrade/_clock/set_current_utc"
    shared_operations:
      - "POST /fairtrade/supply-chain-nodes"
      - "POST /fairtrade/nonconformities/{id}/cap-review"
      - "every GET endpoint in §1.5"
  - name: Auditor
    description: "third-party auditor bound to an audit by Audit.auditor_user_id: starts the audit, raises graded nonconformities, reviews corrective action plans it did not raise, and verifies recorded trades"
    identity: "opaque"
    exclusive_operations:
      - "POST /fairtrade/audits/{id}/start"
      - "POST /fairtrade/audits/{id}/nonconformities"
      - "POST /fairtrade/trade-transactions/{id}/verify"
    shared_operations:
      - "POST /fairtrade/nonconformities/{id}/cap-review"
      - "GET endpoints for holders, nodes, transactions, committees, funds, ledger entries, proposals, votes, reports, audits, nonconformities and mark usage requests"
  - name: CommitteeChair
    description: "producer committee chair, identified by PremiumCommittee.chair_user_id: proposes premium uses, opens and closes voting rounds, revises and cancels proposals; may not vote on its own committee's proposals"
    identity: "opaque"
    exclusive_operations:
      - "POST /fairtrade/premium-use-proposals"
      - "POST /fairtrade/premium-use-proposals/{id}/open-vote"
      - "POST /fairtrade/premium-use-proposals/{id}/close-vote"
      - "POST /fairtrade/premium-use-proposals/{id}/revise"
      - "POST /fairtrade/premium-use-proposals/{id}/cancel"
    shared_operations:
      - "GET endpoints for holders, committees, funds, ledger entries, proposals and votes"
  - name: CommitteeMember
    description: "producer committee member: casts exactly one ballot per proposal voting round"
    identity: "opaque"
    exclusive_operations:
      - "POST /fairtrade/premium-use-proposals/{id}/votes"
    shared_operations:
      - "GET endpoints for holders, committees, funds, ledger entries, proposals and votes"
  - name: ProducerRepresentative
    description: "representative acting as one producer-side CertificateHolder: declares harvest volumes on its own nodes, records certified trades from its own nodes, files volume reports and submits corrective action plans"
    identity: "entity_backed:CertificateHolder"
    exclusive_operations:
      - "POST /fairtrade/supply-chain-nodes/{id}/harvest-declarations"
      - "POST /fairtrade/trade-transactions"
      - "POST /fairtrade/nonconformities/{id}/cap-submissions"
    shared_operations:
      - "POST /fairtrade/supply-chain-nodes"
      - "POST /fairtrade/volume-reports"
      - "GET endpoints for holders, nodes, transactions, committees, funds, ledger entries, proposals, reports, audits and nonconformities"
  - name: BrandLicensee
    description: "licensee acting as one brand CertificateHolder: pays label licence fees, files mark usage requests, registers its own downstream nodes and files buyer-basis volume reports"
    identity: "entity_backed:CertificateHolder"
    exclusive_operations:
      - "POST /fairtrade/certificate-holders/{id}/label-license/payments"
      - "POST /fairtrade/mark-usage-requests"
    shared_operations:
      - "POST /fairtrade/supply-chain-nodes"
      - "POST /fairtrade/volume-reports"
      - "GET endpoints for holders, nodes, transactions, reports and mark usage requests"
