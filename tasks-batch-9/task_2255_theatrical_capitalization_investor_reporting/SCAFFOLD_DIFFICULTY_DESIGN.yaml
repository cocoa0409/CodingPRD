  - name: accept_subscription_four_hop_cascade_reprorates_all_ownership
    grounds:
    - §1.2 Subscription SUBMITTED -> ACCEPTED side effects (4-hop cascade)
    - §1.3 investor_ownership_allocation (6dp ownership_pct plus residue)
    - §1.1 InvestorAccount.ownership_pct, .committed_amount_cents
    - §1.1 Production.capital_raised_cents, .active_investor_count
