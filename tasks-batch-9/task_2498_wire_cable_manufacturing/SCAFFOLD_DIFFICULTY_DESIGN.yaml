  # ===========================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: production_lot_rework_rewind_across_parallel_dimensions
        grounds:
          - state_machines.ProductionLot.EXTRUDED_to_STRANDED
          - state_machines.ProductionLot.NONCONFORMING_to_PENDING
          - state_machines.ProductionLot.EXTRUDED_to_TESTED
          - entities.ProductionLot.fields.process_state
          - entities.ProductionLot.fields.quality_state
          - entities.ProductionLot.fields.rework_count
          - calculations.lot_dimensional_conformance
        distinguishing_aspect: |
          ProductionLot carries two independent dimensions (process_state and
          quality_state) AND a genuine cycle: a NONCONFORMING extrusion rewinds
          process_state from EXTRUDED back to STRANDED while quality_state
          returns from NONCONFORMING to PENDING and rework_count climbs to 1, so
          the same row visits EXTRUDED twice with different measurements.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; copper settlement 2026-07-30 at 4.10."
            - "QUALIFIED compounds, ACTIVE UL file E12345, RELEASED SKU THHN-12-CU (insulation_thickness_mils 28, min_wall_pct 90, concentricity_min_pct 85)."
            - "Customer ACME (credit_limit_usd 100000.00), order SO-RWK for 5.000 kft, rod lot of 20000 lbs, lot LOT-RWK QUEUED on line EXT-1."
            - "LOT-RWK has completed DRAWING and STRANDING, then an EXTRUSION with measured_min_wall_mils 23.0 and measured_max_wall_mils 30.0, giving concentricity_pct 76.67 and quality_state NONCONFORMING at process_state EXTRUDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "MIDWEST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-RWK", ordered_kft: 5.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-RWK", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 23.0, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
