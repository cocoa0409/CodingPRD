              captures: { lapsed_open: $.data.open_conducive_condition_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds/${bond1}/term-review"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /properties/${p1}"
              payload: {}
              as: ComplianceOfficer
              captures: { post_total: $.data.total_conducive_condition_count }
          assert:
            - "checkpoint 0 (graph signed, no bond): total 2, waived 0, open 2, and 2 == 0 + 2"
            - "the total is a DISTINCT-code count: Inspection.${ins1}.conducive_condition_count is 3 (three rows) while Property.total_conducive_condition_count is 2 (two codes), so A1 and C5 collapse"
            - "checkpoint 1 (bond issued with two waiver codes): total 2, waived 1, open 1, and 2 == 1 + 1 — only the intersection counts, so the waiver for FAULTY_GRADE (absent from the graph) suppresses nothing"
            - "checkpoint 2 (bond LAPSED): total 2, waived 1, open 1 — a LAPSED bond is still the property's bond_of_record, so the suppression is NOT released by lapsing"
            - "checkpoint 3 (bond TERMINATED): total 2, waived 0, open 2, and 2 == 0 + 2 — identical to checkpoint 0, so the restoration is exact and the compensation leaves no residue"
            - "total_conducive_condition_count is exactly 2 at all four checkpoints: the conserved quantity never moves while its two components swap 1 unit back and forth"
            - "no count ever goes negative and open never exceeds total at any checkpoint"
            - "the restoration is driven by the bond leaving {ACTIVE, LAPSED}, not by editing the graph: GET /inspections/${ins1}/findings still returns the same three CONDUCIVE_CONDITION rows with total_count 3"
            - "Property.active_infestation_on_record stays false throughout, confirming the ledger recomputation did not disturb the unrelated derived flag"
