  # ===========================================================================
  # RULE 9 — Compensating invariants
  # Two DIFFERENT conserved quantities:
  #   (a) spot COUNT (a unit-inventory ledger) together with the exact-cents
  #       round trip of credit_accrued_cents;
  #   (b) transport-stream BANDWIDTH in kbps (available + assigned == effective).
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: makegood_restores_spot_count_and_returns_credit_to_exactly_zero_cents
        grounds:
          - calculations.spot_inventory_conservation
          - calculations.spot_credit_settlement
          - state_machines.PlaylistItem.SCHEDULED_to_SKIPPED
          - entities.SpotOrder.fields.credit_accrued_cents
          - entities.SpotOrder.fields.credited_spots
          - entities.PlaylistItem.fields.is_makegood
        distinguishing_aspect: |
          Conserved quantity == the spot COUNT ledger ordered_spots == scheduled +
          aired + short_aired + credited + unplaced, carried across a forward
          action (SKIP accrues one rounded per-spot credit of 333 cents out of a
          rate_cents_total of 1000 over 3 spots, where the exact per-spot rational
          is 333.333...) and its compensating action (a makegood placed in a
          different playlist of the same channel). The invariant must read 3 ==
          3+0+0+0+0 before, 3 == 2+0+0+1+0 between, and 3 == 3+0+0+0+0 after, and
          credit_accrued_cents must return to EXACTLY 0 — not 1 and not -1 — even
          though 1000 is not divisible by 3, because the identical rounded 333 is
          added and subtracted rather than recomputed from a changed denominator.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1)."
            - "Six QC_PASSED assets scored 100: PROG-A (840 s), PROG-B (870 s), PROG-C (1770 s) and three 30 s spots SPOT-1, SPOT-2, SPOT-3."
            - "SpotOrder ORD-9A on channel 12.1: ordered_spots 3, unit_duration_seconds 30, rate_cents_total 1000, daypart DAYTIME, priority_class PREEMPTIBLE, makegood_deadline_utc 2026-08-10T00:00:00Z. per_spot_rate_cents is the exact rational 1000/3 == 333.333..., and round_half_up gives 333."
            - "Playlist P1 for broadcast_day 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s, five gapless items: seq 1 PROG-A 840 s at 12:00:00Z, seq 2 COMMERCIAL SPOT-1 30 s at 12:14:00Z, seq 3 COMMERCIAL SPOT-2 30 s at 12:14:30Z, seq 4 COMMERCIAL SPOT-3 30 s at 12:15:00Z, seq 5 PROG-B 870 s at 12:15:30Z. Coverage is exactly 1800 s and commercial inventory in hour 12 is 90 s, far under MAX 960."
            - "P1 is taken VALIDATED -> ARMED -> ON_AIR with the clock at 12:00:00Z, then the clock is moved to 12:14:00Z."
            - "Playlist P2 for broadcast_day 2026-08-02, schedule_start_utc 2026-08-02T13:00:00Z, window 1800 s, a single item seq 1 PROG-C 1770 s, so P2's projected timeline ends at 13:29:30Z and its PROJECTED variance is 1770 - 1800 == -30 s."
