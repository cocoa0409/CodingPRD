              captures: { revived_status: "$.data.status", revived_dues: "$.data.dues_status", revived_cycle: "$.data.dues_paid_through_cycle" }
          assert:
            - "Membership.${ms_grace_id}.status == ACTIVE and dues_status == PAID and dues_paid_through_cycle == 0 after the first renewal"
            - "Membership.${ms_grace_id}.status == ACTIVE and dues_status == ISSUED after the first close-cycle issues the cycle-1 invoice"
            - "Membership.${ms_grace_id}.status == LAPSED and dues_status == OVERDUE after the second close-cycle"
            - "Membership.${ms_grace_id}.status == ACTIVE and dues_status == PAID and dues_paid_through_cycle == 2 after the reinstatement renewal"

      - name: education_path_level_advance_and_revert_cycle
        grounds:
          - state_machines.EducationPath.LEVEL_1_to_LEVEL_2
          - state_machines.EducationPath.LEVEL_2_to_LEVEL_1
