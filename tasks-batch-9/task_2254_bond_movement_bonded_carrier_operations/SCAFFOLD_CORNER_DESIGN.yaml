            - "Port.${p_ny}.name == Port of New York and Port.${p_ny}.exam_capacity_slots == 1"
            - "BondedCarrier.${c1}.name == Atlas Bonded Carriage"

      - name: unlisted_bond_and_carrier_status_transitions_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9].ERR_BOND_INVALID_STATE
          - validations[priority=9].ERR_CARRIER_INVALID_STATE
        distinguishing_aspect: "ACTIVE->ACTIVE is not in either allowed transition set: PATCH bond status=ACTIVE must return ERR_BOND_INVALID_STATE (409) and PATCH carrier custodial_status=ACTIVE must return ERR_CARRIER_INVALID_STATE (409), with both entities left at version 1."
        test_recipe:
