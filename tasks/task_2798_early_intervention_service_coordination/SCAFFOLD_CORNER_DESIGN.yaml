          - endpoints[POST /ei/ifsp-services]
        distinguishing_aspect: |
          The graph topology joins peer collections by explicit FKs rather than nested URLs, so
          cross-reference integrity has to be enforced on the body: an unknown ifsp_id on
          POST /ei/ifsp-services returns ERR_IFSP_NOT_FOUND instead of creating an orphan line.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-03-02T09:00:00Z; no plans exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
