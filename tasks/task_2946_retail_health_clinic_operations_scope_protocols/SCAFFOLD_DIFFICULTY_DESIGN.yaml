            - "CA StateRule and SORE_THROAT protocol exist."
            - "A CA clinic requires min_clinicians_required 2 but only one clinician holds an ACTIVE assignment, so open_status == LIMITED."
            - "Two adult patients exist; the logical clock stays at the 2026-08-01T00:00:00Z default."
