# =============================================================================
# §1.9 Scaffold Corner Design — Frozen Prepared Food Manufacturing
# Breadth probe: every testable claim of §1.1-§1.7 not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: recipe_create_applies_defaults
        claim_type: defaults_and_system_fields
        grounds: [entities.Recipe.fields.status, entities.Recipe]
        distinguishing_aspect: "A recipe created with only required inputs starts in DRAFT with server-minted id, created_at, updated_at and version == 1."
        test_recipe:
          setup: ["empty database; logical clock pinned"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - call: "POST /plant/recipes"
              payload: { name: "R-Def", product_style: "SKILLET", base_batch_yield_units: 500, portion_weight_g: 400, shelf_life_days: 180 }
              as: PlantManager
              captures: { r_id: $.data.id, r_status: $.data.status, r_v: $.data.version }
          assert:
            - "response 201; Recipe.status == DRAFT; version == 1"
            - "id is a prefix-free UUID; created_at == 2026-08-01T00:00:00.000Z (logical clock) and updated_at == created_at"

      - name: recipe_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.Recipe.fields.shelf_life_days, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field shelf_life_days yields ERR_INVALID_REQUEST (400); no default is applied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /plant/recipes"
              payload: { name: "R-Bad", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400"

      - name: component_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.RecipeComponent.fields.component_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "component_type 'SPICE' is not in {RAW_INGREDIENT, SUB_ASSEMBLY, PACKAGING} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DRAFT recipe R exists"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Enum", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "Spice mix", component_type: "SPICE", quantity_per_base_batch: 5, unit_of_measure: "KG" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http 400"

      - name: film_lot_computed_meter_fields
        claim_type: computed_fields
        grounds: [entities.FilmSupplyLot.fields.meters_received, entities.FilmSupplyLot.fields.meters_available]
        distinguishing_aspect: "meters_received is computed as rolls_received * meters_per_roll (3 x 500 = 1500); reserved and consumed start at 0; available equals received."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /plant/film-lots"
              payload: { film_type: "POUCH_FILM", rolls_received: 3, meters_per_roll: 500 }
              as: PlantManager
              captures: { f_id: $.data.id, f_rec: $.data.meters_received, f_avail: $.data.meters_available, f_res: $.data.meters_reserved, f_cons: $.data.meters_consumed, f_status: $.data.status }
          assert:
            - "meters_received == 1500; meters_available == 1500; meters_reserved == 0; meters_consumed == 0; status == AVAILABLE"

      - name: entity_get_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404) on every single-resource endpoint."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /plant/lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QAManager
              captures: { err: $.data.error_id }
            - call: "GET /plant/production-batches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "both responses: error_id == ERR_NOT_FOUND; http 404"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup: ["three freezer cells exist"]
          setup_api_calls:
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-2", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-3", capacity_kg: 3000, min_load_kg: 200, pull_down_kg_per_hour: 500, sanitation_minutes: 45 }, as: PlantManager }
          trigger:
            - call: "GET /plant/freezer-cells"
              payload: {}
              as: ProductionPlanner
          assert:
            - "response meta contains api_request_id and api_request_timestamp; response_type == 'array'"
            - "pagination: limit == 10, offset == 0, total_count == 3, has_more == false; data has 3 entries"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: batch_kit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ProductionBatch.CREATED_to_KITTED, "errors[ERR_BATCH_STATE]"]
        distinguishing_aspect: "KITTED -> kit is not a declared transition; the second kit is rejected with ERR_BATCH_STATE and the batch stays KITTED."
        test_recipe:
          setup: ["APPROVED recipe; order; batch B CREATED"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Kit", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
          trigger:
            - call: "POST /plant/production-batches/${b_id}/kit"
              payload: {}
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "second kit: error_id == ERR_BATCH_STATE; http 409; batch remains KITTED"

      - name: recipe_retired_is_terminal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Recipe, "errors[ERR_RECIPE_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: approve on a RETIRED recipe fails with ERR_RECIPE_STATE."
        test_recipe:
          setup: ["recipe R retired from DRAFT"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Term", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/retire", payload: {}, as: PlantManager }
          trigger:
            - call: "POST /plant/recipes/${r_id}/approve"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECIPE_STATE; http 409; recipe remains RETIRED"

      - name: complaint_resolve_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Complaint, "errors[ERR_COMPLAINT_STATE]"]
        distinguishing_aspect: "RESOLVED_VALID is terminal: a second resolve fails with ERR_COMPLAINT_STATE and no second contagion pass runs."
        test_recipe:
          setup:
            - "lot L RELEASED (600 cases); one complaint already resolved VALID"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-CTerm", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2500, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c_id: $.data.id } }
            - { call: "POST /plant/packaging-lines", payload: { line_code: "L-1", line_type: "TRAY", rate_units_per_minute: 100, supported_film_type: "TRAY_FILM" }, as: PlantManager, captures: { l_id: $.data.id } }
            - { call: "POST /plant/film-lots", payload: { film_type: "TRAY_FILM", rolls_received: 10, meters_per_roll: 1000 }, as: PlantManager, captures: { f_id: $.data.id } }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 7200 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 7200, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1900 }, as: LineOperator }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1900, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v}" }
              as: ProductionPlanner
              captures: { cy_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cy_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cy_id}/complete", payload: { actual_end: "2026-08-02T05:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
              payload: { batch_id: "${b_id}", film_lot_id: "${f_id}", planned_start: "2026-08-03T08:00:00Z", units_planned: 7200 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - { call: "POST /plant/line-runs/${run_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/line-runs/${run_id}/complete", payload: { units_packed: 7200, film_meters_consumed: 3205 }, as: LineOperator }
            - call: "GET /plant/lots?batch_id=${b_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "METAL_DETECTOR", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${b_id}/ccp-checks", payload: { check_type: "XRAY", test_piece_detected: true }, as: QATechnician, as_user_id: "qa-tech-1" }
            - { call: "POST /plant/production-batches/${b_id}/complete", payload: {}, as: LineOperator }
            - { call: "POST /plant/lots/${lot_id}/release", payload: {}, as: QAManager, as_user_id: "qa-mgr-1" }
            - call: "POST /plant/complaints"
              payload: { lot_id: "${lot_id}", complaint_type: "TEXTURE", units_affected: 1 }
              as: QATechnician
              as_user_id: "qa-tech-9"
              captures: { cm_id: $.data.id }
            - { call: "POST /plant/complaints/${cm_id}/investigate", payload: {}, as: QATechnician }
            - { call: "POST /plant/complaints/${cm_id}/resolve", payload: { verdict: "VALID" }, as: QAManager, as_user_id: "qa-mgr-9" }
          trigger:
            - call: "POST /plant/complaints/${cm_id}/resolve"
              payload: { verdict: "INVALID" }
              as: QAManager
              as_user_id: "qa-mgr-9"
              captures: { err: $.data.error_id }
          assert:
            - "second resolve: error_id == ERR_COMPLAINT_STATE; http 409"
            - "FinishedGoodsLot.${lot_id}.valid_complaint_count == 1 (no double contagion)"

      - name: cycle_complete_with_warm_core_marks_failed
        claim_type: valid_transition
        grounds: [state_machines.FreezingCycle.IN_PROGRESS_to_FAILED, calculations.freezer_cycle_duration]
        distinguishing_aspect: "final_core_temp_c -10 > -18 marks the cycle FAILED (computed, not client-chosen); the batch stays COOKED and a replacement cycle can be booked on the same cell afterwards."
        test_recipe:
          setup: ["batch B COOKED; cell FC-1; cycle C1 IN PROGRESS (planned 2026-08-02T00:00, required 5h)"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Fail", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c_id: $.data.id } }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v}" }
              as: ProductionPlanner
              captures: { cy_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cy_id}/start", payload: {}, as: LineOperator }
          trigger:
            - call: "POST /plant/freezing-cycles/${cy_id}/complete"
              payload: { actual_end: "2026-08-02T05:00:00Z", final_core_temp_c: -10 }
              as: LineOperator
              captures: { cy_status: $.data.status }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_status: $.data.status, b_v2: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T06:00:00Z", expected_batch_version: "${b_v2}" }
              as: ProductionPlanner
              captures: { cy2_id: $.data.id }
          assert:
            - "FreezingCycle.${cy_id}.status == FAILED (warm core overrides on-time completion)"
            - "ProductionBatch.${b_id}.status == COOKED (no auto FROZEN on failure)"
            - "replacement cycle on same cell at 06:00 (FAILED cycles do not block windows): created, status RESERVED"

      - name: new_cycle_supersedes_reserved_cycle
        claim_type: side_effect_execution
        grounds: [state_machines.FreezingCycle.RESERVED_to_VOIDED, "concurrency_rules[cycle-create-stale-batch]"]
        distinguishing_aspect: "Creating a second RESERVED cycle for the same batch voids the first (supersede), and the superseded cycle no longer blocks the cell window."
        test_recipe:
          setup: ["batch B COOKED; cell FC-1; cycle C1 RESERVED at 2026-08-02T00:00 (5h)"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Sup", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c_id: $.data.id } }
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b_v}" }
              as: ProductionPlanner
              captures: { cy1_id: $.data.id }
          trigger:
            - call: "GET /plant/production-batches/${b_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b_v2: $.data.version }
            - call: "POST /plant/production-batches/${b_id}/freezing-cycles"
              payload: { cell_id: "${c_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T02:00:00Z", expected_batch_version: "${b_v2}" }
              as: ProductionPlanner
              captures: { cy2_id: $.data.id, cy2_status: $.data.status }
            - call: "GET /plant/freezing-cycles/${cy1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { cy1_status: $.data.status }
          assert:
            - "FreezingCycle.${cy2_id}.status == RESERVED (overlapping window accepted because C1 was superseded first)"
            - "FreezingCycle.${cy1_id}.status == VOIDED"

      - name: hold_resume_restores_origin_state
        claim_type: valid_transition
        grounds: [state_machines.ProductionBatch.COOKED_to_ON_HOLD, state_machines.ProductionBatch.ON_HOLD_to_COOKED]
        distinguishing_aspect: "resume returns the batch to its recorded hold_origin_state (COOKED), and clears hold fields."
        test_recipe:
          setup: ["batch B COOKED"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Hold", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 6000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - { call: "POST /plant/production-batches/${b_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b_id}/cook", payload: { cooked_mass_kg: 1550 }, as: LineOperator }
          trigger:
            - call: "POST /plant/production-batches/${b_id}/hold"
              payload: { reason: "thermometer drift" }
              as: QATechnician
              captures: { s1: $.data.status, o1: $.data.hold_origin_state }
            - call: "POST /plant/production-batches/${b_id}/resume"
              payload: {}
              as: QATechnician
              captures: { s2: $.data.status, o2: $.data.hold_origin_state }
          assert:
            - "after hold: status == ON_HOLD, hold_origin_state == COOKED"
            - "after resume: status == COOKED, hold_origin_state == null, hold_reason == null"

      - name: ccp_fail_hold_blocks_resume_until_pass
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionBatch.ON_HOLD_to_FROZEN, "errors[ERR_BATCH_STATE]"]
        distinguishing_aspect: "A CCP_FAIL hold cannot be resumed until the latest check of the failed type is PASS; a newer PASS re-enables resume."
        test_recipe:
          setup: ["batch B FROZEN; METAL_DETECTOR FAIL recorded -> batch ON_HOLD with hold_reason CCP_FAIL:METAL_DETECTOR"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
