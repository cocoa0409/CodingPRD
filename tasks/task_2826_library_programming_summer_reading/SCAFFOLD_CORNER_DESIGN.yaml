              as: ProgramCoordinator
              captures: { resv_b: $.data.id }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v2: $.data.version }
          assert:
            - "The replayed call returns HTTP 412 with ${err} == ERR_STALE_PROGRAM_VERSION"
            - "${prog_v1} == ${prog_v0} + 1 — the rejected call did not bump the version, only the accepted first reservation did"
            - "${prog_v2} == ${prog_v0} + 2 after the refreshed-version call is accepted"
            - "RoomReservation.${resv_a}.status == SUPERSEDED with setup_minutes 15 and RoomReservation.${resv_b}.status == HELD with setup_minutes 20"
            - "GET /library/reservations filtered by program_id == ${prog} returns total_count == 2 — the 412 created no third row"

      - name: stale_expected_participant_version_on_a_log_correction_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[correction-post-stale-participant]
          - endpoints[POST /library/participants/{participant_id}/log-corrections]
          - errors[ERR_STALE_PARTICIPANT_VERSION]
        distinguishing_aspect: "An intervening log entry invalidates the echoed participant version, so the correction returns ERR_STALE_PARTICIPANT_VERSION (412) before any target check runs, and the same correction with the refreshed version then lands."
        test_recipe:
          setup:
            - "An OPEN MINUTES challenge with one participant holding a 30-unit entry on 2026-07-20; the participant version is read, then a 20-unit entry on 2026-07-21 is accepted."
