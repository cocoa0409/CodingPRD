# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Structured Settlement Annuity Administration
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: payee_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Payee, "endpoints[POST /annuity/payees]"]
        distinguishing_aspect: "A newly created payee starts ACTIVE with version 1, is_minor computed against the default clock (2026-08-01), and deceased_date null."
        test_recipe:
          setup: ["CA statute profile exists; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /annuity/payees"
              payload: { full_name: "Nora New", date_of_birth: "1980-06-15", tax_id: "121-12-1212", address_line1: "12 First St", address_city: "Riverside", address_state_code: "CA", address_postal_code: "92501" }
              as: CaseManager
              captures: { p_st: $.data.status, p_minor: $.data.is_minor, p_v: $.data.version, p_dod: $.data.deceased_date }
          assert:
            - "${p_st} == ACTIVE and ${p_v} == 1 and ${p_dod} == null"
            - "${p_minor} == false (age 46 at the default clock vs AOM 18)"

      - name: payee_missing_tax_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Payee.fields.tax_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input tax_id yields ERR_INVALID_REQUEST (400); no payee is persisted."
        test_recipe:
          setup: ["CA statute profile exists"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /annuity/payees"
              payload: { full_name: "Nora New", date_of_birth: "1980-06-15", address_line1: "12 First St", address_city: "Riverside", address_state_code: "CA", address_postal_code: "92501" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"

      - name: duplicate_state_profile_rejected
        claim_type: type_constraints
        grounds: [entities.StateStatuteProfile.fields.state_code, "validations[priority=15]", "errors[ERR_DUPLICATE_STATE_PROFILE]"]
        distinguishing_aspect: "state_code uniqueness: a second profile for CA fails with ERR_DUPLICATE_STATE_PROFILE (409) while a different state succeeds."
        test_recipe:
          setup: ["CA statute profile already exists"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 19, sspa_max_discount_rate_bps: 800, disclosure_cooling_off_days: 5, ipa_required: false, dormancy_years: 2, commutation_permitted: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_STATE_PROFILE (http 409)"

      - name: payment_create_with_client_amount_returns_invalid_request
        claim_type: computed_fields
        grounds: [entities.ScheduledPayment.fields.amount_cents, calculations.escalated_payment_amount]
        distinguishing_aspect: "amount_cents and disclosure_amount_cents are server-computed; a client-supplied amount_cents is an unknown field and the whole request fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CA profile; payee; agreement EXECUTED; DRAFT schedule"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Cara Client", date_of_birth: "1984-02-28", tax_id: "131-13-1313", address_line1: "13 Second St", address_city: "Ontario", address_state_code: "CA", address_postal_code: "91761" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "EN-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2027-01-01", base_amount_cents: 50000, amount_cents: 1 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (client may not set the computed amount_cents)"

      - name: minority_boundary_at_majority_birthday
        claim_type: computed_fields
        grounds: [calculations.minority_status, entities.Payee.fields.is_minor]
        distinguishing_aspect: "is_minor uses strict <: on the exact 18th birthday the payee is no longer a minor; the day before, still a minor."
        test_recipe:
          setup: ["CA profile (AOM 18); payee DOB 2010-05-15"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Maya Minor", date_of_birth: "2010-05-15", tax_id: "141-14-1414", address_line1: "14 Third St", address_city: "Oxnard", address_state_code: "CA", address_postal_code: "93030" }
              as: CaseManager
              captures: { payee_id: $.data.id, minor_create: $.data.is_minor }
          trigger:
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2028-05-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /annuity/payees/${payee_id}"
              payload: {}
              as: Any
              captures: { minor_before: $.data.is_minor }
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2028-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /annuity/payees/${payee_id}"
              payload: {}
              as: Any
              captures: { minor_on: $.data.is_minor }
          assert:
            - "${minor_create} == true (age 16 at default clock)"
            - "${minor_before} == true (2028-05-14: birthday not yet reached)"
            - "${minor_on} == false (2028-05-15: exact 18th birthday flips the flag)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: agreement_execute_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SettlementAgreement.DRAFT_to_EXECUTED, "errors[ERR_AGREEMENT_INVALID_STATE]"]
        distinguishing_aspect: "execute is only valid from DRAFT; a second execute on the EXECUTED agreement fails with ERR_AGREEMENT_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["CA profile; payee; agreement EN-002 already EXECUTED"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Ed Twice", date_of_birth: "1971-01-19", tax_id: "151-15-1515", address_line1: "15 Fourth St", address_city: "Corona", address_state_code: "CA", address_postal_code: "92879" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "EN-002", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_AGREEMENT_INVALID_STATE (http 409)"
            - "SettlementAgreement.${agr_id}.status remains EXECUTED"

      - name: issue_from_cleared_returns_not_payable
        claim_type: terminal_lockdown
        grounds: [state_machines.ScheduledPayment.ISSUED_to_CLEARED, "errors[ERR_PAYMENT_NOT_PAYABLE]", "errors[ERR_PAYMENT_NOT_ISSUED]"]
        distinguishing_aspect: "CLEARED is terminal: a second issue fails ERR_PAYMENT_NOT_PAYABLE and a second mark-cleared fails ERR_PAYMENT_NOT_ISSUED; the single-payment agreement is already CLOSED by the exhaustion cascade."
        test_recipe:
          setup:
            - "CA profile; adult payee; funded ACTIVE agreement; single payment 40000 due 2026-08-10 (esc 0)"
            - "clock 2026-08-10; payment issued EFT and cleared"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Clio Clear", date_of_birth: "1986-10-02", tax_id: "161-16-1616", address_line1: "16 Fifth St", address_city: "Hayward", address_state_code: "CA", address_postal_code: "94541" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "EN-003", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-T", insurer_name: "LifeCo", premium_cents: 9000000, contract_discount_rate_bps: 500, commutation_rider: "NONE", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2026-08-10", base_amount_cents: 40000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "EFT" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
            - call: "POST /annuity/scheduled-payments/${p1_id}/mark-cleared"
              payload: {}
              as: OperationsSpecialist
              as_user_id: "ops-1"
              captures: { st_cleared: $.data.status }
          trigger:
            - call: "POST /annuity/scheduled-payments/${p1_id}/issue"
              payload: { method: "CHECK" }
              as: OperationsSpecialist
              as_user_id: "ops-1"
              captures: { err_issue: $.data.error_id }
            - call: "POST /annuity/scheduled-payments/${p1_id}/mark-cleared"
              payload: {}
              as: OperationsSpecialist
              as_user_id: "ops-1"
              captures: { err_clear: $.data.error_id }
            - call: "GET /annuity/annuity-policies/${pol_id}"
              payload: {}
              as: Any
              captures: { pol_st: $.data.status }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_st: $.data.status }
          assert:
            - "${st_cleared} == CLEARED"
            - "${err_issue} == ERR_PAYMENT_NOT_PAYABLE (terminal lockdown)"
            - "${err_clear} == ERR_PAYMENT_NOT_ISSUED"
            - "${pol_st} == EXHAUSTED and ${agr_st} == CLOSED (exhaustion cascade fired at the clear)"

      - name: petition_withdraw_then_effectuate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TransferPetition.FILED_to_WITHDRAWN, state_machines.TransferPetition.COURT_APPROVED_to_EFFECTIVE, "errors[ERR_PETITION_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal for the petition: effectuate afterwards fails ERR_PETITION_INVALID_STATE and no payment changes hands."
        test_recipe:
          setup:
            - "NY profile (cap 2000, cooling 20, ipa false); adult NY payee; funded agreement; ACTIVE schedule with one payment 100000 due 2030-01-01 (esc 0)"
            - "clock 2029-01-01; petition price 90000 window 2030-01-01..2030-01-01 FILED then WITHDRAWN"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "NY", age_of_majority: 21, sspa_max_discount_rate_bps: 2000, disclosure_cooling_off_days: 20, ipa_required: false, dormancy_years: 5, commutation_permitted: false }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Will Draw", date_of_birth: "1974-12-12", tax_id: "171-17-1717", address_line1: "17 Sixth St", address_city: "Syracuse", address_state_code: "NY", address_postal_code: "13201" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "EN-004", court_state_code: "NY", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-W", insurer_name: "LifeCo", premium_cents: 18000000, contract_discount_rate_bps: 500, commutation_rider: "NONE", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2030-01-01", base_amount_cents: 100000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /annuity/transfer-petitions"
              payload: { settlement_agreement_id: "${agr_id}", payee_id: "${payee_id}", factoring_company_name: "FactorCo", purchase_price_cents: 90000, transfer_start_date: "2030-01-01", transfer_end_date: "2030-01-01" }
              as: CaseManager
              captures: { pet_id: $.data.id }
            - call: "POST /annuity/transfer-petitions/${pet_id}/file"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /annuity/transfer-petitions/${pet_id}/withdraw"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { st_wd: $.data.status }
          trigger:
            - call: "POST /annuity/transfer-petitions/${pet_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${st_wd} == WITHDRAWN"
            - "${err} == ERR_PETITION_INVALID_STATE (effectuate requires COURT_APPROVED)"
            - "ScheduledPayment.${p1_id}.status == SCHEDULED (untouched)"

      - name: death_settle_preserves_certain_period_payments
        claim_type: side_effect_execution
        grounds: [state_machines.DeathClaim.REPORTED_to_SETTLED, state_machines.ScheduledPayment.PAYABLE_to_CANCELLED, entities.AnnuityPolicy.fields.certain_period_end_date]
        distinguishing_aspect: "The death cascade cancels only life-contingent payments: due 2027-06-01 (within certain period ending 2027-12-31) survives SCHEDULED while due 2028-06-01 (after) is CANCELLED with reason DEATH; policy stays IN_FORCE and agreement FUNDED."
        test_recipe:
          setup:
            - "CA profile; payee (DOB 1957-09-09); funded agreement (policy rider DEATH_ONLY, certain end 2027-12-31)"
            - "ACTIVE schedule with p1 45000 due 2027-06-01 and p2 55000 due 2028-06-01 (esc 0); clock at default 2026-08-01 (agreement FUNDED)"
            - "DeathClaim REPORTED with date_of_death 2027-01-15"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Cer Tain", date_of_birth: "1957-09-09", tax_id: "181-18-1818", address_line1: "18 Seventh St", address_city: "Vallejo", address_state_code: "CA", address_postal_code: "94590" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "EN-005", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-V", insurer_name: "LifeCo", premium_cents: 22000000, contract_discount_rate_bps: 500, commutation_rider: "DEATH_ONLY", certain_period_end_date: "2027-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2027-06-01", base_amount_cents: 45000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2028-06-01", base_amount_cents: 55000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p2_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/death-claims"
              payload: { payee_id: "${payee_id}", settlement_agreement_id: "${agr_id}", date_of_death: "2027-01-15", claimant_type: "ESTATE", claimant_name: "Estate of Tain" }
              as: CaseManager
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /annuity/death-claims/${claim_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /annuity/scheduled-payments/${p1_id}"
              payload: {}
