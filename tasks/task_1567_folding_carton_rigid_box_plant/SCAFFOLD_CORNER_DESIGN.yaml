# =============================================================================
# §1.9: Scaffold Corner Design — folding-carton-plant
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Logical clock default 2026-08-01T00:00:00Z; booking windows use 2026-08-1x.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
  # ---------------------------------------------------------------------------
    instances:
      - name: customer_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.Customer.fields.status, entities.Customer.fields.brand_code]
        distinguishing_aspect: "POST /plant/customers returns 201 with status defaulted to ACTIVE, server-minted id, version 1, ISO created_at/updated_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { c_id: $.data.id, c_st: $.data.status, c_v: $.data.version } }
          assert:
            - "http 201; data.status == ACTIVE (default applied), data.version == 1 (${c_st}, ${c_v})"
            - "data.id is a UUID without type prefix; created_at/updated_at present with millisecond precision"

      - name: job_creation_computed_fields
        claim_type: computed_fields
        grounds: [entities.Job.fields.route_type, entities.Job.fields.provisional_subtotal_cents, calculations.provisional_quote, calculations.route_selection]
        distinguishing_aspect: "qty-3000 coat job: route_type computed OFFSET (3000 > 2500), provisional_subtotal_cents == 362130, provisional_total_cents == 750000 (minimum recovery 387870), status QUOTED."
        test_recipe:
          setup: ["one ACTIVE customer"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { j_route: $.data.route_type, j_sub: $.data.provisional_subtotal_cents, j_tot: $.data.provisional_total_cents, j_st: $.data.status } }
          assert:
            - "route_type == OFFSET (${j_route}); status == QUOTED (${j_st})"
            - "provisional_subtotal_cents == 362130 (print 114000 + board 204*320=65280 + coat rhu(2850.0)=2850 + make_ready 180000)"
            - "provisional_total_cents == 750000 (subtotal 362130 < 750000 -> recovery 387870)"

      - name: job_lookup_errors_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a random UUID path id returns 404 ERR_NOT_FOUND; POST /plant/jobs with a non-existent customer_id FK also returns 404 ERR_NOT_FOUND (body FK existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/jobs/11111111-2222-3333-4444-555555555555", payload: {}, as: PlantAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "11111111-2222-3333-4444-555555555555", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { e2: $.data.error_id } }
          assert:
            - "both responses: error_id == ERR_NOT_FOUND, http 404 (${e1}, ${e2})"

      - name: request_shape_validation_errors
        claim_type: required_fields_and_enums
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field (customer_id) and unknown enum member (press_type FLEXO) each return 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/jobs", payload: { quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /plant/presses", payload: { press_code: "P-X", press_type: "FLEXO", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 100 }, as: PlantAdmin, captures: { e2: $.data.error_id } }
          assert:
            - "missing customer_id -> ERR_INVALID_REQUEST 400 (${e1}); press_type FLEXO -> ERR_INVALID_REQUEST 400 (${e2})"

      - name: job_version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.Job.fields.status]
        distinguishing_aspect: "Job.version starts at 1 and increments by exactly 1 per mutation: create v1 -> start-engineering v2 -> cancel v3 (cancel response carries version 3)."
        test_recipe:
          setup: ["one ACTIVE customer"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/cancel", payload: {}, as: PlantAdmin, captures: { v3: $.data.version, st3: $.data.status } }
          assert:
            - "versions: ${v1} == 1, ${v2} == 2, ${v3} == 3; final status == CANCELLED (${st3})"

  # ---------------------------------------------------------------------------
  - section: state_machines
  # ---------------------------------------------------------------------------
    instances:
      - name: job_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Job
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "From terminal CANCELLED, every further transition (start-engineering, a second cancel) is rejected with ERR_INVALID_STATE_TRANSITION and no side effects fire."
        test_recipe:
          setup: ["one customer; one QUOTED job"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs/${job}/cancel", payload: {}, as: PlantAdmin, captures: { st1: $.data.status } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /plant/jobs/${job}/cancel", payload: {}, as: PlantAdmin, captures: { e3: $.data.error_id } }
          assert:
            - "first cancel: status == CANCELLED (${st1})"
            - "start-engineering from CANCELLED: error_id == ERR_INVALID_STATE_TRANSITION 409 (${e2})"
            - "second cancel from CANCELLED: error_id == ERR_INVALID_STATE_TRANSITION 409 (${e3})"

      - name: audit_certify_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RetailReadyAudit
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "certify is only defined from SUBMITTED; calling it on a DRAFT audit returns 409 ERR_INVALID_STATE_TRANSITION and the audit stays DRAFT."
        test_recipe:
          setup: ["one customer; one job (any state)"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: true }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/retail-audits", payload: { job_id: "${job}", retailer_code: "CLUB-A", orientation: "LENGTHWISE", case_w_cin: 1524, case_h_cin: 2540, case_d_cin: 9000, case_weight_g: 14000, cases_per_layer: 8, layers: 6, case_count: 48 }, as: KittingLead, captures: { aud: $.data.id, verdict: $.data.verdict } }
          trigger:
            - { call: "POST /plant/retail-audits/${aud}/certify", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { e1: $.data.error_id } }
          assert:
            - "verdict at create == COMPLIANT (${verdict}); audit status DRAFT"
            - "certify from DRAFT -> ERR_INVALID_STATE_TRANSITION 409 (${e1})"

      - name: invoice_finalize_before_job_complete_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - errors[ERR_JOB_NOT_COMPLETE]
        distinguishing_aspect: "Invoice finalize is gated on the parent Job being COMPLETE; for a QUOTED job the transition fails with ERR_JOB_NOT_COMPLETE (409) and the invoice stays DRAFT/PROVISIONAL."
        test_recipe:
          setup: ["one customer; one QUOTED job with DRAFT invoice"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/invoices", payload: { job_id: "${job}" }, as: BillingClerk, captures: { inv: $.data.id, variant: $.data.variant } }
          trigger:
            - { call: "POST /plant/invoices/${inv}/finalize", payload: {}, as: BillingClerk, captures: { e1: $.data.error_id } }
          assert:
            - "invoice created as DRAFT with variant == PROVISIONAL (${variant})"
            - "finalize -> ERR_JOB_NOT_COMPLETE 409 (${e1}); invoice remains DRAFT"

      - name: design_revision_supersede_and_renumber
        claim_type: side_effect_execution
        grounds:
          - "state_machines.DesignRevision.[DRAFT, SAMPLE_MADE, BRAND_APPROVED]_to_SUPERSEDED"
          - concurrency_rules[design-revision-create-stale-job]
        distinguishing_aspect: "Creating a second revision supersedes the first (status SUPERSEDED), assigns revision_number 2, and bumps Job.version by 1 per create (v2 -> v3 -> v4)."
        test_recipe:
          setup: ["one customer; one job in ENGINEERING at version 2"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { jv2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${jv2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev1: $.data.id, rn1: $.data.revision_number } }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { jv3: $.data.version } }
          trigger:
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${jv3}", cad_ref: "CAD-2", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev2: $.data.id, rn2: $.data.revision_number } }
            - { call: "GET /plant/design-revisions/${rev1}", payload: {}, as: PlantAdmin, captures: { r1_st: $.data.status } }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { jv4: $.data.version } }
          assert:
            - "rev1.revision_number == 1 (${rn1}); rev2.revision_number == 2 (${rn2})"
            - "rev1 status == SUPERSEDED (${r1_st}); rev2 status == DRAFT"
            - "job.version == 4 after two creates (${jv4}); each create bumped it by 1"

      - name: job_cancel_cascades_to_scheduled_booking
        claim_type: cascade_down
        grounds:
          - "state_machines.Job.[QUOTED, ENGINEERING, PRESS_READY]_to_CANCELLED"
          - state_machines.PressBooking.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Cancelling a PRESS_READY job cascades: the 130-sheet reservation returns to stock AND the job's SCHEDULED press booking flips to CANCELLED — one request, two entity types mutated."
        test_recipe:
          setup: ["job qty 3000 PRESS_READY with one SCHEDULED booking; stock reserved 130"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { jv2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${jv2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { jv3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${jv3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-1", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 1000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 130, start_utc: "2026-08-10T10:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs/${job}/cancel", payload: {}, as: PlantAdmin, captures: { jst: $.data.status, jres: $.data.reserved_sheets } }
            - { call: "GET /plant/press-bookings/${bk}", payload: {}, as: PlantAdmin, captures: { bkst: $.data.status } }
            - { call: "GET /plant/board-stocks/${stock}", payload: {}, as: PlantAdmin, captures: { sres: $.data.reserved_sheets, savail: $.data.available_sheets } }
          assert:
            - "job CANCELLED with reserved_sheets == 0 (${jst}, ${jres})"
            - "booking cascaded to CANCELLED (${bkst})"
            - "stock reserved_sheets == 0, available_sheets == 5000 (${sres}, ${savail})"

      - name: audit_reject_revise_recompute_cycle
        claim_type: valid_transition_cycle
        grounds:
          - state_machines.RetailReadyAudit.SUBMITTED_to_REJECTED
          - state_machines.RetailReadyAudit.REJECTED_to_DRAFT
        distinguishing_aspect: "REJECTED -> DRAFT via revise replaces the case inputs and recomputes the verdict: compliant audit (count 48) rejected, revised to count 47 -> verdict flips to NON_COMPLIANT while back in DRAFT."
        test_recipe:
          setup: ["one customer; one job; one COMPLIANT audit in SUBMITTED"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: true }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/retail-audits", payload: { job_id: "${job}", retailer_code: "CLUB-A", orientation: "LENGTHWISE", case_w_cin: 1524, case_h_cin: 2540, case_d_cin: 9000, case_weight_g: 14000, cases_per_layer: 8, layers: 6, case_count: 48 }, as: KittingLead, captures: { aud: $.data.id } }
            - { call: "POST /plant/retail-audits/${aud}/submit", payload: {}, as: KittingLead }
          trigger:
            - { call: "POST /plant/retail-audits/${aud}/reject", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { st1: $.data.status } }
            - { call: "POST /plant/retail-audits/${aud}/revise", payload: { orientation: "LENGTHWISE", case_w_cin: 1524, case_h_cin: 2540, case_d_cin: 9000, case_weight_g: 14000, cases_per_layer: 8, layers: 6, case_count: 47 }, as: KittingLead, captures: { st2: $.data.status, v2: $.data.verdict } }
          assert:
            - "reject: status == REJECTED (${st1})"
            - "revise: status == DRAFT (${st2}) with case_count 47 -> verdict == NON_COMPLIANT (${v2})"

      - name: kit_order_complete_from_planned_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.KitOrder.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "complete is defined only from IN_PROGRESS; completing a PLANNED kit order returns 409 ERR_INVALID_STATE_TRANSITION and no cartons are consumed."
        test_recipe:
          setup: ["job qty 3000 FINISHED (good 120 sheets -> 3000 cartons); one PLANNED kit order (per-kit 3, planned 10)"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { jv2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${jv2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { jv3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${jv3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 100 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-1", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 1000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 130, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T09:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-production", payload: {}, as: PressOperator }
            - { call: "POST /plant/press-bookings/${bk}/complete", payload: { sheets_printed: 130, sheets_good: 120 }, as: PressOperator }
            - { call: "POST /plant/jobs/${job}/complete-press", payload: {}, as: PressOperator }
            - { call: "POST /plant/finishing-lines", payload: { line_code: "L-C1", supported_ops: ["COAT"], setup_buffer_minutes: 0 }, as: PlantAdmin, captures: { line: $.data.id } }
