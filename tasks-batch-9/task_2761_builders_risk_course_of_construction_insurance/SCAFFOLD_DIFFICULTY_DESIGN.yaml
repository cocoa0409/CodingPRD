              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "TEMPORARY_STORAGE", sublimit_cents: 400000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/facilities"
              payload: { name: "Northgate Bonded Warehouse", site_code: "STG-NORTH-11", distance_from_site_miles: 42.5, aggregate_capacity_cents: 500000000, protection_class: "SPRINKLERED" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 300000000, window_start: "2026-10-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { sa1: $.data.id }
            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 400000000, window_start: "2026-12-01T00:00:00Z", window_end: "2027-02-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { sa2: $.data.id }
            - call: "POST /builders-risk/storage-assignments"
              payload: { policy_id: "${pl1}", facility_id: "${f1}", stored_value_cents: 100000000, window_start: "2026-11-15T00:00:00Z", window_end: "2026-12-15T00:00:00Z" }
