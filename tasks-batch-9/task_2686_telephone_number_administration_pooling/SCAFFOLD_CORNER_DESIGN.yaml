              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { req_id: "$.data.id" }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "replay of the now-stale version", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the first call is HTTP 201 with data.status == \"PENDING_REVIEW\", info_request_count == 0 and utilization_pct_at_submission == 65.00"
            - "the second call is HTTP 412 with data.error_id == \"ERR_STALE_RATE_CENTER_VERSION\" - the accepted write invalidated its own expected version"
            - "GET /numbering/rate-centers/${rc_id} reads pending_request_count == 1, so the refused replay neither superseded nor duplicated the live request"
            - "GET /numbering/allocation-requests/${req_id} still reads status == \"PENDING_REVIEW\" with superseded_by_request_id == null"

      - name: stale_block_version_on_routing_record_publish_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[routing-record-publish-stale-block]", "errors[ERR_STALE_BLOCK_VERSION]", "validations[priority=8]", "endpoints[POST /numbering/blocks/{block_id}/routing-records]"]
        distinguishing_aspect: "The second, independent OCC guard - a different parent entity (NumberBlock), a different occ_field (expected_block_version) and a different error code from the rate-center guard. The stale version here is produced by the publish itself, which bumps NumberBlock.version while setting routing_status and npac_db_version, so a naive republish with the same body is the realistic double-submit."
        test_recipe:
          setup: ["Carrier A licensed and VERIFIED in OH. NPA 614 / rate center COLUMBUS. Block 614-554-0 was loaded straight to carrier A as an activated legacy holding, so it is ASSIGNED but still UNROUTED. Its version is captured before any routing record exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
