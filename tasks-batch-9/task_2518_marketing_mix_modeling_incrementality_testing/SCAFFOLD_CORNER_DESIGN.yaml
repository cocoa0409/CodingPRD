          setup:
            - "Fixture F1 fitted with carryover_attribution_mode EFFECT_PERIOD."
            - "A_SEARCH has adstock_decay_rate 0.50 and adstock_max_lag_periods 2 over spend [400000, 600000, 300000, 500000]; B_SOCIAL has 0.25 and 1 over [200000, 200000, 400000, 100000]."
