  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_allocation_confirm_is_gated_on_the_harvest_lot_cold_chain_dimension
        grounds:
          - state_machines.LotAllocation.PROVISIONAL_to_CONFIRMED
          - state_machines.HarvestLot.cold_chain_status.PRECOOLED_to_COLD_HELD
          - validations[priority=16]
          - errors[ERR_LOT_NOT_COLD_HELD]
        distinguishing_aspect: |
          Entity pair is LotAllocation depending on HarvestLot: the allocation's own status is a perfectly
          legal PROVISIONAL and its week is ALLOCATED, yet CONFIRMED is refused purely because the
          referenced lot's cold_chain_status is PRECOOLED. Advancing only the other entity, with no change
          to the allocation, unblocks the identical call.
