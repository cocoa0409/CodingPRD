              as: PlatformAdmin
            - call: "POST /route-stops/${stop_c5}/weather-closures"
              payload: { cause: "WIND", closed_from: "2026-09-04T14:00:00Z", closed_to: "2026-09-04T15:00:00Z" }
              as: LotBoss
              captures: { closure_c5a: "$.data.id" }
            - call: "POST /route-stops/${stop_c5}/weather-closures"
