  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_sampling_all_collections
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPPLIER_NOT_FOUND]", "errors[ERR_PRODUCT_NOT_FOUND]", "errors[ERR_WAREHOUSE_NOT_FOUND]", "errors[ERR_YIELD_SPEC_NOT_FOUND]", "errors[ERR_PRICE_SHEET_NOT_FOUND]", "errors[ERR_PRICE_SHEET_LINE_NOT_FOUND]", "errors[ERR_PURCHASE_ORDER_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_FABRICATION_BATCH_NOT_FOUND]", "errors[ERR_FORWARD_CONTRACT_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_SHIPMENT_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]", "errors[ERR_CERTIFICATE_NOT_FOUND]", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "Every path-addressed resource returns its own domain-specific 404 error id for an unknown UUID — no generic fallback leaks across resources."
        test_recipe:
          setup: ["Empty DB; all ids are well-formed UUIDs that do not exist"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/suppliers/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_sup: "$.data.error_id" } }
            - { call: "GET /api/products/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_prod: "$.data.error_id" } }
            - { call: "GET /api/warehouses/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_wh: "$.data.error_id" } }
            - { call: "GET /api/yield-specs/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_ys: "$.data.error_id" } }
            - { call: "GET /api/price-sheets/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_ps: "$.data.error_id" } }
            - { call: "GET /api/price-sheet-lines/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_psl: "$.data.error_id" } }
            - { call: "GET /api/purchase-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_po: "$.data.error_id" } }
            - { call: "GET /api/inventory-lots/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_lot: "$.data.error_id" } }
            - { call: "GET /api/fabrication-batches/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_fb: "$.data.error_id" } }
            - { call: "GET /api/forward-contracts/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_fc: "$.data.error_id" } }
            - { call: "GET /api/allocations/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_al: "$.data.error_id" } }
            - { call: "GET /api/shipments/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_sh: "$.data.error_id" } }
            - { call: "GET /api/claims/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_cl: "$.data.error_id" } }
            - { call: "GET /api/inspection-certificates/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_ct: "$.data.error_id" } }
            - { call: "GET /api/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: DeskAdmin, captures: { e_cu: "$.data.error_id" } }
          assert:
            - "${e_sup} == ERR_SUPPLIER_NOT_FOUND; ${e_prod} == ERR_PRODUCT_NOT_FOUND; ${e_wh} == ERR_WAREHOUSE_NOT_FOUND"
            - "${e_ys} == ERR_YIELD_SPEC_NOT_FOUND; ${e_ps} == ERR_PRICE_SHEET_NOT_FOUND; ${e_psl} == ERR_PRICE_SHEET_LINE_NOT_FOUND"
            - "${e_po} == ERR_PURCHASE_ORDER_NOT_FOUND; ${e_lot} == ERR_LOT_NOT_FOUND; ${e_fb} == ERR_FABRICATION_BATCH_NOT_FOUND"
            - "${e_fc} == ERR_FORWARD_CONTRACT_NOT_FOUND; ${e_al} == ERR_ALLOCATION_NOT_FOUND; ${e_sh} == ERR_SHIPMENT_NOT_FOUND"
            - "${e_cl} == ERR_CLAIM_NOT_FOUND; ${e_ct} == ERR_CERTIFICATE_NOT_FOUND; ${e_cu} == ERR_CUSTOMER_NOT_FOUND"
            - "All responses http 404 with response_type == error"

      - name: stale_version_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_CLAIM_VERSION]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        excluded_because:
          difficulty_instance: occ_claim_offer_stale_version / occ_contract_amend_stale_version
          rationale: "Both 412 triggers are exercised by the cross_cutting OCC corner instances below; see those recipes."

      - name: temp_boundary_error_free_compliance
        claim_type: satisfaction_pass
        grounds: [calculations.temp_compliance_eval]
        excluded_because:
          difficulty_instance: temp_reading_exactly_at_max_stays_compliant
          rationale: "Boundary equality/strict-greater semantics asserted there."

