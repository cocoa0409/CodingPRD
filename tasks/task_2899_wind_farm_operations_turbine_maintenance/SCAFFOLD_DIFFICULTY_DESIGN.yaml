          - endpoints.POST_/wind-ops/farms/{id}/landowner-settlements
        distinguishing_aspect: |
          A single settlement payload violates the telemetry freeze (43, state, 409), the
          per-parcel period overlap (60, business_temporal, 409) and the landowner budget headroom
          (74, business_fiscal, 422) at the same time. The declared order returns them one at a
          time in exactly that sequence, and the third rung proves the headroom is measured against
          cap minus already-posted landowner_payable_cents rather than against the raw cap.
