              payload: {}
              as: ChapterDirector
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
            - call: "POST /wish-grant/fulfillment-plans/${plan2_id}/approve"
              payload: {}
              as: NationalDirector
              as_user_id: "nat-1"
          assert:
            - "first approve (ChapterDirector) fails with ERR_COST_ESCALATION_REQUIRED because round_half_up((600000 + 1000001) / 2) == 800001 > 800000"
            - "second approve (NationalDirector) succeeds: FulfillmentPlan.${plan2_id}.status == APPROVED"
            - "FulfillmentPlan.${plan2_id}.escalation_required == true"
            - "Chapter.${ch_id}.committed_cost_cents == 1000001 after the successful approval"

  - rule_id: non_linear_state_machine
    instances:
      - name: wish_approval_abort_revert_cycle
        grounds:
          - state_machines.Wish.PLANNING_to_PLAN_APPROVED
          - state_machines.Wish.PLAN_APPROVED_to_READY_TO_SCHEDULE
          - state_machines.Wish.READY_TO_SCHEDULE_to_PLANNING
        distinguishing_aspect: |
          The Wish machine is non-linear: PLANNING -> PLAN_APPROVED -> READY_TO_SCHEDULE
