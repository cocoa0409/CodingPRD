              captures: { off_id: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_id}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_id}", insurer_id: "${ins_id}", accepted_offer_id: "${off_id}", deductible_pct: 10, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /eqp/policies/${pol_id}/bind"
