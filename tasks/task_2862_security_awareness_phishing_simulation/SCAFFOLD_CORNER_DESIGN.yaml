            - { call: "POST /awareness/simulation-deliveries/${d1}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-08-02T09:20:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d2}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-08-02T09:20:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/campaigns/${c}/scorecard", payload: {}, as: SecurityAnalyst, captures: { rr: "$.data.report_rate" } }
