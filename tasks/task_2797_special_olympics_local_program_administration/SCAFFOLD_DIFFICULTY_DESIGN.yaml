            - "AttendanceRecord.${recB}.status == VOIDED and counted_minutes == 0 (minutes_present stays 50)"
            - "Athlete.${athA}.cumulative_practice_minutes == 0 and counted_session_count == 0"
            - "Athlete.${athB}.cumulative_practice_minutes == 0 and counted_session_count == 0"
            - "Program.${prog}.program_practice_minutes == 0 - exactly the 110 minutes created are removed, not more"
            - "SportSeason.${season}.status == PRACTICE_OPEN (the compensation touches ledgers, not the season)"

      - name: contribution_void_conserves_support_ledger
        grounds:
          - state_machines.Contribution.RECEIVED_to_VOID
          - calculations.contribution_recognized_value
          - calculations.family_engagement_match_credit
          - entities.Program.fields.recognized_support_cents
        distinguishing_aspect: |
          A different conserved quantity type - MONEY in whole cents, spread over three program ledgers
          (recognized_support_cents, pledged_support_cents, family_engagement_credit_cents) - and the
          reversal must be per-row-exact rather than proportional: voiding the services gift removes its
          rounded 9877-cent match credit and its 98765-cent recognised value while the capped goods gift's
          50000/500000 stay untouched and the still-PLEDGED cash gift never moves at all.
        test_recipe:
          setup:
            - "One program"
            - "c1: CASH_PLEDGE, GENERAL, 250000 cents, left PLEDGED"
            - "c2: IN_KIND_GOODS, FAMILY_ENGAGEMENT, stated 600000, RECEIVED at creation (only CASH_PLEDGE starts PLEDGED), recognised at the 500000 cap -> match 50000"
            - "c3: IN_KIND_SERVICES, FAMILY_ENGAGEMENT, stated 123456, RECEIVED at creation, recognised round_half_up(123456 * 0.80) = 98765 -> match round_half_up(9876.5) = 9877"
            - "Pre-void ledgers: pledged 250000, recognized 598765, family engagement credit 59877"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /programs"
              payload: { name: "Riverbend Special Olympics", region_code: "OH" }
              as: ProgramManager
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Cedar Valley Rotary", contribution_type: "CASH_PLEDGE", designation: "GENERAL", stated_value_cents: 250000 }
              as: ProgramManager
              captures: { c1: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Northline Sporting Goods", contribution_type: "IN_KIND_GOODS", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 600000, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c2: $.data.id }
            - call: "POST /programs/${prog}/contributions"
              payload: { donor_name: "Harbor Physio Group", contribution_type: "IN_KIND_SERVICES", designation: "FAMILY_ENGAGEMENT", stated_value_cents: 123456, received_on: "2026-08-01" }
              as: ProgramManager
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /contributions/${c3}/void"
              payload: { void_reason_code: "VALUATION_ERROR" }
              as: ProgramManager
          assert:
            - "Contribution.${c3}.status == VOID, void_reason_code == VALUATION_ERROR, match_credit_cents == 0"
            - "Contribution.${c3}.recognized_value_cents == 98765 is preserved as history and is NOT zeroed"
            - "Contribution.${c2}.status == RECEIVED, recognized_value_cents == 500000, match_credit_cents == 50000 (untouched)"
            - "Contribution.${c1}.status == PLEDGED, recognized_value_cents == 250000, match_credit_cents == 0 (untouched)"
            - "Program.${prog}.recognized_support_cents == 500000 - exactly 98765 removed from 598765"
            - "Program.${prog}.family_engagement_credit_cents == 50000 - exactly the 9877 rounded credit removed from 59877"
            - "Program.${prog}.pledged_support_cents == 250000 - the void must not move the pledged ledger"
