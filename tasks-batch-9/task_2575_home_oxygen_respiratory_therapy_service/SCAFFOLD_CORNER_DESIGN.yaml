            - call: "POST /home-oxygen/patients/${p_id}/transfer-requests"
              payload: { receiving_branch_id: "${br2_id}", transfer_effective_date: "2026-08-10" }
              as: IntakeCoordinator
              captures: { st_pending: $.data.status }
            - call: "POST /home-oxygen/patients/${p_id}/transfer-requests/complete"
