        distinguishing_aspect: "Cyclic two-party machine on LicensedLine (different entity from Color): the negotiation loop DRAFT -> LICENSOR_REVIEW -> DRAFT -> LICENSOR_REVIEW -> BRAND_REVIEW -> LICENSOR_REVIEW -> BRAND_REVIEW -> APPROVED exercises both revision edges before the version-pinning approval lands."
