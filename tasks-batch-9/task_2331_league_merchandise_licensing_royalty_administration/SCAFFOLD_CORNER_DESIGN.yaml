              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Quarrywood Merch", contact_email: "ops@quarrywood.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_q3: $.data.id }
            - call: "POST /licensing/licensees/${lic_q3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
