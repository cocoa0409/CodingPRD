scenario: |
  Clinical Trial Smart Matching: trial inclusion/exclusion criteria, informed
  consent versioning, randomization scheme, IRB approval, adverse event reporting,
  blood draw window, participant compensation payment.

domain_name: clinical-trial-matching
api_prefix: /trials

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: Advanced
  rationale: |
    The core challenge is compliance gating: a participant's enrollment, draw
    visits, and compensation are governed by a chain of regulator-style
    approvals (IRB approval of the Trial, the participant's signed Consent
    pinned to a Trial.active_consent_version, and segregation-of-duties between
    PrincipalInvestigator and IRBReviewer). Temporal windowing layers on top:
    each scheduled Visit has a [target_date - window_days, target_date + window_days]
    blood-draw window with strict inclusive boundary semantics, and consent
    versions become "stale" when a new version is published. Dual-variant
    calculation appears in participant_compensation (provisional vs final
    payout) and in trial_eligibility_score (forward-looking vs chronological
    assessment).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trial
    parent: null
    common_fields: true
    fields:
      - name: protocol_code
        type: string
        source: input
        description: External protocol identifier, unique across all trials.
        constraints: "regex ^[A-Z]{2,4}-[0-9]{3,5}$; uniqueness enforced after trim."
      - name: title
        type: string
        source: input
        description: Human-readable trial title.
        constraints: "1..200 chars after trim."
      - name: sponsor_org
        type: string
        source: input
        description: Sponsoring organization name.
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the trial.
        default: DRAFT
        constraints: "values: DRAFT, IRB_PENDING, APPROVED, OPEN_FOR_ENROLLMENT, CLOSED_TO_ENROLLMENT, COMPLETED, TERMINATED."
      - name: inclusion_criteria
        type: array
        source: input
        description: Ordered list of inclusion predicates evaluated against a Participant's profile.
        constraints: "each item: {code:string, op: one of [GTE,LTE,EQ,IN,BETWEEN], field:string, value:any}; max 20 items."
      - name: exclusion_criteria
        type: array
        source: input
        description: Ordered list of exclusion predicates; if any matches, candidate is ineligible.
        constraints: "same shape as inclusion_criteria; max 20 items."
      - name: active_consent_version
        type: integer
        source: computed
        description: Latest published ConsentVersion.version for this trial; null until first publish.
        default: null
      - name: randomization_scheme
        type: enum
        source: input
        description: Algorithm used to assign Participants to Arms on enrollment.
        constraints: "values: SIMPLE_BERNOULLI, PERMUTED_BLOCK, STRATIFIED_BLOCK."
      - name: block_size
        type: integer
        source: input
        description: Block size for PERMUTED_BLOCK / STRATIFIED_BLOCK; null otherwise.
        constraints: "if randomization_scheme=SIMPLE_BERNOULLI -> must be null; else must be in {2,4,6,8} and divisible by Arm count."
      - name: stratification_field
        type: string
        source: input
        description: Participant profile field used for STRATIFIED_BLOCK strata; null otherwise.
        constraints: "required iff randomization_scheme=STRATIFIED_BLOCK."
      - name: target_enrollment
        type: integer
        source: input
        description: Maximum number of Participants that may reach ENROLLED state.
        constraints: "1..10000."
      - name: enrolled_count
        type: integer
        source: computed
        description: Count of Participants in this trial currently in ENROLLED or COMPLETED state. Recomputed on every Participant transition into/out of {ENROLLED, COMPLETED}.
        default: 0
      - name: irb_decision_note
        type: string
        source: input
        description: Last IRB decision rationale; populated on APPROVED or revision request.
        default: null
      - name: irb_approval_expires_at
        type: datetime
        source: computed
        description: APPROVED_AT + 365 days; recomputed each time IRB approves.
        default: null
      - name: blood_draw_window_days
        type: integer
        source: input
        description: Symmetric window around each Visit.target_date in calendar days; inclusive on both ends.
        constraints: "0..14."

  - name: Arm
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: Foreign key to Trial.id (path-bound).
      - name: code
        type: string
        source: input
        description: Short arm code, unique within the trial.
        constraints: "regex ^[A-Z0-9]{1,8}$; unique per trial_id."
      - name: label
        type: string
        source: input
        description: Human-readable arm label (e.g., 'Active 25mg', 'Placebo')."
      - name: weight
        type: integer
        source: input
        description: Allocation weight; SIMPLE_BERNOULLI uses weight ratio; *_BLOCK schemes require equal weights.
        constraints: "1..10."
      - name: assigned_count
        type: integer
        source: computed
        description: Count of Participants currently assigned to this arm (in ENROLLED or COMPLETED state).
        default: 0

  - name: ConsentVersion
    parent: Trial
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no prefix.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits.
      - name: trial_id
        type: string
        source: input
        description: Foreign key to Trial.id.
      - name: version
        type: integer
        source: computed
        description: Monotonic per-trial integer; 1 on first publish, +1 on every subsequent publish.
      - name: document_uri
        type: string
        source: input
        description: Pointer to the consent document content (opaque string).
        constraints: "1..500 chars."
      - name: change_summary
        type: string
        source: input
        description: Plain-language summary of what changed vs the previous version.
        constraints: "required iff version >= 2; must be 1..500 chars."
      - name: requires_re_consent
        type: boolean
        source: input
        description: If true, all previously ENROLLED Participants must re-sign before any further Visit may be COMPLETED.
        default: false
      - name: published_at
        type: datetime
        source: system
        description: When this version became Trial.active_consent_version.

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: Foreign key to Trial.id; locked on creation.
      - name: arm_id
        type: string
        source: computed
        description: Foreign key to Arm.id assigned by the randomization engine on ENROLL.
        default: null
      - name: profile
        type: object
        source: input
        description: Bag of typed attributes evaluated against inclusion/exclusion criteria.
        constraints: "keys are domain field names; values are scalars; at most 50 keys."
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the participant in this trial.
        default: SCREENING
        constraints: "values: SCREENING, ELIGIBLE, CONSENT_PENDING, ENROLLED, WITHDRAWN, COMPLETED, INELIGIBLE."
      - name: signed_consent_version
        type: integer
        source: computed
        description: ConsentVersion.version the participant most recently signed; null until first sign.
        default: null
      - name: eligibility_score
        type: number
        source: computed
        description: Score computed by participant_eligibility_score (see §1.3). Recomputed on screening evaluation.
        default: null
      - name: open_ae_count
        type: integer
        source: computed
        description: Number of AdverseEvent records on this participant whose status is OPEN or UNDER_REVIEW.
        default: 0
      - name: enrolled_at
        type: datetime
        source: computed
        description: Timestamp at which the participant entered ENROLLED state; null otherwise.
        default: null

  - name: Visit
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: Foreign key to Participant.id (path-bound).
      - name: sequence_no
        type: integer
        source: input
        description: 1-indexed position of the visit in the participant's protocol schedule.
        constraints: "1..50; unique per participant_id."
      - name: target_date
        type: datetime
        source: input
        description: Protocol-scheduled date for the blood draw (UTC, time component ignored — date semantics).
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of this visit.
        default: SCHEDULED
        constraints: "values: SCHEDULED, COMPLETED, MISSED, CANCELLED."
      - name: actual_draw_at
        type: datetime
        source: input
        description: Timestamp the blood draw was recorded; required to transition to COMPLETED.
        default: null
      - name: compensation_cents
        type: integer
        source: computed
        description: Cents to be paid for this visit if/when it COMPLETES; pinned at completion time per §1.3.
        default: 0

  - name: AdverseEvent
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: Foreign key to Participant.id (path-bound).
      - name: severity
        type: enum
        source: input
        description: Reporter-graded severity at intake.
        constraints: "values: MILD, MODERATE, SEVERE, LIFE_THREATENING."
      - name: status
        type: enum
        source: computed
        description: AE workflow status.
        default: OPEN
        constraints: "values: OPEN, UNDER_REVIEW, RESOLVED, ESCALATED_HOLD."
      - name: reported_at
        type: datetime
        source: system
        description: When the AE was reported.
      - name: narrative
        type: string
        source: input
        description: Free-text description.
        constraints: "1..2000 chars."
      - name: caused_visit_id
        type: string
        source: input
        description: Optional Visit.id the AE is attributed to; if set, the Visit must belong to the same participant.
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Final resolution rationale; required to enter RESOLVED.
        default: null

  - name: Payment
    parent: Participant
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no prefix.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits.
      - name: participant_id
        type: string
        source: input
        description: Foreign key to Participant.id.
      - name: visit_id
        type: string
        source: input
        description: Foreign key to Visit.id this payment compensates.
      - name: kind
        type: enum
        source: computed
        description: Whether the row is a provisional accrual or a finalized payout.
        constraints: "values: PROVISIONAL, FINAL, REVERSAL."
      - name: amount_cents
        type: integer
        source: computed
        description: Amount in cents (signed for REVERSAL).
      - name: paid_at
        type: datetime
        source: system
        description: When the FINAL row was issued; null for PROVISIONAL.
        default: null

  - name: IRBReview
    parent: Trial
    common_fields: true
    fields:
      - name: trial_id
        type: string
        source: input
        description: Foreign key to Trial.id (path-bound).
      - name: decision
        type: enum
        source: input
        description: IRB decision on the review.
        constraints: "values: APPROVED, REVISIONS_REQUESTED, REJECTED."
      - name: reviewer_id
        type: string
        source: system
        description: X-User-ID of the acting IRBReviewer (opaque operator id).
      - name: decided_at
        type: datetime
        source: system
        description: Timestamp the decision was recorded.
      - name: notes
        type: string
        source: input
        description: Reviewer rationale; 1..1000 chars.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Trial
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: IRB_PENDING
        trigger: "POST /trials/{id}/submit-for-irb"
        actor: PrincipalInvestigator
        preconditions:
          - "Trial has >= 2 Arm records"
          - "If randomization_scheme=PERMUTED_BLOCK or STRATIFIED_BLOCK, block_size mod Arm count == 0 and all Arm.weight equal"
          - "Trial has >= 1 ConsentVersion (version=1)"
        side_effects:
          - "Trial.status := IRB_PENDING"

      - from: IRB_PENDING
        to: APPROVED
        trigger: "POST /trials/{id}/irb-reviews with decision=APPROVED"
        actor: IRBReviewer
        preconditions:
          - "Reviewer's X-User-ID != Trial.created_by_user_id (segregation of duties — see §1.7)"
        side_effects:
          - "Create IRBReview row"
          - "Trial.status := APPROVED"
          - "Trial.irb_approval_expires_at := decided_at + 365 days"
          - "Trial.irb_decision_note := notes"

      - from: IRB_PENDING
        to: DRAFT
        trigger: "POST /trials/{id}/irb-reviews with decision=REVISIONS_REQUESTED"
        actor: IRBReviewer
        preconditions:
          - "Reviewer != Trial.created_by_user_id"
        side_effects:
          - "Create IRBReview row"
          - "Trial.status := DRAFT"
          - "Trial.irb_decision_note := notes"

      - from: IRB_PENDING
        to: TERMINATED
        trigger: "POST /trials/{id}/irb-reviews with decision=REJECTED"
        actor: IRBReviewer
        preconditions:
          - "Reviewer != Trial.created_by_user_id"
        side_effects:
          - "Create IRBReview row"
          - "Trial.status := TERMINATED"

      - from: APPROVED
        to: OPEN_FOR_ENROLLMENT
        trigger: "POST /trials/{id}/open-enrollment"
        actor: PrincipalInvestigator
        preconditions:
          - "Trial.active_consent_version is not null"
          - "now() < Trial.irb_approval_expires_at"
        side_effects:
          - "Trial.status := OPEN_FOR_ENROLLMENT"

      - from: OPEN_FOR_ENROLLMENT
        to: CLOSED_TO_ENROLLMENT
        trigger: "POST /trials/{id}/close-enrollment OR system: enrolled_count >= target_enrollment after a Participant ENROLL transition"
        actor: PrincipalInvestigator | system
        preconditions: []
        side_effects:
          - "Trial.status := CLOSED_TO_ENROLLMENT"

      - from: CLOSED_TO_ENROLLMENT
        to: COMPLETED
        trigger: "POST /trials/{id}/complete"
        actor: PrincipalInvestigator
        preconditions:
          - "Every Participant in this trial has status in {COMPLETED, WITHDRAWN, INELIGIBLE}"
        side_effects:
          - "Trial.status := COMPLETED"

      - from: OPEN_FOR_ENROLLMENT
        to: TERMINATED
        trigger: "POST /trials/{id}/terminate"
        actor: PrincipalInvestigator
        preconditions: []
        side_effects:
          - "Trial.status := TERMINATED"
          - "Cascade: every Participant with status in {SCREENING, ELIGIBLE, CONSENT_PENDING, ENROLLED} -> WITHDRAWN (Participant cascade transition)"
          - "Cascade-of-cascade: each cascaded Participant WITHDRAWN triggers Visit cascade: every Visit with status=SCHEDULED -> CANCELLED on that participant"

  - entity: Participant
    initial_state: SCREENING
    terminal_states: [COMPLETED, WITHDRAWN, INELIGIBLE]
    transitions:
      - from: SCREENING
        to: ELIGIBLE
        trigger: "POST /participants/{id}/evaluate"
        actor: StudyCoordinator
        preconditions:
          - "Trial.status in {OPEN_FOR_ENROLLMENT}"
          - "participant_eligibility_score evaluation returns ELIGIBLE (see §1.3)"
        side_effects:
          - "Participant.status := ELIGIBLE"
          - "Participant.eligibility_score := <computed>"

      - from: SCREENING
        to: INELIGIBLE
        trigger: "POST /participants/{id}/evaluate (any exclusion criterion matches, OR no inclusion criterion missing)"
        actor: StudyCoordinator
        preconditions: []
        side_effects:
          - "Participant.status := INELIGIBLE"
          - "Participant.eligibility_score := <computed>"

      - from: ELIGIBLE
        to: CONSENT_PENDING
        trigger: "POST /participants/{id}/request-consent"
        actor: StudyCoordinator
        preconditions:
          - "Trial.active_consent_version is not null"
        side_effects:
          - "Participant.status := CONSENT_PENDING"

      - from: CONSENT_PENDING
        to: ENROLLED
        trigger: "POST /participants/{id}/sign-consent with consent_version=N"
        actor: Participant
        preconditions:
          - "consent_version == Trial.active_consent_version (version-pin)"
          - "Trial.status == OPEN_FOR_ENROLLMENT"
          - "Trial.enrolled_count < Trial.target_enrollment"
        side_effects:
          - "Participant.signed_consent_version := consent_version"
          - "Participant.arm_id := randomize(Trial.randomization_scheme) (see §1.3 arm_assignment)"
          - "Arm.assigned_count++ on the chosen arm"
          - "Trial.enrolled_count++ on the parent trial"
          - "Participant.enrolled_at := now()"
          - "Participant.status := ENROLLED"
          - "If Trial.enrolled_count == Trial.target_enrollment, auto-transition Trial OPEN_FOR_ENROLLMENT -> CLOSED_TO_ENROLLMENT (cascade)"

      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /participants/{id}/complete"
        actor: StudyCoordinator
        preconditions:
          - "Every Visit on this participant has status in {COMPLETED, MISSED, CANCELLED}"
          - "Participant.open_ae_count == 0"
        side_effects:
          - "Participant.status := COMPLETED"
          - "For each Visit with status=COMPLETED that still has a PROVISIONAL Payment, finalize it: create FINAL Payment row, mark PROVISIONAL as superseded (see §1.3 participant_compensation)"

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /participants/{id}/withdraw"
        actor: StudyCoordinator | Participant
        preconditions: []
        side_effects:
          - "Participant.status := WITHDRAWN"
          - "Cascade: each Visit with status=SCHEDULED on this participant -> CANCELLED"
          - "Cascade-of-cascade: for each Visit cascaded to CANCELLED that has a PROVISIONAL Payment, write REVERSAL Payment row (amount = -PROVISIONAL.amount_cents)"
          - "Trial.enrolled_count-- on parent trial (since participant is no longer ENROLLED)"
          - "Arm.assigned_count-- on assigned arm"

      - from: CONSENT_PENDING
        to: WITHDRAWN
        trigger: "POST /participants/{id}/withdraw"
        actor: StudyCoordinator | Participant
        preconditions: []
        side_effects:
          - "Participant.status := WITHDRAWN"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete with actual_draw_at"
        actor: StudyCoordinator
        preconditions:
          - "Participant.status == ENROLLED"
          - "Participant.signed_consent_version == Trial.active_consent_version (re-consent gate: if newer version is active and the version the participant signed is less than current active version, the participant MUST re-sign before any Visit may complete; see §1.4 priority 35)"
          - "Participant.open_ae_count == 0 (AE gate)"
          - "abs(date(actual_draw_at) - Visit.target_date) <= Trial.blood_draw_window_days (inclusive boundary; see §1.3 blood_draw_window_check)"
        side_effects:
          - "Visit.status := COMPLETED"
          - "Visit.actual_draw_at := actual_draw_at"
          - "Visit.compensation_cents := <computed by participant_compensation, provisional variant>"
          - "Create Payment row with kind=PROVISIONAL, amount_cents=Visit.compensation_cents (see §1.3)"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /visits/{id}/mark-missed"
        actor: StudyCoordinator
        preconditions:
          - "now() > add_days(Visit.target_date, Trial.blood_draw_window_days)"
        side_effects:
          - "Visit.status := MISSED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "DELETE /visits/{id} (or cascaded from Participant WITHDRAWN)"
        actor: StudyCoordinator | system
        preconditions: []
        side_effects:
          - "Visit.status := CANCELLED"

  - entity: AdverseEvent
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /participants/{participant_id}/adverse-events/{id}/start-review"
        actor: PrincipalInvestigator
        preconditions: []
        side_effects:
          - "AdverseEvent.status := UNDER_REVIEW"
          - "Participant.open_ae_count unchanged (still counts as open)"

      - from: OPEN
        to: ESCALATED_HOLD
        trigger: "system: on POST /participants/{participant_id}/adverse-events when severity in {SEVERE, LIFE_THREATENING} (auto-escalate on intake)"
        actor: system
        preconditions: []
        side_effects:
          - "AdverseEvent.status := ESCALATED_HOLD"
          - "Cascade: all SCHEDULED Visits on this participant -> CANCELLED"
          - "Cascade-of-cascade: for each cancelled Visit holding a PROVISIONAL Payment row, write REVERSAL Payment row"
          - "If severity=LIFE_THREATENING and Trial.status == OPEN_FOR_ENROLLMENT, cascade: Trial -> CLOSED_TO_ENROLLMENT (parent trial auto-closes)"

      - from: UNDER_REVIEW
        to: ESCALATED_HOLD
        trigger: "POST /participants/{participant_id}/adverse-events/{id}/escalate"
        actor: PrincipalInvestigator
        preconditions: []
        side_effects:
          - "AdverseEvent.status := ESCALATED_HOLD"
          - "Same cascade chain as the auto-escalate branch above."

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /participants/{participant_id}/adverse-events/{id}/resolve with resolution_note"
        actor: PrincipalInvestigator
        preconditions:
          - "resolution_note present, 1..1000 chars"
        side_effects:
          - "AdverseEvent.status := RESOLVED"
          - "AdverseEvent.resolution_note := <input>"
          - "Participant.open_ae_count-- (drops by 1)"

      - from: ESCALATED_HOLD
        to: RESOLVED
        trigger: "POST /participants/{participant_id}/adverse-events/{id}/resolve"
        actor: PrincipalInvestigator
        preconditions:
          - "resolution_note present"
        side_effects:
          - "AdverseEvent.status := RESOLVED"
          - "Participant.open_ae_count--"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two coordinators sign-consent for the same participant simultaneously"
    guarantee: "At most one sign-consent succeeds; loser sees ERR_INVALID_STATE because the participant is no longer in CONSENT_PENDING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Participant.status transition out of CONSENT_PENDING."

  - scenario: "Last enrollment slot raced by two simultaneous sign-consent calls (enrolled_count == target_enrollment - 1)"
    guarantee: "Exactly one transition reaches ENROLLED; the loser is rejected because Trial.enrolled_count >= target_enrollment by then."
    error_id: ERR_TRIAL_FULL
    http_status: 409
    serialization: "First-writer-wins on Trial.enrolled_count increment."

  - scenario: "PI submits a new ConsentVersion while a participant sign-consent (for the previous version) is in flight"
    guarantee: "If the publish commits first, the in-flight sign fails because consent_version != active_consent_version; if the sign commits first, the publish still succeeds but the just-enrolled participant becomes 'stale-versioned' (must re-consent before next Visit completion)."
    error_id: ERR_CONSENT_VERSION_STALE
    http_status: 409
    serialization: "Linear ordering on Trial.active_consent_version writes."

  - scenario: "IRB reviewer submits APPROVED at the same time PI submits a new ConsentVersion that would shift active version"
    guarantee: "Both can independently succeed (orthogonal fields) UNLESS the APPROVED transition is the first that flips Trial.status to APPROVED — in which case the consent publish must still see Trial.status != DRAFT for the publish to be allowed; if Trial.status is observed as DRAFT (pre-approval), the publish fails."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "Read-then-write under row-level lock on Trial.status."

  - scenario: "Two simultaneous visit-complete calls on the same Visit"
    guarantee: "At most one COMPLETED transition; second loses because Visit.status is no longer SCHEDULED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Visit.status."

  - scenario: "Two simultaneous adverse-event reports both severity=SEVERE on the same participant, while a Visit is mid-complete"
    guarantee: "Both AE rows are created (idempotency keys differ), and the Visit-complete transaction observes open_ae_count >= 1 at precondition time and is rejected with ERR_AE_BLOCKING."
    error_id: ERR_AE_BLOCKING
    http_status: 409
    serialization: "AE inserts and Visit-complete read share the same lock on Participant row."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: participant_eligibility_score
    trigger: "POST /participants/{id}/evaluate transitions Participant SCREENING -> {ELIGIBLE, INELIGIBLE}"
    algorithm: weighted_scoring
    formula: |
      # Inputs:
      #   participant.profile : map[string]scalar
      #   trial.inclusion_criteria : ordered list of predicates
      #   trial.exclusion_criteria : ordered list of predicates
      #
      # Step 1 (exclusion gate): if ANY exclusion predicate p in
      # trial.exclusion_criteria evaluates true against participant.profile,
      # return decision=INELIGIBLE, score=0.0. Stop.
      #
      # Step 2 (inclusion score): for each inclusion predicate p in
      # trial.inclusion_criteria (in declared order), compute:
      #   if p missing field in profile -> contribution = 0
      #   elif predicate matches -> contribution = 1
      #   else -> contribution = 0
      # score = round_half_up(100 * sum(contributions) / len(inclusion_criteria), 1)
      #
      # Step 3 (decision):
      #   if score >= ELIGIBILITY_THRESHOLD -> ELIGIBLE
      #   else -> INELIGIBLE
    input_set: |
      Only the participant's own profile and the trial's inclusion/exclusion
      criteria as of evaluation time. Other participants' profiles are not
      considered.
    constants:
      ELIGIBILITY_THRESHOLD: 80.0    # inclusive: score >= 80.0 is ELIGIBLE
    precision: "1 decimal place, round_half_up"
    variants:
      - name: forward_looking
        when: "Trial.status == OPEN_FOR_ENROLLMENT and current target_enrollment headroom > 0"
        difference: |
          Evaluates against the CURRENT (live) inclusion_criteria and
          exclusion_criteria on the Trial — even if the Trial was previously
          IRB_PENDING when the participant was screened. Used at the
          screening evaluate call.
      - name: chronological
        when: "audit re-evaluation, GET /participants/{id}/eligibility-history"
        difference: |
          Replays the inclusion/exclusion criteria that were attached to the
          Trial at the moment Participant.created_at, even if criteria have
          since been amended. Produces a potentially different score (and a
          potentially different ELIGIBLE/INELIGIBLE decision) for the same
          participant profile.

  - name: participant_compensation
    trigger: "Visit SCHEDULED -> COMPLETED transition; Participant ENROLLED -> COMPLETED transition (finalize)"
    algorithm: tiered_pricing
    formula: |
      # Inputs:
      #   visit.target_date (date)
      #   visit.actual_draw_at (datetime)
      #   trial.blood_draw_window_days (int >= 0)
      #   participant.signed_consent_version, trial.active_consent_version
      #
      # Base payment (cents): BASE_VISIT_CENTS.
      #
      # Window-day-offset penalty: let d = abs((actual_draw_at::date) - target_date::date)
      # in calendar days.
      #   if d == 0                  -> bonus = ON_TIME_BONUS_CENTS
      #   elif 1 <= d <= 2           -> bonus = 0
      #   elif 3 <= d <= window_days -> bonus = -LATE_PENALTY_CENTS * (d - 2)
      #   else (d > window_days)     -> visit cannot complete (window violation)
      #
      # Late-completion clamp: bonus is floored at -BASE_VISIT_CENTS, so the
      # net never goes negative.
      #
      # Final cents:
      #   provisional_cents = max(0, BASE_VISIT_CENTS + bonus)
      #
      # Finalization (Participant ENROLLED -> COMPLETED, FINAL variant):
      #   final_cents = provisional_cents
      #     + (RE_CONSENT_BONUS_CENTS if signed_consent_version == active_consent_version
      #        AND there exists at least one ConsentVersion row with version >= 2 on the trial,
      #        else 0)
      # Order of operations is pinned: compute per-visit bonus, clamp to
      # non-negative, then sum across visits, then add the re-consent bonus.
    input_set: |
      Per-visit compensation uses only that visit's own dates and the parent
      trial's window. Finalization uses the participant's full set of
      COMPLETED visits and a flag derived from the consent history.
    constants:
      BASE_VISIT_CENTS: 5000          # $50 per completed visit
      ON_TIME_BONUS_CENTS: 1000       # $10 for d == 0
      LATE_PENALTY_CENTS: 750         # $7.50 per day beyond the 2-day grace
      RE_CONSENT_BONUS_CENTS: 2500    # $25 bonus paid only at finalization, if re-consent occurred
    precision: "integer cents; no rounding except via round_half_up on intermediate decimal multiplications"
    variants:
      - name: provisional
        when: "Visit SCHEDULED -> COMPLETED; Payment.kind = PROVISIONAL is created"
        difference: |
          Computes provisional_cents only. Writes a Payment row with
          kind=PROVISIONAL and Payment.paid_at=null. The participant has not
          actually been paid yet.
      - name: final
        when: "Participant ENROLLED -> COMPLETED; for each COMPLETED Visit, a FINAL Payment row is issued"
        difference: |
          For every COMPLETED Visit with a PROVISIONAL Payment, writes one
          FINAL Payment row whose amount equals provisional_cents (unchanged)
          plus the RE_CONSENT_BONUS_CENTS (allocated to the LAST chronological
          COMPLETED Visit by sequence_no, with sequence_no DESC tie-break),
          and sets Payment.paid_at = now(). The PROVISIONAL rows remain as
          audit history; the sum of provisional rows is NOT what gets paid —
          the sum of FINAL rows is.
          DIFFERENCE FROM PROVISIONAL: a participant who never re-consents
          (no version >= 2 row, or signed_consent_version < active) gets
          final_total == sum(provisional). A participant who DID re-consent
          gets final_total = sum(provisional) + RE_CONSENT_BONUS_CENTS.

  - name: arm_assignment
    trigger: "Participant CONSENT_PENDING -> ENROLLED transition"
    algorithm: selector_policy
    formula: |
      # Inputs:
      #   trial.randomization_scheme (enum)
      #   trial.arms : list of Arm with (code, weight, assigned_count)
      #   trial.block_size (int, possibly null)
      #   trial.stratification_field (string, possibly null)
      #   participant.profile (map)
      #
      # Eligibility filter (candidate set): all Arm rows on this Trial.
      #
      # Ranking:
      #   if randomization_scheme == SIMPLE_BERNOULLI:
      #     pick arm such that arm.assigned_count / arm.weight is minimum;
      #     i.e. the arm with the largest deficit relative to its weight share.
      #   elif randomization_scheme == PERMUTED_BLOCK:
      #     # Order arms by Arm.code ASCENDING (stable).
      #     # Define the canonical block sequence: arm_codes repeated each
      #     # block_size/len(arms) times, in code-ascending order.
      #     # Position within the trial-wide block sequence = enrolled_count
      #     # (just before this enrollment). Pick the arm at that position.
      #   elif randomization_scheme == STRATIFIED_BLOCK:
      #     # Same as PERMUTED_BLOCK but using a per-stratum running counter
      #     # rather than the trial-wide enrolled_count. The stratum key is
      #     # participant.profile[stratification_field] (must be present;
      #     # otherwise ERR_STRATUM_KEY_MISSING).
      #
      # Tie-break (SIMPLE_BERNOULLI only): if two or more arms tie on the
      # ranking expression, pick the arm with the lexicographically smallest
      # Arm.code.
      #
      # Empty-pool fallback: if the trial has zero arms, ERR_NO_ARMS_DEFINED
      # (cannot happen post-submit because submit precondition requires >= 2
      # arms, but defensive).
    input_set: "All Arm rows on the Trial; the participant's profile only if randomization_scheme = STRATIFIED_BLOCK."
    constants: {}
    precision: "integer counters; deterministic — no randomness despite the name 'randomization' (this is BLOCK randomization with a fixed seed = arm.code order, which is the standard mechanism used in regulated trials so the assignment is auditable)."

  - name: blood_draw_window_check
    trigger: "POST /visits/{id}/complete (precondition gate, also used to determine when MISSED is allowed)"
    algorithm: threshold
    formula: |
      # Inputs:
      #   visit.target_date (date)
      #   visit.actual_draw_at (datetime)
      #   trial.blood_draw_window_days (int >= 0)
      #
      # Let d = abs((actual_draw_at::date) - target_date::date) in calendar days.
      #
      # Decision:
      #   if d <= blood_draw_window_days -> WITHIN_WINDOW (visit-complete allowed)
      #   else                            -> OUTSIDE_WINDOW (ERR_DRAW_OUTSIDE_WINDOW)
      #
      # Boundary semantics: the comparison is INCLUSIVE on both sides — a
      # draw exactly on target_date + window_days is WITHIN_WINDOW; a draw on
      # target_date + window_days + 1 is OUTSIDE_WINDOW.
    input_set: "The single Visit row and its parent Trial."
    constants: {}
    precision: "calendar-day arithmetic (date only; the time-of-day component of actual_draw_at is dropped after timezone normalization to UTC)."

# =============================================================================
# §1.4 Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in §1.7."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The acting role is allowed to invoke this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-bound parent ids resolve, left-to-right (e.g., /trials/{trial_id}/arms/{arm_id} — trial first, then arm)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Referenced foreign-key ids in the request body resolve."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK fields in body."

  - priority: 10
    category: state
    check: "Target resource is in a state from which the requested transition is declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: state
    check: "On POST /trials/{id}/open-enrollment, now() < Trial.irb_approval_expires_at."
    error_id: ERR_IRB_EXPIRED
    http_status: 409
    applies_to: "POST /trials/{id}/open-enrollment"

  - priority: 12
    category: state
    check: "On POST /trials/{id}/irb-reviews, the reviewer's X-User-ID is NOT the trial's created_by_user_id (segregation of duties)."
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /trials/{id}/irb-reviews"

  - priority: 20
    category: business_safety
    check: "On POST /participants/{id}/adverse-events, if severity in {SEVERE, LIFE_THREATENING}, auto-escalate is applied and the AE is created in ESCALATED_HOLD; this is not a rejection, but it preempts any concurrent visit-complete (see priority 30)."
    error_id: ERR_AE_BLOCKING
    http_status: 409
    applies_to: "interaction between AE reporting and visit completion"

  - priority: 30
    category: business_safety
    check: "On POST /visits/{id}/complete, Participant.open_ae_count == 0."
    error_id: ERR_AE_BLOCKING
    http_status: 409
    applies_to: "POST /visits/{id}/complete"

  - priority: 35
    category: business_safety
    check: "On POST /visits/{id}/complete, Participant.signed_consent_version == Trial.active_consent_version. (Re-consent gate: if a newer ConsentVersion has been published since enrollment, no further Visit may complete until the participant re-signs.)"
    error_id: ERR_CONSENT_VERSION_STALE
    http_status: 409
    applies_to: "POST /visits/{id}/complete"

  - priority: 40
    category: business_temporal
    check: "On POST /visits/{id}/complete, blood_draw_window_check returns WITHIN_WINDOW (inclusive boundary)."
    error_id: ERR_DRAW_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /visits/{id}/complete"

  - priority: 41
    category: business_temporal
    check: "On POST /visits/{id}/mark-missed, now() > target_date + blood_draw_window_days (i.e., the window has fully passed)."
    error_id: ERR_WINDOW_NOT_YET_PASSED
    http_status: 409
    applies_to: "POST /visits/{id}/mark-missed"

  - priority: 50
    category: business_referential
    check: "On POST /visits creation, Visit.sequence_no is unique within the participant."
    error_id: ERR_DUPLICATE_VISIT_SEQUENCE
    http_status: 409
    applies_to: "POST /participants/{id}/visits"

  - priority: 51
    category: business_referential
    check: "On AE creation, if caused_visit_id is set, the Visit belongs to the same participant_id (no cross-participant attribution)."
    error_id: ERR_CROSS_PARTICIPANT_REFERENCE
    http_status: 422
    applies_to: "POST /participants/{id}/adverse-events"

  - priority: 60
    category: business_constraint
    check: "On POST /trials/{id}/submit-for-irb, Trial has >= 2 Arm rows AND (if randomization_scheme is PERMUTED_BLOCK or STRATIFIED_BLOCK) block_size % len(arms) == 0 AND all Arm.weight equal AND (if STRATIFIED_BLOCK) stratification_field is non-null."
    error_id: ERR_RANDOMIZATION_MISCONFIGURED
    http_status: 422
    applies_to: "POST /trials/{id}/submit-for-irb"

  - priority: 61
    category: business_constraint
    check: "On POST /participants/{id}/sign-consent, the body's consent_version equals Trial.active_consent_version exactly."
    error_id: ERR_CONSENT_VERSION_STALE
    http_status: 409
    applies_to: "POST /participants/{id}/sign-consent"

  - priority: 62
    category: business_constraint
    check: "On POST /participants/{id}/sign-consent (entering ENROLLED), Trial.enrolled_count < Trial.target_enrollment."
    error_id: ERR_TRIAL_FULL
    http_status: 409
    applies_to: "POST /participants/{id}/sign-consent"

  - priority: 63
    category: business_constraint
    check: "On POST /trials/{trial_id}/consent-versions, if Trial.status not in {DRAFT, IRB_PENDING, APPROVED, OPEN_FOR_ENROLLMENT}, publishing is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /trials/{trial_id}/consent-versions"

  - priority: 70
    category: business_constraint
    check: "Protocol_code is unique across all Trial rows."
    error_id: ERR_DUPLICATE_PROTOCOL_CODE
    http_status: 409
    applies_to: "POST /trials, PATCH /trials/{id}"

  - priority: 80
    category: business_constraint
    check: "If randomization_scheme == STRATIFIED_BLOCK, participant.profile[stratification_field] is present at sign-consent time."
    error_id: ERR_STRATUM_KEY_MISSING
    http_status: 422
    applies_to: "POST /participants/{id}/sign-consent"

  - priority: 90
    category: business_constraint
    check: "OCC: if a request body includes version, the persisted row's version must equal the supplied version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /trials/{id}, PATCH /participants/{id}, PATCH /visits/{id}, PATCH /arms/{id}"

  - priority: 99
    category: business_constraint
    check: "Generic schema/range/regex validation on input fields."
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Trial CRUD + lifecycle ----
  - method: POST
    path: "/trials"
    description: "Create a new trial in DRAFT state. created_by_user_id is recorded from X-User-ID (used for SoD)."
    roles: [PrincipalInvestigator]
    code: 201
    input: ["protocol_code", "title", "sponsor_org", "inclusion_criteria", "exclusion_criteria", "randomization_scheme", "block_size?", "stratification_field?", "target_enrollment", "blood_draw_window_days"]
    output: Trial
    side_effects: ["Trial.status := DRAFT"]

  - method: GET
    path: "/trials"
    description: "List trials. Supports pagination (limit, offset) and filter by status."
    roles: [PrincipalInvestigator, IRBReviewer, StudyCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Trial[]"
    side_effects: []

  - method: GET
    path: "/trials/{trial_id}"
    description: "Read a single trial."
    roles: [PrincipalInvestigator, IRBReviewer, StudyCoordinator]
    code: 200
    input: []
    output: Trial
    side_effects: []

  - method: PATCH
    path: "/trials/{trial_id}"
    description: "Update trial metadata (title, sponsor_org, inclusion/exclusion criteria, target_enrollment). Only allowed in DRAFT."
    roles: [PrincipalInvestigator]
    code: 200
    input: ["title?", "sponsor_org?", "inclusion_criteria?", "exclusion_criteria?", "target_enrollment?", "version"]
    output: Trial
    side_effects: []

  - method: POST
    path: "/trials/{trial_id}/submit-for-irb"
    description: "Transition Trial DRAFT -> IRB_PENDING."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Trial
    side_effects: ["Validates §1.4 priority 60"]

  - method: POST
    path: "/trials/{trial_id}/irb-reviews"
    description: "Submit an IRB review decision; transitions the trial accordingly."
    roles: [IRBReviewer]
    code: 201
    input: [decision, notes]
    output: IRBReview
    side_effects: ["Trial state transition; if APPROVED, sets Trial.irb_approval_expires_at."]

  - method: GET
    path: "/trials/{trial_id}/irb-reviews"
    description: "List IRB review history for a trial."
    roles: [PrincipalInvestigator, IRBReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "IRBReview[]"
    side_effects: []

  - method: POST
    path: "/trials/{trial_id}/open-enrollment"
    description: "Trial APPROVED -> OPEN_FOR_ENROLLMENT."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Trial
    side_effects: []

  - method: POST
    path: "/trials/{trial_id}/close-enrollment"
    description: "Trial OPEN_FOR_ENROLLMENT -> CLOSED_TO_ENROLLMENT (manual)."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Trial
    side_effects: []

  - method: POST
    path: "/trials/{trial_id}/complete"
    description: "Trial CLOSED_TO_ENROLLMENT -> COMPLETED."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Trial
    side_effects: []

  - method: POST
    path: "/trials/{trial_id}/terminate"
    description: "Trial OPEN_FOR_ENROLLMENT -> TERMINATED with cascade to Participants and Visits."
    roles: [PrincipalInvestigator]
    code: 200
    input: ["reason?"]
    output: Trial
    side_effects: ["Cascades per §1.2"]

  # ---- Arms ----
  - method: POST
    path: "/trials/{trial_id}/arms"
    description: "Add an arm to a trial. Allowed only while Trial.status == DRAFT."
    roles: [PrincipalInvestigator]
    code: 201
    input: [code, label, weight]
    output: Arm
    side_effects: []

  - method: GET
    path: "/trials/{trial_id}/arms"
    description: "List arms on a trial."
    roles: [PrincipalInvestigator, IRBReviewer, StudyCoordinator]
    code: 200
    input: []
    output: "Arm[]"
    side_effects: []

  # ---- Consent Versions ----
  - method: POST
    path: "/trials/{trial_id}/consent-versions"
    description: "Publish a new ConsentVersion. The version number is server-minted (last+1). The new version becomes Trial.active_consent_version atomically."
    roles: [PrincipalInvestigator]
    code: 201
    input: ["document_uri", "change_summary?", "requires_re_consent?"]
    output: ConsentVersion
    side_effects: ["Trial.active_consent_version := version", "If requires_re_consent=true, all ENROLLED participants whose signed_consent_version < new version are marked 'stale-versioned' for re-consent gating per §1.4 priority 35."]

  - method: GET
    path: "/trials/{trial_id}/consent-versions"
    description: "List consent versions for a trial."
    roles: [PrincipalInvestigator, IRBReviewer, StudyCoordinator]
    code: 200
    input: []
    output: "ConsentVersion[]"
    side_effects: []

  # ---- Participants ----
  - method: POST
    path: "/participants"
    description: "Create a participant in SCREENING state, attached to a trial."
    roles: [StudyCoordinator]
    code: 201
    input: [trial_id, profile]
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read a participant."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/evaluate"
    description: "Run the eligibility calculation; transitions SCREENING -> ELIGIBLE | INELIGIBLE (forward-looking variant)."
    roles: [StudyCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant.eligibility_score := <computed>", "Participant.status updated."]

  - method: GET
    path: "/participants/{participant_id}/eligibility-history"
    description: "Replay eligibility per the chronological variant (criteria pinned to Participant.created_at)."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 200
    input: []
    output: "object"
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/request-consent"
    description: "Transition ELIGIBLE -> CONSENT_PENDING."
    roles: [StudyCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/sign-consent"
    description: "Transition CONSENT_PENDING -> ENROLLED. Performs arm assignment per §1.3."
    roles: [Participant_self, StudyCoordinator]
    code: 200
    input: [consent_version]
    output: Participant
    side_effects: ["Arm assigned", "Trial.enrolled_count++ and possibly auto-close enrollment"]

  - method: POST
    path: "/participants/{participant_id}/withdraw"
    description: "Withdraw participant. Cascades scheduled visits to CANCELLED and PROVISIONAL payments to REVERSAL."
    roles: [Participant_self, StudyCoordinator]
    code: 200
    input: ["reason?"]
    output: Participant
    side_effects: ["Cascades per §1.2"]

  - method: POST
    path: "/participants/{participant_id}/complete"
    description: "Transition ENROLLED -> COMPLETED. Finalizes payments per §1.3 final variant."
    roles: [StudyCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: ["Final Payment rows issued."]

  # ---- Visits ----
  - method: POST
    path: "/participants/{participant_id}/visits"
    description: "Schedule a visit on a participant."
    roles: [StudyCoordinator]
    code: 201
    input: [sequence_no, target_date]
    output: Visit
    side_effects: []

  - method: GET
    path: "/participants/{participant_id}/visits"
    description: "List visits on a participant."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 200
    input: []
    output: "Visit[]"
    side_effects: []

  - method: POST
    path: "/visits/{visit_id}/complete"
    description: "Mark a visit COMPLETED with actual_draw_at. Triggers compensation (provisional variant)."
    roles: [StudyCoordinator]
    code: 200
    input: [actual_draw_at]
    output: Visit
    side_effects: ["Creates PROVISIONAL Payment row."]

  - method: POST
    path: "/visits/{visit_id}/mark-missed"
    description: "Mark a visit MISSED (only after the window has fully passed)."
    roles: [StudyCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: DELETE
    path: "/visits/{visit_id}"
    description: "Cancel a SCHEDULED visit. Returns 204."
    roles: [StudyCoordinator]
    code: 204
    input: []
    output: null
    side_effects: ["Visit.status := CANCELLED"]

  # ---- Adverse Events ----
  - method: POST
    path: "/participants/{participant_id}/adverse-events"
    description: "Report an adverse event. Severity >= SEVERE auto-escalates to ESCALATED_HOLD with cascade."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 201
    input: ["severity", "narrative", "caused_visit_id?"]
    output: AdverseEvent
    side_effects: ["open_ae_count on participant ++; severity gates auto-escalation."]

  - method: POST
    path: "/participants/{participant_id}/adverse-events/{adverse_event_id}/start-review"
    description: "AE OPEN -> UNDER_REVIEW."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/adverse-events/{adverse_event_id}/escalate"
    description: "AE UNDER_REVIEW -> ESCALATED_HOLD."
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["Cascades scheduled visits -> CANCELLED."]

  - method: POST
    path: "/participants/{participant_id}/adverse-events/{adverse_event_id}/resolve"
    description: "AE {UNDER_REVIEW, ESCALATED_HOLD} -> RESOLVED."
    roles: [PrincipalInvestigator]
    code: 200
    input: [resolution_note]
    output: AdverseEvent
    side_effects: ["Participant.open_ae_count--"]

  - method: GET
    path: "/participants/{participant_id}/adverse-events"
    description: "List adverse events for a participant."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "AdverseEvent[]"
    side_effects: []

  # ---- Payments ----
  - method: GET
    path: "/participants/{participant_id}/payments"
    description: "List Payment rows (PROVISIONAL, FINAL, REVERSAL) for a participant. Sum of FINAL = paid to date."
    roles: [PrincipalInvestigator, StudyCoordinator]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: "Payment[]"
    side_effects: []

  # ---- Test-driving (test-only endpoints required by §1.5 testability principle) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server's logical clock so time-gated transitions (blood-draw window expiry, IRB approval expiry) become reachable from empty DB."
    roles: [PrincipalInvestigator, StudyCoordinator, IRBReviewer]
    code: 200
    input: [to_iso8601]
    output: "object"
    side_effects: ["Sets server clock to the supplied ISO 8601 timestamp (must be >= current clock; monotonic)."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or invalid X-User-ID / X-User-Role headers, or role not in §1.7."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not authorized for this endpoint per §1.7."

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation of duties violated — the acting IRBReviewer is the same X-User-ID as the trial's created_by_user_id (Principal Investigator)."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-bound parent or body-referenced FK id does not resolve."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is declared (e.g., visit-complete on already-COMPLETED visit)."

  - id: ERR_IRB_EXPIRED
    http: 409
    condition: "Trial.irb_approval_expires_at is in the past at the moment open-enrollment is requested."

  - id: ERR_RANDOMIZATION_MISCONFIGURED
    http: 422
    condition: "submit-for-irb: trial has < 2 arms, OR (block scheme) block_size not divisible by arm count, OR (block scheme) unequal arm weights, OR (STRATIFIED_BLOCK) stratification_field is null."

  - id: ERR_CONSENT_VERSION_STALE
    http: 409
    condition: "sign-consent: body.consent_version != Trial.active_consent_version. OR visit-complete: Participant.signed_consent_version != Trial.active_consent_version."

  - id: ERR_TRIAL_FULL
    http: 409
    condition: "sign-consent attempted when Trial.enrolled_count >= Trial.target_enrollment."

  - id: ERR_STRATUM_KEY_MISSING
    http: 422
    condition: "STRATIFIED_BLOCK trial, but participant.profile lacks the trial's stratification_field."

  - id: ERR_AE_BLOCKING
    http: 409
    condition: "visit-complete attempted while Participant.open_ae_count > 0; OR AE in ESCALATED_HOLD intersects with concurrent visit-complete."

  - id: ERR_DRAW_OUTSIDE_WINDOW
    http: 409
    condition: "visit-complete: abs(actual_draw_at::date - target_date::date) > blood_draw_window_days."

  - id: ERR_WINDOW_NOT_YET_PASSED
    http: 409
    condition: "mark-missed attempted before now() > target_date + blood_draw_window_days."

  - id: ERR_DUPLICATE_VISIT_SEQUENCE
    http: 409
    condition: "Visit.sequence_no already exists for this participant."

  - id: ERR_DUPLICATE_PROTOCOL_CODE
    http: 409
    condition: "Trial.protocol_code is not unique."

  - id: ERR_CROSS_PARTICIPANT_REFERENCE
    http: 422
    condition: "AE.caused_visit_id refers to a Visit whose participant_id != the AE's participant_id."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: request body version != persisted version on the row."

  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Schema / range / regex / enum validation failure on input fields."

  - id: ERR_NO_ARMS_DEFINED
    http: 422
    condition: "Defensive: arm_assignment invoked on a trial with zero arms (should never happen post-submit)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PrincipalInvestigator
    description: "Designs the trial, submits it for IRB review, manages consent versions and adverse-event workflows."
    identity: opaque
    exclusive_operations:
      - "POST /trials"
      - "PATCH /trials/{trial_id}"
      - "POST /trials/{trial_id}/submit-for-irb"
      - "POST /trials/{trial_id}/open-enrollment"
      - "POST /trials/{trial_id}/close-enrollment"
      - "POST /trials/{trial_id}/complete"
      - "POST /trials/{trial_id}/terminate"
      - "POST /trials/{trial_id}/arms"
      - "POST /trials/{trial_id}/consent-versions"
      - "POST /participants/{participant_id}/adverse-events/{adverse_event_id}/start-review"
      - "POST /participants/{participant_id}/adverse-events/{adverse_event_id}/escalate"
      - "POST /participants/{participant_id}/adverse-events/{adverse_event_id}/resolve"
    shared_operations:
      - "GET endpoints"
      - "POST /participants/{participant_id}/adverse-events (shared with StudyCoordinator)"
      - "POST /_clock/advance (test-only)"

  - name: IRBReviewer
    description: "Reviews trials submitted for IRB; can approve, request revisions, or reject. Cannot be the same X-User-ID as the trial's creator (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /trials/{trial_id}/irb-reviews"
    shared_operations:
      - "GET endpoints on trials, arms, consent-versions, irb-reviews"
      - "POST /_clock/advance (test-only)"

  - name: StudyCoordinator
    description: "Manages participants and visits day-to-day: screening, consent intake, visit scheduling and completion, AE intake."
    identity: opaque
    exclusive_operations:
      - "POST /participants"
      - "POST /participants/{participant_id}/evaluate"
      - "POST /participants/{participant_id}/request-consent"
      - "POST /participants/{participant_id}/complete"
      - "POST /participants/{participant_id}/visits"
      - "POST /visits/{visit_id}/complete"
      - "POST /visits/{visit_id}/mark-missed"
      - "DELETE /visits/{visit_id}"
    shared_operations:
      - "GET endpoints on participants, visits, payments"
      - "POST /participants/{participant_id}/sign-consent (shared with Participant_self)"
      - "POST /participants/{participant_id}/withdraw (shared with Participant_self)"
      - "POST /participants/{participant_id}/adverse-events (shared with PrincipalInvestigator)"
      - "POST /_clock/advance (test-only)"

  - name: Participant_self
    description: "Acts on their own participant record. X-User-ID equals Participant.id. May only sign consent and withdraw."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /participants/{participant_id}/sign-consent (only when participant_id == X-User-ID)"
      - "POST /participants/{participant_id}/withdraw (only when participant_id == X-User-ID)"
      - "GET /participants/{participant_id} (only when participant_id == X-User-ID)"
      - "GET /participants/{participant_id}/visits (only when participant_id == X-User-ID)"
      - "GET /participants/{participant_id}/payments (only when participant_id == X-User-ID)"
