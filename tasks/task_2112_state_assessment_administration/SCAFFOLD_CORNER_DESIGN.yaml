      - name: reconciling_a_lot_that_is_still_in_distribution_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_LOT_NOT_AWAITING_RECONCILIATION]
        distinguishing_aspect: >-
          Reconciliation is only legal from RETURNED_PENDING; on an IN_DISTRIBUTION lot it
          answers ERR_LOT_NOT_AWAITING_RECONCILIATION (409) and writes no declared counts.
        test_recipe:
          setup:
