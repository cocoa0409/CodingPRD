          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_STOCK_PROTOCOL_DISABLED"
            - "data.error_id != ERR_NO_ELIGIBLE_LOT"
            - "MedicationStockLot.${ins_lot_id}.quantity_on_hand == 10 and quantity_reserved == 0"
            - "HealthVisit.${visit_id}.pending_administration_count == 0"

      - name: administration_record_is_reachable_from_visit_authorization_and_lot
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /health-office/administration-records]
          - entities.AdministrationRecord.fields.visit_id
          - entities.AdministrationRecord.fields.authorization_id
          - entities.AdministrationRecord.fields.lot_id
          - entities.AdministrationRecord.fields.administering_nurse_id
        distinguishing_aspect: "The cascade-created lot_id and administering_nurse_id are only discoverable through the filtered list: GET /health-office/administration-records filtered by visit_id, by authorization_id, by lot_id and by administering_nurse_id each return exactly the same single record."
        test_recipe:
          setup:
            - "School FERN60 with an RN on an ACTIVE Monday block, one ENROLLED student, one AVAILABLE student-specific ALBUTEROL lot of 6 units and one order at (CONSENT_GRANTED, VERIFIED)."
            - "Clock at 2026-08-03T09:00:00Z; the encounter is IN_ASSESSMENT with exactly one PREPARED record for 1 unit."
          setup_api_calls:
            - call: "POST /health-office/schools"
