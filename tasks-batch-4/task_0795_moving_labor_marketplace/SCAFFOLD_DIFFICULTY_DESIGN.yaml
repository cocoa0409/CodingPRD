          assert:
            - "Quote.${qAt}.base_labor_cents == 24000"
            - "Quote.${qBelow}.base_labor_cents == 24000"
            - "Quote.${qAbove}.base_labor_cents == 30000"

      - name: crew_slots_full_boundary
        grounds:
          - validations[priority=6]
          - errors[ERR_CREW_FULL]
          - entities.Job.fields.crew_size
        distinguishing_aspect: "For a crew_size=2 job, exactly 2 assignments are accepted; the 3rd POST /assignments returns ERR_CREW_FULL — the count boundary is crew_size (2 allowed, 3rd rejected), a distinct metric and endpoint from the hours floor."
