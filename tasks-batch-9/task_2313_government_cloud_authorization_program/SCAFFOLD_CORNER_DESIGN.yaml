      - 'POST /offerings/{id}/data-categories as AgencyAuthorizingOfficial: HTTP 403 ERR_FORBIDDEN_ROLE — reported instead
        of the ERR_INVALID_STATE the CATEGORIZED offering would also earn, because priority 2 precedes priority 11'
      - 'POST /offerings/{id}/path-selection as ProgramBoardReviewer: HTTP 403 ERR_FORBIDDEN_ROLE'
