            - call: "POST /coop/sitting-requests/${reqA_id}/claims/${claimA_id}/accept"
              payload: { expected_sitting_request_version: "${reqA_v}" }
              as: Member
              as_user_id: "${f1_id}"
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet1_id}", start_at: "2026-10-01T12:00:00Z", end_at: "2026-10-01T16:00:00Z", instructions: "Sit B 23h case" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { reqB_id: $.data.id, reqB_v: $.data.version }
            - call: "POST /coop/sitting-requests/${reqB_id}/claims"
