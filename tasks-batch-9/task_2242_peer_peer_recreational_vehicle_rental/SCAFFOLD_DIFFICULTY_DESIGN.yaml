            - "L2: GET /rv-marketplace/ledger-entries?booking_id=${booking_id} returns exactly 2 rows, entry_type OWNER_CANCEL_FEE, amounts -16634 (party OWNER) and +16634 (party PLATFORM), summing to 0"
            - "L3: GET /rv-marketplace/owners/${owner_id} shows data.status == 'SUSPENDED' and data.listed_listing_count == 0"
            - "L3: GET /rv-marketplace/listings/${listing_id} and GET /rv-marketplace/listings/${listing2_id} both show data.listing_status == 'SUSPENDED'"
            - "L4: GET /rv-marketplace/bookings/${booking2_id} shows data.trip_status == 'CANCELLED_BY_PLATFORM', data.settlement_status == 'REFUNDED', data.refund_cents == 161289, data.hold_amount_cents == 0"
            - "L5: GET /rv-marketplace/delivery-assignments/${assignment2_id} shows data.status == 'VOIDED'"
            - "L5: GET /rv-marketplace/campgrounds/${campground_id} shows data.scheduled_assignment_count == 0"
            - "GET /rv-marketplace/renters/${renter_id} shows data.wallet_credit_cents == 800000 (both holds fully refunded) and data.renter_penalty_points == 0 (no renter penalty on an owner cancellation)"

