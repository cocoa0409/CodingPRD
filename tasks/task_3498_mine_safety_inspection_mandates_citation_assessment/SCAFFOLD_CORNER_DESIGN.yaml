          - calculations.penalty_dollar_pipeline
        distinguishing_aspect: "The on-time boundary is inclusive: verified_at exactly equal to abatement_deadline still earns the 10% discount at finalization — 15-point repeat citation verified at 2026-03-12T09:00:00Z finalizes at 174657c, and one second later would have forfeited it."
