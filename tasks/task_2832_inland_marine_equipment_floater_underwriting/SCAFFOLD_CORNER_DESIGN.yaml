      - name: corner_referral_decline_voids_parts_and_pending_floaters
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Policy.REFERRED_to_DECLINED
          - state_machines.InstallationFloater.PENDING_to_VOIDED
          - state_machines.Jobsite.SURVEYED_to_RELEASED
          - endpoints[POST /inland-marine/policies/{id}/referral-decision]
          - errors[ERR_POLICY_NOT_BINDABLE]
          - errors[ERR_PART_VOID]
        distinguishing_aspect: |
          The DECLINE branch of the referral decision is the only route to
          Policy.DECLINED, and it is a three-level cascade that the APPROVE branch does
          not run at all - every ACTIVE CoveragePart goes VOID, every PENDING
          InstallationFloater goes VOIDED with termination_trigger CANCELLATION, and the
          jobsite whose active_floater_count falls 1 -> 0 is RELEASED - while writing NO
          ledger entry and leaving written_premium_cents frozen at the declined quote of
          2733198. The sealed policy then refuses work through two DIFFERENT error ids
          from two different priority bands, and the VOID part beats the stale OCC token.
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One PUBLISHED RateRule: CRANE, T2_URBAN, age band 0-5, base_rate_bp 310, theft_hazard_grade B."
            - "One DRAFT Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with TWO ACTIVE coverage parts: a SCHEDULED_EQUIPMENT part carrying one AGREED_VALUE crane stated at 60000000 (premium 2557500) and an INSTALLATION_FLOATER part carrying one PENDING floater of 20000000 over 2026-09-01..2026-12-01 on a TIER_2 jobsite (premium 70575)."
            - "The policy is QUOTED (sum 2628075, written 2733198, TIV 60000000, referral_required true because TIV exceeds 50000000) and then REFERRED by underwriter uw-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "CRANE", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 310, theft_hazard_grade: "B" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Declined Crane Hire", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 100000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { cp_sched: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "INSTALLATION_FLOATER", valuation_basis: "ACV", aggregate_limit_cents: 50000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { cp_flt: $.data.id }
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Riverside Tower Site", territory_code: "T2_URBAN" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { js: $.data.id }
            - call: "POST /inland-marine/jobsites/${js}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp_sched}/equipment-items"
              payload: { description: "Tower crane", equipment_type: "CRANE", model_year: 2024, original_cost_cents: 30000000, ownership: "OWNED", valuation_basis: "AGREED_VALUE", stated_value_cents: 60000000, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp_flt}/installation-floaters"
              payload: { jobsite_id: "${js}", project_name: "Riverside curtain wall", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-12-01" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { flt: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /inland-marine/policies/${pol}/refer"
              payload: { referral_note: "TIV above delegated authority" }
              as: Underwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /inland-marine/policies/${pol}/referral-decision"
              payload: { decision: "DECLINE" }
              as: UnderwritingManager
