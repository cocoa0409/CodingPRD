  # --- PayLine ---
  - method: POST
    path: "/pay-periods/{id}/pay-lines"
    description: "Add a pay line (STIPEND|MILEAGE|BONUS) for an enumerator to an OPEN period"
    roles: [SurveyAdmin]
    code: 201
    input: [enumerator_id, line_type, amount_cents]
    output: PayLine
    side_effects: ["status=ACCRUED; period.provisional_total_cents += amount_cents; enumerator.gross_pay_cents += amount_cents; enumerator.net_pay_cents recomputed"]

  - method: GET
    path: "/pay-periods/{id}/pay-lines"
    description: "List pay lines in a period (FK reverse-reachability)"
    roles: [SurveyAdmin, FieldSupervisor, Enumerator, QCReviewer]
    code: 200
    input: []
    output: "PayLine[]"
    side_effects: []

  - method: POST
    path: "/pay-lines/{id}/reverse"
    description: "Reverse an accrued pay line (compensating)"
    roles: [SurveyAdmin]
    code: 200
    input: []
    output: PayLine
    side_effects: ["status->REVERSED; period.provisional_total_cents -= amount_cents; enumerator.reversed_pay_cents += amount_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # existence
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Survey project not found" }
  - { id: ERR_AREA_NOT_FOUND, http: 404, condition: "Assignment area not found" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Case not found" }
  - { id: ERR_ENUMERATOR_NOT_FOUND, http: 404, condition: "Enumerator not found (path or body reference)" }
  - { id: ERR_ATTEMPT_NOT_FOUND, http: 404, condition: "Attempt not found" }
  - { id: ERR_RESPONSE_NOT_FOUND, http: 404, condition: "Response not found" }
  - { id: ERR_REINTERVIEW_NOT_FOUND, http: 404, condition: "Reinterview not found" }
  - { id: ERR_PAY_PERIOD_NOT_FOUND, http: 404, condition: "Pay period not found" }
  - { id: ERR_PAY_LINE_NOT_FOUND, http: 404, condition: "Pay line not found" }
  # input
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, type mismatch, invalid enum, or window_end <= window_start" }
  - { id: ERR_UNSUPPORTED_LANGUAGE, http: 400, condition: "default_language not in supported_languages, or respondent_language not in project.supported_languages" }
  # OCC
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match Case.version" }
  # state
  - { id: ERR_PROJECT_INVALID_STATE, http: 409, condition: "Project not in a legal source state for the transition" }
  - { id: ERR_PROJECT_NOT_IN_FIELD, http: 409, condition: "Parent project must be IN_FIELD to open an area" }
  - { id: ERR_AREA_INVALID_STATE, http: 409, condition: "Area not in a legal source state for the transition" }
  - { id: ERR_AREA_NOT_IN_FIELD, http: 409, condition: "Area must be IN_FIELD for assignment" }
  - { id: ERR_AREA_FROZEN, http: 409, condition: "Area is FROZEN; attempts and responses are blocked" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "Case not in a legal state for the operation" }
  - { id: ERR_ENUMERATOR_INVALID_STATE, http: 409, condition: "Enumerator not in a legal source state for the transition" }
  - { id: ERR_ATTEMPT_NOT_CANCELLABLE, http: 409, condition: "Attempt is not in LOGGED and cannot be cancelled" }
  - { id: ERR_REINTERVIEW_INVALID_STATE, http: 409, condition: "Reinterview not in a legal source state for the transition" }
  - { id: ERR_PAY_PERIOD_INVALID_STATE, http: 409, condition: "Pay period not in a legal state for the operation" }
  - { id: ERR_PAY_LINE_ALREADY_REVERSED, http: 409, condition: "Pay line already REVERSED" }
  # business
  - { id: ERR_ENUMERATOR_NOT_ACTIVE, http: 409, condition: "Assignment target enumerator is not ACTIVE" }
  - { id: ERR_NOT_ASSIGNED_ENUMERATOR, http: 403, condition: "Acting enumerator is not the case's assigned enumerator" }
  - { id: ERR_MAX_ATTEMPTS_REACHED, http: 409, condition: "Case attempt_count has reached project.max_attempts" }
  - { id: ERR_ENUMERATOR_SCHEDULE_CONFLICT, http: 409, condition: "Attempt window overlaps another LOGGED attempt by the same enumerator" }
  - { id: ERR_CASE_CONTACT_COOLDOWN, http: 409, condition: "Attempt window within REST_BUFFER_MINUTES of another LOGGED attempt on the same case" }
  - { id: ERR_NO_CONTACT_MADE, http: 409, condition: "No LOGGED CONTACT_MADE attempt exists on the case" }
  - { id: ERR_LANGUAGE_NOT_SUPPORTED, http: 422, condition: "language_used not in capturing enumerator's languages" }
  - { id: ERR_REVIEWER_NOT_ACTIVE, http: 422, condition: "reviewer_enumerator_id is not an ACTIVE enumerator" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "reviewer_enumerator_id equals the response's capturing_enumerator_id" }
  - { id: ERR_AREA_BUDGET_EXCEEDED, http: 402, condition: "Attempt pay_committed_cents exceeds area budget_remaining_cents" }
  - { id: ERR_INVALID_OUTCOME, http: 400, condition: "finalize outcome not one of CONFIRMED|DISCREPANT|FRAUD" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SurveyAdmin
    description: "Regional operations administrator: projects, areas, roster import, enumerator hire pipeline, pay periods and pay lines, area freeze/unfreeze."
    identity: "opaque"
    exclusive_operations:
      - "POST /survey-projects"
      - "POST /survey-projects/{id}/open"
      - "POST /survey-projects/{id}/close"
      - "POST /survey-projects/{id}/assignment-areas"
      - "POST /assignment-areas/{id}/open"
      - "POST /assignment-areas/{id}/freeze"
      - "POST /assignment-areas/{id}/unfreeze"
      - "POST /assignment-areas/{id}/cases"
      - "POST /survey-projects/{id}/enumerators"
      - "POST /enumerators/{id}/hire"
      - "POST /enumerators/{id}/activate"
      - "POST /enumerators/{id}/suspend"
      - "POST /enumerators/{id}/reinstate"
      - "POST /survey-projects/{id}/pay-periods"
      - "POST /pay-periods/{id}/lock"
      - "POST /pay-periods/{id}/pay"
      - "POST /pay-periods/{id}/pay-lines"
      - "POST /pay-lines/{id}/reverse"
    shared_operations:
      - "All GET endpoints"

  - name: FieldSupervisor
    description: "Assigns and reassigns cases to enumerators and cancels erroneous attempts."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/assignments"
      - "POST /attempts/{id}/cancel"
    shared_operations:
      - "All GET endpoints"

  - name: Enumerator
    description: "Field worker who logs attempts and captures responses for their own assigned cases."
    identity: "entity_backed:Enumerator"
    exclusive_operations:
      - "POST /cases/{id}/attempts"
      - "POST /cases/{id}/responses"
    shared_operations:
      - "All GET endpoints"

  - name: QCReviewer
    description: "Quality-control reviewer who opens, starts and finalizes reinterviews. Cannot be the capturing enumerator of the response under review (segregation of duties enforced via reviewer_enumerator_id)."
    identity: "opaque"
    exclusive_operations:
      - "POST /responses/{id}/reinterviews"
      - "POST /reinterviews/{id}/start"
      - "POST /reinterviews/{id}/finalize"
    shared_operations:
      - "All GET endpoints"
