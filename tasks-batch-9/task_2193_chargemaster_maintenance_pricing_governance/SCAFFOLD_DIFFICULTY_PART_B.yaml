            - "PriceRule A: COST_PLUS_MARKUP, default three tiers, effective_from 2026-01-01, effective_to null, status ACTIVE."
            - "Five ChargeItems CDM-40001..CDM-40005, each cost_basis 60000c / medicare 18000c / market_p75 200000c, each repriced against PriceRule A (gross_charge_cents 144000, applied_price_rule_id = A) and each driven to lifecycle ACTIVE, so every item sits at version 5, price_status PRICED_CURRENT."
            - "Facility therefore reads active_item_count 5, aggregate_gross_charge_cents 720000, aggregate_cost_basis_cents 300000, stale_price_item_count 0, posture OPEN."
