        excluded_because:
          difficulty_instance: lameness_event_cascades_four_levels_to_slot_hold
          rationale: "The difficulty design already walks the full horse-to-seat-to-slot-to-hold chain end-to-end and asserts every intermediate level, which is exactly this layer's N-level claim."

      - name: both_retention_variants_on_the_same_staff_row
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: retention_bonus_projected_vs_settled_below_vesting_cliff
          rationale: "That instance reads the projected accrual and then settles the same staff member below the 50% cliff, asserting both variant results and the collapse to 0, so a second dual-variant instance would repeat it."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /bookings/{bookingId}/payments]
          - entities.Season.fields.bed_nights_sold
        distinguishing_aspect: "Nothing lags: the deposit response already carries deposit_paid_cents and payment_status DEPOSIT_PAID, the confirm response already carries booking_status CONFIRMED, and the very next season read already carries the 7 bed-nights the confirmation added to a different aggregate."
        test_recipe:
          setup:
            - "OPEN season with one cabin, one adult guest and one HELD solo booking"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id, held_status: $.data.booking_status, held_pay: $.data.payment_status, held_nights: $.data.nights, held_deposit: $.data.deposit_required_cents }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: RanchManager
              captures: { nights_before: $.data.bed_nights_sold }
          trigger:
            - call: "POST /bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 143850 }
              as: ReservationsAgent
              captures: { pay_status: $.data.payment_status, paid_cents: $.data.deposit_paid_cents, applied_cents: $.data.payments_applied_cents }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: ReservationsAgent
              captures: { confirm_status: $.data.booking_status }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: RanchManager
              captures: { nights_after: $.data.bed_nights_sold }
          assert:
            - "${held_status} == HELD"
            - "${held_pay} == AWAITING_DEPOSIT"
            - "${held_nights} == 7"
            - "${held_deposit} == 143850"
            - "${nights_before} == 0"
            - "${pay_status} == DEPOSIT_PAID"
            - "${paid_cents} == 143850"
            - "${applied_cents} == 143850"
            - "${confirm_status} == CONFIRMED"
            - "${nights_after} == 7"
            - "no read is ever retried or delayed: each derived value is correct in the first response that could carry it"
