            - { call: "POST /properties/${p18}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G18", email: "g18@x.com" }, as: Anonymous, captures: { g18: "$.data.id" } }
            - { call: "POST /properties/${p18}/quote", payload: { check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { occ_before: "$.data.occupancy_pct" } }
            - { call: "POST /bookings", payload: { property_id: "${p18}", guest_id: "${g18}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { b18: "$.data.id" } }
            - { call: "POST /properties/${p18}/quote", payload: { check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { occ_during: "$.data.occupancy_pct" } }
          trigger:
