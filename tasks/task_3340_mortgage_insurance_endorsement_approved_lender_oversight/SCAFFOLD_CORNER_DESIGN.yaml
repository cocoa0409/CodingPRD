# =============================================================================
# SCAFFOLD_CORNER_DESIGN — FHA Mortgage Insurance Endorsement & Approved Lender Oversight
# §1.9: enumerative breadth coverage of every testable claim declared by
# SCAFFOLD.yaml §1.1–§1.7 (non-Difficulty-Rule corners). Section and claim_type
# values follow references/claim-extraction-guide.md.
# Clock note: startup default logical clock is exactly 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: lender_creation_lands_in_desk_review_with_defaults
        claim_type: creation
        grounds: [entities.Lender.fields.status, entities.Lender.fields.endorsed_volume_cents, "endpoints[POST /mi/lenders]"]
        distinguishing_aspect: "POST /mi/lenders with all required input fields returns 201 and the Lender lands in DESK_REVIEW with endorsed_volume_cents 0 and version 1."
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mi/lenders", payload: { legal_name: "Acme Mortgage Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          assert:
            - "response status == 201"
            - "Lender.${len_id}.status == DESK_REVIEW"
            - "Lender.${len_id}.endorsed_volume_cents == 0"
            - "Lender.${len_id}.version == 1"

      - name: lender_get_returns_stored_input_fields
        claim_type: retrieval
        grounds: [entities.Lender.fields.legal_name, entities.Lender.fields.institution_type, "endpoints[GET /mi/lenders/{lenderId}]"]
        distinguishing_aspect: "GET /mi/lenders/{id} returns the exact legal_name, institution_type, home_state and qc_plan_on_file supplied at creation."
        test_recipe:
          setup: ["one lender created"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Blue Ridge Mortgage", institution_type: MORTGAGEE_NONSUPERVISED, home_state: "NC", qc_plan_on_file: false }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin }
          assert:
            - "response status == 200"
            - "data.legal_name == Blue Ridge Mortgage"
            - "data.institution_type == MORTGAGEE_NONSUPERVISED"
            - "data.home_state == NC"
            - "data.qc_plan_on_file == false"

      - name: lender_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /mi/lenders/{id} with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: lender_creation_missing_legal_name_rejected
        claim_type: required_fields
        grounds: [entities.Lender.fields.legal_name, "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /mi/lenders without the required legal_name field returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mi/lenders", payload: { institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: lender_creation_invalid_institution_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Lender.fields.institution_type, "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "institution_type outside {MORTGAGEE_SUPERVISED, MORTGAGEE_NONSUPERVISED, MORTGAGEE_INVESTING} returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mi/lenders", payload: { legal_name: "Bad Enum Bank", institution_type: "BANK", home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: lender_system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.Lender, "validations[priority=5]"]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: the create response carries a server UUID id, version 1, and created_at equal to the logical clock default — no client input influences them."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mi/lenders", payload: { legal_name: "Sys Fields Co", institution_type: MORTGAGEE_INVESTING, home_state: "MD", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          assert:
            - "response status == 201"
            - "Lender.${len_id}.id is a server-minted UUID (present, non-null)"
            - "Lender.${len_id}.version == 1"
            - "Lender.${len_id}.created_at == 2026-09-01T00:00:00Z (logical clock)"
            - "Lender.${len_id}.updated_at == 2026-09-01T00:00:00Z (logical clock)"

      - name: filing_computes_adjusted_net_worth
        claim_type: computed_fields
        grounds: [entities.FinancialFiling.fields.adjusted_net_worth_cents, "endpoints[POST /mi/lenders/{lenderId}/financial-filings]"]
        distinguishing_aspect: "adjusted_net_worth_cents is computed as total_assets_cents - total_liabilities_cents (50000000000 - 49000000000 == 100000000) and the filing lands in SUBMITTED."
        test_recipe:
          setup: ["one lender in DESK_REVIEW, version 1"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "NW Test Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v: $.data.version } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
          assert:
            - "response status == 201"
            - "FinancialFiling.${fil_id}.adjusted_net_worth_cents == 100000000"
            - "FinancialFiling.${fil_id}.status == SUBMITTED"

      - name: filing_creation_with_unknown_lender_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]", "endpoints[POST /mi/lenders/{lenderId}/financial-filings]"]
        distinguishing_aspect: "POST /mi/lenders/{id}/financial-filings under a non-existent lender id returns 404 ERR_NOT_FOUND even for an otherwise valid payload with a well-formed OCC version."
        test_recipe:
          setup: ["one lender created (only to source a legitimate version value); the target lender id in the trigger path does not exist"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Decoy Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { decoy_v: $.data.version } }
          trigger:
            - { call: "POST /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${decoy_v}" }, as: LenderOfficer, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: loan_case_creation_lands_in_case_number_assigned
        claim_type: creation
        grounds: [entities.LoanCase.fields.status, entities.LoanCase.fields.endorsement_integrity, "endpoints[POST /mi/loan-cases]"]
        distinguishing_aspect: "A case created under an APPROVED lender lands in CASE_NUMBER_ASSIGNED with endorsement_integrity SOUND, mip_cancelled false, mip_retained_cents 0."
        test_recipe:
          setup: ["one lender fully approved (field review, accepted filing, approve)"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Case Origination Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "BRW-001", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
          assert:
            - "response status == 201"
            - "LoanCase.${lc_id}.status == CASE_NUMBER_ASSIGNED"
            - "LoanCase.${lc_id}.endorsement_integrity == SOUND"
            - "LoanCase.${lc_id}.mip_cancelled == false"
            - "LoanCase.${lc_id}.mip_retained_cents == 0"

      - name: loan_case_creation_rejected_when_lender_not_approved
        claim_type: fk_integrity
        grounds: [entities.LoanCase.fields.lender_id, "errors[ERR_LENDER_NOT_APPROVED]", "validations[priority=9]"]
        distinguishing_aspect: "POST /mi/loan-cases referencing a real lender still in DESK_REVIEW returns 409 ERR_LENDER_NOT_APPROVED (cross-entity referential gate, not a not-found)."
        test_recipe:
          setup: ["one lender in DESK_REVIEW (never approved)"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Unapproved Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "BRW-001", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_LENDER_NOT_APPROVED"

      - name: loan_case_creation_invalid_refinance_reference_rejected
        claim_type: fk_integrity
        grounds: [entities.LoanCase.fields.refinance_of_case_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "refinance_of_case_id pointing at a non-existent case id is rejected with 404 ERR_NOT_FOUND; a dangling refinance FK must never persist."
        test_recipe:
          setup: ["one approved lender"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Refi Ref Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "BRW-002", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000, refinance_of_case_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: loan_case_list_filter_by_lender_id
        claim_type: listing
        grounds: ["endpoints[GET /mi/loan-cases]", entities.LoanCase.fields.lender_id]
        distinguishing_aspect: "GET /mi/loan-cases?lender_id=X returns only cases of lender X (1 row) while a second lender's case is excluded; response envelope carries total_count and has_more."
        test_recipe:
          setup: ["two approved lenders; lender A has one case, lender B has one case"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "List Filter A", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_a: $.data.id } }
            - { call: "POST /mi/lenders/${len_a}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_a_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_a}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_a_v2}" }, as: LenderOfficer, as_user_id: "${len_a}", captures: { fil_a: $.data.id } }
            - { call: "GET /mi/lenders/${len_a}", payload: {}, as: PlatformAdmin, captures: { len_a_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_a}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_a_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_a}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/lenders", payload: { legal_name: "List Filter B", institution_type: MORTGAGEE_SUPERVISED, home_state: "MD", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_b: $.data.id } }
            - { call: "POST /mi/lenders/${len_b}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_b_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_b}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_b_v2}" }, as: LenderOfficer, as_user_id: "${len_b}", captures: { fil_b: $.data.id } }
            - { call: "GET /mi/lenders/${len_b}", payload: {}, as: PlatformAdmin, captures: { len_b_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_b}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_b_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_b}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_a}", borrower_reference: "A-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_a}", captures: { lc_a: $.data.id } }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_b}", borrower_reference: "B-1", base_loan_amount_cents: 25000000, appraised_value_cents: 26000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 180000 }, as: LenderOfficer, as_user_id: "${len_b}" }
          trigger:
            - { call: "GET /mi/loan-cases", payload: { lender_id: "${len_a}" }, as: PlatformAdmin }
          assert:
            - "response status == 200"
            - "response.data.total_count == 1"
            - "response.data.has_more == false"
            - "the single row's id == ${lc_a}"

      - name: appraisal_creation_computes_expiry_date
        claim_type: computed_fields
        grounds: [entities.Appraisal.fields.expiry_date, "endpoints[POST /mi/loan-cases/{loanCaseId}/appraisals]"]
        distinguishing_aspect: "expiry_date is computed as effective_date + 120 days (2026-01-01 + 120d == 2026-05-01), the appraisal lands DELIVERED, and mps_deficiency_codes defaults to []."
        test_recipe:
          setup: ["one approved lender with one case in CASE_NUMBER_ASSIGNED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Appraisal Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "AP-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-01-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
          assert:
            - "response status == 201"
            - "Appraisal.${ap_id}.status == DELIVERED"
            - "Appraisal.${ap_id}.expiry_date == 2026-05-01"
            - "Appraisal.${ap_id}.mps_deficiency_codes == []"

      - name: escrow_creation_lands_open_with_remaining_equal_to_amount
        claim_type: defaults
        grounds: [entities.RepairEscrow.fields.remaining_amount_cents, entities.RepairEscrow.fields.disbursed_amount_cents, "endpoints[POST /mi/loan-cases/{loanCaseId}/repair-escrows]"]
        distinguishing_aspect: "A created escrow lands OPEN with remaining_amount_cents == amount_cents, disbursed_amount_cents == 0 and freeze_origin null."
        test_recipe:
          setup: ["one approved lender with one case in CASE_NUMBER_ASSIGNED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Escrow Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "ESC-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { esc_id: $.data.id } }
          assert:
            - "RepairEscrow.${esc_id}.status == OPEN"
            - "RepairEscrow.${esc_id}.remaining_amount_cents == 500000"
            - "RepairEscrow.${esc_id}.disbursed_amount_cents == 0"
            - "RepairEscrow.${esc_id}.freeze_origin == null"

      - name: escrow_creation_start_after_end_rejected
        claim_type: type_constraints
        grounds: [entities.RepairEscrow.fields.start_date, entities.RepairEscrow.fields.end_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "start_date after end_date violates the closed-window field domain and returns 400 ERR_VALIDATION (no escrow persisted)."
        test_recipe:
          setup: ["one approved lender with one case"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Escrow Window Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "ESC-2", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-07-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: lender_advance_to_field_review_records_advancer
        claim_type: valid_transition
        grounds: [state_machines.Lender.DESK_REVIEW_to_FIELD_REVIEW, entities.Lender.fields.advanced_by_user_id]
        distinguishing_aspect: "ADVANCE_TO_FIELD_REVIEW moves DESK_REVIEW -> FIELD_REVIEW, stamps advanced_by_user_id with the caller's X-User-ID, and bumps version to 2."
        test_recipe:
          setup: ["one lender in DESK_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Advance Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v: $.data.version } }
          assert:
            - "response status == 200"
            - "data.status == FIELD_REVIEW"
            - "data.advanced_by_user_id == rev-1"
            - "data.version == 2"

      - name: lender_return_from_desk_review
        claim_type: valid_transition
        grounds: [state_machines.Lender.DESK_REVIEW_to_RETURNED]
        distinguishing_aspect: "RETURN from DESK_REVIEW lands the lender in RETURNED."
        test_recipe:
          setup: ["one lender in DESK_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Return Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RETURN }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 200"
            - "data.status == RETURNED"

      - name: lender_resubmit_cycle_returns_to_desk_review
        claim_type: valid_transition
        grounds: [state_machines.Lender.RETURNED_to_DESK_REVIEW]
        distinguishing_aspect: "The cyclic resubmission loop works: DESK_REVIEW -> RETURNED -> DESK_REVIEW via RETURN then owner RESUBMIT."
        test_recipe:
          setup: ["one lender returned from desk review"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Cycle Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RETURN }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RESUBMIT }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 200"
            - "data.status == DESK_REVIEW"

      - name: lender_advance_from_field_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lender.DESK_REVIEW_to_FIELD_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ADVANCE_TO_FIELD_REVIEW is only declared from DESK_REVIEW; attempting it from FIELD_REVIEW returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["one lender already in FIELD_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Bad Advance Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-2 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lender_resubmit_from_desk_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lender.RETURNED_to_DESK_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RESUBMIT is only declared from RETURNED; from DESK_REVIEW it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["one lender in DESK_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Bad Resubmit Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RESUBMIT }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lender_approve_from_desk_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lender.FIELD_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVE is only declared from FIELD_REVIEW; from DESK_REVIEW it returns 409 ERR_INVALID_STATE (state gate fires before segregation-of-duties)."
        test_recipe:
          setup: ["one lender in DESK_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Bad Approve Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lender_return_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Lender.DESK_REVIEW_to_RETURNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second RETURN after the lender is already RETURNED is not a silent no-op: it is rejected with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["one lender already RETURNED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Twice Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RETURN }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RETURN }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lender_terminate_from_approved_with_no_cases
        claim_type: valid_transition
        grounds: [state_machines.Lender.APPROVED_to_TERMINATED]
        distinguishing_aspect: "APPROVED -> TERMINATED succeeds when the lender has no loan cases at all (the no-active-cases precondition is vacuously satisfied)."
        test_recipe:
          setup: ["one fully approved lender with zero loan cases"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Terminate Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: TERMINATE }, as: FhaApprover, as_user_id: app-1 }
          assert:
            - "response status == 200"
            - "data.status == TERMINATED"

      - name: lender_terminated_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Lender, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "From terminal TERMINATED every further status-change action is rejected with 409 ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["one terminated lender"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Locked Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: TERMINATE }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_ALREADY_TERMINAL"

      - name: lender_suspend_reinstate_round_trip
        claim_type: valid_transition
        grounds: [state_machines.Lender.APPROVED_to_SUSPENDED, state_machines.Lender.SUSPENDED_to_APPROVED]
        distinguishing_aspect: "The APPROVED -> SUSPENDED -> APPROVED cycle restores APPROVED status and each hop increments Lender.version by 1."
        test_recipe:
          setup: ["one fully approved lender"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Suspend Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1, captures: { len_v5: $.data.version } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: REINSTATE }, as: FhaApprover, as_user_id: app-1, captures: { len_final: $.data.version } }
          assert:
            - "first trigger response data.status == SUSPENDED"
            - "second trigger response data.status == APPROVED"
            - "Lender.${len_id}.version == ${len_v5} + 2"

      - name: filing_reject_lands_rejected
        claim_type: valid_transition
        grounds: [state_machines.FinancialFiling.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "decision=REJECT moves the filing SUBMITTED -> REJECTED, stamps decided_by_user_id, and increments Lender.version by 1."
        test_recipe:
          setup: ["one lender with one SUBMITTED filing"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Reject Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v2: $.data.version } }
          trigger:
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: REJECT, expected_lender_version: "${len_v2}" }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 200"
            - "data.status == REJECTED"
            - "data.decided_by_user_id == rev-1"
            - "Lender.${len_id}.version == 3"

      - name: filing_decide_from_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FinancialFiling, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A second decide on a REJECTED filing is rejected 409 ERR_ALREADY_TERMINAL — REJECTED is terminal."
        test_recipe:
          setup: ["one lender whose only filing is REJECTED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Filing Lock Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: REJECT, expected_lender_version: "${len_v2}" }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_ALREADY_TERMINAL"

      - name: filing_accept_supersedes_prior_accepted_same_fiscal_year
        claim_type: side_effect_execution
        grounds: [state_machines.FinancialFiling.ACCEPTED_to_SUPERSEDED, entities.Lender.fields.last_accepted_filing_id]
        distinguishing_aspect: "Accepting a second filing for the same lender and same fiscal_year_end flips the previously ACCEPTED filing to SUPERSEDED and re-points lender.last_accepted_filing_id."
        test_recipe:
          setup: ["one lender with one ACCEPTED filing for fiscal_year_end 2025-12-31 and a second SUBMITTED filing for the same fiscal_year_end"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Supersede Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_1: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_1}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v2}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 51000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 6000000000, expected_lender_version: "${len_v3}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_2: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v4: $.data.version } }
          trigger:
            - { call: "POST /mi/financial-filings/${fil_2}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v4}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "GET /mi/lenders/${len_id}/financial-filings", payload: {}, as: PlatformAdmin }
          assert:
            - "FinancialFiling.${fil_1}.status == SUPERSEDED"
            - "FinancialFiling.${fil_2}.status == ACCEPTED"
            - "Lender.${len_id}.last_accepted_filing_id == ${fil_2}"

      - name: loan_case_flag_deficient_records_codes
        claim_type: valid_transition
        grounds: [state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_DEFICIENT, entities.LoanCase.fields.deficiency_codes]
        distinguishing_aspect: "FLAG_DEFICIENT moves UNDERWRITE_SUBMITTED -> DEFICIENT and stores the request's deficiency_codes verbatim on the case."
        test_recipe:
          setup: ["one approved lender with one case in UNDERWRITE_SUBMITTED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Deficient Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "DEF-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: FLAG_DEFICIENT, deficiency_codes: ["INCOME_DOC_STALE"] }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 200"
            - "LoanCase.${lc_id}.status == DEFICIENT"
            - "LoanCase.${lc_id}.deficiency_codes == [INCOME_DOC_STALE]"

      - name: loan_case_deficiency_cure_cycle_resubmits
        claim_type: valid_transition
        grounds: [state_machines.LoanCase.DEFICIENT_to_UNDERWRITE_SUBMITTED]
        distinguishing_aspect: "The deficiency-cure cycle works: UNDERWRITE_SUBMITTED -> DEFICIENT -> UNDERWRITE_SUBMITTED via submit-underwriting from DEFICIENT."
        test_recipe:
