      - name: task_list_filters_compose_with_offset_pagination
        claim_type: Listing
        grounds:
          - endpoints."GET /records/redaction-tasks"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three tasks on one record split 2/1 between QA_PENDING and DRAFT, so a status
          filter, a reviewer filter and limit/offset paging each report total_count over
          the filtered set rather than over the whole table.
        test_recipe:
          setup:
            - "One 60-minute ROUTINE recording ruled RESPONSIVE, carrying three redaction tasks on disjoint target types so no clip-overlap check fires."
            - "The FACE and LICENSE_PLATE tasks are submitted to the same reviewer 31 minutes apart, which clears the 30-minute buffered window rule, so both sit in QA_PENDING."
            - "The AUDIO_IDENTIFIER task is left in DRAFT; the technician holds certification level 2, which is the requirement for a non-FACE, non-plate target."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Tech Two", role_type: "TECHNICIAN", redaction_certification_level: 2 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { tech_id: $.data.id } }
