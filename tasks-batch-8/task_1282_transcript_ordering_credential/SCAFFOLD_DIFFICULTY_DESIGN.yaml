  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_conserves_captured_minus_refunded
        grounds:
          - calculations.order_refund_on_failure
          - calculations.payment_capture_reconcile
          - state_machines.TranscriptOrder.payment_status.CAPTURED_to_REFUNDED
          - entities.Payment.fields.captured_cents
          - entities.Payment.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity: captured_cents - refunded_cents (the "live
          capture balance"). Forward action = capture (raises captured);
          compensating action = refund (raises refunded by same magnitude).
          Invariant: at every observable point, 0 <= refunded_cents <=
          captured_cents, and after a full refund captured_cents ==
          refunded_cents (balance == 0).
