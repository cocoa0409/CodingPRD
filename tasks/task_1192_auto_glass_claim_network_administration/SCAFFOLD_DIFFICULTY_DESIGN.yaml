        distinguishing_aspect: |
          Pair Claim -> Policy: verify-coverage is valid only while the linked
          Policy is ACTIVE and COMPREHENSIVE; a claim whose policy is CANCELLED
          (or LIABILITY) cannot advance, so Claim transitions are gated by a
          different entity's state.
        test_recipe:
          setup:
