scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: unit_price_vs_tm_gross_diverge_on_identical_field_outcome
        grounds:
          - calculations.work_order_billable_amount
          - entities.BillingLine.fields.gross_cents
          - entities.WorkOrder.fields.billing_method
          - endpoints["POST /vm/work-orders/{id}/billing-lines"]
        distinguishing_aspect: |
          This instance is dual-variant COST ACCOUNTING on the WorkOrder/BillingLine domain: two
          spans with byte-identical field outcomes (same span_miles, same 180 units, same 8 labor
          hours, same crew) priced under the unit_price and time_and_materials variants yield
          gross_cents 864000 and 128064 respectively - a divergence of 735936 cents on the same work.
        test_recipe:
          setup:
            - "One ACTIVE 12kV/RAPID prescription; circuit CKT-A resolved to it."
            - "One RELEASED work plan with two spans of 2.5 miles and 200 planned units each: WO-U billed UNIT_PRICE, WO-T billed TIME_AND_MATERIALS."
            - "One BUCKET crew at 8533 cents/hour books each span on a separate day and files one identical production entry per span: 180 units, 8 labor hours, 6 equipment hours, 1 disposal ton."
            - "Both spans COMPLETED with zero customer refusals, so refusal_blocked_unit_count is 0 on both."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_u: $.data.id }
            - call: "POST /vm/work-orders/${wo_u}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_u}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crews"
              payload: { crew_code: "CRW-1", crew_type: "BUCKET", headcount: 3, hourly_rate_cents: 8533, home_district: "NORTH" }
              as: ContractorPlanner
              captures: { crew1_id: $.data.id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_u}", crew_id: "${crew1_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_u: $.data.id }
            - call: "POST /vm/work-orders/${wo_u}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_u}", work_date: "2026-08-03", units_trimmed: 180, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_u}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "TIME_AND_MATERIALS", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_t: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_t}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_t}", crew_id: "${crew1_id}", start_at: "2026-08-04T08:00:00Z", end_at: "2026-08-04T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_t: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_t}", work_date: "2026-08-04", units_trimmed: 180, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_t}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "GET /vm/work-orders/${wo_u}"
              payload: {}
              as: BillingAnalyst
              captures: { wo_u_v: $.data.version }
            - call: "GET /vm/work-orders/${wo_t}"
              payload: {}
              as: BillingAnalyst
              captures: { wo_t_v: $.data.version }
          trigger:
            - call: "POST /vm/work-orders/${wo_u}/billing-lines"
              payload: { billing_method: "UNIT_PRICE", expected_work_order_version: "${wo_u_v}" }
              as: BillingAnalyst
              captures: { bl_u: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/billing-lines"
              payload: { billing_method: "TIME_AND_MATERIALS", expected_work_order_version: "${wo_t_v}" }
              as: BillingAnalyst
              captures: { bl_t: $.data.id }
          assert:
            - "BillingLine.${bl_u}.gross_cents == 864000"
            - "BillingLine.${bl_u}.billable_units == 180"
            - "BillingLine.${bl_u}.density_multiplier == 1.00"
            - "BillingLine.${bl_u}.final_payable_cents == 820800"
            - "BillingLine.${bl_t}.gross_cents == 128064"
            - "BillingLine.${bl_t}.billable_units == 0"
            - "BillingLine.${bl_t}.retainage_cents == 0"
            - "BillingLine.${bl_t}.final_payable_cents == 128064"
            - "BillingLine.${bl_u}.gross_cents != BillingLine.${bl_t}.gross_cents"
            - "WorkPlan.${wp_id}.committed_cents == 948864"

      - name: reliability_index_rolling36_vs_program_ytd_diverge
        grounds:
          - calculations.circuit_reliability_index
          - entities.Circuit.fields.reliability_index_36mo
          - entities.Circuit.fields.reliability_index_ytd
          - endpoints["GET /vm/circuits/{id}/reliability"]
        distinguishing_aspect: |
          This instance is dual-variant RELIABILITY SCORING on the Circuit domain - a different
          entity domain from the WorkOrder cost accounting above: the identical set of four
          tree-caused OutageRecords yields rolling_36_month_index 5.00 and
          program_year_to_date_index 2.50, because two of the four outages predate January 1 2026.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default (never set)."
            - "Circuit CKT-A with customer_count 1200 resolved to an ACTIVE 12kV/RAPID prescription."
            - "Four tree-caused outages of 1500 customer_minutes each at 2024-09-10, 2025-05-20, 2026-02-11 and 2026-07-01, plus one NON_TREE outage of 9000 customer_minutes at 2026-03-01 that must be excluded from both windows."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2024-09-10T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2025-05-20T00:00:00Z", cause_code: "TREE_FELL_ON", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-02-11T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-03-01T00:00:00Z", cause_code: "NON_TREE", customers_affected: 900, customer_minutes: 9000 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-07-01T00:00:00Z", cause_code: "TREE_FELL_ON", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
          trigger:
            - call: "GET /vm/circuits/${ckt_id}/reliability"
              payload: {}
              as: UtilityForester
              captures: { roll: $.data.rolling_36_month_index, ytd: $.data.program_year_to_date_index }
          assert:
            - "rolling_36_month_index == 5.00"
            - "program_year_to_date_index == 2.50"
            - "tree_caused_outage_count_36mo == 4"
            - "reliability_tier == TIER_ELEVATED"
            - "Circuit.${ckt_id}.reliability_index_36mo == 5.00"
            - "Circuit.${ckt_id}.reliability_index_ytd == 2.50"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: trim_cycle_months_nested_clamp_over_growth_and_tier_factors
        grounds:
          - calculations.trim_cycle_months
          - calculations.circuit_reliability_index
          - entities.Circuit.fields.cycle_months
          - entities.Circuit.fields.next_trim_due_on
          - endpoints["POST /vm/outage-records"]
        distinguishing_aspect: |
          Mode (a) - four inputs (base_cycle_years, growth_zone factor, reliability_tier factor,
          voltage_class floor/ceiling) interact non-linearly through a nested max(floor, min(ceiling,
          round_half_up(product))): 4 * 12 * 0.75 * 0.80 = 28.8 rounds to 29 and survives the
          max(24, min(72, 29)) clamp, while the un-accelerated circuit sits at exactly 36.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "Circuit CKT-A: DISTRIBUTION_12KV, RAPID, last trim 2024-03-15, resolved to a base_cycle_years 4 prescription; TIER_NORMAL with three tree outages recorded."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2024-09-10T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2025-05-20T00:00:00Z", cause_code: "TREE_FELL_ON", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-02-11T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
          trigger:
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-07-01T00:00:00Z", cause_code: "TREE_FELL_ON", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "GET /vm/circuits/${ckt_id}"
              payload: {}
              as: UtilityForester
              captures: { cyc_after: $.data.cycle_months }
          assert:
            - "before the trigger Circuit.${ckt_id}.reliability_tier == TIER_NORMAL, cycle_months == 36 and next_trim_due_on == 2027-03-15"
            - "Circuit.${ckt_id}.reliability_tier == TIER_ELEVATED"
            - "Circuit.${ckt_id}.cycle_months == 29"
            - "Circuit.${ckt_id}.next_trim_due_on == 2026-08-15"

      - name: tm_gross_rounds_per_production_entry_then_sums
        grounds:
          - calculations.work_order_billable_amount
          - entities.ProductionEntry.fields.entry_cents
          - entities.BillingLine.fields.gross_cents
          - endpoints["POST /vm/production-entries"]
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the answer: with an 8533 cents/hour crew,
          three entries round individually to 192529, 144639 and 29866 for a T&M gross of 367034,
          whereas summing the unrounded values (192529 + 144638.5 + 29865.5 = 367033.0) and
          rounding once yields 367033. The scaffold pins round-per-entry-then-sum.
        test_recipe:
          setup:
            - "One T&M span WO-T of 1.0 mile with 100 planned units under a RELEASED plan."
            - "One BUCKET crew at 8533 cents/hour holds one booking on the span."
            - "Three production entries on that booking: (12 h labor, 8 h equipment, 2 tons, 40 units), (9.5 h, 6.25 h, 1.5 tons, 35 units) and (3.5 h, 0 h, 0 tons, 10 units)."
            - "Span COMPLETED; 85 of 100 planned units done, inside the 110 percent overrun cap."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 1.0, billing_method: "TIME_AND_MATERIALS", planned_unit_count: 100 }
              as: ContractorPlanner
              captures: { wo_t: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/map"
              payload: { clearance_radius_ft: 10 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_t}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crews"
              payload: { crew_code: "CRW-1", crew_type: "BUCKET", headcount: 3, hourly_rate_cents: 8533, home_district: "NORTH" }
              as: ContractorPlanner
              captures: { crew1_id: $.data.id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_t}", crew_id: "${crew1_id}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-06T20:00:00Z" }
              as: ContractorPlanner
              captures: { ca_t: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_t}", work_date: "2026-08-03", units_trimmed: 40, labor_hours: 12, equipment_hours: 8, disposal_tons: 2 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
              captures: { pe1: $.data.id }
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_t}", work_date: "2026-08-04", units_trimmed: 35, labor_hours: 9.5, equipment_hours: 6.25, disposal_tons: 1.5 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
              captures: { pe2: $.data.id }
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_t}", work_date: "2026-08-05", units_trimmed: 10, labor_hours: 3.5, equipment_hours: 0, disposal_tons: 0 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
              captures: { pe3: $.data.id }
            - call: "POST /vm/work-orders/${wo_t}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "GET /vm/work-orders/${wo_t}"
              payload: {}
              as: BillingAnalyst
              captures: { wo_t_v: $.data.version }
          trigger:
            - call: "POST /vm/work-orders/${wo_t}/billing-lines"
              payload: { billing_method: "TIME_AND_MATERIALS", expected_work_order_version: "${wo_t_v}" }
              as: BillingAnalyst
              captures: { bl_t: $.data.id }
          assert:
            - "ProductionEntry.${pe1}.entry_cents == 192529"
            - "ProductionEntry.${pe2}.entry_cents == 144639"
            - "ProductionEntry.${pe3}.entry_cents == 29866"
            - "BillingLine.${bl_t}.gross_cents == 367034"
            - "BillingLine.${bl_t}.gross_cents != 367033"
            - "BillingLine.${bl_t}.retainage_cents == 0"
            - "BillingLine.${bl_t}.final_payable_cents == 367034"

      - name: settlement_retainage_keyed_on_gross_credit_keyed_on_net
        grounds:
          - calculations.billing_line_settlement
          - entities.BillingLine.fields.retainage_cents
          - entities.BillingLine.fields.net_payable_cents
          - entities.BillingLine.fields.mobilization_credit_cents
          - endpoints["POST /vm/work-orders/{id}/billing-lines"]
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency pinned to one evaluation order: two unit-price
          spans both have gross_cents above the 1000000 mobilization break (1042176 and 1059840),
          yet only the second earns the 25000 credit, because the credit tier is keyed on
          net_payable_cents (990067 vs 1006848) while the retainage tier is keyed on gross - and the
          credit never re-enters the retainage decision.
        test_recipe:
          setup:
            - "A RELEASED plan with budget 5000000 on circuit CKT-A holds two UNIT_PRICE spans of 2.5 miles and 240 planned units each."
            - "Span WO-P completes 236 units (94.4 units/mile, density 0.92) and span WO-Q completes 240 units (96 units/mile, density 0.92)."
            - "No refusals on either span."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
