            - { call: "POST /listings/${listing_id}/approve", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
          trigger:
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_in}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-08-31" }, as: Applicant, as_user_id: "${ap_in}", captures: { app_in: $.data.id, st_in: $.data.status } }
            - { call: "POST /applications", payload: { listing_id: "${listing_id}", applicant_id: "${ap_out}", proposed_move_in_date: "2026-06-01", proposed_move_out_date: "2026-09-01" }, as: Applicant, as_user_id: "${ap_out}", captures: { err_out: $.data.error_id } }
