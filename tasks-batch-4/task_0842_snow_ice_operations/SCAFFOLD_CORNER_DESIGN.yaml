        distinguishing_aspect: "After a first assignment create bumps the storm version, a second create still carrying the pre-bump expected_storm_event_version is rejected ERR_STALE_STORM_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE storm; vehicle, operator on-call, two routes; version v0 captured, then assignment A created on route1 using v0 (storm version now v0+1)."]
          setup_api_calls:
            - call: "POST /depots"
