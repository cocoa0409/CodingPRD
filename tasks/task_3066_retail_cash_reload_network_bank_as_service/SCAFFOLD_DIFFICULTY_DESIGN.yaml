# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3066_retail_cash_reload_network_bank_as_service
#
# Depth probe. One instance block per §0.5 Difficulty Rule, ≥ 2 instances each
# (18 total). Every grounds entry resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every setup_api_calls / trigger entry is a structured call against a §1.5
# endpoint; every ${var} is bound by an earlier captures: on the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: velocity_trailing_window_vs_epoch_day_reset
        grounds:
          - calculations.velocity_trip
          - calculations.is_structuring
          - entities.CardAccount.fields.window_load_count
          - entities.LoadTransaction.fields.epoch_index
          - state_machines.LoadTransaction.INITIATED_to_FUNDED
        distinguishing_aspect: |
          For the same three funded loads, the trailing_24h variant on the CardAccount
          domain counts all three after a logical-day rollover while the epoch_day
          variant resets to one — two valid readings of "loads in the window" that
          produce different window_load_count on the same account.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement (pct 0.35, per-txn limit 15000), location QM-001 OPEN, REG_E account ACCT-0001 CLEAR."
            - "Two loads of 3000 cents funded inside logical day 0; the clock then rolls to 2026-09-02T00:00:00Z, crossing the epoch boundary."
            - "A third load of 3000 cents funded inside logical day 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "First Sponsor Bank NA", charter_state_code: "UT", sponsorship_capacity_programs: 50, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Green Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING", "COMPLIANCE_OVERSIGHT", "DISPUTE_HANDLING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: true, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /v1/card-accounts"
              payload: { program_id: "${prog_id}", brand_partner_id: "${brand_id}", account_ref: "ACCT-0001", cardholder_name: "Dana Holder", cardholder_agreement_type: "REG_E" }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3000, expected_card_account_version: "${acct_v1}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld1: $.data.id }
            - call: "POST /v1/load-transactions/${ld1}/fund"
              payload: {}
              as: RetailerClerk
              as_user_id: "${agr_id}"
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3000, expected_card_account_version: "${acct_v2}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld2: $.data.id }
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3000, expected_card_account_version: "${acct_v2}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld3: $.data.id }
            - call: "POST /v1/load-transactions/${ld3}/fund"
              payload: {}
              as: RetailerClerk
              as_user_id: "${agr_id}"
          trigger:
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "CardAccount.${acct_id}.window_load_count == 3 under the trailing_24h variant (funded_at > now minus 24h keeps all three, no reset event)"
            - "the epoch_day variant of the same account reads window_load_count == 1, because the logical-day rollover dropped the two day-0 loads"
            - "the two readings differ by exactly 2 on identical persisted loads"
            - "CardAccount.${acct_id}.window_load_cents == 9000 under trailing_24h and 3000 under epoch_day"

      - name: fee_split_accrual_vs_settlement_payable
        grounds:
          - calculations.effective_fee_schedule
          - calculations.settlement_fee_rounding
          - entities.SettlementBatch.fields.settlement_rounding_delta_cents
          - entities.RetailerAgreement.fields.accrual_pending_cents
        distinguishing_aspect: |
          Round-per-load-then-sum (accrual at funding) and sum-then-round (payable at
          settlement) read the same pair of loads differently, so
          accrual_pending_cents and net_fee_payable_cents disagree by exactly one cent
          on the RetailerAgreement fee domain rather than the CardAccount velocity domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement with fee_split_retailer_pct 0.35 and per-transaction limit 15000."
            - "Three loads of 3500 cents each created and funded (convenience fee 245.69 each)."
            - "One SCHEDULED settlement batch covering [2026-09-01T00:00:00Z, 2026-09-02T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "First Sponsor Bank NA", charter_state_code: "UT", sponsorship_capacity_programs: 50, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Green Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: false, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /v1/card-accounts"
              payload: { program_id: "${prog_id}", brand_partner_id: "${brand_id}", account_ref: "ACCT-0001", cardholder_name: "Dana Holder", cardholder_agreement_type: "REG_E" }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3500, expected_card_account_version: "${acct_v1}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld1: $.data.id }
            - call: "POST /v1/load-transactions/${ld1}/fund"
              payload: {}
              as: RetailerClerk
              as_user_id: "${agr_id}"
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3500, expected_card_account_version: "${acct_v2}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld2: $.data.id }
            - call: "POST /v1/load-transactions/${ld2}/fund"
              payload: {}
              as: RetailerClerk
              as_user_id: "${agr_id}"
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v3: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3500, expected_card_account_version: "${acct_v3}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { ld3: $.data.id }
            - call: "POST /v1/load-transactions/${ld3}/fund"
              payload: {}
              as: RetailerClerk
              as_user_id: "${agr_id}"
            - call: "POST /v1/settlement-batches"
              payload: { retailer_agreement_id: "${agr_id}", period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2026-09-02T00:00:00Z" }
              as: SettlementOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /v1/settlement-batches/${batch_id}/open"
              payload: {}
              as: SettlementOperator
            - call: "POST /v1/settlement-batches/${batch_id}/settle"
              payload: {}
              as: SettlementOperator
          assert:
            - "RetailerAgreement.${agr_id}.accrual_pending_cents == 0 after settlement (accrued shares were moved into settled_fee_total_cents)"
            - "SettlementBatch.${batch_id}.accrued_retailer_share_cents == 257.97 (round-per-load: 85.99 + 85.99 + 85.99)"
            - "SettlementBatch.${batch_id}.net_fee_payable_cents == 257.97 (sum-then-round: 737.07 * 0.35 = 257.9745)"
            - "SettlementBatch.${batch_id}.settlement_rounding_delta_cents == 0.00 for this fixture even though the two schedules are computed separately — the delta field is the observable reconciliation"
            - "SettlementBatch.${batch_id}.gross_principal_cents == 10500 and RetailerAgreement.${agr_id}.settled_fee_total_cents == 257.97"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: convenience_fee_marginal_tier_walk
        grounds:
          - calculations.convenience_fee_cents
          - entities.LoadTransaction.fields.posted_total_cents
          - entities.LoadTransaction.fields.program_fee_share_cents
        distinguishing_aspect: |
          Mode (a) on the LoadTransaction fee domain: a 4-input tier walk whose
          first band is FLAT and whose later bands are marginal-proportional, so
          the fee is neither a lookup nor a pure marginal integral — 2001 cents
          yields 199.03 while 10001 cents yields 847.00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement (pct 0.35, per-txn limit 15000), location QM-001 OPEN, REG_E account CLEAR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
              payload: { legal_name: "First Sponsor Bank NA", charter_state_code: "UT", sponsorship_capacity_programs: 50, oversight_tier: "TIER_1", regulator_exam_due_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bank_id: $.data.id }
            - call: "POST /v1/programs"
              payload: { name: "Green Reload Program", sponsor_bank_id: "${bank_id}", program_type: "BAAS_PROGRAM_MANAGER", settlement_cycle: "DAILY", oversight_review_due_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: false, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /v1/card-accounts"
              payload: { program_id: "${prog_id}", brand_partner_id: "${brand_id}", account_ref: "ACCT-0001", cardholder_name: "Dana Holder", cardholder_agreement_type: "REG_E" }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
          trigger:
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 3000, expected_card_account_version: "${acct_v1}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { d1: $.data.id }
            - call: "GET /v1/card-accounts/${acct_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 10001, expected_card_account_version: "${acct_v2}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { d2: $.data.id }
            - call: "POST /v1/load-transactions"
              payload: { reload_location_id: "${loc_id}", card_account_id: "${acct_id}", principal_cents: 2000, expected_card_account_version: "${acct_v2}" }
              as: RetailerClerk
              as_user_id: "${agr_id}"
              captures: { d3: $.data.id }
          assert:
            - "LoadTransaction.${d1}.convenience_fee_cents == 230.13 (flat 199 in band 1 plus 249 * 1000 / 8000)"
            - "LoadTransaction.${d1}.retailer_fee_share_cents == 80.55 and program_fee_share_cents == 149.58 and the two sum exactly to convenience_fee_cents"
            - "LoadTransaction.${d2}.convenience_fee_cents == 847.00 (199 + 249 + the whole 399 flat band above 10000)"
            - "LoadTransaction.${d3}.convenience_fee_cents == 199.00 exactly at the band-1 ceiling — the fee does not start to grow until principal_cents > 2000"
            - "LoadTransaction.${d2}.posted_total_cents == 10848.00 == principal_cents + convenience_fee_cents"

      - name: settlement_fee_rounding_order
        grounds:
          - calculations.settlement_fee_rounding
          - calculations.effective_fee_schedule
          - entities.SettlementBatch.fields.net_fee_payable_cents
          - entities.SettlementBatch.fields.settlement_rounding_delta_cents
        distinguishing_aspect: |
          Mode (b) on the SettlementBatch rounding domain: the scaffold pins
          round-then-sum for the accrual and sum-then-round for the payable, and
          a two-load fixture of 3500 + 2762 cents exposes the one-cent divergence
          the two orders produce on identical inputs.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement with fee_split_retailer_pct 0.35."
            - "Two loads funded in the period: 3500 cents (fee 245.69) and 4500 cents (fee 276.81)."
            - "One SCHEDULED settlement batch covering [2026-09-01T00:00:00Z, 2026-09-02T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/bank-sponsors"
