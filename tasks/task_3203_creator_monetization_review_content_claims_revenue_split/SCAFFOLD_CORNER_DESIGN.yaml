            - "the higher-paid-months member is granted before the lower one, which is clamped by what remains"

  # ===========================================================================
  - section: errors
    instances:

      - name: frozen_posture_blocks_revenue_routing
        claim_type: violation_to_error
        grounds:
          - errors[ERR_POSTURE_FROZEN]
        excluded_because:
          difficulty_instance: frozen_posture_blocks_routing_while_restricted_allows_it
          rationale: "ERR_POSTURE_FROZEN on the FROZEN side of the posture boundary is the asserted failure path of the named §1.8 instance."

      - name: below_threshold_release_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BELOW_PAYMENT_THRESHOLD]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: held_release_routing_falls_outside_a_closed_period
          rationale: "ERR_BELOW_PAYMENT_THRESHOLD is the asserted failure path of the named §1.8 period-window instance."

      - name: unauthorized_role_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A Creator attempting the reviewer-only monetization decision receives 403 ERR_FORBIDDEN_ROLE, and the same call without the X-User-Role header receives 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with a pending monetization application."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Authz Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_az: $.data.id }
            - call: "POST /api/channels/${ch_az}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_az}"
          trigger:
            - call: "POST /api/channels/${ch_az}/monetization-review"
              payload: { decision: "APPROVE" }
              as: Creator
              as_user_id: "${ch_az}"
              captures: { e_authz: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the same call as MonetizationReviewer succeeds with 200"

      - name: unsupported_stream_type_rejection
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNSUPPORTED_STREAM_TYPE]
        distinguishing_aspect: "A RevenueEvent with stream_type MERCHANDISE receives 400 ERR_UNSUPPORTED_STREAM_TYPE while SUPER_CHAT succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Stream Type Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_sv: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_sv}/revenue-events"
              payload: { stream_type: "MERCHANDISE", amount_cents: 500 }
              as: PlatformAdmin
              captures: { e_stream: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_UNSUPPORTED_STREAM_TYPE"
            - "the same call with stream_type SUPER_CHAT returns 201"

  # ===========================================================================
  - section: rbac
    instances:

      - name: creator_cannot_review_its_own_monetization_application
        claim_type: Role exclusivity
        grounds:
          - roles.Creator
          - roles.MonetizationReviewer
        distinguishing_aspect: "The monetization decision is exclusive to MonetizationReviewer; the owning Creator's own token is rejected with 403 even though it owns the channel."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with a pending application owned by the creator."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Self Review Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_sr: $.data.id }
            - call: "POST /api/channels/${ch_sr}/monetization-applications"
              payload: {}
              as: Creator
              as_user_id: "${ch_sr}"
          trigger:
            - call: "POST /api/channels/${ch_sr}/monetization-review"
              payload: { decision: "APPROVE" }
              as: Creator
              as_user_id: "${ch_sr}"
              captures: { e_self_review: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_FORBIDDEN_ROLE"

      - name: creator_cannot_file_a_claim_on_its_own_item
        claim_type: Role exclusivity
        grounds:
          - roles.RightsHolder
          - roles.Creator
        distinguishing_aspect: "POST /api/claims is exclusive to RightsHolder and PlatformAdmin; a Creator token is rejected with 403."
        test_recipe:
