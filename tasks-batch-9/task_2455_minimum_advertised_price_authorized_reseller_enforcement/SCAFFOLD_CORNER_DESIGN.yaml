            - &EXCADJ2
              call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-30T00:00:00Z", channel_scope: "PHYSICAL_RETAIL", requested_override_floor_cents: 14000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
