scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_defaults_and_duplicate_email
        claim_type: creation
        grounds:
          - entities.Client.fields.email
          - errors[ERR_DUPLICATE_CLIENT_EMAIL]
        distinguishing_aspect: "Client creation succeeds with required fields; a second client with the same email is rejected ERR_DUPLICATE_CLIENT_EMAIL."
        test_recipe:
          setup: ["Office context not required; no clients exist"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "dup@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client Two", email: "dup@example.com" }
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "Client.${cli1}.id is a server-minted UUID"
            - "err == ERR_DUPLICATE_CLIENT_EMAIL"
      - name: return_create_rejects_empty_components
        claim_type: required_fields
        grounds:
          - entities.TaxReturn.fields.components
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /tax/returns with an empty components array fails ERR_VALIDATION (400); missing components entirely also fails ERR_VALIDATION."
        test_recipe:
          setup: ["Office O1, preparer P1, client C1 exist"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
          trigger:
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: [] }
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
      - name: get_nonexistent_return_returns_404
        claim_type: not_found
        grounds:
          - entities.TaxReturn
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /tax/returns/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /tax/returns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
      - name: claim_computed_fields_ignore_input
        claim_type: computed_fields
        grounds:
          - entities.Claim.fields.payout_total_cents
          - entities.Claim.fields.status
        distinguishing_aspect: "A claim is created with status TRIAGE and payout fields 0 regardless of any caller-supplied status/payout fields (input to computed fields is ignored)."
        test_recipe:
          setup: ["Office O1; preparer P1; client C1; FILED return R1 ([1040_SIMPLE]) with STANDARD product; notice N1 OPEN"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id, v1: $.data.version }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
          trigger:
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v2: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v2}" }
              as: CaseManager
              captures: { cl1: $.data.id }
          assert:
            - "Claim.${cl1}.status == TRIAGE"
            - "Claim.${cl1}.payout_total_cents == 0"
            - "Claim.${cl1}.scope == null"
      - name: list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints.GET_/tax/claims
        distinguishing_aspect: "GET /tax/claims returns the envelope with limit/offset/total_count/has_more; default limit 10 applies."
        test_recipe:
          setup: ["One office O1; one claim created (full chain)"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
          trigger:
            - call: "GET /tax/claims"
              as: CaseManager
              captures: { tc: $.data }
          assert:
            - "GET /tax/claims response meta contains api_request_id and response_type == array"
            - "pagination fields present: total_count == 1, has_more == false"
  - section: state_machines
    instances:
      - name: notice_pay_from_paid_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AuthorityNotice
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Paying an already-PAID notice fails with ERR_ALREADY_TERMINAL; interest_cents and version are unchanged."
        test_recipe:
          setup: ["Office O1; preparer P1; client C1; FILED return R1; notice N1 paid at default clock (before due date, interest 0)"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-02T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
          trigger:
            - call: "POST /tax/notices/${n1}/pay"
              payload: {}
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL"
            - "AuthorityNotice.${n1}.interest_cents == 0"
      - name: claim_denied_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Claim
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "After OUT_OF_SCOPE scoping (DENIED), every further transition — request-info, assign, resolve, reopen — fails ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Office O1; preparer P1; client C1; FILED return R1 with STANDARD product; notice N1; claim CL1 opened"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "OUT_OF_SCOPE" }
              as: CaseManager
              as_user_id: "cm-A"
          trigger:
            - call: "POST /tax/claims/${cl1}/reopen"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL"
            - "Claim.${cl1}.status == DENIED"
      - name: poa_lazy_expiry_blocks_execute
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PowerOfAttorney.DRAFT_to_EXECUTED
          - errors[ERR_POA_EXPIRED]
        distinguishing_aspect: "Executing a DRAFT POA whose expires_at is in the past (clock advanced past expiry) fails ERR_POA_EXPIRED; claim stays ASSIGNED."
        test_recipe:
          setup: ["Office O1; preparer P1; client C1; FILED return R1 with STANDARD product; notice N1; claim CL1 scoped and ASSIGNED to A1; POA drafted with expires_at 2026-09-20; clock advanced to 2026-09-25"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 0, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 3 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-12-12T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl1}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2026-09-20T00:00:00Z" }
              as: CaseManager
              captures: { poav1: $.data.version }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /tax/claims/${cl1}/poa/execute"
              payload: { expected_poa_version: "${poav1}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POA_EXPIRED"
            - "Claim.${cl1}.status == ASSIGNED"
      - name: claim_reopen_from_representing_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reopen is defined only from RESOLVED; calling reopen on a REPRESENTING claim fails ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup:
            - "Office O1 with escrow; preparer P1; client C1; FILED return R1 ([1040_SIMPLE]) with STANDARD product; notice N1; claim CL1 scoped by cm-A, assigned to A1, POA executed (REPRESENTING)"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/escrows"
              payload: { office_id: "${off1}", funded_cents: 100000000 }
              as: ProgramAdmin
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
            - call: "POST /tax/notices"
              payload: { return_id: "${ret1}", authority_type: "STATE", notice_reference: "ST-1", tax_delta_cents: 1000, penalty_cents: 100, issued_at: "2026-09-10T00:00:00Z", due_at: "2026-10-01T00:00:00Z" }
              as: CaseManager
              captures: { n1: $.data.id }
            - call: "GET /tax/returns/${ret1}"
              as: CaseManager
              captures: { v1: $.data.version }
            - call: "POST /tax/claims"
              payload: { return_id: "${ret1}", notice_id: "${n1}", expected_return_version: "${v1}" }
              as: CaseManager
              captures: { cl1: $.data.id }
            - call: "POST /tax/claims/${cl1}/scope"
              payload: { scope: "IN_SCOPE", error_attribution: "PREPARER_ERROR" }
              as: CaseManager
              as_user_id: "cm-A"
            - call: "POST /tax/agents"
              payload: { full_name: "Agent One", license_number: "EA-001", max_parallel: 3 }
              as: ProgramAdmin
              captures: { ag1: $.data.id }
            - call: "POST /tax/claims/${cl1}/assign"
              payload: { agent_id: "${ag1}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-12-12T00:00:00Z" }
              as: CaseManager
            - call: "POST /tax/claims/${cl1}/poa"
              payload: { agent_id: "${ag1}", expires_at: "2027-06-01T00:00:00Z" }
              as: CaseManager
              captures: { poav1: $.data.version }
            - call: "POST /tax/claims/${cl1}/poa/execute"
              payload: { expected_poa_version: "${poav1}" }
              as: CaseManager
          trigger:
            - call: "POST /tax/claims/${cl1}/reopen"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Claim.${cl1}.status == REPRESENTING"
  - section: calculations
    instances:
      - name: premium_tier_bands
        claim_type: boundary
        grounds:
          - calculations.protection_premium
          - calculations.protection_premium.constants.SIMPLE_CAP
        distinguishing_aspect: "Premium band edges: credits exactly 15000 (SIMPLE_CAP) stay in the base band (STANDARD 4900); credits 27500 fall in the 1.5x band (7400 after round_half_up of 7350); AMENDED_RETURN component blocks the sale entirely."
        test_recipe:
          setup: ["Office O1; preparer P1; clients C1, C2; FILED returns R1 ([1040_ITEMIZED], credits 15000) and R2 ([1040_SIMPLE, 1040_MULTI_STATE], credits 27500)"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client Two", email: "c2@example.com" }
              as: OfficeManager
              captures: { cli2: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_ITEMIZED"] }
              as: OfficeManager
              captures: { ret1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli2}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE", "1040_MULTI_STATE"] }
              as: OfficeManager
              captures: { ret2: $.data.id }
            - call: "POST /tax/returns/${ret1}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/returns/${ret2}/file"
              payload: {}
              as: OfficeManager
          trigger:
            - call: "POST /tax/products"
              payload: { return_id: "${ret1}", tier: "STANDARD" }
              as: OfficeManager
              captures: { pr1: $.data.id, prem1: $.data.premium_cents }
            - call: "POST /tax/products"
              payload: { return_id: "${ret2}", tier: "STANDARD" }
              as: OfficeManager
              captures: { pr2: $.data.id, prem2: $.data.premium_cents }
          assert:
            - "prem1 == 4900 (credits exactly at SIMPLE_CAP stay in the base band, <= semantics)"
            - "prem2 == 7400 (round_half_up of 4900 * 1.5 = 7350 is exact; mid band)"
      - name: amended_return_component_ineligible
        claim_type: conditional_validation
        grounds:
          - calculations.protection_premium
          - validations[priority=14]
          - errors[ERR_PRODUCT_INELIGIBLE]
        distinguishing_aspect: "A FILED amended return (components include AMENDED_RETURN) is ineligible for any protection product; ERR_PRODUCT_INELIGIBLE."
        test_recipe:
          setup: ["Office O1; preparer P1; client C1; original return R0 FILED; amended return RA FILED with components [AMENDED_RETURN]"]
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
            - call: "POST /tax/preparers"
              payload: { office_id: "${off1}", full_name: "P One", tier: "ASSOCIATE" }
              as: OfficeManager
              captures: { prep1: $.data.id }
            - call: "POST /tax/clients"
              payload: { full_name: "Client One", email: "c1@example.com" }
              as: OfficeManager
              captures: { cli1: $.data.id }
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["1040_SIMPLE"] }
              as: OfficeManager
              captures: { ret0: $.data.id }
            - call: "POST /tax/returns/${ret0}/file"
              payload: {}
              as: OfficeManager
            - call: "POST /tax/returns"
              payload: { client_id: "${cli1}", office_id: "${off1}", preparer_id: "${prep1}", tax_year: 2025, components: ["AMENDED_RETURN"], filing_kind: "AMENDED", original_return_id: "${ret0}" }
              as: OfficeManager
              captures: { reta: $.data.id }
            - call: "POST /tax/returns/${reta}/file"
              payload: {}
              as: OfficeManager
          trigger:
            - call: "POST /tax/products"
              payload: { return_id: "${reta}", tier: "STANDARD" }
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCT_INELIGIBLE"
      - name: amended_filing_requires_filed_original
        claim_type: cross_entity_validation
        grounds:
