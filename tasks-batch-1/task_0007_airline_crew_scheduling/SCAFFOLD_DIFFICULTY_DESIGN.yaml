              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_c_id}", crew_member_id: "${cm_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_new_id: "$.data[0].id "}
          trigger:
            - call: "POST /assignments/${a_new_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_id}"
          assert:
            - "POST /assignments/${a_new_id}/confirm returns 422 with data.error_id == 'ERR_FAA_DUTY_CAP_EXCEEDED' (the duty cap trips first at priority 7 before the flight cap at priority 8)"
            - "Assignment.${a_new_id}.state == 'SCHEDULED' (unchanged)"

      - name: pairing_credit_block_rounding_order_mode_b
        grounds:
          - calculations.pairing_credit_block
          - calculations.pairing_credit_block.formula
          - entities.Pairing.fields.actual_block_minutes
        distinguishing_aspect: |
          Mode (b) — nested rounding: actual_block_minutes := sum-of-per-
          assignment durations THEN floor-divided by count(assignments). Doing
          the per-assignment floor first vs summing-then-floor produces different
          minute totals when fractional minutes exist. Scaffold pins:
          'sum integer minutes per Assignment, then floor-divide by count'.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z"
            - "Pairing P_AVG with 2 captain seats; both seats are awarded at AWARDED"
            - "After IN_PROGRESS fires at 2026-06-02T01:00:00Z, both Assignments have actual_duty_start_utc=2026-06-02T01:00:00Z"
            - "After /complete at 2026-06-02T11:30:00Z, both have actual_duty_end_utc=2026-06-02T11:30:00Z; per-Assignment duration = 630 min"
            - "actual_block_minutes := (630 + 630) // 2 == 630"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0030", full_name: "Cap Three", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 30, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm1_id: "$.data.id "}
            - call: "POST /crew-members"
              payload: { employee_code: "AB0031", full_name: "Cap Four", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 31, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm2_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-030", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 2, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_avg_id: "$.data.id "}
            - call: "POST /pairings/${p_avg_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_avg_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_avg_id}", crew_member_id: "${cm1_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "POST /bids"
