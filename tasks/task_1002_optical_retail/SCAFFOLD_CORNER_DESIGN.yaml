            - "WarrantyClaim.${wc1}.customer_charge_cents == 4500"
            - "LabOrder.${lab_id}.active_warranty_claim_id == ${wc1}"
            - "GET /optical/warranty-claims?lab_order_id=${lab_id} returns total_count == 1"

      - name: fresh_lab_order_version_supersedes_the_open_warranty_claim
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[warranty-create-stale-lab-order]", state_machines.WarrantyClaim.OPEN_to_SUPERSEDED, entities.LabOrder.fields.active_warranty_claim_id]
        distinguishing_aspect: "The happy path of the same OCC rule: re-reading LabOrder.version after the first filing and passing that fresh value succeeds, SUPERSEDES the first claim, and repoints active_warranty_claim_id at the second."
        test_recipe:
          setup: ["A DELIVERED lab order with one OPEN CUSTOMER_DAMAGE warranty claim, and the lab order's post-filing version re-read from GET."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C33", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Sup Ersede", email: "sup@x.com", dob: "1992-09-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/deliver"
              payload: {}
              as: StoreAssociate
              captures: { lab_v1: $.data.version }
            - call: "POST /optical/warranty-claims"
              payload: { lab_order_id: "${lab_id}", customer_id: "${cust_id}", reason: "CUSTOMER_DAMAGE", expected_lab_order_version: "${lab_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc1: $.data.id }
            - call: "GET /optical/lab-orders/${lab_id}"
              as: LabTechnician
              captures: { lab_v2: $.data.version }
          trigger:
            - call: "POST /optical/warranty-claims"
              payload: { lab_order_id: "${lab_id}", customer_id: "${cust_id}", reason: "MANUFACTURER_DEFECT", expected_lab_order_version: "${lab_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc2: $.data.id }
          assert:
            - "HTTP status == 201"
            - "WarrantyClaim.${wc1}.status == SUPERSEDED"
            - "WarrantyClaim.${wc2}.status == OPEN"
            - "WarrantyClaim.${wc2}.customer_charge_cents == 0"
            - "LabOrder.${lab_id}.active_warranty_claim_id == ${wc2}"
            - "GET /optical/warranty-claims?lab_order_id=${lab_id} returns total_count == 2"

      - name: risk_gate_blocks_a_new_kit_at_exactly_seventy
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=66]", "errors[ERR_CUSTOMER_TRYON_BLOCKED]", calculations.customer_return_risk_score]
        distinguishing_aspect: "BLOCK_THRESHOLD 70 uses >= : after two overdue kits (one with kept_count 1, one with kept_count 0) the ROLLING score is exactly round_half_up(100*(0.6*1 + 0.4*2)/2) == 70, and the next kit request is refused with ERR_CUSTOMER_TRYON_BLOCKED (403)."
        test_recipe:
          setup: ["Frame with tryon_stock 3."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C34", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 3, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Ris Ky", email: "risky@x.com", dob: "1992-10-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-01-02T00:00:00Z", due_date: "2026-01-12T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { k1: $.data.id }
            - call: "POST /optical/home-try-on-kits/${k1}/ship"
              payload: {}
              as: StoreAssociate
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits/${k1}/return"
              payload: { kept_frame_ids: ["${frame_id}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-01-21T00:00:00Z", due_date: "2026-01-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { k2: $.data.id }
            - call: "POST /optical/home-try-on-kits/${k2}/ship"
              payload: {}
              as: StoreAssociate
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits/${k2}/return"
              payload: { kept_frame_ids: [] }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-02-11T00:00:00Z", due_date: "2026-02-21T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Customer.${cust_id}.lifetime_kit_count == 2"
            - "Customer.${cust_id}.return_risk_score == 70"
            - "HTTP status == 403"
            - "${err} == ERR_CUSTOMER_TRYON_BLOCKED"
            - "HomeTryOnKit.${k2}.late_fee_cents == 5000"
            - "Frame.${frame_id}.tryon_available == 3"

      - name: order_cancel_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_cascades_order_to_lab_to_claim_to_policy_ledger
          rationale: "The four-link cancel chain and every field it touches are asserted end-to-end by that §1.8 instance."

  # ===========================================================================
  # Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: confirm_response_already_carries_every_cascaded_value
        claim_type: immediate
        grounds: [state_machines.Order.DRAFT_to_CONFIRMED, calculations.order_price_quote, entities.Order.fields.active_claim_id]
        distinguishing_aspect: "consistency_model is immediate: the POST /confirm response body itself already shows fulfillment_status CONFIRMED, payment_status AUTHORIZED, fsa_applied_cents 5000, customer_due_cents 50 and a non-null active_claim_id — no follow-up read is needed for any cascaded value."
        test_recipe:
          setup:
            - "IN_NETWORK policy (frame_allowance 15000, lens_copay 2500); customer with fsa_balance_cents 10000; VERIFIED rx_power-6.00 prescription; frame 19500; M167 + AR + BLUE; DRAFT order."
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
              payload: { member_id: "VSP-008", network: "IN_NETWORK", frame_allowance_cents: 15000, lens_copay_cents: 2500, annual_max_cents: 30000, plan_year_start: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C35", name: "Percey", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M167", category: "MATERIAL", base_price_cents: 12000, material_index: 1.67 }
              as: PlatformAdmin
              captures: { m167_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "BLUE", category: "COATING", base_price_cents: 3000 }
              as: PlatformAdmin
              captures: { blue_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Imm Ediate", email: "imme@x.com", dob: "1992-11-15T00:00:00Z", insurance_policy_id: "${pol_id}", fsa_balance_cents: 10000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -5.50, od_cylinder: -1.00, os_sphere: -5.00, os_cylinder: 0.00, pd_mm: 63.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m167_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: { fsa_amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.active_claim_id }
          assert:
            - "HTTP status == 200"
            - "The confirm response body has fulfillment_status == CONFIRMED and payment_status == AUTHORIZED"
            - "The confirm response body has benefit_frame_cents == 15000, benefit_lens_cents == 13655, benefit_applied_cents == 28655"
            - "The confirm response body has fsa_applied_cents == 5000 and customer_due_cents == 50"
            - "The confirm response body has a non-null active_claim_id"
            - "InsuranceClaim.${claim_id}.status == SUBMITTED"
            - "InsurancePolicy.${pol_id}.frame_allowance_remaining_cents == 0"
            - "Customer.${cust_id}.fsa_balance_cents == 5000"
