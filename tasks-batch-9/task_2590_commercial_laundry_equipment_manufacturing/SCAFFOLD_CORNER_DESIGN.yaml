            - "GET /clm/quote-lines?quote_id=${q1} returns 2 items"
            - "PackageQuote.${q1}.line_count == 2 and PackageQuote.${q2}.line_count == 1"

      - name: service_part_supersedes_link_is_self_referential
        claim_type: topology
        grounds:
          - entities.ServicePart.fields.supersedes_part_id
          - endpoints[GET /clm/service-parts]
        distinguishing_aspect: "ServicePart.supersedes_part_id points at another ServicePart, so the self-referential edge is queryable: filtering the collection by supersedes_part_id returns exactly the one successor part."
        test_recipe:
          setup: ["one superseded part BRG-2040 and its successor BRG-2041"]
          setup_api_calls:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2040", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 30000, warranty_months: 36, unit_price_cents: 42000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p_old: $.data.id }
          trigger:
            - call: "POST /clm/service-parts"
              payload: { part_number: "BRG-2041", component_class: "BEARING", fits_product_lines: ["ON_PREMISES", "VENDED"], fits_min_capacity_lb: 20, fits_max_capacity_lb: 80, rated_duty_cycles: 36000, warranty_months: 36, unit_price_cents: 45000, requires_cert_scope: "DIAGNOSTICS_TOOL", reorder_point_qty: 2, supersedes_part_id: "${p_old}" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { p_new: $.data.id }
            - call: "GET /clm/service-parts"
              payload: { supersedes_part_id: "${p_old}" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
          assert:
            - "ServicePart.${p_new}.supersedes_part_id == ${p_old}"
            - "ServicePart.${p_new}.on_hand_qty == 0 and stock_state == BACKORDERED"
            - "the list call returns exactly 1 element whose id == ${p_new}"
            - "ServicePart.${p_old}.supersedes_part_id == null"

  - section: state_machines
    instances:
      - name: build_order_initial_state_is_planned
