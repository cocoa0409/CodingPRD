    output: Dispute
    side_effects: []
  - method: POST
    path: "/api/disputes/{id}/grant-provisional-credit"
    description: "Grant provisional credit for an OPENED dispute (non-swipe only)"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: Dispute
    side_effects: ["increments Dispute.version by 1", "PROVISIONAL_CREDIT LedgerEntry of full amount posted to the transaction account", "granter_analyst_id set"]
  - method: POST
    path: "/api/disputes/{id}/resolve"
    description: "Resolve a dispute; resolver must differ from granter when provisional credit was granted"
    roles: [FraudAnalyst]
    code: 200
    input: [outcome, resolution_note]
    output: Dispute
    side_effects: ["increments Dispute.version by 1", "transaction -> REVERSED or restored to pre_dispute_status", "reversal/clawback ledger postings", "UNAUTHORIZED_USE merchant win adds fraud strike"]
  - method: POST
    path: "/api/disputes/{id}/withdraw"
    description: "Withdraw an open dispute (filing owner)"
    roles: [CardHolder]
    code: 200
    input: []
    output: Dispute
    side_effects: ["increments Dispute.version by 1", "clawback when provisional credit existed", "transaction restored"]

  # --- DoorZone ---
  - method: POST
    path: "/api/door-zones"
    description: "Create a door zone with weekly access windows"
    roles: [SecurityOfficer]
    code: 201
    input: [zone_code, building, security_level, access_windows]
    output: DoorZone
    side_effects: []
  - method: GET
    path: "/api/door-zones"
    description: "List door zones"
    roles: [PlatformAdmin, CardOfficeAdmin, SecurityOfficer]
    code: 200
    input: ["security_level?", "status?", "limit?", "offset?"]
    output: DoorZone[]
    side_effects: []
  - method: GET
    path: "/api/door-zones/{id}"
    description: "Get one door zone"
    roles: [PlatformAdmin, CardOfficeAdmin, SecurityOfficer]
    code: 200
    input: []
    output: DoorZone
    side_effects: []
  - method: POST
    path: "/api/door-zones/{id}/decommission"
    description: "Decommission a zone; revokes its live grants"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: DoorZone
    side_effects: ["increments DoorZone.version by 1", "zone's AccessGrants ACTIVE | SUSPENDED -> REVOKED"]

  # --- AccessGrant ---
  - method: POST
    path: "/api/cards/{id}/access-grants"
    description: "Grant door access for a card; rejects half-open overlap with an existing ACTIVE|SUSPENDED grant on the same (card, zone)"
    roles: [SecurityOfficer]
    code: 201
    input: [zone_id, clearance, valid_from, valid_until]
    output: AccessGrant
    side_effects: []
  - method: GET
    path: "/api/access-grants"
    description: "List access grants with filters"
    roles: [PlatformAdmin, SecurityOfficer, CardHolder]
    code: 200
    input: ["card_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: AccessGrant[]
    side_effects: []
  - method: GET
    path: "/api/access-grants/{id}"
    description: "Get one access grant"
    roles: [PlatformAdmin, SecurityOfficer, CardHolder]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []
  - method: POST
    path: "/api/access-grants/{id}/suspend"
    description: "Manually suspend an ACTIVE grant"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["increments AccessGrant.version by 1", "suspended_reason = MANUAL"]
  - method: POST
    path: "/api/access-grants/{id}/reinstate"
    description: "Reinstate a SUSPENDED grant; requires card ACTIVE and validity remaining"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["increments AccessGrant.version by 1"]
  - method: POST
    path: "/api/access-grants/{id}/revoke"
    description: "Revoke a non-terminal grant"
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["increments AccessGrant.version by 1"]

  # --- AccessEvent ---
  - method: POST
    path: "/api/access-events"
    description: "Record a door access attempt; the decision is computed per access_decision_selector and returned as data (denials are not API errors)"
    roles: [DoorController]
    code: 201
    input: [card_id, zone_id]
    output: AccessEvent
    side_effects: ["lazy card EXPIRED / grant EXPIRED evaluation on touch"]
  - method: GET
    path: "/api/access-events"
    description: "List access events with filters"
    roles: [PlatformAdmin, SecurityOfficer, CardOfficeAdmin]
    code: 200
    input: ["card_id?", "zone_id?", "grant_id?", "decision?", "limit?", "offset?"]
    output: AccessEvent[]
    side_effects: []
  - method: GET
    path: "/api/access-events/{id}"
    description: "Get one access event"
    roles: [PlatformAdmin, SecurityOfficer, CardOfficeAdmin]
    code: 200
    input: []
    output: AccessEvent
    side_effects: []

  # --- Merchant ---
  - method: POST
    path: "/api/merchants"
    description: "Onboard an off-campus merchant (PENDING_CONTRACT)"
    roles: [BursarOffice]
    code: 201
    input: [merchant_code, legal_name, category, commission_bps, contact_email, "commission_mode?"]
    output: Merchant
    side_effects: []
  - method: GET
    path: "/api/merchants"
    description: "List merchants"
    roles: [PlatformAdmin, CardOfficeAdmin, BursarOffice]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []
  - method: GET
    path: "/api/merchants/{id}"
    description: "Get one merchant"
    roles: [PlatformAdmin, CardOfficeAdmin, BursarOffice, MerchantUser]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: POST
    path: "/api/merchants/{id}/activate"
    description: "Activate a PENDING_CONTRACT or SUSPENDED merchant"
    roles: [BursarOffice]
    code: 200
    input: []
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]
  - method: POST
    path: "/api/merchants/{id}/suspend"
    description: "Suspend an ACTIVE merchant (blocks new transactions)"
    roles: [BursarOffice]
    code: 200
    input: []
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]
  - method: POST
    path: "/api/merchants/{id}/terminate"
    description: "Terminate a merchant with no open settlements"
    roles: [BursarOffice]
    code: 200
    input: []
    output: Merchant
    side_effects: ["increments Merchant.version by 1"]

  # --- MerchantSettlement ---
  - method: POST
    path: "/api/merchants/{id}/settlements"
    description: "Create a settlement period draft; rejects closed-closed overlap with existing non-REJECTED settlements and periods outside the term"
    roles: [MerchantUser, BursarOffice]
    code: 201
    input: [term_id, period_start, period_end]
    output: MerchantSettlement
    side_effects: []
  - method: GET
    path: "/api/settlements"
    description: "List settlements with filters"
    roles: [PlatformAdmin, CardOfficeAdmin, BursarOffice, MerchantUser]
    code: 200
    input: ["merchant_id?", "term_id?", "status?", "carried_from_settlement_id?", "limit?", "offset?"]
    output: MerchantSettlement[]
    side_effects: []
  - method: GET
    path: "/api/settlements/{id}"
    description: "Get one settlement"
    roles: [PlatformAdmin, CardOfficeAdmin, BursarOffice, MerchantUser]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: []
  - method: POST
    path: "/api/settlements/{id}/submit"
    description: "Submit (or resubmit after rejection) a settlement; runs the merchant_settlement_sweep"
    roles: [MerchantUser, BursarOffice]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: ["increments MerchantSettlement.version by 1", "sweep computes gross/commission/net/transaction_count", "swept transactions linked via settled_in_settlement_id"]
  - method: POST
    path: "/api/settlements/{id}/approve"
    description: "Approve a SUBMITTED settlement; approver must differ from submitter"
    roles: [BursarOffice]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: ["increments MerchantSettlement.version by 1", "linked transactions -> SETTLED"]
  - method: POST
    path: "/api/settlements/{id}/reject"
    description: "Reject a SUBMITTED settlement; transactions are unlinked and re-eligible"
    roles: [BursarOffice]
    code: 200
    input: [rejection_reason]
    output: MerchantSettlement
    side_effects: ["increments MerchantSettlement.version by 1", "linked transactions unlinked"]
  - method: POST
    path: "/api/settlements/{id}/pay"
    description: "Pay an APPROVED settlement; payer must differ from approver"
    roles: [BursarOffice]
    code: 200
    input: []
    output: MerchantSettlement
    side_effects: ["increments MerchantSettlement.version by 1", "paid_by set"]

# =============================================================================
# §1.6 Error Code Catalog (50 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller (CardHolder, MerchantUser) targets a resource it does not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, bad enum, non-positive amount, end <= start, missing rejection_reason / denial_reason when required" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a divergent payload" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource state does not permit the requested transition (includes terminal-state lockout and invalid-from)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_HOLDER_NOT_ACTIVE, http: 409, condition: "Holder not ACTIVE for card activation, unfreeze, enrollment, or value action" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Card not in ACTIVE (or explicitly permitted frozen) state for the requested use; also fired on first use at/after expires_at as the card flips EXPIRED" }
  - { id: ERR_CARD_FROZEN, http: 409, condition: "Card is LOST_FROZEN or STOLEN_FROZEN; transactions rejected" }
  - { id: ERR_CARD_NOT_RECOVERABLE, http: 409, condition: "Unfreeze attempted on a STOLEN_FROZEN or terminal card" }
  - { id: ERR_PHOTO_NOT_APPROVED, http: 409, condition: "Activation without allow_provisional while photo_status != APPROVED" }
  - { id: ERR_ACTIVE_CARD_EXISTS, http: 409, condition: "Issuing a card when the holder already has a non-terminal card" }
  - { id: ERR_TERM_NOT_OPEN, http: 409, condition: "Term not OPEN where required (enrollment activation source, change approval, dining/swipe derivation)" }
  - { id: ERR_TERM_NOT_YET_STARTED, http: 422, condition: "Term open attempted before start_date" }
  - { id: ERR_TERM_NOT_ENDED, http: 422, condition: "Term close attempted before end_date" }
  - { id: ERR_TERM_WEEKS_EXHAUSTED, http: 422, condition: "advance-week when current_week_index == total_weeks" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "Enrollment or change targets a plan not in PUBLISHED" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "Retire attempted with ASSIGNED or ACTIVE enrollments referencing the plan" }
  - { id: ERR_MERCHANT_NOT_ACTIVE, http: 409, condition: "Transaction or settlement creation against a merchant not ACTIVE" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Meal swipe or plan change against an enrollment not ACTIVE" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Funding or purchase against an account not OPEN" }
  - { id: ERR_ACCOUNT_NOT_CLOSABLE, http: 409, condition: "Refund request against an account not in CLOSE_PENDING" }
  - { id: ERR_TX_NOT_DISPUTABLE, http: 409, condition: "Dispute against a REVERSED transaction or one locked in an APPROVED | PAID settlement" }
  - { id: ERR_FRAUD_HOLD, http: 409, condition: "Holder SUSPENDED or fraud_flag set; value-extending actions blocked" }
  - { id: ERR_SOD_ADJUSTER_CANNOT_APPROVE, http: 403, condition: "Refund approver equals the account's last_adjusted_by" }
  - { id: ERR_SOD_PAYER_IS_APPROVER, http: 403, condition: "Refund or settlement payer equals its approver" }
  - { id: ERR_SOD_APPROVER_IS_SUBMITTER, http: 403, condition: "Settlement approver equals submitted_by" }
  - { id: ERR_SOD_RESOLVER_IS_GRANTER, http: 403, condition: "Dispute resolver equals granter_analyst_id after provisional credit" }
  - { id: ERR_CREDIT_NOT_APPLICABLE, http: 422, condition: "Provisional credit requested on a MEAL_SWIPE dispute" }
  - { id: ERR_PLAN_CHANGE_WINDOW_CLOSED, http: 422, condition: "Change request or approval attempted after term add_drop_deadline" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Dispute filed more than DISPUTE_WINDOW_DAYS (30) days after transaction created_at" }
  - { id: ERR_PLAN_CHANGE_EFFECTIVE_WEEK_INVALID, http: 422, condition: "Approval would set effective_week_index beyond total_weeks" }
  - { id: ERR_HOUSING_INELIGIBLE_FOR_PLAN, http: 422, condition: "Plan requires ON_CAMPUS housing and holder's housing_status differs" }
  - { id: ERR_HOLDER_TYPE_INELIGIBLE_FOR_PLAN, http: 422, condition: "Holder's holder_type not in plan.eligible_holder_types" }
  - { id: ERR_ENROLLMENT_OVERLAP, http: 409, condition: "Holder already has an ASSIGNED or ACTIVE enrollment in the term" }
  - { id: ERR_PENDING_CHANGE_EXISTS, http: 409, condition: "A SUBMITTED or APPROVED change request already exists on the enrollment" }
  - { id: ERR_PENDING_REFUND_EXISTS, http: 409, condition: "A REQUESTED or APPROVED refund request already exists on the account" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "A non-terminal dispute already exists on the transaction" }
  - { id: ERR_ACCOUNT_UNIQUENESS, http: 409, condition: "Duplicate non-terminal account for (holder, account_type, term_id)" }
  - { id: ERR_GRANT_OVERLAP, http: 409, condition: "New grant's half-open [valid_from, valid_until) intersects an existing ACTIVE|SUSPENDED grant on the same (card, zone); adjacency permitted" }
  - { id: ERR_SETTLEMENT_PERIOD_OVERLAP, http: 409, condition: "New settlement's closed-closed [period_start, period_end] shares any day with an existing non-REJECTED settlement of the merchant; touching endpoints conflict" }
  - { id: ERR_PERIOD_OUTSIDE_TERM, http: 422, condition: "Settlement period not contained in the term's [start_date, end_date]" }
  - { id: ERR_DUPLICATE_NATURAL_KEY, http: 409, condition: "university_id / term_code / plan_code / zone_code / merchant_code already exists" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Purchase amount exceeds account balance_cents (equality admitted)" }
  - { id: ERR_SWIPES_EXHAUSTED, http: 422, condition: "swipes_used_this_week == weekly_swipe_allowance on a non-unlimited plan" }
  - { id: ERR_PROVISIONAL_DAILY_CAP, http: 422, condition: "Provisional card purchase would push the same-day total above 2500 cents" }
  - { id: ERR_REFUND_BELOW_MINIMUM, http: 422, condition: "Computed refund amount below MIN_REFUND_CENTS (1000)" }
  - { id: ERR_REFUNDS_OUTSTANDING, http: 409, condition: "Term settle blocked by REQUESTED | APPROVED refund requests on term accounts" }
  - { id: ERR_SETTLEMENTS_OUTSTANDING, http: 409, condition: "Term settle or merchant terminate blocked by settlements in DRAFT | SUBMITTED | APPROVED" }

# =============================================================================
# §1.7 RBAC Matrix (10 roles)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Technical operator; drives the logical clock and reads configuration"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["read-only list/get across domains"]
  - name: CardOfficeAdmin
    description: "Campus card office operator; manages holders, cards, photos"
    identity: opaque
    exclusive_operations: ["card issuance/activation/replacement/deactivation", "photo review", "holder suspend/reinstate/withdraw/graduate", "account opening"]
    shared_operations: ["read access to most domains"]
  - name: CardHolder
    description: "The card holder acting on their own resources"
    identity: "entity_backed:CardHolder"
    exclusive_operations: ["report-lost / report-stolen / unfreeze own card", "submit own photo", "request plan change on own enrollment", "withdraw own change request", "fund own accounts", "request refund on own account", "file / withdraw own disputes"]
    shared_operations: ["read own cards, enrollments, accounts, ledger entries, transactions, disputes, refund requests, access grants, meal plans, terms"]
  - name: DiningServicesManager
    description: "Dining services operator; owns terms, plans, enrollments, plan-change adjudication"
    identity: opaque
    exclusive_operations: ["term lifecycle (create/open/advance-week/close/settle)", "meal plan create/publish/retire", "enrollment assign/cancel", "change-request approve/deny"]
    shared_operations: ["read holders, enrollments, terms, plans"]
  - name: BursarOffice
    description: "Financial office; manual adjustments, refunds, merchant program and settlement payment; segregation-of-duties constrains which bursar user may approve vs pay vs adjust"
    identity: opaque
    exclusive_operations: ["account adjustments (OCC)", "refund approve/deny/pay", "merchant onboarding/lifecycle", "settlement approve/reject/pay", "settlement create/submit on behalf of a merchant"]
    shared_operations: ["read accounts, ledger entries, transactions, settlements"]
  - name: FraudAnalyst
    description: "Fraud review; provisional credit and dispute resolution with granter/resolver segregation"
    identity: opaque
    exclusive_operations: ["grant provisional credit", "resolve disputes", "fraud-review", "holder suspend", "card deactivate"]
    shared_operations: ["read cards, transactions, disputes, ledger entries"]
  - name: SecurityOfficer
    description: "Physical security; door zones and access grants"
    identity: opaque
    exclusive_operations: ["door-zone create/decommission", "access-grant create/suspend/reinstate/revoke"]
    shared_operations: ["read access events, zones, grants, cards"]
  - name: MerchantUser
    description: "Off-campus merchant operator acting as their own merchant"
    identity: "entity_backed:Merchant"
    exclusive_operations: ["create and submit own settlements", "post transactions with merchant_id == own id"]
    shared_operations: ["read own merchant record, own transactions, own settlements"]
  - name: PointOfSale
    description: "On-campus dining terminal; posts on-campus transactions without merchant_id"
    identity: opaque
    exclusive_operations: ["POST /api/transactions (on-campus)"]
    shared_operations: []
  - name: DoorController
    description: "Door controller device; records access attempts"
    identity: opaque
    exclusive_operations: ["POST /api/access-events"]
    shared_operations: []
