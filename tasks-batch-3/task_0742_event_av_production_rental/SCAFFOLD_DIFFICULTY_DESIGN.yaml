            - { call: "POST /venues", payload: { name: "V14", address: "16 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /crew-members", payload: { name: "Tech One", crew_role: "TECH", hourly_rate_cents: 4000 }, as: CrewChief, captures: { crew_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E14", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/crew-assignments", payload: { crew_member_id: "${crew_id}", assignment_role: "TECH", shift_start: "2026-06-10T08:00:00Z", shift_end: "2026-06-10T16:00:00Z", scheduled_hours: 8 }, as: CrewChief }
          trigger:
