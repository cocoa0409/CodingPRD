            - "Invoice.${inv_id}.total_cents == 3900 (the invoice total is NOT mutated; conservation is on the client balance, not the invoice)."
      - name: interpreter_load_accept_complete_conserved
        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Assignment.IN_SESSION_to_COMPLETED
          - entities.Interpreter.fields.active_load
        distinguishing_aspect: "Conserved quantity = Interpreter.active_load. Forward accept increments load by 1; the compensating COMPLETED transition (after the session ends) decrements it by exactly 1, returning active_load to its pre-accept value — a different conserved quantity (capacity counter) than the monetary balance."
