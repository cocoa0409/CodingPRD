scenario: |
  Generate task harder than expert level!

  2462. Short-Term Rental Turnover & Cleaning Coordination (vacation rental turnover service): booking calendar integration with same-day turn detection and cleaning window calculation, cleaner assignment by property zone, skill level and historical quality scores, checklist execution with photo verification of required staging and amenity restocking, inventory management for linens, consumables and welcome supplies with par levels per property, damage and maintenance issue reporting from the cleaning team with owner notification and repair dispatch, late checkout and early check-in conflicts with guest communication protocols, quality audit sampling and guest cleanliness review correlation, cleaner pay by property size with bonus and penalty structures

domain_name: "short-term-rental-turnover-coordination"
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  difficulty_level: "expert_plus — the §0.4 Expert band is deliberately exceeded (12 entities / 46 endpoints / 55 errors) per the scenario directive 'Generate task harder than expert level!'; density, not volume, carries the difficulty (every entity participates in at least one cross-entity gate or cascade)"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every business collection is a peer at the API root (/properties, /bookings, /turnovers,
  # /assignments, /checklist-tasks, /supply-lines, /issue-reports, /repair-orders,
  # /quality-audits, /pay-lines, /stock-movements). Parent-child links are FK fields in bodies,
  # not URL nesting; the only nested paths are the two SupplyLine/ChecklistTask reverse-lookup
  # sub-resources.

  state_machine_shape: cyclic
  # Turnover loops AWAITING_VERIFICATION -> REWORK_REQUIRED -> IN_PROGRESS -> AWAITING_VERIFICATION
  # and detours through ON_HOLD with pre_hold_status restore; ChecklistTask loops
  # PENDING -> SUBMITTED -> REJECTED -> SUBMITTED and can be reversed VERIFIED -> WAIVED.
  # Booking additionally carries two parallel dimensions (status x checkin_gate) and Turnover.status
  # is compound (re-derived from its ChecklistTask children on every child change).

  relationship_patterns:
    - one_to_many          # Property -> SupplyLine/Booking/Turnover; Turnover -> ChecklistTask/Assignment
    - cross_aggregate      # Turnover references two Bookings and a RepairOrder; PayLine spans Assignment + Cleaner + Turnover
    - many_to_many         # Cleaner <-> Turnover through Assignment (a turnover may be offered to several cleaners over time, a cleaner works many turnovers)

  role_model: segregation_of_duties
  # The QualityAuditor who finalizes a turnover's audit must not be the same X-User-ID that
  # assigned the cleaner or reviewed any of that turnover's checklist tasks.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "operator-facing property code"
        constraints: "unique across all properties"
      - name: name
        type: string
        source: input
        description: "display name of the unit"
      - name: zone_code
        type: string
        source: input
        description: "cleaning zone this unit sits in (e.g. ZONE_A); drives zone_match_factor and the cleaner overlap buffer"
        constraints: "uppercase token, 1-16 chars"
      - name: size_tier
        type: enum
        source: input
        description: "size class driving base clean minutes and base pay"
        constraints: "STUDIO | ONE_BR | TWO_BR | THREE_BR_PLUS"
      - name: bedroom_count
        type: integer
        source: input
        description: "bedrooms in the unit"
        default: 1
        constraints: ">= 0 and <= 12"
      - name: bathroom_count
        type: integer
        source: input
        description: "bathrooms; feeds required_minutes at 12 minutes each"
        default: 1
        constraints: ">= 0 and <= 12"
      - name: bed_count
        type: integer
        source: input
        description: "beds to strip and stage; feeds required_minutes at 8 minutes each"
        default: 1
        constraints: ">= 0 and <= 24"
      - name: local_utc_offset_minutes
        type: integer
        source: input
        description: "fixed offset from UTC used to derive the property's LOCAL calendar date for same-day turn detection"
        default: 0
        constraints: ">= -720 and <= 840"
      - name: min_clean_minutes
        type: integer
        source: input
        description: "contractual floor on required_minutes regardless of the size formula"
        default: 60
        constraints: ">= 0 and <= 600"
      - name: min_skill_level
        type: integer
        source: input
        description: "lowest cleaner skill_level allowed to work this unit"
        default: 1
        constraints: ">= 1 and <= 5"
      - name: owner_contact_email
        type: string
        source: input
        description: "owner notification target for issue reports"
      - name: owner_notify_min_cost_cents
        type: integer
        source: input
        description: "estimated repair cost at or above which the owner is notified even for LOW/MEDIUM severity"
        default: 5000
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "operational status; only ACTIVE properties accept new turnovers"
        default: ACTIVE
        constraints: "ACTIVE | PAUSED | OFFBOARDED"
      - name: open_issue_count
        type: integer
        source: computed
        description: "count of IssueReport rows on this property whose status != RESOLVED"
        default: 0
      - name: last_turnover_completed_at
        type: datetime
        source: system
        description: "logical clock reading when this property's most recent Turnover reached COMPLETED; null until then"

  - name: Cleaner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "cleaner display name"
      - name: home_zone_code
        type: string
        source: input
        description: "primary zone; matches Property.zone_code for zone_match_factor 1.0"
      - name: secondary_zone_codes
        type: array
        source: input
        description: "additional zones served at zone_match_factor 0.4"
        default: []
        constraints: "array of zone tokens, max 5, no duplicates, must not contain home_zone_code"
      - name: accepts_cross_zone
        type: boolean
        source: input
        description: "when true the cleaner is eligible for zones outside home + secondary at zone_match_factor 0.0"
        default: false
      - name: skill_level
        type: integer
        source: input
        description: "certification tier"
        constraints: ">= 1 and <= 5"
      - name: max_daily_turnovers
        type: integer
        source: input
        description: "cap on non-terminal assignments sharing one property-local calendar date"
        default: 2
        constraints: ">= 1 and <= 6"
      - name: quality_score
        type: number
        source: computed
        description: "rolling historical quality, 0-100 with 2 decimals; seeded from the POST /cleaners input field initial_quality_score (default 80.00) and thereafter recomputed ONLY by quality-audit finalization via calculations.cleaner_quality_score_recompute"
        default: 80.00
        constraints: ">= 0 and <= 100, 2 decimals"
      - name: status
        type: enum
        source: input
        description: "employment status; only ACTIVE cleaners may be offered or accept work"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | OFFBOARDED"
      - name: pending_payout_cents
        type: integer
        source: computed
        description: "conserved ledger: sum of PayLine.net_cents over this cleaner's PayLines whose status is in {PROVISIONAL, FINAL, ADJUSTED}"
        default: 0
      - name: completed_turnover_count
        type: integer
        source: computed
        description: "count of this cleaner's Assignments in status COMPLETED"
        default: 0
      - name: decline_count
        type: integer
        source: computed
        description: "count of this cleaner's Assignments in status DECLINED"
        default: 0
      - name: strike_count
        type: integer
        source: computed
        description: "incremented once per turnover whose rework_round exceeds MAX_REWORK_ROUNDS"
        default: 0

  - name: Booking
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the unit being stayed in"
      - name: external_ref
        type: string
        source: input
        description: "channel reservation reference"
        constraints: "unique per (property_id, external_ref)"
      - name: guest_name
        type: string
        source: input
        description: "guest of record"
      - name: party_size
        type: integer
        source: input
        description: "number of guests"
        default: 1
        constraints: ">= 1 and <= 24"
      - name: pet_stay
        type: boolean
        source: input
        description: "pet in residence; multiplies the outgoing turnover's raw required minutes by PET_CLEAN_MULTIPLIER"
        default: false
      - name: checkin_at
        type: datetime
        source: input
        description: "contracted check-in instant (UTC)"
      - name: checkout_at
        type: datetime
        source: input
        description: "contracted check-out instant (UTC)"
        constraints: "strictly greater than checkin_at"
      - name: late_checkout_until_at
        type: datetime
        source: system
        description: "granted late-checkout instant; null unless a LATE_CHECKOUT schedule-change was applied"
      - name: early_checkin_at
        type: datetime
        source: system
        description: "granted early-check-in instant; null unless an EARLY_CHECKIN schedule-change was applied"
      - name: actual_checkout_at
        type: datetime
        source: system
        description: "instant recorded by POST /bookings/{id}/checkout; null until the guest departs"
      - name: status
        type: enum
        source: system
        description: "occupancy dimension of this booking's parallel state"
        default: SCHEDULED
        constraints: "SCHEDULED | CHECKED_OUT | CANCELLED"
      - name: checkin_gate
        type: enum
        source: system
        description: "arrival-readiness dimension of this booking's parallel state; evolves independently of status"
        default: OPEN
        constraints: "OPEN | BLOCKED | RELEASED"
      - name: guest_notice_code
        type: enum
        source: system
        description: "communication protocol code the guest was last notified under"
        default: NONE
        constraints: "NONE | LATE_CHECKOUT_GRANTED | EARLY_CHECKIN_LIMITED | CHECKIN_DELAYED"
      - name: cleanliness_rating
        type: integer
        source: system
        description: "guest cleanliness review 1-5; null until POST /bookings/{id}/guest-review"
        constraints: ">= 1 and <= 5"
      - name: cleanliness_rated_at
        type: datetime
        source: system
        description: "logical clock reading when the guest review landed; null until then"

  - name: Turnover
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; copied from the outgoing booking at creation"
      - name: outgoing_booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the departing stay whose checkout opens the cleaning window"
      - name: incoming_booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the arriving stay whose check-in closes the window; null for a vacant gap"
      - name: blocking_repair_order_id
        type: string
        source: system
        description: "FK -> RepairOrder.id; set while this turnover is ON_HOLD for a check-in-blocking repair, null otherwise"
      - name: window_start_at
        type: datetime
        source: computed
        description: "latest of the outgoing booking's contracted checkout, granted late checkout, and recorded actual checkout"
      - name: window_end_at
        type: datetime
        source: computed
        description: "effective incoming check-in minus INSPECTION_BUFFER_MINUTES, or window_start_at + VACANT_WINDOW_HOURS when there is no incoming booking"
      - name: window_minutes
        type: integer
        source: computed
        description: "whole minutes between window_start_at and window_end_at; clamped to 0 and flagged rather than rejected when a recorded actual checkout compresses it"
      - name: required_minutes
        type: integer
        source: computed
        description: "minutes this unit needs per calculations.turnover_window_and_requirement"
      - name: slack_minutes
        type: integer
        source: computed
        description: "window_minutes - required_minutes; may be negative"
      - name: turn_type
        type: enum
        source: computed
        description: "SAME_DAY when both boundary instants fall on the same property-LOCAL calendar date, OVERNIGHT when there is an incoming booking on a later local date, VACANT_GAP when there is none"
        constraints: "SAME_DAY | OVERNIGHT | VACANT_GAP"
      - name: is_tight
        type: boolean
        source: computed
        description: "slack_minutes < TIGHT_SLACK_MINUTES; drives the tight-window pay premium"
        default: false
      - name: override_reason
        type: string
        source: input
        description: "coordinator justification permitting a window shorter than required_minutes; null when none was supplied"
      - name: escalation_required
        type: boolean
        source: computed
        description: "true when the window is short of required_minutes, or a recorded checkout collapsed it, or rework exceeded MAX_REWORK_ROUNDS"
        default: false
      - name: status
        type: enum
        source: system
        description: "lifecycle; re-derived from ChecklistTask children while the clean is underway"
        default: PENDING_ASSIGNMENT
        constraints: "PENDING_ASSIGNMENT | SCHEDULED | IN_PROGRESS | AWAITING_VERIFICATION | REWORK_REQUIRED | ON_HOLD | COMPLETED | VOID"
      - name: pre_hold_status
        type: enum
        source: system
        description: "status captured when the turnover entered ON_HOLD so repair completion can restore it; null unless ON_HOLD"
        constraints: "IN_PROGRESS | AWAITING_VERIFICATION | REWORK_REQUIRED | SCHEDULED | PENDING_ASSIGNMENT"
      - name: rework_round
        type: integer
        source: computed
        description: "number of times this turnover has entered REWORK_REQUIRED"
        default: 0
      - name: rejected_review_count
        type: integer
        source: computed
        description: "total REJECT reviews across this turnover's checklist tasks; drives the photo penalty"
        default: 0
      - name: checklist_task_count
        type: integer
        source: computed
        description: "number of ChecklistTask rows generated at start"
        default: 0
      - name: restock_chargeback_cents
        type: integer
        source: computed
        description: "owner chargeback for consumed supplies per calculations.restock_chargeback; 0 until completion"
        default: 0
      - name: started_at
        type: datetime
        source: system
        description: "logical clock reading when the cleaner started; null before"
      - name: finished_at
        type: datetime
        source: system
        description: "logical clock reading when the turnover reached COMPLETED; null before"
      - name: late_minutes
        type: integer
        source: computed
        description: "whole minutes finished_at exceeds window_end_at; 0 when on or before"
        default: 0

  - name: Assignment
    parent: Turnover
    common_fields: true
    fields:
      - name: turnover_id
        type: string
        source: computed
        description: "FK -> Turnover.id; taken from the path of POST /turnovers/{id}/assign"
      - name: cleaner_id
        type: string
        source: computed
        description: "FK -> Cleaner.id; the explicitly requested cleaner or the selector's winner"
      - name: sequence_no
        type: integer
        source: system
        description: "1-based offer counter within this turnover; a superseding offer gets the next number"
      - name: match_score
        type: number
        source: computed
        description: "weighted selector score per calculations.cleaner_match_score, 4 decimals"
        constraints: ">= 0 and <= 1, 4 decimals"
      - name: zone_match_factor
        type: number
        source: computed
        description: "1.0 home zone, 0.4 secondary zone, 0.0 cross-zone"
      - name: selection_mode
        type: enum
        source: computed
        description: "EXPLICIT when the request named cleaner_id, SELECTOR when the server ranked the pool"
        constraints: "EXPLICIT | SELECTOR"
      - name: assigned_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the Coordinator who created the offer; one of the two segregation-of-duties inputs"
      - name: status
        type: enum
        source: system
        description: "offer lifecycle"
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | ACTIVE | COMPLETED | DECLINED | REVOKED"
      - name: accepted_at
        type: datetime
        source: system
        description: "logical clock reading at acceptance; null otherwise"
      - name: declined_at
        type: datetime
        source: system
        description: "logical clock reading at decline; null otherwise"
      - name: revoked_at
        type: datetime
        source: system
        description: "logical clock reading at revocation; null otherwise"

  - name: ChecklistTask
    parent: Turnover
    common_fields: true
    fields:
      - name: turnover_id
        type: string
        source: computed
        description: "FK -> Turnover.id; generated at POST /turnovers/{id}/start"
      - name: task_code
        type: enum
        source: computed
        description: "template row this task was generated from"
        constraints: "STRIP_LINENS | BATHROOM_DEEP_CLEAN | BED_STAGING | SUPPLY_RESTOCK | PATIO_STAGING"
      - name: category
        type: enum
        source: computed
        description: "work class from the template row"
        constraints: "CLEANING | STAGING | RESTOCK"
      - name: sequence_no
        type: integer
        source: computed
        description: "template ordering key; list responses are sorted ascending on it"
      - name: requires_photo
        type: boolean
        source: computed
        description: "when true, submission without photo_uri is rejected"
      - name: photo_uri
        type: string
        source: input
        description: "photo evidence supplied at submission; null before"
      - name: note
        type: string
        source: input
        description: "cleaner note supplied at submission; null before"
      - name: status
        type: enum
        source: system
        description: "verification lifecycle"
        default: PENDING
        constraints: "PENDING | SUBMITTED | VERIFIED | REJECTED | WAIVED"
      - name: submitted_at
        type: datetime
        source: system
        description: "logical clock reading of the most recent submission; null before"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the Coordinator who last reviewed this task; the second segregation-of-duties input"
      - name: reject_count
        type: integer
        source: computed
        description: "how many times this task was rejected"
        default: 0
      - name: reject_reason
        type: string
        source: input
        description: "reviewer's reason on the most recent REJECT; null otherwise"
      - name: restock_line_count
        type: integer
        source: computed
        description: "number of restock entries recorded on the most recent submission"
        default: 0
      - name: restock_charge_cents
        type: integer
        source: computed
        description: "per-line-rounded owner chargeback contributed by this task once VERIFIED; 0 otherwise"
        default: 0

  - name: SupplyLine
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; taken from the path of POST /properties/{id}/supply-lines"
      - name: sku
        type: string
        source: input
        description: "stock keeping unit"
        constraints: "unique per (property_id, sku)"
      - name: name
        type: string
        source: input
        description: "human label"
      - name: category
        type: enum
        source: input
        description: "supply class; only LINEN lines feed the pay linen adder"
        constraints: "LINEN | CONSUMABLE | WELCOME"
      - name: unit
        type: string
        source: input
        description: "unit of issue"
        default: "each"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "replacement cost per unit; base of the per-line restock chargeback"
        constraints: ">= 0"
      - name: par_qty
        type: integer
        source: input
        description: "target stock level per turn; the PROVISIONAL pay variant estimates linen usage from this"
        constraints: ">= 0"
      - name: reorder_point
        type: integer
        source: input
        description: "on_hand_qty at or below which below_par is true"
        default: 0
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: computed
        description: "conserved ledger: sum of delta_qty over this line's StockMovement rows"
        default: 0
      - name: below_par
        type: boolean
        source: computed
        description: "on_hand_qty <= reorder_point"
        default: true
      - name: status
        type: enum
        source: input
        description: "only ACTIVE lines contribute to the PROVISIONAL linen estimate"
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: StockMovement
    parent: SupplyLine
    common_fields: false
    note: "append-only event log: no version field, no update or delete endpoint; the sole source of truth for SupplyLine.on_hand_qty"
    fields:
      - name: supply_line_id
        type: string
        source: computed
        description: "FK -> SupplyLine.id; the line whose stock moved"
      - name: turnover_id
        type: string
        source: computed
        description: "FK -> Turnover.id; the turnover that caused the movement, null for SEED and REPLENISH"
      - name: checklist_task_id
        type: string
        source: computed
        description: "FK -> ChecklistTask.id; the restock task that caused the movement, null for SEED and REPLENISH"
      - name: sequence_no
        type: integer
        source: system
        description: "1-based monotonic counter within supply_line_id; list responses sort ascending on it, giving a total order even for movements minted inside one request"
      - name: reason
        type: enum
        source: system
        description: "why stock moved"
        constraints: "SEED | REPLENISH | RESTOCK_USE | REVERSAL"
      - name: delta_qty
        type: integer
        source: system
        description: "signed change in on-hand units; negative for RESTOCK_USE, positive for SEED, REPLENISH and REVERSAL"
      - name: unit_cost_cents_at_time
        type: integer
        source: system
        description: "SupplyLine.unit_cost_cents captured when the movement was minted"
      - name: charge_cents
        type: integer
        source: system
        description: "per-line owner chargeback booked by this movement; 0 for SEED and REPLENISH, negative of the original on a REVERSAL"
        default: 0
      - name: note
        type: string
        source: input
        description: "free-text note supplied on replenishment; null otherwise"

  - name: IssueReport
    parent: Turnover
    common_fields: true
    fields:
      - name: turnover_id
        type: string
        source: input
        description: "FK -> Turnover.id; the clean during which the issue surfaced"
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; copied from the turnover"
      - name: reported_by_cleaner_id
        type: string
        source: computed
        description: "FK -> Cleaner.id; the acting Cleaner's X-User-ID, null when a Coordinator filed the report"
      - name: issue_type
        type: enum
        source: input
        description: "nature of the finding"
        constraints: "DAMAGE | MAINTENANCE | SAFETY | CONSUMABLE_SHORTAGE"
      - name: severity
        type: enum
        source: input
        description: "impact class; HIGH and CRITICAL always notify the owner"
        constraints: "LOW | MEDIUM | HIGH | CRITICAL"
      - name: description
        type: string
        source: input
        description: "what the cleaning team found"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "cleaner's repair estimate; at or above Property.owner_notify_min_cost_cents the owner is notified"
        constraints: ">= 0"
      - name: guest_chargeable
        type: boolean
        source: input
        description: "whether the departing guest may be billed"
        default: false
      - name: status
        type: enum
        source: system
        description: "issue lifecycle"
        default: REPORTED
        constraints: "REPORTED | OWNER_NOTIFIED | DISPATCHED | RESOLVED"
      - name: owner_notified_at
        type: datetime
        source: system
        description: "logical clock reading when the owner notification fired; null when never notified"

  - name: RepairOrder
    parent: IssueReport
    common_fields: true
    fields:
      - name: issue_report_id
        type: string
        source: computed
        description: "FK -> IssueReport.id; taken from the path of POST /issue-reports/{id}/dispatch"
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; copied from the issue report"
      - name: vendor_name
        type: string
        source: input
        description: "dispatched vendor"
      - name: scheduled_at
        type: datetime
        source: input
        description: "vendor visit instant"
      - name: blocks_checkin
        type: boolean
        source: input
        description: "when true the turnover goes ON_HOLD and the incoming guest's check-in gate is blocked"
        default: false
      - name: actual_cost_cents
        type: integer
        source: input
        description: "invoiced cost recorded at completion; null before"
        constraints: ">= 0"
      - name: completion_note
        type: string
        source: input
        description: "vendor closeout note; null before"
      - name: status
        type: enum
        source: system
        description: "repair lifecycle"
        default: DISPATCHED
        constraints: "DISPATCHED | COMPLETED"
      - name: completed_at
        type: datetime
        source: system
        description: "logical clock reading at completion; null before"

  - name: QualityAudit
    parent: Turnover
    common_fields: true
    fields:
      - name: turnover_id
        type: string
        source: input
        description: "FK -> Turnover.id; the completed turnover being sampled"
      - name: cleaner_id
        type: string
        source: computed
        description: "FK -> Cleaner.id; the cleaner on the turnover's COMPLETED assignment"
      - name: auditor_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the acting QualityAuditor; must differ from the turnover's assigned_by_user_id and every reviewed_by_user_id"
      - name: score
        type: integer
        source: input
        description: "auditor inspection score"
        constraints: ">= 0 and <= 100"
      - name: findings
        type: string
        source: input
        description: "auditor notes; null when omitted"
      - name: variant_applied
        type: enum
        source: computed
        description: "which quality variant finalization used: BLENDED when the incoming booking carried a cleanliness_rating at that moment, AUDIT_ONLY when it did not; null until FINALIZED"
        constraints: "BLENDED | AUDIT_ONLY"
      - name: guest_rating_at_audit
        type: integer
        source: computed
        description: "the incoming booking's cleanliness_rating captured at finalization; null when there was none"
      - name: observed_score
        type: number
        source: computed
        description: "single-turnover observed quality on the 0-100 scale, 2 decimals; null until FINALIZED"
      - name: resulting_quality_score
        type: number
        source: computed
        description: "the cleaner's quality_score after this audit was folded in, 2 decimals; null until FINALIZED"
      - name: pay_adjustment_cents
        type: integer
        source: computed
        description: "signed adjustment applied to the turnover's PayLine at finalization (audit bonus positive, audit penalty negative)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "audit lifecycle"
        default: SAMPLED
        constraints: "SAMPLED | FINALIZED | VOIDED"
      - name: finalized_at
        type: datetime
        source: system
        description: "logical clock reading at finalization; null before"

  - name: PayLine
    parent: Assignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: computed
        description: "FK -> Assignment.id; the accepted offer this pay line belongs to"
      - name: cleaner_id
        type: string
        source: computed
        description: "FK -> Cleaner.id; copied from the assignment"
      - name: turnover_id
        type: string
        source: computed
        description: "FK -> Turnover.id; copied from the assignment"
      - name: variant
        type: enum
        source: computed
        description: "which pay variant produced the current numbers"
        constraints: "PROVISIONAL | FINAL"
      - name: size_base_cents
        type: integer
        source: computed
        description: "SIZE_BASE_PAY_CENTS for the property's size_tier"
      - name: rush_premium_cents
        type: integer
        source: computed
        description: "turn-type rush premium on the base"
      - name: tight_window_premium_cents
        type: integer
        source: computed
        description: "tight-window premium on the base; 0 when is_tight is false"
      - name: cross_zone_premium_cents
        type: integer
        source: computed
        description: "cross-zone premium on the base; 0 when the cleaner's home zone matches the property zone"
      - name: linen_units
        type: integer
        source: computed
        description: "linen units the variant credits: summed par_qty of ACTIVE LINEN lines under PROVISIONAL, actual consumed units under FINAL"
      - name: linen_adder_cents
        type: integer
        source: computed
        description: "LINEN_HANDLING_CENTS_PER_UNIT * linen_units"
      - name: gross_cents
        type: integer
        source: computed
        description: "base + rush + tight + cross-zone + linen adder; the cap base for the late penalty"
      - name: on_time_bonus_cents
        type: integer
        source: computed
        description: "ON_TIME_BONUS_CENTS when late_minutes is 0, else 0"
      - name: photo_pass_bonus_cents
        type: integer
        source: computed
        description: "PHOTO_PASS_BONUS_CENTS when the turnover has zero rejected reviews, else 0"
      - name: bonus_cents
        type: integer
        source: computed
        description: "on_time_bonus_cents + photo_pass_bonus_cents"
      - name: late_minutes
        type: integer
        source: computed
        description: "the turnover's late_minutes at the moment the variant was computed"
        default: 0
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "per-block lateness charge after the gross-proportional cap"
      - name: photo_penalty_cents
        type: integer
        source: computed
        description: "per-rejection charge after the absolute cap"
      - name: audit_adjustment_cents
        type: integer
        source: computed
        description: "signed adjustment folded in by quality-audit finalization"
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "late_penalty_cents + photo_penalty_cents"
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents + bonus_cents - penalty_cents + audit_adjustment_cents"
      - name: status
        type: enum
        source: system
        description: "pay lifecycle; only PROVISIONAL, FINAL and ADJUSTED count toward Cleaner.pending_payout_cents"
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL | ADJUSTED | VOIDED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    note: |
      Property.status is configuration, not workflow: PAUSED and OFFBOARDED are produced only by
      supplying `status` on POST /properties (system initialization). There is no runtime
      transition endpoint; the machine exists to declare that only ACTIVE gates turnover creation.
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system initialization: POST /properties with status: PAUSED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["property is created directly in PAUSED and rejects POST /turnovers with ERR_PROPERTY_NOT_ACTIVE"]
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "system initialization: POST /properties with status: OFFBOARDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["property is created directly in OFFBOARDED and rejects POST /turnovers with ERR_PROPERTY_NOT_ACTIVE"]

  - entity: Cleaner
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cleaners/{id}/status with action: SUSPEND"
        actor: PlatformAdmin
        preconditions: ["cleaner.status == ACTIVE"]
        side_effects:
          - "every Assignment of this cleaner in status OFFERED or ACCEPTED transitions to REVOKED with revoked_at set to the logical clock (cascade down, non-terminal children only)"
          - "for each such Assignment whose Turnover.status is SCHEDULED, the Turnover returns to PENDING_ASSIGNMENT and its version increments by 1"
          - "each PayLine of those Assignments in status PROVISIONAL transitions to VOIDED"
          - "cleaner.pending_payout_cents decreases by the net_cents of every PayLine just voided (ledger sync)"
          - "Assignments already ACTIVE or COMPLETED are untouched; a turnover already IN_PROGRESS keeps its cleaner"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cleaners/{id}/status with action: REACTIVATE"
        actor: PlatformAdmin
        preconditions: ["cleaner.status == SUSPENDED"]
        side_effects: ["cleaner becomes eligible again; revoked assignments are NOT restored"]
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /cleaners/{id}/status with action: OFFBOARD"
        actor: PlatformAdmin
        preconditions: ["cleaner.status == ACTIVE", "cleaner has no Assignment in status ACTIVE"]
        side_effects: ["same revocation, turnover-reversion and payout-debit cascade as SUSPEND"]
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /cleaners/{id}/status with action: OFFBOARD"
        actor: PlatformAdmin
        preconditions: ["cleaner.status == SUSPENDED"]
        side_effects: ["no further cascade; suspension already revoked the open offers"]

  - entity: Booking
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: |
      PARALLEL DIMENSIONS. `status` (occupancy: SCHEDULED -> CHECKED_OUT | CANCELLED) and
      `checkin_gate` (arrival readiness: OPEN -> BLOCKED -> RELEASED) advance independently and are
      driven by different triggers; `guest_notice_code` rides the gate dimension. The transitions
      below are grouped by dimension.
    transitions:
      # ---- occupancy dimension ----
      - from: SCHEDULED
        to: CHECKED_OUT
        trigger: "POST /bookings/{id}/checkout"
        actor: Coordinator
        preconditions: ["booking.status == SCHEDULED"]
        side_effects:
          - "actual_checkout_at is set to the supplied instant, defaulting to the logical clock"
          - "every non-terminal Turnover whose outgoing_booking_id is this booking recomputes window_start_at, window_end_at, window_minutes, slack_minutes, turn_type and is_tight, and its version increments by 1"
          - "recomputation on checkout NEVER rejects: if window_minutes would be <= 0 it is clamped to 0"
          - "if the recomputed window_minutes < required_minutes the turnover sets escalation_required true"
          - "if the recomputed window_minutes == 0 the turnover's incoming booking moves its checkin_gate to BLOCKED and guest_notice_code to CHECKIN_DELAYED (cross-entity, second hop)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Coordinator
        preconditions: ["booking.status == SCHEDULED"]
        side_effects:
          - "CONDITIONAL CASCADE branch A - this booking is the outgoing_booking_id of a non-terminal Turnover: that Turnover transitions to VOID and its version increments by 1"
          - "branch A continued: that Turnover's Assignments in OFFERED, ACCEPTED or ACTIVE transition to REVOKED; their PROVISIONAL PayLines transition to VOIDED; cleaner.pending_payout_cents decreases by each voided net_cents"
          - "branch A continued: that Turnover's QualityAudits in SAMPLED transition to VOIDED"
          - "CONDITIONAL CASCADE branch B - this booking is the incoming_booking_id of a non-terminal Turnover: that Turnover sets incoming_booking_id to null, recomputes the window as a vacant gap (turn_type VACANT_GAP, window_end_at = window_start_at + VACANT_WINDOW_HOURS), clears escalation_required when the new window covers required_minutes, and increments version by 1; the Turnover status is NOT changed"
          - "a Turnover already COMPLETED or VOID is untouched under either branch"
      # ---- arrival-readiness dimension ----
      - from: OPEN
        to: BLOCKED
        trigger: "system event: a check-in-blocking RepairOrder is dispatched on this booking's turnover, or a recorded checkout collapses that turnover's window to 0 minutes"
        actor: system
        preconditions: ["this booking is the incoming_booking_id of the turnover", "booking.checkin_gate == OPEN"]
        side_effects: ["guest_notice_code becomes CHECKIN_DELAYED", "booking.version increments by 1"]
      - from: BLOCKED
        to: RELEASED
        trigger: "system event: POST /repair-orders/{id}/complete on the RepairOrder that blocked this booking's turnover"
        actor: system
        preconditions: ["booking.checkin_gate == BLOCKED"]
        side_effects: ["guest_notice_code returns to NONE (compensation)", "booking.version increments by 1"]
      - from: OPEN
        to: OPEN
        trigger: "POST /bookings/{id}/schedule-change with change_type LATE_CHECKOUT or EARLY_CHECKIN"
        actor: Coordinator
        preconditions: ["booking.status == SCHEDULED"]
        side_effects:
          - "LATE_CHECKOUT sets late_checkout_until_at and guest_notice_code LATE_CHECKOUT_GRANTED; EARLY_CHECKIN sets early_checkin_at and, when an override_reason was required, guest_notice_code EARLY_CHECKIN_LIMITED"
          - "the affected non-terminal Turnover recomputes its window and increments version by 1"
          - "the gate dimension is untouched - a granted schedule change does not block arrival"

  - entity: Turnover
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [COMPLETED, VOID]
    note: |
      CYCLIC AND COMPOUND. While the clean is underway the status is not set directly; it is
      RE-DERIVED from the ChecklistTask children after every child change by this ordered rule
      (first match wins), and only when the current status is one of IN_PROGRESS,
      AWAITING_VERIFICATION, REWORK_REQUIRED:
        1. any child in REJECTED            -> REWORK_REQUIRED
        2. else any child in PENDING        -> IN_PROGRESS
        3. else (all VERIFIED or WAIVED)    -> AWAITING_VERIFICATION
      A turnover in ON_HOLD, COMPLETED or VOID is never re-derived. The AWAITING_VERIFICATION ->
      REWORK_REQUIRED -> IN_PROGRESS -> AWAITING_VERIFICATION loop is the cycle; ON_HOLD is the
      detour that stores and restores pre_hold_status.
    transitions:
      - from: PENDING_ASSIGNMENT
        to: SCHEDULED
        trigger: "POST /assignments/{id}/accept"
        actor: Cleaner
        preconditions: ["turnover.status == PENDING_ASSIGNMENT", "assignment.status == OFFERED", "cleaner.status == ACTIVE"]
        side_effects:
          - "the accepting Assignment becomes ACCEPTED with accepted_at set to the logical clock"
          - "a PayLine is created in status PROVISIONAL with variant PROVISIONAL per calculations.cleaner_pay_line"
          - "cleaner.pending_payout_cents increases by that PayLine.net_cents (ledger sync)"
          - "turnover.version increments by 1"
      - from: SCHEDULED
        to: PENDING_ASSIGNMENT
        trigger: "system event: the accepted Assignment is revoked by POST /cleaners/{id}/status"
        actor: system
        preconditions: ["turnover.status == SCHEDULED"]
        side_effects: ["the PROVISIONAL PayLine becomes VOIDED and cleaner.pending_payout_cents is debited", "turnover.version increments by 1"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /turnovers/{id}/start"
        actor: Cleaner
        preconditions:
          - "turnover.status == SCHEDULED"
          - "the acting cleaner owns the turnover's ACCEPTED Assignment"
          - "the outgoing Booking.status == CHECKED_OUT (guarded transition, cross-entity)"
          - "the logical clock is at or after turnover.window_start_at"
        side_effects:
          - "the ACCEPTED Assignment becomes ACTIVE"
          - "started_at is set to the logical clock"
          - "ChecklistTask rows are generated from CHECKLIST_TEMPLATE for the property's size_tier, all in PENDING (cascade down)"
          - "checklist_task_count is set to the number of rows generated"
          - "turnover.version increments by 1"
      - from: IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "system event: re-derivation after a ChecklistTask change leaves no PENDING and no REJECTED child"
        actor: system
        preconditions: ["turnover.status == IN_PROGRESS"]
        side_effects: ["turnover.version increments by 1 (bubble up)"]
      - from: AWAITING_VERIFICATION
        to: REWORK_REQUIRED
        trigger: "POST /checklist-tasks/{id}/review with action: REJECT"
        actor: Coordinator
        preconditions: ["turnover.status == AWAITING_VERIFICATION", "the reviewed task is SUBMITTED"]
        side_effects:
          - "rework_round increases by 1 and rejected_review_count increases by 1"
          - "the turnover's PROVISIONAL PayLine recomputes photo_penalty_cents, clears photo_pass_bonus_cents, and re-derives net_cents; cleaner.pending_payout_cents moves by the delta (ledger sync)"
          - "when rework_round > MAX_REWORK_ROUNDS the turnover sets escalation_required true and the cleaner's strike_count increases by 1"
          - "turnover.version increments by 1"
      - from: REWORK_REQUIRED
        to: IN_PROGRESS
        trigger: "system event: re-derivation after the rejected ChecklistTask is re-submitted while another child is still PENDING"
        actor: system
        preconditions: ["turnover.status == REWORK_REQUIRED"]
        side_effects: ["turnover.version increments by 1"]
      - from: REWORK_REQUIRED
        to: AWAITING_VERIFICATION
        trigger: "system event: re-derivation after the last rejected ChecklistTask is re-submitted or waived and no child remains PENDING"
        actor: system
        preconditions: ["turnover.status == REWORK_REQUIRED"]
        side_effects: ["turnover.version increments by 1 (closes the rework cycle)"]
      - from: AWAITING_VERIFICATION
        to: IN_PROGRESS
        trigger: "system event: re-derivation after a VERIFIED restock task is reversed to WAIVED while another child returns to PENDING"
        actor: system
        preconditions: ["turnover.status == AWAITING_VERIFICATION"]
        side_effects: ["turnover.version increments by 1"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /issue-reports/{id}/dispatch with blocks_checkin: true"
        actor: Coordinator
        preconditions: ["turnover.status is one of PENDING_ASSIGNMENT, SCHEDULED, IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"]
        side_effects:
          - "pre_hold_status stores the status being left"
          - "blocking_repair_order_id is set to the new RepairOrder"
          - "the incoming Booking's checkin_gate becomes BLOCKED and guest_notice_code becomes CHECKIN_DELAYED (cross-entity, second hop)"
          - "turnover.version increments by 1"
        note: "the same transition applies from SCHEDULED, AWAITING_VERIFICATION and REWORK_REQUIRED; pre_hold_status records which"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /repair-orders/{id}/complete"
        actor: Coordinator
        preconditions: ["turnover.status == ON_HOLD", "turnover.blocking_repair_order_id == the completed repair order"]
        side_effects:
          - "status is restored from pre_hold_status, which is then cleared along with blocking_repair_order_id (compensation)"
          - "the incoming Booking's checkin_gate becomes RELEASED and guest_notice_code returns to NONE"
          - "turnover.version increments by 1"
      - from: AWAITING_VERIFICATION
        to: COMPLETED
        trigger: "POST /turnovers/{id}/complete"
        actor: Cleaner
        preconditions:
          - "turnover.status == AWAITING_VERIFICATION"
          - "every ChecklistTask of the turnover is VERIFIED or WAIVED"
        side_effects:
          - "finished_at is set to the logical clock and late_minutes is derived from window_end_at"
          - "the ACTIVE Assignment becomes COMPLETED and cleaner.completed_turnover_count increases by 1"
          - "the PROVISIONAL PayLine recomputes under the FINAL variant, its status becomes FINAL and variant becomes FINAL"
          - "cleaner.pending_payout_cents moves by (final net_cents - provisional net_cents) (reconciliation)"
          - "restock_chargeback_cents is set from the VERIFIED restock tasks per calculations.restock_chargeback"
          - "property.last_turnover_completed_at is set to the logical clock"
          - "turnover.version increments by 1"
      - from: PENDING_ASSIGNMENT
        to: VOID
        trigger: "system event: POST /bookings/{id}/cancel on the outgoing booking"
        actor: system
        preconditions: ["turnover.status is not COMPLETED and not VOID"]
        side_effects: ["Assignments in OFFERED, ACCEPTED or ACTIVE become REVOKED", "PROVISIONAL PayLines become VOIDED and the cleaner payout ledger is debited", "SAMPLED QualityAudits become VOIDED", "turnover.version increments by 1"]
        note: "the same system transition applies from SCHEDULED, IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED and ON_HOLD"

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, REVOKED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Cleaner
        preconditions:
          - "assignment.status == OFFERED"
          - "assignment.cleaner_id == the acting X-User-ID"
          - "cleaner.status == ACTIVE (guarded transition, cross-entity)"
          - "turnover.status == PENDING_ASSIGNMENT"
          - "the turnover's window does not overlap another non-terminal assignment of this cleaner under the zone buffer"
        side_effects: ["accepted_at set", "turnover becomes SCHEDULED", "a PROVISIONAL PayLine is created", "cleaner.pending_payout_cents credited"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: Cleaner
        preconditions: ["assignment.status == OFFERED", "assignment.cleaner_id == the acting X-User-ID"]
        side_effects:
          - "declined_at set and cleaner.decline_count increases by 1"
          - "the turnover stays in PENDING_ASSIGNMENT and its version is NOT incremented (branch divergence versus accept)"
      - from: OFFERED
        to: REVOKED
        trigger: "POST /turnovers/{id}/assign creating a superseding offer, or POST /cleaners/{id}/status suspending or offboarding the cleaner"
        actor: Coordinator
        preconditions: ["assignment.status == OFFERED"]
        side_effects: ["revoked_at set", "no PayLine exists yet, so no ledger movement"]
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /turnovers/{id}/start"
        actor: Cleaner
        preconditions: ["assignment.status == ACCEPTED", "the outgoing booking is CHECKED_OUT"]
        side_effects: ["turnover becomes IN_PROGRESS and its ChecklistTask rows are generated"]
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /cleaners/{id}/status suspending or offboarding the cleaner, or system cancellation of the outgoing booking"
        actor: system
        preconditions: ["assignment.status == ACCEPTED"]
        side_effects: ["revoked_at set", "the PROVISIONAL PayLine becomes VOIDED and cleaner.pending_payout_cents is debited", "the turnover returns to PENDING_ASSIGNMENT unless it was voided"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /turnovers/{id}/complete"
        actor: Cleaner
        preconditions: ["assignment.status == ACTIVE", "the turnover reaches COMPLETED"]
        side_effects: ["cleaner.completed_turnover_count increases by 1", "the PayLine switches to the FINAL variant"]
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: POST /bookings/{id}/cancel voiding the turnover"
        actor: system
        preconditions: ["assignment.status == ACTIVE"]
        side_effects: ["revoked_at set", "the PROVISIONAL PayLine becomes VOIDED and the ledger is debited"]

  - entity: ChecklistTask
    initial_state: PENDING
    terminal_states: [WAIVED]
    note: |
      CYCLIC. PENDING -> SUBMITTED -> REJECTED -> SUBMITTED is the photo-rework loop. VERIFIED is
      NOT terminal: a Coordinator may reverse a verified restock with action WAIVE, which
      compensates the stock movements it booked. Every transition re-derives the parent Turnover's
      status by the ordered rule in the Turnover machine note.
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /checklist-tasks/{id}/submit"
        actor: Cleaner
        preconditions:
          - "task.status is PENDING or REJECTED"
          - "the acting cleaner owns the turnover's ACTIVE Assignment"
          - "turnover.status is one of IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"
          - "photo_uri is present when requires_photo is true"
          - "restock_entries are present exactly when category == RESTOCK"
          - "every restock entry's supply line belongs to the turnover's property and has qty_used <= on_hand_qty"
        side_effects: ["photo_uri, note, submitted_at and restock_line_count are recorded", "the parent Turnover status is re-derived"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /checklist-tasks/{id}/submit"
        actor: Cleaner
        preconditions: ["task.status == REJECTED", "same ownership, photo and restock preconditions as from PENDING"]
        side_effects: ["submitted_at is refreshed", "the parent Turnover status is re-derived, closing or continuing the rework cycle"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /checklist-tasks/{id}/review with action: APPROVE"
        actor: Coordinator
        preconditions: ["task.status == SUBMITTED", "turnover.status is one of IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"]
        side_effects:
          - "reviewed_by_user_id records the acting X-User-ID"
          - "for a RESTOCK task, one StockMovement per submitted restock entry is appended with reason RESTOCK_USE and delta_qty = -qty_used, in the order the entries were supplied; each affected SupplyLine's on_hand_qty and below_par are recomputed and its version increments by 1 (ledger sync)"
          - "restock_charge_cents is set from calculations.restock_chargeback for this task"
          - "the parent Turnover status is re-derived"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /checklist-tasks/{id}/review with action: REJECT"
        actor: Coordinator
        preconditions: ["task.status == SUBMITTED", "turnover.status is one of IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"]
        side_effects:
          - "reject_count increases by 1, reject_reason and reviewed_by_user_id are recorded"
          - "the parent Turnover increments rejected_review_count and rework_round, re-derives to REWORK_REQUIRED, and its PROVISIONAL PayLine takes the photo penalty and loses the photo-pass bonus"
          - "no StockMovement is appended - consumption is booked only on APPROVE, so rejection cannot double-count stock"
      - from: PENDING
        to: WAIVED
        trigger: "POST /checklist-tasks/{id}/review with action: WAIVE"
        actor: Coordinator
        preconditions: ["task.status is PENDING, REJECTED or VERIFIED", "turnover.status is one of IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"]
        side_effects: ["reviewed_by_user_id recorded", "the parent Turnover status is re-derived"]
      - from: REJECTED
        to: WAIVED
        trigger: "POST /checklist-tasks/{id}/review with action: WAIVE"
        actor: Coordinator
        preconditions: ["task.status == REJECTED"]
        side_effects: ["the parent Turnover status is re-derived and may close the rework cycle", "rejected_review_count is NOT decreased - the penalty already booked stands"]
      - from: VERIFIED
        to: WAIVED
        trigger: "POST /checklist-tasks/{id}/review with action: WAIVE"
        actor: Coordinator
        preconditions: ["task.status == VERIFIED", "turnover.status is one of IN_PROGRESS, AWAITING_VERIFICATION, REWORK_REQUIRED"]
        side_effects:
          - "COMPENSATION: for every RESTOCK_USE StockMovement this task booked, a REVERSAL StockMovement with the opposite delta_qty and the negated charge_cents is appended in the same per-line order; each SupplyLine's on_hand_qty returns to its pre-approval value, below_par is recomputed and version increments by 1"
          - "restock_charge_cents returns to 0"
          - "the parent Turnover status is re-derived"

  - entity: SupplyLine
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    note: "status is configuration: DISCONTINUED is produced only by supplying `status` on POST /properties/{id}/supply-lines (system initialization). Discontinued lines are excluded from the PROVISIONAL linen estimate but still accept restock consumption."
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "system initialization: POST /properties/{id}/supply-lines with status: DISCONTINUED"
        actor: Coordinator
        preconditions: []
        side_effects: ["the line is excluded from the ACTIVE-LINEN par sum used by the PROVISIONAL pay variant"]

  - entity: IssueReport
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: OWNER_NOTIFIED
        trigger: "system event: evaluated at POST /issue-reports creation time"
        actor: system
        preconditions: ["severity is HIGH or CRITICAL, OR estimated_cost_cents >= property.owner_notify_min_cost_cents"]
        side_effects: ["owner_notified_at is set to the logical clock", "the report is created directly in OWNER_NOTIFIED rather than REPORTED"]
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /issue-reports/{id}/dispatch"
        actor: Coordinator
        preconditions: ["issue.status is REPORTED or OWNER_NOTIFIED"]
        side_effects: ["a RepairOrder is created in DISPATCHED", "when blocks_checkin is true the turnover goes ON_HOLD and the incoming guest's gate is BLOCKED"]
      - from: OWNER_NOTIFIED
        to: DISPATCHED
        trigger: "POST /issue-reports/{id}/dispatch"
        actor: Coordinator
        preconditions: ["issue.status == OWNER_NOTIFIED"]
        side_effects: ["same as from REPORTED"]
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /repair-orders/{id}/complete"
        actor: Coordinator
        preconditions: ["issue.status == DISPATCHED", "the repair order is DISPATCHED"]
        side_effects: ["property.open_issue_count decreases by 1 (ledger sync)", "a blocked turnover and guest gate are released"]

  - entity: RepairOrder
    initial_state: DISPATCHED
    terminal_states: [COMPLETED]
    transitions:
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /repair-orders/{id}/complete"
        actor: Coordinator
        preconditions: ["repair_order.status == DISPATCHED"]
        side_effects:
          - "completed_at and actual_cost_cents are recorded"
          - "the parent IssueReport becomes RESOLVED and property.open_issue_count decreases by 1"
          - "CONDITIONAL: only when a Turnover carries this order as blocking_repair_order_id does that turnover leave ON_HOLD and the incoming booking's gate move to RELEASED"

  - entity: QualityAudit
    initial_state: SAMPLED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: SAMPLED
        to: FINALIZED
        trigger: "POST /quality-audits/{id}/finalize"
        actor: QualityAuditor
        preconditions: ["audit.status == SAMPLED", "audit.auditor_user_id == the acting X-User-ID"]
        side_effects:
          - "variant_applied is chosen from whether the turnover's incoming booking carries a cleanliness_rating at this instant"
          - "guest_rating_at_audit, observed_score and resulting_quality_score are computed and the cleaner's quality_score is replaced by resulting_quality_score (cross-entity)"
          - "pay_adjustment_cents is derived from the audit thresholds; when non-zero the turnover's FINAL PayLine folds it into audit_adjustment_cents, re-derives net_cents, moves to status ADJUSTED, and cleaner.pending_payout_cents moves by the same delta (ledger sync)"
          - "finalized_at is set to the logical clock"
      - from: SAMPLED
        to: VOIDED
        trigger: "system event: POST /bookings/{id}/cancel voiding the audited turnover"
        actor: system
        preconditions: ["audit.status == SAMPLED"]
        side_effects: ["no quality_score or pay movement occurs - an unfinalized audit never touched either"]

  - entity: PayLine
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /turnovers/{id}/complete"
        actor: Cleaner
        preconditions: ["pay_line.status == PROVISIONAL", "the turnover reaches COMPLETED"]
        side_effects: ["all money fields are recomputed under the FINAL variant", "variant becomes FINAL", "cleaner.pending_payout_cents moves by the net delta"]
      - from: FINAL
        to: ADJUSTED
        trigger: "POST /quality-audits/{id}/finalize with a score outside the neutral band"
        actor: QualityAuditor
        preconditions: ["pay_line.status == FINAL", "the audit's pay_adjustment_cents != 0"]
        side_effects: ["audit_adjustment_cents is set and net_cents re-derived", "cleaner.pending_payout_cents moves by the adjustment"]
      - from: PROVISIONAL
        to: VOIDED
        trigger: "system event: the owning Assignment is revoked, or the turnover is voided by an outgoing-booking cancellation"
        actor: system
        preconditions: ["pay_line.status == PROVISIONAL"]
        side_effects: ["cleaner.pending_payout_cents decreases by net_cents; the PayLine row and its money fields are retained for audit"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assign-stale-turnover
    parent_entity: Turnover
    write_endpoint: "POST /turnovers/{id}/assign"
    occ_field: "expected_turnover_version"
    description: |
      Creating a cleaner offer against a Turnover whose version has advanced since the client last
      observed it is rejected. Offer creation is a legitimate supersede operation - a new offer
      revokes the turnover's outstanding OFFERED assignment by design - so a coordinator working
      from a stale view of the turnover would silently overwrite an offer, acceptance or window
      recomputation it never saw. The stale-version check turns that into a deterministic refusal.
    error_id: ERR_STALE_TURNOVER_VERSION
    http_status: 412

  - rule_id: replenish-stale-supply-line
    parent_entity: SupplyLine
    write_endpoint: "POST /supply-lines/{id}/replenish"
    occ_field: "expected_supply_line_version"
    description: |
      Adding received stock to a SupplyLine whose version has advanced since the client last read it
      is rejected. Replenishment is additive and would otherwise always succeed, so a second
      restocking request built on a stale reading of on_hand_qty double-counts a delivery that a
      restock consumption or an earlier replenishment already moved. The stale-version check forces
      the client to re-read the line first.
    error_id: ERR_STALE_SUPPLY_LINE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: turnover_window_and_requirement
    trigger: "POST /turnovers, and re-run on every event that moves a boundary instant: POST /bookings/{id}/schedule-change, POST /bookings/{id}/checkout, POST /bookings/{id}/cancel of the incoming booking"
    algorithm: interval_merge
    formula: |
      effective_checkout_at = MAX over non-null of (
          outgoing.checkout_at,
          outgoing.late_checkout_until_at,
          outgoing.actual_checkout_at )
      window_start_at = effective_checkout_at

      if incoming_booking is null:
          window_end_at = window_start_at + VACANT_WINDOW_HOURS hours
          turn_type     = "VACANT_GAP"
      else:
          effective_checkin_at = MIN over non-null of (
              incoming.checkin_at,
              incoming.early_checkin_at )
          window_end_at = effective_checkin_at - INSPECTION_BUFFER_MINUTES minutes
          # LOCAL calendar dates, not UTC dates
          local_out = local_date(window_start_at,      property.local_utc_offset_minutes)
          local_in  = local_date(effective_checkin_at,  property.local_utc_offset_minutes)
          turn_type = "SAME_DAY" if local_out == local_in else "OVERNIGHT"

      raw_window_minutes = whole_minutes(window_end_at - window_start_at)

      raw_required = SIZE_BASE_MINUTES[property.size_tier]
                   + MINUTES_PER_BATHROOM * property.bathroom_count
                   + MINUTES_PER_BED      * property.bed_count
      if outgoing.pet_stay: raw_required = raw_required * PET_CLEAN_MULTIPLIER
      required_minutes = MAX(property.min_clean_minutes, ceil(raw_required))

      # creation path: refuse a window that cannot fit the work unless justified
      if raw_window_minutes <= 0:                     -> ERR_CLEANING_WINDOW_NON_POSITIVE
      if raw_window_minutes < required_minutes and override_reason is null:
                                                      -> ERR_WINDOW_OVERRIDE_REQUIRED

      # recompute-on-checkout path: never refuse, clamp and flag instead
      window_minutes = MAX(0, raw_window_minutes)

      slack_minutes  = window_minutes - required_minutes
      is_tight       = slack_minutes < TIGHT_SLACK_MINUTES
      escalation_required = (slack_minutes < 0) or escalation_required
    input_set: "the outgoing Booking (status SCHEDULED or CHECKED_OUT) and, when present, the incoming Booking (status SCHEDULED or CHECKED_OUT); a CANCELLED booking is never a boundary"
    constants:
      SIZE_BASE_MINUTES: { STUDIO: 90, ONE_BR: 120, TWO_BR: 150, THREE_BR_PLUS: 200 }
      MINUTES_PER_BATHROOM: 12
      MINUTES_PER_BED: 8
      PET_CLEAN_MULTIPLIER: 1.20
      INSPECTION_BUFFER_MINUTES: 30
      VACANT_WINDOW_HOURS: 48
      TIGHT_SLACK_MINUTES: 45
    precision: "whole minutes; required_minutes uses ceil after the pet multiplier; comparisons are >= at the boundary (window_minutes == required_minutes is acceptable and needs no override)"
    variants:
      - name: creation_strict
        when: "POST /turnovers and POST /bookings/{id}/schedule-change"
        difference: "a window shorter than required_minutes is refused unless override_reason is supplied"
      - name: checkout_clamped
        when: "POST /bookings/{id}/checkout, where the guest has already physically left"
        difference: "never refuses; window_minutes is clamped at 0, escalation_required is raised, and a zero window blocks the incoming guest's check-in gate"

  - name: cleaner_match_score
    trigger: "POST /turnovers/{id}/assign - to rank the candidate pool when cleaner_id is omitted, and to record match_score on the offer in both modes"
    algorithm: weighted_scoring
    formula: |
      zone_match_factor =
          1.0  if cleaner.home_zone_code == property.zone_code
          0.4  if property.zone_code in cleaner.secondary_zone_codes
          0.0  otherwise                       # only reachable when accepts_cross_zone is true

      normalized_quality = cleaner.quality_score / 100
      skill_headroom     = MIN(1.0,
          (cleaner.skill_level - property.min_skill_level + 1) / SKILL_HEADROOM_DIVISOR)

      match_score = round_half_up(
            W_QUALITY * normalized_quality
          + W_ZONE    * zone_match_factor
          + W_SKILL   * skill_headroom , 4)

      # SELECTOR mode: highest match_score wins.
      # Deterministic tie-break chain, applied in order:
      #   1. higher cleaner.skill_level
      #   2. lower count of the cleaner's non-terminal assignments on the same property-local date
      #   3. earlier cleaner.created_at        (never cleaner.id)
      # empty candidate pool -> ERR_NO_ELIGIBLE_CLEANER
    input_set: |
      candidate pool = Cleaners with status ACTIVE, whose zone is served
      (home match, or property zone in secondary_zone_codes, or accepts_cross_zone true),
      whose skill_level >= property.min_skill_level,
      who are not listed in the request's exclude_cleaner_ids,
      whose non-terminal assignment count on the turnover's property-local date is
      < max_daily_turnovers, and whose existing non-terminal assignment windows do not
      overlap this turnover's window under the zone buffer.
      In EXPLICIT mode the named cleaner is not filtered - each pool condition it fails
      becomes an error instead, per §1.4.
    constants:
      W_QUALITY: 0.50
      W_ZONE: 0.30
      W_SKILL: 0.20
      SKILL_HEADROOM_DIVISOR: 4
    precision: "4 decimal places, round_half_up; the three weights sum to exactly 1.00 so match_score lies in [0, 1]"

  - name: restock_chargeback
    trigger: "POST /checklist-tasks/{id}/review with action APPROVE on a RESTOCK task (per-task charge), and POST /turnovers/{id}/complete (turnover total)"
    algorithm: aggregation
    formula: |
      # PER-LINE rounding, then summation. This order is normative.
      for each restock entry e submitted on the task, in the order supplied:
          line_charge[e] = round_half_up(
              supply_line(e).unit_cost_cents * e.qty_used * WASTE_FACTOR , 0)

      task.restock_charge_cents     = SUM over e of line_charge[e]
      turnover.restock_chargeback_cents = SUM over VERIFIED RESTOCK tasks of restock_charge_cents

      # Each StockMovement carries its own line_charge in charge_cents; a REVERSAL movement
      # carries the negated value, so summing charge_cents over the ledger always reconciles
      # with the surviving task charges.
    input_set: "restock entries of ChecklistTasks in status VERIFIED whose category is RESTOCK; entries on SUBMITTED, REJECTED or WAIVED tasks contribute nothing"
    constants:
      WASTE_FACTOR: 1.075
    precision: "each LINE is rounded to whole cents with round_half_up BEFORE summation; rounding the summed pre-waste subtotal instead produces a different total and is wrong"

  - name: cleaner_pay_line
    trigger: "POST /assignments/{id}/accept (PROVISIONAL), GET /turnovers/{id}/pay-preview (both), POST /turnovers/{id}/complete (FINAL), POST /quality-audits/{id}/finalize (audit adjustment)"
    algorithm: threshold
    formula: |
      # ---- STEP 1: base ----
      size_base_cents = SIZE_BASE_PAY_CENTS[property.size_tier]

      # ---- STEP 2: premiums, each rounded independently off the base ----
      rush_pct = RUSH_PCT_SAME_DAY  if turnover.turn_type == "SAME_DAY"
                 RUSH_PCT_OVERNIGHT if turnover.turn_type == "OVERNIGHT"
                 0                  if turnover.turn_type == "VACANT_GAP"
      rush_premium_cents        = round_half_up(size_base_cents * rush_pct, 0)
      tight_window_premium_cents= round_half_up(size_base_cents * TIGHT_PCT, 0) if turnover.is_tight else 0
      cross_zone_premium_cents  = round_half_up(size_base_cents * CROSS_ZONE_PCT, 0)
                                  if cleaner.home_zone_code != property.zone_code else 0

      # ---- STEP 3: linen units - THE VARIANT SWITCH ----
      linen_units = (variant == PROVISIONAL)
          ? SUM of par_qty over the property's SupplyLines with category LINEN and status ACTIVE
          : SUM of qty_used over restock entries on VERIFIED RESTOCK tasks of this turnover
                whose supply line category is LINEN
      linen_adder_cents = LINEN_HANDLING_CENTS_PER_UNIT * linen_units

      # ---- STEP 4: gross ----
      gross_cents = size_base_cents + rush_premium_cents + tight_window_premium_cents
                  + cross_zone_premium_cents + linen_adder_cents

      # ---- STEP 5: penalties, capped AGAINST THE GROSS COMPUTED IN STEP 4 ----
      late_minutes = (variant == PROVISIONAL) ? 0 : turnover.late_minutes
      raw_late_penalty  = LATE_PENALTY_CENTS_PER_BLOCK * ceil(late_minutes / LATE_BLOCK_MINUTES)
      late_penalty_cents = MIN(raw_late_penalty,
                               round_half_up(LATE_PENALTY_CAP_PCT * gross_cents, 0))
      photo_penalty_cents = MIN(PHOTO_REJECT_PENALTY_CENTS * turnover.rejected_review_count,
                                PHOTO_PENALTY_CAP_CENTS)
      penalty_cents = late_penalty_cents + photo_penalty_cents

      # ---- STEP 6: bonuses ----
      on_time_bonus_cents   = ON_TIME_BONUS_CENTS   if late_minutes == 0 else 0
      photo_pass_bonus_cents= PHOTO_PASS_BONUS_CENTS if turnover.rejected_review_count == 0 else 0
      bonus_cents = on_time_bonus_cents + photo_pass_bonus_cents

      # ---- STEP 7: net ----
      net_cents = gross_cents + bonus_cents - penalty_cents + audit_adjustment_cents

      # The step order is normative. Capping the late penalty before the linen adder lands in
      # gross_cents, or applying bonuses before the cap, yields different money for the same data.
    input_set: "the Assignment's Cleaner and the Turnover's Property; under FINAL, only restock entries on VERIFIED RESTOCK tasks count toward linen_units"
    constants:
      SIZE_BASE_PAY_CENTS: { STUDIO: 4550, ONE_BR: 6175, TWO_BR: 8325, THREE_BR_PLUS: 11450 }
      RUSH_PCT_SAME_DAY: 0.15
      RUSH_PCT_OVERNIGHT: 0.05
      TIGHT_PCT: 0.075
      CROSS_ZONE_PCT: 0.045
      LINEN_HANDLING_CENTS_PER_UNIT: 120
      ON_TIME_BONUS_CENTS: 800
      PHOTO_PASS_BONUS_CENTS: 500
      LATE_PENALTY_CENTS_PER_BLOCK: 250
      LATE_BLOCK_MINUTES: 15
      LATE_PENALTY_CAP_PCT: 0.30
      PHOTO_REJECT_PENALTY_CENTS: 300
      PHOTO_PENALTY_CAP_CENTS: 900
    precision: "whole cents, round_half_up on each premium and on the late-penalty cap; no intermediate value is carried at sub-cent precision"
    variants:
      - name: PROVISIONAL
        when: "created at POST /assignments/{id}/accept and returned by GET /turnovers/{id}/pay-preview while the turnover has not reached COMPLETED"
        difference: "linen_units is the ESTIMATE from summed par_qty of ACTIVE LINEN lines; late_minutes is forced to 0 so the on-time bonus is always granted; photo penalties from rejections already booked still apply"
      - name: FINAL
        when: "recomputed at POST /turnovers/{id}/complete and returned by pay-preview once the turnover is COMPLETED"
        difference: "linen_units is the ACTUAL consumption recorded on VERIFIED RESTOCK tasks and late_minutes is the real lateness, so both the linen adder and the late-penalty cap base change"

  - name: cleaner_quality_score_recompute
    trigger: "POST /quality-audits/{id}/finalize"
    algorithm: decay_function
    formula: |
      guest_rating = the turnover's incoming Booking cleanliness_rating, or null when there is none
                     (a VACANT_GAP turnover, or a review that has not landed yet)

      if guest_rating is not null:
          variant_applied = "BLENDED"
          observed_score  = round_half_up(
              W_AUDIT * audit.score + W_GUEST * (guest_rating * GUEST_RATING_SCALE), 2)
      else:
          variant_applied = "AUDIT_ONLY"
          observed_score  = round_half_up(audit.score, 2)

      resulting_quality_score = round_half_up(
          CARRYOVER_WEIGHT * cleaner.quality_score
        + OBSERVED_WEIGHT  * observed_score , 2)

      cleaner.quality_score = resulting_quality_score

      # Order sensitivity is deliberate: the variant is decided by whether the guest review has
      # landed AT FINALIZATION TIME. A review arriving afterwards is recorded on the booking but
      # NEVER retroactively re-scores a FINALIZED audit.

      # pay adjustment thresholds (audit.score, not observed_score)
      pay_adjustment_cents =
          + AUDIT_BONUS_CENTS   if audit.score >= AUDIT_BONUS_SCORE
          - AUDIT_PENALTY_CENTS if audit.score <  AUDIT_PENALTY_SCORE
            0                   otherwise
    input_set: "one FINALIZED-bound QualityAudit, its cleaner's current quality_score, and the audited turnover's incoming booking rating if present"
    constants:
      W_AUDIT: 0.60
      W_GUEST: 0.40
      GUEST_RATING_SCALE: 20
      CARRYOVER_WEIGHT: 0.70
      OBSERVED_WEIGHT: 0.30
      AUDIT_BONUS_SCORE: 95
      AUDIT_BONUS_CENTS: 1000
      AUDIT_PENALTY_SCORE: 70
      AUDIT_PENALTY_CENTS: 1200
    precision: "2 decimal places, round_half_up, on both observed_score and resulting_quality_score"
    variants:
      - name: BLENDED
        when: "the audited turnover's incoming booking already carries a cleanliness_rating at finalization"
        difference: "observed_score mixes the auditor score with the guest rating rescaled to 0-100"
      - name: AUDIT_ONLY
        when: "there is no incoming booking, or its review has not landed at finalization"
        difference: "observed_score is the auditor score alone, so identical audit data yields a different resulting_quality_score"

  - name: checklist_generation
    trigger: "POST /turnovers/{id}/start"
    algorithm: projection
    formula: |
      for each CHECKLIST_TEMPLATE row whose applies_to_size_tiers contains property.size_tier,
      in ascending sequence_no order, append a ChecklistTask with:
          task_code, category, sequence_no, requires_photo   <- copied from the template row
          status                                             <- PENDING
      turnover.checklist_task_count = number of rows appended
    input_set: "the CHECKLIST_TEMPLATE constant table filtered by the property's size_tier"
    constants:
      CHECKLIST_TEMPLATE:
        - { task_code: STRIP_LINENS,         category: CLEANING, sequence_no: 10, requires_photo: false, applies_to_size_tiers: [STUDIO, ONE_BR, TWO_BR, THREE_BR_PLUS] }
        - { task_code: BATHROOM_DEEP_CLEAN,  category: CLEANING, sequence_no: 20, requires_photo: true,  applies_to_size_tiers: [STUDIO, ONE_BR, TWO_BR, THREE_BR_PLUS] }
        - { task_code: BED_STAGING,          category: STAGING,  sequence_no: 30, requires_photo: true,  applies_to_size_tiers: [STUDIO, ONE_BR, TWO_BR, THREE_BR_PLUS] }
        - { task_code: SUPPLY_RESTOCK,       category: RESTOCK,  sequence_no: 40, requires_photo: true,  applies_to_size_tiers: [STUDIO, ONE_BR, TWO_BR, THREE_BR_PLUS] }
        - { task_code: PATIO_STAGING,        category: STAGING,  sequence_no: 50, requires_photo: true,  applies_to_size_tiers: [THREE_BR_PLUS] }
    precision: "exact template copy; STUDIO, ONE_BR and TWO_BR yield 4 tasks, THREE_BR_PLUS yields 5"

  - name: supply_on_hand_projection
    trigger: "every StockMovement append: POST /properties/{id}/supply-lines (SEED), POST /supply-lines/{id}/replenish (REPLENISH), checklist review APPROVE (RESTOCK_USE) and WAIVE of a VERIFIED restock (REVERSAL)"
    algorithm: aggregation
    formula: |
      supply_line.on_hand_qty = SUM of delta_qty over StockMovements with this supply_line_id
      supply_line.below_par   = supply_line.on_hand_qty <= supply_line.reorder_point

      # The ledger is append-only: no movement is ever edited or deleted. A correction is always a
      # new compensating movement, so on_hand_qty is a pure projection of the event log and the
      # invariant on_hand_qty == SUM(delta_qty) holds after every request.
    input_set: "all StockMovement rows of the line, regardless of reason"
    constants:
      SEED_DEFAULT_QTY: 0
    precision: "whole units; on_hand_qty may never be driven below 0 because restock consumption is pre-checked against it"

  - name: cleaner_daily_load
    trigger: "POST /turnovers/{id}/assign and POST /assignments/{id}/accept"
    algorithm: chronological
    formula: |
      target_local_date = local_date(turnover.window_start_at,
                                     turnover_property.local_utc_offset_minutes)

      daily_load = COUNT of the cleaner's Assignments where
            status in {OFFERED, ACCEPTED, ACTIVE}
        AND local_date(that assignment's turnover.window_start_at,
                       that turnover's property.local_utc_offset_minutes) == target_local_date

      cap reached when daily_load >= cleaner.max_daily_turnovers

      # zone-conditional symmetric overlap buffer between two turnover windows
      buffer_minutes = SAME_ZONE_BUFFER_MINUTES
                       if turnover_a.property.zone_code == turnover_b.property.zone_code
                       else CROSS_ZONE_BUFFER_MINUTES
      overlaps = (a.window_start_at < b.window_end_at + buffer_minutes)
             AND (b.window_start_at < a.window_end_at + buffer_minutes)
      # strict <, so a gap of exactly buffer_minutes does NOT overlap
    input_set: "Assignments of the candidate cleaner in status OFFERED, ACCEPTED or ACTIVE; DECLINED, REVOKED and COMPLETED assignments are excluded from both the cap count and the overlap test"
    constants:
      SAME_ZONE_BUFFER_MINUTES: 15
      CROSS_ZONE_BUFFER_MINUTES: 45
    precision: "whole minutes; the buffer is decided by the two PROPERTIES' zone codes, not by the cleaner's home zone"

  - name: booking_occupancy_overlap
    trigger: "POST /bookings"
    algorithm: interval_merge
    formula: |
      # half-open occupancy interval [checkin_at, checkout_at); ZERO buffer, so a new stay may begin
      # at the exact instant a prior stay ends
      overlaps = (new.checkin_at < existing.checkout_at)
             AND (existing.checkin_at < new.checkout_at)
      # existing.checkout_at uses the CONTRACTED checkout_at, not late_checkout_until_at:
      # a granted late checkout never retroactively invalidates an already-booked stay
    input_set: "Bookings on the same property_id whose status is SCHEDULED or CHECKED_OUT; CANCELLED bookings never block"
    constants:
      OCCUPANCY_BUFFER_MINUTES: 0
    precision: "instant comparison with strict <; adjacency (new.checkin_at == existing.checkout_at) is permitted"

  - name: cleaner_payout_ledger
    trigger: "every PayLine create, variant switch, audit adjustment and void"
    algorithm: aggregation
    formula: |
      cleaner.pending_payout_cents = SUM of net_cents over the cleaner's PayLines
                                     whose status is in {PROVISIONAL, FINAL, ADJUSTED}
      # VOIDED pay lines are excluded but never deleted; the invariant is re-checked after every
      # request, so an accept-then-revoke pair returns the ledger to its pre-accept value exactly.
    input_set: "PayLines of the cleaner in status PROVISIONAL, FINAL or ADJUSTED"
    constants:
      MAX_REWORK_ROUNDS: 2
    precision: "whole cents; the ledger is recomputed from the PayLine set, never incremented blindly"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request shape: every required input field present, enum values in range, integers within declared bounds, datetimes parseable ISO-8601 UTC, qty and score within range, restock_entries well-formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: auth
    check: "a Cleaner reading GET /pay-lines must pass cleaner_id equal to its own X-User-ID, and a Cleaner reading GET /pay-lines/{id} may only address a pay line whose cleaner_id equals its own X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "GET /pay-lines, GET /pay-lines/{id}"

  - priority: 5
    category: existence
    check: "every path-templated resource exists, validated left to right"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_CLEANER_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_TURNOVER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CHECKLIST_TASK_NOT_FOUND | ERR_SUPPLY_LINE_NOT_FOUND | ERR_ISSUE_REPORT_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_QUALITY_AUDIT_NOT_FOUND | ERR_STOCK_MOVEMENT_NOT_FOUND | ERR_PAY_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "every id referenced in the request body exists: property_id, outgoing_booking_id, incoming_booking_id, cleaner_id, exclude_cleaner_ids[], turnover_id, restock_entries[].supply_line_id"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CLEANER_NOT_FOUND | ERR_TURNOVER_NOT_FOUND | ERR_SUPPLY_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /bookings, POST /turnovers, POST /turnovers/{id}/assign, POST /issue-reports, POST /quality-audits, POST /checklist-tasks/{id}/submit"

  - priority: 7
    category: business_referential
    check: "a PropertyOwner may only touch its own property: X-User-ID must equal the addressed property's id, or the mandatory property_id filter on a list read"
    error_id: ERR_NOT_PROPERTY_OWNER
    http_status: 403
    applies_to: "GET /properties/{id}, GET /properties/{id}/supply-lines, GET /supply-lines/{id}, GET /bookings, GET /bookings/{id}, GET /turnovers, GET /turnovers/{id}, GET /stock-movements, GET /stock-movements/{id}, GET /issue-reports, GET /issue-reports/{id}, GET /repair-orders, GET /repair-orders/{id}, GET /quality-audits, GET /quality-audits/{id}, POST /issue-reports/{id}/dispatch"

  - priority: 8
    category: business_referential
    check: "a Cleaner may only act on its own work: the addressed Assignment's cleaner_id, or the turnover's ACCEPTED/ACTIVE Assignment's cleaner_id, must equal the acting X-User-ID"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /assignments/{id}/accept, POST /assignments/{id}/decline, POST /turnovers/{id}/start, POST /turnovers/{id}/complete, POST /checklist-tasks/{id}/submit, POST /issue-reports"

  - priority: 9
    category: business_referential
    check: "the finalizing QualityAuditor must be the auditor who sampled the audit: audit.auditor_user_id equals the acting X-User-ID"
    error_id: ERR_NOT_AUDIT_OWNER
    http_status: 403
    applies_to: "POST /quality-audits/{id}/finalize"

  - priority: 10
    category: business_referential
    check: "cross-references must stay inside one property: incoming_booking.property_id == outgoing_booking.property_id, and every restock entry's supply line belongs to the turnover's property"
    error_id: ERR_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /turnovers, POST /checklist-tasks/{id}/submit"

  - priority: 11
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (optimistic concurrency, §1.2.1)"
    error_id: "ERR_STALE_TURNOVER_VERSION | ERR_STALE_SUPPLY_LINE_VERSION"
    http_status: 412
    applies_to: "POST /turnovers/{id}/assign, POST /supply-lines/{id}/replenish"

  - priority: 12
    category: state
    check: "the target resource is in a state that permits this operation"
    error_id: "ERR_INVALID_TURNOVER_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_TASK_STATE | ERR_INVALID_ISSUE_STATE | ERR_INVALID_REPAIR_STATE | ERR_INVALID_AUDIT_STATE | ERR_BOOKING_NOT_SCHEDULED | ERR_INVALID_CLEANER_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 13
    category: state
    check: "the gating sibling entity is in the required state: property ACTIVE for a new turnover, cleaner ACTIVE for an offer or acceptance, outgoing booking CHECKED_OUT before start, turnover COMPLETED before an audit is sampled"
    error_id: "ERR_PROPERTY_NOT_ACTIVE | ERR_CLEANER_NOT_ACTIVE | ERR_GUEST_NOT_CHECKED_OUT | ERR_TURNOVER_NOT_COMPLETED"
    http_status: 409
    applies_to: "POST /turnovers, POST /turnovers/{id}/assign, POST /assignments/{id}/accept, POST /turnovers/{id}/start, POST /quality-audits"

  - priority: 14
    category: business_safety
    check: "segregation of duties: the acting auditor's X-User-ID must not equal the turnover's Assignment.assigned_by_user_id nor any reviewed_by_user_id on that turnover's checklist tasks"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /quality-audits"

  - priority: 15
    category: business_safety
    check: "photo evidence: photo_uri must be present when the task's requires_photo is true"
    error_id: ERR_PHOTO_REQUIRED
    http_status: 422
    applies_to: "POST /checklist-tasks/{id}/submit"

  - priority: 16
    category: business_safety
    check: "a RESTOCK task submission must carry at least one restock entry"
    error_id: ERR_RESTOCK_ENTRIES_REQUIRED
    http_status: 422
    applies_to: "POST /checklist-tasks/{id}/submit"

  - priority: 17
    category: business_safety
    check: "a non-RESTOCK task submission must not carry restock entries"
    error_id: ERR_RESTOCK_ENTRIES_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /checklist-tasks/{id}/submit"

  - priority: 18
    category: business_safety
    check: "completion requires every ChecklistTask of the turnover to be VERIFIED or WAIVED"
    error_id: ERR_UNVERIFIED_TASKS_REMAIN
    http_status: 409
    applies_to: "POST /turnovers/{id}/complete"

  - priority: 19
    category: business_temporal
    check: "interval ordering: booking checkout_at > checkin_at; LATE_CHECKOUT new_time_at > checkout_at; EARLY_CHECKIN new_time_at < checkin_at and >= the turnover's window_start_at; incoming.checkin_at >= outgoing.checkout_at; a guest review requires the logical clock at or after the booking's checkin_at"
    error_id: ERR_INVALID_TIME_INTERVAL
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/schedule-change, POST /bookings/{id}/guest-review, POST /turnovers"

  - priority: 20
    category: business_temporal
    check: "a granted late checkout may not exceed checkout_at + MAX_LATE_CHECKOUT_MINUTES (240)"
    error_id: ERR_SCHEDULE_CHANGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /bookings/{id}/schedule-change"

  - priority: 21
    category: business_temporal
    check: "the new stay's half-open occupancy interval must not overlap another SCHEDULED or CHECKED_OUT stay on the same property (adjacency permitted)"
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 22
    category: business_temporal
    check: "the derived cleaning window must be strictly positive at creation and at schedule change"
    error_id: ERR_CLEANING_WINDOW_NON_POSITIVE
    http_status: 422
    applies_to: "POST /turnovers, POST /bookings/{id}/schedule-change"

  - priority: 23
    category: business_temporal
    check: "at creation, window_minutes must be >= required_minutes unless override_reason is supplied"
    error_id: ERR_WINDOW_OVERRIDE_REQUIRED
    http_status: 422
    applies_to: "POST /turnovers"

  - priority: 24
    category: business_temporal
    check: "a schedule change that would compress an existing turnover's window below required_minutes is refused unless override_reason is supplied"
    error_id: ERR_SCHEDULE_CHANGE_BLOCKS_TURN
    http_status: 409
    applies_to: "POST /bookings/{id}/schedule-change"

  - priority: 25
    category: business_temporal
    check: "the candidate cleaner's existing non-terminal assignment windows must not overlap this turnover's window under the zone-conditional buffer"
    error_id: ERR_CLEANER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /turnovers/{id}/assign, POST /assignments/{id}/accept"

  - priority: 26
    category: business_temporal
    check: "the logical clock must be at or after turnover.window_start_at to start the clean"
    error_id: ERR_TOO_EARLY_TO_START
    http_status: 409
    applies_to: "POST /turnovers/{id}/start"

  - priority: 27
    category: business_temporal
    check: "an audit may only be sampled within AUDIT_WINDOW_HOURS (72) of the turnover's finished_at"
    error_id: ERR_AUDIT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /quality-audits"

  - priority: 28
    category: business_constraint
    check: "uniqueness: Property.code globally; (property_id, sku) on SupplyLine; (property_id, external_ref) on Booking"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /properties, POST /properties/{id}/supply-lines, POST /bookings"

  - priority: 29
    category: business_constraint
    check: "an outgoing booking may carry at most one Turnover that is not VOID"
    error_id: ERR_TURNOVER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /turnovers"

  - priority: 30
    category: business_constraint
    check: "a turnover may carry at most one QualityAudit that is not VOIDED"
    error_id: ERR_AUDIT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /quality-audits"

  - priority: 31
    category: business_constraint
    check: "a booking accepts exactly one guest cleanliness review"
    error_id: ERR_GUEST_REVIEW_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /bookings/{id}/guest-review"

  - priority: 32
    category: business_constraint
    check: "an EXPLICITLY named cleaner must serve the property's zone (home, secondary, or accepts_cross_zone) and have skill_level >= property.min_skill_level"
    error_id: ERR_CLEANER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /turnovers/{id}/assign"

  - priority: 33
    category: business_constraint
    check: "the cleaner's non-terminal assignment count on the turnover's property-local date must be below max_daily_turnovers"
    error_id: ERR_CLEANER_DAILY_CAP_REACHED
    http_status: 409
    applies_to: "POST /turnovers/{id}/assign, POST /assignments/{id}/accept"

  - priority: 34
    category: business_constraint
    check: "in SELECTOR mode the filtered candidate pool must be non-empty"
    error_id: ERR_NO_ELIGIBLE_CLEANER
    http_status: 422
    applies_to: "POST /turnovers/{id}/assign"

  - priority: 35
    category: business_fiscal
    check: "every restock entry's qty_used must be <= the supply line's on_hand_qty, and a replenishment qty must be >= 1"
    error_id: ERR_INSUFFICIENT_ON_HAND
    http_status: 409
    applies_to: "POST /checklist-tasks/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- Property ----------------
  - method: POST
    path: "/properties"
    description: "Register a rental unit. `status` may be supplied to create a PAUSED or OFFBOARDED unit directly."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, zone_code, size_tier, owner_contact_email, "bedroom_count?", "bathroom_count?", "bed_count?", "local_utc_offset_minutes?", "min_clean_minutes?", "min_skill_level?", "owner_notify_min_cost_cents?", "status?"]
    output: Property
    side_effects: ["open_issue_count initialised to 0", "last_turnover_completed_at initialised to null"]

  - method: GET
    path: "/properties/{id}"
    description: "Read one property. A PropertyOwner may only read the property whose id equals its own X-User-ID."
    roles: [PlatformAdmin, Coordinator, QualityAuditor, PropertyOwner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/properties/{id}/supply-lines"
    description: "Add a par-level stock line to a property. `initial_on_hand_qty` appends a SEED StockMovement."
    roles: [PlatformAdmin, Coordinator]
    code: 201
    input: [sku, name, category, unit_cost_cents, par_qty, "unit?", "reorder_point?", "initial_on_hand_qty?", "status?"]
    output: SupplyLine
    side_effects: ["appends one StockMovement with reason SEED, sequence_no 1 and delta_qty = initial_on_hand_qty (default 0)", "recomputes on_hand_qty and below_par"]

  - method: GET
    path: "/properties/{id}/supply-lines"
    description: "List a property's stock lines, ordered by sku ascending. Reverse lookup for SupplyLine.property_id."
    roles: [PlatformAdmin, Coordinator, Cleaner, PropertyOwner]
    code: 200
    input: ["category?", "below_par?", "status?", "limit?", "offset?"]
    output: SupplyLine[]
    side_effects: []

  - method: GET
    path: "/supply-lines/{id}"
    description: "Read one stock line, including the current on_hand_qty projection and the version needed for replenishment."
    roles: [PlatformAdmin, Coordinator, Cleaner, PropertyOwner]
    code: 200
    input: []
    output: SupplyLine
    side_effects: []

  - method: POST
    path: "/supply-lines/{id}/replenish"
    description: "Record received stock. Guarded by optimistic concurrency on the supply line's version (§1.2.1 replenish-stale-supply-line)."
    roles: [PlatformAdmin, Coordinator]
    code: 200
    input: [qty, expected_supply_line_version, "note?"]
    output: SupplyLine
    side_effects: ["appends one StockMovement with reason REPLENISH and delta_qty = qty", "recomputes on_hand_qty and below_par", "increments SupplyLine.version by 1"]

  - method: GET
    path: "/stock-movements"
    description: "List stock ledger entries, ordered by created_at ascending then sequence_no ascending. Reverse lookup for StockMovement.supply_line_id, .turnover_id and .checklist_task_id."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: ["supply_line_id?", "turnover_id?", "checklist_task_id?", "reason?", "limit?", "offset?"]
    output: StockMovement[]
    side_effects: []

  - method: GET
    path: "/stock-movements/{id}"
    description: "Read one stock ledger entry. Append-only evidence row: it carries id and created_at but no updated_at and no version, and no endpoint may edit or delete it."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: []
    output: StockMovement
    side_effects: []

  # ---------------- Cleaner ----------------
  - method: POST
    path: "/cleaners"
    description: "Onboard a cleaner. `initial_quality_score` seeds the computed quality_score field (default 80.00)."
    roles: [PlatformAdmin]
    code: 201
    input: [name, home_zone_code, skill_level, "secondary_zone_codes?", "accepts_cross_zone?", "max_daily_turnovers?", "initial_quality_score?", "status?"]
    output: Cleaner
    side_effects: ["quality_score seeded from initial_quality_score", "pending_payout_cents, completed_turnover_count, decline_count and strike_count initialised to 0"]

  - method: GET
    path: "/cleaners/{id}"
    description: "Read one cleaner, including quality_score and the pending_payout_cents ledger."
    roles: [PlatformAdmin, Coordinator, QualityAuditor]
    code: 200
    input: []
    output: Cleaner
    side_effects: []

  - method: POST
    path: "/cleaners/{id}/status"
    description: "Suspend, reactivate or offboard a cleaner."
    roles: [PlatformAdmin]
    code: 200
    input: [action, "reason?"]
    output: Cleaner
    side_effects: ["SUSPEND and OFFBOARD revoke every OFFERED or ACCEPTED Assignment", "SCHEDULED turnovers of those assignments return to PENDING_ASSIGNMENT", "PROVISIONAL PayLines become VOIDED and pending_payout_cents is debited"]

  - method: GET
    path: "/pay-lines"
    description: "List pay lines, ordered by created_at ascending. Reverse lookup for PayLine.assignment_id, .cleaner_id and .turnover_id. A Cleaner must pass its own id as cleaner_id."
    roles: [PlatformAdmin, Coordinator, Cleaner]
    code: 200
    input: ["assignment_id?", "cleaner_id?", "turnover_id?", "status?", "limit?", "offset?"]
    output: PayLine[]
    side_effects: []

  - method: GET
    path: "/pay-lines/{id}"
    description: "Read one settled or provisional pay line. A Cleaner may only read a pay line whose cleaner_id equals its own X-User-ID."
    roles: [PlatformAdmin, Coordinator, Cleaner]
    code: 200
    input: []
    output: PayLine
    side_effects: []

  # ---------------- Booking ----------------
  - method: POST
    path: "/bookings"
    description: "Import a reservation from the booking calendar."
    roles: [Coordinator]
    code: 201
    input: [property_id, external_ref, guest_name, checkin_at, checkout_at, "party_size?", "pet_stay?"]
    output: Booking
    side_effects: ["status SCHEDULED, checkin_gate OPEN, guest_notice_code NONE", "rejected when the half-open occupancy interval overlaps another SCHEDULED or CHECKED_OUT stay on the property"]

  - method: GET
    path: "/bookings"
    description: "List reservations, ordered by checkin_at ascending then created_at ascending. Reverse lookup for Booking.property_id. A PropertyOwner must pass its own id as property_id."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: ["property_id?", "status?", "checkin_gate?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Read one reservation, including both parallel state dimensions and the guest notice code."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{id}/schedule-change"
    description: "Grant a late checkout or an early check-in and propagate the new boundary into the affected turnover's window."
    roles: [Coordinator]
    code: 200
    input: [change_type, new_time_at, "override_reason?"]
    output: Booking
    side_effects: ["LATE_CHECKOUT sets late_checkout_until_at and guest_notice_code LATE_CHECKOUT_GRANTED", "EARLY_CHECKIN sets early_checkin_at and, when override_reason was required, guest_notice_code EARLY_CHECKIN_LIMITED", "recomputes the affected non-terminal Turnover's window and increments its version by 1", "refuses with ERR_SCHEDULE_CHANGE_BLOCKS_TURN when the compressed window falls below required_minutes and no override_reason was supplied"]

  - method: POST
    path: "/bookings/{id}/checkout"
    description: "Record the departing guest's actual checkout. Defaults to the logical clock."
    roles: [Coordinator]
    code: 200
    input: ["actual_checkout_at?"]
    output: Booking
    side_effects: ["status becomes CHECKED_OUT", "recomputes the outgoing turnover's window WITHOUT rejecting: window_minutes is clamped at 0", "raises escalation_required when the window no longer covers required_minutes", "blocks the incoming booking's checkin_gate and sets guest_notice_code CHECKIN_DELAYED when the window collapses to 0"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a scheduled stay. Cascades differently depending on whether the booking is the outgoing or the incoming side of a turnover."
    roles: [Coordinator]
    code: 200
    input: ["cancellation_reason?"]
    output: Booking
    side_effects: ["outgoing side: the non-terminal Turnover becomes VOID, its Assignments REVOKED, its PROVISIONAL PayLines VOIDED with the payout ledger debited, and its SAMPLED QualityAudits VOIDED", "incoming side: the Turnover clears incoming_booking_id and recomputes as a VACANT_GAP window, keeping its status"]

  - method: POST
    path: "/bookings/{id}/guest-review"
    description: "Record the guest's cleanliness rating (1-5). Permitted once the logical clock reaches the booking's checkin_at, whether or not the stay has ended."
    roles: [Coordinator]
    code: 200
    input: [cleanliness_rating]
    output: Booking
    side_effects: ["cleanliness_rating and cleanliness_rated_at recorded", "a rating arriving after an audit was FINALIZED never re-scores that audit"]

  # ---------------- Turnover ----------------
  - method: POST
    path: "/turnovers"
    description: "Open a turnover between a departing and an arriving stay. Omit incoming_booking_id for a vacant gap."
    roles: [Coordinator]
    code: 201
    input: [outgoing_booking_id, "incoming_booking_id?", "override_reason?"]
    output: Turnover
    side_effects: ["derives window_start_at, window_end_at, window_minutes, required_minutes, slack_minutes, turn_type and is_tight per calculations.turnover_window_and_requirement", "status PENDING_ASSIGNMENT, version 1", "sets escalation_required when slack_minutes is negative under an override_reason"]

  - method: GET
    path: "/turnovers"
    description: "List turnovers, ordered by window_start_at ascending then created_at ascending. Reverse lookup for Turnover.property_id, .outgoing_booking_id, .incoming_booking_id and .blocking_repair_order_id. A PropertyOwner must pass its own id as property_id."
    roles: [PlatformAdmin, Coordinator, QualityAuditor, PropertyOwner]
    code: 200
    input: ["property_id?", "outgoing_booking_id?", "incoming_booking_id?", "blocking_repair_order_id?", "status?", "turn_type?", "limit?", "offset?"]
    output: Turnover[]
    side_effects: []

  - method: GET
    path: "/turnovers/{id}"
    description: "Read one turnover, including the derived window, the compound status and the current version for optimistic concurrency."
    roles: [PlatformAdmin, Coordinator, Cleaner, QualityAuditor, PropertyOwner]
    code: 200
    input: []
    output: Turnover
    side_effects: []

  - method: GET
    path: "/turnovers/{id}/checklist-tasks"
    description: "List the turnover's checklist tasks, ordered by sequence_no ascending. Reverse lookup for ChecklistTask.turnover_id."
    roles: [PlatformAdmin, Coordinator, Cleaner, QualityAuditor]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: ChecklistTask[]
    side_effects: []

  - method: GET
    path: "/turnovers/{id}/pay-preview"
    description: "Computed read: the pay breakdown the turnover would settle at right now, as an unpersisted PayLine projection whose id and status are null. Returns the PROVISIONAL variant while the turnover has not reached COMPLETED and the FINAL variant once it has."
    roles: [PlatformAdmin, Coordinator, Cleaner]
    code: 200
    input: []
    output: PayLine
    side_effects: []

  - method: POST
    path: "/turnovers/{id}/assign"
    description: "Offer the turnover to a cleaner. Omit cleaner_id to let the weighted selector rank the eligible pool. Guarded by optimistic concurrency on the turnover's version (§1.2.1 assign-stale-turnover)."
    roles: [Coordinator]
    code: 201
    input: [expected_turnover_version, "cleaner_id?", "exclude_cleaner_ids?"]
    output: Assignment
    side_effects: ["computes match_score, zone_match_factor and selection_mode per calculations.cleaner_match_score", "revokes the turnover's outstanding OFFERED Assignment (supersede)", "records assigned_by_user_id from the acting X-User-ID", "increments Turnover.version by 1"]

  - method: POST
    path: "/turnovers/{id}/start"
    description: "Begin the clean. Generates the checklist from the size-tier template."
    roles: [Cleaner]
    code: 200
    input: []
    output: Turnover
    side_effects: ["the ACCEPTED Assignment becomes ACTIVE", "status becomes IN_PROGRESS and started_at is set to the logical clock", "generates ChecklistTask rows per calculations.checklist_generation and sets checklist_task_count", "increments Turnover.version by 1"]

  - method: POST
    path: "/turnovers/{id}/complete"
    description: "Close out the clean once every checklist task is verified or waived."
    roles: [Cleaner, Coordinator]
    code: 200
    input: ["completion_note?"]
    output: Turnover
    side_effects: ["status becomes COMPLETED, finished_at and late_minutes are set", "the ACTIVE Assignment becomes COMPLETED and completed_turnover_count increases", "the PayLine recomputes under the FINAL variant, status FINAL, and the payout ledger moves by the delta", "restock_chargeback_cents is set per calculations.restock_chargeback", "property.last_turnover_completed_at is set", "increments Turnover.version by 1"]

  # ---------------- Assignment ----------------
  - method: GET
    path: "/assignments"
    description: "List offers, ordered by created_at ascending then sequence_no ascending. Reverse lookup for Assignment.turnover_id and .cleaner_id."
    roles: [PlatformAdmin, Coordinator, Cleaner]
    code: 200
    input: ["turnover_id?", "cleaner_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/assignments/{id}"
    description: "Read one offer, including the recorded match_score and assigned_by_user_id."
    roles: [PlatformAdmin, Coordinator, Cleaner]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Accept an offer. Creates the PROVISIONAL pay line and schedules the turnover."
    roles: [Cleaner]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status becomes ACCEPTED and accepted_at is set", "the Turnover becomes SCHEDULED and its version increments by 1", "a PayLine is created in status PROVISIONAL under the PROVISIONAL variant", "cleaner.pending_payout_cents increases by that net_cents"]

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Decline an offer. The turnover stays available for a fresh offer."
    roles: [Cleaner]
    code: 200
    input: ["decline_reason?"]
    output: Assignment
    side_effects: ["status becomes DECLINED and declined_at is set", "cleaner.decline_count increases by 1", "the Turnover's status and version are unchanged"]

  # ---------------- ChecklistTask ----------------
  - method: POST
    path: "/checklist-tasks/{id}/submit"
    description: "Submit a checklist task with photo evidence and, for the restock task, the consumed supply quantities."
    roles: [Cleaner]
    code: 200
    input: ["photo_uri?", "note?", "restock_entries?"]
    output: ChecklistTask
    side_effects: ["status becomes SUBMITTED, submitted_at and restock_line_count recorded", "re-derives the parent Turnover status by the ordered child rule", "no stock moves yet - consumption is booked at APPROVE"]

  - method: POST
    path: "/checklist-tasks/{id}/review"
    description: "Approve, reject or waive a checklist task. WAIVE of an already VERIFIED restock task reverses its stock movements."
    roles: [Coordinator]
    code: 200
    input: [action, "reject_reason?"]
    output: ChecklistTask
    side_effects: ["APPROVE on a RESTOCK task appends one RESTOCK_USE StockMovement per submitted entry in the order supplied, recomputes each line's on_hand_qty and below_par and increments each line's version, and sets restock_charge_cents per calculations.restock_chargeback", "REJECT increments reject_count and the turnover's rejected_review_count and rework_round, drives the turnover to REWORK_REQUIRED, and re-derives the PROVISIONAL PayLine's photo penalty, bonus and net with the payout ledger following", "WAIVE of a VERIFIED restock task appends the negating REVERSAL StockMovements and returns restock_charge_cents to 0", "records reviewed_by_user_id from the acting X-User-ID", "re-derives the parent Turnover status"]

  # ---------------- IssueReport / RepairOrder ----------------
  - method: POST
    path: "/issue-reports"
    description: "File a damage or maintenance finding from the cleaning team."
    roles: [Cleaner, Coordinator]
    code: 201
    input: [turnover_id, issue_type, severity, description, estimated_cost_cents, "guest_chargeable?"]
    output: IssueReport
    side_effects: ["created directly in OWNER_NOTIFIED with owner_notified_at set when severity is HIGH or CRITICAL or estimated_cost_cents >= property.owner_notify_min_cost_cents, otherwise REPORTED", "property.open_issue_count increases by 1", "reported_by_cleaner_id records the acting Cleaner's X-User-ID, or null for a Coordinator"]

  - method: GET
    path: "/issue-reports"
    description: "List findings, ordered by created_at ascending. Reverse lookup for IssueReport.turnover_id, .property_id and .reported_by_cleaner_id. A PropertyOwner must pass its own id as property_id."
    roles: [PlatformAdmin, Coordinator, Cleaner, PropertyOwner]
    code: 200
    input: ["turnover_id?", "property_id?", "reported_by_cleaner_id?", "status?", "severity?", "limit?", "offset?"]
    output: IssueReport[]
    side_effects: []

  - method: GET
    path: "/issue-reports/{id}"
    description: "Read one finding."
    roles: [PlatformAdmin, Coordinator, Cleaner, PropertyOwner]
    code: 200
    input: []
    output: IssueReport
    side_effects: []

  - method: POST
    path: "/issue-reports/{id}/dispatch"
    description: "Dispatch a repair vendor. Set blocks_checkin to put the turnover on hold and block the incoming guest's arrival."
    roles: [Coordinator, PropertyOwner]
    code: 201
    input: [vendor_name, scheduled_at, "blocks_checkin?"]
    output: RepairOrder
    side_effects: ["the IssueReport becomes DISPATCHED", "with blocks_checkin true and a non-terminal turnover: the turnover stores pre_hold_status, becomes ON_HOLD, records blocking_repair_order_id and increments version by 1, and the incoming booking's checkin_gate becomes BLOCKED with guest_notice_code CHECKIN_DELAYED", "with blocks_checkin true but a COMPLETED or VOID turnover: no hold and no gate change"]

  - method: GET
    path: "/repair-orders"
    description: "List repair orders, ordered by created_at ascending. Reverse lookup for RepairOrder.issue_report_id and .property_id."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: ["issue_report_id?", "property_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  - method: GET
    path: "/repair-orders/{id}"
    description: "Read one repair order. A PropertyOwner may only read an order on its own property."
    roles: [PlatformAdmin, Coordinator, PropertyOwner]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/complete"
    description: "Close a repair. Releases any hold the repair placed on a turnover and its guest arrival."
    roles: [Coordinator]
    code: 200
    input: ["actual_cost_cents?", "completion_note?"]
    output: RepairOrder
    side_effects: ["status becomes COMPLETED and completed_at is set", "the IssueReport becomes RESOLVED and property.open_issue_count decreases by 1", "a turnover holding this order restores pre_hold_status, clears blocking_repair_order_id and increments version by 1", "the incoming booking's checkin_gate becomes RELEASED and guest_notice_code returns to NONE"]

  # ---------------- QualityAudit ----------------
  - method: POST
    path: "/quality-audits"
    description: "Sample a completed turnover for quality audit. Refused when the acting auditor also assigned the cleaner or reviewed any checklist task on that turnover."
    roles: [QualityAuditor]
    code: 201
    input: [turnover_id, score, "findings?"]
    output: QualityAudit
    side_effects: ["status SAMPLED, auditor_user_id recorded from the acting X-User-ID, cleaner_id copied from the turnover's COMPLETED Assignment", "no quality_score or pay movement occurs until finalization"]

  - method: GET
    path: "/quality-audits"
    description: "List audits, ordered by created_at ascending. Reverse lookup for QualityAudit.turnover_id and .cleaner_id."
    roles: [PlatformAdmin, Coordinator, QualityAuditor, PropertyOwner]
    code: 200
    input: ["turnover_id?", "cleaner_id?", "status?", "limit?", "offset?"]
    output: QualityAudit[]
    side_effects: []

  - method: GET
    path: "/quality-audits/{id}"
    description: "Read one quality audit. A PropertyOwner may only read an audit on its own property's turnover."
    roles: [PlatformAdmin, Coordinator, QualityAuditor, PropertyOwner]
    code: 200
    input: []
    output: QualityAudit
    side_effects: []

  - method: POST
    path: "/quality-audits/{id}/finalize"
    description: "Finalize the audit, folding it into the cleaner's rolling quality score and, outside the neutral band, into the settled pay line."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: QualityAudit
    side_effects: ["chooses variant_applied from whether the incoming booking already carries a cleanliness_rating", "computes guest_rating_at_audit, observed_score and resulting_quality_score and replaces cleaner.quality_score", "with a non-zero pay_adjustment_cents: the FINAL PayLine folds it into audit_adjustment_cents, re-derives net_cents, becomes ADJUSTED, and the payout ledger moves by the same delta", "finalized_at is set to the logical clock"]

  # ---------------- test-driving ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, buffer, lateness and audit-window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["no entity is mutated; subsequent requests observe the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or a Cleaner reads GET /pay-lines without passing its own cleaner_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, out-of-range integer, unparseable datetime, malformed restock entry"
  # --- existence ---
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "the addressed or referenced property id does not exist"
  - id: ERR_CLEANER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced cleaner id does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "the addressed or referenced booking id does not exist"
  - id: ERR_TURNOVER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced turnover id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the addressed assignment id does not exist"
  - id: ERR_CHECKLIST_TASK_NOT_FOUND
    http: 404
    condition: "the addressed checklist task id does not exist"
  - id: ERR_SUPPLY_LINE_NOT_FOUND
    http: 404
    condition: "the addressed or referenced supply line id does not exist"
  - id: ERR_ISSUE_REPORT_NOT_FOUND
    http: 404
    condition: "the addressed issue report id does not exist"
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "the addressed repair order id does not exist"
  - id: ERR_QUALITY_AUDIT_NOT_FOUND
    http: 404
    condition: "the addressed quality audit id does not exist"
  - id: ERR_STOCK_MOVEMENT_NOT_FOUND
    http: 404
    condition: "the addressed stock movement id does not exist"
  - id: ERR_PAY_LINE_NOT_FOUND
    http: 404
    condition: "the addressed pay line id does not exist"
  # --- ownership / segregation ---
  - id: ERR_NOT_PROPERTY_OWNER
    http: 403
    condition: "a PropertyOwner addresses a resource outside its own property, or omits the mandatory property_id filter on a list read"
  - id: ERR_NOT_ASSIGNMENT_OWNER
    http: 403
    condition: "a Cleaner acts on an assignment, turnover, checklist task or issue report that is not covered by its own non-terminal assignment"
  - id: ERR_NOT_AUDIT_OWNER
    http: 403
    condition: "a QualityAuditor finalizes an audit sampled under a different auditor_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting auditor's X-User-ID also assigned the turnover's cleaner or reviewed one of its checklist tasks"
  # --- referential ---
  - id: ERR_PROPERTY_MISMATCH
    http: 422
    condition: "the incoming and outgoing bookings belong to different properties, or a restock entry's supply line belongs to another property"
  # --- optimistic concurrency ---
  - id: ERR_STALE_TURNOVER_VERSION
    http: 412
    condition: "expected_turnover_version does not equal the turnover's current version"
  - id: ERR_STALE_SUPPLY_LINE_VERSION
    http: 412
    condition: "expected_supply_line_version does not equal the supply line's current version"
  # --- target state ---
  - id: ERR_INVALID_TURNOVER_STATE
    http: 409
    condition: "the turnover's status does not permit this operation (assigning a non-PENDING_ASSIGNMENT turnover, starting a turnover that is not SCHEDULED, completing one that is not AWAITING_VERIFICATION, touching a COMPLETED or VOID turnover)"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "the assignment is not OFFERED when accepted or declined, or not ACCEPTED when the clean is started"
  - id: ERR_INVALID_TASK_STATE
    http: 409
    condition: "the checklist task cannot make the requested transition: submitting a VERIFIED or WAIVED task, or approving or rejecting a task that is not SUBMITTED"
  - id: ERR_INVALID_ISSUE_STATE
    http: 409
    condition: "the issue report is already DISPATCHED or RESOLVED when dispatch is requested"
  - id: ERR_INVALID_REPAIR_STATE
    http: 409
    condition: "the repair order is already COMPLETED"
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "the audit is already FINALIZED or VOIDED when finalization is requested"
  - id: ERR_BOOKING_NOT_SCHEDULED
    http: 409
    condition: "the booking is not SCHEDULED, so it cannot be checked out, cancelled or schedule-changed"
  - id: ERR_INVALID_CLEANER_STATE
    http: 409
    condition: "the requested status action does not apply from the cleaner's current status, or OFFBOARD is requested while the cleaner has an ACTIVE assignment"
  # --- cross-entity state gates ---
  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    condition: "the property is PAUSED or OFFBOARDED, so no new turnover may be opened on it"
  - id: ERR_CLEANER_NOT_ACTIVE
    http: 409
    condition: "the named or accepting cleaner is SUSPENDED or OFFBOARDED"
  - id: ERR_GUEST_NOT_CHECKED_OUT
    http: 409
    condition: "the clean cannot start because the outgoing booking is still SCHEDULED"
  - id: ERR_TURNOVER_NOT_COMPLETED
    http: 409
    condition: "an audit may only be sampled on a COMPLETED turnover"
  # --- safety / verification ---
  - id: ERR_PHOTO_REQUIRED
    http: 422
    condition: "a task whose requires_photo is true was submitted without photo_uri"
  - id: ERR_RESTOCK_ENTRIES_REQUIRED
    http: 422
    condition: "a RESTOCK task was submitted with no restock entries"
  - id: ERR_RESTOCK_ENTRIES_NOT_ALLOWED
    http: 422
    condition: "restock entries were supplied on a CLEANING or STAGING task"
  - id: ERR_UNVERIFIED_TASKS_REMAIN
    http: 409
    condition: "completion was requested while a checklist task is still PENDING, SUBMITTED or REJECTED"
  # --- temporal ---
  - id: ERR_INVALID_TIME_INTERVAL
    http: 422
    condition: "checkout_at is not after checkin_at, a late checkout is not after the contracted checkout, an early check-in is not before the contracted check-in or falls before the window start, the incoming check-in precedes the outgoing checkout, or a guest review arrives before the booking's checkin_at"
  - id: ERR_SCHEDULE_CHANGE_LIMIT_EXCEEDED
    http: 422
    condition: "the requested late checkout exceeds the contracted checkout by more than 240 minutes"
  - id: ERR_BOOKING_OVERLAP
    http: 409
    condition: "the new stay's half-open interval overlaps a SCHEDULED or CHECKED_OUT stay on the same property"
  - id: ERR_CLEANING_WINDOW_NON_POSITIVE
    http: 422
    condition: "the derived window_end_at is at or before window_start_at"
  - id: ERR_WINDOW_OVERRIDE_REQUIRED
    http: 422
    condition: "window_minutes is below required_minutes at creation and no override_reason was supplied"
  - id: ERR_SCHEDULE_CHANGE_BLOCKS_TURN
    http: 409
    condition: "the schedule change would compress an existing turnover's window below required_minutes and no override_reason was supplied"
  - id: ERR_CLEANER_SCHEDULE_CONFLICT
    http: 409
    condition: "the candidate cleaner already holds a non-terminal assignment whose window overlaps this one under the zone-conditional buffer"
  - id: ERR_TOO_EARLY_TO_START
    http: 409
    condition: "the logical clock is before turnover.window_start_at"
  - id: ERR_AUDIT_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is more than 72 hours after the turnover's finished_at"
  # --- constraint ---
  - id: ERR_DUPLICATE_RESOURCE_KEY
    http: 409
    condition: "duplicate Property.code, duplicate (property_id, sku), or duplicate (property_id, external_ref)"
  - id: ERR_TURNOVER_ALREADY_EXISTS
    http: 409
    condition: "the outgoing booking already carries a Turnover that is not VOID"
  - id: ERR_AUDIT_ALREADY_EXISTS
    http: 409
    condition: "the turnover already carries a QualityAudit that is not VOIDED"
  - id: ERR_GUEST_REVIEW_ALREADY_SUBMITTED
    http: 409
    condition: "the booking already carries a cleanliness_rating"
  - id: ERR_CLEANER_NOT_ELIGIBLE
    http: 422
    condition: "the explicitly named cleaner does not serve the property's zone, or its skill_level is below the property's min_skill_level"
  - id: ERR_CLEANER_DAILY_CAP_REACHED
    http: 409
    condition: "the cleaner already holds max_daily_turnovers non-terminal assignments on the turnover's property-local date"
  - id: ERR_NO_ELIGIBLE_CLEANER
    http: 422
    condition: "selector mode found no cleaner satisfying every pool condition"
  # --- fiscal ---
  - id: ERR_INSUFFICIENT_ON_HAND
    http: 409
    condition: "a restock entry's qty_used exceeds the supply line's on_hand_qty"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "operator of the turnover service: onboards properties and cleaners, manages cleaner employment status and stock replenishment, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /properties"
      - "POST /cleaners"
      - "POST /cleaners/{id}/status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /properties/{id}"
      - "POST /properties/{id}/supply-lines"
      - "GET /properties/{id}/supply-lines"
      - "GET /supply-lines/{id}"
      - "POST /supply-lines/{id}/replenish"
      - "GET /stock-movements"
      - "GET /stock-movements/{id}"
      - "GET /cleaners/{id}"
      - "GET /pay-lines"
      - "GET /pay-lines/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}"
      - "GET /turnovers"
      - "GET /turnovers/{id}"
      - "GET /turnovers/{id}/checklist-tasks"
      - "GET /turnovers/{id}/pay-preview"
      - "GET /assignments"
      - "GET /assignments/{id}"
      - "GET /issue-reports"
      - "GET /issue-reports/{id}"
      - "GET /repair-orders"
      - "GET /repair-orders/{id}"
      - "GET /quality-audits"
      - "GET /quality-audits/{id}"

  - name: Coordinator
    description: "turnover desk: imports the booking calendar, opens turnovers, offers work to cleaners, reviews checklist evidence and dispatches repairs"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/schedule-change"
      - "POST /bookings/{id}/checkout"
      - "POST /bookings/{id}/cancel"
      - "POST /bookings/{id}/guest-review"
      - "POST /turnovers"
      - "POST /turnovers/{id}/assign"
      - "POST /checklist-tasks/{id}/review"
      - "POST /repair-orders/{id}/complete"
    shared_operations:
      - "GET /properties/{id}"
      - "POST /properties/{id}/supply-lines"
      - "GET /properties/{id}/supply-lines"
      - "GET /supply-lines/{id}"
      - "POST /supply-lines/{id}/replenish"
      - "GET /stock-movements"
      - "GET /stock-movements/{id}"
      - "GET /cleaners/{id}"
      - "GET /pay-lines"
      - "GET /pay-lines/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}"
      - "GET /turnovers"
      - "GET /turnovers/{id}"
      - "GET /turnovers/{id}/checklist-tasks"
      - "GET /turnovers/{id}/pay-preview"
      - "POST /turnovers/{id}/complete"
      - "GET /assignments"
      - "GET /assignments/{id}"
      - "POST /issue-reports"
      - "GET /issue-reports"
      - "GET /issue-reports/{id}"
      - "POST /issue-reports/{id}/dispatch"
      - "GET /repair-orders"
      - "GET /repair-orders/{id}"
      - "GET /quality-audits"
      - "GET /quality-audits/{id}"

  - name: Cleaner
    description: "the cleaning technician: accepts or declines offers, works the checklist with photo evidence, records restock consumption and reports damage"
    identity: "entity_backed:Cleaner"
    exclusive_operations:
      - "POST /assignments/{id}/accept"
      - "POST /assignments/{id}/decline"
      - "POST /turnovers/{id}/start"
      - "POST /checklist-tasks/{id}/submit"
    shared_operations:
      - "GET /properties/{id}/supply-lines"
      - "GET /supply-lines/{id}"
      - "GET /pay-lines"
      - "GET /pay-lines/{id}"
      - "GET /turnovers/{id}"
      - "GET /turnovers/{id}/checklist-tasks"
      - "GET /turnovers/{id}/pay-preview"
      - "POST /turnovers/{id}/complete"
      - "GET /assignments"
      - "GET /assignments/{id}"
      - "POST /issue-reports"
      - "GET /issue-reports"
      - "GET /issue-reports/{id}"

  - name: QualityAuditor
    description: "independent inspector: samples completed turnovers and finalizes the score that moves a cleaner's rolling quality and pay; barred from auditing work it coordinated"
    identity: "opaque"
    exclusive_operations:
      - "POST /quality-audits"
      - "POST /quality-audits/{id}/finalize"
    shared_operations:
      - "GET /properties/{id}"
      - "GET /cleaners/{id}"
      - "GET /turnovers"
      - "GET /turnovers/{id}"
      - "GET /turnovers/{id}/checklist-tasks"
      - "GET /quality-audits"
      - "GET /quality-audits/{id}"

  - name: PropertyOwner
    description: "the unit owner: read-only visibility into its own property's calendar, turnovers, stock ledger and audits, plus the authority to dispatch a repair vendor on its own issues"
    identity: "entity_backed:Property"
    exclusive_operations: []
    shared_operations:
      - "GET /properties/{id}"
      - "GET /properties/{id}/supply-lines"
      - "GET /supply-lines/{id}"
      - "GET /stock-movements"
      - "GET /stock-movements/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}"
      - "GET /turnovers"
      - "GET /turnovers/{id}"
      - "GET /issue-reports"
      - "GET /issue-reports/{id}"
      - "POST /issue-reports/{id}/dispatch"
      - "GET /repair-orders"
      - "GET /repair-orders/{id}"
      - "GET /quality-audits"
      - "GET /quality-audits/{id}"
