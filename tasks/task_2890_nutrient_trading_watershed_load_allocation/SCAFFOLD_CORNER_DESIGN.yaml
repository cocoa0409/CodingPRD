            - "Permit OH-0002 (Village WWTP on R_OUT, permittee user-permittee-2) reported 4000.00 for 2026 and is IN_COMPLIANCE with a gap of 0.00."
            - "CreditBatch A (project PP-A on R_UP, issued 520, available 520.00) is LISTED; its version was 1 at issue and 2 after listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
