  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_order_submit
        grounds:
          - validations[priority=9]
          - validations[priority=36]
          - errors[ERR_PROGRAM_NOT_ACTIVE]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Error-category pair: state (priority 9, ERR_PROGRAM_NOT_ACTIVE) vs business_fiscal
          (priority 36, ERR_CREDIT_HOLD). One request violates both — program B is only
          PENDING_APPROVAL and the account is on credit hold from program A's breach — and
          the state error must win.
        test_recipe:
          setup:
            - "account on credit hold: its program A (term 12, committed 12,000,000c, no orders) is driven to BREACHED via 12 close-periods"
            - "program B for the same account is PENDING_APPROVAL (submitted, never approved)"
            - "kit K1 exists; a DRAFT order references program B (create checks existence only)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Mu", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
