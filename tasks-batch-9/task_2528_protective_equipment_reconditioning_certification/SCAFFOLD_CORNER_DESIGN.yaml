      - name: priority_rush_turnaround_commits_inside_the_season_deadline
        claim_type: Correct Result
        grounds:
          - calculations.turnaround_commitment
          - calculations.turnaround_commitment.constants.TIER_BASE_DAYS
          - entities.IntakeShipment.fields.loaner_required
        distinguishing_aspect: |
          The unclamped arm of committed_due_at = min(raw_due_at,
          season_deadline): PRIORITY_RUSH gives raw_due_at = 2026-08-01 +
          (10 + ceil(1/25)) = 2026-08-12, which is earlier than the season
          deadline 2026-08-25 - 7 = 2026-08-18, so committed_due_at keeps the raw
          date and loaner_required is false. The 1.35 tier multiplier also lands
          in provisional_total_cents: round_half_up(8996 * 1.35) = 12145, which
          clears the tier-1 discount floor 10000, so discount 1518, net 10627,
          surcharge 213, total 10840.
        test_recipe:
          setup:
            - "one PRIORITY_RUSH shipment with counted_unit_count 1 and one registered unit"
          setup_api_calls:
            - *k_clock
            - *k_model
            - *k_acct
            - *k_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "PRIORITY_RUSH", declared_unit_count: 1, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
              as: IntakeClerk
              captures: { ship_id: $.data.id }
            - call: "POST /intake-shipments/${ship_id}/count"
              payload: { counted_unit_count: 1 }
              as: IntakeClerk
            - call: "POST /equipment-units"
              payload: { intake_shipment_id: "${ship_id}", serial_number: "SN-0001", declared_model_code: "SF-2026" }
              as: IntakeClerk
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /intake-shipments/${ship_id}/accept"
              payload: { discrepancy_resolution: "MATCHED" }
              as: IntakeClerk
          assert:
            - "HTTP 200"
            - "IntakeShipment.${ship_id}.status == ACCEPTED"
            - "IntakeShipment.${ship_id}.accepted_at == 2026-08-01T00:00:00Z"
            - "IntakeShipment.${ship_id}.raw_due_at == 2026-08-12T00:00:00Z"
            - "IntakeShipment.${ship_id}.committed_due_at == 2026-08-12T00:00:00Z"
            - "IntakeShipment.${ship_id}.loaner_required == false"
            - "IntakeShipment.${ship_id}.provisional_total_cents == 10840"
            - "IntakeShipment.${ship_id}.units_in_process == 1"

      - name: inspection_verdict_is_inclusive_at_the_replace_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.component_inspection_verdict
          - entities.ComponentInspection.fields.replace_threshold_applied
          - entities.ComponentInspection.fields.metric_direction_applied
        distinguishing_aspect: |
          A LOWER_IS_WORSE criterion (LINER: replace 4.00, fail 2.00) measured at
          exactly 4.00 is REPLACE, not PASS — both comparisons are inclusive at
          the threshold — and the row snapshots metric_direction_applied,
          replace_threshold_applied and fail_threshold_applied so a later
          ModelSpec edit cannot rewrite the verdict. The unit's rollup becomes
          REPLACE_REQUIRED (a non-SHELL REPLACE), not FAIL, so condemn_required
          stays false.
        test_recipe:
          setup:
            - "a ModelSpec requiring SHELL + LINER, LINER criteria LOWER_IS_WORSE replace 4.00 fail 2.00"
