            - "${rung_a} == ACCOUNT_SUSPENSION   # post_balance exactly 12.00 suspends because the comparison is >="
            - "Seller.${sa_id}.enforcement_state == SUSPENDED and Seller.${sa_id}.disbursement_state == FULL_HOLD"
            - "EnforcementAction.${ab2}.severity_points_applied == 3.99 and Seller.${sb_id}.severity_points_balance == 11.99"
            - "${rung_b} == LISTING_REMOVAL   # one cent short of the boundary"
