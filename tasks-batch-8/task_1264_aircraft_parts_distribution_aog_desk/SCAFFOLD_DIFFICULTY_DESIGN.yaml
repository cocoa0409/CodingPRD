            - { call: "POST /aog/quotes/${q_eq}/issue", payload: {}, as: AogDeskAgent, captures: { q_eq_v: $.data.version } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_un}", aircraft_tail: "N111UN", airport_code: "STL", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_un: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_un}", customer_id: "${cust_un}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 100000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q_un: $.data.id } }
            - { call: "POST /aog/quotes/${q_un}/issue", payload: {}, as: AogDeskAgent, captures: { q_un_v: $.data.version } }
          trigger:
