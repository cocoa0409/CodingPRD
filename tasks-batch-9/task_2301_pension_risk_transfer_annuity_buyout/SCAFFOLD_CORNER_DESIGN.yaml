          assert:
            - "all three Regulator reads return 200 with ${read_plan_state} == ONGOING, ${read_first_participant} == ${p1_id} and ${read_bp} == 9200"
            - "the Regulator's participant load returns 403 ERR_ROLE_NOT_PERMITTED and the participant list still has total_count == 1"
            - "the Regulator's settlement-amendment returns 403 ERR_ROLE_NOT_PERMITTED and plan_status stays ONGOING"
            - "the Regulator's insurer registration returns 201 with insurer_status == ACTIVE and available_capacity_cents == 500000000"
            - "the Regulator's rating action returns 200 with rating_grade == AA_MINUS (still on the floor at 78 points, so nothing cascades)"
            - "the PlanFiduciary's insurer registration returns 403 ERR_ROLE_NOT_PERMITTED — registry writes are Regulator-exclusive"

  - section: cross_cutting
    instances:
      - name: stale_expected_plan_version_refuses_a_valuation_update
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.valuation-update-stale-plan
          - errors.ERR_STALE_PLAN_VERSION
          - endpoints.POST_/prt/plans/{id}/valuation-updates
        distinguishing_aspect: |
          The whole point of the rule: a second writer holding the version it read
          before the first update must not silently overwrite the liability and asset
          figures. The stale attempt returns 412 and changes nothing, the same body
          replayed with the version the first update returned succeeds, and version
          advances by exactly one per accepted write.
        test_recipe:
          setup:
            - "one plan at clock 2026-08-01T00:00:00Z, liability 100000000, assets 92000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id, plan_v0: $.data.version, bp0: $.data.accounting_funded_status_bp }
          trigger:
            - call: "POST /prt/plans/${plan_id}/valuation-updates"
              payload: { expected_plan_version: "${plan_v0}", total_liability_cents: 100000000, plan_assets_cents: 95000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { plan_v1: $.data.version, bp1: $.data.accounting_funded_status_bp, assets1: $.data.plan_assets_cents }
            - call: "POST /prt/plans/${plan_id}/valuation-updates"
              payload: { expected_plan_version: "${plan_v0}", total_liability_cents: 100000000, plan_assets_cents: 80000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "GET /prt/plans/${plan_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { plan_v_after_refusal: $.data.version, assets_after_refusal: $.data.plan_assets_cents }
            - call: "POST /prt/plans/${plan_id}/valuation-updates"
              payload: { expected_plan_version: "${plan_v1}", total_liability_cents: 100000000, plan_assets_cents: 80000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_v2: $.data.version, bp2: $.data.accounting_funded_status_bp, assets2: $.data.plan_assets_cents }
          assert:
            - "${bp0} == 9200 at creation"
            - "the first update returns 200 with ${assets1} == 95000000 and ${bp1} == 9500"
            - "the second update, carrying the version read at creation, returns 412 ERR_STALE_PLAN_VERSION"
            - "the refusal wrote nothing: ${assets_after_refusal} == 95000000 and ${plan_v_after_refusal} == ${plan_v1}"
            - "replaying the identical body with ${plan_v1} returns 200 with ${assets2} == 80000000 and ${bp2} == 8000"
            - "version advanced by exactly one per accepted write: ${plan_v1} == ${plan_v0} + 1 and ${plan_v2} == ${plan_v1} + 1 — the 412 consumed no version"

      - name: stale_expected_participant_version_refuses_a_benefit_audit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.benefit-audit-create-stale-participant
          - errors.ERR_STALE_PARTICIPANT_VERSION
          - endpoints.POST_/prt/participants/{id}/benefit-audits
        distinguishing_aspect: |
          Opening an audit supersedes every prior audit of the participant, so the rule
          guards a create-with-supersede rather than an ordinary field update. The stale
          attempt must not supersede anything and must not create audit_sequence 1; a
          cleansing write on an unrelated state dimension (the address search) is what
          moves the version out from under the actuary.
        test_recipe:
          setup:
            - "one plan with one DEFERRED_VESTED participant whose stated benefit matches its recomputation exactly"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-1401", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id, p1_v0: $.data.version }
          trigger:
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "11 Kiln Lane", confirmed_postal_code: "14602" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v1: $.data.version, addr_state: $.data.address_status }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v0}" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "GET /prt/participants/${p1_id}/benefit-audits"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { audit_total_after_refusal: $.meta.total_count }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v1}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { audit1_id: $.data.id, audit1_seq: $.data.audit_sequence, audit1_state: $.data.audit_status, audit1_var: $.data.variance_cents }
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { p1_v2: $.data.version, p1_audit_dim: $.data.benefit_audit_status }
          assert:
            - "the address search returns 200 with ${addr_state} == CONFIRMED and ${p1_v1} == ${p1_v0} + 1"
            - "the audit carrying ${p1_v0} returns 412 ERR_STALE_PARTICIPANT_VERSION"
            - "${audit_total_after_refusal} == 0 — the refused create superseded nothing and produced no audit row"
            - "the audit carrying ${p1_v1} returns 201 with ${audit1_seq} == 1, ${audit1_var} == 0 (250000 * 320 * 150 / 120000 == 100000 == stated) and ${audit1_state} == PASSED"
            - "${p1_audit_dim} == AUDIT_OPEN and ${p1_v2} == ${p1_v1} + 1 — only the accepted create touched the participant"

      - name: stale_expected_tranche_version_refuses_a_second_asset_transfer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.asset-transfer-create-stale-tranche
          - errors.ERR_STALE_TRANCHE_VERSION
          - endpoints.POST_/prt/tranches/{id}/asset-transfers
        distinguishing_aspect: |
          A new transfer supersedes any INITIATED transfer on the tranche, so the stale
          guard is what stops a sponsor working from a pre-first-delivery view from
          silently discarding a composition it never saw. The refusal leaves the first
          transfer INITIATED; the retry with the fresh version supersedes it, and the
          list of transfers proves both the survivor and the superseded row.
