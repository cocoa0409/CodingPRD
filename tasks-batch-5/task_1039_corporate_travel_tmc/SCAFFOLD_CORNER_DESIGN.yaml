# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index) — corporate-travel-tmc
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Same seven-point
# per-instance contract as §1.8. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_trip_version_on_second_segment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-trip]
          - entities.TripRequest.fields.version
        distinguishing_aspect: |
          After the first segment advances TripRequest.version, a second segment create still carrying the
          pre-first-segment version is rejected 412 ERR_STALE_VERSION (both requests strictly sequential).
        test_recipe:
          setup:
            - "Trip auto-approved (market 50000); client reads the trip version once (tr_v). First segment booked (bumps version to tr_v+1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "c1@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-20T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
          trigger:
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 260000, depart_datetime: "2026-08-10T09:00:00Z", return_datetime: "2026-08-10T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_traveler_missing_required_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Traveler.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tmc/travelers without the required email field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A policy exists."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /tmc/travelers"
              payload: { full_name: "No Email", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: group_booking_nonexistent_vendor_returns_not_found
        claim_type: Not Found
        grounds: ["entities.GroupBooking.fields.vendor_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /tmc/group-bookings referencing a non-existent vendor_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A policy and an organizer traveler exist; vendor_id points to a random UUID."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "O Org", email: "c2@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { org: $.data.id }
          trigger:
            - call: "POST /tmc/group-bookings"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", organizer_traveler_id: "${org}", block_size: 3, start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-05T00:00:00Z" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_travelers_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.GET./tmc/travelers", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /tmc/travelers returns an array envelope with total_count and has_more; two created travelers yield total_count 2."
        test_recipe:
          setup: ["Policy plus two travelers."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "A", email: "c3a@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
            - call: "POST /tmc/travelers"
              payload: { full_name: "B", email: "c3b@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
          trigger:
            - call: "GET /tmc/travelers?policy_id=${pol}"
              payload: {}
              as: TravelManager
          assert:
            - "response envelope response_type == array; meta.api_request_id present; total_count == 2; has_more == false"

      - name: create_policy_response_envelope_object
        claim_type: Creation
        grounds: ["endpoints.POST./tmc/travel-policies", "response_envelope.success"]
        distinguishing_aspect: "POST /tmc/travel-policies returns 201 with response_type object, a server-minted UUID id (no type prefix), and created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
          assert:
            - "response_type == object; TravelPolicy.${pol}.version == 1; created_at present; id is a bare UUID with no prefix"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_booking_from_terminal_refunded_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Booking.TICKETED_to_REFUNDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REFUNDED (terminal) booking cannot be cancelled again -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Trip auto-approved; one REFUNDABLE booking cancelled to REFUNDED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c4@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
            - call: "POST /tmc/bookings/${book1}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
          trigger:
            - call: "POST /tmc/bookings/${book1}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: reactivate_active_traveler_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Traveler.SUSPENDED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reactivating an already-ACTIVE traveler (not SUSPENDED) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A freshly created ACTIVE traveler."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c5@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
          trigger:
            - call: "POST /tmc/travelers/${trav}/reactivate"
              payload: {}
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: trip_request_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.TripRequest.initial_state", "entities.TripRequest.fields.status"]
        distinguishing_aspect: "A newly created TripRequest has status DRAFT and actual_cost_cents 0."
        test_recipe:
          setup: ["Policy + traveler."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c6@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
          trigger:
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
          assert:
            - "TripRequest.${trip}.status == DRAFT"
            - "TripRequest.${trip}.actual_cost_cents == 0"

      - name: exchange_after_departure_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Booking.TICKETED_to_EXCHANGED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Exchange is blocked once the clock is past depart_datetime -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Trip approved; one TICKETED booking departing 2026-08-01. Clock advanced to 2026-08-02 (after departure)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c7@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TravelManager
          trigger:
            - call: "POST /tmc/bookings/${book1}/exchange"
              payload: { new_fare_cents: 200000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: estimate_uses_market_fallback_when_no_rate_matches
        claim_type: Correct Result
        grounds: ["calculations.estimate_provisional_cost", "entities.TripRequest.fields.approval_level_required"]
        distinguishing_aspect: "No negotiated rate matches the route, so estimated_cost_cents == market_estimate 75000 and approval_level_required == NONE (auto-APPROVED)."
        test_recipe:
          setup: ["Policy; traveler; NO rate for route JFK->SFO. Trip market_estimate 75000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c8@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "SFO", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 75000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
          trigger:
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { st: $.data.status }
          assert:
            - "TripRequest.${trip}.estimated_cost_cents == 75000"
            - "TripRequest.${trip}.approval_level_required == NONE"
            - "TripRequest.${trip}.status == APPROVED"

      - name: invoice_reconcile_variance_moves_to_disputed
        claim_type: Correct Result
        grounds: ["calculations.invoice_reconciliation", "state_machines.Invoice.RECEIVED_to_DISPUTED", "entities.InvoiceLine.fields.match_status"]
        distinguishing_aspect: "One line billed 260000 against a booking matched 250000 -> line PRICE_VARIANCE and invoiced_total != reconciled_total -> Invoice DISPUTED."
        test_recipe:
          setup: ["Trip auto-approved; one AIR NONREFUNDABLE booking fare 250000. Invoice with one line billed 260000, invoiced_total 260000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c9@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
            - call: "POST /tmc/invoices"
              payload: { vendor_id: "${ven}", billing_period: "2026-08", invoiced_total_cents: 260000, lines: [ { booking_id: "${book1}", billed_amount_cents: 260000 } ] }
              as: FinanceOfficer
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /tmc/invoices/${inv}/reconcile"
              payload: {}
              as: FinanceOfficer
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv}.status == DISPUTED"
            - "Invoice.${inv}.variance_cents != 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: self_approval_isolated_returns_self_approval
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_SELF_APPROVAL]"]
        distinguishing_aspect: "A MANAGER-grade traveler submits their own trip to PENDING_MANAGER then tries to approve it themselves -> ERR_SELF_APPROVAL (state precondition satisfied, only the SoD check fails)."
        test_recipe:
          setup: ["Traveler T (MANAGER). Trip market 200000 submitted -> PENDING_MANAGER."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c10@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 200000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
          trigger:
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SELF_APPROVAL"

      - name: hotel_over_nightly_cap_returns_policy_violation
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_POLICY_VIOLATION]"]
        distinguishing_aspect: "A HOTEL booking with fare_cents 50000 above policy.max_hotel_nightly_cents 40000 -> ERR_POLICY_VIOLATION."
        test_recipe:
          setup: ["Trip auto-approved; HOTEL vendor; booking fare 50000 > cap 40000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c11@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Hotel Co", vendor_type: "HOTEL", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
          trigger:
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "HOTEL", fare_basis: "REFUNDABLE", fare_cents: 50000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-04T09:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POLICY_VIOLATION"

      - name: exec_step_manager_rank_too_low
        claim_type: Violation to Error
        grounds: ["validations[priority=16]", "state_machines.TripRequest.PENDING_EXEC_to_APPROVED", "errors[ERR_APPROVAL_RANK_TOO_LOW]"]
        distinguishing_aspect: "Trip needing EXEC approval reaches PENDING_EXEC; a MANAGER-grade approver clearing the EXEC step -> ERR_APPROVAL_RANK_TOO_LOW."
        test_recipe:
          setup: ["Rate JFK->LHR neg 600000 (estimate 600000 >= exec 500000 -> EXEC). Trip submitted; MANAGER approves to PENDING_EXEC."]
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c12@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M", email: "m12@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/negotiated-rates"
              payload: { vendor_id: "${ven}", rate_code: "R1", origin: "JFK", destination: "LHR", negotiated_fare_cents: 600000, market_fare_cents: 700000, cap_usage_count: 5, valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }
              as: TravelManager
              captures: { rate: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 420000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
          trigger:
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPROVAL_RANK_TOO_LOW"

      - name: redeem_expired_credit_returns_credit_unavailable
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "state_machines.UnusedTicketCredit.AVAILABLE_to_EXPIRED", "errors[ERR_CREDIT_UNAVAILABLE]"]
        distinguishing_aspect: "A credit swept to EXPIRED cannot be redeemed by a later booking -> ERR_CREDIT_UNAVAILABLE."
        test_recipe:
          setup: ["Policy credit_validity_days 365. NONREFUNDABLE booking fare 250000 cancelled -> credit expiry ~ +365d. Clock jumped to 2028 and swept -> credit EXPIRED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T", email: "c13@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-20T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
            - call: "POST /tmc/bookings/${book1}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "GET /tmc/unused-ticket-credits?origin_booking_id=${book1}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { credit: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/maintenance/run-sweep"
              payload: {}
              as: TravelManager
            - call: "GET /tmc/trip-requests/${trip}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v2: $.data.version }
          trigger:
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 180000, redeem_credit_id: "${credit}", depart_datetime: "2028-03-01T09:00:00Z", return_datetime: "2028-03-01T20:00:00Z", expected_trip_request_version: "${tr_v2}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDIT_UNAVAILABLE"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: create_policy_as_traveler_forbidden_for_role
        claim_type: Conditional action
        grounds: ["roles.Traveler", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "A Traveler calling POST /tmc/travel-policies (TravelManager-only) -> ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["Empty DB; caller is a Traveler role."]
          setup_api_calls: []
          trigger:
            - call: "POST /tmc/travel-policies"
              payload: { name: "X", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: Traveler
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: create_policy_missing_auth_header_returns_400
        claim_type: Conditional action
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "Calling POST /tmc/travel-policies with no X-User-Role/X-User-ID -> ERR_MISSING_USER_CONTEXT (400)."
        test_recipe:
          setup: ["Empty DB; request sent with the user-context headers omitted."]
          setup_api_calls: []
          trigger:
            - call: "POST /tmc/travel-policies"
              payload: { name: "X", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_USER_CONTEXT"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_advance_purchase_violation_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_ADVANCE_PURCHASE_VIOLATION]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / advance_purchase_beats_rate_unavailable"
          rationale: "ERR_ADVANCE_PURCHASE_VIOLATION is the winning error of that §1.8 dual-failure instance."
      - name: error_traveler_double_booked_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_TRAVELER_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / traveler_double_booked_half_open_overlap"
          rationale: "Asserted as the failure path of that §1.8 instance."
      - name: error_vendor_capacity_exceeded_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_VENDOR_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / group_block_aggregate_capacity_overlap"
          rationale: "Asserted as the failure path of that §1.8 instance."
      - name: error_approval_required_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_APPROVAL_REQUIRED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / booking_requires_trip_approved"
          rationale: "Asserted as the failure path of that §1.8 instance."
      - name: error_traveler_suspended_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_TRAVELER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / submit_requires_traveler_active"
          rationale: "Asserted as the failure path of that §1.8 instance."
      - name: error_invalid_request_covered
        claim_type: Violation to Error
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / group_block_size_zero_rejected"
          rationale: "block_size 0 triggers ERR_INVALID_REQUEST in that §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_forbidden_covered_by_endpoint_denial
        claim_type: Cannot perform other roles ops
        grounds: ["roles.FinanceOfficer"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / invalid_state_beats_self_approval"
          rationale: "Role gating for approve is exercised alongside the §1.8 self-approval instance; explicit cross-role denial is covered by create_policy_as_traveler_forbidden_for_role in this file."
