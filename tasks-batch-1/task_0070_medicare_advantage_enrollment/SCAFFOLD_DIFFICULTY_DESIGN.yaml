scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: partd_lep_drug_enrollment_vs_partb_lep_penalty_assessment
        grounds:
          - calculations.partd_lep
          - calculations.partb_lep
          - entities.PartDEnrollment.fields.lep_premium_cents
          - entities.PenaltyAssessment.fields.monthly_penalty_cents
        distinguishing_aspect: "Part D LEP (1%/month of NBBP, dime-rounded) on the PartDEnrollment domain and Part B LEP (10% per full 12-month period, integer cents) on the PenaltyAssessment domain are two different penalty algorithms on two different entities; identical uncovered_months=13 yields lep_premium_cents=450 for Part D but monthly_penalty_cents=1747 for Part B."
        test_recipe:
          setup:
            - "A confirmed Part D enrollment (creditable coverage never held) with uncovered_months=13 producing Part D LEP 450c"
            - "A PenaltyAssessment of type PART_B with uncovered_months=13 producing 1747c"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Ada Lovelace", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Basic", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.5, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
              captures: { pde_lep: $.data.lep_premium_cents, pde_unc: $.data.uncovered_months }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { beneficiary_id: "${ben_id}", penalty_type: "PART_B", uncovered_months: 13 }
              as: ComplianceOfficer
              captures: { pa_id: $.data.id, pa_cents: $.data.monthly_penalty_cents }
          assert:
            - "PartDEnrollment.${pde_id}.uncovered_months == 13"
            - "PartDEnrollment.${pde_id}.lep_premium_cents == 450"
            - "PenaltyAssessment.${pa_id}.monthly_penalty_cents == 1747"
            - "PenaltyAssessment.${pa_id}.monthly_penalty_cents != PartDEnrollment.${pde_id}.lep_premium_cents"

      - name: partd_lep_variant_from_confirm_vs_from_assessment
        grounds:
          - calculations.partd_lep
          - calculations.partd_uncovered_months
          - entities.PartDEnrollment.fields.uncovered_months
          - entities.PenaltyAssessment.fields.uncovered_months
        distinguishing_aspect: "The from_confirm variant derives uncovered_months by partd_uncovered_months (anchor=IEP window_end Nov 2024, effective Jan 2026 -> 13), while the from_assessment variant takes uncovered_months=7 verbatim from the caller; both run the same dime-rounding partd_lep formula but on different input-set sources, yielding 450c vs 240c."
        test_recipe:
          setup:
            - "Same beneficiary; one Part D LEP derived at confirm (=450c for 13 months), one Part D PenaltyAssessment with caller-supplied 7 months (=240c)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Grace Hopper", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Std", part_type: "PART_D", monthly_premium_cents: 2500, star_rating: 4.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
              captures: { confirm_lep: $.data.lep_premium_cents }
          trigger:
            - call: "POST /penalty-assessments"
              payload: { beneficiary_id: "${ben_id}", penalty_type: "PART_D", uncovered_months: 7 }
              as: ComplianceOfficer
              captures: { pa_cents: $.data.monthly_penalty_cents }
          assert:
            - "PartDEnrollment.${pde_id}.lep_premium_cents == 450"
            - "PenaltyAssessment.pa.monthly_penalty_cents == 240"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: donut_hole_claim_straddles_deductible_and_initial_phases
        grounds:
          - calculations.donut_hole_member_share
          - entities.DrugClaim.fields.member_share_cents
          - entities.DrugClaim.fields.phase_at_post
          - entities.PartDEnrollment.fields.total_drug_cost_cents
        distinguishing_aspect: "Mode (a): a single 60000c claim posted from empty accumulators splits at the DEDUCTIBLE boundary (54500c at 100%) then 5500c at 25% coinsurance — a >=3-input formula (running total, running oop, claim price) with conditional tier selection and a min() segment cap; member_share_cents=55875, phase_at_post=DEDUCTIBLE."
        test_recipe:
          setup:
            - "An ACTIVE Part D enrollment with zero accumulators, then one 60000c drug claim posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Edsger D", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP D", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 60000, incurred_at: "2024-11-05T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { claim_id: $.data.id, share: $.data.member_share_cents, phase: $.data.phase_at_post }
          assert:
            - "DrugClaim.${claim_id}.member_share_cents == 55875"
            - "DrugClaim.${claim_id}.phase_at_post == DEDUCTIBLE"
            - "PartDEnrollment.${pde_id}.total_drug_cost_cents == 60000"
            - "PartDEnrollment.${pde_id}.member_oop_cents == 55875"

      - name: donut_hole_round_per_segment_then_sum_ordering
        grounds:
          - calculations.donut_hole_member_share
          - entities.DrugClaim.fields.member_share_cents
        distinguishing_aspect: "Mode (b): two consecutive 333c claims while in INITIAL phase each round 25% to a whole cent BEFORE summing (round(83.25)=83 each -> 166 total), which differs from sum-then-round (round(166.5)=167); the scaffold pins round-per-segment-then-sum, so the two claims total member_share_cents 83 + 83 = 166, not 167."
        test_recipe:
          setup:
            - "An ACTIVE Part D enrollment already past the deductible (total_drug_cost_cents=54500), then two 333c claims in the INITIAL phase"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "John von N", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP R", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 54500, incurred_at: "2024-11-05T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 333, incurred_at: "2024-11-06T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { c1: $.data.member_share_cents }
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 333, incurred_at: "2024-11-07T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { c2: $.data.member_share_cents }
          assert:
            - "DrugClaim.c1.member_share_cents == 83"
            - "DrugClaim.c2.member_share_cents == 83"
            - "PartDEnrollment.${pde_id}.member_oop_cents == 54666"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: part_c_branching_active_to_superseded_vs_disenrolled
        grounds:
          - state_machines.PartCEnrollment.ACTIVE_to_SUPERSEDED
          - state_machines.PartCEnrollment.ACTIVE_to_DISENROLLED
          - state_machines.PartCEnrollment.PENDING_to_ACTIVE
        distinguishing_aspect: "PartCEnrollment is branching: from ACTIVE it forks to SUPERSEDED (system, when a newer enrollment is confirmed, with the bundled-MAPD disenroll side-effect) or to DISENROLLED (operator drop, no further cascade) — divergent side-effect sets on one entity."
        test_recipe:
          setup:
            - "A beneficiary with Part B active and a confirmed Part C enrollment #1 (MA-only); then a second Part C confirmed during AEP supersedes #1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Klara D", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id, ben_v0: $.data.version }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /plans"
              payload: { name: "MA One", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.0, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma1_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "MA Two", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.5, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma2_id: $.data.id }
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma1_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pce1_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v1: $.data.version }
            - call: "POST /part-c-enrollments/${pce1_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v1}" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "AEP", aep_year: 2024 }
              as: EnrollmentAdmin
              captures: { aep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma2_id}", enrollment_period_id: "${aep_id}" }
              as: EnrollmentAdmin
              captures: { pce2_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v2: $.data.version }
          trigger:
            - call: "POST /part-c-enrollments/${pce2_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v2}" }
              as: EnrollmentAdmin
          assert:
            - "PartCEnrollment.${pce1_id}.status == SUPERSEDED"
            - "PartCEnrollment.${pce2_id}.status == ACTIVE"

      - name: beneficiary_branching_fraud_hold_cycle_vs_deceased_terminal
        grounds:
          - state_machines.Beneficiary.ACTIVE_to_FRAUD_HOLD
          - state_machines.Beneficiary.FRAUD_HOLD_to_ACTIVE
          - state_machines.Beneficiary.ACTIVE_to_DECEASED
        distinguishing_aspect: "Beneficiary is non-linear on a different entity than PartCEnrollment: ACTIVE forks to FRAUD_HOLD (reversible cycle back to ACTIVE via clear-hold) or to DECEASED (terminal, with the full voiding cascade) — a cycle plus a terminal branch on the same row."
        test_recipe:
          setup:
            - "A beneficiary cycled ACTIVE -> FRAUD_HOLD -> ACTIVE, then taken ACTIVE -> DECEASED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Alan T", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/fraud-hold"
              payload: {}
              as: ComplianceOfficer
              captures: { st_hold: $.data.status, lock_hold: $.data.enrollment_lock }
            - call: "POST /beneficiaries/${ben_id}/clear-hold"
              payload: {}
              as: ComplianceOfficer
              captures: { st_clear: $.data.status, lock_clear: $.data.enrollment_lock }
          trigger:
            - call: "POST /beneficiaries/${ben_id}/record-death"
              payload: {}
              as: EnrollmentAdmin
              captures: { st_dead: $.data.status }
          assert:
            - "Beneficiary.${ben_id}.status was FRAUD_HOLD after fraud-hold then ACTIVE after clear-hold"
            - "Beneficiary.${ben_id}.status == DECEASED"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_supersede_disenroll_bundled_mapd_depth3
        grounds:
          - state_machines.PartCEnrollment.PENDING_to_ACTIVE
          - state_machines.PartCEnrollment.ACTIVE_to_SUPERSEDED
          - state_machines.PartDEnrollment.ACTIVE_to_DISENROLLED
          - entities.Plan.fields.includes_drug_coverage
        distinguishing_aspect: "Depth-3 chain triggered by Part C confirm: confirm MA#2 -> MA#1 ACTIVE->SUPERSEDED (hop1, caused by confirm) -> because MA#1 was an MAPD, its bundled ACTIVE PartDEnrollment ACTIVE->DISENROLLED (hop2, caused by the supersede, not the confirm)."
        test_recipe:
          setup:
            - "Beneficiary with Part B active; confirmed MAPD #1 (includes_drug_coverage=true) with a bundled ACTIVE Part D enrollment; a second MA confirmed during AEP"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Maurice W", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /plans"
              payload: { name: "MAPD One", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { mapd1_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Bundle", part_type: "PART_D", monthly_premium_cents: 1500, star_rating: 4.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "MA Two", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.5, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma2_id: $.data.id }
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${mapd1_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pce1_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v1: $.data.version }
            - call: "POST /part-c-enrollments/${pce1_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v1}" }
              as: EnrollmentAdmin
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "AEP", aep_year: 2024 }
              as: EnrollmentAdmin
              captures: { aep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma2_id}", enrollment_period_id: "${aep_id}" }
              as: EnrollmentAdmin
              captures: { pce2_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v2: $.data.version }
          trigger:
            - call: "POST /part-c-enrollments/${pce2_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v2}" }
              as: EnrollmentAdmin
          assert:
            - "PartCEnrollment.${pce1_id}.status == SUPERSEDED"
            - "PartDEnrollment.${pde_id}.status == DISENROLLED"
            - "PartCEnrollment.${pce2_id}.status == ACTIVE"

      - name: record_death_voids_partb_which_resets_part_b_status_depth2
        grounds:
          - state_machines.Beneficiary.ACTIVE_to_DECEASED
          - state_machines.PartBEnrollment.ACTIVE_to_VOIDED
          - entities.Beneficiary.fields.part_b_status
        distinguishing_aspect: "Depth-2 chain triggered by record-death (different trigger than confirm): record-death -> PartBEnrollment ACTIVE->VOIDED (hop1, caused by death) -> that VOIDED transition's own side-effect sets Beneficiary.part_b_status=NONE (hop2, caused by the void, not the death action directly)."
        test_recipe:
          setup:
            - "Beneficiary with an ACTIVE Part B enrollment (part_b_status=ENROLLED), then record-death"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Tony H", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
              captures: { pb_status_after: $.data.status }
          trigger:
            - call: "POST /beneficiaries/${ben_id}/record-death"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_part_b: $.data.part_b_status, ben_status: $.data.status }
          assert:
            - "PartBEnrollment.${pbe_id}.status == VOIDED"
            - "Beneficiary.${ben_id}.part_b_status == NONE"
            - "Beneficiary.${ben_id}.status == DECEASED"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: enrollment_locked_safety_beats_outside_window_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_ENROLLMENT_LOCKED]
          - errors[ERR_OUTSIDE_ENROLLMENT_WINDOW]
        distinguishing_aspect: "business_safety (ERR_ENROLLMENT_LOCKED, priority 10) outranks business_temporal (ERR_OUTSIDE_ENROLLMENT_WINDOW, priority 11): a Part C create that is BOTH on a FRAUD_HOLD beneficiary AND outside the AEP window returns ERR_ENROLLMENT_LOCKED, not ERR_OUTSIDE_ENROLLMENT_WINDOW."
        test_recipe:
          setup:
            - "A FRAUD_HOLD beneficiary with Part B active; clock set OUTSIDE the AEP window; attempt a Part C create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Donald K", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "AEP", aep_year: 2024 }
              as: EnrollmentAdmin
              captures: { aep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "MA X", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 3.5, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/fraud-hold"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma_id}", enrollment_period_id: "${aep_id}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ENROLLMENT_LOCKED"

      - name: wrong_period_type_referential_beats_not_five_star_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_WRONG_PERIOD_TYPE]
          - errors[ERR_NOT_FIVE_STAR]
        distinguishing_aspect: "business_referential (ERR_WRONG_PERIOD_TYPE, priority 9) outranks business_constraint (ERR_NOT_FIVE_STAR, priority 13): a Part C create that names a GI_MEDIGAP period (wrong type) for a 3.5-star plan fails ERR_WRONG_PERIOD_TYPE — a different error-category pair than the safety-vs-temporal conflict above."
        test_recipe:
          setup:
            - "Beneficiary with Part B active; a GI_MEDIGAP period; a non-5-star plan; attempt Part C create naming the GI_MEDIGAP period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Barbara L", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "GI_MEDIGAP", source_event_date: "2024-05-01T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { gi_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "MA Mid", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 3.5, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma_id: $.data.id }
          trigger:
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma_id}", enrollment_period_id: "${gi_id}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_WRONG_PERIOD_TYPE"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: donut_hole_icl_boundary_initial_to_gap_crossing
        grounds:
          - calculations.donut_hole_member_share
          - entities.DrugClaim.fields.phase_at_post
          - entities.PartDEnrollment.fields.total_drug_cost_cents
        distinguishing_aspect: "Numeric-threshold boundary on the claims endpoint: with total_drug_cost_cents exactly at ICL (503000), the NEXT claim's first cent is in GAP (T>=ICL uses >=, not >), so phase_at_post=GAP; a claim that lands total at 502999 would still be INITIAL."
        test_recipe:
          setup:
            - "ACTIVE Part D enrollment driven to total_drug_cost_cents exactly 503000 via prior claims, then one more 1000c claim"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Ken T", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP ICL", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 503000, incurred_at: "2024-11-05T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-d-enrollments/${pde_id}/claims"
              payload: { list_price_cents: 1000, incurred_at: "2024-11-06T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { phase: $.data.phase_at_post, share: $.data.member_share_cents }
          assert:
            - "PartDEnrollment.${pde_id}.total_drug_cost_cents == 503000 before the trigger claim"
            - "DrugClaim.trigger.phase_at_post == GAP"
            - "DrugClaim.trigger.member_share_cents == 250"

      - name: medigap_gi_window_day63_inclusive_vs_day64_expired
        grounds:
          - validations[priority=12]
          - errors[ERR_GI_WINDOW_EXPIRED]
          - entities.EnrollmentPeriod.fields.source_event_date
        distinguishing_aspect: "Temporal boundary on the medigap endpoint (a different metric and endpoint than the ICL numeric crossing): an application at source_event_date+63 days (2026-03-05) is INSIDE the GI window and ISSUED, but at +64 days (2026-03-06) it returns ERR_GI_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "A GI_MEDIGAP period with source_event_date 2026-01-01; clock set to day 64 (2026-03-06); attempt a Medigap application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Dennis R", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "GI_MEDIGAP", source_event_date: "2026-01-01T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { gi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /medigap-policies"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${gi_id}", coverage_start: "2026-03-06T00:00:00.000Z", coverage_end: "2027-03-06T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_GI_WINDOW_EXPIRED"

