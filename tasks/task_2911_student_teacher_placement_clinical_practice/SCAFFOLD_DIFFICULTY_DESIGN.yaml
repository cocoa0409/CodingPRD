          Mode (c) - WHICH SUBTOTAL THE TIER IS LOOKED UP AGAINST. Travel is
          base = miles_per_term * MILEAGE_RATE_CENTS, then an oversize allowance whose percentage tier
          is chosen from the *base* subtotal, then total = base + allowance. Commute 37 miles x 2 trips
          x 5 days x 2 weeks = 740 miles, base = 740 * 67 = 49580, which sits in tier 1 (< 60000 -> 8%),
          allowance = round_half_up(3966.4) = 3966, total 53546. Re-deriving the tier from the running
          total (49580 + something) or from the post-allowance figure would drop to the 5% tier and give
          52059. The sibling instance probes mode (b) - rounding position - in the stipend formula; the
          operand sets (miles/rate/tier vs rate/multiplier/weeks) are disjoint.
