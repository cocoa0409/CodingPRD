  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_subscription_to_payroll_to_export_expiry
        grounds:
          - state_machines.Subscription.transitions ACTIVE_to_CANCELLED_READ_ONLY
          - state_machines.PayrollAddon.transitions ACTIVE_to_CANCELLED
          - state_machines.AccessGrant.transitions ACTIVE_to_REVOKED
          - state_machines.BankConnection.transitions ACTIVE_to_DISCONNECTED
          - state_machines.ExportRequest
        distinguishing_aspect: |
          Cascade chain of depth >= 4: Subscription cancel -> PayrollAddon
          CANCELLED (terminal), AccessGrants REVOKED, BankConnections
          DISCONNECTED, AppIntegrations DISCONNECTED, ClientCompany READ_ONLY,
          pending MigrationJob CANCELLED. Then later, system at
          read_only_expires_at drives Subscription -> CANCELLED_EXPIRED which
          cascades ExportRequests PENDING/READY -> EXPIRED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01. Company J with ACTIVE subscription, ACTIVE payroll, one ACTIVE AccessGrant, one ACTIVE BankConnection, one ACTIVE AppIntegration, one READY ExportRequest."
