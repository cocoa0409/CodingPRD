# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.md.
# Logical clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: volunteer_creation_defaults_and_system_stamps
        claim_type: creation
        grounds: [entities.Volunteer, endpoints.POST_/volunteers]
        distinguishing_aspect: "A fresh volunteer lands in APPLIED with every computed/system field at its declared default and system stamps taken from the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Default Dana", email: "dana@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
          trigger:
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "Volunteer.${v_id}.status == APPLIED"
            - "Volunteer.${v_id}.required_check_level == BASIC"
            - "Volunteer.${v_id}.total_verified_hours == 0.0 and total_provisional_hours == 0.0 and recognition_points == 0.0"
            - "Volunteer.${v_id}.recognition_tier == NONE and restriction_flags == [] and clearance_expires_at is null"
            - "Volunteer.${v_id}.version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default) and id is a prefix-free UUID"

      - name: volunteer_create_schema_violations_rejected
        claim_type: required_fields
        grounds: [entities.Volunteer.fields.email, entities.Volunteer.fields.contact_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field (email) and out-of-set enum (contact_type) both surface ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /volunteers", payload: { full_name: "No Email", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /volunteers", payload: { full_name: "Bad Enum", email: "enum@x.com", contact_type: "ROAMING" }, as: DistrictCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "missing-email response error_id == ERR_INVALID_REQUEST"
            - "bad-enum response error_id == ERR_INVALID_REQUEST"
            - "GET /volunteers total_count == 0 (no partial writes)"

      - name: uniqueness_violations_rejected
        claim_type: type_constraints
        grounds: [entities.Volunteer.fields.email, entities.Campus.fields.campus_code, entities.TrainingModule.fields.module_code]
        distinguishing_aspect: "Tenant-wide uniqueness on volunteer email, campus_code, and module_code is enforced at creation with three distinct error ids."
        test_recipe:
          setup: ["one volunteer dup@x.com, one campus LNC, one module ORIENT already exist"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "First", email: "dup@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator }
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"] }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /volunteers", payload: { full_name: "Second", email: "dup@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /campuses", payload: { name: "Lincoln North", campus_code: "LNC", badge_prefix: "LCN" }, as: DistrictCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Duplicate", required_contact_types: ["UNSUPERVISED"] }, as: DistrictCoordinator, captures: { err3: $.data.error_id } }
          assert:
            - "duplicate volunteer email -> error_id == ERR_EMAIL_TAKEN (409)"
            - "duplicate campus_code -> error_id == ERR_CAMPUS_CODE_TAKEN (409)"
            - "duplicate module_code -> error_id == ERR_MODULE_CODE_TAKEN (409)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "An unresolvable path id and an unresolvable body FK both produce ERR_NOT_FOUND (404); the body-FK case proves existence (p3) is evaluated before the OCC check (p9)."
        test_recipe:
          setup: ["one volunteer exists so a real version value can be quoted"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Real Ruth", email: "ruth@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
          trigger:
            - { call: "GET /volunteers/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /background-checks", payload: { volunteer_id: "00000000-0000-0000-0000-000000000000", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "GET with unknown id -> error_id == ERR_NOT_FOUND (404)"
            - "POST /background-checks with unknown volunteer_id -> error_id == ERR_NOT_FOUND (404), not ERR_STALE_VERSION"

      - name: volunteer_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Volunteer.fields.total_verified_hours, entities.Volunteer.fields.status]
        distinguishing_aspect: "Client-supplied computed/system fields (total_verified_hours, status) in the create payload are ignored; the server-computed defaults win."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /volunteers", payload: { full_name: "Sneaky Sid", email: "sid@x.com", contact_type: "SUPERVISED", total_verified_hours: 999, status: "ACTIVE" }, as: DistrictCoordinator, captures: { v_id: $.data.id } }
          assert:
            - "Volunteer.${v_id}.total_verified_hours == 0.0 (999 ignored)"
            - "Volunteer.${v_id}.status == APPLIED (client-supplied ACTIVE ignored)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: creation_initial_states
        claim_type: initial_state
        grounds: [state_machines.Opportunity, state_machines.Placement, state_machines.HourEntry, state_machines.VisitCheckIn, state_machines.BackgroundCheck]
        distinguishing_aspect: "Each entity is born in its declared initial_state, and the responses show it immediately (immediate consistency): opportunity DRAFT, check PENDING, placement REQUESTED, hour entry PENDING with computed points, check-in OPEN with minted badge."
        test_recipe:
          setup: ["module, volunteer UNDER_SCREENING, campus, opportunity"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Initial Ina", email: "ina@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id, chk_status: $.data.status } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id, opp_status: $.data.status } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id, pl_status: $.data.status } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 1.5, activity_category: "TUTORING" }, as: Volunteer, as_user_id: "${v_id}", captures: { he_status: $.data.status, he_points: $.data.points } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T13:30:00Z" }, as: DistrictCoordinator }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}", placement_id: "${pl_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { ci_status: $.data.status, ci_badge: $.data.badge_code } }
          assert:
            - "Opportunity create response status == DRAFT; BackgroundCheck create response status == PENDING"
            - "Placement create response status == REQUESTED (initial state), confirmed only by the explicit confirm call"
            - "HourEntry create response status == PENDING and points == 2.3 (1.5 x 1.5 = 2.25 rounds half-up to 2.3)"
            - "VisitCheckIn create response status == OPEN and badge_code == LNC-0001"
      - name: adjudicate_non_pending_check_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BackgroundCheck.CLEARED, "errors[ERR_CHECK_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating an already-CLEARED check is rejected with ERR_CHECK_INVALID_STATE; only PENDING is a valid from-state."
        test_recipe:
          setup: ["volunteer ACTIVE via adjudicated BASIC check"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Twice Tom", email: "tom@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "second adjudication -> error_id == ERR_CHECK_INVALID_STATE (409)"
            - "BackgroundCheck.${chk_id}.status remains CLEARED"

      - name: publish_cancelled_opportunity_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Opportunity, "errors[ERR_OPPORTUNITY_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: publish on a cancelled opportunity is rejected and no transition fires."
        test_recipe:
          setup: ["campus + opportunity created then cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Doomed", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/cancel", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
          assert:
            - "publish -> error_id == ERR_OPPORTUNITY_INVALID_STATE (409)"
            - "Opportunity.${opp_id}.status remains CANCELLED"

      - name: verify_rejected_entry_rejected
        claim_type: invalid_transition
        grounds: [state_machines.HourEntry, "errors[ERR_HOUR_ENTRY_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: verify on a rejected entry fails with ERR_HOUR_ENTRY_INVALID_STATE and totals do not move."
        test_recipe:
          setup: ["ACTIVE volunteer, CONFIRMED placement, hour entry 2.0 STANDARD rejected"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Reject Rita", email: "rita@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 2.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he_id: $.data.id } }
            - { call: "POST /hour-entries/${he_id}/reject", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /hour-entries/${he_id}/verify", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "verify after reject -> error_id == ERR_HOUR_ENTRY_INVALID_STATE (409)"
            - "Volunteer.${v_id}.total_verified_hours == 0.0 and total_provisional_hours == 0.0"

      - name: checkout_closed_checkin_rejected
        claim_type: invalid_transition
        grounds: [state_machines.VisitCheckIn, "errors[ERR_CHECKIN_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for a check-in: a second check-out fails with ERR_CHECKIN_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE volunteer with an OPEN walk-in check-in at clock 2026-08-05T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Walkin Will", email: "will@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /check-ins/${ci_id}/check-out", payload: {}, as: Volunteer, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /check-ins/${ci_id}/check-out", payload: {}, as: Volunteer, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "second check-out -> error_id == ERR_CHECKIN_INVALID_STATE (409)"
            - "VisitCheckIn.${ci_id}.status remains CLOSED with close_reason == SELF"

      - name: incident_double_adjudication_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IncidentReport, "errors[ERR_INCIDENT_INVALID_STATE]"]
        distinguishing_aspect: "UNFOUNDED is terminal: a second adjudication of the same incident fails with ERR_INCIDENT_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE volunteer; MEDIUM incident filed (no auto-suspend); adjudicated UNFOUNDED"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Incident Ivy", email: "ivy@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /incident-reports", payload: { volunteer_id: "${v_id}", severity: "MEDIUM", description: "Late twice" }, as: CampusAdmin, captures: { inc_id: $.data.id } }
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "UNFOUNDED" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "SUBSTANTIATED" }, as: DistrictCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "second adjudication -> error_id == ERR_INCIDENT_INVALID_STATE (409)"
            - "Volunteer.${v_id}.status remains ACTIVE (MEDIUM severity never suspended, UNFOUNDED is final)"

      - name: training_completion_auto_activates_clearance_granted
        claim_type: valid_transition
        grounds: [state_machines.Volunteer.CLEARANCE_GRANTED_to_ACTIVE, calculations.training_compliance_check]
        distinguishing_aspect: "Auto-transition: when adjudication lands before training, the volunteer parks in CLEARANCE_GRANTED; the training-record insert that completes compliance flips the volunteer to ACTIVE without any volunteer-targeted call."
        test_recipe:
          setup: ["module ORIENT; volunteer with BASIC check adjudicated NONE before any training record"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Parked Pat", email: "pat@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator, captures: { status_before: $.data.status } }
          trigger:
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "before training: Volunteer.${v_id}.status == CLEARANCE_GRANTED"
            - "after training record: Volunteer.${v_id}.status == ACTIVE (auto-transition)"

      - name: unfounded_reinstates_active_when_clearance_valid
        claim_type: valid_transition
        grounds: [state_machines.Volunteer.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "UNFOUNDED adjudication reinstates to prior_status ACTIVE and clears both suspension bookkeeping fields when the clearance is still valid at reinstatement time."
        test_recipe:
          setup: ["ACTIVE volunteer suspended by a HIGH incident"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Reinstate Ray", email: "ray@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /incident-reports", payload: { volunteer_id: "${v_id}", severity: "HIGH", description: "Alleged altercation" }, as: CampusAdmin, captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "UNFOUNDED" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "Volunteer.${v_id}.status == ACTIVE (reinstated)"
            - "Volunteer.${v_id}.prior_status is null and suspension_incident_id is null"

      - name: unfounded_reinstates_rescreen_when_clearance_expired
        claim_type: valid_transition
        grounds: [state_machines.Volunteer.SUSPENDED_to_RESCREEN_REQUIRED, state_machines.BackgroundCheck.CLEARED_to_EXPIRED]
        distinguishing_aspect: "Guarded reinstatement: the volunteer was SUSPENDED while ACTIVE, but the ENHANCED clearance expired during the suspension, so UNFOUNDED reinstates to RESCREEN_REQUIRED instead of ACTIVE; the sweep does not touch SUSPENDED volunteers (volunteers_rescreened_count == 0)."
        test_recipe:
          setup: ["UNSUPERVISED volunteer ACTIVE via ENHANCED check (expires 2027-08-01T00:00:00Z); suspended by HIGH incident at default clock; clock advanced to 2027-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "CORE", title: "Core Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"] }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Expired Erin", email: "erin@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /incident-reports", payload: { volunteer_id: "${v_id}", severity: "HIGH", description: "Alleged policy violation" }, as: CampusAdmin, captures: { inc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: DistrictCoordinator, captures: { sweep_rescreened: $.data.volunteers_rescreened_count, sweep_expired: $.data.expired_check_count } }
          trigger:
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "UNFOUNDED" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "sweep reported expired_check_count == 1 and volunteers_rescreened_count == 0 (SUSPENDED volunteers are not demoted)"
            - "Volunteer.${v_id}.status == RESCREEN_REQUIRED (not ACTIVE) after UNFOUNDED"
            - "BackgroundCheck.${chk_id}.status == EXPIRED"

      - name: substantiated_incident_removes_volunteer_with_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.IncidentReport.OPEN_to_SUBSTANTIATED, state_machines.Volunteer.SUSPENDED_to_REMOVED, entities.Placement.fields.cancel_reason]
        distinguishing_aspect: "A LOW-severity incident does not auto-suspend, but its SUBSTANTIATED adjudication still removes the volunteer and cancels both REQUESTED and CONFIRMED placements with cancel_reason SYSTEM_REMOVAL."
        test_recipe:
          setup: ["ACTIVE volunteer with one CONFIRMED placement (opp A) and one REQUESTED placement (opp B, non-overlapping day)"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Removed Rex", email: "rex@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Opp A", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Opp B", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-11T14:00:00Z", ends_at: "2026-08-11T17:00:00Z" }, as: CampusAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /opportunities/${oa_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /opportunities/${ob_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${oa_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pa_id: $.data.id } }
            - { call: "POST /placements/${pa_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${ob_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pb_id: $.data.id } }
            - { call: "POST /incident-reports", payload: { volunteer_id: "${v_id}", placement_id: "${pa_id}", severity: "LOW", description: "Complaint from staff" }, as: CampusAdmin, captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /incident-reports/${inc_id}/adjudicate", payload: { outcome: "SUBSTANTIATED" }, as: DistrictCoordinator }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /placements/${pa_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /placements/${pb_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /opportunities/${oa_id}", payload: {}, as: CampusAdmin }
          assert:
            - "Volunteer.${v_id}.status == REMOVED"
            - "Placement.${pa_id}.status == CANCELLED and cancel_reason == SYSTEM_REMOVAL"
            - "Placement.${pb_id}.status == CANCELLED and cancel_reason == SYSTEM_REMOVAL"
            - "Opportunity.${oa_id}.committed_count == 0 and projected_count == 0"

      - name: opportunity_auto_completed_by_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.Opportunity.OPEN_to_COMPLETED, endpoints.POST_/_clock/set_current_utc]
        distinguishing_aspect: "The clock sweep auto-completes OPEN opportunities whose ends_at has passed and reports the count."
        test_recipe:
          setup: ["campus + OPEN opportunity with window 2026-08-03T08:00:00Z..2026-08-03T12:00:00Z"]
          setup_api_calls:
