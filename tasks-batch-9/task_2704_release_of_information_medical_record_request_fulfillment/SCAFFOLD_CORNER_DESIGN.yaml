# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Claim Index) — task_2704
# Walk of references/claim-extraction-guide.md against §1.1-§1.7 of SCAFFOLD.yaml.
# Nine sections. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as excluded_because stubs and carry no test_recipe.
# Every numeric literal below was computed by running the §1.3 formulas as code.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: state_fee_rule_created_with_full_success_envelope
        claim_type: creation
        grounds:
          - entities.StateFeeRule
          - endpoints.POST_/roi/state-fee-rules
          - response_envelope.success
        distinguishing_aspect: >
          A create returns 201 with the fixed success envelope — meta.api_request_id,
          meta.api_request_timestamp, response_type "object", data carrying every
          declared field plus the four common fields — and version starts at 1 with
          created_at equal to updated_at at the logical clock.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"
            - "data.id == ${rule_ca} and is a non-empty string"
            - "data.state_code == \"CA\", data.tier1_page_limit == 25, data.penalty_cap_cents == 25000, data.fee_forfeiture_on_late == true — every input field is echoed"
            - "data.version == 1"
            - "data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"

      - name: facility_retrieval_returns_stored_configuration
        claim_type: retrieval
        grounds:
          - entities.Facility
          - endpoints.GET_/roi/facilities/{id}
        distinguishing_aspect: >
          GET by id returns exactly what the create stored, including the four
          money/penalty aggregates initialised to 0 and the status default ACTIVE,
          and the read does not bump version.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one CA fee rule; one facility created with explicit legacy settings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}", legacy_archive_enabled: true, legacy_retrieval_surcharge_cents: 2000, legacy_gateway_job_minutes: 45, legacy_gateway_buffer_minutes: 5 }
              as: PlatformAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /roi/facilities/${fac}"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
          assert:
            - "HTTP 200 and data.id == ${fac}"
            - "data.name == \"Bay Regional Health\" and data.state_fee_rule_id == ${rule_ca}"
            - "data.legacy_gateway_job_minutes == 45 and data.legacy_gateway_buffer_minutes == 5"
            - "data.status == \"ACTIVE\""
            - "data.receivable_cents == 0, data.collected_cents == 0, data.written_off_cents == 0, data.penalty_exposure_cents == 0"
            - "data.version == 1 — a GET is not a write"

      - name: patients_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/roi/patients
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >
          The list route reports limit, offset, total_count and has_more; with three
          patients and limit 2 the first page returns 2 rows and has_more true, the
          second page returns 1 row and has_more false, and total_count stays 3 on
          both pages.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one CA fee rule; one facility; exactly three patients on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat1: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1002", full_name: "Ari Blum", date_of_birth: "1990-07-02" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat2: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1003", full_name: "Jo Fenn", date_of_birth: "1972-11-30" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat3: $.data.id }
          trigger:
            - call: "GET /roi/patients?facility_id=${fac}&limit=2&offset=0"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "GET /roi/patients?facility_id=${fac}&limit=2&offset=2"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "GET /roi/patients?facility_id=${fac}&mrn=MRN-1002"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
          assert:
            - "page 1: response_type == \"array\", 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2: 1 row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the union of the two pages is exactly {${pat1}, ${pat2}, ${pat3}} with no row repeated"
            - "the mrn filter returns 1 row whose id == ${pat2} with total_count == 1 and has_more == false"

      - name: patient_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_6
          - errors.ERR_PATIENT_NOT_FOUND
          - response_envelope.error
        distinguishing_aspect: >
          A syntactically valid but unknown path id yields 404 ERR_PATIENT_NOT_FOUND
          in the error envelope, with response_type "error" and no data.id field.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; no Patient with the queried id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /roi/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
          assert:
            - "HTTP 404 and response_type == \"error\""
            - "data.error_id == \"ERR_PATIENT_NOT_FOUND\" and data.message is a non-empty string"
            - "data has no id, no version and no created_at"

      - name: request_create_missing_delivery_format_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/roi/requests
        distinguishing_aspect: >
          delivery_format has source input with no default, so omitting it is a
          400 ERR_INVALID_REQUEST at priority 4 — before any referential or
          business check, and no Request row is created.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester with a VALID authorization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
          trigger:
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["GENERAL_MEDICAL"], date_range_start: "2024-01-01", date_range_end: "2024-12-31" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /roi/requests?facility_id=${fac} returns total_count == 0 — nothing was persisted"

      - name: facility_create_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.legacy_archive_enabled
          - entities.Facility.legacy_gateway_job_minutes
          - entities.Facility.legacy_gateway_buffer_minutes
          - entities.Facility.sensitive_categories_requiring_specific_authorization
        distinguishing_aspect: >
          Omitting every optional input yields the declared defaults exactly:
          legacy_archive_enabled false, surcharge 0, job 30 minutes, buffer 10
          minutes, and the seven-category segregation list — not an empty list.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one CA fee rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
          trigger:
            - call: "POST /roi/facilities"
              payload: { name: "Minimal Clinic", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac_min: $.data.id }
          assert:
            - "HTTP 201; data.legacy_archive_enabled == false"
            - "data.legacy_retrieval_surcharge_cents == 0"
            - "data.legacy_gateway_job_minutes == 30 and data.legacy_gateway_buffer_minutes == 10"
            - "data.sensitive_categories_requiring_specific_authorization has exactly 7 entries and equals [\"BEHAVIORAL_HEALTH\",\"SUD_PART2\",\"HIV\",\"GENETIC\",\"REPRODUCTIVE_HEALTH\",\"MINOR_CONFIDENTIAL\",\"PSYCHOTHERAPY_NOTES\"]"
            - "data.status == \"ACTIVE\" and data.version == 1"

      - name: request_computed_and_system_fields_are_server_owned_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Request.statutory_due_at
          - entities.Request.received_at
          - entities.Request.fulfillment_status
          - entities.Request.intake_user_id
        distinguishing_aspect: >
          statutory_due_at, received_at, fulfillment_status and intake_user_id are
          computed or system fields; client-supplied values for them are discarded
          and the server's own values appear instead — received_at is the logical
          clock, statutory_due_at is the 30-day third-party deadline from it, and
          intake_user_id is the caller's X-User-ID.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule (third_party_deadline_days 30); facility; patient; ATTORNEY requester with a VALID authorization signed 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
          trigger:
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["GENERAL_MEDICAL"], date_range_start: "2024-01-01", date_range_end: "2024-12-31", delivery_format: "SECURE_PORTAL", received_at: "2020-01-01T00:00:00Z", statutory_due_at: "2099-01-01T00:00:00Z", fulfillment_status: "RELEASED", intake_user_id: "u-someone-else", version: 99 }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq: $.data.id }
          assert:
            - "HTTP 201; data.received_at == 2026-08-01T00:00:00Z — the supplied 2020 value is ignored"
            - "data.statutory_due_at == 2026-08-31T00:00:00Z (received_at + 30 days) — the supplied 2099 value is ignored"
            - "data.fulfillment_status == \"INTAKE_REVIEW\" and data.billing_status == \"PENDING_INVOICE\" — the supplied RELEASED is ignored"
            - "data.intake_user_id == \"u-intake-1\" — taken from X-User-ID, not from the body"
            - "data.version == 1 — the supplied 99 is ignored"
            - "data.tolled_seconds == 0, data.extension_applied == false, data.page_count_total == 0, data.penalty_exposure_cents == 0"

      - name: invoice_line_is_immutable_with_no_version_and_no_write_route
        claim_type: immutability
        grounds:
          - entities.InvoiceLine
          - endpoints.GET_/roi/invoices/{id}/lines
        distinguishing_aspect: >
          InvoiceLine is declared common_fields false, so its rows carry no version
          and no updated_at, §1.5 declares no PATCH/PUT/DELETE route for them, and
          the only way a line changes is by voiding the parent invoice and building
          a new one.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester with a VALID authorization."
            - "One THIRD_PARTY SECURE_PORTAL request walked to RELEASE_READY with a single 25-page GENERAL_MEDICAL segment, then invoiced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["GENERAL_MEDICAL"], date_range_start: "2024-01-01", date_range_end: "2024-12-31", delivery_format: "SECURE_PORTAL" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq: $.data.id }
            - call: "POST /roi/requests/${rq}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
            - call: "POST /roi/record-segments"
              payload: { request_id: "${rq}", source_system: "EHR_CURRENT", category: "GENERAL_MEDICAL" }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
              captures: { seg: $.data.id }
            - call: "POST /roi/record-segments/${seg}/disposition"
              payload: { disposition: "RETRIEVED", page_count: 25 }
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq}/complete-compilation"
              payload: {}
              as: RecordsAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /roi/requests/${rq}/sensitive-review"
              payload: { segment_decisions: [] }
              as: ReleaseReviewer
              as_user_id: "u-review-1"
            - call: "GET /roi/requests/${rq}"
              payload: {}
              as: BillingClerk
              as_user_id: "u-bill-1"
