            - "CustomerContract.${contract2_id}.disruption_liability_cents == 2250000"
            - "CustomerContract.${contract2_id}.disruption_liability_variant == SETTLED_ACTUAL"
            - "CustomerContract.${contract2_id}.status == ACTIVE"
            - "RevocationProceeding.${proc2_id}.status == CURED"
            - "OperatingAuthority.${auth2_id}.authority_status == ACTIVE and OperatingAuthority.${auth2_id}.suspension_reason == NONE"
            - "Shipment.${ship2_id}.status == IN_TRANSIT and Shipment.${ship2_id}.embargo_days_accrued == 4"

  - rule_id: combinatorial_formula
    instances:
      - name: insurance_minimums_nested_max_and_multistate_uplift
        grounds:
          - calculations.required_insurance_minimums
          - entities.AuthorityApplication.fields.required_bipd_limit_cents
          - entities.AuthorityApplication.fields.required_cargo_limit_cents
          - entities.AuthorityApplication.fields.required_bond_limit_cents
        distinguishing_aspect: |
          Mode (a): four inputs interact non-separably — transportation_type
          PASSENGER selects a seating-capacity branch (15 <= 15 picks the small
          bracket 150000000, not the large 500000000), the hazmat flag would have
          replaced that base via max() had it been set, and the 26-state footprint
          adds the 25000000 uplift only because the branch base is non-zero,
          yielding 175000000 — a figure no single input determines.
        test_recipe:
          setup:
            - "one carrier domiciled in TX, empty of applications"
            - "logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Big Bend Motorcoach Inc", domicile_state: "TX", self_reported_vehicle_count: 18, self_reported_driver_count: 30, self_reported_oos_rate_pct: 6.0 }
              as: RegistryAdmin
              captures: { carrier3_id: $.data.id }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier3_id}", application_kind: "NEW", transportation_type: "PASSENGER", requested_operating_states: ["TX", "OK", "NM", "AZ", "CA", "NV", "UT", "CO", "KS", "MO", "AR", "LA", "MS", "AL", "GA", "FL", "TN", "KY", "IL", "IN", "OH", "MI", "WI", "IA", "NE", "SD"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false, passenger_seating_capacity: 15 }
              as: CarrierRep
              as_user_id: "${carrier3_id}"
              captures: { app3_id: $.data.id }
          assert:
            - "AuthorityApplication.${app3_id}.required_bipd_limit_cents == 175000000"
            - "AuthorityApplication.${app3_id}.required_cargo_limit_cents == 0"
            - "AuthorityApplication.${app3_id}.required_bond_limit_cents == 0"
            - "an otherwise identical application with passenger_seating_capacity 16 would yield 525000000, and one with 24 requested states would yield 150000000 — neither factor is separable"
            - "AuthorityApplication.${app3_id}.filing_fee_cents == 84258"
            - "AuthorityApplication.${app3_id}.status == DRAFT and AuthorityApplication.${app3_id}.submission_count == 0"

      - name: filing_fee_per_line_rounding_precedes_summation
        grounds:
          - calculations.filing_fee_assessment
          - entities.AuthorityApplication.fields.filing_fee_breakdown
          - entities.AuthorityApplication.fields.filing_fee_cents
          - state_machines.AuthorityApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER is observable. Household-goods
          authority for 3 states rounds four surcharged lines to 32175 + 441 +
          48263 + 0 = 80879 cents, whereas summing the unrounded lines
          (32175.00 + 441.4425 + 48263.25 + 0) and rounding once gives 80878 — the
          frozen debit distinguishes the two orders by exactly one cent.
        test_recipe:
          setup:
            - "one carrier domiciled in OK with a DRAFT household-goods application for OK/TX/AR"
            - "the carrier's fee ledger is empty and fee_balance_cents is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Sooner Household Movers LLC", domicile_state: "OK", self_reported_vehicle_count: 12, self_reported_driver_count: 15, self_reported_oos_rate_pct: 3.0 }
              as: RegistryAdmin
              captures: { carrier4_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${carrier4_id}", application_kind: "NEW", transportation_type: "HOUSEHOLD_GOODS", requested_operating_states: ["OK", "TX", "AR"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${carrier4_id}"
              captures: { app4_id: $.data.id }
          trigger:
            - call: "POST /authority-applications/${app4_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier4_id}"
          assert:
            - "AuthorityApplication.${app4_id}.filing_fee_cents == 80879"
            - "AuthorityApplication.${app4_id}.filing_fee_breakdown.line_docket_cents == 32175"
            - "AuthorityApplication.${app4_id}.filing_fee_breakdown.line_states_cents == 441"
            - "AuthorityApplication.${app4_id}.filing_fee_breakdown.line_type_cents == 48263"
            - "AuthorityApplication.${app4_id}.filing_fee_breakdown.line_hazmat_cents == 0"
            - "the four breakdown lines sum to filing_fee_cents exactly (80879), so a sum-then-round implementation producing 80878 fails"
            - "AuthorityApplication.${app4_id}.required_cargo_limit_cents == 1000000 and required_bipd_limit_cents == 75000000"
            - "Carrier.${carrier4_id}.fees_assessed_total_cents == 80879 and Carrier.${carrier4_id}.fee_balance_cents == 80879"
            - "exactly one FeeLedgerEntry exists for ${carrier4_id}, with entry_type == FILING_FEE_DEBIT and amount_cents == 80879"

      - name: settled_liability_waiver_tier_keyed_on_pre_waiver_subtotal
        grounds:
          - calculations.contract_disruption_liability
          - entities.CustomerContract.fields.embargoed_shipment_count
          - state_machines.CustomerContract.SUSPENDED_BY_AUTHORITY_to_ACTIVE
          - state_machines.Shipment.EMBARGOED_to_IN_TRANSIT
        distinguishing_aspect: |
          Mode (c): the pinned evaluation order is observable. Ten embargo days
          give a base of 4500000 and two embargoed shipments add 900000, so the
          pre-waiver subtotal 5400000 crosses the 5000000 goodwill tier and the
          10% waiver of 540000 applies, settling at 4860000 — an implementation
          that tests the tier against the base alone (4500000 < 5000000) skips the
          waiver and reports 5400000 instead.
        test_recipe:
          setup:
            - "one ACTIVE FOR_HIRE_PROPERTY authority for TX/OK/NM with one ACTIVE contract committing 90000000 cents/month through 2026-12-31"
            - "two shipments tendered on 2026-09-02, both departed and IN_TRANSIT"
            - "the BIPD filing is cancelled on 2026-09-10, embargoing both shipments; a replacement is filed on 2026-09-20 and cured the same day (10 elapsed days)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Red River Carriers Inc", domicile_state: "TX", self_reported_vehicle_count: 40, self_reported_driver_count: 60, self_reported_oos_rate_pct: 12.5 }
              as: RegistryAdmin
              captures: { carrier5_id: $.data.id }
            - call: "POST /process-agents"
