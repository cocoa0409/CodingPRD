            - { call: "POST /api/tracks/${trk_m}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_m}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_m}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/tracks/${trk_m}/advance-stage", payload: {}, as: AnRManager }
            - { call: "POST /api/contracts/${contract_m}/releases", payload: { project_id: "${proj_m}", title: "R-M", release_type: "SINGLE", release_date: "2026-09-01", track_ids: ["${trk_m}"] }, as: AnRManager, captures: { rel_m: $.data.id } }
            - { call: "POST /api/releases/${rel_m}/assemble", payload: {}, as: AnRManager }
            - { call: "POST /api/releases/${rel_m}/lock-assets", payload: { cover_art_confirmed: true }, as: AnRManager }
            - { call: "POST /api/releases/${rel_m}/schedule", payload: {}, as: MarketingManager }
            - { call: "POST /api/distributors", payload: { label_id: "${label_id}", name: "DSP-D", channel_type: "DSP" }, as: LabelAdmin, captures: { dist_id: $.data.id } }
            - { call: "POST /api/releases/${rel_m}/deliveries", payload: { distributor_ids: ["${dist_id}"] }, as: MarketingManager, captures: { del_m: "$.data[0].id" } }
            - { call: "POST /api/asset-deliveries/${del_m}/transmit", payload: {}, as: MarketingManager }
