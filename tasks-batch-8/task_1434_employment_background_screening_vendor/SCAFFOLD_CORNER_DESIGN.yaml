        distinguishing_aspect: "Version-pinning on approval: after the ACTIVE matrix M1 is retired and replaced by M2 (which would CLEAR the finding), re-evaluation on dispute-AMENDED still uses the PINNED M1 — recommended_outcome stays ADVERSE_ELIGIBLE."
