      - name: claim_create_in_distributing_case_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CASE_NOT_ACTIVE]"]
        distinguishing_aspect: "Claim intake closes once the case leaves ACTIVE: filing a claim while the case is DISTRIBUTING fails with ERR_CASE_NOT_ACTIVE (state gate fires before the temporal bar-date check, which would pass at the default clock)."
