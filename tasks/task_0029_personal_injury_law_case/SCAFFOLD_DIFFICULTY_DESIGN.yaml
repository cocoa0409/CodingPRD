              as: ManagingPartner
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_STATUTE_EXPIRED'"

      - name: demand_letter_with_zero_included_damages_yields_zero
        grounds:
          - calculations.demand_letter_amount
          - entities.DemandLetter.fields.demand_amount_cents
          - entities.Case.fields.included_damages_total_cents
          - endpoints[POST /demand-letters]
        distinguishing_aspect: |
          When the INCLUDED damages set on the case is EMPTY (zero DamagesItems in
          status INCLUDED), demand_letter_amount must produce demand_amount_cents=0,
