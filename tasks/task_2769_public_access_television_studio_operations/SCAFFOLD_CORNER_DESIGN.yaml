          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Grading is only defined from ATTENDED: calling grade while the enrollment is still ENROLLED returns ERR_INVALID_STATE_TRANSITION (409) and leaves practical_score null, so no certification can be short-circuited by skipping attendance."
