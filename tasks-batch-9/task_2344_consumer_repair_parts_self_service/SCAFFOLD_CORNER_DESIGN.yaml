          - roles.FailureAnalysisEngineer.shared_operations
          - roles.ProgramAdmin.exclusive_operations
          - validations[priority=8]
        distinguishing_aspect: |
          Three consecutive hops of one workflow belong to three different role
          sets — receive is admin-only, analysis is engineer-only, and only the
          credit decision is shared — so no single role can walk a return case from
          arrival to payout.
        test_recipe:
          setup:
            - "Empty database; the role gate at priority 8 answers before the case lookup at priority 20."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/defective-returns/aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa/analysis"
              payload: { root_cause_code: "MANUFACTURING_DEFECT", defect_confirmed: true, analysis_note: "solder void" }
