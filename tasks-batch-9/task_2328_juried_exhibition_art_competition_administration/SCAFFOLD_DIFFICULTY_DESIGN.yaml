    instances:
      - name: promotion_requires_exhibition_before_on_view
        grounds:
          - state_machines.Artwork[axis=status].WAITLISTED_to_ACCEPTED
          - validations[priority=8]
          - errors[ERR_EXHIBITION_PHASE_INVALID]
          - endpoints[POST /artworks/{id}/promotion]
          - calculations.acceptance_list_determination
