            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C47", name: "Corner Unit Fortyseven", observation_cost_budget_cents: 250000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { u47: $.data.id }
