scaffold_corner_design:

  # =========================================================================
  # Entities: creation, retrieval, listing, required fields, defaults
  # =========================================================================
  - section: entities
    instances:

      - name: create_client_success_with_required_fields
        claim_type: creation
        grounds:
          - entities.Client.fields.name
          - entities.Client.fields.headcount
        distinguishing_aspect: "POST /clients with name+headcount produces a Client (201) with server-minted id, version=1, and credit_balance_cents defaulting to 0."
        test_recipe:
          setup:
            - "empty DB, no prior Clients"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "NewCo", headcount: 25 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version", credit: "$.data.credit_balance_cents", active_sub: "$.data.active_subscription_id" }
          assert:
            - "client_v == 1"
            - "credit == 0"
            - "active_sub == null"

      - name: get_client_by_id_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.Client
        distinguishing_aspect: "GET /clients/{id} returns the same fields the create call stamped."
        test_recipe:
          setup:
            - "one Client created via POST /clients"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "GetCo", headcount: 7 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "GET /clients/${client_id}"
              payload: {}
              as: PlatformAdmin
              captures: { got_name: "$.data.name", got_headcount: "$.data.headcount" }
          assert:
            - "got_name == 'GetCo'"
            - "got_headcount == 7"

      - name: client_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_CLIENT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_CLIENT_NOT_FOUND'"

      - name: subscription_defaults_status_draft_on_create
        claim_type: defaults
        grounds:
          - entities.Subscription.fields.status
        distinguishing_aspect: "New Subscription defaults to status=DRAFT (initial state of the state machine)."
        test_recipe:
          setup:
            - "Plan and Client exist"
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "T-DEF", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "DefCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
          trigger:
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { st: "$.data.status" }
          assert:
            - "st == 'DRAFT'"

      - name: product_dietary_flags_default_empty_array
        claim_type: defaults
        grounds:
          - entities.Product.fields.dietary_flags
        distinguishing_aspect: "Omitting dietary_flags in POST /products yields an empty array."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "PLN", name: "Plain", category: "SNACK", unit_cost_cents: 50 }
              as: PlatformAdmin
              captures: { flags: "$.data.dietary_flags" }
          assert:
            - "flags == []"

      - name: system_fields_id_and_created_at_stamped
        claim_type: system_fields
        grounds:
          - entities.Client
        distinguishing_aspect: "id (UUID without prefix) and created_at (ISO 8601) are server-stamped on create; not accepted from input."
        test_recipe:
          setup:
            - "clock set to a known time"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients"
              payload: { name: "SysFields", headcount: 3 }
              as: PlatformAdmin
              captures: { cid: "$.data.id", stamp: "$.data.created_at" }
          assert:
            - "cid != null"
            - "stamp == '2026-05-10T09:30:00.000Z'"

  # =========================================================================
  # State machines: initial states, invalid transitions, conditional cascade
  # =========================================================================
  - section: state_machines
    instances:

      - name: cancel_from_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription.terminal_states
        distinguishing_aspect: "Once Subscription.status is CANCELLED, POST /subscriptions/{id}/cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Subscription in CANCELLED state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "C-1", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "CancelCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P1", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: activate_already_active_subscription_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription.DRAFT_to_ACTIVE
        distinguishing_aspect: "POST /subscriptions/{id}/activate on an already-ACTIVE subscription returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "ACTIVE Subscription"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "A-1", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "ActCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P1", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: dispute_after_48h_window_closed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Delivery.DELIVERED_to_DISPUTED
        distinguishing_aspect: "POST /deliveries/{id}/dispute after clock.now >= delivered_at + 48h returns ERR_INVALID_STATE (window closed)."
        test_recipe:
          setup:
            - "DELIVERED Delivery whose delivered_at was more than 48h ago"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "W-1", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "WinCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P1", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T10:00:00Z" }
              as: PlatformAdmin
              captures: { delv_id: "$.data.id" }
            - call: "POST /deliveries/${delv_id}/dispatch"
              payload: {}
              as: PlatformAdmin
            - call: "POST /deliveries/${delv_id}/confirm"
              payload: {}
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /deliveries/${delv_id}/dispute"
              payload: { dispute_reason: "too late" }
              as: LocationManager
              as_user_id: "${loc_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: cascade_only_cancels_non_terminal_deliveries_on_pause
        claim_type: conditional_cascade
        grounds:
          - state_machines.RotationCycle.OPEN_to_INVALIDATED
        distinguishing_aspect: "Pause cascade only cancels Deliveries whose status is SCHEDULED or EN_ROUTE. A DELIVERED delivery (terminal-for-cascade) is untouched."
        test_recipe:
          setup:
            - "ACTIVE Sub with one DELIVERED Delivery (not disputed yet) and one SCHEDULED Delivery under the same OPEN RC (different Locations for the 24h buffer rule)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "PP", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "PPC", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L1", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc1_id: "$.data.id" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L2", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc2_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P-CC", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc1_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc1_id}"
            - call: "POST /locations/${loc2_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc2_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc1_id}", scheduled_at: "2026-06-01T10:00:00Z" }
              as: PlatformAdmin
              captures: { delv_delivered_id: "$.data.id" }
            - call: "POST /deliveries/${delv_delivered_id}/dispatch"
              payload: {}
              as: PlatformAdmin
            - call: "POST /deliveries/${delv_delivered_id}/confirm"
              payload: {}
              as: LocationManager
              as_user_id: "${loc1_id}"
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc2_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: PlatformAdmin
              captures: { delv_scheduled_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "GET /deliveries/${delv_delivered_id}"
              payload: {}
              as: PlatformAdmin
              captures: { st_delivered: "$.data.status" }
            - call: "GET /deliveries/${delv_scheduled_id}"
              payload: {}
              as: PlatformAdmin
              captures: { st_scheduled: "$.data.status" }
          assert:
            - "st_delivered == 'DELIVERED'"
            - "st_scheduled == 'CANCELLED'"

  # =========================================================================
  # Calculations: correct results, input filters, precision
  # =========================================================================
  - section: calculations
    instances:

      - name: subscription_fee_flat_ignores_headcount
        claim_type: correct_result
        grounds:
          - calculations.subscription_fee
          - entities.Plan.fields.billing_type
        distinguishing_aspect: "billing_type=FLAT branch: subscription_fee_cents == flat_fee_cents regardless of client.headcount."
        test_recipe:
          setup:
            - "Plan FLAT flat_fee=8888; Client headcount=1000 (irrelevant); ACTIVE Sub with OPEN RC past effective_to"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "FL", billing_type: "FLAT", flat_fee_cents: 8888, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "Big", headcount: 1000 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P1", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { fee: "$.data.subscription_fee_cents", tot: "$.data.total_cents" }
          assert:
            - "fee == 8888"
            - "tot == 8888"

      - name: subscription_fee_below_threshold_no_discount
        claim_type: threshold_boundary
        grounds:
          - calculations.subscription_fee
        distinguishing_aspect: "headcount = threshold-1 -> no discount fires (< threshold)."
        test_recipe:
          setup:
            - "Plan PER_EMPLOYEE base=1000, per_employee=200, threshold=50, discount=0.10; Client headcount=49"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "T-49", billing_type: "PER_EMPLOYEE", base_fee_cents: 1000, per_employee_fee_cents: 200, volume_discount_threshold_headcount: 50, volume_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "T49", headcount: 49 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P1", name: "P", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { fee: "$.data.subscription_fee_cents" }
          assert:
            # raw = 200 * 49 = 9800; no discount; fee = 1000 + 9800 = 10800
            - "fee == 10800"

      - name: delivery_charge_bulk_discount_boundary_at_100
        claim_type: threshold_boundary
        grounds:
          - calculations.delivery_provisional_charge
        distinguishing_aspect: "planned_units == BULK_UNITS_THRESHOLD (100) triggers the bulk 5% line discount (inclusive >=)."
        test_recipe:
          setup:
            - "MICRO_MARKET location, one ParLevel with par_units=100, price=50 cents/unit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "BK", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "BulkCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "MM", kind: "MICRO_MARKET", capacity_units: 200, service_fee_bps: 500 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "P-BK", name: "PB", category: "SNACK", unit_cost_cents: 50 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 100 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
