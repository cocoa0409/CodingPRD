          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust LA", customer_email: "la@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_la: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_la}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
