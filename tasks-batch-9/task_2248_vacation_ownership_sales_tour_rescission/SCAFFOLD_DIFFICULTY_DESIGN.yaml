          Two rescinded agreements with byte-identical escrow_collected_cents 320000 and
          booking gift_value_cents 12500 disburse 320000 under STATUTORY_FULL (FL) and
          287600 under CONTRACTUAL_NET_OF_GIFT (TX) — a 32400 delta split as
          gift_recapture 12500 plus doc_fee 19900; this instance owns the
          WITHHOLDING-WATERFALL variant axis, not the anchor axis.
