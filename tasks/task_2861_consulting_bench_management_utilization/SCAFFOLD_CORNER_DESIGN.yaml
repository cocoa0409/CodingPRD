            - "${up_status} == \"CLOSED\" with HTTP 200 at clock 2026-08-29 — period_end_on 2026-08-28 is strictly before the clock by exactly one day, and ${up_over} == false"
            - "${up_of_record} == 0.00 (now the TARGET_BASIS variant, 100 * 0.00 / 160.00) with ${up_variance} == -75.00 and ${up_bench} == 160.00, so billable + investment + bench + holiday == capacity_hours holds exactly"

      - name: period_overlap_on_the_shared_endpoint_day
        claim_type: Temporal validation
        grounds:
          - validations[priority=27]
          - errors[ERR_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: boundary_precision_check / utilization_period_adjacent_start_day_is_an_overlap
          rationale: "That instance already creates a second period starting exactly on the first period's period_end_on and asserts ERR_PERIOD_OVERLAP, together with the one-day-later period that is accepted, so the INCLUSIVE-range semantics of priority 27 are fully pinned there."

      - name: allocation_capacity_at_and_beyond_one_hundred_percent
        claim_type: Aggregate validation
        grounds:
          - validations[priority=32]
          - errors[ERR_ALLOCATION_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / allocation_sum_exactly_100_confirms_then_next_percent_rejected
          rationale: "That instance confirms a stack of assignments summing to exactly 100.00 and then shows the next 1.00% confirm returning ERR_ALLOCATION_CAPACITY_EXCEEDED; a corner duplicate would add nothing beyond the same two calls."

      - name: firm_concurrency_on_the_closed_interval
        claim_type: Aggregate validation
        grounds:
          - validations[priority=31]
          - errors[ERR_FIRM_CONCURRENCY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / firm_placement_closed_interval_endpoint_day_collides
          rationale: "That instance drives max_concurrent_placements with two placements sharing a single endpoint day, which is the only way the CLOSED-interval convention of priority 31 differs from the Assignment convention, and it asserts ERR_FIRM_CONCURRENCY_EXCEEDED on the approve."

      - name: cohort_window_against_a_committed_assignment
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=28]
          - errors[ERR_COHORT_CONFLICTS_WITH_ASSIGNMENT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reskilling_cohort_versus_future_confirmed_assignment_interval
          rationale: "That instance pins both edges of priority 28 — an assignment ending exactly on cohort_start_on enrols successfully while one starting exactly on cohort_end_on returns ERR_COHORT_CONFLICTS_WITH_ASSIGNMENT — so the corner file only records the coverage."

      - name: constrained_posture_and_the_scarcity_carve_out
        claim_type: Conditional validation
        grounds:
          - validations[priority=43]
          - errors[ERR_PRACTICE_POSTURE_CONSTRAINED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / external_placement_gated_by_group_posture_with_skill_scarcity_carveout
          rationale: "That instance holds a group at CONSTRAINED and flips only the required Skill's scarcity_index across 0.7000, showing ERR_PRACTICE_POSTURE_CONSTRAINED below the threshold and a successful placement at or above it; the FROZEN sibling rule is covered here in frozen_posture_blocks_creation_while_the_cap_blocks_approval."

