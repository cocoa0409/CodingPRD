      - name: custody_transfer_gates
        claim_type: Violation to Error
        grounds: ["errors[ERR_UNIT_QUARANTINED]", "errors[ERR_SELF_TRANSFER]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Custody transfers are refused when the unit is QUARANTINED (409), when sender == receiver (422 ERR_SELF_TRANSFER), and when the actor is not the current custodian (403 ERR_FORBIDDEN_OWNERSHIP)."
