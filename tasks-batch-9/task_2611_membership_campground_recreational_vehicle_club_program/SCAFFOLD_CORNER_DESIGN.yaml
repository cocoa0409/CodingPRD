              as_user_id: "clubadmin-hq-1"
              captures: { cp_admin_id: "$.data.id", cp_admin_status: "$.data.status" }
            - call: "POST /capital-projects"
              payload: { park_id: "${park_sc_id}", title: "Sable Creek pull-through expansion", category: "EXPANSION", requested_cost_cents: 2500000, fiscal_year: 2027 }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { cp_manager_id: "$.data.id", cp_manager_status: "$.data.status" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_version_pre: "$.data.version" }
          trigger:
            - call: "POST /transfer-requests/${tr_dw_id}/decision"
              payload: { decision: "APPROVE" }
              as: ClubAdmin
              as_user_id: "${member_dw_id}"
              captures: { self_decided_transfer_error_id: "$.data.error_id" }
            - call: "POST /transfer-requests/${tr_dw_id}/decision"
              payload: { decision: "APPROVE" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { tr_dw_status_approved: "$.data.status", tr_dw_successor: "$.data.successor_membership_id" }
            - call: "POST /capital-projects/${cp_admin_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_pre}" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { self_decided_project_error_id: "$.data.error_id" }
            - call: "POST /capital-projects/${cp_admin_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_pre}" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-2"
              captures: { cp_admin_status_decided: "$.data.status" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_version_mid: "$.data.version" }
            - call: "POST /capital-projects/${cp_manager_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_mid}" }
              as: ClubAdmin
              as_user_id: "${park_sc_id}"
              captures: { manager_self_decided_error_id: "$.data.error_id" }
            - call: "POST /capital-projects/${cp_manager_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_mid}" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { cp_manager_status_decided: "$.data.status" }
            - call: "GET /capital-projects/${cp_manager_id}"
              as: ClubAdmin
              captures: { cp_manager_decided_by: "$.data.decided_by_user_id" }
          assert:
            - "The member that submitted the transfer cannot decide it even when its X-User-ID arrives behind a ClubAdmin role header: HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES, and the request is still SUBMITTED afterwards"
            - "The same call from clubadmin-hq-1 succeeds: HTTP 200 with status APPROVED and a non-null successor_membership_id — the refusal was the identity collision, not the request state"
            - "clubadmin-hq-1 deciding the project it created itself: HTTP 403 ERR_SEGREGATION_OF_DUTIES"
            - "clubadmin-hq-2 deciding that same project with the same expected_park_version succeeds: HTTP 200 with status APPROVED — the refused attempt did not bump Park.version, so the previously read version is still fresh"
            - "The project proposed by the park manager cannot be decided by a ClubAdmin request carrying the park id as X-User-ID: HTTP 403 ERR_SEGREGATION_OF_DUTIES — the comparison is on X-User-ID values across the two calls and is blind to the role header attached to each"
            - "clubadmin-hq-1 then decides that project successfully (HTTP 200, APPROVED) and decided_by_user_id records clubadmin-hq-1, so the audit trail names the second party rather than the proposer"
            - "The park version read after the first approval (park_sc_version_mid) is greater than park_sc_version_pre, confirming an accepted decision does increment it while a refused one does not"
  - section: cross_cutting_complexity_layers
    instances:
      - name: transfer_submission_requires_the_membership_version_the_client_actually_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-request-create-stale-membership]
          - validations[priority=17]
          - errors[ERR_STALE_MEMBERSHIP_VERSION]
          - endpoints["POST /transfer-requests"]
        distinguishing_aspect: "The version is invalidated by a write on a completely different axis — a dues payment, not another transfer — which is exactly the scenario the rule exists for: a state precondition alone would have let the submission through because the membership is still ACTIVE and its dues are now CURRENT. The refused submission must not itself bump the version, so the follow-up call succeeds with the version read after the payment, and the three accepted writes must produce versions 1, 2 and 3 with no gaps."
        test_recipe:
          setup:
            - "One CLASSIC membership sold at clock 2026-08-01, its OPEN invoice of 45360 and a second member to receive the gift; the version observed at sale time is deliberately kept as the stale token"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /membership-tiers"
              payload: { code: "CLASSIC", name: "Classic Class", tier_rank: 1, upfront_cost_cents: 795000, annual_dues_cents: 42000, entitlement_nights_class_a: 0, entitlement_nights_class_b: 10, entitlement_nights_class_c: 18, annual_total_night_cap: 24, advance_window_days: 60, max_consecutive_stay_nights: 14, min_out_nights_between_stays: 3, affiliate_access_enabled: false, resale_allowed: false, transfer_fee_cents: 60000 }
              as: ClubAdmin
              captures: { tier_cls_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dana Whitlock", email: "dana.whitlock@example.com" }
              as: ClubAdmin
              captures: { member_dw_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Nathan Boyle", email: "nathan.boyle@example.com" }
              as: ClubAdmin
              captures: { member_nb_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${member_dw_id}", tier_id: "${tier_cls_id}", upfront_paid_cents: 795000 }
              as: ClubAdmin
              captures: { mem_dw_id: "$.data.id", mem_dw_version_stale: "$.data.version" }
            - call: "GET /memberships/${mem_dw_id}/dues-invoices"
              as: ClubAdmin
              captures: { inv_dw_id: "$.data[0].id" }
          trigger:
            - call: "POST /dues-invoices/${inv_dw_id}/payments"
              payload: { amount_cents: 45360 }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { inv_dw_status_paid: "$.data.status" }
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_dw_id}", to_member_id: "${member_nb_id}", transfer_type: "GIFT", expected_membership_version: "${mem_dw_version_stale}" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { stale_membership_error_id: "$.data.error_id" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_version_fresh: "$.data.version", mem_dw_status_mid: "$.data.membership_status", mem_dw_dues_mid: "$.data.dues_status" }
            - call: "POST /transfer-requests"
              payload: { membership_id: "${mem_dw_id}", to_member_id: "${member_nb_id}", transfer_type: "GIFT", expected_membership_version: "${mem_dw_version_fresh}" }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { tr_dw_id: "$.data.id", tr_dw_status: "$.data.status" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_version_final: "$.data.version", mem_dw_status_final: "$.data.membership_status" }
          assert:
            - "The membership is created at version 1 and the accepted dues payment moves it to version 2"
            - "Submitting the gift with the version read at sale time: HTTP 412 with error_id ERR_STALE_MEMBERSHIP_VERSION — the token is one behind even though nothing about the transfer itself is wrong"
            - "At the moment of refusal the membership is ACTIVE with dues_status CURRENT, so no state precondition would have blocked the write; only the version test does"
            - "The refused submission does not increment the version: the re-read still reports 2"
            - "Re-submitting with version 2 returns HTTP 201 with status SUBMITTED, and the membership moves ACTIVE -> TRANSFER_PENDING at version 3 — every accepted write increments by exactly 1"
      - name: capital_decision_requires_the_park_version_that_produced_the_score
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capital-project-decision-stale-park]
          - validations[priority=18]
          - errors[ERR_STALE_PARK_VERSION]
          - endpoints["POST /capital-projects/{id}/decision"]
        distinguishing_aspect: "The approver's view is invalidated by an amenity inspection, which is exactly the kind of write that re-scores every project at the park, so the stale token is not a bookkeeping formality: deciding on the old version would be deciding against a priority_score that no longer exists. The refused decision must leave the project PROPOSED and the park version untouched, and the stale-version test at priority 18 must be shown to outrank the segregation-of-duties test at priority 41 when both are violated by the same call."
        test_recipe:
          setup:
            - "One opened CLASS_C park and one PROPOSED SAFETY project created by the park's own manager; the park version is read immediately after the project is created and kept as the stale token"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /parks"
              payload: { name: "Sable Creek Campground", park_class: "CLASS_C", total_sites: 30, member_allocation_pct: 60, season_open_date: "2026-01-05", season_close_date: "2026-12-20" }
              as: ClubAdmin
              captures: { park_sc_id: "$.data.id" }
            - call: "POST /parks/${park_sc_id}/season-openings"
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { park_sc_status: "$.data.park_status" }
            - call: "POST /capital-projects"
              payload: { park_id: "${park_sc_id}", title: "Sable Creek bathhouse rebuild", category: "SAFETY", requested_cost_cents: 3000000, fiscal_year: 2027 }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { cp_sc_id: "$.data.id", cp_sc_status: "$.data.status", cp_sc_score_pre: "$.data.priority_score" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_version_stale: "$.data.version" }
          trigger:
            - call: "POST /parks/${park_sc_id}/amenity-inspections"
              payload: { restroom_score: 4.80, hookup_score: 4.60, utility_score: 4.40, road_score: 4.20 }
              as: ParkManager
              as_user_id: "${park_sc_id}"
              captures: { insp_sc_result: "$.data.result", insp_sc_score: "$.data.composite_score" }
            - call: "POST /capital-projects/${cp_sc_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_stale}" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { stale_park_error_id: "$.data.error_id" }
            - call: "POST /capital-projects/${cp_sc_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_stale}" }
              as: ClubAdmin
              as_user_id: "${park_sc_id}"
              captures: { stale_and_self_error_id: "$.data.error_id" }
            - call: "GET /capital-projects/${cp_sc_id}"
              as: ClubAdmin
              captures: { cp_sc_status_mid: "$.data.status", cp_sc_score_mid: "$.data.priority_score" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_version_fresh: "$.data.version" }
            - call: "POST /capital-projects/${cp_sc_id}/decision"
              payload: { decision: "APPROVE", expected_park_version: "${park_sc_version_fresh}" }
              as: ClubAdmin
              as_user_id: "clubadmin-hq-1"
              captures: { cp_sc_status_final: "$.data.status" }
            - call: "GET /parks/${park_sc_id}"
              as: ClubAdmin
              captures: { park_sc_version_final: "$.data.version" }
          assert:
            - "The inspection is accepted and increments Park.version, so the token read before it is now one behind"
            - "Deciding with the stale token: HTTP 412 with error_id ERR_STALE_PARK_VERSION"
            - "Deciding with the stale token AND the proposer's own X-User-ID: still HTTP 412 ERR_STALE_PARK_VERSION, not the priority-41 ERR_SEGREGATION_OF_DUTIES — priority 18 is evaluated first even though both rules are violated"
            - "After both refusals the project is still PROPOSED and Park.version is unchanged from the value read after the inspection — a rejected decision writes nothing"
            - "The project's priority_score was re-scored by the inspection, so cp_sc_score_mid differs from the value captured at creation: the stale view really would have decided against a superseded score"
            - "Deciding with the fresh version from a different X-User-ID: HTTP 200 with status APPROVED, and Park.version increments once more"
      - name: one_delinquency_sweep_lands_six_memberships_on_five_different_outcomes
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.dues_late_fee
          - calculations.dues_late_fee.constants.DUES_GRACE_START_DAYS
          - calculations.dues_late_fee.constants.DUES_DELINQUENT_DAYS
          - calculations.dues_late_fee.constants.DUES_WRITE_OFF_DAYS
