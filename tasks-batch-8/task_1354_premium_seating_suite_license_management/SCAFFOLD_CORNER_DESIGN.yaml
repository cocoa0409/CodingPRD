            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2027-28", starts_on: "2027-09-01T00:00:00Z", ends_on: "2028-02-15T00:00:00Z", renewal_window_opens_on: "2027-12-01T00:00:00Z", renewal_window_closes_on: "2028-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s2: $.data.id } }
            - { call: "POST /api/seasons/${s2}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "GET /api/invoices", payload: { agreement_id: "${ag}", invoice_type: "LICENSE_FEE" }, as: FinanceController, captures: { invl: "$.data[0].id" } }
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 12000000, method: ACH, allocations: [ { invoice_id: "${invl}", amount_cents: 12000000 } ] }, as: FinanceController, captures: { p0: $.data.id } }
            - { call: "POST /api/payments/${p0}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { agv: $.data.version } }
            - { call: "POST /api/renewal-offers", payload: { agreement_id: "${ag}", season_id: "${s2}", proposed_fee_cents: 12400000, proposed_escalator_bp: 300, proposed_term_seasons: 1, response_due_on: "2027-01-10T00:00:00Z", expected_agreement_version: "${agv}" }, as: PremiumSalesRep, captures: { ro: $.data.id } }
            - { call: "POST /api/renewal-offers/${ro}/set_status", payload: { target_status: "ACCEPTED" }, as: AccountHolder, as_user_id: "${ac}" }
