            - call: "POST /menu-boards/${b3}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards/${b3}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "THIRD_PARTY_DELIVERY", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
