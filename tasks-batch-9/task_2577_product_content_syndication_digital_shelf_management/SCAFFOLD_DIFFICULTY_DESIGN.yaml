              as: SyndicationOperator
              captures: { job1_id: $.data.id }
            - call: "GET /digital-shelf/retailers/${rb_id}"
              payload: {}
              as: SyndicationOperator
              captures: { reserved_after_queue: $.data.feed_slots_reserved, rb_v2: $.data.version }
            - call: "POST /digital-shelf/syndication-jobs/${job1_id}/cancel"
              payload: {}
              as: SyndicationOperator
              captures: { job1_state: $.data.state }
            - call: "GET /digital-shelf/retailers/${rb_id}"
              payload: {}
              as: SyndicationOperator
              captures: { reserved_after_cancel: $.data.feed_slots_reserved, rb_v3: $.data.version }
            - call: "POST /digital-shelf/syndication-jobs"
              payload: { retailer_listing_id: "${lb_id}", content_version_id: "${vb1_id}", slot_count: 10, window_start: "2026-08-25T00:00:00Z", window_end: "2026-08-26T00:00:00Z", expected_retailer_version: "${rb_v3}" }
              as: SyndicationOperator
              captures: { job2_id: $.data.id, job2_state: $.data.state }
          assert:
            - "${reserved_after_queue} == 6 and ${rb_v2} == 2"
            - "${job1_state} == \"CANCELLED\""
            - "${reserved_after_cancel} == 0 and ${rb_v3} == 3 — the reservation is fully released while the OCC version still advances"
            - "${job2_state} == \"QUEUED\" — the 10-slot queue proves zero drift: with any leaked slot 0 + 10 > 10 would have raised ERR_FEED_CAPACITY_EXCEEDED"
            - "Retailer.${rb_id}.feed_slots_reserved == 10 and Retailer.${rb_id}.version == 4"
            - "SyndicationJob.${job1_id}.state == \"CANCELLED\" and SyndicationJob.${job1_id}.slot_count == 6 — the cancelled job keeps its slot_count, it just leaves the ledger's input set"
            - "RetailerListing.${lb_id}.syndication_state == \"PENDING\" and readiness_score == 51.00"

      - name: pin_reference_ledger_returns_after_a_live_deployment_is_withdrawn
        grounds:
          - calculations.version_pin_reference_ledger
          - state_machines.EnhancedContentDeployment.LIVE_to_WITHDRAWN
          - entities.ContentVersion.fields.pin_count
          - calculations.retailer_readiness_score
        distinguishing_aspect: |
          Creating the deployment adds a second reference to the pinned revision (pin_count 1 -> 2) and
          the LIVE state adds LIVE_ENHANCED_BONUS (60.00 -> 65.00); withdrawing it must reverse both
          exactly, leaving pin_count 1 and readiness 60.00. A WITHDRAWN deployment that still counted
          would leave pin_count at 2, and a bonus applied by deployment existence rather than by state
          would leave readiness at 65.00.
        test_recipe:
          setup:
            - "Retailer SimpleMart is ACTIVE with min_image_count 1, feed_slot_capacity 10, enhanced_content_requires_approval false and a single REQUIRED requirement row title (weight 40), so D == 40 + IMAGE_WEIGHT 20 == 60"
            - "product SKU-D-1 has one APPROVED HERO_IMAGE asset and revision 1 PINNED on the SimpleMart listing through an APPROVED ChangeRequest, so completeness_score_certified == 100.00, completeness_score_declared == 100.00 and readiness_score == 60.00"
            - "ContentVersion revision 1 has pin_count 1 (the single listing reference), Product.status is ACTIVE and Product.last_pinned_at == 2026-08-10T00:00:00Z"
            - "the listing is syndication_state NOT_SYNDICATED / shelf_state OK with no deployment and no observation; the logical clock stands at 2026-08-10T00:00:00Z"
            - "because enhanced_content_requires_approval is false, a new deployment lands directly in LIVE and immediately earns the bonus"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: false }
              as: ShelfAdmin
              captures: { rd_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rd_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-D-1", gtin: "00012345678936", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pd_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", account_team_user_id: "acct_simplemart_1" }
              as: ContentAuthor
              captures: { ld_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pd_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/d/hero.jpg" }
              as: ContentAuthor
              captures: { md1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${md1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rd_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pd_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vd1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vd1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pd_id}", retailer_id: "${rd_id}", target_content_version_id: "${vd1_id}", rationale: "pin revision 1 on SimpleMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crd_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crd_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pd_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pd_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pd_v2: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crd_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pd_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
          trigger:
            - call: "GET /digital-shelf/retailer-listings/${ld_id}"
              payload: {}
              as: ContentAuthor
              captures: { ld_v1: $.data.version }
            - call: "POST /digital-shelf/enhanced-deployments"
              payload: { retailer_listing_id: "${ld_id}", change_request_id: "${crd_id}", media_asset_id: "${md1_id}", module_kind: "VIDEO_BLOCK", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-22T00:00:00Z", expected_retailer_listing_version: "${ld_v1}" }
              as: ContentAuthor
              captures: { dep_id: $.data.id, dep_state: $.data.state }
            - call: "GET /digital-shelf/content-versions/${vd1_id}"
              payload: {}
              as: ContentAuthor
              captures: { pin_after_create: $.data.pin_count }
            - call: "GET /digital-shelf/retailer-listings/${ld_id}"
              payload: {}
              as: ContentAuthor
              captures: { ready_after_create: $.data.readiness_score }
            - call: "POST /digital-shelf/enhanced-deployments/${dep_id}/withdraw"
              payload: { withdrawn_reason: "module pulled at the brand's request" }
              as: ContentAuthor
              captures: { dep_state_2: $.data.state, dep_reason: $.data.withdrawn_reason }
          assert:
            - "${dep_state} == \"LIVE\" — the flag-false branch skips PENDING_RETAILER_APPROVAL"
            - "${pin_after_create} == 2 and ${ready_after_create} == 65.00 — the deployment adds one pin reference and LIVE_ENHANCED_BONUS 5"
            - "${dep_state_2} == \"WITHDRAWN\" and ${dep_reason} == \"module pulled at the brand's request\""
            - "ContentVersion.${vd1_id}.pin_count == 1 — back to the single listing reference, no drift"
            - "RetailerListing.${ld_id}.readiness_score == 60.00 — the bonus is reversed"
            - "EnhancedContentDeployment.${dep_id}.window_start == \"2026-08-20T00:00:00Z\" and window_end == \"2026-08-22T00:00:00Z\" — the window is retained on the withdrawn row but no longer blocks the calendar"
            - "Product.${pd_id}.shelf_health_index == 0.00 — the listing is NOT_SYNDICATED, so no deployment change can put it into the health input set"
