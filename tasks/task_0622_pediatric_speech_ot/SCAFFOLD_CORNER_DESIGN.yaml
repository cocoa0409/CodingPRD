      - name: derived_caseload_increments_on_activation
        claim_type: derived_field_reconciliation
        grounds: [entities.Therapist.fields.current_caseload, state_machines.PlanOfCare.DRAFT_to_ACTIVE]
        distinguishing_aspect: "Therapist.current_caseload reads 0 before plan activation and 1 immediately after, reconciled with the count of ACTIVE plans naming the therapist."
