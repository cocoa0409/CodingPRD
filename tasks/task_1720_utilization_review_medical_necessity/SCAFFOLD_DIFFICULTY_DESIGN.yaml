  - rule_id: cross_entity_state_dependency
    instances:
      - name: concurrent_review_requires_auth_approved
        grounds:
          - state_machines.ConcurrentReview
          - state_machines.AuthorizationRequest.SUBMITTED_to_APPROVED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair ConcurrentReview -> AuthorizationRequest: review creation is rejected while the parent authorization is SUBMITTED (ERR_INVALID_STATE) and succeeds only after the APPROVED transition; the due-date anchor is the approval decided_at.
        test_recipe:
          setup:
            - "Medicare case; one authorization request created but undecided at logical time 2026-08-02T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-CE1", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/concurrent-reviews"
              payload: { clinical_update: "Day 2: still on IV diuresis, net negative 1.5L.", requested_additional_day_count: 2 }
              as: URNurse
              captures: { err: $.data.error_id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/concurrent-reviews"
              payload: { clinical_update: "Day 2: still on IV diuresis, net negative 1.5L.", requested_additional_day_count: 2 }
              as: URNurse
              captures: { cr_id: $.data.id }
          assert:
            - "While auth is SUBMITTED the create fails: error_id == ERR_INVALID_STATE with http 409"
            - "After approval the create succeeds: ConcurrentReview.${cr_id}.status == SUBMITTED and sequence_index == 1"
            - "ConcurrentReview.${cr_id}.review_due_at == 2026-08-04T12:00:00Z (approval decided_at 2026-08-02T12:00:00Z + 48h cadence)"

      - name: cc44_requires_latest_review_not_met
        grounds:
          - validations[priority=25]
          - state_machines.AdmissionReview.DRAFT_to_SUBMITTED
          - entities.ConditionCode44Request.fields.status
        distinguishing_aspect: |
          Entity pair ConditionCode44Request -> AdmissionReview: CC44 creation is rejected while the case's latest submitted review is CRITERIA_MET and succeeds once a later review lands CRITERIA_NOT_MET — the gate reads a different entity's computed state.
        test_recipe:
          setup:
            - "Medicare INPATIENT case with one submitted review scoring 98 (CRITERIA_MET)"
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-CE2", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
