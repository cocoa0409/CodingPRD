          assert:
            - "${p7_considered} == 6 — the window is capped at ROLLING_WINDOW_SIZE even though seven terminal rows exist"
            - "${p7_score} == 0.00 and ${p7_tier} == 'STANDARD' — the only NO_SHOW is the oldest row and falls outside the window"
            - "A seven-row window (weights 100..10, total_w 385) would have reported 2.60, so 0.00 proves the cap"
            - "The window is chosen by service_date DESC, not by created_at: ${ap7_oldest} was injected LAST yet is still the row excluded"
