      - name: corner_entity_foreign_key_integrity_body_fks_resolve_before_business_rules
        claim_type: foreign_key_integrity
        grounds:
          - validations[ERR_RATE_SCHEDULE_NOT_FOUND]
          - validations[ERR_SERVICE_ACCOUNT_NOT_FOUND]
          - validations[ERR_METER_READING_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so cross-reference integrity rests entirely on the priority-5
          body-FK sweep: an unknown rate_schedule_id, an unknown account_id and an unknown
          corrects_reading_id each return the 404 named for the missing entity, and the sweep runs
          left to right over the endpoint's input list — a body with BOTH an unknown meter_id and
          an unknown corrects_reading_id reports ERR_METER_NOT_FOUND, because meter_id appears
          first in the input list.
        test_recipe:
          setup:
            - "RS-STD-2026 and ServiceAccount ACC-2011 with master meter MTR-K-1 exist; no MeterReading exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
