              as: Underwriter
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Three Control Yard", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js_mid: $.data.id }
            - call: "POST /inland-marine/jobsites/${js_mid}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Tracker Trench Works", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Untracked excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", assigned_jobsite_id: "${js_low}", expected_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Untracked excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
