      - name: a_request_without_a_role_header_is_unauthenticated
        claim_type: unauthenticated_rejected
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 sits above the role check, so a request with no X-User-Role header at all is a 401 and not a 403 — even when the same call would also have failed the role check, the body schema and the path existence."
        test_recipe:
          setup:
            - "One real outage exists so that the 404 rung cannot be blamed."
            - "The trigger calls are sent with the X-User-Role header omitted entirely; the notation as: HEADER_OMITTED marks that absence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "GET /outages/${o_id}"
              payload: {}
              as: HEADER_OMITTED
              captures: { e_read: "$.data.error_id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: HEADER_OMITTED
              captures: { e_write: "$.data.error_id" }
            - call: "GET /outages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HEADER_OMITTED
              captures: { e_unknown: "$.data.error_id" }
          assert:
            - "${e_read} == ERR_UNAUTHENTICATED with HTTP 401 — even a read demands the header"
            - "${e_write} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_UNAUTHORIZED"
            - "${e_unknown} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_OUTAGE_NOT_FOUND — priority 1 outranks priority 3"
            - "Outage.${o_id}.status is still PLANNING"

