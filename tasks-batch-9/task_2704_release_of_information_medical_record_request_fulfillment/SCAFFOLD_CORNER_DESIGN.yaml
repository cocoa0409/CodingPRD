      - name: corner_invoice_line_rounding_precision
        claim_type: precision
        grounds:
          - calculations.invoice_line_build.evaluation_order_is_load_bearing
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_lines_round_per_line_then_sum_to_4501
          rationale: "Per-line round_half_up versus sum-then-round is pinned there by the 1-cent difference between 4501 and 4500."

      - name: corner_tiered_pricing_tier_boundary
        claim_type: correct_result
        grounds:
          - calculations.invoice_line_build.variants.THIRD_PARTY_RETAIL
        excluded_because:
          difficulty_instance: boundary_precision_check / page_tier_boundary_at_exact_tier1_limit
          rationale: "Pages at tier1_page_limit - 1, exactly at the limit and at the limit + 1 are all priced there, including the marginal 13-cent step."

      - name: corner_invoice_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.invoice_line_build.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_variant_divergence_third_party_retail_vs_patient_access_cost_based
          rationale: "Both variants are priced over identical page data there and the delta is asserted explicitly."

      - name: corner_statutory_due_at_composition
        claim_type: correct_result
        grounds:
          - calculations.statutory_due_at
        excluded_because:
          difficulty_instance: combinatorial_formula / statutory_due_at_composes_anchor_toll_and_extension
          rationale: "Anchor selection, tolling and the extension are composed in one formula there and each factor is perturbed independently."

      - name: corner_interval_adjacency_on_legacy_windows
        claim_type: correct_result
        grounds:
          - validations.priority_32
          - entities.Facility.legacy_gateway_buffer_minutes
        excluded_because:
          difficulty_instance: resource_temporal_overlap / legacy_gateway_buffered_windows_collide_on_touch
          rationale: "The adjacent-interval case (gap 0 after buffering) is the exact boundary that instance targets."

      - name: corner_penalty_rate_threshold_variants
        claim_type: variant_divergence
        grounds:
          - calculations.turnaround_penalty.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / turnaround_penalty_variant_divergence_strict_vs_safe_harbor
          rationale: "STATUTORY_STRICT and CONTRACTUAL_SAFE_HARBOR are computed over the same interval there, including the weekend and grace divergence."

  - section: validations
