# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3339_agent_desk_fee_model_commission_retention_administration
# Breadth probe over the §1.1–§1.7 surface. Corners §1.8 already covers appear
# as excluded_because stubs. Shared anchor prefixes reuse the §1.8 chains.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: office_create_returns_all_declared_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Office
          - endpoints.POST_/offices
        distinguishing_aspect: "POST /offices with the three required inputs returns 201 with status ACTIVE, active_agent_count 0, trust_balance_cents 0, version 1, and system-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_office
              call: "POST /offices"
              payload: { office_name: "Denver Central", market_code: "DEN", recruiting_target_agents: 25 }
              as: FranchiseeOwner
              captures: { office_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Office.${office_id}.status == ACTIVE and active_agent_count == 0 and trust_balance_cents == 0"
            - "Office.${office_id}.version == 1 and id/created_at/updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: agent_get_returns_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Agent
          - endpoints.GET_/agents/{agentId}
        distinguishing_aspect: "Every stored Agent field round-trips through GET: identity fields plus status PENDING_ONBOARDING, supervision_cadence_days 30, unearned_advance_balance_cents 0, null onboarded_at."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Denver office exists."]
          setup_api_calls:
            - *k_clock
            - *k_office
          trigger:
            - &k_alice
              call: "POST /offices/${office_id}/agents"
              payload: { full_name: "Alice Agent", email: "alice@x.com", license_number: "LIC-A-001" }
              as: ManagingBroker
              captures: { alice_id: $.data.id, alice_v0: $.data.version }
            - call: "GET /agents/${alice_id}"
              payload: {}
              as: ManagingBroker
          assert:
            - "the response status is 200"
            - "Agent.${alice_id}.full_name == \"Alice Agent\" and license_number == \"LIC-A-001\""
            - "Agent.${alice_id}.status == PENDING_ONBOARDING and supervision_cadence_days == 30"
            - "Agent.${alice_id}.onboarded_at is null and unearned_advance_balance_cents == 0"
            - "Agent.${alice_id}.office_id == ${office_id}"

      - name: invoices_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/invoices
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three invoices on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status and billing_month filters compose with pagination."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Denver office with three ACTIVE agents on the 95/5 schedule; September billing run executed."]
          setup_api_calls:
            - &k_clock_sep1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_office
            - &k_sched
              call: "POST /fee-schedules"
              payload: { schedule_name: "95/5 Desk Plan", desk_fee_cents: 300000, overhead_share_bps: 500, retention_bps: 9500, referral_fee_bps: 2500, tech_subscription_monthly_cents: 25000, marketing_monthly_cents: 40000, effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { sched_id: $.data.id }
            - *k_alice
            - &k_fa_alice
              call: "POST /agents/${alice_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${alice_v0}" }
              as: ManagingBroker
              captures: { fa_alice_id: $.data.id }
            - &k_fa_alice_accept
              call: "POST /fee-assignments/${fa_alice_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &k_bob
              call: "POST /offices/${office_id}/agents"
              payload: { full_name: "Bob Agent", email: "bob@x.com", license_number: "LIC-B-002" }
              as: ManagingBroker
              captures: { bob_id: $.data.id, bob_v0: $.data.version }
            - &k_fa_bob
              call: "POST /agents/${bob_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${bob_v0}" }
              as: ManagingBroker
              captures: { fa_bob_id: $.data.id }
            - &k_fa_bob_accept
              call: "POST /fee-assignments/${fa_bob_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - &k_carol
              call: "POST /offices/${office_id}/agents"
              payload: { full_name: "Carol Agent", email: "carol@x.com", license_number: "LIC-C-003" }
              as: ManagingBroker
              captures: { carol_id: $.data.id, carol_v0: $.data.version }
            - &k_fa_carol
              call: "POST /agents/${carol_id}/fee-assignments"
              payload: { fee_schedule_id: "${sched_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z", expected_agent_version: "${carol_v0}" }
              as: ManagingBroker
              captures: { fa_carol_id: $.data.id }
            - &k_fa_carol_accept
              call: "POST /fee-assignments/${fa_carol_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${carol_id}"
            - &k_gen_sep
              call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
          trigger:
            - call: "GET /invoices"
              payload: { office_id: "${office_id}", limit: 2, offset: 0 }
              as: TrustAccountant
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /invoices?office_id=${office_id}&limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /invoices?office_id=${office_id}&status=ISSUED returns 3 rows"
            - "GET /invoices?office_id=${office_id}&billing_month=2026-10 returns 0 rows"
            - "GET /invoices with no parameters returns 3 rows (defaults limit=10, offset=0)"

      - name: offer_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/offers/{offerId}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unallocated offer id yields 404 ERR_NOT_FOUND with the error envelope carrying error_id and message."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Empty database apart from the clock."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: agent_create_missing_license_number_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Agent.fields.license_number
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "license_number is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST, and no agent row is persisted."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Denver office exists."]
          setup_api_calls:
            - *k_clock
            - *k_office
          trigger:
            - call: "POST /offices/${office_id}/agents"
              payload: { full_name: "No License", email: "nolic@x.com" }
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /agents?office_id=${office_id} returns 0 rows"

      - name: office_active_agent_count_is_computed_not_stored_input
        claim_type: Computed Fields
        grounds:
          - entities.Office.fields.active_agent_count
          - entities.Office.fields.trust_balance_cents
        distinguishing_aspect: "active_agent_count and trust_balance_cents are source: computed — client-supplied values on create are ignored, and the count only moves via agent activation/termination side effects."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /offices"
              payload: { office_name: "Denver Central", market_code: "DEN", recruiting_target_agents: 25, active_agent_count: 99, trust_balance_cents: 555 }
              as: FranchiseeOwner
              captures: { office_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Office.${office_id}.active_agent_count == 0 (client-supplied 99 ignored)"
            - "Office.${office_id}.trust_balance_cents == 0 (client-supplied 555 ignored)"

      - name: offer_system_fields_ignore_client_supplied_round_and_status
        claim_type: System Fields
        grounds:
          - entities.Offer.fields.offer_round
          - entities.Offer.fields.status
        distinguishing_aspect: "offer_round and status are source: system — a create payload smuggling offer_round 7 and status ACCEPTED is ignored; the offer is born OFFERED at round 1 with version 1."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Denver office and ACTIVE Alice."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
          trigger:
            - &k_offer1
              call: "POST /offices/${office_id}/offers"
              payload: { listing_reference: "L-100", buyer_name: "Buyer One", offer_price_cents: 50000000, offer_round: 7, status: "ACCEPTED" }
              as: Agent
              as_user_id: "${alice_id}"
              captures: { offer1_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Offer.${offer1_id}.status == OFFERED and offer_round == 1 and version == 1"

      - name: referral_fee_bps_above_cap_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.FeeSchedule.fields.referral_fee_bps
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "referral_fee_bps is constrained to [0, 5000]; 5001 is rejected at 400 ERR_INVALID_REQUEST and the schedule is not persisted."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /fee-schedules"
              payload: { schedule_name: "Outlaw Plan", desk_fee_cents: 300000, overhead_share_bps: 500, retention_bps: 9500, referral_fee_bps: 5001, tech_subscription_monthly_cents: 25000, marketing_monthly_cents: 40000, effective_from: "2026-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /fee-schedules returns 0 rows"

      - name: transaction_create_checks_body_foreign_keys_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_3_existence
          - endpoints.POST_/offices/{officeId}/transactions
          - errors.ERR_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Body FKs are validated in the endpoint's declared input order — listing_agent_id before selling_agent_id before offer_id: with listing and selling unknown, the error names the listing agent; with only offer_id unknown, the missing offer is named."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Denver office and ACTIVE Alice."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
          trigger:
            - call: "POST /offices/${office_id}/transactions"
              payload: { listing_agent_id: "00000000-0000-4000-8000-000000000001", selling_agent_id: "00000000-0000-4000-8000-000000000002", offer_id: "00000000-0000-4000-8000-000000000003", sale_price_cents: 50000000, gross_commission_cents: 1000000 }
              as: ManagingBroker
              captures: { err_both: $.data.error_id }
            - call: "POST /offices/${office_id}/transactions"
              payload: { listing_agent_id: "${alice_id}", selling_agent_id: "${alice_id}", offer_id: "00000000-0000-4000-8000-000000000003", sale_price_cents: 50000000, gross_commission_cents: 1000000 }
              as: ManagingBroker
              captures: { err_offer: $.data.error_id }
          assert:
            - "both responses are 404 with error_id == ERR_NOT_FOUND"
            - "the first response message names listing_agent_id (checked first); the second names offer_id"
            - "GET /transactions?office_id=${office_id} returns 0 rows"

      - name: fee_schedule_status_derives_from_window_against_logical_clock
        claim_type: Computed Fields
        grounds:
          - entities.FeeSchedule.fields.status
        distinguishing_aspect: "A schedule whose window lies entirely in the future is born DRAFT and flips to ACTIVE only when the logical clock enters its window — the status is clock-derived, not set at creation."
        test_recipe:
          setup: ["Logical clock 2026-09-10. No schedules yet."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /fee-schedules"
              payload: { schedule_name: "Future Plan", desk_fee_cents: 100000, overhead_share_bps: 400, retention_bps: 9600, referral_fee_bps: 2500, tech_subscription_monthly_cents: 10000, marketing_monthly_cents: 10000, effective_from: "2027-01-01T00:00:00Z", effective_to: "9999-12-31T00:00:00Z" }
              as: BrokerOfRecord
              captures: { future_sched_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /fee-schedules/${future_sched_id}"
              payload: {}
              as: BrokerOfRecord
          assert:
            - "at 2026-09-10 the created schedule has status == DRAFT"
            - "after the clock enters the window, GET reports status == ACTIVE with no write in between"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: agent_terminates_to_terminated_happy_path
        claim_type: Valid Transition
        grounds:
          - state_machines.Agent.TERMINATION_PENDING_to_TERMINATED
          - calculations.departure_proration
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_cascade_holds_to_departure_invoice_to_release
          rationale: "The full termination walk (terminate -> holds -> complete-termination -> departure invoice -> TERMINATED, active_agent_count 0) is asserted end-to-end in the named §1.8 instance."

      - name: offer_counter_from_terminal_rejected_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Offer
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Countering a REJECTED offer is an invalid-from rejection: 409 ERR_INVALID_STATE, and the offer remains REJECTED with offer_round unchanged."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; O1 OFFERED then REJECTED."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - call: "POST /offers/${offer1_id}/reject"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
          trigger:
            - call: "POST /offers/${offer1_id}/counter"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "Offer.${offer1_id}.status == REJECTED and offer_round == 1"

      - name: request_close_requires_active_listing_agent
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Transaction.UNDER_CONTRACT_to_PENDING_CLOSE
          - errors.ERR_AGENT_NOT_ACTIVE
        distinguishing_aspect: "The request-close precondition listing_agent.status == ACTIVE is enforced even when the CDA is APPROVED: a transaction whose listing agent has gone TERMINATION_PENDING is rejected with 409 ERR_AGENT_NOT_ACTIVE."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 UNDER_CONTRACT with fully approved CDA; then Alice initiates termination before requesting close."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - &k_offer1_accept
              call: "POST /offers/${offer1_id}/accept"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &k_txn1
              call: "POST /offices/${office_id}/transactions"
              payload: { listing_agent_id: "${alice_id}", selling_agent_id: "${alice_id}", offer_id: "${offer1_id}", sale_price_cents: 50000000, gross_commission_cents: 1000000 }
              as: ManagingBroker
              captures: { txn1_id: $.data.id }
            - &k_cda1
              call: "POST /transactions/${txn1_id}/cdas"
              payload: { review_ladder: ["COMPLIANCE_REVIEW", "TRUST_REVIEW", "BROKER_SIGNOFF"] }
              as: ManagingBroker
              captures: { cda1_id: $.data.id }
            - &k_cda1_r0
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: ComplianceAuditor
            - &k_cda1_r1
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: TrustAccountant
            - &k_cda1_r2
              call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: ManagingBroker
            - call: "POST /agents/${alice_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
          trigger:
            - call: "POST /transactions/${txn1_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_AGENT_NOT_ACTIVE"
            - "Transaction.${txn1_id}.status remains UNDER_CONTRACT"

      - name: closing_cascade_end_to_end_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Transaction.PENDING_CLOSE_to_CLOSED
          - state_machines.ReferralAgreement.ACTIVE_to_FULFILLED
        excluded_because:
          difficulty_instance: transitive_cascade / close_cascade_receipt_to_split_to_referral_fulfillment
          rationale: "The close cascade (receipt -> split entries -> referral fulfillment) is asserted hop-by-hop in the named §1.8 instance."

      - name: collections_suspension_bubbles_up_to_office
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Invoice.OVERDUE_to_COLLECTIONS
          - state_machines.Office.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: compensating_invariant / pay_then_writeoff_floor_and_trust_conservation
          rationale: "The COLLECTIONS -> SUSPENDED bubble-up and its compensation on write-off are asserted in the named §1.8 instance."

      - name: office_close_cascades_open_invoices_to_collections
        claim_type: Cascade down
        grounds:
          - state_machines.Office.ACTIVE_to_CLOSED
          - state_machines.Invoice
        distinguishing_aspect: "close_office moves every ISSUED/PARTIALLY_PAID/OVERDUE invoice to COLLECTIONS in the same request, while PAID and WRITTEN_OFF invoices are untouched — a conditional cascade down the office tree."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Denver office with Alice (ACTIVE) and Bob (ACTIVE); September billing run; Alice's invoice PAID, Bob's left ISSUED; Bob terminated (notice 2026-09-10, completion 2026-09-24) so the office can close with zero ACTIVE agents. NOTE: Alice must also terminate; both agents complete termination before close."]
          setup_api_calls:
            - *k_clock_sep1
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_bob
            - *k_fa_bob
            - *k_fa_bob_accept
            - &k_gen_sep2
              call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
              captures: { inv_a_id: "$.data[0].id", inv_b_id: "$.data[1].id" }
            - call: "POST /invoices/${inv_a_id}/pay"
              payload: { amount_cents: 365000 }
              as: Agent
              as_user_id: "${alice_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agents/${alice_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - call: "POST /agents/${bob_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${bob_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agents/${alice_id}/complete-termination"
              payload: {}
              as: ManagingBroker
            - call: "POST /agents/${bob_id}/complete-termination"
              payload: {}
              as: ManagingBroker
          trigger:
            - call: "POST /offices/${office_id}/close"
              payload: {}
              as: FranchiseeOwner
          assert:
            - "the response status is 200 and Office.${office_id}.status == CLOSED"
            - "Invoice.${inv_b_id}.status == COLLECTIONS (ISSUED at close time cascades)"
            - "Invoice.${inv_a_id}.status == PAID (terminal invoices untouched by the cascade)"
            - "Agent.${alice_id}.status == TERMINATED and Agent.${bob_id}.status == TERMINATED"

      - name: invoice_partial_payment_rejected_on_terminal_paid
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Invoice
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pay_invoice_overpayment_vs_terminal_state_conflict
          rationale: "Payment attempts on a PAID (terminal) invoice are asserted to fail with ERR_INVALID_STATE in the named §1.8 instance."

      - name: second_cda_on_same_transaction_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CommissionDisbursementAuthorization.DRAFT_to_IN_REVIEW
          - errors.ERR_CDA_EXISTS
        distinguishing_aspect: "A second CDA create while the first is IN_REVIEW is rejected 409 ERR_CDA_EXISTS — the one-open-CDA-per-transaction precondition."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 UNDER_CONTRACT; CDA1 IN_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - *k_offer1_accept
            - *k_txn1
            - *k_cda1
          trigger:
            - call: "POST /transactions/${txn1_id}/cdas"
              payload: { review_ladder: ["COMPLIANCE_REVIEW", "TRUST_REVIEW", "BROKER_SIGNOFF"] }
              as: ManagingBroker
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_CDA_EXISTS"
            - "GET /transactions/${txn1_id}/cdas returns exactly 1 row"

      - name: fell_through_relist_recontract_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Transaction.FELL_THROUGH_to_RELISTED
          - state_machines.Transaction.RELISTED_to_UNDER_CONTRACT
        distinguishing_aspect: "The Transaction re-list loop is exercised: UNDER_CONTRACT -> FELL_THROUGH -> RELISTED -> UNDER_CONTRACT, and the IN_REVIEW CDA is SUPERSEDED by the fell-through transition."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 UNDER_CONTRACT with CDA1 IN_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - *k_offer1_accept
            - *k_txn1
            - *k_cda1
          trigger:
            - call: "POST /transactions/${txn1_id}/mark-fell-through"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - call: "POST /transactions/${txn1_id}/relist"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - call: "POST /transactions/${txn1_id}/recontract"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
          assert:
            - "after mark-fell-through, Transaction.${txn1_id}.status == FELL_THROUGH and CDA.${cda1_id}.status == SUPERSEDED"
            - "after relist, status == RELISTED; after recontract, status == UNDER_CONTRACT"
            - "the Transaction version advanced on each transition"

      - name: offer_born_offered_at_round_one
        claim_type: Initial State
        grounds:
          - state_machines.Offer
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_negotiation_cycle_round_cap
          rationale: "Initial OFFERED state at round 1 is the entry point of the named §1.8 cycle instance."

      - name: double_terminate_is_rejected_from_termination_pending
        claim_type: Idempotency
        grounds:
          - state_machines.Agent.ACTIVE_to_TERMINATION_PENDING
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Repeating terminate on a TERMINATION_PENDING agent is not a silent no-op: the second call is rejected 409 ERR_INVALID_STATE and termination_requested_at is unchanged."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; first terminate already applied."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - call: "POST /agents/${alice_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
          trigger:
            - call: "POST /agents/${alice_id}/terminate"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "Agent.${alice_id}.termination_requested_at == 2026-09-10T00:00:00Z (unchanged by the rejected second call)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: closing_statement_uses_agreement_bps_over_schedule_bps
        claim_type: Variant Selection
        grounds:
          - calculations.referral_network_fee
          - calculations.closing_statement
        excluded_because:
          difficulty_instance: transitive_cascade / close_cascade_receipt_to_split_to_referral_fulfillment
          rationale: "The agreement-2000bps-vs-schedule-2500bps selection is asserted as the hop-2 amounts (200000/760000/40000) in the named §1.8 instance."

      - name: invoice_escalation_issued_overdue_collections_on_clock_advance
        claim_type: Boundary / Edge
        grounds:
          - state_machines.Invoice.ISSUED_to_OVERDUE
          - state_machines.Invoice.OVERDUE_to_COLLECTIONS
          - calculations.invoice_line_totals
        distinguishing_aspect: "Due-date escalation boundary: an ISSUED invoice with due_date 2026-09-08 is still ISSUED at 2026-09-08T00:00:00Z (due date inclusive), OVERDUE one second past it, and COLLECTIONS only once the clock passes due_date + 30 days (2026-10-08T00:00:00Z)."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Alice ACTIVE; September invoice ISSUED with due_date 2026-09-08T00:00:00Z."]
          setup_api_calls:
            - *k_clock_sep1
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - &k_gen_sep3
              call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: ManagingBroker
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: TrustAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: TrustAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-08T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: TrustAccountant
          assert:
            - "at the due_date instant the invoice is still ISSUED"
            - "one second past due_date the invoice reads OVERDUE"
            - "past due_date + 30 days the invoice reads COLLECTIONS and Office.${office_id}.status == SUSPENDED"

      - name: trust_balance_recomputed_after_close_and_reconcile
        claim_type: Correct Result
        grounds:
          - calculations.trust_balance
          - entities.Office.fields.trust_balance_cents
        distinguishing_aspect: "trust_balance tracks the escrow identity through the full lifecycle: after a 1000000-GCI close it equals receipt minus nothing-disbursed plus zero receivables; after reconcile disburses the payable entries it drops to exactly the accrued office fee share that reconcile recognizes."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 closed with GCI 1000000 on the 95/5 schedule (no referral, no advance)."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - *k_offer1_accept
            - *k_txn1
            - *k_cda1
            - *k_cda1_r0
            - *k_cda1_r1
            - *k_cda1_r2
            - &k_rc1
              call: "POST /transactions/${txn1_id}/request-close"
              payload: {}
              as: Agent
              as_user_id: "${alice_id}"
            - &k_close1
              call: "POST /transactions/${txn1_id}/close"
              payload: {}
              as: ManagingBroker
          trigger:
            - call: "GET /offices/${office_id}"
              payload: {}
              as: TrustAccountant
            - call: "POST /offices/${office_id}/reconcile"
              payload: {}
              as: TrustAccountant
          assert:
            - "immediately after close, Office.${office_id}.trust_balance_cents == 1037500 (ESCROW_HELD receipt 1000000 + OFFICE_FEE_ACCRUED 37500; AGENT_PAYABLE and REFERRAL_PAYABLE are excluded from the trust sum)"
            - "after reconcile, the AGENT_DISBURSEMENT entry is DISBURSED and OFFICE_FEE_ACCRUAL is RECONCILED"
            - "post-reconcile trust_balance_cents == 0 for the escrow components (receipt disbursed out, accrual recognized), with no open invoices in the fixture"

      - name: generate_invoices_idempotent_per_agent_month
        claim_type: Correct Result
        grounds:
          - calculations.invoice_line_totals
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_line_totals_per_line_rounding_then_sum
          rationale: "Idempotent re-run for the same (agent, billing_month) is asserted in the named §1.8 instance."

