      - name: disclosure_packet_second_publish_returns_packet_not_draft_then_supersede
        claim_type: idempotency
        grounds:
          - state_machines.DisclosurePacket.transitions.DRAFT_to_PUBLISHED
          - state_machines.DisclosurePacket.transitions.PUBLISHED_to_SUPERSEDED
