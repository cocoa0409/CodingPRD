            - "captured late_accrual_alone == 861111 (200,000,000 undrawn * 250 bps * 62/360, rounded half up) while it is the only funded draw"
            - "captured na_mid == 861111"
            - "captured early_accrual == 847222 (200,000,000 * 250 bps * 61/360)"
            - "after the second funding DrawRequest.${late_id}.negative_arbitrage_accrual_cents == 344444, overwritten from 861111 because only 80,000,000 remains undrawn after the earlier period"
