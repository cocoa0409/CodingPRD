      - name: corner_project_and_grant_error_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INTERSECTION_NOT_STUDIED
          - errors.ERR_PROJECT_NOT_TOP_RANKED
          - errors.ERR_GRANT_FUNDS_EXHAUSTED
          - errors.ERR_PROJECT_NOT_FUNDED
          - calculations.grant_funding_selector
        distinguishing_aspect: |
          Four funding-path codes on one program. Scoring a project at the unstudied
          Birch St intersection is ERR_INTERSECTION_NOT_STUDIED (422). With P1 at 42.23 and
          P2 at 38.23, funding P2 is ERR_PROJECT_NOT_TOP_RANKED (409). Funding the
          genuinely top-ranked P1 for 3,000,000 against a 2,000,000 pool is
          ERR_GRANT_FUNDS_EXHAUSTED (402) — the fiscal check is last, so it is only
          reachable once the state, OCC and ranking gates all pass. Withdrawing funding
          from a project that was never funded is ERR_PROJECT_NOT_FUNDED (409).
          Score literals: benefit_points for P1 = round4(0.40*66.19 + 0.25*23 +
          0.20*min(50, 500/10) + 0.15*0) = 42.2260 with cost_factor floored at 1.00 ->
          42.23; for P2 = round4(26.476 + 5.75 + 6.0) = 38.2260 -> 38.23.
        test_recipe:
          setup:
            - "School with WARRANTED Maple St intersection (latest_warrant_score 66.19, crash_severity_points 23) and an unstudied Birch St intersection."
            - "Grant program with a 2,000,000-cent pool; P1 (3,000,000 / 500 students) and P2 (2,000,000 / 300 students) at Maple St are both SCORED; P3 at Birch St is PROPOSED."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
