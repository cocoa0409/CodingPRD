            - "channel_scope [\"KIOSK\"] is rejected with the same error id, because KIOSK is not a channel_type literal — an unknown member is treated as scope emptiness, not as ERR_INVALID_REQUEST"
            - "channel_scope [\"OTA\", \"OTA\"] is rejected with ERR_INVALID_REQUEST instead: the duplicate-member clause lives at priority 7 and outranks 35"
            - "channel_scope [\"OTA\", \"GDS\"] returns HTTP 201 with status RECEIVED, exposure_cents 0 and flagged_profile_ids []"

