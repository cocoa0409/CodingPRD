  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reentry_buffer_endpoint_itself_conflicts_one_day_later_allowed
        grounds:
          - "validations[priority=64]"
          - calculations.growth_projection_volume
          - entities.HarvestBlock.fields.years_to_start
          - entities.HarvestBlock.fields.projected_available_tons
        distinguishing_aspect: |
          The 24-month re-entry buffer on a stand is CLOSED at its far endpoint: a block
          starting 2029-09-30 — exactly 24 months after the prior block's planned_end_date
          2027-09-30 — must be rejected with ERR_REENTRY_BUFFER_CONFLICT, while a start of
          2029-10-01 is accepted. The accepted block also proves the projection is taken
          from the buffer-relevant date: years_to_start floor(1157 / 365) = 3 and
          projected_available_tons 5257.59 - 500.00 = 4757.59, i.e. growth is applied to
          the whole cruised volume and the existing reservation is netted afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Canonical fund and 'Piney Creek Tract'; stand PC-01 cruise-closed at 4647.12 tons (120.00 LOBLOLLY_PINE acres)."
            - "Block A already RESERVED for [2027-06-01, 2027-09-30] with planned_tons 500.00, so reserved_tons 500.00 and available_tons 4147.12."
