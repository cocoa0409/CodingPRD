              payload: { session_label: "S1", level_band: "L9", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T18:00:00Z", apparatus_set: [{apparatus: "VAULT", flight_count: 1}, {apparatus: "UNEVEN_BARS", flight_count: 1}, {apparatus: "BALANCE_BEAM", flight_count: 1}, {apparatus: "FLOOR_EXERCISE", flight_count: 1}] }
              as: MeetDirector
              captures: { sess_id: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A4000011", legal_name: "G D1", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "Metro" }
              as: MeetDirector
              captures: { g_d1: $.data.id }
            - call: "POST /api/v1/gymnasts"
              payload: { usag_member_number: "A4000012", legal_name: "G D2", date_of_birth: "2010-01-01T00:00:00Z", competitive_level: "L9", home_gym: "South" }
              as: MeetDirector
              captures: { g_d2: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_d1}" }
              as: MeetDirector
              captures: { e_d1: $.data.id }
            - call: "POST /api/v1/sessions/${sess_id}/athlete-entries"
              payload: { gymnast_id: "${g_d2}" }
              as: MeetDirector
              captures: { e_d2: $.data.id }
          trigger:
            - call: "GET /api/v1/athlete-entries/${e_d1}/scores"
              payload: {}
              as: MeetDirector
            - call: "GET /api/v1/athlete-entries/${e_d2}/scores"
              payload: {}
              as: MeetDirector
          assert:
            - "Score for E_D1 (withdrawn branch): score_state returns to PUBLISHED; final_total == provisional_total (13.000) — deltas NOT applied"
            - "Score for E_D2 (upheld branch): score_state INQUIRY_RESOLVED; provisional_total recomputed to 13.200 (5.0+0.2 + 8.0 - 0.0)"
            - "The two branches fork from the same PUBLISHED state and produce divergent final outcomes on identical initial inputs"

  # ==========================================================================
  # Rule 4: transitive_cascade — 2 instances from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scratch_cascade_entry_to_score_to_squad_to_panel
        grounds:
          - state_machines.AthleteEntry.COMPETING_to_SCRATCHED
          - state_machines.Score.DRAFT_to_VOID
          - entities.Squad.fields.athlete_count
          - entities.PanelAssignment.fields.conflict_flag
