# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Planned Giving & Bequest Administration
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: donor_create_applies_defaults
        claim_type: creation
        grounds: [entities.Donor]
        distinguishing_aspect: "POST /giving/donors with only required fields returns 201 with system defaults: vital_status=LIVING, legacy_society_status=NONE, documented_gift_total_cents=0, version=1, and a UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/donors", payload: { full_name: "Defaults Donor", date_of_birth: "1960-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id, d_v: $.data.version, d_vital: $.data.vital_status, d_legacy: $.data.legacy_society_status, d_total: $.data.documented_gift_total_cents } }
          assert:
            - "response 201; ${d_vital} == LIVING; ${d_legacy} == NONE; ${d_total} == 0; ${d_v} == 1"
            - "${d_id} is a server-minted UUID"
      - name: donor_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Donor, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent donor id returns the error envelope with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /giving/donors/00000000-0000-4000-8000-000000000000", payload: {}, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND and HTTP status 404"
            - "error envelope carries data.error_id and data.message with response_type == error"
      - name: donor_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Donor.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required full_name yields ERR_INVALID_REQUEST (400); the envelope check (priority 29) runs after auth/existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/donors", payload: { date_of_birth: "1960-01-01T00:00:00Z" }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400)"
      - name: donor_create_with_system_fields_rejected
        claim_type: system_fields
        grounds: [entities.Donor.fields.vital_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied system fields (vital_status, version) in a create body are rejected with ERR_INVALID_REQUEST, not silently ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /giving/donors", payload: { full_name: "Sneaky", date_of_birth: "1960-01-01T00:00:00Z", vital_status: "DECEASED", version: 99 }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400)"
      - name: donor_list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Donor]
        distinguishing_aspect: "With 3 donors stored, GET /giving/donors without params applies pagination defaults (limit 10, offset 0) and returns total_count 3, has_more false, plus meta.api_request_id."
        test_recipe:
          setup: ["exactly 3 donors exist"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "P1", date_of_birth: "1960-01-01T00:00:00Z" }, as: GiftOfficer }
            - { call: "POST /giving/donors", payload: { full_name: "P2", date_of_birth: "1961-01-01T00:00:00Z" }, as: GiftOfficer }
            - { call: "POST /giving/donors", payload: { full_name: "P3", date_of_birth: "1962-01-01T00:00:00Z" }, as: GiftOfficer }
          trigger:
            - { call: "GET /giving/donors", payload: {}, as: FinanceSteward }
          assert:
            - "response_type == array; data length == 3; total_count == 3; has_more == false; limit == 10; offset == 0"
            - "meta.api_request_id present and meta.api_request_timestamp present"
      - name: illustration_supersession_flips_predecessor
        claim_type: creation
        grounds: [entities.Illustration.fields.supersedes_illustration_id, state_machines.Illustration.OPEN_to_SUPERSEDED]
        distinguishing_aspect: "Creating an illustration with supersedes_illustration_id atomically flips the referenced OPEN illustration to SUPERSEDED (self-referential FK side effect); the successor starts OPEN."
        test_recipe:
          setup: ["Donor D; ACTIVE 5% rate table; illustration I1 OPEN"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Supersede", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 5000000, payout_rate_bps: 600, lives: 1, annuitant_1_age: 72, funding_month: "2026-08" }, as: GiftOfficer, captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 6000000, payout_rate_bps: 600, lives: 1, annuitant_1_age: 72, funding_month: "2026-08", supersedes_illustration_id: "${i1}" }, as: GiftOfficer, captures: { i2: $.data.id, i2_status: $.data.status } }
            - { call: "GET /giving/illustrations/${i1}", payload: {}, as: GiftOfficer, captures: { i1_status: $.data.status } }
          assert:
            - "I2 created OPEN (${i2_status}); I1 flipped to SUPERSEDED (${i1_status})"
      - name: gift_asset_orphan_xor_enforced
        claim_type: type_constraints
        grounds: ["validations[priority=21]", "errors[ERR_ASSET_ORPHAN]"]
        distinguishing_aspect: "GiftAsset parentage XOR: neither-FK and both-FK payloads are both rejected ERR_ASSET_ORPHAN (422); exactly-one succeeds."
        test_recipe:
          setup: ["Donor D (deceased) with estate E; DRAFT agreement A for a second living donor"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Dead", date_of_birth: "1930-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d1: $.data.id } }
            - { call: "POST /giving/donors/${d1}/record-death", payload: { deceased_on: "2026-08-02T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d1}", notified_on: "2026-08-03T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/donors", payload: { full_name: "Alive", date_of_birth: "1956-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d2: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d2}", vehicle_type: "BEQUEST", gift_amount_cents: 1000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
          trigger:
            - { call: "POST /giving/gift-assets", payload: { asset_kind: "CASH", pledged_value_cents: 100000 }, as: EstateManager, captures: { err_none: $.data.error_id } }
            - { call: "POST /giving/gift-assets", payload: { asset_kind: "CASH", pledged_value_cents: 100000, gift_agreement_id: "${ag_id}", estate_id: "${e_id}" }, as: EstateManager, captures: { err_both: $.data.error_id } }
            - { call: "POST /giving/gift-assets", payload: { asset_kind: "CASH", pledged_value_cents: 100000, gift_agreement_id: "${ag_id}" }, as: EstateManager, captures: { ok_id: $.data.id } }
          assert:
            - "neither FK: ${err_none} == ERR_ASSET_ORPHAN (422)"
            - "both FKs: ${err_both} == ERR_ASSET_ORPHAN (422)"
            - "exactly one FK: asset ${ok_id} created PLEDGED"
      - name: illustration_computed_fields_on_create
        claim_type: computed_fields
        grounds: [entities.Illustration.fields.illustrated_deduction_cents, calculations.charitable_deduction]
        distinguishing_aspect: "Single-life illustration (gift 10000000, 600bps, age 70, 5% table) returns computed illustrated_annual_annuity_cents == 600000 and illustrated_deduction_cents == 776529 (pv 9223471 at factor 15.3724510269)."
        test_recipe:
          setup: ["Donor D; ACTIVE 5% rate table"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Computed", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 70, funding_month: "2026-08" }, as: GiftOfficer, captures: { ann: $.data.illustrated_annual_annuity_cents, ded: $.data.illustrated_deduction_cents, rt: $.data.rate_table_id } }
          assert:
            - "${ann} == 600000; ${ded} == 776529; ${rt} == ${rt_id} (pinned)"
      - name: agreement_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.GiftAgreement.fields.vehicle_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "vehicle_type outside the declared enum (e.g. POOLED_INCOME) is rejected ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Donor D; ACTIVE 5% rate table"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Enum", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "POOLED_INCOME", gift_amount_cents: 1000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400)"

  - section: state_machines
    instances:
      - name: agreement_generate_schedule_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GiftAgreement.FUNDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "generate-payment-schedule on a DRAFT agreement skips EXECUTED/FUNDED and must fail ERR_INVALID_STATE — no payments created."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT CRAT agreement"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Skip State", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator, captures: { err: $.data.error_id } }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}" }, as: GiftAdministrator }
          assert:
            - "${err} == ERR_INVALID_STATE (409); payment list total_count == 0"
      - name: withdrawn_agreement_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GiftAgreement.DRAFT_to_WITHDRAWN]
        distinguishing_aspect: "WITHDRAWN is terminal: subsequent execute and amend both fail ERR_INVALID_STATE / (amend also fails state before OCC re-check is meaningful)."
        test_recipe:
          setup: ["Donor D; ACTIVE table; DRAFT agreement then WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Terminal", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id, ag_v: $.data.version } }
            - { call: "POST /giving/gift-agreements/${ag_id}/transition", payload: { action: "WITHDRAW" }, as: GiftAdministrator, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, captures: { err_exec: $.data.error_id } }
            - { call: "POST /giving/gift-agreements/${ag_id}/amend", payload: { expected_gift_agreement_version: "${ag_v}", restriction_type: "RESEARCH" }, as: GiftAdministrator, captures: { err_amend: $.data.error_id } }
          assert:
            - "withdraw response status == WITHDRAWN (${st})"
            - "execute on WITHDRAWN: ${err_exec} == ERR_INVALID_STATE"
            - "amend on WITHDRAWN: ${err_amend} == ERR_INVALID_STATE (state gate, not OCC)"
      - name: rate_table_retire_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RateTable.ACTIVE_to_RETIRED]
        distinguishing_aspect: "RETIRED rate tables cannot be re-activated: ACTIVATE on RETIRED fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["rate table ACTIVE then RETIRED"]
          setup_api_calls:
            - { call: "POST /giving/rate-tables", payload: { label: "T", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/rate-tables/${rt}/transition", payload: { action: "RETIRE" }, as: ComplianceOfficer, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /giving/rate-tables/${rt}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "retire returned RETIRED (${st}); re-activate rejected ${err} == ERR_INVALID_STATE"
      - name: payment_auto_due_via_clock_sweep
        claim_type: valid_transition
        grounds: [state_machines.AnnuityPayment.SCHEDULED_to_DUE]
        distinguishing_aspect: "SCHEDULED payments flip to DUE exactly when the logical clock reaches due_date (inclusive <=): at 2026-08-31 payment 1 (due 2026-09-01) is still SCHEDULED; at 2026-09-01 it is DUE."
        test_recipe:
          setup: ["CRAT (gift 1665017, 600bps, MONTHLY, age 98) ACTIVE with 24 payments; payment 1 due 2026-09-01"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Due Sweep", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
          trigger:
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { due1: "$.data[0].status" } }
          assert:
            - "At default clock 2026-08-01: zero DUE payments (total_count == 0)"
            - "At 2026-09-01: exactly one DUE payment (${due1} == DUE, total_count == 1)"
      - name: payment_defer_due_cycle_via_clock
        claim_type: valid_transition
        grounds: [state_machines.AnnuityPayment.DUE_to_DEFERRED, state_machines.AnnuityPayment.DEFERRED_to_DUE]
        distinguishing_aspect: "The DUE -> DEFERRED -> DUE loop is clock-driven: DEFER with defer_until 2026-12-01 holds the payment until the sweep at 2026-12-01 returns it to DUE (cyclic machine on AnnuityPayment)."
        test_recipe:
          setup: ["CRAT (gift 1665017, 600bps, MONTHLY, age 98) ACTIVE; clock 2026-09-01; payment 1 DUE"]
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Defer Loop", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { p1: "$.data[0].id" } }
          trigger:
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "DEFER", defer_until: "2026-12-01T00:00:00Z" }, as: GiftAdministrator, captures: { st1: $.data.status } }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DEFERRED" }, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { st2: "$.data[0].status" } }
          assert:
            - "DEFER succeeds (${st1} == DEFERRED); at 2026-11-15 still DEFERRED (total_count == 1)"
            - "at 2026-12-01 the sweep returns it to DUE (${st2} == DUE) — full cycle"
            - "payment.amount_cents == 8325 throughout (deferral never changes amounts)"
      - name: bequest_matures_on_death_skipping_funding
        claim_type: valid_transition
        grounds: [state_machines.GiftAgreement.DRAFT_to_EXECUTED, state_machines.Donor.LIVING_to_DECEASED]
        excluded_because:
          difficulty_instance: donor_death_maturity_cascade
          rationale: "Asserted there: BEQUEST agreement EXECUTED -> MATURED on donor death with Estate auto-created in NOTIFIED."
      - name: designation_verify_supersedes_prior_verified
        claim_type: side_effect_execution
        grounds: [state_machines.BeneficiaryDesignation.SUBMITTED_to_VERIFIED]
        distinguishing_aspect: "VERIFY on a second designation for the same (agreement, slot) flips the previously VERIFIED one to SUPERSEDED — at most one VERIFIED per slot is maintained by side effect."
        test_recipe:
