              captures: { agr_v2: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "RD-001", title: "Vestibule dressing v2", expected_agreement_version: "${agr_v2}" }
