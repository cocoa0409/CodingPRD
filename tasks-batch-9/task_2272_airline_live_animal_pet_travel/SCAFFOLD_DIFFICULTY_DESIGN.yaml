      - name: kennel_bays_aggregate_across_sanitation_buffer_window_rejected
        grounds:
          - calculations.kennel_bay_occupancy_projection
          - validations.priority_51
          - entities.Station.fields.kennel_bay_count
          - errors.ERR_KENNEL_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          A different resource with different interval semantics: kennel bays use HALF-OPEN intervals extended
          by SANITATION_BUFFER_MINUTES 45, and the constraint is an AGGREGATE capacity rather than a pairwise
          conflict - a single extra bay is refused because 1 + 2 + 2 projected bays exceeds kennel_bay_count 4
          even though no individual allocation is oversized.
        test_recipe:
          setup:
            - "Station HKG with kennel_bay_count 4; one screened animal"
            - "Allocation A1: 2 bays from 2026-08-05T06:00Z to 09:00Z, so its effective end including the 45-minute sanitation buffer is 09:45Z"
            - "Allocation A2: 2 bays from 09:44Z to 12:00Z - one minute inside A1's buffer - accepted because the projection is exactly 4 bays, equal to kennel_bay_count"
            - "Station.reserved_bay_count is therefore 4"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
