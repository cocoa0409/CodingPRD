  # ===========================================================================
  - section: validations
    instances:

      - name: body_foreign_keys_are_resolved_before_any_business_rule
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=23]
          - validations[priority=49]
        distinguishing_aspect: |
          Body foreign keys are resolved at priorities 20-23, ahead of every business rule: a TRANSFER
          election naming an unknown beneficiary_designation_id on a NON_TRANSFERABLE EMAIL asset
          returns 404 ERR_DESIGNATION_NOT_FOUND rather than 409 ERR_ASSET_NOT_TRANSFERABLE, and an
          unknown platform_id or fiduciary_id in a body returns its own 404 with nothing persisted.
        test_recipe:
          setup:
            - "one Platform, one Estate with one Fiduciary and one EMAIL asset"
            - "no BeneficiaryDesignation rows at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "MailWorks", platform_type: "EMAIL", form_code: "MW-FORM-3", review_window_days: 21, refund_policy: "NONE", supports_online_tool: true, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_mail_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C27" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C27" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_mail_id}", category: "EMAIL", account_handle: "mail-1", quoted_value_cents: 50000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_mail_id: $.data.id, a_mail_v: $.data.version, a_mail_transfer: $.data.transferability }
          trigger:
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C27", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "00000000-0000-0000-0000-000000000000" }
              as: CourtRegistrar
              captures: { e_fid_body: $.data.error_id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "00000000-0000-0000-0000-000000000000", category: "CLOUD_STORAGE", account_handle: "vault-x", quoted_value_cents: 1000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_plat_body: $.data.error_id }
            - call: "POST /estates/${est_id}/authority-directives"
              payload: { directive_type: "WILL_PROVISION", scope: "CATALOG_ONLY", platform_id: "00000000-0000-0000-0000-000000000000", instrument_reference: "Will article 7.2", executed_on: "2025-06-01" }
              as: CourtRegistrar
              captures: { e_plat_directive: $.data.error_id }
            - call: "POST /digital-assets/${a_mail_id}/disposition-elections"
              payload: { election: "TRANSFER", expected_asset_version: "${a_mail_v}", beneficiary_designation_id: "00000000-0000-0000-0000-000000000000", election_note: "hand the mailbox to the child" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { e_designation_body: $.data.error_id }
          assert:
            - "${a_mail_transfer} == NON_TRANSFERABLE"
            - "${e_fid_body} == ERR_FIDUCIARY_NOT_FOUND with HTTP 404 and no Document row is created"
            - "${e_plat_body} == ERR_PLATFORM_NOT_FOUND with HTTP 404 and Estate.${est_id}.inventory_total_count stays 1"
            - "${e_plat_directive} == ERR_PLATFORM_NOT_FOUND with HTTP 404"
            - "${e_designation_body} == ERR_DESIGNATION_NOT_FOUND with HTTP 404, NOT ERR_ASSET_NOT_TRANSFERABLE (priority 23 outranks priority 49)"
            - "GET /disposition-elections filtered by asset_id ${a_mail_id} returns 0 rows"
            - "DigitalAsset.${a_mail_id}.version == ${a_mail_v} (a rejected election bumps nothing)"

      - name: only_one_valuation_run_per_estate_may_ever_be_finalized
        claim_type: Violation → Error
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - entities.ValuationRun.fields.status
        distinguishing_aspect: |
          FINALIZE is defined only from COMPUTED: a SUPERSEDED run is refused with
          ERR_INVALID_RUN_STATE, the newest run finalizes once and stamps finalized_at from the
          logical clock, a second FINALIZE on the same run is ERR_INVALID_RUN_STATE, and any further
          POST of a valuation run on that estate is ERR_VALUATION_ALREADY_FINALIZED.
        test_recipe:
          setup:
            - "one CLOUD_STORAGE platform, one Estate at DISCLOSURE with one disclosed TRANSFERABLE asset at 200000"
            - "one BeneficiaryDesignation holding the whole 10000 basis points"
            - "two COMPUTED DATE_OF_DEATH runs, so the first is SUPERSEDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C28" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C28" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C28", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C28", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-1", quoted_value_cents: 200000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_vault_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED", decision_note: "documents in order" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /estates/${est_id}/beneficiary-designations"
              payload: { beneficiary_name: "Kai Ives", share_bp: 10000, source: "WILL", relationship: "child" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { est_v1: $.data.version }
            - call: "POST /estates/${est_id}/valuation-runs"
              payload: { basis: "DATE_OF_DEATH", expected_estate_version: "${est_v1}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { run1_id: $.data.id }
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { est_v2: $.data.version }
            - call: "POST /estates/${est_id}/valuation-runs"
              payload: { basis: "DATE_OF_DEATH", expected_estate_version: "${est_v2}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
