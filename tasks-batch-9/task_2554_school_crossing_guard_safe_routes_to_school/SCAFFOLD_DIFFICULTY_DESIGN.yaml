  - rule_id: compensating_invariant
    instances:
      - name: grant_ledger_conserved_across_award_and_withdrawal
        grounds:
          - calculations.grant_funding_selector
          - state_machines.InfrastructureProject.SCORED_to_FUNDED
          - state_machines.InfrastructureProject.FUNDED_to_SCORED
          - entities.GrantProgram.fields.committed_cents
          - entities.GrantProgram.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity: money. total_cents == committed_cents + remaining_cents
          must hold at all three observation points (before the award, after the award,
          after the withdrawal), and the withdrawal must restore the pre-award figures
          exactly — committed 0, remaining 9,000,000, funded_project_count 0,
          awarded_cents 0 — while leaving the project's benefit_cost_score of 42.23 and
          its funded_at history untouched. Because remaining_cents never reaches 0, no
          deferral cascade fires, so any drift is attributable to the compensation
          alone.
        test_recipe:
          setup:
            - "School with one WARRANTED intersection (latest_warrant_score 66.19, crash_severity_points 23); clock advanced to 2026-09-30T09:00:00Z; no complaints, so referred_complaint_count is 0."
