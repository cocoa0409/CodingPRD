              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${s2_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
          assert:
            - "ParticipationContract.${c1_id}.provisional_fee_cents == 2000000  # attendance 10000 -> tier1, no uplift"
            - "ParticipationContract.${c2_id}.provisional_fee_cents == 2200000  # attendance 10001 -> tier2, +10%"

