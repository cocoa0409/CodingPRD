              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-ZERO", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          trigger:
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 0 }
              as: SopAdmin
              captures: { rec_id: $.data.id }
            - call: "GET /sop/planning-cycles/${cycle_id}/accuracy-summary"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { sum_mape: $.data.mape_pct, sum_wmape: $.data.wmape_pct, sum_grade: $.data.accuracy_grade }
          assert:
            - "Status is 201 and AccuracyRecord.${rec_id}.forecast_units_snapshot == 500 (DemandForecast.${fc_id} is CONSENSUS_LOCKED with consensus_units 500)"
            - "signed_error_units == 500, abs_error_units == 500, ape_pct is null (NOT 0 and NOT 50000.00), accountable_planner_user_id == \"planner-1\""
            - "The summary reports record_count == 1, total_actual_units == 0, total_abs_error_units == 500"
            - "${sum_mape} is null (the only record is excluded from the MAPE mean), ${sum_wmape} is null (total_actual_units == 0), bias_pct is null"
            - "bias_flag == \"NONE\" and ${sum_grade} == \"UNGRADED\" — a null WMAPE grades as UNGRADED, not \"A\""
            - "ProductFamily.${fam_id}.scored_record_count == 1 while rolling_wmape_pct and rolling_bias_pct are null"
            - "worst_item_id == ${item_id} — the only scored item, ranked last for having zero actuals but still the argmax of a single-element set"

      - name: accuracy_rollup_bias_flag_under_forecast_at_negative_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.calc_accuracy_rollup
          - entities.ProductFamily.fields.bias_flag
          - entities.ProductFamily.fields.accuracy_grade
        distinguishing_aspect: |
          The bias band is symmetric and inclusive at BIAS_THRESHOLD_PCT 5.0, so a bias of
          exactly -5.00 must raise UNDER_FORECAST while -4.90 stays NONE. Both families still
          grade "A" because the grade comes from WMAPE (5.00 and 4.90), which proves bias and
          grade are independent readings of the same records rather than one derived from the
          other.
        test_recipe:
          setup:
            - "Two families FAM-A (planner-a) and FAM-B (planner-b), one MATURE item each, one shared customer, and a cycle over 2026-09..2026-09 with commitment 0."
            - "Locked forecasts of 950 units for SKU-A and 951 units for SKU-B; the cycle is walked to PUBLISHED and both lines actualize at 1000 units."
