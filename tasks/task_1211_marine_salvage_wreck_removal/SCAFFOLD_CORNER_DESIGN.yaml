            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: FIXED_PRICE, fixed_price_cents: 10000000, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 3000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 1000000, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-22T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_a: $.data.id } }
            - { call: "POST /charters/${ch_a}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters/${ch_a}/off-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "GET /contracts/${ct_id}", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { ctd1: $.data.cost_to_date_cents, ov1: $.data.overrun_flag } }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-22T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-22T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters/${ch_b}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters/${ch_b}/off-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "GET /contracts/${ct_id}", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { ctd2: $.data.cost_to_date_cents, ov2: $.data.overrun_flag } }
          assert:
            - "after charter A (11 active days): cost_to_date_cents == 11000000 and overrun_flag == false (11,000,000 is NOT > 11,000,000)"
            - "after charter B (1 more day): cost_to_date_cents == 12000000 and overrun_flag == true (12,000,000 > 11,000,000)"
      - name: cascading_side_effects_layer_coverage
        claim_type: cascade_chain
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / pollution_escalation_posture_phase_charter_cascade
          rationale: "The depth-3 pollution cascade (and the depth-2 completion bubble in the sibling instance) exercises this layer end-to-end."
      - name: dual_variant_calculation_layer_coverage
        claim_type: dual_variant
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / award_provisional_flat_vs_final_tiered_enhanced
          rationale: "Both dual-variant pairs (award and exposure) are asserted with literal divergent values in §1.8."

  - section: consistency_model
    instances:
      - name: offhire_response_immediate_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, calculations.charter_cost]
        distinguishing_aspect: "Immediate consistency: the off-hire RESPONSE body itself carries the computed active_days/standby_days/demurrage_days/total_cost_cents (2 days x 2,000,000 = 4,000,000); a subsequent GET agrees — no reconciliation lag."
        test_recipe:
          setup: ["NCNP contract ACTIVE; TUG charter ON_HIRE since 2026-05-10"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 2000000, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-20T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
          trigger:
            - { call: "POST /charters/${ch_id}/off-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01", captures: { tot: $.data.total_cost_cents, ad: $.data.active_days } }
          assert:
            - "off-hire response: active_days == 2, standby_days == 0, demurrage_days == 0, total_cost_cents == 4000000 (visible in the same response)"
            - "GET /charters/${ch_id} afterwards returns the identical values"
