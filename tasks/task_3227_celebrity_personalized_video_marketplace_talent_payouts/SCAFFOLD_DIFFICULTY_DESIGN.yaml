        grounds:
          - validations[priority=14]
          - entities.LicenseGrant.fields.starts_at
          - errors[ERR_LICENSE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [starts_at, ends_at) overlap on the
          SAME order and SAME license_type — back-to-back grants where
          new.starts_at == existing.ends_at are ADJACENT (allowed, empty
          intersection), while one-day-earlier start overlaps and is rejected.
          Resource: Order (license grants per order).
