        claim_type: Listing
        grounds: [endpoints, entities.Client]
        distinguishing_aspect: "GET /clients?limit=1 over two clients returns one item with total_count=2 and has_more=true."
        test_recipe:
          setup: ["Two clients created."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Page One", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { c1: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Page Two", dob: "1990-02-02" }
              as: IntakeSpecialist
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /clients?limit=1&offset=0"
              payload: {}
              as: HMISAdmin
          assert:
            - "response.meta_or_data.total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: ep_reservations_filtered_by_client
