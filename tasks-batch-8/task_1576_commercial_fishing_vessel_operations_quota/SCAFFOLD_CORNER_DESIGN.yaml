          - errors[ERR_NO_ACTIVE_CREW]
        distinguishing_aspect: "A settlement cannot be calculated with zero ACTIVE crew contracts — there is no one to split the crew pool among."
        test_recipe:
          setup: ["executed trip through LANDING_FINALIZED; settlement DRAFT; no crew contracts at all"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z4", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
            - { call: "POST /vessels/${v1}/activate", as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/permits", payload: { fishery_code: "HALIBUT", gear_type: "LONGLINE", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: FisheriesRegulator }
            - { call: "POST /vessels/${v1}/quota-holdings", payload: { fishery_code: "HALIBUT", season_year: 2026, initial_pounds: 10000 }, as: FisheriesRegulator }
