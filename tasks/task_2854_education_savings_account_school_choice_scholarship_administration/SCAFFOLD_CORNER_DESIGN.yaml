            - "Application.${a1_id}.provisional_award_cents == 932663 for BAND_B + [DISABILITY_IEP], unchanged by the rejected call"

      - name: withdrawing_a_draft_application_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.ACCEPTED_to_WITHDRAWN
          - errors.ERR_INVALID_STATE_TRANSITION
