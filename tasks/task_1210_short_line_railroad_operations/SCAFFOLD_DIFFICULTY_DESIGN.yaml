  - rule_id: priority_pair_validation_conflict
    instances:
      - name: crew_call_state_error_beats_hos_safety_error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_MEMBER_NOT_AVAILABLE]
          - errors[ERR_HOS_DAILY_LIMIT]
        distinguishing_aspect: |
          Category pair state vs business_safety: the member is ON_DUTY (state violation) AND has 720
          rolling minutes (HOS daily violation); the scaffold's priority order (4 before 5) means the
          dual-failing request MUST surface ERR_MEMBER_NOT_AVAILABLE, never ERR_HOS_DAILY_LIMIT.
        test_recipe:
          setup:
            - "crew member ON_DUTY via an accepted then reported crew call"
            - "member rolling_24h_minutes corrected to 720 via adjust-hos"
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "F. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Branch MP 1-5", milepost_start: 1, milepost_end: 5, fra_class: CLASS_2 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-401", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T18:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/crew-calls/${call_id}/report-on-duty"
              payload: {}
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "GET /rail/crew-members/${mem_id}"
              payload: {}
              as: CrewCaller
              captures: { mem_v: $.data.version }
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { rolling_24h_minutes: 720, expected_crew_member_version: "${mem_v}" }
              as: CrewCaller
          trigger:
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-04T06:00:00Z", scheduled_end_at: "2026-05-04T18:00:00Z" }
              as: CrewCaller
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_MEMBER_NOT_AVAILABLE"
            - "err != ERR_HOS_DAILY_LIMIT (priority 4 state check fires before priority 5 safety check)"

      - name: accept_siding_safety_beats_credit_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_SIDING_AGREEMENT_INACTIVE]
          - errors[ERR_CUSTOMER_CREDIT_SUSPENDED]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (different pair than state-vs-safety): order
          acceptance fails both the siding-agreement safety check (SUSPENDED) and the customer credit
          fiscal check (SUSPENDED); priority 5 before 9 means ERR_SIDING_AGREEMENT_INACTIVE MUST surface.
        test_recipe:
          setup:
            - "customer with credit_status SUSPENDED and a siding whose agreement is SUSPENDED"
            - "a PLACED order for 2 BOX cars on that siding"
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Rustbelt Steel", billing_email: "ap@rustbelt.example" }
