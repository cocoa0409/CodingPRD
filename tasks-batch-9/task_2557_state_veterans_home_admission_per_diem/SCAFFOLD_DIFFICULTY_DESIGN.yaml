              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
