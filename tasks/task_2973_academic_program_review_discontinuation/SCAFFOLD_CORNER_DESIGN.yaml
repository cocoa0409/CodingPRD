            - "AcademicProgram.${prog_id}.lifecycle_state == UNDER_REVIEW and catalog_status == LISTED, restored from catalog_status_pre_decision rather than stepped back one edge"
            - "TeachOutPlan.${plan_id}.state == SUPERSEDED"
            - "FacultyAppointment.${adj_id}.state == ASSIGNED and AcademicProgram.${prog_id}.assigned_pool_fte == 0.25, reducible_fte == 0.25"

      - name: retain_and_propose_reassignment_conditional_guards
        claim_type: conditional_cascade
        grounds:
          - validations[priority=45]
          - errors[ERR_REASSIGNMENT_TARGET_INVALID]
          - state_machines.FacultyAppointment.ASSIGNED_to_TEACH_OUT_RETAINED
          - state_machines.FacultyAppointment.ASSIGNED_to_REASSIGNMENT_PROPOSED
        distinguishing_aspect: |
          Both guards live in one validation row but read different context:
          RETAIN is refused because the program has no APPROVED or IN_EFFECT
          plan (a DRAFT plan is not enough), and PROPOSE_REASSIGNMENT is refused
          because the target department equals the program's own
          department_code. Same error id, two different causes, and neither
          attempt may shift a single unit of fte.
        test_recipe:
          setup:
            - "Program HIST-BA in department HIST with one ASSIGNED adjunct appointment (0.25 fte, 4000000 cents) and no teach-out plan at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /provost/faculty-appointments/${adj_id}/transitions"
              payload: { action: "RETAIN" }
              as: HRPartner
              captures: { err_retain: $.data.error_id }
            - call: "POST /provost/faculty-appointments/${adj_id}/transitions"
              payload: { action: "PROPOSE_REASSIGNMENT", reassigned_to_department_code: "HIST" }
              as: HRPartner
              captures: { err_same_dept: $.data.error_id }
            - call: "POST /provost/faculty-appointments/${adj_id}/transitions"
              payload: { action: "PROPOSE_REASSIGNMENT", reassigned_to_department_code: "CLAS" }
              as: HRPartner
          assert:
            - "the first trigger returns 422 with data.error_id == ERR_REASSIGNMENT_TARGET_INVALID — no APPROVED or IN_EFFECT plan exists on the program"
            - "the second trigger returns 422 with data.error_id == ERR_REASSIGNMENT_TARGET_INVALID — the target department equals the program's own HIST"
            - "after both refusals FacultyAppointment.${adj_id}.state == ASSIGNED with reassigned_to_department_code == null, and AcademicProgram.${prog_id}.assigned_pool_fte == 0.25"
            - "the third trigger returns 200 with state == REASSIGNMENT_PROPOSED and reassigned_to_department_code == CLAS"
            - "after the accepted proposal AcademicProgram.${prog_id}.assigned_pool_fte == 0.00, active_fte_total == 0.25, reducible_fte == 0.00, staffing_liability_cents == 0"

  - section: calculations
    instances:
      - name: viability_composite_matches_the_four_factor_weighted_sum
        claim_type: correct_result
        grounds:
          - calculations.program_viability_composite
          - calculations.program_cost_per_credit_hour
          - endpoints["POST /provost/academic-programs/{id}/metric-snapshots"]
        distinguishing_aspect: |
          The whole composite is recomputed from scratch on EVERY snapshot
          write, not just the last one, and the enrollment factor clamps at 0
          rather than going negative: a -33.3333% trend gives 50 + 2.5 x
          (-33.3333) = -33.33 which clamps to 0, so the 0.35 weight contributes
          nothing at all. The small-program floor also stops applying by itself
          once the window headcount reaches 60.
        test_recipe:
          setup:
            - "One UNDERGRADUATE program HIST-BA with no snapshots."
            - "Fixture A's three snapshots are then posted one at a time in term order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { s3_id: $.data.id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Provost
          assert:
            - "after the first snapshot: AcademicProgram.${prog_id}.snapshot_count == 1, cost_per_credit_hour_rolling_cents == 40000, cost_per_credit_hour_latest_cents == 40000, composite_score == 39.99, viability_band == NONVIABLE — the raw weighted sum 49.2333... was ceilinged by SMALL_PROGRAM_CEILING because the window enrolled only 30 heads"
            - "after the second snapshot: rolling == 42593, latest == 45833, composite_score == 30.19, viability_band == NONVIABLE (window headcount 54, still under MIN_VIABLE_WINDOW_HEADCOUNT, but the raw sum is already below the ceiling)"
            - "after the third snapshot: rolling == 45946, latest == 55000, snapshot_count == 3, composite_score == 29.06, viability_band == NONVIABLE"
            - "the 29.06 is the sum of enrollment_score 0 x 0.35 (clamped up from -33.33), completion_score 30.4054... x 0.25, demand_score 42 x 0.20 taken from term 3 only, and efficiency_score 65.2940... x 0.20 — it is NOT 39.99, so the floor override stopped applying once window headcount reached 74"
            - "the per-term diagnostics are ViabilityMetricSnapshot.${s1_id}.cost_per_credit_hour_cents == 40000, ${s2_id} == 45833, ${s3_id} == 55000"
            - "the final GET returns the same composite_score 29.06 — the value is stored, not recomputed differently on read"

      - name: rolling_window_drops_the_oldest_term_when_a_fourth_snapshot_lands
        claim_type: input_set_filtering
        grounds:
          - calculations.program_cost_per_credit_hour.input_set
          - calculations.program_viability_composite.input_set
          - calculations.program_cost_per_credit_hour.constants.ROLLING_WINDOW_TERMS
        distinguishing_aspect: |
          ROLLING_WINDOW_TERMS is 3, so a fourth snapshot evicts term 1 from
          every program-level rollup even though the row itself is still stored
          and still carries its own per-term diagnostic. Both the cost variants
          and all four composite factors must move to the terms 2-4 window; a
          rollup computed over all four snapshots would give different numbers.
        test_recipe:
          setup:
            - "Fixture A's three snapshots are already posted on HIST-BA (rolling 45946, composite 29.06)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2027SP", term_index: 4, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 9000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
              captures: { s4_id: $.data.id }
          assert:
            - "the trigger returns 201 and AcademicProgram.${prog_id}.snapshot_count == 4 — nothing was deleted"
            - "cost_per_credit_hour_rolling_cents == 48438, computed as round_half_up(31000000 / 640) over terms 2-4 only; a four-term rollup would give 43000 and is wrong"
            - "cost_per_credit_hour_latest_cents == 45000 (term 4 alone)"
            - "composite_score == 30.54 and viability_band == NONVIABLE, from window headcount 64, enrollment_score 8.3333... (trend -16.6667% from term 2 to term 4), completion_score 27.34375, demand_score 42, efficiency_score 61.9348..."
            - "ViabilityMetricSnapshot.${s1_id}.cost_per_credit_hour_cents is still 40000 and the row is still returned by GET /provost/academic-programs/${prog_id}/metric-snapshots with total_count == 4"
            - "ViabilityMetricSnapshot.${s4_id}.cost_per_credit_hour_cents == 45000"

      - name: small_program_floor_applies_at_59_heads_and_not_at_60
        claim_type: constants_applied
        grounds:
          - calculations.program_viability_composite.constants.MIN_VIABLE_WINDOW_HEADCOUNT
          - calculations.program_viability_composite.constants.SMALL_PROGRAM_CEILING
        distinguishing_aspect: |
          MIN_VIABLE_WINDOW_HEADCOUNT is 60 and the comparison is strict `<`, so
          a window enrolling exactly 60 heads keeps its earned score while 59
          heads is ceilinged to 39.99 — and 39.99 is BELOW IMPROVEMENT_BAND_MIN
          40.0, so the ceiling drops an otherwise strong program straight into
          NONVIABLE. The two programs are identical apart from one head in the
          newest term.
        test_recipe:
          setup:
            - "Two UNDERGRADUATE programs, each with three cheap high-performing terms: 300 credit hours and 3000000 cents per term (rolling cost 10000, efficiency clamped at 100), completions 13/13/14, market demand 90."
            - "BIG-BA enrolls 20/20/20 heads (window 60). SML-BA enrolls 20/20/19 heads (window 59)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "BIG-BA", name: "Big Program BA", degree_level: "UNDERGRADUATE", department_code: "BIG" }
              as: ReviewCoordinator
              captures: { big_id: $.data.id }
            - call: "POST /provost/academic-programs"
              payload: { code: "SML-BA", name: "Small Program BA", degree_level: "UNDERGRADUATE", department_code: "SML" }
              as: ReviewCoordinator
              captures: { sml_id: $.data.id }
            - call: "POST /provost/academic-programs/${big_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 20, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 13, market_demand_index: 90 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${big_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 20, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 13, market_demand_index: 90 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${sml_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 20, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 13, market_demand_index: 90 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${sml_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 20, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 13, market_demand_index: 90 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${big_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 14, market_demand_index: 90 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${sml_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 19, credit_hours: 300, direct_cost_cents: 3000000, completions_count: 14, market_demand_index: 90 }
              as: ReviewCoordinator
          assert:
            - "AcademicProgram.${big_id}.composite_score == 80.50 and viability_band == CONTINUE_ELIGIBLE — window headcount is exactly 60, so no ceiling is applied (enrollment 50 x 0.35 + completion 100 x 0.25 + demand 90 x 0.20 + efficiency 100 x 0.20)"
            - "AcademicProgram.${sml_id}.composite_score == 39.99 and viability_band == NONVIABLE"
            - "the SML-BA raw weighted sum would have been 76.13 (enrollment 37.50 because of the -5% trend, completion 100, demand 90, efficiency 100) — the stored value must be the 39.99 ceiling, not 76.13"
            - "both programs have cost_per_credit_hour_rolling_cents == 10000 and cost_per_credit_hour_latest_cents == 10000, and both efficiency scores clamped at 100 from a raw 300"
            - "both programs have severance_budget_cap_cents == 1350000 == floor(0.15 x 9000000)"

      - name: severance_cap_floors_the_fraction_instead_of_rounding_half_up
        claim_type: precision
        grounds:
          - calculations.staffing_reduction_waterfall.precision
          - calculations.staffing_reduction_waterfall.constants.SEVERANCE_CAP_RATE
        distinguishing_aspect: |
          severance_budget_cap_cents is floored, not round_half_up-ed, and the
          two disagree by design here: 0.15 x 34000010 is exactly 5100001.5, so
          the cap must be 5100001 and never 5100002. The same window still
          rounds the cost-per-credit-hour quotient half-up, so one calculation
          uses two different rounding modes on the same input set.
        test_recipe:
          setup:
            - "Fixture A with term 1's direct cost nudged to 12000010 cents, making the rolling window cost sum 34000010."
            - "One ADJUNCT appointment (0.25 fte, 4000000 cents) so the waterfall has a roster to price."
