        excluded_because:
          difficulty_instance: combinatorial_formula / accreditor_risk_index_weighted_sum_then_single_pass_tier_multiplier
          rationale: "The four weights, the tier floors and the single-pass multiplier (no re-tiering after multiplication) are asserted there with pre-computed literals."

