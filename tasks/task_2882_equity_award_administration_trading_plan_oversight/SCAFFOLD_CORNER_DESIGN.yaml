            - call: "POST /performance-cycles"
              payload: { plan_id: "${plan_id}", metric_code: "EPS-2026", target_value: 100, certification_due_date: "2027-02-28" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { c_id: $.data.id }
            - call: "POST /performance-cycles/${c_id}/certify"
              payload: { actual_value: 100 }
              as: BoardMember
              as_user_id: "board-1"
          trigger:
            - call: "POST /participants/${p_id}/terminate"
              payload: { termination_date: "2026-03-10", termination_reason: "FOR_CAUSE" }
