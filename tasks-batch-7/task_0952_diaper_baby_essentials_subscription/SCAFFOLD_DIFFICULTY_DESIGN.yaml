              as: Anonymous
              captures: { o_id: $.data.id, o_tok: $.data.verification_token }
            - call: "POST /accounts/${o_id}/verify"
              payload: { verification_token: "${o_tok}" }
              as: Anonymous
            - call: "POST /accounts"
              payload: { email: "purchaser5@example.com", full_name: "Purchaser Five", payment_method_on_file: true }
              as: Anonymous
              captures: { p_id: $.data.id, p_tok: $.data.verification_token }
            - call: "POST /accounts/${p_id}/verify"
              payload: { verification_token: "${p_tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${o_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${o_id}"
              captures: { child_id: $.data.id }
            - call: "POST /registries"
              payload: { owner_account_id: "${o_id}", child_id: "${child_id}", title: "Units Registry" }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registries/${reg_id}/items"
              payload: { sku_id: "${sku_std}", requested_quantity: 3 }
              as: RegistryOwner
              as_user_id: "${o_id}"
              captures: { item_id: $.data.id, item_v1: $.data.version }
            - call: "POST /registries/${reg_id}/open"
              payload: {}
              as: RegistryOwner
              as_user_id: "${o_id}"
            - call: "POST /gift-orders"
              payload: { registry_item_id: "${item_id}", purchaser_account_id: "${p_id}", quantity: 2, expected_registry_item_version: "${item_v1}" }
              as: GiftPurchaser
              as_user_id: "${p_id}"
              captures: { gift1: $.data.id }
            - call: "POST /gift-orders/${gift1}/pay"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
            - call: "GET /registry-items/${item_id}"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
              captures: { item_v2: $.data.version, qty_after_first: $.data.fulfilled_quantity }
            - call: "POST /gift-orders"
              payload: { registry_item_id: "${item_id}", purchaser_account_id: "${p_id}", quantity: 1, expected_registry_item_version: "${item_v2}" }
              as: GiftPurchaser
              as_user_id: "${p_id}"
              captures: { gift2: $.data.id }
            - call: "POST /gift-orders/${gift2}/pay"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /gift-orders/${gift1}/refund"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
          assert:
            - "${qty_after_first} == 2"
            - "RegistryItem.${item_id}.requested_quantity == 3"
            - "RegistryItem.${item_id}.fulfilled_quantity == 1"
            - "RegistryItem.${item_id}.status == PARTIALLY_FULFILLED"
            - "GiftOrder.${gift1}.status == REFUNDED"
            - "GiftOrder.${gift1}.paid_cents == 2400"
            - "GiftOrder.${gift2}.status == PAID"
            - "GiftOrder.${gift2}.paid_cents == 1200"
            - "Registry.${reg_id}.completion_pct == 0.3333"
