              captures: { pay_err: $.data.error_id }
          assert:
            - "${status_b} == PAID (settled 100000-40000 = 60000 afterwards)"
            - "${pay_err} == ERR_PLAN_DOCUMENT_LAPSED (safety priority 7 beats fiscal priority 10)"
            - "the response is NOT ERR_INSUFFICIENT_VESTED_BALANCE although 60000 < 100000 also holds"
            - "Plan.${plan_id}.document_posture == LAPSED_FAILURE"
            - "DistributionRequest.${req_a}.status == PAYABLE (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: vesting_cliff_exact_third_year_boundary
        grounds:
          - calculations.vesting_determination
          - entities.Account.fields.vested_balance_cents
        distinguishing_aspect: |
          Metric: service duration in thousandths of a year; endpoint: account
          statement. At clock 2027-08-04, participant Q (hire 2024-08-04) has
          floor(1095*1000/365) = 3000 thousandths == cliff*1000 and IS vested
          (>= inclusive); participant R (hire 2024-08-05) has 2997 and is NOT.
        test_recipe:
          setup:
            - "ACTIVE plan, vesting_cliff_years=3, FIXED_RATE fund, window 2027"
            - "participants Q (hire 2024-08-04) and R (hire 2024-08-05), each with an account funded by 100000 settled cents"
            - "clock advanced to 2027-08-04T00:00:00Z (exactly Q's third service anniversary)"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan VB", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-Q", hire_date: "2024-08-04", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { q_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-R", hire_date: "2024-08-05", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${q_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { acct_q: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${r_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { acct_r: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${q_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${q_id}"
              captures: { e_q: $.data.id }
            - call: "POST /api/deferral-elections/${e_q}/submit"
              as: Participant
              as_user_id: "${q_id}"
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${r_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${r_id}"
              captures: { e_r: $.data.id }
            - call: "POST /api/deferral-elections/${e_r}/submit"
              as: Participant
              as_user_id: "${r_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${e_q}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/deferral-elections/${e_r}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${acct_q}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${acct_r}/settle-entries"
              as: BenefitsAdministrator
