              as: StudioAdmin
              captures: { reg1: $.data.id, reg1_status: $.data.status }
            - call: "POST /studios/${sid}/recital-registrations"
              payload: { recital_event_id: "${ev}", student_id: "${s2}" }
              as: StudioAdmin
              captures: { reg2: $.data.id, reg2_status: $.data.status }
          trigger:
            - call: "POST /studios/${sid}/recital-registrations/${reg1}/withdraw"
              payload: {}
              as: StudioAdmin
            - call: "GET /studios/${sid}/recital-registrations/${reg2}"
              payload: {}
              as: StudioAdmin
              captures: { reg2_after: $.data.status }
            - call: "GET /studios/${sid}/recital-events/${ev}"
