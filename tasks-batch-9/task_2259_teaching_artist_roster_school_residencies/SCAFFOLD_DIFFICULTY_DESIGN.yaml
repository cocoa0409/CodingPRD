  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: artist_half_open_pairwise_overlap_rejects_but_abutting_allowed
        grounds:
          - calculations.session_interval_conflict
          - validations[priority=24]
          - errors[ERR_ARTIST_SCHEDULE_CONFLICT]
          - entities.Session.fields.end_time
        distinguishing_aspect: |
          Resource: the TeachingArtist, under PAIRWISE half-open interval
          semantics. Against an existing 09:00-10:00 session, a 09:30-10:30
          request for the same artist on the same date MUST be rejected with
          ERR_ARTIST_SCHEDULE_CONFLICT, while the abutting 10:00-11:00 request
          MUST be accepted because end_time is exclusive and both sessions sit at
          the same school (so the 45-minute travel buffer does not apply).
