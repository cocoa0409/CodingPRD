              as_user_id: "${cl_id}"
              captures: { ts_a: $.data.id }
            - call: "POST /staffing/assignments/${asg_b}/timesheets"
              payload: { clock_in: "2026-06-09T07:00:00Z", clock_out: "2026-06-09T15:00:00Z", break_minutes: 30 }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { ts_b: $.data.id }
            - call: "POST /staffing/timesheets/${ts_a}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
            - call: "GET /staffing/facilities/${fac_id}"
              as: BillingAgent
              captures: { fv_stale: $.data.version }
            - call: "POST /staffing/timesheets/${ts_b}/verify"
              payload: {}
              as: FacilityVerifier
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /staffing/invoices"
              payload: { facility_id: "${fac_id}", period_start: "2026-06-08T00:00:00Z", period_end: "2026-06-15T00:00:00Z", expected_facility_version: "${fv_stale}" }
              as: BillingAgent
              captures: { err: $.data.error_id }
            - call: "GET /staffing/facilities/${fac_id}"
              as: BillingAgent
              captures: { fv_fresh: $.data.version }
            - call: "POST /staffing/invoices"
              payload: { facility_id: "${fac_id}", period_start: "2026-06-08T00:00:00Z", period_end: "2026-06-15T00:00:00Z", expected_facility_version: "${fv_fresh}" }
              as: BillingAgent
              captures: { inv_id: $.data.id, lc: $.data.line_count, bill: $.data.bill_total_cents }
          assert:
            - "${err} == ERR_STALE_FACILITY_VERSION with HTTP 412"
            - "the retry with the fresh facility version returns 201"
            - "${lc} == 2"
            - "${bill} == 206626"
            - "Timesheet.${ts_a}.status == INVOICED and Timesheet.${ts_b}.status == INVOICED"
            - "Facility.${fac_id}.pending_pay_cents == 0"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Facility.fields.pending_pay_cents
          - state_machines.Timesheet.SUBMITTED_to_VERIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / timesheet_verify_three_link_cascade_to_order_closed
          rationale: "The Facility.version bump on pending_pay_cents change is exercised inside the verification cascade of the named §1.8 instance and re-observed by the two OCC instances above."

  # =========================================================================
  # From Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: verify_response_shows_all_immediate_changes
        claim_type: immediate
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_VERIFIED
          - entities.Facility.fields.pending_pay_cents
        excluded_because:
          difficulty_instance: transitive_cascade / timesheet_verify_three_link_cascade_to_order_closed
          rationale: "Immediate visibility of the verification cascade (timesheet, assignment, shift, order, facility counter) in one request is asserted by the named §1.8 instance."




