scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Case.fields.status
          - entities.Case.fields.case_type
          - endpoints
        distinguishing_aspect: "POST /cases with required fields returns 201; status defaults REPORTED, case_type defaults PENDING, jurisdiction_status null until triage."
        test_recipe:
          setup: ["An investigator exists to be named as lead."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA1", badge_no: "CB-1" }
              as: Admin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { decedent_name: "Doe CA1", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${case_id}.status == REPORTED"
            - "Case.${case_id}.case_type == PENDING"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Case
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /cases/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Case.fields.decedent_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cases missing death_location_county returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An investigator exists."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA2", badge_no: "CB-2" }
              as: Admin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { decedent_name: "Doe", reported_death_at: "2026-05-01T00:00:00Z", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_bad_case_type_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Case.fields.case_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cases/{id}/triage with case_type='SUICIDE' (out of {NATURAL,ACCIDENT,HOMICIDE,PENDING}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A REPORTED case exists."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA3", badge_no: "CB-3" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "SUICIDE" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_badge_no_returns_409
        claim_type: Type Constraints
        grounds:
          - entities.Investigator.fields.badge_no
          - validations[priority=61]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Registering a second investigator with an already-used badge_no returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["One investigator with badge_no 'CB-DUP' exists."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv First", badge_no: "CB-DUP" }
              as: Admin
          trigger:
            - call: "POST /investigators"
              payload: { full_name: "Inv Second", badge_no: "CB-DUP" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE"

      - name: system_fields_generated_on_case_create
        claim_type: System Fields
        grounds:
          - entities.Case.fields.status
        distinguishing_aspect: "id, created_at, updated_at, version are server-minted on POST /cases; version starts at 1 and client-supplied values are ignored."
        test_recipe:
          setup: ["An investigator exists."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA5", badge_no: "CB-5" }
              as: Admin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { decedent_name: "Doe CA5", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id, ver: $.data.version }
          assert:
            - "Case.${case_id}.version == 1"

      - name: computed_jurisdiction_declined_out_of_county
        claim_type: Computed Fields
        grounds:
          - entities.Case.fields.jurisdiction_status
          - entities.Case.fields.served_county
          - state_machines.Case.REPORTED_to_DECLINED
        distinguishing_aspect: "Triage of a case whose death_location_county is not served sets jurisdiction_status DECLINED, served_county false, status DECLINED."
        test_recipe:
          setup: ["A REPORTED case with death_location_county 'Elsewhere' (not served)."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA6", badge_no: "CB-6" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CA6", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Elsewhere", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "Case.${case_id}.jurisdiction_status == DECLINED"
            - "Case.${case_id}.status == DECLINED"

      - name: list_cases_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Case
          - response_envelope
        distinguishing_aspect: "GET /cases returns paginated array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["At least one case exists."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CA7", badge_no: "CB-7" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CA7", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "GET /cases"
              payload: { limit: 5, offset: 0 }
              as: Admin
          assert:
            - "response.meta.total_count >= 1"
            - "response.data is an array"

  # =================================================================
  - section: state_machines
    instances:
      - name: triage_from_investigating_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Case.REPORTED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Triaging a case already INVESTIGATING (past REPORTED) returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["NATURAL case INVESTIGATING with a body (already triaged once)."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS1", badge_no: "CS-1" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS1", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T1" }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "HOMICIDE" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: artifact_on_declined_case_returns_case_declined
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=22]
          - state_machines.Case.REPORTED_to_DECLINED
          - errors[ERR_CASE_DECLINED]
        distinguishing_aspect: "Adding a body to a DECLINED case returns ERR_CASE_DECLINED (409)."
        test_recipe:
          setup: ["A DECLINED case (out-of-county triage)."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS2", badge_no: "CS-2" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS2", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Elsewhere", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T2" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CASE_DECLINED"

      - name: close_case_blocked_while_body_stored
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Case.CERTIFIED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a CERTIFIED case whose Body is still STORED (not RELEASED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["NATURAL case CERTIFIED with body STORED (signed cert but body not yet released)."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS3", badge_no: "CS-3" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME CS3", license_no: "CS-L3", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cooler-units"
              payload: { label: "COOLER-CS3", slot_capacity: 2 }
              as: Admin
              captures: { cooler_id: $.data.id, cooler_v: $.data.version }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS3", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T3" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/store"
              payload: { cooler_unit_id: "${cooler_id}", expected_cooler_version: "${cooler_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/death-certificate"
              payload: { cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { cert_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { case_v: $.data.version }
            - call: "POST /death-certificates/${cert_id}/sign"
              payload: { expected_case_version: "${case_v}" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
          trigger:
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancelled_exam_cannot_complete
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AutopsyExam.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a CANCELLED autopsy exam returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["NATURAL case INVESTIGATING with body; AutopsyExam SCHEDULED then CANCELLED."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS4", badge_no: "CS-4" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "Path CS4", license_no: "CS-L4" }
              as: Admin
              captures: { path_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS4", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T4" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/autopsy-exams"
              payload: { pathologist_user_id: "${path_id}", scheduled_for: "2026-05-01T00:00:00Z", duration_minutes: 60 }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /autopsy-exams/${exam_id}/cancel"
              payload: {}
              as: Pathologist
              as_user_id: "${path_id}"
          trigger:
            - call: "POST /autopsy-exams/${exam_id}/complete"
              payload: { primary_finding: "x", cause_of_death: "y" }
              as: Pathologist
              as_user_id: "${path_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: first_body_bubbles_case_to_investigating
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Case.ACCEPTED_to_INVESTIGATING
          - entities.Case.fields.status
        distinguishing_aspect: "First POST /cases/{id}/bodies on an ACCEPTED case cascades Case ACCEPTED->INVESTIGATING."
        test_recipe:
          setup: ["An ACCEPTED NATURAL case with no body yet."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS5", badge_no: "CS-5" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS5", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T5" }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "Case.${case_id}.status == INVESTIGATING"

      - name: indigent_bury_escheats_remaining_held_property
        claim_type: Side Effect Execution
        grounds:
          - state_machines.IndigentDisposition.APPROVED_to_BURIED
          - entities.PropertyItem.fields.item_status
        distinguishing_aspect: "Burying an APPROVED indigent disposition cascades remaining HELD PropertyItem -> ESCHEATED."
        test_recipe:
          setup: ["NATURAL case with body RELEASED via approved indigent path; one HELD PropertyItem; IndigentDisposition APPROVED."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS6", badge_no: "CS-6" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME CS6", license_no: "CS-L6", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cooler-units"
              payload: { label: "COOLER-CS6", slot_capacity: 2 }
              as: Admin
              captures: { cooler_id: $.data.id, cooler_v: $.data.version }
            - call: "POST /cases"
              payload: { decedent_name: "Unknown CS6", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T6" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/store"
              payload: { cooler_unit_id: "${cooler_id}", expected_cooler_version: "${cooler_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "coat", valuation_cents: 3000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item_id: $.data.id }
            - call: "POST /cases/${case_id}/indigent-disposition"
              payload: { statutory_allowance_cents: 400000, itemized_cost_cents: 100000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /indigent-dispositions/${disp_id}/approve"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
            - call: "POST /bodies/${body_id}/release"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /indigent-dispositions/${disp_id}/bury"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "IndigentDisposition.${disp_id}.disposition_status == BURIED"
            - "PropertyItem.${item_id}.item_status == ESCHEATED"

      - name: property_release_approve_cascade_releases_items
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PropertyRelease.REQUESTED_to_APPROVED
          - entities.PropertyItem.fields.item_status
          - entities.PropertyRelease.fields.released_item_count
        distinguishing_aspect: "Approving a property release cascades both HELD PropertyItems -> RELEASED and sets released_item_count == 2."
        test_recipe:
          setup: ["NATURAL case CERTIFIED (cert signed) with two HELD PropertyItems; verified NextOfKin; PropertyRelease REQUESTED; approver differs from case lead."]
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv CS7", badge_no: "CS-7" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Inv CS7b", badge_no: "CS-7b" }
              as: Admin
              captures: { inv2_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME CS7", license_no: "CS-L7", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe CS7", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "CS-T7" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "phone", valuation_cents: 20000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "cash", valuation_cents: 8000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item2_id: $.data.id }
            - call: "POST /cases/${case_id}/next-of-kin"
              payload: { full_name: "Kin CS7", relationship: "SPOUSE" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { kin_id: $.data.id }
            - call: "POST /next-of-kin/${kin_id}/verify"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/death-certificate"
              payload: { cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { cert_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { case_v: $.data.version }
            - call: "POST /death-certificates/${cert_id}/sign"
              payload: { expected_case_version: "${case_v}" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
            - call: "POST /cases/${case_id}/property-releases"
              payload: { next_of_kin_id: "${kin_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /property-releases/${rel_id}/approve"
              payload: {}
