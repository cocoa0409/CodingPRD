# =============================================================================
# Scaffold: Registered Apprenticeship Tracking (DOL) — Expert
# =============================================================================

scenario: |
  381. Registered Apprenticeship Tracking (DOL): program standards & occupation,
  apprentice agreement & sponsor, on-the-job hours & RTI (related instruction),
  wage-progression schedule, journeyman ratio, competency/milestone, completion
  certificate, EEO/affirmative reporting

domain_name: registered-apprenticeship
api_prefix: /apprenticeship

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # hours-based vs competency-based wage progression / completion
    - cascading_side_effects          # OJT approval -> hours -> wage step -> wage snapshot -> eligibility
    - rate_threshold_triggers         # wage-step breakpoints on cumulative OJT hours
    - optimistic_concurrency          # ratio-slot consumption race on program version at register

  entity_topology: flat
  # Flat peer entities under a single namespace prefix, linked by foreign keys
  # (FK -> X.id) in request bodies; no nested URL ownership paths. Every entity
  # collection lives directly under /apprenticeship.

  state_machine_shape: cyclic
  # ApprenticeAgreement has a suspend/reinstate cycle (ACTIVE<->SUSPENDED) plus a
  # branch to COMPLETED|CANCELLED; OJTHoursEntry has an APPROVED->PENDING reopen
  # cycle; MilestoneAttainment has a SUBMITTED->REJECTED->SUBMITTED resubmit cycle.

  relationship_patterns:
    - one_to_many        # Sponsor -> Programs, Program -> WageSteps/Milestones/Agreements
    - many_to_many       # MilestoneAttainment is the junction of Agreement x Milestone
    - cross_aggregate    # Agreement references Apprentice, Journeyworker, and Program

  role_model: segregation_of_duties
  # Sponsor logs hours & registers apprentices; TrainingCoordinator approves hours
  # and milestones (cannot also log them); RegistrationAgency activates programs and
  # issues the completion certificate (the sponsor cannot self-certify completion).

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Sponsoring employer/association legal name" }
      - { name: ein, type: string, source: input, description: "Employer identification number, format NN-NNNNNNN" }
      - { name: contact_email, type: string, source: input, description: "Primary sponsor contact email" }

  - name: ApprenticeshipProgram
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; owning sponsor" }
      - { name: occupation_code, type: string, source: input, description: "O*NET-SOC occupation code, e.g. 47-2111.00" }
      - { name: occupation_title, type: string, source: input, description: "Occupation title for the standards" }
      - { name: completion_type, type: enum, source: input, description: "HOURS_BASED | COMPETENCY_BASED | HYBRID; selects authoritative wage-step and completion variant", constraints: "HOURS_BASED | COMPETENCY_BASED | HYBRID" }
      - { name: ojt_hours_required, type: integer, source: input, description: "Total on-the-job training hours required to complete (positive integer)" }
      - { name: rti_hours_required, type: integer, source: input, description: "Total related-instruction hours required (positive integer)" }
      - { name: base_journeyworker_wage_cents, type: integer, source: input, description: "Fully-qualified journeyworker hourly wage in cents; wage steps are a percentage of this" }
      - { name: journeyman_ratio, type: integer, source: input, description: "Max apprentices a single qualified journeyworker may supervise (>=1)" }
      - { name: active_agreement_count, type: integer, source: computed, default: 0, description: "Count of agreements for this program in {REGISTERED, ACTIVE, SUSPENDED}" }
      - { name: available_apprentice_slots, type: integer, source: computed, default: 0, description: "max(0, ratio_capacity - active_agreement_count); see journeyman_ratio_capacity" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> ARCHIVED", constraints: "DRAFT | ACTIVE | ARCHIVED" }

  - name: WageStep
    parent: ApprenticeshipProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ApprenticeshipProgram.id; owning program" }
      - { name: step_number, type: integer, source: input, description: "1-based ordinal of this wage step (unique per program)" }
      - { name: ojt_hours_threshold, type: integer, source: input, description: "Cumulative approved OJT hours at or above which this step applies (>=0)" }
      - { name: wage_pct, type: number, source: input, description: "Fraction of base_journeyworker_wage_cents paid at this step, e.g. 0.65" }

  - name: Milestone
    parent: ApprenticeshipProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ApprenticeshipProgram.id; owning program" }
      - { name: sequence, type: integer, source: input, description: "1-based ordinal of this competency milestone (unique per program)" }
      - { name: title, type: string, source: input, description: "Competency/milestone name" }
      - { name: required_for_completion, type: boolean, source: input, default: true, description: "Whether attainment is mandatory for competency completion" }

  - name: Journeyworker
    parent: Sponsor
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; employing sponsor" }
      - { name: full_name, type: string, source: input, description: "Journeyworker full name" }
      - { name: active_apprentice_count, type: integer, source: computed, default: 0, description: "Count of agreements in {REGISTERED, ACTIVE, SUSPENDED} supervised by this journeyworker" }
      - { name: status, type: enum, source: system, description: "PROBATIONARY -> QUALIFIED -> INACTIVE", constraints: "PROBATIONARY | QUALIFIED | INACTIVE" }

  - name: Apprentice
    parent: Sponsor
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; sponsoring employer" }
      - { name: full_name, type: string, source: input, description: "Apprentice full name" }
      - { name: gender, type: enum, source: input, description: "EEO gender category", constraints: "MALE | FEMALE | NONBINARY | UNDISCLOSED" }
      - { name: race_ethnicity, type: enum, source: input, description: "EEO race/ethnicity category", constraints: "HISPANIC | WHITE | BLACK | ASIAN | NATIVE_AMERICAN | PACIFIC_ISLANDER | TWO_OR_MORE | UNDISCLOSED" }
      - { name: is_veteran, type: boolean, source: input, default: false, description: "Affirmative-action veteran flag" }
      - { name: has_disability, type: boolean, source: input, default: false, description: "Affirmative-action disability flag" }

  - name: ApprenticeAgreement
    parent: ApprenticeshipProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ApprenticeshipProgram.id; program registered into" }
      - { name: apprentice_id, type: string, source: input, description: "FK -> Apprentice.id; the registrant" }
      - { name: journeyworker_id, type: string, source: input, description: "FK -> Journeyworker.id; supervising journeyworker (must belong to same sponsor)" }
      - { name: start_date, type: datetime, source: input, description: "Agreement start date (ISO 8601 date); earliest valid OJT/RTI/milestone date" }
      - { name: ojt_hours_completed, type: number, source: computed, default: 0, description: "Sum of credited_hours over APPROVED OJTHoursEntry rows for this agreement" }
      - { name: rti_hours_completed, type: number, source: computed, default: 0, description: "Sum of instruction_hours over RTIRecord rows for this agreement" }
      - { name: milestones_attained_count, type: integer, source: computed, default: 0, description: "Count of MilestoneAttainment rows in APPROVED status for this agreement" }
      - { name: current_wage_step, type: integer, source: computed, default: 1, description: "Authoritative wage step per program.completion_type; see wage_step_determination" }
      - { name: current_hourly_wage_cents, type: integer, source: computed, default: 0, description: "round(base_journeyworker_wage_cents * wage_pct of current_wage_step)" }
      - { name: completion_eligible, type: boolean, source: computed, default: false, description: "True when program completion requirements met; see completion_eligibility" }
      - { name: end_date, type: datetime, source: system, description: "Date the agreement reached COMPLETED or CANCELLED; null while open" }
      - { name: status, type: enum, source: system, description: "DRAFT -> REGISTERED -> ACTIVE -> {SUSPENDED<->ACTIVE} -> COMPLETED | CANCELLED", constraints: "DRAFT | REGISTERED | ACTIVE | SUSPENDED | COMPLETED | CANCELLED" }

  - name: OJTHoursEntry
    parent: ApprenticeAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ApprenticeAgreement.id; agreement these hours belong to" }
      - { name: work_date, type: datetime, source: input, description: "ISO 8601 date the work was performed (no time component)" }
      - { name: start_time, type: integer, source: input, description: "Minutes-from-midnight start of the supervised session (0..1440)" }
      - { name: end_time, type: integer, source: input, description: "Minutes-from-midnight end of the supervised session (start_time < end_time <= 1440)" }
      - { name: credited_hours, type: number, source: input, description: "Hours to credit toward OJT requirement (positive number; the [start_time,end_time] window governs overlap scheduling, not the credited amount)" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED -> (reopen) PENDING; PENDING -> REJECTED", constraints: "PENDING | APPROVED | REJECTED" }

  - name: RTIRecord
    parent: ApprenticeAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ApprenticeAgreement.id; agreement this instruction belongs to" }
      - { name: course_code, type: string, source: input, description: "Related-instruction course identifier" }
      - { name: session_date, type: datetime, source: input, description: "ISO 8601 date of the instruction session" }
      - { name: instruction_hours, type: number, source: input, description: "Related-instruction hours delivered (positive)" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED on creation (immutable)", constraints: "RECORDED" }

  - name: MilestoneAttainment
    parent: ApprenticeAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ApprenticeAgreement.id; agreement attaining the competency" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; milestone attained (must belong to agreement's program)" }
      - { name: attained_on, type: datetime, source: input, description: "ISO 8601 date competency was demonstrated (>= agreement.start_date)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED; SUBMITTED -> REJECTED -> (resubmit) SUBMITTED", constraints: "SUBMITTED | APPROVED | REJECTED" }

  - name: CompletionCertificate
    parent: ApprenticeAgreement
    common_fields: false   # immutable artifact: only id + created_at
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ApprenticeAgreement.id; certified agreement (1:1, cascade-created on completion)" }
      - { name: program_id, type: string, source: system, description: "FK -> ApprenticeshipProgram.id; snapshot of program at certification" }
      - { name: occupation_code, type: string, source: system, description: "Snapshot of program occupation_code at issuance" }
      - { name: certified_ojt_hours, type: number, source: system, description: "Snapshot of agreement.ojt_hours_completed at issuance" }
      - { name: certified_rti_hours, type: number, source: system, description: "Snapshot of agreement.rti_hours_completed at issuance" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing RegistrationAgency operator" }

  - name: EEOReport
    parent: ApprenticeshipProgram
    common_fields: false   # immutable snapshot: only id + created_at
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> ApprenticeshipProgram.id; program the report aggregates" }
      - { name: cohort_basis, type: enum, source: input, description: "REGISTERED_COHORT (all non-DRAFT) | ACTIVE_COHORT (ACTIVE+COMPLETED); selects completion-rate denominator", constraints: "REGISTERED_COHORT | ACTIVE_COHORT" }
      - { name: total_apprentices, type: integer, source: system, description: "Denominator: agreement count per cohort_basis" }
      - { name: completed_count, type: integer, source: system, description: "Agreements in COMPLETED for this program" }
      - { name: completion_rate_pct, type: number, source: system, description: "round(completed_count / total_apprentices * 100, 2); 0 when denominator 0" }
      - { name: gender_distribution_pct, type: object, source: system, description: "Largest-remainder whole-percent breakdown by Apprentice.gender; sums to 100" }
      - { name: race_distribution_pct, type: object, source: system, description: "Largest-remainder whole-percent breakdown by Apprentice.race_ethnicity; sums to 100" }
      - { name: veteran_count, type: integer, source: system, description: "Count of cohort apprentices with is_veteran true" }
      - { name: disability_count, type: integer, source: system, description: "Count of cohort apprentices with has_disability true" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ApprenticeshipProgram
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /apprenticeship/programs/{id}/activate"
        actor: RegistrationAgency
        preconditions:
          - "Program must be in DRAFT (ERR_PROGRAM_NOT_DRAFT)"
          - "At least one WageStep exists for the program (ERR_NO_WAGE_STEPS)"
          - "A WageStep with ojt_hours_threshold == 0 exists (ERR_NO_BASE_WAGE_STEP)"
        side_effects:
          - "status -> ACTIVE"
          - "available_apprentice_slots recomputed via journeyman_ratio_capacity"
          - "increments ApprenticeshipProgram.version by 1"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /apprenticeship/programs/{id}/archive"
        actor: RegistrationAgency
        preconditions:
          - "Program must be in ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "No agreements for this program in {REGISTERED, ACTIVE, SUSPENDED} (ERR_PROGRAM_HAS_OPEN_AGREEMENTS)"
        side_effects:
          - "status -> ARCHIVED"
          - "increments ApprenticeshipProgram.version by 1"

  - entity: Journeyworker
    initial_state: PROBATIONARY
    terminal_states: [INACTIVE]
    transitions:
      - from: PROBATIONARY
        to: QUALIFIED
        trigger: "POST /apprenticeship/journeyworkers/{id}/qualify"
        actor: Sponsor
        preconditions:
          - "Journeyworker must be in PROBATIONARY (ERR_JOURNEYWORKER_NOT_PROBATIONARY)"
        side_effects:
          - "status -> QUALIFIED"
          - "available_apprentice_slots recomputed for programs of this sponsor on next read"

      - from: QUALIFIED
        to: INACTIVE
        trigger: "POST /apprenticeship/journeyworkers/{id}/deactivate"
        actor: Sponsor
        preconditions:
          - "Journeyworker must be in QUALIFIED (ERR_JOURNEYWORKER_NOT_QUALIFIED)"
          - "active_apprentice_count == 0 (ERR_JOURNEYWORKER_HAS_APPRENTICES)"
        side_effects:
          - "status -> INACTIVE"

      - from: PROBATIONARY
        to: INACTIVE
        trigger: "POST /apprenticeship/journeyworkers/{id}/deactivate"
        actor: Sponsor
        preconditions:
          - "active_apprentice_count == 0 (ERR_JOURNEYWORKER_HAS_APPRENTICES)"
        side_effects:
          - "status -> INACTIVE"

  - entity: ApprenticeAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /apprenticeship/agreements/{id}/register"
        actor: Sponsor
        preconditions:
          - "Agreement must be in DRAFT (ERR_AGREEMENT_NOT_DRAFT)"
          - "Cross-entity: parent ApprenticeshipProgram.status == ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "Supervising Journeyworker.status == QUALIFIED (ERR_JOURNEYWORKER_NOT_QUALIFIED)"
          - "expected_program_version matches ApprenticeshipProgram.version (ERR_STALE_VERSION)"
          - "program.available_apprentice_slots >= 1 (ERR_JOURNEYMAN_RATIO_EXCEEDED)"
        side_effects:
          - "status -> REGISTERED"
          - "program.active_agreement_count += 1"
          - "journeyworker.active_apprentice_count += 1"
          - "program.available_apprentice_slots recomputed via journeyman_ratio_capacity"
          - "increments ApprenticeshipProgram.version by 1"

      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /apprenticeship/agreements/{id}/activate"
        actor: Sponsor
        preconditions:
          - "Agreement must be in REGISTERED (ERR_AGREEMENT_NOT_REGISTERED)"
        side_effects:
          - "status -> ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /apprenticeship/agreements/{id}/suspend"
        actor: Sponsor
        preconditions:
          - "Agreement must be in ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED"
        note: "Slot remains consumed while SUSPENDED (counts toward active_agreement_count)."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /apprenticeship/agreements/{id}/reinstate"
        actor: Sponsor
        preconditions:
          - "Agreement must be in SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
        side_effects:
          - "status -> ACTIVE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /apprenticeship/agreements/{id}/complete"
        actor: RegistrationAgency
        preconditions:
          - "Agreement must be in ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "completion_eligible == true (ERR_COMPLETION_REQUIREMENTS_NOT_MET)"
        side_effects:
          - "status -> COMPLETED"
          - "end_date set to issuance date"
          - "CompletionCertificate created (cascade) snapshotting occupation_code, ojt/rti hours"
          - "program.active_agreement_count -= 1"
          - "journeyworker.active_apprentice_count -= 1"
          - "program.available_apprentice_slots recomputed via journeyman_ratio_capacity"

      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /apprenticeship/agreements/{id}/cancel"
        actor: Sponsor
        preconditions:
          - "Agreement must be in {REGISTERED, ACTIVE, SUSPENDED} (ERR_AGREEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED"
          - "end_date set to cancellation date"
          - "program.active_agreement_count -= 1"
          - "journeyworker.active_apprentice_count -= 1"
          - "program.available_apprentice_slots recomputed via journeyman_ratio_capacity"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /apprenticeship/agreements/{id}/cancel"
        actor: Sponsor
        preconditions:
          - "Agreement must be in {REGISTERED, ACTIVE, SUSPENDED} (ERR_AGREEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED"
          - "end_date set to cancellation date"
          - "program.active_agreement_count -= 1"
          - "journeyworker.active_apprentice_count -= 1"
          - "program.available_apprentice_slots recomputed via journeyman_ratio_capacity"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /apprenticeship/agreements/{id}/cancel"
        actor: Sponsor
        preconditions:
          - "Agreement must be in {REGISTERED, ACTIVE, SUSPENDED} (ERR_AGREEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED"
          - "end_date set to cancellation date"
          - "program.active_agreement_count -= 1"
          - "journeyworker.active_apprentice_count -= 1"
          - "program.available_apprentice_slots recomputed via journeyman_ratio_capacity"

  - entity: OJTHoursEntry
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /apprenticeship/ojt-entries/{id}/approve"
        actor: TrainingCoordinator
        preconditions:
          - "Entry must be in PENDING (ERR_OJT_ENTRY_NOT_PENDING)"
          - "Cross-entity: parent ApprenticeAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status -> APPROVED"
          - "agreement.ojt_hours_completed += credited_hours"
          - "agreement.current_wage_step recomputed via wage_step_determination"
          - "agreement.current_hourly_wage_cents recomputed via current_hourly_wage"
          - "agreement.completion_eligible recomputed via completion_eligibility"
        note: "Cascade chain: hours change -> wage step -> wage snapshot -> completion eligibility."

      - from: PENDING
        to: REJECTED
        trigger: "POST /apprenticeship/ojt-entries/{id}/reject"
        actor: TrainingCoordinator
        preconditions:
          - "Entry must be in PENDING (ERR_OJT_ENTRY_NOT_PENDING)"
        side_effects:
          - "status -> REJECTED"

      - from: APPROVED
        to: PENDING
        trigger: "POST /apprenticeship/ojt-entries/{id}/reopen"
        actor: TrainingCoordinator
        preconditions:
          - "Entry must be in APPROVED (ERR_OJT_ENTRY_NOT_APPROVED)"
        side_effects:
          - "status -> PENDING"
          - "agreement.ojt_hours_completed -= credited_hours (compensating)"
          - "agreement.current_wage_step recomputed via wage_step_determination"
          - "agreement.current_hourly_wage_cents recomputed via current_hourly_wage"
          - "agreement.completion_eligible recomputed via completion_eligibility"
        note: "Compensating action for approve; restores ojt_hours_completed invariant."

  - entity: MilestoneAttainment
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /apprenticeship/milestone-attainments/{id}/approve"
        actor: TrainingCoordinator
        preconditions:
          - "Attainment must be in SUBMITTED (ERR_ATTAINMENT_NOT_SUBMITTED)"
          - "Cross-entity: parent ApprenticeAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status -> APPROVED"
          - "agreement.milestones_attained_count += 1"
          - "agreement.current_wage_step recomputed via wage_step_determination"
          - "agreement.current_hourly_wage_cents recomputed via current_hourly_wage"
          - "agreement.completion_eligible recomputed via completion_eligibility"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /apprenticeship/milestone-attainments/{id}/reject"
        actor: TrainingCoordinator
        preconditions:
          - "Attainment must be in SUBMITTED (ERR_ATTAINMENT_NOT_SUBMITTED)"
        side_effects:
          - "status -> REJECTED"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /apprenticeship/milestone-attainments/{id}/resubmit"
        actor: Sponsor
        preconditions:
          - "Attainment must be in REJECTED (ERR_ATTAINMENT_NOT_REJECTED)"
        side_effects:
          - "status -> SUBMITTED"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-register-stale-program
    parent_entity: ApprenticeshipProgram
    write_endpoint: "POST /apprenticeship/agreements/{id}/register"
    occ_field: "expected_program_version"
    description: |
      Registering an apprentice consumes one journeyman-ratio slot and bumps the
      program's version. A register call carrying an expected_program_version that
      is older than the program's current version is rejected: another register
      has already consumed a slot since the caller last observed the program, so
      the caller's view of available_apprentice_slots is stale. Resolved purely as
      a stale-version check on ApprenticeshipProgram.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: wage_step_determination
    trigger: "OJT entry approve/reopen; milestone attainment approve"
    algorithm: threshold
    formula: |
      Let steps = WageStep rows for agreement.program_id, sorted by step_number ASC.
      VARIANT applied is selected by program.completion_type.

      HOURS_BASED variant (also used by HYBRID):
        current_wage_step = max step_number among steps where
          step.ojt_hours_threshold <= agreement.ojt_hours_completed.
        (Threshold uses <=, so exactly meeting a threshold reaches that step.)
        If no step qualifies, current_wage_step = 1.

      COMPETENCY_BASED variant:
        current_wage_step = clamp(agreement.milestones_attained_count, 1, max(step_number)).
        (Each APPROVED milestone advances one step; floor 1, ceiling = top step.)
    input_set: "WageStep rows of agreement.program_id; agreement.ojt_hours_completed (APPROVED OJT only) or milestones_attained_count (APPROVED attainments only)"
    constants: {}
    precision: "integer step"
    variants:
      - name: hours_based
        when: "program.completion_type in {HOURS_BASED, HYBRID}"
        difference: "Step driven by cumulative APPROVED OJT hours vs WageStep thresholds."
      - name: competency_based
        when: "program.completion_type == COMPETENCY_BASED"
        difference: "Step driven by count of APPROVED milestone attainments, clamped to step range."

  - name: current_hourly_wage
    trigger: "any change to current_wage_step"
    algorithm: aggregation
    formula: |
      step = WageStep with step_number == agreement.current_wage_step for agreement.program_id.
      current_hourly_wage_cents = round(program.base_journeyworker_wage_cents * step.wage_pct)
      Rounding: round_half_up to the nearest integer cent.
    input_set: "Single WageStep selected by current_wage_step"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: completion_eligibility
    trigger: "OJT entry approve/reopen; milestone attainment approve/reject/resubmit"
    algorithm: threshold
    formula: |
      Let ojt_ok = (agreement.ojt_hours_completed >= program.ojt_hours_required)
      Let rti_ok = (agreement.rti_hours_completed >= program.rti_hours_required)
      Let comp_ok = (count of APPROVED MilestoneAttainment for required Milestones
                     == count of Milestones with required_for_completion == true)

      HOURS_BASED:       completion_eligible = ojt_ok AND rti_ok
      COMPETENCY_BASED:  completion_eligible = comp_ok AND rti_ok
      HYBRID:            completion_eligible = ojt_ok AND rti_ok AND comp_ok
    input_set: "APPROVED OJT hours, RTI hours, APPROVED milestone attainments vs required Milestones"
    constants: {}
    precision: "boolean"
    variants:
      - name: hours_based
        when: "program.completion_type == HOURS_BASED"
        difference: "Ignores milestones; eligibility = ojt_ok AND rti_ok."
      - name: competency_based
        when: "program.completion_type == COMPETENCY_BASED"
        difference: "Ignores OJT hour total; eligibility = comp_ok AND rti_ok."

  - name: journeyman_ratio_capacity
    trigger: "program activate; agreement register/complete/cancel; journeyworker qualify/deactivate"
    algorithm: aggregation
    formula: |
      For program P (and its sponsor S):
        q = count of Journeyworker of S with status == QUALIFIED
        p = count of Journeyworker of S with status == PROBATIONARY
        ratio_capacity = floor(q * P.journeyman_ratio
                               + p * P.journeyman_ratio * PROBATION_WEIGHT)
        P.available_apprentice_slots = max(0, ratio_capacity - P.active_agreement_count)
      Combinatorial: three inputs (q, p, ratio) with a probationary-weight branch
      and a max(0, ...) floor. Evaluation order is fixed: compute ratio_capacity
      first (multiply-then-floor), then subtract active_agreement_count, then floor at 0.
    input_set: "Journeyworker rows of the program's sponsor by status; program.journeyman_ratio; program.active_agreement_count"
    constants:
      PROBATION_WEIGHT: 0.5
    precision: "integer slots (floor)"

  - name: eeo_completion_rate
    trigger: "POST /apprenticeship/eeo-reports"
    algorithm: aggregation
    formula: |
      completed_count = count of ApprenticeAgreement for program in COMPLETED.
      VARIANT by requested cohort_basis:
        REGISTERED_COHORT: total = count of agreements whose status != DRAFT
        ACTIVE_COHORT:     total = count of agreements in {ACTIVE, COMPLETED}
      completion_rate_pct = (total == 0) ? 0 : round(completed_count / total * 100, 2)
    input_set: "ApprenticeAgreement rows of the program, filtered by status per cohort_basis"
    constants: {}
    precision: "2 decimal places, round_half_up; 0 when denominator is 0"
    variants:
      - name: registered_cohort
        when: "cohort_basis == REGISTERED_COHORT"
        difference: "Denominator counts every non-DRAFT agreement (includes CANCELLED)."
      - name: active_cohort
        when: "cohort_basis == ACTIVE_COHORT"
        difference: "Denominator counts only ACTIVE + COMPLETED (excludes CANCELLED, SUSPENDED, REGISTERED)."

  - name: eeo_distribution_largest_remainder
    trigger: "POST /apprenticeship/eeo-reports"
    algorithm: weighted_scoring
    formula: |
      For a category dimension (gender or race_ethnicity) over the cohort apprentices
      (cohort defined by cohort_basis, deduplicated by apprentice_id):
        N = total cohort apprentices (deduplicated).
        If N == 0: every category percent = 0.
        Step 1: raw[c]   = count[c] / N * 100        (exact rational)
        Step 2: floor[c] = floor(raw[c])             (integer ROUND-DOWN first)
        Step 3: remainder_units = 100 - sum(floor[c])
        Step 4: distribute remainder_units, one each, to categories in DESCENDING
                fractional remainder (raw[c] - floor[c]); ties broken by the
                category enum declaration order (Apprentice.gender / race_ethnicity).
      Result is a whole-percent map summing to exactly 100 (when N > 0).
      Rounding order is pinned: FLOOR all, THEN allocate the leftover by remainder;
      computing round() per-category independently is the WRONG order and may not
      sum to 100.
    input_set: "Distinct cohort apprentices grouped by gender or race_ethnicity"
    constants:
      TARGET_SUM: 100
    precision: "whole percent integers summing to 100; largest-remainder allocation"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource ids exist (validated left-to-right)"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "FK fields in the body reference existing resources (program_id, sponsor_id, apprentice_id, journeyworker_id, agreement_id, milestone_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST creates that carry FK fields"

  - priority: 5
    category: state
    check: "OCC: expected_program_version (when required by endpoint) equals current ApprenticeshipProgram.version; checked BEFORE business rules"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /apprenticeship/agreements/{id}/register"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: "ERR_{RESOURCE}_NOT_{STATE} (domain-specific)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "On agreement create: Journeyworker.sponsor_id == Program.sponsor_id and Apprentice.sponsor_id == Program.sponsor_id"
    error_id: ERR_SPONSOR_MISMATCH
    http_status: 409
    applies_to: "POST /apprenticeship/agreements"

  - priority: 8
    category: business_referential
    check: "On milestone-attainment create: Milestone.program_id == agreement.program_id"
    error_id: ERR_MILESTONE_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /apprenticeship/milestone-attainments"

  - priority: 9
    category: business_temporal
    check: "On milestone-attainment create: attained_on >= agreement.start_date"
    error_id: ERR_DATE_BEFORE_AGREEMENT_START
    http_status: 422
    applies_to: "POST /apprenticeship/milestone-attainments"

  - priority: 10
    category: business_temporal
    check: "On OJT create: work_date >= agreement.start_date"
    error_id: ERR_DATE_BEFORE_AGREEMENT_START
    http_status: 422
    applies_to: "POST /apprenticeship/ojt-entries"

  - priority: 11
    category: business_constraint
    check: "On OJT create: start_time < end_time, both in 0..1440, and credited_hours > 0"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /apprenticeship/ojt-entries"

  - priority: 12
    category: business_temporal
    check: "On OJT create: the [start_time, end_time] window must not overlap another OJTHoursEntry for the SAME apprentice on the SAME work_date; touching endpoints (a.end_time == b.start_time) ARE allowed"
    error_id: ERR_APPRENTICE_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /apprenticeship/ojt-entries"

  - priority: 13
    category: business_temporal
    check: "On OJT create: across all OJTHoursEntry supervised by the agreement's journeyworker on the SAME work_date, the new window must be separated from every existing window by >= SUPERVISION_BUFFER_MINUTES (no overlap AND no touching within the buffer)"
    error_id: ERR_JOURNEYWORKER_SUPERVISION_CONFLICT
    http_status: 409
    applies_to: "POST /apprenticeship/ojt-entries"

  - priority: 14
    category: business_constraint
    check: "On agreement register: program.available_apprentice_slots >= 1 (journeyman ratio not exceeded)"
    error_id: ERR_JOURNEYMAN_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /apprenticeship/agreements/{id}/register"

  - priority: 15
    category: business_constraint
    check: "On program activate: at least one WageStep, including one with ojt_hours_threshold == 0"
    error_id: ERR_NO_BASE_WAGE_STEP
    http_status: 409
    applies_to: "POST /apprenticeship/programs/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "On agreement complete: completion_eligible == true"
    error_id: ERR_COMPLETION_REQUIREMENTS_NOT_MET
    http_status: 409
    applies_to: "POST /apprenticeship/agreements/{id}/complete"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: WageStep.step_number unique per program; Milestone.sequence unique per program; one APPROVED/SUBMITTED MilestoneAttainment per (agreement, milestone)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /apprenticeship/wage-steps, /apprenticeship/milestones, /apprenticeship/milestone-attainments"

  - priority: 18
    category: business_constraint
    check: "Pagination params within bounds: limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Sponsors ---
  - method: POST
    path: "/apprenticeship/sponsors"
    description: "Create a sponsor"
    roles: [RegistrationAgency, Sponsor]
    code: 201
    input: [legal_name, ein, contact_email]
    output: Sponsor
    side_effects: []

  - method: GET
    path: "/apprenticeship/sponsors"
    description: "List sponsors"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["limit?", "offset?"]
    output: "Sponsor[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/sponsors/{id}"
    description: "Get a sponsor"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # --- Programs ---
  - method: POST
    path: "/apprenticeship/programs"
    description: "Create an apprenticeship program (DRAFT)"
    roles: [Sponsor]
    code: 201
    input: [sponsor_id, occupation_code, occupation_title, completion_type, ojt_hours_required, rti_hours_required, base_journeyworker_wage_cents, journeyman_ratio]
    output: ApprenticeshipProgram
    side_effects: ["status = DRAFT", "active_agreement_count = 0", "available_apprentice_slots = 0"]

  - method: GET
    path: "/apprenticeship/programs"
    description: "List programs (filterable by sponsor)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["sponsor_id?", "limit?", "offset?"]
    output: "ApprenticeshipProgram[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/programs/{id}"
    description: "Get a program (includes computed available_apprentice_slots)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: ApprenticeshipProgram
    side_effects: ["available_apprentice_slots recomputed via journeyman_ratio_capacity on read"]

  - method: POST
    path: "/apprenticeship/programs/{id}/activate"
    description: "Registering agency activates the program"
    roles: [RegistrationAgency]
    code: 200
    input: []
    output: ApprenticeshipProgram
    side_effects: ["status -> ACTIVE", "available_apprentice_slots recomputed", "increments ApprenticeshipProgram.version by 1"]

  - method: POST
    path: "/apprenticeship/programs/{id}/archive"
    description: "Registering agency archives the program"
    roles: [RegistrationAgency]
    code: 200
    input: []
    output: ApprenticeshipProgram
    side_effects: ["status -> ARCHIVED", "increments ApprenticeshipProgram.version by 1"]

  # --- Wage Steps ---
  - method: POST
    path: "/apprenticeship/wage-steps"
    description: "Add a wage step to a program (program must be DRAFT)"
    roles: [Sponsor]
    code: 201
    input: [program_id, step_number, ojt_hours_threshold, wage_pct]
    output: WageStep
    side_effects: []

  - method: GET
    path: "/apprenticeship/wage-steps"
    description: "List wage steps (filterable by program)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "WageStep[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/wage-steps/{id}"
    description: "Get a wage step"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: WageStep
    side_effects: []

  # --- Milestones ---
  - method: POST
    path: "/apprenticeship/milestones"
    description: "Add a competency milestone to a program (program must be DRAFT)"
    roles: [Sponsor]
    code: 201
    input: [program_id, sequence, title, "required_for_completion?"]
    output: Milestone
    side_effects: []

  - method: GET
    path: "/apprenticeship/milestones"
    description: "List milestones (filterable by program)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "Milestone[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/milestones/{id}"
    description: "Get a milestone"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  # --- Journeyworkers ---
  - method: POST
    path: "/apprenticeship/journeyworkers"
    description: "Register a journeyworker under a sponsor (PROBATIONARY)"
    roles: [Sponsor]
    code: 201
    input: [sponsor_id, full_name]
    output: Journeyworker
    side_effects: ["status = PROBATIONARY", "active_apprentice_count = 0"]

  - method: GET
    path: "/apprenticeship/journeyworkers"
    description: "List journeyworkers (filterable by sponsor)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["sponsor_id?", "limit?", "offset?"]
    output: "Journeyworker[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/journeyworkers/{id}"
    description: "Get a journeyworker"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: Journeyworker
    side_effects: []

  - method: POST
    path: "/apprenticeship/journeyworkers/{id}/qualify"
    description: "Promote journeyworker to QUALIFIED"
    roles: [Sponsor]
    code: 200
    input: []
    output: Journeyworker
    side_effects: ["status -> QUALIFIED"]

  - method: POST
    path: "/apprenticeship/journeyworkers/{id}/deactivate"
    description: "Deactivate a journeyworker"
    roles: [Sponsor]
    code: 200
    input: []
    output: Journeyworker
    side_effects: ["status -> INACTIVE"]

  # --- Apprentices ---
  - method: POST
    path: "/apprenticeship/apprentices"
    description: "Create an apprentice with EEO demographics"
    roles: [Sponsor]
    code: 201
    input: [sponsor_id, full_name, gender, race_ethnicity, "is_veteran?", "has_disability?"]
    output: Apprentice
    side_effects: []

  - method: GET
    path: "/apprenticeship/apprentices"
    description: "List apprentices (filterable by sponsor)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["sponsor_id?", "limit?", "offset?"]
    output: "Apprentice[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/apprentices/{id}"
    description: "Get an apprentice"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: Apprentice
    side_effects: []

  # --- Apprentice Agreements ---
  - method: POST
    path: "/apprenticeship/agreements"
    description: "Create an apprentice agreement (DRAFT) linking apprentice, program, journeyworker"
    roles: [Sponsor]
    code: 201
    input: [program_id, apprentice_id, journeyworker_id, start_date]
    output: ApprenticeAgreement
    side_effects: ["status = DRAFT", "current_wage_step = 1", "ojt_hours_completed = 0", "rti_hours_completed = 0", "milestones_attained_count = 0"]

  - method: GET
    path: "/apprenticeship/agreements"
    description: "List agreements (filterable by program, apprentice, journeyworker)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["program_id?", "apprentice_id?", "journeyworker_id?", "status?", "limit?", "offset?"]
    output: "ApprenticeAgreement[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/agreements/{id}"
    description: "Get an agreement (includes computed hours, wage step, eligibility)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects: []

  - method: POST
    path: "/apprenticeship/agreements/{id}/register"
    description: "Register the agreement with the program (consumes a journeyman-ratio slot); OCC on program version"
    roles: [Sponsor]
    code: 200
    input: [expected_program_version]
    output: ApprenticeAgreement
    side_effects:
      - "status -> REGISTERED"
      - "program.active_agreement_count += 1"
      - "journeyworker.active_apprentice_count += 1"
      - "program.available_apprentice_slots recomputed"
      - "increments ApprenticeshipProgram.version by 1"

  - method: POST
    path: "/apprenticeship/agreements/{id}/activate"
    description: "Activate a registered agreement (training begins)"
    roles: [Sponsor]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/apprenticeship/agreements/{id}/suspend"
    description: "Suspend an active agreement"
    roles: [Sponsor]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/apprenticeship/agreements/{id}/reinstate"
    description: "Reinstate a suspended agreement"
    roles: [Sponsor]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/apprenticeship/agreements/{id}/complete"
    description: "Registering agency completes the agreement and issues the completion certificate"
    roles: [RegistrationAgency]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects:
      - "status -> COMPLETED"
      - "end_date set"
      - "CompletionCertificate created (cascade)"
      - "program.active_agreement_count -= 1"
      - "journeyworker.active_apprentice_count -= 1"
      - "program.available_apprentice_slots recomputed"

  - method: POST
    path: "/apprenticeship/agreements/{id}/cancel"
    description: "Cancel an agreement (releases the ratio slot)"
    roles: [Sponsor]
    code: 200
    input: []
    output: ApprenticeAgreement
    side_effects:
      - "status -> CANCELLED"
      - "end_date set"
      - "program.active_agreement_count -= 1"
      - "journeyworker.active_apprentice_count -= 1"
      - "program.available_apprentice_slots recomputed"

  # --- OJT Hours Entries ---
  - method: POST
    path: "/apprenticeship/ojt-entries"
    description: "Log an on-the-job training session (PENDING approval)"
    roles: [Sponsor, Apprentice]
    code: 201
    input: [agreement_id, work_date, start_time, end_time, credited_hours]
    output: OJTHoursEntry
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/apprenticeship/ojt-entries"
    description: "List OJT entries (filterable by agreement, status)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "OJTHoursEntry[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/ojt-entries/{id}"
    description: "Get an OJT entry"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: OJTHoursEntry
    side_effects: []

  - method: POST
    path: "/apprenticeship/ojt-entries/{id}/approve"
    description: "Coordinator approves OJT hours (credits toward OJT requirement)"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: OJTHoursEntry
    side_effects:
      - "status -> APPROVED"
      - "agreement.ojt_hours_completed += credited_hours"
      - "agreement.current_wage_step / current_hourly_wage_cents / completion_eligible recomputed (cascade)"

  - method: POST
    path: "/apprenticeship/ojt-entries/{id}/reject"
    description: "Coordinator rejects a pending OJT entry"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: OJTHoursEntry
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/apprenticeship/ojt-entries/{id}/reopen"
    description: "Coordinator reopens an approved OJT entry for correction (removes credited hours)"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: OJTHoursEntry
    side_effects:
      - "status -> PENDING"
      - "agreement.ojt_hours_completed -= credited_hours (compensating)"
      - "agreement.current_wage_step / current_hourly_wage_cents / completion_eligible recomputed (cascade)"

  # --- RTI Records ---
  - method: POST
    path: "/apprenticeship/rti-records"
    description: "Record related-instruction hours (RECORDED on creation)"
    roles: [Sponsor, TrainingCoordinator]
    code: 201
    input: [agreement_id, course_code, session_date, instruction_hours]
    output: RTIRecord
    side_effects: ["status = RECORDED", "agreement.rti_hours_completed += instruction_hours", "agreement.completion_eligible recomputed"]

  - method: GET
    path: "/apprenticeship/rti-records"
    description: "List RTI records (filterable by agreement)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: "RTIRecord[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/rti-records/{id}"
    description: "Get an RTI record"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: RTIRecord
    side_effects: []

  # --- Milestone Attainments ---
  - method: POST
    path: "/apprenticeship/milestone-attainments"
    description: "Submit a competency/milestone attainment (SUBMITTED)"
    roles: [Sponsor]
    code: 201
    input: [agreement_id, milestone_id, attained_on]
    output: MilestoneAttainment
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/apprenticeship/milestone-attainments"
    description: "List milestone attainments (filterable by agreement, milestone)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["agreement_id?", "milestone_id?", "limit?", "offset?"]
    output: "MilestoneAttainment[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/milestone-attainments/{id}"
    description: "Get a milestone attainment"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: MilestoneAttainment
    side_effects: []

  - method: POST
    path: "/apprenticeship/milestone-attainments/{id}/approve"
    description: "Coordinator approves a milestone attainment"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: MilestoneAttainment
    side_effects:
      - "status -> APPROVED"
      - "agreement.milestones_attained_count += 1"
      - "agreement.current_wage_step / current_hourly_wage_cents / completion_eligible recomputed (cascade)"

  - method: POST
    path: "/apprenticeship/milestone-attainments/{id}/reject"
    description: "Coordinator rejects a submitted milestone attainment"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: MilestoneAttainment
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/apprenticeship/milestone-attainments/{id}/resubmit"
    description: "Sponsor resubmits a rejected milestone attainment"
    roles: [Sponsor]
    code: 200
    input: []
    output: MilestoneAttainment
    side_effects: ["status -> SUBMITTED"]

  # --- Completion Certificates ---
  - method: GET
    path: "/apprenticeship/certificates"
    description: "List completion certificates (filterable by agreement or program); discovery channel for cascade-created certs"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: ["agreement_id?", "program_id?", "limit?", "offset?"]
    output: "CompletionCertificate[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/certificates/{id}"
    description: "Get a completion certificate"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator, Apprentice]
    code: 200
    input: []
    output: CompletionCertificate
    side_effects: []

  # --- EEO / Affirmative Reports ---
  - method: POST
    path: "/apprenticeship/eeo-reports"
    description: "Generate an EEO/affirmative-action report snapshot for a program under the requested cohort basis"
    roles: [RegistrationAgency, Sponsor]
    code: 201
    input: [program_id, cohort_basis]
    output: EEOReport
    side_effects: ["computes completion_rate_pct, gender/race distributions (largest-remainder), veteran/disability counts"]

  - method: GET
    path: "/apprenticeship/eeo-reports"
    description: "List EEO reports (filterable by program)"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "EEOReport[]"
    side_effects: []

  - method: GET
    path: "/apprenticeship/eeo-reports/{id}"
    description: "Get an EEO report snapshot"
    roles: [RegistrationAgency, Sponsor, TrainingCoordinator]
    code: 200
    input: []
    output: EEOReport
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "Sponsor id not found" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id not found" }
  - { id: ERR_WAGE_STEP_NOT_FOUND, http: 404, condition: "Wage step id not found" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Milestone id not found" }
  - { id: ERR_JOURNEYWORKER_NOT_FOUND, http: 404, condition: "Journeyworker id not found" }
  - { id: ERR_APPRENTICE_NOT_FOUND, http: 404, condition: "Apprentice id not found" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Agreement id not found" }
  - { id: ERR_OJT_ENTRY_NOT_FOUND, http: 404, condition: "OJT entry id not found" }
  - { id: ERR_RTI_RECORD_NOT_FOUND, http: 404, condition: "RTI record id not found" }
  - { id: ERR_ATTAINMENT_NOT_FOUND, http: 404, condition: "Milestone attainment id not found" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Completion certificate id not found" }
  - { id: ERR_EEO_REPORT_NOT_FOUND, http: 404, condition: "EEO report id not found" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required fields, type/enum mismatch" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset < 0" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "OJT start_time/end_time out of range, or credited_hours not in (0, (end-start)/60]" }
  - { id: ERR_DATE_BEFORE_AGREEMENT_START, http: 422, condition: "OJT work_date or attainment attained_on earlier than agreement.start_date" }

  # --- Referential / sponsor scoping ---
  - { id: ERR_SPONSOR_MISMATCH, http: 409, condition: "Apprentice or journeyworker does not belong to the program's sponsor" }
  - { id: ERR_MILESTONE_PROGRAM_MISMATCH, http: 409, condition: "Milestone does not belong to the agreement's program" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Duplicate WageStep.step_number / Milestone.sequence per program, or duplicate (agreement, milestone) attainment" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version does not match current ApprenticeshipProgram.version" }

  # --- State: program ---
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "Program must be DRAFT for this operation" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program must be ACTIVE for this operation" }
  - { id: ERR_NO_WAGE_STEPS, http: 409, condition: "Program has no wage steps when activating" }
  - { id: ERR_NO_BASE_WAGE_STEP, http: 409, condition: "Program has no wage step with ojt_hours_threshold == 0 when activating" }
  - { id: ERR_PROGRAM_HAS_OPEN_AGREEMENTS, http: 409, condition: "Program has agreements in REGISTERED/ACTIVE/SUSPENDED when archiving" }

  # --- State: journeyworker ---
  - { id: ERR_JOURNEYWORKER_NOT_PROBATIONARY, http: 409, condition: "Journeyworker must be PROBATIONARY to qualify" }
  - { id: ERR_JOURNEYWORKER_NOT_QUALIFIED, http: 409, condition: "Journeyworker must be QUALIFIED for this operation" }
  - { id: ERR_JOURNEYWORKER_HAS_APPRENTICES, http: 409, condition: "Journeyworker still supervises agreements and cannot be deactivated" }

  # --- State: agreement ---
  - { id: ERR_AGREEMENT_NOT_DRAFT, http: 409, condition: "Agreement must be DRAFT to register" }
  - { id: ERR_AGREEMENT_NOT_REGISTERED, http: 409, condition: "Agreement must be REGISTERED to activate" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement must be ACTIVE for this operation" }
  - { id: ERR_AGREEMENT_NOT_SUSPENDED, http: 409, condition: "Agreement must be SUSPENDED to reinstate" }
  - { id: ERR_AGREEMENT_NOT_CANCELLABLE, http: 409, condition: "Agreement must be REGISTERED/ACTIVE/SUSPENDED to cancel" }

  # --- State: OJT / milestone attainment ---
  - { id: ERR_OJT_ENTRY_NOT_PENDING, http: 409, condition: "OJT entry must be PENDING to approve/reject" }
  - { id: ERR_OJT_ENTRY_NOT_APPROVED, http: 409, condition: "OJT entry must be APPROVED to reopen" }
  - { id: ERR_ATTAINMENT_NOT_SUBMITTED, http: 409, condition: "Attainment must be SUBMITTED to approve/reject" }
  - { id: ERR_ATTAINMENT_NOT_REJECTED, http: 409, condition: "Attainment must be REJECTED to resubmit" }

  # --- Business constraints ---
  - { id: ERR_JOURNEYMAN_RATIO_EXCEEDED, http: 409, condition: "No available apprentice slots; journeyman ratio would be exceeded on register" }
  - { id: ERR_COMPLETION_REQUIREMENTS_NOT_MET, http: 409, condition: "completion_eligible is false when completing an agreement" }
  - { id: ERR_APPRENTICE_SESSION_OVERLAP, http: 409, condition: "New OJT window overlaps another entry for the same apprentice on the same date" }
  - { id: ERR_JOURNEYWORKER_SUPERVISION_CONFLICT, http: 409, condition: "New OJT window violates the supervision buffer for the agreement's journeyworker on the same date" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: RegistrationAgency
    description: "DOL / State Apprenticeship Agency registering authority: activates/archives programs, completes agreements (issues certificates), and pulls EEO reports. Cannot log or approve training data (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /apprenticeship/programs/{id}/activate"
      - "POST /apprenticeship/programs/{id}/archive"
      - "POST /apprenticeship/agreements/{id}/complete"
    shared_operations:
      - "POST /apprenticeship/sponsors (with Sponsor)"
      - "POST /apprenticeship/eeo-reports (with Sponsor)"
      - "GET endpoints (read-only, all entities)"

  - name: Sponsor
    description: "Sponsoring employer/association: builds programs and standards, manages journeyworkers and apprentices, creates and registers agreements, logs OJT/RTI, submits/resubmits milestone attainments. Cannot approve training data or self-certify completion."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /apprenticeship/programs"
      - "POST /apprenticeship/wage-steps"
      - "POST /apprenticeship/milestones"
      - "POST /apprenticeship/journeyworkers"
      - "POST /apprenticeship/journeyworkers/{id}/qualify"
      - "POST /apprenticeship/journeyworkers/{id}/deactivate"
      - "POST /apprenticeship/apprentices"
      - "POST /apprenticeship/agreements"
      - "POST /apprenticeship/agreements/{id}/register"
      - "POST /apprenticeship/agreements/{id}/activate"
      - "POST /apprenticeship/agreements/{id}/suspend"
      - "POST /apprenticeship/agreements/{id}/reinstate"
      - "POST /apprenticeship/agreements/{id}/cancel"
      - "POST /apprenticeship/milestone-attainments"
      - "POST /apprenticeship/milestone-attainments/{id}/resubmit"
    shared_operations:
      - "POST /apprenticeship/sponsors (with RegistrationAgency)"
      - "POST /apprenticeship/ojt-entries (with Apprentice)"
      - "POST /apprenticeship/rti-records (with TrainingCoordinator)"
      - "POST /apprenticeship/eeo-reports (with RegistrationAgency)"
      - "GET endpoints (read-only, all entities)"

  - name: TrainingCoordinator
    description: "Operational reviewer who approves/rejects OJT hours and milestone attainments and records RTI. Cannot register apprentices, build programs, or issue completion certificates (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /apprenticeship/ojt-entries/{id}/approve"
      - "POST /apprenticeship/ojt-entries/{id}/reject"
      - "POST /apprenticeship/ojt-entries/{id}/reopen"
      - "POST /apprenticeship/milestone-attainments/{id}/approve"
      - "POST /apprenticeship/milestone-attainments/{id}/reject"
    shared_operations:
      - "POST /apprenticeship/rti-records (with Sponsor)"
      - "GET endpoints (read-only, all entities)"

  - name: Apprentice
    description: "The registrant; may log own OJT sessions for approval and read own training data. Cannot approve hours or alter agreements."
    identity: "entity_backed:Apprentice"
    exclusive_operations: []
    shared_operations:
      - "POST /apprenticeship/ojt-entries (with Sponsor)"
      - "GET endpoints (read-only, all entities)"
