  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_cyclic_review_loop
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_RETURNED_FOR_INFO
          - state_machines.Application.RETURNED_FOR_INFO_to_UNDER_REVIEW
          - entities.Application.fields.return_count
        distinguishing_aspect: "Application cycles UNDER_REVIEW<->RETURNED_FOR_INFO twice; return_count reaches 2 and status ends UNDER_REVIEW, proving a cycle (not a linear pipeline)."
        test_recipe:
          setup:
            - "An application returned for info and resubmitted once, then returned again (return_count 2, RETURNED_FOR_INFO)."
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Zoning Board", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/return-for-info"
              payload: { notes: "need address proof" }
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/resubmit"
              payload: {}
              as: Applicant
