        captures:
          err: $.data.error_id
      - call: POST /streetlights/conversion-routes/${route}/resume
        payload: {}
        as: ProgramManager
      - call: POST /streetlights/work-orders/${wo2}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 3000
          shielding: SEMI_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      assert:
      - '${err} == ERR_ROUTE_SUSPENDED   # WorkOrder transition gated by ConversionRoute state'
      - ConversionRoute.${route}.status == IN_PROGRESS after resume (blocked_stop_count == 0 passes the resume gate)
      - WorkOrder.${wo2}.execution_status == DISPATCHED after the identical retry
