              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.xentity@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8301", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 50000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { rr: $.data.id }
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-17", event_type: "REVOCATION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de: $.data.id }
            - call: "POST /licensing/disciplinary-events/${de}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /licensing/renewal-requests/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_LICENSE_NOT_RENEWABLE\"  (license REVOKED is outside {ACTIVE, EXPIRED, LAPSED})"

      - name: license_create_blocked_by_confirmed_exclusion_match
        grounds:
          - validations[priority=8]
          - state_machines.ExclusionScreening.UNDER_REVIEW_to_CONFIRMED_MATCH
          - errors[ERR_EMPLOYEE_SCREENING_FLAGGED]
        distinguishing_aspect: |
          License creation is gated by Employee screening state: a CONFIRMED_MATCH
          exclusion screening blocks registration of a new license — entity pair
          License -> Employee, different from RenewalRequest -> License.
        test_recipe:
          setup:
            - "RN type; employee with a FLAGGED screening confirmed to CONFIRMED_MATCH (screening_posture FLAGGED)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Sam Screener", work_email: "sam@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/employees/${emp}/exclusion-screenings"
              payload: { list_source: "OIG_LEIE", screened_on: "2026-08-01", outcome: "FLAGGED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { scr: $.data.id }
            - call: "POST /licensing/exclusion-screenings/${scr}/confirm-match"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8302", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_EMPLOYEE_SCREENING_FLAGGED\"  (CONFIRMED_MATCH screening blocks license registration)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_package_half_open_intersection
        grounds:
          - validations[priority=15]
          - entities.AuditPackage.fields.period_start
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Half-open interval-intersection semantics on AuditPackage: [2026-08-01, 2026-09-01)
          and [2026-09-01, 2026-10-01) coexist (adjacency allowed), while
          [2026-08-15, 2026-08-20) intersects the first and is rejected — different
          interval semantics than screening point-containment.
        test_recipe:
          setup:
            - "Employee exists; two adjacent audit packages already open"
          setup_api_calls:
            - call: "POST /licensing/employees"
              payload: { full_name: "Audrey Subject", work_email: "audrey@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/employees/${emp}/audit-packages"
              payload: { period_start: "2026-08-01", period_end: "2026-09-01" }
              as: ExternalAuditor
              captures: { pkg1: $.data.id }
            - call: "POST /licensing/employees/${emp}/audit-packages"
              payload: { period_start: "2026-09-01", period_end: "2026-10-01" }
              as: ExternalAuditor
              captures: { pkg2: $.data.id }
          trigger:
            - call: "POST /licensing/employees/${emp}/audit-packages"
              payload: { period_start: "2026-08-15", period_end: "2026-08-20" }
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "pkg1 and pkg2 created successfully (adjacent half-open periods do not overlap)"
            - "err == \"ERR_AUDIT_PERIOD_OVERLAP\""

      - name: screening_validity_window_containment
        grounds:
          - validations[priority=16]
          - entities.ExclusionScreening.fields.valid_until
          - errors[ERR_SCREENING_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Point-containment semantics on ExclusionScreening: a CLEAR screening's validity
          window [screened_on, screened_on + 30d] is inclusive at both ends, so a new
          CLEAR screening landing exactly on valid_until (2026-08-31) is rejected while
          one day later succeeds — containment of a point, not interval intersection.
        test_recipe:
          setup:
            - "Employee exists; a CLOSED_CLEAR OIG_LEIE screening dated 2026-08-01 (valid_until 2026-08-31)"
          setup_api_calls:
            - call: "POST /licensing/employees"
              payload: { full_name: "Audrey Subject", work_email: "audrey.scr@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/employees/${emp}/exclusion-screenings"
              payload: { list_source: "OIG_LEIE", screened_on: "2026-08-01", outcome: "CLEAR" }
              as: ComplianceOfficer
              captures: { scr1: $.data.id, scr1_valid: $.data.valid_until }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /licensing/employees/${emp}/exclusion-screenings"
              payload: { list_source: "OIG_LEIE", screened_on: "2026-08-31", outcome: "CLEAR" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAdmin
            - call: "POST /licensing/employees/${emp}/exclusion-screenings"
              payload: { list_source: "OIG_LEIE", screened_on: "2026-09-01", outcome: "CLEAR" }
              as: ComplianceOfficer
              captures: { scr2_status: $.data.status, scr2_valid: $.data.valid_until }
          assert:
            - "scr1_valid == \"2026-08-31\"  (screened_on + 30 days, inclusive)"
            - "err == \"ERR_SCREENING_WINDOW_OVERLAP\"  (2026-08-31 is contained, both ends inclusive)"
            - "scr2_status == \"CLOSED_CLEAR\" and scr2_valid == \"2026-10-01\"  (2026-09-01 is outside the window)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: committed_balance_round_trips_through_void_and_reject
        grounds:
          - state_machines.RenewalRequest.SUBMITTED_to_VOIDED
          - state_machines.RenewalRequest.SUBMITTED_to_REJECTED
          - entities.Employee.fields.reimbursement_committed_cents
        distinguishing_aspect: |
          Conserved quantity is money: reimbursement_committed_cents ==
          sum(claimed over SUBMITTED/MORE_INFO) + sum(approved over APPROVED); a
          submit->void pair and a submit->reject pair must each leave the employee's
          committed balance exactly at its pre-submit baseline.
        test_recipe:
          setup:
            - "RN type; employee with ACTIVE RN-CA license (expires 2027-06-30); baseline committed 0"
            - "RR1 (claim 300000) submitted, committed 300000"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.inv@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8401", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 300000, expected_license_version: "${lic_v}" }
              as: ComplianceOfficer
              captures: { rr1: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_peak: $.data.reimbursement_committed_cents }
          trigger:
            - call: "POST /licensing/renewal-requests/${rr1}/void"
              payload: { void_reason: "Duplicate entry" }
              as: ComplianceAdmin
              captures: { rr1_status: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_after_void: $.data.reimbursement_committed_cents }
            - call: "GET /licensing/licenses/${lic}"
              as: ComplianceOfficer
              captures: { lic_v2: $.data.version }
            - call: "POST /licensing/licenses/${lic}/renewal-requests"
              payload: { claimed_amount_cents: 100000, expected_license_version: "${lic_v2}" }
              as: ComplianceOfficer
              captures: { rr2: $.data.id }
            - call: "POST /licensing/renewal-requests/${rr2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /licensing/renewal-requests/${rr2}/reject"
              payload: { decision_note: "Insufficient documentation" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rr2_status: $.data.status }
            - call: "GET /licensing/employees/${emp}"
              as: ComplianceOfficer
              captures: { committed_after_reject: $.data.reimbursement_committed_cents }
          assert:
            - "committed_peak == 300000"
            - "rr1_status == \"VOIDED\" and committed_after_void == 0  (void compensates the submit exactly)"
            - "rr2_status == \"REJECTED\" and committed_after_reject == 0  (reject compensates the submit exactly)"

      - name: authorization_partition_conserved_through_suspend_resolve
        grounds:
          - state_machines.DisciplinaryEvent.CONFIRMED_to_RESOLVED
          - state_machines.License.SUSPENDED_to_ACTIVE
          - calculations.employee_restriction
        distinguishing_aspect: |
          Conserved quantity is the employee-count partition:
          authorized_employee_count + restricted_employee_count == total headcount; a
          suspend->resolve round trip moves one employee between buckets and back without
          changing the total — a count invariant, not a money invariant.
        test_recipe:
          setup:
            - "RN type; STAFF_NURSE requires RN-CA; two employees each holding a verified ACTIVE RN-CA license (expires 2027-06-30)"
            - "Baseline report: authorized 2, restricted 0"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.part@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp1: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nick Nurse", work_email: "nick.part@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp2: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp1}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8501", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic1: $.data.id }
            - call: "POST /licensing/licenses/${lic1}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp2}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-8502", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic2: $.data.id }
            - call: "POST /licensing/licenses/${lic2}/verify"
              payload: { verified_on: "2026-08-01", source: "NURSYS", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "GET /licensing/reports/compliance-summary"
              as: ComplianceAdmin
              captures: { base_auth: $.data.authorized_employee_count, base_rest: $.data.restricted_employee_count }
            - call: "POST /licensing/licenses/${lic1}/disciplinary-events"
              payload: { board_case_number: "B-21", event_type: "SUSPENSION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de: $.data.id }
            - call: "POST /licensing/disciplinary-events/${de}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "GET /licensing/reports/compliance-summary"
              as: ComplianceAdmin
              captures: { mid_auth: $.data.authorized_employee_count, mid_rest: $.data.restricted_employee_count }
            - call: "POST /licensing/disciplinary-events/${de}/resolve"
              payload: { resolution_note: "Suspension lifted by board" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
            - call: "GET /licensing/reports/compliance-summary"
              as: ComplianceAdmin
              captures: { end_auth: $.data.authorized_employee_count, end_rest: $.data.restricted_employee_count }
          assert:
            - "base_auth == 2 and base_rest == 0"
            - "mid_auth == 1 and mid_rest == 1  (suspend moves one employee across the partition)"
            - "mid_auth + mid_rest == base_auth + base_rest == 2  (partition conserved)"
            - "end_auth == 2 and end_rest == 0  (resolve restores the baseline exactly)"
