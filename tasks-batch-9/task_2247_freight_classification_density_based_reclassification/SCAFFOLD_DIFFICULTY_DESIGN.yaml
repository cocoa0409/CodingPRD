scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: notice_provisional_versus_audit_final_delta_divergence
        grounds:
          - calculations.correction_notice_delta
          - calculations.shipment_charge
          - entities.CorrectionNotice.fields.provisional_delta_cents
          - entities.CorrectionNotice.fields.final_delta_cents
          - state_machines.Shipment.DECLARED_to_RECLASS_PENDING
        distinguishing_aspect: |
          On one identical two-line capture the money-domain entity CorrectionNotice stores
          provisional_delta_cents == 33388 (per-line weight breaks, per-line rounding, no minimum
          charge) and final_delta_cents == 30030 (shipment-aggregate weight break, one rounding,
          minimum charge applied) — a 3358-cent divergence produced by the variant rules alone.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z."
            - "Terminal TRM1 calibrated; customer ACME with an ACTIVE CLASS_BASED program (4200 c/cwt, 35% discount, 12500 minimum)."
            - "Published standard NMFC-2026A effective 2026-01-01 with the full density bracket table."
            - "Shipment PRO1001 with line 1 = 400 lb class 70 (4 pieces 48.0x40.0x48.0) and line 2 = 700 lb class 100 (2 pieces 40.0x40.0x40.0), billed at 26754 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id"}
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version"}
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id"}
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id"}
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id"}
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PRO1001", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 1100 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 70, declared_weight_lb: 400, pieces: 4, declared_length_in: 48.0, declared_width_in: 40.0, declared_height_in: 48.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 2, commodity_profile_id: "${cp1}", declared_class_code: 100, declared_weight_lb: 700, pieces: 2, declared_length_in: 40.0, declared_width_in: 40.0, declared_height_in: 40.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln2: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/bill"
              payload: {}
              as: PricingAnalyst
          trigger:
            - call: "POST /ltl/capture-events"
              payload: { shipment_id: "${sh1}", device_type: "COMBINED", measured_total_weight_lb: 1300, line_measurements: [{line_no: 1, measured_weight_lb: 520, measured_length_in: 48.0, measured_width_in: 40.0, measured_height_in: 48.0}, {line_no: 2, measured_weight_lb: 780, measured_length_in: 40.0, measured_width_in: 40.0, measured_height_in: 40.0}] }
              as: TerminalOperator
              as_user_id: "${trm1}"
              captures: { ce1: "$.data.id"}
            - call: "GET /ltl/correction-notices"
              payload: { shipment_id: "${sh1}" }
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { n1: "$.data[0].id"}
          assert:
            - "Shipment.${sh1}.original_charge_cents == 26754"
            - "ShipmentLine.${ln1}.measured_cubic_ft == 213.33"
            - "ShipmentLine.${ln1}.measured_density_pcf == 2.44"
            - "ShipmentLine.${ln1}.effective_class_code == 250"
            - "ShipmentLine.${ln1}.classification_source == DIMENSIONER"
            - "ShipmentLine.${ln2}.measured_density_pcf == 10.53"
            - "ShipmentLine.${ln2}.effective_class_code == 100"
            - "CaptureEvent.${ce1}.variance_pct == 18.18"
            - "CaptureEvent.${ce1}.triggered_reweigh == true"
            - "CaptureEvent.${ce1}.triggered_reclass == true"
            - "CaptureEvent.${ce1}.reclassed_line_count == 1"
            - "CorrectionNotice.${n1}.provisional_delta_cents == 33388"
            - "CorrectionNotice.${n1}.final_delta_cents == 30030"
            - "CorrectionNotice.${n1}.notice_type == BOTH"
            - "CorrectionNotice.${n1}.status == DRAFT"
            - "CorrectionNotice.${n1}.applied_delta_cents == 0"
            - "CorrectionNotice.${n1}.inspection_fee_cents == 0"
            - "Shipment.${sh1}.assessed_total_cents == 26754"

      - name: liability_index_rolling_versus_lifetime_divergence
        grounds:
          - calculations.shipper_liability_index
          - entities.Customer.fields.liability_index_rolling
          - entities.Customer.fields.liability_index_lifetime
          - entities.Customer.fields.offender_tier
          - calculations.credit_allocation_waterfall
        distinguishing_aspect: |
          On the risk-domain entity Customer the same two resolved notices yield
          liability_index_rolling == 0.50 (90-day window drops the February strike, and the June
          partial overturn carries weight 0.5) while liability_index_lifetime == 1.50, and
          offender_tier stays TIER_0 with a 30-day window because the tier reads only the rolling
          variant.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer ACME with an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PRO2001 with a single line 400 lb class 70 (4 pieces 48.0x40.0x48.0), billed at 12500 (minimum charge binds)."
            - "Capture at 520 lb reclasses the line to 250 and raises a BOTH notice; that notice is issued, disputed and resolved UPHELD_CARRIER on 2026-02-05."
            - "Clock advanced to 2026-06-01; a second manual RECLASS notice is issued and disputed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id"}
            - call: "POST /ltl/customers"
