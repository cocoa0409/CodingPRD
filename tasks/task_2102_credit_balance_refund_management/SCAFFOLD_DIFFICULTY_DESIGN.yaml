              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_BATCH_EMPTY"
            - "RefundBatch.${batch_empty_id}.state == OPEN"
            - "RefundBatch.${batch_empty_id}.item_count == 0"
            - "RefundBatch.${batch_empty_id}.total_gross_cents == 0"
            - "RefundBatch.${batch_empty_id}.version == ${batch_empty_v}"

