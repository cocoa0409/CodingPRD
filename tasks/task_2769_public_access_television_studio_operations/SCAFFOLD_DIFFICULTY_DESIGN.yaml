              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-08T10:00:00Z", end_at: "2026-08-08T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r1_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-09T10:00:00Z", end_at: "2026-08-09T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r2_id: $.data.id}
            - call: "POST /reservations/${r1_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {r1_hold: $.data.deposit_hold_cents}
            - call: "POST /reservations/${r2_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {r2_hold: $.data.deposit_hold_cents}
            - call: "GET /producers/${p_id}"
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {held_before: $.data.deposit_held_cents}
          trigger:
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {cancellation_reason: "Producer rescheduled the shoot"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r1_status: $.data.status, r1_refund: $.data.deposit_refunded_cents, r1_forfeit: $.data.deposit_forfeited_cents, r1_uncovered: $.data.uncovered_liability_cents}
          assert:
            - "${r1_hold} == 12962 and ${r2_hold} == 12962, and ${held_before} == 25924 (the ledger invariant before compensation)"
            - "${r1_status} == CANCELLED with cancellation_reason recorded"
            - "${r1_refund} == 12962, ${r1_forfeit} == 0 and ${r1_uncovered} == 0 — a full reversal, no penalty"
            - "Reservation.${r1_id}.deposit_hold_cents == 12962 is retained for audit; the reversal is recorded in deposit_refunded_cents, not by zeroing the hold"
            - "Producer.${p_id}.deposit_held_cents == 12962 after the cancellation — exactly the sum over the remaining CONFIRMED reservation, so the invariant still holds"
            - "Producer.${p_id}.deposit_forfeited_total_cents == 0 and suspension_points == 0"
            - "Reservation.${r2_id}.status == CONFIRMED with deposit_refunded_cents 0 — the untouched booking does not drift"
            - "StudioResource.${res_id}.open_reservation_count == 1"

      - name: waived_assessment_conserves_suspension_points_and_settles_late_fee_only
        grounds:
          - state_machines.DamageAssessment.FILED_to_WAIVED
          - calculations.reservation_final_settlement
          - calculations.damage_penalty_assessment
          - entities.Producer.fields.suspension_points
          - entities.DamageAssessment.fields.waived_by_user_id
          - validations[priority=7]
          - constants.LATE_FEE_BP_PER_HOUR
        distinguishing_aspect: |
          A different conserved quantity — the producer's suspension-point balance
          — compensated by a different actor and endpoint
          (POST /damage-assessments/{assessmentId}/waive by a FinanceOfficer who
          is not the filer). The waiver zeroes the repair charge so the balance
          returns to its pre-damage value of 0 points, while the independent late
          fee still settles and the deposit split remains exact.
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and 0 suspension points."
            - "StudioResource STUDIO-A has base_deposit_cents 12345 and replacement_value_cents 900000."
            - "Reservation R (2026-08-08T10:00:00Z-12:00:00Z) was CONFIRMED at 12962 cents, CHECKED_OUT at 10:00, and returned at 13:05 with severity MAJOR and repair_estimate_cents 60000, so it sits in DAMAGE_REVIEW with a FILED assessment whose filed_by_user_id is fac-1."
            - "The late return is 3900 seconds past end_at, which is 2 started late hours."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ep_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${ep_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${ep_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-08T10:00:00Z", end_at: "2026-08-08T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r_id: $.data.id}
            - call: "POST /reservations/${r_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {r_hold: $.data.deposit_hold_cents}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-08T10:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${r_id}/checkout"
              payload: {condition_notes: "Pedestal sound at handover"}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-08T13:05:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${r_id}/return"
              payload: {damage_observed: true, severity: "MAJOR", repair_estimate_cents: 60000, damage_notes: "Pedestal column reported bent"}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "GET /damage-assessments"
              payload: {reservation_id: "${r_id}"}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {dw_id: "$.data[0].id", dw_filed_by: "$.data[0].filed_by_user_id", dw_status: "$.data[0].status"}
          trigger:
            - call: "POST /damage-assessments/${dw_id}/waive"
              payload: {waiver_reason: "Bend predated the checkout per archived condition photos"}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {dw_final: $.data.status, dw_repair: $.data.assessed_repair_cents, dw_points: $.data.suspension_points_assessed, dw_waiver: $.data.waived_by_user_id}
          assert:
            - "${r_hold} == 12962 and ${dw_status} == FILED with ${dw_filed_by} == fac-1 before the waiver"
            - "The waiver is accepted because the acting X-User-ID fin-1 differs from the filer, satisfying the priority 7 segregation-of-duties rule"
            - "${dw_final} == WAIVED, ${dw_repair} == 0, ${dw_points} == 0 and ${dw_waiver} == fin-1"
            - "Producer.${p_id}.suspension_points == 0 — the conserved balance returns to its pre-damage value, so certification_level stays BASIC and status stays ACTIVE"
            - "Reservation.${r_id}.status == SETTLED with returned_at 2026-08-08T13:05:00Z and assessed_repair_cents 0"
            - "Reservation.${r_id}.late_fee_cents == 1852 — ROUND_HALF_UP(12345 * 750 / 10000) = 926 per started late hour, times ceil(3900 / 3600) = 2"
            - "Reservation.${r_id}.deposit_forfeited_cents == 1852, deposit_refunded_cents == 11110 and uncovered_liability_cents == 0"
            - "1852 + 11110 == 12962 exactly — the deposit is conserved, with the waived repair contributing nothing"
            - "Producer.${p_id}.deposit_held_cents == 0 and deposit_forfeited_total_cents == 1852"
            - "StudioResource.${res_id}.open_reservation_count == 0"
