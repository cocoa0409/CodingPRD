  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: invoice_billing_period_closed_interval_shared_endpoint_rejected
        grounds:
          - calculations.billing_period_overlap
          - entities.Invoice.fields.period_start_yyyymm
          - entities.Invoice.fields.period_end_yyyymm
          - errors[ERR_BILLING_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = Engagement billing calendar; interval semantics = CLOSED month interval
          [start..end] where a SHARED endpoint month counts as overlap. An invoice for [202601,202602]
          followed by one for [202602,202603] shares 202602 and is rejected with ERR_BILLING_PERIOD_OVERLAP.
          Different resource and different interval semantics (closed, shared-endpoint rejected) than
          instance #2 (half-open report window, touching allowed).
        test_recipe:
          setup:
            - "An ACTIVE HOURLY engagement with LOGGED TimeEntries in 202601, 202602, 202603; one ISSUED invoice already covers the closed interval [202601,202602]."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Ovl Org", ein: "11-1110015", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c15@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng}", minutes: 60, period_yyyymm: "202601" }
              as: GrantWriter
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng}", minutes: 60, period_yyyymm: "202602" }
              as: GrantWriter
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng}", minutes: 60, period_yyyymm: "202603" }
              as: GrantWriter
            - call: "POST /grant-desk/invoices"
              payload: { engagement_id: "${eng}", period_start_yyyymm: "202601", period_end_yyyymm: "202602" }
              as: AccountManager
              captures: { inv1: $.data.id }
          trigger:
            - call: "POST /grant-desk/invoices"
              payload: { engagement_id: "${eng}", period_start_yyyymm: "202602", period_end_yyyymm: "202603" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BILLING_PERIOD_OVERLAP"

      - name: report_window_half_open_touching_endpoint_allowed
        grounds:
          - calculations.report_window_overlap
          - entities.ComplianceReport.fields.covers_window_start_utc
          - entities.ComplianceReport.fields.due_utc
          - errors[ERR_REPORT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Award reporting calendar; interval semantics = HALF-OPEN window (start, due] where
          a window ENDING exactly where another STARTS does NOT overlap (touching allowed). Inserting a
          SUPPLEMENTAL report (2026-03-01, 2026-04-01] that touches the next scheduled report at its
          start succeeds — contrasting the closed-interval shared-endpoint rejection of instance #1.
        test_recipe:
          setup:
            - "An ACTIVE award created at clock 2026-03-01 with pop=12, cadence=6 -> 2 SCHEDULED reports with windows (2026-03-01,2026-09-01] and (2026-09-01,2027-03-01]; a SUPPLEMENTAL window (2026-09-01,2026-10-01] touches the second report's start (2026-09-01) and so does not overlap."
          setup_api_calls:
            - call: "POST /grant-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Ops
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Win Org", ein: "11-1110016", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c16@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C16", title: "C16", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, floor_amount_cents: 0, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "b" }
              as: GrantWriter
              captures: { deliv: $.data.id }
            - call: "POST /grant-desk/deliverables/${deliv}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/proposals/${prop}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /grant-desk/proposals/${prop}"
              payload: {}
              as: GrantWriter
              captures: { prop_v_approved: $.data.version }
            - call: "POST /grant-desk/submissions"
              payload: { proposal_id: "${prop}", expected_proposal_version: "${prop_v_approved}" }
              as: GrantWriter
              captures: { sub: $.data.id }
            - call: "POST /grant-desk/submissions/${sub}/record-decision"
              payload: { decision: "ACCEPTED" }
              as: AccountManager
            - call: "GET /grant-desk/submissions/${sub}"
              payload: {}
              as: AccountManager
              captures: { sub_v: $.data.version }
            - call: "POST /grant-desk/awards"
              payload: { submission_id: "${sub}", expected_submission_version: "${sub_v}", awarded_amount_cents: 1000000, period_of_performance_months: 12, report_cadence_months: 6 }
              as: ComplianceOfficer
              captures: { award: $.data.id }
          trigger:
            - call: "POST /grant-desk/compliance-reports"
              payload: { award_id: "${award}", covers_window_start_utc: "2026-09-01T00:00:00Z", due_utc: "2026-10-01T00:00:00Z", sequence_index: 99 }
              as: ComplianceOfficer
              captures: { supp: $.data.id }
          assert:
            - "response.status == 201"
            - "ComplianceReport.${supp}.report_type == SUPPLEMENTAL"
            - "ComplianceReport.${supp}.status == PENDING"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_restores_logged_time_minutes_conserved
        grounds:
          - endpoints.POST /grant-desk/invoices/{id}/void
          - entities.TimeEntry.fields.status
          - entities.TimeEntry.fields.minutes
          - entities.Engagement.fields.ytd_billed_cents
        distinguishing_aspect: |
          Conserved quantity = total LOGGED billable minutes on the engagement. Issuing an HOURLY invoice
          sweeps TimeEntries LOGGED->BILLED and debits ytd_billed_cents; voiding it (the compensating
          action) restores those entries to LOGGED and recomputes ytd_billed_cents back to 0, leaving the
          named quantity (sum of LOGGED minutes = 120) unchanged before-issue vs after-void.
          Different conserved quantity than instance #2 (Client win-rate denominator counts).
        test_recipe:
          setup:
            - "An ACTIVE HOURLY engagement (hourly_rate_cents=15000) with two LOGGED TimeEntries totalling 120 minutes in 202603 (sum of LOGGED minutes = 120, ytd_billed_cents = 0)."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Void Org", ein: "11-1110017", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c17@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 15000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng}", minutes: 90, period_yyyymm: "202603" }
              as: GrantWriter
              captures: { te1: $.data.id }
            - call: "POST /grant-desk/time-entries"
              payload: { engagement_id: "${eng}", minutes: 30, period_yyyymm: "202603" }
              as: GrantWriter
              captures: { te2: $.data.id }
            - call: "POST /grant-desk/invoices"
              payload: { engagement_id: "${eng}", period_start_yyyymm: "202603", period_end_yyyymm: "202603" }
              as: AccountManager
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /grant-desk/invoices/${inv}/void"
              payload: {}
              as: AccountManager
          assert:
            - "Invoice.${inv}.status == VOID"
            - "TimeEntry.${te1}.status == LOGGED"
            - "TimeEntry.${te2}.status == LOGGED"
            - "Engagement.${eng}.ytd_billed_cents == 0"

      - name: submission_withdraw_after_file_conserves_submitted_count_invariant
        grounds:
          - state_machines.Submission.FILED_to_WITHDRAWN
          - entities.Client.fields.proposals_submitted_count
          - entities.Proposal.fields.status
          - calculations.win_rate
        distinguishing_aspect: |
          Conserved quantity = Client.proposals_submitted_count (the count of proposals that ever
          reached SUBMITTED via a live submission). Filing the submission raises it 0->1; withdrawing
          the submission (the compensating action) drops it 1->0, so the named counter returns to its
          pre-file value with no drift. Different conserved quantity than instance #1 (billable minutes).
        test_recipe:
          setup:
            - "A client whose proposals_submitted_count is 0; a proposal is then filed as a submission (count -> 1)."
          setup_api_calls:
            - call: "POST /grant-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Ops
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Inv Org", ein: "11-1110018", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c18@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "Fund C18", title: "C18", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, floor_amount_cents: 0, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z", min_org_budget_cents: 0 }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "b" }
              as: GrantWriter
              captures: { deliv: $.data.id }
            - call: "POST /grant-desk/deliverables/${deliv}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/proposals/${prop}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "GET /grant-desk/proposals/${prop}"
              payload: {}
              as: GrantWriter
              captures: { prop_v_approved: $.data.version }
            - call: "POST /grant-desk/submissions"
              payload: { proposal_id: "${prop}", expected_proposal_version: "${prop_v_approved}" }
              as: GrantWriter
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /grant-desk/submissions/${sub}/withdraw"
