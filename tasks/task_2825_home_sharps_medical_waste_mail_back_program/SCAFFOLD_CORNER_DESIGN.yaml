              as: ProgramAdmin
              captures: { enr_b: $.data.id }
            - call: "POST /sharps/enrollments/${enr_b}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_b}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_a}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 1 }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - call: "POST /sharps/enrollments/${enr_a}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_a}/sponsor-decision"
              payload: { decision: "APPROVE" }
