              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t15}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /units"
              payload: { unit_name: "Reeves Unit 7H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
              as: Operator
              as_user_id: "op-user-001"
              captures: { u15: $.data.id }
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u15}", tract_id: "${t15}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { al15: $.data.id }
          trigger:
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u15}", tract_id: "${t15}", allocated_acres: 100.0000, effective_from: "2027-12-31", effective_to: "2029-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u15}", tract_id: "${t15}", allocated_acres: 100.0000, effective_from: "2028-01-01", effective_to: "2029-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { al15b: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_ALLOCATION_INTERVAL_OVERLAP - a single shared day is an overlap"
            - "after the rejected call Unit.${u15}.active_allocation_count == 1 and unallocated_acres == 960.0000"
            - "the second trigger call returns HTTP 201: new.effective_from == existing.effective_to is adjacency, not overlap"
            - "UnitTractAllocation.${al15b}.allocation_status == ACTIVE and allocated_acres == 100.0000"
            - "Unit.${u15}.active_allocation_count == 2 and unallocated_acres == 860.0000"
            - "neither attempt approached the 1280.0000-acre capacity, so ERR_UNIT_ACREAGE_OVERSUBSCRIBED is never in play"

      - name: psa_tract_occupancy_closed_window_with_buffer_rejects_touching_endpoints
        grounds:
          - validations[priority=65]
          - errors[ERR_PSA_WINDOW_CONFLICT]
          - entities.PurchaseSaleAgreement.fields.effective_date
          - entities.PurchaseSaleAgreement.fields.curative_days
          - endpoints[POST /psas]
        overlap_semantics:
          resource_entity: Tract
          interval_kind: closed_inclusive_with_buffer
          endpoints_touch_allowed: false
        distinguishing_aspect: |
          A different resource - the Tract, not the Unit - guarded by the opposite interval
          convention: the PSA occupancy window is closed and inclusive and is extended by a
          30-day post-curative buffer, and touching endpoints do collide. The incumbent PSA
          with effective_date 2026-08-01 and curative_days 45 occupies
