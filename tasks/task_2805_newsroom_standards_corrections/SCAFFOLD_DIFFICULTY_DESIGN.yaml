              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/misconduct-investigations"
              payload: { journalist_id: "${rep}", allegation_type: "PLAGIARISM", severity: "SERIOUS", allegation_summary: "Two paragraphs lifted from a trade publication." }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { inv1: $.data.id }
            - call: "POST /standards-desk/misconduct-investigations/${inv1}/advance"
              payload: { advance_note: "Evidence gathered." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv1}/advance"
              payload: { advance_note: "Written response requested." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv1}/decide"
              payload: { disposition: "SUSTAINED", decision_note: "Attribution failure established." }
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
            - call: "POST /standards-desk/misconduct-investigations"
              payload: { journalist_id: "${rep}", allegation_type: "FABRICATION", severity: "EGREGIOUS", allegation_summary: "A quoted official does not exist." }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { inv2: $.data.id }
            - call: "POST /standards-desk/misconduct-investigations/${inv2}/advance"
              payload: { advance_note: "Phone records reviewed." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv2}/advance"
              payload: { advance_note: "Response window opened." }
              as: StandardsEditor
              as_user_id: "${sed}"
            - call: "POST /standards-desk/misconduct-investigations/${inv2}/decide"
              payload: { disposition: "SUSTAINED", decision_note: "Fabrication established beyond doubt." }
              as: ExecutiveEditor
              as_user_id: "${exec}"
          trigger:
            - call: "POST /standards-desk/misconduct-investigations/${inv2}/appeal"
              payload: { appeal_outcome: "OVERTURNED", appeal_note: "The disputed source has been produced and verified." }
              as: ExecutiveEditor
              as_user_id: "${exec2}"
          assert:
            - "response.status == 200"
            - "before the appeal MisconductInvestigation.${inv2}.penalty_points == 14 and Journalist.${rep}.penalty_points == 19"
            - "before the appeal Journalist.${rep}.employment_status == SUSPENDED"
            - "MisconductInvestigation.${inv2}.status == OVERTURNED"
            - "MisconductInvestigation.${inv2}.appeal_outcome == OVERTURNED"
            - "MisconductInvestigation.${inv2}.penalty_points == 0"
            - "MisconductInvestigation.${inv2}.disclosure_obligation == NONE"
            - "MisconductInvestigation.${inv1}.penalty_points == 5"
            - "MisconductInvestigation.${inv1}.status == SUSTAINED"
            - "Journalist.${rep}.penalty_points == 5"
            - "Journalist.${rep}.employment_status == ACTIVE"
