          - errors[ERR_DUPLICATE_VOTE]
          - calculations.vote_slot_conservation
        distinguishing_aspect: "One seat, one CAST vote: the second POST from the same membership is refused with ERR_DUPLICATE_VOTE rather than replacing the first or adding a second Vote row, so the affirmative tally stays at 1 and no seat is double-counted."
        test_recipe:
          setup:
            - "Three participants on distinct employer codes in three distinct interest categories (PRODUCER/ACME, USER/CITYW, GENERAL_INTEREST/SAFEL)."
