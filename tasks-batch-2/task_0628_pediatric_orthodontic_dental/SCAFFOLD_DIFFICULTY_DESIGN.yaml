  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_down_payment_exceeds_on_contract
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DOWN_PAYMENT_EXCEEDS]
        distinguishing_aspect: |
          Error-category pair state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 12,
          ERR_DOWN_PAYMENT_EXCEEDS): a contract create against a DRAFT (not ACTIVE) plan with an
          oversized down payment violates both, and the lower-priority state check wins -> 409
          ERR_INVALID_STATE, not 409 ERR_DOWN_PAYMENT_EXCEEDS.
        test_recipe:
          setup:
            - "Plan in DRAFT (never proposed/activated) so estimated_patient_responsibility_cents is unset/0; down_payment 999999 also exceeds it."
          setup_api_calls:
            - call: "POST /family-accounts"
              payload: { family_name: "Bly", billing_email: "bly@x.com", guardian_user_id: "guardian-bly" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /patients"
              payload: { family_account_id: "${fam_id}", full_name: "Roy Bly", date_of_birth: "2012-08-08T00:00:00Z", is_minor: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_user_id: "ortho-9", full_name: "Dr. Bay", npi: "9234567890" }
              as: ClinicAdmin
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pat_id}", modality: "BRACES" }
              as: Orthodontist
              as_user_id: "ortho-9"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          trigger:
            - call: "POST /contracts"
              payload: { plan_id: "${plan_id}", expected_plan_version: "${plan_v}", down_payment_cents: 999999, term_months: 3 }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cross_entity_state_beats_provider_conflict_on_appointment
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_CROSS_ENTITY_STATE]
          - errors[ERR_PROVIDER_CONFLICT]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 7, ERR_CROSS_ENTITY_STATE) vs
          business_temporal (priority 10, ERR_PROVIDER_CONFLICT): scheduling an ADJUSTMENT against a
          plan that is only DRAFT (not ACTIVE) at a time that also collides with the provider's other
          appointment returns the higher-priority ERR_CROSS_ENTITY_STATE, not ERR_PROVIDER_CONFLICT.
        test_recipe:
          setup:
            - "Provider P has a SCHEDULED appointment 2026-04-01 15:00-15:30 (chair C2, patient X, EMERGENCY, no plan)."
            - "A separate patient Y has a plan still in DRAFT."
