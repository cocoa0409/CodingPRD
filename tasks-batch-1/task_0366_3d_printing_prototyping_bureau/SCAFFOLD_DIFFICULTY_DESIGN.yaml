# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >= 2 instances. Every grounds:* resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are literals computed against §1.3 formulas + constants.
#
# Canonical fixture vocabulary (re-derived per instance via setup_api_calls):
#   Material SLA "Tough Resin": material_rate=35 c/cm3, machine_rate=12 c/min,
#     setup_fee=2500 c, density=1.10 g/cm3, min_wall=0.80mm, max_overhang=45deg.
#   Machine SLA build 145x145x185 (max build dim 185).
#   SECONDS_PER_LAYER=7; shift_capacity_minutes=480; cooldown_buffer_min=15.
#   File A: volume 8.40 cm3, bbox 50x50x60, min_wall 1.0, overhang 40, manifold true.
#     line A: layer_h 0.05 -> 1200 layers -> 140 print_min -> per_part 1974;
#     qty 3 -> line_total 1974*3+2500 = 8422; run_grams rhu(8.40*1.10*3)=28.
#   File B: volume 4.00 cm3, bbox 20x20x20, min_wall 1.0, overhang 40, manifold true.
#     line B: layer_h 0.10 -> 200 layers -> 24 print_min -> per_part 428;
#     qty 1 -> line_total 428+2500 = 2928; run_grams rhu(4.00*1.10*1)=4.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- instance 1: reprint cost FORWARD vs CHRONOLOGICAL (OrderLine/cost domain) ----
      - name: reprint_forward_vs_chronological_file_defect
        grounds:
          - calculations.reprint_attribution
          - state_machines.PrintRun.PRINTING_to_FAILED
          - state_machines.PrintRun.FAILED_to_QUEUED
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: >
          Same failed line B (line_total 2928): FORWARD bills full 2928 at /fail,
          CHRONOLOGICAL (cause FILE_DEFECT) finalizes to 284 at /adjudicate —
          two algorithms, different cents, on the OrderLine cost domain (distinct
          from the machine_utilization dual-variant which lives on Machine).
        test_recipe:
          setup:
            - "Bureau, Customer with 5000000c deposited, SLA Material, SLA Machine, Spool(1000g)."
            - "File B uploaded + checked PRINTABLE; Order(STANDARD) with one ACTIVE line B (line_total 2928); quoted; confirmed (escrow 2928)."
            - "PrintRun on line B started then failed with cause FILE_DEFECT; reprint line spawned, FORWARD charge 2928 applied."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau D1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "c1@x.com", display_name: "C1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer, captures: { st_b: $.data.status } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id, lt_b: $.data.line_total_cents } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { gt: $.data.grand_total_cents, ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}", captures: { ov2: $.data.version } }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
            - { call: "POST /bureaus/print-runs/${run1}/start", payload: {}, as: Operator }
            - { call: "POST /bureaus/print-runs/${run1}/fail", payload: { fail_cause: "FILE_DEFECT" }, as: Operator, captures: { rv: $.data.version } }
          trigger:
            - { call: "POST /bureaus/print-runs/${run1}/adjudicate", payload: { expected_run_version: "${rv}", machine_id: "${mach}", spool_id: "${spool}", start_min: 30, duration_min: 24 }, as: QAReviewer }
            - { call: "GET /bureaus/order-lines", payload: { order_id: "${ord}", reprint_of_line_id: "${lineB}" }, as: QAReviewer, captures: { reprint_lt: "$.data[0].line_total_cents" } }
          assert:
            - "Before adjudicate (FORWARD): Order.${ord}.grand_total_cents == 5856"
            - "After adjudicate (CHRONOLOGICAL, FILE_DEFECT): reprint OrderLine.line_total_cents == 284"
            - "After adjudicate: Order.${ord}.grand_total_cents == 3212"
            - "Customer.${cust}.escrow_held_cents == 3212"
            - "Customer.${cust}.wallet_balance_cents == 4996788"

      # ---- instance 2: machine utilization COMMITTED vs ACTIVE (Machine/scheduling domain) ----
      - name: utilization_committed_vs_active
        grounds:
          - calculations.machine_utilization
          - entities.Machine.fields.utilization_pct
          - entities.Machine.fields.active_utilization_pct
          - state_machines.PrintRun.QUEUED_to_PRINTING
        distinguishing_aspect: >
          Same two runs on machine M (durations 140 + 60): COMMITTED utilization
          counts both QUEUED slots (42%), ACTIVE counts only the one PRINTING
          (29%) — two algorithms over one run-set on the Machine domain (distinct
          from the OrderLine reprint dual-variant).
        test_recipe:
          setup:
            - "Bureau (shift_capacity 480), Customer funded, SLA Material/Machine/Spool, File A printable, order confirmed."
            - "Two QUEUED PrintRuns on machine M with durations 140 and 60; the 140-run then started (PRINTING)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau D2", shift_capacity_minutes: 480 }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "c2@x.com", display_name: "C2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileA}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { lineA: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 140 }, as: Operator, captures: { runX: $.data.id } }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineA}", machine_id: "${mach}", spool_id: "${spool}", start_min: 200, duration_min: 60 }, as: Operator, captures: { runY: $.data.id } }
          trigger:
            - { call: "GET /bureaus/machines/${mach}", payload: {}, as: Operator, captures: { util_committed_before: $.data.utilization_pct, util_active_before: $.data.active_utilization_pct } }
            - { call: "POST /bureaus/print-runs/${runX}/start", payload: {}, as: Operator }
            - { call: "GET /bureaus/machines/${mach}", payload: {}, as: Operator, captures: { util_committed_after: $.data.utilization_pct, util_active_after: $.data.active_utilization_pct } }
          assert:
            - "Before start: Machine.${mach}.utilization_pct == 42 (COMMITTED: 200/480)"
            - "Before start: Machine.${mach}.active_utilization_pct == 0 (ACTIVE: 0/480)"
            - "After start of runX: Machine.${mach}.utilization_pct == 42 (still 200/480 committed)"
            - "After start of runX: Machine.${mach}.active_utilization_pct == 29 (140/480 active)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- instance 1: MODE (b) nested rounding — per-part round THEN multiply ----
      - name: pricing_per_part_round_then_multiply
        grounds:
          - calculations.order_line_pricing
          - entities.OrderLine.fields.per_part_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: >
          Mode (b): per_part_cents = round_half_up(material_cost + machine_cost)
          is rounded BEFORE multiplying by quantity, then setup added — pinning
          round-per-part-then-sum (1974*3+2500=8422), not sum-then-round.
        test_recipe:
          setup:
            - "Bureau, Customer, SLA Material (rates 35/12, setup 2500), Machine, File A (8.40 cm3, bbox_z 60)."
            - "Draft order; one ACTIVE line: layer_h 0.05, qty 3."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau C1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "p1@x.com", display_name: "P1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { pp: $.data.per_part_cents, lt: $.data.line_total_cents, pm: $.data.print_minutes } }
          assert:
            - "OrderLine.print_minutes == 140 (ceil(ceil(60/0.05)*7/60) = ceil(1200*7/60))"
            - "OrderLine.per_part_cents == 1974 (round_half_up(8.40*35 + 140*12))"
            - "OrderLine.line_total_cents == 8422 (1974*3 + 2500)"

      # ---- instance 2: MODE (a) >=3 input non-linear: rush tier selection on aggregate base ----
      - name: rush_tier_nonlinear_surcharge
        grounds:
          - calculations.order_totals
          - entities.Order.fields.lead_tier
          - entities.Order.fields.rush_surcharge_cents
          - entities.Order.fields.grand_total_cents
        distinguishing_aspect: >
          Mode (a): grand_total = (parts + finishing) + round_half_up(base *
          RUSH_TIER[lead_tier]/100) — three inputs (parts_subtotal,
          finishing_subtotal, lead_tier) with tiered-rate selection branching on
          enum; EXPEDITE(30%) over base 12322 yields surcharge 3697, grand 16019.
        test_recipe:
          setup:
            - "Bureau, Customer, SLA Material, Machine, File A printable."
            - "EXPEDITE order; one ACTIVE line A (line_total 8422) with finishing SUPPORT_REMOVAL(500)+DYE_BLACK(800) per part, qty 3 -> finishing_subtotal 3900."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau C2" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "p2@x.com", display_name: "P2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "A.stl", volume_cm3: 8.40, bbox_x_mm: 50, bbox_y_mm: 50, bbox_z_mm: 60, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileA: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileA}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "EXPEDITE" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileA}", material_id: "${mat}", layer_height_mm: 0.05, quantity: 3 }, as: Customer, as_user_id: "${cust}", captures: { lineA: $.data.id } }
            - { call: "POST /bureaus/finishing-tasks", payload: { order_line_id: "${lineA}", kind: "SUPPORT_REMOVAL", addon_cents: 500, station_start_min: 0, station_duration_min: 10 }, as: Operator }
            - { call: "POST /bureaus/finishing-tasks", payload: { order_line_id: "${lineA}", kind: "DYE_BLACK", addon_cents: 800, station_start_min: 100, station_duration_min: 20 }, as: Operator }
          trigger:
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { parts: $.data.parts_subtotal_cents, fin: $.data.finishing_subtotal_cents, rush: $.data.rush_surcharge_cents, gt: $.data.grand_total_cents } }
          assert:
            - "Order.parts_subtotal_cents == 8422"
            - "Order.finishing_subtotal_cents == 3900 ((500+800)*3)"
            - "Order.rush_surcharge_cents == 3697 (round_half_up(12322*30/100))"
            - "Order.grand_total_cents == 16019 (12322 + 3697)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- instance 1: PrintRun CYCLE (PRINTING->FAILED->QUEUED reprint loop) ----
      - name: printrun_failure_reprint_cycle
        grounds:
          - state_machines.PrintRun.PRINTING_to_FAILED
          - state_machines.PrintRun.FAILED_to_QUEUED
          - entities.OrderLine.fields.reprint_of_line_id
        distinguishing_aspect: >
          PrintRun is cyclic: PRINTING->FAILED->QUEUED re-enters scheduling via a
          spawned reprint line (reprint_of_line_id set) — a non-linear loop on the
          PrintRun entity (distinct entity from Order's parallel-dimension machine).
        test_recipe:
          setup:
            - "Funded customer, confirmed STANDARD order with line B; PrintRun started then failed (cause OPERATOR_ERROR)."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau N1" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "n1@x.com", display_name: "N1" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
            - { call: "POST /bureaus/print-files", payload: { bureau_id: "${b}", customer_id: "${cust}", filename: "B.stl", volume_cm3: 4.00, bbox_x_mm: 20, bbox_y_mm: 20, bbox_z_mm: 20, min_wall_mm: 1.0, max_overhang_deg: 40, is_manifold: true }, as: Customer, as_user_id: "${cust}", captures: { fileB: $.data.id } }
            - { call: "POST /bureaus/print-files/${fileB}/check", payload: { material_id: "${mat}" }, as: QAReviewer }
            - { call: "POST /bureaus/orders", payload: { bureau_id: "${b}", customer_id: "${cust}", lead_tier: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /bureaus/order-lines", payload: { order_id: "${ord}", print_file_id: "${fileB}", material_id: "${mat}", layer_height_mm: 0.10, quantity: 1 }, as: Customer, as_user_id: "${cust}", captures: { lineB: $.data.id } }
            - { call: "POST /bureaus/orders/${ord}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ov: $.data.version } }
            - { call: "POST /bureaus/orders/${ord}/confirm", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /bureaus/print-runs", payload: { order_line_id: "${lineB}", machine_id: "${mach}", spool_id: "${spool}", start_min: 0, duration_min: 24 }, as: Operator, captures: { run1: $.data.id } }
            - { call: "POST /bureaus/print-runs/${run1}/start", payload: {}, as: Operator }
            - { call: "POST /bureaus/print-runs/${run1}/fail", payload: { fail_cause: "OPERATOR_ERROR" }, as: Operator, captures: { rv: $.data.version } }
          trigger:
            - { call: "POST /bureaus/print-runs/${run1}/adjudicate", payload: { expected_run_version: "${rv}", machine_id: "${mach}", spool_id: "${spool}", start_min: 30, duration_min: 24 }, as: QAReviewer }
            - { call: "GET /bureaus/order-lines", payload: { order_id: "${ord}", reprint_of_line_id: "${lineB}" }, as: QAReviewer, captures: { reprint_line: "$.data[0].id" } }
            - { call: "GET /bureaus/print-runs", payload: { order_line_id: "${reprint_line}", status: "QUEUED" }, as: QAReviewer, captures: { reprint_run_status: "$.data[0].status" } }
          assert:
            - "A reprint OrderLine exists with reprint_of_line_id == ${lineB} and reprint_cause == OPERATOR_ERROR"
            - "A new PrintRun for the reprint line exists with status == QUEUED (cycle re-entered scheduling)"

      # ---- instance 2: Order PARALLEL dimensions (fulfillment x payment) ----
      - name: order_parallel_fulfillment_payment_axes
        grounds:
          - state_machines.Order.QUOTED_to_CONFIRMED
          - state_machines.Order.READY_to_SHIPPED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: >
          Order carries two independent axes that advance on different triggers:
          confirm moves fulfillment DRAFT-chain to CONFIRMED while payment goes
          UNPAID->ESCROWED; ship moves fulfillment READY->SHIPPED while payment
          ESCROWED->CAPTURED — parallel dimensions on the Order entity (distinct
          from the PrintRun cycle).
        test_recipe:
          setup:
            - "Funded customer; order with line B confirmed (CONFIRMED/ESCROWED); run started, completed; finishing none -> order auto READY; Shipment CREATED."
          setup_api_calls:
            - { call: "POST /bureaus", payload: { name: "Bureau N2" }, as: BureauAdmin, captures: { b: $.data.id } }
            - { call: "POST /bureaus/customers", payload: { bureau_id: "${b}", email: "n2@x.com", display_name: "N2" }, as: BureauAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bureaus/customers/${cust}/deposit", payload: { amount_cents: 5000000 }, as: BureauAdmin }
            - { call: "POST /bureaus/materials", payload: { bureau_id: "${b}", process: "SLA", name: "Tough Resin", density_g_per_cm3: 1.10, material_rate_cents_per_cm3: 35, machine_rate_cents_per_min: 12, setup_fee_cents: 2500, min_wall_thickness_mm: 0.80, max_overhang_deg: 45 }, as: BureauAdmin, captures: { mat: $.data.id } }
            - { call: "POST /bureaus/machines", payload: { bureau_id: "${b}", process: "SLA", label: "Form-A", build_x_mm: 145, build_y_mm: 145, build_z_mm: 185 }, as: BureauAdmin, captures: { mach: $.data.id } }
            - { call: "POST /bureaus/spools", payload: { bureau_id: "${b}", material_id: "${mat}", grams_total: 1000 }, as: BureauAdmin, captures: { spool: $.data.id } }
