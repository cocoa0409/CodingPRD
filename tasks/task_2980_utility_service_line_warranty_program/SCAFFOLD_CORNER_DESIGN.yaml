            - call: "POST /enrollments"
              payload: { premises_id: "${p_direct}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${p_direct_v2}", source_campaign_id: "00000000-0000-4000-8000-000000000000" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_missing_campaign: $.data.error_id }
            - call: "POST /enrollments"
              payload: { premises_id: "${p_direct}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${p_direct_v2}", source_campaign_id: "${draft_campaign_id}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_not_mailed: $.data.error_id }
            - call: "POST /enrollments"
              payload: { premises_id: "${p_mailed}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${p_mailed_v2}", source_campaign_id: "${campaign_id}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { attributed_id: $.data.id, attributed_source: $.data.source_campaign_id, attributed_coverage: $.data.coverage_status }
            - call: "POST /enrollments"
              payload: { premises_id: "${p_direct}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${p_direct_v2}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { direct_id: $.data.id, direct_source: $.data.source_campaign_id }
          assert:
            - "${draft_status} == DRAFT; ${drop_mailed} == 1, ${drop_suppressed} == 2, ${drop_reasons} == {QUANTITY_CAP: 2} and ${drop_ids} == [${p_mailed}]  # created_at ASC fills the single approved piece"
            - "${p_mailed_decision} == MAILED with ${p_mailed_campaign} == ${campaign_id}; ${p_capped_decision} == SUPPRESSED with ${p_capped_reason} == QUANTITY_CAP; ${p_mailed_v2} == ${p_capped_v2} == ${p_direct_v2} == 2  # the drop bumps every evaluated premises"
            - "${err_suppressed} == ERR_MAILING_SUPPRESSED with HTTP 409  # priority 30: the campaign exists and is MAILED, but this premises was suppressed by it"
            - "${err_missing_campaign} == ERR_CAMPAIGN_NOT_FOUND with HTTP 404  # priority 6: the body foreign key must resolve before any state or suppression check"
            - "${err_not_mailed} IN {ERR_CAMPAIGN_NOT_MAILED, ERR_MAILING_SUPPRESSED} with HTTP 409  # a DRAFT campaign cannot source an enrollment, but §1.4 ranks campaign-must-be-mailed and mailing-must-not-be-suppressed BOTH at priority 30 and this one request violates both (the campaign is DRAFT, and it also never mailed ${p_direct}); the two cannot be separated because only a MAILED campaign can ever become a premises' last_mailed_campaign_id, so either error_id is a conforming answer here"
            - "${attributed_source} == ${campaign_id} and ${attributed_coverage} == PENDING_WAITING_PERIOD with HTTP 201  # the link is recorded on the enrollment"
            - "${direct_source} == null with HTTP 201  # the same premises that failed three linked attempts enrols as a direct inbound with no attribution"
            - "GET /enrollments?source_campaign_id=${campaign_id} reports total_count 1 and its ${attributed_id} row; GET /premises/${p_direct} reports version 3 (only the successful enrollment bumped it)"

      - name: second_dispatch_needs_the_supersede_link_to_an_open_sibling
