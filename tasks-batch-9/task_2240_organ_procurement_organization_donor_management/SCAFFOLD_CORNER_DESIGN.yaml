        distinguishing_aspect: |
          The second limb of the same rule guards the next-of-kin branch only: the specialist who
          recorded the SPOUSE consent is refused the finalize even with a complete document packet,
          which separates this refusal from the ERR_AUTHORIZATION_DOCUMENTATION_INCOMPLETE path.
        test_recipe:
