# =============================================================================
# Public EV-Charging & Curbside Program — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7
# =============================================================================

scenario: "Public EV-Charging & Curbside Program: station inventory & port status, session pricing & idle fee, permit & host-site agreement, utilization & reservation, maintenance & uptime SLA, grant/rebate (NEVI) compliance, ADA & access, revenue reconciliation"

domain_name: public-ev-charging-curbside
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat
  # flat: peer entities linked by foreign keys; the only nested read is the
  # Station->Port reverse-reachability sub-resource GET.
  state_machine_shape: parallel
  # Port carries two independent axes (operational_status x occupancy_status);
  # HostAgreement is cyclic (PROPOSED<->COUNTERED); ChargingSession/Reservation
  # /RebateClaim branch.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # Four-eyes control: the ProgramAdmin who submits a RebateClaim cannot approve it.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HostSite
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Curbside/host site name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: state_code, type: string, source: input, description: "US state code, e.g. CA" }
      - { name: ada_required, type: boolean, source: input, default: false, description: "Whether this site legally requires at least one ADA-accessible port per station" }
      - { name: revenue_share_pct, type: number, source: input, description: "Host's share of session revenue as a fraction 0..1 (e.g. 0.15)" }
      - { name: transaction_fee_pct, type: number, source: input, default: 0.029, description: "Payment processor fee fraction applied per session for NET-basis reconciliation" }
      - { name: transaction_fee_flat_cents, type: integer, source: input, default: 30, description: "Flat processor fee (cents) added per session for NET-basis reconciliation" }
      - { name: lifetime_gross_revenue_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of final_cost_cents of FINALIZED sessions at this site minus voided sessions; conserved quantity" }
      - { name: station_count, type: integer, source: computed, description: "Count of Station rows with site_id == this.id" }

  - name: HostAgreement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id" }
      - { name: term_start_date, type: datetime, source: input, description: "Agreement term start (ISO 8601)" }
      - { name: term_end_date, type: datetime, source: input, description: "Agreement term end (ISO 8601)" }
      - { name: proposed_revenue_share_pct, type: number, source: input, description: "Revenue share fraction the program proposes to the host" }
      - { name: counter_revenue_share_pct, type: number, source: input, default: null, description: "Latest revenue share fraction countered by the host; null until first counter" }
      - { name: round_count, type: integer, source: computed, default: 0, description: "Number of propose->counter negotiation rounds completed" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED <-> COUNTERED -> ACTIVE -> TERMINATED", constraints: "DRAFT|PROPOSED|COUNTERED|ACTIVE|TERMINATED" }

  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grant program name" }
      - { name: program_code, type: string, source: input, description: "Program code, e.g. NEVI" }
      - { name: min_uptime_pct, type: number, source: input, description: "Minimum monthly uptime percent (0..100) required for compliance, e.g. 97.0" }
      - { name: min_ports, type: integer, source: input, description: "Minimum installed ports per station to qualify" }
      - { name: min_power_kw, type: number, source: input, description: "Minimum per-port power (kW) to qualify" }
      - { name: reimbursement_rate_cents_per_kwh, type: integer, source: input, description: "Reimbursement rate in cents per delivered kWh" }
      - { name: reimbursement_cap_cents, type: integer, source: input, description: "Maximum reimbursement per claim in cents" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id" }
      - { name: grant_id, type: string, source: input, default: null, description: "FK -> GrantProgram.id; null when the station is not enrolled in a grant" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: ada_accessible, type: boolean, source: input, default: false, description: "Station-level ADA accessibility flag (kept in addition to per-port ada_accessible)" }
      - { name: total_ports, type: integer, source: computed, description: "Count of Port rows with station_id == this.id" }
      - { name: available_ports, type: integer, source: computed, description: "Count of Port rows with station_id==this.id AND operational_status==IN_SERVICE AND occupancy_status==AVAILABLE; conserved quantity" }
      - { name: operational_status, type: enum, source: system, description: "Station lifecycle", constraints: "PENDING|COMMISSIONED|SUSPENDED|DECOMMISSIONED" }

  - name: Port
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: connector_type, type: enum, source: input, description: "Connector standard", constraints: "CCS1|CCS2|NACS|CHADEMO" }
      - { name: power_kw, type: number, source: input, description: "Rated power of this port in kW" }
      - { name: ada_accessible, type: boolean, source: input, default: false, description: "Whether this port is ADA-accessible" }
      - { name: operational_status, type: enum, source: system, default: "IN_SERVICE", description: "Operational axis (independent of occupancy)", constraints: "IN_SERVICE|OUT_OF_SERVICE" }
      - { name: occupancy_status, type: enum, source: system, default: "AVAILABLE", description: "Occupancy axis (independent of operational)", constraints: "AVAILABLE|RESERVED|OCCUPIED" }
      - { name: oos_opened_at, type: datetime, source: system, default: null, description: "Logical-clock instant the port last entered OUT_OF_SERVICE; null while IN_SERVICE" }

  - name: ChargingSession
    parent: null
    common_fields: true
    fields:
      - { name: port_id, type: string, source: input, description: "FK -> Port.id" }
      - { name: driver_id, type: string, source: input, description: "Opaque driver identifier (X-User-ID of the Driver who started the session)" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant the session started (plug-in)" }
      - { name: stopped_at, type: datetime, source: system, default: null, description: "Logical-clock instant charging stopped (energy reported)" }
      - { name: unplugged_at, type: datetime, source: system, default: null, description: "Logical-clock instant the connector was unplugged / session finalized" }
      - { name: energy_kwh, type: number, source: input, default: null, description: "Delivered energy in kWh, supplied at stop; must be > 0" }
      - { name: tou_period, type: enum, source: computed, default: null, description: "Time-of-use bucket derived from started_at UTC hour", constraints: "PEAK|SHOULDER|OFFPEAK" }
      - { name: idle_minutes, type: integer, source: computed, default: 0, description: "floor((unplugged_at - stopped_at) in minutes); set at finalize" }
      - { name: energy_cost_cents, type: integer, source: computed, default: 0, description: "Tiered energy charge (see session_energy_cost)" }
      - { name: idle_fee_cents, type: integer, source: computed, default: 0, description: "Idle occupancy fee (see session_idle_fee)" }
      - { name: session_fee_cents, type: integer, source: computed, default: 0, description: "Flat per-session connection fee" }
      - { name: preliminary_cost_cents, type: integer, source: computed, default: 0, description: "energy_cost_cents + session_fee_cents, computed at stop (before idle is known)" }
      - { name: final_cost_cents, type: integer, source: computed, default: 0, description: "energy_cost_cents + session_fee_cents + idle_fee_cents, computed at finalize" }
      - { name: status, type: enum, source: system, description: "Session lifecycle", constraints: "ACTIVE|STOPPED|FINALIZED|VOIDED|ABORTED" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: port_id, type: string, source: input, description: "FK -> Port.id" }
      - { name: driver_id, type: string, source: input, description: "Opaque driver identifier (X-User-ID of the Driver who reserved)" }
      - { name: window_start, type: datetime, source: input, description: "Reservation window start (ISO 8601)" }
      - { name: window_end, type: datetime, source: input, description: "Reservation window end (ISO 8601); must be > window_start" }
      - { name: status, type: enum, source: system, description: "Reservation lifecycle", constraints: "PENDING|CONFIRMED|FULFILLED|CANCELLED" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled maintenance start (ISO 8601)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled maintenance end (ISO 8601); must be > window_start" }
      - { name: reason, type: string, source: input, description: "Reason for maintenance" }
      - { name: status, type: enum, source: system, description: "Maintenance lifecycle", constraints: "SCHEDULED|IN_PROGRESS|COMPLETED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: port_id, type: string, source: input, description: "FK -> Port.id" }
      - { name: severity, type: enum, source: input, description: "Work order severity", constraints: "LOW|MEDIUM|CRITICAL" }
      - { name: description, type: string, source: input, description: "Fault description" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant the work order opened" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant the work order resolved" }
      - { name: sla_due_at, type: datetime, source: computed, description: "opened_at + SLA hours for the severity (see work_order_sla)" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "True when resolution (or the current clock, if unresolved) is later than sla_due_at" }
      - { name: status, type: enum, source: system, description: "Work order lifecycle", constraints: "OPEN|RESOLVED" }

  - name: RebateClaim
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id" }
      - { name: grant_id, type: string, source: input, description: "FK -> GrantProgram.id" }
      - { name: period_start, type: datetime, source: input, description: "Claim period start (ISO 8601)" }
      - { name: period_end, type: datetime, source: input, description: "Claim period end (ISO 8601); must be > period_start" }
      - { name: reported_energy_kwh, type: number, source: input, description: "Operator-reported delivered energy for the period (kWh)" }
      - { name: reported_uptime_pct, type: number, source: input, description: "Operator-reported uptime percent (0..100) used for the compliance gate at submit" }
      - { name: measured_uptime_pct, type: number, source: computed, default: null, description: "Audited uptime percent recomputed from CRITICAL WorkOrder downtime at audit" }
      - { name: estimated_amount_cents, type: integer, source: computed, default: 0, description: "Provisional reimbursement using reported figures, set at submit" }
      - { name: audited_amount_cents, type: integer, source: computed, default: 0, description: "Final reimbursement using measured uptime, set at audit" }
      - { name: compliance_status, type: enum, source: system, default: "PENDING", description: "Compliance verdict", constraints: "PENDING|COMPLIANT|NON_COMPLIANT" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramAdmin who submitted (four-eyes control at approve)" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", constraints: "DRAFT|SUBMITTED|AUDITED|APPROVED|REJECTED" }

  - name: RevenueStatement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> HostSite.id" }
      - { name: period_start, type: datetime, source: input, description: "Statement period start (ISO 8601)" }
      - { name: period_end, type: datetime, source: input, description: "Statement period end (ISO 8601); must be > period_start" }
      - { name: basis, type: enum, source: input, description: "Revenue-share basis selecting the dual-variant algorithm", constraints: "GROSS|NET" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Sum of final_cost_cents over FINALIZED (non-VOIDED) sessions at the site within the period" }
      - { name: transaction_fees_cents, type: integer, source: computed, description: "Sum per session of round_half_up(final_cost_cents * transaction_fee_pct) + transaction_fee_flat_cents" }
      - { name: host_share_cents, type: integer, source: computed, description: "Host revenue share; GROSS vs NET variant (see revenue_share_split)" }
      - { name: program_share_cents, type: integer, source: computed, description: "gross_revenue_cents - host_share_cents - transaction_fees_cents" }
      - { name: session_count, type: integer, source: computed, description: "Count of FINALIZED sessions included in the statement" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", constraints: "DRAFT|FINALIZED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- HostAgreement: cyclic negotiation (PROPOSED <-> COUNTERED) ----
  - entity: HostAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /host-agreements/{id}/propose"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /host-agreements/{id}/counter"
        actor: HostOperator
        preconditions:
          - "acting HostOperator owns the site (X-User-ID == agreement.site_id) else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "counter_revenue_share_pct := payload.counter_revenue_share_pct"
          - "round_count += 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /host-agreements/{id}/propose"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "proposed_revenue_share_pct may be re-set by the program (next round)"
        note: "Cyclic edge: program re-proposes after a host counter; PROPOSED<->COUNTERED loops until ACTIVE."
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /host-agreements/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "no other ACTIVE HostAgreement exists for the same site_id (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /host-agreements/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "CASCADE (depth-3): every Station with site_id==agreement.site_id and operational_status in {PENDING,COMMISSIONED,SUSPENDED} -> DECOMMISSIONED"
          - "each such Station's Ports with operational_status==IN_SERVICE -> OUT_OF_SERVICE (oos_opened_at := now)"
          - "each such Port's ACTIVE ChargingSession -> ABORTED (final_cost_cents := 0; no revenue posted)"

  # ---- Station: commissioning lifecycle w/ cross-entity + maintenance suspend ----
  - entity: Station
    initial_state: PENDING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PENDING
        to: COMMISSIONED
        trigger: "POST /stations/{id}/commission"
        actor: ProgramAdmin
        preconditions:
          - "an ACTIVE HostAgreement exists for station.site_id (ERR_AGREEMENT_NOT_ACTIVE)   # cross-entity Station->HostAgreement"
          - "if site.ada_required OR grant present: station has >= 1 Port with ada_accessible==true (ERR_ADA_PORT_REQUIRED)"
          - "if grant_id present: total_ports >= grant.min_ports (ERR_INSUFFICIENT_PORTS)"
        side_effects: []
      - from: COMMISSIONED
        to: SUSPENDED
        trigger: "POST /maintenance-windows/{id}/start (system side effect)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Station suspended while a maintenance window is IN_PROGRESS."
      - from: SUSPENDED
        to: COMMISSIONED
        trigger: "POST /maintenance-windows/{id}/complete (system side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: DECOMMISSIONED
        trigger: "POST /stations/{id}/decommission"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: COMMISSIONED
        to: DECOMMISSIONED
        trigger: "POST /stations/{id}/decommission (or agreement termination cascade)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "each Port with operational_status==IN_SERVICE -> OUT_OF_SERVICE"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /stations/{id}/decommission (or agreement termination cascade)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "each Port with operational_status==IN_SERVICE -> OUT_OF_SERVICE"

  # ---- Port: PARALLEL dimensions (operational_status x occupancy_status) ----
  - entity: Port
    initial_state: "operational_status=IN_SERVICE, occupancy_status=AVAILABLE"
    terminal_states: []
    transitions:
      # operational axis
      - from: "operational_status=IN_SERVICE"
        to: "operational_status=OUT_OF_SERVICE"
        trigger: "POST /ports/{id}/out-of-service  OR  system (CRITICAL work order / decommission / agreement termination)"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "oos_opened_at := now"
          - "CASCADE: the port's ACTIVE ChargingSession -> ABORTED; that abort frees occupancy_status -> AVAILABLE"
      - from: "operational_status=OUT_OF_SERVICE"
        to: "operational_status=IN_SERVICE"
        trigger: "POST /ports/{id}/in-service"
        actor: FieldTechnician
        preconditions:
          - "no OPEN CRITICAL WorkOrder remains on the port (ERR_INVALID_STATE)"
        side_effects:
          - "oos_opened_at := null"
      # occupancy axis
      - from: "occupancy_status=AVAILABLE"
        to: "occupancy_status=OCCUPIED"
        trigger: "POST /charging-sessions  OR  POST /reservations/{id}/check-in"
        actor: Driver
        preconditions:
          - "operational_status==IN_SERVICE (ERR_PORT_OUT_OF_SERVICE)   # cross-entity ChargingSession->Port"
        side_effects: []
      - from: "occupancy_status=OCCUPIED"
        to: "occupancy_status=AVAILABLE"
        trigger: "POST /charging-sessions/{id}/finalize  OR  ChargingSession ABORTED cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: "occupancy_status=AVAILABLE"
        to: "occupancy_status=RESERVED"
        trigger: "POST /reservations/{id}/confirm"
        actor: Driver
        preconditions:
          - "operational_status==IN_SERVICE (ERR_PORT_OUT_OF_SERVICE)   # cross-entity Reservation->Port"
        side_effects: []
      - from: "occupancy_status=RESERVED"
        to: "occupancy_status=AVAILABLE"
        trigger: "POST /reservations/{id}/cancel"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: "occupancy_status=RESERVED"
        to: "occupancy_status=OCCUPIED"
        trigger: "POST /reservations/{id}/check-in"
        actor: Driver
        preconditions: []
        side_effects: []

  # ---- ChargingSession: branching w/ abort + compensation ----
  - entity: ChargingSession
    initial_state: ACTIVE
    terminal_states: [FINALIZED, VOIDED, ABORTED]
    transitions:
      - from: ACTIVE
        to: STOPPED
        trigger: "POST /charging-sessions/{id}/stop"
        actor: Driver
        preconditions:
          - "acting Driver owns the session (X-User-ID == session.driver_id) else ERR_NOT_RESOURCE_OWNER"
          - "energy_kwh > 0 (ERR_ENERGY_INVALID)"
        side_effects:
          - "stopped_at := now; energy_kwh := payload.energy_kwh"
          - "tou_period, energy_cost_cents, session_fee_cents computed"
          - "preliminary_cost_cents := energy_cost_cents + session_fee_cents"
      - from: STOPPED
        to: FINALIZED
        trigger: "POST /charging-sessions/{id}/finalize"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "unplugged_at := now; idle_minutes := floor((unplugged_at - stopped_at)/60s)"
          - "idle_fee_cents computed; final_cost_cents := energy_cost_cents + session_fee_cents + idle_fee_cents"
          - "port.occupancy_status -> AVAILABLE"
          - "LEDGER: HostSite.lifetime_gross_revenue_cents += final_cost_cents"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /charging-sessions/{id}/void"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "COMPENSATION: HostSite.lifetime_gross_revenue_cents -= final_cost_cents (conserved: back to pre-finalize value)"
      - from: ACTIVE
        to: ABORTED
        trigger: "system (port OUT_OF_SERVICE cascade / agreement termination)"
        actor: system
        preconditions: []
        side_effects:
          - "final_cost_cents := 0; no revenue posted"
          - "port.occupancy_status -> AVAILABLE"

  # ---- Reservation: branching ----
  - entity: Reservation
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Driver
        preconditions:
          - "port.operational_status==IN_SERVICE (ERR_PORT_OUT_OF_SERVICE)   # cross-entity Reservation->Port"
          - "port.occupancy_status==AVAILABLE (ERR_PORT_NOT_AVAILABLE)"
          - "no CONFIRMED Reservation on the same port whose [window_start,window_end) overlaps this one (ERR_RESERVATION_OVERLAP)"
        side_effects:
          - "port.occupancy_status -> RESERVED"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /reservations/{id}/check-in"
        actor: Driver
        preconditions: []
        side_effects:
          - "port.occupancy_status -> OCCUPIED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Driver
        preconditions: []
        side_effects:
          - "COMPENSATION: port.occupancy_status -> AVAILABLE (conserved: Station.available_ports restored)"

  # ---- MaintenanceWindow: linear w/ station coupling ----
  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /maintenance-windows/{id}/start"
        actor: FieldTechnician
        preconditions:
          - "station.operational_status==COMMISSIONED (ERR_INVALID_STATE)"
        side_effects:
          - "station.operational_status -> SUSPENDED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/complete"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "station.operational_status -> COMMISSIONED"

  # ---- WorkOrder: linear w/ CRITICAL cascade ----
  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /work-orders/{id}/resolve"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "resolved_at := now; sla_breached recomputed"
      - from: "(creation)"
        to: OPEN
        trigger: "POST /work-orders"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "opened_at := now; sla_due_at computed"
          - "CASCADE (depth-3) when severity==CRITICAL: port.operational_status -> OUT_OF_SERVICE -> the port's ACTIVE ChargingSession -> ABORTED -> aborted session frees port.occupancy_status -> AVAILABLE"

  # ---- RebateClaim: branching w/ dual-variant + four-eyes ----
  - entity: RebateClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rebate-claims/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "reported_uptime_pct >= grant.min_uptime_pct (ERR_UPTIME_BELOW_THRESHOLD)   # boundary >="
        side_effects:
          - "estimated_amount_cents := min(round_half_up(reported_energy_kwh * grant.reimbursement_rate_cents_per_kwh), grant.reimbursement_cap_cents)"
          - "compliance_status := COMPLIANT"
          - "submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: AUDITED
        trigger: "POST /rebate-claims/{id}/audit"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "measured_uptime_pct := recompute from CRITICAL WorkOrder downtime (see rebate_measured_uptime)"
          - "if measured_uptime_pct >= grant.min_uptime_pct: audited_amount_cents := estimated_amount_cents, compliance_status := COMPLIANT"
          - "else: audited_amount_cents := 0, compliance_status := NON_COMPLIANT"
      - from: AUDITED
        to: APPROVED
        trigger: "POST /rebate-claims/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)   # four-eyes control"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rebate-claims/{id}/reject"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: AUDITED
        to: REJECTED
        trigger: "POST /rebate-claims/{id}/reject"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  # ---- RevenueStatement: linear ----
  - entity: RevenueStatement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: "(creation)"
        to: DRAFT
        trigger: "POST /revenue-statements"
        actor: ProgramAdmin
        preconditions:
          - "expected_site_version matches HostSite.version (ERR_STALE_VERSION)"
        side_effects:
          - "gross_revenue_cents, transaction_fees_cents, host_share_cents, program_share_cents, session_count computed (see revenue_share_split)"
          - "increments HostSite.version by 1"
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /revenue-statements/{id}/finalize"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-station
    parent_entity: Station
    write_endpoint: "POST /rebate-claims"
    occ_field: "expected_station_version"
    description: |
      Creating a RebateClaim snapshots the Station's commissioned configuration.
      If the Station's version has advanced since the client last observed it
      (a prior claim create bumped it, or the station was recommissioned /
      reconfigured), the create is rejected as stale. A fresh read followed by a
      retry with the current version succeeds; the new claim supersedes any prior
      DRAFT claim for the same period.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-create-stale-site
    parent_entity: HostSite
    write_endpoint: "POST /revenue-statements"
    occ_field: "expected_site_version"
    description: |
      Generating a RevenueStatement snapshots the HostSite's session ledger for
      the period. If the HostSite's version has advanced since the client last
      observed it (a prior statement generation bumped it), the create is
      rejected as stale so the client re-reads the current ledger and regenerates
      against it. The new statement supersedes any prior DRAFT statement for the
      period.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_energy_cost
    trigger: "POST /charging-sessions/{id}/stop"
    algorithm: tiered_pricing
    formula: |
      # Time-of-use bucket from started_at UTC hour h:
      #   PEAK     if 16 <= h < 21
      #   OFFPEAK  if 0  <= h < 7
      #   SHOULDER otherwise
      base_rate = { PEAK: PEAK_RATE, SHOULDER: SHOULDER_RATE, OFFPEAK: OFFPEAK_RATE }[tou_period]
      demand_surcharge = DEMAND_SURCHARGE_CENTS if port.power_kw >= DEMAND_KW_THRESHOLD else 0
      raw = energy_kwh * (base_rate + demand_surcharge)          # cents
      energy_cost_cents = min(round_half_up(raw), ENERGY_COST_CAP_CENTS)
      session_fee_cents = SESSION_FEE_CENTS
    input_set: "single session; power_kw read from the session's Port"
    constants:
      PEAK_RATE: 48            # cents/kWh
      SHOULDER_RATE: 36        # cents/kWh
      OFFPEAK_RATE: 24         # cents/kWh
      DEMAND_KW_THRESHOLD: 150 # kW; >= triggers surcharge
      DEMAND_SURCHARGE_CENTS: 5
      ENERGY_COST_CAP_CENTS: 50000
      SESSION_FEE_CENTS: 100
    precision: "whole cents, round_half_up"

  - name: session_idle_fee
    trigger: "POST /charging-sessions/{id}/finalize"
    algorithm: threshold
    formula: |
      idle_minutes = floor((unplugged_at - stopped_at) total_seconds / 60)
      if idle_minutes > IDLE_GRACE_MIN:                          # strict >
        idle_fee_cents = min((idle_minutes - IDLE_GRACE_MIN) * IDLE_RATE_CENTS_PER_MIN, IDLE_CAP_CENTS)
      else:
        idle_fee_cents = 0
    input_set: "single session"
    constants:
      IDLE_GRACE_MIN: 10
      IDLE_RATE_CENTS_PER_MIN: 40
      IDLE_CAP_CENTS: 3000
    precision: "whole cents; idle_minutes floored"

  - name: session_final_cost
    trigger: "POST /charging-sessions/{id}/finalize"
    algorithm: aggregation
    formula: |
      final_cost_cents = energy_cost_cents + session_fee_cents + idle_fee_cents
    input_set: "single session"
    variants:
      - name: preliminary
        when: "at stop, before idle is known"
        difference: "preliminary_cost_cents omits idle_fee_cents (= energy_cost_cents + session_fee_cents)"
      - name: final
        when: "at finalize"
        difference: "final_cost_cents adds idle_fee_cents"
    precision: "whole cents"

  - name: work_order_sla
    trigger: "POST /work-orders (create) and POST /work-orders/{id}/resolve"
    algorithm: threshold
    formula: |
      sla_hours = { CRITICAL: 4, MEDIUM: 24, LOW: 72 }[severity]
      sla_due_at = opened_at + sla_hours hours
      breach_reference = resolved_at if status==RESOLVED else current_clock
      sla_breached = breach_reference > sla_due_at                # strict >
    input_set: "single work order"
    constants:
      SLA_HOURS_CRITICAL: 4
      SLA_HOURS_MEDIUM: 24
      SLA_HOURS_LOW: 72
    precision: "datetime comparison"

  - name: rebate_measured_uptime
    trigger: "POST /rebate-claims/{id}/audit"
    algorithm: aggregation
    formula: |
      # period length in minutes
      period_minutes = (period_end - period_start) total_seconds / 60
      # downtime: CRITICAL WorkOrders on ports of the claim's Station, clipped to the period
      critical_downtime_minutes =
        sum over WorkOrder w where w.severity==CRITICAL
                                 and w.port belongs to claim.station
                                 and w.resolved_at is not null
                                 and [w.opened_at, w.resolved_at) intersects [period_start, period_end)
          of ( min(w.resolved_at, period_end) - max(w.opened_at, period_start) ) in minutes
      measured_uptime_pct = round_half_up( 100 * (1 - critical_downtime_minutes / period_minutes), 2 )
      measured_uptime_pct = clamp(measured_uptime_pct, 0, 100)
    input_set: "CRITICAL RESOLVED WorkOrders on the claim's station overlapping the claim period"
    precision: "2 decimal places, round_half_up"

  - name: rebate_amounts
    trigger: "POST /rebate-claims/{id}/submit (estimated) and POST /rebate-claims/{id}/audit (audited)"
    algorithm: threshold
    formula: |
      # estimated (at submit; gate already passed on reported_uptime_pct >= min):
      estimated_amount_cents = min(round_half_up(reported_energy_kwh * reimbursement_rate_cents_per_kwh),
                                   reimbursement_cap_cents)
      # audited (at audit):
      if measured_uptime_pct >= grant.min_uptime_pct:
        audited_amount_cents = estimated_amount_cents
      else:
        audited_amount_cents = 0
    input_set: "single claim + its GrantProgram"
    variants:
      - name: estimated
        when: "at submit; uses operator-reported reported_uptime_pct for the compliance gate"
        difference: "always > 0 once the reported-uptime gate passes; ignores audited downtime"
      - name: audited
        when: "at audit; uses measured_uptime_pct recomputed from CRITICAL WorkOrder downtime"
        difference: "collapses to 0 when measured_uptime_pct < min_uptime_pct even though estimated passed"
    precision: "whole cents, round_half_up"

  - name: revenue_share_split
    trigger: "POST /revenue-statements"
    algorithm: aggregation
    formula: |
      # included sessions S: ChargingSession with status==FINALIZED whose Port's Station has
      # site_id==statement.site_id and started_at in [period_start, period_end), ordered by
      # (started_at ASC, created_at ASC) — deterministic, id never used.
      gross_revenue_cents = sum over s in S of s.final_cost_cents
      # per-session processor fee, rounded per session then summed:
      transaction_fees_cents = sum over s in S of ( round_half_up(s.final_cost_cents * transaction_fee_pct)
                                                    + transaction_fee_flat_cents )
      # host share — ROUND PER SESSION THEN SUM (pinned order; NOT sum-then-round):
      if basis == GROSS:
        host_share_cents = sum over s in S of round_half_up(s.final_cost_cents * revenue_share_pct)
      else: # NET
        host_share_cents = sum over s in S of round_half_up(
                             (s.final_cost_cents
                              - (round_half_up(s.final_cost_cents * transaction_fee_pct) + transaction_fee_flat_cents))
                             * revenue_share_pct)
      program_share_cents = gross_revenue_cents - host_share_cents - transaction_fees_cents
      session_count = |S|
    input_set: "FINALIZED sessions at the site within the period"
    variants:
      - name: gross_basis
        when: "basis == GROSS"
        difference: "host share computed on full final_cost_cents"
      - name: net_basis
        when: "basis == NET"
        difference: "host share computed on final_cost_cents minus the per-session processor fee; yields a strictly lower share when fees > 0"
    precision: "whole cents, round_half_up, rounding applied per session before summation"

  - name: available_ports
    trigger: "any Port operational_status/occupancy_status change"
    algorithm: aggregation
    formula: |
      total_ports = count(Port where station_id == station.id)
      available_ports = count(Port where station_id == station.id
                                     and operational_status == IN_SERVICE
                                     and occupancy_status == AVAILABLE)
    input_set: "all Ports of the station"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "referenced FK bodies exist (site_id, grant_id, station_id, port_id) resolve to a row"
    error_id: "ERR_*_NOT_FOUND (per referenced type)"
    http_status: 404
    applies_to: "create endpoints carrying FK fields"

  - priority: 5
    category: auth
    check: "ownership — HostOperator acts only on its own site (X-User-ID == site_id); Driver acts only on its own session/reservation (X-User-ID == driver_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "HostOperator counter/reads; Driver stop/cancel/check-in"

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "commission requires an ACTIVE HostAgreement for the station's site"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /stations/{id}/commission"

  - priority: 8
    category: business_safety
    check: "ADA — commission requires >= 1 ada_accessible Port when site.ada_required or a grant is attached; four-eyes — approve requires a different X-User-ID than the submitter"
    error_id: "ERR_ADA_PORT_REQUIRED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /stations/{id}/commission; POST /rebate-claims/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "temporal conflicts — reservation half-open [start,end) overlap on a Port; maintenance window closed [start,end] within MW_BUFFER_MIN of another window on the Station; period_end/window_end must exceed start"
    error_id: "ERR_RESERVATION_OVERLAP | ERR_MAINTENANCE_WINDOW_OVERLAP | ERR_INVALID_WINDOW | ERR_INVALID_PERIOD"
    http_status: 409
    applies_to: "reservation confirm; maintenance-window create; reservation/maintenance/claim/statement create"

  - priority: 10
    category: business_constraint
    check: "port availability & configuration — port IN_SERVICE and AVAILABLE for session/reservation; grant min_ports at commission; energy_kwh > 0 at stop"
    error_id: "ERR_PORT_OUT_OF_SERVICE | ERR_PORT_NOT_AVAILABLE | ERR_INSUFFICIENT_PORTS | ERR_ENERGY_INVALID"
    http_status: 409
    applies_to: "session/reservation/commission/stop"

  - priority: 11
    category: business_fiscal
    check: "rebate compliance gate — reported_uptime_pct >= grant.min_uptime_pct at submit"
    error_id: ERR_UPTIME_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /rebate-claims/{id}/submit"

  - priority: 12
    category: business_constraint
    check: "OCC — expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rebate-claims; POST /revenue-statements"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- HostSite ----
  - { method: POST, path: "/host-sites", description: "Create a host site", roles: [ProgramAdmin], code: 201, input: [name, address, state_code, "ada_required?", revenue_share_pct, "transaction_fee_pct?", "transaction_fee_flat_cents?"], output: HostSite, side_effects: ["lifetime_gross_revenue_cents=0", "station_count=0", "version=1"] }
  - { method: GET, path: "/host-sites/{id}", description: "Get a host site (HostOperator only its own)", roles: [ProgramAdmin, HostOperator], code: 200, input: [], output: HostSite, side_effects: [] }

  # ---- HostAgreement ----
  - { method: POST, path: "/host-agreements", description: "Create a host agreement (DRAFT)", roles: [ProgramAdmin], code: 201, input: [site_id, term_start_date, term_end_date, proposed_revenue_share_pct], output: HostAgreement, side_effects: ["status=DRAFT", "round_count=0"] }
  - { method: GET, path: "/host-agreements/{id}", description: "Get a host agreement", roles: [ProgramAdmin, HostOperator], code: 200, input: [], output: HostAgreement, side_effects: [] }
  - { method: GET, path: "/host-agreements", description: "List host agreements (reverse lookup by site)", roles: [ProgramAdmin, HostOperator], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "HostAgreement[]", side_effects: [] }
  - { method: POST, path: "/host-agreements/{id}/propose", description: "Program proposes (DRAFT/COUNTERED -> PROPOSED)", roles: [ProgramAdmin], code: 200, input: ["proposed_revenue_share_pct?"], output: HostAgreement, side_effects: ["status -> PROPOSED"] }
  - { method: POST, path: "/host-agreements/{id}/counter", description: "Host counters (PROPOSED -> COUNTERED)", roles: [HostOperator], code: 200, input: [counter_revenue_share_pct], output: HostAgreement, side_effects: ["status -> COUNTERED", "counter_revenue_share_pct set", "round_count += 1"] }
  - { method: POST, path: "/host-agreements/{id}/activate", description: "Program activates (PROPOSED -> ACTIVE)", roles: [ProgramAdmin], code: 200, input: [], output: HostAgreement, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/host-agreements/{id}/terminate", description: "Terminate (ACTIVE -> TERMINATED); cascades to stations/ports/sessions", roles: [ProgramAdmin], code: 200, input: [], output: HostAgreement, side_effects: ["status -> TERMINATED", "CASCADE decommission stations -> OOS ports -> abort sessions"] }

  # ---- GrantProgram ----
  - { method: POST, path: "/grant-programs", description: "Create a grant program", roles: [ProgramAdmin], code: 201, input: [name, program_code, min_uptime_pct, min_ports, min_power_kw, reimbursement_rate_cents_per_kwh, reimbursement_cap_cents], output: GrantProgram, side_effects: [] }
  - { method: GET, path: "/grant-programs/{id}", description: "Get a grant program", roles: [ProgramAdmin, HostOperator], code: 200, input: [], output: GrantProgram, side_effects: [] }

  # ---- Station ----
  - { method: POST, path: "/stations", description: "Create a station (PENDING)", roles: [ProgramAdmin], code: 201, input: [site_id, "grant_id?", name, "ada_accessible?"], output: Station, side_effects: ["status=PENDING", "total_ports=0", "available_ports=0"] }
  - { method: GET, path: "/stations/{id}", description: "Get a station", roles: [ProgramAdmin, HostOperator, FieldTechnician], code: 200, input: [], output: Station, side_effects: [] }
  - { method: GET, path: "/stations", description: "List stations (reverse lookup by site or grant)", roles: [ProgramAdmin, HostOperator], code: 200, input: ["site_id?", "grant_id?", "status?", "limit?", "offset?"], output: "Station[]", side_effects: [] }
  - { method: GET, path: "/stations/{id}/ports", description: "List a station's ports (reverse lookup for Port.station_id)", roles: [ProgramAdmin, HostOperator, FieldTechnician], code: 200, input: ["limit?", "offset?"], output: "Port[]", side_effects: [] }
  - { method: POST, path: "/stations/{id}/commission", description: "Commission a station (PENDING -> COMMISSIONED)", roles: [ProgramAdmin], code: 200, input: [], output: Station, side_effects: ["status -> COMMISSIONED"] }
  - { method: POST, path: "/stations/{id}/decommission", description: "Decommission a station (-> DECOMMISSIONED)", roles: [ProgramAdmin], code: 200, input: [], output: Station, side_effects: ["status -> DECOMMISSIONED", "IN_SERVICE ports -> OUT_OF_SERVICE"] }

  # ---- Port ----
  - { method: POST, path: "/ports", description: "Create a port on a station", roles: [ProgramAdmin], code: 201, input: [station_id, connector_type, power_kw, "ada_accessible?"], output: Port, side_effects: ["operational_status=IN_SERVICE", "occupancy_status=AVAILABLE"] }
  - { method: GET, path: "/ports/{id}", description: "Get a port", roles: [ProgramAdmin, HostOperator, FieldTechnician, Driver], code: 200, input: [], output: Port, side_effects: [] }
  - { method: POST, path: "/ports/{id}/out-of-service", description: "Take a port OUT_OF_SERVICE", roles: [FieldTechnician], code: 200, input: [], output: Port, side_effects: ["operational_status -> OUT_OF_SERVICE", "oos_opened_at := now", "abort ACTIVE session; free occupancy"] }
  - { method: POST, path: "/ports/{id}/in-service", description: "Return a port IN_SERVICE", roles: [FieldTechnician], code: 200, input: [], output: Port, side_effects: ["operational_status -> IN_SERVICE", "oos_opened_at := null"] }

  # ---- ChargingSession ----
  - { method: POST, path: "/charging-sessions", description: "Start a charging session (ACTIVE)", roles: [Driver], code: 201, input: [port_id, driver_id], output: ChargingSession, side_effects: ["status=ACTIVE", "started_at := now", "port.occupancy_status -> OCCUPIED"] }
  - { method: GET, path: "/charging-sessions/{id}", description: "Get a charging session", roles: [ProgramAdmin, Driver], code: 200, input: [], output: ChargingSession, side_effects: [] }
  - { method: GET, path: "/charging-sessions", description: "List charging sessions (reverse lookup by port or driver)", roles: [ProgramAdmin, Driver], code: 200, input: ["port_id?", "driver_id?", "status?", "limit?", "offset?"], output: "ChargingSession[]", side_effects: [] }
  - { method: POST, path: "/charging-sessions/{id}/stop", description: "Stop charging (ACTIVE -> STOPPED); report energy", roles: [Driver], code: 200, input: [energy_kwh], output: ChargingSession, side_effects: ["stopped_at := now", "energy_cost_cents/session_fee_cents/preliminary_cost_cents computed"] }
  - { method: POST, path: "/charging-sessions/{id}/finalize", description: "Finalize (STOPPED -> FINALIZED); idle + gross ledger", roles: [ProgramAdmin], code: 200, input: [], output: ChargingSession, side_effects: ["unplugged_at := now", "idle_fee_cents/final_cost_cents computed", "port.occupancy_status -> AVAILABLE", "HostSite.lifetime_gross_revenue_cents += final_cost_cents"] }
  - { method: POST, path: "/charging-sessions/{id}/void", description: "Void a finalized session (FINALIZED -> VOIDED); reverse ledger", roles: [ProgramAdmin], code: 200, input: [], output: ChargingSession, side_effects: ["HostSite.lifetime_gross_revenue_cents -= final_cost_cents"] }

  # ---- Reservation ----
  - { method: POST, path: "/reservations", description: "Create a reservation (PENDING)", roles: [Driver], code: 201, input: [port_id, driver_id, window_start, window_end], output: Reservation, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/reservations/{id}", description: "Get a reservation", roles: [ProgramAdmin, Driver], code: 200, input: [], output: Reservation, side_effects: [] }
  - { method: GET, path: "/reservations", description: "List reservations (reverse lookup by port or driver)", roles: [ProgramAdmin, Driver], code: 200, input: ["port_id?", "driver_id?", "status?", "limit?", "offset?"], output: "Reservation[]", side_effects: [] }
  - { method: POST, path: "/reservations/{id}/confirm", description: "Confirm a reservation (PENDING -> CONFIRMED); holds the port", roles: [Driver], code: 200, input: [], output: Reservation, side_effects: ["overlap check", "port.occupancy_status -> RESERVED"] }
  - { method: POST, path: "/reservations/{id}/cancel", description: "Cancel a reservation (-> CANCELLED); releases the port", roles: [Driver], code: 200, input: [], output: Reservation, side_effects: ["if CONFIRMED: port.occupancy_status -> AVAILABLE"] }
  - { method: POST, path: "/reservations/{id}/check-in", description: "Check in (CONFIRMED -> FULFILLED); occupies the port", roles: [Driver], code: 200, input: [], output: Reservation, side_effects: ["port.occupancy_status -> OCCUPIED"] }

  # ---- MaintenanceWindow ----
  - { method: POST, path: "/maintenance-windows", description: "Schedule a maintenance window (SCHEDULED); buffer overlap check", roles: [ProgramAdmin], code: 201, input: [station_id, window_start, window_end, reason], output: MaintenanceWindow, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/maintenance-windows/{id}", description: "Get a maintenance window", roles: [ProgramAdmin, FieldTechnician], code: 200, input: [], output: MaintenanceWindow, side_effects: [] }
  - { method: GET, path: "/maintenance-windows", description: "List maintenance windows (reverse lookup by station)", roles: [ProgramAdmin, FieldTechnician], code: 200, input: ["station_id?", "status?", "limit?", "offset?"], output: "MaintenanceWindow[]", side_effects: [] }
  - { method: POST, path: "/maintenance-windows/{id}/start", description: "Start maintenance (SCHEDULED -> IN_PROGRESS); suspends station", roles: [FieldTechnician], code: 200, input: [], output: MaintenanceWindow, side_effects: ["station.operational_status -> SUSPENDED"] }
  - { method: POST, path: "/maintenance-windows/{id}/complete", description: "Complete maintenance (IN_PROGRESS -> COMPLETED); recommissions station", roles: [FieldTechnician], code: 200, input: [], output: MaintenanceWindow, side_effects: ["station.operational_status -> COMMISSIONED"] }

  # ---- WorkOrder ----
  - { method: POST, path: "/work-orders", description: "Open a work order (OPEN); CRITICAL cascades port OOS", roles: [FieldTechnician], code: 201, input: [port_id, severity, description], output: WorkOrder, side_effects: ["status=OPEN", "opened_at := now", "sla_due_at computed", "if CRITICAL: CASCADE port OOS -> abort session -> free occupancy"] }
  - { method: GET, path: "/work-orders/{id}", description: "Get a work order", roles: [ProgramAdmin, FieldTechnician], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: GET, path: "/work-orders", description: "List work orders (reverse lookup by port)", roles: [ProgramAdmin, FieldTechnician], code: 200, input: ["port_id?", "status?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/resolve", description: "Resolve a work order (OPEN -> RESOLVED)", roles: [FieldTechnician], code: 200, input: [], output: WorkOrder, side_effects: ["resolved_at := now", "sla_breached recomputed"] }

  # ---- RebateClaim ----
  - { method: POST, path: "/rebate-claims", description: "Create a rebate claim (DRAFT); OCC on Station.version", roles: [ProgramAdmin], code: 201, input: [station_id, grant_id, period_start, period_end, reported_energy_kwh, reported_uptime_pct, expected_station_version], output: RebateClaim, side_effects: ["status=DRAFT", "compliance_status=PENDING", "increments Station.version by 1"] }
  - { method: GET, path: "/rebate-claims/{id}", description: "Get a rebate claim", roles: [ProgramAdmin], code: 200, input: [], output: RebateClaim, side_effects: [] }
  - { method: GET, path: "/rebate-claims", description: "List rebate claims (reverse lookup by station or grant)", roles: [ProgramAdmin], code: 200, input: ["station_id?", "grant_id?", "status?", "limit?", "offset?"], output: "RebateClaim[]", side_effects: [] }
  - { method: POST, path: "/rebate-claims/{id}/submit", description: "Submit (DRAFT -> SUBMITTED); compliance gate + estimated amount", roles: [ProgramAdmin], code: 200, input: [], output: RebateClaim, side_effects: ["estimated_amount_cents computed", "compliance_status=COMPLIANT", "submitted_by_user_id := X-User-ID"] }
  - { method: POST, path: "/rebate-claims/{id}/audit", description: "Audit (SUBMITTED -> AUDITED); measured uptime + audited amount", roles: [ProgramAdmin], code: 200, input: [], output: RebateClaim, side_effects: ["measured_uptime_pct computed", "audited_amount_cents computed", "compliance_status set"] }
  - { method: POST, path: "/rebate-claims/{id}/approve", description: "Approve (AUDITED -> APPROVED); four-eyes control", roles: [ProgramAdmin], code: 200, input: [], output: RebateClaim, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/rebate-claims/{id}/reject", description: "Reject (SUBMITTED/AUDITED -> REJECTED)", roles: [ProgramAdmin], code: 200, input: [], output: RebateClaim, side_effects: ["status -> REJECTED"] }

  # ---- RevenueStatement ----
  - { method: POST, path: "/revenue-statements", description: "Generate a revenue statement (DRAFT); OCC on HostSite.version", roles: [ProgramAdmin], code: 201, input: [site_id, period_start, period_end, basis, expected_site_version], output: RevenueStatement, side_effects: ["shares computed", "status=DRAFT", "increments HostSite.version by 1"] }
  - { method: GET, path: "/revenue-statements/{id}", description: "Get a revenue statement", roles: [ProgramAdmin, HostOperator], code: 200, input: [], output: RevenueStatement, side_effects: [] }
  - { method: GET, path: "/revenue-statements", description: "List revenue statements (reverse lookup by site)", roles: [ProgramAdmin, HostOperator], code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "RevenueStatement[]", side_effects: [] }
  - { method: POST, path: "/revenue-statements/{id}/finalize", description: "Finalize a revenue statement (DRAFT -> FINALIZED)", roles: [ProgramAdmin], code: 200, input: [], output: RevenueStatement, side_effects: ["status -> FINALIZED"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock := to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "HostOperator not owner of the site, or Driver not owner of the session/reservation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_HOST_SITE_NOT_FOUND, http: 404, condition: "HostSite id not found" }
  - { id: ERR_HOST_AGREEMENT_NOT_FOUND, http: 404, condition: "HostAgreement id not found" }
  - { id: ERR_GRANT_PROGRAM_NOT_FOUND, http: 404, condition: "GrantProgram id not found" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "Station id not found" }
  - { id: ERR_PORT_NOT_FOUND, http: 404, condition: "Port id not found" }
  - { id: ERR_CHARGING_SESSION_NOT_FOUND, http: 404, condition: "ChargingSession id not found" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "Reservation id not found" }
  - { id: ERR_MAINTENANCE_WINDOW_NOT_FOUND, http: 404, condition: "MaintenanceWindow id not found" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id not found" }
  - { id: ERR_REBATE_CLAIM_NOT_FOUND, http: 404, condition: "RebateClaim id not found" }
  - { id: ERR_REVENUE_STATEMENT_NOT_FOUND, http: 404, condition: "RevenueStatement id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the transition is allowed" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Commission attempted with no ACTIVE HostAgreement for the station's site" }
  - { id: ERR_ADA_PORT_REQUIRED, http: 409, condition: "Commission attempted without an ADA-accessible port where required" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "RebateClaim approver is the same user who submitted it (four-eyes control)" }
  - { id: ERR_RESERVATION_OVERLAP, http: 409, condition: "Reservation window overlaps an existing CONFIRMED reservation on the same port (half-open [start,end))" }
  - { id: ERR_MAINTENANCE_WINDOW_OVERLAP, http: 409, condition: "Maintenance window falls within MW_BUFFER_MIN minutes of another SCHEDULED/IN_PROGRESS window on the same station" }
  - { id: ERR_INVALID_WINDOW, http: 409, condition: "window_end <= window_start" }
  - { id: ERR_INVALID_PERIOD, http: 409, condition: "period_end <= period_start" }
  - { id: ERR_PORT_OUT_OF_SERVICE, http: 409, condition: "Session/reservation on a port whose operational_status is OUT_OF_SERVICE" }
  - { id: ERR_PORT_NOT_AVAILABLE, http: 409, condition: "Session/reservation on a port whose occupancy_status is not AVAILABLE" }
  - { id: ERR_INSUFFICIENT_PORTS, http: 422, condition: "Commission with total_ports below grant.min_ports" }
  - { id: ERR_ENERGY_INVALID, http: 422, condition: "energy_kwh <= 0 at stop" }
  - { id: ERR_UPTIME_BELOW_THRESHOLD, http: 422, condition: "reported_uptime_pct below grant.min_uptime_pct at submit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program operator; manages sites, agreements, grants, stations, ports, session finalization/void, claims, statements, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /host-sites"
      - "POST /host-agreements"
      - "POST /host-agreements/{id}/propose"
      - "POST /host-agreements/{id}/activate"
      - "POST /host-agreements/{id}/terminate"
      - "POST /grant-programs"
      - "POST /stations"
      - "POST /stations/{id}/commission"
      - "POST /stations/{id}/decommission"
      - "POST /ports"
      - "POST /charging-sessions/{id}/finalize"
      - "POST /charging-sessions/{id}/void"
      - "POST /maintenance-windows"
      - "POST /rebate-claims"
      - "POST /rebate-claims/{id}/submit"
      - "POST /rebate-claims/{id}/audit"
      - "POST /rebate-claims/{id}/approve"
      - "POST /rebate-claims/{id}/reject"
      - "POST /revenue-statements"
      - "POST /revenue-statements/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: HostOperator
    description: "Represents a host/property owner. May counter agreements for their own site and read their site's agreements, stations, grants, and revenue statements."
    identity: "entity_backed:HostSite"
    exclusive_operations:
      - "POST /host-agreements/{id}/counter"
    shared_operations:
      - "GET /host-sites/{id} (own site)"
      - "GET /host-agreements, GET /host-agreements/{id}"
      - "GET /grant-programs/{id}"
      - "GET /stations, GET /stations/{id}, GET /stations/{id}/ports"
      - "GET /revenue-statements, GET /revenue-statements/{id}"

  - name: FieldTechnician
    description: "Field maintenance operator; toggles port service state, runs maintenance windows, and opens/resolves work orders."
    identity: opaque
    exclusive_operations:
      - "POST /ports/{id}/out-of-service"
      - "POST /ports/{id}/in-service"
      - "POST /maintenance-windows/{id}/start"
      - "POST /maintenance-windows/{id}/complete"
      - "POST /work-orders"
      - "POST /work-orders/{id}/resolve"
    shared_operations:
      - "GET /stations/{id}, GET /stations/{id}/ports, GET /ports/{id}"
      - "GET /maintenance-windows, GET /work-orders"

  - name: Driver
    description: "EV driver; starts/stops charging sessions and manages reservations on their own driver_id."
    identity: opaque
    exclusive_operations:
      - "POST /charging-sessions"
      - "POST /charging-sessions/{id}/stop"
      - "POST /reservations"
      - "POST /reservations/{id}/confirm"
      - "POST /reservations/{id}/cancel"
      - "POST /reservations/{id}/check-in"
    shared_operations:
      - "GET /ports/{id}"
      - "GET /charging-sessions/{id}, GET /reservations/{id}"

# Constants referenced above but not tied to a single calculation:
constants:
  MW_BUFFER_MIN: 60   # minutes; maintenance windows on one station must be >= this apart
