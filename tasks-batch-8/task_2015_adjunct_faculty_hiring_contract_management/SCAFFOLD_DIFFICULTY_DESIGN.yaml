            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "POST /adjunct-hr/sections/${section_id}/cancel"
              payload: { cancellation_reason: "LOW_ENROLLMENT" }
              as: DepartmentChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CANCELLATION_POLICY (enrollment 5 is NOT strictly < min_enrollment 5)"
            - "CourseSection.${section_id}.section_status == SCHEDULED (unchanged)"
            - "no contract cascade fired (section has no contracts and none were created as a side effect)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
