          - errors.ERR_STALE_COMPLEX_VERSION
        distinguishing_aspect: "OCC on Complex.version: the first packing run (expected version matching) succeeds and consumes inventory (bumping the version); a second packing run replaying the stale version is rejected 412 ERR_STALE_COMPLEX_VERSION."
        test_recipe:
