          trigger:
            - { call: "POST /api/capas/${capa_id}/verify-effectiveness", payload: { effective: true }, as: QualityManager, as_user_id: "qm-bob", captures: { err_blocked: "$.data.error_id" } }
            - { call: "POST /api/nonconformance-reports/${ncr_id}/close", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/capas/${capa_id}/verify-effectiveness", payload: { effective: true }, as: QualityManager, as_user_id: "qm-bob", captures: { capa_st: "$.data.status" } }
          assert:
            - "verify while source NCR DISPOSITIONED: 409 error_id == ERR_SOURCE_NOT_CLOSED; CAPA stays EFFECTIVENESS_CHECK"
            - "after NCR close: verify succeeds, CAPA status == CLOSED"

