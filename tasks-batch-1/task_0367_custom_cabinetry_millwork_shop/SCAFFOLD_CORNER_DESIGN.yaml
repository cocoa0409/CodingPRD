# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 testable claims
# not already covered by §1.8). Sections/claim_types from claim-extraction-guide.
# All test_recipe chains are structured §1.5 calls; excluded_because stubs cite a
# §1.8 instance by name and carry no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_shop_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Shop, endpoints]
        distinguishing_aspect: "POST /shops with only name -> 201; deposit_pct_bps defaults 3000, retainage_pct_bps 1000, rush_surcharge_bps 1500, max_installs_per_day 2, tax_rate_bps 0, currency USD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shops"
              payload: { name: "Defaults Shop" }
              as: ShopAdmin
              captures: { shop_id: $.data.id, dep: $.data.deposit_pct_bps }
          assert:
            - "Shop.${shop_id}.deposit_pct_bps == 3000"
            - "Shop.${shop_id}.retainage_pct_bps == 1000"
            - "Shop.${shop_id}.rush_surcharge_bps == 1500"
            - "Shop.${shop_id}.max_installs_per_day == 2"
            - "Shop.${shop_id}.tax_rate_bps == 0"
            - "Shop.${shop_id}.currency == USD"
            - "Shop.${shop_id}.version == 1"

      - name: get_project_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /shops/{id}/projects/{id} returns the project with title and DRAFT status and zeroed ledger fields."
        test_recipe:
          setup: ["One DRAFT project."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c1@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "Read me" }
              as: Designer
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: Designer
              captures: { st: $.data.status, ct: $.data.contract_total_cents }
          assert:
            - "Project.${proj_id}.status == DRAFT"
            - "Project.${proj_id}.contract_total_cents == 0"
            - "Project.${proj_id}.margin_policy == STANDARD"

      - name: list_materials_paginated_envelope
        claim_type: Listing
        grounds: [entities.Material, endpoints, response_envelope]
        distinguishing_aspect: "GET /shops/{id}/materials returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["Shop with 2 materials."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M2", sheet_area_mm2: 5796000, sheet_price_cents: 4500 }
              as: ShopManager
          trigger:
            - call: "GET /shops/${shop_id}/materials"
              payload: { limit: 1, offset: 0 }
              as: ShopManager
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Project, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET project with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Shop exists; no such project."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}/projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: create_spec_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.CabinetSpec, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST spec omitting width_mm -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["DRAFT project + material."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c2@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", height_mm: 720, depth_mm: 560, quantity: 4, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 422)"

      - name: create_project_default_margin_policy_standard
        claim_type: Defaults
        grounds: [entities.Project.fields.margin_policy]
        distinguishing_aspect: "POST project omitting margin_policy -> STANDARD default; is_rush -> false."
        test_recipe:
          setup: ["Shop + customer."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c3@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id, mp: $.data.margin_policy }
          assert:
            - "Project.${proj_id}.margin_policy == STANDARD"
            - "Project.${proj_id}.is_rush == false"

      - name: spec_panel_area_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.CabinetSpec.fields.panel_area_mm2, calculations.cut_list_sheets]
        distinguishing_aspect: "panel_area_mm2 is computed = 2*(w*h)+2*(h*d)+(w*d); for 600x720x560 = 2006400, regardless of any client-supplied value."
        test_recipe:
          setup: ["DRAFT project + material."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c4@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 1, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
              captures: { spec_id: $.data.id, pa: $.data.panel_area_mm2 }
          assert:
            - "CabinetSpec.${spec_id}.panel_area_mm2 == 2006400"

      - name: shop_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Shop, response_envelope]
        distinguishing_aspect: "id is a server-minted UUID with no prefix; created_at/updated_at ISO8601; version starts at 1; current_utc null until clock set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shops"
              payload: { name: "Sys" }
              as: ShopAdmin
              captures: { shop_id: $.data.id, ver: $.data.version, cu: $.data.current_utc }
          assert:
            - "Shop.${shop_id}.version == 1"
            - "Shop.${shop_id}.current_utc == null"
            - "Shop.${shop_id}.id matches UUID format with no type prefix"

      - name: create_spec_invalid_enum_finish_rejected
        claim_type: Type Constraints
        grounds: [entities.FinishSelection.fields.finish_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST finish-selection with finish_code not in {RAW,STAIN,PAINT,LACQUER} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["DRAFT project."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c5@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "GLITTER" }
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 422)"

      - name: customer_lifetime_paid_computed_from_paid_draws
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.lifetime_paid_cents, state_machines.Draw.ISSUED_to_PAID]
        distinguishing_aspect: "After paying the deposit draw of 87480, Customer.lifetime_paid_cents == 87480 (sum of PAID draw amount_cents)."
        test_recipe:
          setup: ["Contracted project (tax0 STAIN qty2, contract_total 291600, deposit 87480); deposit issued and paid."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c6@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 2, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "STAIN" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v0: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shops/${shop_id}/projects/${proj_id}/draws"
              payload: {}
              as: ShopManager
              captures: { dep_draw_id: $.data.0.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/issue"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Customer.${cust_id}.lifetime_paid_cents == 87480"
            - "Project.${proj_id}.paid_to_date_cents == 87480"

      - name: spec_add_after_lock_rejected
        claim_type: Type Constraints
        grounds: [entities.CabinetSpec.fields.lock_state, "errors[ERR_SPECS_LOCKED]"]
        distinguishing_aspect: "After CONTRACTED, specs are LOCKED; POST spec -> ERR_SPECS_LOCKED (409)."
        test_recipe:
          setup: ["Contracted project (specs LOCKED)."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c7@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 4, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "PAINT" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v0: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "X", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 1, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SPECS_LOCKED (HTTP 409)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: contract_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Project.QUOTED_to_CONTRACTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Contract attempted on a DRAFT project (never measured/quoted) -> ERR_INVALID_STATE (409); no DEPOSIT draw created."
        test_recipe:
          setup: ["DRAFT project."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c8@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "GET /shops/${shop_id}/projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: new_project_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.Project, entities.Project.fields.status]
        distinguishing_aspect: "A newly created Project has status==DRAFT and version==1."
        test_recipe:
          setup: ["Shop + customer."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c9@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "Project.${proj_id}.status == DRAFT"
            - "Project.${proj_id}.version == 1"

      - name: terminal_cancelled_project_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Project.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED project rejects measure with ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Project DRAFT then CANCELLED."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c10@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 1, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/cancel"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"

      - name: pay_draw_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Draw.ISSUED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an already-PAID draw a second time -> ERR_INVALID_STATE (409); paid_to_date not double-counted."
        test_recipe:
          setup: ["Contracted project; deposit draw issued and paid once."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { full_name: "C", email: "c11@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers/${cust_id}/projects"
              payload: { title: "P", margin_policy: "STANDARD" }
              as: Designer
              captures: { proj_id: $.data.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/specs"
              payload: { label: "B", width_mm: 600, height_mm: 720, depth_mm: 560, quantity: 2, base_unit_price_cents: 100000, material_id: "${mat_id}" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/finish-selections"
              payload: { finish_code: "STAIN" }
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/measure"
              payload: {}
              as: Designer
            - call: "POST /shops/${shop_id}/projects/${proj_id}/quote"
              payload: {}
              as: Designer
              captures: { proj_v0: $.data.version }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/contract"
              payload: { expected_project_version: "${proj_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shops/${shop_id}/projects/${proj_id}/draws"
              payload: {}
              as: ShopManager
              captures: { dep_draw_id: $.data.0.id }
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /shops/${shop_id}/projects/${proj_id}/draws/${dep_draw_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (HTTP 409)"
            - "Project.${proj_id}.paid_to_date_cents == 87480 (not doubled)"

      - name: install_complete_with_major_punch_open_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Installation.PUNCH_PENDING_to_COMPLETE, "errors[ERR_MAJOR_PUNCH_OPEN]"]
        distinguishing_aspect: "Installation complete with an OPEN MAJOR PunchItem -> ERR_MAJOR_PUNCH_OPEN (409); project stays READY_FOR_DELIVERY."
        test_recipe:
          setup: ["Project READY_FOR_DELIVERY; installation PUNCH_PENDING with one OPEN MAJOR punch item."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S", tax_rate_bps: 0, deposit_pct_bps: 3000, max_installs_per_day: 2 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/materials"
              payload: { sku: "M1", sheet_area_mm2: 5796000, sheet_price_cents: 4000 }
              as: ShopManager
              captures: { mat_id: $.data.id }
            - call: "POST /shops/${shop_id}/machines"
              payload: { name: "CNC", changeover_buffer_min: 0 }
