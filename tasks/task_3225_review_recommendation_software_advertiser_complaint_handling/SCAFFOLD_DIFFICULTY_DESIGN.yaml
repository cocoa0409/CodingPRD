            - call: "POST /platform/page-claims/${clp_id}/verify"
              payload: { verification_code: "${clp_code}" }
              as: BusinessOwner
              as_user_id: "${po_id}"
            - call: "POST /platform/page-claims/${clp_id}/approve"
              payload: { expected_page_version: "${pp_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${pp_id}/close"
              payload: {}
              as: SupportAdmin
          trigger:
