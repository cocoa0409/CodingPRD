            - { call: "POST /class-sessions/${ss}/publish", payload: {}, as: ProgramCoordinator, captures: { ss_v: $.data.version } }
            - { call: "POST /households", payload: { account_name: "H1" }, as: HouseholdManager, captures: { h1: $.data.id } }
            - { call: "POST /participants", payload: { household_id: "${h1}", full_name: "Helm H", birth_date: "1990-01-01T00:00:00Z" }, as: HouseholdManager, as_user_id: "${h1}", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${p1}", expected_class_session_version: "${ss_v}" }, as: HouseholdManager, as_user_id: "${h1}", captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payment", payload: { amount_cents: 12000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${h1}" }
            - { call: "POST /registrations/${r1}/drop", payload: {}, as: HouseholdManager, as_user_id: "${h1}" }
            - { call: "GET /payments", payload: { registration_id: "${r1}" }, as: FinanceOfficer, captures: { ref_id: "$.data[1].id", ref_ty: "$.data[1].type", ref_st: "$.data[1].status" } }
            - { call: "GET /households/${h1}", as: FinanceOfficer, captures: { h1_cr0: $.data.account_credit_cents } }
          trigger:
            - { call: "POST /payments/${ref_id}/approve-refund", payload: {}, as: FrontDeskStaff, captures: { err: $.data.error_id } }
            - { call: "POST /payments/${ref_id}/approve-refund", payload: {}, as: FinanceOfficer, captures: { pay_st: $.data.status } }
            - { call: "GET /households/${h1}", as: FinanceOfficer, captures: { h1_cr1: $.data.account_credit_cents } }
            - { call: "GET /registrations/${r1}", as: FinanceOfficer, captures: { r1_pay: $.data.payment_status, r1_ref: $.data.refund_total_cents } }
          assert:
            - "Refund transaction is the second ledger entry: type == REFUND, status == PENDING before approval (12000 >= threshold)"
