  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: contractor_committed_crew_hours_restored_on_order_cancel
        conserved_quantity: "Contractor.committed_crew_hours"
        grounds:
          - state_machines.AbatementOrder.AWARDED_to_CANCELLED
          - state_machines.ViolationNotice.ABATEMENT_AUTHORIZED_to_OVERDUE
          - entities.Contractor.fields.committed_crew_hours
          - entities.Contractor.fields.completed_crew_hours
          - entities.Parcel.fields.compliance_status
          - endpoints."POST /fire-district/abatement-orders/{order_id}/cancel"
        distinguishing_aspect: |
          The conserved quantity is a crew-hour reservation on Contractor, and the compensating
          action must undo THREE side effects at once and only those three: release
          committed_crew_hours back to its pre-award value, walk the ViolationNotice back from
          ABATEMENT_AUTHORIZED to OVERDUE (not to CLEARED), and restore Parcel.compliance_status
          to NON_COMPLIANT (not to COMPLIANT). completed_crew_hours must stay untouched, since
          no work was ever verified. A second award-then-cancel round trip must land on exactly
          the same numbers, proving no drift. The sibling instance conserves money on a
          different entity.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
            - "Contractor c1 with hourly_rate_cents 8600 and mobilization_fee_cents 32000, no prior orders."
            - "Parcel p1 fails an INITIAL inspection at clock 2026-08-22; at clock 2026-10-01 the cycle advance drives the notice OVERDUE."
            - "Abatement is authorized for 200000 and awarded to c1 for 12.5 crew hours over 2026-10-05T08:00:00Z-18:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10, invoice_due_days: 45 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/contractors"
              payload: { business_name: "Ridgeline Fuels LLC", hourly_rate_cents: 8600, mobilization_fee_cents: 32000, license_status: "ACTIVE", insurance_expiry_utc: "2027-06-30T00:00:00Z", max_daily_orders: 2 }
              as: ProgramAdmin
              captures: { c1: "$.data.id", committed_initial: "$.data.committed_crew_hours" }
            - call: "POST /fire-district/parcels"
