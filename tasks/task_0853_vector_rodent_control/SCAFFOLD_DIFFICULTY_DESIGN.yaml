              payload: { abatement_order_id: "${order_id}", expected_abatement_order_version: "${order_v}" }
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { inv_id: $.data.id, est_total: $.data.estimated_total_cents }
            - call: "POST /vector-control/cost-recovery-invoices/${inv_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { fin_total: $.data.final_total_cents }
          assert:
            - "CostRecoveryInvoice.${inv_id}.estimated_total_cents == 123257"
            - "CostRecoveryInvoice.${inv_id}.final_total_cents == 86807"
            - "CostRecoveryInvoice.${inv_id}.estimated_total_cents != CostRecoveryInvoice.${inv_id}.final_total_cents"
            - "CostRecoveryInvoice.${inv_id}.balance_due_cents == 86807"
            - "CostRecoveryInvoice.${inv_id}.billing_status == APPROVED"
            - "PropertyOwner.${owner_id}.outstanding_balance_cents == 86807"

  - rule_id: combinatorial_formula
    instances:
      - name: zone_rodent_index_three_component_nonlinear_blend
        grounds:
          - calculations.zone_rodent_index
          - endpoints[POST /vector-control/bait-stations/{id}/readings]
          - endpoints[GET /vector-control/zones/{id}/surveillance-summary]
          - state_machines.Zone.NORMAL_to_HOTSPOT
        distinguishing_aspect: |
          Mode (a): a four-input formula whose components interact non-linearly - bait take is
          a plain mean, the sign component is a scaled mean clamped by min(100, 12.5 * mean),
          the complaint component is a clamped count scale, and the three are blended with
          0.50/0.30/0.20 weights, so 87 percent take with 6 signs and one open complaint lands
          on exactly 70.00 and drives posture into HOTSPOT.
        test_recipe:
          setup:
            - "Zone Riverside contains parcel APN-1001 with one ACTIVE bait station and exactly one open complaint created inside the 30-day window"
            - "No reading has yet been recorded, so rodent_index is 4.00 and posture is NORMAL"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI", unit_count: 6 }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "RODENT_SIGHTING", reporter_type: "RESIDENT", description: "Rats crossing the sidewalk at dusk", reported_severity: "ROUTINE" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/bait-stations"
              payload: { property_id: "${prop_id}", station_code: "BS-01", bait_type: "BAIT_BLOCK" }
              as: Inspector
              as_user_id: "${insp1_id}"
              captures: { station_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /vector-control/bait-stations/${station_id}/readings"
              payload: { take_pct: 87, activity_sign_count: 6, station_condition: "INTACT", rebaited: true }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "GET /vector-control/zones/${zone_id}/surveillance-summary"
              as: ProgramAdmin
              captures: { idx: $.data.rodent_index, post: $.data.posture }
          assert:
            - "surveillance-summary.bait_component == 87.00"
            - "surveillance-summary.sign_component == 75.00"
            - "surveillance-summary.complaint_component == 20.00"
            - "surveillance-summary.rodent_index == 70.00"
            - "surveillance-summary.posture == HOTSPOT"
            - "surveillance-summary.in_window_reading_count == 1 and eligible_station_count == 1"
            - "Zone.${zone_id}.rodent_index == 70.00 and Zone.${zone_id}.posture == HOTSPOT"

      - name: invoice_line_rounding_order_pinned_per_line
        grounds:
          - calculations.cost_recovery_invoice_total
          - entities.CostRecoveryInvoice.fields.labor_line_cents
          - entities.CostRecoveryInvoice.fields.penalty_line_cents
          - entities.CostRecoveryInvoice.fields.education_credit_cents
          - entities.CostRecoveryInvoice.fields.admin_fee_cents
          - endpoints[POST /vector-control/cost-recovery-invoices/{id}/approve]
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-line-then-sum. 5.5 hours at 8525 cents rounds
          46887.5 up to 46888 before the subtotal is formed, and the penalty (16409.5 -> 16410),
          education credit (6563.8 -> 6564) and admin fee (11322.6 -> 11323) are each rounded
          before entering the next step, producing 86807; summing the unrounded products and
          rounding once at the end produces 86806, which is the wrong answer.
        test_recipe:
          setup:
            - "Identical to instance invoice_estimate_vs_final_total: a SEVERE-tier order at escalation_level 1 with an education advisory served, city-abated with 5.5 hours and 18750 cents of materials, invoice prepared in DRAFT"
