# =============================================================================
# PRD Benchmark Scaffold — Task 1947: Seed Library & Plant Swap Program
# =============================================================================

scenario: |
  1947. Seed Library & Plant Swap Program (public library seed library): seed
  inventory by variety/year & germination viability, borrowing/return protocol &
  seed saving education, packet labeling & lot tracking, swap event scheduling &
  item intake rules, invasive species screening & regional appropriateness,
  volunteer packing sessions, partnership with library/garden sites,
  participation & return-rate metrics

domain_name: seed-library-plant-swap
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation        # finite seed stock, packet allocation, borrow caps, session capacity
  secondary_archetype: compliance / audit      # invasive-species screening, germination certification, SoD
  complexity_layers:
    - optimistic_concurrency                   # OCC on SeedVariety.version and SwapEvent.version
    - cascading_side_effects                   # certify-fail recall cascade; event-cancel credit revocation
    - dual_variant_calculation                 # germination viability; member return-rate
    - rate_threshold_triggers                  # viability >= 70.00; tier boundaries; suspension at 3 overdue
    - derived_field_reconciliation             # member counters, lot seed buckets, credit ledger totals
    - ops_run_checkpoint                       # POST /api/ops/run-daily-sweep advances overdue/suspension epoch
  entity_topology: flat                        # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: branching               # cycles (lot recheck, return dispute) + fork branches (certify PASS/FAIL)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties            # Volunteer records germination; ProgramAdmin certifies; Member borrows
  consistency_model: immediate                 # all side effects atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the library branch or partner garden site.
      - name: site_type
        type: enum
        source: input
        description: Kind of partner site.
        constraints: "one of {LIBRARY_BRANCH, GARDEN}"
      - name: region_zone
        type: string
        source: input
        description: Hardiness/region zone code (e.g. "ZONE_5A") used for regional-appropriateness screening.
      - name: label_stock_count
        type: integer
        source: input
        description: Physical seed-packet label stock held at this site; decremented by pack operations on lots homed here.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Lifecycle status of the site.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique member email.
        constraints: "unique across all members"
      - name: full_name
        type: string
        source: input
        description: Member full name.
      - name: home_site_id
        type: string
        source: input
        description: FK -> Site.id; the member's home branch, whose region_zone gates variety appropriateness at checkout.
      - name: status
        type: enum
        source: system
        description: Membership standing status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: active_checkout_count
        type: integer
        source: computed
        description: Count of this member's Checkouts with status in {ACTIVE, OVERDUE, RETURNED, DISPUTED} (non-terminal).
        default: 0
      - name: overdue_checkout_count
        type: integer
        source: computed
        description: Count of this member's Checkouts with status == OVERDUE.
        default: 0
      - name: terminal_checkout_count
        type: integer
        source: computed
        description: Count of this member's Checkouts with status in {VERIFIED, WRITTEN_OFF}.
        default: 0
      - name: verified_return_count
        type: integer
        source: computed
        description: Count of this member's Checkouts with status == VERIFIED.
        default: 0
      - name: simple_return_rate
        type: number
        source: computed
        description: verified_return_count / terminal_checkout_count; 4 decimal places round_half_up; 0.0 when terminal_checkout_count == 0.
        default: 0.0
      - name: decay_weighted_return_score
        type: number
        source: computed
        description: Recency-decayed return score per calculations.member_return_rate variant DECAY_WEIGHTED; 4 decimal places round_half_up.
        default: 0.0
      - name: standing_tier
        type: enum
        source: computed
        description: Derived from simple_return_rate per calculations.member_effective_borrow_limit.
        default: STANDARD
        constraints: "one of {PROBATION, STANDARD, TRUSTED}"
      - name: effective_borrow_limit
        type: integer
        source: computed
        description: Max non-terminal checkouts allowed; derived from standing_tier.
        default: 5
      - name: credits_earned_total
        type: integer
        source: computed
        description: Sum of CreditEntry rows of type EARNED for this member.
        default: 0
      - name: credits_redeemed_total
        type: integer
        source: computed
        description: Sum of CreditEntry rows of type REDEEMED for this member.
        default: 0
      - name: credits_expired_total
        type: integer
        source: computed
        description: Sum of CreditEntry rows of type EXPIRED for this member.
        default: 0
      - name: credits_revoked_total
        type: integer
        source: computed
        description: Sum of CreditEntry rows of type REVOKED for this member.
        default: 0
      - name: credits_balance
        type: integer
        source: computed
        description: credits_earned_total - credits_redeemed_total - credits_expired_total - credits_revoked_total.
        default: 0

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique volunteer email.
        constraints: "unique across all volunteers"
      - name: full_name
        type: string
        source: input
        description: Volunteer full name.
      - name: status
        type: enum
        source: system
        description: Volunteer onboarding status; only ACTIVE volunteers may record tests, pack, or sign up for sessions.
        default: APPLIED
        constraints: "one of {APPLIED, ACTIVE, INACTIVE}"

  - name: SeedVariety
    parent: null
    common_fields: true
    fields:
      - name: variety_name
        type: string
        source: input
        description: Cultivar name, e.g. "Brandywine".
      - name: species
        type: string
        source: input
        description: Species name, e.g. "Solanum lycopersicum".
      - name: category
        type: enum
        source: input
        description: Broad plant category.
        constraints: "one of {VEGETABLE, HERB, FLOWER, NATIVE}"
      - name: invasive_flag
        type: boolean
        source: input
        description: True when the species appears on the regional invasive-species list; blocks checkout and swap intake.
        default: false
      - name: rarity_flag
        type: boolean
        source: input
        description: True for rare/heirloom varieties; adds rarity bonus to swap credit valuation.
        default: false
      - name: approved_zones
        type: array
        source: input
        description: Array of region_zone strings where this variety is regionally appropriate.
        constraints: "non-empty array of zone strings"
      - name: status
        type: enum
        source: system
        description: Catalog status; RETIRED varieties block new lots, checkouts, and intake items.
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: SeedLot
    parent: null
    common_fields: true
    fields:
      - name: variety_id
        type: string
        source: input
        description: FK -> SeedVariety.id; the catalog variety this lot belongs to.
      - name: home_site_id
        type: string
        source: input
        description: FK -> Site.id; site holding the physical lot; its label_stock_count is debited by packing.
      - name: lot_code
        type: string
        source: input
        description: Supplier/donor lot code for packet labeling and lot tracking.
        constraints: "unique per (variety_id, harvest_year)"
      - name: harvest_year
        type: integer
        source: input
        description: Harvest year of the seed lot.
        constraints: ">= 2000 and <= 2100"
      - name: seeds_received
        type: integer
        source: input
        description: Total seeds physically received into the lot; the conserved quantity of the seed-count invariant.
        constraints: ">= 1"
      - name: provisional_viability_pct
        type: number
        source: input
        description: Declared viability percentage at intake (vendor/donor declaration), 0.00–100.00 with 2dp.
        constraints: ">= 0.00 and <= 100.00"
      - name: status
        type: enum
        source: system
        description: Lot lifecycle status.
        default: DRAFT
        constraints: "one of {DRAFT, QUARANTINE, ACTIVE, DEPLETED, REJECTED, RETIRED}"
      - name: final_viability_pct
        type: number
        source: computed
        description: Viability percentage from the most recent CERTIFIED GerminationTest (by certified order); null until one exists.
        default: null
      - name: seeds_remaining
        type: integer
        source: system
        description: "Loose seeds not yet packed or discarded. Invariant: seeds_received == seeds_remaining + seeds_in_packets + seeds_discarded."
        default: 0
      - name: seeds_in_packets
        type: integer
        source: system
        description: Seeds currently bound in non-terminal packets (status in {AVAILABLE, CHECKED_OUT, RETURNED}).
        default: 0
      - name: seeds_discarded
        type: integer
        source: system
        description: Seeds destroyed (voided with mode DISCARD, recalled-packet disposal, or recalled-return verification).
        default: 0
      - name: packets_created_total
        type: integer
        source: system
        description: Lifetime count of packets created from this lot; capped at LOT_MAX_PACKETS (200).
        default: 0
      - name: viable_seed_count
        type: integer
        source: computed
        description: floor(seeds_remaining * effective_viability_pct / 100); effective viability is final_viability_pct when a CERTIFIED test exists, else provisional_viability_pct.
        default: 0

  - name: GerminationTest
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: FK -> SeedLot.id; the lot under test. Test may only be recorded while lot status == QUARANTINE.
      - name: recorded_by_volunteer_id
        type: string
        source: system
        description: "FK -> Volunteer.id; taken from X-User-ID of the recording Volunteer (segregation of duties: certifier is always a different role)."
      - name: seeds_tested
        type: integer
        source: input
        description: Number of seeds placed in the germination assay.
        constraints: ">= 1"
      - name: sprouted_count
        type: integer
        source: input
        description: Number of seeds that sprouted.
        constraints: ">= 0 and <= seeds_tested"
      - name: result_pct
        type: number
        source: computed
        description: round_half_up(sprouted_count / seeds_tested * 100, 2).
      - name: status
        type: enum
        source: system
        description: Test lifecycle; CERTIFIED and VOIDED are terminal.
        default: RECORDED
        constraints: "one of {RECORDED, CERTIFIED, VOIDED}"

  - name: SeedPacket
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: system
        description: FK -> SeedLot.id; set at pack time.
      - name: packet_code
        type: string
        source: system
        description: Human label code "<lot_code>-<harvest_year>-<seq 3-digit>"; seq is per-lot creation order starting at 001.
      - name: seeds_count
        type: integer
        source: system
        description: Seeds sealed in this packet (seeds_per_packet of the pack request).
      - name: status
        type: enum
        source: system
        description: Packet lifecycle.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, CHECKED_OUT, RETURNED, RECALLED, VOIDED, DISCARDED}"

  - name: Checkout
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; borrower. For role Member, must equal X-User-ID.
      - name: packet_id
        type: string
        source: input
        description: FK -> SeedPacket.id; packet being borrowed; must be AVAILABLE.
      - name: checked_out_at
        type: datetime
        source: system
        description: Logical-clock timestamp at creation.
      - name: due_at
        type: datetime
        source: system
        description: checked_out_at + LOAN_DAYS (21) days.
      - name: returned_at
        type: datetime
        source: system
        description: Logical-clock timestamp when return recorded; null until returned.
        default: null
      - name: recall_required
        type: boolean
        source: system
        description: Set true by the certify-FAIL recall cascade when this checkout holds a recalled packet.
        default: false
      - name: status
        type: enum
        source: system
        description: Checkout lifecycle; VERIFIED and WRITTEN_OFF are terminal.
        default: ACTIVE
        constraints: "one of {ACTIVE, OVERDUE, RETURNED, DISPUTED, VERIFIED, WRITTEN_OFF}"

  - name: SwapEvent
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; hosting site. Buffered-interval overlap rule applies per site.
      - name: title
        type: string
        source: input
        description: Event title.
      - name: start_at
        type: datetime
        source: input
        description: Event start (ISO8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Event end (ISO8601 UTC); must be strictly after start_at.
      - name: status
        type: enum
        source: system
        description: Event lifecycle; COMPLETED and CANCELLED are terminal.
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, INTAKE_OPEN, INTAKE_CLOSED, COMPLETED, CANCELLED}"

  - name: SwapIntakeItem
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SwapEvent.id; the swap event receiving this item (via path).
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the member bringing the item. For role Member, must equal X-User-ID.
      - name: variety_id
        type: string
        source: input
        description: FK -> SeedVariety.id; species/variety of the item, screened for invasive flag and zone appropriateness.
      - name: item_type
        type: enum
        source: input
        description: Physical form of the contribution.
        constraints: "one of {SEED_PACKET, PLANT_START, CUTTING}"
      - name: condition
        type: enum
        source: input
        description: Assessed condition at intake.
        constraints: "one of {EXCELLENT, GOOD, FAIR}"
      - name: credit_value
        type: integer
        source: computed
        description: Per-item swap credit value per calculations.swap_credit_valuation (per-item rounding pinned).
      - name: status
        type: enum
        source: system
        description: Intake item lifecycle; REJECTED, WITHDRAWN, RETURNED_TO_OWNER, SWAPPED are terminal.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED, WITHDRAWN, RETURNED_TO_OWNER, SWAPPED}"

  - name: CreditEntry
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; member whose ledger this entry hits.
      - name: event_id
        type: string
        source: system
        description: FK -> SwapEvent.id; event scope of this credit movement (redemption/expiry are event-scoped).
      - name: entry_type
        type: enum
        source: system
        description: Ledger movement kind.
        constraints: "one of {EARNED, REDEEMED, EXPIRED, REVOKED}"
      - name: credits
        type: integer
        source: system
        description: Positive credit amount of the movement.
        constraints: ">= 1"
      - name: note
        type: string
        source: system
        description: System-generated provenance note (e.g. intake item id, event completion, event cancellation).
        default: ""

  - name: PackingSession
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; where the packing session is held. Half-open overlap rule applies per site.
      - name: title
        type: string
        source: input
        description: Session title.
      - name: start_at
        type: datetime
        source: input
        description: Session start (ISO8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Session end (ISO8601 UTC); must be strictly after start_at.
      - name: capacity
        type: integer
        source: input
        description: Max volunteers with a live assignment (status in {SIGNUP, ATTENDED}).
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Session lifecycle; COMPLETED and CANCELLED are terminal.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"

  - name: PackingAssignment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK -> PackingSession.id; the session joined (via path).
      - name: volunteer_id
        type: string
        source: input
        description: FK -> Volunteer.id; the signing-up volunteer. For role Volunteer, must equal X-User-ID.
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle; ATTENDED, NO_SHOW, CANCELLED are terminal.
        default: SIGNUP
        constraints: "one of {SIGNUP, ATTENDED, NO_SHOW, CANCELLED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /api/sites/{id} with status=INACTIVE"
        actor: ProgramAdmin
        preconditions: ["site has no SwapEvent with status in {DRAFT, SCHEDULED, INTAKE_OPEN, INTAKE_CLOSED}"]
        side_effects: ["site.version += 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /api/sites/{id} with status=ACTIVE"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["site.version += 1"]

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/ops/run-daily-sweep (auto)"
        actor: system
        preconditions: ["member.overdue_checkout_count >= OVERDUE_SUSPENSION_THRESHOLD (3) after the overdue flip pass"]
        side_effects: ["member.status := SUSPENDED", "member.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/checkouts/{id}/verify-return or POST /api/checkouts/{id}/resolve-dispute (auto-reinstate)"
        actor: system
        preconditions: ["member.overdue_checkout_count <= 2 after this transition's counter updates"]
        side_effects: ["member.status := ACTIVE", "member.version += 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /api/members/{id} with status=CLOSED"
        actor: ProgramAdmin
        preconditions: ["member.active_checkout_count == 0", "member.credits_balance == 0"]
        side_effects: ["member.version += 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "PATCH /api/members/{id} with status=CLOSED"
        actor: ProgramAdmin
        preconditions: ["member.active_checkout_count == 0", "member.credits_balance == 0"]
        side_effects: ["member.version += 1"]

  - entity: Volunteer
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /api/volunteers/{id}/approve"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["volunteer.version += 1"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /api/volunteers/{id} with status=INACTIVE"
        actor: ProgramAdmin
        preconditions: ["volunteer has no PackingAssignment with status == SIGNUP"]
        side_effects: ["volunteer.version += 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /api/volunteers/{id} with status=ACTIVE"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["volunteer.version += 1"]

  - entity: SeedLot
    initial_state: DRAFT
    terminal_states: [DEPLETED, REJECTED, RETIRED]
    transitions:
      - from: DRAFT
        to: QUARANTINE
        trigger: "POST /api/seed-lots/{id}/submit-for-review"
        actor: ProgramAdmin
        preconditions: ["lot.seeds_remaining > 0"]
        side_effects: ["lot.version += 1"]
      - from: QUARANTINE
        to: ACTIVE
        trigger: "POST /api/germination-tests/{testId}/certify with outcome=PASS"
        actor: ProgramAdmin
        preconditions: ["test.status == RECORDED", "test.result_pct >= VIABILITY_PASS_PCT (70.00)", "test.lot_id == lot.id"]
        side_effects:
          - "lot.final_viability_pct := test.result_pct"
          - "lot.viable_seed_count := floor(lot.seeds_remaining * test.result_pct / 100)"
          - "lot.version += 1"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /api/germination-tests/{testId}/certify with outcome=FAIL while lot has never been ACTIVE"
        actor: ProgramAdmin
        preconditions: ["test.status == RECORDED", "test.result_pct < VIABILITY_PASS_PCT (70.00)", "test.lot_id == lot.id", "lot.packets_created_total == 0"]
        side_effects: ["lot.version += 1"]
      - from: ACTIVE
        to: QUARANTINE
        trigger: "POST /api/seed-lots/{id}/recheck (scheduled re-test loop)"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["lot.version += 1"]
      - from: ACTIVE
        to: QUARANTINE
        trigger: "POST /api/germination-tests/{testId}/certify with outcome=FAIL after a recheck cycle"
        actor: ProgramAdmin
        preconditions: ["test.status == RECORDED", "test.result_pct < VIABILITY_PASS_PCT (70.00)", "test.lot_id == lot.id", "lot.packets_created_total > 0"]
        side_effects:
          - "RECALL CASCADE hop 1: every SeedPacket of this lot with status in {AVAILABLE, CHECKED_OUT, RETURNED} -> RECALLED; each recalled packet's version += 1"
          - "RECALL CASCADE hop 2 (caused by each packet's -> RECALLED): every Checkout with packet_id of a recalled packet and status in {ACTIVE, OVERDUE} gets recall_required := true; each such checkout's version += 1"
          - "RECALL CASCADE hop 3 (caused by hop 2 flagging): member of each flagged checkout is counted in the sweep that may suspend (member.status recomputed at next sweep only; no immediate member mutation)"
          - "lot.version += 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /api/seed-lots/{id} with status=RETIRED"
        actor: ProgramAdmin
        preconditions: ["no SeedPacket of this lot has status == CHECKED_OUT"]
        side_effects: ["all packets of this lot with status == AVAILABLE become DISCARDED and their seeds move seeds_in_packets -> seeds_discarded", "lot.version += 1"]
      - from: ACTIVE
        to: DEPLETED
        trigger: "system auto-transition evaluated after every pack or packet-void mutation on this lot"
        actor: system
        preconditions: ["lot.seeds_remaining == 0", "no SeedPacket of this lot has status == AVAILABLE", "lot.status == ACTIVE"]
        side_effects: ["lot.version += 1"]

  - entity: GerminationTest
    initial_state: RECORDED
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: RECORDED
        to: CERTIFIED
        trigger: "POST /api/germination-tests/{id}/certify"
        actor: ProgramAdmin
        preconditions:
          - "outcome == PASS requires result_pct >= 70.00; outcome == FAIL requires result_pct < 70.00 (else ERR_VIABILITY_OUTCOME_MISMATCH)"
          - "segregation of duties: recording role (Volunteer) cannot certify; certification is ProgramAdmin-exclusive"
        side_effects:
          - "test.status := CERTIFIED; test.version += 1"
          - "on outcome PASS with lot in QUARANTINE: lot -> ACTIVE (see SeedLot machine)"
          - "on outcome FAIL with lot never ACTIVE (packets_created_total == 0): lot -> REJECTED"
          - "on outcome FAIL with lot packets_created_total > 0 (post-recheck): lot -> QUARANTINE + recall cascade (see SeedLot machine)"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/germination-tests/{id}/void"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["test.version += 1"]

  - entity: SeedPacket
    initial_state: AVAILABLE
    terminal_states: [VOIDED, DISCARDED]
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "POST /api/checkouts with packet_id"
        actor: Member | ProgramAdmin
        preconditions: ["packet.status == AVAILABLE", "packet.lot.status == ACTIVE"]
        side_effects: ["packet.version += 1"]
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /api/checkouts/{id}/return"
        actor: Member | ProgramAdmin
        preconditions: ["checkout.status in {ACTIVE, OVERDUE}", "checkout.packet_id == packet.id"]
        side_effects: ["packet.version += 1"]
      - from: RETURNED
        to: AVAILABLE
        trigger: "POST /api/checkouts/{id}/verify-return when packet is not recalled and lot is ACTIVE"
        actor: ProgramAdmin
        preconditions: ["packet.status == RETURNED", "packet.lot.status == ACTIVE", "packet was not flipped RECALLED (status check covers)"]
        side_effects: ["packet.version += 1"]
      - from: RETURNED
        to: DISCARDED
        trigger: "POST /api/checkouts/{id}/verify-return when packet.lot.status != ACTIVE"
        actor: ProgramAdmin
        preconditions: ["packet.status == RETURNED", "packet.lot.status != ACTIVE"]
        side_effects: ["packet.seeds_count moved lot.seeds_in_packets -> lot.seeds_discarded", "packet.version += 1", "lot.version += 1"]
      - from: AVAILABLE
        to: RECALLED
        trigger: "SeedLot certify-FAIL recall cascade"
        actor: system
        preconditions: ["packet.lot recall triggered"]
        side_effects: ["packet.version += 1"]
      - from: CHECKED_OUT
        to: RECALLED
        trigger: "SeedLot certify-FAIL recall cascade"
        actor: system
        preconditions: ["packet.lot recall triggered"]
        side_effects: ["hosting Checkout (status in {ACTIVE, OVERDUE}) gets recall_required := true", "packet.version += 1"]
      - from: RETURNED
        to: RECALLED
        trigger: "SeedLot certify-FAIL recall cascade"
        actor: system
        preconditions: ["packet.lot recall triggered"]
        side_effects: ["packet.version += 1"]
      - from: RECALLED
        to: DISCARDED
        trigger: "POST /api/seed-packets/{id}/dispose"
        actor: ProgramAdmin
        preconditions: ["packet.status == RECALLED", "no Checkout with packet_id == packet.id has status in {ACTIVE, OVERDUE, RETURNED, DISPUTED}"]
        side_effects: ["packet.seeds_count moved lot.seeds_in_packets -> lot.seeds_discarded", "packet.version += 1", "lot.version += 1"]
      - from: AVAILABLE
        to: VOIDED
        trigger: "POST /api/seed-packets/{id}/void"
        actor: ProgramAdmin
        preconditions: ["packet.status == AVAILABLE"]
        side_effects:
          - "mode REINTEGRATE: packet.seeds_count moved lot.seeds_in_packets -> lot.seeds_remaining"
          - "mode DISCARD: packet.seeds_count moved lot.seeds_in_packets -> lot.seeds_discarded"
          - "packet.version += 1; lot.version += 1; lot DEPLETED auto-check runs"

  - entity: Checkout
    initial_state: ACTIVE
    terminal_states: [VERIFIED, WRITTEN_OFF]
    transitions:
      - from: ACTIVE
        to: OVERDUE
        trigger: "POST /api/ops/run-daily-sweep"
        actor: system
        preconditions: ["checkout.due_at < current logical clock time (strict: due_at == now stays ACTIVE)"]
        side_effects:
          - "member.overdue_checkout_count += 1; member counters recomputed"
          - "if member.overdue_checkout_count >= 3 after increment: member.status := SUSPENDED"
          - "checkout.version += 1; member.version += 1"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /api/checkouts/{id}/return"
        actor: Member | ProgramAdmin
        preconditions: ["actor Member must own checkout (checkout.member_id == X-User-ID)"]
        side_effects: ["checkout.returned_at := now", "packet CHECKED_OUT -> RETURNED", "checkout.version += 1; packet.version += 1"]
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /api/checkouts/{id}/return"
        actor: Member | ProgramAdmin
        preconditions: ["actor Member must own checkout"]
        side_effects: ["checkout.returned_at := now", "packet CHECKED_OUT -> RETURNED", "checkout.version += 1; packet.version += 1"]
      - from: RETURNED
        to: VERIFIED
        trigger: "POST /api/checkouts/{id}/verify-return"
        actor: ProgramAdmin
        preconditions: ["checkout.status == RETURNED"]
        side_effects:
          - "packet RETURNED -> AVAILABLE if lot ACTIVE else RETURNED -> DISCARDED (seed buckets move)"
          - "member counters recomputed (terminal_checkout_count += 1, verified_return_count += 1, overdue_checkout_count -= 1 if it was overdue-flipped)"
          - "member simple_return_rate / decay_weighted_return_score / standing_tier / effective_borrow_limit recomputed"
          - "auto-reinstate: if member SUSPENDED and overdue_checkout_count <= 2 -> member ACTIVE"
          - "checkout.version += 1; packet.version += 1; member.version += 1"
      - from: RETURNED
        to: DISPUTED
        trigger: "POST /api/checkouts/{id}/dispute"
        actor: ProgramAdmin
        preconditions: ["checkout.status == RETURNED"]
        side_effects: ["checkout.version += 1"]
      - from: OVERDUE
        to: DISPUTED
        trigger: "POST /api/checkouts/{id}/dispute"
        actor: Member | ProgramAdmin
        preconditions: ["checkout.status == OVERDUE", "actor Member must own checkout"]
        side_effects: ["checkout.version += 1"]
      - from: DISPUTED
        to: RETURNED
        trigger: "POST /api/checkouts/{id}/resolve-dispute with outcome=RETURN_ACCEPTED (dispute loop back)"
        actor: ProgramAdmin
        preconditions: ["checkout.status == DISPUTED"]
        side_effects: ["checkout.version += 1"]
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /api/checkouts/{id}/resolve-dispute with outcome=WRITE_OFF"
        actor: ProgramAdmin
        preconditions: ["checkout.status == DISPUTED"]
        side_effects:
          - "packet (CHECKED_OUT or RETURNED) -> DISCARDED; packet.seeds_count moved lot.seeds_in_packets -> lot.seeds_discarded"
          - "member counters recomputed (terminal_checkout_count += 1, overdue_checkout_count -= 1 if it was overdue-flipped)"
          - "member rates/tier recomputed; auto-reinstate if SUSPENDED and overdue_checkout_count <= 2"
          - "checkout.version += 1; packet.version += 1; member.version += 1; lot.version += 1"

  - entity: SwapEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/swap-events/{id}/publish"
        actor: ProgramAdmin
        preconditions: ["buffered-interval overlap check passes for the event's site"]
        side_effects: ["event.version += 1"]
      - from: SCHEDULED
        to: INTAKE_OPEN
        trigger: "POST /api/swap-events/{id}/open-intake"
        actor: ProgramAdmin
        preconditions: ["site.status == ACTIVE"]
        side_effects: ["event.version += 1"]
      - from: INTAKE_OPEN
        to: INTAKE_CLOSED
        trigger: "POST /api/swap-events/{id}/close-intake"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["all SwapIntakeItems of this event with status == SUBMITTED become REJECTED (unscreened leftovers)", "event.version += 1"]
      - from: INTAKE_CLOSED
        to: COMPLETED
        trigger: "POST /api/swap-events/{id}/complete"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "all SwapIntakeItems of this event with status == ACCEPTED become SWAPPED"
          - "CREDIT EXPIRY: for each member with EARNED entries scoped to this event: expired_inc = max(0, earned_at_event - redeemed_at_event); if expired_inc > 0 append CreditEntry{EXPIRED, expired_inc}; member credit totals recomputed"
          - "event.version += 1; affected members' version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/swap-events/{id}/cancel"
        actor: ProgramAdmin
        preconditions: ["no CreditEntry of type REDEEMED exists for this event (else ERR_EVENT_NOT_CANCELLABLE)"]
        side_effects:
          - "CANCEL CASCADE hop 1: every SwapIntakeItem of this event with status in {SUBMITTED, ACCEPTED} -> RETURNED_TO_OWNER; each item's version += 1"
          - "CANCEL CASCADE hop 2 (caused by each ACCEPTED item's -> RETURNED_TO_OWNER): for each member with EARNED entries scoped to this event, append CreditEntry{REVOKED, credits = earned_at_event}; member credits_revoked_total and credits_balance recomputed; member.version += 1"
          - "event.version += 1"
      - from: INTAKE_OPEN
        to: CANCELLED
        trigger: "POST /api/swap-events/{id}/cancel"
        actor: ProgramAdmin
        preconditions: ["no CreditEntry of type REDEEMED exists for this event (else ERR_EVENT_NOT_CANCELLABLE)"]
        side_effects: ["same cancel cascade as SCHEDULED -> CANCELLED", "event.version += 1"]

  - entity: SwapIntakeItem
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, RETURNED_TO_OWNER, SWAPPED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/intake-items/{id}/screen with outcome=ACCEPT"
        actor: ProgramAdmin
        preconditions: ["item.status == SUBMITTED", "event.status == INTAKE_OPEN"]
        side_effects:
          - "append CreditEntry{EARNED, credits = item.credit_value, member_id, event_id}"
          - "member credits_earned_total / credits_balance recomputed; member.version += 1"
          - "item.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/intake-items/{id}/screen with outcome=REJECT"
        actor: ProgramAdmin
        preconditions: ["item.status == SUBMITTED", "event.status in {INTAKE_OPEN, INTAKE_CLOSED}"]
        side_effects: ["item.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/intake-items/{id}/withdraw"
        actor: Member | ProgramAdmin
        preconditions: ["item.status == SUBMITTED", "actor Member must own item (item.member_id == X-User-ID)"]
        side_effects: ["item.version += 1"]
      - from: SUBMITTED
        to: RETURNED_TO_OWNER
        trigger: "SwapEvent cancel cascade"
        actor: system
        preconditions: ["event cancelled"]
        side_effects: ["item.version += 1"]
      - from: ACCEPTED
        to: RETURNED_TO_OWNER
        trigger: "SwapEvent cancel cascade"
        actor: system
        preconditions: ["event cancelled"]
        side_effects: ["CreditEntry{REVOKED} appended for the item's earned credits (hop 2 of cancel cascade)", "item.version += 1"]
      - from: ACCEPTED
        to: SWAPPED
        trigger: "SwapEvent complete cascade"
        actor: system
        preconditions: ["event completed"]
        side_effects: ["item.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "SwapEvent close-intake cascade (unscreened leftovers)"
        actor: system
        preconditions: ["event intake closed"]
        side_effects: ["item.version += 1"]

  - entity: PackingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/packing-sessions/{id}/cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["all PackingAssignments of this session with status == SIGNUP become CANCELLED; each version += 1", "session.version += 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/packing-sessions/{id}/complete"
        actor: ProgramAdmin
        preconditions: ["current logical clock time >= session.end_at"]
        side_effects: ["all PackingAssignments of this session still in SIGNUP become NO_SHOW; each version += 1", "session.version += 1"]

  - entity: PackingAssignment
    initial_state: SIGNUP
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNUP
        to: CANCELLED
        trigger: "POST /api/packing-assignments/{id}/cancel"
        actor: Volunteer | ProgramAdmin
        preconditions: ["assignment.status == SIGNUP", "actor Volunteer must own assignment (assignment.volunteer_id == X-User-ID)"]
        side_effects: ["assignment.version += 1"]
      - from: SIGNUP
        to: ATTENDED
        trigger: "POST /api/packing-assignments/{id}/mark-attended"
        actor: ProgramAdmin
        preconditions: ["assignment.status == SIGNUP", "session.status in {SCHEDULED, COMPLETED}"]
        side_effects: ["assignment.version += 1"]
      - from: SIGNUP
        to: NO_SHOW
        trigger: "PackingSession complete cascade"
        actor: system
        preconditions: ["session completed with assignment still SIGNUP"]
        side_effects: ["assignment.version += 1"]
      - from: SIGNUP
        to: CANCELLED
        trigger: "PackingSession cancel cascade"
        actor: system
        preconditions: ["session cancelled"]
        side_effects: ["assignment.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; true races per serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: variety-update-stale-version
    parent_entity: SeedVariety
    write_endpoint: "PATCH /api/seed-varieties/{id}"
    occ_field: "expected_seed_variety_version"
    description: |
      Updating a SeedVariety whose version has advanced since the client last
      observed it is rejected. The update itself (metadata edit) is legitimate
      under any current state, so a sequential second update would also succeed
      were its view not stale; the OCC check on SeedVariety.version is what
      rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: swap-event-reschedule-stale-version
    parent_entity: SwapEvent
    write_endpoint: "PATCH /api/swap-events/{id}"
    occ_field: "expected_swap_event_version"
    description: |
      Rescheduling a SwapEvent whose version has advanced since the client last
      observed it is rejected. A reschedule is state-legitimate whenever the
      event is in DRAFT or SCHEDULED, so a sequential second reschedule would
      also succeed were its view not stale; the OCC check on SwapEvent.version
      is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: germination_viability
    trigger: "recomputed whenever SeedLot.seeds_remaining changes, when a GerminationTest is CERTIFIED, and on every read of SeedLot.viable_seed_count"
    algorithm: aggregation
    formula: |
      effective_viability_pct = lot.final_viability_pct if lot.final_viability_pct is not null
                                else lot.provisional_viability_pct
      viable_seed_count = floor(lot.seeds_remaining * effective_viability_pct / 100)
    input_set: "the single SeedLot; final_viability_pct sourced from the most recently CERTIFIED GerminationTest (status == CERTIFIED, ordered by certification sequence), VOIDED tests excluded"
    constants:
      VIABILITY_PASS_PCT: 70.00
    precision: "result_pct 2 decimal places round_half_up; viable_seed_count integer floor"
    variants:
      - name: PROVISIONAL
        when: "no CERTIFIED GerminationTest exists for the lot"
        difference: "uses lot.provisional_viability_pct (declared at intake); identical seeds_remaining yields a different viable_seed_count than CERTIFIED_FINAL whenever declared != measured"
      - name: CERTIFIED_FINAL
        when: "at least one CERTIFIED GerminationTest exists"
        difference: "uses final_viability_pct from the latest CERTIFIED test; overrides the provisional value"

  - name: member_return_rate
    trigger: "recomputed on every Checkout transition into VERIFIED or WRITTEN_OFF for the owning member, and on every read of the member"
    algorithm: weighted_scoring
    formula: |
      Terminal set T = checkouts of member with status in {VERIFIED, WRITTEN_OFF}.
      simple_return_rate = (count of T with status == VERIFIED) / count(T), or 0.0 when count(T) == 0.
    input_set: "only terminal checkouts (VERIFIED, WRITTEN_OFF); ACTIVE/OVERDUE/RETURNED/DISPUTED are excluded from both numerator and denominator"
    constants:
      DECAY_HALF_LIFE_DAYS: 90
    precision: "4 decimal places, round_half_up"
    variants:
      - name: SIMPLE
        when: "standing_tier and effective_borrow_limit derivation (gate for checkout creation)"
        difference: "unweighted ratio verified/terminal; identical checkout history yields a different score than DECAY_WEIGHTED whenever outcomes differ in recency"
      - name: DECAY_WEIGHTED
        when: "surfaced as member.decay_weighted_return_score (priority-packing / participation metric)"
        difference: "score = SUM(w_i * outcome_i) / SUM(w_i) over T, outcome_i = 1 for VERIFIED else 0, w_i = 0.5 ** (max(0, (now - due_at)_seconds / 86400) / DECAY_HALF_LIFE_DAYS); when T is empty score is 0.0"

  - name: member_effective_borrow_limit
    trigger: "evaluated during POST /api/checkouts before the new checkout is counted, and recomputed whenever terminal counters change"
    algorithm: threshold
    formula: |
      EVALUATION ORDER (pinned, resolves the circular appearance — the limit depends
      on the tier, the tier depends on the rate, the rate depends on checkout
      outcomes; the in-flight checkout attempt NEVER participates):
        1. rate := simple_return_rate computed over terminal checkouts ONLY (excludes the current attempt and all non-terminal checkouts)
        2. tier := TRUSTED if terminal_checkout_count >= 5 and rate >= 0.90
                   else PROBATION if terminal_checkout_count >= 3 and rate < 0.60
                   else STANDARD   (covers terminal_checkout_count < 3: unrated)
        3. limit := {PROBATION: 2, STANDARD: 5, TRUSTED: 8}[tier]
        4. admit iff active_checkout_count < limit   (strict: at limit -> reject)
    input_set: "the borrowing member's checkout set as of request time, before any mutation"
    constants:
      TIER_TRUSTED_MIN_TERMINALS: 5
      TIER_TRUSTED_RATE: 0.90
      TIER_PROBATION_MIN_TERMINALS: 3
      TIER_PROBATION_RATE: 0.60
      LIMIT_PROBATION: 2
      LIMIT_STANDARD: 5
      LIMIT_TRUSTED: 8
    precision: "rates at 4 decimal places round_half_up before comparison"

  - name: pack_allocation
    trigger: "POST /api/seed-lots/{id}/pack"
    algorithm: constraint_propagation
    formula: |
      viable := lot.viable_seed_count            # germination_viability with variant branch (CERTIFIED_FINAL iff final_viability_pct present else PROVISIONAL)
      by_seeds    := floor(viable / seeds_per_packet)
      by_labels   := site.label_stock_count      # site = lot.home_site_id
      by_lot_cap  := LOT_MAX_PACKETS - lot.packets_created_total
      allocatable := min(by_seeds, by_labels, by_lot_cap)
      admit iff 1 <= packet_count <= allocatable  (else ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE)
      on success, per request:
        lot.seeds_remaining   -= packet_count * seeds_per_packet
        lot.seeds_in_packets  += packet_count * seeds_per_packet
        site.label_stock_count -= packet_count
        lot.packets_created_total += packet_count
    input_set: "the lot, its home site, and the request's packet_count/seeds_per_packet"
    constants:
      LOT_MAX_PACKETS: 200
    precision: "integer arithmetic; floors as written"

  - name: swap_credit_valuation
    trigger: "computed at POST /api/swap-events/{id}/intake-items (stored on item.credit_value) and summed per member per event for cap enforcement"
    algorithm: tiered_pricing
    formula: |
      ROUNDING ORDER (pinned — per-item first, then sum; NOT sum-then-round):
        per_item_credit = round_half_up_to_integer(BASE[item_type] * CONDITION_MULT[condition])
                          + (RARITY_BONUS if variety.rarity_flag else 0)
        submission_total = SUM(per_item_credit) over the request's items
      CAP CHECK (boundary pinned): admit iff earned_at_event_so_far + submission_total <= MAX_CREDITS_PER_MEMBER_EVENT
        (exactly reaching the cap is allowed; exceeding it rejects the WHOLE submission, no partial acceptance)
    input_set: "the intake request's items, each item's SeedVariety (rarity_flag), and the member's existing EARNED CreditEntry sum scoped to this event"
    constants:
      BASE_SEED_PACKET: 2
      BASE_PLANT_START: 5
      BASE_CUTTING: 3
      CONDITION_MULT_EXCELLENT: 1.5
      CONDITION_MULT_GOOD: 1.0
      CONDITION_MULT_FAIR: 0.5
      RARITY_BONUS: 2
      MAX_CREDITS_PER_MEMBER_EVENT: 25
    precision: "per-item round_half_up to integer BEFORE summation"

  - name: credit_balance_reconciliation
    trigger: "on every CreditEntry append (earn on intake ACCEPT, redeem, expire on event COMPLETE, revoke on event CANCEL) and on member reads"
    algorithm: aggregation
    formula: |
      credits_earned_total   = SUM(credits) over member's CreditEntry where entry_type == EARNED
      credits_redeemed_total = SUM(...) where entry_type == REDEEMED
      credits_expired_total  = SUM(...) where entry_type == EXPIRED
      credits_revoked_total  = SUM(...) where entry_type == REVOKED
      credits_balance        = earned - redeemed - expired - revoked
      CONSERVATION INVARIANT (pinned): credits_earned_total == credits_redeemed_total + credits_expired_total + credits_revoked_total + credits_balance
      Event-scoped redemption rule: a redemption at event E is admitted iff
        credits >= 1 AND credits <= credits_balance AND
        credits <= (earned_at_E - redeemed_at_E)
      Event completion expiry per member: expired_inc = max(0, earned_at_E - redeemed_at_E)
    input_set: "all CreditEntry rows of the member (and, for event-scoped rules, those with event_id == E)"
    constants: {}
    precision: "integer arithmetic"

  - name: overdue_sweep
    trigger: "POST /api/ops/run-daily-sweep"
    algorithm: chronological
    formula: |
      Pass 1 (overdue flip), processing ACTIVE checkouts ordered by due_at ASC, tie-break created_at ASC:
        if checkout.due_at < now:  checkout -> OVERDUE; member.overdue_checkout_count += 1
        boundary (pinned): due_at == now does NOT flip (strict less-than)
      Pass 2 (suspension sweep), per member ordered by created_at ASC:
        if member.status == ACTIVE and member.overdue_checkout_count >= OVERDUE_SUSPENSION_THRESHOLD: member -> SUSPENDED
        boundary (pinned): exactly 3 suspends; 2 does not
      Returns { overdue_flipped_count, members_suspended_count, members_reinstated_count: 0 }
      (reinstatement happens only on verify-return / resolve-dispute transitions, never in the sweep)
    input_set: "all checkouts with status == ACTIVE; all members with status == ACTIVE"
    constants:
      LOAN_DAYS: 21
      OVERDUE_SUSPENSION_THRESHOLD: 3
    precision: "timestamps compared at second precision"

  - name: seed_count_conservation
    trigger: "invariant checked after every pack, packet void, packet dispose, verify-return-to-discard, write-off, and lot retire mutation"
    algorithm: aggregation
    formula: |
      INVARIANT (pinned): lot.seeds_received == lot.seeds_remaining + lot.seeds_in_packets + lot.seeds_discarded
      pack(n, k):        remaining -= n*k;  in_packets += n*k          # conserves
      void REINTEGRATE:  in_packets -= s;   remaining += s             # forward+compensating pair of pack: restores both buckets
      void DISCARD:      in_packets -= s;   discarded += s
      dispose RECALLED:  in_packets -= s;   discarded += s
      verify-to-discard / write-off: in_packets -= s; discarded += s
    input_set: "the single SeedLot's three seed buckets plus the mutated packet's seeds_count s"
    constants: {}
    precision: "integer arithmetic; no rounding"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template ids resolve left-to-right (e.g. /api/seed-lots/{lotId}/germination-tests checks lotId first)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_constraint
    check: "request body shape: all required fields present, types correct, enum values in declared sets, numeric ranges respected (seeds_tested >= 1, sprouted_count <= seeds_tested, provisional_viability_pct in [0,100], end_at strictly after start_at, capacity >= 1, credits >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "body-referenced FK ids exist (member_id, packet_id, variety_id, site_id, volunteer_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs"
  - priority: 6
    category: state
    check: "target resource state precondition for the operation (e.g. checkout in returnable state, lot in QUARANTINE for test recording, packet AVAILABLE for checkout, member not SUSPENDED/CLOSED for member-initiated borrowing)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6.1
    category: state
    check: "member-initiated borrowing requires member.status == ACTIVE (SUSPENDED or CLOSED member blocked)"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: ["POST /api/checkouts"]
  - priority: 6.2
    category: state
    check: "packet's lot must be ACTIVE for checkout"
    error_id: ERR_LOT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /api/checkouts"]
  - priority: 6.3
    category: state
    check: "swap event must be INTAKE_OPEN for intake submission or credit redemption"
    error_id: ERR_EVENT_NOT_INTAKE_OPEN
    http_status: 409
    applies_to: ["POST /api/swap-events/{id}/intake-items", "POST /api/swap-events/{id}/redeem-credits"]
  - priority: 7
    category: business_safety
    check: "invasive-species screen: variety.invasive_flag == true blocks checkout and swap intake"
    error_id: ERR_INVASIVE_SPECIES_BLOCKED
    http_status: 422
    applies_to: ["POST /api/checkouts", "POST /api/swap-events/{id}/intake-items"]
  - priority: 7.1
    category: business_safety
    check: "regional appropriateness: variety.approved_zones must contain the member's home site region_zone (checkout) or the event site region_zone (intake)"
    error_id: ERR_REGION_NOT_APPROVED
    http_status: 422
    applies_to: ["POST /api/checkouts", "POST /api/swap-events/{id}/intake-items"]
  - priority: 8
    category: business_constraint
    check: "uniqueness: (variety_id, harvest_year, lot_code) unique on lot create; (event_id, member_id, variety_id, item_type) unique among non-terminal intake items; member.email / volunteer.email unique"
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: ["POST /api/seed-lots"]
  - priority: 8.1
    category: business_constraint
    check: "duplicate intake item: same member submitting same item_type of same variety at the same event while a non-terminal (SUBMITTED or ACCEPTED) twin exists"
    error_id: ERR_DUPLICATE_INTAKE_ITEM
    http_status: 409
    applies_to: ["POST /api/swap-events/{id}/intake-items"]
  - priority: 9
    category: business_temporal
    check: "swap event buffered overlap: for the same site, [start_at - 30m, end_at + 30m) must not intersect any non-CANCELLED event's buffered interval (half-open: buffer-end == buffer-start is allowed)"
    error_id: ERR_EVENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /api/swap-events", "POST /api/swap-events/{id}/publish", "PATCH /api/swap-events/{id}"]
  - priority: 9.1
    category: business_temporal
    check: "packing session half-open overlap: for the same site, [start_at, end_at) must not intersect any non-CANCELLED session's interval (back-to-back end == start allowed)"
    error_id: ERR_SESSION_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /api/packing-sessions"]
  - priority: 9.2
    category: business_temporal
    check: "volunteer double-booking: a volunteer's live assignments' session intervals use CLOSED semantics — touching endpoints (s1.end_at == s2.start_at) count as conflict (zero travel time)"
    error_id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /api/packing-sessions/{id}/assignments"]
  - priority: 10
    category: business_referential
    check: "germination certification outcome must agree with the measured band: PASS requires result_pct >= 70.00, FAIL requires result_pct < 70.00"
    error_id: ERR_VIABILITY_OUTCOME_MISMATCH
    http_status: 422
    applies_to: ["POST /api/germination-tests/{id}/certify"]
  - priority: 10.1
    category: business_referential
    check: "event cancellation requires zero REDEEMED CreditEntries for the event"
    error_id: ERR_EVENT_NOT_CANCELLABLE
    http_status: 409
    applies_to: ["POST /api/swap-events/{id}/cancel"]
  - priority: 11
    category: business_fiscal
    check: "borrow limit: member.active_checkout_count < member.effective_borrow_limit (derived per calculations.member_effective_borrow_limit)"
    error_id: ERR_BORROW_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/checkouts"]
  - priority: 11.1
    category: business_fiscal
    check: "pack quantity: 1 <= packet_count <= allocatable per calculations.pack_allocation"
    error_id: ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE
    http_status: 422
    applies_to: ["POST /api/seed-lots/{id}/pack"]
  - priority: 11.2
    category: business_fiscal
    check: "event credit cap: earned_at_event + submission_total <= MAX_CREDITS_PER_MEMBER_EVENT (25)"
    error_id: ERR_EVENT_CREDIT_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/swap-events/{id}/intake-items"]
  - priority: 11.3
    category: business_fiscal
    check: "redemption: credits >= 1, credits <= credits_balance, credits <= earned_at_event - redeemed_at_event"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 422
    applies_to: ["POST /api/swap-events/{id}/redeem-credits"]
  - priority: 11.4
    category: business_fiscal
    check: "session capacity: live assignments (SIGNUP or ATTENDED) < session.capacity"
    error_id: ERR_SESSION_CAPACITY_FULL
    http_status: 422
    applies_to: ["POST /api/packing-sessions/{id}/assignments"]
  - priority: 12
    category: auth
    check: "ownership: role Member may only act on resources whose member_id == X-User-ID; role Volunteer only on assignments whose volunteer_id == X-User-ID (checked after role permission, before state)"
    error_id: ERR_SELF_SERVICE_FORBIDDEN
    http_status: 403
    applies_to: ["POST /api/checkouts", "POST /api/checkouts/{id}/return", "POST /api/checkouts/{id}/dispute", "POST /api/swap-events/{id}/intake-items", "POST /api/swap-events/{id}/redeem-credits", "POST /api/intake-items/{id}/withdraw", "GET /api/members/{id}", "GET /api/members/{id}/credit-summary", "POST /api/packing-sessions/{id}/assignments", "POST /api/packing-assignments/{id}/cancel"]
  - priority: 13
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version on PATCH endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["PATCH /api/seed-varieties/{id}", "PATCH /api/swap-events/{id}"]
  - priority: 14
    category: state
    check: "terminal lockdown: any mutation trigger on an entity already in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock / ops (test-driving + ops-run) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; no entity mutation"]
  - method: POST
    path: "/api/ops/run-daily-sweep"
    description: "Ops-run checkpoint: flips ACTIVE checkouts with due_at < now to OVERDUE, then suspends ACTIVE members whose overdue_checkout_count >= 3."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ overdue_flipped_count: integer, members_suspended_count: integer, members_reinstated_count: integer }"
    side_effects: ["calculations.overdue_sweep", "Checkout ACTIVE->OVERDUE transitions", "Member ACTIVE->SUSPENDED transitions"]

  # ---- Site ----
  - method: POST
    path: "/api/sites"
    description: "Register a library branch or partner garden site."
    roles: [ProgramAdmin]
    code: 201
    input: [name, site_type, region_zone, "label_stock_count?"]
    output: Site
    side_effects: []
  - method: GET
    path: "/api/sites"
    description: "List sites (paginated)."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/api/sites/{id}"
    description: "Fetch one site."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: PATCH
    path: "/api/sites/{id}"
    description: "Update site metadata or toggle ACTIVE<->INACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "region_zone?", "label_stock_count?", "status?"]
    output: Site
    side_effects: ["Site status transitions per state machine", "site.version += 1"]

  # ---- Member ----
  - method: POST
    path: "/api/members"
    description: "Register a member at a home site."
    roles: [ProgramAdmin]
    code: 201
    input: [email, full_name, home_site_id]
    output: Member
    side_effects: []
  - method: GET
    path: "/api/members"
    description: "List members (paginated); filterable by home_site_id / status."
    roles: [ProgramAdmin]
    code: 200
    input: ["home_site_id?", "status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/api/members/{id}"
    description: "Fetch one member. Member role may fetch only its own record."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: PATCH
    path: "/api/members/{id}"
    description: "Close a member (status=CLOSED) or update profile fields."
    roles: [ProgramAdmin]
    code: 200
    input: ["full_name?", "home_site_id?", "status?"]
    output: Member
    side_effects: ["Member CLOSED transitions per state machine", "member.version += 1"]
  - method: GET
    path: "/api/members/{id}/credit-summary"
    description: "Computed read of the member's credit ledger totals. Member role may read only its own."
    roles: [ProgramAdmin, Member]
    code: 200
    input: []
    output: "{ credits_earned_total: integer, credits_redeemed_total: integer, credits_expired_total: integer, credits_revoked_total: integer, credits_balance: integer }"
    side_effects: []

  # ---- Volunteer ----
  - method: POST
    path: "/api/volunteers"
    description: "Register a volunteer (starts APPLIED)."
    roles: [ProgramAdmin]
    code: 201
    input: [email, full_name]
    output: Volunteer
    side_effects: []
  - method: GET
    path: "/api/volunteers/{id}"
    description: "Fetch one volunteer."
    roles: [ProgramAdmin, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/api/volunteers/{id}/approve"
    description: "Approve volunteer APPLIED -> ACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["volunteer.version += 1"]
  - method: PATCH
    path: "/api/volunteers/{id}"
    description: "Toggle volunteer ACTIVE<->INACTIVE."
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "full_name?"]
    output: Volunteer
    side_effects: ["Volunteer transitions per state machine", "volunteer.version += 1"]

  # ---- SeedVariety ----
  - method: POST
    path: "/api/seed-varieties"
    description: "Create a catalog variety with invasive/rarity flags and approved zones."
    roles: [ProgramAdmin]
    code: 201
    input: [variety_name, species, category, approved_zones, "invasive_flag?", "rarity_flag?"]
    output: SeedVariety
    side_effects: []
  - method: GET
    path: "/api/seed-varieties"
    description: "List varieties (paginated)."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: SeedVariety[]
    side_effects: []
  - method: GET
    path: "/api/seed-varieties/{id}"
    description: "Fetch one variety."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: SeedVariety
    side_effects: []
  - method: PATCH
    path: "/api/seed-varieties/{id}"
    description: "Edit variety metadata (OCC-guarded). Carries expected_seed_variety_version; stale views rejected with 412."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_seed_variety_version, "variety_name?", "invasive_flag?", "rarity_flag?", "approved_zones?", "status?"]
    output: SeedVariety
    side_effects: ["variety.version += 1 on success (advances the OCC watermark)"]

  # ---- SeedLot ----
  - method: POST
    path: "/api/seed-lots"
    description: "Intake a seed lot (starts DRAFT with seeds_remaining = seeds_received)."
    roles: [ProgramAdmin]
    code: 201
    input: [variety_id, home_site_id, lot_code, harvest_year, seeds_received, provisional_viability_pct]
    output: SeedLot
    side_effects: ["seeds_remaining := seeds_received", "viable_seed_count computed under PROVISIONAL variant"]
  - method: GET
    path: "/api/seed-lots"
    description: "List lots (paginated); filterable by variety_id / home_site_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["variety_id?", "home_site_id?", "status?", "limit?", "offset?"]
    output: SeedLot[]
    side_effects: []
  - method: GET
    path: "/api/seed-lots/{id}"
    description: "Fetch one lot."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: SeedLot
    side_effects: []
  - method: PATCH
    path: "/api/seed-lots/{id}"
    description: "Retire an ACTIVE lot (status=RETIRED)."
    roles: [ProgramAdmin]
    code: 200
    input: ["status?"]
    output: SeedLot
    side_effects: ["ACTIVE->RETIRED per state machine (available packets DISCARDED, seed buckets move)", "lot.version += 1"]
  - method: POST
    path: "/api/seed-lots/{id}/submit-for-review"
    description: "Move lot DRAFT -> QUARANTINE for germination testing."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SeedLot
    side_effects: ["lot.version += 1"]
  - method: POST
    path: "/api/seed-lots/{id}/recheck"
    description: "Move ACTIVE lot back to QUARANTINE for a scheduled re-test (cycle)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SeedLot
    side_effects: ["lot.version += 1"]

  # ---- GerminationTest ----
  - method: POST
    path: "/api/seed-lots/{id}/germination-tests"
    description: "Volunteer records a germination assay for a QUARANTINE lot. recorded_by_volunteer_id is taken from X-User-ID."
    roles: [Volunteer]
    code: 201
    input: [seeds_tested, sprouted_count]
    output: GerminationTest
    side_effects: ["result_pct computed", "recorded_by_volunteer_id := X-User-ID"]
  - method: GET
    path: "/api/germination-tests"
    description: "List germination tests (paginated); filterable by lot_id / recorded_by_volunteer_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["lot_id?", "recorded_by_volunteer_id?", "status?", "limit?", "offset?"]
    output: GerminationTest[]
    side_effects: []
  - method: GET
    path: "/api/germination-tests/{id}"
    description: "Fetch one germination test."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: GerminationTest
    side_effects: []
  - method: POST
    path: "/api/germination-tests/{id}/certify"
    description: "ProgramAdmin certifies a RECORDED test with outcome PASS or FAIL (segregation of duties vs the recording Volunteer)."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome]
    output: GerminationTest
    side_effects: ["test -> CERTIFIED", "lot transitions per SeedLot machine (PASS->ACTIVE; FAIL->REJECTED or QUARANTINE+recall cascade)"]
  - method: POST
    path: "/api/germination-tests/{id}/void"
    description: "Void a RECORDED test (data-entry error)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GerminationTest
    side_effects: ["test -> VOIDED"]

  # ---- SeedPacket ----
  - method: POST
    path: "/api/seed-lots/{id}/pack"
    description: "Pack packets from an ACTIVE lot (Volunteer packing work). Enforces calculations.pack_allocation."
    roles: [Volunteer]
    code: 201
    input: [packet_count, seeds_per_packet]
    output: "{ created_count: integer, lot_id: string, packet_ids: string[] }"
    side_effects: ["lot seed buckets debited", "site.label_stock_count debited", "lot.packets_created_total incremented", "lot DEPLETED auto-check", "lot.version += 1; site.version += 1"]
  - method: GET
    path: "/api/seed-packets"
    description: "List packets (paginated); filterable by lot_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["lot_id?", "status?", "limit?", "offset?"]
    output: SeedPacket[]
    side_effects: []
  - method: GET
    path: "/api/seed-packets/{id}"
    description: "Fetch one packet."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: SeedPacket
    side_effects: []
  - method: POST
    path: "/api/seed-packets/{id}/void"
    description: "Unpack an AVAILABLE packet; mode REINTEGRATE returns seeds to the lot, DISCARD destroys them."
    roles: [ProgramAdmin]
    code: 200
    input: [mode]
    output: SeedPacket
    side_effects: ["seed bucket move per mode (seed_count_conservation)", "lot DEPLETED auto-check", "packet.version += 1; lot.version += 1"]
  - method: POST
    path: "/api/seed-packets/{id}/dispose"
    description: "Dispose of a RECALLED packet once no live checkout holds it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SeedPacket
    side_effects: ["seeds move in_packets -> discarded", "packet.version += 1; lot.version += 1"]

  # ---- Checkout ----
  - method: POST
    path: "/api/checkouts"
    description: "Borrow a packet. Member role borrows only for itself (member_id == X-User-ID)."
    roles: [Member, ProgramAdmin]
    code: 201
    input: [member_id, packet_id]
    output: Checkout
    side_effects: ["packet AVAILABLE->CHECKED_OUT", "due_at := now + 21 days", "member.active_checkout_count += 1", "member.version += 1; packet.version += 1"]
  - method: GET
    path: "/api/checkouts"
    description: "List checkouts (paginated); filterable by member_id / packet_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["member_id?", "packet_id?", "status?", "limit?", "offset?"]
    output: Checkout[]
    side_effects: []
  - method: GET
    path: "/api/checkouts/{id}"
    description: "Fetch one checkout."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: Checkout
    side_effects: []
  - method: POST
    path: "/api/checkouts/{id}/return"
    description: "Record a return (ACTIVE or OVERDUE -> RETURNED)."
    roles: [Member, ProgramAdmin]
    code: 200
    input: []
    output: Checkout
    side_effects: ["packet CHECKED_OUT->RETURNED", "checkout.returned_at := now"]
  - method: POST
    path: "/api/checkouts/{id}/verify-return"
    description: "Staff verifies a RETURNED checkout -> VERIFIED; packet reintegrates (lot ACTIVE) or is discarded."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Checkout
    side_effects: ["packet RETURNED->AVAILABLE or ->DISCARDED", "member counters/rates/tier recomputed", "auto-reinstate member if overdue_checkout_count <= 2"]
  - method: POST
    path: "/api/checkouts/{id}/dispute"
    description: "Open a dispute (RETURNED by staff on inspection fail; OVERDUE by member or staff)."
    roles: [Member, ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Checkout
    side_effects: ["checkout -> DISPUTED"]
  - method: POST
    path: "/api/checkouts/{id}/resolve-dispute"
    description: "Resolve a DISPUTED checkout: outcome RETURN_ACCEPTED loops back to RETURNED; WRITE_OFF terminates."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome]
    output: Checkout
    side_effects: ["per Checkout machine (loop or write-off cascade)", "member counters/rates recomputed"]

  # ---- SwapEvent ----
  - method: POST
    path: "/api/swap-events"
    description: "Create a swap event in DRAFT (buffered-overlap check applies at publish and on reschedule)."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, title, start_at, end_at]
    output: SwapEvent
    side_effects: []
  - method: GET
    path: "/api/swap-events"
    description: "List swap events (paginated); filterable by site_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: SwapEvent[]
    side_effects: []
  - method: GET
    path: "/api/swap-events/{id}"
    description: "Fetch one swap event."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: SwapEvent
    side_effects: []
  - method: PATCH
    path: "/api/swap-events/{id}"
    description: "Reschedule/rename an event (OCC-guarded, DRAFT or SCHEDULED only). Re-runs buffered-overlap check when times change."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_swap_event_version, "title?", "start_at?", "end_at?"]
    output: SwapEvent
    side_effects: ["event.version += 1 on success"]
  - method: POST
    path: "/api/swap-events/{id}/publish"
    description: "Publish event DRAFT -> SCHEDULED (buffered-overlap check runs here)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["event.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/open-intake"
    description: "Open intake SCHEDULED -> INTAKE_OPEN (site must be ACTIVE)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["event.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/close-intake"
    description: "Close intake INTAKE_OPEN -> INTAKE_CLOSED; unscreened SUBMITTED items auto-REJECTED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["leftover SUBMITTED items -> REJECTED", "event.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/complete"
    description: "Complete event INTAKE_CLOSED -> COMPLETED; ACCEPTED items -> SWAPPED; event-scoped unredeemed credits EXPIRE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["ACCEPTED items -> SWAPPED", "CreditEntry EXPIRED appended per member per credit_balance_reconciliation", "event.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/cancel"
    description: "Cancel event from SCHEDULED or INTAKE_OPEN (blocked once any redemption exists). Runs the cancel cascade (items -> RETURNED_TO_OWNER, earned credits REVOKED)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["cancel cascade hops 1-2 per SwapEvent machine", "event.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/redeem-credits"
    description: "Member redeems event-scoped swap credits while the event is INTAKE_OPEN."
    roles: [Member, ProgramAdmin]
    code: 200
    input: [member_id, credits]
    output: "{ member_id: string, credits_redeemed: integer, credits_balance: integer }"
    side_effects: ["CreditEntry REDEEMED appended", "member credit totals recomputed", "member.version += 1"]
  - method: POST
    path: "/api/swap-events/{id}/intake-items"
    description: "Member submits an item to an INTAKE_OPEN event (single item per call). Invasive/zone screens, duplicate check, and credit-cap check apply."
    roles: [Member, ProgramAdmin]
    code: 201
    input: [member_id, variety_id, item_type, condition]
    output: SwapIntakeItem
    side_effects: ["credit_value computed and stored (per-item rounding)"]
  - method: GET
    path: "/api/intake-items"
    description: "List intake items (paginated); filterable by event_id / member_id / variety_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["event_id?", "member_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: SwapIntakeItem[]
    side_effects: []
  - method: GET
    path: "/api/intake-items/{id}"
    description: "Fetch one intake item."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: SwapIntakeItem
    side_effects: []
  - method: POST
    path: "/api/intake-items/{id}/screen"
    description: "ProgramAdmin screens a SUBMITTED item: outcome ACCEPT (grants credits) or REJECT."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome]
    output: SwapIntakeItem
    side_effects: ["on ACCEPT: CreditEntry EARNED appended, member credit totals recomputed"]
  - method: POST
    path: "/api/intake-items/{id}/withdraw"
    description: "Owning member withdraws a SUBMITTED item."
    roles: [Member, ProgramAdmin]
    code: 200
    input: []
    output: SwapIntakeItem
    side_effects: ["item -> WITHDRAWN"]

  # ---- CreditEntry (append-only ledger) ----
  - method: GET
    path: "/api/credit-entries"
    description: "List credit ledger entries (paginated, append-only); filterable by member_id / event_id / entry_type."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["member_id?", "event_id?", "entry_type?", "limit?", "offset?"]
    output: CreditEntry[]
    side_effects: []
  - method: GET
    path: "/api/credit-entries/{id}"
    description: "Fetch one credit entry."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: CreditEntry
    side_effects: []

  # ---- PackingSession / PackingAssignment ----
  - method: POST
    path: "/api/packing-sessions"
    description: "Schedule a volunteer packing session (half-open same-site overlap check)."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, title, start_at, end_at, capacity]
    output: PackingSession
    side_effects: []
  - method: GET
    path: "/api/packing-sessions"
    description: "List packing sessions (paginated); filterable by site_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: PackingSession[]
    side_effects: []
  - method: GET
    path: "/api/packing-sessions/{id}"
    description: "Fetch one packing session."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: PackingSession
    side_effects: []
  - method: POST
    path: "/api/packing-sessions/{id}/cancel"
    description: "Cancel a SCHEDULED session; SIGNUP assignments cascade to CANCELLED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PackingSession
    side_effects: ["SIGNUP assignments -> CANCELLED", "session.version += 1"]
  - method: POST
    path: "/api/packing-sessions/{id}/complete"
    description: "Complete a SCHEDULED session once now >= end_at; remaining SIGNUP assignments become NO_SHOW."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PackingSession
    side_effects: ["SIGNUP assignments -> NO_SHOW", "session.version += 1"]
  - method: POST
    path: "/api/packing-sessions/{id}/assignments"
    description: "ACTIVE volunteer signs up (volunteer_id must equal X-User-ID for role Volunteer). Closed-interval double-booking and capacity checks apply."
    roles: [Volunteer, ProgramAdmin]
    code: 201
    input: [volunteer_id]
    output: PackingAssignment
    side_effects: []
  - method: GET
    path: "/api/packing-assignments"
    description: "List packing assignments (paginated); filterable by session_id / volunteer_id / status."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: ["session_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: PackingAssignment[]
    side_effects: []
  - method: GET
    path: "/api/packing-assignments/{id}"
    description: "Fetch one packing assignment."
    roles: [ProgramAdmin, Member, Volunteer]
    code: 200
    input: []
    output: PackingAssignment
    side_effects: []
  - method: POST
    path: "/api/packing-assignments/{id}/cancel"
    description: "Volunteer cancels own SIGNUP assignment (or ProgramAdmin)."
    roles: [Volunteer, ProgramAdmin]
    code: 200
    input: []
    output: PackingAssignment
    side_effects: ["assignment -> CANCELLED"]
  - method: POST
    path: "/api/packing-assignments/{id}/mark-attended"
    description: "ProgramAdmin marks a SIGNUP assignment ATTENDED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PackingAssignment
    side_effects: ["assignment -> ATTENDED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list."
  - id: ERR_SELF_SERVICE_FORBIDDEN
    http: 403
    condition: "Member/Volunteer role attempts to act on a resource owned by a different member/volunteer id."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body-referenced FK id does not resolve to an existing entity."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, out-of-range numeric, malformed datetime, or end_at <= start_at."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "Enum field carries a value outside its declared set (site_type, category, item_type, condition, outcome, mode, status targets)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state precondition failure: trigger not valid from the entity's current non-terminal state."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Mutation attempted on an entity in a terminal state (VERIFIED, WRITTEN_OFF, COMPLETED, CANCELLED, DEPLETED, REJECTED, RETIRED, CERTIFIED, VOIDED, DISCARDED, SWAPPED, WITHDRAWN, RETURNED_TO_OWNER, ATTENDED, NO_SHOW, CLOSED)."
  - id: ERR_MEMBER_SUSPENDED
    http: 409
    condition: "Checkout creation while the borrowing member is SUSPENDED or CLOSED."
  - id: ERR_LOT_NOT_ACTIVE
    http: 409
    condition: "Checkout or pack attempted against a lot whose status is not ACTIVE (pack) or whose packet's lot is not ACTIVE (checkout)."
  - id: ERR_EVENT_NOT_INTAKE_OPEN
    http: 409
    condition: "Intake submission or credit redemption while the event is not INTAKE_OPEN."
  - id: ERR_EVENT_NOT_CANCELLABLE
    http: 409
    condition: "Cancel attempted on an event that already has REDEEMED credit entries, or from a state other than SCHEDULED/INTAKE_OPEN."
  - id: ERR_TEST_NOT_RECORDED
    http: 409
    condition: "Certify or void attempted on a test not in RECORDED (e.g. already CERTIFIED -> see ERR_ALREADY_TERMINAL for CERTIFIED)."
  - id: ERR_VIABILITY_OUTCOME_MISMATCH
    http: 422
    condition: "Certification outcome disagrees with the measured band (PASS requires result_pct >= 70.00; FAIL requires < 70.00)."
  - id: ERR_INVASIVE_SPECIES_BLOCKED
    http: 422
    condition: "Variety flagged invasive submitted to checkout or swap intake."
  - id: ERR_REGION_NOT_APPROVED
    http: 422
    condition: "Variety's approved_zones does not contain the relevant site's region_zone."
  - id: ERR_PACKET_NOT_AVAILABLE
    http: 409
    condition: "Checkout targets a packet not in AVAILABLE."
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "Lot create reuses (variety_id, harvest_year, lot_code) of an existing lot."
  - id: ERR_DUPLICATE_INTAKE_ITEM
    http: 409
    condition: "Same member submits the same item_type of the same variety at the same event while a non-terminal twin exists."
  - id: ERR_EVENT_WINDOW_OVERLAP
    http: 409
    condition: "Swap event buffered interval [start-30m, end+30m) intersects another non-CANCELLED event's buffered interval at the same site."
  - id: ERR_SESSION_WINDOW_OVERLAP
    http: 409
    condition: "Packing session [start, end) intersects another non-CANCELLED session at the same site (back-to-back allowed)."
  - id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http: 409
    condition: "Volunteer's live assignments have session intervals that touch or overlap (closed-interval semantics)."
  - id: ERR_SESSION_CAPACITY_FULL
    http: 422
    condition: "Signup would bring live assignments (SIGNUP or ATTENDED) to session.capacity or beyond."
  - id: ERR_BORROW_LIMIT_EXCEEDED
    http: 422
    condition: "Member's active_checkout_count already equals effective_borrow_limit."
  - id: ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE
    http: 422
    condition: "Requested packet_count is < 1 or > min(by_seeds, by_labels, by_lot_cap) per pack_allocation."
  - id: ERR_EVENT_CREDIT_CAP_EXCEEDED
    http: 422
    condition: "Intake submission would push the member's earned credits at this event above 25 (whole submission rejected)."
  - id: ERR_INSUFFICIENT_CREDITS
    http: 422
    condition: "Redemption exceeds credits_balance or the event-scoped redeemable remainder, or credits < 1."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version (OCC)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Library patron who borrows seed packets and brings items to swap events."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/checkouts (self; shares with ProgramAdmin)"
      - "POST /api/checkouts/{id}/return (own checkouts; shares with ProgramAdmin)"
      - "POST /api/swap-events/{id}/redeem-credits (self; shares with ProgramAdmin)"
      - "POST /api/intake-items/{id}/withdraw (own items; shares with ProgramAdmin)"
    shared_operations:
      - "GET reads of catalog/lots/packets/events/sessions"
      - "GET /api/members/{id} and credit-summary (self only)"
      - "POST /api/checkouts (member_id == self)"
      - "POST /api/checkouts/{id}/return and dispute (own checkouts)"
      - "POST /api/swap-events/{id}/intake-items (member_id == self)"
      - "POST /api/swap-events/{id}/redeem-credits (member_id == self)"
      - "POST /api/intake-items/{id}/withdraw (own items)"
  - name: Volunteer
    description: "Approved program volunteer who records germination assays, packs lots, and joins packing sessions."
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/seed-lots/{id}/germination-tests (recording; segregation of duties: cannot certify)"
      - "POST /api/seed-lots/{id}/pack"
    shared_operations:
      - "GET reads of catalog/lots/tests/packets/events/sessions/assignments"
      - "POST /api/packing-sessions/{id}/assignments (volunteer_id == self)"
      - "POST /api/packing-assignments/{id}/cancel (own assignments; shares with ProgramAdmin)"
  - name: ProgramAdmin
    description: "Library program administrator (opaque operator id); runs all configuration, certification, screening, lifecycle, and ops actions."
    identity: "opaque"
    exclusive_operations:
      - "site / member / volunteer / variety / lot / session administration"
      - "POST /api/germination-tests/{id}/certify and void"
      - "POST /api/checkouts/{id}/verify-return and resolve-dispute"
      - "POST /api/intake-items/{id}/screen"
      - "swap-event lifecycle (publish/open-intake/close-intake/complete/cancel) and reschedule"
      - "POST /api/seed-packets/{id}/void and dispose"
      - "POST /api/ops/run-daily-sweep and POST /api/_clock/set_current_utc"
      - "POST /api/packing-assignments/{id}/mark-attended"
    shared_operations:
      - "all GET reads"
      - "POST /api/checkouts, return, dispute (on behalf of any member)"
      - "POST /api/swap-events/{id}/intake-items and redeem-credits (on behalf of any member)"
      - "POST /api/intake-items/{id}/withdraw (on behalf)"
      - "POST /api/packing-sessions/{id}/assignments and cancel (on behalf)"
