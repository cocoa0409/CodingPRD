# =============================================================================
# Task 1263 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances. Every chain replays against SCAFFOLD.yaml §1.5.
# Shared fixture notes: default logical clock 2026-05-01T00:00:00Z.
# Standard "open school" fixture: composite 90.0 (rubric 90.0 + panel 90),
# contract FW-1 term 2027-07-01..2032-06-30, targets 0.5/0.25/0.25.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: application_composite_provisional_vs_final
        grounds:
          - calculations.application_composite_score
          - entities.CharterApplication.fields.composite_score
          - entities.CharterApplication.fields.composite_variant
        distinguishing_aspect: |
          On the SAME application data the PROVISIONAL variant (rubric only, 80.0) and the
          FINAL variant (0.6*rubric + 0.4*interview = 74.0) produce different composite_score
          values; the variant flips exactly when the capacity interview is scored. Entity
          domain: CharterApplication (distinct from the FeeInvoice domain of the sibling instance).
        test_recipe:
          setup:
            - "Application UNDER_REVIEW with rubric complete: criterion scores 90/70/80/80/80 -> rubric_score 80.0"
            - "Capacity interview SCHEDULED but not yet scored"
            - "Logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "DV Composite Academy", founding_group: "FG DV1", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_dv1
              captures: { app_id: $.data.id }
            - call: "POST /authorizer/applications/${app_id}/accept-intake"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "ACADEMIC_PLAN", score: 90 }
              as: ApplicationReviewer
              as_user_id: rev_dv1
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "FINANCE_PLAN", score: 70 }
              as: ApplicationReviewer
              as_user_id: rev_dv1
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "GOVERNANCE", score: 80 }
              as: ApplicationReviewer
              as_user_id: rev_dv1
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "OPERATIONS_PLAN", score: 80 }
              as: ApplicationReviewer
              as_user_id: rev_dv1
            - call: "POST /authorizer/applications/${app_id}/scores"
              payload: { criterion: "COMMUNITY_SUPPORT", score: 80 }
              as: ApplicationReviewer
              as_user_id: rev_dv1
            - call: "POST /authorizer/applications/${app_id}/interviews"
              payload: { scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", panelist_user_ids: ["rev_panel_dv1"] }
              as: AuthorizerStaff
              captures: { int_id: $.data.id }
            - call: "GET /authorizer/applications/${app_id}"
              as: AuthorizerStaff
              captures: { prov_composite: $.data.composite_score, prov_variant: $.data.composite_variant }
          trigger:
            - call: "POST /authorizer/interviews/${int_id}/score"
              payload: { panel_score: 65 }
              as: ApplicationReviewer
              as_user_id: rev_panel_dv1
            - call: "GET /authorizer/applications/${app_id}"
              as: AuthorizerStaff
              captures: { final_composite: $.data.composite_score, final_variant: $.data.composite_variant }
          assert:
            - "captured provisional composite_score == 80.0 and composite_variant == 'PROVISIONAL'"
            - "captured final composite_score == 74.0 and composite_variant == 'FINAL'"
            - "CharterApplication.${app_id}.rubric_score == 80.0 and interview_score == 65"

      - name: fee_invoice_estimated_vs_final_variant
        grounds:
          - calculations.authorizer_fee_billing
          - calculations.per_pupil_funding_total
          - entities.FeeInvoice.fields.billed_variant
        distinguishing_aspect: |
          On the SAME invoice inputs the ESTIMATED variant (adm=400 -> billed 6528000 cents) and
          the FINAL variant (adm=500 -> billed 8127996 cents) produce different billed amounts;
          the variant switches at finalize. Entity domain: FeeInvoice (distinct from
          CharterApplication of the sibling instance).
        test_recipe:
          setup:
            - "School OPEN with ACTIVE contract (standard fixture, composite 90.0)"
            - "Logical clock at default 2026-05-01T00:00:00Z"
