              payload: {}
              as: ContractReviewer
              as_user_id: "rev-1"
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 item, total_count == 3, has_more == false"
            - "the 3 items across pages are exactly the 3 tasks spawned at submit (one per non-standard clause)"

      - name: response_envelope_shape_on_create
        claim_type: response_envelope
        grounds: [response_envelope.success, response_envelope.error]
        distinguishing_aspect: "Success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == 'object', and data; error envelope carries response_type == 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /revrec/customers"
              payload: { legal_name: "Env Co", external_ref: "ENV-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "GET /revrec/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { err: $.data.error_id }
          assert:
            - "success: 201 with meta.api_request_id and meta.api_request_timestamp present, response_type == 'object', data.id == ${cust_id}"
            - "error: 404 with response_type == 'error', data.error_id == 'ERR_NOT_FOUND', data.message present"

      - name: standard_clause_spawns_no_review_task
        claim_type: conditional_action
