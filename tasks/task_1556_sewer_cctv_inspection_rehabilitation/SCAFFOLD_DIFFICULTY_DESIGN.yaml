  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cctv_inspection_qa_reject_cycle_then_certify
        grounds:
          - state_machines.CctvInspection.QA_REVIEW_to_CODING
          - state_machines.CctvInspection.QA_REVIEW_to_CERTIFIED
          - entities.CctvInspection.fields.reject_count
        distinguishing_aspect: |
          CctvInspection runs a cyclic QA_REVIEW -> CODING -> QA_REVIEW loop
          (revision rounds with a reject_count accumulator that auto-voids at
          3); the entity can loop back and still reach CERTIFIED — unlike the
          linear InspectionCycle machine.
        test_recipe:
          setup:
            - "District D, segment S, OPEN cycle, coder TC, QA TQ, clock 2026-08-10"
            - "Inspection I driven to QA_REVIEW with one grade-2 structural defect"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-SM1", ii_reduction_target_pct: 25, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Coder SM1", nassco_cert_number: "PACP-CS1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "QA SM1", nassco_cert_number: "PACP-QS1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-SM1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-11->MH-12", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1988 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T08:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "CRK", family: "STRUCTURAL", grade: 2, distance_m: 15, clock_position: 6, extent_m: 0 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/reject"
              payload: { reason: "recheck distance" }
              as: QaReviewer
              as_user_id: "${tq_id}"
              captures: { st1: $.data.status, rc1: $.data.reject_count }
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "RTL", family: "OM", grade: 1, distance_m: 80, clock_position: 0, extent_m: 0 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/certify"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
              captures: { st2: $.data.status, rc2: $.data.reject_count }
          assert:
            - "after first reject: CctvInspection.${i_id}.status == 'CODING' and reject_count == 1"
            - "after loop-back submit and certify: CctvInspection.${i_id}.status == 'CERTIFIED' and reject_count == 1 (counter persists across the cycle)"
            - "PipeSegment.${s_id}.structural_grade == 2 and om_grade == 1 (OM defect added during the loop is included in final scoring)"
