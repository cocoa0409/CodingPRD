              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 100, receipt_reference: "RCV-RB-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/impact-seasons/${s_id}"
              payload: {}
              as: ImpactAuditor
              captures: { s_v: $.data.version }
            - call: "PUT /impact-program/impact-seasons/${s_id}/frozen-state"
              payload: { is_final: true, expected_season_version: "${s_v}" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-audits"
              payload: { impact_season_id: "${s_id}", claim_id: "${claim_id}", audit_kind: "ANNUAL_IMPACT" }
              as: ImpactAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              captures: { audit_v: $.data.version }
          trigger:
            - call: "POST /impact-program/impact-audits/${audit_id}/finalize"
              payload: { transaction_test_sample_size: 20, transaction_test_exceptions: 0, claimed_donation_units: 100, expected_audit_version: "${audit_v}" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "ImpactAudit.${audit_id}.status is still IN_PROGRESS"

      - name: an_unauthenticated_call_to_list_allocations_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_CONTEXT]
        distinguishing_aspect: "Every business endpoint sits behind the auth rule, so a listing call with no role header is refused before any filter is evaluated."
        test_recipe:
          setup:
            - "Logical clock at the default; one committed allocation so the list would be non-empty if it were reachable."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
          trigger:
            - call: "GET /impact-program/allocations"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_MISSING_AUTH_CONTEXT"
            - "response_type is error"
            - "the identical call as AllocationPlanner returns 1 row"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: derived_partner_impact_units_stay_consistent_after_a_partial_receipt
        claim_type: derived_field_reconciliation
        grounds:
          - entities.GivingPartner.fields.impact_units_total
          - entities.DonationDistribution.fields.impact_units_confirmed
          - state_machines.DonationAllocation.SHIPPED_to_PARTIALLY_RECEIVED
        distinguishing_aspect: "The partner's derived impact total is a roll-up over confirmed units, so it stays at 0 through a partial receipt, jumps to the full receipt on completion, and is recomputed rather than incremented."
        test_recipe:
          setup:
            - "Logical clock at the default; a 100-unit distribution shipped and 30 units confirmed."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-DF-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 30, receipt_reference: "RCV-DF-1" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: GivingPartnerCoordinator
          assert:
            - "GivingPartner.${p_id}.impact_units_total == 0 because no distribution of this partner is yet RECEIVED"
            - "GivingPartner.${p_id}.capacity_utilization_units == 70, computed as committed 100 plus reserved 0 minus confirmed impact 30"
            - "after a further receipt of 70 units, GivingPartner.${p_id}.impact_units_total == 100 and capacity_utilization_units == 0"
            - "GivingPartner.${p_id}.updated_at is refreshed on every recompute"

      - name: listing_orders_filters_and_pages_with_a_stable_total_count
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/impact-program/sales-orders
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter, sort and page interact on one list: total_count counts the filtered set while has_more reflects the page, so a filtered two-row result with limit 1 reports total_count 2 and has_more true."
        test_recipe:
          setup:
            - "Logical clock at the default; three orders, two RETAIL_ECOM and one RETAIL_POS, one second apart."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-PG-1", channel: "RETAIL_ECOM" }
              as: CustomerService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-PG-2", channel: "RETAIL_ECOM" }
              as: CustomerService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-PG-3", channel: "RETAIL_POS" }
              as: CustomerService
          trigger:
            - call: "GET /impact-program/sales-orders"
              payload: { channel: "RETAIL_ECOM", limit: 1, offset: 0 }
              as: CustomerService
          assert:
            - "the response returns exactly 1 row with total_count == 2 and has_more == true"
            - "the same filter with offset 1 returns the second RETAIL_ECOM row with has_more == false"
            - "GET /impact-program/sales-orders?channel=RETAIL_POS returns exactly 1 row"
            - "GET /impact-program/sales-orders with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"
            - "the two rows on the filtered list are ordered by created_at ascending, which the one-second clock steps make deterministic"

      - name: a_duplicate_order_number_is_refused_and_the_key_is_not_reusable
        claim_type: idempotency
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "order_number is a uniqueness key rather than an idempotency key, so replaying the identical create is refused with 409 and produces no second order."
        test_recipe:
          setup:
            - "Logical clock at the default; one order already on file."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-DUP-1", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-DUP-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_RESOURCE"
            - "GET /impact-program/sales-orders returns exactly 1 row"
            - "SalesOrder.${ord_id}.channel == RETAIL_POS, so the conflicting create did not mutate the original"

      - name: derive_build_is_idempotent_when_the_season_has_not_moved
        claim_type: idempotency
        grounds:
          - state_machines.MarketingClaim.SUBSTANTIATED_to_SUBSTANTIATED
          - calculations.claim_substantiation_shortfall
        distinguishing_aspect: "The derive-build self-loop is declared with an idempotent note, so re-running it inside a frozen season leaves the substantiated unit count unchanged instead of double-counting the committed units."
        test_recipe:
          setup:
            - "Logical clock past freezes_at; one SUBSTANTIATED claim over a frozen season with 100 shipped units."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 1000, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 1000, shipment_reference: "TRK-ID-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 1000, receipt_reference: "RCV-ID-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/marketing-claims/${claim_id}/substantiate"
              payload: {}
              as: MarketingManager
            - call: "GET /impact-program/liabilities"
              payload: { donation_product_id: "${prod_id}", impact_season_id: "${s_id}" }
              as: ImpactAuditor
              captures: { liab_v: "$.data[0].version" }
          trigger:
            - call: "POST /impact-program/marketing-claims/${claim_id}/derive-build"
              payload: { expected_liability_version: "${liab_v}" }
              as: MarketingManager
              captures: { first_sub: $.data.substantiated_donation_units, first_ratio: $.data.substantiated_ratio_value }
            - call: "GET /impact-program/liabilities"
              payload: { donation_product_id: "${prod_id}", impact_season_id: "${s_id}" }
              as: ImpactAuditor
              captures: { liab_v2: "$.data[0].version" }
            - call: "POST /impact-program/marketing-claims/${claim_id}/derive-build"
              payload: { expected_liability_version: "${liab_v2}" }
              as: MarketingManager
          assert:
            - "MarketingClaim.${claim_id}.status == SUBSTANTIATED after the first derive-build"
            - "the second derive-build leaves substantiated_donation_units equal to the ${first_sub} value captured from the first"
            - "MarketingClaim.${claim_id}.substantiated_ratio_value == 1.0 and required_stated_units == 1000"
            - "MarketingClaim.${claim_id}.status is still SUBSTANTIATED, not OVERSTATED"

      - name: a_season_window_reset_reopens_the_capture_asset
        claim_type: conditional_feature_flags
        grounds:
          - state_machines.SalesOrderLine.OPEN_to_RETURN_REQUESTED
          - validations[priority=13]
          - entities.SalesOrderLine.fields.return_window_days
        distinguishing_aspect: "A second transition into RETURN_REQUESTED is declared only for a line whose owning season has not yet opened, so the identical return request is refused for a line attached to an open season and accepted for one attached to a season still PLANNED."
        test_recipe:
          setup:
            - "Logical clock at the default; one paid order whose 30-day window has expired 40 days ago, with the season still PLANNED."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - *c_oline
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/sales-orders/${ord_id}/lines/${soline_id}"
              payload: {}
              as: CustomerService
              captures: { soline_v: $.data.version }
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/return-requests"
              payload: { request_reason: "CHANGE_OF_MIND", requested_units: 1, is_exchange: false, expected_line_version: "${soline_v}" }
              as: CustomerService
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_RETURN_WINDOW_CLOSED, because the owning season is PLANNED and the window reset does not apply"
            - "after the season is opened the identical request still returns 422, so the flag is season-scoped rather than global"
            - "the line's obligated_units == 2 and the liability's final_liability_units == 2 are unchanged by the refused request"

      - name: rolling_the_clock_across_the_freeze_boundary_freezes_every_liability_at_once
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.ImpactSeason.OPEN_to_FROZEN
          - state_machines.DonationLiability.ACCUMULATING_to_FROZEN
        distinguishing_aspect: "A single clock roll performs the deferred season action deterministically: every liability for the running season moves to FROZEN together and the roll reports the transitions it applied rather than mutating only the clock."
        test_recipe:
          setup:
            - "Logical clock at the default; two products each with a paid 5-unit order in the running season."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - *c_oline
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Roll Probe Vest", product_kind: "APPAREL_TOP", design_channel: "DONATION_ONLY", obligation_model: "AT_VESTING", approved_donation_ratio_units: 1, retail_price_cents: 2400, unit_cost_cents: 1500, is_reusable: true }
              as: ProductDesigner
              captures: { prod2_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod2_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod2_id}/lines"
              payload: { gtin: "00000000000501", unit_size_label: "M", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline2_id: $.data.id }
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-ROLL-2", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord2_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord2_id}/lines"
              payload: { donation_product_line_id: "${pline2_id}", quantity: 5, unit_price_cents: 2400, line_discount_cents: 0 }
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord2_id}/pay"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
          assert:
            - "the response status is 200 and data.current_utc == 2026-12-02T00:00:00Z"
            - "ImpactSeason.${s_id}.status == FROZEN after the roll"
            - "GET /impact-program/liabilities?impact_season_id=${s_id} returns 2 rows, both with status FROZEN and frozen_units equal to their final_liability_units"
            - "ImpactSeason.${s_id}.claim_frozen_units_total == 10"
            - "the roll response's rollover_events names both season and liability transitions"

      - name: suspension_cascade_already_exercised_by_difficulty_rule_four
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GivingPartner.APPROVED_to_SUSPENDED
        excluded_because:
          difficulty_instance: partner_suspension_hops_to_capacity_to_allocation_to_claim
          rationale: "The four-hop suspension cascade and every hop's assertion are covered by the named §1.8 instance."

      - name: soft_deleted_product_exclusion_already_exercised_by_difficulty_rule_seven
        claim_type: soft_delete
        grounds:
          - entities.DonationProduct.fields.status
          - endpoints.GET_/impact-program/donation-products
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_substantiation_blocks_the_audit_finalization_that_grades_partners
          rationale: "Archival and the status-filtered product listing are reached through the named §1.8 instance's product lifecycle; the corner is deferred rather than duplicated here."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: derived_fields_are_visible_in_the_creating_response_without_a_reread
        claim_type: immediate
        grounds:
          - entities.DonationAllocation.fields.rank_score
          - entities.PartnerCapacityProfile.fields.committed_units
          - complexity_profile.consistency_model
        distinguishing_aspect: "The model is immediate, so the commit response already carries the recomputed rank score and the partner's capacity profile already reports the debited committed units in the same request."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a 500-unit ceiling and one claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - call: "POST /impact-program/giving-partners/${p_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_id: $.data.id }
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 120, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id, in_response_rank: $.data.rank_score }
          assert:
            - "the commit response already carries a non-null rank_score equal to ${in_response_rank}"
            - "the immediate GET /impact-program/capacity-profiles/${cap_id} reports committed_units == 120 and capacity_utilization_units == 120"
            - "the immediate GET /impact-program/giving-partners/${p_id} reports capacity_utilization_units == 120"
            - "no retry or delay is needed before either reading reflects the commit"
