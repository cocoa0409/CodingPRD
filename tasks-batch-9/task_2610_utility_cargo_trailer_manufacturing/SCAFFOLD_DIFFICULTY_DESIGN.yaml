  - rule_id: boundary_precision_check
    instances:
      - name: brake_requirement_inclusive_at_gvwr_exactly_3000
        grounds:
          - calculations.regulatory_equipment_requirements.constants.BRAKE_REQUIRED_GVWR_LBS
          - calculations.gvwr_rating
          - validations[priority=63]
          - errors.ERR_BRAKE_REQUIREMENT_UNMET
        distinguishing_aspect: |
          Straddles BRAKE_REQUIRED_GVWR_LBS = 3000 with two models whose only difference is 10 lb of
          frame rating, landing the pinned certified GVWR on exactly 3000 and on 2990, proving the
          comparison is >= and not >. It is a weight-threshold boundary on a UNIT-pinned integer, not a
          millimetre tolerance boundary on an inspection measurement.
        test_recipe:
          setup:
            - "Model SA-5X8H: axle_count 1, axle_rating_lbs 3400, tire_load_rating_lbs 1750, frame_design_rated_lbs 3340, coupler_rating_lbs 3600, design_braked_axle_count 0 -> min 3340, derate 0.90 = 3006, floored to 3000."
