# =============================================================================
# §1.9 Scaffold Corner Design — Wire Transfer Operations & Sanctions
# Breadth coverage of every testable claim §1.8 does not already cover.
# claim_type values per references/claim-extraction-guide.md.
# Clock: server default logical time is 2026-08-01T00:00:00Z unless a chain
# sets it explicitly via POST /wire-ops/_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  # ============================================================ 1. entities
  - section: entities
    instances:
      - name: create_wire_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds: ["endpoints[POST /wire-ops/wires]", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "Omitting required field `purpose` from wire initiation is rejected with ERR_INVALID_REQUEST (400) before any state or business rule is evaluated."
        test_recipe:
          setup:
            - "Customer CE1 (MEDIUM), Account AE1 (limit 250000000), Beneficiary BE1"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Corner One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { ce1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${ce1}", account_number: "A-E001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ae1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${ce1}", name: "Corner Ben", bank_name: "CornerBank", account_number: "B-E001", country_code: "US" }, as: WireOperator, captures: { be1: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ae1}", beneficiary_id: "${be1}", amount_cents: 500000, method: "Fedwire" }, as: WireOperator, as_user_id: "op-1", captures: { e1_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${e1_err}), HTTP 400; no WireTransfer is created for account ${ae1}"

      - name: wire_create_defaults_applied
        claim_type: defaults_applied
        grounds: ["entities.WireTransfer.fields.currency", "entities.WireTransfer.fields.priority", "entities.WireTransfer.fields.charge_mode", "entities.Account.fields.currency"]
        distinguishing_aspect: "Omitting currency, priority, and charge_mode at creation applies the declared defaults USD / NORMAL / OUR."
        test_recipe:
          setup:
            - "Customer CE2 (MEDIUM), Account AE2 (limit 250000000), Beneficiary BE2"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Corner Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { ce2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${ce2}", account_number: "A-E002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ae2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${ce2}", name: "Ben Two", bank_name: "BankTwo", account_number: "B-E002", country_code: "US" }, as: WireOperator, captures: { be2: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ae2}", beneficiary_id: "${be2}", amount_cents: 500000, method: "CHIPS", purpose: "defaults probe" }, as: WireOperator, as_user_id: "op-1", captures: { e2_cur: $.data.currency, e2_prio: $.data.priority, e2_cm: $.data.charge_mode, e2_status: $.data.status } }
          assert:
            - "currency == USD (${e2_cur}), priority == NORMAL (${e2_prio}), charge_mode == OUR (${e2_cm})"
            - "status == INITIATED (${e2_status}) and version == 1 on creation"

      - name: wire_create_computed_field_input_rejected
        claim_type: computed_field_ignored
        grounds: ["entities.WireTransfer.fields.risk_score", "entities.WireTransfer.fields.requires_callback", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied values for computed fields (risk_score) are not accepted: strict request schema rejects the unknown key with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Customer CE3 (MEDIUM), Account AE3 (limit 250000000), Beneficiary BE3"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Corner Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { ce3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${ce3}", account_number: "A-E003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ae3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${ce3}", name: "Ben Three", bank_name: "BankThree", account_number: "B-E003", country_code: "US" }, as: WireOperator, captures: { be3: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ae3}", beneficiary_id: "${be3}", amount_cents: 500000, method: "Fedwire", purpose: "computed probe", risk_score: 99 }, as: WireOperator, as_user_id: "op-1", captures: { e3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (${e3_err}) — computed field risk_score is server-owned and not part of the creation schema"

      - name: audit_log_entries_immutable_and_append_only
        claim_type: immutability
        grounds: ["entities.AuditLogEntry", "endpoints[GET /wire-ops/audit-logs]"]
        distinguishing_aspect: "AuditLogEntry carries common_fields: false (id + created_at only, no version) and the API surface exposes no update or delete for it: mutating actions append entries that are only ever listed."
        test_recipe:
          setup:
            - "Customer CE4 (MEDIUM), Account AE4 (limit 250000000), Beneficiary BE4, BusinessDate 2026-08-21 OPEN, one wire submitted"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Corner Four", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { ce4: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${ce4}", account_number: "A-E004", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ae4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${ce4}", name: "Ben Four", bank_name: "BankFour", account_number: "B-E004", country_code: "US" }, as: WireOperator, captures: { be4: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-21" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ae4}", beneficiary_id: "${be4}", amount_cents: 100000, method: "Fedwire", purpose: "audit probe" }, as: WireOperator, as_user_id: "op-1", captures: { we4: $.data.id } }
            - { call: "POST /wire-ops/wires/${we4}/submit", payload: { business_date: "2026-08-21" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "GET /wire-ops/audit-logs", payload: { wire_id: "${we4}" }, as: Auditor, captures: { e4_a0: "$.data[0].id", e4_a1: "$.data[1].id" } }
          assert:
            - "At least two AuditLogEntry rows exist for wire ${we4} (wire.initiate then a submit-related entry), each with actor_user_id, actor_role, action, entity_type, entity_id populated"
            - "Entries expose id and created_at but no version field; no PUT/PATCH/DELETE endpoint exists for /wire-ops/audit-logs in §1.5"

      - name: get_nonexistent_wire_returns_not_found
        claim_type: not_found
        grounds: ["endpoints[GET /wire-ops/wires/{wireId}]", "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Reading a well-formed but unknown wire id returns ERR_NOT_FOUND (404), not a generic 400."
        test_recipe:
          setup:
            - "Empty database (no setup entities required)"
          setup_api_calls: []
          trigger:
            - { call: "GET /wire-ops/wires/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: WireOperator, captures: { e5_err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (${e5_err}), HTTP 404"

      - name: list_customers_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /wire-ops/customers]"]
        distinguishing_aspect: "List responses carry the fixed pagination envelope: limit default 10, has_more and total_count consistent across offset pages."
        test_recipe:
          setup:
            - "Exactly two customers exist (CP1, CP2)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Page One", risk_rating: "LOW" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Page Two", risk_rating: "HIGH", high_risk_jurisdiction: true }, as: WireOpsAdmin }
          trigger:
            - { call: "GET /wire-ops/customers", payload: { limit: 1, offset: 0 }, as: Auditor, captures: { p0_total: $.data } }
            - { call: "GET /wire-ops/customers", payload: { limit: 1, offset: 1 }, as: Auditor }
          assert:
            - "Page 1 returns exactly 1 customer, total_count == 2, has_more == true"
            - "Page 2 returns exactly 1 customer (the other one), has_more == false"
            - "Every response envelope carries meta.api_request_id and meta.api_request_timestamp, response_type == array"

      - name: beneficiary_with_unknown_customer_returns_not_found
        claim_type: parent_relationship
        grounds: ["entities.Beneficiary.fields.customer_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-supplied FK (customer_id) pointing at a nonexistent customer is rejected with ERR_NOT_FOUND (404) — referential existence is validated even though the id arrives in the body."
        test_recipe:
          setup:
            - "No customers exist"
          setup_api_calls: []
          trigger:
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "Ghost Ben", bank_name: "GhostBank", account_number: "B-G001", country_code: "US" }, as: WireOperator, captures: { e7_err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (${e7_err}), HTTP 404"

  # ===================================================== 2. state machines
  - section: state_machines
    instances:
      - name: wire_above_threshold_initial_state_callback_pending
        claim_type: initial_state
        grounds: ["state_machines.WireTransfer", "state_machines.CallbackVerification", "calculations.callback_requirement"]
        distinguishing_aspect: "A wire strictly above the callback threshold starts in CALLBACK_PENDING (not INITIATED) with a linked OPEN CallbackVerification whose expires_at is exactly opened_at + 4h."
        test_recipe:
          setup:
            - "Customer CS1 (MEDIUM), Account AS1 (limit 500000000), Beneficiary BS1"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs1}", account_number: "A-S001", daily_outgoing_limit_cents: 500000000 }, as: WireOpsAdmin, captures: { as1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs1}", name: "SM Ben", bank_name: "SMBank", account_number: "B-S001", country_code: "US" }, as: WireOperator, captures: { bs1: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as1}", beneficiary_id: "${bs1}", amount_cents: 200000000, method: "Fedwire", purpose: "initial state" }, as: WireOperator, as_user_id: "op-1", captures: { s1_w: $.data.id, s1_status: $.data.status, s1_cb: $.data.callback_status, s1_req: $.data.requires_callback } }
            - { call: "GET /wire-ops/wires/${s1_w}/callbacks", as: WireOperator, captures: { s1_cb_id: "$.data[0].id", s1_cb_status: "$.data[0].status", s1_cb_open: "$.data[0].opened_at", s1_cb_exp: "$.data[0].expires_at" } }
          assert:
            - "WireTransfer.${s1_w}.status == CALLBACK_PENDING (${s1_status}), callback_status == PENDING (${s1_cb}), requires_callback == true (${s1_req})"
            - "CallbackVerification.${s1_cb_id}.status == OPEN (${s1_cb_status}); expires_at == opened_at + 4 hours (${s1_cb_open} -> ${s1_cb_exp})"

      - name: reject_from_pending_approval_releases_reservation
        claim_type: side_effect_execution
        grounds: ["state_machines.WireTransfer.PENDING_APPROVAL_to_REJECTED", "entities.Account.fields.daily_reserved_cents"]
        distinguishing_aspect: "Rejecting a PENDING_APPROVAL wire moves it to REJECTED and debits the account's daily_reserved_cents by exactly the wire amount in the same call."
        test_recipe:
          setup:
            - "Customer CS2 (MEDIUM), Account AS2 (limit 250000000), Beneficiary BS2, BusinessDate 2026-08-24 OPEN, Wire WS2 (400000) submitted"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs2}", account_number: "A-S002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs2}", name: "SM Ben2", bank_name: "SMBank2", account_number: "B-S002", country_code: "US" }, as: WireOperator, captures: { bs2: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-24" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as2}", beneficiary_id: "${bs2}", amount_cents: 400000, method: "Fedwire", purpose: "reject probe" }, as: WireOperator, as_user_id: "op-1", captures: { s2_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s2_w}/submit", payload: { business_date: "2026-08-24" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/accounts/${as2}", as: WireOperator, captures: { s2_res_pre: $.data.daily_reserved_cents } }
          trigger:
            - { call: "POST /wire-ops/wires/${s2_w}/reject", payload: { reason: "duplicate" }, as: WireApprover, as_user_id: "ap-1", captures: { s2_status: $.data.status } }
            - { call: "GET /wire-ops/accounts/${as2}", as: WireOperator, captures: { s2_res_post: $.data.daily_reserved_cents } }
          assert:
            - "daily_reserved_cents was 400000 before (${s2_res_pre}) and 0 after (${s2_res_post})"
            - "WireTransfer.${s2_w}.status == REJECTED (${s2_status}) and reservation_active == false"

      - name: cancel_executed_wire_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WireTransfer", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCEL is defined only from INITIATED, CALLBACK_PENDING, PENDING_APPROVAL, REPAIR, and unheld APPROVED; from terminal EXECUTED it is rejected with ERR_INVALID_STATE and nothing changes."
        test_recipe:
          setup:
            - "Customer CS3 (MEDIUM), Account AS3 (limit 250000000), Beneficiary BS3, BusinessDate 2026-08-25 OPEN, Wire WS3 (100000) fully EXECUTED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs3}", account_number: "A-S003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs3}", name: "SM Ben3", bank_name: "SMBank3", account_number: "B-S003", country_code: "US" }, as: WireOperator, captures: { bs3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-25" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as3}", beneficiary_id: "${bs3}", amount_cents: 100000, method: "Fedwire", purpose: "cancel probe" }, as: WireOperator, as_user_id: "op-1", captures: { s3_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s3_w}/submit", payload: { business_date: "2026-08-25" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${s3_w}", as: WireOperator, captures: { s3_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${s3_w}/approve", payload: { expected_wire_version: "${s3_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${s3_w}", as: WireOperator, captures: { s3_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${s3_w}/approve", payload: { expected_wire_version: "${s3_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${s3_w}", as: WireOperator, captures: { s3_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${s3_w}/release", payload: { expected_wire_version: "${s3_v3}" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/wires/${s3_w}/cancel", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { s3_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${s3_w}", as: WireOperator, captures: { s3_status: $.data.status } }
          assert:
            - "error_id == ERR_INVALID_STATE (${s3_err}), HTTP 409"
            - "WireTransfer.${s3_w}.status remains EXECUTED (${s3_status})"

      - name: terminal_rejected_wire_rejects_submit_and_cancel
        claim_type: terminal_lockdown
        grounds: ["state_machines.WireTransfer", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED, every action endpoint (submit, cancel) is rejected with ERR_INVALID_STATE — terminal lockdown is total."
        test_recipe:
          setup:
            - "Customer CS4 (MEDIUM), Account AS4, Beneficiary BS4, BusinessDate 2026-08-26 OPEN, Wire WS4 (100000) submitted then REJECTED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Four", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs4: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs4}", account_number: "A-S004", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs4}", name: "SM Ben4", bank_name: "SMBank4", account_number: "B-S004", country_code: "US" }, as: WireOperator, captures: { bs4: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-26" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as4}", beneficiary_id: "${bs4}", amount_cents: 100000, method: "Fedwire", purpose: "lockdown probe" }, as: WireOperator, as_user_id: "op-1", captures: { s4_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s4_w}/submit", payload: { business_date: "2026-08-26" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires/${s4_w}/reject", payload: { reason: "compliance" }, as: WireApprover, as_user_id: "ap-1" }
          trigger:
            - { call: "POST /wire-ops/wires/${s4_w}/submit", payload: { business_date: "2026-08-26" }, as: WireOperator, as_user_id: "op-1", captures: { s4_err1: $.data.error_id } }
            - { call: "POST /wire-ops/wires/${s4_w}/cancel", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { s4_err2: $.data.error_id } }
          assert:
            - "submit from REJECTED: ${s4_err1} == ERR_INVALID_STATE; cancel from REJECTED: ${s4_err2} == ERR_INVALID_STATE"

      - name: double_submit_rejected
        claim_type: idempotency
        grounds: ["state_machines.WireTransfer.INITIATED_to_PENDING_APPROVAL", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-submitted wire (now PENDING_APPROVAL) is rejected with ERR_INVALID_STATE — submit is not idempotent and no second reservation is created."
        test_recipe:
          setup:
            - "Customer CS5 (MEDIUM), Account AS5, Beneficiary BS5, BusinessDate 2026-08-27 OPEN, Wire WS5 (100000) submitted once"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Five", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs5: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs5}", account_number: "A-S005", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as5: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs5}", name: "SM Ben5", bank_name: "SMBank5", account_number: "B-S005", country_code: "US" }, as: WireOperator, captures: { bs5: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-27" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as5}", beneficiary_id: "${bs5}", amount_cents: 100000, method: "Fedwire", purpose: "double submit" }, as: WireOperator, as_user_id: "op-1", captures: { s5_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s5_w}/submit", payload: { business_date: "2026-08-27" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/wires/${s5_w}/submit", payload: { business_date: "2026-08-27" }, as: WireOperator, as_user_id: "op-1", captures: { s5_err: $.data.error_id } }
            - { call: "GET /wire-ops/accounts/${as5}", as: WireOperator, captures: { s5_res: $.data.daily_reserved_cents } }
          assert:
            - "error_id == ERR_INVALID_STATE (${s5_err})"
            - "Account.${as5}.daily_reserved_cents == 100000 (${s5_res}) — the reservation was created exactly once"

      - name: fraud_hold_blocks_release_then_legitimate_clear_restores
        claim_type: side_effect_execution
        grounds: ["state_machines.FraudHold.NONE_to_OPEN", "state_machines.FraudHold.OPEN_to_CLEARED", "validations[priority=14]", "errors[ERR_WIRE_ON_HOLD]"]
        distinguishing_aspect: "Placing a fraud hold sets wire.hold_reason_code = FRAUD_HOLD and blocks release; customer confirmation LEGITIMATE clears the hold, leaves the wire APPROVED, and a subsequent release succeeds."
        test_recipe:
          setup:
            - "Customer CS6 (MEDIUM), Account AS6 (limit 250000000), Beneficiary BS6, BusinessDate 2026-08-28 OPEN"
            - "Wire WS6 (100000) submitted and dual-approved (APPROVED, CLEAR, no hold)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Six", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs6: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs6}", account_number: "A-S006", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as6: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs6}", name: "SM Ben6", bank_name: "SMBank6", account_number: "B-S006", country_code: "US" }, as: WireOperator, captures: { bs6: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-28" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as6}", beneficiary_id: "${bs6}", amount_cents: 100000, method: "Fedwire", purpose: "hold probe" }, as: WireOperator, as_user_id: "op-1", captures: { s6_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s6_w}/submit", payload: { business_date: "2026-08-28" }, as: WireOperator, as_user_id: "op-1" }
