  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: volunteer_same_person_overlap_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_VOLUNTEER_SHIFT_OVERLAP]", "validations[priority=8]"]
        distinguishing_aspect: "Same volunteer_handle with intersecting half-open shifts is rejected; back-to-back shifts (end == start) and a different volunteer at the same time are allowed."
        test_recipe:
          setup: ["Season PLANNING; day 06-06 SCHEDULED; volunteer 'vol-h' holds 08:00-12:00 SIGNED_UP"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Overlap Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-h", captures: { sh1: $.data.id } }
          trigger:
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "INFO", start_time: "2026-06-06T11:00:00Z", end_time: "2026-06-06T15:00:00Z" }, as: Volunteer, as_user_id: "vol-h", captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "INFO", start_time: "2026-06-06T12:00:00Z", end_time: "2026-06-06T16:00:00Z" }, as: Volunteer, as_user_id: "vol-h", captures: { sh2: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "INFO", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-i", captures: { sh3: $.data.id } }
          assert:
            - "11:00-15:00 for the same volunteer rejected with ERR_VOLUNTEER_SHIFT_OVERLAP (409)"
            - "12:00-16:00 back-to-back (end == start, half-open) accepted"
            - "Same 08:00-12:00 window for a DIFFERENT volunteer_handle accepted"

      - name: shift_confirm_and_closeout_state_guards
        claim_type: invalid_transition
        grounds: ["errors[ERR_SHIFT_NOT_CONFIRMABLE]", "errors[ERR_SHIFT_NOT_CLOSABLE]"]
        distinguishing_aspect: "confirm requires SIGNED_UP and close-out requires CONFIRMED: double-confirm and early close-out are both rejected."
        test_recipe:
          setup: ["Season PLANNING; day 06-06 SCHEDULED; shift SIGNED_UP"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "ShiftGuard Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-j", captures: { sh: $.data.id } }
          trigger:
            - { call: "POST /volunteer-shifts/${sh}/close-out", payload: { outcome: "WORKED" }, as: VolunteerCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /volunteer-shifts/${sh}/confirm", payload: {}, as: VolunteerCoordinator, captures: { st: $.data.status } }
            - { call: "POST /volunteer-shifts/${sh}/confirm", payload: {}, as: VolunteerCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "close-out while SIGNED_UP: ERR_SHIFT_NOT_CLOSABLE (409)"
            - "confirm succeeds (CONFIRMED); second confirm: ERR_SHIFT_NOT_CONFIRMABLE (409)"

      - name: day_operation_error_ladder
        claim_type: violation_to_error
        grounds: ["errors[ERR_DAY_NOT_COMPLETABLE]", "errors[ERR_DAY_NOT_TODAY]", "errors[ERR_DAY_NOT_STAFFABLE]", "errors[ERR_OPEN_SHIFTS_EXIST]"]
