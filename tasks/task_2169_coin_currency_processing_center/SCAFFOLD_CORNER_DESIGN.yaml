              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C52", bag_type: "CURRENCY", declared_amount_cents: 100000, declared_note_count: 100, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C52" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-C52-DOCK", observed_seal_number: "S-C52" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "GET /cash-vault/sealed-bags/${b_id}"
              payload: {}
              as: VaultTeller
