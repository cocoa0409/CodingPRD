              as_user_id: "worker-1"
              captures: { unsafe_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${unsafe_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${unsafe_youth_id}", program_id: "${unsafe_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { unsafe_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${unsafe_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { unsafe_gn_id: "$.data[0].id" }
          trigger:
            - call: "POST /ryhs/guardian-notifications/${unsafe_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { unsafe_err_id: $.data.error_id }
          assert:
