              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-CA-3", full_name: "Pat Rounding", date_of_birth: "1992-03-03" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-CA3", deductible_total_cents: 0, deductible_met_cents: 0, oop_max_cents: 99999999, oop_met_cents: 0, coinsurance_pct: 10 }
              as: Registrar
