              as: LRAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a2_id}", clause_id: "${c_id}", side: "EMPLOYER", title: "OT allowance", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
