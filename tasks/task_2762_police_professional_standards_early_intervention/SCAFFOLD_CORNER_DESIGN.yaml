              as: SystemAdmin
            - call: "POST /check-ins/${ci1_id}/complete"
              payload: { outcome: "SATISFACTORY", notes: "First monitoring meeting held on the due date." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /intervention-plans/${plan_id}/close"
              payload: { closing_note: "Premature closure attempt." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { err_pending: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /check-ins/${ci2_id}/complete"
              payload: { outcome: "SATISFACTORY", notes: "Second monitoring meeting held on the due date." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /intervention-plans/${plan_id}/close"
              payload: { closing_note: "Both check-ins complete." }
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "call 2: HTTP 200 with MonitoringCheckIn.${ci1_id}.status == COMPLETED, completed_at == 2026-08-11T00:00:00Z and on_time == true (completion exactly at due_at counts as on time)"
            - "call 3: HTTP 409 with ${err_pending} == ERR_PENDING_CHECKINS - the second check-in is still PENDING"
            - "after call 3: InterventionPlan.${plan_id}.status is still ACTIVE, compliance_score == null and closed_at == null"
            - "call 5: HTTP 200 with MonitoringCheckIn.${ci2_id}.status == COMPLETED and on_time == true"
            - "call 6: HTTP 200 with InterventionPlan.${plan_id}.status == CLOSED_SUCCESS, completed_checkin_count == 2, on_time_checkin_count == 2, concern_count == 0, compliance_score == 100.00 and closed_at == 2026-08-21T00:00:00Z"
            - "EarlyInterventionAlert.${alert_id}.status == CLOSED_SUCCESS and Officer.${bell_id}.open_alert_count == 0 with intervention_escalation_count == 0"

      - name: the_identity_requirement_switches_on_the_intake_channel
        claim_type: Conditional validation
        grounds:
          - validations[priority=12]
          - errors.ERR_COMPLAINANT_IDENTITY_REQUIRED
          - endpoints["POST /complaints"]
          - entities.Complaint.fields.intake_channel
        distinguishing_aspect: |
          The rule is two-sided and conditional on intake_channel: PUBLIC and SUPERVISOR intake
          demands both complainant_name and complainant_contact, while ANONYMOUS intake forbids
          both. An implementation that only enforces the presence half will accept an anonymous
          complaint carrying a name, which is the disclosure hazard the rule exists to prevent.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit and one PATROL_DIVISION unit with intake_enabled true exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Public complaint filed without any contact details.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}" }
              as: Complainant
              captures: { err_identity: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "ANONYMOUS", narrative: "Anonymous complaint that names its author anyway.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Ira Fox", complainant_contact: "ira@example.org" }
              as: Complainant
              captures: { err_named_anon: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "ANONYMOUS", narrative: "Anonymous complaint with no identifying details.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}" }
              as: Complainant
              captures: { anon_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Public complaint with full contact details.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Ira Fox", complainant_contact: "ira@example.org", complainant_demographic_code: "DG_C" }
              as: Complainant
              captures: { public_id: $.data.id }
          assert:
            - "call 1: HTTP 422 with ${err_identity} == ERR_COMPLAINANT_IDENTITY_REQUIRED - both identity fields are optional in the schema, so this is a business rule and not a schema rejection"
            - "call 2: HTTP 422 with ${err_named_anon} == ERR_COMPLAINANT_IDENTITY_REQUIRED - the anonymous half of the rule forbids the fields it requires elsewhere"
            - "call 3: HTTP 201 with Complaint.${anon_id}.intake_channel == ANONYMOUS, complainant_name == null, complainant_contact == null and intake_reference_code == null"
            - "call 4: HTTP 201 with Complaint.${public_id}.complainant_name == Ira Fox and a non-null intake_reference_code"
            - "the two accepted complaints carry consecutive intake_sequence values and the two refusals consumed none"

      - name: excluded_validation_priority_ordering_state_before_resource
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          The only ordering that an implementation is likely to get wrong is a state check at
          priority 8 against a resource-overlap check at priority 11, because the overlap is the
          more eye-catching defect and tempts an early return.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / investigation_state_check_outranks_officer_rest_buffer_conflict"
          rationale: |
            That instance constructs a request that violates both rules at once and asserts the
            state error, then repairs only the state to show the buffer error surfacing second.

      - name: excluded_validation_priority_conflict_duties_before_preponderance
        claim_type: Priority conflict
        grounds:
          - validations[priority=9]
          - validations[priority=12]
        distinguishing_aspect: |
          A commander who investigated the case and then disposes of it on insufficient evidence
          violates the segregation rule and the preponderance rule in the same call.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / segregation_of_duties_outranks_preponderance_shortfall"
          rationale: |
            That instance asserts the segregation error first and the preponderance error only
            after the actor is swapped, which is the whole priority-conflict claim.

      - name: excluded_validation_cascading_credibility_hold_before_retention
        claim_type: Cascading validation
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          A purge request can fail two ways at once, and the credibility hold must win so that a
          disclosure obligation is never reported as a mere retention-window problem.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / credibility_hold_outranks_retention_window"
          rationale: |
            That instance drives the purge with both conditions live, then releases the hold and
            advances the clock to show each guard in isolation.

  # =========================================================================
  # Guide section 5 - Endpoints (§1.5, 61 endpoints: 32 POST and 29 GET)
  # =========================================================================
  - section: endpoints
    instances:
      - name: reference_data_round_trips_through_create_read_and_filtered_list
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /units"]
          - endpoints["GET /units/{id}"]
          - endpoints["GET /units"]
          - endpoints["GET /hearing-rooms"]
        distinguishing_aspect: |
          The two reference entities are the only rows created without a parent, so they are where
          the plain CRUD contract is observable: 201 on create with the generated id, 200 on the
          single read returning the same field values, and a list read that honours its declared
          filters and returns the pagination envelope. The list filters are declared per endpoint
          (unit_role and peer_group_code for units, facility_code for rooms) and an undeclared
          filter must not silently reduce the result set.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z and no units or hearing rooms exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60 }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "GET /units/${patrol_unit_id}"
              payload: {}
              as: IACommander
            - call: "GET /units"
              payload: { unit_role: "PATROL_DIVISION", limit: 10, offset: 0 }
              as: IACommander
            - call: "GET /units"
              payload: { peer_group_code: "PG_IA", limit: 10, offset: 0 }
              as: IACommander
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 2, recording_enabled: true }
              as: SystemAdmin
              captures: { room1_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "WEST", room_name: "Interview 2", concurrent_capacity: 1 }
              as: SystemAdmin
              captures: { room2_id: $.data.id }
            - call: "GET /hearing-rooms/${room2_id}"
              payload: {}
              as: IACommander
            - call: "GET /hearing-rooms"
              payload: { facility_code: "HQ", limit: 10, offset: 0 }
              as: IACommander
          assert:
            - "calls 1, 2, 6 and 7: HTTP 201 each with a non-null id and version 1"
            - "call 2: Unit.${patrol_unit_id}.intake_enabled == true - the declared default applies when the key is omitted"
            - "call 3: HTTP 200 with name == Patrol North, unit_role == PATROL_DIVISION, command_code == PN, peer_group_code == PG_NORTH and sworn_headcount == 60"
            - "call 4: HTTP 200 with total_count == 1 and the only row is ${patrol_unit_id}"
            - "call 5: HTTP 200 with total_count == 1 and the only row is ${ia_unit_id}"
            - "call 8: HTTP 200 with room_name == Interview 2, concurrent_capacity == 1 and recording_enabled == false from the declared default"
            - "call 9: HTTP 200 with total_count == 1 and the only row is ${room1_id} - the WEST room is filtered out by facility_code"
            - "every list response carries the data, total, limit and offset envelope"

      - name: the_employment_action_moves_one_dimension_and_locks_at_separated
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /officers/{id}/employment-status"]
          - state_machines.Officer
          - errors.ERR_OFFICER_SEPARATED
          - entities.Officer.fields.employment_status
        distinguishing_aspect: |
          This is an action endpoint, not a general update: it accepts only the target
          employment_status and a reason, moves exactly that dimension, and leaves the risk
          dimension, the ledger and the case load untouched. It is also the only route into the
          terminal SEPARATED state, so the follow-up call that tries to revive a separated officer
          must be refused with ERR_OFFICER_SEPARATED rather than silently succeeding.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Officer Vance, employment_status ACTIVE, eis_alert_level NONE, imposed_suspension_days_total 0 and open_case_load 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /officers/${subj_id}/employment-status"
              payload: { employment_status: "RELIEVED_OF_DUTY", reason: "Pending review of a use-of-force report." }
              as: SystemAdmin
            - call: "GET /officers/${subj_id}"
              payload: {}
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/employment-status"
              payload: { employment_status: "SEPARATED", reason: "Resignation accepted." }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/employment-status"
              payload: { employment_status: "ACTIVE", reason: "Attempted reinstatement outside the appeal process." }
              as: SystemAdmin
              captures: { err_sep: "$.data.error_id" }
          assert:
            - "call 1: HTTP 200 with Officer.${subj_id}.employment_status == RELIEVED_OF_DUTY"
            - "call 2: badge_number, unit_id, annual_salary_cents, certification_level and hire_date are unchanged; eis_score == 0, eis_alert_level == NONE, open_case_load == 0, imposed_suspension_days_total == 0 and suspension_end_date == null"
            - "call 3: HTTP 200 with employment_status == SEPARATED - RELIEVED_OF_DUTY to SEPARATED is a declared transition"
            - "call 4: HTTP 409 with ${err_sep} == ERR_OFFICER_SEPARATED and employment_status still SEPARATED"
            - "the officer row still exists and is readable after separation - the action never deletes"

      - name: one_eis_run_evaluates_every_officer_and_reports_its_counters
        claim_type: Bulk action
        grounds:
          - endpoints["POST /eis-runs"]
          - calculations.eis_composite_score
          - state_machines.EarlyInterventionAlert
          - entities.EarlyInterventionAlert.fields.run_sequence
        distinguishing_aspect: |
          The sweep is the only endpoint that touches every officer in one call, and its response
          is a counter block rather than an entity, so the claim is that each counter reports only
          what the run actually did. Three officers give three different outcomes in the same run:
          an officer whose stale WATCH alert must be refreshed to 55.00 and promoted, an officer
          whose alert refreshes but stays below the ALERT band and therefore is not promoted, and
          an officer with no events at all who must be evaluated without producing a row.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Sergeant Doyle, Officer Pratt, Officer Quinn and Officer Reeve."
            - "Pratt has three USE_OF_FORCE LEVEL_3 events (2026-07-01, 2026-07-10, 2026-07-20) so eis_score is 55.00 while the alert opened by the second ingest still reads 30.00 WATCH; Quinn has two such events and sits at 30.00; Reeve has none."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-801", full_name: "Officer Pratt", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2016-06-06T00:00:00Z" }
              as: SystemAdmin
              captures: { pratt_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-802", full_name: "Officer Quinn", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2016-06-06T00:00:00Z" }
              as: SystemAdmin
              captures: { quinn_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-803", full_name: "Officer Reeve", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_C", hire_date: "2016-06-06T00:00:00Z" }
              as: SystemAdmin
              captures: { reeve_id: $.data.id }
            - call: "POST /officers/${pratt_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T12:00:00Z", source_reference: "P-1" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${pratt_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-10T12:00:00Z", source_reference: "P-2" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${pratt_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-20T12:00:00Z", source_reference: "P-3" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${quinn_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T12:00:00Z", source_reference: "Q-1" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /officers/${quinn_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-20T12:00:00Z", source_reference: "Q-2" }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /eis-runs"
              payload: {}
              as: SystemAdmin
            - call: "GET /eis-alerts"
              payload: { officer_id: "${pratt_id}" }
              as: SystemAdmin
              captures: { pratt_alert_id: "$.data[0].id" }
            - call: "GET /eis-alerts"
              payload: { officer_id: "${quinn_id}" }
              as: SystemAdmin
              captures: { quinn_alert_id: "$.data[0].id" }
            - call: "GET /eis-alerts"
              payload: { officer_id: "${reeve_id}" }
              as: SystemAdmin
          assert:
            - "call 1: HTTP 200 with run_sequence == 1, evaluated_officer_count == 4 (every officer on the roster, including the supervisor and the event-free officer), alerts_created == 0, alerts_promoted == 1, checkins_missed == 0 and disclosures_expired == 0"
            - "call 2: EarlyInterventionAlert.${pratt_alert_id}.composite_score == 55.00, alert_level == ALERT, status == PLAN_REQUIRED, run_sequence == 1 and review_due_at == 2026-08-31T00:00:00Z"
            - "call 3: EarlyInterventionAlert.${quinn_alert_id}.composite_score == 30.00, alert_level == WATCH, status is still OPEN and run_sequence == null - a refresh that does not reach the ALERT band is not a promotion"
            - "call 4: HTTP 200 with total_count == 0 - evaluating an officer with no events creates nothing"
            - "Officer.${pratt_id}.eis_score == 55.00, Officer.${quinn_id}.eis_score == 30.00, Officer.${reeve_id}.eis_score == 0 and Officer.${sup_id}.eis_score == 0"
            - "Officer.${pratt_id}.open_alert_count == 1 and Officer.${quinn_id}.open_alert_count == 1 - promotion does not double-count"

      - name: allegation_lists_resolve_both_of_their_foreign_keys
        claim_type: Cross-reference link
        grounds:
          - endpoints["GET /allegations"]
          - endpoints["POST /complaints/{id}/allegations"]
          - entities.Allegation.fields.complaint_id
          - entities.Allegation.fields.subject_officer_id
        distinguishing_aspect: |
          Allegation is the join between a complaint and an accused officer, so the same row must
          be reachable from either side and the two filters must compose. Three allegations across
          two complaints and two officers make every combination distinguishable: filtering by
          complaint returns two rows, filtering by officer returns two different rows, and
          combining both filters returns exactly the single row in the intersection.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes; Patrol North holds Sergeant Doyle, Officer Vance and Officer Winters."
            - "Complaint one carries allegations against Vance and Winters; complaint two carries one allegation against Vance. All three are PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-502", full_name: "Officer Winters", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2021-03-01T00:00:00Z" }
              as: SystemAdmin
              captures: { subj2_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Two officers failed to file reports for the same shift.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "Vance filed nothing.", offense_class: "C" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
