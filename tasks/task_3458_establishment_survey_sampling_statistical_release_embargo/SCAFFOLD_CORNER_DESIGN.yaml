# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Establishment Survey Sampling & Statistical Release Embargo
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Instance names are unique across both files.
# =============================================================================
scaffold_corner_design:
  # ===============================================================
  # Section: entities
  # ===============================================================
  - section: entities
    instances:
      - name: program_create_applies_config_defaults
        claim_type: defaults
        grounds: ["entities.SurveyProgram.fields.embargo_window_minutes", "entities.SurveyProgram.fields.annual_burden_budget_minutes"]
        distinguishing_aspect: "Omitting the optional config fields applies the declared defaults (embargo_window_minutes 30, annual_burden_budget_minutes 120) and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { ew: $.data.embargo_window_minutes, bb: $.data.annual_burden_budget_minutes, ver: $.data.version } }
          assert:
            - "ew == 30 and bb == 120 (defaults applied)"
            - "ver == 1 and id/created_at/updated_at server-minted"

      - name: program_create_missing_code_rejected
        claim_type: required_fields
        grounds: ["entities.SurveyProgram.fields.code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field code yields ERR_VALIDATION 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /survey/programs", payload: { name: "No Code Program", sample_budget: 3 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and http status == 400"

      - name: duplicate_establishment_ein_rejected
        claim_type: type_constraints
        grounds: ["entities.Establishment.fields.ein", "errors[ERR_DUPLICATE_ESTABLISHMENT]"]
        distinguishing_aspect: "Second establishment with the same ein is rejected with ERR_DUPLICATE_ESTABLISHMENT (409)."
        test_recipe:
          setup: ["one establishment with ein 11-0000001 already registered"]
          setup_api_calls:
            - { call: "POST /survey/establishments", payload: { ein: "11-0000001", name: "Alpha", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /survey/establishments", payload: { ein: "11-0000001", name: "Alpha Clone", industry_code: RETAIL, size_class: LARGE }, as: CollectionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_ESTABLISHMENT and http status == 409"

      - name: enrollment_weight_snapshot_survives_frame_replacement
        claim_type: computed_fields
        grounds: ["calculations.base_sampling_weight", "state_machines.SampleFrame.FROZEN_to_SUPERSEDED", "entities.PanelEnrollment.fields.base_weight"]
        distinguishing_aspect: "base_weight is a snapshot from the frame FROZEN at enrollment time: replacing the frame (FROZEN -> SUPERSEDED) and re-freezing with a smaller stratum changes NEW enrollments' weight to 16.666667 while the existing enrollment keeps 33.333333."
        test_recipe:
          setup:
            - "Program CES (budget 3); frame F1 2026-Q3 stratum (MANUFACTURING,SMALL,100) frozen (allocation 3 -> weight 33.333333)"
            - "E1 enrolled (weight snapshot 33.333333)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { f1: $.data.id } }
            - { call: "POST /survey/sample-frames/${f1}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002001", name: "Snap-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002002", name: "Snap-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id, w1: $.data.base_weight } }
            - { call: "GET /survey/programs", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data[0].version" } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 50 }], expected_program_version: "${prog_v2}", replaces_frame_id: "${f1}" }, as: ProgramAdmin, captures: { f2: $.data.id } }
            - { call: "POST /survey/sample-frames/${f2}/freeze", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id, w2: $.data.base_weight } }
            - { call: "GET /survey/panel-enrollments/${en1}", payload: {}, as: CollectionOfficer, captures: { w1_after: $.data.base_weight } }
            - { call: "GET /survey/sample-frames/${f1}", payload: {}, as: ProgramAdmin, captures: { f1_status: $.data.frame_status, f1_repl: $.data.replaced_by_frame_id } }
          assert:
            - "w1 == 33.333333 and w1_after == 33.333333 (snapshot unchanged by frame replacement)"
            - "w2 == 16.666667 (50/3, round_half_up to 6 decimals) — new enrollments read the replacement frame"
            - "f1_status == SUPERSEDED and f1_repl == ${f2}"

      - name: report_created_in_submitted_initial_state
        claim_type: initial_state
        grounds: ["state_machines.ResponseReport", "entities.ResponseReport.fields.submit_count"]
        distinguishing_aspect: "Electronic submission creates the report directly in SUBMITTED with submit_count == 1 and a 15-minute burden charge."
        test_recipe:
          setup: ["program/frame frozen; E1 enrolled/accepted; September cycle COLLECTING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002101", name: "IS-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
          trigger:
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { st: $.data.report_status, sc: $.data.submit_count, sub_at: $.data.submitted_at } }
          assert:
            - "st == SUBMITTED and sc == 1"
            - "sub_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"
            - "enrollment burden_minutes_ytd == 15"

      - name: missing_entities_return_404_on_read_paths
        claim_type: not_found
        grounds: ["errors[ERR_RELEASE_NOT_FOUND]", "errors[ERR_GRANT_NOT_FOUND]", "errors[ERR_ESTIMATE_NOT_FOUND]", "errors[ERR_ENROLLMENT_NOT_FOUND]"]
        distinguishing_aspect: "Read endpoints on never-existent UUIDs return the entity-specific 404 error id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /survey/release-events/11111111-1111-4111-8111-111111111111", payload: {}, as: ReleaseManager, captures: { err_rel: $.data.error_id } }
            - { call: "GET /survey/embargo-grants/22222222-2222-4222-8222-222222222222", payload: {}, as: ReleaseManager, captures: { err_grant: $.data.error_id } }
            - { call: "GET /survey/cell-estimates/33333333-3333-4333-8333-333333333333", payload: {}, as: EstimationAnalyst, captures: { err_est: $.data.error_id } }
            - { call: "GET /survey/panel-enrollments/44444444-4444-4444-8444-444444444444", payload: {}, as: CollectionOfficer, captures: { err_enr: $.data.error_id } }
          assert:
            - "err_rel == ERR_RELEASE_NOT_FOUND and err_grant == ERR_GRANT_NOT_FOUND and err_est == ERR_ESTIMATE_NOT_FOUND and err_enr == ERR_ENROLLMENT_NOT_FOUND (all http 404)"

      - name: missing_entities_return_404_on_action_paths
        claim_type: not_found
        grounds: ["errors[ERR_CYCLE_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]", "errors[ERR_FACTOR_SET_NOT_FOUND]", "errors[ERR_BENCHMARK_NOT_FOUND]", "errors[ERR_NOTICE_NOT_FOUND]", "errors[ERR_FRAME_NOT_FOUND]", "errors[ERR_OUTLET_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_PROGRAM_NOT_FOUND]", "errors[ERR_ESTABLISHMENT_NOT_FOUND]"]
        distinguishing_aspect: "Action endpoints on never-existent ids (and body references to missing program/establishment) return the entity-specific 404 error id."
        test_recipe:
          setup: ["one program CES exists"]
          setup_api_calls:
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /survey/survey-cycles/11111111-1111-4111-8111-111111111111/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer, captures: { e_cyc: $.data.error_id } }
            - { call: "POST /survey/follow-up-cases/22222222-2222-4222-8222-222222222222/advance", payload: { action: ESCALATE }, as: CollectionOfficer, captures: { e_case: $.data.error_id } }
            - { call: "POST /survey/seasonal-factor-sets/33333333-3333-4333-8333-333333333333/finalize", payload: {}, as: SurveyMethodologist, captures: { e_fs: $.data.error_id } }
            - { call: "POST /survey/benchmark-runs/44444444-4444-4444-8444-444444444444/apply", payload: {}, as: SurveyMethodologist, captures: { e_ben: $.data.error_id } }
            - { call: "POST /survey/methodology-notices/55555555-5555-4555-8555-555555555555/advance", payload: { action: ANNOUNCE }, as: SurveyMethodologist, captures: { e_not: $.data.error_id } }
            - { call: "POST /survey/sample-frames/66666666-6666-4666-8666-666666666666/freeze", payload: {}, as: ProgramAdmin, captures: { e_frm: $.data.error_id } }
            - { call: "POST /survey/media-outlets/77777777-7777-4777-8777-777777777777/accreditation", payload: { action: ACCREDIT }, as: ReleaseManager, captures: { e_out: $.data.error_id } }
            - { call: "POST /survey/response-reports/88888888-8888-4888-8888-888888888888/advance", payload: { action: ACCEPT }, as: CollectionOfficer, captures: { e_rep: $.data.error_id } }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "NOPE", reference_month: "2026-09" }, as: ProgramAdmin, captures: { e_prg: $.data.error_id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "99999999-9999-4999-8999-999999999999", program_code: "CES" }, as: CollectionOfficer, captures: { e_est: $.data.error_id } }
          assert:
            - "e_cyc == ERR_CYCLE_NOT_FOUND, e_case == ERR_CASE_NOT_FOUND, e_fs == ERR_FACTOR_SET_NOT_FOUND, e_ben == ERR_BENCHMARK_NOT_FOUND, e_not == ERR_NOTICE_NOT_FOUND, e_frm == ERR_FRAME_NOT_FOUND, e_out == ERR_OUTLET_NOT_FOUND, e_rep == ERR_REPORT_NOT_FOUND, e_prg == ERR_PROGRAM_NOT_FOUND, e_est == ERR_ESTABLISHMENT_NOT_FOUND (all http 404)"

      - name: list_pagination_and_status_filtering
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /survey/panel-enrollments"]
        distinguishing_aspect: "limit/offset paginate deterministically: 3 enrollments -> page 1 (limit 2) has has_more == true and total_count == 3; page 2 has 1 row; status filter narrows to the matching subset."
        test_recipe:
          setup: ["program/frame frozen; E1,E2,E3 enrolled (INVITED; only E1 accepted -> ENROLLED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002201", name: "PG-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002202", name: "PG-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002203", name: "PG-E3", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e3: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e3}", program_code: "CES" }, as: CollectionOfficer, captures: { en3: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
          trigger:
            - { call: "GET /survey/panel-enrollments", payload: { program_code: "CES", limit: 2, offset: 0 }, as: CollectionOfficer }
            - { call: "GET /survey/panel-enrollments", payload: { program_code: "CES", limit: 2, offset: 2 }, as: CollectionOfficer }
            - { call: "GET /survey/panel-enrollments", payload: { program_code: "CES", enrollment_status: ENROLLED }, as: CollectionOfficer, captures: { only_enrolled: "$.data[0].id" } }
          assert:
            - "page 1 returns 2 rows with total_count == 3 and has_more == true"
            - "page 2 (offset 2) returns exactly 1 row with has_more == false"
            - "ENROLLED filter returns exactly 1 row and only_enrolled == ${en1}"

      - name: error_envelope_shape_is_fixed
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_RELEASE_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type == 'error' and data.error_id + data.message; meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /survey/release-events/11111111-1111-4111-8111-111111111111", payload: {}, as: ReleaseManager, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "response_type == 'error'; err == ERR_RELEASE_NOT_FOUND; msg is a non-empty string; meta.api_request_id present"
  # ===============================================================
  # Section: state_machines
  # ===============================================================
  - section: state_machines
    instances:
      - name: freeze_non_draft_frame_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SampleFrame.DRAFT_to_FROZEN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Freezing an already-FROZEN frame is an invalid transition -> ERR_INVALID_STATE, and the frame's allocations are unchanged."
        test_recipe:
          setup: ["program CES (budget 3); frame F1 2026-Q3 frozen"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { f1: $.data.id } }
            - { call: "POST /survey/sample-frames/${f1}/freeze", payload: {}, as: ProgramAdmin, captures: { alloc0: $.data.total_sample_size } }
          trigger:
            - { call: "POST /survey/sample-frames/${f1}/freeze", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (FROZEN is not a valid from-state for freeze)"
            - "alloc0 == 3 (first freeze computed and stored the allocation)"

      - name: accept_returned_report_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ResponseReport.SUBMITTED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPT from RETURNED is not a declared transition -> ERR_INVALID_STATE; only resubmission (SUBMIT) exits RETURNED."
        test_recipe:
          setup: ["program/frame frozen; E1 enrolled/accepted; September cycle COLLECTING; report created (SUBMITTED) then RETURNED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002301", name: "AR-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { rep: $.data.id } }
            - { call: "POST /survey/response-reports/${rep}/advance", payload: { action: RETURN, return_reason: "verify units" }, as: CollectionOfficer }
          trigger:
            - { call: "POST /survey/response-reports/${rep}/advance", payload: { action: ACCEPT }, as: CollectionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and the report remains RETURNED"

      - name: refused_enrollment_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PanelEnrollment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REFUSED is terminal: every further lifecycle action (ACCEPT, SUSPEND, REINSTATE, EXIT) on the refused enrollment is ERR_INVALID_STATE."
        test_recipe:
          setup: ["program/frame frozen; E1 enrollment INVITED, then DECLINE -> REFUSED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002401", name: "TL-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: DECLINE }, as: Respondent, as_user_id: "${e1}", captures: { st: $.data.enrollment_status } }
          trigger:
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}", captures: { err: $.data.error_id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: EXIT }, as: CollectionOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "st == REFUSED after DECLINE"
            - "err == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE (terminal lockdown for both respondent and officer actions)"

      - name: certify_without_compute_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=15]", "errors[ERR_ESTIMATES_NOT_COMPUTED]"]
        distinguishing_aspect: "CERTIFY on a cycle that was closed but never computed fails with ERR_ESTIMATES_NOT_COMPUTED, not a rate error."
        test_recipe:
          setup: ["program/frame frozen; E1 enrolled/accepted; September cycle: report 9 accepted; collection closed; NO compute run"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
