        claim_type: violation_to_error
        grounds:
          - concurrency_rules[order-create-stale-fund]
          - errors.ERR_STALE_FUND_VERSION
        distinguishing_aspect: "OCC on BudgetFund.version: after a first order create bumps the fund version, a second create carrying the pre-bump expected version fails 412 ERR_STALE_FUND_VERSION; replaying with the fresh version succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund (version observed at creation), titles T and T2."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_title
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000060", name: "Title T2", author: "A2", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { title2_id: $.data.id }
            - *k_order
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { fund_v_after: $.data.version }
          trigger:
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title2_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { err: $.data.error_id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title2_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v_after}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { order2_ok: $.data.id }
          assert:
            - "the stale create fails 412 with error_id == ERR_STALE_FUND_VERSION"
            - "the replay with the observed current version succeeds 201"
            - "BudgetFund.${fund_id}.version advanced by exactly 1 per successful order create"

