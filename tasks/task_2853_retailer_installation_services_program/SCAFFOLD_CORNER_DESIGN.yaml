        excluded_because:
          difficulty_instance: "boundary_precision_check / estimated_units_exactly_at_permit_unit_threshold_requires_a_permit"
          rationale: "That instance creates projects at 249.99, 250.00 and 250.01 units against the same jurisdiction and asserts NOT_REQUIRED / PENDING_APPLICATION / PENDING_APPLICATION plus the re-determination flip in both directions after a measurement — the whole threshold row."

      - name: delivery_slack_is_compared_on_the_floored_integer_hour
        claim_type: interval_merge
        grounds:
          - calculations.delivery_sync_slack
          - validations[priority=25]
          - errors.ERR_DELIVERY_SLACK_INSUFFICIENT
        distinguishing_aspect: "The confirm gate compares floor(slack) against MIN_DELIVERY_SLACK_HOURS, so 23 h 59 min floors to 23 and is rejected while exactly 24 h is accepted."
        excluded_because:
          difficulty_instance: "boundary_precision_check / delivery_slack_of_exactly_24_hours_confirms_where_23_is_rejected"
          rationale: "That instance already confirms at exactly 86400 seconds of slack and rejects at 86340 seconds with ERR_DELIVERY_SLACK_INSUFFICIENT from the same fixture, which is the entire boundary claim for this calculation."

      - name: change_order_lines_are_rounded_before_they_are_summed
        claim_type: precision
        grounds:
          - calculations.change_order_upcharge
          - entities.ChangeOrder.fields.upcharge_cents
        distinguishing_aspect: "Rounding each line to whole cents before summing differs by one cent from summing the raw decimals and rounding once."
        excluded_because:
          difficulty_instance: "combinatorial_formula / change_order_line_rounding_order_shifts_upcharge_by_one_cent"
          rationale: "That instance pins the three-line 10546 result against the wrong-order 10547 result on the same payload, which is the sharpest possible statement of the precision claim."

      - name: labor_charge_variants_diverge_on_the_same_project
        claim_type: variant_divergence
        grounds:
          - calculations.project_labor_charge
          - entities.Project.fields.quoted_labor_cents
          - entities.Project.fields.final_labor_cents
          - complexity_profile.complexity_layers
        distinguishing_aspect: "PROVISIONAL and FINAL read different unit sources and different surcharge inputs, so the same project carries two different labor numbers at once."
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_labor_charge_provisional_versus_final_diverge_on_same_project"
          rationale: "That instance asserts quoted_labor_cents 196673 and final_labor_cents 253942 on one project plus the 57269 delta, covering divergence, variant selection and the reconciliation into the ledger in a single recipe."

  # ==========================================================================
  # SECTION — validations  (claim-extraction-guide Table 4)
  # ==========================================================================
  - section: validations
    instances:

      - name: deposit_must_match_the_required_amount_to_the_cent
        claim_type: violation_error
        grounds:
          - validations[priority=34]
          - errors.ERR_DEPOSIT_AMOUNT_MISMATCH
          - entities.Project.fields.deposit_required_cents
          - endpoints[POST /projects/{id}/deposit]
          - state_machines.Project.financial_status.QUOTED_to_DEPOSIT_HELD
        distinguishing_aspect: "Both 51305 (one cent short) and 51307 (one cent over) are rejected with ERR_DEPOSIT_AMOUNT_MISMATCH and leave financial_status QUOTED with all four buckets at 0, while 51306 succeeds — under-payment and over-payment are symmetric here."
        test_recipe:
          setup:
            - "FLOOR-DIRECT category in METRO-02 (multiplier 1.00) and a 420.00-unit project, so deposit_required_cents is 51306."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, dep_req: $.data.deposit_required_cents, v0: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51305 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_under: $.data.error_id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51307 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_over: $.data.error_id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fin: $.data.financial_status, held: $.data.deposit_held_cents, v1: $.data.version }
          assert:
            - "${dep_req} == 51306"
            - "${err_under} == 'ERR_DEPOSIT_AMOUNT_MISMATCH' with HTTP 409 AND ${err_over} == 'ERR_DEPOSIT_AMOUNT_MISMATCH' with HTTP 409"
            - "After both rejections, Project.${proj_id}.financial_status == 'QUOTED' AND deposit_paid_cents == 0 AND deposit_held_cents == 0 AND version == ${v0} — a rejected write bumps nothing"
            - "${fin} == 'DEPOSIT_HELD' AND ${held} == 51306 AND ${v1} == ${v0} + 1 — satisfaction of the same rule succeeds"

      - name: unknown_project_in_the_path_is_rejected_before_the_deposit_amount
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=34]
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_DEPOSIT_AMOUNT_MISMATCH
