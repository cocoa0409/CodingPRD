scaffold_difficulty_design:

  # =======================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: buyout_price_cycles_worn_vs_months_held
        grounds:
          - calculations.buyout_price
          - calculations.buyout_final_price
          - entities.BuyOutOrder.fields.quote_variant
          - entities.GarmentUnit.fields.cycles_completed
          - entities.GarmentUnit.fields.acquired_at
        distinguishing_aspect: |
          This dual variant lives in the RENTAL-STOCK domain (GarmentUnit x BoxItem): two
          physically identical units, same grade B, same 5 completed cycles, same acquisition
          instant, priced on the same day, yield 2400 cents under CYCLES_WORN and 2725 cents
          under MONTHS_HELD because one decays on wear and the other on tenure.
        test_recipe:
          setup:
            - "One CORE plan with 2 box slots and a monthly fee of 8900 cents."
            - "One ACTIVE member sized 5 with no protection add-on."
            - "One style with retail price 6000 cents, size 5, STANDARD brand tier."
            - "Two units of that style, both grade B, both with 5 completed cycles, both acquired 2025-11-01."
            - "An OPEN cycle starting 2026-05-01 whose box holds both units, shipped and delivered to the member."
            - "The logical clock reads the default 2026-05-01T00:00:00Z, exactly 6 whole months after acquisition."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 2, monthly_fee_cents: 8900, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_core: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_core}", email: "bo@kidswear.test", display_name: "Buyout Household", child_size_code: "5", protection_enrolled: false, auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_bo: $.data.id }
            - call: "POST /kidswear/members/${m_bo}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-BO-1", name: "Play Set", brand_tier: "STANDARD", retail_price_cents: 6000, size_code: "5", season: "ALL_SEASON", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_bo: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_bo}", acquired_at: "2025-11-01T00:00:00Z", current_grade: "B", cycles_completed: 5 }
              as: MerchandisePlanner
              captures: { u_bo1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_bo}", acquired_at: "2025-11-01T00:00:00Z", current_grade: "B", cycles_completed: 5 }
              as: MerchandisePlanner
              captures: { u_bo2: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_bo}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_bo: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_bo}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_bo}" }
              as: WarehouseOperator
              captures: { box_bo: $.data.id }
            - call: "POST /kidswear/boxes/${box_bo}/allocate"
              payload: { unit_id: "${u_bo1}" }
              as: WarehouseOperator
              captures: { bi_bo1: $.data.id }
            - call: "POST /kidswear/boxes/${box_bo}/allocate"
              payload: { unit_id: "${u_bo2}" }
              as: WarehouseOperator
              captures: { bi_bo2: $.data.id }
            - call: "POST /kidswear/boxes/${box_bo}/pack"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_bo}", direction: "OUTBOUND" }
              as: LogisticsCoordinator
              captures: { lbl_bo_out: $.data.id }
            - call: "POST /kidswear/boxes/${box_bo}/ship"
              payload: { label_id: "${lbl_bo_out}" }
              as: LogisticsCoordinator
              captures: { shp_bo_out: $.data.id }
            - call: "POST /kidswear/shipments/${shp_bo_out}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_bo_out}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "GET /kidswear/box-items/${bi_bo1}"
              payload: {}
              as: Member
              as_user_id: "${m_bo}"
              captures: { v_bi_bo1: $.data.version }
            - call: "GET /kidswear/box-items/${bi_bo2}"
              payload: {}
              as: Member
              as_user_id: "${m_bo}"
              captures: { v_bi_bo2: $.data.version }
          trigger:
            - call: "POST /kidswear/box-items/${bi_bo1}/buy-out"
              payload: { quote_variant: "CYCLES_WORN", expected_box_item_version: "${v_bi_bo1}" }
              as: Member
              as_user_id: "${m_bo}"
              captures: { bo_cycles: $.data.id }
            - call: "POST /kidswear/box-items/${bi_bo2}/buy-out"
              payload: { quote_variant: "MONTHS_HELD", expected_box_item_version: "${v_bi_bo2}" }
              as: Member
              as_user_id: "${m_bo}"
              captures: { bo_months: $.data.id }
          assert:
            - "BuyOutOrder.${bo_cycles}.quoted_price_cents == 2400"
            - "BuyOutOrder.${bo_months}.quoted_price_cents == 2725"
            - "BuyOutOrder.${bo_cycles}.late_surcharge_cents == 0"
            - "BuyOutOrder.${bo_months}.late_surcharge_cents == 0"
            - "BuyOutOrder.${bo_cycles}.final_price_cents == 2400"
            - "BuyOutOrder.${bo_months}.final_price_cents == 2725"
            - "BuyOutOrder.${bo_cycles}.status == QUOTED"
            - "BuyOutOrder.${bo_months}.status == QUOTED"

      - name: tradein_submission_cap_sequential_truncates_tail
        grounds:
          - calculations.tradein_submission_credit_total
          - calculations.tradein_item_credit
          - entities.TradeInItem.fields.granted_credit_cents
          - entities.TradeInSubmission.fields.uncapped_total_cents
          - state_machines.TradeInSubmission.GRADING_to_CREDITED
        distinguishing_aspect: |
          This dual variant lives in the TRADE-IN INTAKE domain (TradeInSubmission x TradeInItem),
          a different entity domain from the buy-out instance: three identical grade-A PREMIUM
          garments in a HIGH-demand size each earn 2450 cents, but the SEQUENTIAL_CAP variant
          selected by a non-CAPSULE_PLUS plan pays 2450 / 2450 / 1100 — the cap falls entirely
          on the last-created garment.
        test_recipe:
          setup:
            - "One CORE plan (selects SEQUENTIAL_CAP) and one ACTIVE member with auto_apply_credit false."
            - "One ACTIVE style in size 6 with demand_band HIGH so trade-in items in size 6 resolve to the HIGH multiplier."
            - "A trade-in submission of exactly 3 PREMIUM garments declared in size 6, received at the warehouse and all graded A."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_seq: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_seq}", email: "seq@kidswear.test", display_name: "Seq Household", child_size_code: "6", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_seq: $.data.id }
            - call: "POST /kidswear/members/${m_seq}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-DEM-6H", name: "Demand Marker 6", brand_tier: "PREMIUM", retail_price_cents: 5200, size_code: "6", season: "ALL_SEASON", category: "TOP", demand_band: "HIGH" }
              as: MerchandisePlanner
              captures: { st_dem6: $.data.id }
            - call: "POST /kidswear/trade-in-submissions"
              payload: { member_id: "${m_seq}", declared_item_count: 3 }
              as: Member
              as_user_id: "${m_seq}"
              captures: { sub_seq: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_seq}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_seq}"
              captures: { ti_seq1: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_seq}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_seq}"
              captures: { ti_seq2: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_seq}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_seq}"
              captures: { ti_seq3: $.data.id }
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_seq}", direction: "TRADE_IN_INBOUND" }
              as: LogisticsCoordinator
              captures: { lbl_seq_in: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_seq}/issue-label"
              payload: { label_id: "${lbl_seq_in}" }
              as: LogisticsCoordinator
              captures: { shp_seq_in: $.data.inbound_shipment_id }
            - call: "POST /kidswear/shipments/${shp_seq_in}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_seq_in}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_seq1}" }
              as: GradingTechnician
              as_user_id: "grader-01"
              captures: { ca_seq1: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_seq1}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-01"
            - call: "POST /kidswear/condition-assessments/${ca_seq1}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-01"
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_seq2}" }
              as: GradingTechnician
              as_user_id: "grader-01"
              captures: { ca_seq2: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_seq2}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-01"
            - call: "POST /kidswear/condition-assessments/${ca_seq2}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-01"
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_seq3}" }
              as: GradingTechnician
              as_user_id: "grader-01"
              captures: { ca_seq3: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_seq3}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-01"
            - call: "POST /kidswear/condition-assessments/${ca_seq3}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-01"
          trigger:
            - call: "POST /kidswear/trade-in-submissions/${sub_seq}/finalize"
              payload: {}
              as: BillingAgent
              captures: { sub_seq_after: $.data.credited_total_cents }
          assert:
            - "TradeInSubmission.${sub_seq}.uncapped_total_cents == 7350"
            - "TradeInSubmission.${sub_seq}.credited_total_cents == 6000"
            - "TradeInItem.${ti_seq1}.credit_cents == 2450"
            - "TradeInItem.${ti_seq1}.granted_credit_cents == 2450"
            - "TradeInItem.${ti_seq2}.granted_credit_cents == 2450"
            - "TradeInItem.${ti_seq3}.granted_credit_cents == 1100"
            - "TradeInItem.${ti_seq3}.grading_status == CREDITED"
            - "Member.${m_seq}.credit_balance_cents == 6000"

      - name: tradein_submission_cap_pro_rata_scales_every_item
        grounds:
          - calculations.tradein_submission_credit_total
          - entities.Plan.fields.tier
          - entities.TradeInItem.fields.granted_credit_cents
        distinguishing_aspect: |
          Identical inputs to the SEQUENTIAL instance — three grade-A PREMIUM garments in a
          HIGH-demand size, uncapped total 7350 against a 6000 cap — but the CAPSULE_PLUS plan
          selects PRO_RATA_CAP and pays 2000 / 2000 / 2000: no garment is zeroed and the
          third garment receives 900 cents MORE than under SEQUENTIAL_CAP.
        test_recipe:
          setup:
            - "One CAPSULE_PLUS plan (selects PRO_RATA_CAP) and one ACTIVE member with auto_apply_credit false."
            - "One ACTIVE style in size 6 with demand_band HIGH."
            - "A trade-in submission of exactly 3 PREMIUM garments declared in size 6, received and all graded A."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CAPSULE_PLUS", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_pr: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_pr}", email: "prorata@kidswear.test", display_name: "ProRata Household", child_size_code: "6", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_pr: $.data.id }
            - call: "POST /kidswear/members/${m_pr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-DEM-6P", name: "Demand Marker 6P", brand_tier: "PREMIUM", retail_price_cents: 5200, size_code: "6", season: "ALL_SEASON", category: "TOP", demand_band: "HIGH" }
              as: MerchandisePlanner
              captures: { st_dem6p: $.data.id }
            - call: "POST /kidswear/trade-in-submissions"
              payload: { member_id: "${m_pr}", declared_item_count: 3 }
              as: Member
              as_user_id: "${m_pr}"
              captures: { sub_pr: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_pr}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_pr}"
              captures: { ti_pr1: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_pr}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_pr}"
              captures: { ti_pr2: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_pr}/items"
              payload: { declared_brand_tier: "PREMIUM", declared_size_code: "6" }
              as: Member
              as_user_id: "${m_pr}"
              captures: { ti_pr3: $.data.id }
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_pr}", direction: "TRADE_IN_INBOUND" }
              as: LogisticsCoordinator
              captures: { lbl_pr_in: $.data.id }
            - call: "POST /kidswear/trade-in-submissions/${sub_pr}/issue-label"
              payload: { label_id: "${lbl_pr_in}" }
              as: LogisticsCoordinator
              captures: { shp_pr_in: $.data.inbound_shipment_id }
            - call: "POST /kidswear/shipments/${shp_pr_in}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_pr_in}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_pr1}" }
              as: GradingTechnician
              as_user_id: "grader-02"
              captures: { ca_pr1: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_pr1}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-02"
            - call: "POST /kidswear/condition-assessments/${ca_pr1}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-02"
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_pr2}" }
              as: GradingTechnician
              as_user_id: "grader-02"
              captures: { ca_pr2: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_pr2}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-02"
            - call: "POST /kidswear/condition-assessments/${ca_pr2}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-02"
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "TRADE_IN", trade_in_item_id: "${ti_pr3}" }
              as: GradingTechnician
              as_user_id: "grader-02"
              captures: { ca_pr3: $.data.id }
            - call: "POST /kidswear/condition-assessments/${ca_pr3}/submit"
              payload: { grade: "A" }
              as: GradingTechnician
              as_user_id: "grader-02"
            - call: "POST /kidswear/condition-assessments/${ca_pr3}/confirm"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-02"
          trigger:
            - call: "POST /kidswear/trade-in-submissions/${sub_pr}/finalize"
              payload: {}
              as: BillingAgent
          assert:
            - "TradeInSubmission.${sub_pr}.uncapped_total_cents == 7350"
            - "TradeInSubmission.${sub_pr}.credited_total_cents == 6000"
            - "TradeInItem.${ti_pr1}.granted_credit_cents == 2000"
            - "TradeInItem.${ti_pr2}.granted_credit_cents == 2000"
            - "TradeInItem.${ti_pr3}.granted_credit_cents == 2000"
            - "Member.${m_pr}.credit_balance_cents == 6000"

  # =======================================================================
  # RULE 2 — combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: lost_assessed_value_rounds_per_unit_then_sums
        grounds:
          - calculations.lost_assessed_value
          - calculations.lost_liability_split
          - entities.LostShipmentClaim.fields.assessed_value_cents
          - entities.LostShipmentClaim.fields.member_liability_cents
          - state_machines.Shipment.IN_TRANSIT_to_LOST
        distinguishing_aspect: |
          MODE (b) — nested rounding where the ORDER matters. Two lost units of a style priced
          at 6001 cents each contribute round_half_up(3300.55) = 3301, summing to 6602; the
          forbidden reading (sum 6601.10 raw, then round once) yields 6601. The one-cent gap
          is the whole test, and it propagates into member_liability_cents (1981 vs 1980).
        test_recipe:
          setup:
            - "A CORE plan with 2 box slots and a 5000-cent monthly fee, no protection add-on."
            - "One ACTIVE member sized 5."
            - "One style with the deliberately odd retail price 6001 cents."
            - "Two units of that style shipped out, delivered, and both started back on ONE return shipment."
            - "The return shipment has departed (so it is scanned) and is then marked lost."
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 1, monthly_fee_cents: 5000, discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_lost: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${plan_lost}", email: "lost@kidswear.test", display_name: "Lost Household", child_size_code: "5", protection_enrolled: false, auto_apply_credit: false }
              as: PlatformAdmin
              captures: { m_lost: $.data.id }
            - call: "POST /kidswear/members/${m_lost}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-ODD-6001", name: "Odd Priced Coat", brand_tier: "STANDARD", retail_price_cents: 6001, size_code: "5", season: "AW", category: "OUTERWEAR", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_lost: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_lost}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_lost1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_lost}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_lost2: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${m_lost}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_lost: $.data.id }
            - call: "POST /kidswear/cycles/${cyc_lost}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${cyc_lost}" }
              as: WarehouseOperator
              captures: { box_lost: $.data.id }
            - call: "POST /kidswear/boxes/${box_lost}/allocate"
              payload: { unit_id: "${u_lost1}" }
              as: WarehouseOperator
              captures: { bi_lost1: $.data.id }
            - call: "POST /kidswear/boxes/${box_lost}/allocate"
              payload: { unit_id: "${u_lost2}" }
              as: WarehouseOperator
              captures: { bi_lost2: $.data.id }
            - call: "POST /kidswear/boxes/${box_lost}/pack"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_lost}", direction: "OUTBOUND" }
              as: LogisticsCoordinator
              captures: { lbl_lost_out: $.data.id }
            - call: "POST /kidswear/boxes/${box_lost}/ship"
              payload: { label_id: "${lbl_lost_out}" }
              as: LogisticsCoordinator
              captures: { shp_lost_out: $.data.id }
            - call: "POST /kidswear/shipments/${shp_lost_out}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_lost_out}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${m_lost}", direction: "RETURN" }
              as: LogisticsCoordinator
              captures: { lbl_lost_ret: $.data.id }
            - call: "POST /kidswear/shipments"
              payload: { member_id: "${m_lost}", label_id: "${lbl_lost_ret}", direction: "RETURN", item_count: 2 }
              as: LogisticsCoordinator
              captures: { shp_lost_ret: $.data.id }
            - call: "POST /kidswear/box-items/${bi_lost1}/start-return"
              payload: { return_shipment_id: "${shp_lost_ret}" }
              as: Member
              as_user_id: "${m_lost}"
            - call: "POST /kidswear/box-items/${bi_lost2}/start-return"
              payload: { return_shipment_id: "${shp_lost_ret}" }
              as: Member
              as_user_id: "${m_lost}"
            - call: "POST /kidswear/shipments/${shp_lost_ret}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${shp_lost_ret}/mark-lost"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/lost-shipment-claims"
              payload: { shipment_id: "${shp_lost_ret}" }
              as: LogisticsCoordinator
              captures: { claim_lost: $.data.id }
          trigger:
