  - name: room_night_occupancy_interval_overlap_and_adjacency
    claim_type: interval_merge
    grounds:
    - §1.3 room_night_ledger (per-night occupancy gate, half-open interval)
    - §0.5 resource_temporal_overlap
    distinguishing_aspect: |
      room_night_ledger is one of the two interval_merge calculations. Its overlapping /
      adjacent / disjoint interval cases — including the adjacency case where one participant's
      departure date and another's arrival date are the same calendar day and must not contend
      for the same night — are already designed as a §1.8 resource_temporal_overlap instance.
    excluded_because:
      difficulty_instance: room_block_occupancy_is_per_night_over_half_open_stay_intervals
      rationale: |
        That §1.8 instance confirms an overlapping stay into a two-room block until a night is
        exhausted, rejects the overlapping third booking, and then accepts a stay that is merely
        adjacent on the departure date — the full overlap / adjacent / disjoint triplet this claim
        type asks for, on the same calculation.
  - name: activity_agenda_interval_buffer_overlap_and_adjacency
    claim_type: interval_merge
    grounds:
    - §1.3 activity_schedule_conflict (buffered closed-boundary comparison)
    - §1.4 priority 24 ERR_ACTIVITY_TIME_CONFLICT
    - §0.5 resource_temporal_overlap
    distinguishing_aspect: |
      activity_schedule_conflict is the second interval_merge calculation, and its distinctive
      feature — intervals padded by TRANSFER_BUFFER_MINUTES on both sides with the comparison
      closed exactly on the buffer boundary — is already designed in §1.8 at the 44-minute and
      45-minute gaps.
    excluded_because:
      difficulty_instance: activity_agenda_overlap_uses_closed_transfer_buffer_boundary
      rationale: |
        That §1.8 instance rejects a signup separated by 44 minutes and accepts one separated by
        exactly 45, which is the gap-of-zero versus gap-of-one boundary pair for this buffered
        interval comparison.
  - name: gross_up_state_supplemental_tier_boundaries
    claim_type: tiered_pricing
    grounds:
    - §1.3 taxable_award_gross_up (state_supplemental_bp tier ladder, constants STATE_TIER_*)
    - §0.5 combinatorial_formula mode c
    distinguishing_aspect: |
      taxable_award_gross_up is the only tiered_pricing calculation, and the interesting part of
      its ladder is not the tier boundaries in isolation but which value the ladder is keyed on:
      the pre-gross-up award, never the grossed-up result. That circular-dependency ordering is
      the §1.8 instance, and it necessarily walks the tier boundaries to demonstrate the
      divergence.
    excluded_because:
      difficulty_instance: full_gross_up_state_tier_keyed_on_pre_gross_up_award_value
      rationale: |
        That §1.8 instance pins two awards whose pinned-order tier and forbidden reported-order
        tier differ (300 bp versus 500 bp, and 500 bp versus 700 bp), so both tier boundaries of
        the ladder are crossed and the marginal-versus-average distinction is settled there.
  - name: deposit_forfeiture_waterfall_sequence_ordering
    claim_type: waterfall_allocation
    grounds:
    - §1.3 cancellation_exposure_projection (deposit waterfall, sequence ASC)
    - §0.5 dual_variant_calc
    distinguishing_aspect: |
      The only waterfall in §1.3 is the deposit-forfeiture side of
      cancellation_exposure_projection: milestones consumed in sequence order, matured ones
      forfeiting in full and unmatured ones only their non-refundable share, then force-majeure
      relief applied once to the accumulated figure. The §1.8 dual-variant instance is built on
      exactly that walk.
    excluded_because:
      difficulty_instance: cancellation_exposure_attrition_vs_deposit_forfeiture_divergence
      rationale: |
        That §1.8 instance moves the logical clock so that the first two milestones have matured
        and the third has not, which is what makes the sequence-ordered bucket walk observable, and
        asserts the pre-relief accumulation as well as the post-relief total.
  - name: waitlist_promotion_chronological_processing_order
    claim_type: chronological
    grounds:
    - §1.3 activity_seat_allocation (promotion pool ordering, created_at ASC then employee_code)
    - §0.5 transitive_cascade
    distinguishing_aspect: |
      activity_seat_allocation is the only chronological algorithm, and its ordering claim is
      that a released seat goes to the earliest-created waitlisted signup with employee_code as
      the tie-break — never a random id and never the most recent. The §1.8 cascade instance is
      built around that promotion firing as the third hop of a cancellation chain.
    excluded_because:
      difficulty_instance: registration_cancel_cascades_three_levels_into_waitlist_promotion
      rationale: |
        That §1.8 instance creates a waitlist deeper than one row and asserts that exactly the
        earliest waitlisted signup is promoted and stamped with promoted_at while the later one
        stays WAITLISTED, which is the out-of-order-creation-still-correct-order claim.
  - name: measurement_aggregates_then_rates_and_scores_every_registration_kind
    claim_type: weighted_scoring
    grounds:
    - §1.3 program_measurement (algorithm weighted_scoring, formula comment)
    - §1.5 GET /programs/{program_id}/measurement
    - §1.1 Registration.registration_kind
    - §1.2 Registration ACCEPTED -> CONFIRMED
    distinguishing_aspect: |
      Attacks the two ways the weighted_scoring aggregation can drift. First, the lift must be
      computed from the summed metrics of the travelling cohort (aggregate-then-rate); averaging
      the two winners' individual lift percentages gives 36.81 instead of 38.33, so the two
      implementations are separable by a single number. Second, the satisfaction index is scored
      over registrations of ANY kind, so a GUEST row's score is one third of the mean and pulls
      it from 8.5 to 9.0, while that same GUEST row contributes nothing to the lift because
      guests are not qualifiers. The correct_result instance in this section deliberately has no
      GUEST row and only two surveys.
      Rounding accumulation is also pinned: three integer scores divided by three must give a
      clean 9.0 through the centi-point intermediate, not 8.99 or 9.01.
