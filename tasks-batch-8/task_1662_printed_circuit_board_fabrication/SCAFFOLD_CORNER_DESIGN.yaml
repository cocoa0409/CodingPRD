  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pcb/customers", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"
      - name: forbidden_role_on_customer_create
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "QualityInspector is not in POST /pcb/customers' role list; rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pcb/customers", payload: { company_name: "Nope Co", contact_email: "nope@co.example", credit_limit_cents: 1 }, as: QualityInspector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403"
      - name: customer_not_owner_read_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_OWNER]"
        distinguishing_aspect: "Customer B (entity-backed identity) reading customer A's order is rejected 403 ERR_NOT_OWNER; the same read by A succeeds."
        test_recipe:
          setup: ["customers A and B; order owned by A"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Owner A", contact_email: "a@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { custA: $.data.id } }
            - { call: "POST /pcb/customers", payload: { company_name: "Owner B", contact_email: "b@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { custB: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${custA}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${custA}", captures: { ord: $.data.id } }
          trigger:
            - { call: "GET /pcb/fab-orders/${ord}", payload: {}, as: Customer, as_user_id: "${custB}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_OWNER with http 403"
      - name: sod_creator_cannot_approve
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SOD_VIOLATION]"
        distinguishing_aspect: "Segregation of duties: the ProcessEngineer whose X-User-ID equals the program's created_by_user_id (cam_1) is rejected 403 ERR_SOD_VIOLATION; a different approver (eng_1) succeeds."
        test_recipe:
          setup: ["QUOTED order with LOCKED stackup; drill program UNDER_REVIEW created by cam_1"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "SoD Co", contact_email: "sod@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 400 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
          trigger:
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "cam_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION (http 403): approver cam_1 == created_by_user_id cam_1"
      - name: reservation_reference_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
        distinguishing_aspect: "A reservation naming a nonexistent laminate_lot_id is rejected 422 ERR_REFERENCE_NOT_FOUND (existence beats the OCC version check)."
