          Non-linearity by PARALLEL DIMENSIONS: one Shipment row carries two independent state axes and
          the walk advances them alternately - transport TENDERED -> IN_TRANSIT -> DELIVERED while
          conformance stays UNSCREENED, then conformance UNSCREENED -> NON_CONFORMING -> REMEDIATED
          while transport stays frozen at DELIVERED. A single-status implementation cannot represent
          DELIVERED+REMEDIATED at all, and the REMEDIATED axis (not the transport axis) is what unlocks
