              payload: { decision: "CLEAR" }
              as: QualityManager
            - call: "POST /spec-change-requests/${scr1}/approval-review"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /spec-change-requests/${scr1}/make-effective"
              payload: {}
              as: ProductManager
          trigger:
            - call: "POST /blend-recipes/${recipe2}/activate"
              payload: {}
              as: ProductManager
              captures: { err: $.data.error_id }
          assert:
            - "ProductSpec.${spec1}.revision == 2 and target_kv100_cst == 7.700"
            - "BlendRecipe.${recipe1}.status == RETIRED (cascade A retired the previously ACTIVE recipe)"
            - "BlendRecipe.${recipe2}.status == DRAFT and spec_revision_pinned == 1"
            - "HTTP status is 409 and data.error_id == ERR_SPEC_REVISION_STALE"
            - "data.error_id is NOT ERR_PREDICTED_VISCOSITY_OUT_OF_SPEC, because 7.614 lies inside 7.469..7.931"
            - "BlendRecipe.${recipe2}.status is still DRAFT after the refusal"

