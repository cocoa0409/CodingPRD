              as_user_id: "ops-review-1"
          assert:
            - "after the REJECT Lot.${lot1}.lot_status == MANIFEST_REJECTED"
            - "after the added line Lot.${lot1}.lot_status == DRAFT with manifest_line_count == 2, declared_unit_count == 400, declared_retail_value_cents == 10000000"
            - "after the re-submission Lot.${lot1}.lot_status == MANIFEST_IN_REVIEW"
            - "after the second review Lot.${lot1}.lot_status == MANIFEST_APPROVED and manifest_reviewed_by_user_id == ops-review-1"

