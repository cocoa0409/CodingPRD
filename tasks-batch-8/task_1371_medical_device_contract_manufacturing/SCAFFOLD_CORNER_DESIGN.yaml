# §1.9 Scaffold Corner Design — coverage index for non-Difficulty-Rule claims.
# Clock default 2026-08-01T00:00:00Z unless a recipe sets it. claim_type values
# come from references/claim-extraction-guide.md.
scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: supplier_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Supplier]
        distinguishing_aspect: "A new supplier starts PENDING_QUALIFICATION with score 100/100, tier LOW, zero penalties, next_audit_due_at = created_at + 12 months (2027-08-01T00:00:00Z at the default clock)."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-D1", name: "Default Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id" } }
          assert:
            - "Supplier.${sup_id}.status == PENDING_QUALIFICATION"
            - "Supplier.${sup_id}.quality_score == 100 and quality_score_finalized == 100 and applied_penalty_points == 0"
            - "Supplier.${sup_id}.risk_tier == LOW and next_audit_due_at == 2027-08-01T00:00:00Z and is_audit_overdue == false"
            - "Supplier.${sup_id}.version == 1"

      - name: dmr_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.DeviceMasterRecord, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required shelf_life_claim_months yields 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-M1", revision_code: "A", sterile: true }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION, http 400; GET /api/device-master-records?device_code=DEV-M1 returns empty array"

      - name: scn_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.SupplierChangeNotification.fields.impact_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "impact_class 'HUGE' is not in {MINOR, MAJOR} -> 400 ERR_VALIDATION before any state/business check."
        test_recipe:
          setup: ["supplier SUP-E1 QUALIFIED with ACTIVE agreement"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-E1", name: "Enum Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-E1", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/change-notifications", payload: { change_description: "resin swap", impact_class: "HUGE", proposed_effective_date: "2026-12-01T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION, http 400"

      - name: get_unknown_lot_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown UUID returns 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/device-lots/11111111-2222-3333-4444-555555555555", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404, response_type == error"

      - name: supplier_system_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Supplier.fields.status]
        distinguishing_aspect: "Client-supplied status/quality_score on create are ignored: the supplier is created PENDING_QUALIFICATION with score 100 regardless."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-I1", name: "Ignored Co", status: "QUALIFIED", quality_score: 5 }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", st: "$.data.status", score: "$.data.quality_score" } }
          assert:
            - "Supplier.${sup_id}.status == PENDING_QUALIFICATION (client input 'QUALIFIED' ignored)"
            - "Supplier.${sup_id}.quality_score == 100 (client input 5 ignored)"

      - name: dmr_revision_supersede_invalidates_study
        claim_type: parent_relationships
        grounds: [entities.DeviceMasterRecord.fields.parent_dmr_id, state_machines.DeviceMasterRecord, state_machines.SterileBarrierStudy, "concurrency_rules[revision-create-stale-dmr]"]
        distinguishing_aspect: "The self-referential revision chain: revision B is created from APPROVED A (OCC on A.version), and approving B flips A to SUPERSEDED and A's IN_PROGRESS study to INVALIDATED (depth-2 cascade from the approve transition)."
        test_recipe:
          setup:
            - "DMR DEV-RV rev A APPROVED (author qe-alice, approver qm-bob); study ST-RV IN_PROGRESS on A"
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-RV", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_a: "$.data.id", a_v1: "$.data.version" } }
            - { call: "POST /api/device-master-records/${dmr_a}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { a_v2: "$.data.version" } }
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_a}", study_type: "REAL_TIME", claimed_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { study_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/device-master-records/${dmr_a}/revisions", payload: { revision_code: "B", shelf_life_claim_months: 30, sterile: true, expected_dmr_version: "${a_v2}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_b: "$.data.id", b_seq: "$.data.revision_seq", b_parent: "$.data.parent_dmr_id" } }
            - { call: "POST /api/device-master-records/${dmr_b}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "GET /api/device-master-records/${dmr_a}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { a_status: "$.data.status" } }
            - { call: "GET /api/sterile-barrier-studies/${study_id}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { study_status: "$.data.status" } }
          assert:
            - "DeviceMasterRecord.${dmr_b}.revision_seq == 2 and parent_dmr_id == ${dmr_a}"
            - "after approving B: revision A status == SUPERSEDED"
            - "SterileBarrierStudy.${study_id}.status == INVALIDATED (supersede cascade)"

      - name: supplier_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit=2 over 3 suppliers returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["three suppliers created"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-P1", name: "P1" }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-P2", name: "P2" }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-P3", name: "P3" }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          trigger:
            - { call: "GET /api/suppliers", payload: { limit: 2, offset: 0 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "GET /api/suppliers", payload: { limit: 2, offset: 2 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length == 1, total_count == 3, has_more == false"

      - name: duplicate_supplier_code_returns_409
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_CODE]", "validations[priority=12]"]
        distinguishing_aspect: "Second supplier with the same supplier_code collides on the uniqueness constraint -> 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["supplier SUP-DUP exists"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-DUP", name: "First" }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          trigger:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-DUP", name: "Second" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_CODE, http 409"

      - name: lot_create_unknown_dmr_not_found
        claim_type: parent_relationships
        grounds: [entities.DeviceLot.fields.dmr_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced FK that does not exist fails existence (404) at priority 4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-NF", dmr_id: "11111111-2222-3333-4444-555555555555", validation_protocol_id: "11111111-2222-3333-4444-555555555555", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: study_second_active_per_dmr_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_STUDY_ALREADY_ACTIVE]", "validations[priority=12]"]
        distinguishing_aspect: "One IN_PROGRESS study per DMR: the second create on the same DMR fails 409 while the first stays IN_PROGRESS; after the first is FAILED a new study may start."
        test_recipe:
          setup: ["DMR DEV-ST rev A APPROVED (sterile); study ST-1 IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-ST", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_id}", study_type: "ACCELERATED", claimed_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { study1: "$.data.id" } }
          trigger:
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_id}", study_type: "REAL_TIME", claimed_months: 24 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/sterile-barrier-studies/${study1}/complete", payload: { passed: false }, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_id}", study_type: "REAL_TIME", claimed_months: 24 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { study2: "$.data.id" } }
          assert:
            - "second create while IN_PROGRESS: error_id == ERR_STUDY_ALREADY_ACTIVE (409)"
            - "after ST-1 FAILED: new study ${study2} created IN_PROGRESS (terminal studies do not block)"

      - name: study_on_non_sterile_dmr_rejected
        claim_type: conditional_validation
        grounds: ["errors[ERR_DMR_NOT_STERILE]", entities.DeviceMasterRecord.fields.sterile]
        distinguishing_aspect: "Sterile-barrier studies only apply to sterile DMRs: sterile=false -> 422 ERR_DMR_NOT_STERILE."
        test_recipe:
          setup: ["DMR DEV-NS rev A APPROVED with sterile=false"]
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-NS", revision_code: "A", sterile: false, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
          trigger:
            - { call: "POST /api/sterile-barrier-studies", payload: { dmr_id: "${dmr_id}", study_type: "REAL_TIME", claimed_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DMR_NOT_STERILE, http 422"

  # ==================================================================
  - section: state_machines
    instances:
      - name: supplier_terminal_disqualified_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Supplier, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "DISQUALIFIED is terminal: reinstate and qualify both fail with 409 ERR_INVALID_STATE_TRANSITION and the disqualify cascade has fired (parts DISQUALIFIED, ACTIVE agreement TERMINATED, in-flight lot held)."
        test_recipe:
          setup:
            - "supplier SUP-TL QUALIFIED; part PN-TL received 100; ACTIVE agreement QA-TL; DMR DEV-TL APPROVED; protocol VP-TL VALIDATED; lot LT-TL IN_PRODUCTION with PN-TL component"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-TL", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-TL", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-TL", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-TL", name: "TermLock" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-TL", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-TL", description: "terminal part", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 100 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-TL", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-TL" }, as: ProductionOperator, as_user_id: "po-1" }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/disqualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_st: "$.data.status" } }
            - { call: "POST /api/suppliers/${sup_id}/reinstate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err_reinstate: "$.data.error_id" } }
            - { call: "GET /api/supplier-parts/${part_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_st: "$.data.status" } }
            - { call: "GET /api/quality-agreements/${agr_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_st: "$.data.status" } }
            - { call: "GET /api/device-lots/${lot_id}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { lot_hold: "$.data.hold_status", lot_reason: "$.data.hold_reason" } }
          assert:
            - "Supplier.${sup_id}.status == DISQUALIFIED"
            - "SupplierPart.${part_id}.status == DISQUALIFIED (cascade)"
            - "QualityAgreement.${agr_id}.status == TERMINATED (cascade)"
            - "DeviceLot.${lot_id}.hold_status == ON_HOLD and hold_reason == SUPPLIER_QUALITY (cascade)"
            - "reinstate from DISQUALIFIED: 409 error_id == ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: protocol_execute_from_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ValidationProtocol, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "execute-phase is only declared from DRAFT and REVALIDATION_REQUIRED; from IQ_REVIEW it fails 409."
        test_recipe:
          setup: ["DMR DEV-IV APPROVED; line L-IV; protocol VP-IV in IQ_REVIEW"]
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-IV", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-IV", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-IV", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
          trigger:
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); protocol stays IQ_REVIEW"

      - name: protocol_approve_phase_segregation
        claim_type: precondition_enforcement
        grounds: [state_machines.ValidationProtocol, "errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=6]"]
        distinguishing_aspect: "The QualityManager approving IQ carries the same X-User-ID as the recorded IQ executor -> 403 ERR_SEGREGATION_OF_DUTIES; a different manager succeeds."
        test_recipe:
          setup: ["DMR DEV-SD APPROVED; line L-SD; protocol VP-SD in IQ_REVIEW with iq_executor_user_id == 'qe-alice'"]
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-SD", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-SD", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols", payload: { protocol_code: "VP-SD", dmr_id: "${dmr_id}", line_id: "${line_id}", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-09-10T00:00:00Z" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { proto_id: "$.data.id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
          trigger:
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qe-alice", captures: { err_sod: "$.data.error_id" } }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { st_after: "$.data.status" } }
          assert:
            - "approve by the executor's user id: 403 error_id == ERR_SEGREGATION_OF_DUTIES; protocol stays IQ_REVIEW"
            - "approve by qm-bob: status == OQ_EXECUTION"

      - name: capa_ineffective_loop_cycles
        claim_type: cyclic
