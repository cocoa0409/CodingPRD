              payload: { employee_ref: "E-V11", full_name: "Bad Enum", job_category: "SUPER_NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM (400); no employee persisted"

      - name: screening_clear_blocked_by_immunity
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_IMMUNITY_NOT_ESTABLISHED]", "state_machines.PrePlacementScreening.IN_PROGRESS_to_CLEARED"]
        distinguishing_aspect: "Components complete but the latest VARICELLA titer is NON_IMMUNE -> decide CLEARED fails ERR_IMMUNITY_NOT_ESTABLISHED (422)."
        test_recipe:
          setup: ["Employee; screening with PHYSICAL + TB_BASELINE complete; HEP_B IMMUNE (15.0); VARICELLA NON_IMMUNE (0.5)"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-V12", full_name: "Not Immune", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 0.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_IMMUNITY_NOT_ESTABLISHED (422); screening stays IN_PROGRESS; employee stays PREPLACEMENT"

      - name: screening_clear_blocked_by_med_eval
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_COMPONENT_INCOMPLETE]"]
        distinguishing_aspect: "requires_respirator=true employee missing MED_EVAL -> decide CLEARED fails ERR_COMPONENT_INCOMPLETE (422) even with all titers IMMUNE."
