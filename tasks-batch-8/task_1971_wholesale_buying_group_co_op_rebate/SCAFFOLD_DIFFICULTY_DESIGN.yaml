            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /coop/members/${m_id}/suspend"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/members/${m_id}/reinstate"
              payload: {}
