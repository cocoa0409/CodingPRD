  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: record_deed_cascades_psa_to_interest_to_division_order_to_suspense
        grounds:
          - state_machines.PurchaseSaleAgreement.EXECUTED_to_CLOSED
          - state_machines.MineralInterest.UNDER_PSA_to_ACQUIRED
          - state_machines.DivisionOrder.EXECUTED_to_DISPUTED
          - entities.SuspenseAccount.fields.suspense_reason
          - entities.DivisionOrder.fields.dispute_reason
          - entities.MineralInterest.fields.acquiring_deed_book_page
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /psas/{id}/record-deed, where each hop is caused by
          the previous hop and not by the original call: recording moves the PSA to CLOSED,
          the CLOSED PSA moves the MineralInterest to ACQUIRED, the ACQUIRED interest moves
          its EXECUTED DivisionOrder to DISPUTED with dispute_reason OWNERSHIP_CHANGE, and
          that DISPUTED order opens a SuspenseAccount with suspense_reason OWNERSHIP_TRANSFER.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "a PurchaseSaleAgreement with curative_status CURATIVE_CLOSED, funding_status FUNDED, psa_status EXECUTED and recorded_book_page null"
            - "its MineralInterest in UNDER_PSA"
            - "a Unit with one ACTIVE 320.0000-acre allocation of the same tract and an EXECUTED DivisionOrder on that interest with pinned_decimal 0.00195313"
            - "no SuspenseAccount exists yet"
