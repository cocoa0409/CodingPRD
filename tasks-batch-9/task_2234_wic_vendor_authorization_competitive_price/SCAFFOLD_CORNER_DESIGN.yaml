          With mar_method LOWEST_HALF_AVG and prices 200/220/300, k == ceil(3/2) == 2
          so base is (200 + 220) / 2 == 210, and the single final round_half_up turns
          220.5 into 221 — truncation would give 220 and banker's rounding 220, while
          the cap 1.25 * 200 == 250 stays idle.
