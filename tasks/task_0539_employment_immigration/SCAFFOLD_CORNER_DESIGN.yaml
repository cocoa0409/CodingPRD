      - name: rfe_response_exactly_at_due_date_boundary_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=9]
          - state_machines.H1BPetition.RFE_ISSUED_to_SUBMITTED
          - entities.H1BPetition.fields.rfe_due_date
        distinguishing_aspect: "Responding to an RFE with clock exactly == rfe_due_date 2026-07-27 passes (clock <= rfe_due_date is inclusive); petition returns to SUBMITTED, rfe_status==RESPONDED, no auto-deny (not strictly past due)."
        test_recipe:
          setup:
            - "A petition is RFE_ISSUED with rfe_due_date 2026-07-27 (RFE issued at clock 2026-05-01)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "400000013", legal_name: "RfeEdge Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
