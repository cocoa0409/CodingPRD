  - rule_id: resource_temporal_overlap
    instances:
      - name: field_boundary_rectangles_touch_versus_intrude
        grounds:
          - validations[priority 16 ERR_FIELD_BOUNDARY_OVERLAP]
          - calculations.field_mapped_acres
          - entities.Field.fields.boundary_min_x
          - endpoints[POST /growers/{grower_id}/fields]
        distinguishing_aspect: |
          The occupied resource is a 2-D rectangle, so overlap is an AREA test, not an interval
          test: a shared edge and a shared corner have zero area and must be admitted, while a
          one-unit interior intrusion (1999 instead of 2000) has area 2000 square units and must
          be refused. The scope is also per-grower, so a second grower may register the exact
          same rectangle. An implementation comparing only x-ranges, or using >= instead of >,
          rejects the adjacent parcels that every real farm has.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "Grower G12 ACTIVE with one existing DRAFT field FA occupying (0,0)-(2000,2000), mapped_acres 1000.00."
            - "Grower G13 ACTIVE with no fields at all."
            - "SQUARE_UNITS_PER_ACRE is 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /growers"
              payload: { legal_name: "Quilt Section Farms", operator_type: "LLC", tax_id: "91-1212121", mailing_state: "ND" }
              as: ProgramAdmin
              captures: { g12_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Neighbour Acres", operator_type: "SOLE_PROPRIETOR", tax_id: "91-1313131", mailing_state: "ND" }
              as: ProgramAdmin
              captures: { g13_id: $.data.id }
            - call: "POST /growers/${g12_id}/fields"
              payload: { field_name: "Quilt A", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "ND-017" }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /growers/${g12_id}/fields"
              payload: { field_name: "Quilt B shares the east edge", boundary_min_x: 2000, boundary_min_y: 0, boundary_max_x: 4000, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "CLAY", county_code: "ND-017" }
              as: ProgramAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /growers/${g12_id}/fields"
              payload: { field_name: "Quilt C touches only the corner", boundary_min_x: 2000, boundary_min_y: 2000, boundary_max_x: 4000, boundary_max_y: 4000, gross_acres: 1010.00, soil_group: "SAND", county_code: "ND-017" }
              as: ProgramAdmin
              captures: { fc_id: $.data.id }
            - call: "POST /growers/${g12_id}/fields"
              payload: { field_name: "Quilt D intrudes one unit", boundary_min_x: 1999, boundary_min_y: 0, boundary_max_x: 3999, boundary_max_y: 2000, gross_acres: 1010.00, soil_group: "LOAM", county_code: "ND-017" }
              as: ProgramAdmin
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /growers/${g12_id}/fields"
              payload: { field_name: "Quilt E swallows A", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 4000, boundary_max_y: 4000, gross_acres: 4010.00, soil_group: "LOAM", county_code: "ND-017" }
              as: ProgramAdmin
              captures: { err_contains: "$.data.error_id" }
            - call: "POST /growers/${g13_id}/fields"
