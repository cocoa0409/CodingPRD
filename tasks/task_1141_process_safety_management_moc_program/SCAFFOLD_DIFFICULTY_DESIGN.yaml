          trigger:
            - { call: "GET /psm/moc-requests/${mb}", as: PsmManager, captures: { vb: $.data.version } }
            - { call: "POST /psm/moc-requests/${mb}/pssrs", payload: { field_window_start: "2026-07-10", field_window_end: "2026-07-15", expected_moc_version: "${vb}" }, as: PssrLead, as_user_id: "${lead_id}", captures: { pssb: $.data.id } }
