# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Wine, Brewery & Food Tour Operator — Expert tier
# 9 rule_ids x >= 2 instances = 18 instances
# Logical-clock startup default: 2026-03-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_estimated_vs_settled_diverge_on_stop
        grounds:
          - calculations.partner_commission
          - state_machines.Departure.SCHEDULED_to_CONFIRMED
          - state_machines.Departure.DEPARTED_to_COMPLETED
          - entities.Stop.fields.estimated_commission_cents
          - entities.Stop.fields.settled_commission_cents
        distinguishing_aspect: |
          Same Stop/venue data: estimated commission (forward-looking over RESERVED+PAID headcount=12)
          is 1440 cents at CONFIRMED, but settled commission (chronological over CHECKED_IN headcount=6)
          is 720 cents at COMPLETED — the dual-variant calc operates on the Stop entity domain.
        test_recipe:
          setup:
            - "PUBLISHED product (base 9000, gratuity 0.18, min_age 21); venue tasting 1200/guest, commission 0.10; van seat_capacity 12"
            - "Departure SCHEDULED with one Stop; that Stop's VenueConfirmation CONFIRMED"
            - "Booking BX party 6 PAID (lead guest cleared); Booking BZ party 6 RESERVED but never paid"
            - "Departure CONFIRMED, then clock >= depart_at -> DEPARTED (BZ auto-cancelled as uncaptured), BX CHECKED_IN, clock >= return_at -> COMPLETED"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "Napa Crawl", theme: "WINE", base_price_per_person_cents: 9000, gratuity_pct: 0.18, charter_fee_cents: 5000, min_guest_age: 21 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "Van-1", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak Ridge", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main St" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${dep_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 12 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /venue-confirmations/${vc_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /guests"
              payload: { full_name: "Ada Lead", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { gx_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${gx_id}" }
              as: Operator
            - call: "POST /guests/${gx_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${gx_id}"
            - call: "POST /guests"
              payload: { full_name: "Ben Lead", birth_date: "1991-02-02T00:00:00Z" }
              as: Guest
              captures: { gz_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${gx_id}", pickup_point_id: "${pickup_id}", party_size: 6 }
              as: Guest
              as_user_id: "${gx_id}"
              captures: { bx_id: $.data.id }
            - call: "POST /bookings/${bx_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${gx_id}"
              captures: { dep_v1: $.data.version }
            - call: "POST /bookings/${bx_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${gx_id}"
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: Operator
              captures: { dep_v2: $.data.version }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${gz_id}", pickup_point_id: "${pickup_id}", party_size: 6 }
              as: Guest
              as_user_id: "${gz_id}"
              captures: { bz_id: $.data.id }
            - call: "POST /bookings/${bz_id}/reserve"
              payload: { expected_departure_version: "${dep_v2}" }
              as: Guest
              as_user_id: "${gz_id}"
            - call: "POST /departures/${dep_id}/confirm"
              payload: {}
              as: Operator
              captures: { est_stop_after_confirm: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T18:00:00Z" }
              as: Operator
            - call: "POST /departures/${dep_id}/depart"
              payload: {}
              as: Guide
            - call: "POST /bookings/${bx_id}/check-in"
              payload: {}
              as: Guide
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T23:00:00Z" }
              as: Operator
            - call: "POST /departures/${dep_id}/complete"
              payload: {}
              as: Guide
            - call: "GET /stops/${stop_id}"
              payload: {}
              as: Operator
              captures: { final_est: $.data.estimated_commission_cents, final_set: $.data.settled_commission_cents }
          assert:
            - "Stop.${stop_id}.estimated_commission_cents == 1440"
            - "Stop.${stop_id}.settled_commission_cents == 720"
            - "Stop.${stop_id}.estimated_commission_cents != Stop.${stop_id}.settled_commission_cents"

      - name: refund_weather_full_vs_leadtime_tiered_on_booking
        grounds:
          - calculations.cancellation_refund
          - state_machines.Departure.CONFIRMED_to_CANCELLED_WEATHER
          - state_machines.Departure.CONFIRMED_to_CANCELLED_OPS
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          Identical paid booking (amount_paid 71154 cents): weather cancellation refunds 71154 (100% override),
          while an ops cancellation 72h before departure refunds only 35577 (50% lead-time tier) — dual-variant
          refund logic on the Booking entity domain, distinct from the Stop-domain commission dual-variant.
        test_recipe:
          setup:
            - "Two parallel CONFIRMED departures D_W and D_O, each with one CONFIRMED stop and one PAID booking party 6 cheese add-on (amount_paid 71154)"
            - "Clock at 2026-04-07T18:00:00Z = 72h before depart_at 2026-04-10T18:00:00Z"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "Crawl", theme: "WINE", base_price_per_person_cents: 9000, gratuity_pct: 0.18, charter_fee_cents: 5000, min_guest_age: 21 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /add-ons"
              payload: { tour_product_id: "${prod_id}", name: "Cheese", price_per_person_cents: 1500 }
              as: Operator
              captures: { addon_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "VW", seat_capacity: 12 }
              as: Operator
              captures: { veh_w: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "VO", seat_capacity: 12 }
              as: Operator
              captures: { veh_o: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "GW", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { gw_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${gw_id}" }
              as: Operator
            - call: "POST /guests/${gw_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${gw_id}"
            - call: "POST /guests"
              payload: { full_name: "GO", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { go_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${go_id}" }
              as: Operator
            - call: "POST /guests/${go_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${go_id}"
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_w}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dw_id: $.data.id, dw_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${dw_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { sw_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${sw_id}", requested_headcount: 6 }
              as: Operator
              captures: { vcw_id: $.data.id }
            - call: "POST /venue-confirmations/${vcw_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${dw_id}", lead_guest_id: "${gw_id}", pickup_point_id: "${pickup_id}", party_size: 6, add_on_id: "${addon_id}" }
              as: Guest
              as_user_id: "${gw_id}"
              captures: { bw_id: $.data.id }
            - call: "POST /bookings/${bw_id}/reserve"
              payload: { expected_departure_version: "${dw_v0}" }
              as: Guest
              as_user_id: "${gw_id}"
            - call: "POST /bookings/${bw_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${gw_id}"
            - call: "POST /departures/${dw_id}/confirm"
              payload: {}
              as: Operator
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_o}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { do_id: $.data.id, do_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${do_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { so_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${so_id}", requested_headcount: 6 }
              as: Operator
              captures: { vco_id: $.data.id }
            - call: "POST /venue-confirmations/${vco_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${do_id}", lead_guest_id: "${go_id}", pickup_point_id: "${pickup_id}", party_size: 6, add_on_id: "${addon_id}" }
              as: Guest
              as_user_id: "${go_id}"
              captures: { bo_id: $.data.id }
            - call: "POST /bookings/${bo_id}/reserve"
              payload: { expected_departure_version: "${do_v0}" }
              as: Guest
              as_user_id: "${go_id}"
            - call: "POST /bookings/${bo_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${go_id}"
            - call: "POST /departures/${do_id}/confirm"
              payload: {}
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-07T18:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /departures/${dw_id}/cancel-weather"
              payload: { cancel_reason: "storm" }
              as: Operator
            - call: "POST /departures/${do_id}/cancel-ops"
              payload: { cancel_reason: "vehicle reassigned" }
              as: Operator
            - call: "GET /bookings/${bw_id}"
              payload: {}
              as: Operator
              captures: { rw: $.data.refund_cents }
            - call: "GET /bookings/${bo_id}"
              payload: {}
              as: Operator
              captures: { ro: $.data.refund_cents }
          assert:
            - "Booking.${bw_id}.refund_cents == 71154"
            - "Booking.${bo_id}.refund_cents == 35577"
            - "Booking.${bw_id}.refund_cents != Booking.${bo_id}.refund_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_round_per_person_then_multiply_mode_b
        grounds:
          - calculations.booking_price_quote
          - entities.Booking.fields.subtotal_cents
          - entities.AddOn.fields.price_per_person_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-person discounted price is rounded to the cent FIRST
          (9000*0.95 = 8550 exact here, but the pinned order is round-per-person THEN *party_size),
          then add-ons (1500*6) are added un-discounted -> subtotal 60300; sum-then-round would not
          match in the general case. Order is pinned to round-per-person-then-multiply.
        test_recipe:
          setup:
            - "PUBLISHED product base 9000, add-on Cheese 1500/guest; non-charter departure"
            - "DRAFT booking party 6 with the add-on -> quote computed at create"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "FOOD", base_price_per_person_cents: 9000, gratuity_pct: 0.18 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /add-ons"
              payload: { tour_product_id: "${prod_id}", name: "Cheese", price_per_person_cents: 1500 }
              as: Operator
              captures: { addon_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 6, add_on_id: "${addon_id}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id, sub: $.data.subtotal_cents }
          assert:
            - "Booking.${b_id}.subtotal_cents == 60300"

      - name: gratuity_circular_dep_excludes_charter_mode_c
        grounds:
          - calculations.gratuity_amount
          - calculations.booking_price_quote
          - entities.TourProduct.fields.charter_fee_cents
          - entities.Booking.fields.gratuity_cents
          - entities.Booking.fields.total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: total = subtotal + gratuity,
          gratuity = round(gratuity_base * 0.18) where gratuity_base = seats+add-ons EXCLUDING the 5000
          charter fee that IS inside subtotal — so for a charter party-12 booking subtotal=96800, gratuity_base=91800,
          gratuity=16524, total=113324 (NOT round(96800*0.18)=17424). Distinct mode from quote's rounding-order.
        test_recipe:
          setup:
            - "PUBLISHED product base 9000, gratuity 0.18, charter_fee 5000; private-charter departure on a 12-seat van"
            - "DRAFT charter booking party 12 -> quote with charter fee in subtotal but out of gratuity base"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "MIXED", base_price_per_person_cents: 9000, gratuity_pct: 0.18, charter_fee_cents: 5000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z", is_private_charter: true }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 12 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id, sub: $.data.subtotal_cents, grat: $.data.gratuity_cents, tot: $.data.total_cents }
          assert:
            - "Booking.${b_id}.subtotal_cents == 96800"
            - "Booking.${b_id}.gratuity_cents == 16524"
            - "Booking.${b_id}.total_cents == 113324"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: venue_confirmation_cyclic_revision_loop
        grounds:
          - state_machines.VenueConfirmation.REQUESTED_to_CHANGES_REQUESTED
          - state_machines.VenueConfirmation.CHANGES_REQUESTED_to_REQUESTED
          - entities.VenueConfirmation.fields.revision_count
        distinguishing_aspect: |
          VenueConfirmation cycles REQUESTED -> CHANGES_REQUESTED -> REQUESTED, incrementing revision_count
          each loop; after one full loop revision_count == 1 and status is back to REQUESTED — a genuine cycle
          on the VenueConfirmation entity, distinct from the Booking parallel-dimension machine.
        test_recipe:
          setup:
            - "A Stop on a SCHEDULED departure with a VenueConfirmation in REQUESTED"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "BREWERY", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Hop House", kind: "BREWERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1000 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /stops"
              payload: { departure_id: "${dep_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 45 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 8 }
              as: Operator
              captures: { vc_id: $.data.id }
          trigger:
            - call: "POST /venue-confirmations/${vc_id}/request-changes"
              payload: { decline_note: "shift to afternoon" }
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /venue-confirmations/${vc_id}/resubmit"
              payload: { requested_headcount: 10 }
              as: Operator
              captures: { rc: $.data.revision_count, st: $.data.status }
          assert:
            - "VenueConfirmation.${vc_id}.status == REQUESTED"
            - "VenueConfirmation.${vc_id}.revision_count == 1"
            - "VenueConfirmation.${vc_id}.requested_headcount == 10"

      - name: booking_parallel_status_and_payment_dimensions
        grounds:
          - state_machines.Booking.RESERVED_to_PAID
          - entities.Booking.fields.status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Booking carries two independent state axes: lifecycle status (DRAFT->RESERVED->PAID) and
          payment_status (UNPAID->CAPTURED). After reserve, status==RESERVED while payment_status is still
          UNPAID; after pay, status==PAID and payment_status==CAPTURED — parallel dimensions on the Booking
          entity, distinct from the VenueConfirmation cycle.
        test_recipe:
          setup:
            - "SCHEDULED departure with capacity 12; a DRAFT booking party 4 with a cleared lead guest"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000, gratuity_pct: 0.18 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${g_id}" }
              as: Operator
            - call: "POST /guests/${g_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g_id}"
