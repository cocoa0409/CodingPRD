# =============================================================================
# PRD Benchmark Seed Tables — Establishment Survey Sampling & Statistical
# Release Embargo (Bureau of Labor Statistics style)
# =============================================================================

scenario: |
  Establishment Survey Sampling & Statistical Release Embargo (Bureau of Labor Statistics): sample frame construction from administrative employment records with stratification by industry and size, respondent recruitment and reporting burden management with electronic collection and follow-up protocols, imputation and estimation methods for non-respondents with variance computation, seasonal adjustment methodology with annual revisions and benchmark realignment to administrative counts, publication calendar with pre-announced release dates and strict embargo procedures for accredited media, confidentiality protection preventing disclosure of individual establishment data with cell suppression, revision policy where preliminary estimates are updated in subsequent months, methodology change communication and historical series reconstruction

domain_name: establishment-survey-embargo
api_prefix: /survey

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer resources joined by FK / natural-key references; no nested URL trees
  state_machine_shape: cyclic    # revision loops (cycle reopen, report return/resubmit, enrollment suspend/reinstate) + one parallel-dimension machine (ReleaseEvent pub_status x disclosure_status)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # the EstimationAnalyst who certifies a cycle may not disclosure-approve its release
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SurveyProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: code, type: string, source: input, description: "Unique program code, e.g. CES. Natural key referenced by other entities.", constraints: "unique across programs; uppercase letters/digits" }
      - { name: name, type: string, source: input, description: "Human-readable program name" }
      - { name: sample_budget, type: integer, source: input, description: "Total number of establishments to allocate across strata when a frame is frozen", constraints: ">= 2" }
      - { name: embargo_window_minutes, type: integer, source: input, default: 30, description: "Minutes before release_at when the media embargo window opens", constraints: "1..1440" }
      - { name: annual_burden_budget_minutes, type: integer, source: input, default: 120, description: "Per-establishment reporting burden cap applied per calendar year", constraints: ">= 15" }

  - name: SampleFrame
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: reference_quarter, type: string, source: input, description: "Quarter covered, format YYYY-Qn (n in 1..4)" }
      - { name: strata, type: array, source: input, description: "Array of stratum objects: {industry_code, size_class, frame_unit_count, allocated_sample_size}. allocated_sample_size is null until freeze computes it.", constraints: "non-empty; industry_code in {MANUFACTURING, RETAIL, HEALTHCARE, CONSTRUCTION}; size_class in {SMALL, MEDIUM, LARGE}; frame_unit_count >= 1; at most one entry per (industry_code, size_class) pair" }
      - { name: total_sample_size, type: integer, source: computed, description: "Sum of strata[].allocated_sample_size after freeze; equals program.sample_budget" }
      - { name: frame_status, type: enum, source: system, description: "DRAFT | FROZEN | SUPERSEDED" }
      - { name: frozen_at, type: datetime, source: system, description: "Logical-clock timestamp of freeze; null while DRAFT" }
      - { name: replaced_by_frame_id, type: string, source: system, description: "Set on a SUPERSEDED frame: id of the replacement frame created with replaces_frame_id" }

  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - { name: ein, type: string, source: input, description: "Employer identification number", constraints: "unique across establishments" }
      - { name: name, type: string, source: input, description: "Establishment name" }
      - { name: industry_code, type: enum, source: input, description: "MANUFACTURING | RETAIL | HEALTHCARE | CONSTRUCTION" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE (employment size band from administrative records)" }

  - name: PanelEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; the sampled establishment" }
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: industry_code, type: enum, source: system, description: "Copied from Establishment at enrollment time (snapshot; never refreshed)" }
      - { name: size_class, type: enum, source: system, description: "Copied from Establishment at enrollment time (snapshot; never refreshed)" }
      - { name: base_weight, type: number, source: computed, description: "Design weight = stratum frame_unit_count / allocated_sample_size from the program's latest FROZEN frame at enrollment time; 6 decimal places, round_half_up" }
      - { name: burden_minutes_ytd, type: integer, source: computed, description: "Calendar-year burden accumulator: 15 per report submission + sum of non-voided follow-up contact minutes; resets to 0 when the first burden event of a new calendar year lands" }
      - { name: burden_year, type: integer, source: system, description: "Calendar year burden_minutes_ytd currently covers; null until first burden event" }
      - { name: enrollment_status, type: enum, source: system, description: "INVITED | ENROLLED | REFUSED | SUSPENDED | EXITED" }

  - name: SurveyCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: reference_month, type: string, source: input, description: "Month being measured, format YYYY-MM", constraints: "unique per program" }
      - { name: collection_open_at, type: datetime, source: computed, description: "= reference_month first day 00:00:00Z" }
      - { name: collection_close_at, type: datetime, source: computed, description: "= reference_month 20th day 23:59:59Z" }
      - { name: cycle_status, type: enum, source: system, description: "SCHEDULED | COLLECTING | PROCESSING | CERTIFIED | PUBLISHED | REVISION_OPEN" }
      - { name: estimates_computed_at, type: datetime, source: system, description: "Logical-clock timestamp of last COMPUTE_ESTIMATES; cleared by REOPEN_REVISION and CLOSE_COLLECTION" }
      - { name: weighted_response_rate, type: number, source: computed, description: "Sum of base_weight over enrollments with an ACCEPTED report / sum over ENROLLED enrollments, at last compute; 6 decimals, round_half_up; null before first compute" }
      - { name: unweighted_response_rate, type: number, source: computed, description: "Count of enrollments with an ACCEPTED report / count of ENROLLED enrollments, at last compute; 6 decimals, round_half_up; null before first compute" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the EstimationAnalyst who certified; used for segregation-of-duties checks" }

  - name: ResponseReport
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> PanelEnrollment.id; the reporting enrollment" }
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; the cycle being reported" }
      - { name: employment, type: integer, source: input, description: "Reported employment for the reference month", constraints: ">= 0" }
      - { name: report_status, type: enum, source: system, description: "SUBMITTED | RETURNED | ACCEPTED" }
      - { name: submit_count, type: integer, source: system, default: 0, description: "Number of submission events (initial create + each resubmission after RETURNED); each adds 15 burden minutes" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest submission" }
      - { name: return_reason, type: string, source: input, description: "Required when a CollectionOfficer returns a report for correction; null otherwise" }

  - name: FollowUpCase
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> PanelEnrollment.id; non-respondent being pursued" }
      - { name: cycle_id, type: string, source: system, description: "FK -> SurveyCycle.id; cycle whose collection closed without an ACCEPTED report" }
      - { name: case_status, type: enum, source: system, description: "OPEN | IN_CONTACT | ESCALATED | CLOSED_RESPONDED | CLOSED_REFUSED | CLOSED_UNRESPONSIVE" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp when CLOSE_COLLECTION created the case" }
      - { name: contacts, type: array, source: system, description: "Append-only array of {seq, contact_minutes, channel, contacted_at, voided}; seq starts at 1 and increments per recorded contact" }
      - { name: total_contact_minutes, type: integer, source: computed, description: "Sum of contact_minutes over contacts with voided == false" }

  - name: CellEstimate
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> SurveyCycle.id; cycle this estimate belongs to" }
      - { name: program_code, type: string, source: system, description: "Denormalized from SurveyCycle.program_code at compute time" }
      - { name: industry_code, type: enum, source: system, description: "Cell industry dimension: MANUFACTURING | RETAIL | HEALTHCARE | CONSTRUCTION" }
      - { name: size_class, type: enum, source: system, description: "Cell size dimension: SMALL | MEDIUM | LARGE" }
      - { name: estimate_status, type: enum, source: system, description: "PRELIMINARY | REVISED | FINAL | RECONSTRUCTED" }
      - { name: revision_no, type: integer, source: system, default: 1, description: "1 for the preliminary estimate; +1 on every recompute in REVISION_OPEN, on benchmark realignment, and on methodology reconstruction" }
      - { name: employment_estimate, type: integer, source: computed, description: "Weighted cell employment estimate (whole persons, round_half_up); null-masked in bulletins when suppressed" }
      - { name: variance_estimate, type: integer, source: computed, description: "Horvitz-Thompson-style variance proxy per calculation cell_variance" }
      - { name: respondent_count, type: integer, source: computed, description: "Enrollments in this cell with an ACCEPTED report for the cycle" }
      - { name: enrolled_count, type: integer, source: computed, description: "ENROLLED enrollments in this cell at compute time (denominator set)" }
      - { name: dominance_flag, type: boolean, source: computed, description: "true when a single establishment's weighted contribution is >= 60% of the cell estimate" }
      - { name: suppression_status, type: enum, source: computed, description: "NONE | PRIMARY | COMPLEMENTARY per calculation suppression_resolution" }
      - { name: imputation_variant, type: enum, source: system, description: "LINK_RELATIVE when computed while cycle PROCESSING; STRATUM_MEAN when computed in REVISION_OPEN; null when no imputation was needed" }
      - { name: seasonally_adjusted_concurrent, type: integer, source: computed, description: "round_half_up(employment_estimate / concurrent factor, 0) frozen at compute time using the then-current factor set; null when no factor set existed" }
      - { name: seasonally_adjusted_revised, type: integer, source: computed, description: "Recomputed when a SeasonalFactorSet for this series+year is finalized: round_half_up(current employment_estimate / final factor, 0); null until a finalize happens" }
      - { name: wedge_factor, type: number, source: system, description: "Benchmark wedge r applied to this cell (6 decimals, round_half_up); null until benchmarked" }

  - name: SeasonalFactorSet
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: industry_code, type: enum, source: input, description: "Series industry: MANUFACTURING | RETAIL | HEALTHCARE | CONSTRUCTION" }
      - { name: size_class, type: enum, source: input, description: "Series size: SMALL | MEDIUM | LARGE" }
      - { name: year, type: integer, source: input, description: "Calendar year the factors apply to" }
      - { name: factors, type: array, source: input, description: "Exactly 12 numbers, Jan..Dec, each in [0.2, 5.0]; their arithmetic mean must lie within 1.0 +/- 0.0005 (inclusive)" }
      - { name: set_status, type: enum, source: system, description: "PROVISIONAL | FINAL | SUPERSEDED" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of finalize; null while PROVISIONAL" }

  - name: BenchmarkRun
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: benchmark_month, type: string, source: input, description: "Anchor month YYYY-MM whose cycle cells are aligned to administrative counts" }
      - { name: admin_cell_counts, type: array, source: input, description: "Array of {industry_code, size_class, admin_employment}; admin_employment integer >= 0; at most one entry per (industry_code, size_class)", constraints: "non-empty" }
      - { name: run_status, type: enum, source: system, description: "DRAFT | APPLIED" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock timestamp of apply; null while DRAFT" }

  - name: MethodologyNotice
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Natural-key reference to SurveyProgram.code (validated for existence)" }
      - { name: title, type: string, source: input, description: "Public title of the methodology change" }
      - { name: effective_from, type: datetime, source: input, description: "Instant the change takes effect; ANNOUNCE requires it to be strictly in the future" }
      - { name: scope, type: enum, source: input, description: "ALL_SERIES | LISTED_SERIES" }
      - { name: series, type: array, source: input, description: "Array of {industry_code, size_class}; required and non-empty when scope == LISTED_SERIES, ignored otherwise" }
      - { name: reconstruction_factor_ppm, type: integer, source: input, description: "Multiplicative historical-series reconstruction factor in parts per million (1_000_000 = no change)", constraints: ">= 1" }
      - { name: notice_status, type: enum, source: system, description: "DRAFT | ANNOUNCED | EFFECTIVE | WITHDRAWN" }
      - { name: announced_at, type: datetime, source: system, description: "Logical-clock timestamp of ANNOUNCE; null while DRAFT" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of ACTIVATE; null until EFFECTIVE" }

  - name: ReleaseEvent
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; cycle whose estimates this release publishes" }
      - { name: program_code, type: string, source: system, description: "Denormalized from SurveyCycle.program_code at creation" }
      - { name: release_at, type: datetime, source: input, description: "Pre-announced publication instant; must be >= now + 3 days at schedule time" }
      - { name: embargo_open_at, type: datetime, source: computed, description: "= release_at - program.embargo_window_minutes, snapshotted at create and recomputed at each RESCHEDULE using the program window current at that moment" }
      - { name: pub_status, type: enum, source: system, description: "SCHEDULED | EMBARGO_OPEN | POSTPONED | PUBLISHED (publication dimension)" }
      - { name: disclosure_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED (parallel disclosure dimension); auto-reverts APPROVED -> PENDING when underlying estimates change" }
      - { name: revision_notice_required, type: boolean, source: system, default: false, description: "Set when estimates under an already-published release change (reopen, benchmark, reconstruction); cleared by a subsequent APPROVE_DISCLOSURE" }
      - { name: active_embargo_grant_count, type: integer, source: computed, description: "Count of this release's EmbargoGrants in {ISSUED, ACCESSED}; recomputed whenever a grant changes status" }

  - name: MediaOutlet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Outlet name" }
      - { name: outlet_code, type: string, source: input, description: "Unique outlet code", constraints: "unique across outlets" }
      - { name: accreditation_status, type: enum, source: system, description: "PENDING | ACCREDITED | SUSPENDED | REVOKED" }

  - name: EmbargoGrant
    parent: null
    common_fields: true
    fields:
      - { name: release_event_id, type: string, source: system, description: "FK -> ReleaseEvent.id; release this grant unlocks" }
      - { name: media_outlet_id, type: string, source: system, description: "FK -> MediaOutlet.id; accredited outlet holding the grant" }
      - { name: grant_status, type: enum, source: system, description: "ISSUED | ACCESSED | REVOKED | BREACHED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of OPEN_EMBARGO issuance" }
      - { name: first_accessed_at, type: datetime, source: system, description: "Logical-clock timestamp of first successful bulletin read; null until accessed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SampleFrame
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FROZEN
        trigger: "POST /survey/sample-frames/{id}/freeze"
        actor: ProgramAdmin
        preconditions:
          - "frame.frame_status == DRAFT"
          - "program.sample_budget >= 2 * count(frame.strata) (else ERR_SAMPLE_BUDGET_INFEASIBLE)"
        side_effects:
          - "runs calculation neyman_stratum_allocation: writes each strata[].allocated_sample_size and frame.total_sample_size"
          - "sets frame.frozen_at = current logical clock"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /survey/sample-frames with replaces_frame_id = this frame"
        actor: ProgramAdmin
        preconditions:
          - "replacement frame references this frame and has the same reference_quarter"
        side_effects:
          - "sets frame.replaced_by_frame_id = replacement id"
      - from: FROZEN
        to: SUPERSEDED
        trigger: "POST /survey/sample-frames with replaces_frame_id = this frame"
        actor: ProgramAdmin
        preconditions:
          - "replacement frame references this frame and has the same reference_quarter"
        side_effects:
          - "sets frame.replaced_by_frame_id = replacement id"
        note: "Replacement does NOT reweight existing enrollments; PanelEnrollment.base_weight is a snapshot."

  - entity: PanelEnrollment
    initial_state: INVITED
    terminal_states: [REFUSED, EXITED]
    transitions:
      - from: INVITED
        to: ENROLLED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=ACCEPT"
        actor: Respondent (owning establishment only)
        preconditions:
          - "enrollment.enrollment_status == INVITED"
          - "X-User-ID == enrollment.establishment_id"
        side_effects: []
      - from: INVITED
        to: REFUSED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=DECLINE"
        actor: Respondent (owning establishment only)
        preconditions:
          - "enrollment.enrollment_status == INVITED"
          - "X-User-ID == enrollment.establishment_id"
        side_effects: []
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=SUSPEND"
        actor: Respondent (owning establishment) or CollectionOfficer
        preconditions:
          - "enrollment.enrollment_status == ENROLLED"
          - "if actor is Respondent: X-User-ID == enrollment.establishment_id"
        side_effects:
          - "enrollment leaves the response-rate denominator of future computes while SUSPENDED"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=REINSTATE"
        actor: CollectionOfficer
        preconditions:
          - "enrollment.enrollment_status == SUSPENDED"
        side_effects: []
      - from: ENROLLED
        to: EXITED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=EXIT"
        actor: CollectionOfficer
        preconditions:
          - "enrollment.enrollment_status == ENROLLED"
          - "no FollowUpCase for this enrollment in {OPEN, IN_CONTACT, ESCALATED} (else ERR_CASE_STILL_OPEN)"
        side_effects: []
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /survey/panel-enrollments/{id}/lifecycle action=EXIT"
        actor: CollectionOfficer
        preconditions:
          - "enrollment.enrollment_status == SUSPENDED"
          - "no FollowUpCase for this enrollment in {OPEN, IN_CONTACT, ESCALATED} (else ERR_CASE_STILL_OPEN)"
        side_effects: []

  - entity: SurveyCycle
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: COLLECTING
        trigger: "POST /survey/survey-cycles/{id}/advance action=OPEN_COLLECTION"
        actor: CollectionOfficer
        preconditions:
          - "cycle.cycle_status == SCHEDULED"
          - "logical clock >= cycle.collection_open_at (else ERR_CYCLE_WINDOW_VIOLATION)"
        side_effects: []
      - from: COLLECTING
        to: PROCESSING
        trigger: "POST /survey/survey-cycles/{id}/advance action=CLOSE_COLLECTION"
        actor: CollectionOfficer
        preconditions:
          - "cycle.cycle_status == COLLECTING"
          - "logical clock >= cycle.collection_close_at (else ERR_CYCLE_WINDOW_VIOLATION)"
        side_effects:
          - "for each PanelEnrollment of this program with enrollment_status == ENROLLED and no ACCEPTED ResponseReport for this cycle: create FollowUpCase (case_status OPEN, opened_at = clock)"
          - "clears cycle.estimates_computed_at"
      - from: PROCESSING
        to: PROCESSING
        trigger: "POST /survey/survey-cycles/{id}/advance action=COMPUTE_ESTIMATES"
        actor: EstimationAnalyst
        preconditions:
          - "cycle.cycle_status == PROCESSING"
        side_effects:
          - "runs calculations cell_estimate_with_imputation (LINK_RELATIVE pass), cell_variance, response_rates, suppression_resolution; upserts CellEstimate rows keyed (cycle_id, industry_code, size_class) with estimate_status PRELIMINARY (revision_no unchanged on recompute while PROCESSING)"
          - "sets cycle.estimates_computed_at, cycle.weighted_response_rate, cycle.unweighted_response_rate"
      - from: REVISION_OPEN
        to: REVISION_OPEN
        trigger: "POST /survey/survey-cycles/{id}/advance action=COMPUTE_ESTIMATES"
        actor: EstimationAnalyst
        preconditions:
          - "cycle.cycle_status == REVISION_OPEN"
        side_effects:
          - "runs calculation cell_estimate_with_imputation (STRATUM_MEAN pass): recomputed cells move PRELIMINARY -> REVISED or REVISED -> REVISED with revision_no + 1"
          - "sets cycle.estimates_computed_at and both response rates"
      - from: PROCESSING
        to: CERTIFIED
        trigger: "POST /survey/survey-cycles/{id}/advance action=CERTIFY"
        actor: EstimationAnalyst
        preconditions:
          - "cycle.cycle_status == PROCESSING"
          - "cycle.estimates_computed_at is set (else ERR_ESTIMATES_NOT_COMPUTED)"
          - "cycle.weighted_response_rate >= 0.600000 (null treated as 0; else ERR_RESPONSE_RATE_BELOW_MINIMUM)"
        side_effects:
          - "sets cycle.certified_by_user_id = X-User-ID of the certifying EstimationAnalyst"
      - from: REVISION_OPEN
        to: CERTIFIED
        trigger: "POST /survey/survey-cycles/{id}/advance action=CERTIFY"
        actor: EstimationAnalyst
        preconditions:
          - "cycle.cycle_status == REVISION_OPEN"
          - "cycle.estimates_computed_at is set (else ERR_ESTIMATES_NOT_COMPUTED)"
          - "cycle.weighted_response_rate >= 0.600000 (else ERR_RESPONSE_RATE_BELOW_MINIMUM)"
        side_effects:
          - "sets cycle.certified_by_user_id = X-User-ID"
          - "if a ReleaseEvent for this cycle has pub_status == PUBLISHED: cycle lands in PUBLISHED instead of CERTIFIED"
      - from: PUBLISHED
        to: REVISION_OPEN
        trigger: "POST /survey/survey-cycles/{id}/advance action=REOPEN_REVISION"
        actor: EstimationAnalyst
        preconditions:
          - "cycle.cycle_status == PUBLISHED"
        side_effects:
          - "clears cycle.estimates_computed_at"
          - "on the cycle's PUBLISHED ReleaseEvent: revision_notice_required = true, and disclosure_status APPROVED -> PENDING (REJECTED/PENDING unchanged)"
    note: "PUBLISHED -> REVISION_OPEN -> CERTIFIED -> PUBLISHED forms the revision loop (non-linear, cyclic)."

  - entity: ResponseReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /survey/response-reports/{id}/advance action=ACCEPT"
        actor: CollectionOfficer
        preconditions:
          - "report.report_status == SUBMITTED"
          - "report's cycle.cycle_status in {COLLECTING, PROCESSING} (else ERR_CYCLE_NOT_COLLECTING)"
        side_effects:
          - "if a FollowUpCase exists for (report.enrollment_id, report.cycle_id) in {OPEN, IN_CONTACT, ESCALATED}: it transitions to CLOSED_RESPONDED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /survey/response-reports/{id}/advance action=RETURN (return_reason required)"
        actor: CollectionOfficer
        preconditions:
          - "report.report_status == SUBMITTED"
          - "report's cycle.cycle_status == COLLECTING (else ERR_CYCLE_NOT_COLLECTING)"
        side_effects:
          - "sets report.return_reason"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /survey/response-reports/{id}/advance action=SUBMIT"
        actor: Respondent (owning establishment only)
        preconditions:
          - "report.report_status == RETURNED"
          - "report's cycle.cycle_status == COLLECTING (else ERR_CYCLE_NOT_COLLECTING)"
          - "logical clock <= cycle.collection_close_at (else ERR_REPORT_WINDOW_CLOSED)"
          - "X-User-ID == enrollment.establishment_id"
        side_effects:
          - "report.submit_count += 1; report.submitted_at = clock; clears return_reason"
          - "enrollment burden: +15 minutes via burden ledger rule (with calendar-year rollover)"
    note: "SUBMITTED -> RETURNED -> SUBMITTED is the correction cycle (non-linear)."

  - entity: FollowUpCase
    initial_state: OPEN
    terminal_states: [CLOSED_RESPONDED, CLOSED_REFUSED, CLOSED_UNRESPONSIVE]
    transitions:
      - from: OPEN
        to: IN_CONTACT
        trigger: "POST /survey/follow-up-cases/{id}/advance action=RECORD_CONTACT"
        actor: CollectionOfficer
        preconditions:
          - "case.case_status in {OPEN, IN_CONTACT, ESCALATED}"
          - "contact_minutes in 1..480; >= 24h since the last non-voided contact on this case (else ERR_CONTACT_TOO_SOON)"
          - "burden check: enrollment.burden_minutes_ytd + contact_minutes <= program.annual_burden_budget_minutes after year-rollover reset (else ERR_BURDEN_BUDGET_EXCEEDED)"
        side_effects:
          - "appends contacts entry {seq = max seq + 1, contact_minutes, channel, contacted_at = clock, voided = false}"
          - "enrollment.burden_minutes_ytd += contact_minutes"
      - from: IN_CONTACT
        to: IN_CONTACT
        trigger: "POST /survey/follow-up-cases/{id}/advance action=RECORD_CONTACT"
        actor: CollectionOfficer
        preconditions: ["same as OPEN -> IN_CONTACT"]
        side_effects: ["same as OPEN -> IN_CONTACT"]
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /survey/follow-up-cases/{id}/advance action=RECORD_CONTACT"
        actor: CollectionOfficer
        preconditions: ["same as OPEN -> IN_CONTACT"]
        side_effects: ["same as OPEN -> IN_CONTACT except status unchanged"]
      - from: IN_CONTACT
        to: ESCALATED
        trigger: "POST /survey/follow-up-cases/{id}/advance action=ESCALATE"
        actor: CollectionOfficer
        preconditions:
          - "case.case_status == IN_CONTACT"
          - ">= 2 non-voided contacts AND logical clock >= case.opened_at + 7 days (else ERR_ESCALATION_TOO_EARLY)"
        side_effects: []
      - from: OPEN
        to: CLOSED_REFUSED
        trigger: "POST /survey/follow-up-cases/{id}/advance action=CLOSE outcome=REFUSED"
        actor: CollectionOfficer
        preconditions:
          - "case.case_status in {OPEN, IN_CONTACT, ESCALATED}"
          - ">= 1 non-voided contact exists (else ERR_NO_CONTACT_RECORDED)"
        side_effects: []
      - from: IN_CONTACT
        to: CLOSED_REFUSED
        trigger: "POST /survey/follow-up-cases/{id}/advance action=CLOSE outcome=REFUSED"
        actor: CollectionOfficer
        preconditions: ["same as OPEN -> CLOSED_REFUSED"]
        side_effects: []
      - from: ESCALATED
        to: CLOSED_REFUSED
        trigger: "POST /survey/follow-up-cases/{id}/advance action=CLOSE outcome=REFUSED"
        actor: CollectionOfficer
        preconditions: ["same as OPEN -> CLOSED_REFUSED"]
        side_effects: []
      - from: ESCALATED
        to: CLOSED_UNRESPONSIVE
        trigger: "POST /survey/follow-up-cases/{id}/advance action=CLOSE outcome=UNRESPONSIVE"
        actor: CollectionOfficer
        preconditions:
          - "case.case_status == ESCALATED (from OPEN/IN_CONTACT this is ERR_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: CLOSED_RESPONDED
        trigger: "system (cascade from report ACCEPT)"
        actor: system
        preconditions:
          - "case.case_status in {OPEN, IN_CONTACT, ESCALATED}"
        side_effects: []
      - from: IN_CONTACT
        to: CLOSED_RESPONDED
        trigger: "system (cascade from report ACCEPT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: CLOSED_RESPONDED
        trigger: "system (cascade from report ACCEPT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CellEstimate
    initial_state: PRELIMINARY
    terminal_states: [RECONSTRUCTED]
    transitions:
      - from: PRELIMINARY
        to: PRELIMINARY
        trigger: "system (recompute while cycle PROCESSING via COMPUTE_ESTIMATES)"
        actor: system
        preconditions: ["cycle.cycle_status == PROCESSING"]
        side_effects: ["fields refreshed in place; revision_no unchanged"]
      - from: PRELIMINARY
        to: REVISED
        trigger: "system (recompute while cycle REVISION_OPEN via COMPUTE_ESTIMATES)"
        actor: system
        preconditions: ["cycle.cycle_status == REVISION_OPEN"]
        side_effects: ["revision_no += 1"]
      - from: REVISED
        to: REVISED
        trigger: "system (recompute while cycle REVISION_OPEN via COMPUTE_ESTIMATES)"
        actor: system
        preconditions: ["cycle.cycle_status == REVISION_OPEN"]
        side_effects: ["revision_no += 1"]
      - from: PRELIMINARY
        to: FINAL
        trigger: "system (cascade from POST /survey/benchmark-runs/{id}/apply)"
        actor: system
        preconditions: ["cell series present in benchmark admin_cell_counts", "cell cycle's reference_month within benchmark year, <= benchmark_month"]
        side_effects: ["employment_estimate realigned per calculation benchmark_wedge_realignment", "revision_no += 1", "wedge_factor set"]
      - from: REVISED
        to: FINAL
        trigger: "system (cascade from POST /survey/benchmark-runs/{id}/apply)"
        actor: system
        preconditions: ["same as PRELIMINARY -> FINAL"]
        side_effects: ["same as PRELIMINARY -> FINAL"]
      - from: FINAL
        to: RECONSTRUCTED
        trigger: "system (cascade from methodology notice ACTIVATE when cell series in scope)"
        actor: system
        preconditions: ["notice.scope covers (cell.industry_code, cell.size_class)"]
        side_effects:
          - "employment_estimate = round_half_up(employment_estimate * notice.reconstruction_factor_ppm / 1000000, 0); revision_no += 1"
          - "in-scope FINAL SeasonalFactorSets -> SUPERSEDED"
          - "PUBLISHED ReleaseEvents of affected cycles: revision_notice_required = true, disclosure_status APPROVED -> PENDING"
    note: "REVISED -> REVISED self-loop plus FINAL -> RECONSTRUCTED make this machine cyclic-shaped (non-linear)."

  - entity: SeasonalFactorSet
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system (a new SeasonalFactorSet is created for the same program_code + industry_code + size_class + year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (new set created for same series+year, or methodology notice ACTIVATE covering the series)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /survey/seasonal-factor-sets/{id}/finalize"
        actor: SurveyMethodologist
        preconditions:
          - "set.set_status == PROVISIONAL"
          - "logical clock >= January 1 00:00:00Z of (year + 1) (else ERR_FACTOR_SET_FINALIZE_TOO_EARLY)"
        side_effects:
          - "sets finalized_at = clock"
          - "recomputes seasonally_adjusted_revised on every CellEstimate of this program+series whose cycle reference_month falls in `year`, using the current employment_estimate: round_half_up(employment_estimate / factors[month_index], 0)"

  - entity: BenchmarkRun
    initial_state: DRAFT
    terminal_states: [APPLIED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /survey/benchmark-runs/{id}/apply"
        actor: SurveyMethodologist
        preconditions:
          - "run.run_status == DRAFT"
          - "the cycle for (program_code, benchmark_month) has cycle_status in {CERTIFIED, PUBLISHED} (else ERR_CYCLE_NOT_CERTIFIED)"
          - "for every entry in admin_cell_counts: a CellEstimate exists for (benchmark-month cycle, industry_code, size_class) with estimate_status in {PRELIMINARY, REVISED} (else ERR_BENCHMARK_CELL_MISSING); if that cell's employment_estimate == 0 and admin_employment > 0 -> ERR_BENCHMARK_UNDEFINED_WEDGE"
        side_effects:
          - "runs calculation benchmark_wedge_realignment per admin cell: benchmark-month cell := admin_employment and -> FINAL; same-year earlier-month cells of the same series (status in {PRELIMINARY, REVISED}) := round_half_up(estimate * r, 0) and -> FINAL; revision_no += 1 on each touched cell"
          - "for each affected cycle whose ReleaseEvent is PUBLISHED: revision_notice_required = true and disclosure_status APPROVED -> PENDING"
          - "sets applied_at = clock"

  - entity: MethodologyNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /survey/methodology-notices/{id}/advance action=ANNOUNCE"
        actor: SurveyMethodologist
        preconditions:
          - "notice.notice_status == DRAFT"
          - "notice.effective_from is strictly after the logical clock (else ERR_VALIDATION)"
        side_effects: ["sets announced_at = clock"]
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /survey/methodology-notices/{id}/advance action=ACTIVATE"
        actor: SurveyMethodologist
        preconditions:
          - "notice.notice_status == ANNOUNCED"
          - "logical clock >= notice.effective_from (else ERR_NOTICE_NOT_EFFECTIVE)"
        side_effects:
          - "runs reconstruction on in-scope FINAL CellEstimates (see CellEstimate FINAL -> RECONSTRUCTED)"
          - "in-scope FINAL SeasonalFactorSets -> SUPERSEDED"
          - "PUBLISHED ReleaseEvents of affected cycles: revision_notice_required = true, disclosure_status APPROVED -> PENDING"
          - "sets activated_at = clock"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /survey/methodology-notices/{id}/advance action=WITHDRAW"
        actor: SurveyMethodologist
        preconditions: ["notice.notice_status in {DRAFT, ANNOUNCED}"]
        side_effects: []
      - from: ANNOUNCED
        to: WITHDRAWN
        trigger: "POST /survey/methodology-notices/{id}/advance action=WITHDRAW"
        actor: SurveyMethodologist
        preconditions: ["notice.notice_status in {DRAFT, ANNOUNCED}"]
        side_effects: []

  - entity: ReleaseEvent
    initial_state: "pub_status=SCHEDULED, disclosure_status=PENDING (parallel dimensions)"
    terminal_states: ["pub_status=PUBLISHED (publication dimension terminal)"]
    transitions:
      - from: SCHEDULED
        to: EMBARGO_OPEN
        trigger: "POST /survey/release-events/{id}/advance action=OPEN_EMBARGO"
        actor: ReleaseManager
        preconditions:
          - "release.pub_status == SCHEDULED"
          - "logical clock >= release.embargo_open_at (else ERR_RELEASE_TOO_EARLY)"
          - "cycle.cycle_status == CERTIFIED (else ERR_CYCLE_NOT_CERTIFIED)"
          - "release.disclosure_status == APPROVED (else ERR_DISCLOSURE_NOT_APPROVED)"
        side_effects:
          - "creates one EmbargoGrant (ISSUED, issued_at = clock) per MediaOutlet with accreditation_status == ACCREDITED at this moment"
          - "sets release.active_embargo_grant_count = number of grants created"
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /survey/release-events/{id}/advance action=POSTPONE"
        actor: ReleaseManager
        preconditions: ["release.pub_status == SCHEDULED"]
        side_effects: []
      - from: EMBARGO_OPEN
        to: POSTPONED
        trigger: "POST /survey/release-events/{id}/advance action=POSTPONE"
        actor: ReleaseManager
        preconditions: ["release.pub_status == EMBARGO_OPEN"]
        side_effects:
          - "all grants of this release in {ISSUED, ACCESSED} -> REVOKED; active_embargo_grant_count recomputed (= 0)"
      - from: POSTPONED
        to: SCHEDULED
        trigger: "POST /survey/release-events/{id}/advance action=RESCHEDULE (new_release_at + expected_release_version required)"
        actor: ReleaseManager
        preconditions:
          - "release.pub_status == POSTPONED"
          - "expected_release_version == release.version (else ERR_STALE_VERSION)"
          - "new_release_at >= clock + 3 days (else ERR_PREANNOUNCE_LEAD_TOO_SHORT)"
          - "new embargo window does not overlap other SCHEDULED/EMBARGO_OPEN releases of the same program (else ERR_EMBARGO_WINDOW_OVERLAP)"
        side_effects:
          - "release_at = new_release_at; embargo_open_at recomputed using the program's CURRENT embargo_window_minutes"
          - "increments release.version by 1"
      - from: EMBARGO_OPEN
        to: PUBLISHED
        trigger: "POST /survey/release-events/{id}/advance action=PUBLISH"
        actor: ReleaseManager
        preconditions:
          - "release.pub_status == EMBARGO_OPEN"
          - "logical clock >= release.release_at (else ERR_RELEASE_TOO_EARLY)"
          - "release.disclosure_status == APPROVED (else ERR_DISCLOSURE_NOT_APPROVED)"
        side_effects:
          - "cycle CERTIFIED -> PUBLISHED"
      - from: "disclosure PENDING"
        to: "disclosure APPROVED"
        trigger: "POST /survey/release-events/{id}/advance action=APPROVE_DISCLOSURE"
        actor: DisclosureOfficer
        preconditions:
          - "release.disclosure_status in {PENDING, REJECTED} (from APPROVED -> ERR_INVALID_STATE)"
          - "cycle.cycle_status in {CERTIFIED, PUBLISHED} (else ERR_CYCLE_NOT_CERTIFIED)"
          - "X-User-ID != cycle.certified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["clears release.revision_notice_required"]
      - from: "disclosure PENDING"
        to: "disclosure REJECTED"
        trigger: "POST /survey/release-events/{id}/advance action=REJECT_DISCLOSURE"
        actor: DisclosureOfficer
        preconditions:
          - "release.disclosure_status in {PENDING, REJECTED}"
          - "cycle.cycle_status in {CERTIFIED, PUBLISHED} (else ERR_CYCLE_NOT_CERTIFIED)"
          - "X-User-ID != cycle.certified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: "disclosure APPROVED"
        to: "disclosure PENDING"
        trigger: "system (auto-revert when underlying estimates change: cycle REOPEN_REVISION, benchmark apply, methodology ACTIVATE)"
        actor: system
        preconditions: []
        side_effects: ["sets revision_notice_required = true"]
    note: "Two parallel state dimensions (pub_status x disclosure_status) evolve independently on one entity; disclosure auto-reverts on estimate change."

  - entity: MediaOutlet
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACCREDITED
        trigger: "POST /survey/media-outlets/{id}/accreditation action=ACCREDIT"
        actor: ReleaseManager
        preconditions: ["outlet.accreditation_status == PENDING"]
        side_effects: []
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /survey/media-outlets/{id}/accreditation action=SUSPEND, or system cascade from embargo breach"
        actor: ReleaseManager | system
        preconditions: ["outlet.accreditation_status == ACCREDITED"]
        side_effects:
          - "all grants of this outlet in {ISSUED, ACCESSED} -> REVOKED; each affected release's active_embargo_grant_count recomputed"
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /survey/media-outlets/{id}/accreditation action=REINSTATE"
        actor: ReleaseManager
        preconditions: ["outlet.accreditation_status == SUSPENDED"]
        side_effects: []
        note: "Reinstatement does NOT restore revoked grants; the outlet waits for the next release's OPEN_EMBARGO."
      - from: ACCREDITED
        to: REVOKED
        trigger: "POST /survey/media-outlets/{id}/accreditation action=REVOKE"
        actor: ReleaseManager
        preconditions: ["outlet.accreditation_status in {ACCREDITED, SUSPENDED}"]
        side_effects: ["same grant-revocation cascade as SUSPEND"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /survey/media-outlets/{id}/accreditation action=REVOKE"
        actor: ReleaseManager
        preconditions: ["outlet.accreditation_status in {ACCREDITED, SUSPENDED}"]
        side_effects: []
    note: "ACCREDITED <-> SUSPENDED is a cycle (non-linear)."

  - entity: EmbargoGrant
    initial_state: ISSUED
    terminal_states: [REVOKED, BREACHED]
    transitions:
      - from: ISSUED
        to: ACCESSED
        trigger: "GET /survey/embargo-grants/{id}/bulletin (first successful read)"
        actor: AccreditedMedia (owning outlet only)
        preconditions:
          - "grant.grant_status in {ISSUED, ACCESSED} (REVOKED/BREACHED -> ERR_INVALID_STATE)"
          - "X-User-ID == grant.media_outlet_id (else ERR_FORBIDDEN)"
          - "logical clock >= release.embargo_open_at (else ERR_EMBARGO_NOT_OPEN)"
        side_effects:
          - "sets first_accessed_at = clock on the ISSUED -> ACCESSED transition only"
      - from: ISSUED
        to: REVOKED
        trigger: "system (cascade: outlet SUSPEND/REVOKE, release POSTPONE, or breach of another grant of the same outlet)"
        actor: system
        preconditions: []
        side_effects: ["owning release's active_embargo_grant_count recomputed"]
      - from: ACCESSED
        to: REVOKED
        trigger: "system (same cascades as ISSUED -> REVOKED)"
        actor: system
        preconditions: []
        side_effects: ["owning release's active_embargo_grant_count recomputed"]
      - from: ISSUED
        to: BREACHED
        trigger: "POST /survey/embargo-grants/{id}/report-breach"
        actor: ReleaseManager
        preconditions: ["grant.grant_status in {ISSUED, ACCESSED}"]
        side_effects:
          - "media outlet ACCREDITED -> SUSPENDED (breach cascade)"
          - "the outlet's OTHER grants in {ISSUED, ACCESSED} -> REVOKED"
          - "each affected release's active_embargo_grant_count recomputed"
      - from: ACCESSED
        to: BREACHED
        trigger: "POST /survey/embargo-grants/{id}/report-breach"
        actor: ReleaseManager
        preconditions: ["grant.grant_status in {ISSUED, ACCESSED}"]
        side_effects: ["same as ISSUED -> BREACHED"]
    note: "Breach cascade is depth 3: grant -> outlet -> sibling grants -> release counters."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: frame-create-stale-program
    parent_entity: SurveyProgram
    write_endpoint: "POST /survey/sample-frames"
    occ_field: expected_program_version
    description: |
      Creating a SampleFrame against a SurveyProgram whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created (or replaced) a frame for the same
      program — which mutates program-level frame lineage — so the current
      writer's view of the program is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: release-reschedule-stale-release
    parent_entity: ReleaseEvent
    write_endpoint: "POST /survey/release-events/{id}/advance"
    occ_field: expected_release_version
    description: |
      Every ReleaseEvent advance action (POSTPONE / RESCHEDULE / OPEN_EMBARGO /
      APPROVE_DISCLOSURE / REJECT_DISCLOSURE / PUBLISH) carries
      expected_release_version; a writer holding a stale version of the release
      is rejected. This captures the case where a release has just been
      rescheduled and the current writer's view of release_at is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: neyman_stratum_allocation
    trigger: "POST /survey/sample-frames/{id}/freeze"
    algorithm: constraint_propagation
    formula: |
      Inputs: strata (industry_code, size_class, frame_unit_count n_h), program.sample_budget N.
      Dispersion proxy s_h by size_class: SMALL=4, MEDIUM=15, LARGE=50.
      1. raw_h = N * (n_h * s_h) / SUM_over_strata(n_j * s_j)
      2. floor_h = floor(raw_h); alloc_h = max(MIN_STRATUM_SAMPLE=2, floor_h)
         (a stratum with floor_h < 2 is "clamped"; clamping consumes budget first)
      3. diff = N - SUM(alloc_h)
         If diff > 0: repeatedly add +1 to the unclamped stratum with the largest
         fractional part (raw_h - floor_h); ties broken by industry_code ASC,
         then size_class ASC (SMALL < MEDIUM < LARGE).
         If diff < 0: repeatedly subtract 1 from the stratum with the smallest
         fractional part whose alloc_h > 2; ties broken by industry_code ASC,
         then size_class ASC.
         If diff cannot be absorbed (all strata at minimum and SUM(alloc) > N):
         freeze fails with ERR_SAMPLE_BUDGET_INFEASIBLE.
      4. frame.total_sample_size = SUM(alloc_h); always equals N on success.
    input_set: "All strata declared on the DRAFT frame"
    constants:
      SIZE_DISPERSION_SMALL: 4
      SIZE_DISPERSION_MEDIUM: 15
      SIZE_DISPERSION_LARGE: 50
      MIN_STRATUM_SAMPLE: 2
    precision: "allocations are integers; raw values not rounded"
    variants: []

  - name: base_sampling_weight
    trigger: "POST /survey/panel-enrollments (at enrollment creation)"
    algorithm: aggregation
    formula: |
      base_weight = round_half_up(stratum.frame_unit_count / stratum.allocated_sample_size, 6)
      where stratum is the entry of the program's LATEST frame with
      frame_status == FROZEN (by frozen_at; replacement supersedes) matching
      (establishment.industry_code, establishment.size_class).
    input_set: "The matching stratum of the latest FROZEN SampleFrame for the program"
    constants: {}
    precision: "6 decimal places, round_half_up"
    variants: []

  - name: cell_estimate_with_imputation
    trigger: "SurveyCycle COMPUTE_ESTIMATES (PROCESSING pass and REVISION_OPEN pass)"
    algorithm: aggregation
    formula: |
      Cell set: distinct (industry_code, size_class) over enrollments of the
      program with enrollment_status == ENROLLED at compute time (SUSPENDED
      excluded). For each cell:
        respondents = cell enrollments with an ACCEPTED ResponseReport for the cycle
        nonrespondents = cell enrollments ENROLLED without an ACCEPTED report
      Imputed employment for nonrespondent i:
        * PROCESSING pass (imputation_variant = LINK_RELATIVE):
            if i has an ACCEPTED report in the immediately preceding cycle of
            the same program (by reference_month): y_i = round_half_up(y_i_prev * LR, 0)
            where LR = (SUM of current-month ACCEPTED employment over matched
            pairs) / (SUM of prior-cycle ACCEPTED employment over the same
            matched pairs); matched pairs = cell enrollments with ACCEPTED
            reports in BOTH cycles; if no matched pairs exist in the cell,
            fall back per-establishment to STRATUM_MEAN.
            if i has no prior ACCEPTED report: per-establishment fallback to
            STRATUM_MEAN.
        * REVISION_OPEN pass (imputation_variant = STRATUM_MEAN):
            y_i = round_half_up(weighted mean of cell respondents, 0)
            = round_half_up( SUM(w_j * y_j over respondents) / SUM(w_j over respondents), 0 )
      Rounding order (PINNED): imputed values are rounded to whole persons
      BEFORE weighting; the weighted sum is rounded once at the end.
      employment_estimate = round_half_up( SUM_over_respondents(w_j * y_j) + SUM_over_imputed(w_i * y_i_imputed), 0 )
      When a cell has zero nonrespondents, imputation_variant = null.
    input_set: "ENROLLED enrollments of the program; ACCEPTED reports of the cycle and of the immediately preceding cycle"
    constants: {}
    precision: "imputed persons and final estimate: 0 decimal places, round_half_up"
    variants:
      - name: LINK_RELATIVE
        when: "cycle is in PROCESSING (preliminary estimation pass)"
        difference: "Non-respondents with a prior-cycle ACCEPTED report are imputed by the matched-pair link relative"
      - name: STRATUM_MEAN
        when: "cycle is in REVISION_OPEN (revision pass), or per-establishment fallback when no prior report / no matched pairs exist"
        difference: "Non-respondents are imputed at the weighted mean of cell respondents"

  - name: cell_variance
    trigger: "SurveyCycle COMPUTE_ESTIMATES (with cell_estimate_with_imputation)"
    algorithm: aggregation
    formula: |
      variance_estimate = round_half_up( SUM over cell enrollments used in the
      estimate of w_i * (w_i - 1) * y_i^2 , 0 )
      where y_i is reported or imputed employment (post-imputation values).
    input_set: "Same cell membership as cell_estimate_with_imputation"
    constants: {}
    precision: "0 decimal places, round_half_up"
    variants: []

  - name: response_rates
    trigger: "SurveyCycle COMPUTE_ESTIMATES (stored on the cycle)"
    algorithm: aggregation
    formula: |
      denominator set = enrollments of the program with enrollment_status ==
      ENROLLED at compute time (SUSPENDED excluded).
      weighted_response_rate   = round_half_up( SUM(w_i over enrollments with an
                                 ACCEPTED report this cycle) / SUM(w_i over
                                 denominator), 6 )
      unweighted_response_rate = round_half_up( COUNT(ACCEPTED) / COUNT(denominator), 6 )
      Empty denominator -> both null.
    input_set: "ENROLLED enrollments of the program at compute time"
    constants:
      MIN_WEIGHTED_RESPONSE_RATE: 0.600000
    precision: "6 decimal places, round_half_up"
    variants:
      - name: weighted
        when: "certification gate and official quality measure"
        difference: "weights each response by base_weight"
      - name: unweighted
        when: "published alongside as the raw count measure"
        difference: "counts each response equally"

  - name: seasonal_adjustment
    trigger: "CellEstimate compute (concurrent variant) and SeasonalFactorSet finalize (revised variant)"
    algorithm: aggregation
    formula: |
      month_index = month of cycle.reference_month (Jan = 1).
      Factor set selection: the non-SUPERSEDED SeasonalFactorSet for
      (program_code, industry_code, size_class, year of reference_month);
      PROVISIONAL is current until a FINAL set exists; creating a new set for
      the same series+year supersedes the previous one.
      concurrent (frozen at compute time):
        seasonally_adjusted_concurrent = round_half_up(employment_estimate / factors[month_index], 0)
        using the factor set current at compute time; null if none exists.
      revised (recomputed at factor-set finalize only):
        seasonally_adjusted_revised = round_half_up(current employment_estimate / new FINAL factors[month_index], 0)
    input_set: "CellEstimates of the series whose cycle reference_month falls in the factor set's year"
    constants: {}
    precision: "0 decimal places, round_half_up"
    variants:
      - name: concurrent
        when: "computed during estimation with the factor set current at that moment (typically PROVISIONAL)"
        difference: "frozen snapshot; does not change when factors are later revised"
      - name: revised
        when: "recomputed when a SeasonalFactorSet is finalized for the series+year"
        difference: "uses the new FINAL factor set against the current employment_estimate"

  - name: suppression_resolution
    trigger: "SurveyCycle COMPUTE_ESTIMATES (after all cell estimates and variances are computed)"
    algorithm: constraint_propagation
    formula: |
      Step 1 (PRIMARY): a cell is PRIMARY-suppressed iff respondent_count <
      MIN_CELL_RESPONDENTS (3) OR dominance_flag is true.
      dominance_flag: max over cell establishments of (w_i * y_i) >=
      DOMINANCE_THRESHOLD (0.60) * employment_estimate, using the reported or
      imputed y_i; when employment_estimate == 0, dominance_flag := false.
      Step 2 (totals, PINNED BEFORE complementary selection): industry row
      totals and size column totals are ALWAYS computed from the FULL cell set
      including suppressed cells: total_row = SUM(employment_estimate over all
      cells of the industry). Suppression never changes totals.
      Step 3 (COMPLEMENTARY fixed point): repeat full passes until a pass makes
      no change; each pass first walks industry rows in industry_code ASC, then
      size columns in size_class ASC (SMALL < MEDIUM < LARGE):
        * for a row with exactly 1 suppressed cell: mark the publishable cell in
          that row with the smallest employment_estimate as COMPLEMENTARY
          (tie: size_class ASC);
        * for a column with exactly 1 suppressed cell: mark the publishable cell
          in that column with the smallest employment_estimate as COMPLEMENTARY
          (tie: industry_code ASC, then size_class ASC).
      Publishable cells are exactly those with suppression_status == NONE;
      bulletins null out employment_estimate and seasonally adjusted values for
      PRIMARY and COMPLEMENTARY cells but still show full row/column totals.
    input_set: "All CellEstimates of the cycle"
    constants:
      MIN_CELL_RESPONDENTS: 3
      DOMINANCE_THRESHOLD: 0.60
    precision: "counts and comparisons are exact; >= comparison at the dominance boundary (0.60 exactly is dominant)"
    variants: []

  - name: benchmark_wedge_realignment
    trigger: "POST /survey/benchmark-runs/{id}/apply"
    algorithm: aggregation
    formula: |
      For each admin cell entry c = (industry_code, size_class, admin_employment):
        base = CellEstimate for (benchmark-month cycle, c) ; must exist with
        estimate_status in {PRELIMINARY, REVISED} (else ERR_BENCHMARK_CELL_MISSING).
        If base.employment_estimate == 0: admin_employment == 0 -> r_c = 1.000000,
        else ERR_BENCHMARK_UNDEFINED_WEDGE.
        r_c = round_half_up(c.admin_employment / base.employment_estimate, 6)
      Rounding order (PINNED): realignment rounds EACH MONTH INDEPENDENTLY after
      multiplication; no annual reconciliation pass is applied, so the sum of
      realigned monthly values may differ by a unit from a rounded annual
      product — this is accepted and expected.
      benchmark-month cell: employment_estimate := c.admin_employment (anchored),
        estimate_status -> FINAL, wedge_factor := r_c, revision_no += 1.
      earlier-month cells: every CellEstimate of the same program + series whose
        cycle reference_month is in the SAME calendar year as benchmark_month and
        strictly earlier, with estimate_status in {PRELIMINARY, REVISED}:
        employment_estimate := round_half_up(employment_estimate * r_c, 0),
        estimate_status -> FINAL, wedge_factor := r_c, revision_no += 1.
      Cells already FINAL or RECONSTRUCTED are never touched.
    input_set: "admin_cell_counts entries; matching CellEstimates in the benchmark year"
    constants: {}
    precision: "wedge 6 decimals round_half_up; monthly values 0 decimals round_half_up"
    variants: []

  - name: reconstruction_apply
    trigger: "MethodologyNotice ACTIVATE"
    algorithm: aggregation
    formula: |
      For each in-scope CellEstimate with estimate_status == FINAL:
        employment_estimate := round_half_up(employment_estimate * notice.reconstruction_factor_ppm / 1000000, 0)
        estimate_status -> RECONSTRUCTED; revision_no += 1.
      Seasonally adjusted fields are NOT modified by reconstruction; a
      RECONSTRUCTED cell publishes employment_estimate only.
    input_set: "FINAL CellEstimates of the program whose (industry_code, size_class) is in scope (ALL_SERIES: every series; LISTED_SERIES: only listed)"
    constants: {}
    precision: "0 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted on the endpoint; for entity_backed roles, X-User-ID must equal the owning entity id (Respondent: enrollment/report's establishment_id; AccreditedMedia: grant's media_outlet_id); per-action role split inside advance endpoints (cycle: OPEN/CLOSE=CollectionOfficer, COMPUTE/CERTIFY/REOPEN=EstimationAnalyst; report: SUBMIT=Respondent, ACCEPT/RETURN=CollectionOfficer; release: POSTPONE/RESCHEDULE/OPEN_EMBARGO/PUBLISH=ReleaseManager, APPROVE/REJECT_DISCLOSURE=DisclosureOfficer; lifecycle: ACCEPT/DECLINE=Respondent, REINSTATE/EXIT=CollectionOfficer, SUSPEND=either)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-parameter resource exists (program/frame/establishment/enrollment/cycle/report/case/estimate/factor-set/benchmark/notice/release/outlet/grant)"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body-referenced resources exist: program_code resolves to a SurveyProgram (ERR_PROGRAM_NOT_FOUND); enrollment_id (ERR_ENROLLMENT_NOT_FOUND); cycle_id (ERR_CYCLE_NOT_FOUND); replaces_frame_id (ERR_FRAME_NOT_FOUND)"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking body references"
  - priority: 5
    category: existence
    check: "Request shape: required fields present; enums valid; formats valid (YYYY-Qn, YYYY-MM, ISO8601); employment >= 0; contact_seq refers to an existing contact entry; scope == LISTED_SERIES requires non-empty series"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 10
    category: state
    check: "State-machine from-state holds for the requested action (generic invalid transition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all advance/lifecycle/accreditation/freeze/apply endpoints"
  - priority: 11
    category: state
    check: "OCC: expected_program_version == SurveyProgram.version on frame create; expected_release_version == ReleaseEvent.version on every release advance action"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /survey/sample-frames; POST /survey/release-events/{id}/advance"
  - priority: 12
    category: state
    check: "Report create/submit requires cycle.cycle_status == COLLECTING; report accept requires cycle in {COLLECTING, PROCESSING}"
    error_id: ERR_CYCLE_NOT_COLLECTING
    http_status: 409
    applies_to: "POST /survey/response-reports; POST /survey/response-reports/{id}/advance"
  - priority: 13
    category: state
    check: "Report create/submit requires enrollment.enrollment_status == ENROLLED"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /survey/response-reports; report SUBMIT"
  - priority: 14
    category: state
    check: "OPEN_EMBARGO / disclosure review require cycle.cycle_status in the declared set (CERTIFIED for open; CERTIFIED|PUBLISHED for review); benchmark apply requires benchmark-month cycle CERTIFIED|PUBLISHED"
    error_id: ERR_CYCLE_NOT_CERTIFIED
    http_status: 409
    applies_to: "release advance; benchmark apply"
  - priority: 15
    category: state
    check: "CERTIFY requires cycle.estimates_computed_at set since last close/reopen"
    error_id: ERR_ESTIMATES_NOT_COMPUTED
    http_status: 409
    applies_to: "cycle advance action=CERTIFY"
  - priority: 16
    category: state
    check: "Enrollment EXIT requires no FollowUpCase in {OPEN, IN_CONTACT, ESCALATED} for the enrollment"
    error_id: ERR_CASE_STILL_OPEN
    http_status: 409
    applies_to: "panel-enrollments lifecycle action=EXIT"
  - priority: 20
    category: business_safety
    check: "OPEN_EMBARGO and PUBLISH require disclosure_status == APPROVED"
    error_id: ERR_DISCLOSURE_NOT_APPROVED
    http_status: 409
    applies_to: "release advance"
  - priority: 21
    category: business_safety
    check: "Disclosure review: X-User-ID != cycle.certified_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "release advance APPROVE_DISCLOSURE / REJECT_DISCLOSURE"
  - priority: 25
    category: business_temporal
    check: "Cycle OPEN_COLLECTION requires clock >= collection_open_at; CLOSE_COLLECTION requires clock >= collection_close_at"
    error_id: ERR_CYCLE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "cycle advance"
  - priority: 26
    category: business_temporal
    check: "Report create/SUBMIT requires clock <= collection_close_at (cycle may still be COLLECTING if not yet closed)"
    error_id: ERR_REPORT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /survey/response-reports; report SUBMIT"
  - priority: 27
    category: business_temporal
    check: "Follow-up RECORD_CONTACT requires >= 24h since the last non-voided contact on the case"
    error_id: ERR_CONTACT_TOO_SOON
    http_status: 422
    applies_to: "follow-up-cases advance RECORD_CONTACT"
  - priority: 28
    category: business_temporal
    check: "Follow-up ESCALATE requires >= 2 non-voided contacts and clock >= opened_at + 7 days"
    error_id: ERR_ESCALATION_TOO_EARLY
    http_status: 422
    applies_to: "follow-up-cases advance ESCALATE"
  - priority: 29
    category: business_temporal
    check: "Release create/RESCHEDULE requires release_at >= clock + 3 days (pre-announced calendar)"
    error_id: ERR_PREANNOUNCE_LEAD_TOO_SHORT
    http_status: 422
    applies_to: "POST /survey/release-events; release RESCHEDULE"
  - priority: 30
    category: business_temporal
    check: "OPEN_EMBARGO requires clock >= embargo_open_at; PUBLISH requires clock >= release_at"
    error_id: ERR_RELEASE_TOO_EARLY
    http_status: 422
    applies_to: "release advance"
  - priority: 31
    category: business_temporal
    check: "SeasonalFactorSet finalize requires clock >= Jan 1 of year+1"
    error_id: ERR_FACTOR_SET_FINALIZE_TOO_EARLY
    http_status: 422
    applies_to: "seasonal-factor-sets finalize"
  - priority: 32
    category: business_temporal
    check: "MethodologyNotice ACTIVATE requires clock >= effective_from"
    error_id: ERR_NOTICE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "methodology-notices advance ACTIVATE"
  - priority: 33
    category: business_temporal
    check: "Bulletin read requires clock >= release.embargo_open_at"
    error_id: ERR_EMBARGO_NOT_OPEN
    http_status: 403
    applies_to: "GET /survey/embargo-grants/{id}/bulletin"
  - priority: 40
    category: business_constraint
    check: "Uniqueness: program.code, establishment.ein, outlet.outlet_code unique; one non-terminal enrollment per (establishment_id, program_code); one report per (enrollment_id, cycle_id); one cycle per (program_code, reference_month); one release per cycle"
    error_id: "ERR_DUPLICATE_* (ERR_DUPLICATE_ESTABLISHMENT | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_REPORT | ERR_DUPLICATE_CYCLE | ERR_DUPLICATE_RELEASE | ERR_VALIDATION for code conflicts)"
    http_status: 409
    applies_to: "create endpoints"
  - priority: 41
    category: business_constraint
    check: "Frame period rules, checked in this order: (1) if a non-SUPERSEDED frame already covers reference_quarter and no replaces_frame_id was given -> ERR_DUPLICATE_FRAME_PERIOD; (2) otherwise, without replaces_frame_id, reference_quarter must be the quarter immediately following the latest non-SUPERSEDED frame's quarter (first frame: any quarter) -> ERR_FRAME_PERIOD_GAP; with replaces_frame_id the replacement must name an existing DRAFT-or-FROZEN frame for the same quarter"
    error_id: "ERR_DUPLICATE_FRAME_PERIOD | ERR_FRAME_PERIOD_GAP"
    http_status: 409
    applies_to: "POST /survey/sample-frames"
  - priority: 42
    category: business_constraint
    check: "Enrollment requires a FROZEN latest frame for the program and the establishment's (industry_code, size_class) must match one of its strata"
    error_id: "ERR_FRAME_NOT_FROZEN | ERR_STRATUM_UNKNOWN"
    http_status: 409
    applies_to: "POST /survey/panel-enrollments"
  - priority: 43
    category: business_constraint
    check: "Stratum sample quota: count of non-terminal enrollments (INVITED/ENROLLED/SUSPENDED) for the stratum < allocated_sample_size"
    error_id: ERR_STRATUM_SAMPLE_FULL
    http_status: 409
    applies_to: "POST /survey/panel-enrollments"
  - priority: 44
    category: business_constraint
    check: "Release embargo window [release_at - embargo_window_minutes, release_at) must not overlap the window of any other release of the same program in {SCHEDULED, EMBARGO_OPEN}; half-open semantics: back-to-back windows (one ends exactly when the other begins) do NOT overlap; POSTPONED and PUBLISHED releases are excluded from the check"
    error_id: ERR_EMBARGO_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /survey/release-events; release RESCHEDULE"
  - priority: 45
    category: business_constraint
    check: "SeasonalFactorSet: factors has exactly 12 entries, each in [0.2, 5.0], arithmetic mean within 1.0 +/- 0.0005 inclusive"
    error_id: ERR_FACTOR_SET_INVALID
    http_status: 422
    applies_to: "POST /survey/seasonal-factor-sets"
  - priority: 46
    category: business_constraint
    check: "Freeze feasibility: sample_budget >= 2 * count(strata)"
    error_id: ERR_SAMPLE_BUDGET_INFEASIBLE
    http_status: 422
    applies_to: "POST /survey/sample-frames/{id}/freeze"
  - priority: 47
    category: business_constraint
    check: "Benchmark apply: every admin cell has a matching PRELIMINARY/REVISED CellEstimate; zero estimate with positive admin count is rejected"
    error_id: "ERR_BENCHMARK_CELL_MISSING | ERR_BENCHMARK_UNDEFINED_WEDGE"
    http_status: 422
    applies_to: "POST /survey/benchmark-runs/{id}/apply"
  - priority: 50
    category: business_fiscal
    check: "CERTIFY requires cycle.weighted_response_rate >= 0.600000 (null treated as 0)"
    error_id: ERR_RESPONSE_RATE_BELOW_MINIMUM
    http_status: 422
    applies_to: "cycle advance action=CERTIFY"
  - priority: 51
    category: business_fiscal
    check: "RECORD_CONTACT: enrollment.burden_minutes_ytd + contact_minutes <= program.annual_burden_budget_minutes (after calendar-year rollover reset)"
    error_id: ERR_BURDEN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "follow-up-cases advance RECORD_CONTACT"
  - priority: 52
    category: business_fiscal
    check: "CLOSE outcome=REFUSED requires >= 1 non-voided contact"
    error_id: ERR_NO_CONTACT_RECORDED
    http_status: 422
    applies_to: "follow-up-cases advance CLOSE"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/survey/programs", description: "Create a survey program", roles: [ProgramAdmin], code: 201, input: [code, name, sample_budget, "embargo_window_minutes?", "annual_burden_budget_minutes?"], output: SurveyProgram, side_effects: ["program created with version 1"] }
  - { method: GET, path: "/survey/programs", description: "List programs", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?"], output: "SurveyProgram[]", side_effects: [] }
  - { method: POST, path: "/survey/sample-frames", description: "Create a sample frame (strata embedded); OCC on the program; with replaces_frame_id supersedes that frame", roles: [ProgramAdmin], code: 201, input: [program_code, reference_quarter, strata, expected_program_version, "replaces_frame_id?"], output: SampleFrame, side_effects: ["increments SurveyProgram.version by 1", "if replaces_frame_id given: that frame -> SUPERSEDED (its replaced_by_frame_id set)"] }
  - { method: GET, path: "/survey/sample-frames/{id}", description: "Read one frame incl. strata allocations and status", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: SampleFrame, side_effects: [] }
  - { method: POST, path: "/survey/sample-frames/{id}/freeze", description: "Freeze frame and compute Neyman allocation", roles: [ProgramAdmin], code: 200, input: [], output: SampleFrame, side_effects: ["runs neyman_stratum_allocation; sets frozen_at"] }
  - { method: POST, path: "/survey/establishments", description: "Register an establishment from administrative records", roles: [CollectionOfficer], code: 201, input: [ein, name, industry_code, size_class], output: Establishment, side_effects: [] }
  - { method: POST, path: "/survey/panel-enrollments", description: "Invite an establishment into a program panel (samples from latest FROZEN frame)", roles: [CollectionOfficer], code: 201, input: [establishment_id, program_code], output: PanelEnrollment, side_effects: ["computes base_weight via base_sampling_weight"] }
  - { method: GET, path: "/survey/panel-enrollments", description: "List enrollments", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "establishment_id?", "program_code?", "enrollment_status?"], output: "PanelEnrollment[]", side_effects: [] }
  - { method: GET, path: "/survey/panel-enrollments/{id}", description: "Read one enrollment", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: PanelEnrollment, side_effects: [] }
  - { method: POST, path: "/survey/panel-enrollments/{id}/lifecycle", description: "Panel lifecycle action: ACCEPT | DECLINE | SUSPEND | REINSTATE | EXIT", roles: [Respondent, CollectionOfficer], code: 200, input: [action], output: PanelEnrollment, side_effects: ["per state machine PanelEnrollment"] }
  - { method: POST, path: "/survey/survey-cycles", description: "Create a monthly cycle; collection window computed from reference_month", roles: [ProgramAdmin], code: 201, input: [program_code, reference_month], output: SurveyCycle, side_effects: ["computes collection_open_at and collection_close_at"] }
  - { method: GET, path: "/survey/survey-cycles", description: "List cycles", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "program_code?", "cycle_status?"], output: "SurveyCycle[]", side_effects: [] }
  - { method: POST, path: "/survey/survey-cycles/{id}/advance", description: "Cycle action: OPEN_COLLECTION | CLOSE_COLLECTION | COMPUTE_ESTIMATES | CERTIFY | REOPEN_REVISION", roles: [CollectionOfficer, EstimationAnalyst], code: 200, input: [action], output: SurveyCycle, side_effects: ["per state machine SurveyCycle; CLOSE_COLLECTION creates FollowUpCases; COMPUTE runs estimation + suppression; CERTIFY sets certified_by_user_id"] }
  - { method: POST, path: "/survey/response-reports", description: "Respondent submits a report (electronic collection); created directly in SUBMITTED with submit_count 1", roles: [Respondent], code: 201, input: [enrollment_id, cycle_id, employment], output: ResponseReport, side_effects: ["burden ledger: +15 minutes to enrollment (with calendar-year rollover)"] }
  - { method: GET, path: "/survey/response-reports", description: "List reports", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "enrollment_id?", "cycle_id?", "report_status?"], output: "ResponseReport[]", side_effects: [] }
  - { method: GET, path: "/survey/response-reports/{id}", description: "Read one report", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: ResponseReport, side_effects: [] }
  - { method: POST, path: "/survey/response-reports/{id}/advance", description: "Report action: SUBMIT (resubmit from RETURNED) | ACCEPT | RETURN", roles: [Respondent, CollectionOfficer], code: 200, input: [action, "return_reason?"], output: ResponseReport, side_effects: ["ACCEPT cascades matching open FollowUpCase -> CLOSED_RESPONDED"] }
  - { method: GET, path: "/survey/follow-up-cases", description: "List follow-up cases", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "enrollment_id?", "cycle_id?", "case_status?"], output: "FollowUpCase[]", side_effects: [] }
  - { method: GET, path: "/survey/follow-up-cases/{id}", description: "Read one case incl. contacts", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: FollowUpCase, side_effects: [] }
  - { method: POST, path: "/survey/follow-up-cases/{id}/advance", description: "Case action: RECORD_CONTACT | VOID_CONTACT | ESCALATE | CLOSE", roles: [CollectionOfficer], code: 200, input: [action, "contact_minutes?", "channel?", "contact_seq?", "outcome?"], output: FollowUpCase, side_effects: ["RECORD_CONTACT adds burden minutes; VOID_CONTACT subtracts them (compensating pair)"] }
  - { method: GET, path: "/survey/cell-estimates", description: "List cell estimates", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "cycle_id?", "industry_code?", "size_class?", "estimate_status?", "suppression_status?"], output: "CellEstimate[]", side_effects: [] }
  - { method: GET, path: "/survey/cell-estimates/{id}", description: "Read one cell estimate", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: CellEstimate, side_effects: [] }
  - { method: POST, path: "/survey/seasonal-factor-sets", description: "Create a PROVISIONAL factor set for a series+year; supersedes any existing set for the same series+year", roles: [SurveyMethodologist], code: 201, input: [program_code, industry_code, size_class, year, factors], output: SeasonalFactorSet, side_effects: ["existing PROVISIONAL/FINAL set for same series+year -> SUPERSEDED"] }
  - { method: GET, path: "/survey/seasonal-factor-sets", description: "List seasonal factor sets", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "program_code?", "industry_code?", "size_class?", "year?", "set_status?"], output: "SeasonalFactorSet[]", side_effects: [] }
  - { method: POST, path: "/survey/seasonal-factor-sets/{id}/finalize", description: "Finalize a factor set (annual revision); recomputes seasonally_adjusted_revised on the year's cells", roles: [SurveyMethodologist], code: 200, input: [], output: SeasonalFactorSet, side_effects: ["per state machine SeasonalFactorSet"] }
  - { method: POST, path: "/survey/benchmark-runs", description: "Create a benchmark run against administrative counts", roles: [SurveyMethodologist], code: 201, input: [program_code, benchmark_month, admin_cell_counts], output: BenchmarkRun, side_effects: [] }
  - { method: POST, path: "/survey/benchmark-runs/{id}/apply", description: "Apply benchmark: wedge-realign same-year cells to FINAL; cascade re-flags published releases", roles: [SurveyMethodologist], code: 200, input: [], output: BenchmarkRun, side_effects: ["per state machine BenchmarkRun and calculation benchmark_wedge_realignment"] }
  - { method: POST, path: "/survey/methodology-notices", description: "Create a methodology change notice", roles: [SurveyMethodologist], code: 201, input: [program_code, title, effective_from, scope, "series?", reconstruction_factor_ppm], output: MethodologyNotice, side_effects: [] }
  - { method: POST, path: "/survey/methodology-notices/{id}/advance", description: "Notice action: ANNOUNCE | ACTIVATE | WITHDRAW", roles: [SurveyMethodologist], code: 200, input: [action], output: MethodologyNotice, side_effects: ["ACTIVATE runs reconstruction_apply cascade"] }
  - { method: POST, path: "/survey/release-events", description: "Pre-announce a release for a cycle (one per cycle)", roles: [ReleaseManager], code: 201, input: [cycle_id, release_at], output: ReleaseEvent, side_effects: ["computes embargo_open_at snapshot from the program's current embargo_window_minutes"] }
  - { method: GET, path: "/survey/release-events", description: "List releases", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "cycle_id?", "pub_status?"], output: "ReleaseEvent[]", side_effects: [] }
  - { method: GET, path: "/survey/release-events/{id}", description: "Read one release", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: ReleaseEvent, side_effects: [] }
  - { method: POST, path: "/survey/release-events/{id}/advance", description: "Release action: POSTPONE | RESCHEDULE | OPEN_EMBARGO | APPROVE_DISCLOSURE | REJECT_DISCLOSURE | PUBLISH; all actions OCC-guarded by expected_release_version", roles: [ReleaseManager, DisclosureOfficer], code: 200, input: [action, "new_release_at?", expected_release_version], output: ReleaseEvent, side_effects: ["increments ReleaseEvent.version by 1 on success", "OPEN_EMBARGO issues EmbargoGrants to ACCREDITED outlets", "PUBLISH moves cycle CERTIFIED -> PUBLISHED"] }
  - { method: POST, path: "/survey/media-outlets", description: "Register a media outlet (PENDING accreditation)", roles: [ReleaseManager], code: 201, input: [name, outlet_code], output: MediaOutlet, side_effects: [] }
  - { method: GET, path: "/survey/media-outlets", description: "List outlets", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "accreditation_status?"], output: "MediaOutlet[]", side_effects: [] }
  - { method: POST, path: "/survey/media-outlets/{id}/accreditation", description: "Accreditation action: ACCREDIT | SUSPEND | REINSTATE | REVOKE", roles: [ReleaseManager], code: 200, input: [action], output: MediaOutlet, side_effects: ["SUSPEND/REVOKE revoke the outlet's active grants"] }
  - { method: GET, path: "/survey/embargo-grants", description: "List embargo grants", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: ["limit?", "offset?", "release_event_id?", "media_outlet_id?", "grant_status?"], output: "EmbargoGrant[]", side_effects: [] }
  - { method: GET, path: "/survey/embargo-grants/{id}", description: "Read one grant", roles: [ProgramAdmin, SurveyMethodologist, CollectionOfficer, Respondent, EstimationAnalyst, DisclosureOfficer, ReleaseManager, AccreditedMedia], code: 200, input: [], output: EmbargoGrant, side_effects: [] }
  - { method: GET, path: "/survey/embargo-grants/{id}/bulletin", description: "Embargoed bulletin for the grant's outlet; time-gated by embargo_open_at; suppressed cells masked", roles: [AccreditedMedia], code: 200, input: [], output: "{ release_event_id: string, reference_month: string, release_status: string, embargoed: boolean, cells: array, industry_totals: array }", side_effects: ["first successful read moves grant ISSUED -> ACCESSED with first_accessed_at"] }
  - { method: POST, path: "/survey/embargo-grants/{id}/report-breach", description: "Report an embargo breach on a grant", roles: [ReleaseManager], code: 200, input: [], output: EmbargoGrant, side_effects: ["grant -> BREACHED; outlet -> SUSPENDED; outlet's other active grants -> REVOKED; affected release counters recomputed"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; all temporal rules evaluate against this clock. The clock may be set to any ISO8601 instant, including earlier than the current value (tests may rewind it)." , roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum/format, negative employment, unknown contact_seq, scope LISTED_SERIES with empty series, or ANNOUNCE with effective_from not in the future" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint/action, or entity_backed ownership violated (Respondent vs establishment_id, AccreditedMedia vs grant's outlet)" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "SurveyProgram id/code does not exist" }
  - { id: ERR_FRAME_NOT_FOUND, http: 404, condition: "SampleFrame id (incl. replaces_frame_id) does not exist" }
  - { id: ERR_ESTABLISHMENT_NOT_FOUND, http: 404, condition: "Establishment id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "PanelEnrollment id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "SurveyCycle id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "ResponseReport id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "FollowUpCase id does not exist" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "CellEstimate id does not exist" }
  - { id: ERR_FACTOR_SET_NOT_FOUND, http: 404, condition: "SeasonalFactorSet id does not exist" }
  - { id: ERR_BENCHMARK_NOT_FOUND, http: 404, condition: "BenchmarkRun id does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "MethodologyNotice id does not exist" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "ReleaseEvent id does not exist" }
  - { id: ERR_OUTLET_NOT_FOUND, http: 404, condition: "MediaOutlet id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "EmbargoGrant id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state does not hold for the requested action (e.g., double freeze, accept of RETURNED report, bulletin on REVOKED grant, advance on terminal entity)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_program_version != SurveyProgram.version on frame create, or expected_release_version != ReleaseEvent.version on release advance" }
  - { id: ERR_DUPLICATE_ESTABLISHMENT, http: 409, condition: "ein already registered" }
  - { id: ERR_DUPLICATE_FRAME_PERIOD, http: 409, condition: "A non-SUPERSEDED frame already covers reference_quarter and no replaces_frame_id was given" }
  - { id: ERR_FRAME_PERIOD_GAP, http: 409, condition: "New frame's quarter is not the immediate successor of the latest non-SUPERSEDED frame's quarter" }
  - { id: ERR_FRAME_NOT_FROZEN, http: 409, condition: "Enrollment attempted while the program has no FROZEN frame" }
  - { id: ERR_STRATUM_UNKNOWN, http: 409, condition: "Establishment's (industry_code, size_class) matches no stratum of the latest FROZEN frame" }
  - { id: ERR_STRATUM_SAMPLE_FULL, http: 409, condition: "Non-terminal enrollments for the stratum already equal allocated_sample_size" }
  - { id: ERR_SAMPLE_BUDGET_INFEASIBLE, http: 422, condition: "sample_budget < 2 * count(strata) at freeze (min allocation per stratum cannot be met)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "A non-terminal enrollment already exists for (establishment_id, program_code)" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Report create/submit for an enrollment not in ENROLLED" }
  - { id: ERR_DUPLICATE_CYCLE, http: 409, condition: "A cycle already exists for (program_code, reference_month)" }
  - { id: ERR_CYCLE_WINDOW_VIOLATION, http: 422, condition: "OPEN_COLLECTION before collection_open_at or CLOSE_COLLECTION before collection_close_at" }
  - { id: ERR_CYCLE_NOT_COLLECTING, http: 409, condition: "Report create/submit while cycle not COLLECTING; accept requires cycle in {COLLECTING, PROCESSING}" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 422, condition: "Report create/submit after collection_close_at while cycle still COLLECTING" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A report already exists for (enrollment_id, cycle_id)" }
  - { id: ERR_CONTACT_TOO_SOON, http: 422, condition: "RECORD_CONTACT within 24h of the last non-voided contact on the case" }
  - { id: ERR_CONTACT_ALREADY_VOIDED, http: 409, condition: "VOID_CONTACT on an already-voided contact" }
  - { id: ERR_NO_CONTACT_RECORDED, http: 422, condition: "CLOSE outcome=REFUSED without any non-voided contact" }
  - { id: ERR_ESCALATION_TOO_EARLY, http: 422, condition: "ESCALATE with fewer than 2 non-voided contacts or before opened_at + 7 days" }
  - { id: ERR_BURDEN_BUDGET_EXCEEDED, http: 422, condition: "RECORD_CONTACT would push enrollment.burden_minutes_ytd above program.annual_burden_budget_minutes" }
  - { id: ERR_CASE_STILL_OPEN, http: 409, condition: "Enrollment EXIT while a FollowUpCase is OPEN, IN_CONTACT, or ESCALATED" }
  - { id: ERR_ESTIMATES_NOT_COMPUTED, http: 409, condition: "CERTIFY before COMPUTE_ESTIMATES has run since the last close/reopen" }
  - { id: ERR_RESPONSE_RATE_BELOW_MINIMUM, http: 422, condition: "CERTIFY with weighted_response_rate < 0.600000 (null treated as 0)" }
  - { id: ERR_CYCLE_NOT_CERTIFIED, http: 409, condition: "OPEN_EMBARGO without CERTIFIED cycle; disclosure review unless cycle in {CERTIFIED, PUBLISHED}; benchmark apply unless benchmark-month cycle in {CERTIFIED, PUBLISHED}" }
  - { id: ERR_DISCLOSURE_NOT_APPROVED, http: 409, condition: "OPEN_EMBARGO or PUBLISH while disclosure_status != APPROVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disclosure review attempted by the same X-User-ID that certified the cycle" }
  - { id: ERR_PREANNOUNCE_LEAD_TOO_SHORT, http: 422, condition: "release_at earlier than clock + 3 days at create/RESCHEDULE" }
  - { id: ERR_EMBARGO_WINDOW_OVERLAP, http: 409, condition: "Embargo window overlaps another SCHEDULED/EMBARGO_OPEN release window of the same program (half-open adjacency allowed)" }
  - { id: ERR_DUPLICATE_RELEASE, http: 409, condition: "A ReleaseEvent already exists for the cycle" }
  - { id: ERR_RELEASE_TOO_EARLY, http: 422, condition: "OPEN_EMBARGO before embargo_open_at or PUBLISH before release_at" }
  - { id: ERR_EMBARGO_NOT_OPEN, http: 403, condition: "Bulletin read before release.embargo_open_at" }
  - { id: ERR_FACTOR_SET_INVALID, http: 422, condition: "factors not exactly 12 entries, out of [0.2, 5.0], or mean outside 1.0 +/- 0.0005" }
  - { id: ERR_FACTOR_SET_FINALIZE_TOO_EARLY, http: 422, condition: "Finalize before Jan 1 of year+1" }
  - { id: ERR_BENCHMARK_CELL_MISSING, http: 422, condition: "An admin_cell_counts entry has no matching PRELIMINARY/REVISED CellEstimate at the benchmark month" }
  - { id: ERR_BENCHMARK_UNDEFINED_WEDGE, http: 422, condition: "Benchmark cell estimate is 0 while admin_employment > 0 (wedge undefined)" }
  - { id: ERR_NOTICE_NOT_EFFECTIVE, http: 422, condition: "ACTIVATE before effective_from" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Bureau program administrator: configures programs, frames, cycles; operates the logical clock"
    identity: opaque
    exclusive_operations: ["POST /survey/programs", "POST /survey/sample-frames", "POST /survey/sample-frames/{id}/freeze", "POST /survey/survey-cycles", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET list/read endpoints"]
  - name: SurveyMethodologist
    description: "Methodology owner: seasonal factor sets, benchmark realignment, methodology change notices"
    identity: opaque
    exclusive_operations: ["POST /survey/seasonal-factor-sets", "POST /survey/seasonal-factor-sets/{id}/finalize", "POST /survey/benchmark-runs", "POST /survey/benchmark-runs/{id}/apply", "POST /survey/methodology-notices", "POST /survey/methodology-notices/{id}/advance"]
    shared_operations: ["all GET list/read endpoints"]
  - name: CollectionOfficer
    description: "Data collection: establishment registry, panel enrollment management, report review, follow-up contacts, collection open/close"
    identity: opaque
    exclusive_operations: ["POST /survey/establishments", "POST /survey/panel-enrollments", "POST /survey/follow-up-cases/{id}/advance"]
    shared_operations: ["POST /survey/panel-enrollments/{id}/lifecycle (SUSPEND/REINSTATE/EXIT)", "POST /survey/survey-cycles/{id}/advance (OPEN_COLLECTION/CLOSE_COLLECTION)", "POST /survey/response-reports/{id}/advance (ACCEPT/RETURN)", "all GET list/read endpoints"]
  - name: Respondent
    description: "Reporting establishment contact; acts as its Establishment"
    identity: "entity_backed:Establishment"
    exclusive_operations: ["POST /survey/response-reports"]
    shared_operations: ["POST /survey/panel-enrollments/{id}/lifecycle (ACCEPT/DECLINE/SUSPEND for own establishment)", "POST /survey/response-reports/{id}/advance (SUBMIT for own establishment)", "all GET list/read endpoints"]
  - name: EstimationAnalyst
    description: "Produces and certifies estimates; may not disclosure-approve a release for a cycle they certified"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /survey/survey-cycles/{id}/advance (COMPUTE_ESTIMATES/CERTIFY/REOPEN_REVISION)", "all GET list/read endpoints"]
  - name: DisclosureOfficer
    description: "Confidentiality/disclosure review of releases; segregated from certification"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /survey/release-events/{id}/advance (APPROVE_DISCLOSURE/REJECT_DISCLOSURE)", "all GET list/read endpoints"]
  - name: ReleaseManager
    description: "Publication calendar, embargo operations, media accreditation, breach handling"
    identity: opaque
    exclusive_operations: ["POST /survey/release-events", "POST /survey/media-outlets", "POST /survey/media-outlets/{id}/accreditation", "POST /survey/embargo-grants/{id}/report-breach"]
    shared_operations: ["POST /survey/release-events/{id}/advance (POSTPONE/RESCHEDULE/OPEN_EMBARGO/PUBLISH)", "all GET list/read endpoints"]
  - name: AccreditedMedia
    description: "Accredited media outlet; reads embargoed bulletins through its own grants"
    identity: "entity_backed:MediaOutlet"
    exclusive_operations: ["GET /survey/embargo-grants/{id}/bulletin"]
    shared_operations: ["all GET list/read endpoints"]
