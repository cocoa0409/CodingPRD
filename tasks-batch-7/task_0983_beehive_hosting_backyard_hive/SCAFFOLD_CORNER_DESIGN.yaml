  - section: rbac
    instances:
      - name: host_cannot_install_hive_forbidden
        claim_type: exclusive_operation_denied
        grounds: [roles.ApiaryManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Hive installation is ApiaryManager-exclusive; a Host caller is denied at p2 regardless of ownership."
