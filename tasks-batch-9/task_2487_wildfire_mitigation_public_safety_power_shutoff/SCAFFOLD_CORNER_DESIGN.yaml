              payload: {}
              as: CommunityLiaison
              captures: { e_cu: $.data.error_id }
            - call: "GET /notification-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommunityLiaison
              captures: { e_nb: $.data.error_id }
            - call: "GET /notification-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommunityLiaison
              captures: { e_nr: $.data.error_id }
            - call: "GET /mitigation-projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GridPlanner
              captures: { e_mp: $.data.error_id }
            - call: "GET /community-resource-centers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommunityLiaison
              captures: { e_rc: $.data.error_id }
            - call: "GET /plan-filings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_pf: $.data.error_id }
            - call: "POST /event-scopes/00000000-0000-4000-8000-000000000000/exclude"
              payload: { exclusion_justification: "no such row" }
              as: TransmissionEngineer
              captures: { e_es: $.data.error_id }
            - call: "GET /notification-records"
              payload: { notification_batch_id: "00000000-0000-4000-8000-000000000000" }
              as: CommunityLiaison
              captures: { e_nb2: $.data.error_id }
            - call: "GET /notification-records"
