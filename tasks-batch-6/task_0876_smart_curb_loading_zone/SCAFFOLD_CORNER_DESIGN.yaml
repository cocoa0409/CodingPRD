# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; OCC version
# inputs use ${var}; formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_redesignate_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[zone-redesignate-stale]
          - state_machines.CurbZone.ACTIVE_to_SUSPENDED
          - entities.CurbZone.fields.version
        distinguishing_aspect: "Redesignating a zone twice with the same observed version: the first succeeds (version 1->2); the second, still carrying expected_zone_version 1, is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Zone Z1 created at version 1; a first redesignation advances it to version 2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id, z_ver: $.data.version } }
            - { call: "POST /curb/zones/${z1}/redesignate", payload: { designation: "VALET", expected_zone_version: "${z_ver}" }, as: CurbPlanner, captures: { z_ver2: $.data.version } }
          trigger:
            - { call: "POST /curb/zones/${z1}/redesignate", payload: { designation: "TNC", expected_zone_version: "${z_ver}" }, as: CurbPlanner, captures: { err: $.data.error_id } }
          assert:
            - "First redesignation returns CurbZone.version == 2 and designation == VALET"
            - "Trigger returns HTTP 412 with error_id ERR_STALE_VERSION"
            - "CurbZone.${z1}.designation == VALET (unchanged by the rejected write)"

      - name: zone_sensor_occupancy_derived_field
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CurbZone.fields.sensor_occupancy_state
          - state_machines.OccupancySession.OPEN_to_CLOSED
        distinguishing_aspect: "CurbZone.sensor_occupancy_state is derived: an OPEN session flips it to OCCUPIED; closing the last OPEN session returns it to VACANT."
        test_recipe:
          setup:
            - "Zone Z1 ACTIVE, VACANT; a sensor enter opens a session (zone -> OCCUPIED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /_sensor/occupancy-enter", payload: { zone_id: "${z1}" }, as: PlatformAdmin, captures: { sess_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_sensor/occupancy-exit", payload: { session_id: "${sess_id}" }, as: PlatformAdmin, captures: { st: $.data.session_status, mins: $.data.actual_minutes } }
          assert:
            - "After enter, GET zone shows sensor_occupancy_state == OCCUPIED"
            - "After exit, OccupancySession.${sess_id}.session_status == CLOSED and actual_minutes == 30"
            - "After exit, GET zone shows sensor_occupancy_state == VACANT"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: revenue_rollup_after_charge
        claim_type: correct_result
        grounds:
          - calculations.zone_revenue_rollup
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "GET /curb/revenue scoped to a zone with one CHARGE (+900) returns total_charge_cents 900 and net_revenue_cents 900."
        test_recipe:
          setup:
            - "Reservation R [08:00Z,08:45Z) CONFIRMED (CHARGE +900) on zone Z1; clock 2026-05-20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "GET /curb/revenue", payload: { zone_id: "${z1}" }, as: CurbPlanner, captures: { net: $.data.net_revenue_cents } }
          assert:
            - "GET /curb/revenue?zone_id=${z1} returns total_charge_cents == 900 and net_revenue_cents == 900"
            - "CurbZone.${z1}.revenue_accrued_cents == 900"

      - name: occupancy_actual_minutes_ceiling
        claim_type: precision
        grounds:
          - calculations.occupancy_actual_minutes
          - entities.OccupancySession.fields.actual_minutes
        distinguishing_aspect: "actual_minutes ceilings partial minutes: entered 08:00:00Z, exited 08:01:02Z (62 s) yields actual_minutes == 2."
        test_recipe:
          setup:
            - "Zone Z1; sensor enter at 08:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /_sensor/occupancy-enter", payload: { zone_id: "${z1}" }, as: PlatformAdmin, captures: { sess_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:01:02Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_sensor/occupancy-exit", payload: { session_id: "${sess_id}" }, as: PlatformAdmin, captures: { mins: $.data.actual_minutes } }
          assert:
            - "OccupancySession.${sess_id}.actual_minutes == 2 (ceil of 62 seconds)"

      - name: non_exclusive_windows_share_zone
        claim_type: correct_result
        grounds:
          - calculations.schedule_window_overlap
          - entities.ScheduleWindow.fields.exclusive
        excluded_because:
          difficulty_instance: resource_temporal_overlap / schedule_exclusive_buffer_overlap
          rationale: "The non-exclusive-share semantics are asserted directly in that §1.8 instance's setup and asserts."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CurbPermit.UNDER_REVIEW_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a permit still in DRAFT (never submitted/reviewed) is rejected with ERR_INVALID_STATE; no status change."
        test_recipe:
          setup:
            - "Permit in DRAFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
          trigger:
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1", captures: { err: $.data.error_id } }
          assert:
            - "approve returns HTTP 409 ERR_INVALID_STATE"
            - "CurbPermit.${permit_id}.status == DRAFT"

      - name: confirm_already_confirmed_idempotency
        claim_type: idempotency
        grounds: [state_machines.Reservation.PENDING_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an already CONFIRMED reservation a second time is rejected with ERR_INVALID_STATE; no second CHARGE ledger entry."
        test_recipe:
          setup:
            - "Reservation R [08:00Z,08:45Z) already CONFIRMED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "Second confirm returns HTTP 409 ERR_INVALID_STATE"
            - "Exactly one CHARGE LedgerEntry exists for reservation_id == ${res_id}"

      - name: adjudicate_non_disputed_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Citation.DISPUTED_to_UPHELD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating a citation still in ISSUED (never disputed) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Citation ISSUED, never disputed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/citations", payload: { zone_id: "${z1}", permittee_id: "${pm_id}", violation_type: "NO_PERMIT" }, as: EnforcementOfficer, as_user_id: "officer1", captures: { cit_id: $.data.id } }
          trigger:
            - { call: "POST /curb/citations/${cit_id}/adjudicate", payload: { decision: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer1", captures: { err: $.data.error_id } }
          assert:
            - "adjudicate returns HTTP 409 ERR_INVALID_STATE"
            - "Citation.${cit_id}.status == ISSUED"

      - name: close_planned_event_invalid
        claim_type: invalid_transition
        grounds: [state_machines.CurbEvent.ACTIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a PLANNED event (never activated) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Event PLANNED over zone Z1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/events", payload: { name: "Fair", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T09:00:00Z", zone_ids: ["${z1}"] }, as: CurbPlanner, captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /curb/events/${ev_id}/close", payload: {}, as: CurbPlanner, captures: { err: $.data.error_id } }
          assert:
            - "close returns HTTP 409 ERR_INVALID_STATE"
            - "CurbEvent.${ev_id}.status == PLANNED"

      - name: retire_zone_with_active_reservations
        claim_type: precondition_enforcement
        grounds: [state_machines.CurbZone.ACTIVE_to_RETIRED, "errors[ERR_ZONE_HAS_ACTIVE_RESERVATIONS]"]
        distinguishing_aspect: "Retiring a zone that still has a future CONFIRMED reservation is rejected with ERR_ZONE_HAS_ACTIVE_RESERVATIONS."
        test_recipe:
          setup:
            - "Zone Z1 with a future CONFIRMED reservation [08:00Z,08:45Z); clock 2026-05-20"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "POST /curb/zones/${z1}/status", payload: { target_status: "RETIRED" }, as: CurbPlanner, captures: { err: $.data.error_id } }
          assert:
            - "status RETIRED returns HTTP 409 ERR_ZONE_HAS_ACTIVE_RESERVATIONS"
            - "CurbZone.${z1}.status == ACTIVE"

      - name: fulfill_without_occupancy_session
        claim_type: precondition_enforcement
        grounds: [state_machines.Reservation.CONFIRMED_to_FULFILLED, "errors[ERR_NO_OCCUPANCY_SESSION]"]
        distinguishing_aspect: "Fulfilling a CONFIRMED reservation with no matched CLOSED OccupancySession is rejected with ERR_NO_OCCUPANCY_SESSION."
        test_recipe:
          setup:
            - "Reservation R CONFIRMED, no occupancy session recorded"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/fulfill", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "fulfill returns HTTP 409 ERR_NO_OCCUPANCY_SESSION"
            - "Reservation.${res_id}.booking_status == CONFIRMED"

      - name: cancel_confirmed_after_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Reservation.CONFIRMED_to_CANCELLED, "errors[ERR_CANCEL_AFTER_START]"]
        distinguishing_aspect: "Cancelling a CONFIRMED reservation after its window has started (clock >= start_utc) is rejected with ERR_CANCEL_AFTER_START."
        test_recipe:
          setup:
            - "Reservation R [08:00Z,08:45Z) CONFIRMED; clock advanced to 08:30Z (after start)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "d", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/cancel", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "cancel returns HTTP 409 ERR_CANCEL_AFTER_START"
            - "Reservation.${res_id}.booking_status == CONFIRMED and payment_status == CAPTURED"

