        grounds: ['validations[priority=1]', 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]']
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role or existence checks."
        test_recipe:
          setup: ["station JFK exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
          trigger:
            - { call: "GET /baggage/stations/${stn}", payload: { omit_headers: "X-User-ID, X-User-Role" }, captures: { err: $.data.error_id } }
          assert:
            - "Request sent with both auth headers omitted"
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

      - name: reschedule_on_dispatched_rejected
        claim_type: violation_to_error
        grounds: ['state_machines.DeliveryDispatch.FAILED_ATTEMPT_to_DISPATCHED', 'errors[ERR_DISPATCH_NOT_RESCHEDULABLE]']
        distinguishing_aspect: "reschedule on a dispatch in DISPATCHED (not FAILED_ATTEMPT) is rejected with ERR_DISPATCH_NOT_RESCHEDULABLE; pickup_at unchanged."
        test_recipe:
          setup: ["station JFK served by courier; DELAYED report FOUND_PENDING_DELIVERY; dispatch DISPATCHED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
