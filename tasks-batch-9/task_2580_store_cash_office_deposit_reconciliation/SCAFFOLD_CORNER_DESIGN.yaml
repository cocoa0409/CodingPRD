          - entities.Deposit.fields.credited_total_cents
          - state_machines.Deposit.DISCREPANT_to_RECONCILED
        distinguishing_aspect: >
          The credited total propagates only over FINAL and ADJUSTMENT rows: with a PROVISIONAL 200500,
          a FINAL 200000 and an ADJUSTMENT -805 on the books, credited_total_cents settles at 199195 —
          exactly expected_credit_cents — instead of the 399695 an implementation that also counted the
          provisional float would report.
        test_recipe:
          setup:
            - "Store S-1934, MANUAL safe SAFE-A (500000), journal 2026-08-03"
            - "Deposit of 200500 prepared, sealed, picked up at 10:15Z (PROVISIONAL 200500), FINAL 200000 posted and first reconcile leaves it DISCREPANT by 805"
            - "The DEPOSIT_CREDIT case is fully attributed to BANK and an ADJUSTMENT of -805 is posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
