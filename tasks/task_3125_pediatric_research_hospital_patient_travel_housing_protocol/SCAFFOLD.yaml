    output: HousingFacility
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/programs/housing-facilities/{id}/close"
    description: "Close a housing facility permanently, removing it from the selector pool for good"
    roles: [HousingCoordinator]
    code: 200
    input: [closure_reason]
    output: HousingFacility
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/programs/housing-facilities/{id}/reopen"
    description: "Return a suspended housing facility to service"
    roles: [HousingCoordinator]
    code: 200
    input: []
    output: HousingFacility
    side_effects: ["status -> OPEN"]
  - method: POST
    path: "/programs/housing-assignments"
