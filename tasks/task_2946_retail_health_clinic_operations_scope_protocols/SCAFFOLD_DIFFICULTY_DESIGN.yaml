        distinguishing_aspect: |
          Depth-4 chain triggered by POST /staffing-assignments/{id}/cancel: hop 1 decrements
          Clinic.on_duty_clinician_count to 0, which alone re-derives open_status to CLOSED (hop 2),
          which alone defers the two WAITING entries and cancels the SCREENING visit (hop 3), and
          it is those queue transitions — not the cancel call — that force waiting_count to 0 and
          therefore posted_wait_minutes to 0 (hop 4).
