            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00, payment_terms_days: 30, settlement_basis: "SUPPLIER_FIGURES" }
              as: CreditController
              captures: { cust_id: $.data.id }
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", scrubber_fitted: false, nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
          trigger:
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "REOPEN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-002"
            - call: "POST /nominations/${nom_id}/confirm"
              payload: {}
              as: OpsCoordinator
          assert:
            - "After the REJECT call: Nomination.${nom_id}.compliance_status == REJECTED and fulfillment_status == DRAFT"
            - "After the REOPEN call: Nomination.${nom_id}.compliance_status == PENDING_REVIEW, compliance_reviewer_user_id == null, fulfillment_status still == DRAFT"
            - "After the APPROVE call: Nomination.${nom_id}.compliance_status == APPROVED and compliance_reviewer_user_id == co-002, fulfillment_status still == DRAFT"
            - "After the confirm call: Nomination.${nom_id}.fulfillment_status == CONFIRMED and compliance_status still == APPROVED"
            - "Nomination.${nom_id}.version == 5 (four mutating calls on top of creation)"

      - name: quality_claim_remediation_retest_cycle
        grounds:
          - state_machines.QualityClaim.SUBMITTED_to_UNDER_ANALYSIS
          - state_machines.QualityClaim.UNDER_ANALYSIS_to_REMEDIATION_PROPOSED
          - state_machines.QualityClaim.REMEDIATION_PROPOSED_to_UNDER_ANALYSIS
          - state_machines.QualityClaim.UNDER_ANALYSIS_to_UNDER_ANALYSIS
          - calculations.remediation_credit
          - entities.QualityClaim.fields.analysis_round
          - entities.LabAnalysis.fields.round_index
          - errors[ERR_RETEST_LIMIT_REACHED]
