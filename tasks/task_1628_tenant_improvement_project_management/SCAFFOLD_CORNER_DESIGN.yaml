scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, defaults, not-found, type constraints
  # =====================================================================
  - section: entities
    instances:
      - name: property_creation_applies_default_capacity
        claim_type: defaults
        grounds: ["entities.Property.fields.max_concurrent_construction_projects"]
        distinguishing_aspect: "Omitting max_concurrent_construction_projects applies the default 2."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { name: "Default Tower", address: "100 Default Ave" }
              as: LandlordPM
              captures: { prop_id: $.data.id, cap: $.data.max_concurrent_construction_projects }
          assert:
            - "Property.${prop_id}.max_concurrent_construction_projects == 2"
            - "Property.${prop_id}.version == 1"
      - name: lease_creation_defaults_abatement_basis_calendar
        claim_type: defaults
        grounds: ["entities.Lease.fields.abatement_basis"]
        distinguishing_aspect: "Omitting abatement_basis defaults the lease to CALENDAR."
        test_recipe:
          setup: ["Property with one VACANT space and one tenant exist"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
          trigger:
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id, basis: $.data.abatement_basis, st: $.data.status }
          assert:
            - "Lease.${lease_id}.abatement_basis == CALENDAR"
            - "Lease.${lease_id}.status == DRAFT (initial state)"
            - "Lease.${lease_id}.rent_abatement_credit_cents == 0"
      - name: lease_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/leases without base_rent_annual_cents is rejected at priority 5."
        test_recipe:
          setup: ["Property, space, tenant exist"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
          trigger:
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
      - name: work_letter_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.WorkLetter.fields.work_delineation", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "work_delineation outside {LANDLORD, TENANT, SPLIT} is a 400."
        test_recipe:
          setup: ["Lease ACTIVE with a TIProject in INITIATED"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "bad enum", allowance_offer_cents: 100, work_delineation: "SHARED" }
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
      - name: get_nonexistent_project_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/ti-projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"
      - name: disbursement_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: ["entities.DisbursementRequest.fields.approved_amount_cents", "entities.DisbursementRequest.fields.net_payment_cents"]
        distinguishing_aspect: "Computed fields are system-set: a freshly created draw has approved_amount_cents == 0 and net_payment_cents == 0 regardless of any client intent; draw_number is server-assigned sequentially from 1."
        test_recipe:
          setup: ["Project in CONSTRUCTION with ACTIVE engagement; two draws created back-to-back"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/plan-submissions/${sub_id}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub_id}/approve"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-pre-construction"
              as: LandlordPM
            - call: "POST /api/contractors"
              payload: { company_name: "BC", license_number: "L", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contractors/${ctr_id}/qualify"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/contractor-engagements"
              payload: { contractor_id: "${ctr_id}", scope_note: "GC" }
              as: LandlordPM
              captures: { eng_id: $.data.id }
            - call: "POST /api/contractor-engagements/${eng_id}/acknowledge-rules"
              as: ContractorRep
              as_user_id: "${ctr_id}"
            - call: "POST /api/contractor-engagements/${eng_id}/approve"
              as: LandlordPM
            - call: "POST /api/contractor-engagements/${eng_id}/activate"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/start-construction"
              payload: { construction_start_date: "2026-08-03T00:00:00Z", construction_end_date: "2026-09-04T00:00:00Z" }
              as: LandlordPM
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 500000, expected_ti_project_version: "${pv}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { d1: $.data.id, d1_num: $.data.draw_number, d1_app: $.data.approved_amount_cents, d1_net: $.data.net_payment_cents }
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { pv2: $.data.version }
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 600000, expected_ti_project_version: "${pv2}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { d2: $.data.id, d2_num: $.data.draw_number }
          assert:
            - "DisbursementRequest.${d1}.draw_number == 1"
            - "DisbursementRequest.${d2}.draw_number == 2 (server-assigned, created_at order)"
            - "DisbursementRequest.${d1}.approved_amount_cents == 0 and net_payment_cents == 0 at creation"

  # =====================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial states, side effects
  # =====================================================================
  - section: state_machines
    instances:
      - name: contractor_terminal_revoked_rejects_qualify
        claim_type: invalid_transition
        grounds: ["state_machines.Contractor", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal: qualify on a revoked contractor fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contractor in PENDING, revoked directly"]
          setup_api_calls:
            - call: "POST /api/contractors"
              payload: { company_name: "BC", license_number: "L", insurance_expiry_date: "2027-01-01T00:00:00Z" }
              as: LandlordPM
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contractors/${ctr_id}/revoke"
              as: LandlordPM
          trigger:
            - call: "POST /api/contractors/${ctr_id}/qualify"
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Contractor.${ctr_id}.qualification_status == REVOKED"
      - name: work_letter_withdraw_from_executed_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.WorkLetter", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "EXECUTED is terminal for WorkLetter: withdraw is not in its transition set."
        test_recipe:
          setup: ["WorkLetter EXECUTED on a project"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
          trigger:
            - call: "POST /api/work-letters/${wl_id}/withdraw"
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "WorkLetter.${wl_id}.status == EXECUTED"
      - name: second_work_letter_execute_rejected_already_executed
        claim_type: precondition_enforcement
        grounds: ["validations[priority=15]", "errors[ERR_WORK_LETTER_ALREADY_EXECUTED]"]
        distinguishing_aspect: "A second ACCEPTED work letter cannot execute while one is already EXECUTED (ERR_WORK_LETTER_ALREADY_EXECUTED)."
        test_recipe:
          setup: ["Project with wl1 EXECUTED; wl2 created, proposed, accepted"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "v1", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl1: $.data.id }
            - call: "POST /api/work-letters/${wl1}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl1}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl1}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "v2", allowance_offer_cents: 51000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl2: $.data.id }
            - call: "POST /api/work-letters/${wl2}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl2}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
          trigger:
            - call: "POST /api/work-letters/${wl2}/execute"
              as: LandlordPM
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WORK_LETTER_ALREADY_EXECUTED, HTTP 409"
            - "TIProject.${proj_id}.allowance_total_cents == 50000000 (first letter's offer, unchanged)"
      - name: plan_revision_supersede_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.PlanSubmission.REVISION_REQUIRED_to_SUPERSEDED"]
        distinguishing_aspect: "Creating the next revision flips the REVISION_REQUIRED predecessor to SUPERSEDED and assigns revision_no = prior + 1."
        test_recipe:
          setup: ["Project in PLAN_REVIEW; submission rev1 UNDER_REVIEW then REVISION_REQUIRED"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS-1" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub1: $.data.id, rev1: $.data.revision_no }
            - call: "POST /api/plan-submissions/${sub1}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub1}/request-revision"
              as: LandlordPM
          trigger:
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS-2" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub2: $.data.id, rev2: $.data.revision_no }
            - call: "GET /api/plan-submissions/${sub1}"
              as: LandlordPM
              captures: { sub1_status: $.data.status, sub1_round: $.data.review_round }
          assert:
            - "PlanSubmission.${sub1}.status == SUPERSEDED"
            - "PlanSubmission.${sub1}.review_round == 1"
            - "PlanSubmission.${sub2}.revision_no == 2 and status == SUBMITTED"
      - name: plan_approval_blocked_by_open_blocking_comment
        claim_type: precondition_enforcement
        grounds: ["validations[priority=11]", "errors[ERR_BLOCKING_COMMENTS_OPEN]"]
        distinguishing_aspect: "One OPEN BLOCKING comment defeats plan approval; resolving it unblocks."
        test_recipe:
          setup: ["Project in PLAN_REVIEW; submission UNDER_REVIEW with one OPEN BLOCKING comment"]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "P", address: "1 St" }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "1", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "T", contact_email: "t@x.example", tax_id: "TX" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/begin-plan-review"
              as: LandlordPM
            - call: "POST /api/ti-projects/${proj_id}/plan-submissions"
              payload: { drawing_set_ref: "DS-1" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { sub1: $.data.id }
            - call: "POST /api/plan-submissions/${sub1}/start-review"
              as: LandlordPM
            - call: "POST /api/plan-submissions/${sub1}/comments"
              payload: { comment_text: "Egress path violates code", severity: "BLOCKING" }
              as: LandlordPM
              captures: { cmt: $.data.id }
