  - name: dispute_upheld_cascades_into_cancellation_and_claim_void
    grounds: §1.2 prescriber_dispute_lifecycle OPEN -> UPHELD invalidates the prescription, which cancels its PENDING orders, recall-flags its shipped and delivered orders, voids the claims on those orders and recomputes the Customer ledgers.
    distinguishing_aspect: An implementation that stops at the dispute row, or that cancels the delivered order instead of recall-flagging it, leaves allowance_used_cents at 6400 and net_cash_position_cents at 12800. The correct implementation leaves the delivered order DELIVERED with recall_flagged true, cancels only the PENDING order, voids the claim, and settles the ledger at lifetime_charged_cents 6400, net_cash_position_cents 6400 and allowance_used_cents 0.
    test_recipe:
      setup:
      - One prescription of a plan-covered customer has a delivered 6400-cent order with a GENERATED claim and a second still-PENDING 6400-cent order; the named prescriber then files a NEVER_ISSUED dispute at the current prescription version.
