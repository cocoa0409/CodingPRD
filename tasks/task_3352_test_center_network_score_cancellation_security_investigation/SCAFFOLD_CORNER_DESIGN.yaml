  - section: calculations
    instances:
      - name: compliance_high_severity_overrides_perfect_score
        claim_type: correct_result
        grounds: ["calculations.audit_compliance_score", "entities.CenterAudit.fields.outcome"]
        distinguishing_aspect: "The high-severity branch is independent of the arithmetic: zero count-findings give a perfect score 100, yet high_severity_findings == 1 forces outcome FAILED."
        test_recipe:
          setup: ["APPLIED center with one SCHEDULED ANNOUNCED audit"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center HS", facility_seat_capacity: 15, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 0, staffing_findings: 0, equipment_findings: 0, high_severity_findings: 1 }
              as: Auditor
          assert:
            - "CenterAudit.${a_id}.compliance_score == 100"
            - "CenterAudit.${a_id}.outcome == FAILED (high_severity_findings >= 1 overrides the score)"
            - "TestCenter.${c_id}.authorization_status remains APPLIED"
      - name: waitlist_promotion_earliest_created_first
        claim_type: correct_result
        grounds: ["calculations.waitlist_promotion_selection"]
        distinguishing_aspect: "The promotion selector is chronological: of two waitlisted registrations the one with the smaller created_at is promoted, and the survivor's waitlist_position recomputes to 1."
        test_recipe:
          setup: ["AUTHORIZED center, PUBLISHED session total_seats 1 reserved 0; E1 CONFIRMED, E2 and E3 WAITLISTED in creation order"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center WP", facility_seat_capacity: 10, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
