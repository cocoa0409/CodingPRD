          trigger:
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /drinkware/colorway-drops/${c_drop}"
              payload: {}
              as: PlatformAdmin
              captures: { status_live: $.data.status }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /drinkware/colorway-drops/${c_drop}"
              payload: {}
              as: PlatformAdmin
              captures: { status_closed: $.data.status }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-std", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2027-01-05T00:00:00Z" }
