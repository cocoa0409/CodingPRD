scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: toll_pricing_transponder_vs_plate_rate
        grounds:
          - calculations.toll_pricing
          - state_machines.TollTransaction.PENDING_to_PRICED
          - entities.TollTransaction.fields.toll_cents
        distinguishing_aspect: |
          Same gantry geometry priced two ways on the TollTransaction domain: a TRANSPONDER read
          charges gross_toll_cents (500) while a PLATE read applies plate_surcharge_bps producing a
          different toll_cents (750). The two variants live on the TollTransaction entity domain.
        test_recipe:
          setup:
            - "One plaza: base 400, peak_multiplier_bps 2500, plate_surcharge_bps 5000."
            - "One ACTIVE account with a vehicle and a transponder bound to it."
            - "Two PENDING transactions at peak, 2 axles: one TRANSPONDER read, one PLATE read on the same plate."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ann", home_state_code: "NY" }
              as: TollOperator
              captures: { acct_id: $.data.id }
            - call: "POST /etc/accounts/${acct_id}/credit"
              payload: { amount_cents: 100000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${acct_id}", plate_number: "ABC123", plate_state_code: "NY" }
              as: TollOperator
              captures: { veh_id: $.data.id, veh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${acct_id}", serial: "TP-1" }
              as: TollOperator
              captures: { tp_id: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${tp_id}", vehicle_id: "${veh_id}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${veh_ver}" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /etc/plazas"
              payload: { name: "P1", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { plaza_id: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${plaza_id}", read_method: "TRANSPONDER", read_at: "2026-02-01T08:00:00Z", is_peak: true, declared_axles: 2, transponder_id: "${tp_id}" }
              as: TollOperator
              captures: { txn_tp_id: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${plaza_id}", read_method: "PLATE", read_at: "2026-02-01T09:00:00Z", is_peak: true, declared_axles: 2, plate_number: "ABC123", plate_state_code: "NY" }
              as: TollOperator
              captures: { txn_pl_id: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${txn_tp_id}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/toll-transactions/${txn_pl_id}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${txn_tp_id}.toll_cents == 500"
            - "TollTransaction.${txn_pl_id}.toll_cents == 750"
            - "TollTransaction.${txn_tp_id}.toll_cents != TollTransaction.${txn_pl_id}.toll_cents"

      - name: auto_reload_fixed_vs_restore_to_target
        grounds:
          - calculations.auto_reload_amount
          - entities.Account.fields.balance_cents
          - entities.Account.fields.reload_policy
        distinguishing_aspect: |
          Same low-balance trigger on the Account domain resolves two ways: FIXED adds a flat 4000,
          while RESTORE_TO_TARGET tops up exactly (target - current) producing a different credit; both
          on the Account entity, a different domain than toll_pricing.
        test_recipe:
          setup:
            - "Account X: FIXED policy, reload_amount 4000, threshold 1000, auto_reload on, balance seeded to 900, transponder bound."
            - "Account Y: RESTORE_TO_TARGET policy, target 5000, threshold 1000, auto_reload on, balance seeded to 900, transponder bound."
            - "A plaza with base 400 off-peak so a transponder toll of 400 pushes each below threshold."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "X", home_state_code: "NY", auto_reload_enabled: true, reload_policy: "FIXED", reload_amount_cents: 4000, low_balance_threshold_cents: 1000 }
              as: TollOperator
              captures: { x_id: $.data.id }
            - call: "POST /etc/accounts/${x_id}/credit"
              payload: { amount_cents: 900 }
              as: TollOperator
            - call: "POST /etc/accounts"
              payload: { holder_name: "Y", home_state_code: "NY", auto_reload_enabled: true, reload_policy: "RESTORE_TO_TARGET", target_balance_cents: 5000, low_balance_threshold_cents: 1000 }
              as: TollOperator
              captures: { y_id: $.data.id }
            - call: "POST /etc/accounts/${y_id}/credit"
              payload: { amount_cents: 900 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${x_id}", plate_number: "XPLATE", plate_state_code: "NY" }
              as: TollOperator
              captures: { xveh_id: $.data.id, xveh_ver: $.data.version }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${y_id}", plate_number: "YPLATE", plate_state_code: "NY" }
              as: TollOperator
              captures: { yveh_id: $.data.id, yveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${x_id}", serial: "TP-X" }
              as: TollOperator
              captures: { xtp: $.data.id }
            - call: "POST /etc/transponders"
              payload: { account_id: "${y_id}", serial: "TP-Y" }
              as: TollOperator
              captures: { ytp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${xtp}", vehicle_id: "${xveh_id}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${xveh_ver}" }
              as: AccountHolder
              as_user_id: "${x_id}"
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ytp}", vehicle_id: "${yveh_id}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${yveh_ver}" }
              as: AccountHolder
              as_user_id: "${y_id}"
            - call: "POST /etc/plazas"
              payload: { name: "P0", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { plaza0: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${plaza0}", read_method: "TRANSPONDER", read_at: "2026-02-01T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${xtp}" }
              as: TollOperator
              captures: { xtxn: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${plaza0}", read_method: "TRANSPONDER", read_at: "2026-02-01T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${ytp}" }
              as: TollOperator
              captures: { ytxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${xtxn}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/toll-transactions/${ytxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "Account.${x_id}.balance_cents == 4500"
            - "Account.${y_id}.balance_cents == 5000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: toll_tiered_axle_plus_peak_multiplier
        grounds:
          - calculations.toll_pricing
          - entities.Plaza.fields.peak_multiplier_bps
          - entities.Plaza.fields.axle_surcharge_cents
        distinguishing_aspect: |
          Mode (a): gross_toll_cents combines >=3 inputs (base_rate, per-axle surcharge over 2 axles,
          peak multiplier) non-linearly — the peak multiplier applies to the axle-adjusted pre-toll, so
          axle and peak interact multiplicatively rather than additively (3 axles + peak = 688, not 550+125).
        test_recipe:
          setup:
            - "Plaza: base 400, axle_surcharge 150, peak_multiplier_bps 2500."
            - "ACTIVE account, vehicle, bound transponder; one PLATE/TRANSPONDER PENDING read at 3 axles peak."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cmb", home_state_code: "NY" }
              as: TollOperator
              captures: { c_id: $.data.id }
            - call: "POST /etc/accounts/${c_id}/credit"
              payload: { amount_cents: 100000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${c_id}", plate_number: "CMB1", plate_state_code: "NY", axle_count: 3 }
              as: TollOperator
              captures: { cveh_id: $.data.id, cveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${c_id}", serial: "TP-CMB" }
              as: TollOperator
              captures: { ctp_id: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ctp_id}", vehicle_id: "${cveh_id}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${cveh_ver}" }
              as: AccountHolder
              as_user_id: "${c_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Pcmb", state_code: "NY", base_rate_cents: 400, axle_surcharge_cents: 150, peak_multiplier_bps: 2500 }
              as: TollOperator
              captures: { pcmb: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pcmb}", read_method: "TRANSPONDER", read_at: "2026-02-02T08:00:00Z", is_peak: true, declared_axles: 3, transponder_id: "${ctp_id}" }
              as: TollOperator
              captures: { ctxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${ctxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${ctxn}.gross_toll_cents == 688"
            - "TollTransaction.${ctxn}.toll_cents == 688"

      - name: trip_round_per_segment_then_sum
        grounds:
          - calculations.trip_multi_segment_toll
          - calculations.toll_pricing
        distinguishing_aspect: |
          Mode (b): a two-segment trip where each segment rounds to 416 cents (333*1.25=416.25 -> 416)
          and the pinned order ROUND-PER-SEGMENT-THEN-SUM yields 832, whereas sum-then-round (416.25*2
          =832.5 -> 833) would differ by one cent; the scaffold pins per-segment rounding.
        test_recipe:
          setup:
            - "Account with funds; one plaza base 333, peak_multiplier_bps 2500."
            - "A batch-trip of two peak 2-axle segments at that plaza."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Trip", home_state_code: "NY" }
              as: TollOperator
              captures: { t_id: $.data.id }
            - call: "POST /etc/accounts/${t_id}/credit"
              payload: { amount_cents: 100000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${t_id}", plate_number: "TRIP1", plate_state_code: "NY" }
              as: TollOperator
              captures: { tveh_id: $.data.id, tveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${t_id}", serial: "TP-TRIP" }
              as: TollOperator
              captures: { ttp_id: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ttp_id}", vehicle_id: "${tveh_id}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${tveh_ver}" }
              as: AccountHolder
              as_user_id: "${t_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Ptrip", state_code: "NY", base_rate_cents: 333, peak_multiplier_bps: 2500 }
              as: TollOperator
              captures: { ptrip: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/batch-trip"
              payload: { account_id: "${t_id}", segments: [ { plaza_id: "${ptrip}", read_method: "TRANSPONDER", read_at: "2026-02-03T08:00:00Z", is_peak: true, declared_axles: 2, transponder_id: "${ttp_id}" }, { plaza_id: "${ptrip}", read_method: "TRANSPONDER", read_at: "2026-02-03T08:05:00Z", is_peak: true, declared_axles: 2, transponder_id: "${ttp_id}" } ] }
              as: TollOperator
          assert:
            - "Account.${t_id}.balance_cents == 99168"
            - "the two created TollTransactions each have toll_cents == 416 (round-per-segment), summing to 832 charged"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: toll_transaction_parallel_pricing_and_settlement
        grounds:
          - state_machines.TollTransaction.PENDING_to_PRICED
          - state_machines.TollTransaction.UNSETTLED_to_IN_VIOLATION
          - entities.TollTransaction.fields.pricing_status
          - entities.TollTransaction.fields.settlement_status
        distinguishing_aspect: |
          TollTransaction carries two independent state dimensions (pricing_status × settlement_status):
          a PLATE read can reach pricing_status=PRICED while its settlement_status independently moves
          UNSETTLED -> IN_VIOLATION, demonstrating parallel axes on one entity.
        test_recipe:
          setup:
            - "A PLATE read priced (PRICED) but left UNSETTLED, then escalated to a violation."
            - "Account ACTIVE, vehicle REGISTERED, no transponder so plate read does not auto-settle."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Par", home_state_code: "NY" }
              as: TollOperator
              captures: { p_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${p_id}", plate_number: "PAR1", plate_state_code: "NY" }
              as: TollOperator
              captures: { pveh: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Ppar", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { ppar: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${ppar}", read_method: "PLATE", read_at: "2026-02-04T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "PAR1", plate_state_code: "NY" }
              as: TollOperator
              captures: { ptxn: $.data.id }
            - call: "POST /etc/toll-transactions/${ptxn}/price"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${ptxn}" }
              as: TollOperator
              captures: { pviol: $.data.id }
          assert:
            - "TollTransaction.${ptxn}.pricing_status == PRICED"
            - "TollTransaction.${ptxn}.settlement_status == IN_VIOLATION"

      - name: violation_cyclic_contest_reject_reissue
        grounds:
          - state_machines.Violation.ASSESSED_to_CONTESTED
          - state_machines.Violation.CONTESTED_to_ASSESSED
          - entities.Violation.fields.escalation_tier
        distinguishing_aspect: |
          Violation cycles ASSESSED -> CONTESTED -> ASSESSED on a rejected dispute, returning to a prior
          state (a true cycle on a different entity than TollTransaction) and incrementing escalation_tier
          from 1 to 2 on the second ASSESSED entry.
        test_recipe:
          setup:
            - "An ASSESSED violation on a plate-read toll (toll_due 750), contested, then dispute rejected."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Cyc", home_state_code: "NY" }
              as: TollOperator
              captures: { cy_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${cy_id}", plate_number: "CYC1", plate_state_code: "NY" }
              as: TollOperator
              captures: { cyveh: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Pcyc", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { pcyc: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pcyc}", read_method: "PLATE", read_at: "2026-02-05T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "CYC1", plate_state_code: "NY" }
              as: TollOperator
              captures: { cytxn: $.data.id }
            - call: "POST /etc/toll-transactions/${cytxn}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${cytxn}" }
              as: TollOperator
              captures: { cyviol: $.data.id }
            - call: "POST /etc/violations/${cyviol}/contest"
              payload: { dispute_reason: "not me" }
              as: AccountHolder
              as_user_id: "${cy_id}"
          trigger:
            - call: "POST /etc/violations/${cyviol}/reject-dispute"
              payload: {}
              as: TollOperator
          assert:
            - "Violation.${cyviol}.settlement_status == ASSESSED"
            - "Violation.${cyviol}.escalation_tier == 2"
            - "Violation.${cyviol}.fine_total_cents == 4750"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: price_debit_lowbalance_autoreload_depth3
        grounds:
          - state_machines.TollTransaction.PENDING_to_PRICED
          - calculations.auto_reload_amount
          - entities.Account.fields.balance_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-3 chain from one trigger: pricing the transaction (A) debits the Account balance (B);
          that debit (B) crosses low_balance_threshold which itself fires auto-reload (C), each link caused
          by the previous, not by the original price call directly.
        test_recipe:
          setup:
            - "Account: auto_reload FIXED 4000, threshold 1000, balance seeded 900; vehicle + bound transponder."
            - "Plaza base 400 off-peak so toll 400 -> balance 500 (<= 1000) -> reload to 4500."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Csc", home_state_code: "NY", auto_reload_enabled: true, reload_policy: "FIXED", reload_amount_cents: 4000, low_balance_threshold_cents: 1000 }
              as: TollOperator
              captures: { cs_id: $.data.id }
            - call: "POST /etc/accounts/${cs_id}/credit"
              payload: { amount_cents: 900 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${cs_id}", plate_number: "CSC1", plate_state_code: "NY" }
              as: TollOperator
              captures: { csveh: $.data.id, csveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${cs_id}", serial: "TP-CSC" }
              as: TollOperator
              captures: { cstp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${cstp}", vehicle_id: "${csveh}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${csveh_ver}" }
              as: AccountHolder
              as_user_id: "${cs_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Pcsc", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pcsc: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pcsc}", read_method: "TRANSPONDER", read_at: "2026-02-06T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${cstp}" }
              as: TollOperator
              captures: { cstxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${cstxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${cstxn}.settlement_status == SETTLED"
            - "Account.${cs_id}.balance_cents == 4500"
            - "Account.${cs_id} has a TOLL_DEBIT ledger entry of -400 and a RELOAD_CREDIT of +4000"

      - name: accept_dispute_writeoff_delinquent_clears_depth3
        grounds:
          - state_machines.Violation.CONTESTED_to_DISMISSED
          - state_machines.TollTransaction.IN_VIOLATION_to_WRITTEN_OFF
          - state_machines.Account.DELINQUENT_to_ACTIVE
          - calculations.account_outstanding_fines
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (accept-dispute): dismissing the Violation (A) writes off
          its linked TollTransaction (B); the dismissal recomputes outstanding_fines to 0 which flips the
          Account DELINQUENT -> ACTIVE (C), each link caused by the previous.
        test_recipe:
          setup:
            - "An account DELINQUENT due to its sole violation (contested), nothing else outstanding."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Del", home_state_code: "NY" }
              as: TollOperator
              captures: { d_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${d_id}", plate_number: "DEL1", plate_state_code: "NY" }
              as: TollOperator
              captures: { dveh: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Pdel", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { pdel: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pdel}", read_method: "PLATE", read_at: "2026-02-07T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "DEL1", plate_state_code: "NY" }
              as: TollOperator
              captures: { dtxn: $.data.id }
            - call: "POST /etc/toll-transactions/${dtxn}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${dtxn}" }
              as: TollOperator
              captures: { dviol: $.data.id }
            - call: "POST /etc/violations/${dviol}/contest"
              payload: { dispute_reason: "wrong plate" }
              as: AccountHolder
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /etc/violations/${dviol}/accept-dispute"
              payload: {}
              as: TollOperator
          assert:
            - "Violation.${dviol}.settlement_status == DISMISSED"
            - "TollTransaction.${dtxn}.settlement_status == WRITTEN_OFF"
            - "Account.${d_id}.status == ACTIVE"
            - "Account.${d_id}.outstanding_fines_cents == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: account_not_active_beats_binding_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          Pairs business_safety (priority 7 ERR_ACCOUNT_NOT_ACTIVE) against business_temporal (priority 9
          ERR_BINDING_OVERLAP): a bind that both targets a non-ACTIVE account AND overlaps an existing
          binding must return the safety error, the higher-priority category.
        test_recipe:
          setup:
            - "Account suspended; a transponder previously bound (now ended) and a still-overlapping binding window."
            - "To make both checks fail at once: account SUSPENDED, plus an overlapping ACTIVE binding interval exists."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Pp1", home_state_code: "NY" }
              as: TollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${pp1_id}", plate_number: "PP1V", plate_state_code: "NY" }
              as: TollOperator
              captures: { pp1veh: $.data.id, pp1veh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${pp1_id}", serial: "TP-PP1A" }
              as: TollOperator
              captures: { pp1tpa: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${pp1tpa}", vehicle_id: "${pp1veh}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_vehicle_version: "${pp1veh_ver}" }
              as: AccountHolder
              as_user_id: "${pp1_id}"
            - call: "GET /etc/vehicles/${pp1veh}"
              payload: {}
              as: AccountHolder
              as_user_id: "${pp1_id}"
              captures: { pp1veh_ver2: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${pp1_id}", serial: "TP-PP1B" }
              as: TollOperator
              captures: { pp1tpb: $.data.id }
            - call: "POST /etc/accounts/${pp1_id}/suspend"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${pp1tpb}", vehicle_id: "${pp1veh}", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", expected_vehicle_version: "${pp1veh_ver2}" }
              as: AccountHolder
              as_user_id: "${pp1_id}"
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"
            - "response http_status == 409"

      - name: not_found_beats_insufficient_balance_on_pay
        grounds:
          - validations[priority=3]
          - validations[priority=15]
        distinguishing_aspect: |
          Pairs existence (priority 3 ERR_NOT_FOUND) against business_fiscal (priority 15
          ERR_INSUFFICIENT_BALANCE): paying a nonexistent violation id from an underfunded account returns
          the existence error, not the fiscal error, because existence is checked first.
        test_recipe:
          setup:
            - "An account exists with zero balance (no violation matching the id used in the trigger)."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Pp2", home_state_code: "NY" }
              as: TollOperator
              captures: { pp2_id: $.data.id }
          trigger:
            - call: "POST /etc/violations/00000000-0000-4000-8000-000000000000/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${pp2_id}"
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http_status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: auto_reload_fires_at_threshold_inclusive
        grounds:
          - calculations.auto_reload_amount
          - entities.Account.fields.low_balance_threshold_cents
          - state_machines.TollTransaction.PENDING_to_PRICED
        distinguishing_aspect: |
          Numeric threshold boundary on balance: auto-reload fires when balance_cents <= threshold (1000),
          so a toll leaving balance EXACTLY at 1000 triggers reload, while leaving balance at 1001 does not —
          reached through POST .../price.
        test_recipe:
          setup:
            - "Account FIXED reload 4000, threshold 1000, balance seeded 1400; transponder bound; off-peak plaza base 400."
            - "Pricing debits 400 -> balance lands exactly at 1000 (== threshold) -> reload fires -> 5000."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Bnd", home_state_code: "NY", auto_reload_enabled: true, reload_policy: "FIXED", reload_amount_cents: 4000, low_balance_threshold_cents: 1000 }
              as: TollOperator
              captures: { b_id: $.data.id }
            - call: "POST /etc/accounts/${b_id}/credit"
              payload: { amount_cents: 1400 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${b_id}", plate_number: "BND1", plate_state_code: "NY" }
              as: TollOperator
              captures: { bveh: $.data.id, bveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${b_id}", serial: "TP-BND" }
              as: TollOperator
              captures: { btp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${btp}", vehicle_id: "${bveh}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${bveh_ver}" }
              as: AccountHolder
              as_user_id: "${b_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Pbnd", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pbnd: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pbnd}", read_method: "TRANSPONDER", read_at: "2026-02-08T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${btp}" }
              as: TollOperator
              captures: { btxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${btxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "Account.${b_id}.balance_cents == 5000"

      - name: hov_exemption_at_min_occupants_inclusive
        grounds:
          - state_machines.TollTransaction.PENDING_to_EXEMPT
          - entities.Plaza.fields.hov_min_occupants
          - entities.HovWindow.fields.declared_occupants
        distinguishing_aspect: |
          Occupancy boundary on a different metric/endpoint: a declared_occupants value EXACTLY equal to
          plaza.hov_min_occupants (3) qualifies for full exemption (>=, inclusive), where 2 would not —
          reached through POST .../price producing pricing_status=EXEMPT.
        test_recipe:
          setup:
            - "Vehicle hov_capable; plaza hov_min_occupants 3; HovWindow declared_occupants 3 covering read_at."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Hov", home_state_code: "NY" }
              as: TollOperator
              captures: { h_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${h_id}", plate_number: "HOV1", plate_state_code: "NY", hov_capable: true }
              as: TollOperator
              captures: { hveh: $.data.id, hveh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${h_id}", serial: "TP-HOV" }
              as: TollOperator
              captures: { htp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${htp}", vehicle_id: "${hveh}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${hveh_ver}" }
              as: AccountHolder
              as_user_id: "${h_id}"
            - call: "POST /etc/hov-windows"
              payload: { vehicle_id: "${hveh}", window_from: "2026-02-09T07:00:00Z", window_to: "2026-02-09T10:00:00Z", declared_occupants: 3 }
              as: AccountHolder
              as_user_id: "${h_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Phov", state_code: "NY", base_rate_cents: 400, hov_min_occupants: 3 }
              as: TollOperator
              captures: { phov: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${phov}", read_method: "TRANSPONDER", read_at: "2026-02-09T08:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${htp}" }
              as: TollOperator
              captures: { htxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${htxn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "TollTransaction.${htxn}.pricing_status == EXEMPT"
            - "TollTransaction.${htxn}.hov_exempt == true"
            - "TollTransaction.${htxn}.toll_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: binding_requires_account_active
        grounds:
          - state_machines.Transponder.UNBOUND_to_BOUND
          - validations[priority=7]
          - entities.Account.fields.status
        distinguishing_aspect: |
          Transponder's UNBOUND -> BOUND depends on the owning Account's status being ACTIVE (entity pair
          Transponder→Account): binding against a SUSPENDED account is rejected with ERR_ACCOUNT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Account suspended; an UNBOUND transponder and a vehicle both owned by it."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ce1", home_state_code: "NY" }
              as: TollOperator
              captures: { ce1_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ce1_id}", plate_number: "CE1V", plate_state_code: "NY" }
              as: TollOperator
              captures: { ce1veh: $.data.id, ce1veh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${ce1_id}", serial: "TP-CE1" }
              as: TollOperator
              captures: { ce1tp: $.data.id }
            - call: "POST /etc/accounts/${ce1_id}/suspend"
              payload: {}
              as: TollOperator
          trigger:
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ce1tp}", vehicle_id: "${ce1veh}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${ce1veh_ver}" }
              as: AccountHolder
              as_user_id: "${ce1_id}"
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"

      - name: transponder_price_requires_vehicle_registered
        grounds:
          - state_machines.TollTransaction.PENDING_to_PRICED
          - validations[priority=8]
          - entities.Vehicle.fields.registration_status
        distinguishing_aspect: |
          TollTransaction PENDING -> PRICED on a PLATE read depends on the matched Vehicle's
          registration_status (entity pair TollTransaction→Vehicle, distinct from Transponder→Account):
          a LAPSED vehicle's plate read is rejected at price with ERR_PLATE_UNREGISTERED.
        test_recipe:
          setup:
            - "Vehicle REGISTERED then lapsed; a PLATE read PENDING for that plate."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ce2", home_state_code: "NY" }
              as: TollOperator
              captures: { ce2_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ce2_id}", plate_number: "CE2V", plate_state_code: "NY" }
              as: TollOperator
              captures: { ce2veh: $.data.id }
            - call: "POST /etc/vehicles/${ce2veh}/lapse-registration"
              payload: {}
              as: TollOperator
            - call: "POST /etc/plazas"
              payload: { name: "Pce2", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pce2: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pce2}", read_method: "PLATE", read_at: "2026-02-10T08:00:00Z", is_peak: false, declared_axles: 2, plate_number: "CE2V", plate_state_code: "NY" }
              as: TollOperator
              captures: { ce2txn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${ce2txn}/price"
              payload: {}
              as: TollOperator
          assert:
            - "response error_id == ERR_PLATE_UNREGISTERED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: binding_half_open_overlap_on_vehicle
        grounds:
          - validations[priority=9]
          - entities.TransponderBinding.fields.effective_from
          - entities.TransponderBinding.fields.effective_to
        distinguishing_aspect: |
          On the Vehicle resource, binding intervals are half-open [from, to): a new binding whose start
          falls strictly inside an existing active interval is rejected (ERR_BINDING_OVERLAP), while one
          that begins exactly at the prior interval's effective_to is accepted (abutting allowed).
        test_recipe:
          setup:
            - "Vehicle with one ACTIVE binding [2026-01-01, 2026-06-01); a second transponder to bind overlapping."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ov1", home_state_code: "NY" }
              as: TollOperator
              captures: { ov1_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ov1_id}", plate_number: "OV1V", plate_state_code: "NY" }
              as: TollOperator
              captures: { ov1veh: $.data.id, ov1veh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${ov1_id}", serial: "TP-OV1A" }
              as: TollOperator
              captures: { ov1tpa: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ov1tpa}", vehicle_id: "${ov1veh}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", expected_vehicle_version: "${ov1veh_ver}" }
              as: AccountHolder
              as_user_id: "${ov1_id}"
            - call: "GET /etc/vehicles/${ov1veh}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ov1_id}"
              captures: { ov1veh_ver2: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${ov1_id}", serial: "TP-OV1B" }
              as: TollOperator
              captures: { ov1tpb: $.data.id }
          trigger:
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${ov1tpb}", vehicle_id: "${ov1veh}", effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_vehicle_version: "${ov1veh_ver2}" }
              as: AccountHolder
              as_user_id: "${ov1_id}"
          assert:
            - "response error_id == ERR_BINDING_OVERLAP"

      - name: hov_window_buffered_overlap_on_vehicle
        grounds:
          - validations[priority=10]
          - entities.HovWindow.fields.window_from
          - entities.HovWindow.fields.window_to
        distinguishing_aspect: |
          On the Vehicle resource, HOV windows use buffered intervals (15-minute buffer): a new window that
          starts within 15 minutes of an existing DECLARED window's end is rejected (ERR_HOV_WINDOW_OVERLAP),
          a stricter geometric treatment than the half-open binding rule which allows exact abutment.
        test_recipe:
          setup:
            - "Vehicle with one DECLARED HOV window ending 2026-02-09T10:00:00Z; a new window starting 10 minutes later."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Ov2", home_state_code: "NY" }
              as: TollOperator
              captures: { ov2_id: $.data.id }
            - call: "POST /etc/vehicles"
              payload: { account_id: "${ov2_id}", plate_number: "OV2V", plate_state_code: "NY", hov_capable: true }
              as: TollOperator
              captures: { ov2veh: $.data.id }
            - call: "POST /etc/hov-windows"
              payload: { vehicle_id: "${ov2veh}", window_from: "2026-02-09T07:00:00Z", window_to: "2026-02-09T10:00:00Z", declared_occupants: 3 }
              as: AccountHolder
              as_user_id: "${ov2_id}"
          trigger:
            - call: "POST /etc/hov-windows"
              payload: { vehicle_id: "${ov2veh}", window_from: "2026-02-09T10:10:00Z", window_to: "2026-02-09T12:00:00Z", declared_occupants: 3 }
              as: AccountHolder
              as_user_id: "${ov2_id}"
          assert:
            - "response error_id == ERR_HOV_WINDOW_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reprice_balance_conservation
        grounds:
          - state_machines.TollTransaction.PRICED_to_REPRICED
          - calculations.toll_pricing
          - entities.Account.fields.balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = Account.balance_cents reconciled against the ledger: after a price then a
          reprice, balance_after must equal initial_balance minus the FINAL toll, i.e. the sum of all
          TOLL_DEBIT ledger amounts for the transaction equals -final_toll_cents (no drift on the reprice delta).
        test_recipe:
          setup:
            - "Transponder read priced at 500 (peak 2-axle), then repriced to 3 axles (gross 688)."
            - "Account credited 100000; final balance must be 100000 - 688 = 99312, and ledger debits sum to -688."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Inv1", home_state_code: "NY" }
              as: TollOperator
              captures: { iv1_id: $.data.id }
            - call: "POST /etc/accounts/${iv1_id}/credit"
              payload: { amount_cents: 100000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${iv1_id}", plate_number: "IV1V", plate_state_code: "NY", axle_count: 3 }
              as: TollOperator
              captures: { iv1veh: $.data.id, iv1veh_ver: $.data.version }
            - call: "POST /etc/transponders"
              payload: { account_id: "${iv1_id}", serial: "TP-IV1" }
              as: TollOperator
              captures: { iv1tp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${iv1tp}", vehicle_id: "${iv1veh}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${iv1veh_ver}" }
              as: AccountHolder
              as_user_id: "${iv1_id}"
            - call: "POST /etc/plazas"
              payload: { name: "Piv1", state_code: "NY", base_rate_cents: 400, axle_surcharge_cents: 150, peak_multiplier_bps: 2500 }
              as: TollOperator
              captures: { piv1: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${piv1}", read_method: "TRANSPONDER", read_at: "2026-02-11T08:00:00Z", is_peak: true, declared_axles: 2, transponder_id: "${iv1tp}" }
              as: TollOperator
              captures: { iv1txn: $.data.id }
            - call: "POST /etc/toll-transactions/${iv1txn}/price"
              payload: {}
              as: TollOperator
              captures: { iv1txn_ver: $.data.version }
          trigger:
            - call: "POST /etc/toll-transactions/${iv1txn}/reprice"
              payload: { declared_axles: 3, is_peak: true, expected_transaction_version: "${iv1txn_ver}" }
              as: TollOperator
          assert:
            - "TollTransaction.${iv1txn}.toll_cents == 688"
            - "Account.${iv1_id}.balance_cents == 99312"
            - "sum of TOLL_DEBIT LedgerEntry.amount_cents for ${iv1txn} == -688"

      - name: violation_outstanding_fines_conservation
        grounds:
          - state_machines.Violation.ASSESSED_to_SETTLED
          - calculations.account_outstanding_fines
          - entities.Account.fields.outstanding_fines_cents
        distinguishing_aspect: |
          Conserved quantity = Account.outstanding_fines_cents (a different quantity than balance): issuing a
          violation raises outstanding by fine_total_cents and paying it (the compensating action) lowers it
          by the same amount, leaving outstanding back at 0 — no drift between the two fine-pool movements.
        test_recipe:
          setup:
            - "Account credited enough to pay; a single ASSESSED violation (fine_total 3250) on a plate read."
          setup_api_calls:
            - call: "POST /etc/accounts"
              payload: { holder_name: "Inv2", home_state_code: "NY" }
              as: TollOperator
              captures: { iv2_id: $.data.id }
            - call: "POST /etc/accounts/${iv2_id}/credit"
              payload: { amount_cents: 10000 }
              as: TollOperator
            - call: "POST /etc/vehicles"
              payload: { account_id: "${iv2_id}", plate_number: "IV2V", plate_state_code: "NY" }
              as: TollOperator
              captures: { iv2veh: $.data.id }
            - call: "POST /etc/plazas"
              payload: { name: "Piv2", state_code: "NY", base_rate_cents: 400, peak_multiplier_bps: 2500, plate_surcharge_bps: 5000 }
              as: TollOperator
              captures: { piv2: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${piv2}", read_method: "PLATE", read_at: "2026-02-12T08:00:00Z", is_peak: true, declared_axles: 2, plate_number: "IV2V", plate_state_code: "NY" }
              as: TollOperator
              captures: { iv2txn: $.data.id }
            - call: "POST /etc/toll-transactions/${iv2txn}/price"
              payload: {}
              as: TollOperator
            - call: "POST /etc/violations"
              payload: { toll_transaction_id: "${iv2txn}" }
              as: TollOperator
              captures: { iv2viol: $.data.id }
          trigger:
            - call: "POST /etc/violations/${iv2viol}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${iv2_id}"
          assert:
            - "Violation.${iv2viol}.settlement_status == SETTLED"
            - "Account.${iv2_id}.outstanding_fines_cents == 0"
            - "Account.${iv2_id}.balance_cents == 6750"
