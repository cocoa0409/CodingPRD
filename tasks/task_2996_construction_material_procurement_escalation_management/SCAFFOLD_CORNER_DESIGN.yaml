      - PurchaseCommitment.${pc_over_id}.escalation_accrued == 345.00 with escalation_variant == PROVISIONAL
      - PurchaseCommitment.${pc_over_id}.escalation_index_period == "2026-08"
      - Project.${proj_id}.escalation_contingency_committed == 345.00
      - Project.${proj_id}.escalation_contingency_remaining == 499655.00
      - Project.${proj_id}.committed_total_cost == 2300345.00
  - name: constants_applied_exposure_component_caps_and_the_greatest_tariff_wins
    claim_type: constants_applied
    grounds:
    - calculations.supplier_exposure_score.constants.TARIFF_COMPONENT_CAP
    - calculations.supplier_exposure_score.constants.EVENT_COMPONENT_CAP
    - calculations.supplier_exposure_score.constants.NON_DOMESTIC_PENALTY
    - entities.Supplier.fields.declared_tariff_rate_pct
    distinguishing_aspect: 'Both component caps bind on one read each: a CN mill declaring 10.00 pct but carrying an OPEN TARIFF_IMPOSED event at 30.00 pct takes the GREATEST rate, so 1.6 * 30 = 48 clamps to the 40 cap and with one event (20) plus the 20 non-domestic penalty scores exactly 80.00; a US mill with three OPEN events clamps 20 * 3 = 60 to 40 and scores 40.00 with no geo penalty.'
    test_recipe:
      setup:
      - Two suppliers and no packages or quotes
      - Every disruption event is effective 2026-07-01, before the clock, so the snapshot variant sees all of them
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/suppliers
        payload: {legal_name: Pacific Rim Steel Works, country_of_origin: CN, declared_tariff_rate_pct: '10.00'}
        as: BuyoutManager
        captures: {sup_cn_id: $.data.id}
      - call: POST /procurement/suppliers/${sup_cn_id}/disruption-events
        payload: {event_type: TARIFF_IMPOSED, effective_date: '2026-07-01T00:00:00.000Z', description: Section 232 action on imported mill product, tariff_rate_pct: '30.00'}
        as: BuyoutManager
        captures: {ev_tariff_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Northline Steel Mills, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_us_id: $.data.id}
      - call: POST /procurement/suppliers/${sup_us_id}/disruption-events
        payload: {event_type: PLANT_SHUTDOWN, effective_date: '2026-07-01T00:00:00.000Z', description: Rolling mill down for unplanned reline}
        as: BuyoutManager
        captures: {ev_plant_id: $.data.id}
      - call: POST /procurement/suppliers/${sup_us_id}/disruption-events
        payload: {event_type: PORT_CONGESTION, effective_date: '2026-07-01T00:00:00.000Z', description: Inbound plate stuck at the terminal}
        as: BuyoutManager
        captures: {ev_port_id: $.data.id}
      - call: POST /procurement/suppliers/${sup_us_id}/disruption-events
        payload: {event_type: FORCE_MAJEURE, effective_date: '2026-07-01T00:00:00.000Z', description: Regional flooding at the service center}
        as: BuyoutManager
        captures: {ev_fm_id: $.data.id}
      trigger:
      - call: GET /procurement/suppliers/${sup_cn_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/suppliers/${sup_us_id}
        payload: {}
        as: BuyoutManager
      assert:
      - both reads return HTTP 200
      - Supplier.${sup_cn_id}.declared_tariff_rate_pct == 10.00 while the score reflects the 30.00 event rate (the greatest wins; the declared field is never overwritten)
      - Supplier.${sup_cn_id}.exposure_score_snapshot == 80.00 and exposure_band_snapshot == HIGH
      - Supplier.${sup_cn_id}.open_disruption_count == 1
      - Supplier.${sup_cn_id}.is_domestic == false
      - Supplier.${sup_us_id}.declared_tariff_rate_pct == 0.00 and is_domestic == true
      - Supplier.${sup_us_id}.exposure_score_snapshot == 40.00 and exposure_band_snapshot == ELEVATED
      - Supplier.${sup_us_id}.open_disruption_count == 3
      - Supplier.${sup_us_id}.status == ACTIVE
  - name: weighted_scoring_elevated_band_lands_exactly_on_thirty_from_the_tariff_weight
    claim_type: weighted_scoring
    grounds:
    - calculations.supplier_exposure_score.constants.TARIFF_WEIGHT
    - calculations.supplier_exposure_score.constants.EXPOSURE_ELEVATED_THRESHOLD
    - entities.Supplier.fields.exposure_band_snapshot
    distinguishing_aspect: 'The ELEVATED cut-point is an inclusive lower bound reached through the 1.6 weight and one final rounding: a US mill declaring 18.75 pct scores exactly 30.00 / ELEVATED while 18.70 pct scores 29.92 / LOW, and neither is blocked from a buyout because only HIGH gates commitments.'
    test_recipe:
      setup:
      - Two domestic suppliers with no disruption events, so tariff_component is the only non-zero term
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/suppliers
        payload: {legal_name: Gulfline Plate & Angle, country_of_origin: US, declared_tariff_rate_pct: '18.75'}
        as: BuyoutManager
        captures: {sup_at_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Cedar Valley Metals, country_of_origin: US, declared_tariff_rate_pct: '18.70'}
        as: BuyoutManager
        captures: {sup_below_id: $.data.id}
      trigger:
      - call: GET /procurement/suppliers/${sup_at_id}
        payload: {}
        as: BuyoutManager
      - call: GET /procurement/suppliers/${sup_below_id}
        payload: {}
        as: BuyoutManager
      assert:
      - both reads return HTTP 200
      - Supplier.${sup_at_id}.exposure_score_snapshot == 30.00 and exposure_band_snapshot == ELEVATED
      - Supplier.${sup_below_id}.exposure_score_snapshot == 29.92 and exposure_band_snapshot == LOW
      - Supplier.${sup_below_id}.exposure_score_snapshot != 30.00
      - both suppliers report open_disruption_count == 0, is_domestic == true and their declared_tariff_rate_pct unchanged at 18.75 and 18.70
  - name: input_set_filtering_pending_commitments_leave_committed_cost_alone_but_still_buy_out_the_package
    claim_type: input_set_filtering
    grounds:
    - calculations.buyout_variance
    - state_machines.MaterialPackage.SOURCING_to_BOUGHT_OUT
    - entities.Project.fields.bought_out_variance
    distinguishing_aspect: 'The two sums filter on different rows and diverge asymmetrically: a PENDING commitment is excluded from committed_total_cost, yet its package is already BOUGHT_OUT so its 300000.00 estimate IS inside bought_out_variance''s estimate side — 750000.00 full-program versus 350000.00 bought-out-only over the same three packages.'
    test_recipe:
      setup:
      - 'One project with three packages: steel (estimate 1200000.00) bought out and COMMITTED at 1150000.00, an electrical feeder package (estimate 300000.00) with a PENDING 290000.00 commitment and no clause, and a mechanical package (estimate 400000.00) with no quote at all'
      - Neither commitment has been released for fabrication, so all escalation is 0.00
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '310.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
