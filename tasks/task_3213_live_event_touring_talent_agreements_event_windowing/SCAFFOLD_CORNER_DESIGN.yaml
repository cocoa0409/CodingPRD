            - call: "POST /touring/medical-cases/${mc_id}/evaluations"
              payload: { evaluator_id: "medic-m1", findings: "ok", recommends_clearance: true }
              as: Medic
            - call: "POST /touring/medical-cases/${mc_id}/evaluations"
