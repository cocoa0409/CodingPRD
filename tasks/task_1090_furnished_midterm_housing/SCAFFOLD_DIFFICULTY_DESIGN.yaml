              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docR" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U18", address: "18 St", monthly_rate_cents: 300000, cleaning_included: true, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/transitions"
              payload: { to_status: "COMPLETED" }
              as: PlatformAdmin
            - call: "GET /payouts?booking_id=${booking_id}"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "PAID" }
              as: PlatformAdmin
              as_user_id: "admin-2"
            - call: "GET /hosts/${host_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after_pay: $.data.payout_balance_cents }
            - call: "POST /payouts/${payout_id}/transitions"
              payload: { to_status: "REVERSED" }
              as: PlatformAdmin
              as_user_id: "admin-2"
            - call: "GET /hosts/${host_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after_reverse: $.data.payout_balance_cents }
          assert:
            - "captured bal_after_pay == 264000 (sum of PAID net)"
            - "captured bal_after_reverse == 0 (pay then reverse restores the pre-pay ledger value)"
