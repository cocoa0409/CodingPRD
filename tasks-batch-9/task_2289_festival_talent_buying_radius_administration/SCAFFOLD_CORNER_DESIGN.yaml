          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.AdvancePacket.fields.submitted_by_user_id
        distinguishing_aspect: |
          The rule is keyed to X-User-Id, not to the role, and it guards both
          adjudication edges: pm-001 who submitted can neither return nor approve,
          while pm-002 holding the identical role can. It is also re-evaluated per
          submission - after pm-002 returns the packet and pm-002 re-submits it,
          submitted_by_user_id is overwritten, so now pm-002 is locked out and pm-001
          is free to approve.
