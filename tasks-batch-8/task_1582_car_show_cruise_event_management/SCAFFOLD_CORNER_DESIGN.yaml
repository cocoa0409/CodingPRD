      - name: lowest_free_spot_selector
        claim_type: selector_policy
        grounds: ["state_machines.Registration.CONFIRMED_to_CHECKED_IN"]
        excluded_because:
          difficulty_instance: zone_occupancy_conserved_checkin_withdraw
          rationale: "Spot sequence 1, 2, then reuse of freed spot 1 is asserted there."

      - name: permit_suspension_cascades_cancel_future_slots
        claim_type: rate_threshold_trigger
        grounds: ["calculations.noise_compliance_eval", "state_machines.Event", "entities.Event.fields.sound_permit_status"]
        distinguishing_aspect: "Cumulative threshold at exactly 3: two exceedances leave the permit ACTIVE; the third flips it to SUSPENDED and cascades cancellation to all future-scheduled slots; new slot creation is then rejected."
        test_recipe:
          setup: ["Published event; one SCHEDULED slot tomorrow evening; clock at default (all slot times in the future)"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Permit", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "Evening Band", slot_start: "2026-08-15T19:00:00Z", slot_end: "2026-08-15T20:00:00Z", expected_db: 90.0 }, as: Organizer, captures: { sl: $.data.id } }
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 96.0, source: "STAGE", recorded_at: "2026-08-15T15:00:00Z" }, as: RegistrationDesk, captures: { e1: $.data.is_exceedance } }
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 97.0, source: "STAGE", recorded_at: "2026-08-15T16:00:00Z" }, as: RegistrationDesk }
            - { call: "GET /events/${ev}/summary", payload: {}, as: Organizer, captures: { cnt2: $.data.noise_exceedance_count, perm2: $.data.sound_permit_status } }
          trigger:
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 96.5, source: "PA_SYSTEM", recorded_at: "2026-08-15T17:00:00Z" }, as: RegistrationDesk }
            - { call: "GET /events/${ev}/summary", payload: {}, as: Organizer, captures: { cnt3: $.data.noise_exceedance_count, perm3: $.data.sound_permit_status } }
            - { call: "GET /events/${ev}/sound-slots", payload: {}, as: Organizer, captures: { slot_st: "$.data[0].status" } }
            - { call: "POST /events/${ev}/sound-slots", payload: { performer_name: "Late DJ", slot_start: "2026-08-15T21:00:00Z", slot_end: "2026-08-15T21:30:00Z", expected_db: 80.0 }, as: Organizer, captures: { err: $.data.error_id } }
          assert:
            - "after 2 exceedances: count == 2 and permit still ACTIVE (threshold is exactly 3)"
            - "after 3rd: count == 3, permit SUSPENDED, and the future slot ${sl} is CANCELLED (cascade)"
            - "new slot creation fails with ERR_SOUND_PERMIT_SUSPENDED (422)"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate_consistency
        grounds: ["complexity_profile"]
        distinguishing_aspect: "Consistency model is immediate: the payment response, the registration read, and the event summary in the same sequence all reflect the mutation with no lag."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; registration PENDING_PAYMENT (fee 3000)"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Immediate", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "IM", email: "im@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk, captures: { pay_st: $.data.status } }
            - { call: "GET /registrations/${r1}", payload: {}, as: Organizer, captures: { reg_st: $.data.status, paid: $.data.paid_cents } }
            - { call: "GET /events/${ev}/summary", payload: {}, as: Organizer, captures: { tr: $.data.treasury_cents } }
          assert:
            - "payment response: status == SUCCEEDED"
            - "immediate GET registration: status == CONFIRMED, paid_cents == 3000"
            - "immediate GET summary: treasury_cents == 3000 (no reconciliation lag)"
