              as: Planner
              captures: { res_1: $.data.id, st_1: $.data.status }
          trigger:
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_2}", bench_id: "${bench_id}", window_start_at: "2026-09-05T12:00:00Z", window_end_at: "2026-09-05T16:00:00Z" }
