scenario: |
  2771. Government Surplus Property Disposal (state surplus property agency): agency turn-in of
  surplus with condition assessment, valuation and transfer documentation, screening priority order
  across state agencies, local governments, eligible nonprofits and public sale, federal surplus
  property donation eligibility and compliance with use periods, auction listing with reserve
  setting, bidder registration and payment terms, vehicle title transfer, odometer disclosure and
  lien release for fleet disposals, data-bearing equipment sanitization certification before
  release, restricted item handling and demilitarization requirements, proceeds distribution back
  to agencies net of fees
domain_name: government-surplus-property-disposal
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies. Only two nested URL shapes
  # exist and both are read/append sub-resources of SurplusAsset or AuctionLot or Bidder
  # (condition-assessments, clearance-certificates, bids); every other resource is addressed at
  # the top level by its own id, and no resource path is deeper than /<collection>/{id}/<segment>.

  state_machine_shape: parallel
  # SurplusAsset carries two independent state axes on the same row: `disposition_status`
  # (custody/marketing lifecycle) and `clearance_status` (data-sanitization / demilitarization
  # release gate). They advance from different triggers and neither one's transition table
  # constrains the other's, but `POST /assets/{id}/release` requires a specific pair.
  # ScreeningCycle is additionally cyclic (OPEN -> OPEN, one hop per tier advance, and
  # AWARDED -> OPEN on transfer-order void) and ScreeningRequest is cyclic
  # (SUBMITTED -> INFO_REQUESTED -> SUBMITTED).

  relationship_patterns:
    - one_to_many
    - self_referential      # SurplusAsset.component_of_asset_id -> SurplusAsset.id
    - cross_aggregate       # ProceedsDistribution links AuctionLot to the turning-in Agency ledger

  role_model: segregation_of_duties
  # Two named SoD barriers, both keyed on X-User-ID across opaque operator roles:
  #   (1) the ClearanceTechnician certifying an asset MUST NOT be a SurplusAssessor who assessed it;
  #   (2) the FinanceController posting a ProceedsDistribution MUST NOT be the DisposalOfficer
  #       recorded in AuctionLot.closed_by_user_id.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the agency, local government or nonprofit
        constraints: 1..160 chars
      - name: agency_code
        type: string
        source: input
        description: short operator-facing code
        constraints: "1..24 chars; unique across all Agency rows (case-sensitive)"
      - name: agency_type
        type: enum
        source: input
        description: screening tier this organization belongs to
        constraints: "one of {STATE_AGENCY, LOCAL_GOVERNMENT, ELIGIBLE_NONPROFIT}"
      - name: status
        type: enum
        source: system
        description: participation status; SUSPENDED blocks new screening requests and transfer orders
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; set by POST /agencies/{id}/status"
      - name: federal_donee_status
        type: enum
        source: input
        description: federal surplus donation eligibility of this organization
        default: NONE
        constraints: "one of {NONE, CERTIFIED, SUSPENDED}; set at create or by POST /agencies/{id}/status"
      - name: donee_certification_expires_on
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) the federal donee certification lapses; null when federal_donee_status == NONE"
        default: null
      - name: proceeds_account_balance_cents
        type: integer
        source: computed
        description: "running credit owed back to this agency; recomputed by calculations.agency_proceeds_ledger_balance"
        default: 0
        constraints: ">= 0"
      - name: posted_distribution_count
        type: integer
        source: computed
        description: "count of ProceedsDistribution rows with beneficiary_agency_id == this id and status == POSTED"
        default: 0

  - name: TurnIn
    parent: null
    common_fields: true
    fields:
      - name: turning_in_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the state agency relinquishing custody of the property in this turn-in"
      - name: custody_location
        type: string
        source: input
        description: physical yard/warehouse where the property currently sits
        constraints: 1..120 chars
      - name: remarks
        type: string
        source: input
        description: free-text notes from the turning-in agency
        default: null
      - name: status
        type: enum
        source: system
        description: turn-in lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED, CLOSED}"
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded when the reviewing DisposalOfficer rejects the turn-in
        default: null
      - name: asset_count
        type: integer
        source: computed
        description: "count of SurplusAsset rows whose turn_in_id == this id (all disposition_status values)"
        default: 0
      - name: appraised_total_cents
        type: integer
        source: computed
        description: "sum of SurplusAsset.fair_market_value_cents over child assets whose fair_market_value_cents is non-null, in created_at ASC order; 0 when none are valued"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant the turn-in moved DRAFT -> SUBMITTED
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: logical-clock instant the turn-in moved SUBMITTED -> ACCEPTED or SUBMITTED -> REJECTED
        default: null

  - name: SurplusAsset
    parent: null
    common_fields: true
    fields:
      - name: turn_in_id
        type: string
        source: input
        description: "FK -> TurnIn.id; the turn-in this item arrived on; the turn-in must be status == DRAFT at create time"
      - name: component_of_asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; nullable; the asset this item is physically installed in (e.g. a data-bearing telematics unit inside a fleet vehicle); must reference an asset on the same turn_in_id"
        default: null
      - name: category
        type: enum
        source: input
        description: property class, drives federal use-period length and title/odometer requirements
        constraints: "one of {VEHICLE, IT_EQUIPMENT, FURNITURE, HEAVY_EQUIPMENT, RESTRICTED_MILITARY}"
      - name: description
        type: string
        source: input
        description: item description as recorded on the turn-in
        constraints: 1..200 chars
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: original acquisition cost paid by the turning-in agency
        constraints: "> 0"
      - name: acquisition_date
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) the turning-in agency acquired the item; must be <= the logical clock date at create time"
      - name: is_data_bearing
        type: boolean
        source: input
        description: item contains non-volatile storage and requires DATA_SANITIZATION before release
        default: false
      - name: is_restricted
        type: boolean
        source: input
        description: item is a restricted/controlled article and requires DEMILITARIZATION before release
        default: false
      - name: demil_code
        type: enum
        source: input
        description: "required demilitarization code; null when is_restricted == false"
        default: null
        constraints: "one of {A, B, C, D, Q}; MUST be non-null when is_restricted == true"
      - name: federal_source
        type: boolean
        source: input
        description: item was itself acquired through federal surplus donation and carries a use period
        default: false
      - name: federal_use_period_start_on
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) the federal use period began; MUST be non-null when federal_source == true"
        default: null
      - name: federal_use_period_end_on
        type: datetime
        source: computed
        description: "calendar date (YYYY-MM-DD) produced by calculations.federal_use_period_end; null when federal_source == false"
        default: null
      - name: vin
        type: string
        source: input
        description: vehicle identification number
        default: null
        constraints: "MUST be non-null when category == VEHICLE"
      - name: odometer_reading
        type: integer
        source: input
        description: odometer reading recorded at turn-in
        default: null
        constraints: ">= 0; MUST be non-null when category == VEHICLE"
      - name: title_number
        type: string
        source: input
        description: state title/certificate number held by the turning-in agency
        default: null
        constraints: "MUST be non-null when category == VEHICLE"
      - name: lien_holder_name
        type: string
        source: input
        description: recorded lienholder; a non-null value forces a lien release reference at release time
        default: null
      - name: odometer_disclosure_reading
        type: integer
        source: system
        description: odometer reading disclosed on the release/title-transfer document
        default: null
      - name: lien_release_reference
        type: string
        source: system
        description: lien release document reference captured at release
        default: null
      - name: title_recipient_name
        type: string
        source: system
        description: name the new title is issued to, captured at release
        default: null
      - name: condition_code
        type: enum
        source: computed
        description: "condition_code copied from the governing ConditionAssessment selected by calculations.asset_fair_market_value; null until the first assessment exists"
        default: null
        constraints: "one of {C1, C2, C3, C4, C5, C6, C7}"
      - name: fair_market_value_cents
        type: integer
        source: computed
        description: "output of calculations.asset_fair_market_value; null until the first ConditionAssessment exists"
        default: null
        constraints: ">= 0"
      - name: disposition_status
        type: enum
        source: system
        description: custody and marketing lifecycle axis
        default: INTAKE
        constraints: "one of {INTAKE, ASSESSED, SCREENING, AWARDED_TRANSFER, AUCTION_ELIGIBLE, LISTED, SOLD, RELEASED, RETAINED, DESTROYED}"
      - name: clearance_status
        type: enum
        source: system
        description: "release-gate axis, independent of disposition_status; set to REQUIRED_PENDING at create when is_data_bearing or is_restricted, otherwise NOT_REQUIRED"
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, REQUIRED_PENDING, CLEARED, BLOCKED}"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the asset moved to RELEASED
        default: null

  - name: ConditionAssessment
    parent: null
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; the asset inspected"
      - name: assessor_user_id
        type: string
        source: system
        description: "X-User-ID of the SurplusAssessor who recorded this assessment; feeds the clearance-technician segregation-of-duties check"
      - name: condition_code
        type: enum
        source: input
        description: federal condition code assigned by the assessor
        constraints: "one of {C1, C2, C3, C4, C5, C6, C7}"
      - name: functional
        type: boolean
        source: input
        description: item powers on and performs its intended function
      - name: repair_cost_estimate_cents
        type: integer
        source: input
        description: estimated cost to return the item to serviceable condition
        constraints: ">= 0"
      - name: assessed_on
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) of inspection; primary sort key when selecting the governing assessment"
      - name: notes
        type: string
        source: input
        description: assessor narrative
        default: null
      - name: superseded
        type: boolean
        source: system
        description: "true once a later assessment on the same asset outranks this one under calculations.asset_fair_market_value's selector"
        default: false

  - name: ScreeningCycle
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; the asset being screened"
      - name: opens_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the first tier window opens; MUST be >= the logical clock at create time"
      - name: tier_window_days
        type: integer
        source: input
        description: length in whole days of every tier window in this cycle
        constraints: "1..60"
      - name: current_tier
        type: enum
        source: system
        description: "screening priority tier currently accepting requests; advances in the fixed order STATE_AGENCY -> LOCAL_GOVERNMENT -> ELIGIBLE_NONPROFIT -> PUBLIC_SALE"
        default: STATE_AGENCY
        constraints: "one of {STATE_AGENCY, LOCAL_GOVERNMENT, ELIGIBLE_NONPROFIT, PUBLIC_SALE}"
      - name: tier_opened_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant current_tier opened; equals opens_at for STATE_AGENCY, and the logical clock at each POST /screening-cycles/{id}/advance-tier"
      - name: tier_deadline_at
        type: datetime
        source: computed
        description: "output of calculations.screening_tier_deadline: tier_opened_at + tier_window_days whole days"
      - name: status
        type: enum
        source: system
        description: cycle lifecycle state
        default: OPEN
        constraints: "one of {OPEN, AWARDED, EXHAUSTED, CANCELLED}"
      - name: tier_advance_count
        type: integer
        source: system
        description: number of completed advance-tier hops on this cycle
        default: 0
      - name: awarded_by_user_id
        type: string
        source: system
        description: X-User-ID of the DisposalOfficer who awarded the cycle
        default: null
      - name: awarded_at
        type: datetime
        source: system
        description: logical-clock instant the cycle moved OPEN -> AWARDED
        default: null
      - name: open_request_count
        type: integer
        source: computed
        description: "count of ScreeningRequest rows with screening_cycle_id == this id and status IN {SUBMITTED, INFO_REQUESTED}"
        default: 0

  - name: ScreeningRequest
    parent: null
    common_fields: true
    fields:
      - name: screening_cycle_id
        type: string
        source: input
        description: "FK -> ScreeningCycle.id; the cycle this request competes in"
      - name: requesting_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the organization asking for the property"
      - name: intended_use
        type: string
        source: input
        description: how the requesting organization will use the property
        constraints: 1..200 chars
      - name: justification
        type: string
        source: input
        description: narrative supporting the request; replaced on resubmit
        constraints: 1..500 chars
      - name: needed_by_date
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) the organization needs the property by"
        default: null
      - name: tier_at_submission
        type: enum
        source: system
        description: "copy of ScreeningCycle.current_tier at the instant of creation; frozen for audit and never rewritten on resubmit"
        constraints: "one of {STATE_AGENCY, LOCAL_GOVERNMENT, ELIGIBLE_NONPROFIT}"
      - name: status
        type: enum
        source: system
        description: request lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED}"
      - name: information_request_note
        type: string
        source: system
        description: note recorded by the DisposalOfficer when moving the request to INFO_REQUESTED
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: number of completed INFO_REQUESTED -> SUBMITTED hops
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: "reason recorded on any transition into DENIED (LOST_AWARD, TRANSFER_VOIDED, CYCLE_CANCELLED)"
        default: null

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; copied from the awarded ScreeningRequest's cycle at create time"
      - name: recipient_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; copied from the awarded ScreeningRequest at create time"
      - name: screening_request_id
        type: string
        source: input
        description: "FK -> ScreeningRequest.id; the APPROVED request this order documents"
      - name: base_transfer_cents
        type: integer
        source: computed
        description: "output of calculations.transfer_order_price step 2; the tier-discounted value before any federal-donation waiver"
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "output of calculations.transfer_order_price step 3; the fee tier is keyed on base_transfer_cents, never on transfer_price_cents"
      - name: transfer_price_cents
        type: integer
        source: computed
        description: "output of calculations.transfer_order_price step 4; the amount the recipient owes"
      - name: status
        type: enum
        source: system
        description: transfer documentation lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, ACKNOWLEDGED, COMPLETED, VOIDED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the DisposalOfficer who issued the order
      - name: acknowledged_at
        type: datetime
        source: system
        description: logical-clock instant the recipient acknowledged the order
        default: null
      - name: use_period_end_on
        type: datetime
        source: computed
        description: "calendar date (YYYY-MM-DD) the recipient's own use period ends; output of calculations.federal_use_period_end applied with the acknowledgement date as the start; null when the asset's federal_source == false"
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason recorded when the order is voided
        default: null

  - name: SaleVenue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue display name
        constraints: 1..120 chars
      - name: venue_code
        type: string
        source: input
        description: short venue code
        constraints: "1..24 chars; unique across all SaleVenue rows"
      - name: concurrent_lot_capacity
        type: integer
        source: input
        description: maximum number of lots whose sale windows may overlap at this venue at any instant
        constraints: ">= 1"
      - name: buyer_premium_pct
        type: number
        source: input
        description: buyer premium rate applied to the hammer price
        constraints: "0 <= value <= 0.30"
      - name: sales_tax_pct
        type: number
        source: input
        description: sales tax rate applied to hammer price plus buyer premium
        constraints: "0 <= value <= 0.15"
      - name: status
        type: enum
        source: system
        description: venue availability
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"
      - name: active_lot_count
        type: integer
        source: computed
        description: "count of AuctionLot rows with venue_id == this id and status IN {DRAFT, OPEN}"
        default: 0

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; the single asset offered in this lot"
      - name: venue_id
        type: string
        source: input
        description: "FK -> SaleVenue.id; the venue hosting the lot"
      - name: lot_number
        type: string
        source: system
        description: "`<venue_code>-<n>` where n is this lot's 1-based position among all lots at the venue ordered by created_at ASC, zero-padded to 4 digits"
      - name: opens_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the sale window (inclusive); MUST be >= the logical clock at create time"
      - name: closes_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the sale window (exclusive); MUST be > opens_at"
      - name: reserve_price_cents
        type: integer
        source: computed
        description: "output of calculations.asset_fair_market_value variant auction_reserve, unless the DisposalOfficer supplies reserve_price_cents in the request body, in which case the supplied value is stored verbatim"
        constraints: ">= 2500"
      - name: reserve_source
        type: enum
        source: system
        description: whether the stored reserve came from the formula or an officer override
        default: COMPUTED
        constraints: "one of {COMPUTED, OFFICER_OVERRIDE}"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "output of calculations.bidder_deposit_requirement, evaluated once at lot creation against reserve_price_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: lot lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, CLOSED_MET, CLOSED_NO_SALE, SETTLED, CANCELLED}"
      - name: high_bid_cents
        type: integer
        source: computed
        description: "max(Bid.amount_cents) over Bid rows with auction_lot_id == this id and status IN {ACTIVE, WINNING}; 0 when that set is empty"
        default: 0
      - name: bid_count
        type: integer
        source: computed
        description: "count of Bid rows with auction_lot_id == this id and status IN {ACTIVE, WINNING, OUTBID}"
        default: 0
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DisposalOfficer who closed the lot; feeds the proceeds-posting segregation-of-duties check"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the lot was closed
        default: null

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered bidder name
        constraints: 1..160 chars
      - name: email
        type: string
        source: input
        description: contact email
        constraints: "unique across all Bidder rows"
      - name: bidder_type
        type: enum
        source: input
        description: registration class
        constraints: "one of {INDIVIDUAL, BUSINESS}"
      - name: status
        type: enum
        source: system
        description: registration status
        default: PENDING
        constraints: "one of {PENDING, REGISTERED, SUSPENDED, DEBARRED}"
      - name: end_use_certificate_expires_on
        type: datetime
        source: system
        description: "calendar date (YYYY-MM-DD) the bidder's end-use certificate lapses; null when no certificate is on file"
        default: null
      - name: deposit_paid_cents
        type: integer
        source: system
        description: "cumulative cash deposited by this bidder; monotonically non-decreasing; the conserved total of the deposit-custody invariant"
        default: 0
      - name: deposit_held_cents
        type: integer
        source: computed
        description: deposit still available to satisfy a lot's required deposit
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: deposit currently applied against non-void SaleInvoice rows
        default: 0
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        description: deposit forfeited on defaulted SaleInvoice rows
        default: 0
      - name: winning_lot_count
        type: integer
        source: computed
        description: "count of Bid rows with bidder_id == this id and status == WINNING"
        default: 0

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; the lot bid on"
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the registered bidder placing the bid"
      - name: amount_cents
        type: integer
        source: input
        description: bid amount
        constraints: "> 0"
      - name: placed_at
        type: datetime
        source: system
        description: logical-clock instant the bid was accepted
      - name: status
        type: enum
        source: system
        description: bid standing
        default: ACTIVE
        constraints: "one of {ACTIVE, OUTBID, WINNING, RETRACTED}"

  - name: SaleInvoice
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; the lot this invoice settles"
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the winning bidder"
      - name: hammer_price_cents
        type: integer
        source: computed
        description: "amount_cents of the Bid that became WINNING when the lot closed"
      - name: buyer_premium_cents
        type: integer
        source: computed
        description: "output of calculations.auction_invoice_total line 1"
      - name: sales_tax_cents
        type: integer
        source: computed
        description: "output of calculations.auction_invoice_total line 2"
      - name: total_due_cents
        type: integer
        source: computed
        description: "output of calculations.auction_invoice_total line 3"
      - name: amount_paid_cents
        type: integer
        source: system
        description: cash payments plus deposit applied against this invoice
        default: 0
      - name: deposit_applied_cents
        type: integer
        source: system
        description: portion of amount_paid_cents that came from the bidder's held deposit
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_due_cents - amount_paid_cents"
      - name: due_at
        type: datetime
        source: computed
        description: "AuctionLot.closed_at + PAYMENT_TERM_DAYS whole days"
      - name: status
        type: enum
        source: system
        description: invoice lifecycle state
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_PAID, PAID, DEFAULTED, VOIDED}"
      - name: default_reason
        type: string
        source: system
        description: reason recorded when the invoice is declared in default
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason recorded when the invoice is voided
        default: null

  - name: ClearanceCertificate
    parent: null
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> SurplusAsset.id; the asset certified"
      - name: cert_type
        type: enum
        source: input
        description: which release gate this certificate addresses
        constraints: "one of {DATA_SANITIZATION, DEMILITARIZATION}"
      - name: method
        type: enum
        source: input
        description: sanitization or demilitarization method performed
        constraints: "one of {NIST_CLEAR, NIST_PURGE, DEGAUSS, MUTILATE, DESTROY}; DATA_SANITIZATION admits only {NIST_CLEAR, NIST_PURGE, DEGAUSS}; DEMILITARIZATION admits only {MUTILATE, DESTROY}"
      - name: technician_user_id
        type: string
        source: system
        description: "X-User-ID of the ClearanceTechnician; must differ from every assessor_user_id recorded on the asset"
      - name: serials_verified
        type: boolean
        source: input
        description: "true when the technician matched the physical serial numbers to the record; false records a failed verification and blocks the asset"
      - name: certified_on
        type: datetime
        source: input
        description: "calendar date (YYYY-MM-DD) the work was performed"
      - name: notes
        type: string
        source: input
        description: technician narrative
        default: null

  - name: ProceedsDistribution
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; the lot whose proceeds are being distributed"
      - name: beneficiary_agency_id
        type: string
        source: computed
        description: "FK -> Agency.id; resolved at create time as the turning-in agency of the lot's asset (asset.turn_in_id -> TurnIn.turning_in_agency_id)"
      - name: basis
        type: enum
        source: input
        description: which distributable base the calculation uses
        constraints: "one of {ACCRUAL, CASH}"
      - name: distributable_base_cents
        type: integer
        source: computed
        description: "ACCRUAL -> AuctionLot.high_bid_cents; CASH -> the lot's non-void SaleInvoice.amount_paid_cents"
      - name: service_fee_cents
        type: integer
        source: computed
        description: "output of calculations.proceeds_distribution_net step 2 (per-slice tiered fee)"
      - name: cost_recovery_cents
        type: integer
        source: computed
        description: "output of calculations.proceeds_distribution_net step 3 (clearance cost recovery)"
      - name: net_to_agency_cents
        type: integer
        source: computed
        description: "output of calculations.proceeds_distribution_net step 4; the amount credited to the beneficiary agency on POST"
      - name: status
        type: enum
        source: system
        description: distribution lifecycle state
        default: CALCULATED
        constraints: "one of {CALCULATED, POSTED, SUPERSEDED, REVERSED}"
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceController who posted the distribution
        default: null
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the distribution was posted
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: reason recorded when a posted distribution is reversed
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: TurnIn
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /turn-ins/{id}/submit"
        actor: AgencyOfficer
        preconditions:
          - "turn_in.status == DRAFT"
          - "asset_count >= 1"
          - "X-User-ID == turn_in.turning_in_agency_id"
        side_effects:
          - "submitted_at = logical clock now"
          - "the turn-in's assets become eligible for condition assessment; no asset field changes"
          - "increments TurnIn.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /turn-ins/{id}/review with decision == ACCEPT"
        actor: DisposalOfficer
        preconditions:
          - "turn_in.status == SUBMITTED"
          - "every SurplusAsset with turn_in_id == this id has disposition_status != INTAKE (i.e. at least one ConditionAssessment exists for each) — else ERR_TURN_IN_NOT_ASSESSED"
        side_effects:
          - "reviewed_at = logical clock now"
          - "appraised_total_cents recomputed"
          - "the turn-in's assets become eligible for POST /screening-cycles and POST /auction-lots"
          - "increments TurnIn.version by 1"
        note: "compound/aggregate guard — the parent transition is gated on the state of every child asset"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /turn-ins/{id}/review with decision == REJECT"
        actor: DisposalOfficer
        preconditions:
          - "turn_in.status == SUBMITTED"
          - "rejection_reason present in the request body"
        side_effects:
          - "reviewed_at = logical clock now; rejection_reason stored"
          - "cascade down: every SurplusAsset with turn_in_id == this id and disposition_status IN {INTAKE, ASSESSED} moves disposition_status -> RETAINED (custody returns to the agency), processed in created_at ASC order"
          - "increments TurnIn.version by 1 and each affected asset's version by 1"
      - from: ACCEPTED
        to: CLOSED
        trigger: "system, on any transition that leaves every child asset in a terminal disposition_status"
        actor: system
        preconditions:
          - "turn_in.status == ACCEPTED"
          - "every SurplusAsset with turn_in_id == this id has disposition_status IN {RELEASED, RETAINED, DESTROYED}"
        side_effects:
          - "bubble up: appraised_total_cents frozen at its current value; increments TurnIn.version by 1"

  - entity: SurplusAsset
    state_field: disposition_status
    initial_state: INTAKE
    terminal_states: [RELEASED, RETAINED, DESTROYED]
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /assets/{id}/condition-assessments (first assessment on this asset)"
        actor: SurplusAssessor
        preconditions:
          - "asset.disposition_status == INTAKE"
          - "the asset's TurnIn.status == SUBMITTED"
          - "expected_asset_version == asset.version"
          - "X-User-ID differs from no constraint here (the SoD barrier applies to clearance certificates, not assessments)"
        side_effects:
          - "condition_code and fair_market_value_cents set from calculations.asset_fair_market_value"
          - "the parent TurnIn.appraised_total_cents is recomputed"
          - "increments SurplusAsset.version by 1"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /assets/{id}/condition-assessments (re-assessment)"
        actor: SurplusAssessor
        preconditions:
          - "asset.disposition_status == ASSESSED"
          - "the asset's TurnIn.status IN {SUBMITTED, ACCEPTED}"
          - "expected_asset_version == asset.version"
        side_effects:
          - "the previously governing ConditionAssessment gets superseded = true"
          - "condition_code and fair_market_value_cents recomputed from the new governing assessment"
          - "the parent TurnIn.appraised_total_cents is recomputed"
          - "increments SurplusAsset.version by 1"
        note: "self-transition; this is the CREATE-with-supersede write guarded by concurrency_rules.assessment-create-stale-asset"
      - from: ASSESSED
        to: SCREENING
        trigger: "POST /screening-cycles"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == ASSESSED"
          - "the asset's TurnIn.status == ACCEPTED"
          - "asset.federal_source == false OR logical clock date >= asset.federal_use_period_end_on"
        side_effects:
          - "a ScreeningCycle is created OPEN at current_tier == STATE_AGENCY"
          - "increments SurplusAsset.version by 1"
      - from: SCREENING
        to: AWARDED_TRANSFER
        trigger: "POST /screening-cycles/{id}/award"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == SCREENING"
          - "the asset's ScreeningCycle.status == OPEN"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: AWARDED_TRANSFER
        to: SCREENING
        trigger: "POST /transfer-orders/{id}/void (cascade hop 4)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == AWARDED_TRANSFER"
          - "the cascade re-opened the asset's ScreeningCycle (AWARDED -> OPEN)"
        side_effects:
          - "increments SurplusAsset.version by 1"
        note: "compensating revert; makes the disposition axis non-linear"
      - from: SCREENING
        to: AUCTION_ELIGIBLE
        trigger: "POST /screening-cycles/{id}/advance-tier from current_tier == PUBLIC_SALE (cycle -> EXHAUSTED)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == SCREENING"
          - "the asset's ScreeningCycle moved OPEN -> EXHAUSTED"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: ASSESSED
        to: LISTED
        trigger: "POST /auction-lots (de-minimis path)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == ASSESSED"
          - "the asset's TurnIn.status == ACCEPTED"
          - "asset.fair_market_value_cents < DE_MINIMIS_SCREENING_THRESHOLD_CENTS (25000) — low-value property is statutorily exempt from tier screening"
          - "asset.federal_source == false OR logical clock date >= asset.federal_use_period_end_on"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: AUCTION_ELIGIBLE
        to: LISTED
        trigger: "POST /auction-lots (post-screening path)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == AUCTION_ELIGIBLE"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: LISTED
        to: SOLD
        trigger: "POST /auction-lots/{id}/close with a qualifying winning bid (cascade hop 4)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == LISTED"
          - "a SaleInvoice was created for the lot in cascade hop 3"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: LISTED
        to: AUCTION_ELIGIBLE
        trigger: "POST /auction-lots/{id}/close with no qualifying bid (lot -> CLOSED_NO_SALE)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == LISTED"
          - "the lot's winning-bid candidate set was empty"
        side_effects:
          - "increments SurplusAsset.version by 1"
        note: "re-list revert; LISTED -> AUCTION_ELIGIBLE -> LISTED is a cycle on the disposition axis"
      - from: SOLD
        to: AUCTION_ELIGIBLE
        trigger: "POST /bidders/{id}/status with status == DEBARRED (cascade hop 4)"
        actor: ProgramAdmin
        preconditions:
          - "asset.disposition_status == SOLD"
          - "the cascade moved the asset's lot CLOSED_MET -> CLOSED_NO_SALE"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: SOLD
        to: RELEASED
        trigger: "POST /assets/{id}/release"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == SOLD"
          - "asset.clearance_status IN {NOT_REQUIRED, CLEARED}"
          - "the lot's SaleInvoice.status == PAID"
          - "if category == VEHICLE: odometer_disclosure_reading present and >= asset.odometer_reading, and title_recipient_name present"
          - "if lien_holder_name is non-null: lien_release_reference present"
        side_effects:
          - "released_at, odometer_disclosure_reading, lien_release_reference and title_recipient_name stored"
          - "bubble up: if every asset on the TurnIn is now terminal, the TurnIn moves ACCEPTED -> CLOSED"
          - "increments SurplusAsset.version by 1"
      - from: AWARDED_TRANSFER
        to: RELEASED
        trigger: "POST /assets/{id}/release"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == AWARDED_TRANSFER"
          - "asset.clearance_status IN {NOT_REQUIRED, CLEARED}"
          - "the asset's TransferOrder.status == ACKNOWLEDGED"
          - "if category == VEHICLE: odometer_disclosure_reading present and >= asset.odometer_reading, and title_recipient_name present"
          - "if lien_holder_name is non-null: lien_release_reference present"
        side_effects:
          - "hop 1: released_at, odometer_disclosure_reading, lien_release_reference, title_recipient_name stored"
          - "hop 2 (caused by hop 1): because the asset left custody, the asset's TransferOrder moves ACKNOWLEDGED -> COMPLETED and its use_period_end_on is set from calculations.federal_use_period_end when asset.federal_source == true"
          - "hop 3 (caused by hop 1): bubble up — if every asset on the TurnIn is now terminal, the TurnIn moves ACCEPTED -> CLOSED"
          - "increments SurplusAsset.version by 1"
      - from: INTAKE
        to: RETAINED
        trigger: "POST /turn-ins/{id}/review with decision == REJECT (cascade)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == INTAKE"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: ASSESSED
        to: RETAINED
        trigger: "POST /turn-ins/{id}/review with decision == REJECT (cascade)"
        actor: DisposalOfficer
        preconditions:
          - "asset.disposition_status == ASSESSED"
        side_effects:
          - "increments SurplusAsset.version by 1"
      - from: ASSESSED
        to: DESTROYED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY"
        actor: ClearanceTechnician
        preconditions:
          - "asset.is_restricted == true and asset.demil_code == Q"
          - "asset.disposition_status == ASSESSED"
        side_effects:
          - "hop 1: disposition_status -> DESTROYED, clearance_status -> CLEARED"
          - "hop 2 (caused by hop 1): every ScreeningCycle for this asset with status == OPEN moves to CANCELLED, and each of its ScreeningRequest rows with status IN {SUBMITTED, INFO_REQUESTED} moves to DENIED with denial_reason = CYCLE_CANCELLED"
          - "hop 3 (caused by hop 1): when every SurplusAsset of the parent TurnIn is terminal, TurnIn ACCEPTED -> CLOSED"
          - "increments SurplusAsset.version by 1"
      - from: SCREENING
        to: DESTROYED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY"
        actor: ClearanceTechnician
        preconditions:
          - "asset.is_restricted == true and asset.demil_code == Q"
          - "asset.disposition_status == SCREENING"
        side_effects:
          - "same three hops as the ASSESSED -> DESTROYED transition; hop 2 always fires here because a SCREENING asset owns an OPEN ScreeningCycle"
          - "increments SurplusAsset.version by 1"
      - from: AUCTION_ELIGIBLE
        to: DESTROYED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY"
        actor: ClearanceTechnician
        preconditions:
          - "asset.is_restricted == true and asset.demil_code == Q"
          - "asset.disposition_status == AUCTION_ELIGIBLE"
        side_effects:
          - "hop 1: disposition_status -> DESTROYED, clearance_status -> CLEARED"
          - "hop 2 (caused by hop 1): every AuctionLot for this asset with status == DRAFT moves to CANCELLED, in created_at ASC order"
          - "hop 3 (caused by hop 2): every Bid on those cancelled lots with status IN {ACTIVE, WINNING} moves to RETRACTED, and SaleVenue.active_lot_count is recomputed"
          - "hop 4 (caused by hop 1): when every SurplusAsset of the parent TurnIn is terminal, TurnIn ACCEPTED -> CLOSED"
          - "increments SurplusAsset.version by 1"
      - from: LISTED
        to: DESTROYED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY"
        actor: ClearanceTechnician
        preconditions:
          - "asset.is_restricted == true and asset.demil_code == Q"
          - "asset.disposition_status == LISTED"
        side_effects:
          - "hop 1: disposition_status -> DESTROYED, clearance_status -> CLEARED"
          - "hop 2 (caused by hop 1): every AuctionLot for this asset with status IN {DRAFT, OPEN} moves to CANCELLED, in created_at ASC order"
          - "hop 3 (caused by hop 2): every Bid on those cancelled lots with status IN {ACTIVE, WINNING} moves to RETRACTED, and SaleVenue.active_lot_count is recomputed"
          - "hop 4 (caused by hop 1): when every SurplusAsset of the parent TurnIn is terminal, TurnIn ACCEPTED -> CLOSED"
          - "increments SurplusAsset.version by 1"

  - entity: SurplusAsset
    state_field: clearance_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: NOT_REQUIRED
        trigger: "POST /assets (is_data_bearing == false and is_restricted == false)"
        actor: AgencyOfficer
        preconditions: ["is_data_bearing == false", "is_restricted == false"]
        side_effects: ["clearance_status stays NOT_REQUIRED; the release gate is open from birth"]
        note: "initialization branch of the parallel clearance axis"
      - from: NOT_REQUIRED
        to: REQUIRED_PENDING
        trigger: "POST /assets (is_data_bearing == true or is_restricted == true)"
        actor: AgencyOfficer
        preconditions: ["is_data_bearing == true OR is_restricted == true"]
        side_effects: ["clearance_status set to REQUIRED_PENDING at creation; disposition_status is unaffected and stays INTAKE"]
      - from: REQUIRED_PENDING
        to: CLEARED
        trigger: "POST /assets/{id}/clearance-certificates with serials_verified == true completing every required cert_type"
        actor: ClearanceTechnician
        preconditions:
          - "clearance_status == REQUIRED_PENDING"
          - "technician_user_id differs from every assessor_user_id on this asset's ConditionAssessment rows — else ERR_SEGREGATION_OF_DUTIES"
          - "after this insert, a ClearanceCertificate with serials_verified == true exists for cert_type DATA_SANITIZATION when is_data_bearing == true, and for cert_type DEMILITARIZATION when is_restricted == true"
        side_effects:
          - "increments SurplusAsset.version by 1; disposition_status is untouched"
      - from: REQUIRED_PENDING
        to: REQUIRED_PENDING
        trigger: "POST /assets/{id}/clearance-certificates with serials_verified == true that does not yet complete every required cert_type"
        actor: ClearanceTechnician
        preconditions:
          - "clearance_status == REQUIRED_PENDING"
          - "at least one required cert_type still has no serials_verified == true certificate"
        side_effects: ["increments SurplusAsset.version by 1"]
      - from: REQUIRED_PENDING
        to: BLOCKED
        trigger: "POST /assets/{id}/clearance-certificates with serials_verified == false"
        actor: ClearanceTechnician
        preconditions: ["clearance_status == REQUIRED_PENDING"]
        side_effects:
          - "the failed certificate is persisted for audit; clearance_status -> BLOCKED closes the release gate regardless of disposition_status"
          - "increments SurplusAsset.version by 1"
      - from: BLOCKED
        to: CLEARED
        trigger: "POST /assets/{id}/clearance-certificates with serials_verified == true completing every required cert_type"
        actor: ClearanceTechnician
        preconditions:
          - "clearance_status == BLOCKED"
          - "after this insert, a ClearanceCertificate with serials_verified == true exists for every required cert_type"
        side_effects: ["increments SurplusAsset.version by 1"]
        note: "BLOCKED -> CLEARED closes the cycle on the clearance axis; the disposition axis has advanced independently in the meantime"
      - from: CLEARED
        to: BLOCKED
        trigger: "POST /assets/{id}/clearance-certificates with serials_verified == false"
        actor: ClearanceTechnician
        preconditions: ["clearance_status == CLEARED", "asset.disposition_status != RELEASED"]
        side_effects: ["clearance_status -> BLOCKED; increments SurplusAsset.version by 1"]

  - entity: ScreeningCycle
    state_field: status
    initial_state: OPEN
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /screening-cycles/{id}/advance-tier from current_tier IN {STATE_AGENCY, LOCAL_GOVERNMENT, ELIGIBLE_NONPROFIT}"
        actor: DisposalOfficer
        preconditions:
          - "status == OPEN"
          - "open_request_count == 0 (no request in {SUBMITTED, INFO_REQUESTED}) OR logical clock now >= tier_deadline_at — else ERR_TIER_WINDOW_OPEN"
        side_effects:
          - "current_tier advances one step along STATE_AGENCY -> LOCAL_GOVERNMENT -> ELIGIBLE_NONPROFIT -> PUBLIC_SALE"
          - "tier_opened_at = logical clock now; tier_deadline_at recomputed; tier_advance_count += 1"
          - "increments ScreeningCycle.version by 1"
        note: "self-loop; the cycle visits OPEN four times, once per tier"
      - from: OPEN
        to: EXHAUSTED
        trigger: "POST /screening-cycles/{id}/advance-tier from current_tier == PUBLIC_SALE"
        actor: DisposalOfficer
        preconditions:
          - "status == OPEN and current_tier == PUBLIC_SALE"
          - "open_request_count == 0 OR logical clock now >= tier_deadline_at"
        side_effects:
          - "tier_advance_count += 1"
          - "cross-entity: the cycle's asset moves disposition_status SCREENING -> AUCTION_ELIGIBLE"
          - "increments ScreeningCycle.version by 1 and SurplusAsset.version by 1"
      - from: OPEN
        to: AWARDED
        trigger: "POST /screening-cycles/{id}/award"
        actor: DisposalOfficer
        preconditions:
          - "status == OPEN"
          - "the named ScreeningRequest has screening_cycle_id == this id and status == SUBMITTED — else ERR_REQUEST_CYCLE_MISMATCH"
          - "the requesting Agency.status == ACTIVE"
        side_effects:
          - "awarded_by_user_id and awarded_at stamped"
          - "the named request moves SUBMITTED -> APPROVED"
          - "every other ScreeningRequest on this cycle with status IN {SUBMITTED, INFO_REQUESTED} moves to DENIED with denial_reason = LOST_AWARD, in created_at ASC order"
          - "cross-entity: the cycle's asset moves disposition_status SCREENING -> AWARDED_TRANSFER"
          - "increments ScreeningCycle.version by 1"
      - from: AWARDED
        to: OPEN
        trigger: "POST /transfer-orders/{id}/void (cascade hop 3)"
        actor: DisposalOfficer
        preconditions:
          - "status == AWARDED"
          - "the cascade moved this cycle's APPROVED ScreeningRequest to DENIED in hop 2"
        side_effects:
          - "current_tier unchanged; tier_opened_at reset to the logical clock; tier_deadline_at recomputed; awarded_by_user_id and awarded_at cleared"
          - "increments ScreeningCycle.version by 1"
        note: "AWARDED -> OPEN makes the cycle machine cyclic in two different ways (tier self-loop and award revert)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY (cascade hop 3)"
        actor: ClearanceTechnician
        preconditions: ["status == OPEN", "the cycle's asset moved to DESTROYED"]
        side_effects:
          - "every ScreeningRequest on this cycle with status IN {SUBMITTED, INFO_REQUESTED} moves to DENIED with denial_reason = CYCLE_CANCELLED"
          - "increments ScreeningCycle.version by 1"

  - entity: ScreeningRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /screening-requests/{id}/request-info"
        actor: DisposalOfficer
        preconditions:
          - "status == SUBMITTED"
          - "the parent ScreeningCycle.status == OPEN"
        side_effects:
          - "information_request_note stored; the request stops counting as award-eligible but still counts in open_request_count"
          - "increments ScreeningRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /screening-requests/{id}/resubmit"
        actor: AgencyOfficer
        preconditions:
          - "status == INFO_REQUESTED"
          - "X-User-ID == requesting_agency_id"
          - "the parent ScreeningCycle.status == OPEN"
          - "logical clock now <= the parent cycle's tier_deadline_at — else ERR_TIER_WINDOW_EXPIRED"
        side_effects:
          - "justification replaced with the request body value; resubmission_count += 1; information_request_note cleared"
          - "increments ScreeningRequest.version by 1"
        note: "SUBMITTED -> INFO_REQUESTED -> SUBMITTED is a revision cycle; tier_at_submission is never rewritten"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /screening-cycles/{id}/award naming this request"
        actor: DisposalOfficer
        preconditions: ["status == SUBMITTED", "the parent cycle moved OPEN -> AWARDED"]
        side_effects: ["increments ScreeningRequest.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /screening-cycles/{id}/award naming a different request, or cycle cancellation (cascade)"
        actor: DisposalOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects: ["denial_reason set to LOST_AWARD or CYCLE_CANCELLED; increments ScreeningRequest.version by 1"]
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /screening-cycles/{id}/award naming a different request, or cycle cancellation (cascade)"
        actor: DisposalOfficer
        preconditions: ["status == INFO_REQUESTED"]
        side_effects: ["denial_reason set to LOST_AWARD or CYCLE_CANCELLED; increments ScreeningRequest.version by 1"]
      - from: APPROVED
        to: DENIED
        trigger: "POST /transfer-orders/{id}/void (cascade hop 2)"
        actor: DisposalOfficer
        preconditions: ["status == APPROVED", "the referencing TransferOrder moved to VOIDED in hop 1"]
        side_effects:
          - "denial_reason = TRANSFER_VOIDED"
          - "hop 3 follows: the parent ScreeningCycle moves AWARDED -> OPEN"
          - "increments ScreeningRequest.version by 1"

  - entity: TransferOrder
    state_field: status
    initial_state: ISSUED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /transfer-orders/{id}/acknowledge"
        actor: AgencyOfficer
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == recipient_agency_id"
          - "the recipient Agency.status == ACTIVE"
        side_effects:
          - "acknowledged_at = logical clock now"
          - "increments TransferOrder.version by 1"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /assets/{id}/release (cascade hop 2)"
        actor: DisposalOfficer
        preconditions: ["status == ACKNOWLEDGED", "the asset moved AWARDED_TRANSFER -> RELEASED in hop 1"]
        side_effects:
          - "use_period_end_on computed when the asset's federal_source == true"
          - "increments TransferOrder.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /transfer-orders/{id}/void"
        actor: DisposalOfficer
        preconditions: ["status == ISSUED"]
        side_effects:
          - "hop 1: void_reason stored; increments TransferOrder.version by 1"
          - "hop 2 (caused by hop 1): the referenced ScreeningRequest moves APPROVED -> DENIED with denial_reason = TRANSFER_VOIDED"
          - "hop 3 (caused by hop 2): because that request is no longer APPROVED, its ScreeningCycle moves AWARDED -> OPEN with current_tier unchanged and tier_opened_at reset to the logical clock"
          - "hop 4 (caused by hop 3): because the cycle is OPEN again, the cycle's asset moves disposition_status AWARDED_TRANSFER -> SCREENING"
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "POST /transfer-orders/{id}/void"
        actor: DisposalOfficer
        preconditions: ["status == ACKNOWLEDGED"]
        side_effects:
          - "hop 1: void_reason stored; acknowledged_at retained for audit; increments TransferOrder.version by 1"
          - "hop 2 (caused by hop 1): the referenced ScreeningRequest moves APPROVED -> DENIED with denial_reason = TRANSFER_VOIDED"
          - "hop 3 (caused by hop 2): its ScreeningCycle moves AWARDED -> OPEN, tier_opened_at reset to the logical clock, tier_deadline_at recomputed"
          - "hop 4 (caused by hop 3): the cycle's asset moves disposition_status AWARDED_TRANSFER -> SCREENING"

  - entity: SaleVenue
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /venues/{id}/status with status == CLOSED"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "existing DRAFT and OPEN lots keep their status, but POST /auction-lots/{id}/open on this venue is refused with ERR_VENUE_CLOSED"
          - "increments SaleVenue.version by 1"

  - entity: Agency
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agencies/{id}/status with status == SUSPENDED"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "existing ScreeningRequest and TransferOrder rows are untouched, but POST /screening-requests and POST /transfer-orders naming this agency are refused with ERR_INVALID_STATE"
          - "increments Agency.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agencies/{id}/status with status == ACTIVE"
        actor: ProgramAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments Agency.version by 1"]

  - entity: AuctionLot
    state_field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /auction-lots/{id}/open"
        actor: DisposalOfficer
        preconditions:
          - "status == DRAFT"
          - "the lot's SaleVenue.status == ACTIVE — else ERR_VENUE_CLOSED"
          - "opens_at <= logical clock now < closes_at"
        side_effects:
          - "the lot starts accepting bids; increments AuctionLot.version by 1"
      - from: OPEN
        to: CLOSED_MET
        trigger: "POST /auction-lots/{id}/close"
        actor: DisposalOfficer
        preconditions:
          - "status == OPEN"
          - "logical clock now >= closes_at"
          - "the winning-bid candidate set (Bid rows with status == ACTIVE and amount_cents >= reserve_price_cents) is non-empty"
        side_effects:
          - "hop 1: closed_by_user_id = X-User-ID; closed_at = logical clock now; increments AuctionLot.version by 1"
          - "hop 2 (caused by hop 1): the winning-bid selector runs — the selected Bid moves ACTIVE -> WINNING, every other ACTIVE bid on the lot moves ACTIVE -> OUTBID in created_at ASC order"
          - "hop 3 (caused by hop 2): because a Bid became WINNING, a SaleInvoice is created with status ISSUED, hammer_price_cents = that bid's amount_cents, buyer_premium_cents / sales_tax_cents / total_due_cents from calculations.auction_invoice_total, due_at = closed_at + PAYMENT_TERM_DAYS, and the winning Bidder.winning_lot_count += 1"
          - "hop 4 (caused by hop 3): because an invoice now exists for the lot, the lot's asset moves disposition_status LISTED -> SOLD"
          - "high_bid_cents and bid_count re-derived"
      - from: OPEN
        to: CLOSED_NO_SALE
        trigger: "POST /auction-lots/{id}/close"
        actor: DisposalOfficer
        preconditions:
          - "status == OPEN"
          - "logical clock now >= closes_at"
          - "the winning-bid candidate set is empty (no bid, or every bid below reserve_price_cents)"
        side_effects:
          - "closed_by_user_id and closed_at stamped; no SaleInvoice is created"
          - "cross-entity: the lot's asset moves disposition_status LISTED -> AUCTION_ELIGIBLE so it can be re-listed after the cooldown"
          - "increments AuctionLot.version by 1"
      - from: CLOSED_MET
        to: SETTLED
        trigger: "POST /sale-invoices/{id}/payments that brings amount_paid_cents to total_due_cents"
        actor: Bidder
        preconditions: ["status == CLOSED_MET", "the lot's SaleInvoice moved to PAID"]
        side_effects: ["increments AuctionLot.version by 1"]
      - from: CLOSED_MET
        to: CLOSED_NO_SALE
        trigger: "POST /bidders/{id}/status with status == DEBARRED (cascade hop 3)"
        actor: ProgramAdmin
        preconditions: ["status == CLOSED_MET", "the lot's WINNING bid moved to RETRACTED in hop 2"]
        side_effects:
          - "high_bid_cents and bid_count re-derived over the remaining {ACTIVE, WINNING} bids"
          - "the lot's SaleInvoice with status IN {ISSUED, PARTIALLY_PAID} moves to VOIDED with void_reason = WINNER_DEBARRED"
          - "increments AuctionLot.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY (cascade hop 2)"
        actor: ClearanceTechnician
        preconditions: ["status == DRAFT", "the lot's asset moved to DESTROYED"]
        side_effects: ["increments AuctionLot.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /assets/{id}/clearance-certificates with cert_type == DEMILITARIZATION and method == DESTROY (cascade hop 2)"
        actor: ClearanceTechnician
        preconditions: ["status == OPEN", "the lot's asset moved to DESTROYED"]
        side_effects:
          - "every Bid on the lot with status == ACTIVE moves to RETRACTED, in created_at ASC order"
          - "increments AuctionLot.version by 1"

  - entity: Bid
    state_field: status
    initial_state: ACTIVE
    terminal_states: [OUTBID, RETRACTED]
    transitions:
      - from: ACTIVE
        to: WINNING
        trigger: "POST /auction-lots/{id}/close (cascade hop 2, selector picks this bid)"
        actor: DisposalOfficer
        preconditions:
          - "status == ACTIVE"
          - "amount_cents >= the lot's reserve_price_cents"
          - "this bid is the selector's choice: highest amount_cents, tie broken by created_at ASC"
        side_effects: ["Bidder.winning_lot_count += 1; increments Bid.version by 1"]
      - from: ACTIVE
        to: OUTBID
        trigger: "POST /auction-lots/{id}/close (cascade hop 2, selector picks another bid)"
        actor: DisposalOfficer
        preconditions: ["status == ACTIVE", "a different bid on the lot became WINNING"]
        side_effects: ["increments Bid.version by 1"]
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /bidders/{id}/status with status == DEBARRED, or lot cancellation (cascade)"
        actor: ProgramAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["the lot's high_bid_cents is re-derived; increments Bid.version by 1"]
      - from: WINNING
        to: RETRACTED
        trigger: "POST /bidders/{id}/status with status == DEBARRED (cascade hop 2)"
        actor: ProgramAdmin
        preconditions: ["status == WINNING", "the bidder moved to DEBARRED in hop 1"]
        side_effects:
          - "Bidder.winning_lot_count -= 1"
          - "hop 3 follows: the lot moves CLOSED_MET -> CLOSED_NO_SALE and its invoice is VOIDED"
          - "increments Bid.version by 1"

  - entity: Bidder
    state_field: status
    initial_state: PENDING
    terminal_states: [DEBARRED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /bidders/{id}/status with status == REGISTERED"
        actor: ProgramAdmin
        preconditions: ["status == PENDING"]
        side_effects: ["increments Bidder.version by 1"]
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /bidders/{id}/status with status == SUSPENDED"
        actor: ProgramAdmin
        preconditions: ["status == REGISTERED"]
        side_effects: ["existing bids keep their status; new bids are refused with ERR_BIDDER_NOT_REGISTERED; increments Bidder.version by 1"]
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /bidders/{id}/status with status == REGISTERED"
        actor: ProgramAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["increments Bidder.version by 1"]
      - from: REGISTERED
        to: DEBARRED
        trigger: "POST /bidders/{id}/status with status == DEBARRED"
        actor: ProgramAdmin
        preconditions: ["status == REGISTERED"]
        side_effects:
          - "hop 1: status -> DEBARRED; increments Bidder.version by 1"
          - "hop 2 (caused by hop 1): every Bid with bidder_id == this id and status IN {ACTIVE, WINNING} moves to RETRACTED, processed in created_at ASC order"
          - "hop 3 (caused by hop 2): for each AuctionLot that lost its WINNING bid, the lot moves CLOSED_MET -> CLOSED_NO_SALE, high_bid_cents is re-derived, and its SaleInvoice with status IN {ISSUED, PARTIALLY_PAID} moves to VOIDED with void_reason = WINNER_DEBARRED"
          - "hop 4 (caused by hop 3): because the lot became CLOSED_NO_SALE, its asset moves disposition_status SOLD -> AUCTION_ELIGIBLE"
          - "hop 5 (caused by the invoice VOIDED in hop 3): that invoice's deposit_applied_cents returns to the bidder's deposit_held_cents, preserving the deposit-custody invariant"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "POST /bidders/{id}/status with status == DEBARRED"
        actor: ProgramAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["same five-hop cascade as REGISTERED -> DEBARRED"]

  - entity: SaleInvoice
    state_field: status
    initial_state: ISSUED
    terminal_states: [PAID, DEFAULTED, VOIDED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /sale-invoices/{id}/payments where amount_paid_cents < total_due_cents afterwards"
        actor: Bidder
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == bidder_id when the caller's role is Bidder"
          - "amount_cents + deposit applied by this call <= balance_due_cents — else ERR_PAYMENT_EXCEEDS_BALANCE"
        side_effects:
          - "amount_paid_cents += amount_cents + deposit applied; deposit_applied_cents += deposit applied"
          - "the Bidder's deposit_held_cents decreases and deposit_applied_cents increases by the same amount"
          - "increments SaleInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /sale-invoices/{id}/payments that still leaves a balance"
        actor: Bidder
        preconditions: ["status == PARTIALLY_PAID", "amount_cents + deposit applied < balance_due_cents"]
        side_effects: ["amount_paid_cents increased; increments SaleInvoice.version by 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /sale-invoices/{id}/payments that settles the balance in one call"
        actor: Bidder
        preconditions: ["status == ISSUED", "amount_cents + deposit applied == balance_due_cents"]
        side_effects:
          - "hop 1: amount_paid_cents == total_due_cents; balance_due_cents == 0"
          - "hop 2 (caused by hop 1): the lot moves CLOSED_MET -> SETTLED"
          - "increments SaleInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /sale-invoices/{id}/payments that settles the remaining balance"
        actor: Bidder
        preconditions: ["status == PARTIALLY_PAID", "amount_cents + deposit applied == balance_due_cents"]
        side_effects:
          - "hop 1: balance_due_cents == 0"
          - "hop 2 (caused by hop 1): the lot moves CLOSED_MET -> SETTLED"
          - "increments SaleInvoice.version by 1"
      - from: ISSUED
        to: DEFAULTED
        trigger: "POST /sale-invoices/{id}/default"
        actor: FinanceController
        preconditions:
          - "status == ISSUED"
          - "logical clock now > due_at"
        side_effects:
          - "default_reason stored"
          - "the bidder's deposit_applied_cents on this invoice moves to deposit_forfeited_cents; deposit_paid_cents is unchanged"
          - "the lot stays CLOSED_MET so a CASH-basis distribution can still be computed"
          - "increments SaleInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: DEFAULTED
        trigger: "POST /sale-invoices/{id}/default"
        actor: FinanceController
        preconditions: ["status == PARTIALLY_PAID", "logical clock now > due_at"]
        side_effects:
          - "default_reason stored; amount_paid_cents frozen at its current value"
          - "the bidder's deposit_applied_cents on this invoice moves to deposit_forfeited_cents"
          - "increments SaleInvoice.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /sale-invoices/{id}/void, or the debarment cascade hop 3"
        actor: FinanceController
        preconditions: ["status == ISSUED", "no ProceedsDistribution for the lot has status == POSTED"]
        side_effects:
          - "void_reason stored"
          - "compensation: the invoice's deposit_applied_cents returns to the bidder's deposit_held_cents and the invoice's deposit_applied_cents and amount_paid_cents are zeroed"
          - "increments SaleInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "POST /sale-invoices/{id}/void, or the debarment cascade hop 3"
        actor: FinanceController
        preconditions: ["status == PARTIALLY_PAID", "no ProceedsDistribution for the lot has status == POSTED"]
        side_effects:
          - "void_reason stored"
          - "compensation: deposit_applied_cents returns to the bidder's deposit_held_cents; cash payments are recorded as refundable outside this API and amount_paid_cents is zeroed"
          - "increments SaleInvoice.version by 1"

  - entity: ProceedsDistribution
    state_field: status
    initial_state: CALCULATED
    terminal_states: [SUPERSEDED, REVERSED]
    transitions:
      - from: CALCULATED
        to: POSTED
        trigger: "POST /proceeds-distributions/{id}/post"
        actor: FinanceController
        preconditions:
          - "status == CALCULATED"
          - "X-User-ID != the lot's closed_by_user_id — else ERR_SEGREGATION_OF_DUTIES"
          - "no other ProceedsDistribution for the same auction_lot_id has status == POSTED — else ERR_DISTRIBUTION_ALREADY_POSTED"
        side_effects:
          - "hop 1: posted_by_user_id and posted_at stamped"
          - "hop 2 (caused by hop 1): the beneficiary Agency.proceeds_account_balance_cents is recomputed by calculations.agency_proceeds_ledger_balance and posted_distribution_count += 1"
          - "increments ProceedsDistribution.version by 1 and Agency.version by 1"
      - from: CALCULATED
        to: SUPERSEDED
        trigger: "POST /proceeds-distributions creating a newer distribution for the same auction_lot_id"
        actor: FinanceController
        preconditions: ["status == CALCULATED"]
        side_effects: ["increments ProceedsDistribution.version by 1"]
      - from: POSTED
        to: REVERSED
        trigger: "POST /proceeds-distributions/{id}/reverse"
        actor: FinanceController
        preconditions:
          - "status == POSTED"
          - "the beneficiary Agency.proceeds_account_balance_cents - net_to_agency_cents >= 0 — else ERR_LEDGER_WOULD_GO_NEGATIVE"
        side_effects:
          - "hop 1: reversal_reason stored"
          - "hop 2 (caused by hop 1): the beneficiary Agency.proceeds_account_balance_cents is recomputed (this distribution drops out of the POSTED set) and posted_distribution_count -= 1"
          - "compensation: the ledger invariant SUM(Agency.proceeds_account_balance_cents) == SUM(ProceedsDistribution.net_to_agency_cents WHERE status == POSTED) holds again"
          - "increments ProceedsDistribution.version by 1 and Agency.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assessment-create-stale-asset
    parent_entity: SurplusAsset
    write_endpoint: "POST /assets/{id}/condition-assessments"
    occ_field: "expected_asset_version"
    description: |
      Recording a ConditionAssessment against a SurplusAsset whose version has advanced since the
      client last read it is rejected. A second assessment legitimately supersedes the first under
      the ASSESSED -> ASSESSED self-transition, so a writer holding a stale view would silently
      overturn a re-appraisal it never saw; the stale-version check forces it to re-read.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

  - rule_id: distribution-create-stale-lot
    parent_entity: AuctionLot
    write_endpoint: "POST /proceeds-distributions"
    occ_field: "expected_auction_lot_version"
    description: |
      Creating a ProceedsDistribution for an AuctionLot whose version has advanced since the client
      last read it is rejected. A CASH-basis distribution legitimately supersedes an earlier
      CALCULATED one for the same lot, so a writer working from a stale lot view would compute a
      distributable base that no longer reflects the lot's settlement state.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: asset_fair_market_value
    trigger: "every POST /assets/{id}/condition-assessments (INTAKE -> ASSESSED and the ASSESSED -> ASSESSED self-transition); the stored result also feeds POST /auction-lots and POST /transfer-orders"
    algorithm: threshold
    formula: |
      # Step 1 - select the governing assessment (selector policy, no random fields)
      #   candidate set : ConditionAssessment rows with asset_id == asset.id
      #   ranking       : assessed_on DESC, then created_at DESC
      #   tie-break     : created_at DESC is total because created_at has millisecond precision
      #                   and is server-stamped per insert; `id` is NEVER consulted
      #   empty pool    : fair_market_value_cents and condition_code stay null
      #   every other candidate gets superseded = true
      governing = rank(candidates, key=(assessed_on DESC, created_at DESC))[0]

      # Step 2 - age factor from whole elapsed years (floor), floored at FLOOR_AGE_FACTOR
      elapsed_days      = (date(logical_clock_now) - asset.acquisition_date).days
      full_years        = floor(elapsed_days / 365)
      age_factor        = max(FLOOR_AGE_FACTOR, 1 - DEPRECIATION_RATE_PER_YEAR * full_years)

      # Step 3 - condition and functional factors
      condition_factor  = CONDITION_FACTOR[governing.condition_code]
      functional_factor = 1.00 if governing.functional else NON_FUNCTIONAL_FACTOR

      # Step 4 - nested rounding is pinned: ONE round_half_up on the product, then the
      #          repair deduction is applied to the already-rounded integer, then a floor at 0
      base_cents = round_half_up(asset.acquisition_cost_cents
                                 * condition_factor * age_factor * functional_factor)
      asset.fair_market_value_cents = max(0, base_cents - governing.repair_cost_estimate_cents)
      asset.condition_code          = governing.condition_code
    input_set: "ConditionAssessment rows for this asset only; superseded rows remain candidates for the ranking (superseded is an output of the ranking, not a filter on it). Assets in disposition_status RETAINED or DESTROYED are never revalued."
    constants:
      DEPRECIATION_RATE_PER_YEAR: 0.10
      FLOOR_AGE_FACTOR: 0.20
      NON_FUNCTIONAL_FACTOR: 0.60
      CONDITION_FACTOR: { C1: 1.00, C2: 0.85, C3: 0.70, C4: 0.50, C5: 0.30, C6: 0.15, C7: 0.05 }
      DAYS_PER_YEAR: 365
    precision: "whole cents, round_half_up, applied exactly once at step 4 on the product of the three factors. Every factor is an exact decimal literal and the product is evaluated in exact decimal arithmetic (never binary floating point) before the single round_half_up, so a product that lands exactly on .5 rounds away from zero — e.g. acquisition_cost_cents 3217450 with condition_factor 0.50, age_factor 0.30 and functional_factor 1.00 gives exactly 482617.5 and therefore base_cents 482618, not 482617."
    variants:
      - name: transfer_basis
        when: "the stored fair_market_value_cents is consumed by POST /transfer-orders"
        difference: "the value is multiplied by a recipient-tier discount factor (0.25 / 0.50 / 0.10) and a handling fee is added — see calculations.transfer_order_price"
      - name: auction_reserve
        when: "the stored fair_market_value_cents is consumed by POST /auction-lots without a reserve_price_cents override"
        difference: "reserve_price_cents = max(MIN_RESERVE_CENTS, round_half_up(fair_market_value_cents * AUCTION_RESERVE_PCT)) with AUCTION_RESERVE_PCT = 0.60 and MIN_RESERVE_CENTS = 2500; the same asset therefore carries two different disposal prices depending on which channel claims it"

  - name: transfer_order_price
    trigger: "POST /transfer-orders"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. `handling_fee_cents` looks circular because the fee tier is
      # keyed on a transfer amount and the transfer amount includes the fee, so the scaffold fixes
      # the order explicitly: the fee tier is selected from base_transfer_cents, the pre-waiver,
      # pre-fee figure, and the fee is NEVER re-fed into the tier selection.
      # Step 1
      tier_factor = TIER_DISCOUNT[recipient_agency.agency_type]
      # Step 2
      base_transfer_cents = round_half_up(asset.fair_market_value_cents * tier_factor)
      # Step 3 - tier selection reads base_transfer_cents ONLY
      handling_fee_cents =
          HANDLING_FEE_SMALL_CENTS  if base_transfer_cents <  HANDLING_TIER_1_CENTS
          HANDLING_FEE_MEDIUM_CENTS if HANDLING_TIER_1_CENTS <= base_transfer_cents < HANDLING_TIER_2_CENTS
          HANDLING_FEE_LARGE_CENTS  if base_transfer_cents >= HANDLING_TIER_2_CENTS
      # Step 4 - federal-source property is a donation: the acquisition value is waived, but the
      #          agency's handling fee is still owed, and it is the fee chosen in step 3.
      transfer_price_cents = (0 if asset.federal_source else base_transfer_cents) + handling_fee_cents
    input_set: "the single asset named by the awarded ScreeningRequest's cycle and the single recipient Agency named by that request; no aggregation"
    constants:
      TIER_DISCOUNT: { STATE_AGENCY: 0.25, LOCAL_GOVERNMENT: 0.50, ELIGIBLE_NONPROFIT: 0.10 }
      HANDLING_TIER_1_CENTS: 100000
      HANDLING_TIER_2_CENTS: 1000000
      HANDLING_FEE_SMALL_CENTS: 5000
      HANDLING_FEE_MEDIUM_CENTS: 12500
      HANDLING_FEE_LARGE_CENTS: 30000
    precision: "whole cents, round_half_up, applied exactly once at step 2"

  - name: auction_invoice_total
    trigger: "the SaleInvoice created by cascade hop 3 of POST /auction-lots/{id}/close"
    algorithm: aggregation
    formula: |
      # Rounding ORDER is pinned: each money line is rounded_half_up to whole cents on its own,
      # then the three integers are summed. The total is NEVER produced by rounding a single
      # compound product, i.e.
      #   FORBIDDEN: total_due_cents = round_half_up(hammer * (1 + buyer_premium_pct)
      #                                                     * (1 + sales_tax_pct))
      # The two orders disagree by 1 cent on many inputs (e.g. hammer = 301500 gives 354314
      # per-line and 354313 compound), so the pinned order is normative.
      hammer_price_cents  = winning_bid.amount_cents                                   # line 0
      buyer_premium_cents = round_half_up(hammer_price_cents * venue.buyer_premium_pct) # line 1
      sales_tax_cents     = round_half_up((hammer_price_cents + buyer_premium_cents)
                                          * venue.sales_tax_pct)                       # line 2
      total_due_cents     = hammer_price_cents + buyer_premium_cents + sales_tax_cents  # no rounding
      balance_due_cents   = total_due_cents - amount_paid_cents
      due_at              = auction_lot.closed_at + PAYMENT_TERM_DAYS days
    input_set: "exactly the one Bid that cascade hop 2 moved to WINNING, plus the lot's SaleVenue rates read at close time"
    constants:
      PAYMENT_TERM_DAYS: 7
    precision: "whole cents; round_half_up applied independently to line 1 and line 2; the sum is exact"

  - name: proceeds_distribution_net
    trigger: "POST /proceeds-distributions"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 - distributable base depends on the requested basis (see variants)
      distributable_base_cents = ACCRUAL -> auction_lot.high_bid_cents
                                 CASH    -> the lot's SaleInvoice (status != VOIDED).amount_paid_cents
      # Step 2 - marginal tiered service fee; each slice is rounded_half_up on its own and the
      #          three integers are summed (per-slice rounding, then sum)
      slice_1 = min(distributable_base_cents, SERVICE_TIER_1_CENTS)
      slice_2 = max(0, min(distributable_base_cents, SERVICE_TIER_2_CENTS) - SERVICE_TIER_1_CENTS)
      slice_3 = max(0, distributable_base_cents - SERVICE_TIER_2_CENTS)
      service_fee_cents = round_half_up(slice_1 * SERVICE_RATE_1)
                        + round_half_up(slice_2 * SERVICE_RATE_2)
                        + round_half_up(slice_3 * SERVICE_RATE_3)
      # Step 3 - clearance cost recovery, counted from certificates that exist AT CREATE TIME
      #          (candidate set: ClearanceCertificate rows for the lot's asset with
      #           serials_verified == true; no time window, no dedup by method)
      cost_recovery_cents = SANITIZATION_FEE_CENTS * count(certs where cert_type == DATA_SANITIZATION)
                          + DEMIL_FEE_CENTS        * count(certs where cert_type == DEMILITARIZATION)
      # Step 4
      net_to_agency_cents = max(0, distributable_base_cents - service_fee_cents - cost_recovery_cents)
    input_set: "one AuctionLot, its asset's verified ClearanceCertificate rows as of the create call, and (CASH only) the lot's single non-VOIDED SaleInvoice"
    constants:
      SERVICE_TIER_1_CENTS: 500000
      SERVICE_TIER_2_CENTS: 5000000
      SERVICE_RATE_1: 0.125
      SERVICE_RATE_2: 0.0875
      SERVICE_RATE_3: 0.0525
      SANITIZATION_FEE_CENTS: 7500
      DEMIL_FEE_CENTS: 22500
    precision: "whole cents; round_half_up applied per tier slice, then summed"
    variants:
      - name: ACCRUAL
        when: "basis == ACCRUAL; permitted once the lot is CLOSED_MET or SETTLED"
        difference: "the base is the hammer price the lot achieved (auction_lot.high_bid_cents), whether or not the buyer ever pays"
      - name: CASH
        when: "basis == CASH; permitted only once the lot's SaleInvoice is PAID or DEFAULTED"
        difference: "the base is the cash actually collected (SaleInvoice.amount_paid_cents, which already includes any applied deposit). For a defaulted invoice the two variants return materially different nets from identical lot data — e.g. hammer 301500 with one sanitization certificate yields ACCRUAL net 256312 and, after a 210000 collection, CASH net 176250."

  - name: bidder_deposit_requirement
    trigger: "evaluated once at POST /auction-lots (stored as AuctionLot.required_deposit_cents) and re-read on every POST /auction-lots/{id}/bids"
    algorithm: threshold
    formula: |
      # The comparison is >= : a reserve of exactly DEPOSIT_THRESHOLD_CENTS DOES require a deposit.
      required_deposit_cents =
          0 if auction_lot.reserve_price_cents < DEPOSIT_THRESHOLD_CENTS
          else max(MIN_DEPOSIT_CENTS,
                   round_half_up(auction_lot.reserve_price_cents * DEPOSIT_PCT))
      # gate applied at bid time
      accept_bid requires bidder.deposit_held_cents >= auction_lot.required_deposit_cents
    input_set: "the lot's stored reserve_price_cents (whether COMPUTED or OFFICER_OVERRIDE) and the bidder's deposit_held_cents at bid time"
    constants:
      DEPOSIT_THRESHOLD_CENTS: 500000
      DEPOSIT_PCT: 0.10
      MIN_DEPOSIT_CENTS: 50000
    precision: "whole cents, round_half_up"

  - name: agency_proceeds_ledger_balance
    trigger: "POST /proceeds-distributions/{id}/post and POST /proceeds-distributions/{id}/reverse"
    algorithm: aggregation
    formula: |
      # Full recompute, never an incremental delta, so post/reverse pairs cannot drift.
      #   source entity : ProceedsDistribution
      #   status filter : status == POSTED  (CALCULATED, SUPERSEDED and REVERSED are excluded)
      #   window        : all time, no bounds
      #   order         : created_at ASC (integer addition is order-insensitive; the order is
      #                   pinned so the audit listing is reproducible). `id` is never consulted.
      agency.proceeds_account_balance_cents =
          sum(d.net_to_agency_cents
              for d in ProceedsDistribution
              if d.beneficiary_agency_id == agency.id and d.status == POSTED
              ordered by d.created_at ASC)
      agency.posted_distribution_count = count(same set)
      # Conserved-quantity invariant, checked after every post and every reverse:
      #   SUM over all Agency rows of proceeds_account_balance_cents
      #     == SUM over all ProceedsDistribution rows with status == POSTED of net_to_agency_cents
    input_set: "ProceedsDistribution rows with status == POSTED for one beneficiary agency"
    constants: {}
    precision: "exact integer cents; no rounding"

  - name: federal_use_period_end
    trigger: "POST /assets (when federal_source == true) and cascade hop 2 of POST /assets/{id}/release for the recipient's own use period on the TransferOrder"
    algorithm: threshold
    formula: |
      months = USE_PERIOD_MONTHS[asset.category]
      # calendar-month arithmetic: add `months` to the start date's month, keep the day-of-month,
      # and clamp to the last day of the target month when the day does not exist there.
      asset.federal_use_period_end_on = add_months(asset.federal_use_period_start_on, months)
      transfer_order.use_period_end_on = add_months(date(transfer_order.acknowledged_at), months)
      # Disposal gate, applied at POST /screening-cycles and POST /auction-lots. The comparison is
      # >= : disposal ON the end date is permitted; one day earlier is not.
      disposal_allowed = (asset.federal_source == false)
                         or (date(logical_clock_now) >= asset.federal_use_period_end_on)
    input_set: "one asset's category and federal_use_period_start_on; the logical clock date at the disposal attempt"
    constants:
      USE_PERIOD_MONTHS: { VEHICLE: 18, HEAVY_EQUIPMENT: 18, RESTRICTED_MILITARY: 18, IT_EQUIPMENT: 12, FURNITURE: 12 }
    precision: "whole calendar days; no rounding"

  - name: screening_tier_deadline
    trigger: "POST /screening-cycles and every POST /screening-cycles/{id}/advance-tier"
    algorithm: interval_merge
    formula: |
      tier_deadline_at = tier_opened_at + tier_window_days whole days (exact 24h multiples)
      # Request submission window is CLOSED on both ends:
      #   tier_opened_at <= logical_clock_now <= tier_deadline_at  -> accepted
      #   otherwise -> ERR_TIER_WINDOW_EXPIRED
      # advance-tier gate:
      #   open_request_count == 0  OR  logical_clock_now >= tier_deadline_at
    input_set: "one ScreeningCycle's tier_opened_at and tier_window_days"
    constants:
      HOURS_PER_DAY: 24
    precision: "exact ISO 8601 instants with three fractional digits"

  - name: lot_window_conflict
    trigger: "POST /auction-lots"
    algorithm: interval_merge
    formula: |
      # Two DIFFERENT interval geometries are checked, on two different resource entities.
      #
      # (A) SaleVenue - AGGREGATE CAPACITY over HALF-OPEN windows [opens_at, closes_at).
      #     Two windows intersect iff  new.opens_at < other.closes_at AND other.opens_at < new.closes_at.
      #     Touching endpoints (new.opens_at == other.closes_at) therefore do NOT intersect.
      #     candidate set : AuctionLot rows with venue_id == new.venue_id and status IN {DRAFT, OPEN}
      #     reject when   : count(intersecting candidates) >= venue.concurrent_lot_capacity
      #     error         : ERR_VENUE_CAPACITY_CONFLICT
      #
      # (B) SurplusAsset - EXCLUSIVE OCCUPANCY over CLOSED windows plus a mandatory cooldown BUFFER.
      #     candidate set : AuctionLot rows with asset_id == new.asset_id and
      #                     status IN {DRAFT, OPEN, CLOSED_MET, CLOSED_NO_SALE, SETTLED}
      #     reject when   : new.opens_at < other.closes_at + RELIST_COOLDOWN_HOURS
      #     Equality is allowed: new.opens_at == other.closes_at + 24h passes; one second earlier
      #     fails. Adjacency is forbidden here, unlike (A) where it is permitted, and capacity is
      #     always 1 rather than a venue-configured integer.
      #     error         : ERR_ASSET_WINDOW_CONFLICT
      # Check order is (A) then (B): the venue capacity conflict wins when both apply.
    input_set: "for (A) the venue's DRAFT/OPEN lots; for (B) every non-CANCELLED lot ever created for the same asset"
    constants:
      RELIST_COOLDOWN_HOURS: 24
    precision: "exact ISO 8601 instants; comparisons are strict as written"

  - name: de_minimis_screening_exemption
    trigger: "POST /auction-lots and POST /screening-cycles"
    algorithm: threshold
    formula: |
      # Strict `<`: an asset valued at exactly DE_MINIMIS_SCREENING_THRESHOLD_CENTS is NOT exempt
      # and must complete tier screening before it can be listed.
      screening_exempt = asset.fair_market_value_cents < DE_MINIMIS_SCREENING_THRESHOLD_CENTS
      listable = (asset.disposition_status == AUCTION_ELIGIBLE)
                 or (asset.disposition_status == ASSESSED and screening_exempt)
      # otherwise ERR_ASSET_NOT_DISPOSABLE
    input_set: "the single asset named in the request body"
    constants:
      DE_MINIMIS_SCREENING_THRESHOLD_CENTS: 25000
    precision: "exact integer cents"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
#      violated rule determines the response, and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:

  # ---- 1. Authentication -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty; for roles whose identity is entity_backed, the value must be the id of an existing row of that entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- 2. Authorization --------------------------------------------------
  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "an AgencyOfficer may only read or write rows scoped to its own agency: TurnIn.turning_in_agency_id, ScreeningRequest.requesting_agency_id, TransferOrder.recipient_agency_id and Agency.id must equal X-User-ID"
    error_id: ERR_FORBIDDEN_AGENCY_SCOPE
    http_status: 403
    applies_to: "GET /agencies/{id}, POST /turn-ins, POST /turn-ins/{id}/submit, GET /turn-ins/{id}, POST /screening-requests, POST /screening-requests/{id}/resubmit, GET /screening-requests/{id}, POST /transfer-orders/{id}/acknowledge, GET /transfer-orders/{id}"
  - priority: 5
    category: auth
    check: "a Bidder may only read or write its own rows: Bidder.id, Bid.bidder_id and SaleInvoice.bidder_id must equal X-User-ID"
    error_id: ERR_FORBIDDEN_BIDDER_SCOPE
    http_status: 403
    applies_to: "GET /bidders/{id}, GET /bidders/{id}/bids, POST /bidders/{id}/deposits, POST /auction-lots/{id}/bids, GET /sale-invoices/{id}, POST /sale-invoices/{id}/payments"

  # ---- 3. Request shape --------------------------------------------------
  - priority: 6
    category: business_constraint
    check: "every field marked required in the endpoint's input list is present, non-null and of the declared JSON type; string length and numeric range constraints from §1.1 hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: business_constraint
    check: "every enum-typed field carries a value from the enum's declared set in §1.1"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all endpoints accepting enum input"
  - priority: 8
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
  - priority: 9
    category: business_constraint
    check: "conditionally required fields are present: vin, odometer_reading and title_number when category == VEHICLE; demil_code when is_restricted == true; federal_use_period_start_on when federal_source == true; donee_certification_expires_on when federal_donee_status == CERTIFIED"
    error_id: ERR_CONDITIONAL_FIELD_REQUIRED
    http_status: 422
    applies_to: "POST /assets, POST /agencies"
  - priority: 10
    category: business_temporal
    check: "SurplusAsset.acquisition_date and ConditionAssessment.assessed_on are not later than the logical clock date; ClearanceCertificate.certified_on is not later than the logical clock date"
    error_id: ERR_FUTURE_DATE
    http_status: 422
    applies_to: "POST /assets, POST /assets/{id}/condition-assessments, POST /assets/{id}/clearance-certificates"

  # ---- 4. Existence (path segments left to right, then body FKs in the
  #        order the fields appear in §1.1) -------------------------------
  - priority: 12
    category: existence
    check: "every id in the path resolves to an existing row, validated left to right"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_TURN_IN_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_SCREENING_CYCLE_NOT_FOUND | ERR_SCREENING_REQUEST_NOT_FOUND | ERR_TRANSFER_ORDER_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_AUCTION_LOT_NOT_FOUND | ERR_BIDDER_NOT_FOUND | ERR_SALE_INVOICE_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 13
    category: existence
    check: "every foreign key in the request body resolves to an existing row, validated in §1.1 field-declaration order"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_TURN_IN_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_SCREENING_CYCLE_NOT_FOUND | ERR_SCREENING_REQUEST_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_AUCTION_LOT_NOT_FOUND | ERR_BIDDER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /turn-ins, POST /assets, POST /screening-cycles, POST /screening-requests, POST /transfer-orders, POST /auction-lots, POST /auction-lots/{id}/bids, POST /proceeds-distributions"

  # ---- 5. Uniqueness and referential integrity --------------------------
  - priority: 14
    category: business_referential
    check: "Agency.agency_code is unique across all agencies (case-sensitive exact match)"
    error_id: ERR_DUPLICATE_AGENCY_CODE
    http_status: 409
    applies_to: "POST /agencies"
  - priority: 15
    category: business_referential
    check: "SaleVenue.venue_code is unique across all venues"
    error_id: ERR_DUPLICATE_VENUE_CODE
    http_status: 409
    applies_to: "POST /venues"
  - priority: 16
    category: business_referential
    check: "Bidder.email is unique across all bidders (case-insensitive)"
    error_id: ERR_DUPLICATE_BIDDER_EMAIL
    http_status: 409
    applies_to: "POST /bidders"
  - priority: 17
    category: business_referential
    check: "component_of_asset_id must not introduce a cycle in the SurplusAsset component graph, must name an asset on the same turn_in_id, and must not name the asset itself"
    error_id: ERR_ASSET_COMPONENT_CYCLE
    http_status: 422
    applies_to: "POST /assets"

  # ---- 6. Optimistic concurrency (§1.2.1) --------------------------------
  - priority: 18
    category: state
    check: "expected_asset_version equals the addressed SurplusAsset's current version"
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
    applies_to: "POST /assets/{id}/condition-assessments"
  - priority: 19
    category: state
    check: "expected_auction_lot_version equals the referenced AuctionLot's current version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /proceeds-distributions"

  # ---- 7. Segregation of duties -----------------------------------------
  - priority: 22
    category: business_safety
    check: "the ClearanceTechnician's X-User-ID must differ from every ConditionAssessment.assessor_user_id recorded on the same asset — the technician who certifies sanitization or demilitarization may not be a person who appraised the item"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /assets/{id}/clearance-certificates"
  - priority: 23
    category: business_safety
    check: "the posting FinanceController's X-User-ID must differ from the AuctionLot.closed_by_user_id of the lot the distribution settles"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /proceeds-distributions/{id}/post"

  # ---- 8. Generic state preconditions -----------------------------------
  - priority: 30
    category: state
    check: "the addressed row is in a from-state that admits the requested trigger in its §1.2 state machine, and the row is not in a terminal state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /turn-ins/{id}/submit, POST /turn-ins/{id}/review, POST /agencies/{id}/status, POST /screening-cycles/{id}/advance-tier, POST /screening-cycles/{id}/award, POST /screening-requests/{id}/request-info, POST /screening-requests/{id}/resubmit, POST /transfer-orders/{id}/acknowledge, POST /transfer-orders/{id}/void, POST /venues/{id}/status, POST /auction-lots/{id}/open, POST /auction-lots/{id}/close, POST /bidders/{id}/status, POST /sale-invoices/{id}/payments, POST /sale-invoices/{id}/default, POST /sale-invoices/{id}/void, POST /proceeds-distributions/{id}/post, POST /proceeds-distributions/{id}/reverse, POST /assets/{id}/release"
  - priority: 31
    category: state
    check: "SurplusAsset rows may only be added to a TurnIn whose status == DRAFT"
    error_id: ERR_TURN_IN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /assets"
  - priority: 32
    category: state
    check: "the addressed AuctionLot is status == OPEN and the logical clock satisfies opens_at <= now < closes_at"
    error_id: ERR_LOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 33
    category: state
    check: "a ConditionAssessment may only be recorded while the asset's disposition_status is INTAKE or ASSESSED"
    error_id: ERR_ASSET_NOT_ASSESSABLE
    http_status: 409
    applies_to: "POST /assets/{id}/condition-assessments"
  - priority: 34
    category: state
    check: "the acting Bidder's status == REGISTERED (PENDING, SUSPENDED and DEBARRED are all refused)"
    error_id: ERR_BIDDER_NOT_REGISTERED
    http_status: 403
    applies_to: "POST /auction-lots/{id}/bids, POST /bidders/{id}/deposits"
  - priority: 35
    category: state
    check: "the referenced Agency.status == ACTIVE (a SUSPENDED organization may not open turn-ins, file screening requests or receive transfer orders)"
    error_id: ERR_AGENCY_SUSPENDED
    http_status: 409
    applies_to: "POST /turn-ins, POST /screening-requests, POST /transfer-orders"
  - priority: 36
    category: state
    check: "the asset is disposable into the requested channel: POST /screening-cycles requires disposition_status == ASSESSED with fair_market_value_cents >= DE_MINIMIS_SCREENING_THRESHOLD_CENTS; POST /auction-lots requires disposition_status == AUCTION_ELIGIBLE, or ASSESSED when the de-minimis exemption applies"
    error_id: ERR_ASSET_NOT_DISPOSABLE
    http_status: 409
    applies_to: "POST /screening-cycles, POST /auction-lots"
  - priority: 38
    category: state
    check: "a TurnIn may only be submitted when it has at least one child asset, and may only be accepted when every child asset has a non-null fair_market_value_cents"
    error_id: ERR_TURN_IN_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /turn-ins/{id}/submit, POST /turn-ins/{id}/review"
  - priority: 40
    category: state
    check: "the referenced SaleVenue.status == ACTIVE"
    error_id: ERR_VENUE_CLOSED
    http_status: 409
    applies_to: "POST /auction-lots"

  # ---- 9. Business rules — (a) safety / compliance / regulatory ---------
  - priority: 50
    category: business_safety
    check: "a federal_source asset may not enter any disposal channel before its federal_use_period_end_on; the comparison is logical_clock_date >= federal_use_period_end_on"
    error_id: ERR_FEDERAL_USE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /screening-cycles, POST /auction-lots"
  - priority: 52
    category: business_safety
    check: "a data-bearing asset may not be released until a ClearanceCertificate with cert_type == DATA_SANITIZATION and serials_verified == true exists, i.e. clearance_status must be CLEARED"
    error_id: ERR_SANITIZATION_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /assets/{id}/release"
  - priority: 54
    category: business_safety
    check: "a restricted asset may not be released until a ClearanceCertificate with cert_type == DEMILITARIZATION, a method matching the asset's demil_code family and serials_verified == true exists"
    error_id: ERR_DEMIL_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /assets/{id}/release"
  - priority: 56
    category: business_safety
    check: "a bid on a lot whose asset is_restricted == true requires the bidder to hold an end-use certificate that has not lapsed: end_use_certificate_expires_on is non-null and >= the logical clock date"
    error_id: ERR_END_USE_CERTIFICATE_REQUIRED
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 58
    category: business_safety
    check: "method must belong to the cert_type's family: DATA_SANITIZATION admits only {NIST_CLEAR, NIST_PURGE, DEGAUSS}; DEMILITARIZATION admits only {MUTILATE, DESTROY}; and method == DESTROY is admitted only when the asset's demil_code == Q"
    error_id: ERR_CLEARANCE_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /assets/{id}/clearance-certificates"
  - priority: 59
    category: business_safety
    check: "a certificate may only be filed against an asset whose clearance_status is REQUIRED_PENDING, BLOCKED or CLEARED; an asset with clearance_status == NOT_REQUIRED has no release gate to certify"
    error_id: ERR_CLEARANCE_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /assets/{id}/clearance-certificates"
  - priority: 60
    category: business_safety
    check: "a transfer order to an ELIGIBLE_NONPROFIT recipient, or any transfer order for a federal_source asset, requires recipient_agency.federal_donee_status == CERTIFIED with donee_certification_expires_on >= the logical clock date"
    error_id: ERR_DONEE_CERTIFICATION_INVALID
    http_status: 409
    applies_to: "POST /transfer-orders"

  # ---- 9. Business rules — (b) constraint satisfaction ------------------
  - priority: 62
    category: business_constraint
    check: "the requesting organization's agency_type must equal the cycle's current_tier; PUBLIC_SALE accepts no screening requests"
    error_id: ERR_TIER_PRIORITY_VIOLATION
    http_status: 409
    applies_to: "POST /screening-requests"
  - priority: 64
    category: business_constraint
    check: "releasing a VEHICLE asset requires odometer_disclosure_reading >= the asset's recorded odometer_reading and a non-empty title_recipient_name"
    error_id: ERR_ODOMETER_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: "POST /assets/{id}/release"
  - priority: 66
    category: business_constraint
    check: "releasing an asset whose lien_holder_name is non-null requires a non-empty lien_release_reference in the request"
    error_id: ERR_LIEN_NOT_RELEASED
    http_status: 409
    applies_to: "POST /assets/{id}/release"
  - priority: 68
    category: business_constraint
    check: "the awarded screening_request_id must name a ScreeningRequest whose screening_cycle_id equals the addressed cycle; the transfer order's screening_request_id must be status == APPROVED and its asset_id/recipient_agency_id must match the request's cycle asset and requesting agency"
    error_id: ERR_REQUEST_CYCLE_MISMATCH
    http_status: 409
    applies_to: "POST /screening-cycles/{id}/award, POST /transfer-orders"
  - priority: 70
    category: business_temporal
    check: "a screening request may only be filed or resubmitted while tier_opened_at <= logical clock <= tier_deadline_at (both bounds inclusive)"
    error_id: ERR_TIER_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /screening-requests, POST /screening-requests/{id}/resubmit"
  - priority: 72
    category: business_temporal
    check: "a tier may only be advanced when its window has closed (logical clock >= tier_deadline_at) or when open_request_count == 0; a tier with open requests inside its window may not be skipped"
    error_id: ERR_TIER_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /screening-cycles/{id}/advance-tier"
  - priority: 74
    category: business_temporal
    check: "the number of DRAFT or OPEN lots at the venue whose half-open window [opens_at, closes_at) intersects the new window must be strictly less than venue.concurrent_lot_capacity; touching endpoints do not intersect"
    error_id: ERR_VENUE_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /auction-lots"
  - priority: 76
    category: business_temporal
    check: "the new lot's opens_at must be >= (the latest closes_at among the asset's non-CANCELLED lots) + RELIST_COOLDOWN_HOURS; equality passes"
    error_id: ERR_ASSET_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /auction-lots"
  - priority: 78
    category: business_temporal
    check: "opens_at must be >= the logical clock and closes_at must be strictly greater than opens_at (AuctionLot); ScreeningCycle.opens_at must be >= the logical clock"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /auction-lots, POST /screening-cycles"

  # ---- 9. Business rules — (c) fiscal ----------------------------------
  - priority: 80
    category: business_fiscal
    check: "bid amount_cents must be >= the lot's reserve_price_cents"
    error_id: ERR_BID_BELOW_RESERVE
    http_status: 422
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 82
    category: business_fiscal
    check: "when the lot already has an ACTIVE bid, amount_cents must be >= high_bid_cents + MIN_BID_INCREMENT_CENTS (2500)"
    error_id: ERR_BID_INCREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 84
    category: business_fiscal
    check: "the bidder's deposit_held_cents must be >= the lot's required_deposit_cents"
    error_id: ERR_BID_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 86
    category: business_fiscal
    check: "a payment's amount_cents must be > 0 and <= the invoice's balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /sale-invoices/{id}/payments"
  - priority: 88
    category: business_fiscal
    check: "the requested basis must be available: ACCRUAL requires the lot in status CLOSED_MET or SETTLED; CASH additionally requires the lot's non-VOIDED SaleInvoice to be status PAID or DEFAULTED"
    error_id: ERR_DISTRIBUTION_BASIS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /proceeds-distributions"
  - priority: 90
    category: business_fiscal
    check: "a lot may carry at most one POSTED ProceedsDistribution; creating or posting a second one while a POSTED distribution exists for the same auction_lot_id is refused"
    error_id: ERR_DISTRIBUTION_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /proceeds-distributions, POST /proceeds-distributions/{id}/post"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   api_prefix is "" — every collection is a top-level path segment.
#   All list endpoints accept limit?/offset? and return `<Entity>[]` inside the
#   §1.0 envelope with total_count / has_more populated.
# ---------------------------------------------------------------------------
endpoints:

  # ---- Agency ------------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: "register a state agency, local government or eligible nonprofit as a screening participant and proceeds beneficiary"
    roles: [ProgramAdmin]
    code: 201
    input: [name, agency_code, agency_type, "federal_donee_status?", "donee_certification_expires_on?"]
    output: Agency
    side_effects:
      - "status initialised to ACTIVE, proceeds_account_balance_cents to 0, posted_distribution_count to 0"
      - "federal_donee_status defaults to NONE when omitted"
  - method: GET
    path: "/agencies/{id}"
    description: "read one organization, including its live proceeds ledger balance"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, AgencyOfficer]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/agencies"
    description: "list organizations, optionally narrowed by tier or participation status"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController]
    code: 200
    input: ["agency_type?", "status?", "federal_donee_status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []
  - method: POST
    path: "/agencies/{id}/status"
    description: "suspend or reinstate an organization's participation"
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: Agency
    side_effects:
      - "drives the Agency status machine ACTIVE <-> SUSPENDED"
      - "increments Agency.version by 1"
  - method: POST
    path: "/agencies/{id}/donee-certification"
    description: "record or withdraw the organization's federal surplus donee certification"
    roles: [ProgramAdmin]
    code: 200
    input: [federal_donee_status, "donee_certification_expires_on?"]
    output: Agency
    side_effects:
      - "sets federal_donee_status and donee_certification_expires_on; gates validation priority 60"
      - "increments Agency.version by 1"

  # ---- TurnIn ------------------------------------------------------------
  - method: POST
    path: "/turn-ins"
    description: "open a draft turn-in through which an agency relinquishes custody of surplus property"
    roles: [AgencyOfficer, ProgramAdmin]
    code: 201
    input: [turning_in_agency_id, custody_location, "remarks?"]
    output: TurnIn
    side_effects:
      - "status initialised to DRAFT; asset_count and appraised_total_cents to 0"
  - method: GET
    path: "/turn-ins/{id}"
    description: "read one turn-in with its derived asset roll-up"
    roles: [ProgramAdmin, DisposalOfficer, SurplusAssessor, AgencyOfficer]
    code: 200
    input: []
    output: TurnIn
    side_effects: []
  - method: GET
    path: "/turn-ins"
    description: "list turn-ins, optionally narrowed by the relinquishing agency or lifecycle state"
    roles: [ProgramAdmin, DisposalOfficer, SurplusAssessor]
    code: 200
    input: ["turning_in_agency_id?", "status?", "limit?", "offset?"]
    output: TurnIn[]
    side_effects: []
  - method: POST
    path: "/turn-ins/{id}/submit"
    description: "submit a draft turn-in for disposal-officer review"
    roles: [AgencyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: TurnIn
    side_effects:
      - "DRAFT -> SUBMITTED; stamps submitted_at from the logical clock"
      - "freezes the asset set: POST /assets is refused afterwards with ERR_TURN_IN_NOT_DRAFT"
      - "increments TurnIn.version by 1"
  - method: POST
    path: "/turn-ins/{id}/review"
    description: "accept or reject a submitted turn-in"
    roles: [DisposalOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: TurnIn
    side_effects:
      - "decision == ACCEPT: SUBMITTED -> ACCEPTED, stamps reviewed_at"
      - "decision == REJECT: SUBMITTED -> REJECTED and cascades every child asset in INTAKE or ASSESSED to RETAINED"
      - "increments TurnIn.version by 1"

  # ---- SurplusAsset ------------------------------------------------------
  - method: POST
    path: "/assets"
    description: "add one item of property to a draft turn-in"
    roles: [AgencyOfficer, ProgramAdmin]
    code: 201
    input: [turn_in_id, category, description, acquisition_cost_cents, acquisition_date, "component_of_asset_id?", "is_data_bearing?", "is_restricted?", "demil_code?", "federal_source?", "federal_use_period_start_on?", "vin?", "odometer_reading?", "title_number?", "lien_holder_name?"]
    output: SurplusAsset
    side_effects:
      - "disposition_status initialised to INTAKE"
      - "clearance_status initialised to REQUIRED_PENDING when is_data_bearing or is_restricted is true, otherwise NOT_REQUIRED"
      - "computes federal_use_period_end_on via calculations.federal_use_period_end when federal_source == true"
      - "recomputes the parent TurnIn.asset_count"
  - method: GET
    path: "/assets/{id}"
    description: "read one asset with both lifecycle axes and its current valuation"
    roles: [ProgramAdmin, DisposalOfficer, SurplusAssessor, ClearanceTechnician, AgencyOfficer, FinanceController]
    code: 200
    input: []
    output: SurplusAsset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "list assets, optionally narrowed by turn-in, parent component, or either lifecycle axis"
    roles: [ProgramAdmin, DisposalOfficer, SurplusAssessor, ClearanceTechnician]
    code: 200
    input: ["turn_in_id?", "component_of_asset_id?", "category?", "disposition_status?", "clearance_status?", "limit?", "offset?"]
    output: SurplusAsset[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/condition-assessments"
    description: "record a federal condition-code assessment against the asset; optimistically concurrent on the asset's version"
    roles: [SurplusAssessor]
    code: 201
    input: [condition_code, functional, repair_cost_estimate_cents, assessed_on, expected_asset_version, "notes?"]
    output: ConditionAssessment
    side_effects:
      - "stamps assessor_user_id from X-User-ID"
      - "re-runs calculations.asset_fair_market_value: re-selects the governing assessment, rewrites SurplusAsset.condition_code and fair_market_value_cents, and sets superseded = true on every non-governing assessment"
      - "drives SurplusAsset.disposition_status INTAKE -> ASSESSED on the first assessment, ASSESSED -> ASSESSED on later ones"
      - "recomputes the parent TurnIn.appraised_total_cents"
      - "increments SurplusAsset.version by 1"
  - method: GET
    path: "/assets/{id}/condition-assessments"
    description: "list every assessment recorded against the asset, newest governing first"
    roles: [ProgramAdmin, DisposalOfficer, SurplusAssessor, AgencyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ConditionAssessment[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/clearance-certificates"
    description: "certify data sanitization or demilitarization of the asset before release"
    roles: [ClearanceTechnician]
    code: 201
    input: [cert_type, method, serials_verified, certified_on, "notes?"]
    output: ClearanceCertificate
    side_effects:
      - "stamps technician_user_id from X-User-ID"
      - "drives SurplusAsset.clearance_status across REQUIRED_PENDING / CLEARED / BLOCKED per §1.2"
      - "cert_type == DEMILITARIZATION with method == DESTROY additionally drives the destruction cascade: asset -> DESTROYED, DRAFT/OPEN lots -> CANCELLED, ACTIVE/WINNING bids -> RETRACTED, an OPEN ScreeningCycle -> CANCELLED and its open requests -> DENIED"
      - "increments SurplusAsset.version by 1"
  - method: GET
    path: "/assets/{id}/clearance-certificates"
    description: "list clearance certificates filed against the asset"
    roles: [ProgramAdmin, DisposalOfficer, ClearanceTechnician, FinanceController]
    code: 200
    input: ["cert_type?", "limit?", "offset?"]
    output: ClearanceCertificate[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/release"
    description: "release custody of the asset to its transferee or auction buyer, recording title, odometer and lien documentation"
    roles: [DisposalOfficer]
    code: 200
    input: ["odometer_disclosure_reading?", "lien_release_reference?", "title_recipient_name?"]
    output: SurplusAsset
    side_effects:
      - "SOLD -> RELEASED or AWARDED_TRANSFER -> RELEASED; stamps released_at"
      - "cascade hop 2: an ACKNOWLEDGED TransferOrder for this asset -> COMPLETED with use_period_end_on computed by calculations.federal_use_period_end"
      - "cascade hop 3: when every child asset of the turn-in is terminal, TurnIn ACCEPTED -> CLOSED"
      - "increments SurplusAsset.version by 1"

  # ---- ScreeningCycle ----------------------------------------------------
  - method: POST
    path: "/screening-cycles"
    description: "open the priority screening cycle for an assessed asset, starting at the STATE_AGENCY tier"
    roles: [DisposalOfficer]
    code: 201
    input: [asset_id, opens_at, tier_window_days]
    output: ScreeningCycle
    side_effects:
      - "status OPEN, current_tier STATE_AGENCY, tier_opened_at = opens_at, tier_advance_count 0"
      - "computes tier_deadline_at via calculations.screening_tier_deadline"
      - "SurplusAsset ASSESSED -> SCREENING"
      - "increments SurplusAsset.version by 1"
  - method: GET
    path: "/screening-cycles/{id}"
    description: "read one screening cycle with its current tier and deadline"
    roles: [ProgramAdmin, DisposalOfficer, AgencyOfficer]
    code: 200
    input: []
    output: ScreeningCycle
    side_effects: []
  - method: GET
    path: "/screening-cycles"
    description: "list screening cycles, optionally narrowed by asset, tier or status"
    roles: [ProgramAdmin, DisposalOfficer, AgencyOfficer]
    code: 200
    input: ["asset_id?", "current_tier?", "status?", "limit?", "offset?"]
    output: ScreeningCycle[]
    side_effects: []
  - method: POST
    path: "/screening-cycles/{id}/advance-tier"
    description: "close the current screening tier and open the next one in the fixed priority order STATE_AGENCY -> LOCAL_GOVERNMENT -> ELIGIBLE_NONPROFIT -> PUBLIC_SALE"
    roles: [DisposalOfficer]
    code: 200
    input: []
    output: ScreeningCycle
    side_effects:
      - "advances current_tier, resets tier_opened_at to the logical clock, recomputes tier_deadline_at, increments tier_advance_count"
      - "advancing from PUBLIC_SALE moves the cycle OPEN -> EXHAUSTED and the asset SCREENING -> AUCTION_ELIGIBLE"
      - "increments ScreeningCycle.version by 1"
  - method: POST
    path: "/screening-cycles/{id}/award"
    description: "award the asset to one submitted screening request, denying all competitors"
    roles: [DisposalOfficer]
    code: 200
    input: [screening_request_id]
    output: ScreeningCycle
    side_effects:
      - "cycle OPEN -> AWARDED; stamps awarded_at and awarded_by_user_id from X-User-ID"
      - "named request SUBMITTED -> APPROVED; every other SUBMITTED or INFO_REQUESTED request -> DENIED with denial_reason LOST_AWARD"
      - "SurplusAsset SCREENING -> AWARDED_TRANSFER"
      - "increments ScreeningCycle.version and SurplusAsset.version by 1"

  # ---- ScreeningRequest --------------------------------------------------
  - method: POST
    path: "/screening-requests"
    description: "file a request for the screened property on behalf of an eligible organization"
    roles: [AgencyOfficer, ProgramAdmin]
    code: 201
    input: [screening_cycle_id, requesting_agency_id, intended_use, justification, needed_by_date]
    output: ScreeningRequest
    side_effects:
      - "status SUBMITTED; tier_at_submission frozen from the cycle's current_tier"
      - "recomputes ScreeningCycle.open_request_count"
  - method: GET
    path: "/screening-requests/{id}"
    description: "read one screening request"
    roles: [ProgramAdmin, DisposalOfficer, AgencyOfficer]
    code: 200
    input: []
    output: ScreeningRequest
    side_effects: []
  - method: GET
    path: "/screening-requests"
    description: "list screening requests, optionally narrowed by cycle, requester or status"
    roles: [ProgramAdmin, DisposalOfficer, AgencyOfficer]
    code: 200
    input: ["screening_cycle_id?", "requesting_agency_id?", "status?", "limit?", "offset?"]
    output: ScreeningRequest[]
    side_effects: []
  - method: POST
    path: "/screening-requests/{id}/request-info"
    description: "send a submitted request back to the requester for more information"
    roles: [DisposalOfficer]
    code: 200
    input: [information_request_note]
    output: ScreeningRequest
    side_effects:
      - "SUBMITTED -> INFO_REQUESTED; records information_request_note"
      - "the request stays inside ScreeningCycle.open_request_count"
      - "increments ScreeningRequest.version by 1"
  - method: POST
    path: "/screening-requests/{id}/resubmit"
    description: "answer an information request and put the request back in contention"
    roles: [AgencyOfficer]
    code: 200
    input: [justification]
    output: ScreeningRequest
    side_effects:
      - "INFO_REQUESTED -> SUBMITTED; replaces justification; increments resubmission_count"
      - "tier_at_submission is NOT re-derived — it stays frozen at the original tier"
      - "increments ScreeningRequest.version by 1"

  # ---- TransferOrder -----------------------------------------------------
  - method: POST
    path: "/transfer-orders"
    description: "issue the transfer document for an awarded screening request and price it against the recipient's tier"
    roles: [DisposalOfficer]
    code: 201
    input: [asset_id, recipient_agency_id, screening_request_id]
    output: TransferOrder
    side_effects:
      - "status ISSUED; stamps issued_by_user_id from X-User-ID"
      - "computes base_transfer_cents, handling_fee_cents and transfer_price_cents via calculations.transfer_order_price"
  - method: GET
    path: "/transfer-orders/{id}"
    description: "read one transfer order with its priced components"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, AgencyOfficer]
    code: 200
    input: []
    output: TransferOrder
    side_effects: []
  - method: GET
    path: "/transfer-orders"
    description: "list transfer orders, optionally narrowed by asset, recipient, source request or status"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, AgencyOfficer]
    code: 200
    input: ["asset_id?", "recipient_agency_id?", "screening_request_id?", "status?", "limit?", "offset?"]
    output: TransferOrder[]
    side_effects: []
  - method: POST
    path: "/transfer-orders/{id}/acknowledge"
    description: "recipient acknowledges receipt of the transfer document, starting its own use period"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: TransferOrder
    side_effects:
      - "ISSUED -> ACKNOWLEDGED; stamps acknowledged_at from the logical clock"
      - "increments TransferOrder.version by 1"
  - method: POST
    path: "/transfer-orders/{id}/void"
    description: "void an issued or acknowledged transfer order and return the asset to screening"
    roles: [DisposalOfficer]
    code: 200
    input: [void_reason]
    output: TransferOrder
    side_effects:
      - "hop 1: TransferOrder -> VOIDED with void_reason recorded"
      - "hop 2 (caused by hop 1): the source ScreeningRequest APPROVED -> DENIED with denial_reason TRANSFER_VOIDED"
      - "hop 3 (caused by hop 2): the ScreeningCycle AWARDED -> OPEN, clearing awarded_at and awarded_by_user_id"
      - "hop 4 (caused by hop 3): SurplusAsset AWARDED_TRANSFER -> SCREENING"
      - "increments TransferOrder.version, ScreeningRequest.version, ScreeningCycle.version and SurplusAsset.version by 1"

  # ---- SaleVenue ---------------------------------------------------------
  - method: POST
    path: "/venues"
    description: "register an auction venue with its concurrency capacity, buyer premium and sales tax rates"
    roles: [ProgramAdmin]
    code: 201
    input: [name, venue_code, concurrent_lot_capacity, buyer_premium_pct, sales_tax_pct]
    output: SaleVenue
    side_effects:
      - "status ACTIVE; active_lot_count 0"
  - method: GET
    path: "/venues/{id}"
    description: "read one venue with its live active-lot count"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: []
    output: SaleVenue
    side_effects: []
  - method: GET
    path: "/venues"
    description: "list venues, optionally narrowed by availability"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SaleVenue[]
    side_effects: []
  - method: POST
    path: "/venues/{id}/status"
    description: "close a venue to new lots"
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: SaleVenue
    side_effects:
      - "ACTIVE -> CLOSED; already-open lots continue to run"
      - "increments SaleVenue.version by 1"

  # ---- AuctionLot --------------------------------------------------------
  - method: POST
    path: "/auction-lots"
    description: "list an auction-eligible asset as a lot at a venue for a sale window, with a computed or overridden reserve"
    roles: [DisposalOfficer]
    code: 201
    input: [asset_id, venue_id, opens_at, closes_at, "reserve_price_cents?"]
    output: AuctionLot
    side_effects:
      - "status DRAFT; assigns lot_number as `<venue_code>-<n>`"
      - "reserve_price_cents from calculations.asset_fair_market_value variant auction_reserve unless overridden, with reserve_source COMPUTED or OFFICER_OVERRIDE accordingly"
      - "computes required_deposit_cents via calculations.bidder_deposit_requirement"
      - "SurplusAsset AUCTION_ELIGIBLE -> LISTED, or ASSESSED -> LISTED on the de-minimis path"
      - "recomputes SaleVenue.active_lot_count; increments SurplusAsset.version by 1"
  - method: GET
    path: "/auction-lots/{id}"
    description: "read one lot with its reserve, deposit requirement and live bid roll-up"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: []
    output: AuctionLot
    side_effects: []
  - method: GET
    path: "/auction-lots"
    description: "list lots, optionally narrowed by asset, venue or status"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: ["asset_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: AuctionLot[]
    side_effects: []
  - method: POST
    path: "/auction-lots/{id}/open"
    description: "open a draft lot for bidding"
    roles: [DisposalOfficer]
    code: 200
    input: []
    output: AuctionLot
    side_effects:
      - "DRAFT -> OPEN"
      - "increments AuctionLot.version by 1"
  - method: POST
    path: "/auction-lots/{id}/close"
    description: "close bidding and settle the lot against its reserve"
    roles: [DisposalOfficer]
    code: 200
    input: []
    output: AuctionLot
    side_effects:
      - "hop 1: OPEN -> CLOSED_MET when a qualifying bid exists, otherwise OPEN -> CLOSED_NO_SALE; stamps closed_at and closed_by_user_id from X-User-ID"
      - "hop 2 (caused by hop 1): the winning Bid ACTIVE -> WINNING (selector: amount_cents DESC, then placed_at ASC, then created_at ASC), every other ACTIVE bid -> OUTBID"
      - "hop 3 (caused by hop 2): a SaleInvoice is created for the winning bidder with lines from calculations.auction_invoice_total and due_at = closed_at + 7 days"
      - "hop 4 (caused by hop 1): SurplusAsset LISTED -> SOLD on CLOSED_MET, or LISTED -> AUCTION_ELIGIBLE on CLOSED_NO_SALE"
      - "recomputes SaleVenue.active_lot_count and Bidder.winning_lot_count"
      - "increments AuctionLot.version and SurplusAsset.version by 1"
  - method: POST
    path: "/auction-lots/{id}/bids"
    description: "place a bid on an open lot"
    roles: [Bidder]
    code: 201
    input: [bidder_id, amount_cents]
    output: Bid
    side_effects:
      - "status ACTIVE; stamps placed_at from the logical clock"
      - "recomputes AuctionLot.high_bid_cents and bid_count"
  - method: GET
    path: "/auction-lots/{id}/bids"
    description: "list bids placed on the lot, highest first"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # ---- Bidder ------------------------------------------------------------
  - method: POST
    path: "/bidders"
    description: "register a prospective public-sale bidder"
    roles: [ProgramAdmin, DisposalOfficer]
    code: 201
    input: [legal_name, email, bidder_type]
    output: Bidder
    side_effects:
      - "status PENDING; all four deposit counters initialised to 0"
  - method: GET
    path: "/bidders/{id}"
    description: "read one bidder with the four deposit custody counters"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: []
    output: Bidder
    side_effects: []
  - method: GET
    path: "/bidders"
    description: "list bidders, optionally narrowed by registration status or class"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController]
    code: 200
    input: ["status?", "bidder_type?", "limit?", "offset?"]
    output: Bidder[]
    side_effects: []
  - method: POST
    path: "/bidders/{id}/status"
    description: "approve, suspend or debar a bidder registration"
    roles: [ProgramAdmin, DisposalOfficer]
    code: 200
    input: [status]
    output: Bidder
    side_effects:
      - "drives the Bidder status machine per §1.2"
      - "status == DEBARRED runs the debarment cascade: hop 1 Bidder -> DEBARRED; hop 2 the bidder's ACTIVE and WINNING bids -> RETRACTED; hop 3 each affected CLOSED_MET lot -> CLOSED_NO_SALE and its ISSUED/PARTIALLY_PAID SaleInvoice -> VOIDED; hop 4 each affected SurplusAsset SOLD -> AUCTION_ELIGIBLE; hop 5 deposit_applied_cents on the voided invoices returns to deposit_held_cents"
      - "increments Bidder.version by 1"
  - method: POST
    path: "/bidders/{id}/end-use-certificate"
    description: "record the bidder's end-use certificate expiry, required to bid on restricted property"
    roles: [ProgramAdmin, DisposalOfficer]
    code: 200
    input: [end_use_certificate_expires_on]
    output: Bidder
    side_effects:
      - "sets end_use_certificate_expires_on; gates validation priority 56"
      - "increments Bidder.version by 1"
  - method: POST
    path: "/bidders/{id}/deposits"
    description: "record a cash deposit from the bidder against future lots"
    roles: [Bidder, FinanceController]
    code: 200
    input: [amount_cents]
    output: Bidder
    side_effects:
      - "adds amount_cents to both deposit_paid_cents and deposit_held_cents, preserving deposit_paid_cents == deposit_held_cents + deposit_applied_cents + deposit_forfeited_cents"
      - "increments Bidder.version by 1"
  - method: GET
    path: "/bidders/{id}/bids"
    description: "list every bid this bidder has placed"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # ---- SaleInvoice -------------------------------------------------------
  - method: GET
    path: "/sale-invoices/{id}"
    description: "read one sale invoice with its per-line money breakdown"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: []
    output: SaleInvoice
    side_effects: []
  - method: GET
    path: "/sale-invoices"
    description: "list sale invoices, optionally narrowed by lot, bidder or status; the only discovery channel for the invoice the close cascade creates"
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, Bidder]
    code: 200
    input: ["auction_lot_id?", "bidder_id?", "status?", "limit?", "offset?"]
    output: SaleInvoice[]
    side_effects: []
  - method: POST
    path: "/sale-invoices/{id}/payments"
    description: "apply a cash payment, optionally consuming the bidder's held deposit first"
    roles: [Bidder, FinanceController]
    code: 200
    input: [amount_cents, "use_deposit?"]
    output: SaleInvoice
    side_effects:
      - "adds amount_cents to amount_paid_cents and recomputes balance_due_cents"
      - "use_deposit == true moves min(bidder.deposit_held_cents, balance_due_cents) from deposit_held_cents to deposit_applied_cents on both the Bidder and the SaleInvoice before the cash is applied, and the moved amount counts as payment too, so amount_paid_cents == (sum of cash amount_cents) + SaleInvoice.deposit_applied_cents and balance_due_cents = total_due_cents - amount_paid_cents"
      - "drives ISSUED/PARTIALLY_PAID -> PARTIALLY_PAID or -> PAID; a settling payment also moves the lot CLOSED_MET -> SETTLED"
      - "increments SaleInvoice.version and Bidder.version by 1"
  - method: POST
    path: "/sale-invoices/{id}/default"
    description: "declare the buyer in default after the payment term lapses, forfeiting any applied deposit"
    roles: [FinanceController, DisposalOfficer]
    code: 200
    input: [default_reason]
    output: SaleInvoice
    side_effects:
      - "ISSUED/PARTIALLY_PAID -> DEFAULTED with default_reason recorded"
      - "moves the invoice's deposit_applied_cents from Bidder.deposit_applied_cents to Bidder.deposit_forfeited_cents; amount_paid_cents is unchanged"
      - "increments SaleInvoice.version and Bidder.version by 1"
  - method: POST
    path: "/sale-invoices/{id}/void"
    description: "void an unsettled invoice, returning any applied deposit to the bidder's held balance"
    roles: [FinanceController, DisposalOfficer]
    code: 200
    input: [void_reason]
    output: SaleInvoice
    side_effects:
      - "ISSUED/PARTIALLY_PAID -> VOIDED with void_reason recorded"
      - "moves the invoice's deposit_applied_cents back to Bidder.deposit_held_cents, restoring deposit_paid_cents == deposit_held_cents + deposit_applied_cents + deposit_forfeited_cents"
      - "increments SaleInvoice.version and Bidder.version by 1"

  # ---- ProceedsDistribution ---------------------------------------------
  - method: POST
    path: "/proceeds-distributions"
    description: "calculate the net proceeds owed back to the turning-in agency for a settled lot; optimistically concurrent on the lot's version"
    roles: [FinanceController]
    code: 201
    input: [auction_lot_id, basis, expected_auction_lot_version]
    output: ProceedsDistribution
    side_effects:
      - "resolves beneficiary_agency_id as the turning-in agency of the lot's asset"
      - "computes distributable_base_cents, service_fee_cents, cost_recovery_cents and net_to_agency_cents via calculations.proceeds_distribution_net for the requested basis"
      - "status CALCULATED; any earlier CALCULATED distribution for the same lot moves to SUPERSEDED"
      - "increments AuctionLot.version by 1"
  - method: GET
    path: "/proceeds-distributions/{id}"
    description: "read one proceeds distribution with its fee and cost-recovery breakdown"
    roles: [ProgramAdmin, FinanceController, AgencyOfficer]
    code: 200
    input: []
    output: ProceedsDistribution
    side_effects: []
  - method: GET
    path: "/proceeds-distributions"
    description: "list proceeds distributions, optionally narrowed by lot, beneficiary or status"
    roles: [ProgramAdmin, FinanceController, AgencyOfficer]
    code: 200
    input: ["auction_lot_id?", "beneficiary_agency_id?", "basis?", "status?", "limit?", "offset?"]
    output: ProceedsDistribution[]
    side_effects: []
  - method: POST
    path: "/proceeds-distributions/{id}/post"
    description: "post a calculated distribution to the beneficiary agency's proceeds ledger"
    roles: [FinanceController]
    code: 200
    input: []
    output: ProceedsDistribution
    side_effects:
      - "CALCULATED -> POSTED; stamps posted_at and posted_by_user_id from X-User-ID"
      - "recomputes Agency.proceeds_account_balance_cents and posted_distribution_count via calculations.agency_proceeds_ledger_balance"
      - "increments ProceedsDistribution.version and Agency.version by 1"
  - method: POST
    path: "/proceeds-distributions/{id}/reverse"
    description: "reverse a posted distribution, compensating the beneficiary ledger exactly"
    roles: [FinanceController]
    code: 200
    input: [reversal_reason]
    output: ProceedsDistribution
    side_effects:
      - "POSTED -> REVERSED with reversal_reason recorded"
      - "recomputes Agency.proceeds_account_balance_cents and posted_distribution_count from the remaining POSTED rows, restoring the pre-post values exactly"
      - "increments ProceedsDistribution.version and Agency.version by 1"

  # ---- Test-driving surface ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock to an arbitrary UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server never falls back to real wall-clock time. Every deadline, sale window, use period and cooldown in this scaffold is evaluated against this logical clock."
    roles: [ProgramAdmin, DisposalOfficer, FinanceController, ClearanceTechnician, SurplusAssessor, AgencyOfficer, Bidder]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock; performs no state transition and stamps no entity"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # ---- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of the seven declared roles, or X-User-ID missing / not resolvable to a row of the role's backing entity"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_FORBIDDEN_AGENCY_SCOPE
    http: 403
    condition: "an AgencyOfficer addressed a turn-in, screening request, transfer order or agency row belonging to a different organization"
  - id: ERR_FORBIDDEN_BIDDER_SCOPE
    http: 403
    condition: "a Bidder addressed a bidder row, bid, deposit or invoice that is not its own"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent or null, has the wrong JSON type, or violates a §1.1 length or numeric-range constraint"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed input carries a value outside the enum's declared set"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_CONDITIONAL_FIELD_REQUIRED
    http: 422
    condition: "vin, odometer_reading or title_number absent for a VEHICLE; demil_code absent when is_restricted == true; federal_use_period_start_on absent when federal_source == true; donee_certification_expires_on absent when federal_donee_status == CERTIFIED"
  - id: ERR_FUTURE_DATE
    http: 422
    condition: "acquisition_date, assessed_on or certified_on is later than the logical clock date"

  # ---- existence ----------------------------------------------------------
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "no Agency row with the addressed or referenced id"
  - id: ERR_TURN_IN_NOT_FOUND
    http: 404
    condition: "no TurnIn row with the addressed or referenced id"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "no SurplusAsset row with the addressed or referenced id"
  - id: ERR_SCREENING_CYCLE_NOT_FOUND
    http: 404
    condition: "no ScreeningCycle row with the addressed or referenced id"
  - id: ERR_SCREENING_REQUEST_NOT_FOUND
    http: 404
    condition: "no ScreeningRequest row with the addressed or referenced id"
  - id: ERR_TRANSFER_ORDER_NOT_FOUND
    http: 404
    condition: "no TransferOrder row with the addressed id"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "no SaleVenue row with the addressed or referenced id"
  - id: ERR_AUCTION_LOT_NOT_FOUND
    http: 404
    condition: "no AuctionLot row with the addressed or referenced id"
  - id: ERR_BIDDER_NOT_FOUND
    http: 404
    condition: "no Bidder row with the addressed or referenced id"
  - id: ERR_SALE_INVOICE_NOT_FOUND
    http: 404
    condition: "no SaleInvoice row with the addressed id"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "no ProceedsDistribution row with the addressed id"

  # ---- uniqueness and referential integrity ------------------------------
  - id: ERR_DUPLICATE_AGENCY_CODE
    http: 409
    condition: "another Agency already uses the submitted agency_code"
  - id: ERR_DUPLICATE_VENUE_CODE
    http: 409
    condition: "another SaleVenue already uses the submitted venue_code"
  - id: ERR_DUPLICATE_BIDDER_EMAIL
    http: 409
    condition: "another Bidder already uses the submitted email (case-insensitive)"
  - id: ERR_ASSET_COMPONENT_CYCLE
    http: 422
    condition: "component_of_asset_id names the asset itself, an asset on a different turn-in, or an ancestor of the asset being created — the component graph must stay acyclic"

  # ---- optimistic concurrency (§1.2.1) -----------------------------------
  - id: ERR_STALE_ASSET_VERSION
    http: 412
    condition: "expected_asset_version does not equal the addressed SurplusAsset's current version"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_auction_lot_version does not equal the referenced AuctionLot's current version"

  # ---- segregation of duties ---------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting ClearanceTechnician also appraised the asset, or the posting FinanceController also closed the lot"

  # ---- state preconditions -----------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed row's current state does not admit the requested trigger in its §1.2 state machine, including every attempt from a terminal state and every repeat of an already-applied trigger"
  - id: ERR_TURN_IN_NOT_DRAFT
    http: 409
    condition: "an asset was submitted against a TurnIn whose status is not DRAFT"
  - id: ERR_LOT_NOT_OPEN
    http: 409
    condition: "a bid was placed on a lot that is not OPEN, or outside the lot's [opens_at, closes_at) window"
  - id: ERR_ASSET_NOT_ASSESSABLE
    http: 409
    condition: "a condition assessment was filed against an asset whose disposition_status is neither INTAKE nor ASSESSED"
  - id: ERR_BIDDER_NOT_REGISTERED
    http: 403
    condition: "the acting Bidder's status is PENDING, SUSPENDED or DEBARRED"
  - id: ERR_AGENCY_SUSPENDED
    http: 409
    condition: "the referenced organization's status is SUSPENDED"
  - id: ERR_ASSET_NOT_DISPOSABLE
    http: 409
    condition: "the asset's disposition_status does not admit the requested disposal channel — including a below-de-minimis asset pushed into screening and an above-de-minimis ASSESSED asset listed for auction without completing screening"
  - id: ERR_TURN_IN_NOT_ASSESSED
    http: 409
    condition: "a turn-in with no child assets was submitted, or a turn-in with an unvalued child asset was accepted"
  - id: ERR_VENUE_CLOSED
    http: 409
    condition: "a lot was created at a venue whose status is CLOSED"

  # ---- business rules: safety / compliance / regulatory ------------------
  - id: ERR_FEDERAL_USE_PERIOD_ACTIVE
    http: 409
    condition: "a federal_source asset was pushed into screening or auction before the logical clock date reached federal_use_period_end_on"
  - id: ERR_SANITIZATION_NOT_CERTIFIED
    http: 409
    condition: "release was attempted on a data-bearing asset with no verified DATA_SANITIZATION certificate — clearance_status is REQUIRED_PENDING or BLOCKED"
  - id: ERR_DEMIL_NOT_CERTIFIED
    http: 409
    condition: "release was attempted on a restricted asset with no verified DEMILITARIZATION certificate for its demil_code"
  - id: ERR_END_USE_CERTIFICATE_REQUIRED
    http: 409
    condition: "a bid was placed on a restricted asset's lot by a bidder whose end_use_certificate_expires_on is null or earlier than the logical clock date"
  - id: ERR_CLEARANCE_METHOD_MISMATCH
    http: 422
    condition: "method is outside the cert_type's admitted family — DATA_SANITIZATION with MUTILATE or DESTROY, or DEMILITARIZATION with NIST_CLEAR, NIST_PURGE or DEGAUSS — or method == DESTROY was filed against an asset whose demil_code is not Q"
  - id: ERR_CLEARANCE_NOT_APPLICABLE
    http: 409
    condition: "a certificate was filed against an asset whose clearance_status is NOT_REQUIRED"
  - id: ERR_DONEE_CERTIFICATION_INVALID
    http: 409
    condition: "an ELIGIBLE_NONPROFIT recipient, or any recipient of a federal_source asset, lacks a CERTIFIED federal_donee_status or its donee_certification_expires_on is earlier than the logical clock date"

  # ---- business rules: constraint satisfaction ---------------------------
  - id: ERR_TIER_PRIORITY_VIOLATION
    http: 409
    condition: "the requesting organization's agency_type does not equal the cycle's current_tier, or the cycle is at PUBLIC_SALE where no screening request is admitted"
  - id: ERR_ODOMETER_DISCLOSURE_REQUIRED
    http: 422
    condition: "a VEHICLE asset was released without odometer_disclosure_reading and title_recipient_name, or with a disclosed reading below the recorded odometer_reading"
  - id: ERR_LIEN_NOT_RELEASED
    http: 409
    condition: "an asset carrying a lien_holder_name was released without a lien_release_reference"
  - id: ERR_REQUEST_CYCLE_MISMATCH
    http: 409
    condition: "the awarded request belongs to a different cycle, or the transfer order's asset_id / recipient_agency_id do not match the APPROVED request's cycle asset and requesting organization"
  - id: ERR_TIER_WINDOW_EXPIRED
    http: 409
    condition: "a screening request was filed or resubmitted outside the closed interval [tier_opened_at, tier_deadline_at]"
  - id: ERR_TIER_WINDOW_OPEN
    http: 409
    condition: "advance-tier was called while the tier still has open requests and the logical clock has not reached tier_deadline_at"
  - id: ERR_VENUE_CAPACITY_CONFLICT
    http: 409
    condition: "the venue already hosts concurrent_lot_capacity DRAFT or OPEN lots whose half-open windows intersect the new lot's window"
  - id: ERR_ASSET_WINDOW_CONFLICT
    http: 409
    condition: "the new lot's opens_at falls earlier than the asset's latest prior lot closes_at plus the 24-hour relist cooldown"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "opens_at is earlier than the logical clock, or closes_at is not strictly later than opens_at"

  # ---- business rules: fiscal --------------------------------------------
  - id: ERR_BID_BELOW_RESERVE
    http: 422
    condition: "amount_cents is below the lot's reserve_price_cents"
  - id: ERR_BID_INCREMENT_NOT_MET
    http: 422
    condition: "the lot already has an ACTIVE bid and amount_cents is below high_bid_cents + 2500"
  - id: ERR_BID_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "the bidder's deposit_held_cents is below the lot's required_deposit_cents"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a payment's amount_cents is not positive, or exceeds the invoice's balance_due_cents"
  - id: ERR_DISTRIBUTION_BASIS_UNAVAILABLE
    http: 409
    condition: "ACCRUAL was requested for a lot that is not CLOSED_MET or SETTLED, or CASH was requested for a lot whose non-VOIDED SaleInvoice is not PAID or DEFAULTED"
  - id: ERR_DISTRIBUTION_ALREADY_POSTED
    http: 409
    condition: "a POSTED ProceedsDistribution already exists for the same auction_lot_id"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:

  - name: ProgramAdmin
    description: "state surplus property agency administrator: maintains the participant registry, donee certifications, auction venues and bidder registrations; reads everything but never appraises, certifies clearance, awards property or posts money"
    identity: opaque
    exclusive_operations:
      - "POST /agencies"
      - "POST /agencies/{id}/status"
      - "POST /agencies/{id}/donee-certification"
      - "POST /venues"
      - "POST /venues/{id}/status"
    shared_operations:
      - "POST /turn-ins, POST /assets, POST /turn-ins/{id}/submit (shared with AgencyOfficer)"
      - "POST /screening-requests (shared with AgencyOfficer)"
      - "POST /bidders, POST /bidders/{id}/status, POST /bidders/{id}/end-use-certificate (shared with DisposalOfficer)"
      - "all GET reads except GET /assets/{id}/condition-assessments filtering, and POST /_clock/set_current_utc"

  - name: AgencyOfficer
    description: "officer of a turning-in or requesting organization; acts only within its own agency's scope"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /screening-requests/{id}/resubmit"
      - "POST /transfer-orders/{id}/acknowledge"
    shared_operations:
      - "POST /turn-ins, POST /assets, POST /turn-ins/{id}/submit (shared with ProgramAdmin)"
      - "POST /screening-requests (shared with ProgramAdmin)"
      - "GET /agencies/{id}, GET /turn-ins/{id}, GET /assets/{id}, GET /screening-cycles, GET /screening-requests, GET /transfer-orders, GET /proceeds-distributions — all narrowed to its own agency by validation priority 4"
      - "POST /_clock/set_current_utc"

  - name: SurplusAssessor
    description: "condition inspector who assigns federal condition codes and repair estimates; may never certify the clearance of an asset it appraised"
    identity: opaque
    exclusive_operations:
      - "POST /assets/{id}/condition-assessments"
    shared_operations:
      - "GET /turn-ins, GET /turn-ins/{id}, GET /assets, GET /assets/{id}, GET /assets/{id}/condition-assessments"
      - "POST /_clock/set_current_utc"

  - name: DisposalOfficer
    description: "screening and sales officer: reviews turn-ins, runs the priority screening ladder, issues and voids transfer documents, lists and closes auction lots, and releases custody"
    identity: opaque
    exclusive_operations:
      - "POST /turn-ins/{id}/review"
      - "POST /screening-cycles"
      - "POST /screening-cycles/{id}/advance-tier"
      - "POST /screening-cycles/{id}/award"
      - "POST /screening-requests/{id}/request-info"
      - "POST /transfer-orders"
      - "POST /transfer-orders/{id}/void"
      - "POST /auction-lots"
      - "POST /auction-lots/{id}/open"
      - "POST /auction-lots/{id}/close"
      - "POST /assets/{id}/release"
    shared_operations:
      - "POST /bidders, POST /bidders/{id}/status, POST /bidders/{id}/end-use-certificate (shared with ProgramAdmin)"
      - "POST /sale-invoices/{id}/default, POST /sale-invoices/{id}/void (shared with FinanceController)"
      - "all GET reads and POST /_clock/set_current_utc"

  - name: ClearanceTechnician
    description: "sanitization and demilitarization technician who signs the release gates; barred by segregation of duties from certifying any asset it appraised as SurplusAssessor"
    identity: opaque
    exclusive_operations:
      - "POST /assets/{id}/clearance-certificates"
    shared_operations:
      - "GET /assets, GET /assets/{id}, GET /assets/{id}/clearance-certificates"
      - "POST /_clock/set_current_utc"

  - name: Bidder
    description: "registered public-sale bidder acting as its own Bidder row"
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /auction-lots/{id}/bids"
    shared_operations:
      - "POST /bidders/{id}/deposits, POST /sale-invoices/{id}/payments (shared with FinanceController)"
      - "GET /bidders/{id}, GET /bidders/{id}/bids, GET /sale-invoices/{id}, GET /sale-invoices, GET /auction-lots, GET /auction-lots/{id}, GET /venues, GET /venues/{id} — own rows only per validation priority 5"
      - "POST /_clock/set_current_utc"

  - name: FinanceController
    description: "agency finance officer who settles invoices and distributes net proceeds back to the turning-in agencies; barred by segregation of duties from posting a distribution for a lot it closed"
    identity: opaque
    exclusive_operations:
      - "POST /proceeds-distributions"
      - "POST /proceeds-distributions/{id}/post"
      - "POST /proceeds-distributions/{id}/reverse"
    shared_operations:
      - "POST /bidders/{id}/deposits, POST /sale-invoices/{id}/payments (shared with Bidder)"
      - "POST /sale-invoices/{id}/default, POST /sale-invoices/{id}/void (shared with DisposalOfficer)"
      - "GET /agencies, GET /agencies/{id}, GET /assets/{id}, GET /assets/{id}/clearance-certificates, GET /transfer-orders, GET /auction-lots, GET /auction-lots/{id}, GET /auction-lots/{id}/bids, GET /bidders, GET /bidders/{id}, GET /bidders/{id}/bids, GET /sale-invoices, GET /sale-invoices/{id}, GET /proceeds-distributions, GET /proceeds-distributions/{id}, GET /venues, GET /venues/{id}"
      - "POST /_clock/set_current_utc"
