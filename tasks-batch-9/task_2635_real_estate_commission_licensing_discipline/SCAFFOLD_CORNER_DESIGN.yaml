              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /commission/education-providers/00000000-0000-0000-0000-0000000000ff/instructors"
              payload: { full_name: "Ghost Teacher", credential_type: "ATTORNEY" }
