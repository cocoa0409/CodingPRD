      - name: close_referential_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_OWNERSHIP_INCOMPLETE]
        distinguishing_aspect: |
          Closing violates BOTH the referential completeness check (FEE_OWNER pct sum 150 != 100, category business_referential, priority 9)
          and the temporal waiting-period check (clock == funded_at < funded_at + 3 days, category business_temporal, priority 11);
          the lower-priority-number referential check wins -> ERR_OWNERSHIP_INCOMPLETE.
        test_recipe:
          setup:
            - "Escrow FUNDED at clock 2026-06-01 on an AGREED negotiation; after funding an extra FEE_OWNER(50%) is added so FEE_OWNER pct sums to 150; clock left at 2026-06-01 (waiting period not elapsed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
