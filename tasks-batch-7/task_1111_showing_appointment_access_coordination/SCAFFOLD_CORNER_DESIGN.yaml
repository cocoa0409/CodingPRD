  # ============================ Cross-Cutting Complexity Layers (from profile)
  - section: complexity_layers
    instances:
      - name: occ_policy_update_happy_path
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-policy-update-occ]"]
        distinguishing_aspect: "PATCH policy with the current expected_listing_version succeeds and increments Listing.version by exactly 1 (the OCC guard's positive leg)."
        test_recipe:
          setup: ["listing created; version captured at creation"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "OC S", contact_email: "oc@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "OC LA", license_number: "LIC-OC-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "61 Occ Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "PATCH /showing-desk/listings/${l_id}/policy", payload: { buffer_minutes: 45, expected_listing_version: "${l_v}" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_v2: $.data.version, l_buf: $.data.buffer_minutes } }
          assert:
            - "PATCH succeeds; buffer_minutes == 45; version == l_v + 1 (increments Listing.version by 1)"
      - name: occ_policy_update_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-policy-update-occ]", "errors[ERR_STALE_LISTING_VERSION]"]
        distinguishing_aspect: "A second PATCH carrying the pre-update version (l_v - 1 relative to current) is rejected with 412 ERR_STALE_LISTING_VERSION and leaves buffer_minutes unchanged."
        test_recipe:
          setup: ["listing created; one successful policy PATCH already advanced the version"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "OC2 S", contact_email: "oc2@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "OC2 LA", license_number: "LIC-OC2-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "63 Occ St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "PATCH /showing-desk/listings/${l_id}/policy", payload: { buffer_minutes: 45, expected_listing_version: "${l_v}" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_v2: $.data.version } }
          trigger:
            - { call: "PATCH /showing-desk/listings/${l_id}/policy", payload: { buffer_minutes: 90, expected_listing_version: "${l_v2} - 1" }, as: ListingAgent, as_user_id: "${la_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412 and error_id == ERR_STALE_LISTING_VERSION"
            - "GET listing afterwards: buffer_minutes still == 45"
      - name: occ_seller_settings_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[seller-approval-settings-occ]", "errors[ERR_STALE_SELLER_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on a different parent (Seller): after one settings PATCH bumps Seller.version, replaying the stale version yields 412 ERR_STALE_SELLER_VERSION."
        test_recipe:
          setup: ["seller created; settings PATCHed once"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "OC3 S", contact_email: "oc3@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "PATCH /showing-desk/sellers/${s_id}/approval-settings", payload: { approval_timeout_minutes: 120, expected_seller_version: "${s_v}" }, as: Seller, as_user_id: "${s_id}", captures: { s_v2: $.data.version } }
          trigger:
            - { call: "PATCH /showing-desk/sellers/${s_id}/approval-settings", payload: { auto_approve: true, expected_seller_version: "${s_v2} - 1" }, as: Seller, as_user_id: "${s_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412 and error_id == ERR_STALE_SELLER_VERSION"
            - "GET seller afterwards: auto_approve still == false, approval_timeout_minutes == 120"
      - name: cascade_layer_withdraw_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.Listing.ACTIVE_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: withdraw_cascade_depth3
          rationale: "Depth-3 cascade asserted hop-by-hop in the named §1.8 instance."
      - name: cascade_layer_suspension_corner
        claim_type: cascading_side_effects
        grounds: [state_machines.ShowingRequest.CONFIRMED_to_NO_SHOW]
        excluded_because:
          difficulty_instance: no_show_suspension_cascade_depth4
          rationale: "Depth-4 suspension cascade asserted hop-by-hop in the named §1.8 instance."
      - name: dual_variant_layer_corner
        claim_type: dual_variant_calculation
        grounds: [calculations.calc_access_window, calculations.calc_seller_report_metrics]
        excluded_because:
          difficulty_instance: access_window_vacant_vs_occupied
          rationale: "Both dual-variant calculations exercised by named §1.8 instances (access_window_vacant_vs_occupied, report_provisional_vs_final)."

  # ================================================ Consistency Model (immediate)
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_confirm
        claim_type: immediate_consistency
        grounds: [complexity_profile, entities.Listing.fields.confirmed_showing_count]
        distinguishing_aspect: "Consistency model is immediate: the confirm response itself shows CONFIRMED, and a subsequent GET of the listing in the same moment already reflects confirmed_showing_count == 1 (no lag, no async reconciliation)."
        test_recipe:
          setup: ["VACANT auto listing; request APPROVED"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "IM LA", license_number: "LIC-IM-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "IM BA", license_number: "LIC-IM-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-im" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "IM S", contact_email: "im@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "65 Immediate Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_st: $.data.status } }
            - { call: "GET /showing-desk/listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { l_cc: $.data.confirmed_showing_count } }
          assert:
            - "confirm response status == CONFIRMED"
            - "immediately after, listing confirmed_showing_count == 1"
