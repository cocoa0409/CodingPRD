- rule_id: priority_pair_validation_conflict
  instances:
  - name: release_state_error_outranks_joint_safety_error
    grounds:
    - validations[priority=16]
    - validations[priority=28]
    - validations[priority=29]
    - errors[ERR_LOT_STATE_INVALID]
    - errors[ERR_JOINT_INTEGRITY_FAILURE]
    - errors[ERR_CONFORMANCE_BELOW_MINIMUM]
    distinguishing_aspect: 'Category pair state (priority 16, 409) versus business_safety (priorities 28 and 29, 422) on POST /production-lots/{id}/release: all three predicates are violated at once and
      the state error must win with ERR_LOT_STATE_INVALID.'
    test_recipe:
      setup:
      - Product FG-EXT-24-IA is DESIGN_FROZEN on revision A (required_pull_force_lbf 450.00).
      - LOT-0001 has produced_units 400 and four joint samples; sample 4 pulled 400.00 lbf and FAILED.
      - conformance_index is -0.50, below MIN_CONFORMANCE_INDEX 2.00, and joint_fail_count is 1.
      - LOT-0001 was then quarantined, so its status is QUARANTINED rather than IN_PROCESS.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
