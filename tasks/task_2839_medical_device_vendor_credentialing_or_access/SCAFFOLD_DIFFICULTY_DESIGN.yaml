              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9701_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_9701_id}", vendor_rep_id: "${rep_nia_id}", requested_role: "TECHNICAL_SUPPORT" }
              as: VendorAdmin
