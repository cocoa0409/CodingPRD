      - name: corner_cyclic_shape_loop_counter_is_respected
        claim_type: cyclic
        grounds: ["state_machines.ExemptionAnalysis.RETURNED_to_SUBMITTED", "entities.ExemptionAnalysis.fields.revision_round"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / analysis_return_then_resubmit_increments_revision_round_and_reevaluates
          rationale: "That instance drives DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED and asserts revision_round == 1, which is exactly the cyclic-shape loop-counter claim."

      - name: corner_parallel_dimensions_change_independently
        claim_type: parallel
        grounds: ["state_machines.ReclassificationCase.dimension.communication_status", "state_machines.ReclassificationCase.dimension.pay_conversion_status"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / communication_dimension_escalates_and_renotifies_while_pay_dimension_holds
          rationale: "That instance walks the communication axis through three transitions while asserting the pay axis stays PENDING with a null rate."

      - name: corner_compound_position_status_is_derived_from_its_analysis
        claim_type: compound
        grounds: ["state_machines.Position.dimension.classification_status", "entities.Position.fields.classification_status"]
        excluded_because:
          difficulty_instance: transitive_cascade / nonexempt_determination_cascades_four_hops_to_frozen_project_posture
          rationale: "Hop 2 of that cascade asserts Position.classification_status is re-derived to MISCLASSIFIED from the analysis transition alone, with no endpoint writing it directly."

      - name: corner_guarded_transition_needs_a_cross_entity_state
        claim_type: guarded transitions
        grounds: ["validations[priority=7]", "state_machines.Interview.SCHEDULED_to_COMPLETED"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / interview_completion_blocked_by_project_stage_after_remediation_starts
          rationale: "That instance is exactly the guarded form A->B only if the grandparent AuditProject is in FIELDWORK."

      - name: corner_cascade_down_to_non_terminal_children_only
        claim_type: Cascade down
        grounds: ["calculations.reanalysis_requirement", "state_machines.Interview.ATTESTED_to_VOIDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / duties_change_trigger_cascades_six_hops_back_to_open_posture
          rationale: "That instance asserts the DUTIES_CHANGE trigger voids the attested interviews and supersedes the analysis, i.e. the parent-to-children cascade end to end."

      - name: corner_ledger_sync_refreshes_ancestor_derived_fields
        claim_type: Ledger sync
        grounds: ["calculations.project_remediation_posture", "entities.AuditProject.fields.open_misclassified_headcount"]
        excluded_because:
          difficulty_instance: compensating_invariant / rescinding_a_determination_restores_the_open_misclassified_headcount_ledger
          rationale: "That instance reconciles the ancestor headcount ledger before and after the rescission, including the family score returning to 88 rather than to the cap minus 25."

      - name: corner_compensation_reverses_every_original_side_effect
        claim_type: Compensation
        grounds: ["state_machines.ReclassificationCase.CONVERTED_to_REVERTED", "entities.AuditProject.fields.converted_annual_payroll_delta_cents"]
        excluded_because:
          difficulty_instance: compensating_invariant / reverting_a_pay_conversion_restores_the_converted_payroll_delta_ledger
          rationale: "That instance asserts the signed money ledger returns to exactly 0 and every conversion field is cleared, with no drift on committed_correction_cents."

