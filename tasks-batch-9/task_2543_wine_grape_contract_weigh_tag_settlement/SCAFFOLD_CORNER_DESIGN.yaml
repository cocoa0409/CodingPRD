            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-13", varietal: "MERLOT", acres: 20.0001, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
