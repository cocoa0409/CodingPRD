      - name: duplicate_domain_is_blocked_until_the_first_is_invalidated
        claim_type: conditional_validation
        grounds:
          - validations[priority=26]
        distinguishing_aspect: |
          The uniqueness constraint counts only SCHEDULED and COMPLETED
          assessments, so the same domain is refused while the first attempt
          lives and permitted the moment that attempt is INVALIDATED - a
          re-assessment path that a naive "one row per domain" check would close.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One open case with a single SCHEDULED COMMUNICATION assessment by the ECSE teacher, 09:00-10:00 at the district centre."
