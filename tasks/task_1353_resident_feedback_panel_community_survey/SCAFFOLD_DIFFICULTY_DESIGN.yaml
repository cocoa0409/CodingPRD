  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: invitation_washout_buffer_window
        grounds:
          - calculations.invitation_dispatch_gates
          - errors[ERR_CONTACT_WASHOUT_VIOLATION]
          - entities.Panelist.fields.last_contacted_at
        distinguishing_aspect: |
          Pairwise half-open buffer semantics on the Panelist resource: the interval
          [last_contacted_at, last_contacted_at + 7d) is occupied; a dispatch 6 days
          after the last send is rejected while one at exactly +7 days succeeds —
          distinct from the sibling's aggregate sliding-window capacity semantics.
        test_recipe:
          setup:
            - "Cell target 10; P1 ACTIVE; locked instrument"
            - "W1 08-02..08-31 FIELDING; P1 invited 2026-08-03 (last_contacted_at 08-03)"
            - "W2 08-05..08-31 armed 08-04, FIELDING from 08-06"
