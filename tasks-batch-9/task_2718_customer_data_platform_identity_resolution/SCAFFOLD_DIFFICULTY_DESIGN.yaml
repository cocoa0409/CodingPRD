  # =============================================================================
  # RULE 6 — boundary_precision_check
  # Differentiation required by §0.5: DIFFERENT metrics AND distinct endpoints. Instance 1 is
  # the 4-decimal confidence metric at exact threshold equality on POST /cdp/identity-links;
  # instance 2 is a zero-cardinality collection boundary on
  # POST /cdp/deletion-requests/{deletionRequestId}/propagate.
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: confidence_exactly_at_review_floor_creates_link
        grounds:
          - calculations.identity_match_confidence
          - entities.MatchRule.fields.review_floor
          - validations[priority=40]
          - errors[ERR_CONFIDENCE_BELOW_FLOOR]
          - endpoints[POST /cdp/identity-links]
        distinguishing_aspect: |
          Metric: the 4-decimal identity_match_confidence at exact threshold equality, on
          POST /cdp/identity-links. Evidence {email 1.0, phone 1.0, name null, address null}
          under STRICT_ZERO yields exactly 0.6500 == review_floor and the link IS created
          (inclusive), while {email 1.0, phone 0.5, name null, address 0.5} yields 0.6000, one
          notch below, and is refused with ERR_CONFIDENCE_BELOW_FLOOR.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem POS_BOUND and one PROMOTED batch of four fully valid records, so four RESOLVED / NORMAL Profiles exist."
            - "One PROBABILISTIC MatchRule PROB_BOUND: STRICT_ZERO, review_floor 0.65, auto_merge_threshold 0.92, min_precision 0.40, confirmed_count 0, rejected_count 0."
