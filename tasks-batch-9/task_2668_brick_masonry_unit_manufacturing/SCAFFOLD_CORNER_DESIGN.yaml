  # =======================================================================
  # SECTION 8 - CROSS-CUTTING COMPLEXITY LAYERS
  # complexity_profile.complexity_layers declares four active layers:
  # selector_policy, cascading_side_effects, dual_variant_calculation and
  # optimistic_concurrency. Every entry in the section 1.2.1 concurrency_rules
  # list gets its own stale-version instance below, keyed on that rule's
  # declared write_endpoint and occ_field. The cascade and dual-variant layers
  # are already carried end-to-end by the difficulty design, so they appear
  # here as stubs that name the owning instance.
  # =======================================================================
  - section: complexity_layers
    instances:
      - name: appending_a_clay_pit_with_a_stale_formulation_version_is_refused_and_changes_nothing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[formulation-component-stale]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /formulations/{id}/components]
        distinguishing_aspect: "Appending is additive and always legal against a DRAFT formulation, so the formulation's status cannot express the conflict - only the version can. The refused append is then retried with the observed version and must succeed, proving the rejection left no partial component behind and that version advanced exactly once per accepted write."
        test_recipe:
          setup:
            - "Plant P1 with a CLAY pit and a SHALE pit"
            - "DRAFT formulation F1 observed at version v1 by two writers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["TRUCK_MOUNTED_FORKLIFT"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
          trigger:
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /formulations/${f1}"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { after_reject_version: "$.data.version", after_reject_total: "$.data.component_share_total_pct" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v3: "$.data.version" }
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1_status: "$.data.status", f1_grade: "$.data.computed_durability_grade" }
          assert:
            - "The first append returns 201 and ${f1v2} differs from ${f1v1} - every accepted write advances the version"
            - "${e_stale} == ERR_STALE_VERSION with HTTP 412, not 409 and not ERR_COMPONENT_SHARE_TOTAL_INVALID: the stale append was arithmetically fine, it was merely blind"
            - "${after_reject_version} == ${f1v2} and ${after_reject_total} == 50.00 - the refused append created no component and did not advance the version"
            - "The retry with ${f1v2} returns 201 and ${f1v3} differs from ${f1v2}"
            - "${f1_status} == QUALIFIED and ${f1_grade} == SW - shares now total exactly 100.00 and the 50/50 body computes absorption_index 8.00"

      - name: loading_a_second_car_with_a_stale_kiln_run_version_is_refused_and_the_position_stays_free
