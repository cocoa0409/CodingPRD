# =============================================================================
# SCAFFOLD — task_3170_scheduled_train_plan_car_trip_plan_compliance
# Scheduled Train Plan & Car Trip Plan Compliance (Union Pacific)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# sibling files and are intentionally NOT top-level keys here.
# =============================================================================

scenario: |
  Scheduled Train Plan & Car Trip Plan Compliance (Union Pacific): train plan
  design specifying scheduled departures, blocking and classification at each
  yard, car trip plan assignment giving each shipment a planned itinerary with
  connection times, terminal dwell and car velocity measurement against plan
  with exception investigation, crew availability and hours-of-service
  constraints affecting departure adherence, locomotive and car distribution
  planning to keep resources positioned, customer service commitments on
  first-mile pickup and last-mile delivery windows, service recovery when a
  missed connection cascades across the network, capacity and network fluidity
  metrics guiding train plan revision

domain_name: scheduled-train-plan-compliance
api_prefix: /rail

complexity_profile:
  primary_archetype: quota_allocation        # finite per-day crew pools, yard capacity, locomotive inventories competed for, reserved, committed, released
  secondary_archetype: posture_driven_gating # Yard.posture (derived from dwell vs benchmark) gates trip-plan assignment, shipment creation, and departure finalization
  complexity_layers:
    - optimistic_concurrency                 # OCC on TrainPlan.version and Shipment.version
    - cascading_side_effects                 # missed connection -> next leg MISSED -> downstream connection MISS; finalize -> cascading crew-pool release
    - dual_variant_calculation               # plan_velocity_mph vs actual_velocity_mph; scheduled_dwell vs observed_dwell aggregation
    - rate_threshold_triggers                # dwell overage vs benchmark -> yard posture demotion; HOS balance -> crew eligibility
    - derived_field_reconciliation           # posture, car_velocity_mph, compliance_status recomputed from events
    - scheduled_deferred_actions             # departures, first-mile pickups, last-mile deliveries anchored to the logical clock
  entity_topology: flat                      # peer entities with FK references; no nested URL paths
  state_machine_shape: compound              # posture_driven yard gating + cyclic crew-pool epoch loop + linear legs with MISS forks
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # TripLeg -> Yard, Shipment -> Customer, TrainDeparture -> TrainPlan/CrewPool
  role_model: peer_roles                     # each role owns a distinct resource slice; reads shared
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TrainPlan
    parent: null
    common_fields: true
    fields:
      - { name: train_symbol, type: string, source: input, description: "Unique train identifier, e.g. MNPRV-14" }
      - { name: origin_yard_id, type: string, source: input, description: "FK -> Yard.id; departure yard" }
      - { name: destination_yard_id, type: string, source: input, description: "FK -> Yard.id; arrival yard; MUST differ from origin_yard_id" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Planned departure instant (ISO 8601 UTC)" }
      - { name: cutoff_minutes, type: integer, source: input, description: "Minutes before scheduled_departure_utc by which cars must arrive to make this train; >= 1" }
      - { name: frequency_mask, type: array, source: input, description: "Non-empty subset of [MON, TUE, WED, THU, FRI, SAT, SUN]; days this train operates" }
      - { name: route_distance_miles, type: number, source: input, description: "Origin-to-destination rail miles; > 0" }
      - { name: dwell_benchmark_hours, type: number, source: input, description: "Yard dwell benchmark this plan enforces at origin and destination; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Yard
    parent: null
    common_fields: true
    fields:
      - { name: yard_code, type: string, source: input, description: "Unique yard code, e.g. NPL (North Platte)" }
      - { name: dwell_benchmark_hours, type: number, source: input, description: "Benchmark terminal dwell; posture thresholds derive from it; > 0" }
      - { name: classification_capacity_cars, type: integer, source: input, description: "Max cars the yard can classify per day; >= 1" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | CONGESTED | EMBARGOED; derived from current dwell overage vs dwell_benchmark_hours and recomputed on every CarEvent at this yard" }
      - { name: current_dwell_overage_hours, type: number, source: computed, default: 0, description: "Net dwell overage across cars dwelling IN_YARD here (see yard_posture_recompute); floored at 0" }

  - name: CrewPool
    parent: null
    common_fields: true
    fields:
      - { name: home_yard_id, type: string, source: input, description: "FK -> Yard.id; yard this pool's crews are based at" }
      - { name: craft, type: enum, source: input, description: "CONDUCTOR | ENGINEER" }
      - { name: service_date, type: string, source: input, description: "Service day, YYYY-MM-DD; a pool covers exactly one calendar day" }
      - { name: crews_available, type: integer, source: input, description: "Crews in the pool at epoch open; >= 1" }
      - { name: crews_booked, type: integer, source: computed, default: 0, description: "Crews currently committed from this pool (booked minus released)" }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED | REOPENED" }

  - name: Locomotive
    parent: null
    common_fields: true
    fields:
      - { name: unit_number, type: string, source: input, description: "Unique locomotive unit number, e.g. UP 8821" }
      - { name: current_yard_id, type: string, source: input, description: "FK -> Yard.id; yard where the unit is positioned" }
      - { name: horsepower, type: integer, source: input, description: "Rated horsepower; >= 1000" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | BAD_ORDER" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Unique customer account code" }
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: service_credit_balance, type: integer, source: computed, default: 0, description: "Service-coupon credits (whole units) earned from missed commitments; debited only by explicit adjustment" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billing customer" }
      - { name: origin_yard_id, type: string, source: input, description: "FK -> Yard.id; first-mile origin" }
      - { name: destination_yard_id, type: string, source: input, description: "FK -> Yard.id; last-mile destination; MUST differ from origin_yard_id" }
      - { name: car_count, type: integer, source: input, description: "Number of cars in the shipment; >= 1" }
      - { name: first_mile_pickup_by, type: datetime, source: input, description: "Commitment: local pickup must complete by this instant" }
      - { name: last_mile_delivery_by, type: datetime, source: input, description: "Commitment: final placement must complete by this instant" }
      - { name: committed_route_miles, type: number, source: input, description: "Total rail miles the trip plan must cover end-to-end; > 0" }
      - { name: trip_plan_status, type: enum, source: computed, default: UNASSIGNED, description: "UNASSIGNED | ASSIGNED | MISSED_CONNECTION | REPLANNED" }
      - { name: compliance_status, type: enum, source: computed, default: ON_PLAN, description: "ON_PLAN | AT_RISK | OFF_PLAN; see shipment_compliance" }
      - { name: car_velocity_mph, type: number, source: computed, default: null, description: "Actual end-to-end velocity once delivered (see actual_velocity)" }
      - { name: total_missed_connections, type: integer, source: computed, default: 0, description: "Count of TripLeg connection misses on this shipment" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_TRANSIT | DELIVERED | CANCELLED" }

  - name: TripLeg
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; owning shipment" }
      - { name: train_plan_id, type: string, source: input, description: "FK -> TrainPlan.id; train this leg rides" }
      - { name: leg_sequence, type: integer, source: input, description: "1-based position in the itinerary; legs of a shipment MUST form a contiguous 1..N sequence" }
      - { name: planned_connection_time, type: datetime, source: computed, description: "Scheduled arrival of the inbound train at the connection yard (== scheduled arrival of this leg's train at its destination); first leg has no inbound, so null" }
      - { name: planned_departure_utc, type: datetime, source: computed, description: "== train_plan.scheduled_departure_utc pinned at assignment" }
      - { name: actual_departure_utc, type: datetime, source: computed, default: null, description: "Set when the carrying TrainDeparture finalizes" }
      - { name: connection_status, type: enum, source: computed, default: PENDING, description: "PENDING | MADE | MISSED | NOT_APPLICABLE (first leg)" }
      - { name: status, type: enum, source: system, description: "PLANNED | EN_ROUTE | COMPLETED | MISSED | REPLACED" }

  - name: TrainDeparture
    parent: null
    common_fields: true
    fields:
      - { name: train_plan_id, type: string, source: input, description: "FK -> TrainPlan.id; plan being operated" }
      - { name: service_date, type: string, source: input, description: "Service day YYYY-MM-DD; MUST be an operating day per the plan's frequency_mask" }
      - { name: crew_pool_id, type: string, source: input, description: "FK -> CrewPool.id; pool the crew is booked from; pool.craft MUST be CONDUCTOR and pool.home_yard_id MUST equal the plan's origin" }
      - { name: locomotive_id, type: string, source: input, description: "FK -> Locomotive.id; lead unit; MUST be AVAILABLE at the plan's origin yard" }
      - { name: car_count_planned, type: integer, source: input, description: "Cars planned to move on this departure; >= 1" }
      - { name: crew_hours_estimated, type: number, source: input, description: "Estimated crew hours for the run; > 0" }
      - { name: actual_departure_utc, type: datetime, source: computed, default: null, description: "Stamped at finalization" }
      - { name: departure_variance_minutes, type: integer, source: computed, default: null, description: "actual - scheduled in whole minutes; >0 late" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DEPARTED | CANCELLED" }

  - name: CarEvent
    parent: null
    common_fields: false   # append-only event log; id + created_at only beyond declared fields
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment the car belongs to" }
      - { name: yard_id, type: string, source: input, description: "FK -> Yard.id; yard where the event occurred" }
      - { name: event_type, type: enum, source: input, description: "TRAIN_DEPARTURE | YARD_ARRIVAL | CLASSIFICATION_COMPLETE | PLACED_DELIVERED" }
      - { name: occurred_at, type: datetime, source: input, description: "Event instant; MUST equal the logical clock at recording time (server enforces)" }
      - { name: car_count, type: integer, source: input, description: "Cars covered by this event; >= 1 and <= shipment.car_count" }

  - name: ServiceException
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; shipment in exception (auto-created)" }
      - { name: exception_type, type: enum, source: system, description: "MISSED_CONNECTION | DWELL_OVERAGE | DEPARTURE_DELAY | PICKUP_MISS | DELIVERY_MISS" }
      - { name: triage_notes, type: string, source: input, description: "Investigator notes; required at triage" }
      - { name: root_cause_code, type: enum, source: input, description: "CREW_SHORTAGE | POWER_SHORTAGE | YARD_CONGESTION | CUSTOMER_DELAY | OTHER; required at triage" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock instant the exception was raised" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrainPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rail/train-plans/{id}/activate"
        actor: NetworkPlanner
        preconditions:
          - "status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "expected_train_plan_version == current version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "TrainPlan.version += 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /rail/train-plans/{id}/retire"
        actor: NetworkPlanner
        preconditions:
          - "status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "expected_train_plan_version == current version (ERR_STALE_VERSION, 412)"
          - "no TrainDeparture with this train_plan_id in SCHEDULED status (ERR_PLAN_HAS_OPEN_DEPARTURES)"
          - "no TripLeg with this train_plan_id in PLANNED or EN_ROUTE status (ERR_PLAN_IN_USE)"
        side_effects:
          - "TrainPlan.version += 1"

  - entity: Yard
    initial_state: OPEN
    terminal_states: []   # posture is a derived field, not a lifecycle; Yard itself has no terminal state
    transitions:
      - from: OPEN
        to: CONGESTED
        trigger: "system (yard_posture_recompute after a CarEvent at this yard)"
        actor: system
        preconditions:
          - "current_dwell_overage_hours > dwell_benchmark_hours"
        side_effects: []
      - from: CONGESTED
        to: EMBARGOED
        trigger: "system (yard_posture_recompute)"
        actor: system
        preconditions:
          - "current_dwell_overage_hours > 2 * dwell_benchmark_hours (strictly greater)"
        side_effects: []
      - from: CONGESTED
        to: OPEN
        trigger: "system (yard_posture_recompute)"
        actor: system
        preconditions:
          - "current_dwell_overage_hours <= dwell_benchmark_hours"
        side_effects: []
      - from: EMBARGOED
        to: CONGESTED
        trigger: "system (yard_posture_recompute)"
        actor: system
        preconditions:
          - "dwell_benchmark_hours < current_dwell_overage_hours <= 2 * dwell_benchmark_hours"
        side_effects: []
      - from: EMBARGOED
        to: OPEN
        trigger: "system (yard_posture_recompute)"
        actor: system
        preconditions:
          - "current_dwell_overage_hours <= dwell_benchmark_hours"
        side_effects: []
      - from: OPEN
        to: EMBARGOED
        trigger: "system (yard_posture_recompute)"
        actor: system
        preconditions:
          - "current_dwell_overage_hours > 2 * dwell_benchmark_hours"
        side_effects: []

  - entity: CrewPool
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (after a booking leaves crews_booked == crews_available)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: REOPENED
        trigger: "POST /rail/crew-pools/{id}/replenish"
        actor: CrewDispatcher
        preconditions:
          - "status == EXHAUSTED (ERR_POOL_NOT_REPLENISHABLE)"
          - "additional_crews >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "crews_available += additional_crews"
          - "CrewPool.version += 1"
      - from: REOPENED
        to: EXHAUSTED
        trigger: "system (after a booking leaves crews_booked == crews_available)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /rail/crew-pools/{id}/close"
        actor: CrewDispatcher
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_POOL_ALREADY_CLOSED)"
          - "crews_booked == 0 (ERR_POOL_HAS_BOOKED_CREWS)"
        side_effects:
          - "CrewPool.version += 1"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /rail/crew-pools/{id}/close"
        actor: CrewDispatcher
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_POOL_ALREADY_CLOSED)"
          - "crews_booked == 0 (ERR_POOL_HAS_BOOKED_CREWS)"
        side_effects:
          - "CrewPool.version += 1"

  - entity: Locomotive
    initial_state: AVAILABLE
    terminal_states: []   # cyclic operating states; no terminal state
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /rail/train-departures (schedule)"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "current_yard_id == train_plan.origin_yard_id"
        side_effects: []
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (on TrainDeparture cancellation; unit stays at origin)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (on TrainDeparture finalization; unit repositions to destination)"
        actor: system
        preconditions: []
        side_effects:
          - "current_yard_id := train_plan.destination_yard_id"
      - from: AVAILABLE
        to: BAD_ORDER
        trigger: "POST /rail/locomotives/{id}/bad-order"
        actor: PowerPlanner
        preconditions:
          - "status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
        side_effects: []
      - from: BAD_ORDER
        to: AVAILABLE
        trigger: "POST /rail/locomotives/{id}/release-repair"
        actor: PowerPlanner
        preconditions:
          - "status == BAD_ORDER (ERR_UNIT_NOT_BAD_ORDER)"
        side_effects: []

  - entity: Shipment
    initial_state: OPEN
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_TRANSIT
        trigger: "system (first TRAIN_DEPARTURE CarEvent recorded for the shipment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (PLACED_DELIVERED CarEvent at destination_yard_id covering all car_count cars)"
        actor: system
        preconditions:
          - "event yard == shipment.destination_yard_id"
          - "cumulative PLACED_DELIVERED car_count at destination == shipment.car_count"
        side_effects:
          - "compute car_velocity_mph via actual_velocity"
          - "if occurred_at > last_mile_delivery_by: compliance_status := OFF_PLAN; raise ServiceException DELIVERY_MISS; Customer.service_credit_balance += car_count"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /rail/shipments/{id}/cancel"
        actor: ServiceManager
        preconditions:
          - "status == OPEN (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "any TripLegs (all still PLANNED, since shipment never departed) -> REPLACED"
          - "Shipment.version += 1"

  - entity: TripLeg
    initial_state: PLANNED
    terminal_states: [COMPLETED, MISSED, REPLACED]
    transitions:
      - from: PLANNED
        to: EN_ROUTE
        trigger: "system (TrainDeparture for this leg's train_plan finalizes to DEPARTED)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_departure_utc := departure.actual_departure_utc"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "system (YARD_ARRIVAL CarEvent for the shipment at this leg's train destination)"
        actor: system
        preconditions: []
        side_effects:
          - "if this leg is not the last leg: evaluate the next leg's connection via connection_window (may cascade MISS)"
      - from: PLANNED
        to: MISSED
        trigger: "system (connection_window evaluation at the inbound leg's arrival, or cascade from upstream MISSED)"
        actor: system
        preconditions: []
        side_effects:
          - "connection_status := MISSED; Shipment.total_missed_connections += 1"
          - "Shipment.trip_plan_status := MISSED_CONNECTION"
          - "raise ServiceException MISSED_CONNECTION (shipment, detected_at := logical clock)"
          - "cascade: every later TripLeg of the same shipment still in PLANNED -> MISSED (its own connection_status already MISSED by induction)"
      - from: EN_ROUTE
        to: MISSED
        trigger: "system (car failed to be on the outbound train: a TrainDeparture for this leg's plan finalized while this leg was EN_ROUTE at the origin without departure coverage)"
        actor: system
        preconditions: []
        side_effects:
          - "same cascade as PLANNED -> MISSED"
      - from: PLANNED
        to: REPLACED
        trigger: "POST /rail/shipments/{id}/trip-legs (replan) supersedes the prior itinerary"
        actor: system
        preconditions: []
        side_effects: []
      - from: MISSED
        to: REPLACED
        trigger: "POST /rail/shipments/{id}/trip-legs (replan) supersedes the prior itinerary"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainDeparture
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DEPARTED
        trigger: "POST /rail/train-departures/{id}/finalize"
        actor: TerminalSuperintendent
        preconditions:
          - "status == SCHEDULED (ERR_DEPARTURE_NOT_FINALIZABLE)"
          - "train plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "crew pool status in {OPEN, REOPENED} and crews_booked < crews_available (ERR_NO_CREW_AVAILABLE)"
          - "crew pool HOS check: crew_hours_estimated <= HOS_MAX_HOURS (ERR_HOS_EXCEEDED)"
          - "origin yard posture != EMBARGOED (ERR_YARD_EMBARGOED)"
          - "logical clock >= train_plan.scheduled_departure_utc (ERR_DEPARTURE_TOO_EARLY)"
        side_effects:
          - "actual_departure_utc := logical clock; departure_variance_minutes computed"
          - "crew pool crews_booked += 1 (pool may flip OPEN/REOPENED -> EXHAUSTED)"
          - "if variance > DEPARTURE_DELAY_THRESHOLD_MINUTES: raise ServiceException DEPARTURE_DELAY against each shipment with a PLANNED TripLeg on this plan; those shipments' compliance_status degrades ON_PLAN -> AT_RISK (AT_RISK stays)"
          - "every PLANNED TripLeg on this train_plan whose shipment is IN_TRANSIT or OPEN and whose planned departure matches -> EN_ROUTE, stamping actual_departure_utc"
          - "TrainDeparture.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rail/train-departures/{id}/cancel"
        actor: TerminalSuperintendent
        preconditions:
          - "status == SCHEDULED (ERR_DEPARTURE_NOT_FINALIZABLE)"
        side_effects:
          - "locomotive ASSIGNED -> AVAILABLE (stays at origin)"
          - "crew pool untouched (no booking consumed until finalize)"
          - "every PLANNED TripLeg riding this plan with planned_departure_utc matching this departure's slot -> MISSED (full missed-connection cascade fires per leg)"
          - "TrainDeparture.version += 1"

  - entity: ServiceException
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /rail/service-exceptions/{id}/triage"
        actor: ServiceManager
        preconditions:
          - "status == OPEN (ERR_EXCEPTION_NOT_OPEN)"
          - "triage_notes non-empty and root_cause_code present (ERR_INVALID_REQUEST)"
        side_effects:
          - "ServiceException.version += 1"
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /rail/service-exceptions/{id}/resolve"
        actor: ServiceManager
        preconditions:
          - "status == INVESTIGATING (ERR_EXCEPTION_NOT_INVESTIGATING)"
          - "shipment.trip_plan_status in {ASSIGNED, REPLANNED} for MISSED_CONNECTION exceptions — the shipment must have been replanned (ERR_EXCEPTION_NOT_RECOVERABLE)"
        side_effects:
          - "ServiceException.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: train-plan-activate-stale-version
    parent_entity: TrainPlan
    write_endpoint: "POST /rail/train-plans/{id}/activate"
    occ_field: "expected_train_plan_version"
    description: |
      Activating a TrainPlan while carrying a version the client observed
      before another writer's successful activation or retirement is rejected:
      the client's view of the plan is stale and must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: train-plan-retire-stale-version
    parent_entity: TrainPlan
    write_endpoint: "POST /rail/train-plans/{id}/retire"
    occ_field: "expected_train_plan_version"
    description: |
      Retiring a TrainPlan with an expected_train_plan_version behind the
      current version is rejected; another mutation (activation, or a prior
      retirement) has already advanced the plan.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: trip-plan-assign-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /rail/shipments/{id}/trip-legs"
    occ_field: "expected_shipment_version"
    description: |
      Assigning or replanning a shipment's itinerary against a Shipment whose
      version has advanced since the client last read it is rejected; a prior
      replan (or a compliance-relevant cascade) has already changed the
      shipment the itinerary was designed for.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_velocity
    description: "Planned end-to-end velocity of a shipment itinerary: total committed miles over total planned elapsed hours (first planned departure to last planned arrival)."
    trigger: "trip-plan assignment (POST /rail/shipments/{id}/trip-legs)"
    algorithm: forward_looking
    input_set: "The new TripLeg set being assigned (status PLANNED), each leg's train plan route_distance_miles / scheduled_departure_utc; shipment.committed_route_miles."
    formula: |
      total_hours = (last_leg.planned_arrival_utc - first_leg.planned_departure_utc) / 3600
        where planned_arrival_utc(leg) = leg.planned_departure_utc + leg.train_plan.transit_hours,
        transit_hours(plan) = plan.route_distance_miles / PLAN_SPEED_MPH (a schedule constant)
      plan_velocity_mph = shipment.committed_route_miles / total_hours
      PLAN_SPEED_MPH is fixed at 25.0 for all plans (scheduled transit).
    constants:
      PLAN_SPEED_MPH: 25.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_at_assignment
        when: "itinerary assigned; no car has moved"
        difference: "uses pinned planned_departure_utc only; ignores any actual event"
      - name: restated_at_replan
        when: "replan after MISSED_CONNECTION"
        difference: "first_leg.planned_departure_utc is the NEW itinerary's first departure, so the same committed_route_miles divided by a longer horizon yields a strictly lower plan_velocity_mph — the quantified cost of the miss"

  - name: actual_velocity
    description: "Actual car velocity measured against plan: committed miles over observed elapsed hours from first TRAIN_DEPARTURE to final PLACED_DELIVERED."
    trigger: "shipment delivery (IN_TRANSIT -> DELIVERED)"
    algorithm: chronological
    input_set: "CarEvents of the shipment in occurred_at order: first TRAIN_DEPARTURE; final PLACED_DELIVERED at destination that completes car_count."
    formula: |
      elapsed_hours = (final_placed_delivered.occurred_at - first_train_departure.occurred_at) / 3600
      car_velocity_mph = shipment.committed_route_miles / elapsed_hours
      If elapsed_hours == 0 (same-instant departure and delivery), car_velocity_mph := committed_route_miles (per-hour floor convention: treat elapsed as 1 hour).
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: measured_actual
        when: "delivery completes"
        difference: "uses observed event timestamps; dwell and delay are fully priced in, so actual_velocity_mph < plan_velocity_mph whenever any dwell or delay occurred — the plan-vs-actual gap the compliance program exists to surface"

  - name: dwell_hours
    description: "Terminal dwell of a car (shipment's cars) at a yard: YARD_ARRIVAL to TRAIN_DEPARTURE or CLASSIFICATION_COMPLETE, whichever is recorded first as the outbound event."
    trigger: "outbound CarEvent (TRAIN_DEPARTURE or CLASSIFICATION_COMPLETE) recorded for a shipment with an open YARD_ARRIVAL at the same yard"
    algorithm: chronological
    input_set: "CarEvents of one shipment at one yard, ordered by occurred_at (tie-break: created_at ASC)."
    formula: |
      dwell_hours = (outbound_event.occurred_at - inbound_yard_arrival.occurred_at) / 3600
      Unmatched outbound events (no open YARD_ARRIVAL at that yard) are rejected: ERR_EVENT_SEQUENCE_INVALID.
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: per_car_dwell
        when: "single shipment at a single yard"
        difference: "one arrival matched against one outbound event; feeds yard_posture_recompute"

  - name: yard_posture_recompute
    description: "Aggregate dwell overage across all cars currently dwelling at a yard, then map to posture bands."
    trigger: "every CarEvent at the yard (arrival adds a dweller; outbound closes one)"
    algorithm: aggregation
    input_set: "All shipments with an open dwell session at this yard: YARD_ARRIVAL recorded, no matching TRAIN_DEPARTURE / CLASSIFICATION_COMPLETE / PLACED_DELIVERED yet. Open sessions accrue overage against the yard's dwell_benchmark_hours measured from their own arrival to the logical clock NOW."
    formula: |
      for each open dwell session s at the yard:
        session_overage_s = max(0, (NOW - s.arrival.occurred_at)/3600 - yard.dwell_benchmark_hours)
      yard.current_dwell_overage_hours = sum(session_overage_s), floored at 0
      posture bands (strictly-greater boundaries):
        overage <= B            -> OPEN
        B < overage <= 2B       -> CONGESTED
        overage > 2B            -> EMBARGOED
        where B = yard.dwell_benchmark_hours; overage == B exactly stays OPEN; overage == 2B exactly stays CONGESTED.
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: connection_window
    description: "Whether a car makes its outbound connection at a yard."
    trigger: "inbound TripLeg completion (YARD_ARRIVAL at the connection yard)"
    algorithm: threshold
    input_set: "The completed inbound leg, the next PLANNED leg and its train plan; the arrival CarEvent occurred_at."
    formula: |
      slack_minutes = (next_leg.planned_departure_utc - arrival.occurred_at) / 60
      if slack_minutes < next_leg.train_plan.cutoff_minutes: next_leg -> MISSED (cascade)
      else: next_leg.connection_status := MADE
      Boundary: slack_minutes == cutoff_minutes exactly -> MADE (>= semantics).
    constants: {}
    precision: "whole minutes, truncate toward zero"

  - name: crew_hos_check
    description: "Hours-of-service gate for booking a crew onto a departure."
    trigger: "departure finalize"
    algorithm: threshold
    input_set: "TrainDeparture.crew_hours_estimated; crew pool status/balance."
    formula: |
      reject with ERR_HOS_EXCEEDED if crew_hours_estimated > HOS_MAX_HOURS
      reject with ERR_NO_CREW_AVAILABLE if pool.status in {EXHAUSTED, CLOSED} or crews_booked == crews_available
      Boundary: crew_hours_estimated == HOS_MAX_HOURS exactly -> ALLOWED (> semantics, not >=).
    constants:
      HOS_MAX_HOURS: 12.0

  - name: shipment_compliance
    description: "Derived per-shipment compliance status against plan."
    trigger: "any state change on the shipment's legs, any ServiceException raised for it, delivery"
    algorithm: aggregation
    input_set: "Shipment legs, exceptions, commitment timestamps vs logical clock."
    formula: |
      OFF_PLAN  if (a) delivered late (occurred_at > last_mile_delivery_by), or
                 (b) first-mile pickup missed: logical clock passed first_mile_pickup_by while status == OPEN and trip_plan_status == UNASSIGNED and no TRAIN_DEPARTURE event — evaluated when a trip-plan assignment is attempted after the pickup deadline (ERR_PICKUP_WINDOW_MISSED) and stamped OFF_PLAN at that moment, or
                 (c) total_missed_connections >= 2
      AT_RISK   if not OFF_PLAN and (total_missed_connections == 1 or any open DEPARTURE_DELAY exception for this shipment)
      ON_PLAN   otherwise
    constants: {}
    precision: "enum"

  - name: service_credit
    description: "Customer service-coupon credits for missed commitments."
    trigger: "late delivery (DELIVERY_MISS exception raise)"
    algorithm: aggregation
    input_set: "The late-delivered shipment."
    formula: |
      customer.service_credit_balance += shipment.car_count
      credits are whole units, never fractional; partial-car deliveries accrue per delivered car only when the shipment reaches DELIVERED.
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body referenced resources exist (yards, plans, pools, locomotives, shipments, customers, exceptions), validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: state
    check: "OCC expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rail/train-plans/{id}/activate, POST /rail/train-plans/{id}/retire, POST /rail/shipments/{id}/trip-legs"
  - priority: 5
    category: state
    check: "Target resource in the required state for the operation (plan DRAFT/ACTIVE, pool not CLOSED, exception OPEN/INVESTIGATING, shipment OPEN for cancel, departure SCHEDULED)"
    error_id: "ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_ACTIVE | ERR_POOL_ALREADY_CLOSED | ERR_EXCEPTION_NOT_OPEN | ERR_EXCEPTION_NOT_INVESTIGATING | ERR_SHIPMENT_NOT_CANCELLABLE | ERR_DEPARTURE_NOT_FINALIZABLE"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_referential
    check: "Structural integrity: origin != destination; leg_sequence contiguous 1..N; consecutive legs chain (leg k destination == leg k+1 origin via their train plans); first leg origin == shipment.origin_yard_id; last leg destination == shipment.destination_yard_id"
    error_id: ERR_TRIP_PLAN_DISJOINT
    http_status: 422
    applies_to: "POST /rail/shipments/{id}/trip-legs; origin==destination on plan/shipment create -> ERR_SAME_ORIGIN_DESTINATION"
  - priority: 7
    category: business_temporal
    check: "CarEvent sequence integrity: outbound event without open YARD_ARRIVAL at that yard; event on terminal shipment; occurred_at != logical clock"
    error_id: ERR_EVENT_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /rail/car-events"
  - priority: 8
    category: business_safety
    check: "Hours-of-service and crew availability at departure finalize (crew_hours_estimated <= 12.0; pool has free crew)"
    error_id: "ERR_HOS_EXCEEDED | ERR_NO_CREW_AVAILABLE"
    http_status: 422
    applies_to: "POST /rail/train-departures/{id}/finalize"
  - priority: 9
    category: business_constraint
    check: "Yard posture gating: shipment create forbidden when origin OR destination yard posture == EMBARGOED; trip-plan assignment forbidden when ANY leg endpoint yard == EMBARGOED; departure finalize forbidden when origin yard == EMBARGOED"
    error_id: ERR_YARD_EMBARGOED
    http_status: 409
    applies_to: "POST /rail/shipments, POST /rail/shipments/{id}/trip-legs, POST /rail/train-departures/{id}/finalize"
  - priority: 10
    category: business_constraint
    check: "First-mile commitment: trip-plan assignment with logical clock > shipment.first_mile_pickup_by is a pickup miss"
    error_id: ERR_PICKUP_WINDOW_MISSED
    http_status: 409
    applies_to: "POST /rail/shipments/{id}/trip-legs"
  - priority: 11
    category: business_constraint
    check: "Resource positioning/capacity: locomotive AVAILABLE at origin yard; pool craft CONDUCTOR and home yard == plan origin; service_date in plan frequency_mask; plan retirement blocked by open departures/legs; pool close blocked by crews_booked > 0"
    error_id: "ERR_UNIT_NOT_AVAILABLE | ERR_UNIT_WRONG_YARD | ERR_POOL_CRAFT_MISMATCH | ERR_DEPARTURE_DAY_NOT_OPERATED | ERR_PLAN_HAS_OPEN_DEPARTURES | ERR_PLAN_IN_USE | ERR_POOL_HAS_BOOKED_CREWS"
    http_status: 409
    applies_to: "POST /rail/train-departures, POST /rail/train-plans/{id}/retire, POST /rail/crew-pools/{id}/close"
  - priority: 12
    category: business_fiscal
    check: "Service-credit adjustments cannot drive Customer.service_credit_balance negative"
    error_id: ERR_CREDIT_BALANCE_NEGATIVE
    http_status: 422
    applies_to: "POST /rail/customers/{id}/service-credits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving, declared contract) ---
  - method: POST
    path: "/rail/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Ties and deadlines throughout the scaffold read this clock."
    roles: [NetworkPlanner]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["recompute yard postures (open dwell sessions accrue overage against the new NOW)"]

  # --- Yard ---
  - method: POST
    path: "/rail/yards"
    description: "Register a yard"
    roles: [NetworkPlanner]
    code: 201
    input: [yard_code, dwell_benchmark_hours, classification_capacity_cars]
    output: Yard
    side_effects: ["posture := OPEN", "current_dwell_overage_hours := 0"]
  - method: GET
    path: "/rail/yards"
    description: "List yards"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Yard[]"
    side_effects: []
  - method: GET
    path: "/rail/yards/{id}"
    description: "Get a yard (posture and current dwell overage)"
    roles: [Any]
    code: 200
    input: []
    output: Yard
    side_effects: []

  # --- TrainPlan ---
  - method: POST
    path: "/rail/train-plans"
    description: "Design a train plan (DRAFT)"
    roles: [NetworkPlanner]
    code: 201
    input: [train_symbol, origin_yard_id, destination_yard_id, scheduled_departure_utc, cutoff_minutes, frequency_mask, route_distance_miles, dwell_benchmark_hours]
    output: TrainPlan
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/rail/train-plans"
    description: "List train plans"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "origin_yard_id?", "destination_yard_id?", "status?"]
    output: "TrainPlan[]"
    side_effects: []
  - method: GET
    path: "/rail/train-plans/{id}"
    description: "Get a train plan"
    roles: [Any]
    code: 200
    input: []
    output: TrainPlan
    side_effects: []
  - method: POST
    path: "/rail/train-plans/{id}/activate"
    description: "Activate a DRAFT plan (OCC)"
    roles: [NetworkPlanner]
    code: 200
    input: [expected_train_plan_version]
    output: TrainPlan
    side_effects: ["status -> ACTIVE", "increments TrainPlan.version by 1"]
  - method: POST
    path: "/rail/train-plans/{id}/retire"
    description: "Retire an ACTIVE plan (OCC; blocked by open departures/legs)"
    roles: [NetworkPlanner]
    code: 200
    input: [expected_train_plan_version]
    output: TrainPlan
    side_effects: ["status -> RETIRED", "increments TrainPlan.version by 1"]

  # --- CrewPool ---
  - method: POST
    path: "/rail/crew-pools"
    description: "Open a crew pool for a home yard / craft / service date"
    roles: [CrewDispatcher]
    code: 201
    input: [home_yard_id, craft, service_date, crews_available]
    output: CrewPool
    side_effects: ["status := OPEN", "crews_booked := 0"]
  - method: GET
    path: "/rail/crew-pools"
    description: "List crew pools"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "home_yard_id?", "craft?", "service_date?", "status?"]
    output: "CrewPool[]"
    side_effects: []
  - method: GET
    path: "/rail/crew-pools/{id}"
    description: "Get a crew pool"
    roles: [Any]
    code: 200
    input: []
    output: CrewPool
    side_effects: []
  - method: POST
    path: "/rail/crew-pools/{id}/replenish"
    description: "Add crews to an EXHAUSTED pool (REOPENED)"
    roles: [CrewDispatcher]
    code: 200
    input: [additional_crews]
    output: CrewPool
    side_effects: ["crews_available += additional_crews", "status -> REOPENED", "increments CrewPool.version by 1"]
  - method: POST
    path: "/rail/crew-pools/{id}/close"
    description: "Close a pool at end of service day (requires crews_booked == 0)"
    roles: [CrewDispatcher]
    code: 200
    input: []
    output: CrewPool
    side_effects: ["status -> CLOSED", "increments CrewPool.version by 1"]

  # --- Locomotive ---
  - method: POST
    path: "/rail/locomotives"
    description: "Register a locomotive at a yard"
    roles: [PowerPlanner]
    code: 201
    input: [unit_number, current_yard_id, horsepower]
    output: Locomotive
    side_effects: ["status := AVAILABLE"]
  - method: GET
    path: "/rail/locomotives"
    description: "List locomotives"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "current_yard_id?", "status?"]
    output: "Locomotive[]"
    side_effects: []
  - method: GET
    path: "/rail/locomotives/{id}"
    description: "Get a locomotive"
    roles: [Any]
    code: 200
    input: []
    output: Locomotive
    side_effects: []
  - method: POST
    path: "/rail/locomotives/{id}/bad-order"
    description: "Mark a unit bad-order (out of service)"
    roles: [PowerPlanner]
    code: 200
    input: []
    output: Locomotive
    side_effects: ["status AVAILABLE -> BAD_ORDER"]
  - method: POST
    path: "/rail/locomotives/{id}/release-repair"
    description: "Return a bad-order unit to service"
    roles: [PowerPlanner]
    code: 200
    input: []
    output: Locomotive
    side_effects: ["status BAD_ORDER -> AVAILABLE"]

  # --- Customer ---
  - method: POST
    path: "/rail/customers"
    description: "Register a customer"
    roles: [ServiceManager]
    code: 201
    input: [customer_code, name]
    output: Customer
    side_effects: ["service_credit_balance := 0"]
  - method: GET
    path: "/rail/customers"
    description: "List customers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/rail/customers/{id}"
    description: "Get a customer (includes service_credit_balance)"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/rail/customers/{id}/service-credits"
    description: "Adjust service-credit balance (signed delta; must not go negative)"
    roles: [ServiceManager]
    code: 200
    input: [delta]
    output: Customer
    side_effects: ["service_credit_balance += delta"]

  # --- Shipment ---
  - method: POST
    path: "/rail/shipments"
    description: "Create a shipment (OPEN). Forbidden if origin or destination yard is EMBARGOED."
    roles: [ServiceManager]
    code: 201
    input: [customer_id, origin_yard_id, destination_yard_id, car_count, first_mile_pickup_by, last_mile_delivery_by, committed_route_miles]
    output: Shipment
    side_effects: ["status := OPEN", "trip_plan_status := UNASSIGNED", "compliance_status := ON_PLAN"]
  - method: GET
    path: "/rail/shipments"
    description: "List shipments"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "customer_id?", "origin_yard_id?", "destination_yard_id?", "status?", "compliance_status?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/rail/shipments/{id}"
    description: "Get a shipment"
    roles: [Any]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/rail/shipments/{id}/cancel"
    description: "Cancel an OPEN shipment"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CANCELLED", "PLANNED TripLegs -> REPLACED", "increments Shipment.version by 1"]

  # --- TripLeg ---
  - method: POST
    path: "/rail/shipments/{id}/trip-legs"
    description: "Assign (or replan) the full itinerary for a shipment. Body carries the complete leg list; prior PLANNED/MISSED legs are superseded to REPLACED. OCC on Shipment.version."
    roles: [NetworkPlanner]
    code: 201
    input: [expected_shipment_version, legs]
    output: "TripLeg[]"
    side_effects:
      - "prior legs (PLANNED or MISSED) -> REPLACED"
      - "new legs created in PLANNED with pinned planned_departure_utc / planned_connection_time"
      - "first leg connection_status := NOT_APPLICABLE"
      - "shipment.trip_plan_status := ASSIGNED on first assignment; REPLANNED when superseding a MISSED_CONNECTION itinerary"
      - "increments Shipment.version by 1"
  - method: GET
    path: "/rail/shipments/{id}/trip-legs"
    description: "List a shipment's legs (all generations, including REPLACED)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TripLeg[]"
    side_effects: []
  - method: GET
    path: "/rail/trip-legs"
    description: "List trip legs network-wide, filterable"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "train_plan_id?", "status?", "connection_status?"]
    output: "TripLeg[]"
    side_effects: []
  - method: GET
    path: "/rail/trip-legs/{id}"
    description: "Get a trip leg"
    roles: [Any]
    code: 200
    input: []
    output: TripLeg
    side_effects: []

  # --- TrainDeparture ---
  - method: POST
    path: "/rail/train-departures"
    description: "Schedule a departure from an ACTIVE plan (books locomotive; crew is committed at finalize)"
    roles: [TerminalSuperintendent]
    code: 201
    input: [train_plan_id, service_date, crew_pool_id, locomotive_id, car_count_planned, crew_hours_estimated]
    output: TrainDeparture
    side_effects: ["status := SCHEDULED", "locomotive AVAILABLE -> ASSIGNED"]
  - method: GET
    path: "/rail/train-departures"
    description: "List departures"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "train_plan_id?", "crew_pool_id?", "locomotive_id?", "service_date?", "status?"]
    output: "TrainDeparture[]"
    side_effects: []
  - method: GET
    path: "/rail/train-departures/{id}"
    description: "Get a departure"
    roles: [Any]
    code: 200
    input: []
    output: TrainDeparture
    side_effects: []
  - method: POST
    path: "/rail/train-departures/{id}/finalize"
    description: "Operate the departure: HOS + crew + yard-embargo gate; stamps actual_departure_utc from the logical clock and fires leg/exception cascades"
    roles: [TerminalSuperintendent]
    code: 200
    input: []
    output: TrainDeparture
    side_effects:
      - "status -> DEPARTED; actual_departure_utc := logical clock; departure_variance_minutes computed"
      - "crew pool crews_booked += 1 (may flip to EXHAUSTED)"
      - "PLANNED legs on this plan/slot -> EN_ROUTE with actual_departure_utc"
      - "DEPARTURE_DELAY exceptions + compliance AT_RISK if variance > 30 minutes"
      - "increments TrainDeparture.version by 1"
  - method: POST
    path: "/rail/train-departures/{id}/cancel"
    description: "Cancel a SCHEDULED departure; releases locomotive; legs riding the slot MISS"
    roles: [TerminalSuperintendent]
    code: 200
    input: []
    output: TrainDeparture
    side_effects:
      - "status -> CANCELLED"
      - "locomotive ASSIGNED -> AVAILABLE at origin"
      - "affected PLANNED TripLegs -> MISSED (missed-connection cascade per leg)"
      - "increments TrainDeparture.version by 1"

  # --- CarEvent ---
  - method: POST
    path: "/rail/car-events"
    description: "Record a car movement event; occurred_at must equal the logical clock. Drives dwell, posture, leg completion, connection evaluation, and delivery."
    roles: [TerminalSuperintendent]
    code: 201
    input: [shipment_id, yard_id, event_type, occurred_at, car_count]
    output: CarEvent
    side_effects:
      - "TRAIN_DEPARTURE: first one flips shipment OPEN -> IN_TRANSIT; closes open dwell at that yard"
      - "YARD_ARRIVAL: completes the EN_ROUTE leg whose train destination is this yard; opens dwell; evaluates next-leg connection_window"
      - "CLASSIFICATION_COMPLETE: closes open dwell at that yard"
      - "PLACED_DELIVERED at destination completing car_count: shipment -> DELIVERED, actual_velocity computed, late check vs last_mile_delivery_by"
      - "yard_posture_recompute for the event yard"
  - method: GET
    path: "/rail/car-events"
    description: "List car events (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "yard_id?", "event_type?"]
    output: "CarEvent[]"
    side_effects: []
  - method: GET
    path: "/rail/yards/{id}/car-events"
    description: "List car events recorded at a yard (FK reverse reachability for CarEvent.yard_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CarEvent[]"
    side_effects: []
  - method: GET
    path: "/rail/shipments/{id}/car-events"
    description: "List one shipment's event history"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "CarEvent[]"
    side_effects: []

  # --- ServiceException ---
  - method: GET
    path: "/rail/service-exceptions"
    description: "List service exceptions"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "exception_type?", "status?"]
    output: "ServiceException[]"
    side_effects: []
  - method: GET
    path: "/rail/shipments/{id}/service-exceptions"
    description: "List one shipment's exceptions"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceException[]"
    side_effects: []
  - method: GET
    path: "/rail/service-exceptions/{id}"
    description: "Get a service exception"
    roles: [Any]
    code: 200
    input: []
    output: ServiceException
    side_effects: []
  - method: POST
    path: "/rail/service-exceptions/{id}/triage"
    description: "Begin investigation (requires notes + root cause)"
    roles: [ServiceManager]
    code: 200
    input: [triage_notes, root_cause_code]
    output: ServiceException
    side_effects: ["status OPEN -> INVESTIGATING", "increments ServiceException.version by 1"]
  - method: POST
    path: "/rail/service-exceptions/{id}/resolve"
    description: "Resolve an investigated exception; MISSED_CONNECTION requires the shipment replanned first"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceException
    side_effects: ["status INVESTIGATING -> RESOLVED", "increments ServiceException.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or non-positive numeric where >0 required" }
  - { id: ERR_SAME_ORIGIN_DESTINATION, http: 422, condition: "origin_yard_id == destination_yard_id on train plan or shipment" }
  - { id: ERR_YARD_NOT_FOUND, http: 404, condition: "Yard id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "TrainPlan id does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "CrewPool id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Locomotive id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_LEG_NOT_FOUND, http: 404, condition: "TripLeg id does not exist" }
  - { id: ERR_DEPARTURE_NOT_FOUND, http: 404, condition: "TrainDeparture id does not exist" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "ServiceException id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Activate requires plan in DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires plan in ACTIVE (departure scheduling/finalize, retirement source state)" }
  - { id: ERR_PLAN_HAS_OPEN_DEPARTURES, http: 409, condition: "Retire blocked: SCHEDULED departures exist for the plan" }
  - { id: ERR_PLAN_IN_USE, http: 409, condition: "Retire blocked: PLANNED or EN_ROUTE trip legs reference the plan" }
  - { id: ERR_POOL_NOT_REPLENISHABLE, http: 409, condition: "Replenish requires pool EXHAUSTED" }
  - { id: ERR_POOL_ALREADY_CLOSED, http: 409, condition: "Operation requires pool not CLOSED (or close on already-CLOSED pool)" }
  - { id: ERR_POOL_HAS_BOOKED_CREWS, http: 409, condition: "Close requires crews_booked == 0" }
  - { id: ERR_POOL_CRAFT_MISMATCH, http: 409, condition: "Departure requires a CONDUCTOR pool homed at the plan's origin yard" }
  - { id: ERR_NO_CREW_AVAILABLE, http: 422, condition: "Pool EXHAUSTED/CLOSED or crews_booked == crews_available at finalize" }
  - { id: ERR_HOS_EXCEEDED, http: 422, condition: "crew_hours_estimated > 12.0 hours-of-service maximum at finalize" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Locomotive not AVAILABLE (scheduling or bad-order on non-AVAILABLE unit)" }
  - { id: ERR_UNIT_WRONG_YARD, http: 409, condition: "Locomotive current_yard_id != plan origin yard" }
  - { id: ERR_UNIT_NOT_BAD_ORDER, http: 409, condition: "release-repair requires BAD_ORDER" }
  - { id: ERR_DEPARTURE_DAY_NOT_OPERATED, http: 409, condition: "service_date weekday not in plan frequency_mask" }
  - { id: ERR_DEPARTURE_NOT_FINALIZABLE, http: 409, condition: "Finalize/cancel requires departure SCHEDULED" }
  - { id: ERR_DEPARTURE_TOO_EARLY, http: 409, condition: "Logical clock earlier than the plan's scheduled_departure_utc at finalize" }
  - { id: ERR_TRIP_PLAN_DISJOINT, http: 422, condition: "Leg chain broken: non-contiguous leg_sequence, or leg k destination != leg k+1 origin, or first origin / last destination mismatch with the shipment" }
  - { id: ERR_YARD_EMBARGOED, http: 409, condition: "Yard posture EMBARGOED blocks shipment creation, trip-plan assignment through the yard, or departure finalize from the yard" }
  - { id: ERR_PICKUP_WINDOW_MISSED, http: 409, condition: "Trip-plan assignment attempted after first_mile_pickup_by (first-mile commitment missed)" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires shipment OPEN" }
  - { id: ERR_EVENT_SEQUENCE_INVALID, http: 409, condition: "CarEvent violates sequence integrity: outbound without open arrival, event on terminal shipment, occurred_at mismatch with logical clock, or car_count over shipment remainder" }
  - { id: ERR_EXCEPTION_NOT_OPEN, http: 409, condition: "Triage requires exception OPEN" }
  - { id: ERR_EXCEPTION_NOT_INVESTIGATING, http: 409, condition: "Resolve requires exception INVESTIGATING" }
  - { id: ERR_EXCEPTION_NOT_RECOVERABLE, http: 409, condition: "MISSED_CONNECTION exception cannot resolve until the shipment is replanned (trip_plan_status ASSIGNED or REPLANNED)" }
  - { id: ERR_CREDIT_BALANCE_NEGATIVE, http: 422, condition: "Service-credit adjustment would drive the balance below zero" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkPlanner
    description: "Owns train plan design, yards, trip-plan assignment/replanning, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rail/_clock/set_current_utc"
      - "POST /rail/yards"
      - "POST /rail/train-plans"
      - "POST /rail/train-plans/{id}/activate"
      - "POST /rail/train-plans/{id}/retire"
      - "POST /rail/shipments/{id}/trip-legs"
    shared_operations:
      - "All GET endpoints"
  - name: CrewDispatcher
    description: "Owns crew pools and hours-of-service administration"
    identity: opaque
    exclusive_operations:
      - "POST /rail/crew-pools"
      - "POST /rail/crew-pools/{id}/replenish"
      - "POST /rail/crew-pools/{id}/close"
    shared_operations:
      - "All GET endpoints"
  - name: PowerPlanner
    description: "Owns locomotive registration, positioning, and bad-order lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /rail/locomotives"
      - "POST /rail/locomotives/{id}/bad-order"
      - "POST /rail/locomotives/{id}/release-repair"
    shared_operations:
      - "All GET endpoints"
  - name: TerminalSuperintendent
    description: "Operates departures and records car movement events at terminals"
    identity: opaque
    exclusive_operations:
      - "POST /rail/train-departures"
      - "POST /rail/train-departures/{id}/finalize"
      - "POST /rail/train-departures/{id}/cancel"
      - "POST /rail/car-events"
    shared_operations:
      - "All GET endpoints"
  - name: ServiceManager
    description: "Owns customers, shipments, service commitments, and exception investigation"
    identity: opaque
    exclusive_operations:
      - "POST /rail/customers"
      - "POST /rail/customers/{id}/service-credits"
      - "POST /rail/shipments"
      - "POST /rail/shipments/{id}/cancel"
      - "POST /rail/service-exceptions/{id}/triage"
      - "POST /rail/service-exceptions/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
  - name: Any
    description: "Read-role token accepted on every GET endpoint: when X-User-Role is Any, X-User-ID is any operator identifier. All GET endpoints declare roles: [Any] and the authorization layer maps every authenticated role (including the five business roles and Any itself) onto GET access."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /rail/yards, /rail/train-plans, /rail/crew-pools, /rail/locomotives, /rail/customers, /rail/shipments, /rail/trip-legs, /rail/train-departures, /rail/car-events, /rail/service-exceptions and their {id} and sub-resource forms"
