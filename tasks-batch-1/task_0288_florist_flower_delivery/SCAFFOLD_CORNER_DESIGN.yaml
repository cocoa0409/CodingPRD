        distinguishing_aspect: "POST /floral/claims/{id}/approve by a Customer returns ERR_FORBIDDEN_ROLE (403); approval is Dispatcher-exclusive."
        test_recipe:
          setup: ["an OPEN claim on a delivered order"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZB1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CB1", display_name: "CB1", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "rb@x.com", full_name: "RB C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
