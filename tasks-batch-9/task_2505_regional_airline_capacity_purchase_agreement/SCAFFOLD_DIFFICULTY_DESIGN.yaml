  - rule_id: cross_entity_state_dependency
    instances:
      - name: aircraft_induction_gated_on_crewbase_staffing_state
        grounds:
          - validations[priority=34]
          - errors[ERR_BASE_UNDERSTAFFED]
          - calculations.pilot_staffing_shortfall
          - state_machines.Aircraft.PENDING_INDUCTION_to_IN_SERVICE
          - state_machines.Pilot.IN_TRAINING_to_LINE_QUALIFIED
        distinguishing_aspect: |
          Entity pair Aircraft ← CrewBase: whether an Aircraft may leave
          PENDING_INDUCTION depends on the LINE_QUALIFIED pilot population of its
          assigned base, not on anything about the tail. The identical induct request
          is rejected and then accepted with no change whatsoever to the Aircraft row
          — only a second pilot reaching LINE_QUALIFIED at the base flips it.
        test_recipe:
          setup:
            - "ACTIVE agreement with one base whose pilots_required_per_aircraft is 2 and aircraft_allocation_cap is 2."
            - "Pilot A LINE_QUALIFIED, Pilot B only IN_TRAINING — line_qualified_pilot_count 1, in_training_pilot_count 1."
            - "One REGIONAL_OWNED tail created and still PENDING_INDUCTION."
