    side_effects: ["ComplianceAction created in NOTICE_ISSUED with origin AGENCY_ISSUED", "Lease.compliance_status COMPLIANT -> DEFICIENT", "increments Lease.version by 1"]
  - method: POST
    path: "/compliance-actions/{id}/accept-cure"
    description: "The agency accepts the cure; the lease returns to compliant once no other notice is outstanding."
    roles: [ContractingOfficer]
    code: 200
    input: [cure_note]
    output: ComplianceAction
    side_effects: ["status NOTICE_ISSUED -> CURE_ACCEPTED", "cure_note persisted", "Lease.compliance_status DEFICIENT -> COMPLIANT when no other NOTICE_ISSUED action remains on the lease", "increments ComplianceAction.version by 1"]
  - method: POST
    path: "/compliance-actions/{id}/order-bond-draw"
