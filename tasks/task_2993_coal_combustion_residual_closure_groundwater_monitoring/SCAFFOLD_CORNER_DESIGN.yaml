            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0115", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
