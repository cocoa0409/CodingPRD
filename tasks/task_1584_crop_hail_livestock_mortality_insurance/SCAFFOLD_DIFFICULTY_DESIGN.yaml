            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", appraisal_value_cents: 100000, deceased_head_count: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_appraisal_cents: 95000, observed_deceased_count: 1, notes: "ok" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { p_v: $.data.version }
          trigger:
            # Without a VeterinaryReport, doc_posture is DOCS_PENDING — APPROVE must fail.
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/determinations"
              payload: { decision: "APPROVE", approved_indemnity_cents: 90000, expected_policy_version: "${p_v}" }
              as: ClaimsApprover
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOCS_INCOMPLETE"
            - "Claim.${claim_id}.claim_state == UNDER_REVIEW   (unchanged)"

      - name: adjuster_assignment_blocked_when_policy_restricted
        grounds:
          - state_machines.Claim.REPORTED_to_INSPECTION_SCHEDULED
          - entities.Policy.fields.claims_posture
        distinguishing_aspect: |
          Different pair than the other instance: Claim × Policy. The Claim's
          REPORTED→INSPECTION_SCHEDULED transition is gated by the PARENT
          POLICY's claims_posture field. When billing_state=DELINQUENT,
          claims_posture=RESTRICTED, blocking assignment.
        test_recipe:
          setup:
            - "Carrier; grower; rate; BOUND policy with 1 CU; only partial premium paid"
            - "Advance clock 31 days past bind → billing_state=DELINQUENT, claims_posture=RESTRICTED"
            - "Timely acreage report was filed BEFORE the delinquency; Claim filed BEFORE the delinquency (still REPORTED)"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-N", legal_name: "Carrier N", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower N", tax_id_last4: "1313", email: "n@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj N", license_number: "ADJ-N-1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            # partial payment
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 600 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim_id: $.data.id }
            # Now advance clock past bind+30d (bind at 2026-08-01 default; 30d later = 2026-08-31+)
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
              captures: { err: $.data.error_id }
          assert:
            - "Policy.${policy_id}.billing_state == DELINQUENT"
            - "Policy.${policy_id}.claims_posture == RESTRICTED"
            - "error_id == ERR_POLICY_RESTRICTED"
            - "Claim.${claim_id}.claim_state == REPORTED  (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_table_half_open_interval_overlap_rejected
        grounds:
          - validations[priority=13]
          - entities.RateTable.fields.effective_from
          - entities.RateTable.fields.effective_to
        distinguishing_aspect: |
          Resource = RateTable row keyed by (kind, county, crop); interval
          semantics = half-open [effective_from, effective_to). Adjacent rows
          (one's effective_to == other's effective_from) do NOT overlap.
          Overlapping interiors DO conflict.
        test_recipe:
          setup:
            - "Carrier; one PUBLISHED row R1 [2026-01-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-O", legal_name: "Carrier O", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: Underwriter
              captures: { r1: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${r1}/publish"
              payload: {}
              as: Underwriter
            # Adjacent row — OK
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 400, effective_from: "2026-08-01T00:00:00Z" }
              as: Underwriter
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /carriers/${carrier_id}/rate-tables/${r2}/publish"
              payload: {}
              as: Underwriter
              captures: { r2_status: $.data.status }
            # Overlapping row — must fail
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 500, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: Underwriter
              captures: { r3: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${r3}/publish"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "RateTable.${r2}.status == PUBLISHED   (adjacent boundary is OK)"
            - "RateTable.${r3} publish rejected with ERR_RATE_TABLE_OVERLAP"

