              payload: {}
              as: ProgramDirector
          assert:
            - "Before the trigger: StrawLot.${lot_id}.unit_book_value_cents == 1250 and valuation_basis == STANDARD_COST"
            - "Before the trigger: GET /genetics/inventory-valuation returns plant_inventory_value_cents == 250000 and lot_count == 1 and released_value_cents == 250000"
            - "After the trigger: StrawLot.${lot_id}.unit_book_value_cents == 2248 and valuation_basis == MARKET_REVALUED"
            - "After the trigger: StrawLot.${lot_id}.pre_revaluation_unit_value_cents == 1250"
            - "After the trigger: GET /genetics/inventory-valuation returns plant_inventory_value_cents == 449600 and released_value_cents == 449600"
            - "GenomicEvaluation.${eval_c_id}.revaluation_delta_cents == 199600"
            - "StrawLot.${lot_id}.straw_count == 200 and doses_available == 200 (no dose moved; only the money changed)"

  - rule_id: combinatorial_formula
    instances:
      - name: sire_index_nested_clamp_and_paw_decay_nonlinearity
        grounds:
          - calculations.sire_genetic_index
          - entities.GenomicEvaluation.fields.production_index
          - entities.GenomicEvaluation.fields.parent_average_weight
        distinguishing_aspect: |
          Mode (a) - a formula with eight trait inputs and two nested clamps that interact non-linearly:
          shrink = min(0.95, max(0.30, reliability_pct/100)) floors reliability 20 at 0.30 (composite 7.46)
          and caps reliability 98 at 0.95 (composite 23.62), while parent_average_weight =
          max(0.10, 0.50 - 0.004 * min(progeny, 100)) makes progeny 100 and progeny 200 score IDENTICALLY
          at 42.51 - a linear reading of either factor produces a different number in all three rows.
        test_recipe:
          setup:
            - "Three pedigree-root sires REG-E1, REG-E2 and REG-E3 exist with sire_id and dam_sire_id null, so parent_average_index is 0.00 for all three."
            - "No sire has any evaluation yet; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-E1", breed: "JERSEY", birth_date: "2022-01-10", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { e1_id: "$.data.id", e1_ver: "$.data.version" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-E2", breed: "JERSEY", birth_date: "2022-01-11", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { e2_id: "$.data.id", e2_ver: "$.data.version" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-E3", breed: "JERSEY", birth_date: "2022-01-12", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { e3_id: "$.data.id", e3_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${e1_id}/genomic-evaluations"
              payload: { milk_kg: 700, fat_kg: 30, protein_kg: 24, somatic_cell_score: 2.95, fertility_pct: 1.0, longevity_months: 1.0, reliability_pct: 20, progeny_daughter_count: 0, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${e1_ver}" }
              as: ProgramDirector
              captures: { ev_e1: "$.data.id" }
            - call: "POST /genetics/sires/${e2_id}/genomic-evaluations"
              payload: { milk_kg: 700, fat_kg: 30, protein_kg: 24, somatic_cell_score: 2.95, fertility_pct: 1.0, longevity_months: 1.0, reliability_pct: 98, progeny_daughter_count: 100, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${e2_ver}" }
              as: ProgramDirector
              captures: { ev_e2: "$.data.id" }
            - call: "POST /genetics/sires/${e3_id}/genomic-evaluations"
              payload: { milk_kg: 700, fat_kg: 30, protein_kg: 24, somatic_cell_score: 2.95, fertility_pct: 1.0, longevity_months: 1.0, reliability_pct: 98, progeny_daughter_count: 200, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${e3_ver}" }
              as: ProgramDirector
              captures: { ev_e3: "$.data.id" }
          assert:
            - "GenomicEvaluation.${ev_e1}.production_index == 15.36 and health_index == 14.25 and composite_index == 7.46"
            - "GenomicEvaluation.${ev_e2}.production_index == 48.64 and health_index == 45.13 and composite_index == 42.51"
            - "GenomicEvaluation.${ev_e3}.production_index == 48.64 and health_index == 45.13 and composite_index == 42.51"
            - "GenomicEvaluation.${ev_e2}.parent_average_weight == 0.10 and GenomicEvaluation.${ev_e3}.parent_average_weight == 0.10"
            - "GenomicEvaluation.${ev_e1}.parent_average_weight == 0.50 and evaluation_basis == GENOMIC_ONLY"
            - "GenomicEvaluation.${ev_e2}.composite_index == GenomicEvaluation.${ev_e3}.composite_index (the progeny cap makes 100 and 200 indistinguishable)"

      - name: lot_value_rounds_per_straw_before_multiplying
        grounds:
          - calculations.lot_unit_book_value
          - calculations.plant_inventory_value
          - entities.StrawLot.fields.unit_book_value_cents
        distinguishing_aspect: |
          Mode (b) - the pinned rounding ORDER is observable: 100000 cents over 3 straws rounds per straw
          FIRST (33333) and multiplies after, so plant_inventory_value_cents is 99999, one cent short of the
          100000 that "sum then round" would report. The lost cent is the whole point of the assertion.
        test_recipe:
          setup:
            - "Facility F-IA-02 (US, housing_capacity 2, bench_capacity 1) is APPROVED."
            - "Sire REG-B is RESIDENT and ELIGIBLE at F-IA-02 with all four required tests NEGATIVE until 2027-08-01."
            - "An ACCEPTED Ejaculate with total_doses_theoretical 480 exists from a completed booking."
            - "No StrawLot exists yet, so plant_inventory_value_cents is 0 and lot_count is 0."
            - "The logical clock stands at 2026-09-01T08:00:00Z."
