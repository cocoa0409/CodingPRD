      - name: trading_suspension_outranks_the_credit_balance_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=28]
          - errors[ERR_TRADING_SUSPENDED]
        distinguishing_aspect: "A proposal that violates both the program-status gate at priority 12 and the balance gate at priority 28 must surface the lower-priority-number error."
        excluded_because:
          difficulty_instance: trading_suspended_outranks_credit_insufficient_on_transaction_proposal
          rationale: "That §1.8 instance holds the watershed on ADAPTIVE_HOLD and over-requests against the batch in the same call, asserting ERR_TRADING_SUSPENDED and then ERR_CREDIT_INSUFFICIENT once the hold is lifted."

      - name: practice_period_overlap_outranks_the_zone_eligibility_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - errors[ERR_PRACTICE_PERIOD_OVERLAP]
          - errors[ERR_ZONE_NOT_ELIGIBLE]
        distinguishing_aspect: "A registration on an ineligible zone for an already-occupied tract violates priority 15 and priority 18 at once and must return the overlap error."
        excluded_because:
          difficulty_instance: practice_period_overlap_outranks_zone_not_eligible_on_project_registration
          rationale: "That §1.8 instance registers the second project on the ineligible Z3 reach with an overlapping tract period and asserts ERR_PRACTICE_PERIOD_OVERLAP, then isolates ERR_ZONE_NOT_ELIGIBLE by moving the period."

      - name: overlapping_practice_periods_on_one_tract_are_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_PRACTICE_PERIOD_OVERLAP]
        distinguishing_aspect: "The tract lock is a half-open interval scoped to tract_code plus practice_type and to non-terminal statuses, so exact adjacency is legal and revoking a project frees the tract."
        excluded_because:
          difficulty_instance: practice_period_half_open_adjacency_accepted_and_revoked_project_frees_the_tract
          rationale: "That §1.8 instance accepts a project starting exactly on the incumbent's end date, rejects one starting a day earlier, and shows a REVOKED incumbent no longer blocking the tract."

      - name: adaptive_review_windows_that_touch_are_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_REVIEW_WINDOW_CONFLICT]
        distinguishing_aspect: "Review windows need a clear day between them, so an adjacent window is a conflict rather than a legal neighbour."
        excluded_because:
          difficulty_instance: adaptive_review_windows_require_one_clear_day_and_adjacency_is_rejected
          rationale: "That §1.8 instance opens one review, rejects both an overlapping and an exactly adjacent window, and accepts the window that leaves one clear day."

      - name: finalizing_limits_before_the_tmdl_is_approved_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=19]
          - errors[ERR_TMDL_NOT_APPROVED]
        distinguishing_aspect: "Final limits may only be locked in once the underlying TMDL is APPROVED; the check reaches through the permit's source assessment to the assessment status."
        excluded_because:
          difficulty_instance: permit_finalization_gated_on_tmdl_approval_then_tightened_limit_flips_compliance
          rationale: "That §1.8 instance shows finalize-limits rejected with ERR_TMDL_NOT_APPROVED while the assessment is in PUBLIC_COMMENT, then succeeding after approval and flipping the compliance axis."

      - name: listing_a_batch_whose_project_is_not_certified_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_PROJECT_NOT_CERTIFIED]
        distinguishing_aspect: "The listing gate reads the generating project's current status, not the status it held when the batch was issued."
        excluded_because:
          difficulty_instance: batch_listing_blocked_while_generating_project_sits_in_pending_reverification
          rationale: "That §1.8 instance parks the project in PENDING_REVERIFICATION and asserts the ERR_PROJECT_NOT_CERTIFIED rejection followed by a successful listing after re-certification."

  - section: endpoints
    instances:
      - name: producer_create_and_read_round_trip_across_both_authoring_roles
        claim_type: standard_crud
        grounds:
          - endpoints[POST /producers]
          - endpoints[GET /producers/{producer_id}]
        distinguishing_aspect: "Producer is the one entity with no state machine, no lifecycle action and no list endpoint, so its whole surface is create-then-read-by-id: two producers written by the two authoring roles, each reading back byte-for-byte with version 1."
        test_recipe:
          setup:
            - "No prerequisites: producers are watershed-independent registry principals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
