        distinguishing_aspect: "IO is COMPLETED but one reconciliation is still RECONCILED (not LOCKED): wrap generation → ERR_RECONCILIATION_NOT_LOCKED."
        test_recipe:
          setup: ["COMPLETED IO; one line item with snapshot 1000/10; reconciliation RECONCILED (bm-1) but never LOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
