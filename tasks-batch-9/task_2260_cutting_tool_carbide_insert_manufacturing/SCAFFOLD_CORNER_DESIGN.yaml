      - name: product_lead_time_recomputes_when_its_geometry_is_released
        claim_type: input_set_filtering
        grounds:
          - calculations.engineering_lead_time
          - state_machines.InsertGeometry.DRAFT_to_RELEASED
          - entities.ToolProduct.fields.engineering_lead_time_days
        distinguishing_aspect: "The lead-time adders are keyed on the current state of the referenced rows, not on values frozen at product creation: releasing the geometry drops the 8-day unreleased-geometry adder on both derived products at once, and it also flips the SPECIAL product from expedite-ineligible (raw 29) to exactly the eligibility limit (raw 21), so the shave starts applying to it."
        test_recipe:
          setup:
            - "Grade WC-P25 in PILOT (so the 6-day unqualified-grade adder is charged throughout), geometry CNMG-MM still DRAFT"
            - "One CATALOG product and one SPECIAL product derived from it, both created against the DRAFT geometry with no coating recipe"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { catalog_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "SPC-INS-1", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", base_catalog_product_id: "${catalog_id}", tool_type: "INSERT", list_price_cents: 6100, min_order_qty: 5, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { special_id: $.data.id }
          trigger:
            - call: "GET /tooling/tool-products/${catalog_id}"
              as: ProductionPlanner
              captures: { cat_before: $.data.engineering_lead_time_days }
            - call: "GET /tooling/tool-products/${special_id}"
              as: ProductionPlanner
              captures: { spc_before: $.data.engineering_lead_time_days }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "GET /tooling/tool-products/${catalog_id}"
              as: ProductionPlanner
              captures: { cat_after: $.data.engineering_lead_time_days }
            - call: "GET /tooling/tool-products/${special_id}"
              as: ProductionPlanner
              captures: { spc_after: $.data.engineering_lead_time_days }
          assert:
            - "${cat_before} == 16 (raw 5 + 8 + 0 + 6 = 19, eligible at <= 21, shaved by 3)"
            - "${spc_before} == 29 (raw 15 + 8 + 0 + 6 = 29, ineligible, so no shave)"
            - "${cat_after} == 8 (raw 5 + 0 + 0 + 6 = 11, shaved by 3)"
            - "${spc_after} == 18 (raw 15 + 0 + 0 + 6 = 21 lands exactly on EXPEDITE_ELIGIBLE_MAX_DAYS, so the shave now applies)"
            - "both products still carry the 6-day unqualified-grade adder because the grade is only in PILOT"

