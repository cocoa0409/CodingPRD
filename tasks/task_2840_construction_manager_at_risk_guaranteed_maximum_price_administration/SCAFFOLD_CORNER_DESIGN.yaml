              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /work-packages/${wp}/award"
              payload: { bid_id: "${bid}" }
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "unforeseen dewatering at the north footing", estimated_amount: 30000.00, origin: "FIELD_CONDITION" }
