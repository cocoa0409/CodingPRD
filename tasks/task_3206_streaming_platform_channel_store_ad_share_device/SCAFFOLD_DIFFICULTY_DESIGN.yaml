# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3206_streaming_platform_channel_store_ad_share_device
# 9 difficulty rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and is fully replayable from empty-DB via §1.5 calls.
# All money figures below were computed by hand from the pinned formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subscription_payout_gross_vs_net_variant_divergence
        grounds:
          - calculations.subscription_payout
          - entities.Publisher.fields.billing_model
          - entities.RevenueStatement.fields.sub_payout_cents
        distinguishing_aspect: |
          Entity domain: subscription billing money. Two publishers identical in
          every input (one 999-cent subscription, STANDARD tier, GOOD standing)
          differ only in billing_model; GROSS_SHARE yields sub_payout 799 while
          NET_OF_FEES yields 755 — same data, two valid algorithms, different cents.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Publisher A billing_model=GROSS_SHARE, publisher B billing_model=NET_OF_FEES, both ad_share 7000. Each owns a PUBLISHED channel. One viewer each with a 999-cent ACTIVE subscription created in period 2026-09."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Gross Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub_g: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Net Pub", default_ad_share_bps: 7000, billing_model: "NET_OF_FEES" }
              as: PlatformAdmin
              captures: { pub_n: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub_g}", name: "Gross Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub_g}"
              captures: { ch_g: $.data.id, ch_g_v: $.data.version }
            - call: "POST /channels"
              payload: { publisher_id: "${pub_n}", name: "Net Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub_n}"
              captures: { ch_n: $.data.id, ch_n_v: $.data.version }
            - call: "POST /channels/${ch_g}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_g_v}" }
              as: Publisher
              as_user_id: "${pub_g}"
              captures: { ver_g: $.data.id }
            - call: "POST /channels/${ch_n}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_n_v}" }
              as: Publisher
              as_user_id: "${pub_n}"
              captures: { ver_n: $.data.id }
            - call: "POST /channel-versions/${ver_g}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver_g}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver_n}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver_n}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch_g}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${ch_n}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "vg@x.com" }
              as: PlatformAdmin
              captures: { vw_g: $.data.id }
            - call: "POST /viewer-accounts"
              payload: { email: "vn@x.com" }
              as: PlatformAdmin
              captures: { vw_n: $.data.id }
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch_g}", price_cents: 999 }
              as: Viewer
              as_user_id: "${vw_g}"
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch_n}", price_cents: 999 }
              as: Viewer
              as_user_id: "${vw_n}"
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub_g}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st_g: "$.data[0].id" }
            - call: "GET /statements"
              payload: { publisher_id: "${pub_n}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st_n: "$.data[0].id" }
            - call: "POST /statements/${st_g}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /statements/${st_n}/finalize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /statements/${st_g}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /statements/${st_n}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Statement ${st_g}.sub_payout_cents == 799 (round_half_up(999 * 8000/10000) = 799)"
            - "Statement ${st_n}.sub_payout_cents == 755 (round_half_up((999 - 55*1) * 8000/10000) = round_half_up(755.2) = 755)"
            - "Statement ${st_g}.platform_sub_fee_cents == 200 and ${st_n}.platform_sub_fee_cents == 244"
            - "Both statements have subscription_gross_cents == 999 and charge_count == 1 — identical inputs, divergent payouts"

      - name: device_subsidy_recovery_straight_line_vs_monetization_divergence
        grounds:
          - calculations.device_subsidy_recovery
          - entities.DeviceModel.fields.recovery_policy
          - entities.DeviceUnit.fields.subsidy_recovered_cents
        distinguishing_aspect: |
          Entity domain: device hardware subsidy (not money-billing). Two units
          with identical subsidy 10001 (cost 20000, price 9999) diverge by model
          recovery_policy: STRAIGHT_LINE accrues floor(10001/24)=416 while
          MONETIZATION on 10000 cents of attributed revenue recovers
          round_half_up(10000*0.35)=3500.
        test_recipe:
          setup:
            - "Clock default. Manufacturer M (LICENSED) with two CERTIFIED models: SL (recovery_policy STRAIGHT_LINE) and MN (recovery_policy MONETIZATION). Unit U_SL (serial S-1) and U_MN (serial M-1), both cost 20000 price 9999 -> subsidy 10001, both SOLD then ACTIVATED by viewer V."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Acme TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "SL-100", recovery_policy: "STRAIGHT_LINE" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod_sl: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "MN-100", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod_mn: $.data.id }
            - call: "POST /device-models/${mod_sl}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /device-models/${mod_mn}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_2", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod_sl}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-models/${mod_mn}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod_sl}", serial_number: "S-1", hardware_cost_cents: 20000, sale_price_cents: 9999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { u_sl: $.data.id }
            - call: "POST /device-units"
              payload: { device_model_id: "${mod_mn}", serial_number: "M-1", hardware_cost_cents: 20000, sale_price_cents: 9999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { u_mn: $.data.id }
            - call: "POST /device-units/${u_sl}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units/${u_mn}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "v1@x.com" }
              as: PlatformAdmin
              captures: { vw1: $.data.id }
            - call: "POST /device-units/${u_sl}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw1}"
            - call: "POST /device-units/${u_mn}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw1}"
          trigger:
            - call: "POST /device-units/${u_sl}/accrue-straight-line"
              payload: {}
              as: AdOps
            - call: "POST /device-units/${u_mn}/record-ad-revenue"
              payload: { revenue_cents: 10000 }
              as: AdOps
          assert:
            - "DeviceUnit.${u_sl}.subsidy_cents == 10001 and subsidy_recovered_cents == 416 (floor(10001/24))"
            - "DeviceUnit.${u_mn}.subsidy_cents == 10001 and subsidy_recovered_cents == 3500 (round_half_up(10000 * 3500/10000))"
            - "DeviceUnit.${u_sl}.subsidy_outstanding_cents == 9585 and DeviceUnit.${u_mn}.subsidy_outstanding_cents == 6501"
            - "416 != 3500 — identical subsidy, divergent variants"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) multi-input non-linear,
  # (b) pinned nested rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: statement_net_payout_tier_penalty_and_four_inputs
        grounds:
          - calculations.statement_net_payout
          - calculations.revenue_tier_assignment
          - entities.RevenueStatement.fields.net_payout_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tier selection,
          SUSPENDED +500 bps standing penalty, and four amount inputs combine:
          sub_base 90000 at fee 2500 bps -> 67500; ad entries [1001,1001] at
          7000 bps -> 701 per entry -> 1402; minus placement spend 5000;
          net == 63902 exactly.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Publisher P (GROSS_SHARE, ad bps 7000), channel PUBLISHED, ad-slot grant for 2026-09 with revenue entries [1001,1001] recorded. Four subscriptions created in 2026-09 (30000 x3 + 10000 = 100000 gross); the 10000 one refunded in-period. Campaign flight 2026-09-01..2026-09-30, budget 100000, ACTIVE, 5000 impressions at cpm 1000 -> spent 5000. Publisher standing set to SUSPENDED before finalize."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Combo Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Combo Channel", category: "VIDEO", content_rating: "PG" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: false }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-09", total_slots: 1000 }
              as: PlatformAdmin
              captures: { grant: $.data.id }
            - call: "POST /ad-slot-grants/${grant}/record-revenue"
              payload: { slot_revenue_entries: [1001, 1001] }
              as: AdOps
            - call: "POST /viewer-accounts"
              payload: { email: "s1@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 30000 }
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 30000 }
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 30000 }
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 10000 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { sub_refund: $.data.id }
            - call: "POST /subscriptions/${sub_refund}/refund"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${camp}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${camp}/impressions"
              payload: { impression_count: 5000, cpm_cents: 1000 }
              as: AdOps
            - call: "POST /publishers/${pub}/standing"
              payload: { to_standing: "SUSPENDED", reason: "fraud review" }
              as: PlatformAdmin
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st: "$.data[0].id" }
          trigger:
            - call: "POST /statements/${st}/finalize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Statement.${st}.subscription_gross_cents == 100000 and refund_cents == 10000 and charge_count == 4"
            - "Statement.${st}.applied_tier == STANDARD and applied_fee_bps == 2500 (2000 tier + 500 SUSPENDED penalty)"
            - "Statement.${st}.sub_payout_cents == 67500 (round_half_up(90000 * 7500/10000)) and platform_sub_fee_cents == 22500"
            - "Statement.${st}.ad_gross_cents == 2002 and ad_payout_cents == 1402 and platform_ad_fee_cents == 600"
            - "Statement.${st}.placement_spend_cents == 5000"
            - "Statement.${st}.net_payout_cents == 63902 (67500 + 1402 - 5000)"

      - name: ad_revenue_per_entry_rounding_then_sum_pinned
        grounds:
          - calculations.ad_revenue_share
          - entities.AdSlotGrant.fields.publisher_payout_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is load-bearing. Three 1-cent entries at
          3333 bps: pinned per-entry-round-then-sum gives payout 0 (each entry
          round_half_up(0.3333) = 0); the forbidden sum-then-round would give 1.
          Asserting payout == 0 with gross == 3 proves the pinned order.
        test_recipe:
          setup:
            - "Clock default. Publisher (ad bps 3333), channel PUBLISHED, grant for 2026-09 total_slots 100."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Round Pub", default_ad_share_bps: 3333, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Round Channel", category: "AUDIO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: false, drm: false, trick_play: false }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-09", total_slots: 100 }
              as: PlatformAdmin
              captures: { grant: $.data.id }
          trigger:
            - call: "POST /ad-slot-grants/${grant}/record-revenue"
              payload: { slot_revenue_entries: [1, 1, 1] }
              as: AdOps
          assert:
            - "AdSlotGrant.${grant}.ad_gross_cents == 3"
            - "AdSlotGrant.${grant}.publisher_payout_cents == 0 (per-entry round_half_up(1 * 3333/10000) = 0 three times)"
            - "publisher_payout_cents != round_half_up(3 * 3333/10000) == 1 — the sum-then-round counterfactual is rejected"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: channel_certification_revision_cycle
        grounds:
          - state_machines.Channel
          - state_machines.ChannelVersion
        distinguishing_aspect: |
          Cyclic shape on Channel: DRAFT -> SUBMITTED -> IN_REVIEW ->
          CHANGES_REQUESTED -> SUBMITTED (revision loop) -> IN_REVIEW ->
          CERTIFIED -> PUBLISHED. The first version ends FAILED, the revision
          PASSES, and the channel reaches PUBLISHED after looping back.
        test_recipe:
          setup:
            - "Clock default. Publisher P, channel C in DRAFT."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Loop Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Loop Channel", category: "GAME", content_rating: "PG" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v0: $.data.version }
          trigger:
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: false, drm: true, trick_play: true }, expected_channel_version: "${ch_v0}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver1: $.data.id }
            - call: "POST /channel-versions/${ver1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver1}/decide"
              payload: { outcome: "FAIL", failure_codes: ["DEEP_LINK_MISSING"] }
              as: PlatformAdmin
            - call: "GET /channels/${ch}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch_v1: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.1", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v1}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver2: $.data.id }
            - call: "POST /channel-versions/${ver2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver2}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Channel.${ch}.status == CHANGES_REQUESTED after the FAIL decision (loop-back state)"
            - "ChannelVersion.${ver1}.review_status == FAILED with failure_codes == [\"DEEP_LINK_MISSING\"]"
            - "Channel.${ch}.status == PUBLISHED after the revision cycle completes"
            - "Channel.${ch}.active_version_id == ${ver2} and ChannelVersion.${ver2}.review_status == PASSED"

      - name: device_model_parallel_cert_and_compliance_dimensions
        grounds:
          - state_machines.DeviceModel
          - entities.DeviceModel.fields.cert_status
          - entities.DeviceModel.fields.update_compliance
        distinguishing_aspect: |
          Parallel state dimensions on DeviceModel: cert_status CERTIFIED while
          update_compliance OVERDUE hold at the same instant on one row; activation is gated by
          the compliance dimension even though certification succeeded, and the
          OVERDUE transition cascades the manufacturer license to SUSPENDED.
        test_recipe:
          setup:
            - "Manufacturer M, model MD CERTIFIED. Unit U ACTIVATED by viewer V with os_version_tag BASE. Mandatory OsUpdate 14.1.0 with compliance_deadline 2026-09-10T00:00:00Z. Clock advanced to 2026-09-11 (past deadline) without applying the update."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Par TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "P-1", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod: $.data.id }
            - call: "POST /device-models/${mod}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "PAR-1", hardware_cost_cents: 15000, sale_price_cents: 14999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { unit: $.data.id }
            - call: "POST /device-units/${unit}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "pv@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /device-units/${unit}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /os-updates"
              payload: { version_tag: "14.1.0", mandatory: true, rollout_start: "2026-09-02T00:00:00Z", compliance_deadline: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /device-models/${mod}/refresh-compliance"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "PAR-2", hardware_cost_cents: 15000, sale_price_cents: 14999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { unit2_err: $.data.error_id }
          assert:
            - "DeviceModel.${mod}.cert_status == CERTIFIED (certification dimension untouched)"
            - "DeviceModel.${mod}.update_compliance == OVERDUE (compliance dimension moved independently)"
            - "TvManufacturer.${mfr}.license_status == SUSPENDED (cascade from the OVERDUE transition)"
            - "unit2_err == ERR_MANUFACTURER_NOT_LICENSED — the license cascade blocks new unit creation even though cert_status is CERTIFIED"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: channel_suspension_pauses_campaign_releases_booking_frees_slot
        grounds:
          - state_machines.Channel.PUBLISHED_to_SUSPENDED
          - state_machines.AdCampaign
          - state_machines.PlacementBooking
        distinguishing_aspect: |
          Depth-3 chain from POST /channels/{id}/suspend: channel SUSPENDED ->
          campaign (ACTIVE) PAUSED -> its CONFIRMED booking RELEASED -> the
          slot window is free, proven by a third party successfully booking the
          same half-open window immediately after. Each link is caused by the
          previous link, not by the suspension directly.
        test_recipe:
          setup:
            - "Clock default. Publisher P1 with channel C1 PUBLISHED, campaign K1 ACTIVE (flight covers 2026-09), booking B1 CONFIRMED on slot HOME_ROW_1 [2026-09-10T09:00, 2026-09-10T12:00). Publisher P2 with channel C2 PUBLISHED and campaign K2 ACTIVE on the same flight window."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "P1", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "P2", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${p1}", name: "C1", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /channels"
              payload: { publisher_id: "${p2}", name: "C2", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /channels/${c1}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c1_v}" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /channels/${c2}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c2_v}" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /channel-versions/${v1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v1}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${c1}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${c2}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${p1}", channel_id: "${c1}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { k1: $.data.id }
            - call: "POST /campaigns"
              payload: { publisher_id: "${p2}", channel_id: "${c2}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { k2: $.data.id }
            - call: "POST /campaigns/${k1}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${p1}"
            - call: "POST /campaigns/${k1}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${k2}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${p2}"
            - call: "POST /campaigns/${k2}/start"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k1}", slot_code: "HOME_ROW_1", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /placement-bookings/${b1}/confirm"
              payload: {}
              as: AdOps
          trigger:
            - call: "POST /channels/${c1}/suspend"
              payload: { reason: "OPS" }
              as: PlatformAdmin
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k2}", slot_code: "HOME_ROW_1", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { b2: $.data.id }
          assert:
            - "Channel.${c1}.status == SUSPENDED (link 1)"
            - "AdCampaign.${k1}.status == PAUSED (link 2, caused by the suspension)"
            - "PlacementBooking.${b1}.status == RELEASED (link 3, caused by the campaign pause)"
            - "The probe booking ${b2} succeeds (201) on the identical window and slot — the released booking no longer blocks overlap"
            - "AdCampaign.${k2}.status == ACTIVE and PlacementBooking.${b2}.status == HELD (unrelated subtree untouched)"

      - name: publisher_termination_removes_channels_cancels_subscriptions
        grounds:
          - state_machines.Publisher
          - state_machines.Channel.PUBLISHED_to_REMOVED
          - state_machines.Subscription
        distinguishing_aspect: |
          Depth-3 chain from POST /publishers/{id}/standing to_standing=TERMINATED:
          publisher TERMINATED -> channel PUBLISHED -> REMOVED -> its ACTIVE
          subscription CANCELLED and entitlement REVOKED. Different trigger and
          different chain shape than the suspension cascade (no bookings involved).
        test_recipe:
          setup:
            - "Clock default. Publisher P with channel C PUBLISHED; viewer V subscribed (subscription S ACTIVE/ENTITLED, price 2500)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Term Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Term Channel", category: "NEWS", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "tv@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 2500 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /publishers/${pub}/standing"
              payload: { to_standing: "TERMINATED", reason: "contract breach" }
              as: PlatformAdmin
          assert:
            - "Publisher.${pub}.standing == TERMINATED (link 1)"
            - "Channel.${ch}.status == REMOVED (link 2, caused by termination)"
            - "Subscription.${sub}.billing_status == CANCELLED and entitlement_status == REVOKED (link 3, caused by the channel removal)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: channel_state_beats_outstanding_balance_fiscal_gate
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors.ERR_CHANNEL_NOT_PUBLISHED
          - errors.ERR_OUTSTANDING_BALANCE
        distinguishing_aspect: |
          Error-category pair: state (priority 7) vs business_fiscal (priority 13).
          The schedule request violates both — channel SUSPENDED and publisher
          outstanding 200000 > 100000 — and the state error ERR_CHANNEL_NOT_PUBLISHED
          must win because state precedes fiscal.
        test_recipe:
          setup:
            - "Clock default. Publisher P with channel C PUBLISHED then SUSPENDED (reason OPS). A completed campaign of P spent 200000 in period 2026-09; statement 2026-09 generated and FINALIZED with net -200000, so P.outstanding_balance_cents == 200000. A second DRAFT campaign K2 of P references the suspended channel."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "PP Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "PP Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 200000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k1: $.data.id }
            - call: "POST /campaigns/${k1}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k1}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${k1}/impressions"
              payload: { impression_count: 200000, cpm_cents: 1000 }
              as: AdOps
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st: "$.data[0].id" }
            - call: "POST /statements/${st}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${ch}/suspend"
              payload: { reason: "OPS" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 5000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k2: $.data.id }
          trigger:
            - call: "POST /campaigns/${k2}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "Publisher.${pub}.outstanding_balance_cents == 200000 (> credit limit 100000 — the fiscal gate is violated)"
            - "Channel.${ch}.status == SUSPENDED (the state gate is violated)"
            - "err == ERR_CHANNEL_NOT_PUBLISHED with http 409 — state (priority 7) beats business_fiscal (priority 13)"

      - name: content_policy_safety_beats_slot_overlap_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_CONTENT_POLICY_BLOCK
          - errors.ERR_SLOT_OVERLAP
        distinguishing_aspect: |
          Error-category pair: business_safety (priority 8) vs business_temporal
          (priority 9). The booking violates both — the campaign's channel is
          under policy_hold AND the window overlaps an existing HELD booking —
          and ERR_CONTENT_POLICY_BLOCK must win because safety precedes temporal.
        test_recipe:
          setup:
            - "Clock default. Publisher P1 channel C1 PUBLISHED with campaign K1 ACTIVE and HELD booking on HOME_ROW_2 [2026-09-10T09:00, 2026-09-10T12:00). Publisher P2 channel C2 PUBLISHED with campaign K2 ACTIVE; C2 then placed under policy_hold (still PUBLISHED). P2 attempts booking [11:00,13:00) on HOME_ROW_2 (overlaps P1's HELD booking)."
          setup_api_calls:
