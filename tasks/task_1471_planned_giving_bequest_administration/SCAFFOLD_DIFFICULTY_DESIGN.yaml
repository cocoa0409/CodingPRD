          - state_machines.AnnuityPayment.SCHEDULED_to_LAPSED
          - calculations.reserve_coverage_posture
        distinguishing_aspect: |
          Trigger record-death drives a depth-4 chain: death -> CGA MATURED ->
          its 80 payments LAPSED -> ReserveFund booked target recomputed (CGA
          leaves the booked set) -> posture flips RESERVE_DEFICIENT -> SOLVENT;
          a parallel hop matures the BEQUEST agreement and auto-creates its
          Estate. Each hop is caused by the previous hop's mutation, not by the
          original call.
