            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-28", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K28", product_id: "${prod_id}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
