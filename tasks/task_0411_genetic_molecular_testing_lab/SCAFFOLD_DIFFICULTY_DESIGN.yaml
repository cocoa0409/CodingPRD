              as: LabDirector
              captures: { pms2_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "Med Panel", list_price_cents: 400000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${msh2_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "4444444444", full_name: "Dr Four" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-D", patient_dob: "1980-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "MEDICARE" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/billing/auth-decision"
              payload: { decision: "APPROVED", allowed_amount_cents: 300000 }
              as: BillingSpecialist
            - call: "POST /lab/test-orders/${order_id}/consents"
              payload: { incidental_findings_opt_in: true, signed_by_name: "Pat D" }
              as: LabIntake
              captures: { consent_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/consents/${consent_id}/sign"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "BLOOD", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { spec_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/specimens/${spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${pms2_id}", hgvs: "c.300A>T" }
              as: MolecularTechnologist
              captures: { var_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants/${var_id}/classify"
              payload: { classification: "PATHOGENIC" }
              as: MolecularTechnologist
              as_user_id: "tech-1"
            - call: "POST /lab/test-orders/${order_id}/classification/complete"
              payload: {}
              as: MolecularTechnologist
            - call: "POST /lab/test-orders/${order_id}/reports"
              payload: {}
              as: MolecularTechnologist
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /lab/test-orders/${order_id}/reports/${report_id}/sign-out"
              payload: {}
              as: LabDirector
              as_user_id: "director-1"
          assert:
            - "TestOrder.${order_id}.estimated_patient_responsibility_cents == 50000"
            - "TestOrder.${order_id}.final_patient_responsibility_cents == 57500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: variant_reclassification_cycle_vus_pathogenic
        grounds:
          - state_machines.Variant.VUS_to_PATHOGENIC
          - state_machines.Variant.PATHOGENIC_to_VUS
          - entities.Variant.fields.classification
        distinguishing_aspect: |
          Variant cycles VUS -> PATHOGENIC -> VUS via the same classify endpoint
          (non-linear cycle), and classification ends at VUS after the round-trip —
          a genuine A->B->A loop on the Variant entity, distinct from the parallel
          dimensions on TestOrder.
        test_recipe:
          setup:
            - "Order in SEQUENCING with one variant initially classified VUS."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00.000Z" }
              as: LabDirector
            - call: "POST /lab/genes"
              payload: { symbol: "GX", is_acmg_reportable: false }
              as: LabDirector
              captures: { gx_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "PX", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
              captures: { panel_id: $.data.id }
            - call: "POST /lab/panels/${panel_id}/panel-genes"
              payload: { gene_id: "${gx_id}" }
              as: LabDirector
            - call: "POST /lab/panels/${panel_id}/publish"
              payload: {}
              as: LabDirector
            - call: "POST /lab/providers"
              payload: { npi: "5555555555", full_name: "Dr Five" }
              as: LabIntake
              captures: { prov_id: $.data.id }
            - call: "POST /lab/test-orders"
              payload: { patient_mrn: "MRN-E", patient_dob: "1990-01-01", panel_id: "${panel_id}", ordering_provider_id: "${prov_id}" }
              as: LabIntake
              captures: { order_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/requisition"
              payload: { clinical_indication: "dx", insurance_payer: "SELF_PAY" }
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/requisition/submit"
              payload: {}
              as: LabIntake
            - call: "POST /lab/test-orders/${order_id}/specimens"
              payload: { specimen_type: "BLOOD", collected_at: "2026-06-18T00:00:00.000Z", quantity_ng: 80 }
              as: AccessioningTech
              captures: { spec_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/specimens/${spec_id}/accession"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/sequencing/start"
              payload: {}
              as: AccessioningTech
            - call: "POST /lab/test-orders/${order_id}/variants"
              payload: { gene_id: "${gx_id}", hgvs: "c.5G>A" }
              as: MolecularTechnologist
              captures: { var_id: $.data.id }
            - call: "POST /lab/test-orders/${order_id}/variants/${var_id}/classify"
              payload: { classification: "VUS" }
