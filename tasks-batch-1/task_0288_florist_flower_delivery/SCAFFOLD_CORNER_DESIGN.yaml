scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_arrangement_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Arrangement, endpoints]
        distinguishing_aspect: "POST /floral/arrangements with required fields returns 201 and echoes sku, base_price_cents, defaults premium_tier=STANDARD, substitution_policy=SAME_VALUE, substitution_cap_pct=0.15, active=true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /floral/arrangements"
              payload: { sku: "C-ARR", display_name: "Corner Arr", base_price_cents: 4200 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
          assert:
            - "response code == 201"
            - "Arrangement.${arr_id}.base_price_cents == 4200"
            - "Arrangement.${arr_id}.premium_tier == STANDARD"
            - "Arrangement.${arr_id}.substitution_policy == SAME_VALUE"
            - "Arrangement.${arr_id}.substitution_cap_pct == 0.15"
            - "Arrangement.${arr_id}.active == true"
            - "Arrangement.${arr_id}.version == 1"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /floral/orders/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /floral/orders/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_zone_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.DeliveryZone, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /floral/zones omitting required window_capacity_per_slot returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZX", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14 }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_card_message_over_240_chars_returns_422
        claim_type: Type Constraints
        grounds: [entities.Order.fields.card_message, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /floral/orders with a 241-char card_message violates length<=240 and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["zone, arrangement, customer created"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CC1", display_name: "CC1", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "cm@x.com", full_name: "CM C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", card_message: "x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_x_xZ", delivery_date: "2026-11-01", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_window_start_not_less_than_end_returns_422
        claim_type: Type Constraints
        grounds: [entities.Order.fields.window_start_minute, entities.Order.fields.window_end_minute, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /floral/orders with window_start_minute >= window_end_minute (720,720) violates the half-open interval invariant and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["zone, arrangement, customer created"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC2", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CC2", display_name: "CC2", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "wn@x.com", full_name: "WN C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-01", window_start_minute: 720, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_invalid_occasion_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.Order.fields.occasion, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /floral/orders with occasion='WEDDING' (not in the enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["zone, arrangement, customer created"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC3", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CC3", display_name: "CC3", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "oc@x.com", full_name: "OC C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", occasion: "WEDDING", delivery_date: "2026-11-01", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_unknown_arrangement_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Order.fields.arrangement_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /floral/orders referencing a non-existent arrangement_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["zone and customer created; arrangement_id fabricated"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC4", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "fk@x.com", full_name: "FK C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "22222222-2222-4222-8222-222222222222", zone_id: "${zone_id}", delivery_date: "2026-11-01", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: order_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "Newly created Order is server-stamped fulfillment_status=DRAFT, payment_status=UNPAID, version=1, estimated_total_cents=0 regardless of body; id is a bare UUID with no prefix."
        test_recipe:
          setup: ["zone, arrangement, customer created"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC5", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CC5", display_name: "CC5", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "sf@x.com", full_name: "SF C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-01", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.fulfillment_status == DRAFT"
            - "Order.${ord_id}.payment_status == UNPAID"
            - "Order.${ord_id}.version == 1"
            - "Order.${ord_id}.estimated_total_cents == 0"

      - name: list_orders_pagination_envelope
        claim_type: Listing
        grounds: [entities.Order, endpoints]
        distinguishing_aspect: "GET /floral/orders returns an array envelope with total_count and has_more pagination fields; filterable by customer_id."
        test_recipe:
          setup: ["one customer with one order"]
          setup_api_calls:
            - call: "POST /floral/zones"
              payload: { zone_code: "ZC6", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CC6", display_name: "CC6", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "lp@x.com", full_name: "LP C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-01", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /floral/orders?customer_id=${cust_id}&limit=10&offset=0"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: quote_from_already_quoted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.DRAFT_to_QUOTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Quoting an Order already in QUOTED returns ERR_INVALID_STATE (409); no re-computation occurs."
        test_recipe:
          setup: ["a QUOTED order"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZS1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CS1", display_name: "CS1", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "q2@x.com", full_name: "Q2 C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-05", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_delivered_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a DELIVERED (terminal) order returns ERR_INVALID_STATE (409); no slot/credit side effects fire."
        test_recipe:
          setup: ["a DELIVERED order (full happy path)"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-08T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZS2", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CS2", display_name: "CS2", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "dl@x.com", full_name: "DL C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "ShopS2", covered_zone_id: "${zone_id}", daily_capacity: 5 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-12", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/orders/${ord_id}/confirm-delivery"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
          trigger:
            - call: "POST /floral/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Order.${ord_id}.fulfillment_status == DELIVERED"

      - name: book_without_authorized_payment_returns_precondition
        claim_type: guarded transitions
        grounds: [state_machines.Order.QUOTED_to_BOOKED, "validations[priority=7]", "errors[ERR_PRECONDITION_NOT_MET]"]
        distinguishing_aspect: "Booking a QUOTED order whose payment_status is still UNPAID fails ERR_PRECONDITION_NOT_MET (409); the cross-dimension guard on payment_status is enforced."
        test_recipe:
          setup: ["a QUOTED order that was never authorized"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZS3", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CS3", display_name: "CS3", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "np@x.com", full_name: "NP C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "ShopS3", covered_zone_id: "${zone_id}", daily_capacity: 5 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-11-20", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v_q: $.data.version }
          trigger:
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_q}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_PRECONDITION_NOT_MET"
            - "Order.${ord_id}.fulfillment_status == QUOTED"

      - name: schedule_emit_exhausted_auto_pauses
        claim_type: cyclic
        grounds: [state_machines.RecurringSchedule.ACTIVE_to_ACTIVE, state_machines.RecurringSchedule.ACTIVE_to_PAUSED, entities.RecurringSchedule.fields.occurrences_remaining]
        distinguishing_aspect: "A schedule with occurrences_remaining=1 emits once (ACTIVE->ACTIVE), then auto-transitions to PAUSED on exhaustion; a further emit returns ERR_SCHEDULE_EXHAUSTED (409)."
        test_recipe:
          setup: ["ACTIVE schedule occurrences_remaining=1"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZS4", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CS4", display_name: "CS4", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "se@x.com", full_name: "SE C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/recurring-schedules"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", cadence: "WEEKLY", next_delivery_date: "2026-12-10", window_start_minute: 540, window_end_minute: 720, occurrences_remaining: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sched_id: $.data.id }
            - call: "POST /floral/recurring-schedules/${sched_id}/emit"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /floral/recurring-schedules/${sched_id}/emit"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "RecurringSchedule.${sched_id}.status == PAUSED"
            - "RecurringSchedule.${sched_id}.occurrences_remaining == 0"
            - "response error_id == ERR_SCHEDULE_EXHAUSTED"

      - name: cancel_booked_cascade_already_covered
        claim_type: Cascade down
        grounds: [state_machines.Order.BOOKED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_booked_cascades_slot_then_fulfillment_then_florist_load
          rationale: "The slot->fulfillment->florist-load cascade is the depth-3 chain asserted by that §1.8 instance."

      - name: order_parallel_dimensions_already_covered
        claim_type: parallel
        grounds: [state_machines.Order.QUOTED_to_BOOKED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_parallel_payment_and_fulfillment_dimensions
          rationale: "Independent payment/fulfillment dimensions asserted by that §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: same_value_substitution_positive_delta_rejected
        claim_type: Constants Applied
        grounds: ["validations[priority=10]", entities.Arrangement.fields.substitution_policy, "errors[ERR_SUBSTITUTION_NOT_ALLOWED]"]
        distinguishing_aspect: "Under substitution_policy=SAME_VALUE, a substitution with price_delta_cents > 0 (+100) is rejected with ERR_SUBSTITUTION_NOT_ALLOWED (409); a <= 0 delta would be accepted."
        test_recipe:
          setup: ["a BOOKED order on a SAME_VALUE arrangement"]
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "ZK1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "CK1", display_name: "CK1", base_price_cents: 5000, substitution_policy: "SAME_VALUE" }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "sv@x.com", full_name: "SV C" }
