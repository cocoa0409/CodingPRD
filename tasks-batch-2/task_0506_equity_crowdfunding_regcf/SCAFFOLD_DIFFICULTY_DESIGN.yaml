              captures: { st: $.data.status }
            - call: "GET /offerings/${off_id}/cap-table"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          assert:
            - "Offering.${off_id}.status == FAILED"
            - "Investment.${my_inv_id}.status == REFUNDED"
            - "Investment.${my_inv_id}.securities_issued == 0"
            - "Investment.${my_inv_id}.refund_amount_cents == 200000"
