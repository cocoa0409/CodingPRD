      - name: default_declared_at_dpd_ninety_not_eighty_nine
        grounds:
          - calculations.delinquency_progression
          - state_machines.InstallmentLoan.delinquency_state.DELINQUENT_to_DEFAULT
          - entities.InstallmentLoan.fields.days_past_due
          - entities.Customer.fields.default_strike_count
          - endpoints.POST_/servicing/daily-run
        distinguishing_aspect: |
          A different metric (days_past_due against DEFAULT_MIN_DPD 90) reached through a
          different endpoint (POST /servicing/daily-run) than the eligibility boundary. Two
          sweeps one calendar day apart straddle the threshold: at 2026-11-29 the oldest
          unsatisfied installment is 89 days past due, so the loan must still be DELINQUENT
          with protection_coverage_status ACTIVE and the Customer must remain ACTIVE and
          unlocked; at 2026-11-30 dpd is exactly 90 and the whole DEFAULT cascade must fire.
          The precision trap is doubled: the comparison is >= (a `> 90` implementation
          defaults a day late) and the fee side must not double-assess — the second sweep
          reports late_fees_assessed_cents 0 because installments 1-3 were already fee-flagged
          at dpd 89 and installment 4 is not yet due.
