              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "R1" }
              as: StudioManager
              captures: { room1_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room1_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "R2" }
              as: StudioManager
              captures: { room2_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room2_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "B1" }
              as: StudioManager
              captures: { bike2_id: $.data.id }
