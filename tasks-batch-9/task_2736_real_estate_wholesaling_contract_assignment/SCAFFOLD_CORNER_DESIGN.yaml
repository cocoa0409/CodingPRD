          setup:
            - "Logical clock parked at 2026-08-06T00:00:00Z."
            - "One wholesaler, one STANDARD-tier lead, one FINALIZED AGGRESSIVE analysis and a signed contract at 18000000."
            - "The contract is elected to ASSIGNMENT (version captured here) and then re-elected to DOUBLE_CLOSE, which bumps the version again."
