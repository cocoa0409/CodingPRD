      - name: file_generate_on_open_cycle_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CYCLE_NOT_FROZEN]", "state_machines.MachineReadableFile"]
        distinguishing_aspect: "File generation requires cycle FROZEN; against an OPEN cycle (with the CORRECT current OCC version) the failure is ERR_CYCLE_NOT_FROZEN, proving the state gate runs independently of OCC."
        test_recipe:
          setup: ["Facility F; item SI; cycle CY OPEN with one DRAFT record; current cycle version captured"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-ER2", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
          trigger:
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CYCLE_NOT_FROZEN (http 409)"]

      - name: superseded_file_cannot_be_validated
        claim_type: violation_to_error
        grounds: ["errors[ERR_FILE_NOT_SEALED]", "state_machines.MachineReadableFile.UNVALIDATED_to_VALID"]
        distinguishing_aspect: "After regeneration supersedes F1, validating F1 fails ERR_FILE_NOT_SEALED — schema validation is defined only on the SEALED generation state."
        test_recipe:
          setup: ["Facility F; contract+rate ACTIVE; item SI; cycle FROZEN with VALIDATED record; file F1 SEALED; file F2 generated (supersedes F1)"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-ER3", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
