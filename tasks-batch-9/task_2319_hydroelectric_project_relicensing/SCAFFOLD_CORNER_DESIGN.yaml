              as_user_id: "u_lic_a"
              captures: { m_b: $.data.id, b_cost: $.data.annual_cost_usd }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version, pme: $.data.total_pme_annual_cost_usd, ratio: $.data.burden_ratio_pct }
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv}", filing_note: "relicense application" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { app: $.data.id }
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "SCOPING" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "DRAFT_EA" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "FINAL_EA" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/applications/${app}/order"
              payload: { order_number: "ORD-9029" }
              as: Regulator
              captures: { order: $.data.id, eff: $.data.effective_date, articles: $.data.article_count }
            - call: "GET /relicensing/obligations"
              payload: { order_id: "${order}", pme_measure_id: "${m_a}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ob_a: "$.data[0].id", due_a: "$.data[0].due_date", st_a: "$.data[0].status" }
            - call: "GET /relicensing/obligations"
              payload: { order_id: "${order}", pme_measure_id: "${m_b}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ob_b: "$.data[0].id", due_b: "$.data[0].due_date" }
            - call: "POST /relicensing/obligations/${ob_b}/schedule"
              payload: { activity_window_start: "2027-06-01", activity_window_end: "2027-06-30" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
            - call: "POST /relicensing/obligations/${ob_a}/schedule"
              payload: { activity_window_start: "2027-01-01", activity_window_end: "2027-01-31" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/obligations/${ob_a}/certify"
              payload: { certification_note: "flow release commissioned" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { a_state: $.data.status }
            - call: "POST /relicensing/obligations/${ob_b}/schedule"
              payload: { activity_window_start: "2027-06-01", activity_window_end: "2027-06-30" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { b_state: $.data.status }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { pme_after: $.data.total_pme_annual_cost_usd, gen_after: $.data.total_generation_loss_mwh, admin_after: $.data.administrative_annual_charge_usd, total_after: $.data.total_annual_burden_usd, ratio_after: $.data.burden_ratio_pct }
          assert:
            - "${a_cost} == 53000.00 (DEFINITIVE) and ${b_cost} == 57500.00 (PRELIMINARY)"
            - "${pme} == 110500.00 and ${ratio} == 1.36 at filing time, below the 15.00 limit"
            - "${eff} == 2026-08-01 and ${articles} == 2 (one obligation per INCLUDED measure, no dam obligations)"
            - "${due_a} == 2027-02-01 (effective_date + 6 months) and ${st_a} == PENDING"
            - "${due_b} == 2027-08-01, not 2027-05-01: max(effective + 9, due_a + PREREQ_LAG_MONTHS 6) wins"
            - "${err} == ERR_PREREQUISITE_NOT_IMPLEMENTED with HTTP 409 while ${m_a} is only SCHEDULED"
            - "${a_state} == CERTIFIED and PmeMeasure.${m_a}.status == IMPLEMENTED"
            - "${b_state} == SCHEDULED once the prerequisite is IMPLEMENTED"
            - "${pme_after} == 110500.00, ${gen_after} == 728.3, ${admin_after} == 2210.00, ${total_after} == 143298.60 and ${ratio_after} == 1.36 (IMPLEMENTED stays in the ledger set)"

      - name: pme_variant_switch_diverges_on_cost_and_generation
        claim_type: variant_divergence
        grounds:
          - calculations.pme_cost_and_generation_impact.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pme_preliminary_vs_definitive_estimate_diverge_on_both_axes
          rationale: "The named §1.8 instance asserts all six output fields under both variants and the opposite-direction delta of the two axes."

      - name: ledger_reconciles_when_the_variant_switches
        claim_type: reconciliation
        grounds:
          - calculations.pme_cost_and_generation_impact.reconciliation
        excluded_because:
          difficulty_instance: dual_variant_calc / pme_preliminary_vs_definitive_estimate_diverge_on_both_axes
          rationale: "The named §1.8 instance re-reads the project ledger after the cost-estimate switch and asserts the recomputed totals in the same request."

      - name: annual_report_basis_selects_different_assessed_sets
        claim_type: variant_selection
        grounds:
          - calculations.compliance_year_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / annual_report_calendar_vs_anniversary_basis_assess_different_sets
          rationale: "The named §1.8 instance files both bases against the same obligations and asserts the differing assessed counts and scores."

      - name: administrative_charge_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.project_burden_ledger.constants.ADMIN_CHARGE_TIERS
        excluded_because:
          difficulty_instance: combinatorial_formula / admin_charge_tier_keyed_on_pre_charge_pme_cost_only
          rationale: "The named §1.8 instance walks the tier boundaries and proves the charge never re-enters its own tier lookup."

      - name: timeline_posture_slack_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.relicensing_timeline_posture.constants.TIMELINE_AT_RISK_DAYS
        excluded_because:
          difficulty_instance: boundary_precision_check / timeline_slack_exactly_at_at_risk_boundary_is_not_delinquent
          rationale: "The named §1.8 instance tests slack 181, exactly 180 and negative slack around the AT_RISK boundary."

      - name: burden_ratio_limit_precision
        claim_type: precision
        grounds:
          - calculations.project_burden_ledger.constants.BURDEN_RATIO_LIMIT_PCT
        excluded_because:
          difficulty_instance: boundary_precision_check / burden_ratio_exactly_at_limit_is_infeasible_and_one_mwh_more_is_not
          rationale: "The named §1.8 instance pins the ratio to exactly 15.00 and to one MWh past it, asserting both feasibility verdicts."

      - name: support_tally_weighted_rounding_order
        claim_type: weighted_scoring
        grounds:
          - calculations.settlement_support_tally
        excluded_because:
          difficulty_instance: combinatorial_formula / support_tally_rounds_per_party_before_summing_and_blocks_execution
          rationale: "The named §1.8 instance asserts per-party share_pct rounding before the sum and the resulting execution block."

      - name: empty_assessment_period_scores_one_hundred
        claim_type: precision
        grounds:
          - calculations.compliance_year_assessment.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_report_period_scores_exactly_one_hundred_without_clearing_flags
          rationale: "The named §1.8 instance files a report over an empty period and asserts exactly 100.00 with the flag state untouched."

      - name: posture_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.project_regulatory_posture
        excluded_because:
          difficulty_instance: transitive_cascade / wqc_condition_issuance_cascades_into_restricted_posture
          rationale: "The named §1.8 instance drives the counter-to-posture propagation across three entities in one request and asserts the settled tier."

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_license_number_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: "license_number is unique across the whole RelicensingProject collection, and the losing request creates nothing."
        test_recipe:
          setup:
            - "One project already registered with license_number P-9030."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9030", project_name: "First Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9030", project_name: "Second Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 70000, license_expiration_date: "2036-06-30" }
              as: Regulator
              captures: { err: $.data.error_id }
            - call: "GET /relicensing/projects"
              payload: { limit: 100, offset: 0 }
              as: Regulator
              captures: { total: $.total_count }
          assert:
            - "${err} == ERR_DUPLICATE_KEY with HTTP 409"
            - "${total} == 1 and the surviving project is ${proj} with project_name First Reach"

      - name: site_code_uniqueness_is_scoped_to_the_project
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=40]
          - endpoints["POST /relicensing/sites"]
        distinguishing_aspect: "The same site_code in two different projects is accepted because the uniqueness scope is the project, while the repeat inside one project is rejected."
        test_recipe:
          setup:
            - "Two projects P-9031 and P-9032."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9031", project_name: "Scope Reach A", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { pa: $.data.id }
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9032", project_name: "Scope Reach B", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /relicensing/sites"
              payload: { project_id: "${pa}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sa: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${pb}", site_code: "S1", river_mile: 4.5 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sb: $.data.id, sb_code: $.data.site_code, sb_mile: $.data.river_mile }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${pa}", site_code: "S1", river_mile: 9.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
            - call: "GET /relicensing/sites"
              payload: { project_id: "${pa}", limit: 100, offset: 0 }
              as: Regulator
              captures: { total_a: $.total_count }
          assert:
            - "${sa} and ${sb} are both created with HTTP 201 and ${sb} != ${sa}"
            - "${sb_code} == S1 and ${sb_mile} == 4.5"
            - "${err} == ERR_DUPLICATE_KEY with HTTP 409 for the repeat inside ${pa}"
            - "${total_a} == 1"

      - name: pagination_limit_above_one_hundred_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "The pagination range check is the only rule in the catalog that returns ERR_VALIDATION rather than ERR_INVALID_REQUEST, and limit 100 is inside the range while 101 and a negative offset are not."
        test_recipe:
          setup:
            - "One project so the list is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9033", project_name: "Pagination Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /relicensing/projects"
              payload: { limit: 100, offset: 0 }
              as: Regulator
              captures: { total_ok: $.total_count, more_ok: $.has_more }
            - call: "GET /relicensing/projects"
              payload: { limit: 101, offset: 0 }
              as: Regulator
              captures: { err_limit: $.data.error_id }
            - call: "GET /relicensing/projects"
              payload: { limit: 10, offset: -1 }
              as: Regulator
              captures: { err_offset: $.data.error_id }
            - call: "GET /relicensing/projects"
              payload: { limit: 0, offset: 0 }
              as: Regulator
              captures: { err_zero: $.data.error_id }
          assert:
            - "${total_ok} == 1 and ${more_ok} == false at limit 100"
            - "${err_limit} == ERR_VALIDATION with HTTP 400"
            - "${err_offset} == ERR_VALIDATION with HTTP 400"
            - "${err_zero} == ERR_VALIDATION with HTTP 400 (limit 0 is below the range)"

      - name: cultural_clearance_required_only_at_high_sensitivity_sites
        claim_type: conditional_validation
        grounds:
          - validations[priority=65]
          - errors[ERR_CULTURAL_CLEARANCE_MISSING]
        distinguishing_aspect: "The rule is keyed on the site's cultural_sensitivity and not on the study's resource_category: a MODERATE site takes the same payload happily, a HIGH site rejects it, and the HIGH site accepts it once cultural_clearance_reference is supplied."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with site SM (cultural_sensitivity MODERATE) and site SH (cultural_sensitivity HIGH) and a DRAFT plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9034", project_name: "Clearance Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "SM", river_mile: 1.0, cultural_sensitivity: "MODERATE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sm: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "SH", river_mile: 6.0, cultural_sensitivity: "HIGH" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sh: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${sm}", resource_category: "CULTURAL", study_title: "Ethnographic survey at moderate site", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { s_mod: $.data.id, mod_clear: $.data.cultural_clearance_reference }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${sh}", resource_category: "RECREATION", study_title: "Recreation survey at high site", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${sh}", resource_category: "RECREATION", study_title: "Recreation survey at high site", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01", cultural_clearance_reference: "THPO-2026-118" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { s_high: $.data.id, high_clear: $.data.cultural_clearance_reference }
            - call: "GET /relicensing/study-plans/${plan}"
              payload: {}
              as: Regulator
              captures: { cnt: $.data.attached_study_count }
          assert:
            - "${s_mod} is created with HTTP 201 and ${mod_clear} == null (a MODERATE site needs no reference even for a CULTURAL study)"
            - "${err} == ERR_CULTURAL_CLEARANCE_MISSING with HTTP 422 (a RECREATION study still needs the reference at a HIGH site)"
            - "${s_high} is created with HTTP 201 and ${high_clear} == THPO-2026-118"
            - "${cnt} == 2 (the rejected attempt did not increment the plan counter)"

      - name: signature_outside_a_circulated_round_and_repeat_signature_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=48]
          - validations[priority=49]
          - errors[ERR_SIGNATURE_ROUND_CLOSED]
          - errors[ERR_DUPLICATE_SIGNATURE]
        distinguishing_aspect: "Two neighbouring signature rules: the round must be CIRCULATED at all (rejected while NEGOTIATING) and one party may sign only once inside that round, with the repeat rejected even when the position differs."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with two parties (AGENCY u_agency vote_weight 1, TRIBE u_tribe vote_weight 1) and a NEGOTIATING settlement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9035", project_name: "Signature Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { pa: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Tribe", party_type: "TRIBE", vote_weight: 1, contact_user_id: "u_tribe" }
              as: Regulator
              captures: { pt: $.data.id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Round rules settlement", expected_project_version: "${pv}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id }
          trigger:
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${pa}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err_closed: $.data.error_id }
            - call: "POST /relicensing/settlements/${stl}/circulate"
              payload: { circulation_note: "out for signature" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { st: $.data.status, tvw: $.data.total_vote_weight }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${pa}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { sig: $.data.id, rn: $.data.round_number, share: $.data.share_pct }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${pa}", position: "OPPOSE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err_dup: $.data.error_id }
            - call: "GET /relicensing/signatures"
              payload: { settlement_id: "${stl}", limit: 100, offset: 0 }
              as: Regulator
              captures: { total: $.total_count }
          assert:
            - "${err_closed} == ERR_SIGNATURE_ROUND_CLOSED with HTTP 409 while the settlement is NEGOTIATING"
            - "${st} == CIRCULATED and ${tvw} == 2 after circulation"
            - "${sig} is created with ${rn} == 1 and ${share} == null (share_pct waits for the tally)"
            - "${err_dup} == ERR_DUPLICATE_SIGNATURE with HTTP 409 and SettlementSignature.${sig}.position stays SUPPORT"
            - "${total} == 1 (party ${pt} never signed and is not represented by a row)"

      - name: conditioning_party_veto_blocks_a_tally_that_clears_the_threshold
        claim_type: cascading_validation
        grounds:
          - validations[priority=70]
          - validations[priority=71]
          - calculations.settlement_support_tally
        distinguishing_aspect: "The support check at priority 70 passes at 83.33 and the veto at priority 71 still rejects the execution; the very same signature set tallied with CLOSE_ROUND persists support_pct 83.33, proving the veto is a separate gate rather than a scoring adjustment."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with an APPROVED study plan and three parties: AGENCY u_agency (conditioning, vote_weight 1), TRIBE u_tribe (vote_weight 3), NGO u_ngo (vote_weight 2)."
            - "A CIRCULATED settlement with round 1 signatures OPPOSE from the agency and SUPPORT from the tribe and the NGO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9036", project_name: "Veto Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
