            - call: "POST /seafood-ops/ad-items"
              payload: { counter_id: "${counter_id}", lot_id: "${lot_id}", headline: "Fresh Atlantic Cod at the Counter", ad_start_at: "2026-08-01T09:00:00Z", ad_end_at: "2026-08-01T10:00:00Z" }
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
              captures: { item_one: $.data.id }
            - call: "POST /seafood-ops/ad-items/${item_one}/clear-cool"
              payload: { decision: "CLEAR" }
