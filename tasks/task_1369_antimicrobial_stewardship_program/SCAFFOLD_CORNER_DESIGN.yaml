        test_recipe:
          setup: ["H; MD; PH; P; restricted order; AR SUBMITTED"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
