        grounds: [endpoints, entities.Account.fields.ytd_completed_count, calculations.fleet_volume_discount]
        distinguishing_aspect: "POST /dmv/_fee-periods/advance resets a FLEET account's ytd_completed_count (injected to 20) back to 0, so a subsequent quote drops from the 1250 bps tier to no discount (service 4500)."
        test_recipe:
          setup: ["A FLEET account with ytd_completed_count injected to 20 and a fresh REGISTRATION Transaction in DRAFT."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
