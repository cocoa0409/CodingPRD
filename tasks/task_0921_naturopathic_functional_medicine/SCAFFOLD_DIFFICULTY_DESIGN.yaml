              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-30" }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-31" }
              as: PracticeAdmin
              captures: { mem_2: $.data.id }
          assert:
            - "Membership.${mem_1}.cycle_end_date == 2026-05-30"
            - "The 2026-05-30 membership returned 409 with error_id ERR_MEMBERSHIP_CYCLE_OVERLAP"
            - "The 2026-05-31 membership returned 201 and Membership.${mem_2}.cycle_end_date == 2026-06-29"
            - "Membership.${mem_2}.visits_granted == 4"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: visit_unit_returned_on_early_cancel_and_moved_to_forfeited_on_late_cancel
        grounds:
          - state_machines.Encounter.ENTITLEMENT_RESERVED_to_REFUNDED
          - state_machines.Encounter.ENTITLEMENT_RESERVED_to_FORFEITED
          - conservation_invariants.membership_visit_units
          - entities.Membership.fields.visits_forfeited
        distinguishing_aspect: |
          Conserved quantity: membership VISIT UNITS. Across a reservation, an exactly
          24-hours-ahead cancellation that returns the unit and a 23-hours-ahead
          cancellation that moves it to forfeited, the identity
          visits_granted == visits_consumed + visits_remaining + visits_forfeited holds at
          every step and ends at 4 == 0 + 3 + 1.
        test_recipe:
          setup:
            - "A CORE membership opened 2026-05-01 with visits_granted 4"
            - "Two IN_PERSON encounters booked while the clock is at 2026-05-01, both ENTITLEMENT_RESERVED, leaving consumed 2 and remaining 2"
          setup_api_calls:
