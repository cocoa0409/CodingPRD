# §1.9 Scaffold Corner Design — breadth probe for
# task_2532_project_based_rental_assistance_contract_renewal
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections and this
# scaffold's own §1.1-§1.7 surface. Every claim already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# is emitted here as an `excluded_because:` stub naming the covering §1.8 instance.
#
# SHARED REFERENCE FIXTURE (identical to §1.8 so both files transcribe into one conftest):
#   Owner   "Cedar Ridge Housing Partners LP", tin 27-3310011
#   Property "Cedar Ridge Apartments", IL, total_units 24, assisted_unit_count 20,
#            published_fmr_cents 126000, baseline_utility_allowance_cents 11500, no FHA mortgage
#   HapContract NEW_CONSTRUCTION, expiration 2027-12-31, term 12, rent 118000, debt 32000,
#            opex 61000, reserve 4500, authorized_hap_budget_cents 30000000
#   Household T1 unit 101 "Alvarez" adjusted 1800000 / gross 1920000 / family 3 -> ttp 45000, hap 84500
#   Household T2 unit 102 "Boone"   adjusted   60000 / gross   60000 / family 1 -> ttp  2500, hap 127000
#   Default logical clock 2026-08-01T00:00:00Z; chains that open a RenewalCase first move it to
#   2026-12-01 (395 days to expiration, inside RENEWAL_WINDOW_DAYS 420).
#   The OwnerAgent's X-User-ID is always the created Owner.id (identity entity_backed:Owner).

scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_creation_returns_every_declared_field_in_the_success_envelope
        claim_type: Creation
        grounds:
          - entities.Owner
          - endpoints[POST /pbra/owners]
          - response_envelope.success
        distinguishing_aspect: "POST /pbra/owners with the three input fields returns 201 and a data object carrying legal_name, tin, contact_email plus the system-derived portfolio_property_count 0 and compliance_flag OK; the envelope wraps it as response_type object with a meta block."
        test_recipe:
          setup: ["Empty database; no owner with tin 27-3310011 exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { owner_id: $.data.id, portfolio_count: $.data.portfolio_property_count, flag: $.data.compliance_flag, owner_version: $.data.version }
          assert:
            - "HTTP 201"
            - "Owner.${owner_id}.legal_name == Cedar Ridge Housing Partners LP and Owner.${owner_id}.tin == 27-3310011 and Owner.${owner_id}.contact_email == agent@cedarridge.example"
            - "${portfolio_count} == 0 and ${flag} == OK and ${owner_version} == 1"
            - "The response body has meta.api_request_id, meta.api_request_timestamp, response_type == object and the row under data"

      - name: property_retrieval_returns_the_stored_row_and_bumps_the_owner_portfolio_counter
        claim_type: Retrieval
        grounds:
          - entities.Property
          - entities.Owner.fields.portfolio_property_count
          - endpoints[GET /pbra/properties/{id}]
        distinguishing_aspect: "GET /pbra/properties/{id} returns exactly what POST stored, and the create's cross-entity side effect is observable on the parent: Owner.portfolio_property_count is 1 after one property."
        test_recipe:
          setup: ["One owner exists."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
          trigger:
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { got_owner_id: $.data.owner_id, got_state: $.data.state_code, got_units: $.data.total_units, got_assisted: $.data.assisted_unit_count, got_fmr: $.data.published_fmr_cents }
            - call: "GET /pbra/owners/${owner_id}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { portfolio_after: $.data.portfolio_property_count }
          assert:
            - "${got_owner_id} == ${owner_id} and ${got_state} == IL and ${got_units} == 24 and ${got_assisted} == 20 and ${got_fmr} == 126000"
            - "${portfolio_after} == 1"

      - name: utility_allowance_analysis_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /pbra/properties/{id}/utility-allowance-analyses]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three DRAFT analyses on one property (only submit is gated by ERR_UA_ANALYSIS_IN_FLIGHT, creation is not) paginate as total_count 3 with has_more true at limit 2 and has_more false on the offset-2 page; the array is wrapped as response_type array."
        test_recipe:
          setup: ["One owner, one property, and three DRAFT FACTOR_BASED analyses created in order (effective 2026-09-01, 2026-10-01, 2026-11-01)."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2026-09-01", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_a_id: $.data.id }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2026-10-01", utility_rate_change_pct: 0.05 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_b_id: $.data.id }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "ENGINEERING_BASED", effective_date: "2026-11-01", engineering_estimate_cents: 12000 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_c_id: $.data.id }
          trigger:
            - call: "GET /pbra/properties/${property_id}/utility-allowance-analyses"
              payload: { limit: 2, offset: 0 }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /pbra/properties/${property_id}/utility-allowance-analyses"
              payload: { limit: 2, offset: 2 }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /pbra/properties/${property_id}/utility-allowance-analyses"
              payload: { state: "DRAFT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
          assert:
            - "First page: total_count == 3, has_more == true, limit == 2, offset == 0, exactly 2 rows, ${page1_first} == ${ua_a_id} and ${page1_second} == ${ua_b_id}"
            - "Second page: total_count == 3, has_more == false, exactly 1 row, ${page2_first} == ${ua_c_id}"
            - "The unparameterised state=DRAFT call applies the defaults limit 10 / offset 0 and returns all 3 rows with has_more == false"
            - "response_type == array on every page"

      - name: unknown_path_ids_report_the_entity_specific_not_found_code
        claim_type: Not Found
        grounds:
          - errors[ERR_OWNER_NOT_FOUND]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_RENEWAL_CASE_NOT_FOUND]
          - errors[ERR_STUDY_NOT_FOUND]
          - errors[ERR_UA_ANALYSIS_NOT_FOUND]
          - errors[ERR_TENANT_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_NOTICE_NOT_FOUND]
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - errors[ERR_ENHANCED_VOUCHER_NOT_FOUND]
          - errors[ERR_VOUCHER_SUBMISSION_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "Each of the thirteen path-addressed entities answers a syntactically valid but unknown UUID with its OWN 404 code, never a generic one; the existence check at priority 10 runs before any state or business rule, so a wrong id never produces a 409 or 422."
        test_recipe:
          setup: ["Empty database. Every id below is a well-formed UUID that matches no row."]
          setup_api_calls: []
          trigger:
            - call: "GET /pbra/owners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/properties/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/hap-contracts/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/renewal-cases/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/rent-comparability-studies/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/utility-allowance-analyses/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/tenant-households/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/tenant-certifications/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/tenant-notices/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/restructuring-determinations/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/enhanced-vouchers/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/voucher-submissions/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "GET /pbra/special-claims/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
          assert:
            - "Every call returns HTTP 404 with response_type error"
            - "error_id values in order: ERR_OWNER_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_RENEWAL_CASE_NOT_FOUND, ERR_STUDY_NOT_FOUND, ERR_UA_ANALYSIS_NOT_FOUND, ERR_TENANT_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_DETERMINATION_NOT_FOUND, ERR_ENHANCED_VOUCHER_NOT_FOUND, ERR_VOUCHER_SUBMISSION_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "Each error body carries data.error_id and data.message and no data row fields"

      - name: body_foreign_keys_are_resolved_before_any_business_rule_runs
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_OWNER_NOT_FOUND]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_RENEWAL_CASE_NOT_FOUND]
          - errors[ERR_STUDY_NOT_FOUND]
          - errors[ERR_COMPARABLE_NOT_FOUND]
          - errors[ERR_TENANT_NOT_FOUND]
          - validations[priority=11]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so parents arrive as body FKs rather than URL segments: owner_id, property_id, contract_id, renewal_case_id, study_id, supersedes_study_id, tenant_id and every id inside struck_comparable_ids are resolved at priority 11 — before the renewal-window, state and fiscal rules — and a comparable belonging to another study is reported as ERR_COMPARABLE_NOT_FOUND rather than silently ignored."
        test_recipe:
          setup:
            - "Owner, property, contract, clock 2026-12-01, an OPTION_2_OCAF renewal case, and one SUBMITTED study with a single accepted comparable so that a challenge is legal."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id, owner_version: $.data.version }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases/${case_id}/elect-adjustment"
              payload: { adjustment_method: "OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_id}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { study_id: $.data.id }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_id}", address_label: "88 Alder Court", raw_rent_cents: 125000, adjustment_total_cents: 4650, utility_adjustment_cents: 1500, weight: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${study_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /pbra/properties"
              payload: { owner_id: "00000000-0000-4000-8000-0000000000f1", project_name: "Ghost Owner Apartments", state_code: "IL", total_units: 10, assisted_unit_count: 8, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "00000000-0000-4000-8000-0000000000f2", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "00000000-0000-4000-8000-0000000000f3" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "00000000-0000-4000-8000-0000000000f4", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_id}", appraiser_name: "Hollis Appraisal Group", supersedes_study_id: "00000000-0000-4000-8000-0000000000f5" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/comparables"
              payload: { study_id: "00000000-0000-4000-8000-0000000000f6", address_label: "Nowhere", raw_rent_cents: 100000, adjustment_total_cents: 0, utility_adjustment_cents: 0, weight: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "00000000-0000-4000-8000-0000000000f7", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${owner_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${study_id}/challenge"
              payload: { reason: "Comparable 1 is not comparable", struck_comparable_ids: ["00000000-0000-4000-8000-0000000000f8"] }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
          assert:
            - "The seven FK calls return, in order: 404 ERR_OWNER_NOT_FOUND, 404 ERR_PROPERTY_NOT_FOUND, 404 ERR_CONTRACT_NOT_FOUND, 404 ERR_RENEWAL_CASE_NOT_FOUND, 404 ERR_STUDY_NOT_FOUND (supersedes_study_id), 404 ERR_STUDY_NOT_FOUND (study_id on the comparable), 404 ERR_TENANT_NOT_FOUND"
            - "The tenant-certification call reports ERR_TENANT_NOT_FOUND at priority 11 and NOT ERR_STALE_TENANT_VERSION at priority 20, proving existence precedes the OCC check"
            - "The challenge returns 404 ERR_COMPARABLE_NOT_FOUND"
            - "RentComparabilityStudy.${study_id}.state == SUBMITTED and challenge_round == 0 — a rejected challenge fires no side effect"
            - "No Property, HapContract, RenewalCase, RentComparabilityStudy, Comparable or TenantCertification row was created by any of the eight calls"

      - name: a_required_body_field_supplied_as_null_is_rejected_as_an_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - entities.Property.fields.assisted_unit_count
        distinguishing_aspect: "Every Property input field except has_fha_insured_mortgage is required with no default; sending assisted_unit_count as null (or omitting it) is a 400 ERR_INVALID_REQUEST at priority 15, before the FK resolution result is reported and before any unit-conservation arithmetic runs."
        test_recipe:
          setup: ["One owner exists."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: null, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "No Property row was created and Owner.${owner_id}.portfolio_property_count == 0"

      - name: omitted_optional_input_and_all_derived_openings_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Property.fields.current_utility_allowance_cents
          - entities.Property.fields.units_under_hap_count
          - entities.Property.fields.has_fha_insured_mortgage
          - entities.HapContract.fields.hap_ledger_balance_cents
          - entities.HapContract.fields.lifecycle_status
          - calculations.assisted_unit_conservation
        distinguishing_aspect: "has_fha_insured_mortgage is the only optional Property input and defaults to false when omitted; current_utility_allowance_cents opens at the baseline 11500, the three unit counters open at 20 / 0 / 0, and a fresh contract opens ACTIVE with paid totals 0, hap_ledger_balance_cents equal to the full authorization and every renewed_* field null."
        test_recipe:
          setup: ["One owner exists; the property payload omits has_fha_insured_mortgage entirely."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id, fha: $.data.has_fha_insured_mortgage, cur_ua: $.data.current_utility_allowance_cents, uhap: $.data.units_under_hap_count, ev_units: $.data.enhanced_voucher_unit_count, released: $.data.released_unit_count, last_ua: $.data.last_applied_ua_effective_date }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { contract_id: $.data.id, lifecycle: $.data.lifecycle_status, paid_hap: $.data.paid_hap_total_cents, paid_claims: $.data.paid_claims_total_cents, ledger: $.data.hap_ledger_balance_cents, renewed_rent: $.data.renewed_rent_per_unit_cents, renewed_exp: $.data.renewed_expiration_date, renewed_opt: $.data.renewed_option }
          assert:
            - "${fha} == false"
            - "${cur_ua} == 11500 and ${uhap} == 20 and ${ev_units} == 0 and ${released} == 0 and ${last_ua} == null"
            - "${uhap} + ${ev_units} + ${released} == 20, so assisted_unit_conservation holds at creation"
            - "${lifecycle} == ACTIVE and ${paid_hap} == 0 and ${paid_claims} == 0 and ${ledger} == 30000000"
            - "${renewed_rent} == null and ${renewed_exp} == null and ${renewed_opt} == null"

      - name: certification_money_fields_are_computed_from_the_snapshots_not_from_the_request
        claim_type: Computed Fields
        grounds:
          - calculations.tenant_rent_recalculation
          - entities.TenantCertification.fields.gross_rent_cents
          - entities.TenantCertification.fields.utility_reimbursement_cents
          - entities.TenantHousehold.fields.current_hap_cents
        distinguishing_aspect: "The certification request carries only tenant_id, cert_type, effective_date and the OCC version; every money field is derived. T1 (adjusted 1800000) lands ttp 45000 / tenant_rent 33500 / reimbursement 0 / hap 84500, while T2 (adjusted 60000) is floored to the 2500 minimum rent and therefore receives a 9000 utility REIMBURSEMENT with tenant_rent 0 — the same formula producing opposite-sign outcomes."
        test_recipe:
