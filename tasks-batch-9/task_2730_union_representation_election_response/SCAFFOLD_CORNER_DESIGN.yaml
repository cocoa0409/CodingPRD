      - name: state_check_precedes_the_location_overlap_check
        claim_type: Priority conflict
        grounds:
          - validation_priority_conflicts.state-beats-constraint
          - validations[priority=12]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_constraint_on_poll_session_create
          rationale: "The named \u00a71.8 instance issues the poll-session create that violates both priority 12 and priority 21 and pins ERR_ROUND_NOT_SCHEDULED as the winner."

      - name: safety_check_precedes_the_campaign_window_check
        claim_type: Priority conflict
        grounds:
          - validation_priority_conflicts.safety-beats-temporal
          - validations[priority=14]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_temporal_on_delivery
          rationale: "The named \u00a71.8 instance delivers a blackout captive-audience message after the polls closed and pins the 422 ERR_PEERLESS_PLYWOOD_WINDOW over the 409 ERR_CAMPAIGN_PERIOD_CLOSED."

      - name: cross_petition_check_precedes_the_observer_seat_count
        claim_type: Priority conflict
        grounds:
          - validation_priority_conflicts.referential-beats-fiscal
          - validations[priority=9]
          - validations[priority=26]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_fiscal_on_observer_seat
          rationale: "The named \u00a71.8 instance designates a foreign-petition supervisor for a party that already holds three seats and pins ERR_CROSS_PETITION_REFERENCE."

      - name: an_untrained_presenter_blocks_a_meeting_submission
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - errors.ERR_PRESENTER_NOT_TRAINED
          - entities.Supervisor.fields.training_status
        excluded_because:
          difficulty_instance: cross_entity_state_precondition / meeting_submission_requires_trained_presenter
          rationale: "The named \u00a71.8 instance submits a meeting-channel message whose presenter is UNTRAINED, then trains the presenter and replays the same call successfully."

      - name: open_challenges_block_a_revised_tally
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - errors.ERR_CHALLENGES_UNRESOLVED
          - entities.ElectionRound.fields.challenged_open_count
        excluded_because:
          difficulty_instance: cross_entity_state_precondition / revise_tally_requires_all_challenges_resolved
          rationale: "The named \u00a71.8 instance requests a revision with one challenge still OPEN, resolves it, and replays the call."

      - name: an_accepted_list_is_required_before_the_polls_open
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
          - errors.ERR_VOTER_LIST_NOT_ACCEPTED
          - entities.VoterList.fields.status
        excluded_because:
          difficulty_instance: cross_entity_state_precondition / open_polls_requires_accepted_voter_list
          rationale: "The named \u00a71.8 instance opens polls against a round whose voter list is only SUBMITTED and asserts the refusal plus the unchanged round state."

      - name: location_overlap_at_the_teardown_boundary
        claim_type: Temporal validation
        grounds:
          - validations[priority=21]
          - constants.POLL_SESSION_TEARDOWN_MINUTES
          - errors.ERR_POLL_SESSION_LOCATION_CONFLICT
        excluded_because:
          difficulty_instance: interval_boundary_semantics / poll_session_location_half_open_teardown
          rationale: "The named \u00a71.8 instance places one session exactly 30 minutes after another ends (accepted) and one a second earlier (refused), which is the whole content of this rule."

      - name: presenter_overlap_at_the_travel_buffer_boundary
        claim_type: Temporal validation
        grounds:
          - validations[priority=22]
          - constants.PRESENTER_TRAVEL_BUFFER_MINUTES
          - errors.ERR_PRESENTER_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: interval_boundary_semantics / presenter_calendar_closed_symmetric_buffer
          rationale: "The named \u00a71.8 instance tests the closed, symmetrically padded interval where touching endpoints conflict."

      - name: escalation_ack_at_exactly_the_escalation_threshold
        claim_type: Conditional validation
        grounds:
          - validations[priority=15]
          - constants.RISK_ESCALATION_THRESHOLD
          - errors.ERR_ESCALATION_ACK_REQUIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / risk_score_escalation_threshold_seventy
          rationale: "The named \u00a71.8 instance approves a 69-score message without the acknowledgement and refuses a 70-score one, then approves it with the flag."

      - name: completeness_and_deadline_boundaries_interact
        claim_type: Aggregate validation
        grounds:
          - validations[priority=18]
          - calculations.voter_list_grading
          - entities.VoterList.fields.list_grade
        excluded_because:
          difficulty_instance: boundary_precision_check / voter_list_ninety_percent_and_deadline_equality
          rationale: "The named \u00a71.8 instance pins 90.00 exactly as MINOR_DEFECT and submitted_at == due_at exactly as on time, including the lateness bump when both boundaries move by one unit."


