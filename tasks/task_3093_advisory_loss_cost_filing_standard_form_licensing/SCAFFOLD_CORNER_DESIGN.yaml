# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3093_advisory_loss_cost_filing_standard_form_licensing
#
# Breadth probe: claims the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. §1.8-covered
# corners appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: insurer_create_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.MemberInsurer
          - endpoints.POST_/bureau/insurers
        distinguishing_aspect: "A minimal insurer create returns 201 with insurer_status ACTIVE, quality_score_bps 10000, version 1, and server-minted id/created_at/updated_at — status and score are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-001", legal_name: "First Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "MemberInsurer.${ins_id}.insurer_status == ACTIVE"
            - "MemberInsurer.${ins_id}.quality_score_bps == 10000"
            - "MemberInsurer.${ins_id}.version == 1"
            - "the response carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: insurer_get_round_trips_and_unknown_id_returns_not_found
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/bureau/insurers/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "GET returns the stored row; an unallocated UUID yields 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup:
            - "One insurer created."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-002", legal_name: "Second Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
          trigger:
            - call: "GET /bureau/insurers/${ins_id}"
              payload: {}
              as: BureauActuary
            - call: "GET /bureau/insurers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauActuary
              captures: { err_id: $.data.error_id }
          assert:
            - "the first GET returns 200 with insurer_code INS-002"
            - "the second GET returns 404 and error_id == ERR_NOT_FOUND"
            - "the error response has response_type error and data carries error_id and message"

      - name: submissions_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/bureau/submissions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three submissions on one insurer, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; defaults are limit 10 / offset 0."
        test_recipe:
          setup:
            - "One ACTIVE insurer, one ACTIVE plan, three RECEIVED submissions."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-003", legal_name: "Third Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-L", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-04-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-04-01T00:00:00Z", period_end: "2025-07-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-07-01T00:00:00Z", period_end: "2025-10-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
          trigger:
            - call: "GET /bureau/submissions"
              payload: { insurer_id: "${ins_id}", limit: 2, offset: 0 }
              as: BureauAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /bureau/submissions?insurer_id=${ins_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /bureau/submissions with no query params returns 3 rows under default limit 10 / offset 0"

      - name: submission_create_missing_record_count_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.StatisticalSubmission.fields.record_count
          - validations.priority_14_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "record_count is required with no default; omitting it is 400 ERR_INVALID_REQUEST, not a 404 FK error and not a silent zero."
        test_recipe:
          setup:
            - "One ACTIVE insurer and one ACTIVE plan."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-004", legal_name: "Fourth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-M", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /bureau/submissions?insurer_id=${ins_id} returns 0 rows"

      - name: filing_create_without_supersede_starts_at_version_1_draft
        claim_type: Defaults
        grounds:
          - entities.LossCostFiling.fields.filing_version
          - entities.LossCostFiling.fields.supersedes_filing_id
        distinguishing_aspect: "Omitting supersedes_filing_id stores null, filing_version is system-set to 1, review_notes defaults to null, and filing_status starts DRAFT."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-CA-CP-001", state_code: "CA", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
          assert:
            - "the response status is 201"
            - "LossCostFiling.${f_id}.filing_version == 1"
            - "LossCostFiling.${f_id}.supersedes_filing_id is null"
            - "LossCostFiling.${f_id}.review_notes is null"
            - "LossCostFiling.${f_id}.filing_status == DRAFT"
            - "LossCostFiling.${f_id}.filed_at is null and last_submitted_by_admin_id is null"

      - name: accepted_record_count_computed_at_disposition
        claim_type: Computed Fields
        grounds:
          - entities.StatisticalSubmission.fields.accepted_record_count
          - state_machines.StatisticalSubmission.EDITING_to_ACCEPTED
        distinguishing_aspect: "accepted_record_count = record_count - count of ERROR findings' affected_records is computed at disposition: a 10-record batch with one ERROR finding covering 2 records lands ACCEPTED... no — one ERROR finding routes to REJECTED, so the computed field is observable on REJECTED with accepted_record_count == 8."
        test_recipe:
          setup:
            - "ACTIVE insurer, ACTIVE plan; a submission of 10 records in EDITING with one ERROR finding covering 2 records."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-005", legal_name: "Fifth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-N", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /bureau/submissions/${sub_id}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/findings"
              payload: { edit_code: "E-200", severity: "ERROR", affected_records: 2 }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions/${sub_id}/dispose"
              payload: {}
              as: BureauAdmin
          assert:
            - "StatisticalSubmission.${sub_id}.submission_status == REJECTED"
            - "StatisticalSubmission.${sub_id}.error_finding_count == 1 and warning_finding_count == 0"
            - "StatisticalSubmission.${sub_id}.accepted_record_count == 8"

      - name: submission_create_with_system_fields_in_payload_ignored_input
        claim_type: System Fields
        grounds:
          - entities.StatisticalSubmission.fields.submission_status
          - endpoints.POST_/bureau/submissions
        distinguishing_aspect: "submission_status is source: system; a client sending submission_status=ACCEPTED in the create body has it ignored — the row lands RECEIVED with version 1."
        test_recipe:
          setup:
            - "ACTIVE insurer, ACTIVE plan."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-006", legal_name: "Sixth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-O", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 5, written_premium_cents: 50000, submission_status: "ACCEPTED", version: 42 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "the response status is 201"
            - "StatisticalSubmission.${sub_id}.submission_status == RECEIVED"
            - "StatisticalSubmission.${sub_id}.version == 1"

      - name: finding_create_with_out_of_enum_severity_rejected
        claim_type: Type Constraints
        grounds:
          - entities.SubmissionEditFinding.fields.severity
          - validations.priority_14_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "severity is a closed enum {ERROR, WARNING}; CRITICAL is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "ACTIVE insurer, ACTIVE plan; a submission in EDITING."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-007", legal_name: "Seventh Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-P", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 5, written_premium_cents: 50000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /bureau/submissions/${sub_id}/begin-edit"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions/${sub_id}/findings"
              payload: { edit_code: "E-X", severity: "CRITICAL", affected_records: 1 }
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /bureau/submissions/${sub_id}/findings returns 0 rows"

      - name: submission_create_body_fks_checked_in_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4_existence
          - endpoints.POST_/bureau/submissions
          - errors.ERR_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "insurer_id is declared before plan_id in the endpoint's input list, so with BOTH unknown the error must name the insurer check first — verified by message/error identity against a case where only plan_id is unknown (both surface ERR_NOT_FOUND, so the check is exercised via sequential elimination: unknown-insurer case fails even with a valid plan)."
        test_recipe:
          setup:
            - "One ACTIVE plan exists; no insurer exists."
          setup_api_calls:
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-Q", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "00000000-0000-4000-8000-000000000001", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 5, written_premium_cents: 50000 }
              as: InsurerUser
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "GET /bureau/submissions returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: filing_withdraw_from_effective_is_invalid_terminal_lockdown
        claim_type: invalid_transition
        grounds:
          - state_machines.LossCostFiling
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "EFFECTIVE is terminal for withdraw: once finalized, POST /bureau/filings/{id}/withdraw fails with 409 ERR_INVALID_STATE and no transition fires."
        test_recipe:
          setup:
            - "TX department (window 30); a TX filing carried to EFFECTIVE via finalize after the window."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-100", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/finalize"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/filings/${f_id}/withdraw"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "LossCostFiling.${f_id}.filing_status == EFFECTIVE"

      - name: filing_submit_review_without_cells_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LossCostFiling.DRAFT_to_IN_ACTUARIAL_REVIEW
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The at-least-one-cell precondition blocks submit-review on an empty DRAFT filing with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DRAFT filing with zero cells."
          setup_api_calls:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-CA-CP-101", state_code: "CA", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "LossCostFiling.${f_id}.filing_status == DRAFT"

      - name: objection_on_filed_filing_executes_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.LossCostFiling.FILED_to_OBJECTED
        distinguishing_aspect: "A successful objection creates the RegulatoryObjection row, flips the filing to OBJECTED, stamps raised_at from the logical clock, and bumps the filing version by 1."
        test_recipe:
          setup:
            - "TX department (window 30); a TX filing in FILED; clock at 2026-09-10."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
              captures: { dept_tx: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-102", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id, f_v0: $.data.version }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BureauAdmin
            - call: "GET /bureau/filings/${f_id}"
              payload: {}
              as: BureauAdmin
              captures: { f_v_filed: $.data.version }
          trigger:
            - call: "POST /bureau/filings/${f_id}/objections"
              payload: { department_id: "${dept_tx}", objection_code: "R-10", objection_text: "Data quality concerns" }
              as: RegulatorAnalyst
              as_user_id: "${dept_tx}"
              captures: { obj_id: $.data.id }
          assert:
            - "the response status is 201"
            - "RegulatoryObjection.${obj_id}.filing_id == ${f_id} and department_id == ${dept_tx}"
            - "RegulatoryObjection.${obj_id}.raised_at == 2026-09-10T00:00:00Z"
            - "LossCostFiling.${f_id}.filing_status == OBJECTED"
            - "LossCostFiling.${f_id}.version == ${f_v_filed} + 1"

      - name: submission_dispose_twice_rejected_from_terminal
        claim_type: idempotency
        grounds:
          - state_machines.StatisticalSubmission
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A submission disposed to ACCEPTED is terminal; a second dispose call fails with 409 ERR_INVALID_STATE and quality_score_bps does not recompute."
        test_recipe:
          setup:
            - "ACTIVE insurer, ACTIVE plan; a submission disposed to ACCEPTED with zero findings."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-008", legal_name: "Eighth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-R", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 5, written_premium_cents: 50000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /bureau/submissions/${sub_id}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/dispose"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions/${sub_id}/dispose"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the second dispose returns 409 and error_id == ERR_INVALID_STATE"
            - "StatisticalSubmission.${sub_id}.submission_status == ACCEPTED"
            - "MemberInsurer.${ins_id}.quality_score_bps == 10000"

      - name: suspended_insurer_cannot_create_submission
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MemberInsurer.ACTIVE_to_SUSPENDED
          - errors.ERR_INSURER_SUSPENDED
        distinguishing_aspect: "While SUSPENDED, the insurer's submission create is rejected with 409 ERR_INSURER_SUSPENDED; after reinstate the same payload succeeds."
        test_recipe:
          setup:
            - "One ACTIVE insurer and one ACTIVE plan; insurer then SUSPENDED."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-009", legal_name: "Ninth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
