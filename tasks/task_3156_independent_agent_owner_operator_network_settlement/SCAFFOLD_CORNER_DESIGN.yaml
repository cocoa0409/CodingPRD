              captures: { load_v_now: $.data.version }
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T02:00:00Z", expected_network_load_version: "${load_v0}" }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { err_stale: $.data.error_id }
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T03:00:00Z", expected_network_load_version: "${load_v_now}" }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { offer_ok: $.data.id }
          assert:
            - "the stale create returns 412 and err_stale == ERR_STALE_VERSION"
            - "the fresh create returns 201 and LoadOffer.${offer_ok}.status == OPEN"
            - "Load.${load_id}.version advanced from ${load_v0} to ${load_v_now} after the first board write"
            - "GET /network/loads/${load_id}/load-offers returns exactly 2 rows, the rejected stale create having written none"

      - name: loads_list_filters_by_status_and_origin_state
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/network/loads
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter, sort and paginate interact on one list endpoint: a status filter selects both posted loads, an origin_state filter selects exactly one, and limit 1 with offset 1 returns the second row with total_count still reporting the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a TX/OK territory and two POSTED loads, one from TX and one from OK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C38", legal_name: "Corner C38 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C38", shipper_name: "Corner C38 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C38", origin_state: "TX", destination_state: "OK", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C38", origin_state: "OK", destination_state: "TX", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
          trigger:
            - call: "GET /network/loads"
              payload: { status: "POSTED" }
              as: SettlementOperator
            - call: "GET /network/loads"
              payload: { origin_state: "OK" }
              as: SettlementOperator
            - call: "GET /network/loads"
              payload: { status: "POSTED", limit: 1, offset: 1 }
              as: SettlementOperator
          assert:
            - "the status filter returns exactly 2 rows with total_count == 2 and has_more == false"
            - "the origin_state filter returns exactly 1 row, the OK-origin load"
            - "limit 1 with offset 1 returns exactly 1 row while total_count is still 2 and has_more is false"
            - "an unmatched filter value returns an empty array with total_count == 0"

      - name: agent_active_customer_count_reconciles_after_termination
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Agent.fields.active_customer_count
          - state_machines.Agent.transitions.SUSPENDED_to_TERMINATED
          - entities.CustomerAccount.fields.exclusivity_status
        distinguishing_aspect: "The denormalized active_customer_count stays consistent with its source rows: it reads 1 while the account is OWNED_EXCLUSIVE and drops to 0 once termination flips the account to RELEASED, with the same read surface before and after."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with one customer account created that day and no outstanding settlements."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C39", legal_name: "Corner C39 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C39", shipper_name: "Corner C39 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "GET /network/agents/${agent_id}"
              payload: {  }
              as: SettlementOperator
            - call: "POST /network/agents/${agent_id}/terminate"
              payload: { reason_code: "PORTFOLIO_EXIT" }
              as: NetworkAdministrator
            - call: "GET /network/agents/${agent_id}"
              payload: {  }
              as: SettlementOperator
          assert:
            - "before termination Agent.${agent_id}.active_customer_count == 1"
            - "before termination GET /network/agents/${agent_id}/customer-accounts reports the account as OWNED_EXCLUSIVE"
            - "after termination Agent.${agent_id}.active_customer_count == 0"
            - "after termination the same customer-accounts read reports exclusivity_status RELEASED with released_reason AGENT_TERMINATED"

      - name: settle_cascades_through_ledger_to_postures
        claim_type: cascading_side_effects
        grounds:
