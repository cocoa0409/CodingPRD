        claim_type: cascading_side_effects
        grounds: [state_machines]
        excluded_because:
          difficulty_instance: transitive_cascade / complaint_accept_depth3_credit_cascade
          rationale: "N-level cascade verified end-to-end in §1.8 (depth-3 credit cascade, depth-2 revoke cascade, plus vessel_depart_cascade corner in state_machines section)."

      - name: immediate_consistency_on_invoice_issuance
        claim_type: consistency_immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "consistency_model == immediate: the POST /orders/{id}/invoices RESPONSE body already contains every computed field (lines, duty split, rebate, total, due_date) — no re-read or settling delay is needed to observe them."
        test_recipe:
          setup: ["WATER order 100 x 120 fully delivered"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
