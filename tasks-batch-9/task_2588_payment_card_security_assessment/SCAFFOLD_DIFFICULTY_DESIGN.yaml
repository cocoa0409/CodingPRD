          - entities.CompensatingControlWorksheet.fields.control_depth_points
          - entities.CompensatingControlWorksheet.fields.monitoring_factor
          - entities.CompensatingControlWorksheet.fields.risk_offset_points
          - entities.CompensatingControlWorksheet.fields.thin_control_capped
          - entities.RequirementAssessment.fields.risk_points
          - concurrency_rules[ccw-create-stale-requirement]
        distinguishing_aspect: |
          ccw_rigor_score combines three differently-scaled inputs (a linear depth term capped at 100, a
          four-band step function over monitoring_interval_days, and a family-risk offset derived from
          FAMILY_RISK_POINTS) under fixed weights 0.40/0.35/0.25 and then applies a thin-control ceiling
          that is NOT part of the weighted sum: worksheet X (5 refs, 7-day monitoring, family R6) scores
