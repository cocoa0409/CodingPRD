              as: Patient
              as_user_id: "${pat_id}"
              captures: { cs1_id: "$.data.id" }
            - call: "POST /glp1/coaching-sessions"
              payload: { subscription_id: "${sub_id}", coach_provider_id: "${coach_id}", scheduled_start_at: "2026-06-06T16:00:00Z", scheduled_end_at: "2026-06-06T17:00:00Z" }
              as: Patient
