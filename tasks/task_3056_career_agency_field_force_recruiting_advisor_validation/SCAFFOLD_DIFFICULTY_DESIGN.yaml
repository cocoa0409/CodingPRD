            - "SecuritiesRegistration.${reg_s6_act_id}.status == ACTIVE"
            - "SecuritiesRegistration.${reg_s65_act_id}.status == ACTIVE"
            - "Advisor.${adv_id}.securities_registration_status == ACTIVE while Advisor.${adv_id}.insurance_license_status == PENDING"
