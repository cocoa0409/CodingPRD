          - validations[priority=42]
          - state_machines.TransparencyFile
          - calculations.transparency_file_build
          - endpoints[POST /chargemaster/transparency-files]
          - endpoints[POST /chargemaster/transparency-files/{file_id}/lifecycle]
          - endpoints[GET /chargemaster/transparency-files/{file_id}]
        distinguishing_aspect: "Four guards on one file family, two of them structural. The build is OCC-gated on Facility.version, so a version captured before an item activation is refused with 412. Priority 42 (ERR_NO_PUBLISHABLE_ITEMS on PUBLISH) is proved unreachable: an empty inclusion set makes validation_errors non-empty, so VALIDATE routes the file to FAILED and it can never reach the VALIDATED state PUBLISH requires — the observable is validation_errors == ['NO_PUBLISHABLE_ITEMS'] plus ERR_INVALID_FILE_STATE on the follow-up PUBLISH. The blackout guard then fires on a legitimately VALIDATED file while a cycle sits in MAPPING, and both FAILED and PUBLISHED reject every further lifecycle action."
