# =============================================================================
# PRD Benchmark Scaffold — Player Transactions & Roster Compliance
# Difficulty target: EXPERT+ (above §0.4 Expert band on purpose)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2555. Player Transactions & Roster Compliance (professional team front office):
  roster limit tracking across active, reserve, injured and practice designations
  with daily compliance checks, transaction filing deadlines with league approval,
  physical requirements and processing windows, salary cap accounting with
  proration, bonus allocation and dead money on release, waiver processing with
  claiming order, revocable versus irrevocable waivers and clearance timing, trade
  construction with cap compatibility, medical review windows and conditional
  terms, option, tender and qualifying offer deadlines with restricted free agency
  mechanics, injury designation rules with return-to-play windows and paperwork,
  service time and eligibility tracking affecting future contract rights

domain_name: player-transactions-roster-compliance

# All business collections are peers at the URL root (flat/graph topology), so the
# API prefix is the root itself. Endpoint paths below are absolute and complete.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Player, Team, Contract, Transaction, WaiverRequest, Trade are peers linked by
  # foreign keys; Trade is a many-to-many association between two Teams through
  # TradeAsset, and TradeAsset polymorphically references either a Contract or a
  # bare draft-pick / cash tuple. No single ownership tree exists.

  state_machine_shape: parallel
  # Player carries two independent state dimensions (roster_designation and
  # medical_status) that advance on unrelated triggers; Transaction cycles
  # REJECTED -> DRAFT; Trade cycles PROPOSED <-> COUNTERED with alternating
  # actors; WaiverRequest branches PENDING -> {WITHDRAWN, CLAIMED, CLEARED} with
  # divergent side-effect sets; Team.compliance_status is a posture derived from
  # aggregate child counts that gates every team-scoped write.

  relationship_patterns:
    - one_to_many          # Team -> Contract, Contract -> BonusAllocation, WaiverRequest -> WaiverClaim
    - many_to_many         # Team <-> Team through Trade / TradeAsset
    - polymorphic          # TradeAsset.asset_kind selects which reference columns are meaningful
    - cross_aggregate      # WaiverRequest requires an APPROVED Transaction owned by another aggregate

  role_model: segregation_of_duties
  # The team role that constructs and files a transaction can never decide it
  # (LeagueOfficer only); the role that records a physical result
  # (TeamMedicalOfficer) can never file or decide a cap transaction; the role that
  # answers a tender (PlayerAgent) can never issue one.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Team
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Club name"
        constraints: "1..80 chars, non-blank"
      - name: market_code
        type: string
        source: input
        description: "Three-letter market code identifying the club"
        constraints: "exactly 3 uppercase A-Z letters; unique across Team"
      - name: salary_cap_limit_cents
        type: integer
        source: input
        description: "Hard salary cap for CURRENT_SEASON_YEAR in cents"
        constraints: ">= 0"
      - name: active_roster_limit
        type: integer
        source: input
        default: 26
        description: "Maximum Players with roster_designation == ACTIVE"
        constraints: ">= 1"
      - name: reserve_roster_limit
        type: integer
        source: input
        default: 4
        description: "Maximum Players with roster_designation == RESERVE"
        constraints: ">= 0"
      - name: injured_reserve_limit
        type: integer
        source: input
        default: 3
        description: "Maximum Players with roster_designation == INJURED_RESERVE"
        constraints: ">= 0"
      - name: practice_squad_limit
        type: integer
        source: input
        default: 6
        description: "Maximum Players with roster_designation == PRACTICE_SQUAD"
        constraints: ">= 0"
      - name: waiver_priority_rank
        type: integer
        source: input
        description: "Claiming order position; 1 claims before 2. Unique across Team."
        constraints: ">= 1; unique across Team"
      - name: active_roster_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Player WHERE current_team_id == this.id AND roster_designation == ACTIVE)"
      - name: reserve_roster_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Player WHERE current_team_id == this.id AND roster_designation == RESERVE)"
      - name: injured_reserve_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Player WHERE current_team_id == this.id AND roster_designation == INJURED_RESERVE)"
      - name: practice_squad_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Player WHERE current_team_id == this.id AND roster_designation == PRACTICE_SQUAD)"
      - name: provisional_cap_committed_cents
        type: integer
        source: computed
        default: 0
        description: "PROVISIONAL variant of calculations.team_cap_commitment (Contract.status IN {ACTIVE, PENDING_APPROVAL}, PERFORMANCE_NLTBE excluded)"
      - name: final_cap_committed_cents
        type: integer
        source: computed
        default: 0
        description: "FINAL variant of calculations.team_cap_commitment (Contract.status == ACTIVE only, PERFORMANCE_NLTBE counted when allocation_status == EARNED)"
      - name: dead_money_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(Contract.dead_money_current_season_cents WHERE team_id == this.id AND status == TERMINATED) + SUM(WaiverRequest.releasing_team_dead_money_cents WHERE from_team_id == this.id AND status == CLAIMED)"
      - name: cap_space_cents
        type: integer
        source: computed
        default: 0
        description: "salary_cap_limit_cents - provisional_cap_committed_cents; may be negative"
      - name: open_medical_review_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Trade WHERE status == MEDICAL_REVIEW AND (initiating_team_id == this.id OR counterparty_team_id == this.id))"
      - name: compliance_status
        type: enum
        source: computed
        default: COMPLIANT
        description: "Posture gating every team-scoped write; recomputed by calculations.team_compliance_evaluation"
        constraints: "COMPLIANT | GRACE | NON_COMPLIANT | TRANSACTION_FROZEN"
      - name: grace_expires_at
        type: datetime
        source: computed
        default: null
        description: "Instant the current GRACE window ends; null unless compliance_status == GRACE"
      - name: consecutive_noncompliant_checks
        type: integer
        source: computed
        default: 0
        description: "Count of consecutive ComplianceCheck rows for this team whose violation_codes was non-empty; reset to 0 by a violation-free check"

  - name: Player
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Player legal name"
        constraints: "1..80 chars, non-blank"
      - name: position
        type: enum
        source: input
        description: "Playing position"
        constraints: "QB | RB | WR | OL | DL | LB | DB | K"
      - name: current_team_id
        type: string
        source: computed
        default: null
        description: "FK -> Team.id; null exactly when roster_designation == UNROSTERED"
      - name: roster_designation
        type: enum
        source: computed
        default: UNROSTERED
        description: "State dimension A. Set only by approved Transaction side effects and by WaiverRequest transitions."
        constraints: "UNROSTERED | ACTIVE | RESERVE | INJURED_RESERVE | PRACTICE_SQUAD | WAIVED_PENDING"
      - name: medical_status
        type: enum
        source: computed
        default: CLEARED
        description: "State dimension B. Advances independently of roster_designation on PhysicalExam and InjuryDesignation events."
        constraints: "CLEARED | PHYSICAL_PENDING | REHAB | FAILED_PHYSICAL"
      - name: designation_effective_at
        type: datetime
        source: system
        description: "Logical-clock instant roster_designation last changed; accrual baseline for calculations.player_service_time"
      - name: accrued_active_days
        type: integer
        source: input
        default: 0
        description: "Career days on ACTIVE. Seeded at registration from the league service registry, then incremented by designation-change accrual."
        constraints: ">= 0"
      - name: accrued_reserve_days
        type: integer
        source: input
        default: 0
        description: "Career days on RESERVE; same seeding and accrual rules as accrued_active_days"
        constraints: ">= 0"
      - name: accrued_ir_days
        type: integer
        source: input
        default: 0
        description: "Career days on INJURED_RESERVE; same seeding and accrual rules as accrued_active_days"
        constraints: ">= 0"
      - name: accrued_practice_days
        type: integer
        source: input
        default: 0
        description: "Career days on PRACTICE_SQUAD; same seeding and accrual rules as accrued_active_days"
        constraints: ">= 0"
      - name: practice_squad_seasons_used
        type: integer
        source: input
        default: 0
        description: "Seasons already spent on a practice squad; gates practice_squad_eligible"
        constraints: ">= 0"
      - name: pension_credit_days
        type: integer
        source: computed
        default: 0
        description: "PENSION_CREDIT variant of calculations.player_service_time"
      - name: roster_service_days
        type: integer
        source: computed
        default: 0
        description: "ROSTER_SERVICE variant of calculations.player_service_time"
      - name: service_years
        type: integer
        source: computed
        default: 0
        description: "floor(pension_credit_days / SERVICE_DAYS_PER_SEASON)"
      - name: contract_rights_class
        type: enum
        source: computed
        default: NONE
        description: "Future contract rights tier from calculations.player_service_time"
        constraints: "NONE | RESTRICTED | ARBITRATION_ELIGIBLE | UNRESTRICTED"
      - name: practice_squad_eligible
        type: boolean
        source: computed
        default: true
        description: "roster_service_days <= PRACTICE_SQUAD_MAX_SERVICE_DAYS AND practice_squad_seasons_used < PRACTICE_SQUAD_MAX_SEASONS"
      - name: waiver_revocability_class
        type: enum
        source: computed
        default: REVOCABLE
        description: "Revocability a waiver placement would receive if placed at the current logical clock; from calculations.waiver_clearance_deadline"
        constraints: "REVOCABLE | IRREVOCABLE"
      - name: last_physical_passed_at
        type: datetime
        source: system
        default: null
        description: "performed_at of the most recent PhysicalExam for this player whose status == PASSED"

  - name: Contract
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the signing player"
      - name: team_id
        type: string
        source: computed
        description: "FK -> Team.id; owning club, reassigned by waiver award and trade execution"
      - name: signed_via_transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; the SIGNING Transaction that created this Contract"
      - name: status
        type: enum
        source: computed
        default: PENDING_APPROVAL
        description: "Contract lifecycle"
        constraints: "PENDING_APPROVAL | ACTIVE | TERMINATED | VOIDED"
      - name: years
        type: integer
        source: input
        description: "Contract length in seasons"
        constraints: "1..7"
      - name: base_salary_cents
        type: integer
        source: input
        description: "Per-season base salary in cents"
        constraints: ">= 0"
      - name: base_guaranteed
        type: boolean
        source: input
        default: false
        description: "When true the current-season base salary is fully guaranteed and enters dead money on an unclaimed release"
      - name: signing_bonus_cents
        type: integer
        source: input
        default: 0
        description: "Signing bonus paid up front and prorated by calculations.signing_bonus_proration"
        constraints: ">= 0"
      - name: start_season_year
        type: integer
        source: input
        default: 2026
        description: "First season covered by this contract"
        constraints: "2026..2030"
      - name: is_practice_squad_contract
        type: boolean
        source: input
        default: false
        description: "When true the resulting designation must be PRACTICE_SQUAD and practice_squad_eligible must hold"
      - name: proration_years
        type: integer
        source: computed
        description: "min(years, MAX_PRORATION_YEARS)"
      - name: annual_proration_cents
        type: integer
        source: computed
        description: "Per-season signing-bonus proration for every season except the final prorated season"
      - name: final_season_proration_cents
        type: integer
        source: computed
        description: "Final prorated season absorbs the rounding remainder: signing_bonus_cents - annual_proration_cents * (proration_years - 1)"
      - name: current_season_cap_charge_cents
        type: integer
        source: computed
        default: 0
        description: "calculations.contract_current_season_cap_charge for CURRENT_SEASON_YEAR"
      - name: total_value_cents
        type: integer
        source: computed
        description: "base_salary_cents * years + signing_bonus_cents"
      - name: option_type
        type: enum
        source: input
        default: NONE
        description: "Which party holds the option year on this contract"
        constraints: "NONE | TEAM_OPTION | PLAYER_OPTION"
      - name: option_deadline_at
        type: datetime
        source: input
        default: null
        description: "Instant by which the option decision must be recorded; required when option_type != NONE"
      - name: option_salary_cents
        type: integer
        source: input
        default: null
        description: "Base salary that replaces base_salary_cents when the option is EXERCISED; required when option_type != NONE"
        constraints: ">= 0"
      - name: option_status
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: "PENDING from contract activation when option_type != NONE; EXERCISED/DECLINED by option-decision; LAPSED by the compliance run after option_deadline_at"
        constraints: "NOT_APPLICABLE | PENDING | EXERCISED | DECLINED | LAPSED"
      - name: dead_money_current_season_cents
        type: integer
        source: computed
        default: 0
        description: "calculations.dead_money_on_release current-season component"
      - name: dead_money_next_season_cents
        type: integer
        source: computed
        default: 0
        description: "calculations.dead_money_on_release next-season component"
      - name: termination_reason
        type: enum
        source: computed
        default: null
        description: "Why status became TERMINATED"
        constraints: "RELEASE_CLEARED | OPTION_DECLINED | OPTION_LAPSED"

  - name: BonusAllocation
    parent: Contract
    common_fields: true
    kind: resource
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id"
      - name: bonus_type
        type: enum
        source: system
        description: "Kind of cap allocation this row carries"
        constraints: "SIGNING_PRORATION | ROSTER_BONUS | PERFORMANCE_LTBE | PERFORMANCE_NLTBE"
      - name: season_year
        type: integer
        source: system
        description: "Season the allocation is charged against"
      - name: amount_cents
        type: integer
        source: system
        description: "Allocation amount in cents"
        constraints: ">= 0"
      - name: allocation_status
        type: enum
        source: computed
        default: SCHEDULED
        description: "SCHEDULED at creation; EARNED by mark-earned; ACCELERATED for future-season SIGNING_PRORATION rows on termination; FORFEITED for unearned non-proration rows on termination"
        constraints: "SCHEDULED | EARNED | FORFEITED | ACCELERATED"
      - name: counts_against_provisional
        type: boolean
        source: computed
        description: "true for bonus_type IN {ROSTER_BONUS, PERFORMANCE_LTBE}; false for PERFORMANCE_NLTBE and for SIGNING_PRORATION, whose money is already inside Contract.current_season_cap_charge_cents"
      - name: earned_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant allocation_status became EARNED"

  - name: Transaction
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the filing club"
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the subject player"
      - name: transaction_type
        type: enum
        source: input
        description: "Filing category; determines which optional inputs are required"
        constraints: "SIGNING | RELEASE | DESIGNATION_CHANGE | IR_PLACEMENT | IR_ACTIVATION | PRACTICE_SQUAD_ELEVATION"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Filing lifecycle; REJECTED returns to DRAFT through revise"
        constraints: "DRAFT | FILED | APPROVED | REJECTED | VOIDED"
      - name: target_designation
        type: enum
        source: input
        default: null
        description: "Designation the player must hold once this filing is approved; required for DESIGNATION_CHANGE and PRACTICE_SQUAD_ELEVATION"
        constraints: "ACTIVE | RESERVE | INJURED_RESERVE | PRACTICE_SQUAD"
      - name: injury_designation_id
        type: string
        source: input
        default: null
        description: "FK -> InjuryDesignation.id; required for IR_PLACEMENT and IR_ACTIVATION"
      - name: filing_deadline_at
        type: datetime
        source: computed
        description: "calculations.transaction_filing_deadline, fixed at creation and never recomputed by revise"
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became FILED (most recent filing)"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the league decided this filing"
      - name: effective_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the approved side effects were applied; equals decided_at on APPROVED"
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: "League note recorded when the decision is REJECT"
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: "Number of completed revise cycles; at MAX_TRANSACTION_REVISIONS the next revise voids the filing instead"
      - name: requires_physical
        type: boolean
        source: computed
        description: "true when transaction_type IN {SIGNING, IR_ACTIVATION} — approval then demands a PASSED, unexpired PhysicalExam"
      - name: filed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the TeamCapAnalyst that filed; equals team_id by role identity"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the deciding LeagueOfficer"
      - name: contract_id
        type: string
        source: computed
        default: null
        description: "FK -> Contract.id; the Contract this SIGNING filing created, null for other types"
      - name: prior_designation
        type: enum
        source: computed
        default: null
        description: "Player.roster_designation observed immediately before this filing's approval applied; the snapshot WaiverRequest.origin_designation copies"
        constraints: "UNROSTERED | ACTIVE | RESERVE | INJURED_RESERVE | PRACTICE_SQUAD"

  - name: WaiverRequest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the waived player"
      - name: from_team_id
        type: string
        source: input
        description: "FK -> Team.id; the releasing club"
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; the APPROVED RELEASE filing that authorises this placement"
      - name: contract_id
        type: string
        source: computed
        description: "FK -> Contract.id; the ACTIVE contract riding along on the wire"
      - name: origin_designation
        type: enum
        source: computed
        description: "Copy of Transaction.prior_designation from the authorising RELEASE filing; restored verbatim by withdraw"
        constraints: "ACTIVE | RESERVE | INJURED_RESERVE | PRACTICE_SQUAD"
      - name: revocability
        type: enum
        source: computed
        description: "calculations.waiver_clearance_deadline evaluated at placement and frozen thereafter"
        constraints: "REVOCABLE | IRREVOCABLE"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Wire lifecycle; branches into three terminal outcomes with divergent side-effect sets"
        constraints: "PENDING | WITHDRAWN | CLAIMED | CLEARED"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant the request was created"
      - name: clearance_deadline_at
        type: datetime
        source: computed
        description: "calculations.waiver_clearance_deadline; process is rejected before this instant"
      - name: processed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the wire reached CLAIMED or CLEARED"
      - name: awarded_to_team_id
        type: string
        source: computed
        default: null
        description: "FK -> Team.id; winner selected by calculations.waiver_award_cap_resolution, null unless status == CLAIMED"
      - name: claim_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(WaiverClaim WHERE waiver_request_id == this.id AND status IN {SUBMITTED, AWARDED, LOST, INVALIDATED})"
      - name: releasing_team_dead_money_cents
        type: integer
        source: computed
        default: 0
        description: "dead_money_current_season_cents charged to from_team_id when the wire resolved; 0 while PENDING or WITHDRAWN"

  - name: WaiverClaim
    parent: WaiverRequest
    common_fields: true
    kind: resource
    fields:
      - name: waiver_request_id
        type: string
        source: system
        description: "FK -> WaiverRequest.id"
      - name: claiming_team_id
        type: string
        source: input
        description: "FK -> Team.id; the club submitting the claim"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "AWARDED for the selected claim; LOST for eligible non-winners; INVALIDATED for claims failing the process-time eligibility filter"
        constraints: "SUBMITTED | AWARDED | LOST | INVALIDATED"
      - name: priority_rank_snapshot
        type: integer
        source: computed
        description: "Team.waiver_priority_rank copied at submission; the ranking key of calculations.waiver_award_cap_resolution"
      - name: cap_space_snapshot_cents
        type: integer
        source: computed
        description: "Claiming Team.cap_space_cents copied at submission (audit only; never the eligibility input)"
      - name: required_cap_charge_cents
        type: integer
        source: computed
        description: "Contract.base_salary_cents of the waived contract — the charge the claiming club would assume"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the claim was created"

  - name: Trade
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: initiating_team_id
        type: string
        source: input
        description: "FK -> Team.id; club that opened the negotiation"
      - name: counterparty_team_id
        type: string
        source: input
        description: "FK -> Team.id; club on the other side"
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: "Negotiation lifecycle; PROPOSED <-> COUNTERED cycles with alternating actors"
        constraints: "PROPOSED | COUNTERED | ACCEPTED | MEDICAL_REVIEW | EXECUTED | VOIDED"
      - name: conditional_clause_type
        type: enum
        source: input
        default: NONE
        description: "Conditional term attached to the deal; PHYSICAL_CONTINGENT routes acceptance into MEDICAL_REVIEW"
        constraints: "NONE | PHYSICAL_CONTINGENT | PICK_CONDITIONAL"
      - name: condition_note
        type: string
        source: input
        default: null
        description: "Free-text description of the conditional term"
      - name: round_count
        type: integer
        source: computed
        default: 1
        description: "Negotiation rounds consumed; counter increments it and MAX_TRADE_ROUNDS caps the cycle"
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became ACCEPTED or MEDICAL_REVIEW"
      - name: medical_review_deadline_at
        type: datetime
        source: computed
        default: null
        description: "accepted_at + MEDICAL_REVIEW_WINDOW_HOURS; the closed interval [accepted_at, medical_review_deadline_at] occupies a medical-review slot on both clubs"
      - name: executed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became EXECUTED"
      - name: void_reason
        type: enum
        source: computed
        default: null
        description: "Why the deal died"
        constraints: "FAILED_PHYSICAL | MEDICAL_WINDOW_EXPIRED | ROUND_LIMIT_EXCEEDED"
      - name: cap_delta_initiating_cents
        type: integer
        source: computed
        default: 0
        description: "calculations.trade_cap_compatibility delta for initiating_team_id"
      - name: cap_delta_counterparty_cents
        type: integer
        source: computed
        default: 0
        description: "calculations.trade_cap_compatibility delta for counterparty_team_id"

  - name: TradeAsset
    parent: Trade
    common_fields: true
    kind: resource
    fields:
      - name: trade_id
        type: string
        source: system
        description: "FK -> Trade.id"
      - name: asset_kind
        type: enum
        source: input
        description: "Polymorphic selector: CONTRACT uses contract_id, DRAFT_PICK uses draft_pick_year/round, CASH_CONSIDERATION uses cash_amount_cents"
        constraints: "CONTRACT | DRAFT_PICK | CASH_CONSIDERATION"
      - name: direction
        type: enum
        source: input
        description: "Which club receives the asset; only the sending club may add it"
        constraints: "TO_COUNTERPARTY | TO_INITIATOR"
      - name: contract_id
        type: string
        source: input
        default: null
        description: "FK -> Contract.id; required when asset_kind == CONTRACT, forbidden otherwise"
      - name: draft_pick_year
        type: integer
        source: input
        default: null
        description: "Draft year; required when asset_kind == DRAFT_PICK"
        constraints: "2027..2031"
      - name: draft_pick_round
        type: integer
        source: input
        default: null
        description: "Draft round; required when asset_kind == DRAFT_PICK"
        constraints: "1..7"
      - name: cash_amount_cents
        type: integer
        source: input
        default: 0
        description: "Cash consideration; required when asset_kind == CASH_CONSIDERATION"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: "TRANSFERRED when the trade executes; RETURNED when the trade is voided"
        constraints: "PROPOSED | TRANSFERRED | RETURNED"
      - name: cap_charge_snapshot_cents
        type: integer
        source: computed
        default: 0
        description: "Contract.current_season_cap_charge_cents at the moment the asset was added (0 for DRAFT_PICK, cash_amount_cents for CASH_CONSIDERATION)"

  - name: QualifyingOffer
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the restricted player being tendered"
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the tendering club"
      - name: offer_type
        type: enum
        source: input
        description: "Tender instrument"
        constraints: "QUALIFYING_OFFER | RESTRICTED_TENDER | ARBITRATION_TENDER"
      - name: tender_level
        type: enum
        source: input
        description: "Compensation level attached to the tender; selects the tender floor"
        constraints: "FIRST_ROUND | SECOND_ROUND | ORIGINAL_ROUND | RIGHT_OF_FIRST_REFUSAL"
      - name: prior_base_salary_cents
        type: integer
        source: input
        description: "Player base salary in the season just completed; the raise base"
        constraints: ">= 0"
      - name: amount_cents
        type: integer
        source: computed
        description: "calculations.qualifying_offer_amount"
      - name: deadline_at
        type: datetime
        source: computed
        description: "issued_at + TENDER_RESPONSE_HOURS snapped into the league processing window"
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: "ACCEPTED/DECLINED by the agent; LAPSED by the compliance run once the logical clock passes deadline_at"
        constraints: "ISSUED | ACCEPTED | DECLINED | LAPSED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the tender was issued"
      - name: responded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the agent responded"
      - name: resulting_transaction_id
        type: string
        source: computed
        default: null
        description: "FK -> Transaction.id; the SIGNING filing cascaded by an ACCEPTED tender"

  - name: InjuryDesignation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the injured player"
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the designating club"
      - name: designation_type
        type: enum
        source: input
        description: "Injury bucket; selects minimum_stay_days"
        constraints: "INJURED_RESERVE | INJURED_RESERVE_RETURN_ELIGIBLE | NON_ROSTER_INJURY"
      - name: status
        type: enum
        source: computed
        default: PENDING_PAPERWORK
        description: "Designation lifecycle driven by paperwork, the IR_PLACEMENT filing, the compliance run and the IR_ACTIVATION filing"
        constraints: "PENDING_PAPERWORK | PAPERWORK_FILED | ACTIVE | RETURN_WINDOW_OPEN | EXPIRED | CLOSED"
      - name: paperwork_reference
        type: string
        source: input
        default: null
        description: "League paperwork reference recorded by file-paperwork"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant the designation row was created"
      - name: paperwork_filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became PAPERWORK_FILED"
      - name: activated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became ACTIVE (the IR_PLACEMENT approval); the minimum-stay baseline"
      - name: minimum_stay_days
        type: integer
        source: computed
        description: "MINIMUM_STAY_DAYS[designation_type]"
      - name: return_window_opens_at
        type: datetime
        source: computed
        default: null
        description: "activated_at + minimum_stay_days days; null until ACTIVE"
      - name: return_window_closes_at
        type: datetime
        source: computed
        default: null
        description: "return_window_opens_at + RETURN_WINDOW_LENGTH_DAYS days; null until ACTIVE"
      - name: ir_service_credit_days
        type: integer
        source: computed
        default: 0
        description: "Days credited to Player.accrued_ir_days when this designation closed or expired"
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant status became CLOSED or EXPIRED"

  - name: PhysicalExam
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the examined player"
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the club whose medical staff owns the exam"
      - name: transaction_id
        type: string
        source: input
        default: null
        description: "FK -> Transaction.id; the filing this exam satisfies, when any"
      - name: trade_id
        type: string
        source: input
        default: null
        description: "FK -> Trade.id; required when exam_type == TRADE_PHYSICAL"
      - name: exam_type
        type: enum
        source: input
        description: "Purpose of the exam"
        constraints: "ENTRY_PHYSICAL | TRADE_PHYSICAL | RETURN_PHYSICAL"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "PASSED/FAILED by record-result; EXPIRED by the compliance run once the logical clock passes expires_at"
        constraints: "SCHEDULED | PASSED | FAILED | EXPIRED"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the exam processing window"
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the exam processing window; must be strictly after window_start_at"
      - name: performed_at
        type: datetime
        source: input
        default: null
        description: "Instant the exam was performed; recorded by record-result and required to fall in [window_start_at, window_end_at)"
      - name: result_recorded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the result was recorded"
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: "performed_at + PHYSICAL_VALIDITY_DAYS days; null until a result is recorded"

  - name: ComplianceCheck
    parent: Team
    common_fields: false
    kind: event
    fields:
      - name: team_id
        type: string
        source: system
        description: "FK -> Team.id; the audited club"
      - name: checked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the sweep that produced this row"
      - name: active_roster_count
        type: integer
        source: computed
        description: "Team.active_roster_count observed by the sweep"
      - name: reserve_roster_count
        type: integer
        source: computed
        description: "Team.reserve_roster_count observed by the sweep"
      - name: injured_reserve_count
        type: integer
        source: computed
        description: "Team.injured_reserve_count observed by the sweep"
      - name: practice_squad_count
        type: integer
        source: computed
        description: "Team.practice_squad_count observed by the sweep"
      - name: final_cap_committed_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.team_cap_commitment observed by the sweep"
      - name: cap_space_cents
        type: integer
        source: computed
        description: "salary_cap_limit_cents - final_cap_committed_cents; the sweep audits the FINAL variant, unlike Team.cap_space_cents"
      - name: violation_codes
        type: array
        source: computed
        description: "Violation codes found, appended in this fixed order"
        constraints: "subset of [ACTIVE_ROSTER_OVER_LIMIT, RESERVE_OVER_LIMIT, IR_OVER_LIMIT, PRACTICE_SQUAD_OVER_LIMIT, CAP_OVER_LIMIT, INELIGIBLE_PRACTICE_SQUAD_PLAYER, UNFILED_INJURY_PAPERWORK], appended in exactly this order"
      - name: result
        type: enum
        source: computed
        description: "Sweep verdict for this club"
        constraints: "COMPLIANT | GRACE | NON_COMPLIANT"
      - name: grace_expires_at
        type: datetime
        source: computed
        default: null
        description: "Team.grace_expires_at as set by this sweep; null unless result == GRACE"
      - name: resulting_compliance_status
        type: enum
        source: computed
        description: "Team.compliance_status after this sweep applied"
        constraints: "COMPLIANT | GRACE | NON_COMPLIANT | TRANSACTION_FROZEN"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Transaction
    dimension: status
    shape: "branching with revision cycle (REJECTED -> DRAFT -> FILED -> REJECTED ...)"
    initial_state: DRAFT
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: __CREATE__
        to: DRAFT
        trigger: "POST /transactions"
        actor: TeamCapAnalyst
        preconditions:
          - "Team.id == body.team_id exists AND Player.id == body.player_id exists"
          - "X-User-ID == body.team_id"
          - "Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "body.expected_team_version == Team.version"
          - "transaction_type == SIGNING requires years, base_salary_cents; Player.roster_designation == UNROSTERED"
          - "transaction_type == RELEASE requires Player.current_team_id == body.team_id AND Player.roster_designation IN {ACTIVE, RESERVE, INJURED_RESERVE, PRACTICE_SQUAD}"
          - "transaction_type IN {DESIGNATION_CHANGE, PRACTICE_SQUAD_ELEVATION} requires target_designation != Player.roster_designation AND Player.current_team_id == body.team_id"
          - "transaction_type IN {IR_PLACEMENT, IR_ACTIVATION} requires injury_designation_id whose InjuryDesignation.team_id == body.team_id AND InjuryDesignation.player_id == body.player_id"
          - "transaction_type == PRACTICE_SQUAD_ELEVATION requires Player.practice_squad_eligible == true"
        side_effects:
          - "status = DRAFT; filing_deadline_at = calculations.transaction_filing_deadline(created_at)"
          - "requires_physical = (transaction_type IN {SIGNING, IR_ACTIVATION})"
          - "increments Team.version by 1"
          - "transaction_type == SIGNING: creates Contract{status: PENDING_APPROVAL, player_id, team_id, signed_via_transaction_id: this.id} and sets this.contract_id; computes Contract.proration_years, annual_proration_cents, final_season_proration_cents, total_value_cents, current_season_cap_charge_cents"
          - "transaction_type == SIGNING: recomputes Team.provisional_cap_committed_cents and Team.cap_space_cents (PENDING_APPROVAL contracts enter the PROVISIONAL variant only)"
      - from: DRAFT
        to: FILED
        trigger: "POST /transactions/{id}/file"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Transaction.team_id"
          - "Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC) — half-open"
          - "logical clock <= filing_deadline_at"
          - "projected designation counts after approval satisfy every Team roster limit (calculations.designation_count_recompute)"
        side_effects:
          - "status = FILED; filed_at = logical clock; filed_by_user_id = X-User-ID"
      - from: FILED
        to: APPROVED
        trigger: "POST /transactions/{id}/decide with decision == APPROVE"
        actor: LeagueOfficer
        preconditions:
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
          - "Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "Player.medical_status != FAILED_PHYSICAL"
          - "requires_physical == true implies EXISTS PhysicalExam WHERE transaction_id == this.id AND player_id == this.player_id AND status == PASSED AND expires_at > logical clock"
          - "transaction_type == IR_PLACEMENT implies InjuryDesignation.status == PAPERWORK_FILED"
          - "transaction_type == IR_ACTIVATION implies InjuryDesignation.status == RETURN_WINDOW_OPEN AND logical clock IN [return_window_opens_at, return_window_closes_at] — closed interval"
          - "projected designation counts satisfy every Team roster limit"
          - "a placement onto the practice squad (transaction_type == SIGNING with Contract.is_practice_squad_contract == true) or an elevation off it (transaction_type == PRACTICE_SQUAD_ELEVATION) implies Player.practice_squad_eligible == true (§1.4 priority 34)"
          - "transaction_type == SIGNING implies Team.provisional_cap_committed_cents (with this Contract counted) <= Team.salary_cap_limit_cents"
        side_effects:
          - "status = APPROVED; decided_at = effective_at = logical clock; decided_by_user_id = X-User-ID; prior_designation = Player.roster_designation observed before the designation side effects below"
          - "accrues elapsed designation days: Player.accrued_{active|reserve|ir|practice}_days for the OUTGOING roster_designation += floor((logical clock - Player.designation_effective_at) / 86400 seconds); then Player.designation_effective_at = logical clock"
          - "recomputes Player.pension_credit_days, roster_service_days, service_years, contract_rights_class, practice_squad_eligible, waiver_revocability_class"
          - "SIGNING: Contract.status PENDING_APPROVAL -> ACTIVE; BonusAllocation rows created (one SIGNING_PRORATION row per prorated season, plus one PERFORMANCE_LTBE row and one PERFORMANCE_NLTBE row when the filing carried non-zero amounts); Contract.option_status = PENDING when option_type != NONE; Player.roster_designation = PRACTICE_SQUAD when Contract.is_practice_squad_contract else ACTIVE; Player.current_team_id = team_id"
          - "RELEASE: Player.roster_designation = WAIVED_PENDING (Contract stays ACTIVE and keeps its cap charge); Player.current_team_id unchanged"
          - "DESIGNATION_CHANGE / PRACTICE_SQUAD_ELEVATION: Player.roster_designation = target_designation"
          - "IR_PLACEMENT: Player.roster_designation = INJURED_RESERVE; InjuryDesignation.status PAPERWORK_FILED -> ACTIVE; InjuryDesignation.activated_at = logical clock; return_window_opens_at / return_window_closes_at computed"
          - "IR_ACTIVATION: Player.roster_designation = ACTIVE; Player.medical_status = CLEARED; InjuryDesignation.status RETURN_WINDOW_OPEN -> CLOSED; InjuryDesignation.closed_at = logical clock; ir_service_credit_days = floor((closed_at - activated_at) / 86400 seconds)"
          - "recomputes the acting Team's four designation counts, provisional_cap_committed_cents, final_cap_committed_cents, dead_money_cents, cap_space_cents"
          - "recomputes Team.compliance_status via calculations.team_compliance_evaluation in EVENT mode (violations may move COMPLIANT -> GRACE, never to TRANSACTION_FROZEN)"
          - "increments Team.version by 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /transactions/{id}/decide with decision == REJECT"
        actor: LeagueOfficer
        preconditions:
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
          - "rejection_reason present and non-blank"
        side_effects:
          - "status = REJECTED; decided_at = logical clock; decided_by_user_id = X-User-ID; rejection_reason stored"
          - "transaction_type == SIGNING: Contract.status PENDING_APPROVAL -> VOIDED"
          - "transaction_type == SIGNING: recomputes Team.provisional_cap_committed_cents and Team.cap_space_cents, which return to their exact pre-creation values (Rule 9 invariant cap_dollars_conserved_on_signing_rejection)"
          - "increments Team.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /transactions/{id}/revise"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Transaction.team_id"
          - "revision_count < MAX_TRANSACTION_REVISIONS"
          - "Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
        side_effects:
          - "status = DRAFT; revision_count += 1; rejection_reason = null; decided_at = null; filing_deadline_at unchanged (a revision never buys more time)"
          - "transaction_type == SIGNING: Contract.status VOIDED -> PENDING_APPROVAL; Team.provisional_cap_committed_cents and cap_space_cents recomputed"
          - "increments Team.version by 1"
        note: "The cycle REJECTED -> DRAFT -> FILED -> REJECTED may run at most MAX_TRANSACTION_REVISIONS times."
      - from: REJECTED
        to: VOIDED
        trigger: "POST /transactions/{id}/revise"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Transaction.team_id"
          - "revision_count == MAX_TRANSACTION_REVISIONS"
        side_effects:
          - "status = VOIDED; revision_count stays at MAX_TRANSACTION_REVISIONS (the void is not itself a revision, so the pair (VOIDED, revision_count == MAX_TRANSACTION_REVISIONS) is the stable signature priority 14 matches on)"
          - "transaction_type == SIGNING: linked Contract stays VOIDED permanently"
          - "increments Team.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system — POST /compliance-checks/run sweep step 1"
        actor: system
        preconditions:
          - "logical clock > filing_deadline_at"
        side_effects:
          - "status = VOIDED"
          - "transaction_type == SIGNING: Contract.status PENDING_APPROVAL -> VOIDED; releasing Team.provisional_cap_committed_cents recomputed"
      - from: APPROVED
        to: VOIDED
        trigger: "system — POST /waiver-requests/{id}/withdraw on the RELEASE filing that authorised the withdrawn wire"
        actor: system
        preconditions:
          - "transaction_type == RELEASE AND EXISTS WaiverRequest WHERE transaction_id == this.id AND status == WITHDRAWN"
        side_effects:
          - "status = VOIDED"
          - "effective_at = null (the authorised release never took hold)"

  - entity: Contract
    dimension: status
    shape: "branching with revive cycle (PENDING_APPROVAL -> VOIDED -> PENDING_APPROVAL)"
    initial_state: PENDING_APPROVAL
    terminal_states: [TERMINATED]
    transitions:
      - from: __CREATE__
        to: PENDING_APPROVAL
        trigger: "system — POST /transactions with transaction_type == SIGNING"
        actor: system
        preconditions:
          - "parent Transaction reached DRAFT"
        side_effects:
          - "proration_years = min(years, MAX_PRORATION_YEARS); annual_proration_cents and final_season_proration_cents from calculations.signing_bonus_proration"
          - "current_season_cap_charge_cents from calculations.contract_current_season_cap_charge"
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide with decision == APPROVE"
        actor: system
        preconditions:
          - "parent Transaction reached APPROVED"
        side_effects:
          - "BonusAllocation rows created with allocation_status = SCHEDULED"
          - "option_status = PENDING when option_type != NONE, else NOT_APPLICABLE"
          - "owning Team.final_cap_committed_cents recomputed (ACTIVE contracts enter the FINAL variant)"
      - from: PENDING_APPROVAL
        to: VOIDED
        trigger: "system — POST /transactions/{id}/decide with decision == REJECT, or the compliance sweep voiding a stale DRAFT"
        actor: system
        preconditions:
          - "parent Transaction reached REJECTED or VOIDED"
        side_effects:
          - "current_season_cap_charge_cents no longer enters either cap variant"
      - from: VOIDED
        to: PENDING_APPROVAL
        trigger: "system — POST /transactions/{id}/revise"
        actor: system
        preconditions:
          - "parent Transaction returned to DRAFT"
        side_effects:
          - "current_season_cap_charge_cents re-enters the PROVISIONAL variant"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system — POST /waiver-requests/{id}/process resolving to CLEARED"
        actor: system
        preconditions:
          - "WaiverRequest.contract_id == this.id AND WaiverRequest.status became CLEARED"
        side_effects:
          - "termination_reason = RELEASE_CLEARED"
          - "dead_money_current_season_cents / dead_money_next_season_cents from calculations.dead_money_on_release"
          - "every unamortized SIGNING_PRORATION BonusAllocation row (the current season's row and every later one) -> ACCELERATED; SCHEDULED ROSTER_BONUS / PERFORMANCE_* rows -> FORFEITED"
          - "owning Team.dead_money_cents, provisional_cap_committed_cents, final_cap_committed_cents, cap_space_cents recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system — POST /contracts/{id}/option-decision with decision == DECLINE"
        actor: system
        preconditions:
          - "option_status == PENDING AND logical clock <= option_deadline_at"
        side_effects:
          - "termination_reason = OPTION_DECLINED; option_status = DECLINED"
          - "every unamortized SIGNING_PRORATION BonusAllocation row -> ACCELERATED; SCHEDULED ROSTER_BONUS / PERFORMANCE_* rows -> FORFEITED; EARNED rows are untouched"
          - "dead_money_current_season_cents / dead_money_next_season_cents from calculations.dead_money_on_release"
          - "Player.roster_designation -> UNROSTERED; Player.current_team_id -> null; owning Team designation counts and cap fields recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system — POST /compliance-checks/run sweep step 2 (option deadline lapse)"
        actor: system
        preconditions:
          - "option_status == PENDING AND logical clock > option_deadline_at"
        side_effects:
          - "termination_reason = OPTION_LAPSED; option_status = LAPSED"
          - "same dead-money and roster side effects as the DECLINE path"

  - entity: Contract
    dimension: option_status
    shape: "parallel dimension — advances on option deadlines independently of Contract.status"
    initial_state: NOT_APPLICABLE
    terminal_states: [EXERCISED, DECLINED, LAPSED]
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING
        trigger: "system — Contract.status PENDING_APPROVAL -> ACTIVE with option_type != NONE"
        actor: system
        preconditions:
          - "option_type IN {TEAM_OPTION, PLAYER_OPTION} AND option_deadline_at present AND option_salary_cents present"
        side_effects:
          - "option_status = PENDING"
      - from: PENDING
        to: EXERCISED
        trigger: "POST /contracts/{id}/option-decision with decision == EXERCISE"
        actor: TeamCapAnalyst | PlayerAgent
        preconditions:
          - "option_type == TEAM_OPTION requires X-User-Role == TeamCapAnalyst AND X-User-ID == Contract.team_id"
          - "option_type == PLAYER_OPTION requires X-User-Role == PlayerAgent AND X-User-ID == Contract.player_id"
          - "Contract.status == ACTIVE"
          - "logical clock <= option_deadline_at — an exercise exactly at the deadline instant is accepted"
          - "body.expected_contract_version == Contract.version"
        side_effects:
          - "option_status = EXERCISED; base_salary_cents = option_salary_cents; years += 1"
          - "current_season_cap_charge_cents recomputed; owning Team cap fields recomputed"
          - "increments Contract.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /contracts/{id}/option-decision with decision == DECLINE"
        actor: TeamCapAnalyst | PlayerAgent
        preconditions:
          - "same actor and deadline preconditions as the EXERCISE transition"
        side_effects:
          - "option_status = DECLINED; Contract.status ACTIVE -> TERMINATED with termination_reason = OPTION_DECLINED"
          - "increments Contract.version by 1"
      - from: PENDING
        to: LAPSED
        trigger: "system — POST /compliance-checks/run sweep step 2"
        actor: system
        preconditions:
          - "logical clock > option_deadline_at"
        side_effects:
          - "option_status = LAPSED; Contract.status ACTIVE -> TERMINATED with termination_reason = OPTION_LAPSED"

  - entity: Player
    dimension: roster_designation
    shape: "parallel dimension A (with internal cycles ACTIVE <-> RESERVE and ACTIVE -> INJURED_RESERVE -> ACTIVE); evolves only through approved Transactions and WaiverRequest outcomes"
    initial_state: UNROSTERED
    terminal_states: []
    transitions:
      - from: UNROSTERED
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on SIGNING with is_practice_squad_contract == false"
        actor: system
        preconditions: ["Team.active_roster_count < Team.active_roster_limit"]
        side_effects: ["current_team_id = Transaction.team_id; designation_effective_at = logical clock; Team.active_roster_count += 1"]
      - from: UNROSTERED
        to: PRACTICE_SQUAD
        trigger: "system — POST /transactions/{id}/decide APPROVE on SIGNING with is_practice_squad_contract == true"
        actor: system
        preconditions: ["Player.practice_squad_eligible == true", "Team.practice_squad_count < Team.practice_squad_limit"]
        side_effects: ["current_team_id = Transaction.team_id; designation_effective_at = logical clock; Team.practice_squad_count += 1"]
      - from: ACTIVE
        to: RESERVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on DESIGNATION_CHANGE with target_designation == RESERVE"
        actor: system
        preconditions: ["Team.reserve_roster_count < Team.reserve_roster_limit"]
        side_effects: ["accrued_active_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; Team.active_roster_count -= 1; Team.reserve_roster_count += 1"]
      - from: RESERVE
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on DESIGNATION_CHANGE with target_designation == ACTIVE"
        actor: system
        preconditions: ["Team.active_roster_count < Team.active_roster_limit"]
        side_effects: ["accrued_reserve_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; Team.reserve_roster_count -= 1; Team.active_roster_count += 1"]
      - from: PRACTICE_SQUAD
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on PRACTICE_SQUAD_ELEVATION"
        actor: system
        preconditions: ["Team.active_roster_count < Team.active_roster_limit", "Player.practice_squad_eligible == true"]
        side_effects: ["accrued_practice_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; Team.practice_squad_count -= 1; Team.active_roster_count += 1"]
      - from: ACTIVE
        to: INJURED_RESERVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on IR_PLACEMENT"
        actor: system
        preconditions: ["InjuryDesignation.status == PAPERWORK_FILED", "Team.injured_reserve_count < Team.injured_reserve_limit"]
        side_effects: ["accrued_active_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; Team.active_roster_count -= 1; Team.injured_reserve_count += 1"]
      - from: INJURED_RESERVE
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on IR_ACTIVATION"
        actor: system
        preconditions: ["InjuryDesignation.status == RETURN_WINDOW_OPEN", "Team.active_roster_count < Team.active_roster_limit"]
        side_effects: ["accrued_ir_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; Team.injured_reserve_count -= 1; Team.active_roster_count += 1"]
      - from: ACTIVE
        to: WAIVED_PENDING
        trigger: "system — POST /transactions/{id}/decide APPROVE on RELEASE"
        actor: system
        preconditions: ["Player.current_team_id == Transaction.team_id"]
        side_effects:
          - "accrued_active_days += elapsed days since designation_effective_at; designation_effective_at = logical clock"
          - "Team.active_roster_count -= 1; current_team_id unchanged (the club still carries the cap charge until the wire resolves)"
        note: "RESERVE, INJURED_RESERVE and PRACTICE_SQUAD reach WAIVED_PENDING by the same transition, decrementing their own count and accruing their own bucket."
      - from: WAIVED_PENDING
        to: ACTIVE
        trigger: "system — POST /waiver-requests/{id}/process resolving to CLAIMED"
        actor: system
        preconditions: ["awarded_to_team_id set by calculations.waiver_award_cap_resolution", "winning Team.active_roster_count < winning Team.active_roster_limit"]
        side_effects: ["current_team_id = WaiverRequest.awarded_to_team_id; designation_effective_at = logical clock; winning Team.active_roster_count += 1"]
      - from: WAIVED_PENDING
        to: UNROSTERED
        trigger: "system — POST /waiver-requests/{id}/process resolving to CLEARED"
        actor: system
        preconditions: ["no SUBMITTED WaiverClaim survived the eligibility filter"]
        side_effects: ["current_team_id = null; designation_effective_at = logical clock"]
      - from: WAIVED_PENDING
        to: ACTIVE
        trigger: "system — POST /waiver-requests/{id}/withdraw with WaiverRequest.origin_designation == ACTIVE"
        actor: system
        preconditions: ["WaiverRequest.revocability == REVOCABLE", "WaiverRequest.status == PENDING", "releasing Team.active_roster_count < releasing Team.active_roster_limit"]
        side_effects: ["roster_designation = WaiverRequest.origin_designation; designation_effective_at = logical clock; releasing Team.active_roster_count += 1"]
        note: "Restores whichever origin_designation the wire snapshotted, incrementing that designation's own count."
      - from: ACTIVE
        to: UNROSTERED
        trigger: "system — POST /contracts/{id}/option-decision DECLINE, or the compliance sweep lapsing an option"
        actor: system
        preconditions: ["Contract.status became TERMINATED with termination_reason IN {OPTION_DECLINED, OPTION_LAPSED}"]
        side_effects: ["accrued_active_days += elapsed days since designation_effective_at; designation_effective_at = logical clock; current_team_id = null; Team.active_roster_count -= 1"]

  - entity: Player
    dimension: medical_status
    shape: "parallel dimension B — every transition here is independent of dimension A; a Player may hold any (roster_designation, medical_status) pair"
    initial_state: CLEARED
    terminal_states: []
    transitions:
      - from: CLEARED
        to: PHYSICAL_PENDING
        trigger: "POST /physical-exams"
        actor: TeamMedicalOfficer
        preconditions: ["no window overlap per calculations.physical_exam_window_overlap"]
        side_effects: ["medical_status = PHYSICAL_PENDING while at least one PhysicalExam with status == SCHEDULED exists for the player"]
      - from: PHYSICAL_PENDING
        to: CLEARED
        trigger: "POST /physical-exams/{id}/record-result with result == PASSED"
        actor: TeamMedicalOfficer
        preconditions: ["performed_at IN [window_start_at, window_end_at)"]
        side_effects: ["last_physical_passed_at = performed_at; PhysicalExam.expires_at = performed_at + PHYSICAL_VALIDITY_DAYS"]
      - from: PHYSICAL_PENDING
        to: FAILED_PHYSICAL
        trigger: "POST /physical-exams/{id}/record-result with result == FAILED"
        actor: TeamMedicalOfficer
        preconditions: ["performed_at IN [window_start_at, window_end_at)"]
        side_effects:
          - "PhysicalExam.status = FAILED"
          - "exam_type == TRADE_PHYSICAL: linked Trade.status MEDICAL_REVIEW -> VOIDED with void_reason = FAILED_PHYSICAL (cascade link 2)"
          - "the voided Trade's TradeAsset rows PROPOSED -> RETURNED (cascade link 3)"
          - "because the medical-review interval is released, both clubs' open_medical_review_count -= 1 (cascade link 4)"
      - from: FAILED_PHYSICAL
        to: PHYSICAL_PENDING
        trigger: "POST /physical-exams"
        actor: TeamMedicalOfficer
        preconditions: ["a new PhysicalExam row reaches SCHEDULED"]
        side_effects: ["medical_status = PHYSICAL_PENDING"]
      - from: CLEARED
        to: REHAB
        trigger: "POST /injury-designations/{id}/file-paperwork"
        actor: TeamMedicalOfficer
        preconditions: ["InjuryDesignation.status == PENDING_PAPERWORK"]
        side_effects: ["medical_status = REHAB; InjuryDesignation.status = PAPERWORK_FILED"]
      - from: REHAB
        to: PHYSICAL_PENDING
        trigger: "POST /physical-exams with exam_type == RETURN_PHYSICAL"
        actor: TeamMedicalOfficer
        preconditions: ["EXISTS InjuryDesignation WHERE player_id == this.id AND status IN {ACTIVE, RETURN_WINDOW_OPEN}"]
        side_effects: ["medical_status = PHYSICAL_PENDING"]
      - from: PHYSICAL_PENDING
        to: CLEARED
        trigger: "system — POST /transactions/{id}/decide APPROVE on IR_ACTIVATION"
        actor: system
        preconditions: ["the RETURN_PHYSICAL exam is PASSED and unexpired"]
        side_effects: ["medical_status = CLEARED"]

  - entity: WaiverRequest
    dimension: status
    shape: "branching — one PENDING state with three terminal outcomes carrying disjoint side-effect sets"
    initial_state: PENDING
    terminal_states: [WITHDRAWN, CLAIMED, CLEARED]
    transitions:
      - from: __CREATE__
        to: PENDING
        trigger: "POST /waiver-requests"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == body.from_team_id"
          - "Transaction.id == body.transaction_id exists AND transaction_type == RELEASE AND status == APPROVED AND team_id == body.from_team_id AND player_id == body.player_id"
          - "no other WaiverRequest for body.player_id has status == PENDING"
          - "Player.roster_designation == WAIVED_PENDING"
        side_effects:
          - "revocability = calculations.waiver_clearance_deadline(Player, logical clock)"
          - "origin_designation = Transaction.prior_designation of body.transaction_id"
          - "contract_id = the ACTIVE Contract of body.player_id"
          - "placed_at = logical clock; clearance_deadline_at = calculations.waiver_clearance_deadline"
          - "increments Team.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /waiver-requests/{id}/withdraw"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == WaiverRequest.from_team_id"
          - "revocability == REVOCABLE"
          - "logical clock < clearance_deadline_at"
          - "releasing Team's designation count for origin_designation is below the matching Team limit"
        side_effects:
          - "processed_at = logical clock"
          - "Player.roster_designation WAIVED_PENDING -> origin_designation (cascade link 2)"
          - "because the player returned to the roster, releasing Team's designation count for origin_designation += 1 and Team.compliance_status is re-evaluated (cascade link 3)"
          - "the authorising RELEASE Transaction APPROVED -> VOIDED"
          - "every SUBMITTED WaiverClaim on this wire -> INVALIDATED"
          - "releasing_team_dead_money_cents stays 0; Contract keeps status == ACTIVE (Rule 9 invariant roster_headcount_conserved_on_waiver_withdraw)"
      - from: PENDING
        to: CLAIMED
        trigger: "POST /waiver-requests/{id}/process"
        actor: LeagueOfficer
        preconditions:
          - "logical clock >= clearance_deadline_at"
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
          - "calculations.waiver_award_cap_resolution returns a non-empty eligible claim set"
        side_effects:
          - "awarded_to_team_id = winner; processed_at = logical clock; the winning WaiverClaim SUBMITTED -> AWARDED"
          - "every other eligible SUBMITTED claim -> LOST; every claim failing the eligibility filter -> INVALIDATED"
          - "because a winner exists, Player.current_team_id = winner and roster_designation WAIVED_PENDING -> ACTIVE (cascade link 2)"
          - "because the player changed clubs, Contract.team_id = winner and the winner's active_roster_count, provisional_cap_committed_cents, final_cap_committed_cents and cap_space_cents are recomputed (cascade link 3)"
          - "because the winner's committed cap changed, the winner's compliance_status is re-evaluated in EVENT mode (cascade link 4)"
          - "releasing club: releasing_team_dead_money_cents = calculations.dead_money_on_release applied to the unamortized signing bonus only (the base salary moves with the contract to the claiming club, so the releasing club keeps no base charge) and charged to from_team_id; from_team_id cap fields and compliance_status recomputed"
      - from: PENDING
        to: CLEARED
        trigger: "POST /waiver-requests/{id}/process"
        actor: LeagueOfficer
        preconditions:
          - "logical clock >= clearance_deadline_at"
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
          - "calculations.waiver_award_cap_resolution returns an empty eligible claim set"
        side_effects:
          - "processed_at = logical clock; every SUBMITTED claim -> INVALIDATED"
          - "Player.roster_designation WAIVED_PENDING -> UNROSTERED; current_team_id = null"
          - "Contract.status ACTIVE -> TERMINATED with termination_reason = RELEASE_CLEARED"
          - "releasing_team_dead_money_cents = Contract.dead_money_current_season_cents; from_team_id dead_money_cents, cap fields and compliance_status recomputed"

  - entity: WaiverClaim
    dimension: status
    shape: "linear fan-in — every SUBMITTED claim is resolved by exactly one process or withdraw sweep"
    initial_state: SUBMITTED
    terminal_states: [AWARDED, LOST, INVALIDATED]
    transitions:
      - from: __CREATE__
        to: SUBMITTED
        trigger: "POST /waiver-requests/{id}/claims"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == body.claiming_team_id"
          - "body.claiming_team_id != WaiverRequest.from_team_id"
          - "WaiverRequest.status == PENDING AND logical clock < clearance_deadline_at"
          - "no WaiverClaim with the same (waiver_request_id, claiming_team_id) exists"
          - "claiming Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "body.expected_team_version == claiming Team.version"
        side_effects:
          - "priority_rank_snapshot = claiming Team.waiver_priority_rank; cap_space_snapshot_cents = claiming Team.cap_space_cents"
          - "required_cap_charge_cents = Contract.base_salary_cents of WaiverRequest.contract_id"
          - "WaiverRequest.claim_count += 1; increments claiming Team.version by 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "system — POST /waiver-requests/{id}/process selecting this claim"
        actor: system
        preconditions: ["this claim has the lowest priority_rank_snapshot among eligible claims"]
        side_effects: ["the wire moves to CLAIMED with awarded_to_team_id = claiming_team_id"]
      - from: SUBMITTED
        to: LOST
        trigger: "system — POST /waiver-requests/{id}/process selecting a different claim"
        actor: system
        preconditions: ["this claim passed the eligibility filter but did not win the ranking"]
        side_effects: ["no cap or roster change for claiming_team_id"]
      - from: SUBMITTED
        to: INVALIDATED
        trigger: "system — POST /waiver-requests/{id}/process or POST /waiver-requests/{id}/withdraw"
        actor: system
        preconditions:
          - "at resolution time either claiming Team.compliance_status IN {NON_COMPLIANT, TRANSACTION_FROZEN}, or claiming Team.cap_space_cents < required_cap_charge_cents, or the wire was withdrawn"
        side_effects: ["no cap or roster change for claiming_team_id"]

  - entity: Trade
    dimension: status
    shape: "cyclic negotiation (PROPOSED <-> COUNTERED with alternating actors) then branching into MEDICAL_REVIEW or straight to EXECUTED"
    initial_state: PROPOSED
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: __CREATE__
        to: PROPOSED
        trigger: "POST /trades"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == body.initiating_team_id"
          - "body.initiating_team_id != body.counterparty_team_id and both Teams exist"
          - "both Teams have compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "conditional_clause_type IN {PHYSICAL_CONTINGENT, PICK_CONDITIONAL} requires a non-blank condition_note"
        side_effects:
          - "status = PROPOSED; round_count = 1"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /trades/{id}/counter"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.counterparty_team_id — from PROPOSED only the counterparty may counter"
          - "round_count < MAX_TRADE_ROUNDS"
          - "body.expected_trade_version == Trade.version"
        side_effects:
          - "status = COUNTERED; round_count += 1; increments Trade.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /trades/{id}/counter"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.initiating_team_id — from COUNTERED only the initiator may counter back"
          - "round_count < MAX_TRADE_ROUNDS"
          - "body.expected_trade_version == Trade.version"
        side_effects:
          - "status = PROPOSED; round_count += 1; increments Trade.version by 1"
        note: "This edge closes the negotiation cycle; the actor alternates every round."
      - from: COUNTERED
        to: VOIDED
        trigger: "POST /trades/{id}/counter"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.initiating_team_id"
          - "round_count == MAX_TRADE_ROUNDS"
        side_effects:
          - "status = VOIDED; void_reason = ROUND_LIMIT_EXCEEDED; round_count += 1"
          - "every TradeAsset PROPOSED -> RETURNED; increments Trade.version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /trades/{id}/counter"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.counterparty_team_id"
          - "round_count == MAX_TRADE_ROUNDS"
        side_effects:
          - "status = VOIDED; void_reason = ROUND_LIMIT_EXCEEDED; round_count += 1"
          - "every TradeAsset PROPOSED -> RETURNED; increments Trade.version by 1"
        note: "The mirror of the COUNTERED -> VOIDED edge; whichever club owes the response when the budget is exhausted is the one whose counter voids the trade."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /trades/{id}/accept"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.counterparty_team_id"
          - "conditional_clause_type != PHYSICAL_CONTINGENT"
          - "COUNT(TradeAsset WHERE trade_id == this.id AND status == PROPOSED) >= 1"
        side_effects:
          - "status = ACCEPTED; accepted_at = logical clock; increments Trade.version by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /trades/{id}/accept"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.initiating_team_id"
          - "conditional_clause_type != PHYSICAL_CONTINGENT"
          - "COUNT(TradeAsset WHERE trade_id == this.id AND status == PROPOSED) >= 1"
        side_effects:
          - "status = ACCEPTED; accepted_at = logical clock; increments Trade.version by 1"
      - from: PROPOSED
        to: MEDICAL_REVIEW
        trigger: "POST /trades/{id}/accept"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == Trade.counterparty_team_id"
          - "conditional_clause_type == PHYSICAL_CONTINGENT"
          - "COUNT(TradeAsset WHERE trade_id == this.id AND status == PROPOSED) >= 1"
          - "calculations.medical_review_slot_availability passes for BOTH clubs (closed-interval occupation, capacity MAX_CONCURRENT_MEDICAL_REVIEWS)"
        side_effects:
          - "status = MEDICAL_REVIEW; accepted_at = logical clock; medical_review_deadline_at = accepted_at + MEDICAL_REVIEW_WINDOW_HOURS"
          - "both clubs' open_medical_review_count += 1"
          - "increments Trade.version by 1"
        note: "COUNTERED -> MEDICAL_REVIEW works identically with the initiator as actor."
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /trades/{id}/execute"
        actor: LeagueOfficer
        preconditions:
          - "logical clock time-of-day IN [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
          - "both clubs have compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "every CONTRACT TradeAsset references a Contract whose status == ACTIVE and whose team_id equals the sending club"
          - "no player on a CONTRACT TradeAsset has medical_status == FAILED_PHYSICAL"
          - "calculations.trade_cap_compatibility: for BOTH clubs provisional_cap_committed_cents + cap_delta <= salary_cap_limit_cents"
          - "receiving-club active_roster_count after transfer <= active_roster_limit for both clubs"
        side_effects:
          - "status = EXECUTED; executed_at = logical clock; cap_delta_initiating_cents and cap_delta_counterparty_cents stored"
          - "every TradeAsset PROPOSED -> TRANSFERRED"
          - "for each CONTRACT asset: Contract.team_id = receiving club; Player.current_team_id = receiving club; Player.roster_designation = ACTIVE; Player.designation_effective_at = logical clock and the outgoing designation bucket accrues elapsed days"
          - "both clubs' designation counts, provisional_cap_committed_cents, final_cap_committed_cents, cap_space_cents recomputed, then compliance_status re-evaluated in EVENT mode"
          - "increments Trade.version by 1"
      - from: MEDICAL_REVIEW
        to: EXECUTED
        trigger: "POST /trades/{id}/execute"
        actor: LeagueOfficer
        preconditions:
          - "all preconditions of the ACCEPTED -> EXECUTED edge"
          - "logical clock <= medical_review_deadline_at"
          - "every PhysicalExam with trade_id == this.id has status == PASSED AND expires_at > logical clock"
        side_effects:
          - "all side effects of the ACCEPTED -> EXECUTED edge"
          - "both clubs' open_medical_review_count -= 1"
      - from: MEDICAL_REVIEW
        to: VOIDED
        trigger: "system — POST /physical-exams/{id}/record-result with result == FAILED on a TRADE_PHYSICAL of this trade"
        actor: system
        preconditions:
          - "PhysicalExam.trade_id == this.id AND PhysicalExam.status became FAILED"
        side_effects:
          - "status = VOIDED; void_reason = FAILED_PHYSICAL"
          - "every TradeAsset PROPOSED -> RETURNED"
          - "both clubs' open_medical_review_count -= 1"
      - from: MEDICAL_REVIEW
        to: VOIDED
        trigger: "system — POST /compliance-checks/run sweep step 3"
        actor: system
        preconditions:
          - "logical clock > medical_review_deadline_at"
        side_effects:
          - "status = VOIDED; void_reason = MEDICAL_WINDOW_EXPIRED"
          - "every TradeAsset PROPOSED -> RETURNED"
          - "both clubs' open_medical_review_count -= 1"

  - entity: TradeAsset
    dimension: status
    shape: "linear with two terminal outcomes mirroring the parent trade"
    initial_state: PROPOSED
    terminal_states: [TRANSFERRED, RETURNED]
    transitions:
      - from: __CREATE__
        to: PROPOSED
        trigger: "POST /trades/{id}/assets"
        actor: TeamCapAnalyst
        preconditions:
          - "Trade.status IN {PROPOSED, COUNTERED}"
          - "direction == TO_COUNTERPARTY requires X-User-ID == Trade.initiating_team_id; direction == TO_INITIATOR requires X-User-ID == Trade.counterparty_team_id"
          - "asset_kind == CONTRACT requires contract_id whose Contract.status == ACTIVE AND Contract.team_id == the sending club"
          - "asset_kind == DRAFT_PICK requires draft_pick_year and draft_pick_round"
          - "asset_kind == CASH_CONSIDERATION requires cash_amount_cents > 0"
          - "body.expected_trade_version == Trade.version"
        side_effects:
          - "cap_charge_snapshot_cents = Contract.current_season_cap_charge_cents for CONTRACT, cash_amount_cents for CASH_CONSIDERATION, 0 for DRAFT_PICK"
          - "Trade.cap_delta_initiating_cents and cap_delta_counterparty_cents recomputed"
          - "increments Trade.version by 1"
      - from: PROPOSED
        to: TRANSFERRED
        trigger: "system — POST /trades/{id}/execute"
        actor: system
        preconditions: ["parent Trade reached EXECUTED"]
        side_effects: ["for CONTRACT assets the underlying Contract.team_id and Player.current_team_id move to the receiving club"]
      - from: PROPOSED
        to: RETURNED
        trigger: "system — parent Trade reached VOIDED by any of its three void paths"
        actor: system
        preconditions: ["parent Trade.status == VOIDED"]
        side_effects: ["no Contract or Player field changes — the asset never moved"]

  - entity: InjuryDesignation
    dimension: status
    shape: "linear with a clock-driven fork (RETURN_WINDOW_OPEN vs EXPIRED)"
    initial_state: PENDING_PAPERWORK
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: __CREATE__
        to: PENDING_PAPERWORK
        trigger: "POST /injury-designations"
        actor: TeamMedicalOfficer
        preconditions:
          - "X-User-ID == body.team_id"
          - "Player.current_team_id == body.team_id AND Player.roster_designation IN {ACTIVE, RESERVE}"
          - "no other InjuryDesignation for body.player_id has status IN {PENDING_PAPERWORK, PAPERWORK_FILED, ACTIVE, RETURN_WINDOW_OPEN}"
        side_effects:
          - "placed_at = logical clock; minimum_stay_days = MINIMUM_STAY_DAYS[designation_type]"
      - from: PENDING_PAPERWORK
        to: PAPERWORK_FILED
        trigger: "POST /injury-designations/{id}/file-paperwork"
        actor: TeamMedicalOfficer
        preconditions:
          - "X-User-ID == InjuryDesignation.team_id"
          - "paperwork_reference present and non-blank"
        side_effects:
          - "paperwork_filed_at = logical clock; Player.medical_status -> REHAB"
      - from: PAPERWORK_FILED
        to: ACTIVE
        trigger: "system — POST /transactions/{id}/decide APPROVE on IR_PLACEMENT referencing this designation"
        actor: system
        preconditions:
          - "Transaction.injury_designation_id == this.id AND Transaction.status became APPROVED"
          - "Team.injured_reserve_count < Team.injured_reserve_limit"
        side_effects:
          - "activated_at = logical clock; return_window_opens_at = activated_at + minimum_stay_days days; return_window_closes_at = return_window_opens_at + RETURN_WINDOW_LENGTH_DAYS days"
          - "Player.roster_designation -> INJURED_RESERVE"
      - from: ACTIVE
        to: RETURN_WINDOW_OPEN
        trigger: "system — POST /compliance-checks/run sweep step 4"
        actor: system
        preconditions:
          - "logical clock >= return_window_opens_at AND logical clock <= return_window_closes_at"
        side_effects:
          - "no roster or cap change; the IR_ACTIVATION filing becomes approvable"
      - from: RETURN_WINDOW_OPEN
        to: CLOSED
        trigger: "system — POST /transactions/{id}/decide APPROVE on IR_ACTIVATION referencing this designation"
        actor: system
        preconditions:
          - "logical clock IN [return_window_opens_at, return_window_closes_at] — closed interval, both ends accepted"
          - "EXISTS PhysicalExam WHERE player_id == this.player_id AND exam_type == RETURN_PHYSICAL AND status == PASSED AND expires_at > logical clock"
        side_effects:
          - "closed_at = logical clock; ir_service_credit_days = floor((closed_at - activated_at) / 86400 seconds)"
          - "Player.roster_designation -> ACTIVE; Player.medical_status -> CLEARED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /compliance-checks/run sweep step 4"
        actor: system
        preconditions:
          - "logical clock > return_window_closes_at"
        side_effects:
          - "closed_at = logical clock; ir_service_credit_days = floor((closed_at - activated_at) / 86400 seconds); the player stays INJURED_RESERVE for the season"
      - from: RETURN_WINDOW_OPEN
        to: EXPIRED
        trigger: "system — POST /compliance-checks/run sweep step 4"
        actor: system
        preconditions:
          - "logical clock > return_window_closes_at"
        side_effects:
          - "closed_at = logical clock; ir_service_credit_days computed as above"

  - entity: PhysicalExam
    dimension: status
    shape: "branching on result with a clock-driven expiry"
    initial_state: SCHEDULED
    terminal_states: [FAILED, EXPIRED]
    transitions:
      - from: __CREATE__
        to: SCHEDULED
        trigger: "POST /physical-exams"
        actor: TeamMedicalOfficer
        preconditions:
          - "X-User-ID == body.team_id"
          - "window_end_at > window_start_at"
          - "calculations.physical_exam_window_overlap finds no half-open collision for this player"
          - "exam_type == TRADE_PHYSICAL requires trade_id whose Trade.status == MEDICAL_REVIEW and whose conditional_clause_type == PHYSICAL_CONTINGENT"
          - "exam_type == RETURN_PHYSICAL requires an InjuryDesignation for this player with status IN {ACTIVE, RETURN_WINDOW_OPEN}"
        side_effects:
          - "Player.medical_status -> PHYSICAL_PENDING"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /physical-exams/{id}/record-result with result == PASSED"
        actor: TeamMedicalOfficer
        preconditions:
          - "X-User-ID == PhysicalExam.team_id"
          - "performed_at IN [window_start_at, window_end_at) — half-open"
        side_effects:
          - "expires_at = performed_at + PHYSICAL_VALIDITY_DAYS days; result_recorded_at = logical clock"
          - "Player.last_physical_passed_at = performed_at; Player.medical_status -> CLEARED when no other SCHEDULED exam remains"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /physical-exams/{id}/record-result with result == FAILED"
        actor: TeamMedicalOfficer
        preconditions:
          - "X-User-ID == PhysicalExam.team_id"
          - "performed_at IN [window_start_at, window_end_at)"
        side_effects:
          - "result_recorded_at = logical clock; Player.medical_status -> FAILED_PHYSICAL"
          - "exam_type == TRADE_PHYSICAL: the linked Trade MEDICAL_REVIEW -> VOIDED (void_reason FAILED_PHYSICAL), then that trade's assets -> RETURNED, then both clubs' open_medical_review_count -= 1"
      - from: PASSED
        to: EXPIRED
        trigger: "system — POST /compliance-checks/run sweep step 5"
        actor: system
        preconditions:
          - "logical clock > expires_at"
        side_effects:
          - "an approval that requires a physical can no longer cite this exam"

  - entity: QualifyingOffer
    dimension: status
    shape: "branching with a clock-driven lapse"
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, LAPSED]
    transitions:
      - from: __CREATE__
        to: ISSUED
        trigger: "POST /qualifying-offers"
        actor: TeamCapAnalyst
        preconditions:
          - "X-User-ID == body.team_id"
          - "Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
          - "Player.contract_rights_class IN {RESTRICTED, ARBITRATION_ELIGIBLE}"
          - "Player.roster_designation == UNROSTERED"
          - "offer_type == ARBITRATION_TENDER requires Player.contract_rights_class == ARBITRATION_ELIGIBLE"
          - "no other QualifyingOffer for (player_id, team_id) has status == ISSUED"
        side_effects:
          - "amount_cents = calculations.qualifying_offer_amount; issued_at = logical clock; deadline_at = issued_at + TENDER_RESPONSE_HOURS snapped into the processing window"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /qualifying-offers/{id}/respond with response == ACCEPT"
        actor: PlayerAgent
        preconditions:
          - "X-User-ID == QualifyingOffer.player_id"
          - "logical clock <= deadline_at"
          - "tendering Team.compliance_status NOT IN {NON_COMPLIANT, TRANSACTION_FROZEN}"
        side_effects:
          - "status = ACCEPTED; responded_at = logical clock"
          - "because the tender was accepted, a Transaction{transaction_type: SIGNING, team_id, player_id, status: DRAFT} is created and resulting_transaction_id is set (cascade link 2)"
          - "because that SIGNING filing exists, a Contract{status: PENDING_APPROVAL, years: 1, base_salary_cents: amount_cents, signing_bonus_cents: 0} is created and linked (cascade link 3)"
          - "because a PENDING_APPROVAL contract now exists, the tendering Team.provisional_cap_committed_cents and cap_space_cents are recomputed (cascade link 4)"
          - "increments Team.version by 1"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /qualifying-offers/{id}/respond with response == DECLINE"
        actor: PlayerAgent
        preconditions:
          - "X-User-ID == QualifyingOffer.player_id"
          - "logical clock <= deadline_at"
        side_effects:
          - "status = DECLINED; responded_at = logical clock; no Transaction is created"
      - from: ISSUED
        to: LAPSED
        trigger: "system — POST /compliance-checks/run sweep step 2"
        actor: system
        preconditions:
          - "logical clock > deadline_at"
        side_effects:
          - "status = LAPSED; no Transaction is created"

  - entity: Team
    dimension: compliance_status
    shape: "posture-driven cycle — every state can return to COMPLIANT on a violation-free sweep"
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: GRACE
        trigger: "POST /compliance-checks/run, or any approved Transaction / executed Trade / processed waiver that leaves a violation (EVENT mode)"
        actor: LeagueOfficer | system
        preconditions:
          - "calculations.team_compliance_evaluation returns a non-empty violation_codes list"
        side_effects:
          - "grace_expires_at = evaluation instant + GRACE_PERIOD_HOURS; consecutive_noncompliant_checks = 1"
      - from: GRACE
        to: GRACE
        trigger: "POST /compliance-checks/run"
        actor: LeagueOfficer
        preconditions:
          - "violation_codes non-empty AND logical clock < grace_expires_at"
        side_effects:
          - "grace_expires_at unchanged; consecutive_noncompliant_checks unchanged"
      - from: GRACE
        to: NON_COMPLIANT
        trigger: "POST /compliance-checks/run"
        actor: LeagueOfficer
        preconditions:
          - "violation_codes non-empty AND logical clock >= grace_expires_at — the boundary instant already counts as expired"
        side_effects:
          - "grace_expires_at = null; consecutive_noncompliant_checks = 2; every team-scoped write is now rejected with ERR_TEAM_TRANSACTIONS_FROZEN"
      - from: NON_COMPLIANT
        to: TRANSACTION_FROZEN
        trigger: "POST /compliance-checks/run"
        actor: LeagueOfficer
        preconditions:
          - "violation_codes non-empty AND consecutive_noncompliant_checks + 1 >= FREEZE_AFTER_CONSECUTIVE_CHECKS"
        side_effects:
          - "consecutive_noncompliant_checks += 1"
      - from: TRANSACTION_FROZEN
        to: TRANSACTION_FROZEN
        trigger: "POST /compliance-checks/run"
        actor: LeagueOfficer
        preconditions:
          - "violation_codes non-empty"
        side_effects:
          - "consecutive_noncompliant_checks += 1"
      - from: GRACE
        to: COMPLIANT
        trigger: "POST /compliance-checks/run"
        actor: LeagueOfficer
        preconditions:
          - "violation_codes is empty"
        side_effects:
          - "grace_expires_at = null; consecutive_noncompliant_checks = 0"
        note: "NON_COMPLIANT -> COMPLIANT and TRANSACTION_FROZEN -> COMPLIANT use this same violation-free edge, which is the only unfreeze path."


  - entity: BonusAllocation
    dimension: allocation_status
    shape: "branching from a single scheduled state into three mutually exclusive terminal outcomes"
    initial_state: SCHEDULED
    terminal_states: [EARNED, FORFEITED, ACCELERATED]
    transitions:
      - from: __CREATE__
        to: SCHEDULED
        trigger: "system — POST /transactions/{id}/decide APPROVE on SIGNING"
        actor: system
        preconditions:
          - "the parent Contract reached ACTIVE"
        side_effects:
          - "one SIGNING_PRORATION row per prorated season carrying annual_proration_cents (final season carries final_season_proration_cents), counts_against_provisional = false — this row is the amortization ledger dead-money acceleration consumes, not an extra cap charge"
          - "one PERFORMANCE_LTBE row when the filing carried performance_ltbe_cents > 0, season_year = start_season_year, counts_against_provisional = true"
          - "one PERFORMANCE_NLTBE row when the filing carried performance_nltbe_cents > 0, season_year = start_season_year, counts_against_provisional = false"
      - from: SCHEDULED
        to: EARNED
        trigger: "POST /bonus-allocations/{id}/earn"
        actor: LeagueOfficer
        preconditions:
          - "the parent Contract.status == ACTIVE"
        side_effects:
          - "earned_at = logical clock"
          - "a PERFORMANCE_NLTBE row now enters the FINAL cap variant for the first time while never having entered PROVISIONAL; a PERFORMANCE_LTBE row leaves PROVISIONAL unchanged and raises FINAL"
          - "owning Team's provisional_cap_committed_cents, final_cap_committed_cents and cap_space_cents recomputed"
      - from: SCHEDULED
        to: ACCELERATED
        trigger: "system — the parent Contract reached TERMINATED under any termination_reason (RELEASE_CLEARED, OPTION_DECLINED or OPTION_LAPSED)"
        actor: system
        preconditions:
          - "bonus_type == SIGNING_PRORATION AND season_year >= CURRENT_SEASON_YEAR"
        side_effects:
          - "the row stops counting as a live cap charge and its money is folded into calculations.dead_money_on_release, which splits it across the current and next season according to the acceleration cutoff"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "system — the parent Contract reached TERMINATED under any termination_reason (RELEASE_CLEARED, OPTION_DECLINED or OPTION_LAPSED)"
        actor: system
        preconditions:
          - "bonus_type IN {ROSTER_BONUS, PERFORMANCE_LTBE, PERFORMANCE_NLTBE} AND allocation_status is still SCHEDULED — an already EARNED row is terminal and is never forfeited"
        side_effects:
          - "the row leaves both cap variants and contributes nothing to dead money — a declined option forfeits unearned performance money outright"
# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# Only true races survive the serial-observability filter. Every entry below
# is resolved by OCC on the parent entity's `version`; the losing writer's
# view of the parent is stale, which two strictly sequential requests expose.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: transaction-create-stale-team
    parent_entity: Team
    write_endpoint: "POST /transactions"
    occ_field: "expected_team_version"
    description: |
      Filing a new Transaction against a Team whose version has advanced since
      the client last read it is rejected. A club may legitimately hold several
      DRAFT filings for the same player and designation at once — the second
      create observes no state field the first create changed, so nothing in
      §1.2 or §1.4 would reject it. Only the stale team version distinguishes a
      writer who has not yet seen the roster and cap totals moved by the first
      filing.
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412

  - rule_id: waiver-claim-create-stale-team
    parent_entity: Team
    write_endpoint: "POST /waiver-requests/{id}/claims"
    occ_field: "expected_team_version"
    description: |
      Submitting a WaiverClaim carries a snapshot of the claiming club's cap
      space and waiver priority rank taken from the Team the client last read.
      A club may legitimately submit claims on several waiver requests while one
      request is still PENDING, so a repeated submit sees identical WaiverRequest
      state and would succeed. Rejecting on a stale team version is what stops a
      claim from being ranked and cap-tested against a Team snapshot that has
      since been superseded.
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412

  - rule_id: trade-asset-add-stale-trade
    parent_entity: Trade
    write_endpoint: "POST /trades/{id}/assets"
    occ_field: "expected_trade_version"
    description: |
      Adding a TradeAsset to a Trade whose version has advanced since the client
      last read it is rejected. Trades accept any number of assets on either
      side, so a second add observes the same Trade.status and would legitimately
      succeed; the stale version is the only signal that the writer has not seen
      the cap deltas recomputed by the previously added asset, or the counter
      that flipped which club is now allowed to add.
    error_id: ERR_STALE_TRADE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# Every constant is fixed here; downstream generators must not invent values.
# ---------------------------------------------------------------------------
calculations:
  - name: signing_bonus_proration
    trigger: "POST /transactions with transaction_type == SIGNING (at contract creation), POST /transactions/{id}/revise (re-prorated), and re-read on every cap recompute"
    algorithm: aggregation
    formula: |
      proration_years = min(years, MAX_PRORATION_YEARS)
      annual_proration_cents = floor(signing_bonus_cents / proration_years)
      final_season_proration_cents =
          signing_bonus_cents - annual_proration_cents * (proration_years - 1)
      # The remainder lands entirely in the LAST prorated season, so the sum of
      # all season charges equals signing_bonus_cents exactly.
    input_set: "the Contract being created; signing_bonus_cents and years only"
    constants:
      MAX_PRORATION_YEARS: 5
    precision: "integer cents; floor on the per-season quotient, remainder to the final season"
    variants:
      - name: within_cap
        when: "years <= MAX_PRORATION_YEARS"
        difference: "proration_years == years — every contract season carries a share"
      - name: capped
        when: "years > MAX_PRORATION_YEARS"
        difference: |
          proration_years is clamped to 5, so the annual charge is larger than
          signing_bonus_cents / years and seasons 6..years carry zero proration
    note: |
      Combinatorial mode (b): identical formula, different parameter set. Worked
      example — signing_bonus_cents 10000000, years 3: annual 3333333, final
      3333334 (3333333*2 + 3333334 == 10000000).

  - name: contract_current_season_cap_charge
    trigger: "POST /transactions (SIGNING), POST /transactions/{id}/decide APPROVE, POST /trades/{id}/execute, POST /contracts/{id}/option-decision"
    algorithm: aggregation
    formula: |
      seasons_elapsed = CURRENT_SEASON_YEAR - start_season_year
      proration_years = min(years, MAX_PRORATION_YEARS)
      if seasons_elapsed == proration_years - 1:
          proration_share = final_season_proration_cents
      elif seasons_elapsed < proration_years - 1:
          proration_share = annual_proration_cents
      else:
          proration_share = 0
      current_season_cap_charge_cents = base_salary_cents + proration_share
    input_set: "one Contract, any status; the field is stored on the Contract and read by team-level rollups"
    constants:
      CURRENT_SEASON_YEAR: 2026
      MAX_PRORATION_YEARS: 5
    precision: "integer cents"
    note: |
      Worked example — base_salary_cents 80000000, signing_bonus_cents 10000000,
      years 3, start_season_year 2026: seasons_elapsed 0, proration_share
      3333333, current_season_cap_charge_cents 83333333.

  - name: team_cap_commitment
    trigger: "every write that creates, terminates, transfers or re-values a Contract or BonusAllocation; read inline by GET /teams/{id}/cap-ledger"
    algorithm: forward_looking
    input_set: |
      PROVISIONAL: Contracts of the team with status IN {PENDING_APPROVAL, ACTIVE}
        plus current-season BonusAllocations of those contracts with
        counts_against_provisional == true (bonus_type IN {ROSTER_BONUS,
        PERFORMANCE_LTBE}, season_year == CURRENT_SEASON_YEAR, allocation_status
        IN {SCHEDULED, EARNED}) plus Team.dead_money_cents.
      FINAL: Contracts of the team with status == ACTIVE only, plus current-season
        BonusAllocations of those contracts with allocation_status == EARNED
        (bonus_type IN {ROSTER_BONUS, PERFORMANCE_LTBE, PERFORMANCE_NLTBE}, so
        PERFORMANCE_NLTBE enters here and never in PROVISIONAL), plus
        Team.dead_money_cents.
      NEITHER variant counts SIGNING_PRORATION rows: their money is already inside
        Contract.current_season_cap_charge_cents, so counting them again would
        double-charge the proration.
    formula: |
      base(statuses) = SUM(Contract.current_season_cap_charge_cents
                           WHERE Contract.team_id == T AND Contract.status IN statuses)
      bonus(pred)    = SUM(BonusAllocation.amount_cents
                           WHERE parent Contract is in the same status set AND pred holds)

      provisional_cap_committed_cents =
          base({PENDING_APPROVAL, ACTIVE})
        + bonus(counts_against_provisional == true AND season_year == CURRENT_SEASON_YEAR
                AND allocation_status IN {SCHEDULED, EARNED})
        + dead_money_cents

      final_cap_committed_cents =
          base({ACTIVE})
        + bonus(bonus_type != SIGNING_PRORATION AND season_year == CURRENT_SEASON_YEAR
                AND allocation_status == EARNED)
        + dead_money_cents

      cap_space_cents = salary_cap_limit_cents - provisional_cap_committed_cents
      # cap_space_cents may go negative; it is reported, not clamped.
    constants:
      DEFAULT_SALARY_CAP_LIMIT_CENTS: 500000000
    precision: "integer cents; no rounding — all inputs are integers"
    variants:
      - name: PROVISIONAL
        when: "any admission test — filing a transaction, submitting a waiver claim, executing a trade, issuing a tender"
        difference: |
          Counts not-yet-approved (PENDING_APPROVAL) contracts and SCHEDULED
          likely-to-be-earned bonuses, and excludes PERFORMANCE_NLTBE entirely.
          This is the number every admission gate compares against
          salary_cap_limit_cents.
      - name: FINAL
        when: "compliance reporting and the season-settlement view returned by GET /teams/{id}/cap-ledger"
        difference: |
          Counts only ACTIVE contracts and only EARNED bonuses, so a NLTBE bonus
          that has been earned raises FINAL while never having touched
          PROVISIONAL, and a PENDING_APPROVAL contract raises PROVISIONAL while
          never touching FINAL. Identical data therefore yields two different
          totals, and approving a pending contract or earning a NLTBE bonus moves
          them by different deltas.
    note: |
      Worked example — ACTIVE contract with current_season_cap_charge_cents
      83333333 carrying a SCHEDULED PERFORMANCE_LTBE of 5000000 and an EARNED
      PERFORMANCE_NLTBE of 7000000, plus a PENDING_APPROVAL contract with
      current_season_cap_charge_cents 40000000, dead_money_cents 0:
        PROVISIONAL = 83333333 + 5000000 + 40000000 = 128333333
        FINAL       = 83333333 + 7000000                = 90333333
        cap_space   = 500000000 - 128333333             = 371666667

  - name: dead_money_on_release
    trigger: "system, when a waiver request clears (Contract -> TERMINATED), when an option decline or lapse terminates a contract, and when a wire is awarded (the releasing club keeps the unamortized signing bonus while the base salary moves to the claiming club)"
    algorithm: threshold
    formula: |
      seasons_elapsed = CURRENT_SEASON_YEAR - start_season_year
      proration_years = min(years, MAX_PRORATION_YEARS)
      unamortized_cents = signing_bonus_cents - annual_proration_cents * seasons_elapsed

      if release_instant < ACCELERATION_CUTOFF:
          # pre-cutoff release: the current season keeps only its own share,
          # every later share is pushed onto next season
          dead_money_current_season_cents = annual_proration_cents
          dead_money_next_season_cents    = unamortized_cents - annual_proration_cents
      else:
          # post-cutoff release: the whole unamortized balance accelerates into
          # the current season
          dead_money_current_season_cents = unamortized_cents
          dead_money_next_season_cents    = 0

      Team.dead_money_cents += dead_money_current_season_cents
      # the contract's base salary leaves the books entirely; only bonus money
      # survives as dead money
    input_set: "the single Contract being terminated; release_instant is the logical clock at termination"
    constants:
      ACCELERATION_CUTOFF: "2026-09-01T00:00:00Z"
      CURRENT_SEASON_YEAR: 2026
      MAX_PRORATION_YEARS: 5
    precision: "integer cents; the two seasons always sum to unamortized_cents"
    note: |
      Worked example — signing_bonus_cents 10000000, years 3, start_season_year
      2026 (annual_proration_cents 3333333, seasons_elapsed 0, unamortized
      10000000):
        released at 2026-08-20T14:00:00Z (pre-cutoff)  -> current 3333333, next 6666667
        released at 2026-09-02T14:00:00Z (post-cutoff) -> current 10000000, next 0
      The comparison is strict `<`: a release exactly at 2026-09-01T00:00:00Z
      accelerates.

  - name: player_service_time
    trigger: "POST /players (from the seeded accrual buckets), and on every designation change, IR closure and trade execution"
    algorithm: aggregation
    formula: |
      elapsed_days(player) = floor((logical clock - designation_effective_at) / 86400 seconds)
      # on any designation change the elapsed days are first added to the bucket
      # of the OUTGOING designation, then designation_effective_at is reset

      pension_credit_days =
          accrued_active_days + accrued_reserve_days + accrued_ir_days

      roster_service_days =
          accrued_active_days + accrued_reserve_days
        + floor(accrued_ir_days * IR_ROSTER_CREDIT_FACTOR)

      service_years = floor(pension_credit_days / SERVICE_DAYS_PER_SEASON)

      contract_rights_class =
          UNRESTRICTED          if service_years >= 4
          ARBITRATION_ELIGIBLE  if service_years == 3
          RESTRICTED            if service_years IN {1, 2}
          NONE                  if service_years == 0

      practice_squad_eligible =
          roster_service_days <= PRACTICE_SQUAD_MAX_SERVICE_DAYS
          AND practice_squad_seasons_used < PRACTICE_SQUAD_MAX_SEASONS
    input_set: "one Player's four accrual buckets; practice-squad days never enter either service total"
    constants:
      SERVICE_DAYS_PER_SEASON: 170
      IR_ROSTER_CREDIT_FACTOR: 0.5
      PRACTICE_SQUAD_MAX_SERVICE_DAYS: 340
      PRACTICE_SQUAD_MAX_SEASONS: 2
    precision: "integer days; floor on both the IR credit and the service-year division"
    variants:
      - name: PENSION_CREDIT
        when: "deciding contract_rights_class, tender eligibility and restricted free agency"
        difference: |
          Injured-reserve days count at full weight and practice-squad days are
          excluded, so a player who spent a season on IR still advances toward
          unrestricted rights.
      - name: ROSTER_SERVICE
        when: "deciding practice_squad_eligible and practice-squad elevation limits"
        difference: |
          Injured-reserve days count at half weight (floored) and practice-squad
          days are excluded, so the same buckets yield a strictly smaller total
          whenever accrued_ir_days > 0 — the two variants disagree
          on identical data.
    note: |
      Worked example — active 500, reserve 100, injured_reserve 80, practice 200:
        pension_credit_days 680, service_years 4, contract_rights_class UNRESTRICTED
        roster_service_days 640 -> practice_squad_eligible false (640 > 340)
      Boundary — injured_reserve 79 instead: pension_credit_days 679,
      service_years 3 (679/170 == 3.99), contract_rights_class
      ARBITRATION_ELIGIBLE; roster_service_days 639.

  - name: qualifying_offer_amount
    trigger: "POST /qualifying-offers"
    algorithm: threshold
    formula: |
      league_min_cents = LEAGUE_MINIMUM_BY_SERVICE_YEAR[min(Player.service_years, 4)]
      floor_cents      = max(prior_base_salary_cents,
                             MIN_TENDER_CENTS[tender_level],
                             league_min_cents)

      # branch selection on offer_type — a different multiplier, not a different
      # parameter of one multiplier
      if offer_type == RESTRICTED_TENDER:
          raw_cents = floor_cents * QO_RAISE_MULTIPLIER
      elif offer_type == ARBITRATION_TENDER:
          raw_cents = floor_cents * ARB_UPLIFT_MULTIPLIER
      elif offer_type == QUALIFYING_OFFER:
          raw_cents = floor_cents

      amount_cents = min(round_half_up(raw_cents), MAX_TENDER_CENTS)
    input_set: "the QualifyingOffer request plus the referenced Player's service_years"
    constants:
      MIN_TENDER_CENTS:
        FIRST_ROUND: 60000000
        SECOND_ROUND: 45000000
        ORIGINAL_ROUND: 30000000
        RIGHT_OF_FIRST_REFUSAL: 25000000
      LEAGUE_MINIMUM_BY_SERVICE_YEAR:
        0: 12000000
        1: 15000000
        2: 18000000
        3: 21000000
        4: 24000000
      QO_RAISE_MULTIPLIER: 1.10
      ARB_UPLIFT_MULTIPLIER: 1.20
      MAX_TENDER_CENTS: 150000000
    precision: "integer cents, round_half_up after the multiplier"
    note: |
      Combinatorial mode (a): branch selection on offer_type.
      Worked examples —
        prior 50000000, FIRST_ROUND, service_years 2, RESTRICTED_TENDER:
          floor = max(50000000, 60000000, 18000000) = 60000000 -> 66000000
        prior 50000000, ORIGINAL_ROUND, service_years 3, ARBITRATION_TENDER:
          floor = max(50000000, 30000000, 21000000) = 50000000 -> 60000000
        prior 50000000, ORIGINAL_ROUND, service_years 3, QUALIFYING_OFFER:
          floor = 50000000 -> 50000000

  - name: waiver_award_cap_resolution
    trigger: "POST /waiver-requests/{id}/process"
    algorithm: waterfall_allocation
    formula: |
      # ordered elimination pipeline, then a single ranking step
      candidates = WaiverClaim WHERE waiver_request_id == W AND status == SUBMITTED

      stage 1 (cap):        drop claims where required_cap_charge_cents > the claiming
                        Team.cap_space_cents READ AT PROCESSING TIME (the live
                        value, not WaiverClaim.cap_space_snapshot_cents, which is
                        retained for audit only)
      stage 2 (posture):    drop claims whose claiming Team.compliance_status
                            IN {NON_COMPLIANT, TRANSACTION_FROZEN} at processing time
      stage 3 (roster):     drop claims whose claiming Team.active_roster_count
                            >= Team.active_roster_limit at processing time
      every dropped claim -> status INVALIDATED (it is never ranked)

      stage 4 (ranking):    survivors sorted ascending by priority_rank_snapshot;
                            ties broken ascending by WaiverClaim.created_at
      winner = first survivor -> status AWARDED; all other survivors -> status LOST

      if survivors is empty:
          WaiverRequest.status = CLEARED  (no award; the player becomes UNROSTERED
          and the releasing club books dead money)
    input_set: "all WaiverClaim rows of one WaiverRequest with status == SUBMITTED; INVALIDATED, AWARDED and LOST rows from an earlier attempt are excluded"
    constants: {}
    precision: "integer cents on the cap comparison; ranks are integers"
    variants:
      - name: cap_first
        when: "always — the pipeline order is fixed"
        difference: |
          Because the cap filter runs before the ranking step, a rank-1 claim that
          fails the cap test is eliminated and a rank-9 claim wins. Applying the
          same three filters AFTER ranking would award the rank-1 claim and then
          reject the whole award, so the order is observable.
    note: |
      Combinatorial mode (c): ordering/priority pipeline — the stages are the same
      predicates a naive implementation would apply, but the sequence decides the
      winner. Selector determinism: candidate filter = the three stages above,
      ranking = priority_rank_snapshot ascending, tie-break = created_at
      ascending, empty-set fallback = WaiverRequest -> CLEARED.

  - name: processing_window_snap
    trigger: "helper — used by waiver_clearance_deadline, transaction_filing_deadline and tender_deadline"
    algorithm: interval_merge
    formula: |
      tod = time-of-day of t in UTC
      if tod < PROCESSING_WINDOW_OPEN_UTC:
          return same calendar date at PROCESSING_WINDOW_OPEN_UTC
      elif tod < PROCESSING_WINDOW_CLOSE_UTC:
          return t unchanged
      else:
          return the NEXT calendar date at PROCESSING_WINDOW_OPEN_UTC
      # The window is half-open [OPEN, CLOSE): a t whose tod is exactly
      # PROCESSING_WINDOW_CLOSE_UTC snaps forward to the next day.
    input_set: "a single instant"
    constants:
      PROCESSING_WINDOW_OPEN_UTC: "13:00:00"
      PROCESSING_WINDOW_CLOSE_UTC: "21:00:00"
    precision: "second resolution; no sub-second component is ever produced"

  - name: transaction_filing_deadline
    trigger: "POST /transactions (sets filing_deadline_at) and POST /transactions/{id}/file (checks it)"
    algorithm: threshold
    formula: |
      raw = Transaction.created_at + FILING_DEADLINE_HOURS hours
      filing_deadline_at = processing_window_snap(raw)
      # POST /transactions/{id}/file is rejected when
      #   logical clock > filing_deadline_at            -> ERR_FILING_DEADLINE_PASSED
      #   or tod(logical clock) NOT IN [13:00:00, 21:00:00) -> ERR_OUTSIDE_PROCESSING_WINDOW
      # The deadline instant itself is still on time (>= is late, > is late — the
      # comparison is strict).
    input_set: "one Transaction"
    constants:
      FILING_DEADLINE_HOURS: 48
    precision: "second resolution"
    note: |
      Worked example — Transaction.created_at 2026-08-10T22:00:00Z:
        raw = 2026-08-12T22:00:00Z (tod 22:00 >= 21:00)
        filing_deadline_at = 2026-08-13T13:00:00Z

  - name: waiver_clearance_deadline
    trigger: "system, when a WaiverRequest is created by an approved RELEASE filing"
    algorithm: threshold
    formula: |
      revocability =
          REVOCABLE   if placed_at < WAIVER_IRREVOCABLE_CUTOFF
          IRREVOCABLE otherwise
      raw = placed_at + WAIVER_CLEARANCE_HOURS[revocability] hours
      clearance_deadline_at = processing_window_snap(raw)
      # POST /waiver-requests/{id}/process is rejected before
      # clearance_deadline_at with ERR_CLEARANCE_NOT_REACHED.
      # POST /waiver-requests/{id}/withdraw is available only while
      # revocability == REVOCABLE and status == PENDING.
    input_set: "one WaiverRequest; placed_at is the logical clock at creation"
    constants:
      WAIVER_CLEARANCE_HOURS:
        REVOCABLE: 24
        IRREVOCABLE: 48
      WAIVER_IRREVOCABLE_CUTOFF: "2026-08-25T16:00:00Z"
    precision: "second resolution"
    note: |
      Worked example — placed_at 2026-08-10T09:00:00Z: REVOCABLE (before the
      cutoff), raw 2026-08-11T09:00:00Z, snapped to 2026-08-11T13:00:00Z.
      A request placed at 2026-08-25T16:00:00Z exactly is IRREVOCABLE, raw
      2026-08-27T16:00:00Z, which is inside the window and stays unsnapped.

  - name: tender_deadline
    trigger: "POST /qualifying-offers"
    algorithm: threshold
    formula: |
      deadline_at = processing_window_snap(issued_at + TENDER_RESPONSE_HOURS hours)
      # POST /qualifying-offers/{id}/respond is rejected once
      # logical clock > deadline_at (ERR_TENDER_DEADLINE_PASSED); the sweep then
      # moves the offer ISSUED -> LAPSED.
    input_set: "one QualifyingOffer"
    constants:
      TENDER_RESPONSE_HOURS: 72
    precision: "second resolution"

  - name: trade_cap_compatibility
    trigger: "POST /trades/{id}/assets (recompute) and POST /trades/{id}/execute (gate)"
    algorithm: aggregation
    formula: |
      incoming(club)  = SUM(TradeAsset.cap_charge_snapshot_cents
                            WHERE status == PROPOSED AND the asset is directed AT club)
      outgoing(club)  = SUM(TradeAsset.cap_charge_snapshot_cents
                            WHERE status == PROPOSED AND the asset is directed AWAY FROM club)

      cap_delta_initiating_cents   = incoming(initiating)   - outgoing(initiating)
      cap_delta_counterparty_cents = incoming(counterparty) - outgoing(counterparty)
      # Because every asset is directed at exactly one club, the two deltas are
      # always exact negations of each other.

      compatible = for BOTH clubs:
          Team.provisional_cap_committed_cents + cap_delta <= Team.salary_cap_limit_cents
      # Violation -> ERR_TRADE_CAP_INCOMPATIBLE, reported for the failing club.
    input_set: "TradeAsset rows of one Trade with status == PROPOSED; RETURNED and TRANSFERRED rows are excluded"
    constants: {}
    precision: "integer cents"
    note: |
      DRAFT_PICK assets contribute 0. CASH_CONSIDERATION contributes
      cash_amount_cents as a charge to the paying club and a credit to the
      receiving club, exactly like a contract.

  - name: medical_review_slot_availability
    trigger: "POST /trades/{id}/accept when conditional_clause_type == PHYSICAL_CONTINGENT"
    algorithm: interval_merge
    formula: |
      occupied(club) = { [Trade.accepted_at, Trade.medical_review_deadline_at]
                         | Trade.status == MEDICAL_REVIEW
                           AND club IN {initiating_team_id, counterparty_team_id} }
      candidate = [logical clock, logical clock + MEDICAL_REVIEW_WINDOW_HOURS hours]

      # CLOSED intervals — touching endpoints DO collide
      overlaps(a, b) = a.start <= b.end AND b.start <= a.end

      available(club) = COUNT(i IN occupied(club) WHERE overlaps(candidate, i))
                        < MAX_CONCURRENT_MEDICAL_REVIEWS
      # Both clubs must be available; otherwise ERR_MEDICAL_REVIEW_SLOT_TAKEN.
    input_set: "Trades with status == MEDICAL_REVIEW touching either club; VOIDED and EXECUTED trades release their slot"
    constants:
      MEDICAL_REVIEW_WINDOW_HOURS: 72
      MAX_CONCURRENT_MEDICAL_REVIEWS: 1
    precision: "second resolution"
    note: |
      The resource is a Team's medical-review capacity and the interval semantics
      are CLOSED, deliberately unlike physical_exam_window_overlap.

  - name: physical_exam_window_overlap
    trigger: "POST /physical-exams"
    algorithm: interval_merge
    formula: |
      occupied(player) = { [PhysicalExam.window_start_at, PhysicalExam.window_end_at)
                           | PhysicalExam.player_id == player
                             AND PhysicalExam.status == SCHEDULED }
      candidate = [body.window_start_at, body.window_end_at)

      # HALF-OPEN intervals — touching endpoints do NOT collide
      overlaps(a, b) = a.start < b.end AND b.start < a.end

      allowed = COUNT(i IN occupied(player) WHERE overlaps(candidate, i))
                < MAX_CONCURRENT_SCHEDULED_EXAMS
      # Violation -> ERR_EXAM_WINDOW_OVERLAP.
    input_set: "PhysicalExam rows of one Player with status == SCHEDULED; PASSED, FAILED and EXPIRED rows free their window"
    constants:
      MAX_CONCURRENT_SCHEDULED_EXAMS: 1
    precision: "second resolution"
    note: |
      The resource is a Player's examination window and the interval semantics are
      HALF-OPEN: a candidate starting exactly at an occupied window's end_at is
      accepted, whereas the same abutment on a medical-review slot is rejected.

  - name: designation_count_recompute
    trigger: "system, after every designation change, approval, trade execution or waiver award"
    algorithm: aggregation
    formula: |
      active_roster_count       = COUNT(Player WHERE current_team_id == T AND roster_designation == ACTIVE)
      reserve_roster_count      = COUNT(Player WHERE current_team_id == T AND roster_designation == RESERVE)
      injured_reserve_count     = COUNT(Player WHERE current_team_id == T AND roster_designation == INJURED_RESERVE)
      practice_squad_count      = COUNT(Player WHERE current_team_id == T AND roster_designation == PRACTICE_SQUAD)
      # WAIVED_PENDING and UNROSTERED players count toward no bucket, so a club
      # whose release has been approved but whose waiver has not yet cleared is
      # below its own active count.
    input_set: "Players whose current_team_id == T; the four counts partition only the four rostered designations"
    constants: {}
    precision: "integer counts"

  - name: team_compliance_evaluation
    trigger: "POST /compliance-checks/run (SWEEP) and inline after every roster-, cap- or designation-mutating write (EVENT)"
    algorithm: constraint_propagation
    formula: |
      violation_codes = ordered list, appended in exactly this order:
        ACTIVE_ROSTER_OVER_LIMIT          if active_roster_count > active_roster_limit
        RESERVE_OVER_LIMIT                if reserve_roster_count > reserve_roster_limit
        IR_OVER_LIMIT                     if injured_reserve_count > injured_reserve_limit
        PRACTICE_SQUAD_OVER_LIMIT         if practice_squad_count > practice_squad_limit
        CAP_OVER_LIMIT                    if provisional_cap_committed_cents > salary_cap_limit_cents
        INELIGIBLE_PRACTICE_SQUAD_PLAYER  if any Player with roster_designation == PRACTICE_SQUAD
                                             has practice_squad_eligible == false
        UNFILED_INJURY_PAPERWORK          if any InjuryDesignation of this team has
                                             status == PENDING_PAPERWORK and
                                             logical clock >= created_at + PAPERWORK_GRACE_HOURS

      result = COMPLIANT if violation_codes is empty
               else GRACE if the posture edge selected in §1.2 targets GRACE
               else NON_COMPLIANT
      resulting_compliance_status = the target of the Team.compliance_status
                                    transition selected in §1.2 for this posture
    input_set: "one Team plus its Players, Contracts, BonusAllocations and open InjuryDesignations"
    constants:
      GRACE_PERIOD_HOURS: 24
      FREEZE_AFTER_CONSECUTIVE_CHECKS: 3
      PAPERWORK_GRACE_HOURS: 24
    precision: "integer comparisons; violation_codes order is fixed so the first code is deterministic"
    variants:
      - name: EVENT
        when: "inline, immediately after a write that changed rosters, cap totals or designations"
        difference: |
          Persists no ComplianceCheck row, never advances
          consecutive_noncompliant_checks past 1, and can only move the posture
          COMPLIANT -> GRACE (arming grace_expires_at) or leave it unchanged. It
          never freezes a club and never lapses tenders, expires IR windows or
          voids medical reviews.
      - name: SWEEP
        when: "POST /compliance-checks/run"
        difference: |
          Persists a ComplianceCheck row, walks the full posture ladder
          (GRACE -> NON_COMPLIANT -> TRANSACTION_FROZEN) using
          consecutive_noncompliant_checks, and additionally performs the five
          clock-driven steps: (1) void DRAFT transactions past filing_deadline_at,
          (2) lapse ISSUED tenders past deadline_at, (3) void MEDICAL_REVIEW
          trades past medical_review_deadline_at, (4) open or expire IR return
          windows, (5) expire PASSED physicals past expires_at. Identical Team
          data therefore yields the same violation_codes but a different
          resulting_compliance_status in the two modes.


  - name: injury_return_window
    trigger: "system, when an IR_PLACEMENT filing is approved (window derivation) and when the designation closes or expires (credit derivation)"
    algorithm: threshold
    formula: |
      minimum_stay_days       = MINIMUM_STAY_DAYS[designation_type]
      return_window_opens_at  = activated_at + minimum_stay_days days
      return_window_closes_at = return_window_opens_at + RETURN_WINDOW_LENGTH_DAYS days
      # The return window is a CLOSED interval: an activation exactly at
      # return_window_opens_at or exactly at return_window_closes_at is on time.
      ir_service_credit_days  = floor((closed_at - activated_at) / 86400 seconds)
      # The same day count feeds Player.accrued_ir_days, which the two
      # player_service_time variants then weight differently.
    input_set: "one InjuryDesignation"
    constants:
      MINIMUM_STAY_DAYS:
        INJURED_RESERVE: 21
        INJURED_RESERVE_RETURN_ELIGIBLE: 14
        NON_ROSTER_INJURY: 28
      RETURN_WINDOW_LENGTH_DAYS: 21
    precision: "whole days on the offsets; second resolution on the stored instants"
    note: |
      Worked example — designation_type INJURED_RESERVE_RETURN_ELIGIBLE activated
      at 2026-08-12T14:00:00Z: opens 2026-08-26T14:00:00Z, closes
      2026-09-16T14:00:00Z.

  - name: physical_validity
    trigger: "POST /physical-exams/{id}/record-result with result == PASSED, and every approval that must cite a physical"
    algorithm: decay_function
    formula: |
      expires_at = performed_at + PHYSICAL_VALIDITY_DAYS days
      citable(exam) = exam.status == PASSED AND exam.expires_at > logical clock
      # Strict `>`: an exam whose expires_at equals the logical clock is no
      # longer citable, and the sweep moves it PASSED -> EXPIRED.
    input_set: "one PhysicalExam"
    constants:
      PHYSICAL_VALIDITY_DAYS: 14
    precision: "whole days on the offset; second resolution on the comparison"
    note: |
      Worked example — performed_at 2026-08-10T14:00:00Z: expires_at
      2026-08-24T14:00:00Z, citable at 2026-08-24T13:59:59Z, not citable at
      2026-08-24T14:00:00Z.

  - name: negotiation_round_budget
    trigger: "POST /trades/{id}/counter and POST /transactions/{id}/revise"
    algorithm: threshold
    formula: |
      rounds_remaining     = MAX_TRADE_ROUNDS - Trade.round_count
      revisions_remaining  = MAX_TRANSACTION_REVISIONS - Transaction.revision_count

      # A counter with rounds_remaining > 0 flips the trade's side
      # (PROPOSED <-> COUNTERED) and spends one round; a counter with
      # rounds_remaining == 0 does not flip — it voids the trade with
      # void_reason ROUND_LIMIT_EXCEEDED.
      # A revise with revisions_remaining > 0 returns the filing to DRAFT and
      # spends one revision; a revise with revisions_remaining == 0 voids it.
    input_set: "one Trade or one Transaction"
    constants:
      MAX_TRADE_ROUNDS: 3
      MAX_TRANSACTION_REVISIONS: 2
    precision: "integer counts"
    note: |
      A trade created at round_count 1 therefore admits exactly two counters
      (round_count 2, then 3) and the third counter voids it. A filing rejected
      three times therefore admits exactly two revisions.
# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated strictly in ascending priority; the FIRST
# violated rule decides the response). Business-rule ordering for this domain:
# safety/medical -> referential -> temporal -> constraint -> fiscal, because a
# league office rejects an unsafe or improperly documented filing before it
# ever looks at deadlines, roster arithmetic or cap arithmetic.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer, PlayerAgent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID is the id of an existing instance of its backing entity (Team for TeamCapAnalyst and TeamMedicalOfficer, Player for PlayerAgent)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles include TeamCapAnalyst, TeamMedicalOfficer or PlayerAgent"

  - priority: 5
    category: auth
    check: "actor scope — the acting club must be the club that owns the resource (Transaction.team_id, WaiverRequest.from_team_id, WaiverClaim.claiming_team_id, Contract.team_id, InjuryDesignation.team_id, PhysicalExam.team_id) or, for trade actions, the club whose turn the §1.2 edge assigns; the acting player must be Contract.player_id or QualifyingOffer.player_id"
    error_id: ERR_ACTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all team-scoped and player-scoped writes"

  - priority: 6
    category: auth
    check: "segregation of duties — the X-User-ID deciding a filing must differ from Transaction.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transactions/{id}/decide"

  - priority: 7
    category: schema
    check: "request body parses; every required field present; enums, integer ranges, datetime formats and non-negative money amounts respected; window_end_at > window_start_at; conditional requirements of the polymorphic asset_kind honoured"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_TEAM_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_BONUS_ALLOCATION_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_WAIVER_REQUEST_NOT_FOUND | ERR_WAIVER_CLAIM_NOT_FOUND | ERR_TRADE_NOT_FOUND | ERR_TENDER_NOT_FOUND | ERR_INJURY_DESIGNATION_NOT_FOUND | ERR_PHYSICAL_EXAM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 9
    category: existence
    check: "every foreign key in the body exists, validated in body declaration order"
    error_id: "same catalog as priority 8"
    http_status: 404
    applies_to: "POST /transactions, POST /waiver-requests, POST /waiver-requests/{id}/claims, POST /trades, POST /trades/{id}/assets, POST /qualifying-offers, POST /injury-designations, POST /physical-exams, POST /compliance-checks/run"

  - priority: 10
    category: state
    check: "expected_team_version equals Team.version"
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412
    applies_to: "POST /transactions, POST /waiver-requests/{id}/claims"

  - priority: 11
    category: state
    check: "expected_trade_version equals Trade.version"
    error_id: ERR_STALE_TRADE_VERSION
    http_status: 412
    applies_to: "POST /trades/{id}/assets, POST /trades/{id}/counter"

  - priority: 12
    category: state
    check: "expected_contract_version equals Contract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /contracts/{id}/option-decision"

  - priority: 13
    category: state
    check: "the target entity is in a state that has an outgoing edge for this trigger in §1.2 (including the parallel dimension the trigger writes). One carve-out: a revise aimed at a VOIDED filing whose revision_count == MAX_TRANSACTION_REVISIONS is NOT reported here — it is deferred to priority 14, which owns the more specific diagnosis"
    error_id: "ERR_INVALID_TRANSACTION_STATE | ERR_INVALID_CONTRACT_STATE | ERR_INVALID_OPTION_STATE | ERR_INVALID_WAIVER_STATE | ERR_INVALID_TRADE_STATE | ERR_INVALID_TENDER_STATE | ERR_INVALID_DESIGNATION_STATE | ERR_INVALID_EXAM_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 14
    category: state
    check: "a revise aimed at a filing already VOIDED by the revision limit (status == VOIDED AND revision_count == MAX_TRANSACTION_REVISIONS) is rejected here — priority 13 deliberately defers this case. A revise on a REJECTED filing below the limit passes; a revise on a REJECTED filing exactly at the limit voids it (§1.2) instead of erroring"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transactions/{id}/revise"

  - priority: 15
    category: business_safety
    check: "the acting or affected club's compliance_status is not NON_COMPLIANT and not TRANSACTION_FROZEN"
    error_id: ERR_TEAM_TRANSACTIONS_FROZEN
    http_status: 409
    applies_to: "POST /transactions, POST /transactions/{id}/file, POST /transactions/{id}/decide, POST /waiver-requests, POST /waiver-requests/{id}/claims, POST /trades, POST /trades/{id}/accept, POST /trades/{id}/execute, POST /qualifying-offers"

  - priority: 16
    category: business_safety
    check: "the subject Player.medical_status is not FAILED_PHYSICAL"
    error_id: ERR_PLAYER_FAILED_PHYSICAL
    http_status: 422
    applies_to: "POST /transactions/{id}/decide with decision == APPROVE, POST /trades/{id}/execute, POST /qualifying-offers"

  - priority: 17
    category: business_safety
    check: "when Transaction.requires_physical is true, a PhysicalExam for this filing's player exists with status == PASSED and expires_at > logical clock"
    error_id: ERR_PHYSICAL_NOT_PASSED
    http_status: 422
    applies_to: "POST /transactions/{id}/decide with decision == APPROVE"

  - priority: 18
    category: business_referential
    check: "an IR_PLACEMENT filing's InjuryDesignation has status == PAPERWORK_FILED (paperwork on file) and an IR_ACTIVATION filing's InjuryDesignation has status == RETURN_WINDOW_OPEN"
    error_id: ERR_INJURY_PAPERWORK_MISSING
    http_status: 422
    applies_to: "POST /transactions/{id}/decide with decision == APPROVE"

  - priority: 19
    category: business_referential
    check: "a filing's injury_designation_id references an InjuryDesignation whose player_id and team_id match the filing"
    error_id: ERR_DESIGNATION_PLAYER_MISMATCH
    http_status: 422
    applies_to: "POST /transactions, POST /transactions/{id}/revise"

  - priority: 20
    category: business_referential
    check: "a waiver placement's transaction_id references an APPROVED RELEASE filing for the same player and the same club"
    error_id: ERR_RELEASE_FILING_MISMATCH
    http_status: 422
    applies_to: "POST /waiver-requests"

  - priority: 21
    category: business_referential
    check: "a CONTRACT trade asset references an ACTIVE Contract whose team_id is the club sending the asset"
    error_id: ERR_ASSET_NOT_OWNED
    http_status: 422
    applies_to: "POST /trades/{id}/assets, POST /trades/{id}/execute"

  - priority: 22
    category: business_temporal
    check: "the logical clock's time of day is inside the half-open processing window [PROCESSING_WINDOW_OPEN_UTC, PROCESSING_WINDOW_CLOSE_UTC)"
    error_id: ERR_OUTSIDE_PROCESSING_WINDOW
    http_status: 422
    applies_to: "POST /transactions/{id}/file, POST /transactions/{id}/decide, POST /waiver-requests/{id}/process, POST /trades/{id}/execute"

  - priority: 23
    category: business_temporal
    check: "logical clock <= Transaction.filing_deadline_at"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /transactions/{id}/file, POST /transactions/{id}/revise"

  - priority: 24
    category: business_temporal
    check: "logical clock >= WaiverRequest.clearance_deadline_at before a wire may be processed"
    error_id: ERR_CLEARANCE_NOT_REACHED
    http_status: 422
    applies_to: "POST /waiver-requests/{id}/process"

  - priority: 25
    category: business_temporal
    check: "logical clock <= QualifyingOffer.deadline_at"
    error_id: ERR_TENDER_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /qualifying-offers/{id}/respond"

  - priority: 26
    category: business_temporal
    check: "logical clock <= Contract.option_deadline_at"
    error_id: ERR_OPTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /contracts/{id}/option-decision"

  - priority: 27
    category: business_temporal
    check: "logical clock is inside the closed interval [return_window_opens_at, return_window_closes_at] of the filing's InjuryDesignation"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /transactions/{id}/decide on IR_ACTIVATION"

  - priority: 28
    category: business_temporal
    check: "logical clock <= Trade.medical_review_deadline_at for a trade in MEDICAL_REVIEW"
    error_id: ERR_MEDICAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /trades/{id}/execute"

  - priority: 29
    category: business_temporal
    check: "performed_at is inside the half-open exam window [window_start_at, window_end_at)"
    error_id: ERR_RESULT_OUTSIDE_EXAM_WINDOW
    http_status: 422
    applies_to: "POST /physical-exams/{id}/record-result"

  - priority: 30
    category: business_constraint
    check: "calculations.physical_exam_window_overlap — the requested half-open window does not collide with another SCHEDULED exam of the same player"
    error_id: ERR_EXAM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /physical-exams"

  - priority: 31
    category: business_constraint
    check: "calculations.medical_review_slot_availability — neither club's closed medical-review interval is already occupied"
    error_id: ERR_MEDICAL_REVIEW_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /trades/{id}/accept"

  - priority: 32
    category: business_constraint
    check: "uniqueness of open records: no PENDING WaiverRequest for the player; no open InjuryDesignation for the player; no ISSUED QualifyingOffer for the (player, team) pair; no SUBMITTED WaiverClaim from the same club on the same wire; Team.market_code and Team.waiver_priority_rank unique"
    error_id: "ERR_WAIVER_ALREADY_PENDING | ERR_INJURY_DESIGNATION_ALREADY_OPEN | ERR_TENDER_ALREADY_ISSUED | ERR_CLAIM_ALREADY_SUBMITTED | ERR_DUPLICATE_MARKET_CODE | ERR_DUPLICATE_WAIVER_PRIORITY"
    http_status: 409
    applies_to: "POST /waiver-requests, POST /injury-designations, POST /qualifying-offers, POST /waiver-requests/{id}/claims, POST /teams"

  - priority: 33
    category: business_constraint
    check: "the two clubs of a trade are distinct"
    error_id: ERR_TRADE_SAME_TEAM
    http_status: 422
    applies_to: "POST /trades"

  - priority: 34
    category: business_constraint
    check: "a player being placed on or elevated from the practice squad has practice_squad_eligible == true"
    error_id: ERR_PRACTICE_SQUAD_INELIGIBLE
    http_status: 422
    applies_to: "POST /transactions/{id}/decide with decision == APPROVE"

  - priority: 35
    category: business_constraint
    check: "a tender may only be issued to a player whose contract_rights_class is RESTRICTED or ARBITRATION_ELIGIBLE, and ARBITRATION_TENDER requires ARBITRATION_ELIGIBLE"
    error_id: ERR_RESTRICTED_RIGHTS_REQUIRED
    http_status: 422
    applies_to: "POST /qualifying-offers"

  - priority: 36
    category: business_constraint
    check: "calculations.designation_count_recompute — the resulting count for the affected designation stays within the club's corresponding limit"
    error_id: ERR_ROSTER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transactions/{id}/decide with decision == APPROVE, POST /trades/{id}/execute, POST /waiver-requests/{id}/process"

  - priority: 37
    category: business_fiscal
    check: "calculations.team_cap_commitment PROVISIONAL variant stays within salary_cap_limit_cents after the write"
    error_id: ERR_CAP_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transactions, POST /transactions/{id}/decide with decision == APPROVE, POST /qualifying-offers"

  - priority: 38
    category: business_fiscal
    check: "calculations.trade_cap_compatibility holds for both clubs"
    error_id: ERR_TRADE_CAP_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /trades/{id}/execute"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints
# api_prefix is "/" so every collection sits at the URL root; this keeps every
# entity's collection segment derivable from its `GET /<segment>/{id}` route.
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving surface (outside the public business API) ---------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, expiry and accrual rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the fixed startup default — and never falls back to real wall-clock time. Note that the default instant is deliberately OUTSIDE the daily processing window [13:00:00Z, 21:00:00Z)."
    roles: [LeagueOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock jumps to current_utc; no entity is mutated and no sweep is performed"

  # --- Team ----------------------------------------------------------------
  - method: POST
    path: "/teams"
    description: "Register a club with its roster limits, salary cap and waiver priority rank."
    roles: [LeagueOfficer]
    code: 201
    input: [name, market_code, salary_cap_limit_cents, waiver_priority_rank, "active_roster_limit?", "reserve_roster_limit?", "injured_reserve_limit?", "practice_squad_limit?"]
    output: Team
    side_effects:
      - "all counts and cap totals initialise to 0; cap_space_cents = salary_cap_limit_cents; compliance_status = COMPLIANT"

  - method: GET
    path: "/teams/{id}"
    description: "Read one club."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer, PlayerAgent]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/teams"
    description: "List clubs."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer, PlayerAgent]
    code: 200
    input: ["compliance_status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: PATCH
    path: "/teams/{id}/limits"
    description: "League office adjusts a club's roster limits, salary cap or waiver priority rank. Adjustments apply immediately and can therefore leave an already-populated club outside its new limits — the club is not rejected here; the next compliance evaluation reports the violation."
    roles: [LeagueOfficer]
    code: 200
    input: ["active_roster_limit?", "reserve_roster_limit?", "injured_reserve_limit?", "practice_squad_limit?", "salary_cap_limit_cents?", "waiver_priority_rank?"]
    output: Team
    side_effects:
      - "cap_space_cents recomputed from the new limit"
      - "calculations.team_compliance_evaluation runs in EVENT mode"
      - "increments Team.version by 1"

  - method: GET
    path: "/teams/{id}/cap-ledger"
    description: "Computed read: recomputes and returns the club with both cap variants side by side (provisional_cap_committed_cents from calculations.team_cap_commitment PROVISIONAL, final_cap_committed_cents from the FINAL variant) plus dead_money_cents and cap_space_cents."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: []
    output: Team
    side_effects:
      - "read-only: both variants are recomputed from current Contract and BonusAllocation rows; Team.version is NOT incremented"

  - method: GET
    path: "/teams/{id}/compliance-checks"
    description: "Sweep history for one club, newest first by checked_at."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceCheck[]
    side_effects: []

  # --- Player --------------------------------------------------------------
  - method: POST
    path: "/players"
    description: "Register a player with the prior-service day buckets the league already has on file. Service totals, service_years, contract_rights_class, practice_squad_eligible and waiver_revocability_class are all derived here and never accepted as input."
    roles: [LeagueOfficer]
    code: 201
    input: [full_name, position, "accrued_active_days?", "accrued_reserve_days?", "accrued_ir_days?", "accrued_practice_days?", "practice_squad_seasons_used?"]
    output: Player
    side_effects:
      - "calculations.player_service_time runs in both variants; designation_effective_at = logical clock; roster_designation = UNROSTERED; medical_status = CLEARED"

  - method: GET
    path: "/players/{id}"
    description: "Read one player, including both service-time variants and both state dimensions."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer, PlayerAgent]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "List players; filter by owning club, designation or medical status. Filtering by current_team_id is the club's roster view."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer, PlayerAgent]
    code: 200
    input: ["current_team_id?", "roster_designation?", "medical_status?", "contract_rights_class?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  # --- Contract ------------------------------------------------------------
  - method: GET
    path: "/contracts/{id}"
    description: "Read one contract, including proration, current-season cap charge, option dimension and dead-money split."
    roles: [LeagueOfficer, TeamCapAnalyst, PlayerAgent]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts; filter by club, player, originating filing or status."
    roles: [LeagueOfficer, TeamCapAnalyst, PlayerAgent]
    code: 200
    input: ["team_id?", "player_id?", "signed_via_transaction_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/option-decision"
    description: "Exercise or decline a contract option. TEAM_OPTION decisions belong to the club, PLAYER_OPTION decisions to the player; this writes the Contract.option_status dimension, which is independent of Contract.status."
    roles: [TeamCapAnalyst, PlayerAgent]
    code: 200
    input: [decision, expected_contract_version]
    output: Contract
    side_effects:
      - "EXERCISE: option_status = EXERCISED; base_salary_cents = option_salary_cents; calculations.contract_current_season_cap_charge and calculations.team_cap_commitment rerun"
      - "DECLINE: option_status = DECLINED; Contract.status ACTIVE -> TERMINATED with termination_reason OPTION_DECLINED; calculations.dead_money_on_release runs; the player's designation clears"
      - "increments Contract.version by 1"

  - method: GET
    path: "/contracts/{id}/bonus-allocations"
    description: "Every cap allocation row generated for this contract, in creation order: the SIGNING_PRORATION rows in ascending season_year first, then the PERFORMANCE_LTBE row, then the PERFORMANCE_NLTBE row."
    roles: [LeagueOfficer, TeamCapAnalyst, PlayerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: BonusAllocation[]
    side_effects: []

  - method: GET
    path: "/contracts/{id}/trade-assets"
    description: "Every trade asset that has referenced this contract, across all trades."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: TradeAsset[]
    side_effects: []

  - method: POST
    path: "/bonus-allocations/{id}/earn"
    description: "Mark a scheduled bonus allocation as earned. A PERFORMANCE_NLTBE row enters the FINAL cap variant only at this moment and never touches the PROVISIONAL variant; a PERFORMANCE_LTBE row already counted PROVISIONAL and now also counts FINAL."
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: BonusAllocation
    side_effects:
      - "allocation_status SCHEDULED -> EARNED; earned_at = logical clock"
      - "owning Team's provisional_cap_committed_cents, final_cap_committed_cents and cap_space_cents recomputed via calculations.team_cap_commitment"
      - "calculations.team_compliance_evaluation runs in EVENT mode"

  # --- Transaction ---------------------------------------------------------
  - method: POST
    path: "/transactions"
    description: "Open a DRAFT filing. A SIGNING filing carries the contract terms and creates the PENDING_APPROVAL Contract; an IR_PLACEMENT or IR_ACTIVATION filing must cite an InjuryDesignation; a DESIGNATION_CHANGE or PRACTICE_SQUAD_ELEVATION filing must carry target_designation."
    roles: [TeamCapAnalyst]
    code: 201
    input: [team_id, player_id, transaction_type, expected_team_version, "target_designation?", "injury_designation_id?", "years?", "base_salary_cents?", "base_guaranteed?", "signing_bonus_cents?", "start_season_year?", "is_practice_squad_contract?", "option_type?", "option_deadline_at?", "option_salary_cents?", "performance_ltbe_cents?", "performance_nltbe_cents?"]
    output: Transaction
    side_effects:
      - "status = DRAFT; filing_deadline_at from calculations.transaction_filing_deadline; requires_physical derived from transaction_type"
      - "SIGNING: creates the PENDING_APPROVAL Contract with calculations.signing_bonus_proration and calculations.contract_current_season_cap_charge applied, and sets contract_id"
      - "owning Team's provisional_cap_committed_cents and cap_space_cents recomputed via calculations.team_cap_commitment"
      - "increments Team.version by 1"

  - method: GET
    path: "/transactions/{id}"
    description: "Read one filing."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List filings; filter by club, player, created contract, cited injury designation, type or status."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: ["team_id?", "player_id?", "contract_id?", "injury_designation_id?", "transaction_type?", "status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: POST
    path: "/transactions/{id}/file"
    description: "Submit a DRAFT filing to the league office. Only accepted inside the daily processing window and on or before filing_deadline_at."
    roles: [TeamCapAnalyst]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "status DRAFT -> FILED; filed_at = logical clock; filed_by_user_id = X-User-ID"

  - method: POST
    path: "/transactions/{id}/decide"
    description: "League office approves or rejects a FILED filing. Approval applies every roster, contract, bonus, cap and compliance side effect of the §1.2 Transaction machine."
    roles: [LeagueOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Transaction
    side_effects:
      - "APPROVE: status -> APPROVED; prior_designation snapshotted; the type-specific designation, contract, BonusAllocation and InjuryDesignation cascades of §1.2 run; Team counts and both cap variants recomputed; calculations.team_compliance_evaluation runs in EVENT mode"
      - "REJECT: status -> REJECTED; a SIGNING filing's PENDING_APPROVAL Contract -> VOIDED and the club's provisional cap total is released"
      - "increments Team.version by 1"

  - method: POST
    path: "/transactions/{id}/revise"
    description: "Resubmit a REJECTED filing as a DRAFT with amended terms, or void it once the revision limit is reached. Revising a SIGNING filing revives its VOIDED contract as PENDING_APPROVAL with the new terms."
    roles: [TeamCapAnalyst]
    code: 200
    input: ["target_designation?", "injury_designation_id?", "years?", "base_salary_cents?", "base_guaranteed?", "signing_bonus_cents?", "option_type?", "option_deadline_at?", "option_salary_cents?"]
    output: Transaction
    side_effects:
      - "below the revision limit: status REJECTED -> DRAFT; revision_count += 1; decided_at, decided_by_user_id, filed_at, filed_by_user_id and rejection_reason cleared; the contract is revived and re-prorated; the club's provisional cap total rises again"
      - "at the revision limit: status REJECTED -> VOIDED and the contract stays VOIDED"
      - "increments Team.version by 1"

  # --- WaiverRequest / WaiverClaim -----------------------------------------
  - method: POST
    path: "/waiver-requests"
    description: "Place a released player on the waiver wire, citing the APPROVED RELEASE filing that authorises it. Revocability and the clearance deadline are frozen at placement."
    roles: [TeamCapAnalyst]
    code: 201
    input: [player_id, from_team_id, transaction_id]
    output: WaiverRequest
    side_effects:
      - "status = PENDING; placed_at = logical clock; origin_designation copied from Transaction.prior_designation; contract_id set to the player's ACTIVE contract"
      - "revocability and clearance_deadline_at from calculations.waiver_clearance_deadline"

  - method: GET
    path: "/waiver-requests/{id}"
    description: "Read one waiver wire, including claim count and award."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: []
    output: WaiverRequest
    side_effects: []

  - method: GET
    path: "/waiver-requests"
    description: "List waiver wires; filter by player, releasing club, awarded club, authorising filing, contract or status."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: ["player_id?", "from_team_id?", "awarded_to_team_id?", "transaction_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: WaiverRequest[]
    side_effects: []

  - method: POST
    path: "/waiver-requests/{id}/withdraw"
    description: "Pull a player back off the wire. Available only while the placement is REVOCABLE and PENDING; the player's pre-release designation is restored and the authorising RELEASE filing is voided."
    roles: [TeamCapAnalyst]
    code: 200
    input: []
    output: WaiverRequest
    side_effects:
      - "status PENDING -> WITHDRAWN; every SUBMITTED claim -> INVALIDATED"
      - "Player.roster_designation restored to origin_designation and current_team_id restored to from_team_id; the club's designation counts recomputed"
      - "the authorising Transaction APPROVED -> VOIDED"
      - "calculations.team_compliance_evaluation runs in EVENT mode"

  - method: POST
    path: "/waiver-requests/{id}/claims"
    description: "Claim a player off the wire. The claiming club's waiver priority rank and cap space are snapshotted here and are what the award pipeline ranks and tests, not the values at processing time."
    roles: [TeamCapAnalyst]
    code: 201
    input: [claiming_team_id, expected_team_version]
    output: WaiverClaim
    side_effects:
      - "status = SUBMITTED; priority_rank_snapshot = Team.waiver_priority_rank; cap_space_snapshot_cents = Team.cap_space_cents; required_cap_charge_cents = the wired Contract.current_season_cap_charge_cents; submitted_at = logical clock"
      - "WaiverRequest.claim_count += 1"
      - "increments Team.version by 1"

  - method: GET
    path: "/waiver-claims/{id}"
    description: "Read one claim, including the snapshots the award pipeline used."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: []
    output: WaiverClaim
    side_effects: []

  - method: GET
    path: "/waiver-claims"
    description: "List claims; filter by wire, claiming club or status."
    roles: [LeagueOfficer, TeamCapAnalyst]
    code: 200
    input: ["waiver_request_id?", "claiming_team_id?", "status?", "limit?", "offset?"]
    output: WaiverClaim[]
    side_effects: []

  - method: POST
    path: "/waiver-requests/{id}/process"
    description: "Run the award pipeline on a wire whose clearance deadline has been reached. Applies calculations.waiver_award_cap_resolution: the cap, posture and roster filters eliminate claims before ranking, then the surviving claim with the lowest priority_rank_snapshot wins; an empty survivor set clears the player."
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: WaiverRequest
    side_effects:
      - "CLAIMED: status -> CLAIMED; awarded_to_team_id set; winning claim -> AWARDED; other survivors -> LOST; eliminated claims -> INVALIDATED; Contract.team_id and Player.current_team_id move to the winner; Player.roster_designation WAIVED_PENDING -> ACTIVE; both clubs' counts and cap variants recomputed"
      - "CLEARED: status -> CLEARED; Contract ACTIVE -> TERMINATED with termination_reason RELEASE_CLEARED; calculations.dead_money_on_release charges the releasing club; unamortized SIGNING_PRORATION rows -> ACCELERATED; Player.roster_designation -> UNROSTERED and current_team_id -> null"
      - "processed_at = logical clock; calculations.team_compliance_evaluation runs in EVENT mode for every club touched"

  # --- Trade ---------------------------------------------------------------
  - method: POST
    path: "/trades"
    description: "Open a trade between two clubs. A PHYSICAL_CONTINGENT clause routes acceptance through a medical review window instead of straight to execution."
    roles: [TeamCapAnalyst]
    code: 201
    input: [initiating_team_id, counterparty_team_id, "conditional_clause_type?", "condition_note?"]
    output: Trade
    side_effects:
      - "status = PROPOSED; round_count = 1"

  - method: GET
    path: "/trades/{id}"
    description: "Read one trade, including both clubs' cap deltas and the medical-review deadline."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: []
    output: Trade
    side_effects: []

  - method: GET
    path: "/trades"
    description: "List trades; filter by either club or status."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: ["initiating_team_id?", "counterparty_team_id?", "status?", "limit?", "offset?"]
    output: Trade[]
    side_effects: []

  - method: POST
    path: "/trades/{id}/assets"
    description: "Add a contract, draft pick or cash consideration to a trade. Only the club that currently owes a response may add, and each addition re-derives both clubs' cap deltas."
    roles: [TeamCapAnalyst]
    code: 201
    input: [asset_kind, direction, expected_trade_version, "contract_id?", "draft_pick_year?", "draft_pick_round?", "cash_amount_cents?"]
    output: TradeAsset
    side_effects:
      - "status = PROPOSED; cap_charge_snapshot_cents derived from asset_kind"
      - "Trade.cap_delta_initiating_cents and cap_delta_counterparty_cents recomputed via calculations.trade_cap_compatibility"
      - "increments Trade.version by 1"

  - method: GET
    path: "/trades/{id}/assets"
    description: "Every asset attached to a trade, in creation order."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TradeAsset[]
    side_effects: []

  - method: POST
    path: "/trades/{id}/counter"
    description: "Send the trade back to the other club. The actor alternates: from PROPOSED only the counterparty may counter, from COUNTERED only the initiator. Countering at the round limit voids the trade instead."
    roles: [TeamCapAnalyst]
    code: 200
    input: [expected_trade_version]
    output: Trade
    side_effects:
      - "below the round limit: status flips PROPOSED <-> COUNTERED and round_count += 1"
      - "at the round limit: status -> VOIDED with void_reason ROUND_LIMIT_EXCEEDED and every PROPOSED asset -> RETURNED"
      - "increments Trade.version by 1"

  - method: POST
    path: "/trades/{id}/accept"
    description: "Accept the trade as it currently stands. Without a physical contingency the trade becomes ACCEPTED and awaits league execution; with one it enters MEDICAL_REVIEW and occupies a medical-review slot on both clubs."
    roles: [TeamCapAnalyst]
    code: 200
    input: []
    output: Trade
    side_effects:
      - "accepted_at = logical clock"
      - "PHYSICAL_CONTINGENT: status -> MEDICAL_REVIEW; medical_review_deadline_at set; both clubs' open_medical_review_count += 1"
      - "otherwise: status -> ACCEPTED"
      - "increments Trade.version by 1"

  - method: POST
    path: "/trades/{id}/execute"
    description: "League office executes an ACCEPTED trade, or a MEDICAL_REVIEW trade whose physicals have all passed inside the window. Only inside the daily processing window."
    roles: [LeagueOfficer]
    code: 200
    input: []
    output: Trade
    side_effects:
      - "status -> EXECUTED; executed_at = logical clock; every PROPOSED asset -> TRANSFERRED"
      - "each CONTRACT asset moves Contract.team_id and Player.current_team_id to the receiving club and sets Player.roster_designation = ACTIVE, accruing the outgoing designation's elapsed days first"
      - "both clubs' designation counts and both cap variants recomputed; calculations.team_compliance_evaluation runs in EVENT mode for both"
      - "from MEDICAL_REVIEW: both clubs' open_medical_review_count -= 1"

  # --- QualifyingOffer -----------------------------------------------------
  - method: POST
    path: "/qualifying-offers"
    description: "Tender a restricted free agent. The amount is derived from calculations.qualifying_offer_amount — the offer_type selects the multiplier, the tender_level and the player's service years set the floor."
    roles: [TeamCapAnalyst]
    code: 201
    input: [player_id, team_id, offer_type, tender_level, prior_base_salary_cents]
    output: QualifyingOffer
    side_effects:
      - "status = ISSUED; issued_at = logical clock; amount_cents and deadline_at derived"

  - method: GET
    path: "/qualifying-offers/{id}"
    description: "Read one tender."
    roles: [LeagueOfficer, TeamCapAnalyst, PlayerAgent]
    code: 200
    input: []
    output: QualifyingOffer
    side_effects: []

  - method: GET
    path: "/qualifying-offers"
    description: "List tenders; filter by player, club, resulting filing or status."
    roles: [LeagueOfficer, TeamCapAnalyst, PlayerAgent]
    code: 200
    input: ["player_id?", "team_id?", "resulting_transaction_id?", "status?", "limit?", "offset?"]
    output: QualifyingOffer[]
    side_effects: []

  - method: POST
    path: "/qualifying-offers/{id}/respond"
    description: "Player accepts or declines the tender. Accepting cascades into a DRAFT SIGNING filing, a PENDING_APPROVAL contract at the tender amount and a provisional cap recompute for the tendering club."
    roles: [PlayerAgent]
    code: 200
    input: [response]
    output: QualifyingOffer
    side_effects:
      - "ACCEPT: status -> ACCEPTED; a DRAFT SIGNING Transaction is created and resulting_transaction_id set; a 1-year PENDING_APPROVAL Contract at amount_cents is created; the club's provisional cap total and cap_space_cents are recomputed; increments Team.version by 1"
      - "DECLINE: status -> DECLINED and nothing else changes"
      - "responded_at = logical clock"

  # --- InjuryDesignation ---------------------------------------------------
  - method: POST
    path: "/injury-designations"
    description: "Open an injury designation for a rostered player. The minimum stay is fixed from designation_type here; the return window is only computed when the IR_PLACEMENT filing is approved."
    roles: [TeamMedicalOfficer]
    code: 201
    input: [player_id, team_id, designation_type]
    output: InjuryDesignation
    side_effects:
      - "status = PENDING_PAPERWORK; placed_at = logical clock; minimum_stay_days fixed from designation_type"

  - method: GET
    path: "/injury-designations/{id}"
    description: "Read one injury designation, including the return window and IR service credit."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: []
    output: InjuryDesignation
    side_effects: []

  - method: GET
    path: "/injury-designations"
    description: "List injury designations; filter by player, club, type or status."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: ["player_id?", "team_id?", "designation_type?", "status?", "limit?", "offset?"]
    output: InjuryDesignation[]
    side_effects: []

  - method: POST
    path: "/injury-designations/{id}/file-paperwork"
    description: "File the league paperwork for an injury designation. Until this succeeds the IR_PLACEMENT filing cannot be approved, and an unfiled designation older than the paperwork grace period is itself a compliance violation."
    roles: [TeamMedicalOfficer]
    code: 200
    input: [paperwork_reference]
    output: InjuryDesignation
    side_effects:
      - "status PENDING_PAPERWORK -> PAPERWORK_FILED; paperwork_filed_at = logical clock; Player.medical_status -> REHAB"

  # --- PhysicalExam --------------------------------------------------------
  - method: POST
    path: "/physical-exams"
    description: "Schedule a physical inside a half-open examination window. A player may hold only one SCHEDULED window at a time; abutting windows are allowed because the interval is half-open."
    roles: [TeamMedicalOfficer]
    code: 201
    input: [player_id, team_id, exam_type, window_start_at, window_end_at, "transaction_id?", "trade_id?"]
    output: PhysicalExam
    side_effects:
      - "status = SCHEDULED; Player.medical_status -> PHYSICAL_PENDING"

  - method: GET
    path: "/physical-exams/{id}"
    description: "Read one physical, including its validity expiry."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: []
    output: PhysicalExam
    side_effects: []

  - method: GET
    path: "/physical-exams"
    description: "List physicals; filter by player, club, filing, trade, type or status."
    roles: [LeagueOfficer, TeamCapAnalyst, TeamMedicalOfficer]
    code: 200
    input: ["player_id?", "team_id?", "transaction_id?", "trade_id?", "exam_type?", "status?", "limit?", "offset?"]
    output: PhysicalExam[]
    side_effects: []

  - method: POST
    path: "/physical-exams/{id}/record-result"
    description: "Record a physical's outcome. performed_at must fall inside the half-open window. A failed TRADE_PHYSICAL voids its trade, returns the assets and releases both clubs' medical-review slots."
    roles: [TeamMedicalOfficer]
    code: 200
    input: [result, performed_at]
    output: PhysicalExam
    side_effects:
      - "PASSED: status -> PASSED; expires_at = performed_at + PHYSICAL_VALIDITY_DAYS; Player.last_physical_passed_at set; Player.medical_status -> CLEARED"
      - "FAILED: status -> FAILED; Player.medical_status -> FAILED_PHYSICAL; a TRADE_PHYSICAL additionally voids the linked Trade, returns its assets and decrements both clubs' open_medical_review_count"

  # --- ComplianceCheck -----------------------------------------------------
  - method: POST
    path: "/compliance-checks/run"
    description: "Run the daily compliance sweep for one club. Evaluates calculations.team_compliance_evaluation in SWEEP mode, walks the posture ladder, and performs the five clock-driven steps: void expired DRAFT filings, lapse expired tenders and options, void expired medical reviews, open or expire IR return windows, expire stale physicals."
    roles: [LeagueOfficer]
    code: 201
    input: [team_id]
    output: ComplianceCheck
    side_effects:
      - "a ComplianceCheck row is written with the club's counts, FINAL cap total, cap space and ordered violation_codes"
      - "Team.compliance_status, grace_expires_at and consecutive_noncompliant_checks advance per the §1.2 Team posture machine"
      - "the five clock-driven steps run, each cascading into its own entity's §1.2 machine"
      - "increments Team.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, blank, or X-User-Role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the role is not listed in the endpoint's roles, or an entity_backed role's X-User-ID is not the id of an existing instance of its backing entity"
  - id: ERR_ACTOR_SCOPE_VIOLATION
    http: 403
    condition: "the acting club or player is not the one the resource belongs to, or it is not this club's turn to act on the trade"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID deciding a filing equals Transaction.filed_by_user_id"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative money amount, malformed datetime, window_end_at <= window_start_at, or a polymorphic asset_kind missing its required companion field"

  # --- existence ------------------------------------------------------------
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "no Team with the given id"
  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "no Player with the given id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no Contract with the given id"
  - id: ERR_BONUS_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no BonusAllocation with the given id"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "no Transaction with the given id"
  - id: ERR_WAIVER_REQUEST_NOT_FOUND
    http: 404
    condition: "no WaiverRequest with the given id"
  - id: ERR_WAIVER_CLAIM_NOT_FOUND
    http: 404
    condition: "no WaiverClaim with the given id"
  - id: ERR_TRADE_NOT_FOUND
    http: 404
    condition: "no Trade with the given id"
  - id: ERR_TENDER_NOT_FOUND
    http: 404
    condition: "no QualifyingOffer with the given id"
  - id: ERR_INJURY_DESIGNATION_NOT_FOUND
    http: 404
    condition: "no InjuryDesignation with the given id"
  - id: ERR_PHYSICAL_EXAM_NOT_FOUND
    http: 404
    condition: "no PhysicalExam with the given id"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_TEAM_VERSION
    http: 412
    condition: "expected_team_version does not equal the club's current version (concurrency_rules transaction-create-stale-team, waiver-claim-create-stale-team)"
  - id: ERR_STALE_TRADE_VERSION
    http: 412
    condition: "expected_trade_version does not equal the trade's current version (concurrency_rules trade-asset-add-stale-trade)"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the contract's current version"

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_TRANSACTION_STATE
    http: 409
    condition: "the filing's status has no outgoing edge for this trigger — e.g. filing a FILED transaction, deciding a DRAFT one, revising an APPROVED one"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the contract is not ACTIVE where the operation requires it (option decision, trade asset, waiver processing)"
  - id: ERR_INVALID_OPTION_STATE
    http: 409
    condition: "option_status is not PENDING — the option is NOT_APPLICABLE, already EXERCISED, DECLINED or LAPSED"
  - id: ERR_INVALID_WAIVER_STATE
    http: 409
    condition: "the wire is not PENDING, or a withdraw is attempted on an IRREVOCABLE placement"
  - id: ERR_INVALID_TRADE_STATE
    http: 409
    condition: "the trade's status has no outgoing edge for this trigger — e.g. countering an ACCEPTED trade, executing a PROPOSED one, adding an asset to an EXECUTED one"
  - id: ERR_INVALID_TENDER_STATE
    http: 409
    condition: "the tender is not ISSUED"
  - id: ERR_INVALID_DESIGNATION_STATE
    http: 409
    condition: "the injury designation is not in the state the operation requires — filing paperwork twice, or activating from ACTIVE instead of RETURN_WINDOW_OPEN"
  - id: ERR_INVALID_EXAM_STATE
    http: 409
    condition: "the physical is not SCHEDULED, so no result can be recorded"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a revise is attempted on a filing whose revision_count has already reached MAX_TRANSACTION_REVISIONS and which has therefore been voided"

  # --- business: safety / medical ------------------------------------------
  - id: ERR_TEAM_TRANSACTIONS_FROZEN
    http: 409
    condition: "the acting or affected club's compliance_status is NON_COMPLIANT or TRANSACTION_FROZEN"
  - id: ERR_PLAYER_FAILED_PHYSICAL
    http: 422
    condition: "the subject player's medical_status is FAILED_PHYSICAL"
  - id: ERR_PHYSICAL_NOT_PASSED
    http: 422
    condition: "a filing that requires a physical has no PASSED, unexpired PhysicalExam for its player"

  # --- business: referential -----------------------------------------------
  - id: ERR_INJURY_PAPERWORK_MISSING
    http: 422
    condition: "an IR_PLACEMENT filing cites a designation still in PENDING_PAPERWORK, or an IR_ACTIVATION filing cites one that is not RETURN_WINDOW_OPEN"
  - id: ERR_DESIGNATION_PLAYER_MISMATCH
    http: 422
    condition: "the cited InjuryDesignation belongs to a different player or a different club than the filing"
  - id: ERR_RELEASE_FILING_MISMATCH
    http: 422
    condition: "the cited transaction is not an APPROVED RELEASE for the same player and releasing club"
  - id: ERR_ASSET_NOT_OWNED
    http: 422
    condition: "a CONTRACT trade asset references a contract that is not ACTIVE or not owned by the club sending it"

  # --- business: temporal ---------------------------------------------------
  - id: ERR_OUTSIDE_PROCESSING_WINDOW
    http: 422
    condition: "the logical clock's time of day is outside the half-open daily processing window [13:00:00Z, 21:00:00Z)"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is later than Transaction.filing_deadline_at"
  - id: ERR_CLEARANCE_NOT_REACHED
    http: 422
    condition: "a wire is processed before its clearance_deadline_at"
  - id: ERR_TENDER_DEADLINE_PASSED
    http: 422
    condition: "a tender response arrives after QualifyingOffer.deadline_at"
  - id: ERR_OPTION_DEADLINE_PASSED
    http: 422
    condition: "an option decision arrives after Contract.option_deadline_at"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 422
    condition: "an IR_ACTIVATION approval falls outside the closed interval [return_window_opens_at, return_window_closes_at]"
  - id: ERR_MEDICAL_WINDOW_EXPIRED
    http: 422
    condition: "a MEDICAL_REVIEW trade is executed after Trade.medical_review_deadline_at"
  - id: ERR_RESULT_OUTSIDE_EXAM_WINDOW
    http: 422
    condition: "performed_at falls outside the half-open exam window [window_start_at, window_end_at)"

  # --- business: constraint -------------------------------------------------
  - id: ERR_EXAM_WINDOW_OVERLAP
    http: 409
    condition: "the requested exam window overlaps another SCHEDULED window for the same player under half-open semantics"
  - id: ERR_MEDICAL_REVIEW_SLOT_TAKEN
    http: 409
    condition: "one of the two clubs already occupies its medical-review capacity for an interval that touches or overlaps the new one under closed semantics"
  - id: ERR_WAIVER_ALREADY_PENDING
    http: 409
    condition: "the player already has a PENDING WaiverRequest"
  - id: ERR_INJURY_DESIGNATION_ALREADY_OPEN
    http: 409
    condition: "the player already has an InjuryDesignation in PENDING_PAPERWORK, PAPERWORK_FILED, ACTIVE or RETURN_WINDOW_OPEN"
  - id: ERR_TENDER_ALREADY_ISSUED
    http: 409
    condition: "the (player, club) pair already has an ISSUED QualifyingOffer"
  - id: ERR_CLAIM_ALREADY_SUBMITTED
    http: 409
    condition: "the claiming club already has a SUBMITTED claim on this wire"
  - id: ERR_DUPLICATE_MARKET_CODE
    http: 409
    condition: "another Team already uses this market_code"
  - id: ERR_DUPLICATE_WAIVER_PRIORITY
    http: 409
    condition: "another Team already holds this waiver_priority_rank"
  - id: ERR_TRADE_SAME_TEAM
    http: 422
    condition: "initiating_team_id equals counterparty_team_id"
  - id: ERR_PRACTICE_SQUAD_INELIGIBLE
    http: 422
    condition: "a practice-squad placement or elevation targets a player whose practice_squad_eligible is false"
  - id: ERR_RESTRICTED_RIGHTS_REQUIRED
    http: 422
    condition: "a tender targets a player whose contract_rights_class is NONE or UNRESTRICTED, or an ARBITRATION_TENDER targets a player who is not ARBITRATION_ELIGIBLE"
  - id: ERR_ROSTER_LIMIT_EXCEEDED
    http: 409
    condition: "the write would push the affected designation's count above the club's limit for that designation"

  # --- business: fiscal -----------------------------------------------------
  - id: ERR_CAP_LIMIT_EXCEEDED
    http: 409
    condition: "the write would push provisional_cap_committed_cents above salary_cap_limit_cents"
  - id: ERR_TRADE_CAP_INCOMPATIBLE
    http: 409
    condition: "after applying the trade's cap delta, at least one club's provisional commitment would exceed its salary cap limit"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# role_model: segregation_of_duties — a club prepares and files its own
# paperwork but never decides it, and the medical dimension is owned by a
# different club officer than the cap dimension.
# ---------------------------------------------------------------------------
roles:
  - name: LeagueOfficer
    description: "League transactions office. Registers clubs and players, decides filings, processes waiver wires, executes trades, marks bonuses earned, adjusts club limits and runs the compliance sweep. Never prepares a club's paperwork."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /teams"
      - "POST /players"
      - "PATCH /teams/{id}/limits"
      - "POST /transactions/{id}/decide"
      - "POST /waiver-requests/{id}/process"
      - "POST /trades/{id}/execute"
      - "POST /bonus-allocations/{id}/earn"
      - "POST /compliance-checks/run"
    shared_operations:
      - "GET /teams/{id}"
      - "GET /teams"
      - "GET /teams/{id}/cap-ledger"
      - "GET /teams/{id}/compliance-checks"
      - "GET /players/{id}"
      - "GET /players"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /contracts/{id}/bonus-allocations"
      - "GET /contracts/{id}/trade-assets"
      - "GET /transactions/{id}"
      - "GET /transactions"
      - "GET /waiver-requests/{id}"
      - "GET /waiver-requests"
      - "GET /waiver-claims/{id}"
      - "GET /waiver-claims"
      - "GET /trades/{id}"
      - "GET /trades"
      - "GET /trades/{id}/assets"
      - "GET /qualifying-offers/{id}"
      - "GET /qualifying-offers"
      - "GET /injury-designations/{id}"
      - "GET /injury-designations"
      - "GET /physical-exams/{id}"
      - "GET /physical-exams"

  - name: TeamCapAnalyst
    description: "Club front-office cap and transactions analyst. X-User-ID is the club's id. Prepares, files and revises the club's own filings, places and withdraws waivers, claims players, constructs trades, decides team options and issues tenders — but never approves anything and never touches the medical dimension."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /transactions"
      - "POST /transactions/{id}/file"
      - "POST /transactions/{id}/revise"
      - "POST /waiver-requests"
      - "POST /waiver-requests/{id}/withdraw"
      - "POST /waiver-requests/{id}/claims"
      - "POST /trades"
      - "POST /trades/{id}/assets"
      - "POST /trades/{id}/counter"
      - "POST /trades/{id}/accept"
      - "POST /qualifying-offers"
    shared_operations:
      - "POST /contracts/{id}/option-decision"
      - "GET /teams/{id}"
      - "GET /teams"
      - "GET /teams/{id}/cap-ledger"
      - "GET /teams/{id}/compliance-checks"
      - "GET /players/{id}"
      - "GET /players"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /contracts/{id}/bonus-allocations"
      - "GET /contracts/{id}/trade-assets"
      - "GET /transactions/{id}"
      - "GET /transactions"
      - "GET /waiver-requests/{id}"
      - "GET /waiver-requests"
      - "GET /waiver-claims/{id}"
      - "GET /waiver-claims"
      - "GET /trades/{id}"
      - "GET /trades"
      - "GET /trades/{id}/assets"
      - "GET /qualifying-offers/{id}"
      - "GET /qualifying-offers"
      - "GET /injury-designations/{id}"
      - "GET /injury-designations"
      - "GET /physical-exams/{id}"
      - "GET /physical-exams"

  - name: TeamMedicalOfficer
    description: "Club medical officer. X-User-ID is the club's id, but the role is confined to the medical dimension: injury designations, league paperwork and physicals. Cannot file, claim, trade or tender."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /injury-designations"
      - "POST /injury-designations/{id}/file-paperwork"
      - "POST /physical-exams"
      - "POST /physical-exams/{id}/record-result"
    shared_operations:
      - "GET /teams/{id}"
      - "GET /teams"
      - "GET /players/{id}"
      - "GET /players"
      - "GET /transactions/{id}"
      - "GET /transactions"
      - "GET /trades/{id}"
      - "GET /trades"
      - "GET /trades/{id}/assets"
      - "GET /injury-designations/{id}"
      - "GET /injury-designations"
      - "GET /physical-exams/{id}"
      - "GET /physical-exams"

  - name: PlayerAgent
    description: "Certified agent acting for one player. X-User-ID is the player's id. Responds to tenders and decides player options; reads the club and contract records that concern the player."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /qualifying-offers/{id}/respond"
    shared_operations:
      - "POST /contracts/{id}/option-decision"
      - "GET /teams/{id}"
      - "GET /teams"
      - "GET /players/{id}"
      - "GET /players"
      - "GET /contracts/{id}"
      - "GET /contracts"
      - "GET /contracts/{id}/bonus-allocations"
      - "GET /qualifying-offers/{id}"
