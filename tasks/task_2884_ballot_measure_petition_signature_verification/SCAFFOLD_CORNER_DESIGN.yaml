          signatures, opening a round, voiding the round that produced the certification,
          opening a cure period and re-issuing the determination - and all five must return
          the single ERR_INVALID_PETITION_STATE. The void probe is the sharp one: the round
          itself is CLOSED and voidable in isolation, so an implementation that guards void
