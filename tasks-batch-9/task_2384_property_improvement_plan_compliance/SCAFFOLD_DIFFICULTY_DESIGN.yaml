        grounds:
          - validations[priority=34]
          - validations[priority=90]
          - errors[ERR_BUDGET_NOT_LOCKABLE]
          - errors[ERR_BUDGET_UNDERFUNDED]
          - state_machines.CapitalBudget.APPROVED_to_LOCKED
