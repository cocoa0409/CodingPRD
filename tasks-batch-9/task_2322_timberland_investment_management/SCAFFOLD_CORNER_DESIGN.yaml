      - name: two_writers_reserving_the_same_stand_lose_one_block_to_the_version_guard
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[harvest-block-create-stale-stand]"
          - "errors[ERR_STALE_STAND_VERSION]"
          - "entities.Stand.fields.available_tons"
          - "endpoints[POST /timberland/harvest-blocks]"
        distinguishing_aspect: |
          Two schedulers read the stand at version 2 and both reserve legitimately sized blocks. The
          loser must be told 412 ERR_STALE_STAND_VERSION rather than silently over-allocating: 1000.00
          + 800.00 would still fit, so nothing but the version guard can distinguish a lost update from
          a valid second reservation. After re-reading version 3 the same request succeeds and the
          version advances monotonically 2 -> 3 -> 4.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund and Piney Creek Tract."
            - "Stand PC-01 INVENTORIED at 4647.12 tons; both writers hold the version 2 captured at cruise close."
            - "The second window is 2032-06-01..2032-09-30, clear of the 24-month re-entry buffer behind the first block."
