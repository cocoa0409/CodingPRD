  # -------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: change_order_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-stale-build]", "validations[priority=62]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one change order advances HabitatBuild.version, a second change order still carrying the pre-first expected_habitat_build_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["HabitatBuild IN_PROGRESS; client captured version v_start; one change order already filed (version advanced)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Al Vero", email: "al@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /habitat-builds"
              payload: { customer_id: "${cust_id}", spec_summary: "occ build", quote_cents: 80000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { hb_id: $.data.id }
            - call: "POST /habitat-builds/${hb_id}/pay-deposit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /habitat-builds/${hb_id}/start"
              payload: {}
              as: SalesAssociate
              captures: { v_start: $.data.version }
            - call: "POST /habitat-builds/${hb_id}/change-orders"
              payload: { delta_cents: 3000, expected_habitat_build_version: "${v_start}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /habitat-builds/${hb_id}/change-orders"
              payload: { delta_cents: 4000, expected_habitat_build_version: "${v_start}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: error_animal_not_available_on_confirm
        claim_type: violation_to_error
        grounds: ["errors[ERR_ANIMAL_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: confirm_state_beats_permit_referential
          rationale: "The state-precedence §1.8 instance already triggers ERR_ANIMAL_NOT_AVAILABLE on confirm of a non-AVAILABLE animal."

      - name: error_feeder_recalled_on_shipment
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEEDER_RECALLED]"]
        excluded_because:
          difficulty_instance: shipment_safety_beats_fiscal
          rationale: "The safety-over-fiscal §1.8 instance already triggers ERR_FEEDER_RECALLED when the only matching batch is recalled."
