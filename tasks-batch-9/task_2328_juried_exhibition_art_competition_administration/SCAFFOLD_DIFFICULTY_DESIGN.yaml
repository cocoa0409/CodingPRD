            - { call: "GET /jury-rounds/${r1_id}", payload: {}, as: JuryChair, captures: { r1_v2: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${jb_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v2}" }, as: JuryChair }
