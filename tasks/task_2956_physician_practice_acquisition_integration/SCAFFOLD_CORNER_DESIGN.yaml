      - name: empty_migration_batch_cannot_be_extracted
        claim_type: Violation → Error
        grounds:
          - errors[ERR_EMPTY_MIGRATION_BATCH]
          - validations[priority=27]
          - state_machines.EhrMigrationBatch.status.STAGED_to_EXTRACTED
        distinguishing_aspect: |
          An empty batch is storable as a placeholder but has no defined match rate, so
          the EXTRACT action is refused with ERR_EMPTY_MIGRATION_BATCH and the row stays
          STAGED for ever — the check lives on the transition, not on creation.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with one EhrMigrationBatch whose record_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
