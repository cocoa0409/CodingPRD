            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_quartz}", quantity: 1 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_q: $.data.id } }
            - { call: "POST /homebuilder/option-selections", payload: { agreement_id: "${agr_id}", option_item_id: "${op_ev}", quantity: 2 }, as: Buyer, as_user_id: "${b_id}", captures: { sel_e: $.data.id, ev_line: $.data.line_total_cents } }
          trigger:
            - { call: "POST /homebuilder/option-selections/${sel_e}/cancel", payload: {}, as: Buyer, as_user_id: "${b_id}" }
          assert:
            - "EV line_total_cents == 300000 (unit 150000 x quantity 2, snapshot pricing)"
            - "Before cancel: PurchaseAgreement.${agr_id}.options_total_cents == 1100000 (SELECTED selections count)"
            - "After cancel: options_total_cents == 800000; OptionSelection.${sel_e}.status == CANCELLED with cancel_reason == BUYER_REQUEST and change_fee_cents == 0 (SELECTED cancel is always free)"
            - "PurchaseAgreement.${agr_id}.change_fees_total_cents == 0 throughout"

      - name: slippage_flag_strict_greater_than_outside_date
        claim_type: precision
        grounds: ["calculations.slippage_flag"]
        distinguishing_aspect: "Slippage uses a strict > comparison: outside_close_date exactly equal to the padded estimate 2027-01-06T00:00:00Z yields slippage_flag == false; one second earlier yields true."
        test_recipe:
          setup: ["Two signed agreements on two lots, identical except outside_close_date: A exactly 2027-01-06T00:00:00Z, B 2027-01-05T23:59:59Z"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_a: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-102", base_price_cents: 5000000, lot_type: "STANDARD", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_b: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_a}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/lots/${lot_b}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_a}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_a_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_a}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-01-06T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_a_v}" }, as: SalesAgent, captures: { agr_a: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_b}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_b_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_b}", plan_id: "${pl_id}", elevation_name: "A", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-01-05T23:59:59Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_b_v}" }, as: SalesAgent, captures: { agr_b: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_a}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { slip_a: $.data.slippage_flag, pad_a: $.data.estimated_close_padded } }
            - { call: "POST /homebuilder/agreements/${agr_b}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { slip_b: $.data.slippage_flag } }
          assert:
            - "Agreement A: estimated_close_padded == 2027-01-06T00:00:00Z == outside_close_date -> slippage_flag == false (strict >)"
            - "Agreement B: same padded estimate 2027-01-06T00:00:00Z > outside 2027-01-05T23:59:59Z -> slippage_flag == true"

      - name: confirmed_cancel_past_cutoff_accrues_change_fee
        claim_type: correct_result
        grounds: ["calculations.option_change_fee", "state_machines.OptionSelection.CONFIRMED_to_CANCELLED"]
        distinguishing_aspect: "Cancelling a CONFIRMED selection after its cutoff stage has passed accrues round_half_up(line_total * 0.10): 30000 on a 300000 line, booked to both the selection and the agreement's change_fees_total_cents."
        test_recipe:
          setup: ["Signed agreement; EV Outlet qty 2 (line 300000, cutoff DRYWALL, install FINAL_WALKTHROUGH) CONFIRMED at PRE_CONSTRUCTION; milestones 1..4 completed -> current_stage FINAL_WALKTHROUGH (past cutoff ordinal 4, not yet installed: 5 > 5 false)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
