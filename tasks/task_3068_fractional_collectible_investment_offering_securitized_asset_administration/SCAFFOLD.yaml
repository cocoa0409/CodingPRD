# =============================================================================
# PRD Benchmark Seed Tables — task_3068
# Fractional Collectible Investment Offering & Securitized Asset Administration
# =============================================================================

scenario: |
  Fractional Collectible Investment Offering & Securitized Asset Administration (Masterworks): artwork acquisition with authentication, provenance research and condition reporting, securities offering qualification with circular filing, subscription limits and investor suitability screening, share allocation across an offering with waitlist and per-investor caps, custody, storage, insurance and conservation of the underlying asset with cost pass-through, secondary transfer marketplace with limited liquidity and price discovery mechanics, holding-period decisions and sale approval with distribution waterfall to holders, ongoing investor reporting and appraisal cadence, fee structure of management and profit participation

domain_name: fractional-collectible-securitization
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Artist or creator legal name" }
      - { name: attribution_status, type: enum, source: input, description: "CONFIRMED | DISPUTED | UNKNOWN" }
      - { name: nationality_country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: birth_year, type: integer, source: input, description: "Year of birth; may be null" }
      - { name: death_year, type: integer, source: input, description: "Year of death; null for living artists" }
      - { name: catalogue_raisonne_published, type: boolean, source: input, default: false, description: "Whether a catalogue raisonne exists for this artist" }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; the account is identified by this field" }
      - { name: legal_name, type: string, source: input, description: "Full legal name used for tax reporting" }
      - { name: password, type: string, source: input, description: "Login password" }
      - { name: citizenship_country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 citizenship country" }
      - { name: residency_country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 residency country" }
      - { name: residency_state_code, type: string, source: input, description: "Two-letter US state code; null for non-US residents" }
      - { name: birth_date, type: string, source: input, description: "ISO 8601 date; the age-18 screen compares it against current_utc" }
      - { name: suitability_status, type: enum, source: system, description: "PENDING | APPROVED | EXPIRED | REVOKED" }
      - { name: suitability_verified_at, type: datetime, source: system, description: "Timestamp stamped when suitability_status became APPROVED" }
      - { name: suitability_expires_at, type: datetime, source: system, description: "suitability_verified_at + 365 days; null while PENDING" }
      - { name: is_accredited, type: boolean, source: system, default: false, description: "Accredited-investor flag; only written by a VERIFIED screening in an EXEMPT_REG_D offering" }
      - { name: annual_income_cents, type: integer, source: input, description: "Declared annual gross income in cents" }
      - { name: net_worth_cents, type: integer, source: input, description: "Declared net worth in cents" }
      - { name: affiliated_with_issuer, type: boolean, source: input, default: false, description: "Whether the investor is an affiliate of the issuer under Rule 144" }
      - { name: restriction_until, type: datetime, source: system, description: "Per-investor transfer restriction end in UTC; initialised to created_at on registration" }
      - { name: lifetime_invested_cents, type: integer, source: computed, default: 0, description: "Monotone running total of accepted subscription amounts net of ACCEPTED_MODIFICATION decreases" }

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Artwork title" }
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; owning artist" }
      - { name: creation_year, type: integer, source: input, description: "Year the work was created" }
      - { name: medium, type: enum, source: input, description: "PAINTING | SCULPTURE | WORK_ON_PAPER | PHOTOGRAPH | MIXED_MEDIA" }
      - { name: condition_grade, type: enum, source: system, description: "PENDING | EXCELLENT | GOOD | FAIR | POOR; null-equivalent PENDING until a CONDITION_SURVEY asset report is filed" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Purchase price tendered for the object" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Minimum gross proceeds the Offering Board will accept at a sale event" }
      - { name: status, type: enum, source: system, description: "APPRAISED | AUTHENTICATED | OFFERING_PENDING | UNDER_OFFERING | HELD | SALE_PENDING | SOLD" }
      - { name: last_appraised_value_cents, type: integer, source: computed, description: "Value from the most recent SELECTED appraisal; 0 until the first appraisal is SELECTED" }
      - { name: last_appraisal_at, type: datetime, source: computed, description: "filed_at of the most recent SELECTED appraisal; null before the first SELECTED appraisal" }
      - { name: next_appraisal_due_at, type: datetime, source: computed, description: "Advance Appraisal Queue selection date: the earliest a new appraisal may be started given the selection rule" }
      - { name: artifacts_overview, type: object, source: computed, description: "{ is_authenticated, has_good_provenance, latest_appraisal_value_cents, latest_appraisal_filed_at, custody_started_at, holding_period_elapsed_days, appraisal_due } — aggregate projection refreshed on every mutation of an ArtworkAssetReport, CustodyRecord, Appraisal, Offering, or Lot child" }

  - name: ArtworkAssetReport
    parent: Artwork
    common_fields: false
    fields:
      - { name: artwork_id, type: string, source: system, description: "FK -> Artwork.id; owning artwork" }
      - { name: report_type, type: enum, source: input, description: "AUTHENTICATION | PROVENANCE | CONDITION_SURVEY" }
      - { name: outcome, type: enum, source: input, description: "VERIFIED | DISPUTED | REJECTED" }
      - { name: firm_name, type: string, source: input, description: "Expertising firm or conservator legal name" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR; required when report_type == CONDITION_SURVEY, null otherwise" }
      - { name: filed_at, type: datetime, source: system, description: "Immutable filing timestamp stamped at creation" }

  - name: Offering
    parent: Artwork
    common_fields: true
    fields:
      - { name: artwork_id, type: string, source: input, description: "FK -> Artwork.id; securitised artwork" }
      - { name: total_shares, type: integer, source: input, description: "Total shares into which the artwork is fractionalised; >= 1" }
      - { name: price_per_share_cents, type: integer, source: input, description: "Subscription price of one share; >= 1" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "= total_shares * price_per_share_cents" }
      - { name: exemption_type, type: enum, source: input, description: "REG_D_506C | REG_A_TIER2 | EXEMPT_REG_D" }
      - { name: registration_cap_pct, type: integer, source: input, description: "Per-investor registration cap in basis points of total_shares, e.g. 2000 = 20.00%; the cap bounds the holding, it does not reserve shares" }
      - { name: liquidity_ratio_bps, type: integer, source: input, description: "Minimum secondary order size in basis points of total_shares, e.g. 1000 = 10.00% of the issue" }
      - { name: hold_period_days, type: integer, source: input, description: "Days from holding_clock_started_at before holding_period_end_at" }
      - { name: holding_clock_started_at, type: datetime, source: system, description: "Custody start stamped when CustodyRecord reaches IN_CUSTODY" }
      - { name: holding_period_end_at, type: datetime, source: computed, description: "holding_clock_started_at + hold_period_days days; null while holding_clock_started_at is null" }
      - { name: management_fee_bps, type: integer, source: input, description: "Annual management fee in basis points of last_appraised_value_cents" }
      - { name: profit_participation_bps, type: integer, source: input, description: "Issuer profit participation in basis points of distributable_proceeds_cents" }
      - { name: cost_pass_through_bps, type: integer, source: input, description: "Share of eligible custody/storage/insurance/conservation cost charged to investors, in basis points" }
      - { name: preferred_return_bps, type: integer, source: input, description: "Annual preferred-return hurdle in basis points applied to holding_period_days" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUALIFICATION_FILED | ALLOCATED | HELD | SALE_PENDING | CLOSED | WITHDRAWN | OFFERING_ABANDONED" }
      - { name: circular_filed_at, type: datetime, source: system, description: "Timestamp the securities circular was filed" }
      - { name: qualification_deadline_at, type: datetime, source: computed, description: "circular_filed_at + 30 days" }
      - { name: accepted_shares, type: integer, source: computed, default: 0, description: "Sum of accepted_shares over SUBSCRIBED and REALLOCATED subscriptions" }
      - { name: unsubscribed_shares, type: integer, source: computed, description: "total_shares - accepted_shares - reserved_shares" }
      - { name: reserved_shares, type: integer, source: computed, default: 0, description: "Sum of requested_shares over WAITLISTED subscriptions" }
      - { name: cash_ledger_cents, type: integer, source: computed, default: 0, description: "Investor funds held for this offering: sum of collected_subscription_cents minus sum of refunded_cents" }
      - { name: custody_cost_ledger_cents, type: integer, source: computed, default: 0, description: "Cumulative eligible asset operating cost accrued for this offering" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Subscription
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering subscribed to" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id; subscribing investor" }
      - { name: requested_shares, type: integer, source: input, description: "Shares requested at submission" }
      - { name: accepted_shares, type: integer, source: computed, default: 0, description: "Shares actually allotted; 0 until allocation" }
      - { name: amount_due_cents, type: integer, source: computed, default: 0, description: "accepted_shares * offering.price_per_share_cents" }
      - { name: collected_subscription_cents, type: integer, source: computed, default: 0, description: "Funds collected against this subscription" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Funds returned to the investor" }
      - { name: waitlist_rank, type: integer, source: computed, description: "1-based rank among WAITLISTED subscriptions of the same offering, ordered by created_at ASC then id ASC; null otherwise" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SUITABILITY_SCREENED | SUBSCRIBED | WAITLISTED | REALLOCATED | REJECTED | EXPIRED | WITHDRAWN" }
      - { name: created_at_seq, type: integer, source: system, description: "Monotone creation sequence stamped by the server at insert; the deterministic tie-break for same-timestamp waitlist ordering" }

  - name: CustodyRecord
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose artwork is custodied" }
      - { name: custodian_name, type: string, source: input, description: "Freeport or museum vault operator legal name" }
      - { name: facility_code, type: string, source: input, description: "Vault facility identifier" }
      - { name: is_freeport, type: boolean, source: input, description: "Whether the facility is a designated freeport (deferred duty/tax regime)" }
      - { name: custodian_dea_registered, type: boolean, source: input, default: false, description: "Whether the custodian is registered under the Bank Secrecy Act / AML program" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_CUSTODY | RELEASED" }
      - { name: custody_started_at, type: datetime, source: system, description: "Timestamp the record reached IN_CUSTODY" }
      - { name: custody_ended_at, type: datetime, source: system, description: "Timestamp the record reached RELEASED; null while held" }

  - name: Appraisal
    parent: Artwork
    common_fields: false
    fields:
      - { name: artwork_id, type: string, source: system, description: "FK -> Artwork.id; appraised artwork" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraised fair value of the whole artwork" }
      - { name: appraiser_firm, type: string, source: input, description: "Independent appraisal firm legal name" }
      - { name: appraisal_method, type: enum, source: input, description: "AUCTION_COMPARABLE | MARKET_INDEX | PRIVATE_SALE" }
      - { name: filed_at, type: datetime, source: system, description: "Immutable filing timestamp stamped at creation" }
      - { name: is_selected, type: boolean, source: computed, default: false, description: "Whether this appraisal is the SELECTED one feeding Artwork.last_appraised_value_cents" }

  - name: HoldingDecision
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering the decision belongs to" }
      - { name: decision_type, type: enum, source: input, description: "HOLD | SELL" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | EXECUTED | FAILED; created_by_user_id records the X-User-ID of the officer who raised it and approved_by_user_id the officer who approved it, which are the segregation-of-duties references for approve and reject" }
      - { name: proposed_gross_cents, type: integer, source: input, description: "Proposed gross sale proceeds; required when decision_type == SELL, null otherwise" }
      - { name: executed_gross_cents, type: integer, source: computed, description: "Actual gross proceeds recorded at execution; null until EXECUTED" }

  - name: TransferOrder
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose shares move" }
      - { name: seller_id, type: string, source: input, description: "FK -> Investor.id; investor parting with shares" }
      - { name: shares, type: integer, source: input, description: "Number of shares offered on the secondary market" }
      - { name: limit_price_cents, type: integer, source: input, description: "Lowest acceptable price per share" }
      - { name: bid_price_cents, type: integer, source: input, description: "Price per share the counterparty is willing to pay; required on accept and must be >= limit_price_cents" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Investor.id; investor taking the other side; required on accept" }
      - { name: execution_price_cents, type: integer, source: computed, description: "Price per share the order executed at" }
      - { name: status, type: enum, source: system, description: "OPEN | MATCHED | EXECUTED | LAPSED | CANCELLED; created_by_user_id records the X-User-ID of the officer who posted it, which is the segregation-of-duties reference for approve-transfer" }

  - name: Lot
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose cost is journaled" }
      - { name: lot_type, type: enum, source: input, description: "STORAGE | INSURANCE | CONSERVATION" }
      - { name: cost_amount_cents, type: integer, source: input, description: "Cost incurred for this lot" }
      - { name: incurred_on, type: datetime, source: input, description: "Date the cost was incurred" }
      - { name: pass_through_allowed, type: boolean, source: computed, description: "true when every hard gate passes: lot_type in {STORAGE, INSURANCE, CONSERVATION} AND offering.status in {ALLOCATED, HELD} AND an InsurancePolicy of the offering is in FORCE AND no TransferOrder of the offering is in status OPEN AND offering.holding_clock_started_at is not null AND incurred_on >= offering.holding_clock_started_at" }
      - { name: pass_through_amount_cents, type: integer, source: computed, description: "floor(cost_amount_cents * offering.cost_pass_through_bps / 10000) when pass_through_allowed, else 0" }

  - name: InsurancePolicy
    parent: Offering
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: input, description: "FK -> Offering.id; offering whose artwork is insured" }
      - { name: carrier_name, type: string, source: input, description: "Insurer legal name" }
      - { name: coverage_cents, type: integer, source: input, description: "Sum insured; must be >= artwork.last_appraised_value_cents at binding" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annual premium charged by the carrier" }
      - { name: status, type: enum, source: system, description: "PENDING | FORCE | LAPSED" }

  - name: OfferingReport
    parent: Offering
    common_fields: false
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; reported offering" }
      - { name: report_kind, type: enum, source: input, description: "QUARTERLY | APPRAISAL | SALE" }
      - { name: as_of_date, type: datetime, source: input, description: "Valuation date the report speaks to" }
      - { name: filed_at, type: datetime, source: system, description: "Immutable filing timestamp stamped at creation" }
      - { name: shareholder_count, type: integer, source: computed, description: "Distinct investors holding >= 1 accepted share as of as_of_date" }
      - { name: value_per_share_cents, type: integer, source: input, description: "Reported value per share; null when report_kind != QUARTERLY" }
      - { name: is_quarter_marker, type: boolean, source: computed, default: false, description: "true when filed_at is in a tax year whose quarter-end falls outside the SELECTED appraisals' filed_at window; drives the appraisal cadence gate" }

  - name: FeeAccrual
    parent: Offering
    common_fields: false
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; offering the accrual belongs to" }
      - { name: accrual_type, type: enum, source: input, description: "MANAGEMENT | PROFIT_PARTICIPATION" }
      - { name: basis_value_cents, type: integer, source: computed, description: "For MANAGEMENT: last_appraised_value_cents at accrual; for PROFIT_PARTICIPATION: distributable_proceeds_cents" }
      - { name: amount_cents, type: integer, source: computed, description: "Accrued fee amount; presentation rounding is round_half_up to the cent, settlement rounding is floor to the cent" }
      - { name: accrued_at, type: datetime, source: system, description: "Timestamp stamped at accrual" }

  - name: Distribution
    parent: Offering
    common_fields: false
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> Offering.id; offering distributing proceeds" }
      - { name: sale_gross_cents, type: integer, source: computed, description: "Gross proceeds of the sale event being distributed" }
      - { name: distributable_cents, type: computed, description: "Waterfall step 1 output; the realised gain pool split across holders" }
      - { name: distributed_cost_cents, type: integer, source: computed, description: "Waterfall step 0 output; investor-borne pass-through cost deducted first" }
      - { name: management_fee_cents, type: integer, source: computed, description: "Waterfall step 2 output; the issuer's management-fee claim" }
      - { name: profit_participation_cents, type: integer, source: computed, description: "Waterfall step 3 output; the issuer's carried interest claim" }
      - { name: investor_residual_cents, type: computed, description: "Waterfall step 4 output; the remainder distributed pro rata to holders" }
      - { name: per_share_cents, type: integer, source: computed, description: "investor_residual_cents // total_shares with a final-share remainder rule" }
      - { name: status, type: enum, source: system, description: "CALCULATED | PAID" }

  - name: PlatformAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Operator-facing ledger account name" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Conserved platform cash balance; every debit has a matching credit" }
      - { name: investor_funds_held_cents, type: integer, source: computed, default: 0, description: "Subset of balance_cents representing investor money segregated under Rule 15c2-4" }
      - { name: total_paid_out_cents, type: integer, source: computed, default: 0, description: "Monotone running total of all funds disbursed from this account" }
# =============================================================================
# §1.2 State Machine Table
#
# Shape summary (all seven machines are non-linear except Investor, which is
# kept as the reference linear control):
#   Artwork          — branching fork-join (AUTHENTICATED forks to
#                      OFFERING_PENDING or HELD; HELD joins back to
#                      OFFERING_PENDING, so both branches rejoin)
#   Offering         — cyclic (ALLOCATED -> HELD -> SALE_PENDING -> ALLOCATED)
#   Subscription     — cyclic (WAITLISTED -> REALLOCATED -> WAITLISTED)
#   CustodyRecord    — cyclic (RELEASED -> IN_CUSTODY revision loop)
#   HoldingDecision  — cyclic (APPROVED -> REJECTED -> PENDING revision rounds)
#   TransferOrder    — cyclic (LAPSED -> OPEN repost loop)
#   Appraisal        — parallel dimensions (is_selected recomputed on every
#                      sibling filing while filed_at advances monotonically)
# =============================================================================
state_machines:

  - entity: Artwork
    initial_state: APPRAISED
    terminal_states: [SOLD]
    transitions:

      - from: APPRAISED
        to: AUTHENTICATED
        trigger: "POST /artworks/{artworkId}/asset-reports (second component satisfied) or system re-evaluation after an AUTHENTICATION report is filed with outcome VERIFIED"
        actor: IssuerOps
        preconditions:
          - "The artwork has at least one ArtworkAssetReport with report_type == AUTHENTICATION and outcome == VERIFIED"
          - "The artwork has at least one ArtworkAssetReport with report_type == PROVENANCE and outcome == VERIFIED"
        side_effects:
          - "Artwork.condition_grade is set from the most recent CONDITION_SURVEY report's condition_grade; remains PENDING when no CONDITION_SURVEY report exists"
          - "Artwork.artifacts_overview.is_authenticated becomes true"
        note: "Human-readable alias: AUTHENTICATED. The machine's enum member is the adjective AUTHENTICATED and the trust-chain gate requires the two VERIFIED report types together."

      - from: AUTHENTICATED
        to: OFFERING_PENDING
        trigger: "POST /artworks/{artworkId}/offerings"
        actor: IssuerOps
        preconditions:
          - "artifacts_overview.is_authenticated == true"
          - "artworks_overview.appraisal_due == false"
          - "The unreleased artwork's most recent SELECTED appraisal, when one exists, is not older than APPRAISAL_STALE_DAYS"
        side_effects:
          - "A new Offering is created in DRAFT bound to this artwork"
          - "Artwork.status becomes OFFERING_PENDING"
        note: "Fork branch 1."

      - from: AUTHENTICATED
        to: HELD
        trigger: "POST /artworks/{artworkId}/custody-records followed by POST /custody-records/{custodyRecordId}/receive, with no Offering ever created for the artwork"
        actor: IssuerOps
        preconditions:
          - "artifacts_overview.is_authenticated == true"
          - "The artwork has no Offering in any status other than WITHDRAWN"
        side_effects:
          - "CustodyRecord reaches IN_CUSTODY"
          - "Artwork.status becomes HELD"
        note: "Fork branch 2 — an authenticated work can be warehoused without ever being fractionalised."

      - from: HELD
        to: OFFERING_PENDING
        trigger: "NOT a declared transition"
        actor: IssuerOps
        preconditions: []
        side_effects: []
        note: "Deliberately absent: HELD is the join node of the fork, not a springboard back to OFFERING_PENDING. An offering that is abandoned returns the artwork to AUTHENTICATED, so the only way back into OFFERING_PENDING is through the AUTHENTICATED branch point."

      - from: OFFERING_PENDING
        to: AUTHENTICATED
        trigger: "POST /offerings/{offeringId}/abandon"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == QUALIFICATION_FILED"
          - "The artwork has no other Offering in status QUALIFICATION_FILED"
        side_effects:
          - "Offering.status becomes OFFERING_ABANDONED"
          - "Artwork.status becomes AUTHENTICATED, returning the work to the fork point"
        note: "Branch 1's bounce leg. Because HELD has no edge back to OFFERING_PENDING, every node whose history touches branch 1 is permanently distinguishable in Artwork.status from a node whose history touched only branch 2."

      - from: OFFERING_PENDING
        to: UNDER_OFFERING
        trigger: "POST /offerings/{offeringId}/qualification-filing"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == DRAFT"
          - "Offering.circular_filed_at is null"
        side_effects:
          - "Offering.status becomes QUALIFICATION_FILED"
          - "Offering.circular_filed_at is stamped with the logical clock"
          - "Offering.qualification_deadline_at = circular_filed_at + 30 days"
        note: "The artwork keeps status OFFERING_PENDING while the offering is DRAFT; it flips to UNDER_OFFERING in the same request because the circular is now on file."

      - from: UNDER_OFFERING
        to: HELD
        trigger: "POST /offerings/{offeringId}/allocate"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.accepted_shares >= 1"
        side_effects:
          - "Offering.status becomes ALLOCATED"
          - "Artwork.status becomes HELD"
          - "Subscription.accepted_shares stamped on SUBSCRIBED and WAITLISTED subscriptions"
          - "Offering.cash_ledger_cents recomputed from collected_subscription_cents minus refunded_cents"
          - "Investor.lifetime_invested_cents increased by each subscription's amount_due_cents"
        note: "Artwork joins back to HELD, which is also fork branch 2's landing state."

      - from: HELD
        to: SALE_PENDING
        trigger: "POST /offerings/{offeringId}/holding-decisions with decision_type == SELL, then PATCH /holding-decisions/{holdingDecisionId}/approve"
        actor: IssuerOps
        preconditions:
          - "Offering.status == ALLOCATED"
          - "The HoldingDecision moves PENDING -> APPROVED"
        side_effects:
          - "Artwork.status becomes SALE_PENDING"
          - "Offering.status becomes SALE_PENDING"
        note: "Only reachable once holding_period_end_at has passed; the PATCH refuses before then."

      - from: SALE_PENDING
        to: HELD
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents < artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "HoldingDecision.status == APPROVED"
        side_effects:
          - "HoldingDecision.status becomes FAILED"
          - "Offering.status reverts to ALLOCATED"
          - "Artwork.status reverts to HELD"
          - "No Distribution is created"
        note: "Proceeds below reserve are declined; the pair of entities rolls back together."

      - from: SALE_PENDING
        to: SOLD
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents >= artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "HoldingDecision.status == APPROVED"
        side_effects:
          - "HoldingDecision.status becomes EXECUTED"
          - "A Distribution is created against the offering in status CALCULATED"
          - "Offering.status becomes CLOSED"
          - "Artwork.status becomes SOLD"
        note: "Cascade root A — three hops: Artwork -> Offering -> Distribution -> PlatformAccount."

  - entity: Offering
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN, OFFERING_ABANDONED]
    transitions:

      - from: DRAFT
        to: QUALIFICATION_FILED
        trigger: "POST /offerings/{offeringId}/qualification-filing"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.expected_offering_version matches the stored version (OCC)"
          - "Offering.circular_filed_at is null"
          - "Offering.total_shares >= 1 and Offering.price_per_share_cents >= 1"
          - "Artwork.artifacts_overview.is_authenticated == true"
        side_effects:
          - "circular_filed_at stamped from the logical clock"
          - "qualification_deadline_at = circular_filed_at + 30 days"
          - "version incremented by 1"
          - "Artwork.status becomes UNDER_OFFERING"

      - from: QUALIFICATION_FILED
        to: ALLOCATED
        trigger: "POST /offerings/{offeringId}/allocate"
        actor: ComplianceOfficer
        preconditions:
          - "current_utc <= qualification_deadline_at (ERR_QUALIFICATION_LAPSED otherwise)"
          - "Offering.accepted_shares >= 1 (ERR_MINIMUM_NOT_MET otherwise)"
        side_effects:
          - "Subscription.accepted_shares stamped on every SUBSCRIBED subscription"
          - "Subscription rows with accepted_shares == 0 become WAITLISTED with a waitlist_rank"
          - "Subscription rows past deadline while still RECEIVED become EXPIRED"
          - "Offering.status becomes ALLOCATED"
          - "Offering.version incremented by 1"
          - "Investor.lifetime_invested_cents increased by each subscription's amount_due_cents"

      - from: QUALIFICATION_FILED
        to: WITHDRAWN
        trigger: "POST /offerings/{offeringId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.accepted_shares == 0"
        side_effects:
          - "Every collected subscription is refunded: refunded_cents = collected_subscription_cents per SUBSCRIBED subscription"
          - "Offering.cash_ledger_cents becomes 0"
          - "Offering.status becomes WITHDRAWN"
          - "Artwork.status reverts to AUTHENTICATED"

      - from: ALLOCATED
        to: HELD
        trigger: "POST /custody-records/{custodyRecordId}/receive on a PENDING custody record of the offering"
        actor: IssuerOps
        preconditions:
          - "The offering has no CustodyRecord in status IN_CUSTODY already (ERR_CUSTODY_INTERVAL_OVERLAP otherwise)"
          - "Offering.holding_clock_started_at is null"
        side_effects:
          - "CustodyRecord.status becomes IN_CUSTODY and custody_started_at stamped"
          - "Offering.holding_clock_started_at = custody record's custody_started_at"
          - "Offering.holding_period_end_at = holding_clock_started_at + hold_period_days days"
          - "Offering.status becomes HELD"
        note: "This is the transition that starts the hold clock; a test cannot gate on holding_period_end_at until it has run."

      - from: HELD
        to: ALLOCATED
        trigger: "POST /offerings/{offeringId}/holding-decisions with decision_type == HOLD"
        actor: IssuerOps
        preconditions:
          - "Offering.status == HELD"
        side_effects:
          - "A HoldingDecision is created in status APPROVED with decision_type HOLD"
          - "Offering.status becomes ALLOCATED"

      - from: ALLOCATED
        to: SALE_PENDING
        trigger: "PATCH /holding-decisions/{holdingDecisionId}/approve"
        actor: IssuerOps
        preconditions:
          - "current_utc >= Offering.holding_period_end_at (ERR_HOLD_PERIOD_ACTIVE otherwise)"
          - "HoldingDecision.status == PENDING and decision_type == SELL"
        side_effects:
          - "HoldingDecision.status becomes APPROVED"
          - "Offering.status becomes SALE_PENDING"
          - "Artwork.status becomes SALE_PENDING"

      - from: SALE_PENDING
        to: ALLOCATED
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents < artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "HoldingDecision.status == APPROVED"
        side_effects:
          - "HoldingDecision.status becomes FAILED"
          - "Offering.status reverts to ALLOCATED"
          - "Artwork.status reverts to HELD"
          - "Offering.version incremented by 1"
        note: "Back edge of the Offering cycle: ALLOCATED -> SALE_PENDING -> ALLOCATED."

      - from: SALE_PENDING
        to: CLOSED
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents >= artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "HoldingDecision.status == APPROVED"
        side_effects:
          - "HoldingDecision.status becomes EXECUTED, executed_gross_cents stored"
          - "A Distribution row is created in status CALCULATED with per-share_cents = investor_residual_cents // total_shares and its remainder to the earliest holder by created_at ASC"
          - "Offering.status becomes CLOSED"
          - "Artwork.status becomes SOLD"
          - "Offering.version incremented by 1"

      - from: ALLOCATED
        to: WITHDRAWN
        trigger: "POST /offerings/{offeringId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == ALLOCATED"
          - "current_utc < Offering.holding_period_end_at (ERR_HOLD_PERIOD_ACTIVE otherwise)"
        side_effects:
          - "Every subscription's collected funds are refunded and refunded_cents set"
          - "Offering.cash_ledger_cents becomes 0"
          - "Offering.status becomes WITHDRAWN"
          - "Artwork.status reverts to HELD"
        note: "Market-out right before the hold period completes; after holding_period_end_at the offering can only be sold, not withdrawn."

  - entity: Subscription
    initial_state: RECEIVED
    terminal_states: [REJECTED, EXPIRED, WITHDRAWN]
    transitions:

      - from: RECEIVED
        to: SUBSCRIBED
        trigger: "POST /subscriptions/{subscriptionId}/screen with outcome VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "offering.status in {DRAFT, QUALIFICATION_FILED, ALLOCATED}"
          - "Investor.suitability_status == PENDING or APPROVED"
          - "Offering.exemption_type != EXEMPT_REG_D or Investor.annual_income_cents >= 20000000 or Investor.net_worth_cents >= 100000000"
        side_effects:
          - "Investor.suitability_status becomes APPROVED"
          - "Investor.suitability_verified_at stamped from the logical clock"
          - "Investor.suitability_expires_at = suitability_verified_at + 365 days"
          - "Investor.is_accredited becomes true when offering.exemption_type == EXEMPT_REG_D"
          - "Subscription.status becomes SUBSCRIBED"
          - "Offering.accepted_shares and Offering.unsubscribed_shares recomputed"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /subscriptions/{subscriptionId}/screen with outcome DISPUTED"
        actor: ComplianceOfficer
        preconditions:
          - "The suitability screen found the investor ineligible"
        side_effects: []
        note: "Any funds already collected are refunded with refunded_cents set."

      - from: SUBSCRIBED
        to: REALLOCATED
        trigger: "POST /offerings/{offeringId}/allocate"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == QUALIFICATION_FILED"
          - "This subscription's clamp under the offering's per-investor registration cap leaves accepted_shares >= 1"
          - "The investor's cap room was reduced by subscriptions of that investor earlier in ALLOCATED_SUBSCRIPTION_RANK_ORDER"
        side_effects:
          - "Subscription.accepted_shares reduced to the cap clamp for this offering"
          - "Subscription.amount_due_cents = accepted_shares * price_per_share_cents"
        note: "Clamped-but-nonzero branch of the allocation fork."

      - from: SUBSCRIBED
        to: WAITLISTED
        trigger: "POST /offerings/{offeringId}/allocate"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == QUALIFICATION_FILED"
          - "The clamp leaves accepted_shares == 0 for this subscription"
        side_effects:
          - "Subscription.accepted_shares stays 0"
          - "Subscription.waitlist_rank assigned densely in ALLOCATED_SUBSCRIPTION_RANK_ORDER"
        note: "Fully-clamped branch of the allocation fork."

      - from: WAITLISTED
        to: REALLOCATED
        trigger: "POST /offerings/{offeringId}/waitlist-promotion"
        actor: ComplianceOfficer
        preconditions:
          - "current_utc < Offering.qualification_deadline_at"
          - "Offering.unsubscribed_shares >= 1"
          - "This subscription holds waitlist_rank == 1 among WAITLISTED subscriptions of the offering"
        side_effects:
          - "Subscription.accepted_shares set to min(unsubscribed_shares, requested_shares) after cap clamp"
          - "Subscription.status becomes REALLOCATED"
          - "Remaining WAITLISTED subscriptions of the offering are re-ranked densely"
          - "Offering.accepted_shares, reserved_shares and unsubscribed_shares recomputed"
        note: "Back edge of the Subscription cycle: WAITLISTED -> REALLOCATED -> WAITLISTED is reachable."

      - from: REALLOCATED
        to: WAITLISTED
        trigger: "POST /offerings/{offeringId}/waitlist-demotion"
        actor: ComplianceOfficer
        preconditions:
          - "The named subscription's accepted_shares are no longer fundable"
        side_effects:
          - "Subscription.accepted_shares reset to 0"
          - "A fresh waitlist_rank is assigned at the tail of the queue"
        note: "Terminating back edge of the cycle."

      - from: SUBSCRIBED
        to: WITHDRAWN
        trigger: "POST /subscriptions/{subscriptionId}/withdraw"
        actor: Investor
        preconditions:
          - "The acting investor is the subscription's investor_id"
          - "offering.status in {DRAFT, QUALIFICATION_FILED}"
          - "current_utc <= offering.circular_filed_at + 3 days"
        side_effects:
          - "Subscription.collected_subscription_cents is refunded"
          - "Offering.accepted_shares and cash_ledger_cents recomputed"

      - from: SUBSCRIBED
        to: EXPIRED
        trigger: "system (during POST /offerings/{offeringId}/allocate, when the offering is past qualification_deadline_at)"
        actor: system
        preconditions:
          - "current_utc > offering.qualification_deadline_at"
        side_effects:
          - "Subscription.collected_subscription_cents is refunded"

      - from: WAITLISTED
        to: EXPIRED
        trigger: "system (during POST /offerings/{offeringId}/allocate, when the offering is past qualification_deadline_at)"
        actor: system
        preconditions:
          - "current_utc > offering.qualification_deadline_at"
        side_effects: []

      - from: RECEIVED
        to: EXPIRED
        trigger: "system (during POST /offerings/{offeringId}/allocate, when the offering is past qualification_deadline_at)"
        actor: system
        preconditions:
          - "current_utc > offering.qualification_deadline_at"
          - "Subscription.status is still RECEIVED (never screened)"
        side_effects: []

  - entity: CustodyRecord
    initial_state: PENDING
    terminal_states: []
    transitions:

      - from: PENDING
        to: IN_CUSTODY
        trigger: "POST /custody-records/{custodyRecordId}/receive"
        actor: IssuerOps
        preconditions:
          - "The offering has no other CustodyRecord in status IN_CUSTODY (ERR_CUSTODY_INTERVAL_OVERLAP otherwise)"
          - "Offering.status in {ALLOCATED, HELD}"
        side_effects:
          - "CustodyRecord.custody_started_at stamped from the logical clock"
          - "Offering.holding_clock_started_at set when it was null"
          - "Offering.holding_period_end_at recomputed"
          - "Offering.status becomes HELD"

      - from: IN_CUSTODY
        to: RELEASED
        trigger: "POST /custody-records/{custodyRecordId}/release"
        actor: IssuerOps
        preconditions:
          - "Offering.status == HELD"
        side_effects:
          - "CustodyRecord.custody_ended_at stamped"
          - "Offering.holding_clock_started_at reset to null and holding_period_end_at to null"
          - "Offering.status becomes ALLOCATED, which reopens the secondary window"

      - from: RELEASED
        to: IN_CUSTODY
        trigger: "POST /custody-records/{custodyRecordId}/receive"
        actor: IssuerOps
        preconditions:
          - "The artwork has a SELECTED appraisal filed after custody_ended_at (ERR_APPRAISAL_STALE otherwise)"
          - "Offering.status == ALLOCATED"
          - "No other CustodyRecord of the offering is in status IN_CUSTODY (ERR_CUSTODY_INTERVAL_OVERLAP otherwise)"
          - "Offering.expected_offering_version matches the stored version (OCC)"
        side_effects:
          - "CustodyRecord.custody_ended_at reset to null"
          - "CustodyRecord.custody_started_at re-stamped from the logical clock"
          - "Offering.holding_clock_started_at re-stamped from the logical clock and holding_period_end_at recomputed"
          - "Offering.status becomes HELD"
        note: "Revision loop: a released work moving vaults restarts the hold clock."

  - entity: HoldingDecision
    initial_state: PENDING
    terminal_states: [EXECUTED, FAILED, REJECTED]
    transitions:

      - from: PENDING
        to: APPROVED
        trigger: "PATCH /holding-decisions/{holdingDecisionId}/approve"
        actor: IssuerOps
        preconditions:
          - "decision_type == SELL: current_utc >= offering.holding_period_end_at"
          - "decision_type == SELL: the acting X-User-ID differs from the user who created the decision (segregation of duties)"
          - "decision_type == HOLD: offering.status in {ALLOCATED, HELD}"
        side_effects:
          - "Offering.status becomes SALE_PENDING when decision_type == SELL, else ALLOCATED"
          - "Artwork.status becomes SALE_PENDING when decision_type == SELL"

      - from: APPROVED
        to: REJECTED
        trigger: "PATCH /holding-decisions/{holdingDecisionId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "The acting X-User-ID differs from the user who approved the decision"
        side_effects:
          - "Offering.status reverts to ALLOCATED"
          - "Artwork.status reverts to HELD"
        note: "Cycle step 1: a second officer can overturn an approval before execution."

      - from: REJECTED
        to: PENDING
        trigger: "PATCH /holding-decisions/{holdingDecisionId}/revise"
        actor: IssuerOps
        preconditions:
          - "A new proposed_gross_cents is supplied"
        side_effects:
          - "HoldingDecision.status becomes PENDING"
          - "proposed_gross_cents replaced"
          - "Offering.status stays ALLOCATED"
        note: "Cycle step 2 — closes the PENDING -> APPROVED -> REJECTED -> PENDING loop."

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents >= artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "Offering.status == SALE_PENDING"
        side_effects:
          - "executed_gross_cents stored"
          - "Distribution created in status CALCULATED"
          - "Offering.status becomes CLOSED"
          - "Artwork.status becomes SOLD"

      - from: APPROVED
        to: FAILED
        trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents < artwork.reserve_price_cents"
        actor: IssuerOps
        preconditions:
          - "Offering.status == SALE_PENDING"
        side_effects:
          - "Offering.status reverts to ALLOCATED"
          - "Artwork.status reverts to HELD"
          - "No Distribution is created"

      - from: PENDING
        to: REJECTED
        trigger: "PATCH /holding-decisions/{holdingDecisionId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "decision_type == SELL and holding_period_end_at has not yet passed, or the officer declines the proposal outright"
        side_effects:
          - "Offering.status stays ALLOCATED"

  - entity: TransferOrder
    initial_state: OPEN
    terminal_states: [EXECUTED, CANCELLED]
    transitions:

      - from: OPEN
        to: MATCHED
        trigger: "POST /transfer-orders/{transferOrderId}/accept"
        actor: Investor
        preconditions:
          - "shares >= floor(offering.total_shares * liquidity_ratio_bps / 10000) (ERR_LIQUIDITY_WINDOW_LOCKED otherwise; exactly the floor passes)"
          - "buyer_id != seller_id"
          - "buyer_id holds at least 1 accepted share of this offering (ERR_INVALID_STATE otherwise) — the secondary market is closed to non-holders"
          - "offering.status == ALLOCATED"
          - "current_utc >= buyer.restriction_until"
          - "Offering.holding_period_end_at is null (a started hold clock closes the market entirely, per the alternate reading the scaffold rejects)"
          - "bid_price_cents >= limit_price_cents"
        side_effects:
          - "TransferOrder.status becomes MATCHED"
          - "TransferOrder.buyer_id bound"
          - "execution_price_cents = limit_price_cents"

      - from: MATCHED
        to: OPEN
        trigger: "POST /transfer-orders/{transferOrderId}/repost"
        actor: IssuerOps
        preconditions:
          - "The counterparty withdrew before settlement"
        side_effects:
          - "buyer_id unbound, status back to OPEN"
        note: "Back edge 1 — an unconfirmed match returns to the book."

      - from: OPEN
        to: EXECUTED
        trigger: "POST /transfer-orders/{transferOrderId}/approve-transfer"
        actor: TransferAgent
        preconditions:
          - "buyer_id is bound"
          - "The acting officer's X-User-ID differs from the officer who created the order (segregation of duties)"
          - "Offering.holding_period_end_at is null (the holding clock has not started, so the secondary window is open)"
        side_effects:
          - "execution_price_cents = max(bid_price_cents, limit_price_cents)"
          - "Both share ledgers move: seller's accepted shares decrease by shares, buyer's increase by shares"
          - "TransferOrder.status becomes EXECUTED"
          - "seller.lifetime_invested_cents unchanged (secondary trades do not touch the primary total)"

      - from: MATCHED
        to: EXECUTED
        trigger: "POST /transfer-orders/{transferOrderId}/approve-transfer"
        actor: TransferAgent
        preconditions:
          - "Offering.holding_period_end_at is null (the holding clock has not started, so the secondary window is open)"
        side_effects:
          - "execution_price_cents = max(bid_price_cents, limit_price_cents)"
          - "Share ledgers move as above"
          - "TransferOrder.status becomes EXECUTED"

      - from: OPEN
        to: LAPSED
        trigger: "system (POST /offerings/{offeringId}/reconcile-cadence)"
        actor: system
        preconditions:
          - "The order has been OPEN for at least 30 consecutive days with no accept"
        side_effects:
          - "None on the share ledger — no shares move"

      - from: LAPSED
        to: OPEN
        trigger: "POST /transfer-orders/{transferOrderId}/repost"
        actor: Investor
        preconditions:
          - "The acting investor is the order's seller_id"
        side_effects:
          - "TransferOrder.status becomes OPEN"
        note: "Back edge 2 — a lapsed resting order may be reposted."

      - from: OPEN
        to: CANCELLED
        trigger: "POST /transfer-orders/{transferOrderId}/cancel"
        actor: Investor
        preconditions:
          - "The acting investor is the order's seller_id"
        side_effects: []

      - from: MATCHED
        to: CANCELLED
        trigger: "POST /transfer-orders/{transferOrderId}/cancel"
        actor: IssuerOps
        preconditions:
          - "Settlement failed"
        side_effects: []

  - entity: InsurancePolicy
    initial_state: PENDING
    terminal_states: [LAPSED]
    transitions:

      - from: PENDING
        to: FORCE
        trigger: "POST /insurance-policies/{policyId}/bind"
        actor: IssuerOps
        preconditions:
          - "coverage_cents >= artwork.last_appraised_value_cents (ERR_INSUFFICIENT_COVERAGE otherwise)"
          - "coverage_cents <= artwork.last_appraised_value_cents * 120 / 100 (ERR_COVERAGE_EXCEEDS_VALUE otherwise)"
          - "No other InsurancePolicy of the same offering is in status FORCE (ERR_POLICY_INTERVAL_OVERLAP otherwise)"
          - "artwork.last_appraised_value_cents > 0 (ERR_APPRAISAL_MISSING otherwise)"
        side_effects:
          - "status becomes FORCE"
        note: "Two FORCE policies on one offering are structurally impossible: a replacement policy must be bound only after the incumbent has been lapsed."

      - from: FORCE
        to: LAPSED
        trigger: "POST /insurance-policies/{policyId}/lapse"
        actor: IssuerOps
        preconditions:
          - "Another InsurancePolicy of the same offering is in status FORCE or PENDING (ERR_SOLE_POLICY_CANNOT_LAPSE otherwise)"
        side_effects:
          - "status becomes LAPSED"
          - "Every Lot row of the offering recomputes: pass_through_allowed becomes false and pass_through_amount_cents becomes 0"
          - "Offering.custody_cost_ledger_cents recomputed as the sum of the recomputed pass_through_amount_cents over every lot of the offering"
        note: "Cascade root B, depth 3: InsurancePolicy -> Lot -> Offering."

  - entity: Investor
    initial_state: PENDING
    terminal_states: []
    transitions:

      - from: PENDING
        to: APPROVED
        trigger: "POST /subscriptions/{subscriptionId}/screen with outcome VERIFIED"
        actor: ComplianceOfficer
        side_effects:
          - "suitability_verified_at stamped"
          - "suitability_expires_at = suitability_verified_at + 365 days"

      - from: APPROVED
        to: EXPIRED
        trigger: "system (any offer is rejected on expiry during POST /offerings/{offeringId}/qualification-filing)"
        actor: system
        preconditions:
          - "current_utc > suitability_expires_at"
        side_effects:
          - "Investor may not subscribe until re-screened"

      - from: EXPIRED
        to: APPROVED
        trigger: "POST /subscriptions/{subscriptionId}/screen with outcome VERIFIED"
        actor: ComplianceOfficer
        side_effects:
          - "suitability_verified_at re-stamped, suitability_expires_at recomputed"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /investors/{investorId}/revoke-suitability"
        actor: ComplianceOfficer
        side_effects:
          - "All of the investor's RECEIVED and SUBSCRIBED subscriptions move to REJECTED"
          - "Collected funds on those subscriptions are refunded"
        note: "The only Investor transition with a cascade side effect."

  - entity: Appraisal
    initial_state: FILED
    terminal_states: []
    transitions:

      - from: FILED
        to: FILED
        trigger: "POST /artworks/{artworkId}/appraisals"
        actor: IssuerOps
        preconditions:
          - "No sibling SELECTED appraisal of the same artwork was filed within the last 90 days (ERR_APPRAISAL_CADENCE otherwise)"
          - "filed_at >= artwork.last_appraisal_at"
        side_effects:
          - "Artwork.last_appraised_value_cents set to this appraisal's appraised_value_cents"
          - "Artwork.last_appraisal_at set to this appraisal's filed_at"
          - "Every sibling Appraisal of the artwork has is_selected recomputed false"
          - "Artwork.next_appraisal_due_at = this filed_at + 90 days"
        note: "Parallel-dimension claim: the filing dimension (append-only) and the selection dimension (exactly-one-true) evolve independently on the same row set; the parallel-dimension test drives a newer filing after a CASUALTY gap and asserts the selection moves while filed_at stays monotone."

# =============================================================================
# Concurrency Rules (only true races — OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: custody-receive-stale-offering
    parent_entity: Offering
    write_endpoint: "POST /custody-records/{custodyRecordId}/receive"
    occ_field: "expected_offering_version"
    description: |
      Re-receiving a previously RELEASED custody record against an Offering
      whose version has advanced since the client last observed it is rejected.
      The revision loop legitimately re-stamps holding_clock_started_at, and
      any intervening allocation, waitlist promotion or insurance binding has
      already advanced the offering's version, so the client's observed version
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appraisal-create-stale-artwork
    parent_entity: Artwork
    write_endpoint: "POST /artworks/{artworkId}/appraisals"
    occ_field: "expected_artwork_version"
    description: |
      Filing an appraisal against an Artwork whose version has advanced since
      the client last observed it is rejected. Every prior appraisal filing,
      custody transition and asset-report component re-evaluates the artwork's
      artifacts_overview and therefore advances its version, so a client that
      read the artwork before those writes holds a stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-execute-stale-offering
    parent_entity: Offering
    write_endpoint: "POST /transfer-orders/{transferOrderId}/approve-transfer"
    occ_field: "expected_offering_version"
    description: |
      Approving a secondary transfer against an Offering whose version has
      advanced since the client last observed it is rejected. A prior transfer
      approval, waitlist promotion or cost-lot accrual has already moved the
      offering, so the client's observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: appraised_value_per_share
    trigger: "every read of an Offering's valuation surfaces, and every GET /offerings/{offeringId}/valuation"
    algorithm: dual_variant
    formula: |
      # legacy variant — provisional, uses the newest appraisal by filed_at
      valuation_basis_cents = newest Appraisal.filed_at
      value_per_share_cents = floor(valuation_basis_cents / total_shares)

      # restated variant — final, uses the newest appraisal that carries a
      # vetted provenance attestation (an ArtworkAssetReport of report_type
      # PROVENANCE with outcome VERIFIED filed at or before the appraisal)
      valuation_basis_cents = newest such Appraisal.filed_at
      value_per_share_cents = floor(valuation_basis_cents / total_shares)
    input_set: "All Appraisal rows of the artwork with is_selected == true are candidates; the legacy variant takes the maximum filed_at, the restated variant takes the maximum filed_at among rows whose artwork has a VERIFIED provenance report filed at or before that row's filed_at."
    constants:
      APPRAISAL_CADENCE_DAYS: 90
    precision: "floor to whole cents (integer division); never rounded up"
    variants:
      - name: legacy_provisional
        when: "the reporting context is the legacy provisional figure — before any restatement election is recorded for the offering"
        difference: "Uses the newest SELECTED appraisal regardless of provenance vetting; this is the figure shown on the legacy valuation surface."
      - name: restated_final
        when: "the reporting context is the restated final figure — after the offering's restatement election"
        difference: "Ignores a newer appraisal whose provenance attestation had not been filed when it was made, so the two variants differ by exactly floor(newest/total_shares) - floor(vetted/total_shares)."

  - name: registration_share_cap
    trigger: "POST /offerings/{offeringId}/allocate"
    algorithm: aggregation
    formula: |
      share_cap = floor(offering.total_shares * offering.registration_cap_pct / 10000)

      # The clamp is applied per investor, and within an investor in
      # ALLOCATED_SUBSCRIPTION_RANK_ORDER, so nothing depends on how the
      # global set is traversed:
      for each investor appearing in the offering's subscriptions,
          ordered by that investor's earliest subscription's
          (created_at ASC, created_at_seq ASC):
        investor_accepted = 0
        for each of that investor's subscriptions of this offering, ordered by
            (created_at ASC, created_at_seq ASC):
          room = max(0, share_cap - investor_accepted)
          accepted_shares = min(requested_shares, room)
          investor_accepted += accepted_shares
          stamp accepted_shares and amount_due_cents
          status becomes SUBSCRIBED when accepted_shares >= 1, else WAITLISTED
    input_set: "One Offering and every subscription taken against it, regardless of status; registration_cap_pct is the offering's investor cap expressed in basis points."
    constants:
      CAP_INTERPRETATION: allowed-shares   # the cap BOUNDS the holding, it does not reserve it
      CLAMP_SCOPE: per-investor
    precision: "floor to whole shares; the clamp never expands a request"
    variants:
      - name: allowed_shares_reading
        when: "the cap bounds the fraction of the offering any investor may hold"
        difference: "share_cap is the maximum holding; a subscription is clamped down to it, never expanded."
      - name: reserved_shares_reading
        when: "mistaken reading in which the cap reserves a slice of the offering up front"
        difference: "would subtract a reserved slice from what is allocatable; produces a strictly smaller accepted_shares whenever any investor's requested_shares exceeds the clamp, and is the reading the scaffold rejects."

  - name: secondary_transfer_price
    trigger: "POST /transfer-orders/{transferOrderId}/approve-transfer"
    algorithm: threshold
    formula: |
      execution_price_cents = max(bid_price_cents, limit_price_cents)
    input_set: "One TransferOrder with buyer_id and bid_price_cents bound by POST /transfer-orders/{transferOrderId}/accept."
    constants:
      PRICE_FLOOR: limit_price_cents
    precision: "whole cents; no rounding step"
    variants:
      - name: bid_above_limit
        when: "the counterparty bid above the resting limit"
        difference: "settles at the bid, so the seller receives the higher of the two."
      - name: limit_above_bid
        when: "the counterparty bid exactly at or below the resting limit"
        difference: "settles at the limit, so the seller is never worse off than the price it posted."

  - name: secondary_liquidity_gate
    trigger: "POST /transfer-orders/{transferOrderId}/accept"
    algorithm: threshold
    formula: |
      minimum_secondary_lot = floor(offering.total_shares * liquidity_ratio_bps / 10000)
      if transfer_order.shares < minimum_secondary_lot:
        reject with ERR_LIQUIDITY_WINDOW_LOCKED
      # then, independently, the buyer-eligibility and cap gate:
      buyer_eligible = (buyer holds >= 1 accepted share of this offering)
      if not buyer_eligible:
        reject with ERR_INVALID_STATE
      current_holdings = sum(Subscription.accepted_shares for (offering, buyer))
      projected_holdings = current_holdings + transfer_order.shares
      buyer_cap_shares = floor(offering.total_shares * offering.registration_cap_pct / 10000)
      if projected_holdings > buyer_cap_shares:
        reject with ERR_OFFERING_FULL
    input_set: "One TransferOrder with a named buyer; the lot floor reads only the order's own share count against the offering's total_shares, so no other order's size can shift the threshold."
    constants:
      liquidity_ratio_bps: 1000     # 10.00% of total shares
      CAP_INTERPRETATION: allowed-shares
    precision: "integer basis points; reject on strict less-than, so exactly the minimum lot passes"
    variants:
      - name: minimum_lot_floor_reading
        when: "the ratio is read as a minimum order size measured against the whole issue"
        difference: "an order of exactly floor(total_shares * 1000/10000) shares is admissible; one share fewer is refused."
      - name: absolute_share_count_reading
        when: "the same constant is read as a flat 1000-share lot irrespective of the issue size"
        difference: "on an issue of 40 000 shares the correct minimum is 4 000 shares, so a 1 000-share order the correct reading refuses would be admitted by this reading."

  - name: cost_pass_through_amount
    trigger: "POST /offerings/{offeringId}/cost-lots"
    algorithm: threshold
    formula: |
      if lot_type not in {STORAGE, INSURANCE, CONSERVATION}:
        pass_through_allowed = false
      elif offering.status not in {ALLOCATED, HELD}:
        pass_through_allowed = false
      elif no InsurancePolicy of the offering has status == FORCE:
        pass_through_allowed = false
      elif any TransferOrder of the offering has status == OPEN:
        pass_through_allowed = false
      elif offering.holding_clock_started_at is null:
        pass_through_allowed = false
      elif incurred_on < offering.holding_clock_started_at:
        pass_through_allowed = false
      else:
        pass_through_allowed = true
      pass_through_amount_cents = floor(cost_amount_cents * cost_pass_through_bps / 10000) if pass_through_allowed else 0
      offering.custody_cost_ledger_cents += pass_through_amount_cents
    input_set: "One Lot row; the five gates are evaluated in the order listed and the first failure short-circuits, so the persisted pass_through_allowed is a single boolean rather than a gate-by-gate record."
    constants:
      STORAGE: included
      INSURANCE: included
      CONSERVATION: included
    precision: "floor to whole cents"
    variants:
      - name: gated_zero
        when: "any gate fails"
        difference: "the lot is journaled at full cost but passes through 0, so the issuer absorbs it."
      - name: full_pass_through
        when: "every gate passes"
        difference: "pass_through_amount_cents = cost_amount_cents * cost_pass_through_bps / 10000, floored."

  - name: held_period_management_fee
    trigger: "POST /offerings/{offeringId}/accrue-fees, and again at POST /holdings/{holdingDecisionId}/execute"
    algorithm: threshold
    formula: |
      parenthesised off-by-one reading:
        holding_days = (holding_period_end_at - holding_clock_started_at).days
      start-inclusive reading:
        holding_days = (holding_period_end_at - holding_clock_started_at).days + 1
      management_fee_cents = floor( last_appraised_value_cents * management_fee_bps / 10000
                                    * holding_days / 365 )
    input_set: "One Offering with holding_clock_started_at not null and at least one SELECTED appraisal; when holding_period_end_at is null the calculation is not run."
    constants:
      DAYS_PER_YEAR: 365
      FEE_BPS_BASE: 10000
    precision: "floor to whole cents at settlement; the presentation figure is round_half_up to the cent"
    variants:
      - name: calendar_days_diff
        when: "the accrual is presented to a human"
        difference: "uses the plain date difference, so a 182-day clock yields 182/365 of the annual rate."
      - name: inclusive_start_days
        when: "the accrual is settled in cash"
        difference: "adds the start day back, so the same 182-day clock settles on 183/365 — one day's fee larger."

  - name: profit_participation
    trigger: "POST /holdings/{holdingDecisionId}/execute"
    algorithm: waterfall_allocation
    formula: |
      profit_participation_cents = floor( distributable_proceeds_cents * profit_participation_bps / 10000 )
      basis_value_cents = distributable_proceeds_cents
    input_set: "One Offering at the moment a Distribution is calculated; distributable_proceeds_cents is the same waterfall value used by the distribution rule."
    constants:
      FEE_BPS_BASE: 10000
    precision: "floor to whole cents; the issuer's claim never rounds up against investors"

  - name: sale_distribution_waterfall
    trigger: "POST /holdings/{holdingDecisionId}/execute with executed_gross_cents >= reserve_price_cents"
    algorithm: waterfall_allocation
    formula: |
      distributable_cents      = executed_gross_cents - artwork.acquisition_cost_cents
      distributed_cost_cents   = floor(offering.custody_cost_ledger_cents * offering.cost_pass_through_bps / 10000)
      management_fee_cents     = floor(artwork.acquisition_cost_cents * offering.management_fee_bps / 10000)
      preferred_return_cents   = floor(artwork.acquisition_cost_cents * preferred_return_bps / 10000 * held_for_days / 365)
      profit_participation_cents = floor(distributable_cents * profit_participation_bps / 10000)
      investor_residual_cents  = distributable_cents - distributed_cost_cents - management_fee_cents - preferred_return_cents - profit_participation_cents
      per_share_cents          = investor_residual_cents // total_shares
      remainder_cents          = investor_residual_cents - per_share_cents * total_shares

      # Evaluation order is pinned and must not be reordered:
      #   0. distributed_cost_cents  (investor-borne operating cost comes out first)
      #   1. distributable_cents     (the realised gain pool)
      #   2. management_fee_cents
      #   3. preferred_return_cents
      #   4. profit_participation_cents
      #   5. investor_residual_cents (what is left for holders)
      # Rounding: every step is floored BEFORE it is subtracted, so rounding
      # never creates negative residual. The remainder_cents is added in full to
      # the allocation of the holder whose earliest accepted Subscription has
      # the smallest created_at ASC, tie-broken by created_at_seq ASC.
      held_for_days = (current_utc - holding_clock_started_at).days
    input_set: |
      Only holders with Subscription.accepted_shares >= 1 as of the execution
      instant participate. Every step's amount is floored independently and
      before subtraction. If any of steps 2-4 floor to 0, the step contributes
      nothing but does not shift the evaluation order.
    constants:
      FEE_BPS_BASE: 10000
      DAYS_PER_YEAR: 365
      REMAINDER_ASSIGNEE: "holder with the smallest (Subscription.created_at ASC, created_at_seq ASC) among accepted subscriptions"
    precision: "floor at every step, then integer-divide; remainder assigned whole to a single holder"
    variants:
      - name: floored_each_step
        when: "each waterfall step is floored before subtraction (the pinned order)"
        difference: "residual absorbs at most 4 cents of independent flooring."
      - name: floor_the_residual
        when: "the four deductions are summed unrounded and only the final residual is floored"
        difference: "produces a residual up to 2 cents higher on identical inputs, and is the reading the scaffold rejects because per-step amounts become non-integer."

  - name: quarterly_appraisal_cadence
    trigger: "POST /offerings/{offeringId}/reconcile-cadence"
    algorithm: interval_merge
    formula: |
      gap_days = (current_utc - artwork.last_appraisal_at).days
      is_quarter_marker = (gap_days >= 90)
      if gap_days >= 180:
        flag = REQUIRED
      elif gap_days > 90:
        flag = DUE
      else:
        flag = CURRENT
    input_set: "One Artwork; last_appraisal_at is recomputed from the SELECTED appraisals only, so an unselected filing does not reset the cadence."
    constants:
      CADENCE_DUE_DAYS: 90
      CADENCE_REQUIRED_DAYS: 180
    precision: "whole days; the DUE flag starts strictly after 90 days, so exactly 90 is CURRENT"
    variants:
      - name: boundary_exclusive
        when: "gap_days must exceed the threshold strictly"
        difference: "gap_days == 90 is CURRENT; gap_days == 91 is DUE."
      - name: boundary_inclusive
        when: "gap_days triggers at the threshold itself"
        difference: "gap_days == 90 would be DUE, shifting the whole cadence by one day and by one quarter of the annual calendar."

  - name: waitlist_promotion_order
    trigger: "POST /offerings/{offeringId}/waitlist-promotion"
    algorithm: chronological
    formula: |
      rank_order = sort WAITLISTED subscriptions of the offering by
                   (Subscription.created_at ASC, Subscription.created_at_seq ASC)
      promotion candidate = the subscription at rank 1 after the sort
      promoted_shares = min(offering.unsubscribed_shares, candidate.requested_shares)
    input_set: "Only subscriptions currently in status WAITLISTED; REALLOCATED and EXPIRED rows are excluded from the ranking."
    constants:
      ALLOCATED_SUBSCRIPTION_RANK_ORDER: created_at ASC then created_at_seq ASC
    precision: "whole shares"
    variants:
      - name: first_in_first_out
        when: "rank 1 is the earliest-created waiting subscription"
        difference: "the promoter is deterministic even when several subscriptions share one created_at second, because created_at_seq breaks the tie."
      - name: highest_request_first
        when: "rank 1 is the largest requested_shares"
        difference: "would promote a later, larger subscriber ahead of an earlier, smaller one and exhaust unsubscribed_shares in fewer promotions."

  - name: holding_period_gate
    trigger: "PATCH /holding-decisions/{holdingDecisionId}/approve and POST /transfer-orders/{transferOrderId}/approve-transfer"
    algorithm: threshold
    formula: |
      # Sale side (a sale may only be approved once the hold has run):
      sale_unlocked = (holding_period_end_at is not null) and (current_utc >= holding_period_end_at)
      if not sale_unlocked:
        reject with ERR_HOLD_PERIOD_ACTIVE

      # Transfer side (the restricted window is [holding_clock_started_at, holding_period_end_at);
      # a started clock closes the market entirely, and an unstarted clock leaves it open):
      transfer_unlocked = (holding_period_end_at is null)
      if not transfer_unlocked:
        reject with ERR_HOLD_PERIOD_ACTIVE
    input_set: "One Offering. holding_period_end_at is null until the offering's first CustodyRecord reaches IN_CUSTODY, so the sale side and the transfer side are unlocked in disjoint states and are pinned by two different comparisons on the same field."
    constants:
      SALE_GATE_INCLUSIVE: true         # the end instant itself passes the sale gate
      TRANSFER_GATE_NULL_ONLY: true     # the transfer gate requires an unstarted clock
    precision: "half-open interval [holding_clock_started_at, holding_period_end_at) is the resticted window for sales; for transfers the mere existence of the interval forecloses the market"
    variants:
      - name: unified_threshold_reading
        when: "both sides read the same inclusive end-instant comparison, so an offering with a started clock could still trade"
        difference: "would admit a secondary transfer at a holding_period_end_at that the correct reading forecloses."
      - name: disjoint_gate_reading
        when: "the sale gate requires an unstarted-clock-excluded comparison while the transfer gate requires the clock to be unstarted"
        difference: "the two gates are unlocked in disjoint states: a sale needs the clock started AND elapsed, a transfer needs the clock never started."

  - name: platform_cash_invariant
    trigger: "every mutation of PlatformAccount.balance_cents"
    algorithm: constraint_propagation
    formula: |
      balance_cents = sum of all debits and credits applied to the account
      Nothing may bring balance_cents below 0; a write that would is rejected with
      ERR_ACCOUNT_UNDERFUNDED and no partial debit is applied.
    input_set: "The single PlatformAccount row; every money-moving endpoint appends one balancing pair."
    constants:
      CURRENCY: USD_cents
    precision: "whole cents; no rounding step"
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present on every request that is not anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /investors, which is anonymous"

  - priority: 2
    category: business_safety
    check: "Investor eligibility screening: a RECEIVED subscription is screened implicitly on every qualifying action, and the screen runs the jurisdiction override first, then age >= 18 at current_utc, then the non-US residence rule (residency_country_code != US is rejected outright). The guard is skipped only when the request body explicitly carries a named screen outcome (screened: \"VERIFIED\" or screened: \"DISPUTED\")."
    error_id: ERR_INVESTOR_INELIGIBLE
    http_status: 400
    applies_to: "POST /subscriptions, POST /subscriptions/{subscriptionId}/screen, POST /offerings/{offeringId}/qualification-filing"

  - priority: 3
    category: existence
    check: "Every path and body identifier must resolve to a stored row of the expected entity type; body foreign keys are checked left-to-right in the order the endpoint's input list declares them"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Jurisdiction override: an Investor whose citizenship_country_code is US and whose residency_country_code is US is redirected to its own jurisdiction and refused; this check is reached only when the explicit screen guard from priority 2 did not short-circuit"
    error_id: ERR_OFFERING_NOT_AVAILABLE_IN_JURISDICTION
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscriptionId}/screen"

  - priority: 5
    category: state
    check: "The target resource must be in a state from which the requested operation is a declared transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 6
    category: concurrency
    check: "When the endpoint declares expected_<parent>_version, the supplied value must equal the parent's stored version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /custody-records/{custodyRecordId}/receive, POST /artworks/{artworkId}/appraisals, POST /transfer-orders/{transferOrderId}/approve-transfer"

  - priority: 7
    category: business_temporal
    check: "A qualification must be allocated or withdrawn before the offering's qualification_deadline_at; after it, only a full withdrawal is permitted"
    error_id: ERR_QUALIFICATION_LAPSED
    http_status: 409
    applies_to: "POST /offerings/{offeringId}/allocate, POST /offerings/{offeringId}/waitlist-promotion"

  - priority: 8
    category: business_fiscal
    check: "An offering must carry at least one accepted share before it can be allocated"
    error_id: ERR_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /offerings/{offeringId}/allocate"

  - priority: 9
    category: business_constraint
    check: "No investor's projected holding may exceed total_shares * registration_cap_pct / 10000; the cap bounds the holding and never reserves a slice"
    error_id: ERR_OFFERING_FULL
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{subscriptionId}/screen, POST /transfer-orders/{transferOrderId}/accept"

  - priority: 10
    category: business_fiscal
    check: "An insurance policy's coverage_cents must be at least the artwork's current last_appraised_value_cents at binding"
    error_id: ERR_INSUFFICIENT_COVERAGE
    http_status: 422
    applies_to: "POST /insurance-policies/{policyId}/bind"

  - priority: 11
    category: business_constraint
    check: "A profit-participation accrual requires the offering's sale cycle to have closed, so that distributable_proceeds_cents exists to take the participating share of"
    error_id: ERR_ACCRUAL_TYPE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /offerings/{offeringId}/accrue-fees"

  - priority: 12
    category: business_fiscal
    check: "A debit must never take PlatformAccount.balance_cents below zero"
    error_id: ERR_ACCOUNT_UNDERFUNDED
    http_status: 409
    applies_to: "POST /subscriptions/{subscriptionId}/collect, POST /offerings/{offeringId}/withdraw, POST /offerings/{offeringId}/distributions/{distributionId}/pay, POST /offerings/{offeringId}/cost-lots"

  - priority: 13
    category: business_temporal
    check: "A sale approval requires a started holding clock whose end has been reached (holding_period_end_at not null and current_utc >= holding_period_end_at); a secondary transfer approval requires the holding clock never to have started (holding_period_end_at is null)"
    error_id: ERR_HOLD_PERIOD_ACTIVE
    http_status: 409
    applies_to: "PATCH /holding-decisions/{holdingDecisionId}/approve, POST /transfer-orders/{transferOrderId}/approve-transfer"

  - priority: 14
    category: business_constraint
    check: "A secondary seller's shares must be at least liquidity_ratio_bps of the offering's open share volume; the comparison is strict less-than, so exactly at the ratio passes"
    error_id: ERR_LIQUIDITY_WINDOW_LOCKED
    http_status: 409
    applies_to: "POST /transfer-orders/{transferOrderId}/accept"

  - priority: 15
    category: business_constraint
    check: "Waitlist promotion requires at least one subscription currently in status WAITLISTED for the offering"
    error_id: ERR_WAITLIST_EMPTY
    http_status: 409
    applies_to: "POST /offerings/{offeringId}/waitlist-promotion"

  - priority: 16
    category: business_temporal
    check: "No two SELECTED appraisals of the same artwork may be filed within 90 days of each other; a new appraisal requires filed_at to be at least 90 days after the artwork's last SELECTED appraisal"
    error_id: ERR_APPRAISAL_CADENCE
    http_status: 409
    applies_to: "POST /artworks/{artworkId}/appraisals"

  - priority: 17
    category: business_temporal
    check: "A released custody record may only be re-received when a SELECTED appraisal was filed strictly after its custody_ended_at"
    error_id: ERR_APPRAISAL_STALE
    http_status: 409
    applies_to: "POST /custody-records/{custodyRecordId}/receive"

  - priority: 18
    category: business_temporal
    check: "An offering report's as_of_date may not precede the offering's most recent report as_of_date, and may not post-date current_utc"
    error_id: ERR_REPORT_WINDOW_FORECLOSED
    http_status: 409
    applies_to: "POST /offerings/{offeringId}/reports"

  - priority: 19
    category: business_referential
    check: "Sibling-exclusivity and interval-overlap rules: an InsurancePolicy in FORCE may only be lapsed when a replacement is already on file in FORCE or PENDING; a policy may not be bound while another policy of the offering is in FORCE; a CustodyRecord may not be received while another record of the offering is in IN_CUSTODY"
    error_id: "ERR_SOLE_POLICY_CANNOT_LAPSE / ERR_POLICY_INTERVAL_OVERLAP / ERR_CUSTODY_INTERVAL_OVERLAP"
    http_status: 409
    applies_to: "POST /insurance-policies/{policyId}/bind, POST /insurance-policies/{policyId}/lapse, POST /custody-records/{custodyRecordId}/receive"

  - priority: 20
    category: business_constraint
    check: "Every enum-typed body field must carry a declared enum member; a value outside the declared set is refused rather than defaulted"
    error_id: ERR_VALUE_REJECTED
    http_status: 400
    applies_to: "all endpoints with enum inputs"

  - priority: 21
    category: existence
    check: "A request to a path with no declared route is refused before any resource lookup"
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 22
    category: existence
    check: "A request using a method the route does not declare is refused"
    error_id: ERR_METHOD_NOT_ALLOWED
    http_status: 405
    applies_to: "all endpoints"

  - priority: 23
    category: auth
    check: "The acting role (X-User-Role) must be permitted for the operation; a permitted-role failure is reported before any business check"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

# =============================================================================
# §1.0 Response Envelope
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
# §1.5 API Endpoint Table
#
# Path templates use `{id}` for every resource placeholder so the sub-resource
# reverse-reachability reads under a parent collection are structurally
# matchable against the FK declarations in §1.1.
# =============================================================================
endpoints:

  # --- Artist ---
  - method: POST
    path: "/api/artists"
    description: "Register an artist or creator of record"
    roles: [IssuerOps, PlatformAdmin]
    code: 201
    input: ["legal_name", "attribution_status", "nationality_country_code", "birth_year?", "death_year?", "catalogue_raisonne_published?"]
    output: Artist
    side_effects: ["attribution_status stored as supplied; no computed rollup"]

  - method: GET
    path: "/api/artists/{id}"
    description: "Read one artist"
    roles: [IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/api/artists"
    description: "List artists, optionally filtered by attribution status"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["attribution_status?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  # --- Investor ---
  - method: POST
    path: "/api/investors"
    description: "Register an investor account. Anonymous. suitability_status starts PENDING and restriction_until starts at created_at."
    roles: [Anonymous]
    code: 201
    input: ["email", "legal_name", "password", "citizenship_country_code", "residency_country_code", "residency_state_code?", "birth_date", "annual_income_cents", "net_worth_cents", "affiliated_with_issuer?"]
    output: Investor
    side_effects:
      - "suitability_status=PENDING, suitability_verified_at=null, suitability_expires_at=null"
      - "restriction_until = created_at"
      - "lifetime_invested_cents=0"

  - method: GET
    path: "/api/investors/{id}"
    description: "Read one investor"
    roles: [Investor, ComplianceOfficer, IssuerOps, PlatformAdmin]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: GET
    path: "/api/investors"
    description: "List investors, optionally filtered by suitability status"
    roles: [ComplianceOfficer, IssuerOps, PlatformAdmin]
    code: 200
    input: ["suitability_status?", "limit?", "offset?"]
    output: Investor[]
    side_effects: []

  - method: POST
    path: "/api/investors/{id}/revoke-suitability"
    description: "Revoke an investor's suitability approval; the investor's open primary subscriptions are rejected and refunded"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Investor
    side_effects:
      - "suitability_status becomes REVOKED"
      - "Every RECEIVED or SUBSCRIBED subscription of the investor becomes REJECTED"
      - "refunded_cents set to collected_subscription_cents on each of those subscriptions"
      - "Offering.accepted_shares and cash_ledger_cents recomputed for each affected offering"

  # --- Artwork ---
  - method: POST
    path: "/api/artworks"
    description: "Register an artwork to be acquired and securitised"
    roles: [IssuerOps, PlatformAdmin]
    code: 201
    input: [title, artist_id, creation_year, medium, acquisition_cost_cents, reserve_price_cents]
    output: Artwork
    side_effects:
      - "status=APPRAISED, condition_grade=PENDING"
      - "last_appraised_value_cents=0, last_appraisal_at=null"
      - "artifacts_overview refreshed"

  - method: GET
    path: "/api/artworks/{id}"
    description: "Read one artwork including its artifacts_overview aggregate"
    roles: [IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: []
    output: Artwork
    side_effects: []

  - method: GET
    path: "/api/artworks"
    description: "List artworks, optionally filtered by status or artist"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "artist_id?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []

  - method: POST
    path: "/api/artworks/{id}/asset-reports"
    description: "File an authentication, provenance or condition-survey report on an artwork"
    roles: [IssuerOps]
    code: 201
    input: ["report_type", "outcome", "firm_name", "condition_grade?"]
    output: ArtworkAssetReport
    side_effects:
      - "filed_at stamped from the logical clock"
      - "When this report completes the two VERIFIED trust-chain components, Artwork.status becomes AUTHENTICATED"
      - "When report_type is CONDITION_SURVEY, Artwork.condition_grade is replaced by the reported grade"
      - "Artwork.artifacts_overview refreshed, Artwork.version incremented by 1"

  - method: GET
    path: "/api/artworks/{id}/asset-reports"
    description: "List every asset report filed on an artwork"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["report_type?", "limit?", "offset?"]
    output: ArtworkAssetReport[]
    side_effects: []

  - method: POST
    path: "/api/artworks/{id}/appraisals"
    description: "File an appraisal on an artwork; the newest filing becomes the SELECTED appraisal"
    roles: [IssuerOps]
    code: 201
    input: [appraised_value_cents, appraiser_firm, appraisal_method, expected_artwork_version]
    output: Appraisal
    side_effects:
      - "filed_at stamped from the logical clock"
      - "is_selected=true on the new row and false on every sibling"
      - "Artwork.last_appraised_value_cents and last_appraisal_at updated"
      - "Artwork.next_appraisal_due_at = filed_at + 90 days"
      - "Artwork.version incremented by 1"

  - method: GET
    path: "/api/artworks/{id}/appraisals"
    description: "List every appraisal filed on an artwork, oldest first"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["is_selected?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  # --- Offering ---
  - method: POST
    path: "/api/artworks/{id}/offerings"
    description: "Create a securities offering against an authenticated artwork; the artwork joins the OFFERING_PENDING leg of its fork"
    roles: [IssuerOps]
    code: 201
    input: [total_shares, price_per_share_cents, exemption_type, registration_cap_pct, liquidity_ratio_bps, hold_period_days, management_fee_bps, profit_participation_bps, cost_pass_through_bps, preferred_return_bps]
    output: Offering
    side_effects:
      - "status=DRAFT, circular_filed_at=null, accepted_shares=0, cash_ledger_cents=0"
      - "Artwork.status becomes OFFERING_PENDING"

  - method: GET
    path: "/api/offerings/{id}"
    description: "Read one offering including its share ledger and cost pass-through ledger"
    roles: [IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: []
    output: Offering
    side_effects: []

  - method: GET
    path: "/api/offerings"
    description: "List offerings, optionally filtered by status or parent artwork (reverse-reachability read for Offering.artwork_id)"
    roles: [IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: ["artwork_id?", "status?", "limit?", "offset?"]
    output: Offering[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/qualification-filing"
    description: "File the securities circular; DRAFT -> QUALIFICATION_FILED and the artwork becomes UNDER_OFFERING"
    roles: [ComplianceOfficer]
    code: 200
    input: [circular_reference, expected_offering_version]
    output: Offering
    side_effects:
      - "circular_filed_at stamped from the logical clock"
      - "qualification_deadline_at = circular_filed_at + 30 days"
      - "status becomes QUALIFICATION_FILED"
      - "Artwork.status becomes UNDER_OFFERING"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/offerings/{id}/allocate"
    description: "Run the share-allocation pass: clamp each subscription to the registration cap, waitlist the fully-clamped, expire the past-deadline, and move the offering to ALLOCATED"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_offering_version]
    output: Offering
    side_effects:
      - "Subscription.accepted_shares stamped on SUBSCRIBED rows; rows clamped to zero become WAITLISTED"
      - "Subscription rows past the deadline become EXPIRED and their funds are refunded"
      - "status becomes ALLOCATED; accepted_shares, reserved_shares and unsubscribed_shares recomputed"
      - "Investor.lifetime_invested_cents increased by each accepted subscription's amount_due_cents"
      - "Artwork.status becomes HELD"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/offerings/{id}/waitlist-promotion"
    description: "Promote the earliest WAITLISTED subscription of the offering into REALLOCATED"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_offering_version]
    output: Offering
    side_effects:
      - "The rank-1 WAITLISTED subscription gains accepted_shares and becomes REALLOCATED"
      - "Remaining WAITLISTED rows re-ranked densely"
      - "accepted_shares, reserved_shares and unsubscribed_shares recomputed"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/offerings/{id}/waitlist-demotion"
    description: "Return a previously REALLOCATED subscription to the tail of the waitlist"
    roles: [ComplianceOfficer]
    code: 200
    input: [subscription_id, expected_offering_version]
    output: Subscription
    side_effects:
      - "The named subscription's accepted_shares reset to 0 and status becomes WAITLISTED"
      - "A fresh waitlist_rank is assigned at the tail"
      - "Offering.accepted_shares, reserved_shares and unsubscribed_shares recomputed"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/offerings/{id}/withdraw"
    description: "Withdraw an offering and refund every collected subscription"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason, expected_offering_version]
    output: Offering
    side_effects:
      - "Every subscription's refunded_cents set to its collected_subscription_cents"
      - "cash_ledger_cents becomes 0"
      - "status becomes WITHDRAWN"
      - "Artwork.status reverts to AUTHENTICATED when the withdrawal happened before allocation, else to HELD"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/offerings/{id}/abandon"
    description: "Abandon a filed but unallocated offering and return the artwork to the AUTHENTICATED fork point"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Offering
    side_effects:
      - "status becomes OFFERING_ABANDONED"
      - "Artwork.status becomes AUTHENTICATED"
      - "Offering.version incremented by 1"

  - method: GET
    path: "/api/offerings/{id}/share-ledger"
    description: "Read the per-investor share ledger of the offering, one row per investor with a nonzero accepted holding, ordered by the investor's earliest accepted Subscription.created_at ASC then created_at_seq ASC"
    roles: [Investor, IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: []
    output: "{ rows: array, total_accepted_cents: integer, total_distributed_cents: integer }"
    side_effects: []

  - method: GET
    path: "/api/offerings/{id}/valuation"
    description: "Read both valuation variants side by side"
    roles: [Investor, IssuerOps, ComplianceOfficer, TransferAgent]
    code: 200
    input: []
    output: "{ legacy_value_per_share_cents: integer, restated_value_per_share_cents: integer, valuation_delta_cents: integer, valuation_basis_filed_at: datetime }"
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/cost-lots"
    description: "Journal a storage, insurance, conservation or other cost lot against the offering"
    roles: [IssuerOps]
    code: 201
    input: [lot_type, cost_amount_cents, incurred_on]
    output: Lot
    side_effects:
      - "pass_through_allowed and pass_through_amount_cents computed by the cost pass-through rule"
      - "Offering.custody_cost_ledger_cents increased by pass_through_amount_cents"

  - method: GET
    path: "/api/offerings/{id}/cost-lots"
    description: "List every cost lot journaled against the offering"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["lot_type?", "pass_through_allowed?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/accrue-fees"
    description: "Accrue the management fee or the profit participation for the offering"
    roles: [IssuerOps]
    code: 201
    input: [accrual_type]
    output: "{ accrual_id: string, basis_value_cents: integer, presentation_amount_cents: integer, settle_amount_cents: integer, accrued_at: datetime }"
    side_effects:
      - "A FeeAccrual row is appended carrying both the round_half_up presentation figure and the floor settlement figure"

  - method: GET
    path: "/api/offerings/{id}/fee-accruals"
    description: "List every fee accrual recorded against the offering"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["accrual_type?", "limit?", "offset?"]
    output: FeeAccrual[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/reports"
    description: "File an ongoing investor report against the offering"
    roles: [IssuerOps, ComplianceOfficer]
    code: 201
    input: [report_kind, as_of_date, "value_per_share_cents?"]
    output: OfferingReport
    side_effects:
      - "filed_at stamped from the logical clock"
      - "shareholder_count computed from subscriptions with accepted_shares >= 1"
      - "is_quarter_marker computed against the SELECTED appraisals' filed_at window"

  - method: GET
    path: "/api/offerings/{id}/reports"
    description: "List every report filed against the offering"
    roles: [Investor, IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["report_kind?", "is_quarter_marker?", "limit?", "offset?"]
    output: OfferingReport[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/reconcile-cadence"
    description: "Run the appraisal-cadence and stale-order reconciliation pass for the offering"
    roles: [IssuerOps, PlatformAdmin]
    code: 200
    input: []
    output: "{ appraisal_flag: string, gap_days: integer, lapsed_transfer_orders: integer, next_appraisal_due_at: datetime }"
    side_effects:
      - "Every TransferOrder of the offering open at least 30 consecutive days moves to LAPSED"

  - method: POST
    path: "/api/offerings/{id}/insurer-quote"
    description: "Record a market insurer quote for the offering, before any policy is created"
    roles: [IssuerOps]
    code: 201
    input: [carrier_name, quoted_annual_premium_cents]
    output: "{ quote_reference: string }"
    side_effects: []

  - method: GET
    path: "/api/offerings/{id}/subscriptions"
    description: "List every subscription taken against the offering (reverse-reachability read for Subscription.offering_id)"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/holding-decisions"
    description: "Raise a holding decision for the offering: HOLD executes immediately as APPROVED and cycles the offering back to ALLOCATED; SELL parks at PENDING until approved"
    roles: [IssuerOps]
    code: 201
    input: [decision_type, "proposed_gross_cents?"]
    output: HoldingDecision
    side_effects:
      - "decision_type HOLD: status=APPROVED, Offering.status becomes ALLOCATED"
      - "decision_type SELL: status=PENDING, Offering.status unchanged"

  - method: GET
    path: "/api/offerings/{id}/holding-decisions"
    description: "List every holding decision raised against the offering"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HoldingDecision[]
    side_effects: []

  - method: GET
    path: "/api/offerings/{id}/custody-records"
    description: "List every custody record of the offering (reverse-reachability read for CustodyRecord.offering_id)"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustodyRecord[]
    side_effects: []

  - method: POST
    path: "/api/offerings/{id}/custody-records"
    description: "Open a custody record for the offering's artwork at a named facility"
    roles: [IssuerOps]
    code: 201
    input: ["custodian_name", "facility_code", "is_freeport", "custodian_dea_registered?"]
    output: CustodyRecord
    side_effects: ["status=PENDING, custody_started_at=null"]

  - method: POST
    path: "/api/offerings/{id}/insurance-policies"
    description: "Create an insurance policy for the offering's artwork"
    roles: [IssuerOps]
    code: 201
    input: [carrier_name, coverage_cents, annual_premium_cents]
    output: InsurancePolicy
    side_effects: ["status=PENDING"]

  - method: POST
    path: "/api/offerings/{id}/distributions/{distributionId}/pay"
    description: "Pay a calculated distribution out of the platform account to the offering's holders"
    roles: [IssuerOps]
    code: 200
    input: [expected_offering_version]
    output: Distribution
    side_effects:
      - "status becomes PAID"
      - "PlatformAccount.balance_cents debited by investor_residual_cents; total_paid_out_cents increased by the same amount"
      - "Offering.version incremented by 1"

  - method: GET
    path: "/api/offerings/{id}/distributions"
    description: "List every distribution computed against the offering"
    roles: [Investor, IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  # --- Subscription ---
  - method: POST
    path: "/api/subscriptions"
    description: "Submit a subscription for shares in an offering; the implicit suitability screen runs unless the body names an explicit screen outcome"
    roles: [Investor]
    code: 201
    input: [offering_id, investor_id, requested_shares, "screened?"]
    output: Subscription
    side_effects:
      - "status=RECEIVED, accepted_shares=0, waitlist_rank=null"
      - "created_at_seq stamped by the server"
      - "Offering.accepted_shares and unsubscribed_shares recomputed"

  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Read one subscription"
    roles: [Investor, IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions filtered by offering, investor or status (reverse-reachability read for both Subscription foreign keys)"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin, Investor]
    code: 200
    input: ["offering_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/api/subscriptions/{id}/screen"
    description: "Record an explicit suitability screen outcome for a received subscription"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: Subscription
    side_effects:
      - "outcome VERIFIED: status becomes SUBSCRIBED; Investor.suitability_status becomes APPROVED with verified and expiry stamps; Investor.is_accredited set when the offering is EXEMPT_REG_D"
      - "outcome DISPUTED: status becomes REJECTED and any collected funds are refunded"
      - "Offering.accepted_shares and unsubscribed_shares recomputed"

  - method: POST
    path: "/api/subscriptions/{id}/collect"
    description: "Collect investor funds against a subscription into the offering's cash ledger"
    roles: [IssuerOps]
    code: 200
    input: [amount_cents]
    output: Subscription
    side_effects:
      - "collected_subscription_cents increased by amount_cents"
      - "Offering.cash_ledger_cents increased by the same amount"
      - "PlatformAccount.balance_cents credited; investor_funds_held_cents increased"

  - method: POST
    path: "/api/subscriptions/{id}/withdraw"
    description: "Investor withdrawal from a subscription during the rescission window"
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "status becomes WITHDRAWN"
      - "refunded_cents set to collected_subscription_cents"
      - "Offering.accepted_shares and cash_ledger_cents recomputed"

  # --- CustodyRecord ---
  - method: GET
    path: "/api/custody-records/{id}"
    description: "Read one custody record"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CustodyRecord
    side_effects: []

  - method: POST
    path: "/api/custody-records/{id}/receive"
    description: "Receive the artwork into custody; first receipt starts the offering's holding clock, a re-receipt after a release is the revision loop"
    roles: [IssuerOps]
    code: 200
    input: [expected_offering_version]
    output: CustodyRecord
    side_effects:
      - "status becomes IN_CUSTODY; custody_started_at stamped from the logical clock"
      - "When the offering's holding_clock_started_at was null it is stamped now, and holding_period_end_at = holding_clock_started_at + hold_period_days days"
      - "On a RELEASED to IN_CUSTODY re-receipt the clock is re-stamped and holding_period_end_at recomputed"
      - "Offering.status becomes HELD; Artwork.status becomes HELD"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/custody-records/{id}/release"
    description: "Release the artwork out of custody and clear the offering's holding clock"
    roles: [IssuerOps]
    code: 200
    input: [expected_offering_version]
    output: CustodyRecord
    side_effects:
      - "status becomes RELEASED; custody_ended_at stamped"
      - "Offering.holding_clock_started_at and holding_period_end_at reset to null"
      - "Offering.version incremented by 1"

  # --- InsurancePolicy ---
  - method: GET
    path: "/api/insurance-policies/{id}"
    description: "Read one insurance policy"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: "/api/offerings/{id}/insurance-policies"
    description: "List every insurance policy of the offering (reverse-reachability read for InsurancePolicy.offering_id)"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  - method: POST
    path: "/api/insurance-policies/{id}/bind"
    description: "Bind a policy into FORCE; any sibling policy already in FORCE becomes LAPSED"
    roles: [IssuerOps]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects:
      - "status becomes FORCE"
      - "Every other InsurancePolicy of the same offering in FORCE becomes LAPSED"

  - method: POST
    path: "/api/insurance-policies/{id}/lapse"
    description: "Lapse a policy in FORCE and roll every cost lot of the offering back to no pass-through"
    roles: [IssuerOps]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects:
      - "status becomes LAPSED"
      - "Every Lot of the offering recomputes: pass_through_allowed becomes false and pass_through_amount_cents becomes 0"

  # --- HoldingDecision ---
  - method: GET
    path: "/api/holding-decisions/{id}"
    description: "Read one holding decision"
    roles: [IssuerOps, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: HoldingDecision
    side_effects: []

  - method: PATCH
    path: "/api/holding-decisions/{id}/approve"
    description: "Approve a holding decision; a SELL approval is refused before the holding period ends"
    roles: [IssuerOps]
    code: 200
    input: [expected_offering_version]
    output: HoldingDecision
    side_effects:
      - "status becomes APPROVED"
      - "decision_type SELL: Offering.status and Artwork.status become SALE_PENDING"
      - "Offering.version incremented by 1"

  - method: PATCH
    path: "/api/holding-decisions/{id}/reject"
    description: "Reject an approved or pending holding decision and roll the offering back to ALLOCATED"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_offering_version]
    output: HoldingDecision
    side_effects:
      - "status becomes REJECTED"
      - "Offering.status reverts to ALLOCATED and Artwork.status reverts to HELD"
      - "Offering.version incremented by 1"

  - method: PATCH
    path: "/api/holding-decisions/{id}/revise"
    description: "Revise a rejected holding decision and return it to PENDING for another approval round"
    roles: [IssuerOps]
    code: 200
    input: [proposed_gross_cents]
    output: HoldingDecision
    side_effects:
      - "status becomes PENDING"
      - "proposed_gross_cents replaced"

  - method: POST
    path: "/api/holdings/{id}/execute"
    description: "Execute an approved sale; proceeds at or above reserve close the offering and compute the distribution waterfall, proceeds below reserve fail the decision"
    roles: [IssuerOps]
    code: 200
    input: [executed_gross_cents, expected_offering_version]
    output: HoldingDecision
    side_effects:
      - "At or above reserve: status becomes EXECUTED, a Distribution is created in CALCULATED, Offering.status becomes CLOSED, Artwork.status becomes SOLD"
      - "Below reserve: status becomes FAILED, Offering.status reverts to ALLOCATED, Artwork.status reverts to HELD, no Distribution created"
      - "Offering.version incremented by 1"

  # --- TransferOrder ---
  - method: POST
    path: "/api/transfer-orders"
    description: "Post a secondary-market sell order for shares already held"
    roles: [Investor]
    code: 201
    input: [offering_id, seller_id, shares, limit_price_cents]
    output: TransferOrder
    side_effects:
      - "status=OPEN, buyer_id unbound, bid_price_cents null"
      - "Any Lot of the offering that had pass-through enabled recomputes to false while this order is OPEN"

  - method: GET
    path: "/api/transfer-orders"
    description: "List transfer orders filtered by offering, seller, buyer or status (reverse-reachability read for all three TransferOrder foreign keys)"
    roles: [Investor, IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: ["offering_id?", "seller_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: TransferOrder[]
    side_effects: []

  - method: GET
    path: "/api/transfer-orders/{id}"
    description: "Read one transfer order"
    roles: [Investor, IssuerOps, ComplianceOfficer, TransferAgent, PlatformAdmin]
    code: 200
    input: []
    output: TransferOrder
    side_effects: []

  - method: POST
    path: "/api/transfer-orders/{id}/accept"
    description: "Accept a resting transfer order: the liquidity gate runs first, then the buyer share cap, and an empty open-order queue selects the fallback path"
    roles: [Investor]
    code: 200
    input: [buyer_id, bid_price_cents]
    output: TransferOrder
    side_effects:
      - "status becomes MATCHED, buyer_id bound, execution_price_cents = limit_price_cents"

  - method: POST
    path: "/api/transfer-orders/{id}/repost"
    description: "Repost a matched or lapsed order back onto the book"
    roles: [Investor, IssuerOps]
    code: 200
    input: []
    output: TransferOrder
    side_effects:
      - "status becomes OPEN and buyer_id unbound"
      - "A lapsed order that is reposted is no longer LAPSED"

  - method: POST
    path: "/api/transfer-orders/{id}/approve-transfer"
    description: "Settle a secondary transfer through the transfer agent; requires the holding period to have ended"
    roles: [TransferAgent]
    code: 200
    input: [expected_offering_version]
    output: TransferOrder
    side_effects:
      - "status becomes EXECUTED"
      - "execution_price_cents = limit_price_cents when the order was MATCHED, else max(bid_price_cents, limit_price_cents)"
      - "The seller's accepted shares decrease by shares and the buyer's increase by shares"
      - "Offering.version incremented by 1"

  - method: POST
    path: "/api/transfer-orders/{id}/cancel"
    description: "Cancel a transfer order"
    roles: [Investor, IssuerOps]
    code: 200
    input: []
    output: TransferOrder
    side_effects: ["status becomes CANCELLED"]

  # --- PlatformAccount ---
  - method: POST
    path: "/api/platform-accounts"
    description: "Open the platform's segregated cash account"
    roles: [PlatformAdmin]
    code: 201
    input: [account_name]
    output: PlatformAccount
    side_effects: ["balance_cents=0, investor_funds_held_cents=0, total_paid_out_cents=0"]

  - method: GET
    path: "/api/platform-accounts/{id}"
    description: "Read the platform account ledger balances"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PlatformAccount
    side_effects: []

  # --- Test-driving ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving endpoint: move the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Every deadline, expiry, cadence and holding-period comparison reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent or blank on a non-anonymous endpoint"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting X-User-Role does not appear in the endpoint's declared roles, or the acting investor is not the owner of the resource it is acting on"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or body identifier does not resolve to a stored row of the expected entity type"

  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "No route is declared for the requested path"

  - id: ERR_METHOD_NOT_ALLOWED
    http: 405
    condition: "The path is declared but not for the requested HTTP method"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested operation is a declared transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's stored version"

  - id: ERR_INVESTOR_INELIGIBLE
    http: 400
    condition: "Investor eligibility screen failed: non-US residency, or age under 18 at the current logical clock"

  - id: ERR_OFFERING_NOT_AVAILABLE_IN_JURISDICTION
    http: 422
    condition: "The investor is a US citizen and a US resident; this offering is not offered in its own jurisdiction"

  - id: ERR_OFFERING_FULL
    http: 409
    condition: "The subscription or transfer would push an investor's holding above total_shares * registration_cap_pct / 10000, and the investor is not the empty-queue fallback buyer"

  - id: ERR_LIQUIDITY_WINDOW_LOCKED
    http: 409
    condition: "The secondary seller's shares are strictly less than liquidity_ratio_bps of the offering's open share volume"

  - id: ERR_HOLD_PERIOD_ACTIVE
    http: 409
    condition: "Sale approval attempted before holding_period_end_at or while it is null, or a secondary transfer attempted while the holding clock has started"

  - id: ERR_MINIMUM_NOT_MET
    http: 422
    condition: "Allocation attempted with zero accepted shares across the offering"

  - id: ERR_QUALIFICATION_LAPSED
    http: 409
    condition: "Allocation, waitlist promotion or qualification filing attempted after qualification_deadline_at"

  - id: ERR_APPRAISAL_CADENCE
    http: 409
    condition: "A new appraisal was filed fewer than 90 days after the artwork's last SELECTED appraisal"

  - id: ERR_APPRAISAL_STALE
    http: 409
    condition: "A released custody record was re-received without a SELECTED appraisal filed strictly after its custody_ended_at"

  - id: ERR_APPRAISAL_MISSING
    http: 409
    condition: "An insurance policy was bound before the artwork carried any SELECTED appraisal"

  - id: ERR_INSUFFICIENT_COVERAGE
    http: 422
    condition: "coverage_cents is below the artwork's last SELECTED appraised value at binding"

  - id: ERR_COVERAGE_EXCEEDS_VALUE
    http: 422
    condition: "coverage_cents exceeds 120 percent of the artwork's last SELECTED appraised value at binding"

  - id: ERR_ACCOUNT_UNDERFUNDED
    http: 409
    condition: "A debit would take PlatformAccount.balance_cents below zero"

  - id: ERR_SOLE_POLICY_CANNOT_LAPSE
    http: 409
    condition: "The named policy is the only FORCE policy of the offering and no replacement policy is on file"

  - id: ERR_POLICY_INTERVAL_OVERLAP
    http: 409
    condition: "A policy was bound while another policy of the same offering is already in status FORCE, so the two coverage periods would intersect"

  - id: ERR_CUSTODY_INTERVAL_OVERLAP
    http: 409
    condition: "A custody record was received while another custody record of the same offering is already in status IN_CUSTODY, so the two custody periods would intersect"

  - id: ERR_WAITLIST_EMPTY
    http: 409
    condition: "Waitlist promotion attempted with no subscription in status WAITLISTED for the offering"

  - id: ERR_REPORT_WINDOW_FORECLOSED
    http: 409
    condition: "An offering report's as_of_date precedes the offering's latest report, or post-dates current_utc"

  - id: ERR_ACCRUAL_TYPE_UNSUPPORTED
    http: 422
    condition: "accrual_type is PROFIT_PARTICIPATION while the offering's sale cycle has not closed, so no distributable_proceeds_cents exists to take the participating share of"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, or a numeric field is outside its declared range"

  - id: ERR_VALUE_REJECTED
    http: 400
    condition: "An enum-typed body field carries a value outside its declared members"

  - id: ERR_CASCADE_REJECTED
    http: 409
    condition: "A cascaded child mutation would violate its own invariants, so the originating transition is refused and no partial write is applied"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller. May only register an investor account, which is the platform's single public onboarding surface."
    identity: opaque
    exclusive_operations:
      - "POST /api/investors — register an investor account"
    shared_operations: []

  - name: Investor
    description: "A registered investor acting as itself. X-User-ID equals the id of the Investor row it acts as, so ownership checks compare X-User-ID against the resource's investor_id, seller_id or buyer_id."
    identity: entity_backed:Investor
    exclusive_operations:
      - "POST /api/subscriptions — submit a subscription"
      - "POST /api/subscriptions/{id}/withdraw — rescind a subscription"
      - "POST /api/transfer-orders — post a secondary sell order"
    shared_operations:
      - "GET /api/offerings/{id}/valuation"
      - "GET /api/offerings/{id}/reports"
      - "GET /api/offerings/{id}/distributions"
      - "GET /api/subscriptions/{id}"
      - "GET /api/subscriptions"
      - "GET /api/transfer-orders"
      - "GET /api/transfer-orders/{id}"
      - "POST /api/transfer-orders/{id}/accept"
      - "POST /api/transfer-orders/{id}/repost"
      - "POST /api/transfer-orders/{id}/cancel"

  - name: IssuerOps
    description: "Issuer-side operations desk: acquisition, custody and cost administration, and the propose step of the sale decision chain. Stands on the propose side of the segregation of duties rule."
    identity: opaque
    exclusive_operations:
      - "POST /api/artists"
      - "POST /api/artworks"
      - "POST /api/artworks/{id}/asset-reports"
      - "POST /api/artworks/{id}/appraisals"
      - "POST /api/artworks/{id}/offerings"
      - "POST /api/offerings/{id}/custody-records"
      - "POST /api/custody-records/{id}/receive"
      - "POST /api/custody-records/{id}/release"
      - "POST /api/offerings/{id}/insurance-policies"
      - "POST /api/insurance-policies/{id}/bind"
      - "POST /api/insurance-policies/{id}/lapse"
      - "POST /api/offerings/{id}/cost-lots"
      - "POST /api/offerings/{id}/insurer-quote"
      - "POST /api/offerings/{id}/accrue-fees"
      - "POST /api/offerings/{id}/holding-decisions"
      - "PATCH /api/holding-decisions/{id}/approve"
      - "PATCH /api/holding-decisions/{id}/revise"
      - "POST /api/holdings/{id}/execute"
      - "POST /api/subscriptions/{id}/collect"
    shared_operations:
      - "POST /api/offerings/{id}/reports"
      - "POST /api/offerings/{id}/reconcile-cadence"
      - "POST /api/offerings/{id}/insurer-quote"
      - "POST /api/transfer-orders/{id}/repost"
      - "POST /api/transfer-orders/{id}/cancel"

  - name: ComplianceOfficer
    description: "Investor-protection officer: screening, offering qualification and allocation, withdrawal, and the overturn step of the sale decision chain. Stands on the overturn side of the segregation of duties rule and may never approve a decision it could have created."
    identity: opaque
    exclusive_operations:
      - "POST /api/subscriptions/{id}/screen"
      - "POST /api/offerings/{id}/abandon"
      - "POST /api/investors/{id}/revoke-suitability"
      - "POST /api/offerings/{id}/qualification-filing"
      - "POST /api/offerings/{id}/allocate"
      - "POST /api/offerings/{id}/waitlist-promotion"
      - "POST /api/offerings/{id}/waitlist-demotion"
      - "POST /api/offerings/{id}/withdraw"
      - "PATCH /api/holding-decisions/{id}/reject"
    shared_operations:
      - "POST /api/offerings/{id}/reports"

  - name: TransferAgent
    description: "Independent transfer agent that settles secondary share movements. Segregated from both the seller's desk and the issuer's operations desk so it cannot have created the order it settles."
    identity: opaque
    exclusive_operations:
      - "POST /api/transfer-orders/{id}/approve-transfer"
    shared_operations: []

  - name: PlatformAdmin
    description: "Platform operator. May configure the cash account and the logical clock, and may invoke reconciliation for any offering. Cannot screen investors, allocate shares, or settle transfers."
    identity: opaque
    exclusive_operations:
      - "POST /api/platform-accounts"
      - "GET /api/platform-accounts/{id}"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/artists"
      - "POST /api/artworks"
      - "POST /api/offerings/{id}/reconcile-cadence"

  - name: System
    description: "Server-side actor used for automatic transitions that no HTTP caller triggers directly: allocation-pass expiries, transfer-order lapse, holding-clock restamping and cascade propagation."
    identity: opaque
    exclusive_operations:
      - "system — expire past-deadline subscriptions during allocation"
      - "system — lapse transfer orders open at least 30 consecutive days"
    shared_operations: []