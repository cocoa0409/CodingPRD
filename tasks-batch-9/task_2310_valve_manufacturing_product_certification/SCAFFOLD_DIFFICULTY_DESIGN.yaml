      - name: production_release_blocked_by_withdrawn_pinned_model
        grounds:
          - validations[priority=75]
          - entities.EngineeredOrder.spec_stale
          - state_machines.ValveModel.RELEASED_to_WITHDRAWN
        distinguishing_aspect: |
          Entity pair EngineeredOrder <- ValveModel, mediated by the revision pinned at APPROVE: the order is
          APPROVED and within its credit limit, but the model it pinned has since been WITHDRAWN, so spec_stale
          flips true and RELEASE_TO_PRODUCTION is refused. No unit, lot or license participates.
        test_recipe:
          setup:
            - "A RELEASED BALL model at class 300 with no units of any kind."
            - "An order for 4 units at 500,000 cents against a 5,000,000 cent credit limit, APPROVED (pinning spec_revision 1)."
            - "The model is then WITHDRAWN, which recomputes the order's spec_stale to true."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-WD", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-WD", model_id: "${m_id}", ordered_qty: 4, unit_price_cents: 500000, customer_credit_limit_cents: 5000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "APPROVE" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "WITHDRAW" }
              as: QualityManager
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/lifecycle-actions"
              payload: { action: "RELEASE_TO_PRODUCTION" }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PINNED_SPEC_STALE"
            - "HTTP status == 409"
            - "ValveModel.${m_id}.status == WITHDRAWN"
            - "EngineeredOrder.${o_id}.pinned_model_spec_revision == 1"
            - "EngineeredOrder.${o_id}.spec_stale == true"
            - "EngineeredOrder.${o_id}.status == APPROVED"

