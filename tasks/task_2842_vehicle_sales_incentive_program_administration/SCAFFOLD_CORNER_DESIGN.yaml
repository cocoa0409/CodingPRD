            - "${s_residual} == 0 — a CUSTOMER_CASH program supports no leases, so the residual projection is zero rather than absent"
            - "${s2_committed} == ${s_committed}, ${s2_paid} == ${s_paid}, ${s2_units} == ${s_units} and ${s2_spend} == ${s_spend} with ${p_version} unchanged between the two reads: the computed read is pure, and it is readable by a second role"

