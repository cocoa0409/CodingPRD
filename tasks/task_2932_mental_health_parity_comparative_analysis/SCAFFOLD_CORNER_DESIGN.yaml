            - "both treatment-limitation creates -> 201; GET /parity/classifications/${cls_id}/treatment-limitations returns total_count == 2"
            - "both nqtl-item creates -> 201 with distinct nqtl_type values; GET /parity/nqtl-items?classification_id=${cls_id} returns total_count == 2"
            - "both parity-test creates -> 201; ParityTest.${pt_a_id}.basis == PLAN_PAYMENTS and ParityTest.${pt_b_id}.basis == CLAIMS_COUNT, both status COMPUTED"
            - "ParityTest.${pt_a_id}.substantially_all_ratio == 0.666667 and ParityTest.${pt_b_id}.substantially_all_ratio == 0.666667"
