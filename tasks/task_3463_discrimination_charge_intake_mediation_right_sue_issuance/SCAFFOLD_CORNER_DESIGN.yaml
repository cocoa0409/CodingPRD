              payload: { outcome: "SETTLED", settlement_amount_cents: 500000 }
              as: Mediator
          trigger:
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /eeoc/charges/${chg_wn}/vacate-settlement"
              payload: { reason: "too late" }
