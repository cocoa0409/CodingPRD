            - "requisition status == FILLED (captured ${req_status}; traversed READY transiently)"
            - "gap status == RESOLVED and resolved_by_assignment_id == ${fill_id} (captured ${gap_status}, ${gap_resolver})"
            - "auto-fill assignment: origin == LOCUM_FILL, physician_id == ${l1_id}, status == SCHEDULED, projected_pay_cents == 50000 (LOCUM: no moonlight premium)"
            - "slot status == ASSIGNED (captured ${slot_status})"
            - "CallProgram.${prog_id}.payroll_reserved_cents == 50000"

      - name: unavailability_approval_cancellation_cascade
        grounds:
          - state_machines.UnavailabilityWindow.REQUESTED_to_APPROVED
          - state_machines.CallAssignment.SCHEDULED_to_CANCELLED
          - state_machines.CoverageGap.OPEN
        distinguishing_aspect: |
          Depth-2+ chain from window approval: approve (trigger) cancels each conflicting
          SCHEDULED assignment (hop 1), and each cancellation itself opens the slot, creates a
          CoverageGap(ASSIGNMENT_CANCELLED) and releases the payroll reserve (hop 2) — caused by
          window approval, a different trigger than the credentialing completion cascade.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-08..2026-09-10, 1 primary per weekday, budget 1000000; P1 assigned to the 2026-09-09 slot (reserve 50000)"
            - "P1 has requested an unavailability window 2026-09-09..2026-09-10 covering that assignment"
