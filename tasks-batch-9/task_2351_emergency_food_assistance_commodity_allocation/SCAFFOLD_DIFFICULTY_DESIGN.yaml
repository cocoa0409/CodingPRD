# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2351 — Emergency Food Assistance Commodity Allocation
#
# 9 rule_id blocks / 19 instances. Every literal in an assert was computed by
# executing the matching §1.3 formula with the fixture values pinned in setup.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: allocation_formula_standard_vs_hold_harmless_diverges_on_same_inputs
        grounds:
          - calculations.agency_case_allocation
          - entities.AllocationCycle.fields.formula_variant
          - entities.AgencyAllocation.fields.floor_cases
          - entities.AgencyAllocation.fields.allocated_cases
          - state_machines.AllocationCycle.DRAFT_to_ALLOCATED
        distinguishing_aspect: "Entity domain is entitlement quota on AgencyAllocation: three agencies with identical poverty and prior-distribution inputs receive 441/300/260 cases under STANDARD and 420/342/239 cases under HOLD_HARMLESS, so the variant switch alone moves 21 cases from agency one and 21 from agency three to agency two."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three service areas with poverty_population 40000 / 25000 / 35000, each hosting exactly one agency."
            - "Three agencies, all ELIGIBLE, with prior_period_pounds_distributed 120000 / 90000 / 30000 and prior_period_allocated_cases 400 / 380 / 200."
            - "Two DRAFT cycles over the same agency population, allocatable_cases 1001 each, one STANDARD and one HOLD_HARMLESS."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area One", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa1: $.data.id }
            - call: "POST /efap/service-areas"
              payload: { name: "Area Two", county_code: "C002", poverty_population: 25000, urban_rural: "RURAL" }
              as: StateAdmin
              captures: { sa2: $.data.id }
            - call: "POST /efap/service-areas"
              payload: { name: "Area Three", county_code: "C003", poverty_population: 35000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa3: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency One", service_area_id: "${sa1}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 120000, prior_period_allocated_cases: 400 }
              as: StateAdmin
              captures: { ag1: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Two", service_area_id: "${sa2}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 90000, prior_period_allocated_cases: 380 }
              as: StateAdmin
              captures: { ag2: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Three", service_area_id: "${sa3}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 30000, prior_period_allocated_cases: 200 }
              as: StateAdmin
              captures: { ag3: $.data.id }
            - call: "POST /efap/agencies/${ag1}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 4 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag1}/agreement-renewals"
              payload: { agreement_start_date: "2026-07-01", agreement_end_date: "2027-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag2}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 3 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag2}/agreement-renewals"
              payload: { agreement_start_date: "2026-07-01", agreement_end_date: "2027-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag3}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 2 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag3}/agreement-renewals"
              payload: { agreement_start_date: "2026-07-01", agreement_end_date: "2027-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/commodities"
              payload: { code: "CANNED_PEACHES", name: "Canned Peaches", storage_class: "DRY", net_weight_lbs_per_case: 24.375, cases_per_pallet: 60, entitlement_value_cents_per_case: 1800, shelf_life_days: 730, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_peach: $.data.id }
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27STD", formula_variant: "STANDARD", allocatable_cases: 1001, admin_funds_pool_cents: 5000000, offered_commodity_codes: ["CANNED_PEACHES"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-20T00:00:00Z" }
              as: StateAdmin
              captures: { cy_std: $.data.id }
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27HH", formula_variant: "HOLD_HARMLESS", allocatable_cases: 1001, admin_funds_pool_cents: 5000000, offered_commodity_codes: ["CANNED_PEACHES"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-20T00:00:00Z" }
              as: StateAdmin
              captures: { cy_hh: $.data.id }
          trigger:
            - call: "POST /efap/allocation-cycles/${cy_std}/compute-allocations"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/allocation-cycles/${cy_hh}/compute-allocations"
              payload: {}
              as: StateAdmin
          assert:
            - "AgencyAllocation(cycle_id=${cy_std}, agency_id=${ag1}).raw_score == 0.44 and poverty_share == 0.4 and prior_share == 0.5"
            - "AgencyAllocation(cycle_id=${cy_std}, agency_id=${ag1}).allocated_cases == 441 and floor_cases == 0"
            - "AgencyAllocation(cycle_id=${cy_std}, agency_id=${ag2}).allocated_cases == 300 and floor_cases == 0"
            - "AgencyAllocation(cycle_id=${cy_std}, agency_id=${ag3}).allocated_cases == 260 and floor_cases == 0"
            - "AgencyAllocation(cycle_id=${cy_hh}, agency_id=${ag1}).allocated_cases == 420 and floor_cases == 360"
            - "AgencyAllocation(cycle_id=${cy_hh}, agency_id=${ag2}).allocated_cases == 342 and floor_cases == 342"
            - "AgencyAllocation(cycle_id=${cy_hh}, agency_id=${ag3}).allocated_cases == 239 and floor_cases == 180"
            - "AllocationCycle.${cy_std}.total_allocated_cases == 1001 and AllocationCycle.${cy_hh}.total_allocated_cases == 1001"
            - "AllocationCycle.${cy_std}.status == ALLOCATED and AllocationCycle.${cy_hh}.status == ALLOCATED"
            - "AllocationCycle.${cy_std}.eligible_agency_count == 3"

      - name: lot_monitor_turnover_vs_shelf_life_flags_different_lots
        grounds:
          - calculations.lot_monitor_flag
          - entities.Warehouse.fields.monitor_policy
          - entities.InventoryLot.fields.slow_moving_index
          - entities.InventoryLot.fields.monitor_flag
          - state_machines.InventoryLot.AVAILABLE_to_WATCH
        distinguishing_aspect: "Entity domain is staleness scoring on InventoryLot, not quota on AgencyAllocation: two lots with identical receipt, shipment and date data score 0.6700 (SLOW_MOVING, WATCH) under TURNOVER_BASED and 0.5881 (NONE, AVAILABLE) under SHELF_LIFE_BASED."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z while the lots are posted, then moved to 2026-08-15T00:00:00Z for the monitor run (days_on_hand == 75)."
            - "Warehouse North uses monitor_policy TURNOVER_BASED; Warehouse South uses SHELF_LIFE_BASED."
            - "One BULK_RICE lot per warehouse, cases_received 100, pack_date 2026-05-01, best_by_date 2026-11-01 (shelf span 184 days), 40 cases already shipped out by an accepted transfer so turnover_ratio == 0.4."
            - "One ELIGIBLE agency to accept the two transfers."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area One", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa1: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency One", service_area_id: "${sa1}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 120000, prior_period_allocated_cases: 400 }
              as: StateAdmin
              captures: { ag1: $.data.id }
            - call: "POST /efap/agencies/${ag1}/civil-rights-trainings"
              payload: { completed_at: "2026-06-01T00:00:00Z", attendee_count: 4 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag1}/agreement-renewals"
              payload: { agreement_start_date: "2026-06-01", agreement_end_date: "2027-05-31" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh_n: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH South", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "SHELF_LIFE_BASED" }
              as: StateAdmin
              captures: { wh_s: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh_n}", federal_lot_code: "FL-N-001", cases_received: 100, pack_date: "2026-05-01", best_by_date: "2026-11-01" }
              as: StateAdmin
              captures: { lot_n: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh_s}", federal_lot_code: "FL-S-001", cases_received: 100, pack_date: "2026-05-01", best_by_date: "2026-11-01" }
              as: StateAdmin
              captures: { lot_s: $.data.id }
            - call: "POST /efap/inventory-lots/${lot_n}/post"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/inventory-lots/${lot_s}/post"
              payload: {}
              as: StateAdmin
            - call: "GET /efap/inventory-lots/${lot_n}"
              payload: {}
              as: StateAdmin
              captures: { lot_n_v: $.data.version }
            - call: "POST /efap/inventory-transfers"
              payload: { from_lot_id: "${lot_n}", to_agency_id: "${ag1}", cases: 40, expected_inventory_lot_version: "${lot_n_v}" }
              as: StateAdmin
              captures: { tr_n: $.data.id }
            - call: "POST /efap/inventory-transfers/${tr_n}/accept"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${ag1}"
            - call: "GET /efap/inventory-lots/${lot_s}"
              payload: {}
              as: StateAdmin
              captures: { lot_s_v: $.data.version }
            - call: "POST /efap/inventory-transfers"
              payload: { from_lot_id: "${lot_s}", to_agency_id: "${ag1}", cases: 40, expected_inventory_lot_version: "${lot_s_v}" }
              as: StateAdmin
              captures: { tr_s: $.data.id }
            - call: "POST /efap/inventory-transfers/${tr_s}/accept"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${ag1}"
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/inventory-monitor-runs"
              payload: {}
              as: StateAdmin
          assert:
            - "InventoryLot.${lot_n}.slow_moving_index == 0.67"
            - "InventoryLot.${lot_n}.monitor_flag == SLOW_MOVING and InventoryLot.${lot_n}.status == WATCH"
            - "InventoryLot.${lot_s}.slow_moving_index == 0.5881"
            - "InventoryLot.${lot_s}.monitor_flag == NONE and InventoryLot.${lot_s}.status == AVAILABLE"
            - "InventoryLot.${lot_n}.cases_on_hand == 60 and InventoryLot.${lot_n}.cases_shipped_to_date == 40"
            - "InventoryLot.${lot_n}.last_monitored_at == 2026-08-15T00:00:00Z and InventoryLot.${lot_s}.last_monitored_at == 2026-08-15T00:00:00Z"

  - rule_id: combinatorial_formula
    instances:

      - name: order_totals_round_each_line_then_sum_mode_b
        grounds:
          - calculations.order_line_pound_conversion
          - entities.OrderLine.fields.line_pounds
          - entities.OrderLine.fields.line_pallets
          - entities.CommodityOrder.fields.total_pounds
          - state_machines.CommodityOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Mode (b) nested-rounding order: rounding each line to 2 decimals before summing yields total_pounds 1302.26 and total_pallets 3, where summing first would yield 1302.25 and 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T00:00:00Z, inside an OPEN order window (2026-08-05 .. 2026-08-20)."
            - "One ELIGIBLE agency with cold_storage_pallet_capacity 10; one warehouse with dry 100 / cold 50 / frozen 20 pallet capacity."
            - "Commodities CANNED_PEACHES (24.375 lb per case, 60 cases per pallet) and FROZEN_CHICKEN (30.125 lb per case, 45 cases per pallet), both offered by the cycle."
            - "Posted lots of 100 cases each, so FEFO can cover 25 peach cases and 23 chicken cases."
            - "A SUBMITTED order carrying three lines: 10 peach cases, 15 peach cases, 23 chicken cases."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area One", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa1: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency One", service_area_id: "${sa1}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 120000, prior_period_allocated_cases: 400 }
              as: StateAdmin
              captures: { ag1: $.data.id }
            - call: "POST /efap/agencies/${ag1}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 4 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/agencies/${ag1}/agreement-renewals"
              payload: { agreement_start_date: "2026-07-01", agreement_end_date: "2027-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /efap/commodities"
              payload: { code: "CANNED_PEACHES", name: "Canned Peaches", storage_class: "DRY", net_weight_lbs_per_case: 24.375, cases_per_pallet: 60, entitlement_value_cents_per_case: 1800, shelf_life_days: 730, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_peach: $.data.id }
            - call: "POST /efap/commodities"
              payload: { code: "FROZEN_CHICKEN", name: "Frozen Chicken", storage_class: "FROZEN", net_weight_lbs_per_case: 30.125, cases_per_pallet: 45, entitlement_value_cents_per_case: 2600, shelf_life_days: 365, excess_case_ceiling: 400 }
              as: StateAdmin
              captures: { cm_chicken: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh_n: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_peach}", warehouse_id: "${wh_n}", federal_lot_code: "FL-P-001", cases_received: 100, pack_date: "2026-05-01", best_by_date: "2028-05-01" }
              as: StateAdmin
              captures: { lot_p: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_chicken}", warehouse_id: "${wh_n}", federal_lot_code: "FL-C-001", cases_received: 100, pack_date: "2026-05-01", best_by_date: "2027-05-01" }
              as: StateAdmin
              captures: { lot_c: $.data.id }
            - call: "POST /efap/inventory-lots/${lot_p}/post"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/inventory-lots/${lot_c}/post"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27ROUND", formula_variant: "STANDARD", allocatable_cases: 1001, admin_funds_pool_cents: 5000000, offered_commodity_codes: ["CANNED_PEACHES", "FROZEN_CHICKEN"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-20T00:00:00Z" }
              as: StateAdmin
              captures: { cy1: $.data.id }
            - call: "POST /efap/allocation-cycles/${cy1}/compute-allocations"
              payload: {}
              as: StateAdmin
