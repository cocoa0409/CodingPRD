  - section: consistency_model
    instances:
      - name: reservation_visible_immediately_after_schedule
        claim_type: immediate
        grounds: [entities.Component.fields.reserved_qty, endpoints./copack/production-runs, calculations.inventory_on_hand]
        distinguishing_aspect: "Immediately after scheduling a run, the consumed component's reserved_qty reflects the reservation and on_hand_qty drops accordingly in the same session (immediate consistency)."
        test_recipe:
          setup: ["ALMOND lot 500; schedule a run needing 210 -> reserved 210, on_hand 290"]
          setup_api_calls:
            - call: "POST /copack/customers"
              payload: { name: "Acme", code: "ACME" }
