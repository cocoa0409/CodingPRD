              as: ShopAdmin
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues/${issue_b_id}/return"
              payload: {}
              as: MaterialController
          trigger:
            - call: "GET /weld-shop/shops/${shop_id}/consumable-lots/${lot_a_id}"
              as: Any
              captures: { a_status: $.data.status, a_exposure: $.data.exposed_minutes_total }
            - call: "GET /weld-shop/shops/${shop_id}/consumable-lots/${lot_b_id}"
              as: Any
              captures: { b_status: $.data.status, b_exposure: $.data.exposed_minutes_total }
          assert:
