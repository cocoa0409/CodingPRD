            - call: "POST /network/member-stations/${st_j_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_j_id}"
            - call: "POST /network/member-stations/${st_j_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/member-stations/${st_j_id}/probation"
              payload: { reason_code: "LOCAL_CONTENT_SHORTFALL" }
              as: NetworkComplianceAuditor
            - call: "POST /network/member-stations/${st_j_id}/suspend"
              payload: { suspension_reason: "Unresolved probation" }
              as: NetworkComplianceAuditor
            - call: "POST /network/underwriting-agreements"
              payload: { sponsor_name: "Prairie Motors", station_id: "${st_j_id}", program_code: "NP-1005", ack_script_text: "The best cars in Chicago, call now", consideration_cents: 250000, compliance_segment_count: 1 }
              as: UnderwritingCoordinator
              captures: { uw_j_id: "$.data.id" }
          trigger:
            - call: "POST /network/underwriting-agreements/${uw_j_id}/submit-for-review"
              payload: {}
              as: UnderwritingCoordinator
          assert:
            - "Response is error_id ERR_ACK_LANGUAGE_VIOLATION with http 422"
            - "The reported violation class is SUPERLATIVE, the earliest entry in VIOLATION_ORDER, even though CALL_TO_ACTION also matches"
            - "The state error at priority 10 for the suspended station is NOT the error returned"
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_operations_score_eligibility_floor
        grounds:
          - calculations.station_operations_score
          - calculations.membership_class_assignment
          - state_machines.MemberStation.transitions.UNDER_REVIEW_to_ELIGIBLE
        distinguishing_aspect: "A numeric threshold crossing on operations_score sits one hundredth of a point below the 55.00 restore floor, so a station at 54.99 is refused where one at 55.00 is admitted; the boundary is on the score metric, not on a count."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; one ELIGIBLE station whose coverage_index 18, staffing_index 65 and newsroom_index 100 produce operations_score 54.95, then placed on probation"
