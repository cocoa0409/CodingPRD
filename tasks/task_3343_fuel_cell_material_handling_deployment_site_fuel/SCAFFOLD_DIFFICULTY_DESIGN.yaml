              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/reject"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /api/sites/${site_id}/assessments/${ass}/revise"
              payload: {}
              as: SiteManager
            - call: "PUT /api/assessments/${ass}"
              payload: { forklift_count: 6 }
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
          assert:
            - "after revise: Assessment.${ass}.status == DRAFT"
            - "after update and resubmit: Assessment.${ass}.status == SUBMITTED"
            - "after approve: Assessment.${ass}.status == APPROVED and forklift_count == 6"
            - "Assessment.${ass}.daily_kg_estimate == 43.2 (6 x 8.0 x 0.9 x 1.0 recomputed at update with peak_shift_hours 8 <= 8 so shift_factor 1.0)"
  - rule_id: transitive_cascade
    instances:
      - name: permit_expiry_suspends_station
        grounds:
          - state_machines.Permit.ISSUED_to_EXPIRED
          - state_machines.FuelingStation.CONSTRUCTION_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2 cascade triggered by the clock transition: Permit ISSUED ->
          EXPIRED mutates the Permit (link 1), and that mutation itself forces
          the FuelingStation CONSTRUCTION -> SUSPENDED (link 2). A subsequent
          commission attempt is rejected, proving the cascade froze the station.
        test_recipe:
          setup:
            - "Site with a station in CONSTRUCTION whose FIRE permit expires 2026-10-10; clock advanced past expiry"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-EXP", name: "Expiry Site", address: "5 Permit Way", baseline_labor_rate_per_hour: 27.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-E", location_type: "OUTDOOR", capacity_kg_per_day: 200, storage_capacity_kg: 500, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { station_id: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${station_id}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2026-10-10" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${station_id}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${station_id}/start-construction"
              payload: {}
              as: SiteManager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stations/${station_id}/commission"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Permit.${pf}.status == EXPIRED after clock advance"
            - "FuelingStation.${station_id}.construction_status == SUSPENDED (cascade link 2 fired from the permit mutation, not directly from the clock)"
            - "commission rejected with ERR_INVALID_STATE (SUSPENDED is not a valid from-state)"
      - name: contract_termination_suspends_site
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_TERMINATED
          - state_machines.Site.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than the permit-expiry
          cascade: the explicit terminate action mutates the SupplyContract
          (link 1: terminated_at set), and that mutation itself flips the parent
          Site ACTIVE -> SUSPENDED (link 2) because no ACTIVE contract remains.
          A follow-up activation of a new DRAFT contract reverses link 2
          (SUSPENDED -> ACTIVE) without touching link 1.
        test_recipe:
          setup:
            - "Site with a single ACTIVE contract (no invoices), terminated by SiteManager"
            - "A second DRAFT contract ready to activate"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-SUS", name: "Suspend Site", address: "6 Supply Ct", baseline_labor_rate_per_hour: 29.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.0, reliability_sla_pct: 99.0, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { c1: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${c1}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 1.8, reliability_sla_pct: 99.9, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/supply-contracts/${c1}/terminate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/supply-contracts/${c2}/activate"
              payload: {}
              as: SiteManager
          assert:
            - "SupplyContract.${c1}.status == TERMINATED and terminated_at != null (link 1)"
            - "after terminate and before reactivation: Site.${site_id}.status == SUSPENDED (link 2)"
            - "after activating c2: Site.${site_id}.status == ACTIVE (reverse cascade) and SupplyContract.${c1}.status remains TERMINATED"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_safety_error_on_fueling_event
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair state (p4, 409) vs business_safety (p9, 422): a fueling
          event whose occurred_at predates commissioning AND whose station is
          still PLANNED fails the p4 state precondition first — the response is
          ERR_INVALID_STATE (409), never ERR_STATION_NOT_COMMISSIONED (422),
          even though both conditions hold.
        test_recipe:
          setup:
            - "Site with an ACTIVE DELIVERED_LIQUID contract covering 2026-10 and a station still PLANNED (no permits)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-PP1", name: "Priority Site 1", address: "1 Order Ave", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.0, reliability_sla_pct: 99.0, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${contract_id}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-P", location_type: "OUTDOOR", capacity_kg_per_day: 200, storage_capacity_kg: 500, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { station_id: $.data.id }
          trigger:
            - call: "POST /api/stations/${station_id}/fueling-events"
              payload: { forklift_id: "FL-P1", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 10, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE with HTTP 409 (state category wins over business_safety despite both being violated: station PLANNED and occurred_at precedes any commissioning)"
      - name: fiscal_error_beats_referential_error_on_schedule
        grounds:
          - validations[priority=13]
          - validations[priority=16]
        distinguishing_aspect: |
          Different category pair than the state-vs-safety instance: invoice
          issuance hits business_fiscal (p13, ERR_CONTRACT_NOT_ACTIVE) while the
          same endpoint family line-item add hits business_referential (p18,
          ERR_EVENT_NOT_BILLABLE) — a draft invoice under a TERMINATED contract
          fails issuance with ERR_CONTRACT_NOT_ACTIVE even though its line
          referential integrity is intact, and conversely a line-item add with
          an out-of-period event fails with ERR_EVENT_NOT_BILLABLE while OCC
          (p21) is satisfied, proving fiscal and referential checks sit at
          distinct priorities on distinct endpoints.
        test_recipe:
          setup:
            - "Site with contract C1 (ACTIVE, then terminated after its PAID invoice) and contract C2 (ACTIVE, PIPELINE mode, different period)"
            - "Invoice I1 under C1: issued then paid; invoice I2 under C1 in DRAFT with no lines; C1 terminated once I1 is PAID (I2 in DRAFT blocks termination, so I2 is voided first)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
