          setup: ["OPEN term FALL2026 with a RESEARCH/DOCTORAL policy and one pay period covering the whole term; NSF-A and NSF-B grants; DRAFT appointment at effort 75 / monthly 300000 planned 100% on NSF-A."]
          setup_api_calls:
