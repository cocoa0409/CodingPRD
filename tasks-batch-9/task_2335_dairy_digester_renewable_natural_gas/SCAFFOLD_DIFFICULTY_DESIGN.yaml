      - name: tc_inhibited_close_upsets_facility_suspends_curtailable_agreement_cancels_open_delivery_suspends_dairy
        grounds:
          - calculations.biological_stability_assessment
          - state_machines.DigesterFacility.STABLE_to_UPSET
          - state_machines.FeedstockAgreement.ACTIVE_to_SUSPENDED
          - state_machines.FeedstockDelivery.ACCEPTED_to_CANCELLED
          - state_machines.Dairy.CONTRACTED_to_SUSPENDED
          - calculations.organic_loading_rate
        distinguishing_aspect: |
          A different five-link chain from a different root: one INHIBITED day close
          (stress_points 4) upsets the facility, suspends ONLY the curtailable agreement,
          cancels only that agreement's delivery sitting on a still-OPEN day - the
          same-agreement delivery on the just-closed day is untouched because the status
          dimension already moved to CLOSED - recomputes the open day's
          organic_loading_rate to 0.768, and suspends only dairy1; the non-curtailable
          agreement and dairy2 must remain ACTIVE and CONTRACTED.
        test_recipe:
          setup:
            - "One facility with design_max_olr 3.500, one curtailable agreement for dairy1 and one non-curtailable agreement for dairy2, both ACTIVE."
            - "Operations day 2026-08-03 receives a deliberately overloaded 400.000 t delivery on the curtailable agreement."
            - "Operations day 2026-08-04 is created first and left OPEN, holding a 100.000 t delivery on the curtailable agreement and an 80.000 t delivery on the non-curtailable one."
            - "The August 3 close reports volatile fatty acids 3600.0 against alkalinity 8000.0, a ratio of 0.450, on top of an organic_loading_rate of 4.373 against a 3.850 inhibition threshold, giving stress_points 4 and stability_status INHIBITED."
