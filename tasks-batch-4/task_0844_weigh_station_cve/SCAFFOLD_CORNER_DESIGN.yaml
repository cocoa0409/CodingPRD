# =============================================================================
# Task 0844 — §1.9 Scaffold Corner Design (breadth coverage)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: carrier_create_returns_defaults
        claim_type: Creation
        grounds: [entities.Carrier.fields.status, entities.Carrier.fields.oos_points]
        distinguishing_aspect: "POST /carriers with the five required fields returns 201; status defaults ACTIVE, oos_points 0, unpaid_fines_cents 0, iss_score 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C1", legal_name: "Corner One", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
          assert:
            - "Carrier.${carrier_id}.status == ACTIVE"
            - "Carrier.${carrier_id}.oos_points == 0"
            - "Carrier.${carrier_id}.unpaid_fines_cents == 0"
            - "Carrier.${carrier_id}.version == 1"

      - name: carrier_get_not_found_returns_404
        claim_type: Not Found
        grounds: ['endpoints."GET /carriers/{carrierId}"', 'errors[ERR_CARRIER_NOT_FOUND]']
        distinguishing_aspect: "GET /carriers/{id} with a non-existent UUID returns ERR_CARRIER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /carriers/00000000-0000-4000-8000-000000000000", payload: {}, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CARRIER_NOT_FOUND"
            - "HTTP status == 404"

      - name: carrier_duplicate_usdot_rejected
        claim_type: Type Constraints
        grounds: [entities.Carrier.fields.usdot_number, 'errors[ERR_DUPLICATE_USDOT]']
        distinguishing_aspect: "A second carrier registered with an already-used usdot_number is rejected ERR_DUPLICATE_USDOT (409)."
        test_recipe:
          setup: ["One carrier with usdot_number DOT-DUP already exists."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-DUP", legal_name: "First", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
          trigger:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-DUP", legal_name: "Second", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_USDOT"
            - "HTTP status == 409"

      - name: screening_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Screening.fields.gross_weight_lbs, 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "POST /screenings omitting the required gross_weight_lbs is rejected ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Active carrier, station, driver exist."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C2", legal_name: "Corner Two", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S2", state_code: "AZ" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C2", full_name: "Cor Two" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
          trigger:
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C2", axle_count: 5, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: carrier_list_pagination_shape
        claim_type: Listing
        grounds: ['endpoints."GET /carriers"']
        distinguishing_aspect: "GET /carriers?limit=1&offset=0 returns an array plus pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two carriers exist."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-P1", legal_name: "Page One", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /carriers", payload: { usdot_number: "DOT-P2", legal_name: "Page Two", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin }
          trigger:
            - { call: "GET /carriers", payload: { limit: 1, offset: 0 }, as: ComplianceAdmin }
          assert:
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"
            - "len(response.data) == 1"

      - name: inspection_driver_id_copied_from_screening
        claim_type: Computed Fields
        grounds: [entities.Inspection.fields.driver_id]
        distinguishing_aspect: "Inspection.driver_id is a system field copied from the screening; it equals the screening's driver regardless of any client input."
        test_recipe:
          setup: ["Active carrier; REFERRED overweight screening; a bay."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C3", legal_name: "Corner Three", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S3", state_code: "NV" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C3", full_name: "Cor Three" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C3", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
          trigger:
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
          assert:
            - "Inspection.${inspection_id}.driver_id == ${driver_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: screening_bypass_immediately_cleared
        claim_type: Valid Transition
        grounds: [state_machines.Screening.SCREENED_to_CLEARED, entities.Screening.fields.decision]
        distinguishing_aspect: "A legal-weight screening on an ACTIVE carrier below the ISS bypass threshold computes decision BYPASS and status CLEARED at creation."
        test_recipe:
          setup: ["Active carrier (certified_iss_score 0); default station."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C4", legal_name: "Corner Four", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S4", state_code: "OR" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C4", full_name: "Cor Four" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
          trigger:
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C4", axle_count: 5, gross_weight_lbs: 79000, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
          assert:
            - "Screening.${screening_id}.decision == BYPASS"
            - "Screening.${screening_id}.status == CLEARED"
            - "Screening.${screening_id}.referral_reason == NONE"

      - name: inspection_reinspect_from_cleared_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Inspection.OOS_ISSUED_to_REINSPECTION, 'errors[ERR_INSPECTION_INVALID_STATE]']
        distinguishing_aspect: "reinspect on a CLEARED (terminal) inspection is rejected ERR_INSPECTION_INVALID_STATE; CLEARED admits no transitions."
        test_recipe:
          setup: ["Active carrier; REFERRED overweight screening; inspection finalized CLEAR."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C5", legal_name: "Corner Five", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S5", state_code: "ID" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C5", full_name: "Cor Five" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C5", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "CLEAR" }, as: Inspector }
          trigger:
            - { call: "POST /inspections/${inspection_id}/reinspect", payload: {}, as: Inspector, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSPECTION_INVALID_STATE"
            - "HTTP status == 409"

      - name: citation_contest_from_dismissed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Citation.ASSESSED_to_CONTESTED, 'errors[ERR_CITATION_INVALID_STATE]']
        distinguishing_aspect: "contest on a DISMISSED (terminal) citation is rejected ERR_CITATION_INVALID_STATE."
        test_recipe:
          setup: ["Active carrier; overweight inspection finalized OOS; citation issued, contested, then DISMISSED."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C6", legal_name: "Corner Six", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S6", state_code: "UT" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C6", full_name: "Cor Six" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C6", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { citation_id: "$.data.id" } }
            - { call: "POST /citations/${citation_id}/contest", payload: { contest_reason: "x" }, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /citations/${citation_id}/adjudicate", payload: { result: "DISMISS" }, as: EnforcementOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /citations/${citation_id}/contest", payload: { contest_reason: "again" }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CITATION_INVALID_STATE"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: inspection_create_on_out_of_order_bay_rejected
        claim_type: Violation → Error
        grounds: ['validations[priority=10]', 'errors[ERR_BAY_UNAVAILABLE]', entities.InspectionBay.fields.status]
        distinguishing_aspect: "Creating an inspection whose bay has status OUT_OF_ORDER is rejected ERR_BAY_UNAVAILABLE (409)."
        test_recipe:
          setup: ["Active carrier; REFERRED overweight screening; a bay created OUT_OF_ORDER."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C7", legal_name: "Corner Seven", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S7", state_code: "MT" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay X", status: "OUT_OF_ORDER" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C7", full_name: "Cor Seven" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C7", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
          trigger:
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_BAY_UNAVAILABLE"
            - "HTTP status == 409"

      - name: citation_carrier_mismatch_rejected
        claim_type: Cross-entity validation
        grounds: ['validations[priority=8]', 'errors[ERR_CARRIER_MISMATCH]']
        distinguishing_aspect: "A citation whose carrier_id is a different carrier than its inspection's screening carrier is rejected ERR_CARRIER_MISMATCH (409)."
        test_recipe:
          setup: ["Carrier A owns the inspection; a separate carrier B exists; inspection finalized OOS."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C8A", legal_name: "Corner 8A", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_a: "$.data.id" } }
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C8B", legal_name: "Corner 8B", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_b: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S8", state_code: "WY" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_a}/drivers", payload: { cdl_number: "CDL-C8", full_name: "Cor Eight" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_a}", driver_id: "${driver_id}", vehicle_plate: "PLT-C8", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_b}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CARRIER_MISMATCH"
            - "HTTP status == 409"

      - name: citation_overweight_basis_missing_rejected
        claim_type: Conditional validation
        grounds: ['validations[priority=7]', 'errors[ERR_OVERWEIGHT_BASIS_MISSING]', entities.Screening.fields.overweight]
        distinguishing_aspect: "An OVERWEIGHT citation on an inspection whose screening was referred for HAZMAT (not overweight) is rejected ERR_OVERWEIGHT_BASIS_MISSING (422)."
        test_recipe:
          setup: ["Active carrier; legal-weight but HAZMAT-placarded screening -> REFERRED reason HAZMAT; inspection finalized OOS via a HAZMAT OOS violation."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C9", legal_name: "Corner Nine", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S9", state_code: "CA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C9", full_name: "Cor Nine" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-C9", axle_count: 5, gross_weight_lbs: 79000, heaviest_axle_lbs: 19000, hazmat_placarded: true }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "397.5", category: "HAZMAT", severity_weight: 5, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /citations", payload: { inspection_id: "${inspection_id}", carrier_id: "${carrier_id}", kind: "OVERWEIGHT" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_OVERWEIGHT_BASIS_MISSING"
            - "HTTP status == 422"

      - name: duty_log_overlap_rejected
        claim_type: Temporal validation
        grounds: ['validations[priority=9]', 'errors[ERR_DUTY_LOG_OVERLAP]']
        distinguishing_aspect: "A duty-log entry whose time range overlaps an existing entry for the same driver is rejected ERR_DUTY_LOG_OVERLAP (409)."
        test_recipe:
          setup: ["Active carrier and driver; a DRIVING entry [00:00,05:00) exists."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C10", legal_name: "Corner Ten", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C10", full_name: "Cor Ten" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /drivers/${driver_id}/duty-logs", payload: { entry_type: "DRIVING", start_utc: "2026-03-02T00:00:00Z", end_utc: "2026-03-02T05:00:00Z" }, as: ComplianceAdmin, captures: { log1_id: "$.data.id" } }
          trigger:
            - { call: "POST /drivers/${driver_id}/duty-logs", payload: { entry_type: "ON_DUTY", start_utc: "2026-03-02T04:00:00Z", end_utc: "2026-03-02T06:00:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DUTY_LOG_OVERLAP"
            - "HTTP status == 409"

      - name: hos_driving_limit_exceeded_returns_422
        claim_type: Aggregate validation
        grounds: [calculations.hos_driving_check, 'errors[ERR_HOS_DRIVING_LIMIT]']
        distinguishing_aspect: "A single DRIVING entry of 661 minutes (11h01m) exceeds HOS_DRIVING_LIMIT_MIN=660 and is rejected ERR_HOS_DRIVING_LIMIT; exactly 660 would be allowed."
        test_recipe:
          setup: ["Active carrier and driver with no prior duty logs."]
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-C11", legal_name: "Corner Eleven", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-C11", full_name: "Cor Eleven" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
          trigger:
            - { call: "POST /drivers/${driver_id}/duty-logs", payload: { entry_type: "DRIVING", start_utc: "2026-03-02T00:00:00Z", end_utc: "2026-03-02T11:01:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_HOS_DRIVING_LIMIT"
            - "HTTP status == 422"

      - name: settle_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds: ['validations[priority=11]', 'errors[ERR_SETTLEMENT_AMOUNT_MISMATCH]', state_machines.Citation.ASSESSED_to_SETTLED]
