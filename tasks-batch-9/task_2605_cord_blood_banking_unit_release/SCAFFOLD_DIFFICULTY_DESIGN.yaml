  - rule_id: non_linear_state_machine
    instances:
      - name: unit_three_axes_evolve_independently
        grounds:
          - state_machines.CordBloodUnit.processing_status.PROCESSING_to_RECEIVED
          - state_machines.CordBloodUnit.processing_status.VOLUME_REDUCED_to_CRYOPRESERVED
          - state_machines.CordBloodUnit.availability_status.UNAVAILABLE_to_PRIVATE_STORED
          - state_machines.CordBloodUnit.eligibility_status.PENDING_to_ELIGIBLE
          - calculations.volume_reduction_recovery
        distinguishing_aspect: |
          CordBloodUnit carries three independent state dimensions: a FAILED processing run drives
          processing_status PROCESSING -> RECEIVED (a revert edge) while availability_status stays
          UNAVAILABLE and eligibility_status stays PENDING; the eligibility determination then flips only
          the eligibility axis; cryopreservation then flips processing and availability together while
          leaving eligibility untouched.
