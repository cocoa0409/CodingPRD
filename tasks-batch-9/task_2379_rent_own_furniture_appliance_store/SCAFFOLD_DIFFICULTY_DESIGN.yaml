        grounds:
          - validations.priority_12_ERR_AGREEMENT_DEFAULTED
          - validations.priority_45_ERR_PAYMENT_EXCEEDS_BALANCE
          - state_machines.Agreement.DELINQUENT_to_DEFAULTED
        distinguishing_aspect: |
          One request violates two rules at once: the agreement is DEFAULTED
          (priority 12, 409) AND the tendered 999999999 cents exceeds the
          remaining balance (priority 45, 422). Only ERR_AGREEMENT_DEFAULTED with
          HTTP 409 may be returned. The control agreement in the same chain,
          CURRENT and receiving the identical oversized amount, proves the
          fiscal rule is live and returns 422 ERR_PAYMENT_EXCEEDS_BALANCE — so a
          422 on the first call cannot be excused as a dead validation.
