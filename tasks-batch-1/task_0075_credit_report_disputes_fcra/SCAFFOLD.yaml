    side_effects: []

  - method: GET
    path: "/notifications"
    description: "List notifications, filterable by credit file (reverse-reachability for Notification.credit_file_id)"
    roles: [Consumer, CreditBureau, Regulator]
    code: 200
    input: ["credit_file_id?", "subject_id?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  - method: GET
    path: "/reage-events/{reageEventId}"
    description: "Get a single re-age event"
    roles: [Consumer, Furnisher, CreditBureau, Regulator]
    code: 200
    input: []
    output: ReageEvent
    side_effects: []

  - method: GET
    path: "/reage-events"
    description: "List re-age events, filterable by tradeline or source dispute (reverse-reachability for ReageEvent.tradeline_id and ReageEvent.source_dispute_id)"
    roles: [Consumer, Furnisher, CreditBureau, Regulator]
    code: 200
    input: ["tradeline_id?", "source_dispute_id?", "limit?", "offset?"]
    output: ReageEvent[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server clock to an absolute instant (test-driving)"
    roles: [CreditBureau]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set; does NOT run the deadline sweep"]

  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock to an instant AND run the deadline sweep (auto-deletes breached disputes, expires reverifications)"
    roles: [CreditBureau]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "server clock advanced"
      - "every non-terminal Dispute with clock > deadline_at -> AUTO_DELETED with full cascade (tradeline DELETED, counts recomputed, notifications minted, PENDING reverifications EXPIRED, CreditFile.version += 1)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user does not own the target resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or bad enum/type" }
  - { id: ERR_INVALID_DELINQUENCY_DATE, http: 422, condition: "reported_delinquency_date < date_of_first_delinquency on tradeline create" }
  - { id: ERR_STALE_FILE_VERSION, http: 412, condition: "expected_credit_file_version does not match CreditFile.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_DEADLINE_BREACHED, http: 409, condition: "Server clock past the dispute investigation deadline for an advancing action" }
  - { id: ERR_FILE_FROZEN, http: 409, condition: "CreditFile.protection_state == FROZEN blocks dispute creation / investigation open" }
  - { id: ERR_FURNISHER_SUSPENDED, http: 409, condition: "Reverification dispatched to a SUSPENDED furnisher" }
  - { id: ERR_TRADELINE_NOT_DISPUTABLE, http: 409, condition: "Tradeline not in REPORTING/CORRECTED/VERIFIED for a new dispute (e.g., DELETED or already DISPUTED)" }
  - { id: ERR_DUPLICATE_DISPUTE, http: 409, condition: "A non-terminal Dispute already references this tradeline" }
  - { id: ERR_OVERLAPPING_INVESTIGATION, http: 409, condition: "New dispute's investigation window overlaps a non-terminal same-reason dispute's window on the same credit file" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "dispute.reopen_count already == 2" }
  - { id: ERR_MISSING_CORRECTED_BALANCE, http: 422, condition: "MODIFY reverification response without corrected_balance_cents >= 0" }
  - { id: ERR_FREEZE_OVERLAP, http: 409, condition: "New freeze interval overlaps an existing ACTIVE freeze of the same freeze_type" }
  - { id: ERR_COMPLAINT_PREMATURE, http: 409, condition: "Adjudicate UPHOLD while referenced Dispute not in {AUTO_DELETED, RESOLVED_VERIFY}" }
  - { id: ERR_INVALID_DECISION, http: 422, condition: "adjudicate decision not in {UPHOLD, DISMISS}" }
  - { id: ERR_PAGINATION_RANGE, http: 422, condition: "limit/offset outside permitted range" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration surface only"
    identity: "opaque"
    exclusive_operations:
      - "POST /consumers — register consumer"
      - "POST /furnishers — register furnisher"
    shared_operations: []

  - name: Consumer
    description: "Acts as a persisted Consumer; owns disputes, freezes, complaints on own file"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /disputes — file dispute on own file"
      - "POST /disputes/{id}/reopen — reopen own dispute"
      - "POST /security-freezes — place lock/freeze on own file"
      - "POST /security-freezes/{id}/lift — lift own freeze"
      - "POST /regulatory-complaints — file CFPB complaint on own dispute"
    shared_operations:
      - "GET reads on own consumer, credit-files, tradelines, disputes, freezes, complaints, notifications, reage-events"

  - name: Furnisher
    description: "Acts as a persisted Furnisher; reports tradelines and answers reverifications for own tradelines"
    identity: "entity_backed:Furnisher"
    exclusive_operations:
      - "POST /tradelines — report tradeline (shared with CreditBureau)"
      - "POST /tradelines/{id}/reage — directly re-age a reported tradeline"
      - "POST /reverification-requests/{id}/respond — respond to own reverification"
    shared_operations:
      - "GET reads on own furnisher, tradelines, reverification-requests, disputes, reage-events"

  - name: CreditBureau
    description: "Operational bureau identity (opaque); opens files, runs investigations, dispatches reverifications, drives the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /credit-files — open credit file"
      - "POST /disputes/{id}/open-investigation — open 30-day investigation"
      - "POST /reverification-requests — dispatch reverification"
      - "POST /furnishers/{id}/suspend — suspend furnisher"
      - "POST /_clock/set — set server clock"
      - "POST /_clock/advance — advance clock + run deadline sweep"
    shared_operations:
      - "POST /tradelines — report tradeline (shared with Furnisher)"
      - "GET reads across files, tradelines, disputes, reverifications, freezes, complaints, notifications"

  - name: Regulator
    description: "CFPB / State AG operational identity (opaque); adjudicates regulatory complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /regulatory-complaints/{id}/review — move complaint to UNDER_REVIEW"
      - "POST /regulatory-complaints/{id}/adjudicate — uphold or dismiss"
    shared_operations:
      - "GET reads across files, disputes, complaints, reverifications, notifications"
