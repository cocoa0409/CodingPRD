            - "GET /engagements?cycle_id=${cycle_id}&offset=0 returns HTTP 200 with total_count == 0"
      - name: endpoint_engagements_list_work_status_filter_empty
        claim_type: standard_crud
        grounds: ["endpoints[GET /engagements]", state_machines.Engagement]
        distinguishing_aspect: "work_status=HANDED_OFF is a legal terminal filter value, so on a system with no engagements it answers HTTP 200 with total_count 0 rather than ERR_VALIDATION - the filter vocabulary is the state machine's vocabulary, independent of what has been reached."
        test_recipe:
          setup: ["One partner and one cycle; no engagements exist."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "GET /engagements?work_status=HANDED_OFF", as: QualityReviewer, as_user_id: "qr-1"}
          assert:
            - "HTTP 200"
            - "data.total_count == 0 and data.items is an empty list"
            - "GET /engagements?work_status=IN_PROGRESS is likewise HTTP 200 with total_count == 0"
      - name: endpoint_get_milestone_unknown_id_returns_not_found
        claim_type: standard_crud
        grounds: ["endpoints[GET /milestones/{id}]", "errors[ERR_MILESTONE_NOT_FOUND]", "validations[priority=11]"]
        distinguishing_aspect: "The milestone read and its time-log child both resolve through the same priority-11 lookup, so an unknown id yields 404 ERR_MILESTONE_NOT_FOUND on GET /milestones/{id} and on GET /milestones/{id}/time-logs alike - never an empty 200 log list."
