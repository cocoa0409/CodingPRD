  - section: errors
    instances:

      - name: window_honor_without_released_event_returns_invalid_state
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_STATE
          - state_machines.InterruptibleWindow.SCHEDULED_to_HONORED
        distinguishing_aspect: "Honoring a window whose linked event is still ACTIVE (not RELEASED) is a 409 — the honor precondition is event RELEASED, not merely linked."
        test_recipe:
          setup: ["Clock 2026-09-10T00:00:00Z. Mill; window [12:00, 14:00] SCHEDULED; event called 12:30 released 13:30 inside the window, ACTIVATED (window auto-linked)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/interruptible-windows"
              payload: { label: "PJM-ECON", start_at: "2026-09-10T12:00:00Z", end_at: "2026-09-10T14:00:00Z", curtailment_credit_cents: 50000 }
              as: EnergyDispatcher
              captures: { win_id: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-10T12:30:00Z", released_at: "2026-09-10T13:30:00Z" }
              as: EnergyDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events/${ev_id}/activate"
              payload: {}
              as: EnergyDispatcher
          trigger:
            - call: "POST /mills/${mill_id}/interruptible-windows/${win_id}/honor"
              payload: {}
              as: EnergyDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "InterruptibleWindow.${win_id}.status is still SCHEDULED and linked_event_id == ${ev_id} (the link happened at activation)"

      - name: campaign_window_violation_heat_outside_window
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CAMPAIGN_WINDOW_VIOLATION
          - validations[priority=14]
        distinguishing_aspect: "A campaign whose only line's heat tapped outside [planned_start, planned_end] fails commit with ERR_CAMPAIGN_WINDOW_VIOLATION — distinct from the campaign-vs-campaign overlap error."
        test_recipe:
          setup: ["Clock default. Mill, contract, lot, grade; one CAST heat tapped 2026-09-20T09:00Z; campaign window [2026-09-15T08:00Z, 2026-09-15T10:00Z] with that heat as its line."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Hertford Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Coastal Scrap Co", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 60, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GA-40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_a: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-LATE", grade_id: "${grade_a}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-20T09:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.006 }
              as: Metallurgist
              captures: { sheet_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/confirm"
              payload: {}
              as: Metallurgist
            - call: "POST /mills/${mill_id}/heats/${heat_id}/tap"
              payload: {}
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/cast"
              payload: {}
              as: MillOperator
            - call: "POST /mills/${mill_id}/campaigns"
              payload: { name: "Camp-Mismatch", product_family: "REBAR", grade_group: "GROUP_A", planned_start: "2026-09-15T08:00:00Z", planned_end: "2026-09-15T10:00:00Z", roll_change_budget: 1 }
              as: Scheduler
              captures: { camp_id: $.data.id }
            - call: "POST /mills/${mill_id}/campaigns/${camp_id}/lines"
              payload: { heat_id: "${heat_id}" }
              as: Scheduler
              captures: { camp_line_done: $.data.id }
            - call: "GET /mills/${mill_id}/campaigns/${camp_id}"
              payload: {}
              as: Scheduler
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/campaigns/${camp_id}/commit"
              payload: { expected_campaign_version: "${camp_v}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_CAMPAIGN_WINDOW_VIOLATION"
            - "Campaign.${camp_id}.status is still OPEN"

      - name: blend_infeasible_and_under_delivered_and_roll_budget
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BLEND_INFEASIBLE
          - errors.ERR_UNDER_DELIVERED
          - errors.ERR_ROLL_CHANGE_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / contract_underdelivered_fill_boundary
          rationale: "ERR_UNDER_DELIVERED and ERR_ROLL_CHANGE_BUDGET_EXCEEDED are asserted at exact boundaries in the §1.8 boundary instances; ERR_BLEND_INFEASIBLE is exercised by the §1.8 priority-pair instance posture_state_beats_blend_safety_on_charge_apply (as the losing error) and by the corner blend_feasibility_mn_floor_violation."

  # ===========================================================================
  - section: rbac
    instances:

      - name: metallurgist_cannot_confirm_order_returns_forbidden
        claim_type: role_denied
        grounds:
          - roles.Metallurgist
          - errors.ERR_FORBIDDEN
          - validations[priority=2]
        distinguishing_aspect: "Role denial precedes existence: a Metallurgist calling order-confirm on a non-existent order id gets 403 ERR_FORBIDDEN, not 404 — authorization (priority 2) beats existence (priority 4)."
        test_recipe:
          setup: ["Default logical clock. One mill with one account."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 5, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_real: $.data.id, ord_real_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/00000000-0000-4000-8000-000000000009/confirm"
              payload: { expected_order_version: "${ord_real_v}" }
              as: Metallurgist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN"
            - "err != ERR_ORDER_NOT_FOUND (authorization precedes existence)"

      - name: scheduler_cannot_record_meltdown_sheet_returns_forbidden
        claim_type: role_denied
        grounds:
          - roles.Scheduler
          - roles.Metallurgist
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Meltdown sheets are Metallurgist-exclusive: the Scheduler (a peer role with its own exclusive campaign surface) is denied with 403."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, grade, heat CHARGED."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-RBAC", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.006 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN"
            - "GET /mills/${mill_id}/heats/${heat_id}/meltdown-sheets returns 0 rows"

      - name: mill_operator_cannot_issue_mtr_returns_forbidden
        claim_type: role_denied
        grounds:
          - roles.QualityEngineer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "MTR issuance is QualityEngineer-exclusive (segregation from production): the MillOperator who ran the heat cannot self-certify it."
        test_recipe:
          setup: ["Default logical clock. One mill (minimal — the denial precedes all business checks so no deep setup is needed)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/heats/00000000-0000-4000-8000-000000000009/mill-test-reports"
              payload: { order_id: "00000000-0000-4000-8000-000000000010" }
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN (role denial fires before the 404 existence checks on heat/order)"

      - name: all_roles_share_get_endpoints
        claim_type: role_shared
        grounds:
          - roles.PlantManager
          - endpoints.GET_/mills/{millId}/heats
        distinguishing_aspect: "Every declared role (including EnergyDispatcher and QualityEngineer, whose exclusive surfaces are narrow) can read shared GET endpoints — the shared_operations row is honored for all eight roles."
        test_recipe:
          setup: ["Default logical clock. One mill."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "GET /mills/${mill_id}/heats"
              payload: {}
              as: EnergyDispatcher
            - call: "GET /mills/${mill_id}/heats"
              payload: {}
              as: QualityEngineer
          assert:
            - "both reads return 200 with response_type array and total_count == 0"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: order_confirm_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-confirm-stale-order]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC happy-vs-stale on order confirm: confirming with the observed version succeeds and bumps order.version; a second confirm carrying the now-stale version is 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Clock 2026-09-10. Mill, SHREDDED 2026-09 index 38000, grade, CONTRACT account, order QUOTED version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 5, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: AccountManager
              captures: { confirm_status: $.data.status }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the first confirm succeeds: confirm_status == CONFIRMED"
            - "the second confirm with the same (now stale) version returns 412 and err == ERR_STALE_VERSION"
            - "Order.${ord_id}.version == 2 (exactly one successful confirm bumped it)"

      - name: charge_tap_abort_immediate_visibility
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Heat
        distinguishing_aspect: "Immediate consistency: the abort response and a subsequent GET agree on Heat status ABORTED and the lot's restored remaining_tons in the same request cycle — no eventual-consistency lag anywhere in the cascade."
        test_recipe:
          setup: ["Clock default. Mill, contract, lot 20t, grade, heat CHARGED with 8t."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-IMM", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/abort"
              payload: {}
              as: MillOperator
            - call: "GET /mills/scrap-lots/${lot_id}"
              payload: {}
              as: ProcurementOfficer
          assert:
            - "the abort response reports Heat.status == ABORTED in the same response body"
            - "the immediate follow-up GET reports ScrapLot.${lot_id}.remaining_tons == 20 and status == RECEIVED (no lag)"

      - name: posture_rate_threshold_gate_boundary
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Mill.fields.posture
          - state_machines.EnergyEvent
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / charge_apply_gated_by_mill_posture
          rationale: "The posture derived field gating charges is asserted (INTERRUPTED with waiver and without) in the named §1.8 instance."
