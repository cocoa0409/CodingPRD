          - entities.Campaign.fields.daily_cap_cents
        distinguishing_aspect: "daily_cap_cents 6000000 is comfortably below allocated_budget_cents 10000000, so the universal clause of priority 71 passes; the request still fails because the third clause applies only to SELF_SERVE advertisers and their cap is 5000000."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with self_serve_daily_spend_cap_cents 5000000 and an APPROVED 2026-Q3 plan."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
          trigger:
            - call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Cap Overreach", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", allocated_budget_cents: 10000000, pacing_mode: "EVEN", daily_cap_cents: 6000000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_CAP_EXCEEDS_PARENT_LIMIT"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"

      - name: the_same_daily_cap_is_accepted_for_a_managed_advertiser_with_no_self_serve_cap
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=71]
          - validations[priority=45]
          - entities.Advertiser.fields.service_model
        distinguishing_aspect: "The identical 6000000 daily_cap_cents that priority 71 rejects for a SELF_SERVE advertiser is accepted for a MANAGED advertiser, proving the self-serve clause is gated on service_model and not applied unconditionally."
        test_recipe:
          setup:
            - "MANAGED advertiser (managed_service_fee_pct 0.15, account_manager_user_id u_am_1) ACTIVE with an APPROVED 2026-Q3 plan committed at 2000000."
          setup_api_calls:
            - *m_adv
