            - call: "POST /membership/members/${m_ot}/deployment-orders"
              payload: { orders_number: "ORD-O1", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2026-10-01", scra_eligible: false, expected_member_version: "${v_ot1}" }
              as: VerificationOfficer
          trigger:
            - call: "POST /membership/members/${m_ot}/deployment-orders"
              payload: { orders_number: "ORD-O2", theater: "EUCOM", start_date: "2026-11-01", end_date: "2026-12-01", scra_eligible: false, expected_member_version: "${v_ot1}" }
              as: VerificationOfficer
              captures: { err_occ2: $.data.error_id }
            - call: "GET /membership/members/${m_ot}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { v_ot2: $.data.version }
            - call: "POST /membership/members/${m_ot}/deployment-orders"
              payload: { orders_number: "ORD-O2", theater: "EUCOM", start_date: "2026-11-01", end_date: "2026-12-01", scra_eligible: false, expected_member_version: "${v_ot2}" }
              as: VerificationOfficer
              captures: { dep_o2: $.data.id }
          assert:
            - "Stale create: error_id == ERR_STALE_VERSION, HTTP 412, and no ORD-O2 persisted yet"
            - "Retry with fresh version succeeds 201; Member.${m_ot}.version == v_ot2 + 1"

      - name: grandfathered_entitlement_survives_reinstate
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - state_machines.ProductEntitlement
        distinguishing_aspect: "Reinstatement recomputes the member matrix and household aggregate but does NOT un-grandfather: an entitlement flipped to GRANDFATHERED at suspension remains GRANDFATHERED with grandfathered == true after the member returns to ACTIVE (derived state does not drift backward)."
        test_recipe:
          setup:
            - "Member M ACTIVE with OPEN entitlement E; M suspended (E -> GRANDFATHERED); restoration evidence uploaded to M's APPROVED case; M reinstated."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Gf Gina", applicant_dob: "1984-04-04", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_gf: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_gf}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "2005-01-01", service_end_date: "2011-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_gf: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_gf}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2011-02-01", covers_service_record_id: "${sr_gf}", content_hash: "gf1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gf}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_gf}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_gf}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_gf: $.data.member_id }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "GF_PROD", product_line: "INSURANCE", product_name: "GF Insurance", allowed_categories: ["VETERAN_HONORABLE"] }
              as: ProductAdministrator
              captures: { off_gf: $.data.id }
            - call: "POST /membership/members/${m_gf}/entitlements"
              payload: { product_offering_id: "${off_gf}", exposure_cents: 100000 }
              as: Member
              as_user_id: "${m_gf}"
              captures: { ent_gf: $.data.id }
            - call: "POST /membership/members/${m_gf}/eligibility-loss"
              payload: { loss_type: "DOCUMENTATION_REVOKED" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_gf}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2026-09-01", covers_service_record_id: "${sr_gf}", content_hash: "gf2" }
              as: EligibilityApplicant
          trigger:
            - call: "POST /membership/members/${m_gf}/reinstate"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "Member.${m_gf}.status == ACTIVE"
            - "ProductEntitlement.${ent_gf}.status == GRANDFATHERED and grandfathered == true (grandfathering is sticky across reinstatement)"

      - name: scheduled_clock_default_and_activation_on_set
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/membership/_clock/set_current_utc
          - state_machines.DeploymentOrder.REGISTERED_to_ACTIVE
        distinguishing_aspect: "The logical clock defaults to 2026-09-01T00:00:00Z before any set call; a REGISTERED order with start_date 2026-09-10 stays REGISTERED at the default, and setting the clock to 2026-09-10 auto-activates it (status ACTIVE, member posture DEPLOYED) with no order-level call."
        test_recipe:
          setup:
            - "Clock never set (default 2026-09-01). Member M ACTIVE; order ORD-SCH start 2026-09-10 registered."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Sch Scott", applicant_dob: "1993-03-03", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_sh: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sh}/service-records"
              payload: { branch: "AIR_FORCE", component: "ACTIVE_DUTY", rank_grade: "O-2", service_start_date: "2015-01-01", discharge_characterization: "STILL_SERVING" }
              as: EligibilityApplicant
              captures: { sr_sh: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sh}/evidence"
              payload: { doc_type: "LEAVE_EARNINGS_STATEMENT", issuing_authority: "DFAS", issued_on: "2026-08-01", covers_service_record_id: "${sr_sh}", content_hash: "sh1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sh}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sh}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_sh}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_sh: $.data.member_id }
            - call: "GET /membership/members/${m_sh}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { v_sh: $.data.version }
            - call: "POST /membership/members/${m_sh}/deployment-orders"
              payload: { orders_number: "ORD-SCH", theater: "PACOM", start_date: "2026-09-10", end_date: "2026-12-10", scra_eligible: true, expected_member_version: "${v_sh}" }
              as: VerificationOfficer
              captures: { dep_sh: $.data.id }
          trigger:
            - call: "POST /membership/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /membership/members/${m_sh}/deployment-orders"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "Before the clock set the order was REGISTERED and Member.${m_sh}.deployment_posture == NONE (default clock 2026-09-01 precedes start_date)"
            - "After the clock set: DeploymentOrder.${dep_sh}.status == ACTIVE and Member.${m_sh}.deployment_posture == DEPLOYED (scheduled activation fired from the clock event alone)"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: approval_response_immediately_reflects_minted_member
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/membership/eligibility-cases/{caseId}/decide
        distinguishing_aspect: "Immediate consistency: the decide APPROVE response itself carries member_id and eligibility_category, and a GET on the minted member issued in the next request observes the same member_number — no eventual-consistency lag anywhere in the chain."
        test_recipe:
          setup:
            - "Case UNDER_REVIEW with verified record."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Imm Ivan", applicant_dob: "1987-07-07", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_im: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_im}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2007-01-01", service_end_date: "2013-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_im: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_im}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2013-02-01", covers_service_record_id: "${sr_im}", content_hash: "im1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_im}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_im}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          trigger:
            - call: "POST /membership/eligibility-cases/${c_im}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_im: $.data.member_id }
            - call: "GET /membership/members/${m_im}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-B"
          assert:
            - "Decide response already contains member_id ${m_im}, status APPROVED, eligibility_category VETERAN_HONORABLE"
            - "Immediate GET /membership/members/${m_im} returns 200 with status ACTIVE and a non-null member_number — the mint is visible in the very next request"
