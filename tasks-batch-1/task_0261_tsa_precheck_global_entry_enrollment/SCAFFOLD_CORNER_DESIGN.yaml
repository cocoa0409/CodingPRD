              captures: { app_id: $.data.id }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: { expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { st: $.data.status }
          assert:
            - "response.status == 200"
            - "Application.${app_id}.status == WITHDRAWN"

      - name: no_show_cascade_frees_slot_and_reverts_application
        claim_type: cascading_side_effects
        grounds: [state_machines.Appointment.CONFIRMED_to_NO_SHOW, state_machines.AppointmentSlot.BOOKED_to_AVAILABLE]
        distinguishing_aspect: "After clock passes ends_at, no-show transitions Appointment->NO_SHOW, frees the slot to AVAILABLE, and reverts the application INTERVIEW_SCHEDULED->VETTING (multi-target cascade)."
        test_recipe:
          setup:
            - "CLEARED application, slot 2026-06-20T09:00..09:30 booked -> CONFIRMED, INTERVIEW_SCHEDULED."
            - "Clock advanced to 2026-06-20T10:00:00Z (after ends_at)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center NS2", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Fin NS2", date_of_birth: "1990-02-01", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: SchedulingAdmin
          trigger:
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: EnrollmentOfficer
              captures: { appt_status: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == NO_SHOW"
            - "AppointmentSlot.${slot_id}.status == AVAILABLE"
            - "Application.${app_id}.status == VETTING"

