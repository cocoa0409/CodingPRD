      - name: reporting_metrics_window_is_inclusive_at_365_days_and_as_of_does_not_move_the_training_clock
        claim_type: Input Set Filtering
        grounds:
          - endpoints[GET /integrity/departments/{id}/reporting-metrics]
          - calculations.department_reporting_rate
          - calculations.department_training_completion_pct
          - calculations.department_monitoring_flag
        distinguishing_aspect: |
          One report submitted at 2026-08-01T00:00:00Z is INSIDE the window for as_of
          2027-08-01T00:00:00Z (exactly 365 days, inclusive) giving reporting_rate_per_1k 0.50, and
          OUTSIDE it for as_of 2027-08-02T00:00:00Z (366 days) giving 0.00 - which also flips
          monitoring_flag from TRAINING_DEFICIT to UNDER_REPORTING, proving branch 1 outranks branch 3.
          training_completion_pct stays 20.00 in every one of those reads because it is measured from
          the logical clock (2026-08-01), not from as_of. With a second department present the peer
          median of an EVEN population is ROUND((0.00 + 0.50) / 2, 2) == 0.25 and the elevated
          threshold ROUND(2.0 * 0.25, 2) == 0.50, which ENGL's own 0.50 does NOT strictly exceed.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL (enrolled_student_count 2000, faculty_headcount 5) with exactly one trained faculty member and one SUBMITTED report"
            - "HIST (enrolled_student_count 1000, faculty_headcount 2) is created later with no members and no reports"
