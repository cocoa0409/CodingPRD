# =============================================================================
# Task 0446 — Airport Lounge Access
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
# Nine §0.5 Difficulty Rules, >= 2 instances each (>= 18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_lounge_payable_vs_lifetime_settlement
        grounds:
          - calculations.compute_lounge_settlement_balance
          - state_machines.Settlement.PAYABLE_to_PAID
          - entities.Lounge.fields.settlement_balance_cents
        distinguishing_aspect: |
          On the Lounge domain: identical Settlement rows yield payable_balance_cents (PAYABLE only)
          != lifetime_earned_cents (PAYABLE + PAID) once one settlement is PAID — 1800 vs 5400.
        test_recipe:
          setup:
            - "Lounge L with settlement_rate_cents 1200. Member completes two visits, each 1 primary + 2 guests (occupant_count 3), producing two PAYABLE settlements of 3600 each."
            - "Before payout, payable_balance_cents == lifetime_earned_cents == 7200. After POST /lounges/{id}/settlements/pay marks both PAID, payable_balance_cents drops to 0 while lifetime_earned_cents stays 7200 — the two aggregations diverge."
          setup_api_calls:
            - call: "POST /lounges"
              payload: { name: "L SFO", airport_code: "SFO", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1505, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 10, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Member One" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 2, guest_names: ["G1","G2"], expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v1_id: $.data.id, l_v1: $.data.version }
            - call: "POST /visits/${v1_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { l_v_fresh: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 2, guest_names: ["H1","H2"], expected_lounge_version: "${l_v_fresh}" }
              as: NetworkAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v2_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /visits/${v2_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "GET /lounges/${l_id}/settlement-summary"
              payload: {}
              as: NetworkAdmin
              captures: { pre_payable: $.data.payable_balance_cents, pre_lifetime: $.data.lifetime_earned_cents }
            - call: "POST /lounges/${l_id}/settlements/pay"
              payload: {}
              as: NetworkAdmin
            - call: "GET /lounges/${l_id}/settlement-summary"
              payload: {}
              as: NetworkAdmin
              captures: { post_payable: $.data.payable_balance_cents, post_lifetime: $.data.lifetime_earned_cents }
          assert:
            - "pre_payable == 7200 and pre_lifetime == 7200 (both PAYABLE, two 3600 settlements)"
            - "post_payable == 0 (both PAID drop out of PAYABLE sum)"
            - "post_lifetime == 7200 (PAYABLE+PAID lifetime unchanged) — payable_balance and lifetime_earned diverge after payout"

      - name: dvc_visit_settlement_rate_snapshot_at_completion
        grounds:
          - calculations.compute_settlement
          - state_machines.Visit.CHECKED_IN_to_COMPLETED
          - entities.Visit.fields.settlement_amount_cents
        distinguishing_aspect: |
          On the Visit domain (different entity from the Lounge-balance dual-variant): the same visit yields
          settlement_amount_cents from the lounge rate AT COMPLETION (1500), not the rate at check-in (1200).
        test_recipe:
          setup:
            - "Two lounges with different settlement rates: LA rate 1200, LB rate 1500. The same member checks in and completes a single-occupant (occupant_count 1) visit at each."
            - "settlement_amount_cents = occupant_count * rate-at-completion, so the LA visit settles at 1200 and the LB visit at 1500 despite identical occupant_count — the rate snapshot at completion drives the divergence."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE_PLUS", included_visits_per_year: -1, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LA", airport_code: "LAX", capacity: 20, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { la_id: $.data.id, la_v0: $.data.version }
            - call: "POST /lounges"
              payload: { name: "LB", airport_code: "JFK", capacity: 20, settlement_rate_cents: 1500, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { lb_id: $.data.id, lb_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Member Two" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${la_id}", guest_count: 0, expected_lounge_version: "${la_v0}" }
              as: NetworkAdmin
              captures: { va_id: $.data.id }
            - call: "POST /visits/${va_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${la_id}"
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${lb_id}", guest_count: 0, expected_lounge_version: "${lb_v0}" }
              as: NetworkAdmin
              captures: { vb_id: $.data.id }
            - call: "POST /visits/${vb_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${lb_id}"
          trigger:
            - call: "POST /visits/${va_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${la_id}"
              captures: { va_settle: $.data.settlement_amount_cents }
            - call: "POST /visits/${vb_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${lb_id}"
              captures: { vb_settle: $.data.settlement_amount_cents }
          assert:
            - "Visit.${va_id}.settlement_amount_cents == 1200 (occupant_count 1 * rate 1200)"
            - "Visit.${vb_id}.settlement_amount_cents == 1500 (occupant_count 1 * rate 1500) — same occupant_count, divergent result driven by completion-time rate"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_member_charge_per_line_rounding_order
        grounds:
          - calculations.compute_member_charge
          - state_machines.Visit.HELD_to_CHECKED_IN
          - entities.Visit.fields.member_charge_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: a GOLD member with OVERAGE primary + two GUEST_CHARGE guests yields
          member_charge_cents 11710 under pinned round-per-line-then-sum; sum-then-round would give 11709.
        test_recipe:
          setup:
            - "GOLD-card member on a plan with overage_charge_cents 5000, guest_charge_cents 2500, included_visits_per_year 0 (every primary is OVERAGE), included_guest_visits_per_year 0 (every guest GUEST_CHARGE)."
            - "Lounge guest_fee_cents 1505. Visit with guest_count 2. disc=0.9. overage line round(5000*0.9)=4500; each guest line round((2500+1505)*0.9)=round(3604.5)=3605; total 4500+3605+3605=11710."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "STANDARD", included_visits_per_year: 0, included_guest_visits_per_year: 0, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LG", airport_code: "ORD", capacity: 30, settlement_rate_cents: 1200, guest_fee_cents: 1505, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Gold Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "GOLD", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 2, guest_names: ["A","B"], expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { charge: $.data.member_charge_cents }
          assert:
            - "Visit.${v_id}.member_charge_cents == 11710"
            - "Visit.${v_id}.member_charge_cents != 11709 (sum-then-round is rejected; per-line round-then-sum is pinned)"

      - name: cf_guest_funding_waterfall_minmax
        grounds:
          - calculations.resolve_guest_funding
          - state_machines.Visit.HELD_to_CHECKED_IN
          - entities.Guest.fields.funded_by
        distinguishing_aspect: |
          Mode (a) nested min/max with per-index branching: with included_guest_visits_per_year 1 and 2 guests,
          guest_allotment_consumed = min(2, max(0, 1-0)) = 1, so guest[0]=GUEST_ALLOTMENT, guest[1]=GUEST_CHARGE
          — split point is order-sensitive on creation order.
        test_recipe:
          setup:
            - "Plan included_guest_visits_per_year 1, included_visits_per_year 10 (primary ALLOTMENT, no overage), guest_charge_cents 2500. Lounge guest_fee_cents 1000. Non-GOLD member (disc 1.0)."
            - "Visit guest_count 2, guest_names [First, Second]. remaining = max(0, 1-0)=1; guest_allotment_consumed=min(2,1)=1; guest[0]=GUEST_ALLOTMENT (charge=lounge fee 1000), guest[1]=GUEST_CHARGE (charge=2500+1000=3500)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 1, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LW", airport_code: "DEN", capacity: 30, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Waterfall Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "SILVER", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 2, guest_names: ["First","Second"], expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { charge: $.data.member_charge_cents }
            - call: "GET /guests?visit_id=${v_id}"
              payload: {}
              as: NetworkAdmin
              captures: { g0_funded: "$.data[0].funded_by", g1_funded: "$.data[1].funded_by" }
          assert:
            - "Guests of ${v_id} in creation order: [0].funded_by == GUEST_ALLOTMENT, [1].funded_by == GUEST_CHARGE"
            - "Guests of ${v_id}: [0].charge_cents == 1000 (lounge fee only), [1].charge_cents == 3500 (2500 + 1000)"
            - "Visit.${v_id}.member_charge_cents == 4500 (primary ALLOTMENT 0 + 1000 + 3500)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_visit_branching_divergent_side_effects
        grounds:
          - state_machines.Visit.HELD_to_CHECKED_IN
          - state_machines.Visit.HELD_to_CANCELLED
          - state_machines.Visit.HELD_to_NO_SHOW
        distinguishing_aspect: |
          Visit forks from HELD into CHECKED_IN (occupies seats, posts charge), CANCELLED (releases hold, no charge,
          no strike), and NO_SHOW (releases hold, +strike, allotment still burned) — divergent side-effect sets.
        test_recipe:
          setup:
            - "Two members each open a hold on the same lounge at 2026-06-01T00:00:00Z (hold expires 00:30)."
            - "Member A's hold is cancelled (HELD->CANCELLED): no strike, no charge, held_occupancy released."
            - "Member B's hold is left to expire: advance clock to 01:00 then sweep (HELD->NO_SHOW): +1 strike, allotment burned, held_occupancy released."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LBR", airport_code: "SEA", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Member A" }
              as: NetworkAdmin
              captures: { ma_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${ma_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Member B" }
              as: NetworkAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${mb_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${ma_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { va_id: $.data.id, l_v1: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${mb_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v1}" }
              as: NetworkAdmin
              captures: { vb_id: $.data.id }
          trigger:
            - call: "POST /visits/${va_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${ma_id}"
              captures: { va_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:00:00Z" }
              as: NetworkAdmin
            - call: "POST /lounges/${l_id}/sweep"
              payload: {}
              as: NetworkAdmin
            - call: "GET /visits/${vb_id}"
              payload: {}
              as: NetworkAdmin
              captures: { vb_status: $.data.status }
            - call: "GET /memberships/${ma_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ma_strikes: $.data.no_show_strikes }
            - call: "GET /memberships/${mb_id}"
              payload: {}
              as: NetworkAdmin
              captures: { mb_strikes: $.data.no_show_strikes }
          assert:
            - "Visit.${va_id}.status == CANCELLED; Member.${ma_id}.no_show_strikes == 0 (cancel adds no strike)"
            - "Visit.${vb_id}.status == NO_SHOW; Member.${mb_id}.no_show_strikes == 1 (no-show adds a strike)"
            - "Member.${mb_id}.visits_used == 1 (no-show still burns allotment); Member.${ma_id}.visits_used == 0 (cancel leaves the consuming set)"

      - name: nlsm_daypass_cyclic_redeem_revert
        grounds:
          - state_machines.DayPass.ISSUED_to_REDEEMED
          - state_machines.DayPass.REDEEMED_to_ISSUED
          - entities.DayPass.fields.status
        distinguishing_aspect: |
          DayPass is cyclic on a different entity from Visit: ISSUED -> REDEEMED (when a hold redeems it) -> ISSUED
          (when that hold is cancelled before check-in), with redeemed_visit_id cleared on the back-edge.
        test_recipe:
          setup:
            - "Member buys a day pass on lounge L (status ISSUED). Member opens a hold redeeming the pass -> DayPass REDEEMED, redeemed_visit_id set. Member cancels the hold before check-in -> DayPass back to ISSUED, redeemed_visit_id null."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "STANDARD", included_visits_per_year: 0, included_guest_visits_per_year: 0, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LDP", airport_code: "BOS", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "DP Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /lounges/${l_id}/day-passes"
              payload: { member_id: "${m_id}", expected_lounge_version: "${l_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { dp_id: $.data.id, l_v1: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", day_pass_id: "${dp_id}", guest_count: 0, expected_lounge_version: "${l_v1}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /day-passes/${dp_id}"
              payload: {}
              as: NetworkAdmin
              captures: { redeemed_status: $.data.status, redeemed_visit: $.data.redeemed_visit_id }
            - call: "POST /visits/${v_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /day-passes/${dp_id}"
              payload: {}
              as: NetworkAdmin
              captures: { reverted_status: $.data.status, reverted_visit: $.data.redeemed_visit_id }
          assert:
            - "After hold creation: DayPass.${dp_id}.status == REDEEMED, redeemed_visit_id == ${v_id}"
            - "After hold cancel: DayPass.${dp_id}.status == ISSUED, redeemed_visit_id == null (cyclic back-edge clears the link)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_noshow_strike_suspend_autocancel_depth4
        grounds:
          - state_machines.Visit.HELD_to_NO_SHOW
          - state_machines.Member.GOOD_to_SUSPENDED
          - state_machines.Visit.HELD_to_CANCELLED
          - calculations.recompute_member_usage
        distinguishing_aspect: |
          Depth >= 3 chain from the NO_SHOW sweep trigger: VisitA HELD->NO_SHOW raises Member.no_show_strikes (link1);
          crossing NO_SHOW_SUSPEND_THRESHOLD=3 flips Member.standing GOOD->SUSPENDED (link2); that SUSPEND auto-cancels
          the member's other HELD VisitB (link3), which releases VisitB's held_occupancy on its lounge (link4).
        test_recipe:
          setup:
            - "Member with 2 prior NO_SHOW strikes (held at 00:00, swept after expiry). NO_SHOW_SUSPEND_THRESHOLD=3."
            - "At a later clock the member holds VisitA on lounge L1 AND VisitB on lounge L2, both HELD. Advance clock past VisitA's expiry but BEFORE VisitB's expiry is irrelevant — VisitA's no-show is the trigger; VisitB is still HELD when the suspend cascade fires."
            - "Concretely: strikes pre-built to 2; VisitA held at 02:00 (expires 02:30) and VisitB held at 02:20 (expires 02:50). Advance to 02:40 and sweep: VisitA -> NO_SHOW (strike 3 -> SUSPEND), cascade cancels VisitB even though VisitB's own expiry (02:50) is in the future."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 50, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", airport_code: "PHX", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l1_id: $.data.id, l1_v0: $.data.version }
            - call: "POST /lounges"
              payload: { name: "L2", airport_code: "MIA", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l2_id: $.data.id, l2_v0: $.data.version }
