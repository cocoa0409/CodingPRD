# =============================================================================
# PRD Benchmark Seed Tables — Reverse Logistics & Returns Processing Center
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "2918. Reverse Logistics & Returns Processing Center (returns processing operator): return authorization validation, receipt scanning and reason code capture, disposition decision rules across restock, refurbish, liquidate, donate and destroy by condition grade and value, refund and credit release timing with fraud checks on serial mismatch and empty-box returns, refurbishment work orders, testing and repackaging with grading standards, hazardous, recalled and regulated item handling with special disposition, client-specific business rules, service levels and inventory ownership, secondary market channel routing and pricing feedback, shrink and disposition audit reporting"

domain_name: reverse-logistics-returns
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys declared in the child's body; URL paths
  # are single-level collections (`/return-lines/{id}`) with action sub-paths
  # only. No entity is nested inside another entity's collection path.

  state_machine_shape: parallel
  # ReturnLine carries two independent state dimensions on the same row —
  # `disposition_state` (physical/inventory axis, itself cyclic through
  # DISPOSITION_ASSIGNED -> IN_REFURB -> DISPOSITION_ASSIGNED) and
  # `financial_state` (money axis). RefurbWorkOrder is cyclic
  # (IN_TEST -> TEST_FAILED -> IN_TEST). ReturnAuthorization is branching plus
  # compound (its status is re-derived from its lines' aggregate state).

  relationship_patterns:
    - one_to_many          # Client -> CatalogItem/ReturnAuthorization; Receipt -> ReturnLine
    - self_referential     # ReturnAuthorization.supersedes_rma_id -> ReturnAuthorization.id
    - cross_aggregate      # DispositionOrder -> SecondaryMarketChannel; ShrinkLedgerEntry -> Client

  role_model: segregation_of_duties
  # Three enforced separations, all keyed on X-User-ID (not on role alone):
  #   (1) the user who graded a ReturnLine may not release its refund
  #   (2) the technician assigned to a RefurbWorkOrder may not QA/repackage it
  #   (3) DESTROY dispositions on dual-signoff clients need approve != execute user

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 5 state machines / 2 concurrency rules / 16 calculations /
  # 55 ordered validations / 64 endpoints / 56 errors / 7 roles.
  # 29 of the 64 endpoints are single-resource reads, filtered lists and one
  # sub-resource list mandated by §1.5 FK reverse-reachability; the remaining
  # 35 are the business write surface plus the two computed reads and the
  # logical-clock test-driving endpoint.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the retailer whose returns this center processes"
      - name: client_code
        type: string
        source: input
        description: "Short operator-facing code; unique across all Clients"
        constraints: "3-8 uppercase alphanumeric chars; unique"
      - name: service_level
        type: enum
        source: input
        description: "Contracted processing service level; drives restocking-fee relief and refund-hold waiver"
        constraints: "SL_STANDARD | SL_PRIORITY | SL_WHITE_GLOVE"
      - name: inventory_ownership
        type: enum
        source: input
        description: "Who owns the returned units once received; CENTER_OWNED units may be liquidated without a client-facing recovery credit split"
        constraints: "CLIENT_OWNED | CENTER_OWNED"
      - name: restock_grade_floor
        type: enum
        source: input
        description: "Worst condition grade still eligible for RESTOCK disposition (inclusive)"
        default: B
        constraints: "A | B | C | D"
      - name: refund_hold_hours
        type: integer
        source: input
        description: "Hours after disposition execution before a refund may be released"
        default: 48
        constraints: ">= 0 and <= 720"
      - name: liquidation_floor_pct
        type: number
        source: input
        description: "Fraction of declared value the recovery estimate must reach for LIQUIDATE instead of DONATE/DESTROY"
        default: 0.30
        constraints: "0.00 <= v <= 1.00, exactly 2 decimal places"
      - name: fraud_tolerance_cents
        type: integer
        source: input
        description: "Value-deficit tolerance before the VALUE_ANOMALY fraud check fails"
        default: 5000
        constraints: ">= 0"
      - name: donation_allowed
        type: boolean
        source: input
        description: "Whether DONATE is an allowed disposition for this client"
        default: false
      - name: destroy_requires_dual_signoff
        type: boolean
        source: input
        description: "When true, a DESTROY DispositionOrder must be approved and executed by two different X-User-IDs"
        default: false
      - name: max_refund_exposure_cents
        type: integer
        source: input
        description: "Absolute floor on settlement_balance_cents; breaching it auto-suspends the client"
        default: 500000
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Client processing posture; SUSPENDED blocks all inbound receiving"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: units_received
        type: integer
        source: computed
        description: "Sum of ReturnLine.quantity over every ReturnLine whose Receipt belongs to an RMA of this Client"
      - name: units_in_process
        type: integer
        source: computed
        description: "Units received and neither reserved by a live DispositionOrder nor dispositioned"
      - name: units_reserved_for_disposition
        type: integer
        source: computed
        description: "Units held by a DispositionOrder in status PROPOSED or APPROVED"
      - name: units_dispositioned
        type: integer
        source: computed
        description: "Units whose ReturnLine.disposition_state is DISPOSITIONED"
      - name: shrink_ledger_cents
        type: integer
        source: computed
        description: "Sum of ShrinkLedgerEntry.amount_cents for this Client over entry_type IN {RECEIPT_VARIANCE, REFURB_COST, DONATION_WRITE_OFF, DESTRUCTION_WRITE_OFF}; always <= 0"
      - name: settlement_balance_cents
        type: integer
        source: computed
        description: "Sum of ShrinkLedgerEntry.amount_cents for this Client over ALL entry_types, traversed in ShrinkLedgerEntry.sequence_no ASC order"
      - name: projected_settlement_balance_cents
        type: integer
        source: computed
        description: "Forward-looking companion to settlement_balance_cents: the booked balance plus the ledger amount every PROPOSED or APPROVED DispositionOrder would append if it executed at its frozen unit_price_cents, minus every RELEASE_PENDING RefundRelease not yet released. For identical data this differs from settlement_balance_cents whenever any order or refund is still in flight."
      - name: open_rma_count
        type: integer
        source: computed
        description: "Count of this Client's ReturnAuthorizations in status IN {ISSUED, PARTIALLY_RECEIVED, RECEIVED}"

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client that owns this SKU"
      - name: sku
        type: string
        source: input
        description: "Client SKU; unique per (client_id, sku)"
      - name: description
        type: string
        source: input
        description: "Human-readable item description"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Client-declared unit value; the refund base and the shrink write-off base"
        constraints: "> 0"
      - name: unit_weight_grams
        type: integer
        source: input
        description: "Expected shipping weight of one unit; feeds the EMPTY_BOX fraud check"
        constraints: "> 0"
      - name: serialized
        type: boolean
        source: input
        description: "When true a scanned_serial is mandatory at receipt and is matched against the authorized serial"
      - name: hazard_class
        type: enum
        source: input
        description: "Hazardous-materials class; anything other than NONE forces quarantine before grading"
        default: NONE
        constraints: "NONE | LITHIUM_BATTERY | AEROSOL | FLAMMABLE"
      - name: regulated_flag
        type: boolean
        source: input
        description: "Export/health regulated item; may never be donated"
        default: false
      - name: recall_status
        type: enum
        source: system
        description: "Recall posture; set only by POST /catalog-items/{catalog_item_id}/recall"
        default: NONE
        constraints: "NONE | ADVISORY | MANDATORY"
      - name: refurb_eligible
        type: boolean
        source: input
        description: "Whether grade B/C units of this SKU may be routed to REFURBISH"
      - name: secondary_market_floor_cents
        type: integer
        source: input
        description: "Lowest acceptable secondary-market unit price; floors DispositionOrder.unit_price_cents"
        constraints: ">= 0"

  - name: ProcessingBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Physical bay label; unique across all ProcessingBays"
      - name: bay_type
        type: enum
        source: input
        description: "GENERAL bays host refurb test windows; HAZMAT and QUARANTINE bays host quarantine occupations"
        constraints: "GENERAL | HAZMAT | QUARANTINE"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory decontamination gap enforced after every refurb test window on a GENERAL bay"
        default: 0
        constraints: ">= 0 and <= 240"
      - name: status
        type: enum
        source: system
        description: "Bay availability"
        default: ACTIVE
        constraints: "ACTIVE | OUT_OF_SERVICE"

  - name: SecondaryMarketChannel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Channel display name"
      - name: channel_code
        type: string
        source: input
        description: "Short code; unique across all SecondaryMarketChannels"
      - name: channel_type
        type: enum
        source: input
        description: "Determines which dispositions may route here"
        constraints: "AUCTION | BULK_LIQUIDATOR | OUTLET | DONATION_PARTNER | CERTIFIED_DESTRUCTION"
      - name: accepted_grades
        type: array
        source: input
        description: "Condition grades this channel accepts; array of A|B|C|D|SCRAP, at least one entry"
      - name: fee_pct
        type: number
        source: input
        description: "Channel base commission before the gross-lot-value surcharge band is added"
        constraints: "0.00 <= v <= 0.40, exactly 2 decimal places"
      - name: hazard_certified
        type: boolean
        source: input
        description: "Whether this channel may accept units whose CatalogItem.hazard_class != NONE"
      - name: recall_certified
        type: boolean
        source: input
        description: "Whether this channel may accept units whose CatalogItem.recall_status == MANDATORY"
      - name: min_lot_value_cents
        type: integer
        source: input
        description: "Minimum projected net recovery a DispositionOrder must clear to route here"
        constraints: ">= 0"
      - name: concurrent_lot_capacity
        type: integer
        source: input
        description: "How many live DispositionOrders may hold time-overlapping channel windows here"
        constraints: ">= 1"
      - name: price_index_pct
        type: number
        source: computed
        description: "Realized-vs-expected pricing feedback index; multiplies the provisional unit price when a DispositionOrder is created"
        default: 1.00
      - name: status
        type: enum
        source: system
        description: "Channel posture; PAUSED channels cannot have DispositionOrders approved against them"
        default: ACTIVE
        constraints: "ACTIVE | PAUSED"

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client raising this authorization"
      - name: order_reference
        type: string
        source: input
        description: "Client sales-order reference this return is authorized against"
      - name: customer_reference
        type: string
        source: input
        description: "Opaque end-customer handle; the REPEAT_RETURNER fraud check counts RMAs per (client_id, customer_reference)"
      - name: order_placed_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the original sales order was placed; the days_since_order base"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which no Receipt may be scanned against this RMA"
      - name: supersedes_rma_id
        type: string
        source: system
        description: "FK -> ReturnAuthorization.id; set on an RMA minted by POST /return-authorizations/{rma_id}/reissue, pointing at the RMA it replaces; null otherwise"
        default: null
      - name: status
        type: enum
        source: system
        description: "RMA lifecycle; re-derived from its lines on every receipt and disposition"
        default: DRAFT
        constraints: "DRAFT | ISSUED | PARTIALLY_RECEIVED | RECEIVED | CLOSED | VOID | EXPIRED | SUPERSEDED"
      - name: declared_line_count
        type: integer
        source: computed
        description: "Count of ReturnAuthorizationLine rows whose rma_id equals this RMA's id"
      - name: authorized_unit_total
        type: integer
        source: computed
        description: "Sum of ReturnAuthorizationLine.authorized_quantity over this RMA's lines"
      - name: received_unit_total
        type: integer
        source: computed
        description: "Sum of ReturnAuthorizationLine.received_quantity over this RMA's lines"
      - name: fraud_flag_count
        type: integer
        source: computed
        description: "Count of FraudCheck rows with outcome FAIL over every ReturnLine belonging to this RMA's Receipts"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the RMA moved DRAFT -> ISSUED; null while DRAFT"
        default: null

  - name: ReturnAuthorizationLine
    parent: ReturnAuthorization
    common_fields: false
    fields:
      - name: rma_id
        type: string
        source: input
        description: "FK -> ReturnAuthorization.id; the authorization this line belongs to"
      - name: catalog_item_id
        type: string
        source: input
        description: "FK -> CatalogItem.id; must belong to the same Client as the RMA"
      - name: authorized_quantity
        type: integer
        source: input
        description: "Units the client authorized for return on this line"
        constraints: "> 0 and <= 999"
      - name: reason_code
        type: enum
        source: input
        description: "Reason the client authorized the return; the receipt-time reason may differ and the difference feeds grading review"
        constraints: "DEFECTIVE | WRONG_ITEM | NOT_AS_DESCRIBED | BUYER_REMORSE | SHIPPING_DAMAGE | RECALL"
      - name: declared_serial
        type: string
        source: input
        description: "Serial the client says is coming back; required when the CatalogItem is serialized"
        default: null
      - name: received_quantity
        type: integer
        source: computed
        description: "Sum of ReturnLine.quantity over ReturnLines whose rma_line_id equals this line's id"
        default: 0

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - name: rma_id
        type: string
        source: input
        description: "FK -> ReturnAuthorization.id; the authorization this physical package arrived against"
      - name: tracking_reference
        type: string
        source: input
        description: "Inbound carrier tracking reference; unique per rma_id"
      - name: gross_weight_grams
        type: integer
        source: input
        description: "Scale weight of the inbound package as scanned at the dock"
        constraints: ">= 0"
      - name: expected_weight_grams
        type: integer
        source: computed
        description: "Sum over the RMA's lines of (CatalogItem.unit_weight_grams * ReturnAuthorizationLine.authorized_quantity) plus PACKAGING_TARE_GRAMS"
      - name: empty_box_suspected
        type: boolean
        source: computed
        description: "True when gross_weight_grams * 100 < expected_weight_grams * EMPTY_BOX_THRESHOLD_PCT_SCALED"
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant the receipt was scanned"
      - name: scanned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ReceivingClerk who scanned the package"

  - name: ReturnLine
    parent: Receipt
    common_fields: true
    fields:
      - name: receipt_id
        type: string
        source: input
        description: "FK -> Receipt.id; the inbound package this unit came out of"
      - name: rma_line_id
        type: string
        source: input
        description: "FK -> ReturnAuthorizationLine.id; must belong to the same RMA as the Receipt"
      - name: bay_id
        type: string
        source: input
        description: "FK -> ProcessingBay.id; the bay holding this line's quarantine occupation, null until quarantined"
        default: null
      - name: quantity
        type: integer
        source: input
        description: "Units physically present for this line"
        constraints: "> 0 and <= 999"
      - name: scanned_serial
        type: string
        source: input
        description: "Serial read off the unit at the dock; required when the CatalogItem is serialized"
        default: null
      - name: reason_code
        type: enum
        source: input
        description: "Reason captured by the clerk at receipt; drives the restocking-fee base and the recovery penalty"
        constraints: "DEFECTIVE | WRONG_ITEM | NOT_AS_DESCRIBED | BUYER_REMORSE | SHIPPING_DAMAGE | RECALL"
      - name: condition_grade
        type: enum
        source: system
        description: "Grading-standard condition grade; UNGRADED until POST /return-lines/{return_line_id}/grade, re-stamped on refurb repackage"
        default: UNGRADED
        constraints: "UNGRADED | A | B | C | D | SCRAP"
      - name: disposition
        type: enum
        source: computed
        description: "Outcome selected by the disposition decision rules, or forced by supervisor override / mandatory-recall cascade"
        default: PENDING
        constraints: "PENDING | RESTOCK | REFURBISH | LIQUIDATE | DONATE | DESTROY"
      - name: disposition_state
        type: enum
        source: system
        description: "Physical/inventory state dimension; evolves independently of financial_state"
        default: RECEIVED_UNGRADED
        constraints: "RECEIVED_UNGRADED | QUARANTINED | DISPOSITION_ASSIGNED | IN_REFURB | DISPOSITIONED"
      - name: financial_state
        type: enum
        source: system
        description: "Money state dimension; evolves independently of disposition_state"
        default: HOLD_PENDING_DISPOSITION
        constraints: "HOLD_PENDING_DISPOSITION | FRAUD_HOLD | RELEASE_PENDING | REFUNDED | DENIED | CLAWED_BACK"
      - name: quarantine_start_at
        type: datetime
        source: input
        description: "Inclusive start of this line's bay occupation; null until quarantined"
        default: null
      - name: quarantine_end_at
        type: datetime
        source: input
        description: "Exclusive end of this line's bay occupation; null until quarantined"
        default: null
      - name: days_since_order
        type: integer
        source: computed
        description: "floor((Receipt.received_at - ReturnAuthorization.order_placed_at) / 86400 seconds); stamped once at line scan"
      - name: recovery_value_cents
        type: integer
        source: computed
        description: "Estimated recoverable value of this line; carries the provisional_at_grade variant until its DispositionOrder executes, then the final_at_execution variant"
        default: 0
      - name: fraud_score_receipt
        type: integer
        source: computed
        description: "receipt_time_score variant of the fraud score, stamped at line scan"
        default: 0
      - name: fraud_score_release
        type: integer
        source: computed
        description: "release_time_score variant of the fraud score, stamped at grading and recomputed on every refund action"
        default: 0
      - name: graded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GradingInspector who graded this line; the refund releaser must differ"
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RefundAnalyst who released this line's refund"
        default: null

  - name: FraudCheck
    parent: ReturnLine
    common_fields: false
    fields:
      - name: return_line_id
        type: string
        source: input
        description: "FK -> ReturnLine.id; the line this check was run against"
      - name: check_type
        type: enum
        source: system
        description: "Which fraud rule produced this row"
        constraints: "SERIAL_MISMATCH | EMPTY_BOX | VALUE_ANOMALY | REPEAT_RETURNER"
      - name: outcome
        type: enum
        source: system
        description: "PASS rows carry weight 0; FAIL rows contribute their weight to the fraud score"
        constraints: "PASS | FAIL"
      - name: weight_points
        type: integer
        source: computed
        description: "FRAUD_WEIGHTS[check_type] when outcome is FAIL, otherwise 0"
      - name: evidence
        type: string
        source: system
        description: "Short machine-generated explanation, e.g. the observed vs expected serial"
      - name: evaluated_stage
        type: enum
        source: system
        description: "RECEIPT for checks available at dock scan, GRADING for checks needing a condition grade"
        constraints: "RECEIPT | GRADING"

  - name: RefurbWorkOrder
    parent: ReturnLine
    common_fields: true
    fields:
      - name: return_line_id
        type: string
        source: input
        description: "FK -> ReturnLine.id; the unit being refurbished"
      - name: bay_id
        type: string
        source: input
        description: "FK -> ProcessingBay.id; the GENERAL bay holding this work order's test window, null until the first test starts"
        default: null
      - name: assigned_technician_user_id
        type: string
        source: system
        description: "X-User-ID of the RefurbTechnician who opened the work order; may not perform the QA repackage"
      - name: status
        type: enum
        source: system
        description: "Work-order lifecycle; cycles IN_TEST -> TEST_FAILED -> IN_TEST until the rework cap"
        default: OPEN
        constraints: "OPEN | IN_TEST | TEST_FAILED | PASSED_QA | REPACKAGED | ABANDONED"
      - name: rework_cycles
        type: integer
        source: computed
        description: "Number of times this work order re-entered IN_TEST from TEST_FAILED"
        default: 0
      - name: labor_minutes_total
        type: integer
        source: computed
        description: "Accumulated labor minutes reported across every test cycle"
        default: 0
      - name: parts_cost_cents
        type: integer
        source: computed
        description: "Accumulated parts cost reported across every test cycle"
        default: 0
      - name: packaging_cost_cents
        type: integer
        source: computed
        description: "Packaging cost reported at repackage; 0 while not REPACKAGED"
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Fully-loaded refurb cost; stamped once when the order reaches REPACKAGED or ABANDONED"
        default: 0
      - name: resulting_grade
        type: enum
        source: input
        description: "Grade certified at repackage under the center's grading standards; null until REPACKAGED"
        default: null
        constraints: "A | B"
      - name: test_window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the current bay test window; null until the first test starts"
        default: null
      - name: test_window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the current bay test window; null until the first test starts"
        default: null
      - name: qa_user_id
        type: string
        source: system
        description: "X-User-ID of the RefurbTechnician who performed the repackage QA"
        default: null

  - name: DispositionOrder
    parent: ReturnLine
    common_fields: true
    fields:
      - name: return_line_id
        type: string
        source: input
        description: "FK -> ReturnLine.id; the line whose units this order disposes of"
      - name: channel_id
        type: string
        source: input
        description: "FK -> SecondaryMarketChannel.id; null for RESTOCK orders, otherwise supplied by the caller or selected by the channel selector policy"
        default: null
      - name: disposition
        type: enum
        source: computed
        description: "Copied from ReturnLine.disposition at creation and frozen; the line may later be re-dispositioned without mutating an existing order"
        constraints: "RESTOCK | LIQUIDATE | DONATE | DESTROY"
      - name: quantity
        type: integer
        source: computed
        description: "Copied from ReturnLine.quantity at creation"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Projected secondary-market unit price at creation time"
      - name: channel_window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the channel lot window; required for every non-RESTOCK order"
        default: null
      - name: channel_window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the channel lot window; required for every non-RESTOCK order"
        default: null
      - name: gross_lot_value_cents
        type: integer
        source: computed
        description: "Stamped at execution: realized_unit_price_cents (or unit_price_cents when omitted) multiplied by quantity"
        default: 0
      - name: effective_fee_pct
        type: number
        source: computed
        description: "Stamped at execution: channel fee after the gross-lot-value surcharge band, clamped to [0.00, 0.40]; 0.00 for RESTOCK"
        default: 0.00
      - name: channel_fee_cents
        type: integer
        source: computed
        description: "Stamped at execution: round_half_up(gross_lot_value_cents * effective_fee_pct)"
        default: 0
      - name: net_recovery_cents
        type: integer
        source: computed
        description: "Stamped at execution: gross_lot_value_cents - channel_fee_cents - refurb_cost_cents"
        default: 0
      - name: refurb_cost_cents
        type: integer
        source: computed
        description: "Stamped at execution: RefurbWorkOrder.total_cost_cents of the line's REPACKAGED work order, else 0"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order lifecycle"
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | EXECUTED | CANCELLED"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispositionSupervisor who approved the order"
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispositionSupervisor who executed the order"
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution; the refund-hold clock starts here"
        default: null
      - name: selected_by_policy
        type: boolean
        source: computed
        description: "True when channel_id was chosen by the channel selector policy rather than supplied in the request"
        default: false

  - name: PricingFeedback
    parent: DispositionOrder
    common_fields: false
    fields:
      - name: disposition_order_id
        type: string
        source: input
        description: "FK -> DispositionOrder.id; the executed order whose realized price is being reported"
      - name: channel_id
        type: string
        source: input
        description: "FK -> SecondaryMarketChannel.id; copied from the order, denormalized so channel feedback is queryable directly"
      - name: expected_price_cents
        type: integer
        source: computed
        description: "DispositionOrder.unit_price_cents at the time of feedback"
      - name: realized_price_cents
        type: integer
        source: input
        description: "Unit price the channel actually settled at"
        constraints: ">= 0"
      - name: variance_pct
        type: number
        source: computed
        description: "round_half_up_4dp((realized_price_cents - expected_price_cents) / expected_price_cents) when expected_price_cents > 0, else 0.0000"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-channel append counter starting at 1; the price index reads the newest rows by sequence_no DESC"


  - name: RefundRelease
    parent: ReturnLine
    common_fields: true
    fields:
      - name: return_line_id
        type: string
        source: input
        description: "FK -> ReturnLine.id; exactly one RefundRelease exists per graded line"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; denormalized from the line's RMA so refund exposure is queryable per client"
      - name: gross_refund_cents
        type: integer
        source: computed
        description: "CatalogItem.declared_value_cents * ReturnLine.quantity, stamped at grading"
      - name: restocking_fee_pct
        type: number
        source: computed
        description: "Restocking-fee fraction selected by the restocking_fee_pct calculation, stamped at grading"
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: "round_half_up(gross_refund_cents * restocking_fee_pct)"
      - name: net_refund_cents
        type: integer
        source: computed
        description: "gross_refund_cents - restocking_fee_cents"
      - name: release_eligible_at
        type: datetime
        source: computed
        description: "Earliest instant the refund may be released; null until the line's DispositionOrder executes"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the refund was released"
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant the refund was clawed back"
        default: null
      - name: denial_reason
        type: string
        source: input
        description: "Operator-supplied reason recorded when the refund is denied"
        default: null

  - name: ShrinkLedgerEntry
    parent: Client
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client whose settlement this entry moves"
      - name: return_line_id
        type: string
        source: input
        description: "FK -> ReturnLine.id; the line that caused the entry, null for RMA-level receipt variance"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "Which cascade appended this entry"
        constraints: "RECEIPT_VARIANCE | RECOVERY_CREDIT | REFUND_DEBIT | REFURB_COST | DONATION_WRITE_OFF | DESTRUCTION_WRITE_OFF | REVERSAL"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed cents; credits are positive, write-offs and refund debits are negative"
      - name: memo
        type: string
        source: system
        description: "Machine-generated audit memo naming the triggering transition"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic per-client append counter starting at 1; fixes the audit-report row order"


# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: ReturnAuthorization
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID, EXPIRED, SUPERSEDED]
    shape: "branching + compound (status is re-derived from the aggregate of its lines' received_quantity and its ReturnLines' disposition_state)"
    transitions:

      - from: DRAFT
        to: ISSUED
        trigger: "POST /return-authorizations/{rma_id}/issue"
        actor: ClientRep
        preconditions:
          - "status == DRAFT"
          - "declared_line_count >= 1 (else ERR_RMA_NO_LINES)"
          - "Client.status == ACTIVE"
          - "expires_at > current logical clock (else ERR_RMA_EXPIRES_IN_PAST)"
        side_effects:
          - "stamps issued_at = current logical clock"
          - "increments ReturnAuthorization.version by 1"
          - "recomputes Client.open_rma_count"

      - from: ISSUED
        to: PARTIALLY_RECEIVED
        trigger: "POST /receipts/{receipt_id}/lines (system re-derivation after each scanned line)"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "0 < received_unit_total < authorized_unit_total after this line is counted"
        side_effects:
          - "recomputes ReturnAuthorizationLine.received_quantity for the scanned line"
          - "recomputes received_unit_total and fraud_flag_count"
          - "increments ReturnAuthorization.version by 1"

      - from: ISSUED
        to: RECEIVED
        trigger: "POST /receipts/{receipt_id}/lines (system re-derivation after each scanned line)"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "received_unit_total == authorized_unit_total after this line is counted"
        side_effects:
          - "recomputes received_unit_total and fraud_flag_count"
          - "increments ReturnAuthorization.version by 1"
        note: "A single receipt covering the whole authorization skips PARTIALLY_RECEIVED entirely."

      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /receipts/{receipt_id}/lines (system re-derivation after each scanned line)"
        actor: system
        preconditions:
          - "status == PARTIALLY_RECEIVED"
          - "received_unit_total == authorized_unit_total after this line is counted"
        side_effects:
          - "recomputes received_unit_total and fraud_flag_count"
          - "increments ReturnAuthorization.version by 1"

      - from: RECEIVED
        to: CLOSED
        trigger: "POST /disposition-orders/{disposition_order_id}/execute (system re-derivation, cascade link 5)"
        actor: system
        preconditions:
          - "status == RECEIVED"
          - "every ReturnLine under every Receipt of this RMA has disposition_state == DISPOSITIONED"
        side_effects:
          - "increments ReturnAuthorization.version by 1"
          - "recomputes Client.open_rma_count"
        note: "Bubble-up: the parent closes only once the last child line is dispositioned."

      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /return-authorizations/{rma_id}/reissue"
        actor: ClientRep
        preconditions:
          - "status == ISSUED"
          - "received_unit_total == 0 (else ERR_RMA_ALREADY_RECEIVING)"
          - "expected_rma_version equals this RMA's current version (else ERR_STALE_RMA_VERSION)"
        side_effects:
          - "mints a NEW ReturnAuthorization in status ISSUED with supersedes_rma_id = this RMA's id, copying client_id, order_reference, customer_reference, order_placed_at and every ReturnAuthorizationLine (catalog_item_id, authorized_quantity, reason_code, declared_serial), and the request's expires_at"
          - "increments ReturnAuthorization.version by 1 on the superseded RMA"
          - "recomputes Client.open_rma_count"

      - from: ISSUED
        to: VOID
        trigger: "POST /return-authorizations/{rma_id}/void"
        actor: CenterAdmin
        preconditions:
          - "status IN {ISSUED, PARTIALLY_RECEIVED}"
        side_effects:
          - "when received_unit_total < authorized_unit_total, appends one ShrinkLedgerEntry per RMA line with entry_type RECEIPT_VARIANCE and amount_cents = -((authorized_quantity - received_quantity) * CatalogItem.declared_value_cents)"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "increments ReturnAuthorization.version by 1"

      - from: PARTIALLY_RECEIVED
        to: VOID
        trigger: "POST /return-authorizations/{rma_id}/void"
        actor: CenterAdmin
        preconditions:
          - "status IN {ISSUED, PARTIALLY_RECEIVED}"
        side_effects:
          - "appends one ShrinkLedgerEntry per RMA line with entry_type RECEIPT_VARIANCE and amount_cents = -((authorized_quantity - received_quantity) * CatalogItem.declared_value_cents), skipping lines whose difference is 0"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "increments ReturnAuthorization.version by 1"
        note: "Already-received ReturnLines keep their own lifecycle; voiding the RMA only writes off the unreceived remainder."

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system expiry sweep)"
        actor: system
        preconditions:
          - "status IN {ISSUED, PARTIALLY_RECEIVED}"
          - "expires_at <= the new logical clock value"
        side_effects:
          - "appends one ShrinkLedgerEntry per RMA line with entry_type RECEIPT_VARIANCE and amount_cents = -((authorized_quantity - received_quantity) * CatalogItem.declared_value_cents), skipping lines whose difference is 0"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "increments ReturnAuthorization.version by 1"
        note: "Sweep order is ReturnAuthorization.created_at ASC so the appended ledger entries have a deterministic order."

      - from: PARTIALLY_RECEIVED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system expiry sweep)"
        actor: system
        preconditions:
          - "status IN {ISSUED, PARTIALLY_RECEIVED}"
          - "expires_at <= the new logical clock value"
        side_effects:
          - "appends one ShrinkLedgerEntry per RMA line with entry_type RECEIPT_VARIANCE and amount_cents = -((authorized_quantity - received_quantity) * CatalogItem.declared_value_cents), skipping lines whose difference is 0"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "increments ReturnAuthorization.version by 1"

  - entity: ReturnLine
    state_field: disposition_state
    initial_state: RECEIVED_UNGRADED
    terminal_states: [DISPOSITIONED]
    shape: "cyclic (DISPOSITION_ASSIGNED -> IN_REFURB -> DISPOSITION_ASSIGNED, plus a DISPOSITION_ASSIGNED self-loop on override) and one of two parallel dimensions on ReturnLine"
    transitions:

      - from: null
        to: RECEIVED_UNGRADED
        trigger: "POST /receipts/{receipt_id}/lines"
        actor: ReceivingClerk
        preconditions:
          - "Receipt exists and its RMA status IN {ISSUED, PARTIALLY_RECEIVED}"
          - "rma_line_id belongs to the Receipt's RMA (else ERR_LINE_RMA_MISMATCH)"
          - "quantity + ReturnAuthorizationLine.received_quantity <= ReturnAuthorizationLine.authorized_quantity (else ERR_AUTHORIZED_QUANTITY_EXCEEDED)"
          - "scanned_serial present when CatalogItem.serialized (else ERR_SERIAL_REQUIRED)"
        side_effects:
          - "stamps days_since_order from the Receipt's received_at and the RMA's order_placed_at"
          - "appends a FraudCheck row with check_type EMPTY_BOX and evaluated_stage RECEIPT, outcome FAIL when Receipt.empty_box_suspected is true"
          - "appends a FraudCheck row with check_type SERIAL_MISMATCH and evaluated_stage RECEIPT when CatalogItem.serialized, outcome FAIL when scanned_serial != ReturnAuthorizationLine.declared_serial"
          - "stamps fraud_score_receipt using the receipt_time_score variant"
          - "sets financial_state = HOLD_PENDING_DISPOSITION"
          - "recomputes ReturnAuthorizationLine.received_quantity, ReturnAuthorization.received_unit_total and ReturnAuthorization.fraud_flag_count, re-deriving the RMA status"
          - "recomputes Client.units_received and Client.units_in_process"

      - from: RECEIVED_UNGRADED
        to: QUARANTINED
        trigger: "POST /return-lines/{return_line_id}/quarantine"
        actor: GradingInspector
        preconditions:
          - "disposition_state == RECEIVED_UNGRADED"
          - "CatalogItem.hazard_class != NONE OR CatalogItem.recall_status != NONE (else ERR_QUARANTINE_NOT_APPLICABLE)"
          - "ProcessingBay.bay_type IN {HAZMAT, QUARANTINE} and ProcessingBay.status == ACTIVE (else ERR_BAY_TYPE_MISMATCH)"
          - "the requested [quarantine_start_at, quarantine_end_at) window does not overlap any other ReturnLine occupation on the same bay (else ERR_BAY_WINDOW_CONFLICT)"
        side_effects:
          - "sets bay_id, quarantine_start_at and quarantine_end_at"
          - "increments ReturnLine.version by 1"

      - from: RECEIVED_UNGRADED
        to: DISPOSITION_ASSIGNED
        trigger: "POST /return-lines/{return_line_id}/grade"
        actor: GradingInspector
        preconditions:
          - "disposition_state == RECEIVED_UNGRADED"
          - "CatalogItem.hazard_class == NONE AND CatalogItem.recall_status != MANDATORY (else ERR_QUARANTINE_REQUIRED)"
          - "Client.status == ACTIVE"
        side_effects:
          - "stamps condition_grade and graded_by_user_id"
          - "computes recovery_value_cents with the provisional_at_grade variant"
          - "appends FraudCheck rows with check_type VALUE_ANOMALY and REPEAT_RETURNER, evaluated_stage GRADING"
          - "stamps fraud_score_release using the release_time_score variant"
          - "sets disposition from the disposition_decision rules"
          - "creates the line's RefundRelease with gross_refund_cents, restocking_fee_pct, restocking_fee_cents and net_refund_cents stamped, release_eligible_at null"
          - "when fraud_score_release >= FRAUD_HOLD_THRESHOLD and < FRAUD_AUTO_DENY_THRESHOLD, moves financial_state HOLD_PENDING_DISPOSITION -> FRAUD_HOLD"
          - "when fraud_score_release >= FRAUD_AUTO_DENY_THRESHOLD, moves financial_state HOLD_PENDING_DISPOSITION -> DENIED"
          - "recomputes ReturnAuthorization.fraud_flag_count"
          - "increments ReturnLine.version by 1"

      - from: QUARANTINED
        to: DISPOSITION_ASSIGNED
        trigger: "POST /return-lines/{return_line_id}/grade"
        actor: GradingInspector
        preconditions:
          - "disposition_state == QUARANTINED"
          - "Client.status == ACTIVE"
        side_effects:
          - "identical to the RECEIVED_UNGRADED -> DISPOSITION_ASSIGNED side effects"
          - "increments ReturnLine.version by 1"

      - from: DISPOSITION_ASSIGNED
        to: DISPOSITION_ASSIGNED
        trigger: "POST /return-lines/{return_line_id}/override-disposition"
        actor: DispositionSupervisor
        preconditions:
          - "disposition_state == DISPOSITION_ASSIGNED"
          - "CatalogItem.recall_status != MANDATORY (else ERR_RECALL_DISPOSITION_LOCKED)"
          - "the requested disposition is not DONATE when CatalogItem.regulated_flag is true (else ERR_REGULATED_DONATION_FORBIDDEN)"
          - "no DispositionOrder for this line is in status EXECUTED"
        side_effects:
          - "overwrites disposition with the requested value"
          - "cancels every DispositionOrder for this line in status PROPOSED or APPROVED, restoring Client.units_reserved_for_disposition to Client.units_in_process"
          - "increments ReturnLine.version by 1"
        note: "Self-loop: the state is unchanged but the observable disposition and version change, which is what makes the OCC guard on POST /disposition-orders meaningful."

      - from: DISPOSITION_ASSIGNED
        to: DISPOSITION_ASSIGNED
        trigger: "POST /catalog-items/{catalog_item_id}/recall with recall_status MANDATORY (system cascade link 2)"
        actor: system
        preconditions:
          - "disposition_state IN {RECEIVED_UNGRADED, QUARANTINED, DISPOSITION_ASSIGNED, IN_REFURB}"
          - "the line's CatalogItem is the recalled item"
        side_effects:
          - "forces disposition = DESTROY"
          - "increments ReturnLine.version by 1"
          - "cascade link 3: every RefurbWorkOrder for this line in status IN {IN_TEST, TEST_FAILED, PASSED_QA} moves to ABANDONED. A work order still in OPEN is deliberately NOT swept: it has consumed no bay time and no labour, so there is nothing to write off; it stays OPEN and is instead permanently barred from ever starting by the priority 31 recall lock"
          - "cascade link 3: every DispositionOrder for this line in status IN {PROPOSED, APPROVED} moves to CANCELLED"

      - from: DISPOSITION_ASSIGNED
        to: IN_REFURB
        trigger: "POST /refurb-work-orders"
        actor: RefurbTechnician
        preconditions:
          - "disposition_state == DISPOSITION_ASSIGNED"
          - "disposition == REFURBISH (else ERR_LINE_NOT_REFURBISHABLE)"
          - "CatalogItem.recall_status != MANDATORY (else ERR_RECALLED_ITEM_NOT_REFURBISHABLE)"
          - "no RefurbWorkOrder for this line is in status IN {OPEN, IN_TEST, TEST_FAILED, PASSED_QA}"
        side_effects:
          - "creates a RefurbWorkOrder in status OPEN with assigned_technician_user_id = the caller's X-User-ID"
          - "increments ReturnLine.version by 1"

      - from: IN_REFURB
        to: DISPOSITION_ASSIGNED
        trigger: "POST /refurb-work-orders/{work_order_id}/repackage"
        actor: RefurbTechnician
        preconditions:
          - "disposition_state == IN_REFURB"
          - "RefurbWorkOrder.status == PASSED_QA"
          - "the caller's X-User-ID != RefurbWorkOrder.qa_user_id (else ERR_SEGREGATION_OF_DUTIES) — the inspector who signed the unit off cannot also close it out"
        side_effects:
          - "re-stamps condition_grade = RefurbWorkOrder.resulting_grade"
          - "recomputes recovery_value_cents with the provisional_at_grade variant against the new grade"
          - "re-runs the disposition_decision rules with refurb_eligible treated as false, so the line cannot re-enter REFURBISH"
          - "recomputes the line's RefundRelease restocking_fee_pct, restocking_fee_cents and net_refund_cents against the new grade"
          - "increments ReturnLine.version by 1"

      - from: IN_REFURB
        to: DISPOSITION_ASSIGNED
        trigger: "POST /refurb-work-orders/{work_order_id}/abandon"
        actor: RefurbTechnician
        preconditions:
          - "disposition_state == IN_REFURB"
          - "RefurbWorkOrder.status IN {OPEN, IN_TEST, TEST_FAILED, PASSED_QA}"
        side_effects:
          - "leaves condition_grade unchanged"
          - "re-runs the disposition_decision rules with refurb_eligible treated as false"
          - "increments ReturnLine.version by 1"

      - from: DISPOSITION_ASSIGNED
        to: DISPOSITIONED
        trigger: "POST /disposition-orders/{disposition_order_id}/execute (cascade link 1)"
        actor: DispositionSupervisor
        preconditions:
          - "disposition_state == DISPOSITION_ASSIGNED"
          - "the executing DispositionOrder is in status APPROVED and its disposition still equals ReturnLine.disposition"
        side_effects:
          - "cascade link 2: appends a ShrinkLedgerEntry for the line (RECOVERY_CREDIT for RESTOCK/LIQUIDATE, DONATION_WRITE_OFF for DONATE, DESTRUCTION_WRITE_OFF for DESTROY)"
          - "cascade link 3: recomputes Client.settlement_balance_cents, Client.shrink_ledger_cents, Client.units_reserved_for_disposition and Client.units_dispositioned from the appended entry"
          - "cascade link 4: when Client.settlement_balance_cents < -Client.max_refund_exposure_cents, moves Client.status ACTIVE -> SUSPENDED"
          - "moves financial_state HOLD_PENDING_DISPOSITION -> RELEASE_PENDING and stamps RefundRelease.release_eligible_at"
          - "cascade link 5: when every sibling ReturnLine of the RMA is DISPOSITIONED, moves the RMA RECEIVED -> CLOSED"
          - "increments ReturnLine.version by 1"

  - entity: ReturnLine
    state_field: financial_state
    initial_state: HOLD_PENDING_DISPOSITION
    terminal_states: [DENIED, CLAWED_BACK]
    shape: "parallel dimension — evolves independently of disposition_state on the same row; the only coupling point is the disposition execute transition"
    transitions:

      - from: HOLD_PENDING_DISPOSITION
        to: FRAUD_HOLD
        trigger: "POST /return-lines/{return_line_id}/grade (system)"
        actor: system
        preconditions:
          - "financial_state == HOLD_PENDING_DISPOSITION"
          - "FRAUD_HOLD_THRESHOLD <= fraud_score_release < FRAUD_AUTO_DENY_THRESHOLD"
        side_effects:
          - "no ShrinkLedgerEntry is written; the money axis simply stops advancing"

      - from: HOLD_PENDING_DISPOSITION
        to: DENIED
        trigger: "POST /return-lines/{return_line_id}/grade (system auto-deny)"
        actor: system
        preconditions:
          - "financial_state == HOLD_PENDING_DISPOSITION"
          - "fraud_score_release >= FRAUD_AUTO_DENY_THRESHOLD"
        side_effects:
          - "stamps RefundRelease.denial_reason = 'AUTO_DENIED_FRAUD_SCORE'"

      - from: HOLD_PENDING_DISPOSITION
        to: RELEASE_PENDING
        trigger: "POST /disposition-orders/{disposition_order_id}/execute (system)"
        actor: system
        preconditions:
          - "financial_state == HOLD_PENDING_DISPOSITION"
          - "the line's disposition_state has just become DISPOSITIONED"
        side_effects:
          - "stamps RefundRelease.release_eligible_at per the refund_release_timing calculation"

      - from: FRAUD_HOLD
        to: HOLD_PENDING_DISPOSITION
        trigger: "POST /return-lines/{return_line_id}/clear-fraud-hold"
        actor: DispositionSupervisor
        preconditions:
          - "financial_state == FRAUD_HOLD"
          - "disposition_state != DISPOSITIONED"
        side_effects:
          - "increments ReturnLine.version by 1"

      - from: FRAUD_HOLD
        to: RELEASE_PENDING
        trigger: "POST /return-lines/{return_line_id}/clear-fraud-hold"
        actor: DispositionSupervisor
        preconditions:
          - "financial_state == FRAUD_HOLD"
          - "disposition_state == DISPOSITIONED"
        side_effects:
          - "stamps RefundRelease.release_eligible_at per the refund_release_timing calculation, measured from DispositionOrder.executed_at"
          - "increments ReturnLine.version by 1"
        note: "Proof that the two dimensions are independent: the physical axis may already be terminal while the money axis is still held."

      - from: FRAUD_HOLD
        to: DENIED
        trigger: "POST /return-lines/{return_line_id}/deny-refund"
        actor: RefundAnalyst
        preconditions:
          - "financial_state IN {HOLD_PENDING_DISPOSITION, FRAUD_HOLD, RELEASE_PENDING}"
        side_effects:
          - "stamps RefundRelease.denial_reason"
          - "increments ReturnLine.version by 1"

      - from: RELEASE_PENDING
        to: DENIED
        trigger: "POST /return-lines/{return_line_id}/deny-refund"
        actor: RefundAnalyst
        preconditions:
          - "financial_state IN {HOLD_PENDING_DISPOSITION, FRAUD_HOLD, RELEASE_PENDING}"
        side_effects:
          - "stamps RefundRelease.denial_reason"
          - "increments ReturnLine.version by 1"

      - from: HOLD_PENDING_DISPOSITION
        to: DENIED
        trigger: "POST /return-lines/{return_line_id}/deny-refund"
        actor: RefundAnalyst
        preconditions:
          - "financial_state IN {HOLD_PENDING_DISPOSITION, FRAUD_HOLD, RELEASE_PENDING}"
        side_effects:
          - "stamps RefundRelease.denial_reason"
          - "increments ReturnLine.version by 1"

      - from: RELEASE_PENDING
        to: REFUNDED
        trigger: "POST /return-lines/{return_line_id}/release-refund"
        actor: RefundAnalyst
        preconditions:
          - "financial_state == RELEASE_PENDING"
          - "the caller's X-User-ID != graded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "current logical clock >= RefundRelease.release_eligible_at (else ERR_REFUND_HOLD_ACTIVE)"
          - "financial_state is not FRAUD_HOLD (else ERR_FRAUD_HOLD_ACTIVE). A hold that was cleared by clear-fraud-hold does NOT re-block the release even though fraud_score_release permanently stays at or above FRAUD_HOLD_THRESHOLD — the score is evidence, the state is the gate."
        side_effects:
          - "stamps RefundRelease.released_at and released_by_user_id"
          - "appends a ShrinkLedgerEntry with entry_type REFUND_DEBIT and amount_cents = -RefundRelease.net_refund_cents"
          - "recomputes Client.settlement_balance_cents from the appended entry"
          - "when Client.settlement_balance_cents < -Client.max_refund_exposure_cents, moves Client.status ACTIVE -> SUSPENDED"
          - "increments ReturnLine.version by 1"

      - from: REFUNDED
        to: CLAWED_BACK
        trigger: "POST /return-lines/{return_line_id}/reverse-refund"
        actor: RefundAnalyst
        preconditions:
          - "financial_state == REFUNDED"
        side_effects:
          - "stamps RefundRelease.reversed_at"
          - "appends a ShrinkLedgerEntry with entry_type REVERSAL and amount_cents = +RefundRelease.net_refund_cents"
          - "recomputes Client.settlement_balance_cents from the appended entry"
          - "when Client.settlement_balance_cents >= -Client.max_refund_exposure_cents, moves Client.status SUSPENDED -> ACTIVE"
          - "increments ReturnLine.version by 1"
        note: "Compensation: the REVERSAL entry exactly offsets the REFUND_DEBIT entry, so settlement_balance_cents returns to its pre-release value."

  - entity: RefurbWorkOrder
    state_field: status
    initial_state: OPEN
    terminal_states: [REPACKAGED, ABANDONED]
    shape: "cyclic — IN_TEST -> TEST_FAILED -> IN_TEST repeats until rework_cycles hits MAX_REWORK_CYCLES"
    transitions:

      - from: OPEN
        to: IN_TEST
        trigger: "POST /refurb-work-orders/{work_order_id}/start-test"
        actor: RefurbTechnician
        preconditions:
          - "status IN {OPEN, TEST_FAILED}"
          - "ProcessingBay.bay_type == GENERAL and ProcessingBay.status == ACTIVE (else ERR_BAY_TYPE_MISMATCH)"
          - "the requested [test_window_start_at, test_window_end_at] window, widened by ProcessingBay.buffer_minutes on both sides, does not intersect any other RefurbWorkOrder window on the same bay (else ERR_BAY_BUFFER_VIOLATION)"
          - "CatalogItem.recall_status != MANDATORY (else ERR_RECALLED_ITEM_NOT_REFURBISHABLE)"
        side_effects:
          - "sets bay_id, test_window_start_at and test_window_end_at"
          - "increments RefurbWorkOrder.version by 1"

      - from: TEST_FAILED
        to: IN_TEST
        trigger: "POST /refurb-work-orders/{work_order_id}/start-test"
        actor: RefurbTechnician
        preconditions:
          - "status IN {OPEN, TEST_FAILED}"
          - "rework_cycles < MAX_REWORK_CYCLES (else ERR_REWORK_LIMIT_EXCEEDED)"
          - "the buffered-window bay check above passes"
        side_effects:
          - "increments rework_cycles by 1"
          - "replaces bay_id, test_window_start_at and test_window_end_at with the new window"
          - "increments RefurbWorkOrder.version by 1"
        note: "The cycle back into IN_TEST is what makes this machine non-linear."

      - from: IN_TEST
        to: TEST_FAILED
        trigger: "POST /refurb-work-orders/{work_order_id}/record-test-result with result FAIL"
        actor: RefurbTechnician
        preconditions:
          - "status == IN_TEST"
        side_effects:
          - "adds the reported labor_minutes to labor_minutes_total and the reported parts_cost_cents to parts_cost_cents"
          - "stamps qa_user_id from the caller's X-User-ID"
          - "increments RefurbWorkOrder.version by 1"

      - from: IN_TEST
        to: PASSED_QA
        trigger: "POST /refurb-work-orders/{work_order_id}/record-test-result with result PASS"
        actor: RefurbTechnician
        preconditions:
          - "status == IN_TEST"
        side_effects:
          - "adds the reported labor_minutes to labor_minutes_total and the reported parts_cost_cents to parts_cost_cents"
          - "stamps qa_user_id from the caller's X-User-ID"
          - "increments RefurbWorkOrder.version by 1"

      - from: PASSED_QA
        to: REPACKAGED
        trigger: "POST /refurb-work-orders/{work_order_id}/repackage"
        actor: RefurbTechnician
        preconditions:
          - "status == PASSED_QA"
          - "the caller's X-User-ID != qa_user_id (else ERR_SEGREGATION_OF_DUTIES) — the inspector who signed the unit off cannot also close it out"
          - "resulting_grade IN {A, B} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "stamps packaging_cost_cents and resulting_grade; qa_user_id was already stamped by record-test-result"
          - "stamps total_cost_cents per the refurb_total_cost calculation"
          - "appends a ShrinkLedgerEntry with entry_type REFURB_COST and amount_cents = -total_cost_cents"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "moves the ReturnLine IN_REFURB -> DISPOSITION_ASSIGNED with the re-graded disposition"
          - "increments RefurbWorkOrder.version by 1"

      - from: IN_TEST
        to: ABANDONED
        trigger: "POST /refurb-work-orders/{work_order_id}/abandon"
        actor: RefurbTechnician
        preconditions:
          - "status IN {OPEN, IN_TEST, TEST_FAILED, PASSED_QA}"
        side_effects:
          - "stamps total_cost_cents per the refurb_total_cost calculation with packaging_cost_cents = 0"
          - "appends a ShrinkLedgerEntry with entry_type REFURB_COST and amount_cents = -total_cost_cents"
          - "recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "moves the ReturnLine IN_REFURB -> DISPOSITION_ASSIGNED, re-running the disposition rules with refurb_eligible treated as false"
          - "increments RefurbWorkOrder.version by 1"

      - from: TEST_FAILED
        to: ABANDONED
        trigger: "POST /refurb-work-orders/{work_order_id}/abandon"
        actor: RefurbTechnician
        preconditions:
          - "status IN {OPEN, IN_TEST, TEST_FAILED, PASSED_QA}"
        side_effects:
          - "identical to the IN_TEST -> ABANDONED side effects"

      - from: OPEN
        to: ABANDONED
        trigger: "POST /refurb-work-orders/{work_order_id}/abandon"
        actor: RefurbTechnician
        preconditions:
          - "status IN {OPEN, IN_TEST, TEST_FAILED, PASSED_QA}"
        side_effects:
          - "identical to the IN_TEST -> ABANDONED side effects, with labor_minutes_total 0 producing total_cost_cents 0 and no ShrinkLedgerEntry"

      - from: IN_TEST
        to: ABANDONED
        trigger: "POST /catalog-items/{catalog_item_id}/recall with recall_status MANDATORY (system cascade link 3)"
        actor: system
        preconditions:
          - "status IN {IN_TEST, TEST_FAILED, PASSED_QA} — an OPEN work order is left OPEN by the cascade because no labour or bay time has been consumed"
          - "the work order's ReturnLine has just had disposition forced to DESTROY by cascade link 2"
        side_effects:
          - "stamps total_cost_cents per the refurb_total_cost calculation with packaging_cost_cents = 0"
          - "cascade link 4: appends a ShrinkLedgerEntry with entry_type REFURB_COST and amount_cents = -total_cost_cents, then recomputes Client.shrink_ledger_cents and Client.settlement_balance_cents"
          - "increments RefurbWorkOrder.version by 1"
        note: "Sweep order across affected work orders is RefurbWorkOrder.created_at ASC."

  - entity: DispositionOrder
    state_field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED, CANCELLED]
    shape: "branching — PROPOSED forks to APPROVED->EXECUTED (ledger-writing branch) or to CANCELLED (unit-restoring branch); the two branches have disjoint side-effect sets"
    transitions:

      - from: null
        to: PROPOSED
        trigger: "POST /disposition-orders"
        actor: DispositionSupervisor
        preconditions:
          - "ReturnLine.disposition_state == DISPOSITION_ASSIGNED"
          - "ReturnLine.disposition IN {RESTOCK, LIQUIDATE, DONATE, DESTROY} (REFURBISH lines must finish their work order first, else ERR_LINE_INVALID_DISPOSITION_STATE)"
          - "expected_return_line_version equals ReturnLine.version (else ERR_STALE_RETURN_LINE_VERSION)"
          - "no other DispositionOrder for this line is in status IN {PROPOSED, APPROVED, EXECUTED}"
          - "for non-RESTOCK dispositions, channel_window_start_at and channel_window_end_at are present and start <= end (else ERR_INVALID_REQUEST)"
          - "the resolved channel satisfies the routing, hazard, recall, grade, min-lot and window-capacity checks in §1.4"
        side_effects:
          - "copies disposition and quantity from the ReturnLine"
          - "resolves channel_id from the request, or by the channel_selector_policy when omitted, setting selected_by_policy accordingly"
          - "computes unit_price_cents per the disposition_unit_price calculation"
          - "moves Client.units_in_process -> Client.units_reserved_for_disposition by quantity"
          - "increments ReturnLine.version by 1"

      - from: PROPOSED
        to: APPROVED
        trigger: "POST /disposition-orders/{disposition_order_id}/approve"
        actor: DispositionSupervisor
        preconditions:
          - "status == PROPOSED"
          - "channel_id is null (RESTOCK) OR SecondaryMarketChannel.status == ACTIVE (else ERR_CHANNEL_PAUSED)"
          - "the ReturnLine's disposition still equals this order's disposition (else ERR_DISPOSITION_DRIFT)"
        side_effects:
          - "stamps approved_by_user_id"
          - "increments DispositionOrder.version by 1"

      - from: APPROVED
        to: EXECUTED
        trigger: "POST /disposition-orders/{disposition_order_id}/execute"
        actor: DispositionSupervisor
        preconditions:
          - "status == APPROVED"
          - "channel_id is null OR SecondaryMarketChannel.status == ACTIVE (else ERR_CHANNEL_PAUSED)"
          - "when disposition == DESTROY and Client.destroy_requires_dual_signoff, the caller's X-User-ID != approved_by_user_id (else ERR_DUAL_SIGNOFF_REQUIRED)"
        side_effects:
          - "stamps gross_lot_value_cents, effective_fee_pct, channel_fee_cents, refurb_cost_cents and net_recovery_cents per the disposition_net_recovery calculation"
          - "stamps executed_by_user_id and executed_at"
          - "cascade link 1: moves the ReturnLine DISPOSITION_ASSIGNED -> DISPOSITIONED and re-stamps ReturnLine.recovery_value_cents with the final_at_execution variant"
          - "increments DispositionOrder.version by 1"
        note: "Every downstream hop (ledger append, client recomputation, exposure suspension, RMA close) is caused by the ReturnLine transition, not by this transition directly — see the ReturnLine disposition_state machine."

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /disposition-orders/{disposition_order_id}/cancel"
        actor: DispositionSupervisor
        preconditions:
          - "status IN {PROPOSED, APPROVED}"
        side_effects:
          - "moves Client.units_reserved_for_disposition -> Client.units_in_process by quantity"
          - "writes no ShrinkLedgerEntry, so Client.settlement_balance_cents is unchanged"
          - "increments DispositionOrder.version by 1"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /disposition-orders/{disposition_order_id}/cancel"
        actor: DispositionSupervisor
        preconditions:
          - "status IN {PROPOSED, APPROVED}"
        side_effects:
          - "identical to the PROPOSED -> CANCELLED side effects"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /catalog-items/{catalog_item_id}/recall with recall_status MANDATORY, or POST /return-lines/{return_line_id}/override-disposition (system)"
        actor: system
        preconditions:
          - "status IN {PROPOSED, APPROVED}"
          - "the order's ReturnLine.disposition has just changed away from this order's frozen disposition"
        side_effects:
          - "moves Client.units_reserved_for_disposition -> Client.units_in_process by quantity"
          - "increments DispositionOrder.version by 1"
        note: "Sweep order across affected orders is DispositionOrder.created_at ASC."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — nothing else)
# =============================================================================

concurrency_rules:

  - rule_id: rma-reissue-stale-version
    parent_entity: ReturnAuthorization
    write_endpoint: "POST /return-authorizations/{rma_id}/reissue"
    occ_field: "expected_rma_version"
    description: |
      Reissuing a ReturnAuthorization mints a replacement RMA and moves the
      source RMA to SUPERSEDED. A reissue request whose expected_rma_version
      no longer matches the source RMA's current version is rejected: the
      client's view of the authorization is stale, because a prior reissue
      has already legitimately superseded it (or the RMA has since advanced
      through receiving). Without the guard the second request would mint a
      second replacement chained off an already-superseded parent.
    error_id: ERR_STALE_RMA_VERSION
    http_status: 412

  - rule_id: disposition-order-create-stale-line
    parent_entity: ReturnLine
    write_endpoint: "POST /disposition-orders"
    occ_field: "expected_return_line_version"
    description: |
      Creating a DispositionOrder freezes the ReturnLine's disposition into
      the order. A create request whose expected_return_line_version no
      longer matches the line's current version is rejected: a supervisor
      override (or a mandatory-recall cascade) has already changed the
      line's disposition, so the caller would be routing units to a channel
      chosen for a disposition the line no longer carries.
    error_id: ERR_STALE_RETURN_LINE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global precision convention: every money value is an integer count of cents.
# `round_half_up(x)` rounds a rational to the nearest integer cent, .5 away
# from zero. Percentage inputs are decimals with exactly 2 fractional digits
# and are compared using integer arithmetic on their scaled form
# (`pct_scaled = round_half_up(pct * 100)`) so no floating-point tolerance is
# ever needed. No calculation reads any entity's `id`.
# =============================================================================

calculations:

  - name: receipt_expected_weight
    trigger: "POST /receipts (stamped once at scan time)"
    algorithm: aggregation
    formula: |
      expected_weight_grams =
        PACKAGING_TARE_GRAMS
        + SUM over every ReturnAuthorizationLine L with L.rma_id == receipt.rma_id
            of ( CatalogItem(L.catalog_item_id).unit_weight_grams * L.authorized_quantity )
      empty_box_suspected =
        ( gross_weight_grams * 100 ) < ( expected_weight_grams * EMPTY_BOX_THRESHOLD_PCT_SCALED )
    input_set: "Every ReturnAuthorizationLine of the receipt's RMA, with no status filter (authorized lines have no status of their own); the sum is over authorized_quantity, NOT received_quantity, so a second partial receipt on the same RMA reuses the same expectation."
    constants:
      PACKAGING_TARE_GRAMS: 200
      EMPTY_BOX_THRESHOLD_PCT_SCALED: 60
    precision: "integer grams; the comparison is strict `<` on the cross-multiplied integers, so a package weighing exactly 60% of expectation is NOT suspected"

  - name: return_line_fraud_score
    trigger: "receipt_time_score at POST /receipts/{receipt_id}/lines; release_time_score at POST /return-lines/{return_line_id}/grade and again on every POST /return-lines/{return_line_id}/release-refund attempt"
    algorithm: weighted_scoring
    formula: |
      # Individual checks, each producing exactly one FraudCheck row.
      EMPTY_BOX        FAIL  <=>  Receipt.empty_box_suspected == true
      SERIAL_MISMATCH  FAIL  <=>  CatalogItem.serialized == true
                                  AND ReturnLine.scanned_serial != ReturnAuthorizationLine.declared_serial
      VALUE_ANOMALY    FAIL  <=>  ( CatalogItem.declared_value_cents * ReturnLine.quantity
                                    - ReturnLine.recovery_value_cents )
                                  > Client.fraud_tolerance_cents
      REPEAT_RETURNER  FAIL  <=>  COUNT( ReturnAuthorization R
                                         WHERE R.client_id == this Client.id
                                           AND R.customer_reference == this RMA.customer_reference
                                           AND R.status NOT IN {VOID, SUPERSEDED} )
                                  >= REPEAT_RETURNER_RMA_THRESHOLD

      weight_points(check) = FRAUD_WEIGHTS[check.check_type] if check.outcome == FAIL else 0

      score = SUM of weight_points over the included check set
    input_set: "FraudCheck rows belonging to this ReturnLine only. The REPEAT_RETURNER count includes the RMA under test itself and counts RMAs in DRAFT, ISSUED, PARTIALLY_RECEIVED, RECEIVED, CLOSED and EXPIRED; it excludes VOID and SUPERSEDED."
    constants:
      FRAUD_WEIGHTS: { SERIAL_MISMATCH: 40, EMPTY_BOX: 50, VALUE_ANOMALY: 20, REPEAT_RETURNER: 15 }
      REPEAT_RETURNER_RMA_THRESHOLD: 3
      FRAUD_HOLD_THRESHOLD: 50
      FRAUD_AUTO_DENY_THRESHOLD: 90
    precision: "integer points; thresholds are inclusive `>=`, so exactly 50 holds and exactly 90 auto-denies"
    variants:
      - name: receipt_time_score
        when: "stamped into ReturnLine.fraud_score_receipt at line scan, before any condition grade exists"
        difference: "Includes ONLY the checks whose evaluated_stage is RECEIPT — EMPTY_BOX and SERIAL_MISMATCH. VALUE_ANOMALY is structurally unavailable (recovery_value_cents is still 0) and REPEAT_RETURNER is deliberately deferred so a clerk's scan never depends on the customer's history. Maximum reachable value: 90."
      - name: release_time_score
        when: "stamped into ReturnLine.fraud_score_release at grading, and recomputed on every refund release attempt"
        difference: "Includes ALL FOUR checks — the two RECEIPT-stage rows plus the two GRADING-stage rows. For identical physical inputs this variant returns a strictly larger value than receipt_time_score whenever either GRADING-stage check fails, and it alone decides FRAUD_HOLD / auto-DENY."

  - name: return_line_recovery_value
    trigger: "provisional_at_grade at POST /return-lines/{return_line_id}/grade and at POST /refurb-work-orders/{work_order_id}/repackage; final_at_execution at POST /disposition-orders/{disposition_order_id}/execute"
    algorithm: forward_looking
    formula: |
      # --- provisional_at_grade -------------------------------------------
      per_unit_provisional =
        round_half_up( CatalogItem.declared_value_cents
                       * GRADE_VALUE_MULTIPLIER[ReturnLine.condition_grade]
                       * ( 1 - REASON_PENALTY_PCT[ReturnLine.reason_code] ) )
      recovery_value_cents = per_unit_provisional * ReturnLine.quantity

      # --- final_at_execution ---------------------------------------------
      recovery_value_cents = DispositionOrder.net_recovery_cents
    input_set: "provisional_at_grade reads only the ReturnLine's own condition_grade and reason_code plus its CatalogItem's declared_value_cents — no channel, no refurb cost, no realized price. final_at_execution reads only the executed DispositionOrder's stamped net_recovery_cents, which already nets the channel fee and the REPACKAGED work order's total_cost_cents."
    constants:
      GRADE_VALUE_MULTIPLIER: { A: 0.85, B: 0.65, C: 0.40, D: 0.20, SCRAP: 0.00 }
      REASON_PENALTY_PCT: { DEFECTIVE: 0.10, WRONG_ITEM: 0.00, NOT_AS_DESCRIBED: 0.05, BUYER_REMORSE: 0.00, SHIPPING_DAMAGE: 0.15, RECALL: 1.00 }
    precision: "round to the cent ONCE, per unit, BEFORE multiplying by quantity. Multiplying first and rounding once at the end is a different number for many inputs and is wrong."
    variants:
      - name: provisional_at_grade
        when: "the line has been graded but its DispositionOrder has not executed"
        difference: "A pure catalog-value estimate: grade multiplier times reason penalty times declared value. It is the number the disposition decision rules and the VALUE_ANOMALY fraud check both read."
      - name: final_at_execution
        when: "the line's DispositionOrder reaches EXECUTED"
        difference: "Replaced wholesale by the realized channel economics — gross lot value minus the channel fee minus the sunk refurb cost. For the same line this is normally a different number from provisional_at_grade, and the difference is exactly what the audit report calls recovery variance."

  - name: restocking_fee_pct
    trigger: "POST /return-lines/{return_line_id}/grade (stamped onto the line's RefundRelease); recomputed at POST /refurb-work-orders/{work_order_id}/repackage because condition_grade changes"
    algorithm: threshold
    formula: |
      base_pct       = REASON_BASE_FEE_PCT[ReturnLine.reason_code]
      service_adj    = SERVICE_LEVEL_FEE_ADJ_PCT[Client.service_level]
      grade_adj      = GRADE_FEE_ADJ_PCT[ReturnLine.condition_grade]
      late_adj       = 0.20 if ReturnLine.days_since_order > 60
                       else 0.10 if ReturnLine.days_since_order > 30
                       else 0.00        # bands are exclusive-lower and mutually exclusive: NOT cumulative
      restocking_fee_pct = min( FEE_PCT_CEILING,
                                max( 0.00, base_pct + service_adj + grade_adj + late_adj ) )
    input_set: "Four independent inputs — the receipt-time reason_code (NOT the authorized reason_code on the RMA line), the Client's contracted service_level, the line's current condition_grade, and days_since_order stamped at scan. UNGRADED never reaches this calculation because it only runs at or after grading."
    constants:
      REASON_BASE_FEE_PCT: { BUYER_REMORSE: 0.20, NOT_AS_DESCRIBED: 0.10, WRONG_ITEM: 0.00, DEFECTIVE: 0.00, SHIPPING_DAMAGE: 0.00, RECALL: 0.00 }
      SERVICE_LEVEL_FEE_ADJ_PCT: { SL_STANDARD: 0.00, SL_PRIORITY: -0.05, SL_WHITE_GLOVE: -0.10 }
      GRADE_FEE_ADJ_PCT: { A: 0.00, B: 0.05, C: 0.10, D: 0.15, SCRAP: 0.25 }
      FEE_PCT_CEILING: 0.50
      LATE_BAND_1_DAYS: 30
      LATE_BAND_2_DAYS: 60
    precision: "the sum is exact 2-decimal arithmetic, clamped by nested min/max; the clamp is applied to the SUM, never term by term, so a -0.10 service credit can offset a +0.05 grade surcharge before the floor is tested"

  - name: refund_amounts
    trigger: "POST /return-lines/{return_line_id}/grade (creates the RefundRelease); recomputed at POST /refurb-work-orders/{work_order_id}/repackage"
    algorithm: aggregation
    formula: |
      gross_refund_cents   = CatalogItem.declared_value_cents * ReturnLine.quantity
      restocking_fee_cents = round_half_up( gross_refund_cents * restocking_fee_pct )
      net_refund_cents     = gross_refund_cents - restocking_fee_cents
    input_set: "One ReturnLine and its CatalogItem; the refund base is the client-declared value, never the recovery estimate."
    constants: {}
    precision: "one rounding, applied to the fee only; the net is a subtraction of integers so gross == fee + net always holds exactly"

  - name: refund_release_timing
    trigger: "POST /disposition-orders/{disposition_order_id}/execute (stamps release_eligible_at); read by POST /return-lines/{return_line_id}/release-refund"
    algorithm: threshold
    formula: |
      hold_hours = 0 if Client.service_level == SL_WHITE_GLOVE else Client.refund_hold_hours
      RefundRelease.release_eligible_at = DispositionOrder.executed_at + hold_hours hours
      release permitted  <=>  current_logical_clock >= RefundRelease.release_eligible_at
    input_set: "The single executed DispositionOrder for this line (the one whose status is EXECUTED) and the Client's contracted service level. For a line cleared out of FRAUD_HOLD after execution, executed_at is still the base instant, so a fraud investigation does not extend the hold."
    constants:
      WHITE_GLOVE_HOLD_HOURS: 0
    precision: "instant comparison is inclusive `>=` at millisecond resolution; a release attempted at exactly release_eligible_at succeeds, one millisecond earlier fails with ERR_REFUND_HOLD_ACTIVE"

  - name: refurb_total_cost
    trigger: "POST /refurb-work-orders/{work_order_id}/repackage and POST /refurb-work-orders/{work_order_id}/abandon (including the abandon driven by the mandatory-recall cascade)"
    algorithm: aggregation
    formula: |
      direct_cents = ( labor_minutes_total * REFURB_LABOR_RATE_CENTS_PER_MIN )
                     + parts_cost_cents
                     + packaging_cost_cents
      total_cost_cents = round_half_up( direct_cents * ( 1 + REFURB_OVERHEAD_PCT ) )
    input_set: "labor_minutes_total and parts_cost_cents accumulated across EVERY test cycle of this work order, including failed cycles; packaging_cost_cents is 0 unless the order reached REPACKAGED."
    constants:
      REFURB_LABOR_RATE_CENTS_PER_MIN: 95
      REFURB_OVERHEAD_PCT: 0.15
      MAX_REWORK_CYCLES: 2
    precision: "overhead is applied ONCE to the accumulated direct cost, not per test cycle; applying it per cycle and summing yields a different total for multi-cycle orders"

  - name: disposition_decision
    trigger: "POST /return-lines/{return_line_id}/grade, POST /refurb-work-orders/{work_order_id}/repackage, POST /refurb-work-orders/{work_order_id}/abandon, and the mandatory-recall cascade"
    algorithm: constraint_propagation
    formula: |
      # Rules are evaluated top to bottom; the FIRST match wins and no later
      # rule can revise it. `refurb_eligible_effective` is
      # CatalogItem.refurb_eligible at grading and is forced to false when the
      # rule set is re-run after a repackage or an abandon.

      projected_refurb_margin_cents =
          round_half_up( CatalogItem.declared_value_cents * GRADE_VALUE_MULTIPLIER[B] )
          - REFURB_STANDARD_COST_CENTS

      D1  CatalogItem.recall_status == MANDATORY                       -> DESTROY
      D2  CatalogItem.hazard_class != NONE
            AND condition_grade IN {C, D, SCRAP}                       -> DESTROY
      D3  condition_grade == SCRAP                                     -> DESTROY
      D4  GRADE_RANK[condition_grade] <= GRADE_RANK[Client.restock_grade_floor]
            AND CatalogItem.hazard_class == NONE
            AND CatalogItem.recall_status == NONE                      -> RESTOCK
      D5  refurb_eligible_effective == true
            AND condition_grade IN {B, C}
            AND CatalogItem.hazard_class == NONE
            AND projected_refurb_margin_cents > 0                      -> REFURBISH
      D6  ( recovery_value_cents * 100 )
            >= ( CatalogItem.declared_value_cents
                 * ReturnLine.quantity
                 * round_half_up(Client.liquidation_floor_pct * 100) ) -> LIQUIDATE
      D7  Client.donation_allowed == true
            AND condition_grade != SCRAP
            AND CatalogItem.regulated_flag == false                    -> DONATE
      D8  otherwise                                                    -> DESTROY
    input_set: "Exactly one ReturnLine plus its CatalogItem and Client. recovery_value_cents is always the provisional_at_grade variant here — the decision never sees realized channel economics. ADVISORY recalls do NOT force DESTROY but do block RESTOCK via D4's `recall_status == NONE` clause."
    constants:
      GRADE_RANK: { A: 1, B: 2, C: 3, D: 4, SCRAP: 5 }
      REFURB_STANDARD_COST_CENTS: 6000
    precision: |
      D5 uses a strict `>` on the projected margin, so a projected margin of
      exactly 0 does NOT refurbish. D6 compares cross-multiplied integers and
      the floor is deliberately NOT pre-rounded to cents: a recovery estimate
      that ties the exact product liquidates, one scaled point below it falls
      through to D7.

  - name: disposition_unit_price
    trigger: "POST /disposition-orders (stamped once at creation and frozen)"
    algorithm: tiered_pricing
    formula: |
      if DispositionOrder.disposition == RESTOCK:
          unit_price_cents = round_half_up( ReturnLine.recovery_value_cents
                                            / ReturnLine.quantity )
      else if DispositionOrder.disposition IN {DONATE, DESTROY}:
          unit_price_cents = 0
      else:   # LIQUIDATE
          indexed = round_half_up( ( ReturnLine.recovery_value_cents / ReturnLine.quantity )
                                   * SecondaryMarketChannel.price_index_pct )
          unit_price_cents = max( CatalogItem.secondary_market_floor_cents, indexed )
    input_set: "The line's provisional recovery estimate divided by its quantity, the resolved channel's current price_index_pct, and the SKU's secondary-market floor. A RESTOCK order has no channel, so the index never applies."
    constants: {}
    precision: "the index multiplication is rounded to the cent BEFORE the floor is applied, so the floor always wins ties exactly at equality"

  - name: disposition_net_recovery
    trigger: "POST /disposition-orders/{disposition_order_id}/execute"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — gross lot value. `realized_unit_price_cents` is the optional
      # request field; when omitted the frozen unit_price_cents is used.
      gross_lot_value_cents = ( realized_unit_price_cents ?? unit_price_cents )
                              * DispositionOrder.quantity

      # STEP 2 — the fee band is keyed on the GROSS lot value computed in
      # STEP 1. It is NOT keyed on net_recovery_cents, even though the prose
      # "the commission band the lot finally settles into" reads that way:
      # net depends on the fee and the fee depends on the band, so keying the
      # band on net would be circular. The order is pinned here.
      band_surcharge_pct = GROSS_BAND_SURCHARGE_PCT[ band(gross_lot_value_cents) ]
      #   band(v):  v <  25000            -> SMALL_LOT
      #             25000 <= v < 100000    -> MID_LOT
      #             v >= 100000            -> LARGE_LOT

      # STEP 3 — effective fee, clamped, then rounded once.
      effective_fee_pct = min( FEE_PCT_MAX,
                               max( 0.00,
                                    SecondaryMarketChannel.fee_pct + band_surcharge_pct ) )
      channel_fee_cents = round_half_up( gross_lot_value_cents * effective_fee_pct )

      # STEP 4 — sunk refurb cost of this line's REPACKAGED work order, else 0.
      refurb_cost_cents = RefurbWorkOrder.total_cost_cents
                          for the work order of this ReturnLine whose status is REPACKAGED,
                          otherwise 0

      # STEP 5 — net.
      net_recovery_cents = gross_lot_value_cents - channel_fee_cents - refurb_cost_cents

      # RESTOCK orders have channel_id null: effective_fee_pct = 0.00 and
      # channel_fee_cents = 0, so net == gross - refurb_cost.
      # DESTROY orders additionally accrue DESTRUCTION_FEE_CENTS per unit,
      # charged in the ledger entry, not in net_recovery_cents.
    input_set: "Exactly one DispositionOrder, its channel (or none for RESTOCK), and at most one REPACKAGED RefurbWorkOrder of the same ReturnLine. ABANDONED work orders are excluded here because their cost was already written off to the shrink ledger when they were abandoned."
    constants:
      GROSS_BAND_SURCHARGE_PCT: { SMALL_LOT: 0.06, MID_LOT: 0.00, LARGE_LOT: -0.04 }
      SMALL_LOT_CEILING_CENTS: 25000
      LARGE_LOT_FLOOR_CENTS: 100000
      FEE_PCT_MAX: 0.40
      DESTRUCTION_FEE_CENTS: 750
    precision: "band boundaries are `>=` on the lower edge: a gross lot of exactly 25000 is MID_LOT, and exactly 100000 is LARGE_LOT. The fee is rounded once, after the clamp."

  - name: shrink_ledger_entry_amount
    trigger: "every cascade that appends a ShrinkLedgerEntry"
    algorithm: waterfall_allocation
    formula: |
      RECOVERY_CREDIT        (disposition IN {RESTOCK, LIQUIDATE} executed)
        amount_cents = net_recovery_cents
                       - round_half_up( net_recovery_cents * CENTER_HANDLING_SHARE_PCT )
      DONATION_WRITE_OFF     (disposition DONATE executed)
        amount_cents = -( CatalogItem.declared_value_cents * quantity )
      DESTRUCTION_WRITE_OFF  (disposition DESTROY executed)
        amount_cents = -( ( CatalogItem.declared_value_cents + DESTRUCTION_FEE_CENTS )
                          * quantity )
      REFUND_DEBIT           (refund released)
        amount_cents = -RefundRelease.net_refund_cents
      REVERSAL               (refund reversed)
        amount_cents = +RefundRelease.net_refund_cents
      REFURB_COST            (work order REPACKAGED or ABANDONED)
        amount_cents = -RefurbWorkOrder.total_cost_cents
      RECEIPT_VARIANCE       (RMA voided or expired with an unreceived remainder)
        amount_cents = -( ( authorized_quantity - received_quantity )
                          * CatalogItem.declared_value_cents )
    input_set: "One triggering entity per entry. The center's handling share is withheld from the recovery credit for CLIENT_OWNED inventory and for CENTER_OWNED inventory alike — inventory_ownership changes who the credit settles to, not how it is computed."
    constants:
      CENTER_HANDLING_SHARE_PCT: 0.075
      DESTRUCTION_FEE_CENTS: 750
    precision: "the handling share is rounded to the cent PER ENTRY at append time; entries are immutable once written"

  - name: client_settlement_balance
    trigger: "recomputed on every ShrinkLedgerEntry append; read by GET /clients/{client_id} and GET /clients/{client_id}/disposition-audit"
    algorithm: chronological
    formula: |
      # Per-entry amounts are ALREADY rounded integers (see
      # shrink_ledger_entry_amount). The aggregate is therefore a pure integer
      # sum over immutable rows:
      settlement_balance_cents =
        SUM of ShrinkLedgerEntry.amount_cents
        over entries with client_id == this Client.id,
        traversed in sequence_no ASC order

      shrink_ledger_cents =
        SUM of ShrinkLedgerEntry.amount_cents
        over entries with client_id == this Client.id
        AND entry_type IN {RECEIPT_VARIANCE, REFURB_COST,
                           DONATION_WRITE_OFF, DESTRUCTION_WRITE_OFF}

      # PINNED ROUNDING ORDER — round per entry, then sum.
      # The tempting alternative is to recompute the aggregate from raw
      # products and round once at the end, e.g. for RECOVERY_CREDIT:
      #     WRONG: sum(net_i) - round_half_up( sum(net_i) * 0.075 )
      #     RIGHT: sum( net_i - round_half_up( net_i * 0.075 ) )
      # The two differ by up to one cent per entry in either direction and
      # they diverge on ordinary data: three credits with net_i of 1333, 2777
      # and 4111 give 7605 under the pinned order and 7604 under the
      # sum-then-round order.

      # --- projected_balance variant --------------------------------------
      projected_settlement_balance_cents =
          settlement_balance_cents
        + SUM over every DispositionOrder O of this Client with
            O.status IN {PROPOSED, APPROVED} of
              projected_ledger_amount(O)
        - SUM over every RefundRelease R of this Client whose ReturnLine
            financial_state == RELEASE_PENDING of
              R.net_refund_cents

      projected_ledger_amount(O) =
        let gross = O.unit_price_cents * O.quantity                  # frozen price, never a realized price
        in  case O.disposition of
              RESTOCK ->                                               # channel_id null: no fee at all
                let net = gross - O.refurb_cost_cents
                in  net - round_half_up(net * CENTER_HANDLING_SHARE_PCT)
              LIQUIDATE ->
                let eff  = min(0.40, max(0.00, O.channel.fee_pct + GROSS_BAND_SURCHARGE_PCT[band(gross)]))
                    net  = gross - round_half_up(gross * eff) - O.refurb_cost_cents
                in  net - round_half_up(net * CENTER_HANDLING_SHARE_PCT)
              DONATE  -> -( CatalogItem.declared_value_cents * O.quantity )
              DESTROY -> -( ( CatalogItem.declared_value_cents + DESTRUCTION_FEE_CENTS ) * O.quantity )
        # This mirrors disposition_net_recovery exactly: a RESTOCK order is
        # fee-free in the projection because it is fee-free at execution.
    input_set: "Every ShrinkLedgerEntry of the client, with no status or window filter — the ledger is append-only and nothing is ever excluded. Entries are traversed in sequence_no ASC order (the per-client monotonic append counter); because the aggregate is an integer sum the traversal order does not change the total, and no assertion anywhere depends on residual ordering within a single cascade."
    constants:
      CENTER_HANDLING_SHARE_PCT: 0.075
      DESTRUCTION_FEE_CENTS: 750
      GROSS_BAND_SURCHARGE_PCT: { SMALL_LOT: 0.06, MID_LOT: 0.00, LARGE_LOT: -0.04 }
    precision: "integer cents; NO rounding happens at aggregation time because every summand was rounded exactly once at append time. The projected variant rounds the handling share on the projected net of each in-flight order, again per entry."
    variants:
      - name: booked_balance
        when: "read as Client.settlement_balance_cents and as the disposition-audit report's settlement_balance_cents"
        difference: "Counts ONLY ShrinkLedgerEntry rows that have actually been appended. Nothing in flight contributes: a PROPOSED or APPROVED DispositionOrder and an unreleased RefundRelease are both invisible to it."
      - name: projected_balance
        when: "read as Client.projected_settlement_balance_cents and as the disposition-audit report's projected_settlement_balance_cents"
        difference: "Adds the ledger amount every PROPOSED or APPROVED DispositionOrder would append if it executed at its FROZEN unit_price_cents, and subtracts every RELEASE_PENDING refund not yet released. For identical stored data the two variants disagree whenever anything is in flight — a client with one proposed LIQUIDATE order and no ledger rows reads booked 0 and projected 5461."

  - name: client_unit_conservation
    trigger: "recomputed on every ReturnLine scan, DispositionOrder create/cancel/execute"
    algorithm: aggregation
    formula: |
      units_received = SUM of ReturnLine.quantity
                       over every ReturnLine whose Receipt's RMA has client_id == this Client.id,
                       with NO status filter (a denied refund or an abandoned refurb
                       does not remove the physical units from the building)

      units_reserved_for_disposition =
        SUM of DispositionOrder.quantity
        over orders whose ReturnLine belongs to this Client
        AND order.status IN {PROPOSED, APPROVED}

      units_dispositioned =
        SUM of ReturnLine.quantity
        over this Client's lines with disposition_state == DISPOSITIONED

      units_in_process = units_received
                         - units_reserved_for_disposition
                         - units_dispositioned

      # CONSERVED QUANTITY (invariant, must hold after every request):
      #   units_received == units_in_process
      #                     + units_reserved_for_disposition
      #                     + units_dispositioned
    input_set: "All of this Client's ReturnLines and DispositionOrders. EXECUTED and CANCELLED orders are excluded from the reserved bucket: execution moves the units into units_dispositioned, cancellation returns them to units_in_process."
    constants: {}
    precision: "exact integer unit counts; no rounding"

  - name: channel_price_index
    trigger: "POST /pricing-feedback"
    algorithm: decay_function
    formula: |
      ratio(f) = ( f.realized_price_cents * 10000 ) / f.expected_price_cents
                 rounded half-up to an integer of ten-thousandths,
                 when f.expected_price_cents > 0; otherwise 10000

      window = the newest up-to-PRICE_INDEX_WINDOW PricingFeedback rows for this
               channel, selected by sequence_no DESC (sequence_no is the
               channel's monotonic append counter, so this order is total)

      raw_index_scaled = round_half_up( SUM of ratio(f) over window
                                        / COUNT(window) )

      price_index_pct = clamp( raw_index_scaled / 10000,
                               PRICE_INDEX_FLOOR, PRICE_INDEX_CEILING )
                        expressed with 4 fractional digits
    input_set: "PricingFeedback rows of this channel only, newest PRICE_INDEX_WINDOW rows by sequence_no DESC. When the channel has exactly one feedback row the index is that row's ratio, clamped."
    constants:
      PRICE_INDEX_WINDOW: 3
      PRICE_INDEX_FLOOR: 0.5000
      PRICE_INDEX_CEILING: 1.5000
    precision: "the mean is computed on integer ten-thousandths and rounded once; clamping is applied after rounding"

  - name: channel_selector_policy
    trigger: "POST /disposition-orders when channel_id is omitted and the line's disposition is not RESTOCK"
    algorithm: topological
    formula: |
      # (a) ELIGIBILITY FILTER — the candidate set, as an explicit predicate.
      candidate(C) <=>
            C.status == ACTIVE
        AND C.channel_type IN DISPOSITION_CHANNEL_TYPES[ReturnLine.disposition]
        AND ReturnLine.condition_grade IN C.accepted_grades
        AND ( CatalogItem.hazard_class == NONE OR C.hazard_certified == true )
        AND ( CatalogItem.recall_status != MANDATORY OR C.recall_certified == true )
        AND projected_net_recovery_cents(C) >= C.min_lot_value_cents
        AND the order's [channel_window_start_at, channel_window_end_at] window
            would not push C over C.concurrent_lot_capacity (see §1.4 priority 57)

      projected_net_recovery_cents(C) =
        let gross = disposition_unit_price(C) * ReturnLine.quantity
        in  gross - round_half_up( gross * effective_fee_pct(C, gross) )

      # (b) RANKING EXPRESSION — highest projected net recovery first.
      sort candidates by projected_net_recovery_cents(C) DESC

      # (c) TIE-BREAK, applied in order when the ranking ties:
      #     1. C.fee_pct ASC
      #     2. C.min_lot_value_cents ASC
      #     3. C.channel_code ASC (lexicographic; channel_code is unique)
      #     `id` is never consulted.

      # (d) RESTOCK orders never enter this policy at all: DISPOSITION_CHANNEL_TYPES
      #     has no RESTOCK key, channel_id stays null, and no channel predicate,
      #     capacity rule or min-lot rule is evaluated for them.
      # (e) EMPTY CANDIDATE SET -> reject with ERR_NO_ELIGIBLE_CHANNEL (409).
      #     No implicit fallback channel and no deferred queue exist.
    input_set: "Every SecondaryMarketChannel row; the eligibility predicate above is the only filter. DONATE resolves against DONATION_PARTNER channels, DESTROY against CERTIFIED_DESTRUCTION channels, LIQUIDATE against AUCTION, BULK_LIQUIDATOR and OUTLET channels."
    constants:
      DISPOSITION_CHANNEL_TYPES:
        LIQUIDATE: [AUCTION, BULK_LIQUIDATOR, OUTLET]
        DONATE: [DONATION_PARTNER]
        DESTROY: [CERTIFIED_DESTRUCTION]
    precision: "the projected net uses the same pinned STEP-1..STEP-5 order as disposition_net_recovery, with realized_unit_price_cents absent; ranking compares integers so no tolerance is needed"

  - name: disposition_audit_report
    trigger: "GET /clients/{client_id}/disposition-audit"
    algorithm: aggregation
    formula: |
      disposition_counts = for each of RESTOCK, REFURBISH, LIQUIDATE, DONATE,
        DESTROY: COUNT of this Client's ReturnLines whose disposition equals it
        (lines still PENDING are reported under a separate pending_count)
      recovery_credit_cents        = SUM amount_cents where entry_type == RECOVERY_CREDIT
      refund_debit_cents           = SUM amount_cents where entry_type == REFUND_DEBIT
      reversal_cents               = SUM amount_cents where entry_type == REVERSAL
      refurb_cost_cents            = SUM amount_cents where entry_type == REFURB_COST
      donation_write_off_cents     = SUM amount_cents where entry_type == DONATION_WRITE_OFF
      destruction_write_off_cents  = SUM amount_cents where entry_type == DESTRUCTION_WRITE_OFF
      receipt_variance_cents       = SUM amount_cents where entry_type == RECEIPT_VARIANCE
      recovery_variance_cents      = SUM over this Client's DISPOSITIONED lines of
        ( DispositionOrder.net_recovery_cents - provisional_recovery_at_grade_cents )
      projected_settlement_balance_cents = the projected_balance variant of
        client_settlement_balance for this Client
      unit_conservation_ok  = ( units_received == units_in_process
                                + units_reserved_for_disposition
                                + units_dispositioned )
      money_conservation_ok = ( settlement_balance_cents
                                == recovery_credit_cents + refund_debit_cents
                                   + reversal_cents + refurb_cost_cents
                                   + donation_write_off_cents
                                   + destruction_write_off_cents
                                   + receipt_variance_cents )
    input_set: "All ShrinkLedgerEntry rows and all ReturnLines of the one Client, unfiltered. provisional_recovery_at_grade_cents is re-derived from the line's condition_grade and reason_code at report time, so a repackaged line reports against its post-refurb grade."
    constants: {}
    precision: "integer cents throughout; both conservation flags are exact equality tests, never tolerance comparisons"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule decides the response and no later rule is consulted)
# ---------------------------------------------------------------------------
validations:
  # --- authentication / authorization -------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the presented X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when X-User-Role is ClientRep, every Client, CatalogItem, ReturnAuthorization, Receipt, ReturnLine, RefurbWorkOrder, DispositionOrder, RefundRelease and ShrinkLedgerEntry reached by the request resolves to the Client whose id equals X-User-ID; filtered list reads are silently narrowed to that client instead of erroring, but an explicit path id belonging to another client is rejected"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include ClientRep"

  # --- request shape ------------------------------------------------------
  - priority: 4
    category: business_constraint
    check: "request body parses, every non-optional field of the endpoint's input list is present, enum fields carry a declared member, integer fields are integers, quantity and authorized_quantity are >= 1, percentage fields are within their declared range, and ISO-8601 instant fields parse as UTC instants; unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  # --- existence (path ids left-to-right, then body FKs in input order) ----
  - priority: 5
    category: existence
    check: "client_id resolves to a Client"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /clients/{client_id}, GET /clients/{client_id}/disposition-audit, POST /catalog-items, POST /return-authorizations, GET /catalog-items?client_id, GET /return-authorizations?client_id, GET /shrink-ledger-entries?client_id, GET /refund-releases?client_id"

  - priority: 6
    category: existence
    check: "catalog_item_id resolves to a CatalogItem"
    error_id: ERR_CATALOG_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /catalog-items/{catalog_item_id}, POST /catalog-items/{catalog_item_id}/recall, POST /return-authorizations/{rma_id}/lines, GET /return-authorization-lines?catalog_item_id"

  - priority: 7
    category: existence
    check: "bay_id resolves to a ProcessingBay"
    error_id: ERR_BAY_NOT_FOUND
    http_status: 404
    applies_to: "GET /processing-bays/{bay_id}, POST /return-lines/{return_line_id}/quarantine, POST /refurb-work-orders/{work_order_id}/start-test, GET /return-lines?bay_id, GET /refurb-work-orders?bay_id"

  - priority: 8
    category: existence
    check: "channel_id resolves to a SecondaryMarketChannel"
    error_id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /secondary-market-channels/{channel_id}, POST /secondary-market-channels/{channel_id}/pause, POST /disposition-orders, POST /pricing-feedback, GET /disposition-orders?channel_id, GET /pricing-feedback?channel_id"

  - priority: 9
    category: existence
    check: "rma_id resolves to a ReturnAuthorization"
    error_id: ERR_RMA_NOT_FOUND
    http_status: 404
    applies_to: "GET /return-authorizations/{rma_id} and every POST /return-authorizations/{rma_id}/* action, POST /receipts, GET /return-authorization-lines?rma_id, GET /receipts?rma_id"

  - priority: 10
    category: existence
    check: "rma_line_id resolves to a ReturnAuthorizationLine"
    error_id: ERR_RMA_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /return-authorization-lines/{rma_line_id}, POST /receipts/{receipt_id}/lines, GET /return-lines?rma_line_id"

  - priority: 11
    category: existence
    check: "receipt_id resolves to a Receipt"
    error_id: ERR_RECEIPT_NOT_FOUND
    http_status: 404
    applies_to: "GET /receipts/{receipt_id}, POST /receipts/{receipt_id}/lines, GET /return-lines?receipt_id"

  - priority: 12
    category: existence
    check: "return_line_id resolves to a ReturnLine"
    error_id: ERR_RETURN_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /return-lines/{return_line_id} and every POST /return-lines/{return_line_id}/* action, GET /return-lines/{return_line_id}/fraud-checks, POST /refurb-work-orders, POST /disposition-orders, GET /refurb-work-orders?return_line_id, GET /disposition-orders?return_line_id, GET /refund-releases?return_line_id, GET /shrink-ledger-entries?return_line_id"

  - priority: 13
    category: existence
    check: "work_order_id resolves to a RefurbWorkOrder"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /refurb-work-orders/{work_order_id} and every POST /refurb-work-orders/{work_order_id}/* action"

  - priority: 14
    category: existence
    check: "disposition_order_id resolves to a DispositionOrder"
    error_id: ERR_DISPOSITION_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /disposition-orders/{disposition_order_id} and every POST /disposition-orders/{disposition_order_id}/* action, POST /pricing-feedback, GET /pricing-feedback?disposition_order_id"

  - priority: 15
    category: existence
    check: "refund_release_id resolves to a RefundRelease"
    error_id: ERR_REFUND_RELEASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /refund-releases/{refund_release_id}"

  - priority: 16
    category: existence
    check: "pricing_feedback_id resolves to a PricingFeedback"
    error_id: ERR_PRICING_FEEDBACK_NOT_FOUND
    http_status: 404
    applies_to: "GET /pricing-feedback/{pricing_feedback_id}"

  - priority: 17
    category: existence
    check: "shrink_ledger_entry_id resolves to a ShrinkLedgerEntry"
    error_id: ERR_SHRINK_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /shrink-ledger-entries/{shrink_ledger_entry_id}"

  # --- referential coherence between two resolved resources ---------------
  - priority: 18
    category: business_referential
    check: "the rma_line_id supplied to POST /receipts/{receipt_id}/lines belongs to the same ReturnAuthorization as the receipt; the return_line_id supplied to POST /refurb-work-orders and POST /disposition-orders resolves through a Receipt of an RMA owned by the same Client as every other referenced resource; the disposition_order_id and channel_id supplied to POST /pricing-feedback agree"
    error_id: ERR_LINE_RMA_MISMATCH
    http_status: 409
    applies_to: "POST /receipts/{receipt_id}/lines, POST /refurb-work-orders, POST /disposition-orders, POST /pricing-feedback"

  # --- state preconditions ------------------------------------------------
  - priority: 19
    category: state
    check: "the owning Client.status is ACTIVE; a SUSPENDED client accepts no new RMAs, no new receipts, no new disposition orders and no refund releases, but still accepts GET reads and POST /return-lines/{id}/reverse-refund (a suspension must never block a clawback)"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "POST /return-authorizations, POST /return-authorizations/{rma_id}/lines, POST /return-authorizations/{rma_id}/issue, POST /receipts, POST /receipts/{receipt_id}/lines, POST /disposition-orders, POST /return-lines/{return_line_id}/release-refund"

  - priority: 20
    category: state
    check: "the ReturnAuthorization is in a status that admits the requested transition: lines may only be added in DRAFT, issue only from DRAFT, void only from ISSUED or PARTIALLY_RECEIVED, reissue only from ISSUED, and receipts may only be created against ISSUED or PARTIALLY_RECEIVED"
    error_id: ERR_RMA_INVALID_STATE
    http_status: 409
    applies_to: "POST /return-authorizations/{rma_id}/lines, POST /return-authorizations/{rma_id}/issue, POST /return-authorizations/{rma_id}/void, POST /return-authorizations/{rma_id}/reissue, POST /receipts"

  - priority: 21
    category: state
    check: "the ReturnAuthorization has not expired: its status is not EXPIRED, and if its status is ISSUED or PARTIALLY_RECEIVED its expires_at is strictly after the current logical time (expires_at exactly equal to now is expired)"
    error_id: ERR_RMA_EXPIRED
    http_status: 409
    applies_to: "POST /receipts, POST /return-authorizations/{rma_id}/reissue"

  - priority: 22
    category: state
    check: "the ReturnAuthorization has no Receipt rows yet, which is what makes a reissue safe; once anything has been physically received the RMA must be voided rather than superseded"
    error_id: ERR_RMA_ALREADY_RECEIVING
    http_status: 409
    applies_to: "POST /return-authorizations/{rma_id}/reissue"

  - priority: 23
    category: state
    check: "the ReturnLine.disposition_state admits the requested transition: quarantine only from RECEIVED_UNGRADED, grade only from RECEIVED_UNGRADED or QUARANTINED, override-disposition only from DISPOSITION_ASSIGNED, refurb work order creation only from DISPOSITION_ASSIGNED with disposition REFURBISH, and disposition order creation only from DISPOSITION_ASSIGNED"
    error_id: ERR_LINE_INVALID_DISPOSITION_STATE
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/quarantine, POST /return-lines/{return_line_id}/grade, POST /return-lines/{return_line_id}/override-disposition, POST /refurb-work-orders, POST /disposition-orders"

  - priority: 24
    category: state
    check: "the ReturnLine.financial_state admits the requested transition: release-refund only from RELEASE_PENDING or FRAUD_HOLD, deny-refund only from HOLD_PENDING_DISPOSITION, FRAUD_HOLD or RELEASE_PENDING, clear-fraud-hold only from FRAUD_HOLD, reverse-refund only from REFUNDED. A line still in HOLD_PENDING_DISPOSITION is rejected here even when other refund preconditions also fail. A release attempt on a FRAUD_HOLD line deliberately passes THIS rule and is caught at priority 38 instead, so the caller is told the fraud hold is the reason rather than being given a generic state error."
    error_id: ERR_LINE_INVALID_FINANCIAL_STATE
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/release-refund, POST /return-lines/{return_line_id}/deny-refund, POST /return-lines/{return_line_id}/clear-fraud-hold, POST /return-lines/{return_line_id}/reverse-refund"

  - priority: 25
    category: state
    check: "the RefurbWorkOrder.status admits the requested transition: start-test only from OPEN or TEST_FAILED, record-test-result only from IN_TEST, repackage only from PASSED_QA, abandon only from OPEN, IN_TEST, TEST_FAILED or PASSED_QA"
    error_id: ERR_WORK_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /refurb-work-orders/{work_order_id}/start-test, POST /refurb-work-orders/{work_order_id}/record-test-result, POST /refurb-work-orders/{work_order_id}/repackage, POST /refurb-work-orders/{work_order_id}/abandon"

  - priority: 26
    category: state
    check: "the DispositionOrder.status admits the requested transition: approve only from PROPOSED, execute only from APPROVED, cancel only from PROPOSED or APPROVED"
    error_id: ERR_DISPOSITION_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /disposition-orders/{disposition_order_id}/approve, POST /disposition-orders/{disposition_order_id}/execute, POST /disposition-orders/{disposition_order_id}/cancel"

  - priority: 27
    category: state
    check: "the resolved SecondaryMarketChannel.status is ACTIVE; a PAUSED channel accepts neither new disposition orders nor execution of orders already proposed against it"
    error_id: ERR_CHANNEL_PAUSED
    http_status: 409
    applies_to: "POST /disposition-orders, POST /disposition-orders/{disposition_order_id}/execute"

  # --- optimistic concurrency (see §1.2.1) --------------------------------
  - priority: 28
    category: state
    check: "expected_rma_version equals the current ReturnAuthorization.version"
    error_id: ERR_STALE_RMA_VERSION
    http_status: 412
    applies_to: "POST /return-authorizations/{rma_id}/reissue"

  - priority: 29
    category: state
    check: "expected_return_line_version equals the current ReturnLine.version"
    error_id: ERR_STALE_RETURN_LINE_VERSION
    http_status: 412
    applies_to: "POST /disposition-orders"

  # --- business rules, group (a): safety / compliance / regulatory --------
  - priority: 30
    category: business_safety
    check: "a ReturnLine whose CatalogItem.recall_status is MANDATORY has been force-dispositioned to DESTROY and that disposition is locked: it cannot be overridden, and no DispositionOrder may be created for it with any disposition other than DESTROY. This safety lock is evaluated BEFORE any channel-suitability or fiscal check, so a request that both violates the recall lock and names a channel that does not accept the line's grade returns ERR_RECALL_DISPOSITION_LOCKED."
    error_id: ERR_RECALL_DISPOSITION_LOCKED
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/override-disposition, POST /disposition-orders"

  - priority: 31
    category: business_safety
    check: "no RefurbWorkOrder may be opened for a ReturnLine whose CatalogItem.recall_status is MANDATORY, and no existing work order for such an item may be started, tested or repackaged"
    error_id: ERR_RECALLED_ITEM_NOT_REFURBISHABLE
    http_status: 409
    applies_to: "POST /refurb-work-orders, POST /refurb-work-orders/{work_order_id}/start-test, POST /refurb-work-orders/{work_order_id}/record-test-result, POST /refurb-work-orders/{work_order_id}/repackage"

  - priority: 32
    category: business_safety
    check: "a DONATE disposition is forbidden when CatalogItem.regulated_flag is true, when CatalogItem.hazard_class is not NONE, or when the owning Client.donation_allowed is false — the item must be liquidated or destroyed instead"
    error_id: ERR_REGULATED_DONATION_FORBIDDEN
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/override-disposition, POST /disposition-orders"

  - priority: 33
    category: business_safety
    check: "a ReturnLine whose CatalogItem.hazard_class is not NONE, or whose CatalogItem.recall_status is MANDATORY, must first complete a quarantine occupation in a HAZMAT or QUARANTINE bay; grading such a line straight from RECEIVED_UNGRADED is rejected. A line with recall_status ADVISORY and hazard_class NONE may be graded directly."
    error_id: ERR_QUARANTINE_REQUIRED
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/grade"

  - priority: 34
    category: business_safety
    check: "the resolved SecondaryMarketChannel has hazard_certified true whenever the line's CatalogItem.hazard_class is not NONE, and recall_certified true whenever its recall_status is MANDATORY"
    error_id: ERR_CHANNEL_NOT_HAZARD_CERTIFIED
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 35
    category: business_safety
    check: "when the owning Client.destroy_requires_dual_signoff is true, a DESTROY DispositionOrder may only be executed by an X-User-ID that differs from the approved_by_user_id stamped by the earlier approve call; the two signatures must come from two people. Because this rule precedes priority 36, an approver-equals-executor DESTROY execution returns ERR_DUAL_SIGNOFF_REQUIRED and never ERR_SEGREGATION_OF_DUTIES"
    error_id: ERR_DUAL_SIGNOFF_REQUIRED
    http_status: 409
    applies_to: "POST /disposition-orders/{disposition_order_id}/execute"

  - priority: 36
    category: business_safety
    check: "segregation of duties on X-User-ID: the user releasing or denying a refund must differ from ReturnLine.graded_by_user_id, and the user repackaging a work order must differ from RefurbWorkOrder.qa_user_id. The DESTROY approver-versus-executor separation is enforced one rung earlier, at priority 35, so it never surfaces here. This safety separation outranks every temporal and fiscal check, so a release attempt by the grader inside an unexpired hold window returns ERR_SEGREGATION_OF_DUTIES."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /return-lines/{return_line_id}/release-refund, POST /return-lines/{return_line_id}/deny-refund, POST /refurb-work-orders/{work_order_id}/repackage, POST /disposition-orders/{disposition_order_id}/execute"

  - priority: 37
    category: business_safety
    check: "the X-User-ID recording a test result, which is stamped as RefurbWorkOrder.qa_user_id, must differ from RefurbWorkOrder.assigned_technician_user_id — a technician cannot pass their own rework through QA"
    error_id: ERR_QA_SELF_INSPECTION
    http_status: 403
    applies_to: "POST /refurb-work-orders/{work_order_id}/record-test-result"

  - priority: 38
    category: business_safety
    check: "a refund cannot be released while the line's financial_state is FRAUD_HOLD; the hold must first be cleared by a RefundAnalyst through clear-fraud-hold, which returns the line to HOLD_PENDING_DISPOSITION when its DispositionOrder has not executed yet and moves it straight to RELEASE_PENDING when it has"
    error_id: ERR_FRAUD_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/release-refund"

  # --- business rules, group (b): constraint satisfaction -----------------
  - priority: 40
    category: business_constraint
    check: "an RMA cannot be issued with zero ReturnAuthorizationLine rows"
    error_id: ERR_RMA_NO_LINES
    http_status: 409
    applies_to: "POST /return-authorizations/{rma_id}/issue"

  - priority: 41
    category: business_constraint
    check: "expires_at is strictly after the current logical time at creation and at reissue, and order_placed_at is not after the current logical time"
    error_id: ERR_RMA_EXPIRES_IN_PAST
    http_status: 422
    applies_to: "POST /return-authorizations, POST /return-authorizations/{rma_id}/reissue"

  - priority: 42
    category: business_constraint
    check: "scanned_serial is present and non-empty when the referenced CatalogItem.serialized is true; declared_serial is likewise required on an authorization line for a serialized item"
    error_id: ERR_SERIAL_REQUIRED
    http_status: 422
    applies_to: "POST /return-authorizations/{rma_id}/lines, POST /receipts/{receipt_id}/lines"

  - priority: 43
    category: business_constraint
    check: "the aggregate of already-received quantity plus this scan must not exceed the ReturnAuthorizationLine.authorized_quantity; each individual scan may be within range while their sum is not"
    error_id: ERR_AUTHORIZED_QUANTITY_EXCEEDED
    http_status: 409
    applies_to: "POST /receipts/{receipt_id}/lines"

  - priority: 44
    category: business_constraint
    check: "a RefurbWorkOrder may only be opened for a line whose CatalogItem.refurb_eligible is true and whose disposition is REFURBISH"
    error_id: ERR_LINE_NOT_REFURBISHABLE
    http_status: 409
    applies_to: "POST /refurb-work-orders"

  - priority: 45
    category: business_constraint
    check: "start-test is rejected once RefurbWorkOrder.rework_cycles has reached MAX_REWORK_CYCLES (2); the work order must be abandoned instead"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /refurb-work-orders/{work_order_id}/start-test"

  - priority: 46
    category: business_constraint
    check: "quarantine is rejected for a line whose CatalogItem.hazard_class is NONE AND whose CatalogItem.recall_status is NONE — an ordinary line has nothing to quarantine for. Note the asymmetry with priority 33: ADVISORY recall MAY be quarantined but need not be, so the two rules are not mirror images."
    error_id: ERR_QUARANTINE_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/quarantine"

  - priority: 47
    category: business_constraint
    check: "the ProcessingBay type matches the work and its status is ACTIVE: a quarantine occupation requires bay_type HAZMAT or QUARANTINE, and a refurbishment test window requires bay_type GENERAL"
    error_id: ERR_BAY_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/quarantine, POST /refurb-work-orders/{work_order_id}/start-test"

  - priority: 48
    category: business_constraint
    check: "the resolved SecondaryMarketChannel.accepted_grades contains the line's condition_grade, and its channel_type is a member of DISPOSITION_CHANNEL_TYPES for the line's disposition"
    error_id: ERR_CHANNEL_GRADE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 49
    category: business_constraint
    check: "the disposition named on the DispositionOrder request equals the ReturnLine's current disposition, and the order's quantity equals the line's remaining un-reserved quantity; a line whose disposition changed after the order was proposed cannot be executed against the stale disposition"
    error_id: ERR_DISPOSITION_DRIFT
    http_status: 409
    applies_to: "POST /disposition-orders, POST /disposition-orders/{disposition_order_id}/execute"

  - priority: 50
    category: business_constraint
    check: "when channel_id is omitted on a NON-RESTOCK order, the channel_selector_policy candidate set is non-empty after applying every eligibility predicate. A RESTOCK order never consults the selector at all: its channel_id stays null and this rule does not apply to it"
    error_id: ERR_NO_ELIGIBLE_CHANNEL
    http_status: 409
    applies_to: "POST /disposition-orders"

  # --- business rules, group (c): temporal conflicts ----------------------
  - priority: 55
    category: business_temporal
    check: "a quarantine occupation of a ProcessingBay must not overlap an existing occupation of the same bay. Windows are HALF-OPEN [quarantine_start_at, quarantine_end_at): two occupations collide when start_new < end_existing AND start_existing < end_new, so an occupation starting exactly when another ends is allowed."
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/quarantine"

  - priority: 56
    category: business_temporal
    check: "a RefurbWorkOrder test window in a GENERAL bay must not fall within ProcessingBay.buffer_minutes of any other test window in that bay: the existing window is widened by buffer_minutes on BOTH sides before the half-open overlap test, so a window starting exactly buffer_minutes after another ends is accepted and one minute earlier is rejected"
    error_id: ERR_BAY_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /refurb-work-orders/{work_order_id}/start-test"

  - priority: 57
    category: business_temporal
    check: "admission formula, pinned: 1 + COUNT(PROPOSED or APPROVED DispositionOrders on the resolved channel whose lot window overlaps the requested one) must be <= SecondaryMarketChannel.concurrent_lot_capacity, so the order being created counts against the capacity. Channel lot windows are CLOSED [channel_window_start_at, channel_window_end_at]: two windows that merely touch at an endpoint DO overlap, unlike bay occupations. The check is an aggregate: each existing order is individually admissible while the collection is not."
    error_id: ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 58
    category: business_temporal
    check: "the current logical time is at or after ReturnLine's RefundRelease.release_eligible_at, computed by refund_release_timing from the client's refund_hold_hours and service level"
    error_id: ERR_REFUND_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/release-refund"

  # --- business rules, group (d): fiscal / capacity checks last ----------
  - priority: 60
    category: business_fiscal
    check: "the projected net recovery of the lot is at least SecondaryMarketChannel.min_lot_value_cents (>= is satisfied at exact equality)"
    error_id: ERR_CHANNEL_MIN_LOT_NOT_MET
    http_status: 409
    applies_to: "POST /disposition-orders"

  - priority: 61
    category: business_fiscal
    check: "the sum of already-released net refunds for the Client plus this release must not exceed Client.max_refund_exposure_cents (exact equality is allowed)"
    error_id: ERR_REFUND_EXCEEDS_EXPOSURE_CAP
    http_status: 409
    applies_to: "POST /return-lines/{return_line_id}/release-refund"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# entity_topology is `flat`: there is no URL nesting by aggregate root, so
# every entity is addressable at its own top-level collection and every FK is
# reverse-reachable through a filtered list on the child collection. FraudCheck
# is cascade-created and never posted directly, but it is still readable both as
# the convenience sub-resource GET /return-lines/{return_line_id}/fraud-checks
# and through its own top-level GET /fraud-checks collection.
# api_prefix is "" — paths below are complete.
# ---------------------------------------------------------------------------
endpoints:

  # ===== clients ===========================================================
  - method: POST
    path: "/clients"
    description: "Register a returns-processing client with its business rules, service level and inventory ownership."
    roles: [CenterAdmin]
    code: 201
    input: [name, client_code, service_level, inventory_ownership, "restock_grade_floor?", "refund_hold_hours?", "liquidation_floor_pct?", "fraud_tolerance_cents?", "donation_allowed?", "destroy_requires_dual_signoff?", "max_refund_exposure_cents?"]
    output: Client
    side_effects: ["status initialised to ACTIVE", "all unit and money aggregates initialised to 0", "price-independent client rule set frozen for later disposition_decision and restocking_fee_pct evaluation"]

  - method: GET
    path: "/clients/{client_id}"
    description: "Read one client with its live unit-conservation buckets and settlement balance."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients."
    roles: [CenterAdmin]
    code: 200
    input: ["client_code?", "status?", "service_level?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/clients/{client_id}/suspend"
    description: "Suspend a client, halting new authorizations, receipts, disposition orders and refund releases while leaving reads and clawbacks available."
    roles: [CenterAdmin]
    code: 200
    input: ["suspension_reason?"]
    output: Client
    side_effects: ["Client.status -> SUSPENDED"]

  - method: POST
    path: "/clients/{client_id}/reinstate"
    description: "Return a SUSPENDED client to ACTIVE."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.status -> ACTIVE"]

  - method: GET
    path: "/clients/{client_id}/disposition-audit"
    description: "Computed shrink and disposition audit report for one client: per-disposition counts, per-entry-type ledger totals, provisional-vs-final recovery variance, and the two conservation flags."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output:
      pending_count: integer
      restock_count: integer
      refurbish_count: integer
      liquidate_count: integer
      donate_count: integer
      destroy_count: integer
      recovery_credit_cents: integer
      refund_debit_cents: integer
      reversal_cents: integer
      refurb_cost_cents: integer
      donation_write_off_cents: integer
      destruction_write_off_cents: integer
      receipt_variance_cents: integer
      recovery_variance_cents: integer
      settlement_balance_cents: integer
      projected_settlement_balance_cents: integer
      shrink_ledger_cents: integer
      units_received: integer
      units_in_process: integer
      units_reserved_for_disposition: integer
      units_dispositioned: integer
      unit_conservation_ok: boolean
      money_conservation_ok: boolean
    side_effects: []

  # ===== catalog items =====================================================
  - method: POST
    path: "/catalog-items"
    description: "Register a client SKU with its declared value, weight, serialization, hazard class and refurb eligibility."
    roles: [CenterAdmin]
    code: 201
    input: [client_id, sku, description, declared_value_cents, unit_weight_grams, serialized, refurb_eligible, secondary_market_floor_cents, "hazard_class?", "regulated_flag?"]
    output: CatalogItem
    side_effects: ["recall_status initialised to NONE"]

  - method: GET
    path: "/catalog-items/{catalog_item_id}"
    description: "Read one catalog item."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefurbTechnician, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/catalog-items"
    description: "List catalog items, filterable by owning client."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, ClientRep]
    code: 200
    input: ["client_id?", "sku?", "hazard_class?", "recall_status?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  - method: POST
    path: "/catalog-items/{catalog_item_id}/recall"
    description: "Record a recall notice against a SKU. A MANDATORY recall fires the four-level regulated cascade described in §1.2."
    roles: [CenterAdmin]
    code: 200
    input: [recall_status]
    output: CatalogItem
    side_effects: ["CatalogItem.recall_status updated", "on MANDATORY: every non-DISPOSITIONED ReturnLine of this SKU is force-set to disposition DESTROY and re-enters DISPOSITION_ASSIGNED", "on MANDATORY: every PROPOSED or APPROVED DispositionOrder of those lines is CANCELLED and its units return to units_in_process", "on MANDATORY: every RefurbWorkOrder of those lines in status IN {IN_TEST, TEST_FAILED, PASSED_QA} becomes ABANDONED and appends a REFURB_COST ShrinkLedgerEntry; a work order still in OPEN is left OPEN, since it has incurred no cost, and is instead blocked forever by ERR_RECALLED_ITEM_NOT_REFURBISHABLE at start-test", "on MANDATORY: affected Clients' aggregates and settlement_balance_cents recomputed"]

  # ===== processing bays ===================================================
  - method: POST
    path: "/processing-bays"
    description: "Register a processing bay with its type and inter-window buffer."
    roles: [CenterAdmin]
    code: 201
    input: [bay_code, bay_type, "buffer_minutes?"]
    output: ProcessingBay
    side_effects: []

  - method: GET
    path: "/processing-bays/{bay_id}"
    description: "Read one processing bay."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefurbTechnician]
    code: 200
    input: []
    output: ProcessingBay
    side_effects: []

  - method: GET
    path: "/processing-bays"
    description: "List processing bays."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefurbTechnician]
    code: 200
    input: ["bay_type?", "status?", "limit?", "offset?"]
    output: ProcessingBay[]
    side_effects: []

  # ===== secondary market channels ========================================
  - method: POST
    path: "/secondary-market-channels"
    description: "Register a secondary-market, donation or certified-destruction channel with its accepted grades, commission and lot capacity."
    roles: [CenterAdmin]
    code: 201
    input: [name, channel_code, channel_type, accepted_grades, fee_pct, hazard_certified, recall_certified, min_lot_value_cents, concurrent_lot_capacity]
    output: SecondaryMarketChannel
    side_effects: ["price_index_pct initialised to 1.0000", "status initialised to ACTIVE"]

  - method: GET
    path: "/secondary-market-channels/{channel_id}"
    description: "Read one channel with its current price index."
    roles: [CenterAdmin, DispositionSupervisor, ClientRep]
    code: 200
    input: []
    output: SecondaryMarketChannel
    side_effects: []

  - method: GET
    path: "/secondary-market-channels"
    description: "List channels."
    roles: [CenterAdmin, DispositionSupervisor, ClientRep]
    code: 200
    input: ["channel_type?", "status?", "hazard_certified?", "limit?", "offset?"]
    output: SecondaryMarketChannel[]
    side_effects: []

  - method: POST
    path: "/secondary-market-channels/{channel_id}/pause"
    description: "Pause a channel, removing it from the selector candidate set and blocking execution of orders already routed to it."
    roles: [CenterAdmin, DispositionSupervisor]
    code: 200
    input: ["pause_reason?"]
    output: SecondaryMarketChannel
    side_effects: ["SecondaryMarketChannel.status -> PAUSED"]

  - method: POST
    path: "/secondary-market-channels/{channel_id}/resume"
    description: "Return a PAUSED channel to ACTIVE."
    roles: [CenterAdmin, DispositionSupervisor]
    code: 200
    input: []
    output: SecondaryMarketChannel
    side_effects: ["SecondaryMarketChannel.status -> ACTIVE"]

  # ===== return authorizations ============================================
  - method: POST
    path: "/return-authorizations"
    description: "Open a DRAFT return authorization for a client order."
    roles: [CenterAdmin, ClientRep]
    code: 201
    input: [client_id, order_reference, customer_reference, order_placed_at, expires_at]
    output: ReturnAuthorization
    side_effects: ["status DRAFT", "Client.open_rma_count recomputed"]

  - method: GET
    path: "/return-authorizations/{rma_id}"
    description: "Read one return authorization with its declared/authorized/received rollups."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: GET
    path: "/return-authorizations"
    description: "List return authorizations, filterable by client, status, customer or the RMA they supersede."
    roles: [CenterAdmin, ReceivingClerk, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: ["client_id?", "status?", "customer_reference?", "supersedes_rma_id?", "limit?", "offset?"]
    output: ReturnAuthorization[]
    side_effects: []

  - method: POST
    path: "/return-authorizations/{rma_id}/lines"
    description: "Declare an authorized line (SKU, quantity, reason code) on a DRAFT authorization."
    roles: [CenterAdmin, ClientRep]
    code: 201
    input: [catalog_item_id, authorized_quantity, reason_code, "declared_serial?"]
    output: ReturnAuthorizationLine
    side_effects: ["ReturnAuthorization.declared_line_count and authorized_unit_total recomputed"]

  - method: GET
    path: "/return-authorization-lines/{rma_line_id}"
    description: "Read one authorized line with its received-quantity rollup."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, ClientRep]
    code: 200
    input: []
    output: ReturnAuthorizationLine
    side_effects: []

  - method: GET
    path: "/return-authorization-lines"
    description: "List authorized lines, filterable by authorization or SKU."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, ClientRep]
    code: 200
    input: ["rma_id?", "catalog_item_id?", "reason_code?", "limit?", "offset?"]
    output: ReturnAuthorizationLine[]
    side_effects: []

  - method: POST
    path: "/return-authorizations/{rma_id}/issue"
    description: "Issue a DRAFT authorization so goods may be received against it."
    roles: [CenterAdmin, ClientRep]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["status DRAFT -> ISSUED", "issued_at stamped from the logical clock", "lines frozen"]

  - method: POST
    path: "/return-authorizations/{rma_id}/void"
    description: "Void an issued or partially received authorization, writing off the unreceived remainder as shrink."
    roles: [CenterAdmin]
    code: 200
    input: ["void_reason?"]
    output: ReturnAuthorization
    side_effects: ["status -> VOID", "one RECEIPT_VARIANCE ShrinkLedgerEntry per line with an unreceived remainder", "Client.shrink_ledger_cents, settlement_balance_cents and open_rma_count recomputed"]

  - method: POST
    path: "/return-authorizations/{rma_id}/reissue"
    description: "Supersede an ISSUED authorization that has not yet received anything with a fresh one carrying the same lines and a new expiry. Guarded by optimistic concurrency on the source authorization."
    roles: [CenterAdmin, ClientRep]
    code: 201
    input: [expected_rma_version, expires_at]
    output: ReturnAuthorization
    side_effects: ["source ReturnAuthorization.status ISSUED -> SUPERSEDED and its version increments", "a new ISSUED ReturnAuthorization is created with supersedes_rma_id pointing at the source and copies of every authorized line", "Client.open_rma_count recomputed"]

  # ===== receiving ========================================================
  - method: POST
    path: "/receipts"
    description: "Scan an inbound carton against an issued authorization, capturing its gross weight for the empty-box check."
    roles: [ReceivingClerk, CenterAdmin]
    code: 201
    input: [rma_id, tracking_reference, gross_weight_grams]
    output: Receipt
    side_effects: ["received_at stamped from the logical clock", "scanned_by_user_id stamped from X-User-ID", "expected_weight_grams computed by receipt_expected_weight", "empty_box_suspected computed", "ReturnAuthorization.status ISSUED -> PARTIALLY_RECEIVED"]

  - method: GET
    path: "/receipts/{receipt_id}"
    description: "Read one receipt with its expected weight and empty-box flag."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: GET
    path: "/receipts"
    description: "List receipts, filterable by authorization."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefundAnalyst, ClientRep]
    code: 200
    input: ["rma_id?", "empty_box_suspected?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []

  - method: POST
    path: "/receipts/{receipt_id}/lines"
    description: "Register a scanned unit line against an authorized line, capturing the reason code and serial and running the receipt-stage fraud checks."
    roles: [ReceivingClerk, CenterAdmin]
    code: 201
    input: [rma_line_id, quantity, reason_code, "scanned_serial?"]
    output: ReturnLine
    side_effects: ["disposition_state RECEIVED_UNGRADED, financial_state HOLD_PENDING_DISPOSITION", "days_since_order computed from ReturnAuthorization.order_placed_at and the logical clock", "SERIAL_MISMATCH and EMPTY_BOX FraudChecks appended with evaluated_stage RECEIPT (exactly two rows, one per check, each PASS or FAIL)", "fraud_score_receipt computed", "ReturnAuthorizationLine.received_quantity, ReturnAuthorization.received_unit_total and fraud_flag_count recomputed", "ReturnAuthorization.status -> RECEIVED once every line is fully received", "Client.units_received and units_in_process recomputed"]

  - method: GET
    path: "/return-lines/{return_line_id}"
    description: "Read one return line with its grade, disposition, financial state, recovery estimate and both fraud scores."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefurbTechnician, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: ReturnLine
    side_effects: []

  - method: GET
    path: "/return-lines"
    description: "List return lines, filterable by receipt, authorized line, quarantine bay, disposition and either state dimension."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, RefurbTechnician, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: ["receipt_id?", "rma_line_id?", "bay_id?", "disposition?", "disposition_state?", "financial_state?", "condition_grade?", "limit?", "offset?"]
    output: ReturnLine[]
    side_effects: []

  - method: GET
    path: "/return-lines/{return_line_id}/fraud-checks"
    description: "List the fraud checks recorded against one return line at both the receipt and grading stages."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, RefundAnalyst]
    code: 200
    input: ["check_type?", "evaluated_stage?", "limit?", "offset?"]
    output: FraudCheck[]
    side_effects: []

  - method: GET
    path: "/fraud-checks/{fraud_check_id}"
    description: "Read one immutable fraud check row."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, RefundAnalyst]
    code: 200
    input: []
    output: FraudCheck
    side_effects: []

  - method: GET
    path: "/fraud-checks"
    description: "List fraud check rows across return lines, filterable by line, check type and stage."
    roles: [CenterAdmin, ReceivingClerk, GradingInspector, DispositionSupervisor, RefundAnalyst]
    code: 200
    input: ["return_line_id?", "check_type?", "evaluated_stage?", "outcome?", "limit?", "offset?"]
    output: FraudCheck[]
    side_effects: []

  - method: POST
    path: "/return-lines/{return_line_id}/quarantine"
    description: "Occupy a hazmat or quarantine bay for a hazardous, regulated or recalled line for a bounded window."
    roles: [ReceivingClerk, GradingInspector, CenterAdmin]
    code: 200
    input: [bay_id, quarantine_start_at, quarantine_end_at]
    output: ReturnLine
    side_effects: ["disposition_state RECEIVED_UNGRADED -> QUARANTINED", "bay_id, quarantine_start_at and quarantine_end_at stamped, reserving the bay over the half-open window"]

  - method: POST
    path: "/return-lines/{return_line_id}/grade"
    description: "Assign a condition grade, which runs the grading-stage fraud checks, computes the provisional recovery value and applies the disposition decision matrix."
    roles: [GradingInspector, CenterAdmin]
    code: 200
    input: [condition_grade]
    output: ReturnLine
    side_effects: ["condition_grade stamped and graded_by_user_id set from X-User-ID", "disposition_state -> DISPOSITION_ASSIGNED", "VALUE_ANOMALY and REPEAT_RETURNER FraudChecks appended with evaluated_stage GRADING (exactly two more rows, so the line carries four in total) and fraud_score_release computed over all four", "recovery_value_cents computed by return_line_recovery_value variant provisional_at_grade", "disposition computed by disposition_decision", "financial_state stays HOLD_PENDING_DISPOSITION when fraud_score_release is below 50, becomes FRAUD_HOLD when it is at or above 50, and DENIED when it is at or above 90 — grading never grants RELEASE_PENDING, which only the disposition execution or a cleared hold can do", "a RefundRelease is created with gross_refund_cents, restocking_fee_pct, restocking_fee_cents and net_refund_cents computed; release_eligible_at stays null until the line's DispositionOrder executes"]

  - method: POST
    path: "/return-lines/{return_line_id}/override-disposition"
    description: "Supervisor override of the matrix-assigned disposition, re-entering DISPOSITION_ASSIGNED and re-deriving the recovery estimate."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 200
    input: [disposition, override_reason]
    output: ReturnLine
    side_effects: ["disposition replaced; disposition_state self-loops on DISPOSITION_ASSIGNED", "recovery_value_cents re-derived under the new disposition", "RefundRelease amounts recomputed while release_eligible_at is preserved"]

  - method: POST
    path: "/return-lines/{return_line_id}/clear-fraud-hold"
    description: "Clear a fraud hold after manual review, moving the line's financial dimension to RELEASE_PENDING without touching its disposition dimension."
    roles: [RefundAnalyst, CenterAdmin]
    code: 200
    input: [resolution_note]
    output: ReturnLine
    side_effects: ["financial_state FRAUD_HOLD -> RELEASE_PENDING when the line's DispositionOrder has already executed, otherwise FRAUD_HOLD -> HOLD_PENDING_DISPOSITION", "fraud_score_release is NOT recomputed downward — the score is permanent evidence and the state is the gate", "disposition_state is left exactly as it was, which is what makes the two dimensions independent"]

  - method: POST
    path: "/return-lines/{return_line_id}/release-refund"
    description: "Release the customer refund or credit once the hold window has elapsed, no fraud hold is active and the client's exposure cap allows it."
    roles: [RefundAnalyst]
    code: 200
    input: []
    output: RefundRelease
    side_effects: ["financial_state RELEASE_PENDING -> REFUNDED", "released_at stamped from the logical clock and released_by_user_id from X-User-ID", "a REFUND_DEBIT ShrinkLedgerEntry of -net_refund_cents is appended", "Client.settlement_balance_cents recomputed"]

  - method: POST
    path: "/return-lines/{return_line_id}/deny-refund"
    description: "Deny the refund, terminating the financial dimension without a ledger movement."
    roles: [RefundAnalyst]
    code: 200
    input: [denial_reason]
    output: RefundRelease
    side_effects: ["financial_state HOLD_PENDING_DISPOSITION, FRAUD_HOLD or RELEASE_PENDING -> DENIED", "denial_reason recorded", "no ShrinkLedgerEntry is appended"]

  - method: POST
    path: "/return-lines/{return_line_id}/reverse-refund"
    description: "Claw back a released refund. Permitted even for a SUSPENDED client, because a suspension must never block a reversal."
    roles: [RefundAnalyst, CenterAdmin]
    code: 200
    input: [reversal_memo]
    output: RefundRelease
    side_effects: ["financial_state REFUNDED -> CLAWED_BACK", "reversed_at stamped from the logical clock", "a REVERSAL ShrinkLedgerEntry of +net_refund_cents carrying reversal_memo is appended, exactly offsetting the REFUND_DEBIT", "Client.settlement_balance_cents recomputed back to its pre-release value"]

  - method: GET
    path: "/refund-releases/{refund_release_id}"
    description: "Read one refund release with its gross, restocking fee and net amounts and its eligibility instant."
    roles: [CenterAdmin, RefundAnalyst, DispositionSupervisor, ClientRep]
    code: 200
    input: []
    output: RefundRelease
    side_effects: []

  - method: GET
    path: "/refund-releases"
    description: "List refund releases, filterable by return line or client."
    roles: [CenterAdmin, RefundAnalyst, DispositionSupervisor, ClientRep]
    code: 200
    input: ["return_line_id?", "client_id?", "limit?", "offset?"]
    output: RefundRelease[]
    side_effects: []

  # ===== refurbishment ====================================================
  - method: POST
    path: "/refurb-work-orders"
    description: "Open a refurbishment work order for a line the matrix routed to REFURBISH. The acting technician becomes the assigned technician, which is what later blocks self-inspection."
    roles: [RefurbTechnician, CenterAdmin]
    code: 201
    input: [return_line_id]
    output: RefurbWorkOrder
    side_effects: ["status OPEN with rework_cycles, labor_minutes_total, parts_cost_cents, packaging_cost_cents and total_cost_cents all 0", "assigned_technician_user_id stamped from X-User-ID", "ReturnLine.disposition_state DISPOSITION_ASSIGNED -> IN_REFURB"]

  - method: GET
    path: "/refurb-work-orders/{work_order_id}"
    description: "Read one work order with its accumulated labor, parts, packaging and fully loaded cost."
    roles: [CenterAdmin, RefurbTechnician, GradingInspector, DispositionSupervisor, ClientRep]
    code: 200
    input: []
    output: RefurbWorkOrder
    side_effects: []

  - method: GET
    path: "/refurb-work-orders"
    description: "List work orders, filterable by return line, bay or status."
    roles: [CenterAdmin, RefurbTechnician, GradingInspector, DispositionSupervisor, ClientRep]
    code: 200
    input: ["return_line_id?", "bay_id?", "status?", "limit?", "offset?"]
    output: RefurbWorkOrder[]
    side_effects: []

  - method: POST
    path: "/refurb-work-orders/{work_order_id}/start-test"
    description: "Reserve a GENERAL bay test window and put the unit on test. Re-entrant after a failed test until the rework cap is reached."
    roles: [RefurbTechnician]
    code: 200
    input: [bay_id, test_window_start_at, test_window_end_at]
    output: RefurbWorkOrder
    side_effects: ["status OPEN or TEST_FAILED -> IN_TEST", "bay_id and the test window replaced with the requested one, buffered against every other window in that bay", "on re-entry from TEST_FAILED, rework_cycles increments by 1"]

  - method: POST
    path: "/refurb-work-orders/{work_order_id}/record-test-result"
    description: "Record a functional test outcome with the labor and parts consumed. The acting inspector is stamped as qa_user_id and may not be the assigned technician."
    roles: [RefurbTechnician, GradingInspector]
    code: 200
    input: [result, labor_minutes, "parts_cost_cents?"]
    output: RefurbWorkOrder
    side_effects: ["status IN_TEST -> PASSED_QA on PASS, IN_TEST -> TEST_FAILED on FAIL", "labor_minutes accumulates into labor_minutes_total and parts_cost_cents accumulates into parts_cost_cents across every cycle", "qa_user_id stamped from X-User-ID"]

  - method: POST
    path: "/refurb-work-orders/{work_order_id}/repackage"
    description: "Repackage a QA-passed unit to a published grading standard, closing the work order and returning the line to the disposition matrix at its new grade."
    roles: [RefurbTechnician, CenterAdmin]
    code: 200
    input: [packaging_cost_cents, resulting_grade]
    output: RefurbWorkOrder
    side_effects: ["status PASSED_QA -> REPACKAGED", "total_cost_cents stamped per refurb_total_cost", "a REFURB_COST ShrinkLedgerEntry of -total_cost_cents appended and Client aggregates recomputed", "ReturnLine.condition_grade replaced by resulting_grade, recovery_value_cents and disposition re-derived with refurb_eligible forced false, RefundRelease fee amounts recomputed", "ReturnLine.disposition_state IN_REFURB -> DISPOSITION_ASSIGNED"]

  - method: POST
    path: "/refurb-work-orders/{work_order_id}/abandon"
    description: "Abandon refurbishment, sinking the cost incurred so far and returning the line to the matrix at its original grade."
    roles: [RefurbTechnician, CenterAdmin]
    code: 200
    input: [abandon_reason]
    output: RefurbWorkOrder
    side_effects: ["status -> ABANDONED", "total_cost_cents stamped with packaging_cost_cents 0", "a REFURB_COST ShrinkLedgerEntry appended unless total_cost_cents is 0", "ReturnLine.disposition_state IN_REFURB -> DISPOSITION_ASSIGNED with the matrix re-run and refurb_eligible forced false"]

  # ===== disposition orders ===============================================
  - method: POST
    path: "/disposition-orders"
    description: "Propose a disposition order for an assigned line, routing it to an explicit channel or letting the selector policy pick one. Guarded by optimistic concurrency on the return line."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 201
    input: [return_line_id, expected_return_line_version, "channel_id?", "disposition?", "quantity?", "channel_window_start_at?", "channel_window_end_at?"]
    output: DispositionOrder
    side_effects: ["status PROPOSED", "disposition and quantity are always copied from the ReturnLine; when the optional echo fields are supplied they must match, otherwise ERR_DISPOSITION_DRIFT", "channel_id resolved from the request or by channel_selector_policy, with selected_by_policy set accordingly", "unit_price_cents stamped per disposition_unit_price", "quantity moves from Client.units_in_process to Client.units_reserved_for_disposition", "ReturnLine.version increments"]

  - method: GET
    path: "/disposition-orders/{disposition_order_id}"
    description: "Read one disposition order with its frozen unit price and, once executed, its realized channel economics."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: []

  - method: GET
    path: "/disposition-orders"
    description: "List disposition orders, filterable by return line, channel, status or disposition."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: ["return_line_id?", "channel_id?", "status?", "disposition?", "selected_by_policy?", "limit?", "offset?"]
    output: DispositionOrder[]
    side_effects: []

  - method: POST
    path: "/disposition-orders/{disposition_order_id}/approve"
    description: "Approve a proposed disposition order. The approver's identity is retained so a DESTROY execution can be forced onto a second person."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: ["status PROPOSED -> APPROVED", "approved_by_user_id stamped from X-User-ID"]

  - method: POST
    path: "/disposition-orders/{disposition_order_id}/execute"
    description: "Execute an approved disposition order at the price the channel actually realized, running the five-link cascade that settles the line, the ledger, the client and the authorization."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 200
    input: ["realized_unit_price_cents?"]
    output: DispositionOrder
    side_effects: ["status APPROVED -> EXECUTED, executed_at and executed_by_user_id stamped", "gross_lot_value_cents, effective_fee_pct, channel_fee_cents, refurb_cost_cents and net_recovery_cents stamped per disposition_net_recovery", "cascade link 1: ReturnLine.disposition_state -> DISPOSITIONED and recovery_value_cents re-stamped with the final_at_execution variant", "cascade link 2: a RECOVERY_CREDIT, DONATION_WRITE_OFF or DESTRUCTION_WRITE_OFF ShrinkLedgerEntry appended", "cascade link 3: Client.units_reserved_for_disposition, units_dispositioned, units_in_process, shrink_ledger_cents and settlement_balance_cents recomputed", "cascade link 4: Client.status -> SUSPENDED when settlement_balance_cents falls below the negated exposure cap", "cascade link 5: ReturnAuthorization RECEIVED -> CLOSED once every sibling line is DISPOSITIONED", "ReturnLine.financial_state HOLD_PENDING_DISPOSITION -> RELEASE_PENDING with RefundRelease.release_eligible_at stamped"]

  - method: POST
    path: "/disposition-orders/{disposition_order_id}/cancel"
    description: "Cancel a proposed or approved order, returning its reserved units to work-in-process without any ledger movement. This is the compensating action for the unit-conservation invariant."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 200
    input: [cancel_reason]
    output: DispositionOrder
    side_effects: ["status -> CANCELLED", "quantity moves from Client.units_reserved_for_disposition back to Client.units_in_process", "no ShrinkLedgerEntry is written, so Client.settlement_balance_cents is untouched"]

  # ===== pricing feedback =================================================
  - method: POST
    path: "/pricing-feedback"
    description: "Report what a channel actually realized against what was expected, which re-indexes that channel's pricing for future routing."
    roles: [DispositionSupervisor, CenterAdmin]
    code: 201
    input: [disposition_order_id, channel_id, realized_price_cents]
    output: PricingFeedback
    side_effects: ["expected_price_cents copied from DispositionOrder.unit_price_cents", "variance_pct computed", "sequence_no assigned as the channel's next monotonic integer starting at 1", "SecondaryMarketChannel.price_index_pct recomputed by channel_price_index over the newest three rows"]

  - method: GET
    path: "/pricing-feedback/{pricing_feedback_id}"
    description: "Read one pricing feedback row."
    roles: [CenterAdmin, DispositionSupervisor, ClientRep]
    code: 200
    input: []
    output: PricingFeedback
    side_effects: []

  - method: GET
    path: "/pricing-feedback"
    description: "List pricing feedback rows, filterable by disposition order or channel."
    roles: [CenterAdmin, DispositionSupervisor, ClientRep]
    code: 200
    input: ["disposition_order_id?", "channel_id?", "limit?", "offset?"]
    output: PricingFeedback[]
    side_effects: []

  # ===== shrink and audit =================================================
  - method: GET
    path: "/shrink-ledger-entries/{shrink_ledger_entry_id}"
    description: "Read one immutable shrink-ledger entry."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: []
    output: ShrinkLedgerEntry
    side_effects: []

  - method: GET
    path: "/shrink-ledger-entries"
    description: "List shrink-ledger entries in sequence_no ascending order, filterable by client, return line or entry type."
    roles: [CenterAdmin, DispositionSupervisor, RefundAnalyst, ClientRep]
    code: 200
    input: ["client_id?", "return_line_id?", "entry_type?", "limit?", "offset?"]
    output: ShrinkLedgerEntry[]
    side_effects: []

  # ===== logical clock (test-driving endpoint) =============================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, hold window, expiry sweep and elapsed-days calculation reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Setting the clock also runs the ReturnAuthorization expiry sweep."
    roles: [CenterAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every ISSUED or PARTIALLY_RECEIVED ReturnAuthorization whose expires_at is at or before the new value moves to EXPIRED, appending RECEIPT_VARIANCE ShrinkLedgerEntry rows for its unreceived remainder and recomputing the owning Client's shrink_ledger_cents and settlement_balance_cents"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is absent, empty, or names a role outside the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the presented role is not listed on the target endpoint"
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "a ClientRep reaches a resource that resolves to a Client other than the one whose id equals the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID collides with a duty that must be performed by a different person: releasing or denying a refund on a line the same user graded, repackaging a work order the same user QA-signed, or executing a dual-signoff DESTROY order the same user approved"
  - id: ERR_QA_SELF_INSPECTION
    http: 403
    condition: "the technician assigned to a refurbishment work order tries to record its own test result"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "unparseable body, missing required field, undeclared enum member, non-integer where an integer is required, quantity below 1, out-of-range percentage, unparseable instant, a window whose start is after its end, or a repackage resulting_grade outside {A, B}"

  # --- existence ----------------------------------------------------------
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id names no Client"
  - id: ERR_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "catalog_item_id names no CatalogItem"
  - id: ERR_BAY_NOT_FOUND
    http: 404
    condition: "bay_id names no ProcessingBay"
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "channel_id names no SecondaryMarketChannel"
  - id: ERR_RMA_NOT_FOUND
    http: 404
    condition: "rma_id names no ReturnAuthorization"
  - id: ERR_RMA_LINE_NOT_FOUND
    http: 404
    condition: "rma_line_id names no ReturnAuthorizationLine"
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "receipt_id names no Receipt"
  - id: ERR_RETURN_LINE_NOT_FOUND
    http: 404
    condition: "return_line_id names no ReturnLine"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work_order_id names no RefurbWorkOrder"
  - id: ERR_DISPOSITION_ORDER_NOT_FOUND
    http: 404
    condition: "disposition_order_id names no DispositionOrder"
  - id: ERR_FRAUD_CHECK_NOT_FOUND
    http: 404
    condition: "fraud_check_id names no FraudCheck"
  - id: ERR_REFUND_RELEASE_NOT_FOUND
    http: 404
    condition: "refund_release_id names no RefundRelease"
  - id: ERR_PRICING_FEEDBACK_NOT_FOUND
    http: 404
    condition: "pricing_feedback_id names no PricingFeedback"
  - id: ERR_SHRINK_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "shrink_ledger_entry_id names no ShrinkLedgerEntry"

  # --- referential coherence ---------------------------------------------
  - id: ERR_LINE_RMA_MISMATCH
    http: 409
    condition: "two resolved resources disagree about the aggregate they belong to: an rma_line_id from another authorization, a return_line_id from another client, or a pricing feedback whose channel_id is not the disposition order's channel"

  # --- state --------------------------------------------------------------
  - id: ERR_CLIENT_SUSPENDED
    http: 409
    condition: "a write that would extend the client's exposure is attempted while Client.status is SUSPENDED (reads and reverse-refund remain available)"
  - id: ERR_RMA_INVALID_STATE
    http: 409
    condition: "the ReturnAuthorization is not in a status that admits the requested transition"
  - id: ERR_RMA_EXPIRED
    http: 409
    condition: "the ReturnAuthorization is EXPIRED, or its expires_at is at or before the current logical clock"
  - id: ERR_RMA_ALREADY_RECEIVING
    http: 409
    condition: "a reissue is attempted on an authorization that has already received units; it must be voided instead"
  - id: ERR_LINE_INVALID_DISPOSITION_STATE
    http: 409
    condition: "the ReturnLine's disposition dimension is not in a state that admits the requested transition, including a REFURBISH line whose work order has not closed"
  - id: ERR_LINE_INVALID_FINANCIAL_STATE
    http: 409
    condition: "the ReturnLine's financial dimension is not in a state that admits the requested transition"
  - id: ERR_WORK_ORDER_INVALID_STATE
    http: 409
    condition: "the RefurbWorkOrder is not in a status that admits the requested transition"
  - id: ERR_DISPOSITION_ORDER_INVALID_STATE
    http: 409
    condition: "the DispositionOrder is not in a status that admits the requested transition"
  - id: ERR_CHANNEL_PAUSED
    http: 409
    condition: "the resolved SecondaryMarketChannel.status is PAUSED, whether at proposal or at execution"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_RMA_VERSION
    http: 412
    condition: "expected_rma_version does not equal the ReturnAuthorization's current version"
  - id: ERR_STALE_RETURN_LINE_VERSION
    http: 412
    condition: "expected_return_line_version does not equal the ReturnLine's current version"

  # --- safety / compliance / regulatory ----------------------------------
  - id: ERR_RECALL_DISPOSITION_LOCKED
    http: 409
    condition: "a line whose SKU carries a MANDATORY recall is steered anywhere other than DESTROY"
  - id: ERR_RECALLED_ITEM_NOT_REFURBISHABLE
    http: 409
    condition: "a refurbishment work order for a MANDATORY-recalled SKU is opened, started, tested or repackaged"
  - id: ERR_REGULATED_DONATION_FORBIDDEN
    http: 409
    condition: "DONATE is requested for a regulated or hazardous SKU, or for a client whose donation_allowed is false"
  - id: ERR_QUARANTINE_REQUIRED
    http: 409
    condition: "a hazardous or MANDATORY-recalled line is graded without first completing a quarantine occupation"
  - id: ERR_CHANNEL_NOT_HAZARD_CERTIFIED
    http: 409
    condition: "the resolved channel lacks hazard_certified for a hazardous SKU or recall_certified for a MANDATORY-recalled SKU"
  - id: ERR_DUAL_SIGNOFF_REQUIRED
    http: 409
    condition: "a DESTROY order is executed for a client requiring dual signoff without a recorded distinct approver"
  - id: ERR_FRAUD_HOLD_ACTIVE
    http: 409
    condition: "a refund release is attempted while the line's financial dimension is FRAUD_HOLD"

  # --- constraint satisfaction -------------------------------------------
  - id: ERR_RMA_NO_LINES
    http: 409
    condition: "an authorization with zero declared lines is issued"
  - id: ERR_RMA_EXPIRES_IN_PAST
    http: 422
    condition: "expires_at is at or before the current logical clock, or order_placed_at is after it"
  - id: ERR_SERIAL_REQUIRED
    http: 422
    condition: "a serialized SKU is declared or scanned without a serial"
  - id: ERR_AUTHORIZED_QUANTITY_EXCEEDED
    http: 409
    condition: "the cumulative received quantity for an authorized line would exceed its authorized_quantity"
  - id: ERR_LINE_NOT_REFURBISHABLE
    http: 409
    condition: "a work order is opened for a line whose SKU is not refurb_eligible or whose disposition is not REFURBISH"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "a test restart is attempted once rework_cycles has reached MAX_REWORK_CYCLES"
  - id: ERR_QUARANTINE_NOT_APPLICABLE
    http: 409
    condition: "quarantine is requested for a line with no hazard class and no recall status"
  - id: ERR_BAY_TYPE_MISMATCH
    http: 409
    condition: "the requested bay is inactive, or its bay_type does not admit the requested work"
  - id: ERR_CHANNEL_GRADE_NOT_ACCEPTED
    http: 409
    condition: "the resolved channel does not accept the line's condition grade, or its channel_type does not serve the line's disposition"
  - id: ERR_DISPOSITION_DRIFT
    http: 409
    condition: "the disposition or quantity echoed on the request, or frozen on an order being executed, no longer matches the ReturnLine"
  - id: ERR_NO_ELIGIBLE_CHANNEL
    http: 409
    condition: "channel_id was omitted and the selector policy's candidate set is empty"

  # --- temporal conflicts ------------------------------------------------
  - id: ERR_BAY_WINDOW_CONFLICT
    http: 409
    condition: "a quarantine occupation overlaps another occupation of the same bay under half-open window semantics"
  - id: ERR_BAY_BUFFER_VIOLATION
    http: 409
    condition: "a refurbishment test window falls within the bay's buffer_minutes of another window in the same bay"
  - id: ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "the number of live lot windows overlapping the requested one would exceed the channel's concurrent_lot_capacity under closed-window semantics"
  - id: ERR_REFUND_HOLD_ACTIVE
    http: 409
    condition: "the current logical clock is before RefundRelease.release_eligible_at"

  # --- fiscal / capacity -------------------------------------------------
  - id: ERR_CHANNEL_MIN_LOT_NOT_MET
    http: 409
    condition: "the lot's projected net recovery is below the channel's min_lot_value_cents"
  - id: ERR_REFUND_EXCEEDS_EXPOSURE_CAP
    http: 409
    condition: "releasing this refund would push the client's cumulative released refunds past max_refund_exposure_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
#
# role_model is `segregation_of_duties`: the six operator roles are peers with
# non-overlapping exclusive surfaces, and three separations are enforced on
# X-User-ID rather than on role — grader vs refund releaser, assigned
# technician vs QA inspector, and DESTROY approver vs DESTROY executor. Two
# users holding the SAME role therefore behave differently, which is the point.
# ---------------------------------------------------------------------------
roles:
  - name: CenterAdmin
    description: "Processing-center administrator. Owns the configuration surface (clients, catalog, bays, channels, recalls, the logical clock) and may act as a break-glass substitute on most operational endpoints — but is never exempt from the three X-User-ID separations."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "GET /clients"
      - "POST /clients/{client_id}/suspend"
      - "POST /clients/{client_id}/reinstate"
      - "POST /catalog-items"
      - "POST /catalog-items/{catalog_item_id}/recall"
      - "POST /processing-bays"
      - "POST /secondary-market-channels"
      - "POST /return-authorizations/{rma_id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /clients/{client_id}"
      - "GET /clients/{client_id}/disposition-audit"
      - "GET and POST across the return-authorization, receipt, return-line, refurb, disposition, pricing-feedback and shrink-ledger surfaces, excluding the RefundAnalyst-exclusive refund release and denial"

  - name: ReceivingClerk
    description: "Dock operator who scans inbound cartons and unit lines and starts quarantine occupations. Cannot grade, cannot route dispositions and cannot touch money."
    identity: "opaque"
    exclusive_operations:
      - "POST /receipts"
      - "POST /receipts/{receipt_id}/lines"
    shared_operations:
      - "POST /return-lines/{return_line_id}/quarantine"
      - "GET /catalog-items, GET /processing-bays, GET /return-authorizations, GET /return-authorization-lines, GET /receipts, GET /return-lines and their single-resource reads"
      - "GET /return-lines/{return_line_id}/fraud-checks"

  - name: GradingInspector
    description: "Condition grader. Assigning a grade is what fires the disposition matrix, the grading-stage fraud checks and the provisional recovery estimate, so this role's X-User-ID is recorded on the line and permanently barred from releasing its refund."
    identity: "opaque"
    exclusive_operations:
      - "POST /return-lines/{return_line_id}/grade"
    shared_operations:
      - "POST /return-lines/{return_line_id}/quarantine"
      - "POST /refurb-work-orders/{work_order_id}/record-test-result"
      - "GET /catalog-items, GET /processing-bays, GET /return-authorizations, GET /return-authorization-lines, GET /receipts, GET /return-lines, GET /refurb-work-orders and their single-resource reads"
      - "GET /return-lines/{return_line_id}/fraud-checks"

  - name: RefurbTechnician
    description: "Refurbishment technician. Opens work orders (becoming their assigned technician), reserves bay test windows, repackages and abandons. Cannot sign off the QA test on a unit they were assigned."
    identity: "opaque"
    exclusive_operations:
      - "POST /refurb-work-orders"
      - "POST /refurb-work-orders/{work_order_id}/start-test"
      - "POST /refurb-work-orders/{work_order_id}/repackage"
      - "POST /refurb-work-orders/{work_order_id}/abandon"
    shared_operations:
      - "POST /refurb-work-orders/{work_order_id}/record-test-result"
      - "GET /catalog-items, GET /processing-bays, GET /return-lines, GET /refurb-work-orders and their single-resource reads"

  - name: DispositionSupervisor
    description: "Owns disposition routing and secondary-market execution: overrides, channel selection, approval, execution, cancellation, channel pausing and pricing feedback."
    identity: "opaque"
    exclusive_operations:
      - "POST /return-lines/{return_line_id}/override-disposition"
      - "POST /disposition-orders"
      - "POST /disposition-orders/{disposition_order_id}/approve"
      - "POST /disposition-orders/{disposition_order_id}/execute"
      - "POST /disposition-orders/{disposition_order_id}/cancel"
      - "POST /pricing-feedback"
    shared_operations:
      - "POST /secondary-market-channels/{channel_id}/pause"
      - "POST /secondary-market-channels/{channel_id}/resume"
      - "GET /clients/{client_id}, GET /clients/{client_id}/disposition-audit, GET /secondary-market-channels, GET /return-lines, GET /refurb-work-orders, GET /disposition-orders, GET /pricing-feedback, GET /refund-releases, GET /shrink-ledger-entries and their single-resource reads"
      - "GET /return-lines/{return_line_id}/fraud-checks"

  - name: RefundAnalyst
    description: "Owns the money axis: clearing fraud holds, releasing, denying and clawing back refunds and credits. Releasing and denying are exclusive to this role and are additionally barred to whoever graded the line."
    identity: "opaque"
    exclusive_operations:
      - "POST /return-lines/{return_line_id}/release-refund"
      - "POST /return-lines/{return_line_id}/deny-refund"
    shared_operations:
      - "POST /return-lines/{return_line_id}/clear-fraud-hold"
      - "POST /return-lines/{return_line_id}/reverse-refund"
      - "GET /clients/{client_id}, GET /clients/{client_id}/disposition-audit, GET /return-authorizations, GET /receipts, GET /return-lines, GET /disposition-orders, GET /refund-releases, GET /shrink-ledger-entries and their single-resource reads"
      - "GET /return-lines/{return_line_id}/fraud-checks"

  - name: ClientRep
    description: "Representative of one returns client. X-User-ID is that Client's id, so every read is silently narrowed to it and every explicit cross-client id is rejected. May raise and issue its own authorizations but never touches grading, refurbishment, routing or money."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /return-authorizations"
      - "POST /return-authorizations/{rma_id}/lines"
      - "POST /return-authorizations/{rma_id}/issue"
      - "POST /return-authorizations/{rma_id}/reissue"
      - "GET /clients/{client_id} and GET /clients/{client_id}/disposition-audit for its own Client only"
      - "GET /catalog-items, GET /return-authorizations, GET /return-authorization-lines, GET /receipts, GET /return-lines, GET /refurb-work-orders, GET /disposition-orders, GET /pricing-feedback, GET /refund-releases, GET /secondary-market-channels, GET /shrink-ledger-entries and their single-resource reads, all scoped to its own Client"
