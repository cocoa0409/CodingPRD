# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — ASC Scheduling
# Walks references/claim-extraction-guide.md against this scaffold's §1.1–§1.7.
# Every call resolves to a §1.5 endpoint; OCC inputs use ${var}; literals pinned.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Facility, endpoints]
        distinguishing_aspect: "POST /asc/facilities with only name applies defaults turnover_minutes=25, hp_validity_days=30, utilization_target_pct=75, current_utc=1970-01-01T00:00:00.000Z; returns 201."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /asc/facilities"
              payload: { name: "ASC Defaults" }
              as: Scheduler
              captures: { fac_id: $.data.id }
          assert:
            - "response code == 201"
            - "Facility.${fac_id}.turnover_minutes == 25"
            - "Facility.${fac_id}.hp_validity_days == 30"
            - "Facility.${fac_id}.utilization_target_pct == 75"
            - "Facility.${fac_id}.version == 1"

      - name: create_procedure_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Procedure.fields.cms_payment_indicator
          - "validations[priority=5]"
        distinguishing_aspect: "POST /asc/procedures omitting cms_payment_indicator (required, no default) -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC S" }
              as: Scheduler
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_base_rate_cents: 150000 }
              as: BillingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: get_surgical_case_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.SurgicalCase
          - "errors[ERR_SURGICAL_CASE_NOT_FOUND]"
        distinguishing_aspect: "GET /asc/surgical-cases/{random-uuid} -> ERR_SURGICAL_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB (no cases)"]
          setup_api_calls: []
          trigger:
            - call: "GET /asc/surgical-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SURGICAL_CASE_NOT_FOUND"

      - name: supply_item_computed_reserved_qty_input_ignored
        claim_type: Computed Fields
        grounds: [entities.SupplyItem.fields.reserved_qty, calculations.supply_availability]
        distinguishing_aspect: "reserved_qty is computed (source: computed); the stored value is 0 (no RESERVED implants yet) at create time."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC T" }
              as: Scheduler
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /asc/supply-items"
              payload: { facility_id: "${fac_id}", sku: "SKU1", description: "Gauze", unit_cost_cents: 100, on_hand_qty: 50 }
              as: ORManager
              captures: { item_id: $.data.id }
          assert:
            - "SupplyItem.${item_id}.reserved_qty == 0"
            - "SupplyItem.${item_id}.on_hand_qty == 50"

      - name: clearance_check_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ClearanceCheck]
        distinguishing_aspect: "ClearanceCheck has common_fields: false; the create response carries id + created_at but no version field and no update endpoint exists."
        test_recipe:
          setup: ["Facility/OR/surgeon/proc/patient/day/block/case booked SCHEDULED."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC U" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "LABS", outcome: "PASS" }
              as: PreOpNurse
              captures: { chk_id: $.data.id }
          assert:
            - "response code == 201"
            - "ClearanceCheck.${chk_id} has id and created_at"
            - "ClearanceCheck response has no version field"

      - name: duplicate_surgeon_npi_within_facility_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Surgeon.fields.npi
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_KEY]"
        distinguishing_aspect: "Two surgeons with the same npi in one facility -> second POST -> ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["Facility with one surgeon npi 1234567890."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC V" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr A", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
          trigger:
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr B", npi: "1234567890" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_KEY"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_case_from_scheduled_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SurgicalCase.IN_RECOVERY_to_COMPLETED
          - "errors[ERR_CASE_NOT_IN_RECOVERY]"
        distinguishing_aspect: "Completing a SCHEDULED case (not IN_RECOVERY) -> ERR_CASE_NOT_IN_RECOVERY; no cost computed."
        test_recipe:
          setup: ["Facility/OR/surgeon/MAC-proc(60)/patient/day; block [480,600); one SCHEDULED case 480."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC W" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/complete"
              payload: { actual_minutes: 60 }
              as: ORManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CASE_NOT_IN_RECOVERY"
            - "SurgicalCase.${case_id}.actual_cost_cents == null"

      - name: cancel_completed_case_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - "errors[ERR_CASE_NOT_CANCELLABLE]"
        distinguishing_aspect: "Cancelling a COMPLETED case (terminal) -> ERR_CASE_NOT_CANCELLABLE; case_status stays COMPLETED."
        test_recipe:
          setup: ["Facility/OR/MD-anesthesia/bay/MAC-proc(60)/surgeon/patient/day; case booked 480, cleared, day locked, started, to recovery, COMPLETED actual 60."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC X" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: Scheduler
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/recovery-bays"
              payload: { facility_id: "${fac_id}", bay_label: "PACU-1", phase2_capable: true }
              as: ORManager
              captures: { bay_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD" }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-days/${day_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /asc/surgical-cases/${case_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/to-recovery"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/complete"
              payload: { actual_minutes: 60 }
              as: ORManager
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CASE_NOT_CANCELLABLE"
            - "SurgicalCase.${case_id}.case_status == COMPLETED"

      - name: clear_blocked_by_open_failed_check
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SurgicalCase.PENDING_CLEARANCE_to_CLEARED
          - "errors[ERR_CLEARANCE_NOT_PENDING]"
        distinguishing_aspect: "A FAIL clearance check moves clearance to ON_HOLD; calling clear while ON_HOLD -> ERR_CLEARANCE_NOT_PENDING."
        test_recipe:
          setup: ["Facility/OR/surgeon/MAC-proc(60)/patient/day; block; case booked 480; one FAIL clearance check (clearance now ON_HOLD)."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC Y" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "LABS", outcome: "FAIL" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CLEARANCE_NOT_PENDING"
            - "SurgicalCase.${case_id}.clearance_status == ON_HOLD"

      - name: clear_blocked_by_expired_hp_window_boundary
        claim_type: guarded transitions
        grounds:
          - state_machines.SurgicalCase.PENDING_CLEARANCE_to_CLEARED
          - "validations[priority=16]"
          - "errors[ERR_HP_WINDOW_EXPIRED]"
        distinguishing_aspect: "H&P boundary: service_date 2026-07-15, hp_validity 30; hp_signed_at 2026-06-14 (31 days before) is stale -> ERR_HP_WINDOW_EXPIRED; clearance stays PENDING_CLEARANCE."
        test_recipe:
          setup: ["Facility(hp_validity 30)/OR/surgeon/MAC-proc(60)/patient/day(2026-07-15); block; case booked 480; HP_REVIEW PASS check recorded."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC Z", hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-06-14T00:00:00.000Z" }
              as: PreOpNurse
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_HP_WINDOW_EXPIRED"
            - "SurgicalCase.${case_id}.clearance_status == PENDING_CLEARANCE"

      - name: hp_window_exact_boundary_30_days_is_fresh
        claim_type: Valid Transition
        grounds:
          - state_machines.SurgicalCase.PENDING_CLEARANCE_to_CLEARED
          - "validations[priority=16]"
        distinguishing_aspect: "H&P boundary inclusive: hp_signed_at exactly 30 days before service_date (2026-06-15) is fresh -> clear succeeds, clearance_status CLEARED."
        test_recipe:
          setup: ["Facility(hp_validity 30)/OR/surgeon/MAC-proc(60)/patient/day(2026-07-15); block; case booked 480; HP_REVIEW PASS check recorded."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC AA", hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "X", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-06-15T00:00:00.000Z" }
              as: PreOpNurse
              captures: { clr: $.data.clearance_status }
          assert:
            - "SurgicalCase.${case_id}.clearance_status == CLEARED"

      - name: close_day_with_unfinished_case_rejected
        claim_type: Bubble up
        grounds:
          - state_machines.SurgicalDay.LOCKED_to_CLOSED
          - "errors[ERR_DAY_HAS_UNFINISHED_CASES]"
        distinguishing_aspect: "Closing a LOCKED day while a non-cancelled case is still IN_OR (not COMPLETED) -> ERR_DAY_HAS_UNFINISHED_CASES; posture stays LOCKED."
        test_recipe:
          setup: ["Facility/OR/MD-anesthesia/MAC-proc(60)/surgeon/patient/day; case booked 480 with anesthesia, cleared, day locked, started (IN_OR)."]
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC BB" }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
