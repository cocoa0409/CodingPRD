            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-01", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "C-SANDSTONE", target_lab_l: 55.00, target_lab_a: 12.00, target_lab_b: -8.00, lot_kg: 400.0, dye_start_utc: "2026-08-06T08:00:00Z", dye_end_utc: "2026-08-06T14:00:00Z", dyed_yards: 400.0 }
              as: DyeHouseOperator
              captures: { dl: $.data.id }
