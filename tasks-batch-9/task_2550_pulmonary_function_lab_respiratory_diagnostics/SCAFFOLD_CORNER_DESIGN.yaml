        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=40]
          - errors[ERR_MED_HOLD_NOT_ELAPSED]
          - calculations.medication_hold_release
          - endpoints[POST /pft-lab/test-sessions]
        distinguishing_aspect: |
          The temporal gate is "current_utc >= hold_release_at", so one logical minute decides the
          outcome of a byte-identical session request: at 11:59 the request is refused with
          ERR_MED_HOLD_NOT_ELAPSED and at exactly 12:00:00Z, the release instant itself, it succeeds. The
          gate reads the clock and not scheduled_start_at, which stays at 13:00 in both attempts.
        test_recipe:
          setup:
            - "logical clock starts at 2026-08-01T06:00:00Z and the daily quality program runs then"
            - "order ORD-1 declares current_medication_classes [SABA] and is SUBMITTED"
            - "the SABA hold is instructed at 06:00 with required_hold_hours 6, so release_at is 2026-08-01T12:00:00Z"
            - "the hold is attested WITHHELD, taking the order to READY with hold_release_at 2026-08-01T12:00:00Z"
