            - call: "GET /safesport/coach-assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NgbAdmin
              captures: { nf_placement: $.data.error_id }
            - call: "GET /safesport/investigating-bodies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NgbAdmin
              captures: { nf_body: $.data.error_id }
            - call: "GET /safesport/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SafeSportOfficer
              captures: { nf_case: $.data.error_id }
            - call: "GET /safesport/interim-measures/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SafeSportOfficer
              captures: { nf_measure: $.data.error_id }
            - call: "POST /safesport/club-audits/00000000-0000-4000-8000-000000000000/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: false }
              as: ComplianceAuditor
              captures: { nf_audit: $.data.error_id }
            - call: "GET /safesport/audit-findings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAuditor
              captures: { nf_finding: $.data.error_id }
            - call: "POST /safesport/room-stays/00000000-0000-4000-8000-000000000000/cancel"
              payload: { reason: "no such stay" }
              as: ClubAdministrator
