      - name: recharter_not_ready_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=16]", "errors[ERR_RECHARTER_NOT_READY]", entities.Troop.fields.recharter_posture]
        distinguishing_aspect: "Recharter on a fresh troop with 0 youth and 0 cleared leaders returns ERR_RECHARTER_NOT_READY (posture BLOCKED)."
