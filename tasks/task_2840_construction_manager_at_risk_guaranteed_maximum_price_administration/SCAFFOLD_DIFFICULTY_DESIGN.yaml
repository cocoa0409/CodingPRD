      - name: subcontract_two_independent_axes_with_default_cure_cycle
        grounds:
          - state_machines.Subcontract.ACTIVE_to_DEFAULT_NOTICED
          - state_machines.Subcontract.DEFAULT_NOTICED_to_ACTIVE
          - state_machines.Subcontract.DEFAULT_NOTICED_to_TERMINATED_FOR_DEFAULT
          - state_machines.Subcontract.NONE_to_FILED
          - state_machines.Subcontract.FILED_to_DENIED
          - entities.Subcontract.fields.contract_status
          - entities.Subcontract.fields.bond_claim_status
          - entities.Subcontract.fields.cure_count
        distinguishing_aspect: |
          Non-linearity here is PARALLEL axes plus a CYCLE on one of them, not a branching
          fork: contract_status traverses ACTIVE -> DEFAULT_NOTICED -> ACTIVE ->
          DEFAULT_NOTICED -> TERMINATED_FOR_DEFAULT (cure_count 1) while bond_claim_status
          independently traverses NONE -> FILED -> ACKNOWLEDGED -> DENIED, and neither axis
          constrains the other - the claim is filed while the contract is merely noticed and
          survives the termination unchanged.
        test_recipe:
          setup:
            - "one CmarProject 'Northgate Transit Center' with gmp_status EXECUTED at gmp_amount 3702611.20 and construction_contingency_remaining 240000.00"
            - "one WorkPackage 02-EARTHWORK, budget_amount 2000000.00, AWARDED at 1900000.00"
            - "one Subcontract at contract_amount 1900000.00, contract_status ACTIVE, bond_required true, bond_claim_status NONE, paid_to_date 400000.00, cure_count 0"
