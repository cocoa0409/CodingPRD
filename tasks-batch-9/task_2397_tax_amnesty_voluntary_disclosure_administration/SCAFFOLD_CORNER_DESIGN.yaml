              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 200000, payment_reference: "INST-1-3" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "response.status == 201"
            - "PaymentPlan.${plan_id}.scheduled_total_cents == 945000"
            - "Payment.${pay_id}.allocations has exactly 3 entries, in seq_index order, of 85909, 85909 and 28182 cents"
            - "Payment.${pay_id}.unapplied_delta_cents == 0"
            - "GET /amnesty/payment-plans/${plan_id}/installments?status=PAID returns total_count == 2 (seq_index 1 and 2, each paid_cents 85909)"
            - "the seq_index 3 installment has status SCHEDULED with amount_cents 85909 and paid_cents 28182"
            - "the seq_index 11 installment has amount_cents 85910 and paid_cents 0"
