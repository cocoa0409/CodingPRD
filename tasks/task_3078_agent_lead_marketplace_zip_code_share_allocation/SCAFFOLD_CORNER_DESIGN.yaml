    claim_type: violation_to_error
    grounds:
    - errors.ERR_DUPLICATE_LEAD
    excluded_because:
      difficulty_instance: resource_temporal_overlap / duplicate_lead_30_day_window
      rationale: Asserted as the failure path of the named §1.8 instance (dup29 REJECTED_DUPLICATE).
  - name: error_share_capacity_triggerable
    claim_type: violation_to_error
    grounds:
    - errors.ERR_SHARE_CAPACITY_EXCEEDED
    excluded_because:
      difficulty_instance: resource_temporal_overlap / share_capacity_disjoint_segments
      rationale: Asserted as the failure path of the named §1.8 instance.
  - name: error_stale_market_version_triggerable
    claim_type: violation_to_error
    grounds:
    - errors.ERR_STALE_MARKET_VERSION
    - concurrency_rules[share-order-activation-stale-market]
    distinguishing_aspect: A payment carrying a market version one behind the current value is rejected 412 ERR_STALE_MARKET_VERSION; retrying
      with the fresh version succeeds — deterministic OCC, two sequential requests.
    test_recipe:
      setup:
      - Clock pinned. Market oc/97221 OR (version 1); agent OCC1 order A 6000 PENDING; agent OCC2 order B 2000 PENDING. Activate A first (market
        version -> 2), then submit B's payment with the stale version 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97221'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          moc: $.data.id
          moc_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: OcB
          primary_state: OR
        as: PlatformAdmin
        captures:
          boc: $.data.id
      - call: POST /agents
        payload:
          full_name: OCC1
