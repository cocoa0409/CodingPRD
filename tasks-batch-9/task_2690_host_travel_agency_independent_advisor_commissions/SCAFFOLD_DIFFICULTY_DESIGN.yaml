            - "SplitSchedule with chargeback_retention_pct 0.10 and tier 1 advisor_pct 0.70."
            - "Consortium member advisor, ACTIVE, in NY; Aurora Cruises PREFERRED co-member (base 0.10, preferred override 0.15, ceiling 0.18, cap 500000)."
            - "Two identical CONSORTIUM-channel bookings of gross 1000000 each, both CONFIRMED and both paid in full at 160000 on 2026-07-20."
            - "Settlement run 2026-07 CALCULATED then POSTED, which stamps settled_share_cents 112000 on each booking."
