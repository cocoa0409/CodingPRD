              - "Absorb: HTTP 409 with data.error_id == \"ERR_COST_RECORD_ALREADY_ALLOCATED\" — not ERR_UNTAGGED_ABSORB_EMPTY, because ${u2} satisfies the priority-78 gate."
              - "Pool B read: data.pooled_cost_cents == 0, data.absorbed_record_count == 0, data.version == 1."
              - "${u2} read: data.shared_cost_pool_id is null and data.allocation_state == \"UNALLOCATED\" — the legal half of the batch was not partially applied."
              - "${u1} is untouched: allocation_state \"ALLOCATED\" with allocated_by_run_id == ${run_a}."

        - name: zero_driver_volume_is_a_business_error_while_negative_is_a_shape_error
          claim_type: Priority Ordering
          grounds: "§1.4 priority 20 ERR_INVALID_REQUEST (400) rejects integers that break their declared constraint of non-negativity; §1.4 priority 77 ERR_DRIVER_VOLUME_INVALID (422) demands a strictly positive driver_volume; §1.1 UnitEconomicsDriver.driver_volume is constrained integer > 0."
          distinguishing_aspect: "Zero sits in the gap between the two rules — it is non-negative, so the priority-20 shape gate lets it through, and only the priority-77 business gate can catch it. A negative volume must instead surface the earlier, coarser error."
          test_recipe:
            setup:
              - "One unit and one DRAFT allocation run."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
            trigger:
              - call: "POST /finops/unit-economics-drivers"
                payload: { business_unit_id: "${bu_id}", allocation_run_id: "${run_id}", driver_name: "ORDERS", driver_volume: 0 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/unit-economics-drivers"
                payload: { business_unit_id: "${bu_id}", allocation_run_id: "${run_id}", driver_name: "ORDERS", driver_volume: -5 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/unit-economics-drivers"
                payload: { business_unit_id: "${bu_id}", allocation_run_id: "${run_id}", driver_name: "ORDERS", driver_volume: 1 }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "Volume 0: HTTP 422 with data.error_id == \"ERR_DRIVER_VOLUME_INVALID\"."
              - "Volume -5: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" — the priority-20 gate wins."
              - "Volume 1: HTTP 201 with data.driver_volume == 1, data.efficiency_tier null and data.final_cost_per_unit_cents == 0.0 before compute."

        - name: proportional_pool_with_a_zero_basis_total_is_rejected_at_compute
          claim_type: Violation → Error
          grounds: "§1.4 priority 80 ERR_PROPORTIONAL_BASIS_ZERO (422); §1.3 shared_pool_allocation rejects a zero basis_total before dividing; §1.1 BusinessUnit.headcount defaults to 0."
          distinguishing_aspect: "The participant is ACTIVE, so the priority-79 eligibility gate passes and the failure is arithmetic, not membership: a headcount-based pool over a unit whose headcount defaulted to 0 has nothing to divide by."
          test_recipe:
            setup:
              - "One ACTIVE unit whose headcount was left at its default 0, one SHOWBACK run, one PROPORTIONAL/HEADCOUNT pool over that unit with an absorbed untagged record."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "STORAGE", list_cost_cents: 3000 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { cr_id: "$.data.id" }
              - call: "POST /finops/allocation-runs"
                payload: { mode: "SHOWBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { run_id: "$.data.id" }
              - call: "POST /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: { name: "Untagged", methodology: "PROPORTIONAL", proportional_basis: "HEADCOUNT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/allocation-runs/${run_id}/shared-cost-pools"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data[0].id" }
              - call: "POST /finops/shared-cost-pools/${pool_id}/absorb-untagged"
                payload: { cost_record_ids: ["${cr_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            trigger:
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "PATCH /finops/business-units/${bu_id}"
                payload: { headcount: 3 }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/allocation-runs/${run_id}/compute"
                payload: { variant: "FINAL" }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "First compute: HTTP 422 with data.error_id == \"ERR_PROPORTIONAL_BASIS_ZERO\"; the run stays in DRAFT with line_count 0 and variant_applied null."
              - "Second compute: HTTP 200, data.status == \"COMPUTED_FINAL\", data.total_allocated_cents == 3000, data.line_count == 1."
              - "The single SHARED line carries allocated_cents == 3000 and basis_value == 3.00."

        - name: overlapping_budget_periods_for_one_unit_are_rejected_until_the_first_closes
          claim_type: Violation → Error
          grounds: "§1.4 priority 85 ERR_BUDGET_PERIOD_DUPLICATE (409): a business unit may not have two non-CLOSED budgets whose periods overlap; §1.2 Budget terminal state CLOSED."
          distinguishing_aspect: "Conditional validation keyed on the sibling's state, not on the sibling's existence — the very same overlapping period becomes legal once the first budget reaches CLOSED, which proves the filter is 'non-CLOSED' rather than 'any'."
          test_recipe:
            setup:
              - "One unit with one ACTIVE budget covering 2026-07-01 to 2026-08-01."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 10000, forecast_cents: 10000 }
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { bud_1: "$.data.id" }
              - call: "POST /finops/budgets/${bud_1}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            trigger:
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z", amount_cents: 20000, forecast_cents: 20000 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets/${bud_1}/close"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z", amount_cents: 20000, forecast_cents: 20000 }
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "First attempt: HTTP 409 with data.error_id == \"ERR_BUDGET_PERIOD_DUPLICATE\"."
              - "Close: HTTP 200 with data.status == \"CLOSED\"."
              - "Second attempt: HTTP 201 with data.status == \"DRAFT\" — the closed sibling no longer blocks the period."
              - "GET /finops/budgets?business_unit_id=${bu_id} reports meta.total_count == 2."

        - name: dispute_filing_is_inclusive_at_the_window_end_and_rejected_one_second_later
          claim_type: Violation → Error
          grounds: "§1.4 priority 73 ERR_DISPUTE_WINDOW_CLOSED (422) with an inclusive comparison; §1.5 issue sets dispute_window_ends_at = issued_at + DISPUTE_WINDOW_HOURS (168) per §1.3 invoice_settlement_ledger constants."
          distinguishing_aspect: "Temporal boundary probed from both sides on the same invoice: one second past the window fails, the exact instant of the window end succeeds."
          test_recipe:
            setup:
