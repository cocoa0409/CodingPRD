            - "PumpCalibration.${c1}.drift_pct == 10.0 and result == INVALID"
            - "FieldSample.${s1}.status == INVALIDATED with invalidate_reason == PUMP_DRIFT (cascade hop 2)"
            - "SamplingPlan.${plan}.active_sample_count == 0 and status == APPROVED (no regress: it was not FIELD_COMPLETE)"

