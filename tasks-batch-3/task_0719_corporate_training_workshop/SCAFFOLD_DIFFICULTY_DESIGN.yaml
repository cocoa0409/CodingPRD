  - rule_id: cross_entity_state_dependency
    instances:
      - name: cohort_open_requires_program_version_approved
        grounds:
          - state_machines.Cohort.SCHEDULED_to_OPEN
          - state_machines.ProgramVersion.IN_REVIEW_to_APPROVED
          - entities.ProgramVersion.fields.status
        distinguishing_aspect: |
          Entity pair Cohort -> ProgramVersion: a Cohort's SCHEDULED->OPEN transition is gated on the referenced
          ProgramVersion.status == APPROVED; a cohort built against a still-IN_REVIEW version is rejected with
          ERR_VERSION_NOT_APPROVED.
