  # ===========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics, different
  # resources.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rent_roll_period_month_strictly_increasing
        grounds:
          - validations[priority=18]
        distinguishing_aspect: |
          Resource: Property (its rent-roll timeline). Interval semantics:
          point-in-time (monthly) periods with STRICT ordering — a new period
          must have period_month > latest existing period_month, not >=.
          Adjacent (same-month) re-entry is rejected (ERR_NONMONOTONIC_PERIOD);
          backfill of an earlier month is also rejected.
        test_recipe:
          setup:
            - "Property P with existing RentRollPeriod for 2026-06"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-OV1", deal_name: "OV1", strategy: "CORE", target_purchase_price_cents: 10000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "MULTIFAMILY", units: 10, rentable_sqft: 10000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr" }
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-06", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr-dup" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /re-underwriting/properties/${prop_id}/rent-roll"
              payload: { period_month: "2026-05", occupied_units: 9, total_units: 10, gross_potential_rent_cents: 1000000, collected_rent_cents: 900000, source_doc_ref: "rr-back" }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err_back: $.data.error_id }
          assert:
            - "Same-month re-entry: error_id == ERR_NONMONOTONIC_PERIOD (or ERR_DUPLICATE_PERIOD depending on which priority hits first; both are 422/409 rejections of the overlap)"
            - "Backfill of 2026-05: error_id == ERR_NONMONOTONIC_PERIOD"
            - "Strictly-increasing month semantics enforced"

      - name: operating_expense_unique_year_category
        grounds:
          - validations[priority=11]
        distinguishing_aspect: |
          Resource: Property (its expense ledger). Interval semantics:
          composite-key overlap on (period_year, category) — same category in
          same year collides, but same category in different years does NOT.
          Different interval semantics (composite aggregate key vs pure time
          ordering) from rent-roll above; different resource field.
        test_recipe:
          setup:
            - "Property P with existing OperatingExpense (2025, TAXES)"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-OV2", deal_name: "OV2", strategy: "CORE", target_purchase_price_cents: 10000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "MULTIFAMILY", units: 10, rentable_sqft: 10000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { prop_id: $.data.id }
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 1000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2025, category: "TAXES", amount_cents: 999999 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /re-underwriting/properties/${prop_id}/operating-expenses"
              payload: { period_year: 2024, category: "TAXES", amount_cents: 900000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { ok_diff_year: $.data.id }
          assert:
            - "Same (year, category) re-post: error_id == ERR_DUPLICATE_PERIOD (409)"
            - "Same category, different year: succeeds (different composite bucket)"
            - "Composite-key overlap semantics; not pure time ordering"

  # ===========================================================================
  # Rule 9: compensating_invariant — different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assumption_activate_deactivate_conserves_exactly_one_active
        grounds:
          - entities.MarketAssumption.fields.is_active
        distinguishing_aspect: |
          Conserved quantity: COUNT(MarketAssumption.is_active == true per deal)
          == 1 always. Forward action: POST /assumptions/{id}/activate sets this
          row active. Compensating action: every OTHER row for the same deal
          has is_active atomically cleared. Invariant: after the operation,
          exactly one row is_active=true; total count unchanged.
        test_recipe:
          setup:
            - "Deal D1 with two MarketAssumptions A1 (active) and A2 (inactive)"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-INV1", deal_name: "INV1", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "A1", market_rent_growth_yr1_bps: 200, market_rent_growth_steady_bps: 200, expense_growth_bps: 200, exit_cap_rate_bps: 600, hold_period_years: 5, capex_per_unit_cents: 100000, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { a1_id: $.data.id, a1_active: $.data.is_active }
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "A2", market_rent_growth_yr1_bps: 300, market_rent_growth_steady_bps: 300, expense_growth_bps: 300, exit_cap_rate_bps: 650, hold_period_years: 7, capex_per_unit_cents: 200000, lease_up_months: 3 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { a2_id: $.data.id, a2_active: $.data.is_active }
          trigger:
            - call: "POST /re-underwriting/assumptions/${a2_id}/activate"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "GET /re-underwriting/assumptions/${a1_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { a1_after: $.data.is_active }
            - call: "GET /re-underwriting/assumptions/${a2_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { a2_after: $.data.is_active }
          assert:
            - "A1 created with is_active == true (first row for deal becomes active by default)"
            - "A2 created with is_active == false"
            - "After POST activate on A2: A2.is_active == true AND A1.is_active == false"
            - "Invariant: count(active per deal) == 1 — forward + compensation conserve the count"

      - name: waterfall_split_conserves_total_distributions
        grounds:
          - calculations.waterfall_split
        distinguishing_aspect: |
          Conserved quantity: lp_split_cents + gp_split_cents == total projected
          distributions over the hold (sum of annual NOI + exit value). Forward
          action: waterfall computes the split. Compensating action: the LP and
          GP legs are constructed so they sum exactly to the total; no cents
          are created or destroyed by the promote calculation. Different
          conserved quantity (cash vs. count) from the assumption invariant.
        test_recipe:
          setup:
            - "Scenario S1 COMPUTED with computed_noi_yr1_cents = 72412400, deal.target_purchase_price_cents = 1000000000, hold_period_years=5, exit_cap_rate_bps=550"
          setup_api_calls:
