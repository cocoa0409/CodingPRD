scenario: |
  Mental Health Counseling Practice Management: therapist license/supervision hours,
  CPT 90791/90834 billing, insurance In-Network, sliding fee scale, crisis assessment,
  safety plan, Telehealth cross-state

domain_name: "mental-health-counseling"
api_prefix: "/practice"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Therapist legal name.
      - name: npi
        type: string
        source: input
        description: National Provider Identifier (10 digits, unique).
        constraints: "regex ^[0-9]{10}$; unique"
      - name: credential_status
        type: enum
        source: computed
        description: Lifecycle status of the therapist's practice credential.
        default: PROVISIONAL
        constraints: "enum: PROVISIONAL | ACTIVE | SUSPENDED | DEACTIVATED"
      - name: supervision_track
        type: enum
        source: input
        description: Whether the therapist is pre-licensed (accruing supervision hours) or fully licensed.
        constraints: "enum: PRE_LICENSED | LICENSED"
      - name: supervision_hours_accrued
        type: number
        source: computed
        description: Total supervision-eligible hours accumulated from COMPLETED sessions; recomputed on every Session.COMPLETED transition. See calculations.supervision_hours_accrual. Two decimal places.
        default: 0.0
      - name: licensure_exam_eligible
        type: boolean
        source: computed
        description: True when supervision_hours_accrued >= 3000.00 AND credential_status IN {PROVISIONAL, ACTIVE}. Recomputed when supervision_hours_accrued changes.
        default: false
      - name: psypact_enrolled
        type: boolean
        source: input
        description: Whether the therapist is enrolled in the PSYPACT interstate compact for telehealth.
        default: false
      - name: pricing_rack_90791_cents
        type: integer
        source: input
        description: Private-pay rack rate (in cents) for CPT 90791 intake. Used as the base for sliding-fee multipliers.
        constraints: ">= 0"
      - name: pricing_rack_90834_cents
        type: integer
        source: input
        description: Private-pay rack rate (in cents) for CPT 90834 45-minute therapy. Used as the base for sliding-fee multipliers.
        constraints: ">= 0"

  - name: StateLicense
    parent: Therapist
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: system
        description: Owning Therapist.id (set from URL).
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code where this license is issued.
        constraints: "regex ^[A-Z]{2}$"
      - name: license_number
        type: string
        source: input
        description: State-issued license identifier.
      - name: status
        type: enum
        source: computed
        description: License lifecycle.
        default: PENDING
        constraints: "enum: PENDING | ACTIVE | EXPIRED | REVOKED"
      - name: issued_on
        type: datetime
        source: input
        description: Issue date (UTC midnight).
      - name: expires_on
        type: datetime
        source: input
        description: Expiration date (UTC midnight). License auto-transitions to EXPIRED when system clock >= expires_on.

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Supervisor name.
      - name: home_state_code
        type: string
        source: input
        description: State in which the supervisor is fully licensed.
        constraints: "regex ^[A-Z]{2}$"
      - name: active
        type: boolean
        source: input
        description: Whether the supervisor is currently accepting supervisees.
        default: true

  - name: SupervisionAssignment
    parent: null
    common_fields: false
    fields:
      - name: therapist_id
        type: string
        source: input
        description: Pre-licensed therapist receiving supervision.
      - name: supervisor_id
        type: string
        source: input
        description: Assigned supervisor.
      - name: started_on
        type: datetime
        source: input
        description: Effective start date.
      - name: ended_on
        type: datetime
        source: system
        description: Set when the assignment is terminated; null while active.
        default: null
      - name: status
        type: enum
        source: computed
        description: Assignment state.
        default: ACTIVE
        constraints: "enum: ACTIVE | TERMINATED"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Patient name.
      - name: state_of_residence
        type: string
        source: input
        description: Two-letter US state where the patient is physically located on appointment days.
        constraints: "regex ^[A-Z]{2}$"
      - name: household_income_cents
        type: integer
        source: input
        description: Annual gross household income in cents (used by sliding-fee calc).
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: Number of household members.
        constraints: ">= 1"
      - name: sliding_fee_tier_pct
        type: integer
        source: computed
        description: Sliding-fee multiplier as integer percent (one of 20, 40, 60, 80, 100). Recomputed when income or household_size changes. See calculations.sliding_fee_tier.
        default: 100
      - name: insurance_plan_id
        type: string
        source: input
        description: FK to InsurancePlan; null = self-pay (sliding-fee).
        default: null
      - name: deductible_remaining_cents
        type: integer
        source: computed
        description: Remaining individual-year deductible in cents; decreased by each posted in-network claim.
        default: 0
      - name: latest_crisis_level
        type: enum
        source: computed
        description: Result of the most recent CrisisAssessment for this patient; null until first assessment is finalized.
        default: null
        constraints: "enum: LOW | MODERATE | HIGH"
      - name: safety_plan_required
        type: boolean
        source: computed
        description: True iff latest_crisis_level == HIGH AND no SafetyPlan with status=ACTIVE exists for this patient.
        default: false

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - name: payer_name
        type: string
        source: input
        description: Insurance payer (e.g., Aetna, BCBS).
      - name: plan_code
        type: string
        source: input
        description: Practice-internal plan code.
        constraints: "unique"
      - name: network_status
        type: enum
        source: input
        description: Whether the practice is contracted with this plan.
        constraints: "enum: IN_NETWORK | OUT_OF_NETWORK"
      - name: contract_mode
        type: enum
        source: input
        description: How patient responsibility is computed. DEDUCTIBLE_FIRST = patient pays min(allowed, deductible_remaining); COPAY_ONLY = patient pays flat copay regardless of deductible. See calculations.patient_responsibility.
        constraints: "enum: DEDUCTIBLE_FIRST | COPAY_ONLY"
      - name: allowed_amount_90791_cents
        type: integer
        source: input
        description: Contracted allowed amount in cents for CPT 90791.
        constraints: ">= 0"
      - name: allowed_amount_90834_cents
        type: integer
        source: input
        description: Contracted allowed amount in cents for CPT 90834.
        constraints: ">= 0"
      - name: copay_cents
        type: integer
        source: input
        description: Per-visit copay in cents (used by COPAY_ONLY contracts, and after deductible is met in DEDUCTIBLE_FIRST).
        constraints: ">= 0"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: therapist_id
        type: string
        source: input
        description: Owning therapist.
      - name: patient_id
        type: string
        source: input
        description: Patient receiving the session.
      - name: cpt_code
        type: enum
        source: input
        description: Procedure code.
        constraints: "enum: 90791 | 90834"
      - name: modality
        type: enum
        source: input
        description: Delivery mode.
        constraints: "enum: IN_PERSON | TELEHEALTH"
      - name: patient_state_on_day
        type: string
        source: input
        description: Two-letter US state where the patient will be physically located during the appointment (required for TELEHEALTH).
        constraints: "regex ^[A-Z]{2}$"
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start time.
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC end time (must be after scheduled_start).
      - name: status
        type: enum
        source: computed
        description: Lifecycle.
        default: SCHEDULED
        constraints: "enum: SCHEDULED | HELD | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED"
      - name: hold_reason
        type: enum
        source: computed
        description: Why a SCHEDULED appointment was placed in HELD (blocks check-in). Set on automatic transitions.
        default: null
        constraints: "enum: SAFETY_PLAN_MISSING | LICENSE_GAP"

  - name: Session
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: One-to-one FK to Appointment.id; set from URL.
      - name: type
        type: enum
        source: computed
        description: Mirrors Appointment.cpt_code; INTAKE for 90791, INDIVIDUAL for 90834.
        constraints: "enum: INTAKE | INDIVIDUAL"
      - name: actual_duration_minutes
        type: integer
        source: input
        description: Actual session length in minutes (entered at completion).
        constraints: ">= 1"
      - name: supervision_credit_hours
        type: number
        source: computed
        description: Hours credited to the supervising therapist's accrual ledger when this session COMPLETES. 1.00 for INDIVIDUAL, 1.50 for INTAKE.
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Session lifecycle (independent of Appointment.status once created).
        default: IN_PROGRESS
        constraints: "enum: IN_PROGRESS | COMPLETED | VOIDED"

  - name: CrisisAssessment
    parent: Patient
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: system
        description: Owning patient (from URL).
      - name: therapist_id
        type: string
        source: input
        description: Assessing therapist.
      - name: si_score
        type: integer
        source: input
        description: Suicidal-ideation factor.
        constraints: "0 <= si_score <= 4"
      - name: pa_score
        type: integer
        source: input
        description: Prior-attempts factor.
        constraints: "0 <= pa_score <= 3"
      - name: su_score
        type: integer
        source: input
        description: Substance-use factor.
        constraints: "0 <= su_score <= 2"
      - name: so_score
        type: integer
        source: input
        description: Social-isolation factor.
        constraints: "0 <= so_score <= 2"
      - name: am_score
        type: integer
        source: input
        description: Access-to-means factor.
        constraints: "0 <= am_score <= 2"
      - name: composite_score
        type: number
        source: computed
        description: Weighted composite per calculations.crisis_composite_score. Two decimal places.
      - name: risk_level
        type: enum
        source: computed
        description: Bucket derived from composite_score; see calculations.crisis_risk_bucket.
        constraints: "enum: LOW | MODERATE | HIGH"
      - name: assessed_at
        type: datetime
        source: system
        description: When the assessment was finalized.

  - name: SafetyPlan
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: Owning patient (from URL).
      - name: trigger_assessment_id
        type: string
        source: input
        description: CrisisAssessment.id that triggered creation; must be a HIGH assessment.
      - name: warning_signs
        type: string
        source: input
        description: Free-text warning signs section.
      - name: coping_strategies
        type: string
        source: input
        description: Free-text coping strategies section.
      - name: support_contacts
        type: array
        source: input
        description: List of objects {name, phone}; min 1 entry.
        constraints: "len >= 1"
      - name: crisis_hotline
        type: string
        source: input
        description: 24/7 hotline phone number.
      - name: means_restriction_plan
        type: string
        source: input
        description: Free-text restriction-of-means plan.
      - name: status
        type: enum
        source: computed
        description: SafetyPlan lifecycle.
        default: ACTIVE
        constraints: "enum: ACTIVE | SUPERSEDED | RESCINDED"

  - name: BillingClaim
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: system
        description: Owning Appointment (one-to-one); set from URL.
      - name: patient_id
        type: string
        source: system
        description: Copied from appointment for query convenience.
      - name: insurance_plan_id
        type: string
        source: system
        description: Snapshot of Patient.insurance_plan_id at posting time; null if self-pay.
      - name: cpt_code
        type: enum
        source: system
        description: Snapshot of Appointment.cpt_code.
        constraints: "enum: 90791 | 90834"
      - name: billing_mode
        type: enum
        source: system
        description: INSURANCE_IN_NETWORK when an in-network plan was active; SELF_PAY otherwise.
        constraints: "enum: INSURANCE_IN_NETWORK | SELF_PAY"
      - name: charged_amount_cents
        type: integer
        source: computed
        description: For INSURANCE_IN_NETWORK = plan.allowed_amount_<code>_cents; for SELF_PAY = therapist.pricing_rack_<code>_cents * sliding_fee_tier_pct / 100, rounded half-up to nearest cent (see calculations.sliding_fee_charge).
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: See calculations.patient_responsibility (dual-variant by contract_mode).
      - name: insurer_paid_cents
        type: integer
        source: computed
        description: charged_amount_cents - patient_responsibility_cents for INSURANCE_IN_NETWORK; 0 for SELF_PAY.
      - name: status
        type: enum
        source: computed
        description: Claim lifecycle.
        default: POSTED
        constraints: "enum: POSTED | VOIDED"
      - name: posted_at
        type: datetime
        source: system
        description: When the claim was created (matches owning Session COMPLETED transition time).

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Therapist
    initial_state: PROVISIONAL
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /practice/therapists/{id}/activate"
        actor: PracticeAdmin
        preconditions:
          - "Therapist has at least one StateLicense with status=ACTIVE."
          - "If supervision_track=PRE_LICENSED: supervision_hours_accrued >= 3000.00 (boundary inclusive)."
          - "If supervision_track=PRE_LICENSED: a SupervisionAssignment with status=ACTIVE exists."
        side_effects:
          - "credential_status := ACTIVE."
          - "licensure_exam_eligible recomputed."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /practice/therapists/{id}/suspend"
        actor: PracticeAdmin
        preconditions: ["No preconditions; manual administrative action."]
        side_effects:
          - "credential_status := SUSPENDED."
          - "Cascade: every future Appointment (scheduled_start > now) for this therapist with status=SCHEDULED transitions to HELD with hold_reason=LICENSE_GAP."
          - "Each of those HELD Appointments' transition is itself triggered by this suspension (depth-2 cascade)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /practice/therapists/{id}/reinstate"
        actor: PracticeAdmin
        preconditions:
          - "Therapist still has at least one StateLicense with status=ACTIVE."
        side_effects:
          - "credential_status := ACTIVE."
          - "Cascade: Appointments in HELD with hold_reason=LICENSE_GAP for this therapist transition back to SCHEDULED."
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /practice/therapists/{id}/deactivate"
        actor: PracticeAdmin
        preconditions:
          - "No Appointment with status IN {SCHEDULED, HELD, CHECKED_IN} exists for this therapist."
        side_effects:
          - "credential_status := DEACTIVATED."
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /practice/therapists/{id}/deactivate"
        actor: PracticeAdmin
        preconditions:
          - "No Appointment with status IN {SCHEDULED, HELD, CHECKED_IN} exists for this therapist."
        side_effects:
          - "credential_status := DEACTIVATED."

  - entity: StateLicense
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /practice/therapists/{tid}/licenses/{id}/verify"
        actor: PracticeAdmin
        preconditions:
          - "issued_on <= current clock date."
          - "expires_on > current clock date."
        side_effects:
          - "status := ACTIVE."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advance via POST /practice/_clock/advance) where current clock >= expires_on"
        actor: system
        preconditions: []
        side_effects:
          - "status := EXPIRED."
          - "Cascade: if the owning Therapist has no other ACTIVE StateLicense, every future Appointment for this therapist with status=SCHEDULED transitions to HELD with hold_reason=LICENSE_GAP (depth-2 cascade originating from the clock event)."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /practice/therapists/{tid}/licenses/{id}/revoke"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "status := REVOKED."
          - "Cascade (same as EXPIRED): re-evaluate owning Therapist's licensure coverage; HOLD future SCHEDULED appointments lacking license coverage."

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "automatic (cascade from Therapist.suspend, StateLicense expiry/revoke, or CrisisAssessment.HIGH finalize without active SafetyPlan)"
        actor: system
        preconditions:
          - "Owning Therapist.credential_status IN {SUSPENDED} OR therapist has no ACTIVE StateLicense covering patient_state_on_day OR patient.safety_plan_required = true."
        side_effects:
          - "Set hold_reason: SAFETY_PLAN_MISSING > LICENSE_GAP if both apply (SAFETY_PLAN_MISSING wins)."
      - from: HELD
        to: SCHEDULED
        trigger: "automatic (cascade from Therapist.reinstate, StateLicense.verify of a covering license, or SafetyPlan.create when hold_reason=SAFETY_PLAN_MISSING)"
        actor: system
        preconditions:
          - "Reason for HOLD has cleared (therapist ACTIVE again, covering license active, or active SafetyPlan exists)."
        side_effects:
          - "hold_reason := null."
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /practice/appointments/{id}/check-in"
        actor: Therapist
        preconditions:
          - "current clock >= scheduled_start - 15min AND current clock <= scheduled_start + 30min."
          - "Owning Therapist.credential_status IN {PROVISIONAL, ACTIVE} (PROVISIONAL pre-licensed associates may see patients while accruing supervision hours; SUSPENDED/DEACTIVATED rejected)."
          - "Therapist holds ACTIVE StateLicense for Appointment.patient_state_on_day (or psypact_enrolled = true AND patient_state_on_day is a PSYPACT state AND therapist holds at least one ACTIVE PSYPACT-state license)."
          - "patient.safety_plan_required = false."
          - "If Therapist.supervision_track = PRE_LICENSED: a SupervisionAssignment with status=ACTIVE exists for the therapist at check-in time."
        side_effects:
          - "status := CHECKED_IN."
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /practice/appointments/{id}/sessions (creates Session) followed by POST /practice/sessions/{sid}/complete"
        actor: Therapist
        preconditions:
          - "An IN_PROGRESS Session exists for this appointment and transitions to COMPLETED in the same request chain."
        side_effects:
          - "status := COMPLETED."
          - "Session.status := COMPLETED."
          - "BillingClaim auto-created (see Session COMPLETED side_effects below)."
          - "Therapist.supervision_hours_accrued increases by Session.supervision_credit_hours (depth-3 cascade: session complete → claim posted; session complete → supervision hours updated; supervision hours update → licensure_exam_eligible recomputed)."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /practice/appointments/{id}/mark-no-show"
        actor: Therapist
        preconditions:
          - "current clock > scheduled_end."
        side_effects:
          - "status := NO_SHOW."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /practice/appointments/{id}/cancel"
        actor: Therapist
        preconditions:
          - "current clock < scheduled_start."
        side_effects:
          - "status := CANCELLED."
      - from: HELD
        to: CANCELLED
        trigger: "POST /practice/appointments/{id}/cancel"
        actor: Therapist
        preconditions:
          - "current clock < scheduled_start."
        side_effects:
          - "status := CANCELLED."
          - "hold_reason := null."

  - entity: Session
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /practice/sessions/{id}/complete"
        actor: Therapist
        preconditions:
          - "Owning Appointment.status = CHECKED_IN."
          - "actual_duration_minutes is set."
          - "For Therapist.supervision_track = PRE_LICENSED: a SupervisionAssignment with status=ACTIVE exists for the therapist at posted_at."
        side_effects:
          - "status := COMPLETED; supervision_credit_hours computed (1.00 INDIVIDUAL, 1.50 INTAKE)."
          - "BillingClaim auto-posted (charged_amount and patient_responsibility computed per calculations; insurer_paid = charged - patient_responsibility for INSURANCE_IN_NETWORK)."
          - "For INSURANCE_IN_NETWORK: Patient.deductible_remaining_cents -= min(charged_amount_cents, deductible_remaining_cents); insurer_paid_cents derived after the deduction."
          - "Therapist.supervision_hours_accrued += supervision_credit_hours; Therapist.licensure_exam_eligible recomputed (depth-3 cascade originating from /sessions/{id}/complete: session→claim→deductible AND session→accrued→eligible)."
          - "Owning Appointment.status := COMPLETED."
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /practice/sessions/{id}/void"
        actor: PracticeAdmin
        preconditions:
          - "Session.status = IN_PROGRESS (cannot void after COMPLETED)."
        side_effects:
          - "status := VOIDED."
          - "Owning Appointment.status := CANCELLED."

  - entity: BillingClaim
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /practice/claims/{id}/void"
        actor: PracticeAdmin
        preconditions:
          - "Owning Session was COMPLETED within the last 7 days (clock-relative)."
        side_effects:
          - "status := VOIDED."
          - "Compensating reversal: for INSURANCE_IN_NETWORK, Patient.deductible_remaining_cents += amount previously consumed (= min(charged_amount_cents at posting, deductible_remaining_cents at posting))."
          - "Compensating reversal: Therapist.supervision_hours_accrued -= owning Session.supervision_credit_hours; licensure_exam_eligible recomputed."
          - "Owning Session.status := VOIDED; owning Appointment.status := CANCELLED."

  - entity: CrisisAssessment
    initial_state: FINALIZED
    terminal_states: [FINALIZED]
    transitions:
      - from: (none)
        to: FINALIZED
        trigger: "POST /practice/patients/{pid}/crisis-assessments"
        actor: Therapist
        preconditions:
          - "Acting Therapist has an Appointment with status IN {CHECKED_IN, COMPLETED} for this patient at any time in the past 90 days, OR Therapist holds ACTIVE credential and is on duty (PracticeAdmin/Supervisor not needed)."
        side_effects:
          - "composite_score and risk_level computed."
          - "Patient.latest_crisis_level := risk_level."
          - "If risk_level=HIGH AND no SafetyPlan with status=ACTIVE exists: Patient.safety_plan_required := true."
          - "If Patient.safety_plan_required becomes true: every future Appointment for this patient with status=SCHEDULED transitions to HELD with hold_reason=SAFETY_PLAN_MISSING (depth-3 cascade: assessment finalize → patient.safety_plan_required → appointment HOLD)."

  - entity: SafetyPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, RESCINDED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /practice/patients/{pid}/safety-plans"
        actor: Therapist
        preconditions:
          - "trigger_assessment_id references a CrisisAssessment for this patient with risk_level=HIGH."
          - "support_contacts has length >= 1."
        side_effects:
          - "Any prior SafetyPlan for this patient with status=ACTIVE transitions to SUPERSEDED."
          - "Patient.safety_plan_required := false."
          - "Cascade: every Appointment for this patient with status=HELD and hold_reason=SAFETY_PLAN_MISSING transitions back to SCHEDULED."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "automatic when a newer SafetyPlan is created for the same patient"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /practice/safety-plans/{id}/rescind"
        actor: PracticeAdmin
        preconditions:
          - "Latest CrisisAssessment for the patient has risk_level IN {LOW, MODERATE} (i.e. risk has subsided)."
        side_effects:
          - "status := RESCINDED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clinicians simultaneously POST /practice/appointments/{id}/check-in for the same appointment."
    guarantee: "Exactly one check-in succeeds; the loser observes status=CHECKED_IN and is rejected."
    error_id: ERR_APPT_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on Appointment.status (SCHEDULED → CHECKED_IN)."

  - scenario: "Two complete requests race against one cancel for the same Session."
    guarantee: "Exactly one transition wins; the loser sees the new Session.status and is rejected."
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on Session.status."

  - scenario: "Two SafetyPlans are POSTed for the same patient at the same instant."
    guarantee: "The chronologically-second writer's plan becomes ACTIVE and supersedes the earlier one; the prior plan is auto-marked SUPERSEDED. No request errors."
    error_id: ERR_NONE
    http_status: 201
    serialization: "Monotonic created_at ordering; later wins. (Documented for clarity; both calls succeed.)"

  - scenario: "Two POST /practice/claims/{id}/void requests race for the same claim."
    guarantee: "Only the first void succeeds; the second observes status=VOIDED and is rejected."
    error_id: ERR_CLAIM_NOT_POSTED
    http_status: 409
    serialization: "First-writer-wins on BillingClaim.status."

  - scenario: "A POST /practice/sessions/{id}/complete races against POST /practice/therapists/{tid}/suspend for the owning therapist."
    guarantee: "If suspend lands first, complete observes Therapist.credential_status=SUSPENDED and is rejected (cannot complete a session for a suspended therapist). If complete lands first, the session is COMPLETED and the subsequent suspension HOLDs only future SCHEDULED appointments."
    error_id: ERR_THERAPIST_NOT_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Therapist.credential_status compared at the start of complete."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sliding_fee_tier
    trigger: "Recomputed on every Patient create/update where household_income_cents or household_size changes; also on initial create."
    algorithm: threshold
    formula: |
      fpl_base_cents = FPL_BASE_CENTS[household_size]      # see constants table
      if household_income_cents <= 0:
          fpl_ratio = 0.0
      else:
          fpl_ratio = household_income_cents / fpl_base_cents   # float division, full precision

      # Brackets are LEFT-OPEN, RIGHT-CLOSED except first bracket:
      if fpl_ratio <= 1.00:        sliding_fee_tier_pct = 20
      elif fpl_ratio <= 1.50:      sliding_fee_tier_pct = 40
      elif fpl_ratio <= 2.00:      sliding_fee_tier_pct = 60
      elif fpl_ratio <= 2.50:      sliding_fee_tier_pct = 80
      else:                        sliding_fee_tier_pct = 100
    input_set: "Patient.household_income_cents (>=0) and Patient.household_size (>=1)."
    constants:
      FPL_BASE_CENTS:
        "1": 1497000     # $14,970 for household of 1 (pinned 2026)
        "2": 2044000     # $20,440 for household of 2
        "3": 2591000     # $25,910 for household of 3
        "4": 3138000     # $31,380 for household of 4
        "5": 3685000     # default formula for >4: 31380 + (size-4)*5470 (in cents)
      FPL_INCREMENT_CENTS_PER_PERSON_OVER_4: 547000
    precision: "Ratio kept in float for comparison; tier_pct is integer percent."
    variants: []

  - name: sliding_fee_charge
    trigger: "When a BillingClaim is auto-created at Session COMPLETED, AND Patient.insurance_plan_id is null (SELF_PAY mode)."
    algorithm: tiered_pricing
    formula: |
      if cpt_code == 90791:  rack = Therapist.pricing_rack_90791_cents
      else:                  rack = Therapist.pricing_rack_90834_cents
      charged_amount_cents = round_half_up( rack * Patient.sliding_fee_tier_pct / 100 )
      patient_responsibility_cents = charged_amount_cents
      insurer_paid_cents = 0
    input_set: "Owning Patient (sliding_fee_tier_pct) and owning Therapist (rack rates) at the moment of /sessions/{id}/complete."
    constants: {}
    precision: "Round half-up to nearest cent before storage."
    variants: []

  - name: patient_responsibility
    trigger: "When a BillingClaim is auto-created at Session COMPLETED, AND Patient.insurance_plan_id references an IN_NETWORK InsurancePlan."
    algorithm: forward_looking
    formula: |
      allowed = (plan.allowed_amount_90791_cents if cpt_code==90791 else plan.allowed_amount_90834_cents)
      charged_amount_cents = allowed

      if plan.contract_mode == "DEDUCTIBLE_FIRST":
          # patient pays toward deductible until exhausted; after deductible met, copay applies
          if Patient.deductible_remaining_cents > 0:
              applied = min(allowed, Patient.deductible_remaining_cents)
              patient_responsibility_cents = applied
              insurer_paid_cents = allowed - applied
          else:
              patient_responsibility_cents = min(plan.copay_cents, allowed)
              insurer_paid_cents = allowed - patient_responsibility_cents

      elif plan.contract_mode == "COPAY_ONLY":
          # flat copay regardless of deductible state
          patient_responsibility_cents = min(plan.copay_cents, allowed)
          insurer_paid_cents = allowed - patient_responsibility_cents
    input_set: "InsurancePlan snapshot at posting time; Patient.deductible_remaining_cents at posting time."
    constants: {}
    precision: "Integer cents; no rounding needed."
    variants:
      - name: deductible_first_phase
        when: "plan.contract_mode = DEDUCTIBLE_FIRST AND deductible_remaining_cents > 0"
        difference: "Patient pays toward deductible (min(allowed, remaining)); insurer pays the rest."
      - name: deductible_first_after_met
        when: "plan.contract_mode = DEDUCTIBLE_FIRST AND deductible_remaining_cents == 0"
        difference: "Patient pays copay only; insurer pays allowed - copay."
      - name: copay_only_mode
        when: "plan.contract_mode = COPAY_ONLY"
        difference: "Patient pays copay regardless of deductible; insurer pays allowed - copay. (Same inputs as DEDUCTIBLE_FIRST yield different numbers — this is the dual-variant pivot.)"

  - name: supervision_hours_accrual
    trigger: "On Session COMPLETED side_effects; on BillingClaim VOIDED (negative direction)."
    algorithm: aggregation
    formula: |
      # Forward direction (Session COMPLETED):
      delta = 1.00 if Session.type == "INDIVIDUAL" else 1.50  # INTAKE
      Therapist.supervision_hours_accrued = round_half_up(
          Therapist.supervision_hours_accrued + delta, 2
      )
      Therapist.licensure_exam_eligible = (
          Therapist.supervision_hours_accrued >= 3000.00
          and Therapist.credential_status in {"PROVISIONAL", "ACTIVE"}
      )
      # Reverse direction (BillingClaim VOIDED):
      # delta = -owning_session.supervision_credit_hours; same eligibility recompute.
    input_set: "All Sessions with status=COMPLETED whose owning Appointment.therapist_id matches; minus those whose BillingClaim is VOIDED."
    constants:
      INDIVIDUAL_HOURS: 1.00
      INTAKE_HOURS: 1.50
      REQUIRED_HOURS_FOR_LICENSURE: 3000.00
    precision: "Two decimal places, round_half_up; eligibility threshold is inclusive (>=)."
    variants:
      - name: forward
        when: "Session COMPLETED"
        difference: "Adds delta; eligibility may flip false → true."
      - name: reverse
        when: "BillingClaim VOIDED within 7-day window"
        difference: "Subtracts the same delta originally credited; eligibility may flip true → false."

  - name: crisis_composite_score
    trigger: "On POST /practice/patients/{pid}/crisis-assessments."
    algorithm: weighted_scoring
    formula: |
      # Per-factor weights (3 decimal places):
      contributions = [
          (si_score, 4.005),
          (pa_score, 3.005),
          (su_score, 2.005),
          (so_score, 1.005),
          (am_score, 2.505),
      ]
      # PINNED ORDER: round each factor*weight to 2 dp half-up, THEN sum, THEN round to 2 dp half-up.
      per_factor = [round_half_up(v * w, 2) for (v, w) in contributions]
      composite_score = round_half_up(sum(per_factor), 2)
    input_set: "The five integer factor inputs in the assessment body."
    constants:
      WEIGHT_SI: 4.005
      WEIGHT_PA: 3.005
      WEIGHT_SU: 2.005
      WEIGHT_SO: 1.005
      WEIGHT_AM: 2.505
    precision: "Two decimal places, round_half_up; per-factor rounding first, then sum (NOT sum then round)."
    variants: []

  - name: crisis_risk_bucket
    trigger: "After crisis_composite_score is computed."
    algorithm: threshold
    formula: |
      if composite_score >= 23.55:        risk_level = "HIGH"
      elif composite_score >= 15.00:      risk_level = "MODERATE"
      else:                               risk_level = "LOW"
    input_set: "composite_score from crisis_composite_score."
    constants:
      HIGH_THRESHOLD: 23.55
      MODERATE_THRESHOLD: 15.00
    precision: "Boundary is inclusive (>=)."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role IN {PracticeAdmin, Therapist, Supervisor, BillingClerk}."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's authorized roles list."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every {id} segment in the URL path resolves to an existing entity, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced entities exist (e.g., therapist_id, patient_id, insurance_plan_id, trigger_assessment_id)."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints with FK bodies"

  - priority: 5
    category: state
    check: "Target entity is in a state that admits this transition (e.g., Appointment.status must be SCHEDULED for check-in; HELD or CHECKED_IN rejects)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"

  - priority: 6
    category: state
    check: "Session.complete requires Appointment.status=CHECKED_IN; rejects otherwise (more specific than ERR_INVALID_STATE)."
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /practice/sessions/{id}/complete, /practice/sessions/{id}/void"

  - priority: 7
    category: state
    check: "Appointment check-in/cancel/no-show race losers see ERR_APPT_NOT_OPEN when status no longer SCHEDULED."
    error_id: ERR_APPT_NOT_OPEN
    http_status: 409
    applies_to: "POST /practice/appointments/{id}/check-in, /cancel, /mark-no-show"

  - priority: 8
    category: business_safety
    check: "On appointment check-in: Patient.safety_plan_required must be false. (Safety preempts all fiscal/availability checks.)"
    error_id: ERR_SAFETY_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /practice/appointments/{id}/check-in"

  - priority: 9
    category: business_safety
    check: "On safety-plan create: trigger_assessment_id MUST reference a CrisisAssessment for THIS patient with risk_level=HIGH."
    error_id: ERR_HIGH_ASSESSMENT_REQUIRED
    http_status: 422
    applies_to: "POST /practice/patients/{pid}/safety-plans"

  - priority: 10
    category: business_safety
    check: "On safety-plan rescind: latest CrisisAssessment for the patient must have risk_level IN {LOW, MODERATE}."
    error_id: ERR_RISK_STILL_HIGH
    http_status: 409
    applies_to: "POST /practice/safety-plans/{id}/rescind"

  - priority: 11
    category: business_referential
    check: "On appointment check-in: acting Therapist's credential_status must be IN {PROVISIONAL, ACTIVE}; SUSPENDED or DEACTIVATED rejected. On session.complete: same requirement (PROVISIONAL pre-licensed associates may complete sessions and accrue hours, provided their supervision assignment is ACTIVE per priority 13)."
    error_id: ERR_THERAPIST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /practice/appointments/{id}/check-in, /practice/sessions/{id}/complete"

  - priority: 12
    category: business_referential
    check: "On appointment check-in: Therapist must hold an ACTIVE StateLicense whose state_code = Appointment.patient_state_on_day; OR (psypact_enrolled=true AND patient_state_on_day ∈ PSYPACT_STATES AND therapist holds at least one ACTIVE license whose state_code ∈ PSYPACT_STATES). PSYPACT_STATES = {AL, AR, AZ, CO, CT, DC, DE, FL, GA, IL, KS, KY, ME, MD, MN, NE, NV, NH, NJ, NC, OH, OK, PA, TN, TX, UT, VA, WA, WV, WI, WY}."
    error_id: ERR_LICENSE_GAP_FOR_STATE
    http_status: 409
    applies_to: "POST /practice/appointments/{id}/check-in"

  - priority: 13
    category: business_referential
    check: "On session.complete: if therapist.supervision_track=PRE_LICENSED, an ACTIVE SupervisionAssignment must exist at the time of completion."
    error_id: ERR_NO_ACTIVE_SUPERVISOR
    http_status: 409
    applies_to: "POST /practice/sessions/{id}/complete"

  - priority: 14
    category: business_safety
    check: "On therapist.activate: PRE_LICENSED therapists require supervision_hours_accrued >= 3000.00 AND an ACTIVE SupervisionAssignment."
    error_id: ERR_SUPERVISION_INCOMPLETE
    http_status: 409
    applies_to: "POST /practice/therapists/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "On therapist.activate: at least one ACTIVE StateLicense must exist."
    error_id: ERR_NO_ACTIVE_LICENSE
    http_status: 409
    applies_to: "POST /practice/therapists/{id}/activate"

  - priority: 16
    category: business_temporal
    check: "Appointment.scheduled_end MUST be strictly after Appointment.scheduled_start; minimum length 1 minute."
    error_id: ERR_INVALID_TIMERANGE
    http_status: 422
    applies_to: "POST /practice/appointments, PATCH /practice/appointments/{id}"

  - priority: 17
    category: business_temporal
    check: "On appointment create / PATCH: the proposed time window MUST NOT overlap any existing Appointment for the SAME therapist whose status IN {SCHEDULED, HELD, CHECKED_IN}. Adjacency (back-to-back: A.scheduled_end == B.scheduled_start) is allowed (half-open [start, end) semantics)."
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /practice/appointments, PATCH /practice/appointments/{id}"

  - priority: 18
    category: business_temporal
    check: "On appointment create / PATCH: there MUST be a minimum 5-minute gap between this Appointment and any existing Appointment for the SAME patient whose status IN {SCHEDULED, HELD, CHECKED_IN}. Formally: for any other appt B, either new.scheduled_start - B.scheduled_end >= 5min OR B.scheduled_start - new.scheduled_end >= 5min. Adjacency (zero gap) is REJECTED. (Closed-interval semantics with mandatory gap.)"
    error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /practice/appointments, PATCH /practice/appointments/{id}"

  - priority: 19
    category: business_temporal
    check: "On appointment check-in: current clock IN [scheduled_start - 15min, scheduled_start + 30min]."
    error_id: ERR_OUTSIDE_CHECKIN_WINDOW
    http_status: 409
    applies_to: "POST /practice/appointments/{id}/check-in"

  - priority: 20
    category: business_fiscal
    check: "On therapist create / PATCH: pricing_rack_90791_cents and pricing_rack_90834_cents must be >= 0."
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /practice/therapists, PATCH /practice/therapists/{id}"

  - priority: 21
    category: business_constraint
    check: "PATCH/PUT requests with a `version` field MUST match the current entity version; otherwise OCC conflict."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutating PATCH/PUT endpoints"

  - priority: 22
    category: business_constraint
    check: "Required body fields present, types correct."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 23
    category: business_fiscal
    check: "On claim.void: owning Session COMPLETED within the last 7 days."
    error_id: ERR_VOID_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /practice/claims/{id}/void"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Therapist
  - method: POST
    path: "/practice/therapists"
    description: "Create a new therapist record (credential_status starts PROVISIONAL)."
    roles: [PracticeAdmin]
    code: 201
    input: ["full_name", "npi", "supervision_track", "psypact_enrolled?", "pricing_rack_90791_cents", "pricing_rack_90834_cents"]
    output: Therapist
    side_effects: []

  - method: GET
    path: "/practice/therapists/{id}"
    description: "Read a therapist."
    roles: [PracticeAdmin, Therapist, Supervisor, BillingClerk]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  - method: GET
    path: "/practice/therapists"
    description: "List therapists. Supports filter credential_status, supervision_track."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "credential_status?", "supervision_track?"]
    output: Therapist[]
    side_effects: []

  - method: PATCH
    path: "/practice/therapists/{id}"
    description: "Update mutable fields (rack rates, psypact_enrolled)."
    roles: [PracticeAdmin]
    code: 200
    input: ["psypact_enrolled?", "pricing_rack_90791_cents?", "pricing_rack_90834_cents?", "version?"]
    output: Therapist
    side_effects: []

  - method: POST
    path: "/practice/therapists/{id}/activate"
    description: "Activate a PROVISIONAL/SUSPENDED therapist."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Therapist
    side_effects: ["Therapist PROVISIONAL→ACTIVE or SUSPENDED→ACTIVE; cascade unholds appointments held for LICENSE_GAP."]

  - method: POST
    path: "/practice/therapists/{id}/suspend"
    description: "Suspend an ACTIVE therapist."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Therapist
    side_effects: ["ACTIVE→SUSPENDED; depth-2 cascade HOLDs all future SCHEDULED appointments with hold_reason=LICENSE_GAP."]

  - method: POST
    path: "/practice/therapists/{id}/reinstate"
    description: "Alias of activate from SUSPENDED."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Therapist
    side_effects: ["SUSPENDED→ACTIVE; unhold appointments."]

  - method: POST
    path: "/practice/therapists/{id}/deactivate"
    description: "Permanently deactivate a therapist."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Therapist
    side_effects: ["ACTIVE/SUSPENDED→DEACTIVATED."]

  # StateLicense
  - method: POST
    path: "/practice/therapists/{tid}/licenses"
    description: "Create a state license in PENDING state."
    roles: [PracticeAdmin]
    code: 201
    input: [state_code, license_number, issued_on, expires_on]
    output: StateLicense
    side_effects: []

  - method: POST
    path: "/practice/therapists/{tid}/licenses/{id}/verify"
    description: "Move a PENDING license to ACTIVE."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: StateLicense
    side_effects: ["PENDING→ACTIVE; cascade unholds appointments previously held for LICENSE_GAP."]

  - method: POST
    path: "/practice/therapists/{tid}/licenses/{id}/revoke"
    description: "Revoke an ACTIVE license."
    roles: [PracticeAdmin]
    code: 200
    input: ["version?"]
    output: StateLicense
    side_effects: ["ACTIVE→REVOKED; cascade re-evaluates therapist's license coverage; HOLDs future appointments lacking coverage."]

  - method: GET
    path: "/practice/therapists/{tid}/licenses"
    description: "List licenses for a therapist."
    roles: [PracticeAdmin, Therapist, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: StateLicense[]
    side_effects: []

  # Supervisor + SupervisionAssignment
  - method: POST
    path: "/practice/supervisors"
    description: "Create a supervisor."
    roles: [PracticeAdmin]
    code: 201
    input: ["full_name", "home_state_code", "active?"]
    output: Supervisor
    side_effects: []

  - method: GET
    path: "/practice/supervisors/{id}"
    description: "Read a supervisor."
    roles: [PracticeAdmin, Supervisor]
    code: 200
    input: []
    output: Supervisor
    side_effects: []

  - method: POST
    path: "/practice/supervision-assignments"
    description: "Pair a pre-licensed therapist with a supervisor."
    roles: [PracticeAdmin]
    code: 201
    input: [therapist_id, supervisor_id, started_on]
    output: SupervisionAssignment
    side_effects: []

  - method: POST
    path: "/practice/supervision-assignments/{id}/terminate"
    description: "Terminate an ACTIVE supervision assignment."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: SupervisionAssignment
    side_effects: ["ACTIVE→TERMINATED; ended_on := current clock."]

  # Patient
  - method: POST
    path: "/practice/patients"
    description: "Create a patient. sliding_fee_tier_pct computed immediately."
    roles: [PracticeAdmin, Therapist]
    code: 201
    input: ["full_name", "state_of_residence", "household_income_cents", "household_size", "insurance_plan_id?"]
    output: Patient
    side_effects: ["Calculate sliding_fee_tier_pct; if insurance_plan_id set, initialize deductible_remaining_cents from plan defaults (assumed 0 unless practice loads them — kept 0 here for simplicity)."]

  - method: GET
    path: "/practice/patients/{id}"
    description: "Read a patient."
    roles: [PracticeAdmin, Therapist, BillingClerk]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/practice/patients/{id}"
    description: "Update patient demographics, income, insurance, or set deductible_remaining_cents (administrative reset)."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: ["state_of_residence?", "household_income_cents?", "household_size?", "insurance_plan_id?", "deductible_remaining_cents?", "version?"]
    output: Patient
    side_effects: ["Recompute sliding_fee_tier_pct on income/household changes."]

  # InsurancePlan
  - method: POST
    path: "/practice/insurance-plans"
    description: "Create an insurance plan contract."
    roles: [PracticeAdmin, BillingClerk]
    code: 201
    input: [payer_name, plan_code, network_status, contract_mode, allowed_amount_90791_cents, allowed_amount_90834_cents, copay_cents]
    output: InsurancePlan
    side_effects: []

  - method: GET
    path: "/practice/insurance-plans/{id}"
    description: "Read an insurance plan."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []

  # Appointment
  - method: POST
    path: "/practice/appointments"
    description: "Schedule an appointment."
    roles: [PracticeAdmin, Therapist]
    code: 201
    input: [therapist_id, patient_id, cpt_code, modality, patient_state_on_day, scheduled_start, scheduled_end]
    output: Appointment
    side_effects: []

  - method: GET
    path: "/practice/appointments/{id}"
    description: "Read an appointment."
    roles: [PracticeAdmin, Therapist, BillingClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: PATCH
    path: "/practice/appointments/{id}"
    description: "Reschedule or change modality (only when SCHEDULED/HELD)."
    roles: [PracticeAdmin, Therapist]
    code: 200
    input: ["scheduled_start?", "scheduled_end?", "modality?", "patient_state_on_day?", "version?"]
    output: Appointment
    side_effects: []

  - method: POST
    path: "/practice/appointments/{id}/check-in"
    description: "Check a patient in (SCHEDULED→CHECKED_IN)."
    roles: [Therapist, PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Appointment
    side_effects: ["status:=CHECKED_IN."]

  - method: POST
    path: "/practice/appointments/{id}/cancel"
    description: "Cancel a SCHEDULED or HELD appointment."
    roles: [Therapist, PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Appointment
    side_effects: ["status:=CANCELLED."]

  - method: POST
    path: "/practice/appointments/{id}/mark-no-show"
    description: "Mark SCHEDULED appointment as NO_SHOW (after scheduled_end)."
    roles: [Therapist, PracticeAdmin]
    code: 200
    input: ["version?"]
    output: Appointment
    side_effects: ["status:=NO_SHOW."]

  - method: POST
    path: "/practice/appointments/{id}/sessions"
    description: "Create the IN_PROGRESS Session for a CHECKED_IN appointment."
    roles: [Therapist]
    code: 201
    input: [actual_duration_minutes]
    output: Session
    side_effects: []

  - method: GET
    path: "/practice/appointments"
    description: "List appointments; supports filter therapist_id, patient_id, status."
    roles: [PracticeAdmin, Therapist, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "therapist_id?", "patient_id?", "status?"]
    output: Appointment[]
    side_effects: []

  # Session
  - method: POST
    path: "/practice/sessions/{id}/complete"
    description: "Complete an IN_PROGRESS Session; cascades into BillingClaim post, deductible update, supervision-hours accrual, licensure_exam_eligible recompute, Appointment→COMPLETED."
    roles: [Therapist]
    code: 200
    input: []
    output: Session
    side_effects: ["BillingClaim created; Therapist.supervision_hours_accrued += credit; Patient.deductible_remaining_cents adjusted."]

  - method: POST
    path: "/practice/sessions/{id}/void"
    description: "Void an IN_PROGRESS Session (cancels the appointment)."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Session
    side_effects: ["Session.status:=VOIDED; Appointment.status:=CANCELLED."]

  - method: GET
    path: "/practice/sessions/{id}"
    description: "Read a session."
    roles: [PracticeAdmin, Therapist, BillingClerk]
    code: 200
    input: []
    output: Session
    side_effects: []

  # BillingClaim
  - method: GET
    path: "/practice/claims/{id}"
    description: "Read a billing claim."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: []
    output: BillingClaim
    side_effects: []

  - method: POST
    path: "/practice/claims/{id}/void"
    description: "Void a POSTED claim (within 7-day window). Compensating: restores deductible and supervision hours."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["status:=VOIDED; deductible restored; supervision_hours_accrued reversed; owning Session VOIDED; owning Appointment CANCELLED."]

  - method: GET
    path: "/practice/claims"
    description: "List claims; supports filter patient_id, status, billing_mode."
    roles: [PracticeAdmin, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "status?", "billing_mode?"]
    output: BillingClaim[]
    side_effects: []

  # CrisisAssessment + SafetyPlan
  - method: POST
    path: "/practice/patients/{pid}/crisis-assessments"
    description: "Create and finalize a crisis assessment for a patient."
    roles: [Therapist]
    code: 201
    input: [therapist_id, si_score, pa_score, su_score, so_score, am_score]
    output: CrisisAssessment
    side_effects: ["composite_score and risk_level computed; Patient.latest_crisis_level updated; if HIGH and no active plan, patient.safety_plan_required:=true and future SCHEDULED appointments HOLD."]

  - method: GET
    path: "/practice/patients/{pid}/crisis-assessments"
    description: "List crisis assessments for a patient."
    roles: [Therapist, PracticeAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CrisisAssessment[]
    side_effects: []

  - method: POST
    path: "/practice/patients/{pid}/safety-plans"
    description: "Create a safety plan; supersedes any prior ACTIVE plan."
    roles: [Therapist]
    code: 201
    input: [trigger_assessment_id, warning_signs, coping_strategies, support_contacts, crisis_hotline, means_restriction_plan]
    output: SafetyPlan
    side_effects: ["Prior ACTIVE plan→SUPERSEDED; patient.safety_plan_required:=false; HELD appointments for this patient with hold_reason=SAFETY_PLAN_MISSING→SCHEDULED."]

  - method: POST
    path: "/practice/safety-plans/{id}/rescind"
    description: "Rescind an ACTIVE safety plan when risk has subsided."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []

  - method: GET
    path: "/practice/patients/{pid}/safety-plans"
    description: "List safety plans for a patient."
    roles: [Therapist, PracticeAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SafetyPlan[]
    side_effects: []

  # System / test affordances
  - method: POST
    path: "/practice/_clock/advance"
    description: "Test-only: advance the deterministic system clock to a specified ISO 8601 instant. Triggers any pending automatic transitions (license expiry, etc.)."
    roles: [PracticeAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: ["StateLicense ACTIVE→EXPIRED for any license whose expires_on <= new clock; license-gap cascades fire."]

  - method: GET
    path: "/practice/_clock"
    description: "Test-only: read current deterministic clock."
    roles: [PracticeAdmin, Therapist, Supervisor, BillingClerk]
    code: 200
    input: []
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "URL-path entity id does not resolve."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign key does not resolve."
  - id: ERR_VALIDATION
    http: 400
    condition: "Schema validation failure (missing required field, wrong type, regex mismatch)."
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Monetary input is negative or non-integer."
  - id: ERR_INVALID_TIMERANGE
    http: 422
    condition: "scheduled_end <= scheduled_start or duration < 1 minute."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine precondition not met."
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "Session.complete/void called when Session.status != IN_PROGRESS, OR Appointment.status != CHECKED_IN for complete."
  - id: ERR_APPT_NOT_OPEN
    http: 409
    condition: "Appointment check-in/cancel/no-show called when Appointment.status no longer admits the transition."
  - id: ERR_CLAIM_NOT_POSTED
    http: 409
    condition: "claim.void called when BillingClaim.status != POSTED."
  - id: ERR_VOID_WINDOW_EXPIRED
    http: 409
    condition: "claim.void attempted more than 7 days after owning Session COMPLETED."
  - id: ERR_SAFETY_PLAN_REQUIRED
    http: 409
    condition: "Appointment check-in attempted while Patient.safety_plan_required=true."
  - id: ERR_HIGH_ASSESSMENT_REQUIRED
    http: 422
    condition: "SafetyPlan create references an assessment that is not for this patient or is not risk_level=HIGH."
  - id: ERR_RISK_STILL_HIGH
    http: 409
    condition: "SafetyPlan rescind attempted while latest assessment is HIGH."
  - id: ERR_THERAPIST_NOT_ACTIVE
    http: 409
    condition: "Acting therapist's credential_status is not ACTIVE (for check-in or session.complete)."
  - id: ERR_LICENSE_GAP_FOR_STATE
    http: 409
    condition: "Therapist holds no ACTIVE StateLicense covering Appointment.patient_state_on_day and PSYPACT compact does not apply."
  - id: ERR_NO_ACTIVE_LICENSE
    http: 409
    condition: "Therapist activation attempted with zero ACTIVE StateLicenses."
  - id: ERR_NO_ACTIVE_SUPERVISOR
    http: 409
    condition: "PRE_LICENSED therapist completing a session without an ACTIVE SupervisionAssignment."
  - id: ERR_SUPERVISION_INCOMPLETE
    http: 409
    condition: "PRE_LICENSED therapist activation attempted with supervision_hours_accrued < 3000.00."
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "Proposed appointment overlaps another non-terminal appointment for the same therapist (half-open intervals)."
  - id: ERR_PATIENT_DOUBLE_BOOKED
    http: 409
    condition: "Proposed appointment violates the minimum 5-minute gap to another non-terminal appointment for the same patient (closed-interval semantics with mandatory gap)."
  - id: ERR_OUTSIDE_CHECKIN_WINDOW
    http: 409
    condition: "Check-in outside [start-15m, start+30m]."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Body `version` does not match current entity version."
  - id: ERR_NONE
    http: 201
    condition: "Sentinel — both writers succeed in a race (documented in concurrency_rules for clarity)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Practice management; full CRUD on therapists, licenses, supervisors, insurance plans, patients, and all administrative transitions (suspend/reinstate/deactivate, void, rescind, clock-advance)."
    identity: "opaque"
    exclusive_operations:
      - "POST /practice/therapists, PATCH /practice/therapists/{id}"
      - "POST /practice/therapists/{id}/{activate,suspend,reinstate,deactivate}"
      - "POST /practice/therapists/{tid}/licenses, /verify, /revoke"
      - "POST /practice/supervisors, /supervision-assignments, /terminate"
      - "POST /practice/sessions/{id}/void"
      - "POST /practice/safety-plans/{id}/rescind"
      - "POST /practice/_clock/advance"
    shared_operations:
      - "POST /practice/patients, PATCH /practice/patients/{id} (with Therapist for create)"
      - "POST /practice/insurance-plans (with BillingClerk)"
      - "POST /practice/appointments, /cancel, /check-in, /mark-no-show, PATCH (with Therapist)"
      - "POST /practice/claims/{id}/void (with BillingClerk)"
      - "All GET endpoints"

  - name: Therapist
    description: "Clinical user; runs sessions, performs assessments, creates safety plans, schedules appointments, completes sessions."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /practice/appointments/{id}/sessions"
      - "POST /practice/sessions/{id}/complete"
      - "POST /practice/patients/{pid}/crisis-assessments"
      - "POST /practice/patients/{pid}/safety-plans"
    shared_operations:
      - "POST /practice/patients (with PracticeAdmin)"
      - "POST /practice/appointments, /check-in, /cancel, /mark-no-show, PATCH (with PracticeAdmin)"
      - "All GET endpoints they have access to."

  - name: Supervisor
    description: "Provides supervision; read-only view of supervisees' assignments and sessions."
    identity: "entity_backed:Supervisor"
    exclusive_operations: []
    shared_operations:
      - "GET /practice/supervisors/{id}"
      - "GET /practice/therapists/{id}"
      - "GET /practice/sessions/{id}"
      - "GET /practice/appointments (filtered)"

  - name: BillingClerk
    description: "Manages insurance plans and billing/claim void within allowed window."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /practice/insurance-plans (with PracticeAdmin)"
      - "POST /practice/claims/{id}/void (with PracticeAdmin)"
      - "PATCH /practice/patients/{id} (with PracticeAdmin)"
      - "GET /practice/claims, GET /practice/insurance-plans/{id}, GET /practice/patients/{id}"
