scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: net_taxable_estate_provisional_vs_final
        grounds:
          - calculations.net_taxable_estate
          - calculations.net_taxable_estate.variants.provisional
          - calculations.net_taxable_estate.variants.final
          - state_machines.Estate.PROBATE_OPEN_to_ADMINISTRATION
          - endpoints[GET /estates/{id}/net-taxable-summary]
          - entities.Estate.fields.inventory_snapshot_gross_cents
        distinguishing_aspect: |
          The provisional variant reads LIVE Estate.gross_estate_value_cents (which tracks current Asset appraisals); the final variant reads the frozen Estate.inventory_snapshot_gross_cents taken at APPROVE_INVENTORY entry. After APPROVE_INVENTORY, a PATCH /assets/{id} that raises appraised_value_cents is reflected in gross_estate_value_cents (and would-be provisional net) but DOES NOT reach the final variant — which still reports the pre-PATCH snapshot. Same Estate, same Asset, two different net values for the same GET endpoint depending solely on Estate.status (PROBATE_OPEN vs ADMINISTRATION).
        test_recipe:
          setup:
            - "Clock pinned at 2026-03-01T00:00:00Z."
            - "Estate in PROBATE_OPEN with executor accepted and OPEN_PROBATE order ENTERED."
            - "One Asset (REAL_ESTATE) appraised at 5000000 cents, INCLUDED."
            - "One ALLOWED CreditorClaim filed at 2026-04-01 (31 days after probate open, within window) for 100000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Alice Smith", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "1234" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "REAL_ESTATE", description: "Home", appraised_value_cents: 5000000 }
              as: EstatePlanner
              captures: { home_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Bob Smith", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Carol Smith", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-02-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "BigBank", amount_cents: 100000, claim_class: "UNSECURED", filed_at: "2026-04-01T00:00:00Z" }
              as: Creditor
              captures: { claim_id: $.data.id }
            - call: "POST /creditor-claims/${claim_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "GET /estates/${est_id}/net-taxable-summary"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { net_provisional: $.data.net_taxable_estate_cents, variant_provisional: $.data.variant }
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "APPROVE_INVENTORY", judge_user_id: "judge-1" }
              as: Judge
              captures: { approve_order_id: $.data.id }
            - call: "POST /probate-orders/${approve_order_id}/enter"
              payload: {}
              as: Judge
            - call: "PATCH /assets/${home_id}"
              payload: { appraised_value_cents: 8000000 }
              as: Executor
              as_user_id: "${exec_id}"
            - call: "GET /estates/${est_id}/net-taxable-summary"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { net_final: $.data.net_taxable_estate_cents, variant_final: $.data.variant, gross_live: $.data.gross_estate_value_cents }
          assert:
            - "variant_provisional == 'provisional'"
            - "variant_final == 'final'"
            - "net_provisional == 4900000"
            - "net_final == 4900000"
            - "gross_live == 8000000"
            - "net_final != gross_live - 100000  # i.e., the PATCH-raised gross (7900000) is NOT used; the frozen snapshot (5000000-100000=4900000) IS used."

      - name: creditor_waterfall_pro_rata_vs_priority
        grounds:
          - calculations.creditor_payment_waterfall
          - calculations.creditor_payment_waterfall.variants.pro_rata_within_class
          - calculations.creditor_payment_waterfall.variants.priority_full_pay
          - state_machines.CreditorClaim.ALLOWED_to_PAID
        distinguishing_aspect: |
          On the same set of two SECURED CreditorClaims totalling 1400000 cents against gross 1000000 cents, the priority_full_pay variant (no CLOSE_ESTATE order drafted) pays claim A 700000 + claim B 300000, while the pro_rata_within_class variant (CLOSE_ESTATE order in DRAFT) pays both 500000 cents each. The variants operate on CreditorClaim (different entity domain from net_taxable_estate's Estate domain).
        test_recipe:
          setup:
            - "Estate in ADMINISTRATION with gross_estate_value_cents == 1000000."
            - "Two ALLOWED SECURED CreditorClaims of 700000 cents each, created in this order."
            - "No CLOSE_ESTATE ProbateOrder exists yet (priority_full_pay branch active)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Dan Doe", date_of_birth: "1955-06-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "5678" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Chase Acct", appraised_value_cents: 1000000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Eve Doe", relationship: "SPOUSE", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Frank Doe", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "ClaimA", amount_cents: 700000, claim_class: "SECURED", filed_at: "2026-02-01T00:00:00Z" }
              as: Creditor
              captures: { claim_a_id: $.data.id }
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "ClaimB", amount_cents: 700000, claim_class: "SECURED", filed_at: "2026-02-02T00:00:00Z" }
              as: Creditor
              captures: { claim_b_id: $.data.id }
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "APPROVE_INVENTORY", judge_user_id: "judge-1" }
              as: Judge
              captures: { approve_order_id: $.data.id }
            - call: "POST /probate-orders/${approve_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /creditor-claims/${claim_a_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /creditor-claims/${claim_b_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "POST /creditor-claims/${claim_a_id}/pay"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { paid_a: $.data.paid_amount_cents, status_a: $.data.status }
            - call: "POST /creditor-claims/${claim_b_id}/pay"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { paid_b: $.data.paid_amount_cents, status_b: $.data.status }
          assert:
            - "status_a == 'PAID'"
            - "status_b == 'PAID'"
            - "paid_a == 700000"
            - "paid_b == 300000"
            - "Variant priority_full_pay applied: claim_a paid in full 700000; claim_b receives the residual 300000 (gross 1000000 minus already-paid 700000). Under pro_rata variant the same inputs would yield paid_a=500000 and paid_b=500000."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_priority_with_residual_marginal_pay
        grounds:
          - calculations.creditor_payment_waterfall
          - validations[priority=12]
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (claim_class priority, created_at sort, amount_cents sort, remaining capacity) with non-linear interaction — once `remaining < c.amount_cents`, the marginal claim gets a partial payment and ALL lower-priority claims get zero. Different from boundary-only threshold checks because the per-claim payout depends on the full ordered chain, not a single comparison.
        test_recipe:
          setup:
            - "Estate ADMINISTRATION with gross_estate_value_cents == 1000000."
            - "Three ALLOWED CreditorClaims: SECURED 400000 (created first), ADMIN 700000 (created second), UNSECURED 200000 (created third)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Grace Hill", date_of_birth: "1952-03-03T00:00:00Z", domicile_state_code: "TX", ssn_last4: "9012" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Savings", appraised_value_cents: 1000000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir 1", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec G", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "Sec1", amount_cents: 400000, claim_class: "SECURED", filed_at: "2026-02-01T00:00:00Z" }
              as: Creditor
              captures: { sec_id: $.data.id }
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "Adm1", amount_cents: 700000, claim_class: "ADMIN", filed_at: "2026-02-02T00:00:00Z" }
              as: Creditor
              captures: { adm_id: $.data.id }
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "Unsec1", amount_cents: 200000, claim_class: "UNSECURED", filed_at: "2026-02-03T00:00:00Z" }
              as: Creditor
              captures: { unsec_id: $.data.id }
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "APPROVE_INVENTORY", judge_user_id: "judge-1" }
              as: Judge
              captures: { approve_order_id: $.data.id }
            - call: "POST /probate-orders/${approve_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /creditor-claims/${sec_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /creditor-claims/${adm_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /creditor-claims/${unsec_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "POST /creditor-claims/${sec_id}/pay"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { paid_sec: $.data.paid_amount_cents, status_sec: $.data.status }
            - call: "POST /creditor-claims/${adm_id}/pay"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { paid_adm: $.data.paid_amount_cents, status_adm: $.data.status }
            - call: "POST /creditor-claims/${unsec_id}/pay"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { unsec_err_id: $.data.error_id }
          assert:
            - "paid_sec == 400000"
            - "status_sec == 'PAID'"
            - "paid_adm == 600000"
            - "status_adm == 'PAID'"
            - "unsec_err_id == 'ERR_INSUFFICIENT_ESTATE_FUNDS'"
            - "Combinatorial mode (a): SECURED Sec1 takes 400000 → remaining=600000; ADMIN Adm1 amount 700000 > 600000 so Adm1 paid_amount_cents=600000, remaining=0; UNSECURED Unsec1 hits ERR_INSUFFICIENT_ESTATE_FUNDS. Non-linear interaction across 3 inputs (priority class, ordering, remaining capacity)."

      - name: intestacy_remainder_rounding_pinned_order
        grounds:
          - calculations.intestacy_share_allocation
          - endpoints[POST /estates/{id}/compute-intestacy-shares]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three CHILD beneficiaries split a 5000bp child_pool (CA state). 5000 // 3 = 1666 base; remainder 5000 - 3*1666 = 2 bp. The formula pins distribution by created_at ASC: first two children get 1667, third gets 1666. Reordering by id or amount would change the outcome.
        test_recipe:
          setup:
            - "Decedent in CA with no ACTIVE BeneficiaryDesignation summing to 10000."
            - "Three CHILD designations (DRAFT) created at strictly increasing timestamps."
            - "One SPOUSE designation (DRAFT) at the same estate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Ivan Lopez", date_of_birth: "1948-08-08T00:00:00Z", domicile_state_code: "CA", ssn_last4: "3456" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Spouse S", relationship: "SPOUSE", share_basis_points: 1 }
              as: EstatePlanner
              captures: { spouse_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Child A", relationship: "CHILD", share_basis_points: 1 }
              as: EstatePlanner
              captures: { child_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:02Z" }
              as: PlatformAdmin
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Child B", relationship: "CHILD", share_basis_points: 1 }
              as: EstatePlanner
              captures: { child_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:03Z" }
              as: PlatformAdmin
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Child C", relationship: "CHILD", share_basis_points: 1 }
              as: EstatePlanner
              captures: { child_c_id: $.data.id }
          trigger:
            - call: "POST /estates/${est_id}/compute-intestacy-shares"
              payload: {}
              as: Judge
              captures: { share_map: $.data.shares, total_bp: $.data.total_bp_assigned }
          assert:
            - "shares[spouse_id] == 5000"
            - "shares[child_a_id] == 1667"
            - "shares[child_b_id] == 1667"
            - "shares[child_c_id] == 1666"
            - "total_bp_assigned == 10000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: estate_contested_cycle_back_to_probate_open
        grounds:
          - state_machines.Estate.PROBATE_OPEN_to_CONTESTED
          - state_machines.Estate.CONTESTED_to_PROBATE_OPEN
          - endpoints[POST /estates/{id}/contest]
          - endpoints[POST /estates/{id}/resolve-contest]
        distinguishing_aspect: |
          Estate state machine has a TRUE CYCLE: PROBATE_OPEN -> CONTESTED -> PROBATE_OPEN. Same node revisited via different actor (Beneficiary triggers in, Judge triggers out) and Estate.version increments on each hop so OCC distinguishes the two visits.
        test_recipe:
          setup:
            - "Estate in PROBATE_OPEN with a beneficiary entity who can contest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Jane Park", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "1111" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir J", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
              captures: { ben_id: $.data.id }
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec J", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Judge
              captures: { est_v_pre_contest: $.data.version, status_pre_contest: $.data.status }
          trigger:
            - call: "POST /estates/${est_id}/contest"
              payload: { expected_estate_version: "${est_v_pre_contest}", reason: "validity challenge" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { status_contested: $.data.status }
            - call: "POST /estates/${est_id}/resolve-contest"
              payload: { resolution_note: "court resolved" }
              as: Judge
              captures: { status_resolved: $.data.status, est_v_post_resolve: $.data.version }
          assert:
            - "status_pre_contest == 'PROBATE_OPEN'"
            - "status_contested == 'CONTESTED'"
            - "status_resolved == 'PROBATE_OPEN'"
            - "est_v_post_resolve > est_v_pre_contest + 1"

      - name: probate_order_branching_by_order_type
        grounds:
          - state_machines.ProbateOrder.DRAFT_to_ENTERED
          - state_machines.ProbateOrder.ENTERED_to_SUPERSEDED
        distinguishing_aspect: |
          ProbateOrder DRAFT->ENTERED is a branching transition: divergent side_effect sets depending on order_type. OPEN_PROBATE branches into "Estate->PROBATE_OPEN + Executor->COURT_CONFIRMED"; APPROVE_INVENTORY branches into "Estate->ADMINISTRATION"; CLOSE_ESTATE branches into "Estate->CLOSED + Executor->DISCHARGED". Different order_type at the same FROM (DRAFT) yields entirely different cascade chains.
        test_recipe:
          setup:
            - "Estate already in PROBATE_OPEN (from prior OPEN_PROBATE entered)."
            - "Executor in COURT_CONFIRMED."
