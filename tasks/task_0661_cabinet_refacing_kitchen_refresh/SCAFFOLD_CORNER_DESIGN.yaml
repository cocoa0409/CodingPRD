  # ===================================================================
  # Endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: financing_decline_then_get_reflects_status
        claim_type: Action endpoint
        grounds:
          - endpoints
          - entities.FinancingApplication.fields.status
        distinguishing_aspect: "POST /financing-applications/{id}/decline moves SUBMITTED -> DECLINED; GET reflects status DECLINED."
        test_recipe:
          setup:
            - "A SUBMITTED financing application."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c_p1@x.com", full_name: "C P1", state_code: "CA", annual_income_cents: 9000000 }
              as: SalesRep
              captures: { cp1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cp1}", address_line: "P1 Way" }
              as: SalesRep
              captures: { pp1: $.data.id }
            - call: "POST /projects/${pp1}/financing-applications"
              payload: { customer_id: "${cp1}", amount_cents: 1500000, term_months: 36 }
              as: Customer
              as_user_id: "${cp1}"
              captures: { fap1: $.data.id }
          trigger:
            - call: "POST /financing-applications/${fap1}/decline"
              payload: {}
              as: PlatformAdmin
              captures: { fap1status: $.data.status }
          assert:
            - "FinancingApplication.${fap1}.status == DECLINED"

      - name: financing_approve_within_dti_succeeds
        claim_type: Conditional action
        grounds:
          - endpoints
          - validations[priority=17]
          - entities.FinancingApplication.fields.status
        distinguishing_aspect: "POST /financing-applications/{id}/approve with dti_ratio 0.1979 (<= 0.20) succeeds, status APPROVED."
        test_recipe:
          setup:
            - "A SUBMITTED financing application with income 3800000, amount 2000000, term 36 -> dti 0.1979."
