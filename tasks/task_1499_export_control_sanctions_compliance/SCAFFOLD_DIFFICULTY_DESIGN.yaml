  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: license_quantity_exact_equality_exhausts
        grounds:
          - calculations.license_consumption
          - state_machines.License.APPROVED_to_EXHAUSTED
          - errors[ERR_LICENSE_QUANTITY_INSUFFICIENT]
        distinguishing_aspect: |
          Metric: license remaining quantity; endpoint POST /shipments/{id}/release. Boundary
          is <= (equality allowed): shipment quantity exactly == remaining_quantity succeeds
          and drives the license to EXHAUSTED (remaining hits 0).
        test_recipe:
          setup:
            - "Product EAR 5A002 (pct 50, unit 1000) CLASSIFIED; License APPROVED qty 10, value 100000; clean party; order qty 10 LICENSE_REQUIRED -> LICENSED -> RELEASED"
