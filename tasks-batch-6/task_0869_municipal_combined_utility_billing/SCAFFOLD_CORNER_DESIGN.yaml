          assert:
            - "Account.${a_id}.status == ACTIVE"
            - "Account.${a_id}.delinquent_balance_cents == 0"
            - "ShutoffOrder.${so_id}.status == CANCELLED"
            - "Bill.${b_id}.collection_status == CURRENT"
