              as: SafetyOfficer
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "L2", assigned_to: "op-l", due_date: "2026-08-03", priority: "LOW" }
              as: SafetyOfficer
            - call: "POST /safety/corrective-actions"
