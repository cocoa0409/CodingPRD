              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_1: $.data.id }
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", batch_ids: ["${batch_2}"], expected_campaign_version: "${camp_v1}" }
