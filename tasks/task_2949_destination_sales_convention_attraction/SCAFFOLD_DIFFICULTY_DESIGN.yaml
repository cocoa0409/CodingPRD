            - call: "GET /hotels/${hotel_id}"
              payload: {}
              as: SalesManager
              captures: { hotel_peak_final: $.data.committed_peak_rooms }
          assert:
            - "${c_early_status} == COMMITTED and ${c_late_status} == COMMITTED - touching windows never contend"
            - "${hotel_peak_after_two} == 400 - the MAX over nights (04-12 and 04-13 carry 400), not 700"
            - "${c_single_status} == OFFERED"
            - "the 101-room commit returns HTTP 422 with ${err} == ERR_HOTEL_CAPACITY_EXCEEDED because night 2028-04-11 would reach 401"
            - "${c_single_reoffer_rooms} == 100 and ${c_single_round} == 2"
            - "${c_single_status_after} == COMMITTED and ${c_single_peak} == 100 - exact equality with committable_rooms is allowed"
            - "${hotel_peak_final} == 400 - night 04-11 now carries 300 + 100 == 400, still the max"
            - "Hotel.${hotel_id}.committed_room_nights == 1500 (300*2 + 400*2 + 100*1) - the room-night total is a plain sum across commitments while committed_peak_rooms is a nightly maximum"

      - name: released_window_promotes_the_larger_of_two_overlapping_second_holds
        grounds:
          - calculations.second_hold_promotion_selection
          - calculations.hall_occupation_conflict
          - endpoints[POST /space-holds/{id}/release]
          - entities.SpaceHold.fields.expires_at
          - state_machines.Opportunity.hold_posture.NONE_to_TENTATIVE
        distinguishing_aspect: |
          Two SECOND-rank holds each overlap the released FIRST hold's buffered window but NOT each other
          (2028-04-05 -> 2028-04-07 and 2028-04-14 -> 2028-04-16 around an incumbent 2028-04-08 -> 2028-04-13
          with a 48h turnaround), so both are legally HELD at rank SECOND. Releasing the incumbent promotes
          EXACTLY ONE - the one whose opportunity has the larger peak_rooms_requested (900 over 400), never the
          older or the lower id - and re-stamps its expiry at clock + PROMOTION_HOLD_DAYS (30) = 2027-05-01,
          not the incumbent's 90-day expiry. The loser stays SECOND even though nothing blocks it any more.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; Grand Hall A with turnaround_hours 48"
            - "incumbent FIRST hold H0 for opportunity INCUMBENT over 2028-04-08T00:00:00Z -> 2028-04-13T00:00:00Z, expires_at 2027-05-30T00:00:00Z"
            - "SECOND hold H1 for opportunity SMALL (peak_rooms_requested 400) over 2028-04-05T00:00:00Z -> 2028-04-07T00:00:00Z, created first"
            - "SECOND hold H2 for opportunity LARGE (peak_rooms_requested 900) over 2028-04-14T00:00:00Z -> 2028-04-16T00:00:00Z, created second"
            - "clock advanced to 2027-04-01T00:00:00Z, still before H0.expires_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
