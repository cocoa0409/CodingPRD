              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Anthro Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Lee Adjunct", applicant_email: "lee@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-t-lee", verified_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/reject", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_2" }
          trigger:
            - call: "POST /adjunct-hr/credentials/${cred_t}/verify"
              payload: {}
