      - name: insurer_capacity_closed_lock_intervals_touch_but_expiry_frees
        grounds:
          - calculations.insurer_committed_capacity
          - state_machines.BuyoutTranche.INSURER_SELECTED_to_PRICING_LOCKED
          - errors.ERR_INSURER_CAPACITY_EXCEEDED
          - entities.Insurer.fields.committed_capacity_cents
        distinguishing_aspect: |
          Lock intervals are CLOSED while window intervals are half-open, and this
          instance is built so that the two conventions give opposite answers one
          day apart. An insurer with 20000000 of capacity holds a 12000000 lock over
          [2026-09-01, 2026-11-30]. A second tranche's 11800000 lock attempted on
          2026-11-30 intersects the first at exactly one instant, so the aggregate
          check sees committed 12000000 / available 8000000 and rejects. The very
          same call one day later is admitted, because a closed interval starting
          2026-12-01 is disjoint from one ending 2026-11-30. The instance also pins
          the sibling boundary on the stored field: at 2026-11-30 the first lock is
          still unexpired and counts, at 2026-12-01 it has aged out of a tranche
