              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Tobias Ehrlich", date_of_birth: "1969-05-23T00:00:00Z", home_state: "MA" }
              as: PatientService
