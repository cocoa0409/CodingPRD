      - name: sm_exit_signoff_fork_join
        claim_type: side_effect_execution
        grounds: [state_machines.ExitPlan.DUE_DILIGENCE_to_APPROVED, "errors[ERR_SIGNOFF_PARTY_REPEATED]", "errors[ERR_SIGNER_REUSED]"]
        distinguishing_aspect: "Fork-join: two signoffs leave the plan in DUE_DILIGENCE; repeated party and reused signer are rejected; the third distinct party fires the join to APPROVED."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; exit plan in DUE_DILIGENCE"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "SJ", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "sj@x.org" }, as: Applicant, as_user_id: user_c_sj, captures: { app: $.data.id } }
