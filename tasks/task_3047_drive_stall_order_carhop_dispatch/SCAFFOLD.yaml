# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not exist or is out of location scope" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed input: bad enum, quantity < 1, missing required field, non-positive capacity/target" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition, or terminal" }
  - { id: ERR_STALL_OCCUPIED, http: 409, condition: "Check-in to a non-IDLE stall; or set_out_of_service on an occupied stall without force_cancel" }
  - { id: ERR_STALL_NOT_OCCUPIED_BY_ORDER, http: 409, condition: "Place attempted for a stall-channel order that is not the stall's current order" }
  - { id: ERR_INTERCOM_UNAVAILABLE, http: 409, condition: "Stall intercom dead and no fallback_confirmed on place" }
  - { id: ERR_FAULT_STILL_OPEN, http: 409, condition: "return_to_service with an OPEN EquipmentFault on the stall" }
  - { id: ERR_LANE_CLOSED, http: 409, condition: "Location CURBSIDE_ONLY: intercom check-in and STALL_INTERCOM place blocked" }
  - { id: ERR_STALL_WEATHER_CLOSED, http: 409, condition: "HEAT_ADVISORY blocks PATIO check-in" }
  - { id: ERR_APP_ONLY, http: 409, condition: "app-checkin by non-app user, or app_only offer applied to non-app order" }
  - { id: ERR_MENU_ITEM_RETIRED, http: 409, condition: "Adding or placing an order with a RETIRED menu item" }
  - { id: ERR_SIZE_REQUIRED, http: 422, condition: "DRINK_SIZES item line without a valid size option" }
  - { id: ERR_OPTION_INVALID, http: 422, condition: "Add-in option not ACTIVE or not applicable to the item category" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Place with zero lines" }
  - { id: ERR_NO_SERVICE_TARGET, http: 409, condition: "No ACTIVE ServiceTargetProfile for (channel, weather_mode) nor (channel, NORMAL)" }
  - { id: ERR_OFFER_NOT_APPLICABLE, http: 409, condition: "Explicit offer_code not ACTIVE, out of window at checked_in_at, or app_only mismatch" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "Deliver attempted before payment CAPTURED" }
  - { id: ERR_PAYMENT_CAPTURED_REQUIRES_REFUND, http: 409, condition: "Cancel attempted on a CAPTURED order" }
  - { id: ERR_WALLET_NEGATIVE, http: 409, condition: "Wallet adjustment or tender would drive wallet_credit_cents below 0" }
  - { id: ERR_KITCHEN_SATURATED, http: 409, condition: "start_preparation while 8 orders already PREPARING at the location" }
  - { id: ERR_EMPTY_RUN, http: 409, condition: "Depart a run with no orders" }
  - { id: ERR_NO_CARHOP_ELIGIBLE, http: 409, condition: "Dispatch selector: no on-shift carhop fits zone and capacity" }
  - { id: ERR_NOT_ASSIGNED_CARHOP, http: 409, condition: "Carhop departs a run assigned to a different carhop" }
  - { id: ERR_RUN_SEQUENCE_VIOLATION, http: 409, condition: "Deliver out of run_position order" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corporate operator; configures locations, menu, options; can do everything a ShiftManager can"
    identity: "opaque"
    exclusive_operations:
      - "POST /locations"
      - "POST /menu-items, POST /menu-items/{id}/retire"
      - "POST /customization-options"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All reads; weather; offers; service targets; stalls; carhops; metrics"
  - name: ShiftManager
    description: "Location manager; runs the shift, dispatch, refunds, wallet, faults"
    identity: "opaque"
    exclusive_operations:
      - "POST /locations/{id}/advance_rush"
      - "POST /locations/{id}/delivery-runs and .../void"
      - "POST /locations/{id}/tip-records/{id}/settle"
      - "POST /locations/{id}/orders/{id}/refund"
      - "POST /customers/{id}/wallet/adjust"
      - "POST .../stalls/{id}/set_out_of_service, return_to_service, faults/{id}/resolve"
    shared_operations:
      - "check-in, order build/place/cancel, preparation, readiness, depart, deliver, weather, offers, service targets, reads"
  - name: KitchenStaff
    description: "Kitchen worker; advances preparation pipeline only"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST .../orders/{id}/start_preparation, mark_ready; reads of orders, stalls, menu"
  - name: Carhop
    description: "Runs trays to stalls; reports faults; captures payment at the stall"
    identity: "entity_backed:Carhop"
    exclusive_operations:
      - "POST /locations/{id}/stalls/{id}/faults (with reported_by_role CARHOP)"
    shared_operations:
      - "capture_payment; depart own runs; deliver orders on own runs; reads"
  - name: Customer
    description: "App user or stall guest"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers (self-registration)"
      - "app-checkin"
    shared_operations:
      - "intercom check-in, order build/place/cancel (DRAFT), authorize/capture payment, reads of own orders, menu, offers"
