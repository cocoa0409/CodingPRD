# =============================================================================
# §1.9 Scaffold Corner Design — Immersive Pop-Up Experience Operations
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml. The nine sections below are the
# nine sections of references/claim-extraction-guide.md and the claim_type values
# are that guide's per-section rows. Corners already asserted by an instance of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because stub instead of a
# test_recipe.
#
# Two setup chains recur. Both start from an empty database.
#
#   LIGHT CHAIN (no clearance, no lease): clock 2026-08-01T00:00:00Z -> POST
#   /venues (NYC, egress_width_cm 400 so egress_capacity is 197, requested
#   occupancy 180) -> permit-submissions -> permit-decisions ISSUED ->
#   POST /build-kits -> POST /license-agreements -> activate -> POST
#   /experience-runs (base_ticket_price_cents 35833, timed_slot_minutes 45,
#   max_group_size 12, 2026-08-10..2026-10-31). A run created this way is
#   PLANNED + UNCLEARED, which is enough for every rule that does not gate on
#   clearance: rooms, slots, slot release, order CREATION, staff, shifts,
#   inspections and royalty statements.
#
#   CLEARANCE CHAIN: the LIGHT CHAIN plus activate-lease, one themed room
#   (room_occupancy_cap 40, target_dwell_minutes 15 -> effective_capacity 120),
#   an APPROVED CREATIVE_EXECUTION submission, one CLEARED PERFORMER, AMBASSADOR
#   and TECHNICIAN, a released slot and POST /experience-runs/{runId}/open. Only
#   order confirmation, attendance, extensions and closure need it.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: venue_creation_returns_every_declared_field_with_the_derived_egress_capacity
        claim_type: creation
        grounds:
          - endpoints[POST /venues]
          - entities.PopupVenue.fields.egress_capacity
        distinguishing_aspect: |
          The create call is the only place egress_capacity is ever written, and it is written
          from a floor division the client cannot supply: floor(400 / 2.03) == 197, not 197.04
          and not 198. The response must also carry the six zeroed money and round counters and
          version 1, so a create that persists the row but returns a thin projection fails.
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
          trigger:
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", lease_extension_option_days: 30, base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, kit_reuse_credit_cents: 500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
          assert:
            - "the call responds 201 and data.id is a non-empty string"
            - "data.egress_capacity == 197 — floor(400 / 2.03) — while egress_width_cm reads back as 400"
            - "data.status == DRAFT, data.permit_submission_round == 0 and data.permitted_occupancy_load == 0"
            - "data.allowance_drawn_cents == 0, data.kit_credit_drawn_cents == 0, data.operator_capex_cents == 0 and data.buildout_spend_cents == 0"
            - "data.lease_extension_days_consumed == 0 and data.lease_extension_option_days == 30"
            - "data.permit_issued_at == null, data.lease_activated_at == null, data.permit_conditions_note == null and data.permit_denial_reason == null"
            - "data.version == 1 and data.created_at == data.updated_at"

      - name: venue_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /venues/{venueId}]
        distinguishing_aspect: |
          A read must be a pure read: the row returned by GET is field-for-field the row the
          create returned, and the read does not advance version or updated_at. An implementation
          that recomputes egress_capacity or touches updated_at on read fails here.
        test_recipe:
          setup:
            - "One DRAFT venue created by the LIGHT CHAIN's first call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: VenueOpsManager
          trigger:
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: SafetyOfficer
              as_user_id: "officer-1"
          assert:
            - "the call responds 200 with response_type == object"
            - "data.id == ${venue_id}, data.city_code == NYC, data.site_name == Pier 9 Shed and data.egress_capacity == 197"
            - "data.status == DRAFT and data.version == 1 — the read did not advance the version even though the clock moved"
            - "data.sprinklered == true and data.kit_reuse_credit_cents == 0 (its declared default)"

      - name: venue_listing_filters_by_city_and_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /venues]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three venues in two cities and two lifecycle states pin all four pagination fields plus
          filter composition. The subtle claim is that total_count is the count of rows matching
          the FILTER, not the count returned in this page: limit 1 over three venues must report
          total_count 3 with has_more true, and the last page must report has_more false.
        test_recipe:
          setup:
            - "Three venues: two NYC (one DRAFT, one PERMIT_UNDER_REVIEW) and one LAX DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_a: $.data.id }
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Canal Street Annex", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 3900000, buildout_allowance_cents: 900000, buildout_cap_cents: 2000000, requested_occupancy_load: 120, egress_width_cm: 300, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_b: $.data.id }
            - call: "POST /venues"
              payload: { city_code: "LAX", site_name: "Arts District Bay", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4100000, buildout_allowance_cents: 1000000, buildout_cap_cents: 2500000, requested_occupancy_load: 150, egress_width_cm: 350, sprinklered: false }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_c: $.data.id }
            - call: "POST /venues/${venue_b}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
          trigger:
            - call: "GET /venues"
              payload: { city_code: "NYC" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /venues"
              payload: { status: "DRAFT" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /venues"
              payload: { city_code: "NYC", status: "DRAFT" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /venues"
              payload: { limit: 1, offset: 0 }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /venues"
              payload: { limit: 1, offset: 2 }
              as: VenueOpsManager
              as_user_id: "vom-1"
          assert:
            - "city_code == NYC responds 200 with response_type == array, total_count == 2, has_more == false and exactly the ids {${venue_a}, ${venue_b}}"
            - "status == DRAFT responds with total_count == 2 and exactly the ids {${venue_a}, ${venue_c}} — ${venue_b} left DRAFT when its permit package was submitted"
            - "the composed filter city_code == NYC AND status == DRAFT responds with total_count == 1 and exactly the id ${venue_a}"
            - "limit 1 offset 0 responds with total_count == 3, exactly 1 element, limit 1, offset 0 and has_more == true"
            - "limit 1 offset 2 responds with total_count == 3, exactly 1 element, offset 2 and has_more == false"

      - name: every_path_identifier_returns_its_own_not_found_error
        claim_type: not_found
        grounds:
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_SLOT_NOT_FOUND]
          - errors[ERR_GUEST_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_SHIFT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_KIT_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - validations[priority 30]
        distinguishing_aspect: |
          Thirteen entity families, thirteen distinct 404 ids: the path-existence rule at priority
          30 must name the entity of the SEGMENT it failed to resolve, never a generic 404. Every
          call here is well-formed and authorised, so nothing but P30 can fire.
        test_recipe:
          setup:
            - "Empty database — no row of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
          trigger:
            - call: "GET /venues/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /license-agreements/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "GET /creative-submissions/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /experience-runs/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /themed-rooms/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /timed-entry-slots/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /guest-accounts/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /ticket-orders/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "GET /staff-members/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /staff-shifts/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /safety-inspections/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
              payload: {}
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "GET /build-kits/cccccccc-cccc-4ccc-8ccc-cccccccccccc"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "GET /royalty-statements/dddddddd-dddd-4ddd-8ddd-dddddddddddd"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
          assert:
            - "each of the thirteen calls responds 404 with response_type == error"
            - "the ids are, in trigger order: ERR_VENUE_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_GUEST_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_KIT_NOT_FOUND, ERR_STATEMENT_NOT_FOUND"
            - "every response carries meta.api_request_id and meta.api_request_timestamp, and data has exactly the keys error_id and message"
            - "GET /venues still reports total_count == 0 — no lazily created placeholder row was persisted by any lookup"

      - name: body_foreign_keys_are_rejected_after_the_path_identifier_resolves
        claim_type: parent_relationships
        grounds:
          - validations[priority 50]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_KIT_NOT_FOUND]
          - errors[ERR_SLOT_NOT_FOUND]
          - errors[ERR_GUEST_NOT_FOUND]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
        distinguishing_aspect: |
          The same 404 catalogue reached through the BODY rather than the path, one bogus id at a
          time with every other reference real, so no trigger can be satisfied by a lucky
          first-failure order. Two of the triggers also prove P50 runs BEFORE the state gates it
          would otherwise hide behind: the bogus staff_member_id is refused with
          ERR_STAFF_NOT_FOUND even though no member is CLEARED (P80), and the bogus
          clearing_inspection_id is refused with ERR_INSPECTION_NOT_FOUND even though the run is
          not SUSPENDED.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation, plus one themed room, one released slot, one ACTIVE guest and one CANDIDATE staff member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /timed-entry-slots"
              payload: { run_id: "${run_id}", slot_start_utc: "2026-09-05T14:00:00Z", slot_end_utc: "2026-09-05T14:45:00Z", pricing_tier: "STANDARD", base_capacity: 20, wheelchair_positions: 2 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { slot_id: $.data.id }
            - call: "POST /timed-entry-slots/${slot_id}/release"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /guest-accounts"
              payload: { email: "mira@example.com", display_name: "Mira Adeyemi", loyalty_tier: "VISITOR", accommodation_profile: [] }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
              captures: { guest_id: $.data.id }
            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ada Perez", staff_role: "PERFORMER", certifications: ["SCRIPTED_INTERACTION", "SENSORY_DEESCALATION"], incident_count: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { staff_id: $.data.id }
            - call: "GET /experience-runs/${run_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_v: $.data.version }
          trigger:
            - call: "POST /experience-runs"
              payload: { venue_id: "11111111-1111-4111-8111-111111111111", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Ghost venue", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "22222222-2222-4222-8222-222222222222", build_kit_id: "${kit_id}", run_name: "Ghost licence", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc", run_name: "Ghost kit", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45 }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /ticket-orders"
              payload: { slot_id: "66666666-6666-4666-8666-666666666666", guest_account_id: "${guest_id}", order_type: "SINGLE", party_size: 2 }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /ticket-orders"
              payload: { slot_id: "${slot_id}", guest_account_id: "77777777-7777-4777-8777-777777777777", order_type: "SINGLE", party_size: 2 }
              as: GuestServicesAgent
              as_user_id: "gsa-1"
            - call: "POST /staff-shifts"
              payload: { staff_member_id: "99999999-9999-4999-8999-999999999999", shift_start_utc: "2026-09-05T12:00:00Z", shift_end_utc: "2026-09-05T18:00:00Z", station: "FLOOR" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /staff-shifts"
              payload: { staff_member_id: "${staff_id}", themed_room_id: "55555555-5555-4555-8555-555555555555", shift_start_utc: "2026-09-05T12:00:00Z", shift_end_utc: "2026-09-05T18:00:00Z", station: "FLOOR" }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "POST /royalty-statements"
              payload: { run_id: "44444444-4444-4444-8444-444444444444", period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_run_version: "${run_v}" }
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs/${run_id}/lift-suspension"
              payload: { clearing_inspection_id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", note: "no such inspection" }
              as: SafetyOfficer
              as_user_id: "officer-2"
          assert:
            - "trigger 1 responds 404 ERR_VENUE_NOT_FOUND, trigger 2 responds 404 ERR_AGREEMENT_NOT_FOUND and trigger 3 responds 404 ERR_KIT_NOT_FOUND"
            - "trigger 3 did NOT deploy the real kit: BuildKit.${kit_id}.status is still DEPLOYED from the setup run and its version is unchanged"
            - "trigger 4 responds 404 ERR_SLOT_NOT_FOUND and trigger 5 responds 404 ERR_GUEST_NOT_FOUND"
            - "trigger 5 left TimedEntrySlot.${slot_id} untouched: held_capacity == 0, available_capacity == 20 and the version is unchanged"
            - "trigger 6 responds 404 ERR_STAFF_NOT_FOUND — not ERR_STAFF_NOT_CLEARED, because P50 precedes P80"
            - "trigger 7 responds 404 ERR_ROOM_NOT_FOUND even though the member named is only CANDIDATE, for the same reason"
            - "trigger 8 responds 404 ERR_RUN_NOT_FOUND and trigger 9 responds 404 ERR_INSPECTION_NOT_FOUND"
            - "GET /staff-shifts reports total_count == 0 and GET /royalty-statements reports total_count == 0 — no refused call persisted a row"

      - name: run_creation_missing_required_fields_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /experience-runs]
          - validations[priority 40]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          Every field of POST /experience-runs input except max_group_size has no default, so each
          omission must be refused at priority 40 with ERR_VALIDATION (422) — before the body
          foreign keys at 50 are even resolved. The same probe on POST /venues and POST
          /license-agreements shows the rule is not endpoint-local.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through licence activation: a PERMIT_ISSUED venue, a READY kit and an ACTIVE agreement, but no run yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
