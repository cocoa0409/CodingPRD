# =============================================================================
# PRD Benchmark Scaffold — Estate Sale & Senior Downsizing (task_0545)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  Estate Sale & Senior Downsizing (Caring Transitions style): home assessment &
  contract, inventory & lot pricing/research, staging & tag, sale-day POS &
  bidding/markdown schedule, consignment vs buyout, payout & commission,
  cleanout/donation/haul-away, settlement statement

domain_name: estate-sale
api_prefix: /estate

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by FK references; collections mounted flat under the
  # /estate API namespace (no deep parent nesting in the URL path). Sub-resource
  # GETs exist only for reverse-reachability discovery (bids, settlement-statements).

  state_machine_shape: cyclic
  # Project carries a PROPOSED<->COUNTERED contract-negotiation loop; Lot carries
  # a re-research/re-price loop back to RESEARCHED. Other machines are branching.

  relationship_patterns:
    - one_to_many        # Project -> Lot / SaleEvent / HaulJob / SettlementStatement
    - cross_aggregate    # SaleEvent -> Crew, HaulJob -> Truck, Transaction -> Lot+SaleEvent

  role_model: segregation_of_duties
  # The operator who researched/priced a lot (Appraiser X-User-ID) may not approve
  # its buyout (SaleManager) — a conflict-of-interest control keyed on X-User-ID.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Estate owner / senior client full name" }
      - { name: phone, type: string, source: input, description: "Primary contact phone" }
      - { name: email, type: string, source: input, description: "Contact email", default: null }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the estate owner this engagement serves" }
      - { name: address, type: string, source: input, description: "Estate property address" }
      - { name: estimated_total_value_cents, type: integer, source: input, description: "Manager's rough at-a-glance estate value from the home assessment", constraints: ">= 0" }
      - { name: minimum_commission_cents, type: integer, source: input, description: "Negotiated floor commission the company keeps regardless of tiered result", default: 50000, constraints: ">= 0" }
      - { name: assessment_notes, type: string, source: input, description: "Home-assessment write-up; set via PATCH on LEAD->ASSESSED", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle; transitions via PATCH/cancel/settlement", constraints: "LEAD | ASSESSED | PROPOSED | COUNTERED | CONTRACTED | SALE_SETUP | SALE_LIVE | SETTLING | SETTLED | CANCELLED" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Live sum of final_price_cents over RECORDED (non-voided) Transactions of this project (consignment + buyout resale)", default: 0 }
      - { name: buyout_advances_cents, type: integer, source: computed, description: "Sum of buyout_price_cents over lots whose handling_type flipped to BUYOUT via approve-buyout", default: 0 }
      - { name: unsold_lot_count, type: integer, source: computed, description: "Count of this project's lots in status UNSOLD", default: 0 }
      - { name: estimated_gross_consignment_cents, type: integer, source: computed, description: "Snapshot at CONTRACTED->SALE_SETUP: sum of list_price_cents over CONSIGNMENT lots then in {PRICED,STAGED,TAGGED,LISTED}", default: 0 }
      - { name: estimated_commission_cents, type: integer, source: computed, description: "Snapshot at CONTRACTED->SALE_SETUP: tiered commission over estimated_gross_consignment_cents", default: 0 }
      - { name: estimated_net_to_client_cents, type: integer, source: computed, description: "Snapshot forward-looking estimate = estimated_gross_consignment_cents - estimated_commission_cents (no card fees)", default: 0 }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the estate this lot belongs to" }
      - { name: title, type: string, source: input, description: "Item / lot description" }
      - { name: handling_type, type: enum, source: input, description: "CONSIGNMENT (default) or BUYOUT; BUYOUT is only reachable through approve-buyout", default: CONSIGNMENT, constraints: "CONSIGNMENT | BUYOUT" }
      - { name: is_bid_lot, type: boolean, source: input, description: "True = sold by silent-auction bidding; False = fixed-price with markdown schedule", default: false }
      - { name: bid_mode, type: enum, source: input, description: "Auction pricing rule for bid lots; required when is_bid_lot=true", default: null, constraints: "FIRST_PRICE | SECOND_PRICE" }
      - { name: list_price_cents, type: integer, source: input, description: "Tag/list price; set via PATCH on RESEARCHED->PRICED; drives fixed-price markdown and the estimate", default: null, constraints: ">= 0" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Floor below which the lot may not sell; set via PATCH", default: null, constraints: ">= 0" }
      - { name: min_increment_cents, type: integer, source: input, description: "Minimum bid raise over the current high bid; used by bid lots", default: null, constraints: ">= 0" }
      - { name: research_notes, type: string, source: input, description: "Comparable-sales research captured on NEW->RESEARCHED", default: null }
      - { name: researched_by_user_id, type: string, source: system, description: "X-User-ID of the Appraiser who ran NEW->RESEARCHED; used for the buyout segregation-of-duties check", default: null }
      - { name: approved_buyout_by_user_id, type: string, source: system, description: "X-User-ID of the SaleManager who approved buyout", default: null }
      - { name: buyout_price_cents, type: integer, source: system, description: "Cash advance paid to client at approve-buyout; null unless BUYOUT", default: null }
      - { name: winning_bid_id, type: string, source: computed, description: "Bid selected on BID_CLOSED resolution; null when no bids", default: null }
      - { name: winning_bid_price_cents, type: integer, source: computed, description: "Price the winner pays per bid_mode; null when no bids", default: null }
      - { name: final_price_cents, type: integer, source: computed, description: "Realized sale price stamped when the lot SELLS (fixed-price markdown, or winning bid)", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle; transitions via PATCH/transaction/cascade", constraints: "NEW | RESEARCHED | PRICED | STAGED | TAGGED | LISTED | BID_CLOSED | SOLD | UNSOLD | WITHDRAWN" }

  - name: SaleEvent
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the estate this sale runs for" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the staffing crew booked for the sale window" }
      - { name: start_at, type: datetime, source: input, description: "Sale window start (ISO 8601 UTC); day-0 anchor for the markdown schedule" }
      - { name: end_at, type: datetime, source: input, description: "Sale window end (ISO 8601 UTC), exclusive; crew booking is half-open [start_at, end_at)" }
      - { name: markdown_day1_pct, type: number, source: input, description: "Discount fraction applied on day index 1", default: 0.25, constraints: "0 <= x < 1" }
      - { name: markdown_day2_pct, type: number, source: input, description: "Discount fraction applied on day index 2", default: 0.50, constraints: "0 <= x < 1" }
      - { name: markdown_day3plus_pct, type: number, source: input, description: "Discount fraction applied on day index >= 3", default: 0.75, constraints: "0 <= x < 1" }
      - { name: window_minutes, type: integer, source: computed, description: "(end_at - start_at) in whole minutes; contributes to Crew.booked_minutes while active", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED (initial) | OPEN | CLOSED | CANCELLED", constraints: "SCHEDULED | OPEN | CLOSED | CANCELLED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Staffing crew name" }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of window_minutes over this crew's SaleEvents in status {SCHEDULED, OPEN}", default: 0 }

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id; the open sale day this POS sale rings up on" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot being sold" }
      - { name: payment_method, type: enum, source: input, description: "CASH | CARD; CARD sales accrue the 2.9% processing fee", constraints: "CASH | CARD" }
      - { name: buyer_name, type: string, source: input, description: "Buyer name for the receipt", default: null }
      - { name: final_price_cents, type: integer, source: computed, description: "Computed at ring-up: fixed-price markdown price, or the lot's winning_bid_price_cents for bid lots" }
      - { name: card_fee_cents, type: integer, source: computed, description: "round_half_up(final_price_cents * 0.029) when CARD, else 0", default: 0 }
      - { name: status, type: enum, source: system, description: "RECORDED (initial) | VOIDED", constraints: "RECORDED | VOIDED" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the bid lot being bid on" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount", constraints: ">= 0" }
      - { name: bidder_name, type: string, source: input, description: "Bidder identifier" }
      - { name: status, type: enum, source: system, description: "PLACED (initial) | WON | LOST | VOIDED", constraints: "PLACED | WON | LOST | VOIDED" }

  - name: HaulJob
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the estate being cleaned out" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; the truck booked for the pickup window" }
      - { name: disposition_type, type: enum, source: input, description: "DONATION | HAULAWAY | BUYBACK (items returned to client)", constraints: "DONATION | HAULAWAY | BUYBACK" }
      - { name: start_at, type: datetime, source: input, description: "Pickup window start (ISO 8601 UTC); truck booking is closed [start_at, end_at] plus a 60-min buffer each side" }
      - { name: end_at, type: datetime, source: input, description: "Pickup window end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED (initial) | COMPLETED | CANCELLED", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Haul-away truck identifier" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the estate being settled" }
      - { name: expected_project_version, type: integer, source: input, description: "OCC guard: the Project.version the caller last observed; see §1.2.1" }
      - { name: gross_consignment_cents, type: integer, source: computed, description: "Final: sum of final_price_cents over RECORDED Transactions whose Lot.handling_type == CONSIGNMENT" }
      - { name: commission_cents, type: integer, source: computed, description: "Final tiered commission over gross_consignment_cents, floored by minimum_commission_cents" }
      - { name: card_fees_cents, type: integer, source: computed, description: "Final: per-transaction round_half_up(final_price*0.029) summed over RECORDED CARD Transactions of CONSIGNMENT lots" }
      - { name: buyout_advances_cents, type: integer, source: computed, description: "Copy of Project.buyout_advances_cents at settlement time (informational; already paid to client)" }
      - { name: net_to_client_cents, type: integer, source: computed, description: "gross_consignment_cents - commission_cents - card_fees_cents" }
      - { name: unsold_lot_count, type: integer, source: computed, description: "Count of project lots in UNSOLD at settlement time" }
      - { name: superseded, type: boolean, source: system, description: "True once a newer SettlementStatement for the same project is created", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: LEAD
    terminal_states: [SETTLED, CANCELLED]
    note: "Cyclic: PROPOSED<->COUNTERED contract-negotiation loop."
    transitions:
      - from: LEAD
        to: ASSESSED
        trigger: "PATCH /estate/projects/{project_id} status=ASSESSED"
        actor: SaleManager
        preconditions: ["project not terminal"]
        side_effects: ["stores assessment_notes"]
      - from: ASSESSED
        to: PROPOSED
        trigger: "PATCH /estate/projects/{project_id} status=PROPOSED"
        actor: SaleManager
        preconditions: []
        side_effects: ["records proposed minimum_commission_cents if supplied"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "PATCH /estate/projects/{project_id} status=COUNTERED"
        actor: Client
        preconditions: ["acting Client (X-User-ID) equals Project.client_id"]
        side_effects: []
        note: "Client rejects current terms and counters — revision loop."
      - from: COUNTERED
        to: PROPOSED
        trigger: "PATCH /estate/projects/{project_id} status=PROPOSED"
        actor: SaleManager
        preconditions: []
        side_effects: ["may adjust minimum_commission_cents"]
        note: "Manager re-proposes; closes the negotiation cycle."
      - from: PROPOSED
        to: CONTRACTED
        trigger: "PATCH /estate/projects/{project_id} status=CONTRACTED"
        actor: Client
        preconditions: ["acting Client (X-User-ID) equals Project.client_id"]
        side_effects: ["contract is signed; lots may now be created"]
      - from: CONTRACTED
        to: SALE_SETUP
        trigger: "PATCH /estate/projects/{project_id} status=SALE_SETUP"
        actor: SaleManager
        preconditions: []
        side_effects:
          - "SNAPSHOT estimated_gross_consignment_cents = sum(list_price_cents of CONSIGNMENT lots in {PRICED,STAGED,TAGGED,LISTED})"
          - "SNAPSHOT estimated_commission_cents = tiered commission over that gross"
          - "SNAPSHOT estimated_net_to_client_cents = estimated_gross_consignment_cents - estimated_commission_cents"
      - from: SALE_SETUP
        to: SALE_LIVE
        trigger: "PATCH /estate/projects/{project_id} status=SALE_LIVE"
        actor: SaleManager
        preconditions: []
        side_effects: []
      - from: SALE_LIVE
        to: SETTLING
        trigger: "PATCH /estate/projects/{project_id} status=SETTLING"
        actor: SaleManager
        preconditions: []
        side_effects: []
      - from: SETTLING
        to: SETTLED
        trigger: "POST /estate/settlement-statements (project_id=this)"
        actor: SaleManager
        preconditions: ["expected_project_version matches Project.version (§1.2.1)"]
        side_effects:
          - "computes the final SettlementStatement (gross_consignment, commission, card_fees, net_to_client)"
          - "increments Project.version by 1"
      - from: [LEAD, ASSESSED, PROPOSED, COUNTERED, CONTRACTED, SALE_SETUP, SALE_LIVE, SETTLING]
        to: CANCELLED
        trigger: "POST /estate/projects/{project_id}/cancel"
        actor: SaleManager
        preconditions: ["project not terminal"]
        side_effects:
          - "CASCADE link 1: every non-terminal Lot of this project -> WITHDRAWN"
          - "CASCADE link 2: for each Lot just WITHDRAWN, its PLACED Bids -> VOIDED"
          - "CASCADE link 3: every SCHEDULED/OPEN SaleEvent of this project -> CANCELLED, releasing Crew.booked_minutes"

  - entity: Lot
    initial_state: NEW
    terminal_states: [SOLD, UNSOLD, WITHDRAWN]
    note: "Cyclic: any of {PRICED,STAGED,TAGGED,LISTED} may revert to RESEARCHED for re-research/re-pricing."
    transitions:
      - from: NEW
        to: RESEARCHED
        trigger: "PATCH /estate/lots/{lot_id} status=RESEARCHED"
        actor: Appraiser
        preconditions: ["Project.status in {CONTRACTED, SALE_SETUP, SALE_LIVE}"]
        side_effects: ["stores research_notes", "stamps researched_by_user_id = X-User-ID"]
      - from: RESEARCHED
        to: PRICED
        trigger: "PATCH /estate/lots/{lot_id} status=PRICED"
        actor: Appraiser
        preconditions: ["list_price_cents present (this call or prior)"]
        side_effects: ["recompute Project.estimated_* is NOT triggered here (estimate snapshots only at SALE_SETUP)"]
      - from: PRICED
        to: STAGED
        trigger: "PATCH /estate/lots/{lot_id} status=STAGED"
        actor: Appraiser
        preconditions: []
        side_effects: []
      - from: STAGED
        to: TAGGED
        trigger: "PATCH /estate/lots/{lot_id} status=TAGGED"
        actor: Appraiser
        preconditions: []
        side_effects: []
      - from: TAGGED
        to: LISTED
        trigger: "PATCH /estate/lots/{lot_id} status=LISTED"
        actor: Appraiser
        preconditions: ["Project.status in {SALE_SETUP, SALE_LIVE} (cross-entity gate)"]
        side_effects: []
      - from: [PRICED, STAGED, TAGGED, LISTED]
        to: RESEARCHED
        trigger: "PATCH /estate/lots/{lot_id} status=RESEARCHED"
        actor: Appraiser
        preconditions: ["lot not yet sold"]
        side_effects: ["re-open for research; re-price loop"]
      - from: LISTED
        to: SOLD
        trigger: "POST /estate/transactions (fixed-price lot)"
        actor: Cashier
        preconditions: ["is_bid_lot == false", "SaleEvent.status == OPEN", "markdown price >= reserve_price_cents"]
        side_effects: ["stamps final_price_cents = markdown price", "recompute Project.gross_sales_cents; increment Project.version by 1"]
      - from: LISTED
        to: BID_CLOSED
        trigger: "PATCH /estate/lots/{lot_id} status=BID_CLOSED (bid lot with >= 1 bid)"
        actor: Appraiser
        preconditions: ["is_bid_lot == true", "at least one PLACED Bid exists"]
        side_effects:
          - "resolve winner per bid_mode: winning_bid_id, winning_bid_price_cents"
          - "winning Bid -> WON; all other PLACED Bids -> LOST"
      - from: LISTED
        to: UNSOLD
        trigger: "PATCH /estate/lots/{lot_id} status=BID_CLOSED (bid lot with 0 bids)"
        actor: Appraiser
        preconditions: ["is_bid_lot == true", "no PLACED Bids"]
        side_effects: ["empty-set fallback: winning_bid_id = null; recompute Project.unsold_lot_count"]
      - from: BID_CLOSED
        to: SOLD
        trigger: "POST /estate/transactions (bid lot)"
        actor: Cashier
        preconditions: ["SaleEvent.status == OPEN", "winning_bid_id present"]
        side_effects: ["stamps final_price_cents = winning_bid_price_cents", "recompute Project.gross_sales_cents; increment Project.version by 1"]
      - from: LISTED
        to: UNSOLD
        trigger: "POST /estate/sale-events/{sale_event_id}/close (cascade)"
        actor: SaleManager
        preconditions: ["lot still LISTED at close"]
        side_effects: ["recompute Project.unsold_lot_count"]
      - from: [NEW, RESEARCHED, PRICED, STAGED, TAGGED, LISTED, BID_CLOSED]
        to: WITHDRAWN
        trigger: "POST /estate/projects/{project_id}/cancel (cascade)"
        actor: SaleManager
        preconditions: []
        side_effects: ["PLACED Bids on this lot -> VOIDED"]

  - entity: SaleEvent
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "PATCH /estate/sale-events/{sale_event_id} status=OPEN"
        actor: SaleManager
        preconditions: ["Project.status == SALE_LIVE (cross-entity gate)"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /estate/sale-events/{sale_event_id}/close"
        actor: SaleManager
        preconditions: []
        side_effects:
          - "CASCADE link 1: LISTED lots of this project -> UNSOLD"
          - "CASCADE link 2: recompute Project.unsold_lot_count; release this SaleEvent's window from Crew.booked_minutes"
      - from: [SCHEDULED, OPEN]
        to: CANCELLED
        trigger: "POST /estate/projects/{project_id}/cancel (cascade)"
        actor: SaleManager
        preconditions: []
        side_effects: ["release window_minutes from Crew.booked_minutes"]

  - entity: Transaction
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /estate/transactions/{transaction_id}/void"
        actor: SaleManager
        preconditions: ["transaction is RECORDED"]
        side_effects:
          - "COMPENSATION: the sold Lot returns to LISTED (fixed) or BID_CLOSED (bid); final_price_cents cleared"
          - "recompute Project.gross_sales_cents (decrement by final_price_cents); increment Project.version by 1"

  - entity: Bid
    initial_state: PLACED
    terminal_states: [WON, LOST, VOIDED]
    transitions:
      - from: PLACED
        to: WON
        trigger: "PATCH /estate/lots/{lot_id} status=BID_CLOSED (this bid selected)"
        actor: Appraiser
        preconditions: []
        side_effects: []
      - from: PLACED
        to: LOST
        trigger: "PATCH /estate/lots/{lot_id} status=BID_CLOSED (this bid not selected)"
        actor: Appraiser
        preconditions: []
        side_effects: []
      - from: PLACED
        to: VOIDED
        trigger: "POST /estate/projects/{project_id}/cancel (cascade via Lot -> WITHDRAWN)"
        actor: SaleManager
        preconditions: []
        side_effects: []

  - entity: HaulJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "PATCH /estate/haul-jobs/{haul_job_id} status=COMPLETED"
        actor: SaleManager
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /estate/haul-jobs/{haul_job_id} status=CANCELLED"
        actor: SaleManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /estate/settlement-statements"
    occ_field: "expected_project_version"
    description: |
      Creating a SettlementStatement snapshots the project's final financials and
      supersedes any prior statement. If the Project.version has advanced since the
      caller last observed it — because a Transaction was recorded or voided (each
      bumps Project.version through the gross_sales recompute) or a prior statement
      was created — the create is rejected as stale. The loser observed an
      out-of-date project and its snapshot would be wrong.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: markdown_price
    trigger: "POST /estate/transactions for a fixed-price (is_bid_lot=false) lot"
    algorithm: threshold
    formula: |
      day_index = max(0, floor((current_utc - SaleEvent.start_at) / 86400 seconds))
      discount_pct =
        0                            if day_index == 0
        markdown_day1_pct            if day_index == 1
        markdown_day2_pct            if day_index == 2
        markdown_day3plus_pct        if day_index >= 3
      final_price_cents = round_half_up(Lot.list_price_cents * (1 - discount_pct))
    input_set: "the transaction's Lot.list_price_cents and its SaleEvent markdown schedule; current_utc from the logical clock"
    constants: {}
    precision: "integer cents, round_half_up on the multiplication result"

  - name: winning_bid_price
    trigger: "PATCH /estate/lots/{lot_id} status=BID_CLOSED for a bid lot with >= 1 PLACED bid"
    algorithm: weighted_scoring
    formula: |
      candidates = PLACED Bids on the lot with amount_cents >= reserve_price_cents
      order candidates by amount_cents DESC, then created_at ASC (earliest wins ties)
      if candidates empty -> lot UNSOLD, winning_bid_id = null (see empty-set fallback)
      winner = candidates[0]; winning_bid_id = winner.id
      highest = winner.amount_cents
      second  = candidates[1].amount_cents if len(candidates) >= 2 else null
      variant FIRST_PRICE  : winning_bid_price_cents = highest
      variant SECOND_PRICE : winning_bid_price_cents = min(highest, (second + min_increment_cents)) if second != null
                                                       else max(reserve_price_cents, min... ) -> reserve_price_cents
    input_set: "PLACED bids on the lot at resolution; Lot.reserve_price_cents and Lot.min_increment_cents"
    constants: {}
    precision: "integer cents"
    variants:
      - name: FIRST_PRICE
        when: "Lot.bid_mode == FIRST_PRICE"
        difference: "winner pays their own high bid (highest)"
      - name: SECOND_PRICE
        when: "Lot.bid_mode == SECOND_PRICE"
        difference: "winner pays min(highest, second_highest + min_increment_cents); reserve_price_cents when only one qualifying bid"

  - name: commission_tiered
    trigger: "POST /estate/settlement-statements (final); and Project CONTRACTED->SALE_SETUP (estimate snapshot)"
    algorithm: tiered_pricing
    formula: |
      # marginal tiered rate over the consignment gross, then floored by the guarantee
      tier1 = min(gross_consignment_cents, TIER1_THRESHOLD_CENTS) * TIER1_RATE
      tier2 = max(gross_consignment_cents - TIER1_THRESHOLD_CENTS, 0) * TIER2_RATE
      tiered = round_half_up(tier1 + tier2)          # single rounding on the aggregate
      commission_cents = max(tiered, Project.minimum_commission_cents)
    input_set: "gross_consignment_cents (final: RECORDED consignment tx; estimate: list prices) and Project.minimum_commission_cents"
    constants:
      TIER1_THRESHOLD_CENTS: 500000
      TIER1_RATE: 0.40
      TIER2_RATE: 0.30
    precision: "integer cents, round_half_up on the summed tier amounts (aggregate rounding)"

  - name: card_processing_fee
    trigger: "POST /estate/settlement-statements (aggregates the fee over the sale)"
    algorithm: aggregation
    formula: |
      # ORDER IS PINNED: round each transaction's fee to the cent, THEN sum.
      # (round-then-sum, NOT sum-then-round — the two disagree at half-cent boundaries)
      for each RECORDED CARD Transaction t on a CONSIGNMENT lot:
        fee_t = round_half_up(t.final_price_cents * CARD_FEE_RATE)
      card_fees_cents = sum(fee_t)
    input_set: "RECORDED CARD Transactions whose Lot.handling_type == CONSIGNMENT"
    constants:
      CARD_FEE_RATE: 0.029
    precision: "integer cents; round_half_up PER TRANSACTION then integer-sum"

  - name: settlement_net_to_client
    trigger: "POST /estate/settlement-statements (final); Project CONTRACTED->SALE_SETUP (estimated variant snapshot)"
    algorithm: forward_looking
    formula: |
      net_to_client_cents = gross_consignment_cents - commission_cents - card_fees_cents
    input_set: "consignment proceeds, commission, and card fees for the chosen variant"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimated
        when: "computed forward-looking at CONTRACTED->SALE_SETUP"
        difference: "gross = sum of list_price_cents over CONSIGNMENT lots in {PRICED,STAGED,TAGGED,LISTED}; card_fees_cents treated as 0 (no realized card transactions yet)"
      - name: final
        when: "computed at settlement create, post-sale"
        difference: "gross = sum of final_price_cents over RECORDED CONSIGNMENT Transactions; card_fees_cents = realized per-transaction card fee"

  - name: project_gross_sales
    trigger: "POST /estate/transactions; POST /estate/transactions/{id}/void"
    algorithm: aggregation
    formula: |
      Project.gross_sales_cents = sum(final_price_cents for Transactions of this project with status == RECORDED)
    input_set: "RECORDED (non-voided) Transactions of the project, both consignment and buyout resale"
    constants: {}
    precision: "integer cents; recompute-on-write, and increment Project.version by 1 on each write"

  - name: crew_booked_minutes
    trigger: "POST /estate/sale-events; SaleEvent -> CANCELLED (project cancel); SaleEvent -> CLOSED"
    algorithm: aggregation
    formula: |
      Crew.booked_minutes = sum(window_minutes for that crew's SaleEvents in status {SCHEDULED, OPEN})
      window_minutes = floor((end_at - start_at) / 60 seconds)
    input_set: "the crew's SaleEvents currently in {SCHEDULED, OPEN}"
    constants: {}
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint (per §1.7); for Client-actor Project transitions, X-User-ID must equal Project.client_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, numeric fields >= 0, bid lots supply bid_mode"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"

  - priority: 4
    category: existence
    check: "path id and referenced FKs (client_id, project_id, lot_id, sale_event_id, crew_id, truck_id) resolve; validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_project_version equals current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /estate/settlement-statements"

  - priority: 6
    category: state
    check: "target resource is in a valid state for the requested transition (project not terminal; lot sellable; sale OPEN; lot LISTED gate; bid-lot ops on bid lots)"
    error_id: "ERR_INVALID_STATE | ERR_PROJECT_TERMINAL | ERR_LOT_NOT_SELLABLE | ERR_SALE_NOT_OPEN | ERR_PROJECT_NOT_IN_SALE | ERR_NOT_BID_LOT"
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 7
    category: business_safety
    check: "segregation of duties: approve-buyout X-User-ID must not equal Lot.researched_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /estate/lots/{lot_id}/approve-buyout"

  - priority: 8
    category: business_temporal
    check: "resource temporal availability: crew half-open window overlap; truck closed-window overlap within 60-min buffer"
    error_id: "ERR_CREW_DOUBLE_BOOKED | ERR_TRUCK_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /estate/sale-events, POST /estate/haul-jobs"

  - priority: 9
    category: business_constraint
    check: "sale window length <= SALE_WINDOW_MAX_DAYS; bid amount >= reserve and >= current_high + min_increment"
    error_id: "ERR_SALE_WINDOW_TOO_LONG | ERR_BID_TOO_LOW"
    http_status: 422
    applies_to: "POST /estate/sale-events, POST /estate/bids"

  - priority: 10
    category: business_fiscal
    check: "a fixed-price lot may not sell below its reserve_price_cents (markdown price >= reserve)"
    error_id: ERR_BELOW_RESERVE
    http_status: 422
    applies_to: "POST /estate/transactions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (used until first set; never falls back to wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets current_utc used by markdown day_index and temporal-overlap checks"]

  # --- Client ---
  - method: POST
    path: "/estate/clients"
    description: "Register an estate-owner client"
    roles: [PlatformAdmin]
    code: 201
    input: [name, phone, "email?"]
    output: Client
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/estate/projects"
    description: "Open a project (home-assessment lead)"
    roles: [PlatformAdmin]
    code: 201
    input: [client_id, address, estimated_total_value_cents, "minimum_commission_cents?"]
    output: Project
    side_effects: ["status=LEAD; all computed counters 0"]
  - method: GET
    path: "/estate/projects/{project_id}"
    description: "Get a project"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/estate/projects"
    description: "List/filter projects"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: PATCH
    path: "/estate/projects/{project_id}"
    description: "Advance project lifecycle / contract negotiation / assessment"
    roles: [SaleManager, Client]
    code: 200
    input: ["status?", "assessment_notes?", "minimum_commission_cents?", "address?"]
    output: Project
    side_effects: ["state transition per §1.2 (incl. estimate snapshot on CONTRACTED->SALE_SETUP)"]
  - method: POST
    path: "/estate/projects/{project_id}/cancel"
    description: "Cancel a project (cascades to lots, bids, sale-events)"
    roles: [SaleManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "Project -> CANCELLED"
      - "non-terminal Lots -> WITHDRAWN -> their PLACED Bids -> VOIDED"
      - "SCHEDULED/OPEN SaleEvents -> CANCELLED, releasing Crew.booked_minutes"
  - method: GET
    path: "/estate/projects/{id}/settlement-statements"
    description: "List settlement statements for a project (reverse-reachability for SettlementStatement.project_id)"
    roles: [PlatformAdmin, SaleManager, Client]
    code: 200
    input: []
    output: SettlementStatement[]
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/estate/lots"
    description: "Add a lot to a contracted project"
    roles: [Appraiser]
    code: 201
    input: [project_id, title, "handling_type?", "is_bid_lot?", "bid_mode?", "list_price_cents?", "reserve_price_cents?", "min_increment_cents?"]
    output: Lot
    side_effects: ["status=NEW"]
  - method: GET
    path: "/estate/lots/{lot_id}"
    description: "Get a lot"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/estate/lots"
    description: "List/filter lots"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: ["project_id?", "status?", "handling_type?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: PATCH
    path: "/estate/lots/{lot_id}"
    description: "Research / price / stage / tag / list / re-research / close bidding on a lot"
    roles: [Appraiser]
    code: 200
    input: ["status?", "list_price_cents?", "reserve_price_cents?", "min_increment_cents?", "research_notes?", "bid_mode?"]
    output: Lot
    side_effects: ["state transition per §1.2; BID_CLOSED resolves winning_bid_price"]
  - method: POST
    path: "/estate/lots/{lot_id}/approve-buyout"
    description: "Convert a consignment lot to a buyout (company pays client a cash advance)"
    roles: [SaleManager]
    code: 200
    input: [buyout_price_cents]
    output: Lot
    side_effects:
      - "SoD check: X-User-ID must differ from Lot.researched_by_user_id"
      - "handling_type=BUYOUT; buyout_price_cents stamped; approved_buyout_by_user_id=X-User-ID"
      - "Project.buyout_advances_cents += buyout_price_cents; increment Project.version by 1"
  - method: GET
    path: "/estate/lots/{id}/bids"
    description: "List bids on a lot (reverse-reachability for Bid.lot_id)"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier]
    code: 200
    input: []
    output: Bid[]
    side_effects: []

  # --- SaleEvent ---
  - method: POST
    path: "/estate/sale-events"
    description: "Schedule a sale event and book a crew for its window"
    roles: [SaleManager]
    code: 201
    input: [project_id, crew_id, start_at, end_at, "markdown_day1_pct?", "markdown_day2_pct?", "markdown_day3plus_pct?"]
    output: SaleEvent
    side_effects:
      - "temporal check: crew half-open [start_at,end_at) must not overlap the crew's other SCHEDULED/OPEN events"
      - "constraint check: window length <= SALE_WINDOW_MAX_DAYS (4)"
      - "status=SCHEDULED; window_minutes computed; recompute Crew.booked_minutes"
  - method: GET
    path: "/estate/sale-events/{sale_event_id}"
    description: "Get a sale event"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: []
    output: SaleEvent
    side_effects: []
  - method: GET
    path: "/estate/sale-events"
    description: "List/filter sale events"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier, Client]
    code: 200
    input: ["project_id?", "crew_id?", "limit?", "offset?"]
    output: SaleEvent[]
    side_effects: []
  - method: PATCH
    path: "/estate/sale-events/{sale_event_id}"
    description: "Open a scheduled sale event"
    roles: [SaleManager]
    code: 200
    input: [status]
    output: SaleEvent
    side_effects: ["SCHEDULED->OPEN; requires Project.status == SALE_LIVE"]
  - method: POST
    path: "/estate/sale-events/{sale_event_id}/close"
    description: "Close a sale event (cascades unsold lots)"
    roles: [SaleManager]
    code: 200
    input: []
    output: SaleEvent
    side_effects:
      - "OPEN->CLOSED"
      - "LISTED lots of the project -> UNSOLD; recompute Project.unsold_lot_count"
      - "release this event's window_minutes from Crew.booked_minutes"

  # --- Crew ---
  - method: POST
    path: "/estate/crews"
    description: "Register a staffing crew"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Crew
    side_effects: ["booked_minutes=0"]
  - method: GET
    path: "/estate/crews/{crew_id}"
    description: "Get a crew (exposes booked_minutes)"
    roles: [PlatformAdmin, SaleManager, Appraiser, Cashier]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- Transaction (POS) ---
  - method: POST
    path: "/estate/transactions"
    description: "Ring up a sale on an open sale day"
    roles: [Cashier]
    code: 201
    input: [sale_event_id, lot_id, payment_method, "buyer_name?"]
    output: Transaction
    side_effects:
      - "computes final_price_cents (markdown for fixed, winning_bid_price for bid) and card_fee_cents"
      - "Lot -> SOLD; recompute Project.gross_sales_cents; increment Project.version by 1"
  - method: GET
    path: "/estate/transactions/{transaction_id}"
    description: "Get a transaction"
    roles: [PlatformAdmin, SaleManager, Cashier]
    code: 200
    input: []
    output: Transaction
    side_effects: []
  - method: GET
    path: "/estate/transactions"
    description: "List/filter transactions"
    roles: [PlatformAdmin, SaleManager, Cashier]
    code: 200
    input: ["sale_event_id?", "lot_id?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []
  - method: POST
    path: "/estate/transactions/{transaction_id}/void"
    description: "Void a POS sale (compensating reversal)"
    roles: [SaleManager]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "status RECORDED->VOIDED; Lot reverts to LISTED (fixed) / BID_CLOSED (bid); final_price_cents cleared"
      - "recompute Project.gross_sales_cents (decrement); increment Project.version by 1"

  # --- Bid ---
  - method: POST
    path: "/estate/bids"
    description: "Place a silent-auction bid on a listed bid lot"
    roles: [Cashier]
    code: 201
    input: [lot_id, amount_cents, bidder_name]
    output: Bid
    side_effects:
      - "constraint check: amount_cents >= reserve_price_cents and >= (current high bid + min_increment_cents)"
      - "status=PLACED"

  # --- HaulJob ---
  - method: POST
    path: "/estate/haul-jobs"
    description: "Schedule a cleanout / donation / haul-away pickup and book a truck"
    roles: [SaleManager]
    code: 201
    input: [project_id, truck_id, disposition_type, start_at, end_at]
    output: HaulJob
    side_effects:
      - "temporal check: truck closed window [start_at,end_at] must keep a 60-min buffer from the truck's other SCHEDULED jobs"
      - "status=SCHEDULED"
  - method: GET
    path: "/estate/haul-jobs/{haul_job_id}"
    description: "Get a haul job"
    roles: [PlatformAdmin, SaleManager, Client]
    code: 200
    input: []
    output: HaulJob
    side_effects: []
  - method: GET
    path: "/estate/haul-jobs"
    description: "List/filter haul jobs"
    roles: [PlatformAdmin, SaleManager, Client]
    code: 200
    input: ["project_id?", "truck_id?", "limit?", "offset?"]
    output: HaulJob[]
    side_effects: []
  - method: PATCH
    path: "/estate/haul-jobs/{haul_job_id}"
    description: "Complete or cancel a haul job"
    roles: [SaleManager]
    code: 200
    input: [status]
    output: HaulJob
    side_effects: ["SCHEDULED->COMPLETED or SCHEDULED->CANCELLED"]

  # --- Truck ---
  - method: POST
    path: "/estate/trucks"
    description: "Register a haul-away truck"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Truck
    side_effects: []

  # --- SettlementStatement ---
  - method: POST
    path: "/estate/settlement-statements"
    description: "Finalize the payout: compute the settlement statement and settle the project"
    roles: [SaleManager]
    code: 201
    input: [project_id, expected_project_version]
    output: SettlementStatement
    side_effects:
      - "OCC: reject if expected_project_version != Project.version (ERR_STALE_PROJECT_VERSION, 412)"
      - "computes gross_consignment_cents, commission_cents, card_fees_cents, buyout_advances_cents, net_to_client_cents, unsold_lot_count"
      - "any prior SettlementStatement for the project -> superseded=true"
      - "Project SETTLING->SETTLED; increment Project.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or Client X-User-ID != Project.client_id on a client-actor transition" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative amount, or bid lot missing bid_mode" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "client_id does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project_id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot_id does not resolve" }
  - { id: ERR_SALE_EVENT_NOT_FOUND, http: 404, condition: "sale_event_id does not resolve" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew_id does not resolve" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "truck_id does not resolve" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "transaction_id does not resolve" }
  - { id: ERR_HAUL_JOB_NOT_FOUND, http: 404, condition: "haul_job_id does not resolve" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on settlement create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_PROJECT_TERMINAL, http: 409, condition: "Mutation attempted on a SETTLED or CANCELLED project" }
  - { id: ERR_LOT_NOT_SELLABLE, http: 409, condition: "Transaction on a lot not in a sellable state (fixed lot not LISTED, or bid lot not BID_CLOSED)" }
  - { id: ERR_SALE_NOT_OPEN, http: 409, condition: "Transaction attempted while its SaleEvent is not OPEN" }
  - { id: ERR_PROJECT_NOT_IN_SALE, http: 409, condition: "Lot LISTED transition while Project not in {SALE_SETUP, SALE_LIVE}" }
  - { id: ERR_NOT_BID_LOT, http: 409, condition: "Bid or BID_CLOSED operation targeting a non-bid lot" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approve-buyout X-User-ID equals the lot's researched_by_user_id" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "SaleEvent window overlaps another SCHEDULED/OPEN event on the same crew (half-open)" }
  - { id: ERR_TRUCK_UNAVAILABLE, http: 409, condition: "HaulJob window is within the 60-min buffer of another SCHEDULED job on the same truck" }
  - { id: ERR_SALE_WINDOW_TOO_LONG, http: 422, condition: "SaleEvent window length exceeds SALE_WINDOW_MAX_DAYS (4)" }
  - { id: ERR_BID_TOO_LOW, http: 422, condition: "Bid below reserve_price_cents or below current high bid + min_increment_cents" }
  - { id: ERR_BELOW_RESERVE, http: 422, condition: "Fixed-price markdown price would fall below the lot's reserve_price_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational admin: registers clients, projects, crews, trucks; controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /estate/clients"
      - "POST /estate/projects"
      - "POST /estate/crews"
      - "POST /estate/trucks"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"

  - name: SaleManager
    description: "Runs the engagement: advances project lifecycle, proposes terms, approves buyouts, schedules and closes sales, schedules haul jobs, voids sales, finalizes settlement."
    identity: opaque
    exclusive_operations:
      - "PATCH /estate/projects/{project_id} (manager transitions: ASSESSED, PROPOSED, SALE_SETUP, SALE_LIVE, SETTLING)"
      - "POST /estate/projects/{project_id}/cancel"
      - "POST /estate/lots/{lot_id}/approve-buyout"
      - "POST /estate/sale-events"
      - "PATCH /estate/sale-events/{sale_event_id}"
      - "POST /estate/sale-events/{sale_event_id}/close"
      - "POST /estate/haul-jobs"
      - "PATCH /estate/haul-jobs/{haul_job_id}"
      - "POST /estate/transactions/{transaction_id}/void"
      - "POST /estate/settlement-statements"
    shared_operations:
      - "PATCH /estate/projects/{project_id} (shared with Client for negotiation)"
      - "GET (all read endpoints)"

  - name: Appraiser
    description: "Inventory specialist: creates lots and runs research/pricing/staging/tagging/listing and bid resolution."
    identity: opaque
    exclusive_operations:
      - "POST /estate/lots"
      - "PATCH /estate/lots/{lot_id}"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Cashier
    description: "Sale-day POS: rings up sales and records silent-auction bids."
    identity: opaque
    exclusive_operations:
      - "POST /estate/transactions"
      - "POST /estate/bids"
    shared_operations:
      - "GET (transaction/lot/sale read endpoints)"

  - name: Client
    description: "Estate owner. Counters and signs the contract on their own project; views their project, lots, sale, settlement."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "PATCH /estate/projects/{project_id} (client transitions: COUNTERED, CONTRACTED — only on own project where X-User-ID == Project.client_id)"
    shared_operations:
      - "GET (own project read endpoints)"
