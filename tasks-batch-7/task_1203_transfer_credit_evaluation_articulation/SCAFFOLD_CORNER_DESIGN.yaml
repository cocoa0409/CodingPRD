scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: partner_creation_returns_201_with_server_fields
        claim_type: creation
        grounds:
          - "entities.PartnerInstitution"
          - "endpoints[POST /api/partner-institutions]"
        distinguishing_aspect: "POST with all required fields returns 201 and the response carries server-minted id, created_at stamped from the logical clock default 2026-05-01T00:00:00Z, and version == 1."
        test_recipe:
          setup: ["empty database; logical clock at its fixed default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Plain College", institution_code: "PL", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id", p_ver: "$.data.version", p_created: "$.data.created_at" } }
          trigger:
            - { call: "GET /api/partner-institutions/${p_id}", as: RegistrarAdmin, captures: { p_name: "$.data.name" } }
          assert:
            - "create returned 201; PartnerInstitution.${p_id}.version == 1"
            - "PartnerInstitution.${p_id}.created_at == 2026-05-01T00:00:00Z (logical clock default, not wall clock)"
            - "GET round-trip: name == Plain College and credit_system == SEMESTER"

      - name: internal_course_missing_course_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.InternalCourse.fields.course_code"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=3]"
        distinguishing_aspect: "Omitting the required input field course_code is rejected with ERR_INVALID_REQUEST (400) before any existence or state check runs."
        test_recipe:
          setup: ["one valid course exists as a baseline"]
          setup_api_calls:
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/internal-courses", payload: { title: "No Code", credit_hours: 3.0, level: "LOWER", department: "ENGL" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: student_create_extra_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.TransferStudent"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Client-supplied id/version on create are ignored: the server mints its own UUID id and version starts at 1 regardless of the injected values."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/students", payload: { full_name: "Inject Ivy", email: "ivy@x.edu", declared_major: "MATH", catalog_year: 2026, id: "00000000-0000-0000-0000-000000000000", version: 99 }, as: RegistrarAdmin, captures: { s_id: "$.data.id", s_ver: "$.data.version" } }
          trigger:
            - { call: "GET /api/students/${s_id}", as: RegistrarAdmin }
          assert:
            - "created student id != 00000000-0000-0000-0000-000000000000 (server-minted)"
            - "TransferStudent.${s_id}.version == 1 (injected 99 ignored)"

      - name: get_partner_institution_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["one partner exists (proves the collection is non-empty)"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Plain College", institution_code: "PL", credit_system: "SEMESTER" }, as: RegistrarAdmin }
          trigger:
            - { call: "GET /api/partner-institutions/00000000-0000-0000-0000-000000000000", as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: list_partner_institutions_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /api/partner-institutions]"
        distinguishing_aspect: "List endpoint honors the fixed envelope: with 3 rows and no params, default limit 10 applies, total_count == 3, has_more == false."
        test_recipe:
          setup: ["three partner institutions exist"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Alpha College", institution_code: "AL", credit_system: "SEMESTER" }, as: RegistrarAdmin }
            - { call: "POST /api/partner-institutions", payload: { name: "Beta College", institution_code: "BE", credit_system: "QUARTER" }, as: RegistrarAdmin }
            - { call: "POST /api/partner-institutions", payload: { name: "Gamma College", institution_code: "GA", credit_system: "SEMESTER" }, as: RegistrarAdmin }
          trigger:
            - { call: "GET /api/partner-institutions", as: TransferEvaluator }
          assert:
            - "response envelope: response_type == array, total_count == 3, has_more == false, limit == 10, offset == 0"
            - "filter check: GET with payload {credit_system: QUARTER} returns exactly the 1 QUARTER partner"

      - name: student_computed_totals_default_zero
        claim_type: computed_fields
        grounds:
          - "entities.TransferStudent.fields.total_posted_transfer_credits"
          - "entities.TransferStudent.fields.total_posted_pla_credits"
        distinguishing_aspect: "Computed credit totals initialize to 0 on create and are not settable from input."
        test_recipe:
          setup: ["one student created"]
          setup_api_calls:
            - { call: "POST /api/students", payload: { full_name: "Zero Zoe", email: "zoe@x.edu", declared_major: "HIST", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/students/${s_id}", as: RegistrarAdmin, captures: { t_transfer: "$.data.total_posted_transfer_credits", t_pla: "$.data.total_posted_pla_credits" } }
          assert:
            - "total_posted_transfer_credits == 0 and total_posted_pla_credits == 0"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: transcript_initial_state_received
        claim_type: initial_state
        grounds:
          - "state_machines.Transcript"
        distinguishing_aspect: "A newly created transcript starts in RECEIVED with courses preserved verbatim."
        test_recipe:
          setup: ["partner and student exist"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Init College", institution_code: "IN", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Init Ivan", email: "ivan@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id", t_st: "$.data.status" } }
          assert:
            - "Transcript.${t_id}.status == RECEIVED"
            - "courses array stored with the single entry M-101 / 4.0 / A"

      - name: transcript_second_verify_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Transcript.RECEIVED_to_VERIFIED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Repeating the same trigger (verify) after it succeeded is rejected: the second verify finds status VERIFIED, not RECEIVED, and fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["transcript exists in RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Init College", institution_code: "IN", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Ida Emp", email: "ida@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "first verify succeeds (200, status VERIFIED)"
            - "second verify: error_id == ERR_INVALID_STATE (409)"

      - name: terminal_state_lockdown_transcript_rejected_cannot_verify
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Transcript"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REJECTED is terminal: a verify attempt on a REJECTED transcript fails with ERR_INVALID_STATE and status stays REJECTED."
        test_recipe:
          setup: ["transcript exists in RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Init College", institution_code: "IN", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Term Tina", email: "tina@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/reject", payload: { reason: "Illegible scan" }, as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; Transcript.${t_id}.status remains REJECTED with rejection_reason == Illegible scan"

      - name: evaluation_finalize_with_unresolved_lines_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.TransferCreditEvaluation.IN_REVIEW_to_EVALUATED"
          - "errors[ERR_UNRESOLVED_LINE_ITEMS]"
          - "validations[priority=16]"
        distinguishing_aspect: "Finalize while a line is still AUTO_MATCHED (not yet ADOPTED/DENIED) fails with ERR_UNRESOLVED_LINE_ITEMS; the evaluation stays IN_REVIEW."
        test_recipe:
          setup: ["SEMESTER partner, C1 (MATH, 4.0), ACTIVE agreement with equivalency M-101; student; evaluation IN_REVIEW with its single line AUTO_MATCHED (never adopted)"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Unres Uma", email: "uma@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNRESOLVED_LINE_ITEMS (409)"
            - "TransferCreditEvaluation.${ev_id}.status remains IN_REVIEW"

      - name: petition_repetition_loop_allowed_after_denial
        claim_type: valid_transition
        grounds:
          - "state_machines.Petition.UNDER_REVIEW_to_DENIED"
          - "state_machines.EvaluationLineItem"
          - "validations[priority=21]"
        distinguishing_aspect: "Cyclic re-petition loop: after a petition is DENIED the line stays PETITION_REQUIRED and a NEW petition on the same line is accepted (the one-open-petition rule counts only SUBMITTED/UNDER_REVIEW)."
        test_recipe:
          setup: ["evaluation IN_REVIEW with PETITION_REQUIRED line (no equivalency for ART-210); first petition adjudicated DENIED by fac-1"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Art College", institution_code: "AC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ART-200", title: "Sculpture I", credit_hours: 4.0, level: "LOWER", department: "ART", gened_tags: [] }, as: RegistrarAdmin, captures: { c_art: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Loop Leo", email: "leo@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "ART-210", title: "Sculpture", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c_art}", syllabus_ref: "s3://syllabi/v1.pdf" }, as: Student, as_user_id: "${s_id}", captures: { pet1: "$.data.id" } }
            - { call: "POST /api/petitions/${pet1}/start-review", as: FacultyAdjudicator, as_user_id: "fac-1" }
            - { call: "POST /api/petitions/${pet1}/adjudicate", payload: { decision: "DENIED", adjudication_note: "Syllabus insufficient for direct equivalency" }, as: FacultyAdjudicator, as_user_id: "fac-1" }
          trigger:
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c_art}", syllabus_ref: "s3://syllabi/v2.pdf" }, as: Student, as_user_id: "${s_id}", captures: { pet2: "$.data.id", pet2_st: "$.data.status" } }
          assert:
            - "second petition created (201): Petition.${pet2}.status == SUBMITTED — the DENIED first petition does not block the re-petition loop"
            - "EvaluationLineItem.${l1}.status remains PETITION_REQUIRED"

      - name: guide_publish_supersedes_previous_published
        claim_type: side_effect_execution
        grounds:
          - "state_machines.TransferGuide.DRAFT_to_PUBLISHED"
          - "state_machines.TransferGuide.PUBLISHED_to_ARCHIVED"
        distinguishing_aspect: "Publishing a second guide for the same (partner, catalog_year) archives the first: exactly one PUBLISHED guide per partner+year at any time."
        test_recipe:
          setup: ["partner with ACTIVE agreement; two DRAFT guides G1 and G2 for catalog_year 2026"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Guide College", institution_code: "GC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "POST /api/transfer-guides", payload: { partner_institution_id: "${p_id}", catalog_year: 2026 }, as: RegistrarAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /api/transfer-guides", payload: { partner_institution_id: "${p_id}", catalog_year: 2026 }, as: RegistrarAdmin, captures: { g2: "$.data.id" } }
            - { call: "POST /api/transfer-guides/${g1}/publish", as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/transfer-guides/${g2}/publish", as: RegistrarAdmin }
            - { call: "GET /api/transfer-guides/${g1}", as: RegistrarAdmin, captures: { g1_st: "$.data.status" } }
            - { call: "GET /api/transfer-guides/${g2}", as: RegistrarAdmin, captures: { g2_st: "$.data.status", g2_pin: "$.data.pinned_agreement_id" } }
          assert:
            - "TransferGuide.${g1}.status == ARCHIVED (superseded)"
            - "TransferGuide.${g2}.status == PUBLISHED with pinned_agreement_id == ${ag_id}"

      - name: agreement_reactivate_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ArticulationAgreement.SUSPENDED_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "reactivate is only defined from SUSPENDED; invoking it on an ACTIVE agreement fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["agreement ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State College", institution_code: "ST", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/reactivate", as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; ArticulationAgreement.${ag_id}.status remains ACTIVE"

  # ==================================================================
  # Section: calculations
  # ==================================================================
  - section: calculations
    instances:
      - name: transfer_gpa_per_line_rounding_precision
        claim_type: correct_result
        grounds:
          - "calculations.transfer_gpa"
        distinguishing_aspect: "Pinned rounding order: per-line quality points rounded to 2dp first (3.3*2.5 = 8.25; 2.7*1.5 = 4.05), summed (12.30), then divided by total awarded credits (4.0) with a 3dp final rounding -> 3.075."
        test_recipe:
          setup:
            - "SEMESTER partner; CA (HIST, cap 2.5) and CB (HIST, cap 1.5); ACTIVE agreement with equivalencies A-101->CA (2.5h) and B-101->CB (1.5h)"
            - "Student (major MATH so both lines land in FREE_ELECTIVE, need 24.0 — no truncation); evaluation POSTED with lines A-101 grade B+ and B-101 grade B-"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "GPA College", institution_code: "GP", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "HIST-210", title: "History A", credit_hours: 2.5, level: "LOWER", department: "HIST", gened_tags: [] }, as: RegistrarAdmin, captures: { ca: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "HIST-211", title: "History B", credit_hours: 1.5, level: "LOWER", department: "HIST", gened_tags: [] }, as: RegistrarAdmin, captures: { cb: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${ca}", external_course_code: "A-101", external_title: "HA", external_credit_hours: 2.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${cb}", external_course_code: "B-101", external_title: "HB", external_credit_hours: 1.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Gpa Gary", email: "gary@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "A-101", title: "HA", credit_hours: 2.5, grade: "B+" }, { external_course_code: "B-101", title: "HB", credit_hours: 1.5, grade: "B-" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { la: "$.data[0].id", lb: "$.data[1].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${la}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${lb}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
          trigger:
            - { call: "GET /api/students/${s_id}/degree-progress", payload: { variant: "CERTIFIED" }, as: TransferEvaluator, captures: { gpa: "$.data.transfer_gpa", tot: "$.data.total_applied_credits" } }
          assert:
            - "transfer_gpa == 3.075 ((8.25 + 4.05) / 4.0 with the pinned per-line-first rounding)"
            - "total_applied_credits == 4.0 (2.5 + 1.5, both FREE_ELECTIVE)"

      - name: selector_prefers_major_specific_agreement
        claim_type: input_set_filtering
        grounds:
          - "calculations.equivalency_selection"
          - "entities.EvaluationLineItem.fields.equivalency_id"
        distinguishing_aspect: "Two eligible equivalencies for the same external course (one under a scope-ALL agreement, one under a scope-MATH agreement): the selector's first ranking key — scope specificity — picks the MATH-scoped equivalency for a MATH-major student."
        test_recipe:
          setup:
            - "SEMESTER partner; C1 (MATH, 4.0); agreement A_ALL (scope ALL) ACTIVE with EQ_ALL (M-101); agreement A_MAJ (scope MATH) ACTIVE with EQ_MAJ (M-101); different program_scopes so the half-open window overlap check does not fire"
            - "Student declared_major MATH; VERIFIED transcript with M-101 grade A, term 2025-06-15 (covered by both equivalency windows)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Select College", institution_code: "SE", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { a_all: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${a_all}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${a_all}", as: RegistrarAdmin, captures: { v_all: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${a_all}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc ALL", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${v_all}" }, as: RegistrarAdmin, captures: { eq_all: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "MATH", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { a_maj: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${a_maj}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${a_maj}", as: RegistrarAdmin, captures: { v_maj: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${a_maj}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc MATH", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${v_maj}" }, as: RegistrarAdmin, captures: { eq_maj: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Selena Scope", email: "selena@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l_eq: "$.data[0].equivalency_id" } }
          assert:
            - "line[0].equivalency_id == ${eq_maj} (major-specific scope beats scope ALL)"
            - "line[0].equivalency_id != ${eq_all}"

      - name: selector_excludes_window_not_covering_term
        claim_type: input_set_filtering
        grounds:
          - "calculations.equivalency_selection"
          - "state_machines.EvaluationLineItem.PENDING_to_PETITION_REQUIRED"
        distinguishing_aspect: "The only candidate equivalency has a closed window [2024-08-01, 2024-12-31] that does not cover the transcript term 2025-06-15, so the pool is empty and the line becomes PETITION_REQUIRED."
        test_recipe:
          setup: ["QUARTER partner; C1 (MATH, 4.0); ACTIVE agreement; equivalency MATH-101 with window [2024-08-01, 2024-12-31]; student; VERIFIED transcript term_completed 2025-06-15, grade B"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Window College", institution_code: "WC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Old Calc", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2024-12-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Window Will", email: "will@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "MATH-101", title: "Calc", credit_hours: 4.5, grade: "B" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l_st: "$.data[0].status" } }
          assert:
            - "line[0].status == PETITION_REQUIRED (term 2025-06-15 outside closed window [2024-08-01, 2024-12-31])"
            - "line[0].equivalency_id is null and provisional_credits is null"

      - name: selector_excludes_archived_internal_course
        claim_type: input_set_filtering
        grounds:
          - "calculations.equivalency_selection"
          - "entities.InternalCourse.fields.is_active"
        distinguishing_aspect: "An equivalency whose internal course was archived (is_active=false) before intake is ineligible; with no other candidate the line falls to PETITION_REQUIRED — archived references still resolve (the equivalency row itself is untouched)."
        test_recipe:
          setup: ["SEMESTER partner; C1 created then deactivated; ACTIVE agreement with equivalency M-101 -> C1; student; VERIFIED transcript term 2025-06-15 grade A"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Archive College", institution_code: "AR", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq_id: "$.data.id" } }
            - { call: "POST /api/internal-courses/${c1}/deactivate", as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Arch Amy", email: "amy@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l_st: "$.data[0].status" } }
            - { call: "GET /api/course-equivalencies/${eq_id}", as: TransferEvaluator, captures: { eq_st: "$.data.status" } }
          assert:
            - "line[0].status == PETITION_REQUIRED (sole candidate ineligible: internal course archived)"
            - "CourseEquivalency.${eq_id}.status remains ACTIVE — archival of the course does not mutate the equivalency row"

  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers is rejected at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["one partner exists so the route itself is resolvable"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Auth College", institution_code: "AU", credit_system: "SEMESTER" }, as: RegistrarAdmin }
          trigger:
            - call: "GET /api/partner-institutions"
              note: "send with BOTH X-User-ID and X-User-Role headers omitted"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http status 400"

      - name: invalid_credit_system_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.PartnerInstitution.fields.credit_system"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "credit_system: TRIMESTER is outside the declared enum {SEMESTER, QUARTER} and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one valid partner exists as baseline"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Valid College", institution_code: "VA", credit_system: "SEMESTER" }, as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/partner-institutions", payload: { name: "Trimester College", institution_code: "TR", credit_system: "TRIMESTER" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: agreement_inverted_date_range_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "entities.ArticulationAgreement.fields.effective_end"
        distinguishing_aspect: "effective_start >= effective_end violates the schema-level date-range rule (ERR_INVALID_REQUEST) — checked before any overlap business rule."
        test_recipe:
          setup: ["partner exists"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Date College", institution_code: "DA", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2027-07-31", effective_end: "2024-08-01" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: transcript_body_fk_unknown_student_returns_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "entities.Transcript.fields.student_id"
        distinguishing_aspect: "A body FK (student_id) referencing a non-existent id is rejected with ERR_NOT_FOUND (404) even though the path itself is valid."
        test_recipe:
          setup: ["partner exists; no student with the all-zero id exists"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "FK College", institution_code: "FK", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/transcripts", payload: { student_id: "00000000-0000-0000-0000-000000000000", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [] }, as: TransferCenterStaff, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: equivalency_create_stale_agreement_version_returns_412
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[equivalency-create-stale-agreement]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=5]"
        distinguishing_aspect: "OCC: the create carries expected_agreement_version one behind the agreement's current version (fresh create, version 1, request claims 0) and is rejected with ERR_STALE_VERSION (412) before any business rule runs."
        test_recipe:
          setup: ["partner, course, and a DRAFT agreement (version 1) exist"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "OCC College", institution_code: "OC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id", ag_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v} - 1" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION and http status 412 (agreement version is 1, client claimed 0)"

      - name: student_cannot_petition_other_students_line
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - "roles[Student]"
        distinguishing_aspect: "Ownership (priority 6): a Student whose X-User-ID is a DIFFERENT TransferStudent than the line's evaluation owner is rejected with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["student A has an evaluation IN_REVIEW with a PETITION_REQUIRED line; student B exists; course C_ART exists"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Art College", institution_code: "AC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ART-200", title: "Sculpture I", credit_hours: 4.0, level: "LOWER", department: "ART", gened_tags: [] }, as: RegistrarAdmin, captures: { c_art: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Owner Olivia", email: "olivia@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_a: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Intruder Ian", email: "ian@x.edu", declared_major: "HIST", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_b: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_a}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "ART-210", title: "Sculpture", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_a}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
          trigger:
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c_art}", syllabus_ref: "s3://syllabi/art210.pdf" }, as: Student, as_user_id: "${s_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (403) — student B cannot petition student A's line item"

      - name: petition_on_auto_matched_line_returns_not_petitionable
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_LINE_ITEM_NOT_PETITIONABLE]"
        distinguishing_aspect: "A petition can only target PETITION_REQUIRED or DENIED lines; an AUTO_MATCHED line rejects the petition with ERR_LINE_ITEM_NOT_PETITIONABLE."
        test_recipe:
          setup: ["SEMESTER partner; C1 (MATH, 4.0); ACTIVE agreement + equivalency M-101; student; evaluation IN_REVIEW with line AUTO_MATCHED"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Petition Pam", email: "pam@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
          trigger:
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c1}", syllabus_ref: "s3://syllabi/m101.pdf" }, as: Student, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LINE_ITEM_NOT_PETITIONABLE (409)"

      - name: duplicate_open_petition_returns_already_open
        claim_type: violation_to_error
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_PETITION_ALREADY_OPEN]"
        distinguishing_aspect: "While a petition is open (SUBMITTED), a second petition on the same line item fails with ERR_PETITION_ALREADY_OPEN."
        test_recipe:
          setup: ["evaluation IN_REVIEW with PETITION_REQUIRED line; one petition already SUBMITTED on it"]
          setup_api_calls:
