            - "Product.${o_pout}.resolved_zone_ids == [] (overlap_pct rounds to 0.090, strictly below 0.10, so the zone is excluded and the resolved set is empty)"
            - "Product.${o_pin}.polygon_area_sq_km == 12.32 and Product.${o_pout}.polygon_area_sq_km == 11.09 (per-segment shoelace, round_half_up 2 decimals)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_blocked_until_coordination_acknowledged
        grounds:
          - state_machines.Product.PENDING_COORDINATION_to_ISSUED
          - state_machines.CoordinationRequest.REQUESTED_to_ACKNOWLEDGED
          - errors.ERR_COORDINATION_NOT_ACKED
        distinguishing_aspect: "Entity pair Product x CoordinationRequest: the product's PENDING_COORDINATION -> ISSUED transition is gated on the state of a different entity — every linked CoordinationRequest must be ACKNOWLEDGED; one REQUESTED request blocks issuance with ERR_COORDINATION_NOT_ACKED."
        test_recipe:
          setup:
            - "Offices A, B with a SEVERE_THUNDERSTORM agreement. Zones ZA (A) and ZB (B). A SEVERE watch over [ZA, ZB] is submitted for coordination; its request to B is still REQUESTED."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KGAA", name: "Gate A", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { g_off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KGBB", name: "Gate B", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { g_off_b: $.data.id }
            - call: "POST /alerts/neighbor-agreements"
              payload: { office_a_id: "${g_off_a}", office_b_id: "${g_off_b}", hazard_types: ["SEVERE_THUNDERSTORM"], coordination_timeout_minutes: 15 }
              as: PlatformAdmin
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZGA1", name: "Gate Zone A", office_id: "${g_off_a}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { g_zone_a: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZGB1", name: "Gate Zone B", office_id: "${g_off_b}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { g_zone_b: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${g_off_a}", full_name: "Gus A", employee_code: "EMP-GA", level: "SENIOR" }
              as: PlatformAdmin
              captures: { g_fc_a: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${g_off_b}", full_name: "Gail B", employee_code: "EMP-GB", level: "SENIOR" }
              as: PlatformAdmin
              captures: { g_fc_b: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${g_off_a}", zone_ids: ["${g_zone_a}", "${g_zone_b}"], effective_from: "2026-09-01T06:00:00Z", expires_at: "2026-09-01T18:00:00Z" }
              as: Forecaster
              as_user_id: "${g_fc_a}"
              captures: { g_w: $.data.id, g_wv1: $.data.version }
            - call: "POST /alerts/products/${g_w}/submit-coordination"
              payload: {}
              as: Forecaster
              as_user_id: "${g_fc_a}"
              captures: { g_wv2: $.data.version }
            - call: "GET /alerts/coordination-requests"
              payload: { product_id: "${g_w}", to_office_id: "${g_off_b}" }
              as: Forecaster
              as_user_id: "${g_fc_a}"
              captures: { g_req: "$.data[0].id" }
          trigger:
            - call: "POST /alerts/products/${g_w}/issue"
              payload: { expected_product_version: "${g_wv2}" }
              as: Forecaster
              as_user_id: "${g_fc_a}"
              captures: { g_err: $.data.error_id }
            - call: "POST /alerts/coordination-requests/${g_req}/respond"
              payload: { outcome: "ACKNOWLEDGED" }
              as: Forecaster
              as_user_id: "${g_fc_b}"
            - call: "POST /alerts/products/${g_w}/issue"
              payload: { expected_product_version: "${g_wv2}" }
              as: Forecaster
              as_user_id: "${g_fc_a}"
          assert:
            - "the first issue attempt is 409 with error_id == ERR_COORDINATION_NOT_ACKED (request still REQUESTED) and the product stays PENDING_COORDINATION at version 2 (the failed attempt mutates nothing)"
            - "after the ACKNOWLEDGED response the identical issue call (same expected_product_version 2) succeeds and the product is ISSUED"

      - name: emergency_order_requires_linked_product_issued
        grounds:
          - state_machines.EmergencyAction.RECOMMENDED_to_ORDERED
          - errors.ERR_INVALID_PRODUCT_STATE
        distinguishing_aspect: "Entity pair EmergencyAction x Product: the RECOMMENDED -> ORDERED transition is gated on the linked Product being ISSUED; ordering against a CANCELLED product fails with ERR_INVALID_PRODUCT_STATE while the same call succeeded minutes earlier when the product was ISSUED."
