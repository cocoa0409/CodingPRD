      - name: corner_finalize_document_while_comment_axis_open_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.NepaDocument.publication_status_PUBLISHED_to_FINAL
          - validations.priority_8_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "finalize is not reachable from the PUBLISHED x OPEN product state; the publication axis may only advance once the comment axis has already reached CLOSED, so the call must fail with ERR_INVALID_STATE while leaving both axes untouched."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline environmental assessment was published at 2026-09-05T00:00:00Z with a comment period ending 2026-10-05T00:00:00Z, so it is PUBLISHED x OPEN."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_alt_a
            - *k_alt_b
            - *k_screen_alt_a
            - *k_screen_alt_b
            - *k_agency_fws
            - *k_con_esa
            - *k_con_concur
            - *k_close_scope
            - *k_doc_ea
            - &k_clk_sep5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PolicyAdmin
            - &k_publish
              call: "POST /documents/${doc_id}/publish"
              payload: { comment_period_end_at: "2026-10-05T00:00:00Z" }
              as: NepaCoordinator
          trigger:
            - call: "POST /documents/${doc_id}/finalize"
              payload: {}
              as: NepaCoordinator
          assert:
            - "HTTP status is 409 and data.error_id == ERR_INVALID_STATE"
            - "NepaDocument.${doc_id}.publication_status == PUBLISHED and comment_status == OPEN"
            - "NepaDocument.${doc_id}.comment_period_days == 30"
            - "ProposedAction.${act_id}.review_stage == DRAFT_PUBLISHED"

