              payload: { tower_id: "${tower_id}", cause: "EQUIPMENT", started_at: "2026-08-07T00:00:00Z" }
              as: NetworkEngineer
              captures: { open_id: $.data.id }
          trigger:
            - call: "POST /outage-credits"
              payload: { outage_event_id: "${credited_id}", subscriber_id: "${sub1_id}" }
              as: BillingAdmin
              as_user_id: "billing-2001"
              captures: { credit_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "OutageEvent B.duration_minutes == 240 but only 120 of its minutes fall inside the cycle"
            - "OutageEvent O.status == \"OPEN\" and duration_minutes is null"
            - "OutageCredit.cycle_outage_minutes == 1389 (120 clipped + 1269), not 1509 and not 1269"
            - "OutageCredit.measured_uptime_pct == 96.785 and shortfall_pct == 2.715"
            - "OutageCredit.credit_cents == 1900 and status == \"PENDING\""

      - name: damaged_rental_return_charges_half_replacement_and_ignores_months_in_service
        claim_type: correct_result
        grounds:
          - calculations.equipment_settlement
          - calculations.equipment_settlement.constants.DAMAGE_CHARGE_PCT
          - entities.EquipmentAssignment.fields.settlement_basis
          - entities.Subscriber.fields.settlement_balance_cents
        distinguishing_aspect: |
          A RENTAL unit returned DAMAGED eight days after deployment settles at
          round_half_up(34900 * 0.5) = 17450 on basis RENTAL_DAMAGE, and months_in_service is 0 because
          8 / 30 truncates - the rental-credit offset branch (which would net 34900 against collected
          rent) is not reached, and the damage charge does not shrink with time in service. The
          subscriber-level roll-up moves from 0 to 17450 only once the row leaves RETURN_PENDING, and
          equipment_monthly_charge_cents drops back to 0 because the unit is no longer DEPLOYED.
        test_recipe:
          setup:
            - "ACTIVE Tower / ACTIVE Sector / STD50 baseline with RENTAL Subscriber SUB1 installed at clock 2026-08-02T00:00:00Z, so the EquipmentAssignment is DEPLOYED with deployed_at 2026-08-02T00:00:00Z."
            - "Clock advanced to 2026-08-10T00:00:00Z and the account CANCELLED, which moves the assignment DEPLOYED -> RETURN_PENDING."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr1_id}", service_plan_id: "${plan_id}", billing_email: "dana.reyes@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub1_id: $.data.id }
            - call: "POST /install-work-orders"
              payload: { subscriber_id: "${sub1_id}", scheduled_at: "2026-08-02T15:00:00Z" }
              as: FieldTech
              captures: { wo1_id: $.data.id }
            - call: "POST /install-work-orders/${wo1_id}/survey"
              payload: { measured_tree_line_height_m: 3.0, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
