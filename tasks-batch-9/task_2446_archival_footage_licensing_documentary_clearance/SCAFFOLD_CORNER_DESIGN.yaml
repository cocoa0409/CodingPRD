        distinguishing_aspect: "A DRAFT (not yet ISSUED) letter does not satisfy the gate, and the letter check at priority 22 must precede the score check at priority 42 — the analysis here scores 0.6750 and would otherwise pass, isolating the letter gate."
        test_recipe:
          setup: ["A production in CLEARANCE with one 20-second CRITICAL_COMMENTARY asset carrying one SUBMITTED FairUseAnalysis (90, 60, 40, 50) and one OpinionLetter still in DRAFT."]
