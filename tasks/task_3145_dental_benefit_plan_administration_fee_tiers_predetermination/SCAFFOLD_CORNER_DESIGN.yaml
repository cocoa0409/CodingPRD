              as: PlanAdmin
              captures: { sub_b: $.data.id }
          trigger:
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_b}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Member
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: provider_cannot_file_claim_for_other_provider
        claim_type: role_exclusive_denial
        grounds:
          - roles.Provider
          - validations[priority=2.5]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Provider identity is entity_backed:Provider — X-User-ID must equal the claim's provider_id. Provider A filing under provider B's id is rejected 403."
        test_recipe:
          setup:
            - "Standard stack plus a second provider."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/providers"
              payload: { npi: "1888888888", legal_name: "Other Dental", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_b: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_b}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: approve_by_non_assigned_reviewer_returns_segregation_of_duties
        claim_type: role_exclusive_denial
        grounds:
          - validations[priority=14]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The predetermination's clinical_reviewer_id is rev-1; an approve call authenticated as rev-2 is rejected 403 ERR_SEGREGATION_OF_DUTIES — the reviewer who estimated cannot be swapped implicitly."
        test_recipe:
          setup:
            - "Standard stack. Predetermination assigned to rev-1."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v: $.data.version }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-2"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "GET /dental/predeterminations/${predet_id} still shows status == UNDER_REVIEW and clinical_reviewer_id == \"rev-1\""

      - name: assign_with_payload_reviewer_mismatch_returns_segregation_of_duties
        claim_type: role_exclusive_denial
        grounds:
          - validations[priority=14]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Assign requires X-User-ID == payload clinical_reviewer_id (self-assignment); a caller authenticating as rev-1 but naming rev-2 in the payload is rejected 403."
        test_recipe:
          setup:
            - "Standard stack. Predetermination in SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-2" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "GET /dental/predeterminations/${predet_id} still shows status == SUBMITTED"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: claim_void_with_stale_version_returns_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[claim-void-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The claim's version advanced to 2 when auto-adjudication ran during creation; a void carrying expected_claim_version one behind the current value is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Standard stack. One adjudicated D0120 claim (version 2 after auto-adjudication)."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /dental/claims/${claim_id}/void"
              payload: { expected_claim_version: "${claim_v} - 1" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION"
            - "GET /dental/claims/${claim_id} still shows status == ADJUDICATED"

      - name: derived_accumulator_reconciles_after_second_claim
        claim_type: derived_field_after_update
        grounds:
          - entities.BenefitAccumulator.fields.annual_max_used_cents
          - calculations.annual_max_accumulator
        excluded_because:
          difficulty_instance: void_of_second_claim_restores_deductible_to_first_claims_level
          rationale: "Accumulator increments across two sequential claims and reconciliation after a void are asserted in the named §1.8 instance and in annual_max_circular_cap_draws_down_in_line_order."

  # ===========================================================================
  - section: consistency
    instances:

      - name: claim_post_response_includes_computed_totals_immediately
        claim_type: immediate_consistency
        grounds:
          - entities.Claim.fields.total_plan_pay_cents
          - endpoints.POST_/dental/claims
        distinguishing_aspect: "Consistency model is immediate: the POST /dental/claims response itself carries the adjudicated totals — no re-read is required to observe the computed fields."
        test_recipe:
          setup:
            - "Standard stack."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { ts: $.data.total_submitted_cents, ta: $.data.total_allowed_cents, tp: $.data.total_plan_pay_cents, st: $.data.status }
          assert:
            - "the create response itself has status == ADJUDICATED (auto-adjudication completed synchronously)"
            - "total_submitted_cents == 10000, total_allowed_cents == 10000, total_plan_pay_cents == 8000 (floor(10000*80/100)) in the create response"
