  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lodging_block_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_LODGING_WINDOW_OVERLAP]
          - entities.LodgingBlock.fields.window_start
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) adjacency. Block [08-12, 08-14)
          touching an existing [08-10, 08-12) block at the boundary is ALLOWED; [08-11, 08-13)
          overlapping by one day is REJECTED. Resource entity: LodgingBlock (hotel room nights).
          Different semantics from the containment rule in the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; block A on Hotel H rooms 5 window [2026-08-10, 2026-08-12)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Omicron", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/lodging-blocks"
              payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 5, nightly_rate_cents: 10000, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { lb_a: $.data.id }
          trigger:
            - { call: "POST /om/lodging-blocks", payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 3, nightly_rate_cents: 10000, window_start: "2026-08-12T00:00:00Z", window_end: "2026-08-14T00:00:00Z" }, as: MutualAidCoordinator, captures: { lb_b: $.data.id } }
            - { call: "POST /om/lodging-blocks", payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 2, nightly_rate_cents: 10000, window_start: "2026-08-11T00:00:00Z", window_end: "2026-08-13T00:00:00Z" }, as: MutualAidCoordinator, captures: { err_c: $.data.error_id } }
            - { call: "POST /om/lodging-blocks", payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H2", county_code: "C1", room_count: 2, nightly_rate_cents: 10000, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }, as: MutualAidCoordinator, captures: { lb_d: $.data.id } }
          assert:
            - "Adjacency allowed: block B created (${lb_b} non-null) — A.window_end == B.window_start touches under half-open semantics without overlap"
            - "True overlap rejected: ${err_c} == ERR_LODGING_WINDOW_OVERLAP for [08-11, 08-13) against [08-10, 08-12)"
            - "Overlap scope is (storm_event_id, hotel_name): block D on Hotel H2 with the identical window as A is allowed (${lb_d} non-null)"

      - name: crew_lodging_containment_and_aggregate_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_WINDOW_OUTSIDE_BLOCK]
          - errors[ERR_NO_ROOMS_AVAILABLE]
          - entities.LodgingBlock.fields.rooms_allocated
        distinguishing_aspect: |
          Interval semantics: CONTAINMENT plus aggregate capacity — a crew window that merely
          intersects the block window but pokes past its end is rejected (ERR_WINDOW_OUTSIDE_BLOCK),
          and once contained, room consumption is an aggregate capacity check (sum of roster_size <=
          room_count, equality allowed). Resource entity: MutualAidCrew room allocation into a
          LodgingBlock — different semantics (containment/capacity) and different operation
          (assign_lodging) from block-creation adjacency.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; block rooms=3 window [08-10, 08-13) COMMITTED"
            - "Crew A roster 1 window [08-10, 08-14) AVAILABLE; crew B roster 2 window [08-11, 08-12) AVAILABLE; crew C roster 2 window [08-11, 08-12) AVAILABLE (arrivals at 08-10Z for A and 08-11Z for B/C, inside their own windows)"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Pi", event_type: "ICE_STORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/lodging-blocks"
              payload: { storm_event_id: "${ev_id}", hotel_name: "Hotel H", county_code: "C1", room_count: 3, nightly_rate_cents: 10000, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-13T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { lb: $.data.id }
            - { call: "POST /om/lodging-blocks/${lb}/commit", payload: {}, as: MutualAidCoordinator }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo A", crew_type: "LINE", roster_size: 1, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-10T00:00:00Z", committed_window_end: "2026-08-14T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { ma: $.data.id }
            - { call: "POST /om/mutual-aid-crews/${ma}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo B", crew_type: "TREE", roster_size: 2, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-11T00:00:00Z", committed_window_end: "2026-08-12T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mb: $.data.id }
            - call: "POST /om/mutual-aid-crews"
              payload: { storm_event_id: "${ev_id}", company_name: "PeerCo C", crew_type: "LINE", roster_size: 2, service_county_code: "C1", daily_rate_cents: 40000, per_diem_cents: 5000, committed_window_start: "2026-08-11T00:00:00Z", committed_window_end: "2026-08-12T00:00:00Z" }
              as: MutualAidCoordinator
              captures: { mc: $.data.id }
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: EmergencyDirector }
            - { call: "POST /om/mutual-aid-crews/${mb}/mark_arrived", payload: {}, as: MutualAidCoordinator }
            - { call: "POST /om/mutual-aid-crews/${mc}/mark_arrived", payload: {}, as: MutualAidCoordinator }
          trigger:
            - { call: "POST /om/mutual-aid-crews/${ma}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator, captures: { err_a: $.data.error_id } }
            - { call: "POST /om/mutual-aid-crews/${mb}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator, captures: { ok_b: $.data.lodging_block_id } }
            - { call: "POST /om/mutual-aid-crews/${mc}/assign_lodging", payload: { lodging_block_id: "${lb}" }, as: MutualAidCoordinator, captures: { err_c: $.data.error_id } }
          assert:
            - "Containment failure: ${err_a} == ERR_WINDOW_OUTSIDE_BLOCK — intersection is not enough; crew window [08-10,08-14) escapes block end 08-13"
            - "Contained assignment succeeds: ${ok_b} == ${lb} and block rooms_allocated == 2"
            - "Aggregate capacity: ${err_c} == ERR_NO_ROOMS_AVAILABLE (2 allocated + roster 2 > 3 rooms); equality would have been allowed"
            - "Block rooms_allocated remains 2 after the rejected assignment (no partial reservation)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: material_stage_cancel_conserves_stock_units
        grounds:
          - state_machines.MaterialRequisition.REQUESTED_to_STAGED
          - state_machines.MaterialRequisition.STAGED_to_CANCELLED
          - entities.MaterialStock.fields.quantity_reserved
          - entities.MaterialStock.fields.quantity_available
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNITS. Stage(10) then cancel must leave
          quantity_on_hand + quantity_reserved == 100 at every observable step, with on_hand never
          moving. Different conserved quantity from the ledger-cents instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {5, EQUIPMENT}; assessment (repair 10) accepted; REPAIR work order READY"
            - "Stock pool W1/SKU-1: quantity_on_hand 100, unit_cost 500; requisition qty 10 in REQUESTED"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Rho", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 5, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot_id}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - call: "POST /om/material-stocks"
              payload: { warehouse_code: "W1", material_sku: "SKU-1", quantity_on_hand: 100, unit_cost_cents: 500 }
              as: MaterialsManager
              captures: { ms: $.data.id }
            - call: "POST /om/material-requisitions"
              payload: { work_order_id: "${wo}", material_stock_id: "${ms}", quantity: 10 }
              as: MaterialsManager
              captures: { mr: $.data.id }
          trigger:
            - { call: "POST /om/material-requisitions/${mr}/stage", payload: {}, as: MaterialsManager }
            - { call: "GET /om/material-stocks/${ms}", payload: {}, as: MaterialsManager, captures: { oh1: $.data.quantity_on_hand, rs1: $.data.quantity_reserved, av1: $.data.quantity_available } }
            - { call: "POST /om/material-requisitions/${mr}/cancel", payload: {}, as: MaterialsManager, captures: { mr_st: $.data.requisition_status } }
            - { call: "GET /om/material-stocks/${ms}", payload: {}, as: MaterialsManager, captures: { oh2: $.data.quantity_on_hand, rs2: $.data.quantity_reserved, av2: $.data.quantity_available } }
          assert:
            - "After stage: ${oh1} == 100, ${rs1} == 10, ${av1} == 90 (reservation moved 10 units into the reserved bucket; nothing left the warehouse)"
            - "After cancel: ${oh2} == 100, ${rs2} == 0, ${av2} == 100 and ${mr_st} == CANCELLED"
            - "Invariant: quantity_on_hand + quantity_reserved == 100 held after create, stage, and cancel — the forward action and its compensating action conserved the unit pool exactly"

      - name: ledger_issue_return_nets_zero_cents
        grounds:
          - state_machines.MaterialRequisition.STAGED_to_ISSUED
          - state_machines.MaterialRequisition.ISSUED_to_RETURNED
          - calculations.event_cost_rollup
          - entities.CostLedgerEntry.fields.reversed_entry_id
        distinguishing_aspect: |
          Conserved quantity: LEDGER CENTS. Issue posts +5000; the compensating return posts a
          reversal entry of -5000 pinned to the original via reversed_entry_id; the per-requisition
          sum and the event's total_material_cents both net to exactly zero — no drift. Different
          conserved quantity (money vs units) from the stock instance.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder; outage confirmed {5, EQUIPMENT}; assessment (repair 10) accepted; REPAIR work order READY"
            - "Stock pool W1/SKU-1: quantity_on_hand 100, unit_cost 500; requisition qty 10 STAGED"
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm Sigma", event_type: "THUNDERSTORM" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 2000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot_id: $.data.id }
            - call: "POST /om/outages/${ot_id}/confirm"
              payload: { customers_affected: 5, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "Depot 1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot_id}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da_id: $.data.id }
            - { call: "POST /om/damage-assessments/${da_id}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da_id}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot_id}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - call: "POST /om/material-stocks"
              payload: { warehouse_code: "W1", material_sku: "SKU-1", quantity_on_hand: 100, unit_cost_cents: 500 }
              as: MaterialsManager
              captures: { ms: $.data.id }
            - call: "POST /om/material-requisitions"
              payload: { work_order_id: "${wo}", material_stock_id: "${ms}", quantity: 10 }
              as: MaterialsManager
              captures: { mr: $.data.id }
            - { call: "POST /om/material-requisitions/${mr}/stage", payload: {}, as: MaterialsManager }
          trigger:
            - { call: "POST /om/material-requisitions/${mr}/issue", payload: {}, as: MaterialsManager }
            - { call: "GET /om/cost-ledger-entries?work_order_id=${wo}", payload: {}, as: MaterialsManager, captures: { e1: "$.data[0].id", amt1: "$.data[0].amount_cents" } }
            - { call: "POST /om/material-requisitions/${mr}/return", payload: {}, as: MaterialsManager }
            - { call: "GET /om/cost-ledger-entries?work_order_id=${wo}", payload: {}, as: MaterialsManager, captures: { amt2: "$.data[1].amount_cents", rev2: "$.data[1].reversed_entry_id" } }
            - { call: "GET /om/material-stocks/${ms}", payload: {}, as: MaterialsManager, captures: { oh: $.data.quantity_on_hand, rs: $.data.quantity_reserved } }
            - { call: "GET /om/storm-events/${ev_id}", payload: {}, as: MaterialsManager, captures: { tot_mat: $.data.total_material_cents } }
          assert:
            - "Forward action: issue entry ${amt1} == 5000 (10 x 500)"
            - "Compensating action: reversal entry ${amt2} == -5000 with ${rev2} == ${e1}"
            - "Invariant: sum of MATERIAL entries for the work order == 5000 + (-5000) == 0 exactly (no drift)"
            - "Stock restored: ${oh} == 100 and ${rs} == 0"
            - "Event rollup consistent: ${tot_mat} == 0 after the return (was 5000 after the issue)"
