  - rule_id: cross_entity_state_dependency
    instances:

      - name: fat_schedule_reads_three_foreign_test_bay_fields_kv_equality_impulse_and_status
        grounds:
          - state_machines.FactoryAcceptanceTest.REQUESTED->BAY_SCHEDULED
          - entities.TestBay.fields.max_kv
          - entities.TestBay.fields.supports_impulse
          - entities.TestBay.fields.status
          - entities.EngineeredOrder.fields.rated_kv
          - validations[priority=47]
          - validations[priority=48]
          - validations[priority=49]
        distinguishing_aspect: |
          One unchanged FactoryAcceptanceTest row is rejected three different ways purely by
          reading three different columns of a FOREIGN TestBay row (max_kv 144 -> 422
          ERR_BAY_KV_INSUFFICIENT, supports_impulse false -> 422 ERR_BAY_IMPULSE_UNSUPPORTED,
          status MAINTENANCE -> 409 ERR_BAY_UNAVAILABLE) and then succeeds on the SAME bay
          after a PATCH that touches only TestBay.status; rated_kv 145 == max_kv 145 must pass,
          so an implementation using strict < on kv, or one that snapshots bay capability onto
          the FAT at creation time, fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "EngineeredOrder TX-XED-0001, POWER_TRANSFORMER, rated_kv 145, contract_value_cents 90000000, driven to engineering_status DESIGN_RELEASED and fulfillment_status IN_PRODUCTION."
            - "TestBay BAY-ALPHA: max_kv 145 (exact equality with rated_kv), changeover_buffer_hours 2, supports_impulse false, status AVAILABLE."
            - "TestBay BAY-BRAVO: max_kv 144 (one kV short), changeover_buffer_hours 1, supports_impulse true, status AVAILABLE."
            - "TestBay BAY-CHARLIE: max_kv 400, changeover_buffer_hours 1, supports_impulse true, later PATCHed to status MAINTENANCE and back."
            - "FAT alpha_fat: witness_required false, requires_impulse false, test_duration_hours 8."
            - "FAT imp_fat: witness_required false, requires_impulse true, test_duration_hours 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-XED-0001", customer_name: "Cascade Power", product_family: "POWER_TRANSFORMER", rated_kv: 145, contract_value_cents: 90000000, sold_at: "2026-01-10T00:00:00Z", promised_ship_at: "2026-12-15T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/submittal-drawings"
              payload: { drawing_set_code: "DS-XED-A", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_v0}" }
              as: DesignEngineer
              captures: { dwg_id: $.data.id }
            - call: "POST /submittal-drawings/${dwg_id}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg_id}/begin-review"
              payload: {}
              as: CustomerReviewer
            - call: "POST /submittal-drawings/${dwg_id}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-XED", legal_name: "Cascade Coil Works", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "PN-XED-BUSH", category: "HV_BUSHING", lead_time_days: 60, quantity_on_hand: 10, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id }
            - call: "GET /long-lead-components/${comp_id}"
              payload: {}
              as: MaterialsPlanner
              captures: { comp_v0: $.data.version }
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 4, priority_class: 3, need_by_date: "2026-09-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /component-allocations/${alloc_id}/commit"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /engineered-orders/${ord_id}/start-production"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-ALPHA", max_kv: 145, changeover_buffer_hours: 2, supports_impulse: false }
              as: PlantAdmin
              captures: { bay_a: $.data.id }
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-BRAVO", max_kv: 144, changeover_buffer_hours: 1, supports_impulse: true }
              as: PlantAdmin
              captures: { bay_b: $.data.id }
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-CHARLIE", max_kv: 400, changeover_buffer_hours: 1, supports_impulse: true }
              as: PlantAdmin
              captures: { bay_c: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 8, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat_a: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 8, witness_required: false, requires_impulse: true }
              as: TestEngineer
              captures: { fat_i: $.data.id }
          trigger:
            - call: "POST /factory-acceptance-tests/${fat_a}/schedule"
              payload: { test_bay_id: "${bay_b}", window_start_at: "2026-06-01T08:00:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat_a}/schedule"
              payload: { test_bay_id: "${bay_a}", window_start_at: "2026-06-01T08:00:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat_i}/schedule"
              payload: { test_bay_id: "${bay_a}", window_start_at: "2026-06-03T08:00:00Z" }
              as: TestEngineer
            - call: "PATCH /test-bays/${bay_c}"
              payload: { status: "MAINTENANCE" }
              as: PlantAdmin
            - call: "POST /factory-acceptance-tests/${fat_i}/schedule"
              payload: { test_bay_id: "${bay_c}", window_start_at: "2026-06-03T08:00:00Z" }
              as: TestEngineer
            - call: "PATCH /test-bays/${bay_c}"
              payload: { status: "AVAILABLE" }
              as: PlantAdmin
            - call: "POST /factory-acceptance-tests/${fat_i}/schedule"
              payload: { test_bay_id: "${bay_c}", window_start_at: "2026-06-03T08:00:00Z" }
              as: TestEngineer
            - call: "GET /test-bays/${bay_a}"
              payload: {}
              as: TestEngineer
            - call: "GET /test-bays/${bay_b}"
              payload: {}
              as: TestEngineer
            - call: "GET /test-bays/${bay_c}"
              payload: {}
              as: TestEngineer
          assert:
            - "call 1 (alpha_fat -> BAY-BRAVO) -> 422 ERR_BAY_KV_INSUFFICIENT: order.rated_kv 145 > bay.max_kv 144 by exactly 1 kV; FactoryAcceptanceTest.${fat_a}.status stays REQUESTED and test_bay_id stays null"
            - "call 2 (alpha_fat -> BAY-ALPHA) -> 200: rated_kv 145 == max_kv 145 is ADMITTED (the check is <=, not <); status becomes BAY_SCHEDULED, test_bay_id == ${bay_a}, window_end_at == 2026-06-01T18:00:00Z (8 h duration + 2 h changeover buffer inside the window)"
            - "call 3 (imp_fat -> BAY-ALPHA) -> 422 ERR_BAY_IMPULSE_UNSUPPORTED: the window 2026-06-03T08:00Z is free on BAY-ALPHA, so only the foreign supports_impulse false explains the rejection; ERR_BAY_WINDOW_CONFLICT must NOT be raised"
            - "call 5 (imp_fat -> BAY-CHARLIE while MAINTENANCE) -> 409 ERR_BAY_UNAVAILABLE: BAY-CHARLIE satisfies max_kv 400 >= 145 and supports_impulse true, so P49 fires on TestBay.status alone and outranks nothing else on this payload"
            - "call 7 (imp_fat -> BAY-CHARLIE after PATCH back to AVAILABLE) -> 200: the FactoryAcceptanceTest row was never mutated between calls 5 and 7, so admissibility is re-read from TestBay live and never snapshotted; window_end_at == 2026-06-03T17:00:00Z (8 h + 1 h buffer)"
            - "TestBay.${bay_a}.scheduled_hours_total == 8 (only the successful alpha_fat claim counted; the two rejected attempts added nothing)"
            - "TestBay.${bay_b}.scheduled_hours_total == 0 (a rejected schedule must not accrue hours)"
            - "TestBay.${bay_c}.scheduled_hours_total == 8"
            - "EngineeredOrder.${ord_id}.fulfillment_status is still IN_PRODUCTION and version is unchanged across all four schedule attempts"

