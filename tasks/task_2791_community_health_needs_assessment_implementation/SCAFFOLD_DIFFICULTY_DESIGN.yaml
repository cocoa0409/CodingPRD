              payload: { strategy_id: "${strat}", party_id: "${partner}", partnership_id: "${agr}", fte_bp: 1000, funding_cents: 600000, effective_from: "2026-12-01", effective_to: "2027-02-01" }
              as: CommunityBenefitOfficer
            - call: "POST /resource-commitments"
              payload: { strategy_id: "${strat}", party_id: "${partner}", partnership_id: "${agr}", fte_bp: 1000, funding_cents: 500000, effective_from: "2027-04-01", effective_to: "2027-07-01" }
              as: CommunityBenefitOfficer
            - call: "POST /resource-commitments"
              payload: { strategy_id: "${strat}", party_id: "${partner}", partnership_id: "${agr}", fte_bp: 1000, funding_cents: 100000, effective_from: "2027-08-01", effective_to: "2027-09-02" }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 201, peak load in [2026-10-01, 2027-01-01) is 1500000 <= pledged 2000000"
            - "trigger call 2: HTTP 201 — the window starts exactly on call 1's exclusive effective_to, so the two do not overlap and the same pledge funds both"
            - "trigger call 3: HTTP 409 with error_id ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED — [2026-12-01, 2027-02-01) overlaps both siblings, giving 600000 + 1500000 + 1500000 == 3600000 > 2000000"
            - "trigger call 4: HTTP 201 — [2027-04-01, 2027-07-01) is disjoint from every sibling, so the load is only 500000; the pledge is capped per instant, not cumulatively"
            - "trigger call 5: HTTP 409 with error_id ERR_COMMITMENT_OUTSIDE_TERM — effective_to 2027-09-02 exceeds term_end 2027-08-31 plus one day; the window overlaps no sibling, so the pledge-load rule at priority 21 is satisfied and the containment rule at priority 17 is the only one that can reject it (2027-09-01 would have been accepted, since term_end is inclusive while effective_to is exclusive)"
            - "after all five calls: exactly three ResourceCommitment rows exist, all PENDING; ImplementationStrategy.${strat}.budget_available_cents == 5500000 (9000000 - 1500000 - 1500000 - 500000)"
            - "ResponsibleParty.${partner}.committed_fte_bp == 3000 and PartnershipAgreement.${agr}.funded_cents == 0 with funding_state PLEDGED"

  - rule_id: compensating_invariant
    instances:
      - name: pending_commitment_release_restores_strategy_budget_identity
        grounds:
          - calculations.strategy_budget_available.constants.CONSERVED_QUANTITY
          - state_machines.ResourceCommitment.PENDING_to_RELEASED
          - validations.priority_11.ERR_INVALID_STATE
        distinguishing_aspect: |
          budget_available_cents + encumbered_cents == authorized_budget_cents
          is a conserved identity, not a running counter. Creating a
          1500000-cent commitment and then releasing it must return the
          envelope to exactly 5000000 — not merely to "about" 5000000 — and
          the freed capacity must be immediately re-usable by a commitment
          that was too large to fit a moment earlier. Releasing the same
          commitment a second time must not credit the envelope twice.
        test_recipe:
          setup:
            - "AssessmentCycle in STRATEGY_DEVELOPMENT with posture OPEN"
            - "one DRAFT ImplementationStrategy with authorized_budget_cents 5000000 and one DRAFT objective"
            - "one PENDING ResourceCommitment for fte_bp 2500 / funding_cents 1500000 held by an INTERNAL party with fte_capacity_bp 10000"
