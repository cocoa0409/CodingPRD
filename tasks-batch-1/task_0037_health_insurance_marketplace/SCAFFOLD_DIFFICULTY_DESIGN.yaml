      - name: sep_filing_window_closed_inclusive_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_SEP_WINDOW_CLOSED]
          - calculations.sep_window
          - entities.SepRequest.fields.window_close_date
        distinguishing_aspect: |
          A different interval semantics on a different resource (SepRequest filing window): a half-bounded
          window [event_date, window_close_date] where approval is allowed iff the current clock date is <=
          window_close_date (inclusive upper edge). Approving on the day AFTER window_close_date is rejected
          with ERR_SEP_WINDOW_CLOSED (409) — boundary geometry differs from the coverage-interval overlap rule.
        test_recipe:
          setup:
