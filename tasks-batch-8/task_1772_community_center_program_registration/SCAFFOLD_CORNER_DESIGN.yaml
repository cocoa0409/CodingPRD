          trigger:
            - { call: "POST /scholarship-applications/${ap}/approve", payload: { approved_pct: 25, estimated_commitment_cents: 5000 }, as: ScholarshipReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
            - { call: "POST /scholarship-applications/${ap}/approve", payload: { approved_pct: 25, estimated_commitment_cents: 5000 }, as: ScholarshipReviewer, as_user_id: "rev-2", captures: { ap_st: $.data.status } }
          assert:
            - "Approve by rev-1 (== reviewed_by): error_id == ERR_SEGREGATION_OF_DUTIES, HTTP 403"
            - "Approve by rev-2: succeeds, status == APPROVED"

