          - validations[priority=8]
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
          - errors[ERR_DAILY_BUDGET_EXCEEDED]
        distinguishing_aspect: "Priority pair (state 4) vs (business_fiscal 8): a POST /api/events against a COMPLETED campaign whose cleared cost also exceeds the daily budget returns ERR_CAMPAIGN_NOT_ACTIVE, not ERR_DAILY_BUDGET_EXCEEDED — the state precondition wins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign with total_budget_cents 3000 and daily_budget_cents 3000 that has already been driven to COMPLETED by a 3000-cent click; one sponsored job."
