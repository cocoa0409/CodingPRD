  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_mode_change
        claim_type: optimistic_concurrency
        grounds: ["\"concurrency_rules[policy-mode-change-stale-version\"]"]
        distinguishing_aspect: "POST /policies/{id}/mode-change with stale expected_policy_version returns 412; correct version succeeds and increments Policy.version by 1."
        test_recipe:
          setup: ["Policy issued at version=1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Rita R2", date_of_birth: "1985-05-05T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_r2: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-R2", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_r2: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_r2}", product_template_id: "${tpl_r2}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_r2: $.data.id }
            - call: "POST /applications/${app_r2}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_r2}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_r2}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_r2: $.data.id, pol_r2_v: $.data.version }
          trigger:
            - call: "POST /policies/${pol_r2}/mode-change"
              payload: { premium_mode: "ANNUAL", expected_policy_version: "${pol_r2_v}" }
              as: Agent
              captures: { new_v: $.data.version }
            - call: "POST /policies/${pol_r2}/mode-change"
              payload: { premium_mode: "QUARTERLY", expected_policy_version: "${pol_r2_v}" }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "First mode-change succeeds and Policy.version == (initial + 1)"
            - "Second mode-change with stale version returns error_id == ERR_STALE_VERSION"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_premium_payment
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "After POST /policies/{id}/premium-payments returns 200, a subsequent GET /policies/{id} in the same test reflects the updated paid_to_date without delay."
        excluded_because:
          difficulty_instance: dual_variant_calc / coi_end_of_month_vs_beginning_of_month
          rationale: "Immediate consistency is implicitly exercised — the test asserts computed CoI against the post-payment cash_value returned by the same flow."
