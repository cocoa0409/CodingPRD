          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_NOTICE_ALREADY_APPEALED]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair state x business_temporal: the second appeal violates BOTH the
          ISSUED-state precondition (notice already APPEALED, priority 7) and the
          appeal window (deadline 2026-08-24 passed, priority 9) — the state error
          ERR_NOTICE_ALREADY_APPEALED must win.
