scenario: "852. Mosquito Abatement District: service area & larval/adult surveillance, trap count & arbovirus (WNV) lab, treatment (larvicide/adulticide/spray) scheduling & route, weather & threshold trigger, complaint & service request, sensitive-site (apiary/organic) registry, aerial-spray notification, reporting"
domain_name: "mosquito-abatement-district"
api_prefix: ""   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: Expert
  notes: |
    A vector-control district must justify every pesticide application against
    surveillance evidence, honor sensitive-site (apiary / organic farm) buffers
    with acknowledged notice, respect re-entry intervals, and keep a
    material-conserving pesticide ledger. The evidence pipeline
    (TrapCollection -> LabPool -> RiskAssessment -> ServiceArea.risk_posture)
    gates the treatment pipeline (TreatmentPlan -> TreatmentRoute), while the
    public complaint pipeline (ServiceRequest) reacts to posture escalation.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_conventions:
  datetime_rendering: |
    Every server-rendered datetime field (created_at, updated_at, sent_at,
    acknowledged_at, executed_at, confirmed_at, triaged_at, due_at,
    resolved_at, completed_at, result_recorded_at, last_positive_at, and every
    stored client-supplied datetime such as window_start / window_end /
    scheduled_start_at) is rendered as ISO-8601 UTC with EXACTLY three
    fractional-second digits and a trailing `Z`, e.g. "2026-06-05T09:00:00.000Z".
    A client may supply either "…Z" or "…​.000Z" on input; the stored value is
    always re-rendered in the three-digit form. Timestamps derived from the
    logical clock MUST be rendered by the same renderer — never from wall clock.
  logical_clock: |
    All "now" comparisons read the logical clock (see POST /_clock/set_current_utc).
    Server startup default is exactly "2026-05-01T00:00:00.000Z"; before any
    set_current_utc call the clock reads that value and MUST NOT fall back to
    real wall-clock time.
  decimal_arithmetic: |
    All index, volume, and money arithmetic uses exact decimal arithmetic with
    ROUND_HALF_UP at the precision each §1.3 rule declares. Money is integer
    cents. Volumes are millilitres with 2 decimal places.
  date_windows: |
    A "N-day window ending on D inclusive" means date >= D - (N-1) days AND
    date <= D, comparing calendar dates in UTC.
  anonymous_pseudo_role: |
    Every endpoint in §1.5 requires authentication. The design files
    (SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml) occasionally
    write `as: Anonymous` in a test recipe; `Anonymous` is NOT a role in §1.7 —
    it is the notation for a request that carries NEITHER X-User-Role NOR
    X-User-ID, which must fail validations priority 1 with ERR_UNAUTHENTICATED.
  report_semantics: |
    GET /service-areas/{id}/surveillance-report computes its index fields live
    from the current data for the requested as_of_date (default: the logical
    clock's date). It reports BOTH minimum_infection_rate variants
    (mir_provisional and mir_confirmed) plus vector_index_provisional for that
    window, and echoes the area's persisted risk_posture, posture_source,
    seasonal_application_count and the four request counters unchanged.

entities:
  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable district zone name"
        constraints: "1..120 chars, required"
      - name: code
        type: string
        source: input
        description: "Short zone code"
        constraints: "2..8 chars, uppercase letters+digits, unique across ServiceArea"
      - name: season_start_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the abatement season begins; degree-day accumulation baseline"
        constraints: "valid ISO date"
      - name: population
        type: integer
        source: input
        description: "Resident population served, used only for reporting"
        constraints: ">= 0"
      - name: risk_posture
        type: enum
        source: computed
        description: "Derived vector-risk posture that gates adulticide/aerial treatment"
        default: NORMAL
        constraints: "one of NORMAL, ELEVATED, EMERGENCY; recomputed by calculations.area_risk_posture"
      - name: posture_source
        type: enum
        source: computed
        description: "Which branch of calculations.area_risk_posture produced risk_posture"
        default: NO_ASSESSMENT
        constraints: "one of NO_ASSESSMENT, INDEX, POSITIVE_OVERRIDE"
      - name: latest_confirmed_vector_index
        type: number
        source: computed
        description: "vector_index_confirmed of the most recently CONFIRMED RiskAssessment of this area"
        default: 0.00
        constraints: "2 decimal places, 0.00..100.00"
      - name: seasonal_application_count
        type: integer
        source: computed
        description: "Number of TreatmentRoutes of this area that reached EXECUTED and have not been VOIDED"
        default: 0
        constraints: ">= 0"
      - name: request_total_count
        type: integer
        source: computed
        description: "Count of all ServiceRequests ever created for this area"
        default: 0
        constraints: ">= 0"
      - name: request_open_count
        type: integer
        source: computed
        description: "Count of ServiceRequests of this area with handling_status IN {RECEIVED, TRIAGED, ASSIGNED, INSPECTED}"
        default: 0
        constraints: ">= 0"
      - name: request_resolved_count
        type: integer
        source: computed
        description: "Count of ServiceRequests of this area with handling_status == RESOLVED"
        default: 0
        constraints: ">= 0"
      - name: request_closed_count
        type: integer
        source: computed
        description: "Count of ServiceRequests of this area with handling_status == CLOSED"
        default: 0
        constraints: ">= 0"

  - name: SensitiveSite
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; taken from the creation path, never from the body"
      - name: site_type
        type: enum
        source: input
        description: "Registry category of the protected site"
        constraints: "one of APIARY, ORGANIC_FARM, AQUACULTURE, SCHOOL"
      - name: operator_name
        type: string
        source: input
        description: "Beekeeper / grower / operator name of record"
        constraints: "1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: "Notification destination of record"
        constraints: "must contain '@'"
      - name: x_m
        type: integer
        source: input
        description: "District-grid easting of the site centre, in metres"
      - name: y_m
        type: integer
        source: input
        description: "District-grid northing of the site centre, in metres"
      - name: buffer_meters_override
        type: integer
        source: input
        description: "Optional operator-negotiated buffer radius in metres; omit to use the per-type default"
        default: null
        constraints: "null or >= 0"
      - name: buffer_meters
        type: integer
        source: computed
        description: "Effective buffer radius = buffer_meters_override when supplied, else SENSITIVE_SITE_BUFFER_METERS[site_type]"
        constraints: ">= 0"
      - name: registered_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of registration, taken from the logical clock"

  - name: TrapSite
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; taken from the creation path"
      - name: site_code
        type: string
        source: input
        description: "Trap identifier stencilled on the trap"
        constraints: "1..16 chars, unique within its ServiceArea"
      - name: trap_type
        type: enum
        source: input
        description: "Trap hardware class"
        constraints: "one of CDC_LIGHT, GRAVID, BG_SENTINEL"
      - name: habitat
        type: enum
        source: input
        description: "Dominant habitat at the trap location"
        constraints: "one of URBAN, WETLAND, AGRICULTURAL, STORMWATER"
      - name: x_m
        type: integer
        source: input
        description: "District-grid easting of the trap, in metres"
      - name: y_m
        type: integer
        source: input
        description: "District-grid northing of the trap, in metres"
      - name: is_active
        type: boolean
        source: input
        description: "Whether the trap is in the current season's rotation; inactive traps are excluded from calculations.trap_abundance_index"
        default: true
      - name: season_positive_count
        type: integer
        source: computed
        description: "Number of LabPools that reached RESULT_POSITIVE for collections of this trap site"
        default: 0
        constraints: ">= 0"
      - name: last_positive_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent RESULT_POSITIVE recorded for this trap site"
        default: null

  - name: TrapCollection
    parent: TrapSite
    common_fields: true
    fields:
      - name: trap_site_id
        type: string
        source: system
        description: "FK -> TrapSite.id; taken from the creation path"
      - name: recorded_by_applicator_id
        type: string
        source: system
        description: "FK -> Applicator.id; the X-User-ID of the FieldTech who logged the collection"
      - name: collection_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the trap was emptied"
      - name: trap_nights
        type: integer
        source: input
        description: "Number of trap-nights this collection represents (denominator of trap_abundance_index)"
        constraints: ">= 1"
      - name: female_count
        type: integer
        source: input
        description: "Count of female mosquitoes in the collection (numerator of trap_abundance_index)"
        constraints: ">= 0"
      - name: species
        type: enum
        source: input
        description: "Dominant species identified in the collection"
        constraints: "one of CULEX_PIPIENS, CULEX_TARSALIS, AEDES_AEGYPTI, AEDES_ALBOPICTUS, OTHER"
      - name: status
        type: enum
        source: computed
        description: "Chain-of-custody state; see state_machines.TrapCollection"
        default: LOGGED
        constraints: "one of LOGGED, SUBMITTED, POOLED, VOIDED"
      - name: pooled_mosquito_count
        type: integer
        source: computed
        description: "Sum of LabPool.pool_size over LabPools of this collection whose status != DISCARDED"
        default: 0
        constraints: ">= 0"
      - name: positive_pool_count
        type: integer
        source: computed
        description: "Number of LabPools of this collection in status RESULT_POSITIVE"
        default: 0
        constraints: ">= 0"
      - name: wnv_detected
        type: boolean
        source: computed
        description: "True once positive_pool_count >= 1"
        default: false

  - name: LabPool
    parent: TrapCollection
    common_fields: true
    fields:
      - name: trap_collection_id
        type: string
        source: system
        description: "FK -> TrapCollection.id; taken from the creation path"
      - name: pool_size
        type: integer
        source: input
        description: "Number of mosquitoes homogenised into this test pool"
        constraints: ">= 1 and <= POOL_MAX_MOSQUITOES"
      - name: assay
        type: enum
        source: input
        description: "Laboratory assay used"
        default: RT_PCR
        constraints: "one of RT_PCR, VECTEST"
      - name: status
        type: enum
        source: computed
        description: "Testing state; see state_machines.LabPool"
        default: CREATED
        constraints: "one of CREATED, IN_TESTING, RESULT_POSITIVE, RESULT_NEGATIVE, INVALID, DISCARDED"
      - name: retest_count
        type: integer
        source: computed
        description: "Number of times this pool has been re-entered into testing after an INVALID result"
        default: 0
        constraints: "0..MAX_POOL_RETESTS"
      - name: ct_value
        type: number
        source: input
        description: "Optional RT-PCR cycle-threshold reported with a POSITIVE result; reporting only"
        default: null
      - name: result_recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the most recent terminal-or-invalid result was recorded"
        default: null

  - name: LarvalInspection
    parent: ServiceArea
    common_fields: false
    fields:
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; taken from the creation path"
      - name: inspection_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the dip survey"
      - name: dips
        type: integer
        source: input
        description: "Number of standard dipper samples taken (denominator of larval_index)"
        constraints: ">= 1"
      - name: larvae_count
        type: integer
        source: input
        description: "Total larvae + pupae counted across all dips (numerator of larval_index)"
        constraints: ">= 0"
      - name: habitat
        type: enum
        source: input
        description: "Larval habitat inspected"
        constraints: "one of CATCH_BASIN, DITCH, MARSH, CONTAINER"
      - name: treated_on_site
        type: boolean
        source: input
        description: "Whether the technician applied a spot larvicide during the inspection; reporting only"
        default: false

  - name: WeatherObservation
    parent: ServiceArea
    common_fields: false
    fields:
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; taken from the creation path"
      - name: obs_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the observation; at most one observation per (service_area_id, obs_date)"
      - name: tmax_c
        type: number
        source: input
        description: "Daily maximum air temperature in degrees Celsius"
        constraints: "-50.0 .. 60.0, at most 1 decimal place"
      - name: tmin_c
        type: number
        source: input
        description: "Daily minimum air temperature in degrees Celsius"
        constraints: "-50.0 .. 60.0, at most 1 decimal place, must be <= tmax_c"
      - name: rainfall_mm
        type: number
        source: input
        description: "Daily rainfall in millimetres; reporting only"
        default: 0.0
        constraints: ">= 0.0"
      - name: degree_day
        type: number
        source: computed
        description: "This day's contribution to calculations.degree_day_accumulation, already rounded to 1 decimal"
        constraints: ">= 0.0, 1 decimal place"

  - name: RiskAssessment
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: system
        description: "FK -> ServiceArea.id; taken from the creation path"
      - name: as_of_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the surveillance windows close on"
      - name: status
        type: enum
        source: computed
        description: "Assessment lifecycle; see state_machines.RiskAssessment"
        default: OPEN
        constraints: "one of OPEN, CONFIRMED, SUPERSEDED"
      - name: is_stale
        type: boolean
        source: computed
        description: "True when surveillance evidence changed after this assessment was created and before it was confirmed"
        default: false
      - name: stale_reason
        type: enum
        source: computed
        description: "Why is_stale was raised"
        default: null
        constraints: "null, LAB_RESULT, or NEW_COLLECTION"
      - name: abundance_index
        type: number
        source: computed
        description: "Output of calculations.trap_abundance_index at creation time"
        constraints: "2 decimal places, >= 0.00"
      - name: larval_index
        type: number
        source: computed
        description: "Output of calculations.larval_index at creation time"
        constraints: "2 decimal places, >= 0.00"
      - name: degree_days
        type: number
        source: computed
        description: "Output of calculations.degree_day_accumulation at creation time"
        constraints: "1 decimal place, >= 0.0"
      - name: mir_provisional
        type: number
        source: computed
        description: "Output of calculations.minimum_infection_rate variant PROVISIONAL, fixed at creation time"
        constraints: "2 decimal places, >= 0.00"
      - name: mir_confirmed
        type: number
        source: computed
        description: "Output of calculations.minimum_infection_rate variant CONFIRMED, written at confirmation time"
        default: null
      - name: vector_index_provisional
        type: number
        source: computed
        description: "Output of calculations.vector_index variant PROVISIONAL, fixed at creation time"
        constraints: "2 decimal places, 0.00..100.00"
      - name: vector_index_confirmed
        type: number
        source: computed
        description: "Output of calculations.vector_index variant CONFIRMED, written at confirmation time"
        default: null
      - name: posture_at_confirm
        type: enum
        source: computed
        description: "ServiceArea.risk_posture immediately after this assessment was confirmed"
        default: null
        constraints: "null, NORMAL, ELEVATED, or EMERGENCY"
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of confirmation"
        default: null

  - name: PesticideProduct
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trade name of the product"
        constraints: "1..120 chars"
      - name: epa_reg_no
        type: string
        source: input
        description: "EPA registration number"
        constraints: "1..32 chars, unique across PesticideProduct"
      - name: active_ingredient
        type: enum
        source: input
        description: "Active ingredient; re-entry interval conflicts are evaluated per active_ingredient"
        constraints: "one of BTI, METHOPRENE, PERMETHRIN, MALATHION, NALED"
      - name: application_method
        type: enum
        source: input
        description: "Application method the label permits; must equal the TreatmentPlan.treatment_type of any route that uses it"
        constraints: "one of LARVICIDE, ADULTICIDE, AERIAL"
      - name: label_rate_ml_per_acre
        type: number
        source: input
        description: "Label application rate in millilitres per acre"
        constraints: "> 0.0"
      - name: reentry_interval_hours
        type: integer
        source: input
        description: "Label re-entry interval in hours, used by validations priority 15"
        constraints: ">= 0"
      - name: cost_cents_per_liter
        type: integer
        source: input
        description: "Acquisition cost in integer cents per litre, used by calculations.treatment_cost_allocation"
        constraints: ">= 0"
      - name: restricted_use
        type: boolean
        source: input
        description: "Whether the label is restricted-use; reporting only"
        default: false
      - name: received_total_ml
        type: number
        source: input
        description: "Total millilitres ever received into district stock; increased or decreased by inventory adjustments"
        constraints: "> 0.0, 2 decimal places"
      - name: on_hand_ml
        type: number
        source: computed
        description: "Unreserved stock; initialised to received_total_ml at creation"
        constraints: ">= 0.00, 2 decimal places"
      - name: committed_ml
        type: number
        source: computed
        description: "Stock reserved by TreatmentRoutes in status COMMITTED"
        default: 0.00
        constraints: ">= 0.00, 2 decimal places"
      - name: applied_ml
        type: number
        source: computed
        description: "Stock consumed by TreatmentRoutes in status EXECUTED or VERIFIED"
        default: 0.00
        constraints: ">= 0.00, 2 decimal places"

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Licensed applicator / field technician name"
        constraints: "1..120 chars"
      - name: license_no
        type: string
        source: input
        description: "State applicator licence number"
        constraints: "1..32 chars, unique across Applicator"
      - name: license_category
        type: enum
        source: input
        description: "Licence class; coverage is LARVICIDE_ONLY -> {LARVICIDE}, ADULTICIDE -> {LARVICIDE, ADULTICIDE}, AERIAL -> {LARVICIDE, ADULTICIDE, AERIAL}"
        constraints: "one of LARVICIDE_ONLY, ADULTICIDE, AERIAL"
      - name: license_expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the licence expires; valid through that date inclusive"
      - name: status
        type: enum
        source: computed
        description: "Duty status; SUSPENDED applicators cannot take new routes or assignments"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: assigned_route_count
        type: integer
        source: computed
        description: "Number of TreatmentRoutes of this applicator in status COMMITTED, EXECUTED, or VERIFIED"
        default: 0
        constraints: ">= 0"

  - name: TreatmentPlan
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area to be treated"
      - name: trigger_assessment_id
        type: string
        source: input
        description: "FK -> RiskAssessment.id; the surveillance evidence justifying the plan; must belong to the same service_area_id"
      - name: treatment_type
        type: enum
        source: input
        description: "Treatment modality of the whole plan"
        constraints: "one of LARVICIDE, ADULTICIDE, AERIAL"
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle; see state_machines.TreatmentPlan"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RETURNED, APPROVED, SCHEDULED, IN_PROGRESS, SUSPENDED, COMPLETED, CANCELLED"
      - name: required_approvals
        type: integer
        source: computed
        description: "2 when treatment_type == AERIAL, else 1"
        constraints: "1 or 2"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the VectorEcologist who submitted the current revision; cleared on RETURNED -> DRAFT"
        default: null
      - name: approver_user_ids
        type: array
        source: computed
        description: "Ordered list of distinct AbatementManager X-User-IDs that have approved the current revision; cleared on RETURNED -> DRAFT"
        default: []
      - name: notification_required
        type: boolean
        source: computed
        description: "True when treatment_type is ADULTICIDE or AERIAL"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this plan has been RETURNED"
        default: 0
        constraints: ">= 0"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Operational start instant supplied with the SCHEDULE action"
        default: null
      - name: estimated_total_ml
        type: number
        source: computed
        description: "Sum of TreatmentRoute.estimated_volume_ml over routes of this plan in status COMMITTED, EXECUTED, or VERIFIED"
        default: 0.00
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Material component from calculations.treatment_cost_allocation; written on COMPLETE, reset to 0 on COMPLETED -> IN_PROGRESS"
        default: 0
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "Labour component from calculations.treatment_cost_allocation"
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "material_cost_cents + labor_cost_cents"
        default: 0
      - name: admin_fee_rate
        type: number
        source: computed
        description: "Tier rate selected from subtotal_cents by calculations.treatment_cost_allocation"
        default: 0.0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * admin_fee_rate)"
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "subtotal_cents + admin_fee_cents"
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of COMPLETE; cleared on COMPLETED -> IN_PROGRESS"
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: "Free-text reason supplied with the CANCEL action"
        default: null
      - name: return_reason
        type: string
        source: input
        description: "Free-text reason supplied with the RETURN action"
        default: null

  - name: TreatmentRoute
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: system
        description: "FK -> TreatmentPlan.id; taken from the creation path"
      - name: applicator_id
        type: string
        source: input
        description: "FK -> Applicator.id; the applicator who will run the route"
      - name: pesticide_product_id
        type: string
        source: input
        description: "FK -> PesticideProduct.id; the product to be applied"
      - name: route_code
        type: string
        source: input
        description: "Route label"
        constraints: "1..16 chars, unique within its TreatmentPlan"
      - name: window_start
        type: datetime
        source: input
        description: "Planned occupancy start of the route"
      - name: window_end
        type: datetime
        source: input
        description: "Planned occupancy end of the route; must be strictly after window_start"
      - name: planned_acres
        type: number
        source: input
        description: "Acres the route intends to treat"
        constraints: "> 0.0, 2 decimal places"
      - name: center_x_m
        type: integer
        source: input
        description: "District-grid easting of the route centre, in metres"
      - name: center_y_m
        type: integer
        source: input
        description: "District-grid northing of the route centre, in metres"
      - name: swath_radius_m
        type: integer
        source: input
        description: "Half-width of the treated swath in metres; added to a SensitiveSite buffer when testing encroachment"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Route lifecycle; see state_machines.TreatmentRoute"
        default: PLANNED
        constraints: "one of PLANNED, COMMITTED, EXECUTED, VERIFIED, VOIDED, RELEASED"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between window_start and window_end"
        constraints: ">= 1"
      - name: estimated_volume_ml
        type: number
        source: computed
        description: "Output of calculations.route_pesticide_volume variant ESTIMATED, written on COMMIT"
        default: 0.00
      - name: actual_acres
        type: number
        source: input
        description: "Acres actually treated, supplied with the EXECUTE action"
        default: null
        constraints: "> 0.0 when supplied"
      - name: wind_speed_mph
        type: number
        source: input
        description: "Wind speed measured at application, supplied with the EXECUTE action; drives the drift adjustment factor"
        default: null
        constraints: ">= 0.0 when supplied"
      - name: actual_volume_ml
        type: number
        source: computed
        description: "Output of calculations.route_pesticide_volume variant ACTUAL, written on EXECUTE"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of EXECUTE"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Free-text reason supplied with the VOID action"
        default: null

  - name: Notification
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: system
        description: "FK -> TreatmentPlan.id; taken from the creation path"
      - name: sensitive_site_id
        type: string
        source: input
        description: "FK -> SensitiveSite.id; the registered site being notified; must belong to the plan's service_area_id"
      - name: channel
        type: enum
        source: input
        description: "Delivery channel of record"
        default: EMAIL
        constraints: "one of EMAIL, SMS, PHONE"
      - name: status
        type: enum
        source: computed
        description: "Delivery lifecycle; see state_machines.Notification"
        default: QUEUED
        constraints: "one of QUEUED, SENT, ACKNOWLEDGED, FAILED, EXPIRED, UNDELIVERABLE"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of SEND attempts made"
        default: 0
        constraints: "0..NOTIFICATION_MAX_ATTEMPTS"
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent SEND"
        default: null
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Logical-clock instant the site operator acknowledged"
        default: null
      - name: failure_reason
        type: string
        source: input
        description: "Free-text reason supplied with the FAIL action"
        default: null

  - name: ServiceRequest
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area the complaint concerns"
      - name: assigned_applicator_id
        type: string
        source: computed
        description: "FK -> Applicator.id; set by the ASSIGN action, cleared by REOPEN"
        default: null
      - name: reporter_contact
        type: string
        source: input
        description: "Complainant phone or email of record"
        constraints: "1..120 chars"
      - name: category
        type: enum
        source: input
        description: "Complaint category"
        constraints: "one of STANDING_WATER, ADULT_ACTIVITY, DEAD_BIRD, SPRAY_CONCERN"
      - name: description
        type: string
        source: input
        description: "Complainant narrative"
        constraints: "1..500 chars"
      - name: x_m
        type: integer
        source: input
        description: "District-grid easting of the reported location, in metres"
      - name: y_m
        type: integer
        source: input
        description: "District-grid northing of the reported location, in metres"
      - name: reported_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Resident who filed the request"
      - name: handling_status
        type: enum
        source: computed
        description: "Workflow axis of state_machines.ServiceRequest, independent of verification_status"
        default: RECEIVED
        constraints: "one of RECEIVED, TRIAGED, ASSIGNED, INSPECTED, RESOLVED, CLOSED"
      - name: verification_status
        type: enum
        source: computed
        description: "Field-evidence axis of state_machines.ServiceRequest, independent of handling_status"
        default: UNVERIFIED
        constraints: "one of UNVERIFIED, FIELD_CONFIRMED, UNFOUNDED"
      - name: priority
        type: enum
        source: computed
        description: "Service level; set at TRIAGE and raised (never lowered) by posture escalation"
        default: ROUTINE
        constraints: "one of ROUTINE, PRIORITY, URGENT"
      - name: triaged_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent TRIAGE (including a TRIAGE reached by REOPEN)"
        default: null
      - name: due_at
        type: datetime
        source: computed
        description: "Output of calculations.service_request_due_at; null until first TRIAGE"
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent RESOLVE"
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times this request has been reopened"
        default: 0
        constraints: ">= 0"
      - name: resolution_note
        type: string
        source: input
        description: "Free-text note supplied with the RESOLVE action"
        default: null

state_machines:
  - entity: TrapCollection
    shape: linear_with_void
    initial_state: LOGGED
    terminal_states: [VOIDED]
    transitions:
      - from: LOGGED
        to: SUBMITTED
        trigger: "POST /trap-collections/{id}/transitions with action=SUBMIT"
        actor: FieldTech
        preconditions:
          - "status == LOGGED"
          - "X-User-ID == TrapCollection.recorded_by_applicator_id (only the logging technician may submit)"
          - "date(logical_now) - collection_date <= TRAP_COLLECTION_MAX_AGE_DAYS days (inclusive; exactly 7 days still passes)"
        side_effects:
          - "The collection becomes eligible for calculations.trap_abundance_index and for LabPool creation."
          - "Every RiskAssessment of the trap site's ServiceArea whose status == OPEN gets is_stale = true and stale_reason = NEW_COLLECTION."
      - from: SUBMITTED
        to: POOLED
        trigger: "system, on the first successful POST /trap-collections/{id}/lab-pools"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "pooled_mosquito_count += LabPool.pool_size of the created pool."
        note: "Later pools on an already POOLED collection only add to pooled_mosquito_count; the status stays POOLED."
      - from: LOGGED
        to: VOIDED
        trigger: "POST /trap-collections/{id}/transitions with action=VOID"
        actor: AbatementManager
        preconditions:
          - "status == LOGGED"
        side_effects:
          - "The collection is permanently excluded from calculations.trap_abundance_index."
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /trap-collections/{id}/transitions with action=VOID"
        actor: AbatementManager
        preconditions:
          - "status == SUBMITTED"
          - "no LabPool exists whose trap_collection_id == this collection (cross-entity: LabPool)"
        side_effects:
          - "The collection is permanently excluded from calculations.trap_abundance_index."
          - "Every RiskAssessment of the area whose status == OPEN gets is_stale = true and stale_reason = NEW_COLLECTION."

  - entity: LabPool
    shape: cyclic
    initial_state: CREATED
    terminal_states: [RESULT_POSITIVE, RESULT_NEGATIVE, DISCARDED]
    transitions:
      - from: CREATED
        to: IN_TESTING
        trigger: "POST /lab-pools/{id}/transitions with action=START_TEST"
        actor: LabAnalyst
        preconditions:
          - "status == CREATED"
          - "parent TrapCollection.status IN {SUBMITTED, POOLED} (cross-entity: TrapCollection)"
        side_effects:
          - "retest_count unchanged (this is the first test, not a retest)."
      - from: INVALID
        to: IN_TESTING
        trigger: "POST /lab-pools/{id}/transitions with action=START_TEST"
        actor: LabAnalyst
        preconditions:
          - "status == INVALID"
          - "retest_count < MAX_POOL_RETESTS (2); retest_count == 2 is rejected with ERR_RETEST_LIMIT_EXCEEDED"
        side_effects:
          - "retest_count += 1."
        note: "The revision loop INVALID -> IN_TESTING -> INVALID is the cyclic shape of this machine."
      - from: IN_TESTING
        to: RESULT_POSITIVE
        trigger: "POST /lab-pools/{id}/transitions with action=RESULT, result=POSITIVE"
        actor: LabAnalyst
        preconditions:
          - "status == IN_TESTING"
        side_effects:
          - "result_recorded_at = logical_now; ct_value stored when supplied."
          - "CASCADE hop 1: because this pool resulted positive, parent TrapCollection.positive_pool_count += 1 and TrapCollection.wnv_detected = true."
          - "CASCADE hop 2: because that collection now has wnv_detected == true, its TrapSite.season_positive_count += 1 and TrapSite.last_positive_at = logical_now."
          - "CASCADE hop 3: because that trap site just recorded a new positive, every RiskAssessment of the site's ServiceArea with status == OPEN gets is_stale = true and stale_reason = LAB_RESULT."
          - "CASCADE hop 4: because a positive now exists inside POSITIVE_ESCALATION_WINDOW_DAYS for the area, ServiceArea.risk_posture and posture_source are recomputed by calculations.area_risk_posture."
          - "CASCADE hop 5: because the area's risk_posture escalated, every ServiceRequest of that area with handling_status IN {RECEIVED, TRIAGED, ASSIGNED, INSPECTED} has priority raised per calculations.posture_priority_escalation and, when triaged_at is not null, due_at recomputed by calculations.service_request_due_at from the unchanged triaged_at."
      - from: IN_TESTING
        to: RESULT_NEGATIVE
        trigger: "POST /lab-pools/{id}/transitions with action=RESULT, result=NEGATIVE"
        actor: LabAnalyst
        preconditions:
          - "status == IN_TESTING"
        side_effects:
          - "result_recorded_at = logical_now."
          - "Every RiskAssessment of the area with status == OPEN gets is_stale = true and stale_reason = LAB_RESULT."
      - from: IN_TESTING
        to: INVALID
        trigger: "POST /lab-pools/{id}/transitions with action=RESULT, result=INVALID"
        actor: LabAnalyst
        preconditions:
          - "status == IN_TESTING"
        side_effects:
          - "result_recorded_at = logical_now; retest_count unchanged."
          - "The pool leaves both minimum_infection_rate variant input sets until it is retested."
      - from: INVALID
        to: DISCARDED
        trigger: "POST /lab-pools/{id}/transitions with action=DISCARD"
        actor: LabAnalyst
        preconditions:
          - "status == INVALID"
        side_effects:
          - "parent TrapCollection.pooled_mosquito_count -= pool_size."
          - "Every RiskAssessment of the area with status == OPEN gets is_stale = true and stale_reason = LAB_RESULT."

  - entity: RiskAssessment
    shape: linear_with_supersede
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /risk-assessments/{id}/confirm"
        actor: VectorEcologist
        preconditions:
          - "status == OPEN"
        side_effects:
          - "mir_confirmed and vector_index_confirmed are written from calculations.minimum_infection_rate / calculations.vector_index variant CONFIRMED, evaluated against the pool set as it stands at confirmation time."
          - "confirmed_at = logical_now."
          - "Any other RiskAssessment of the same ServiceArea whose status == CONFIRMED transitions to SUPERSEDED."
          - "ServiceArea.latest_confirmed_vector_index = this assessment's vector_index_confirmed; ServiceArea.risk_posture and posture_source recomputed by calculations.area_risk_posture; posture_at_confirm records the resulting posture."
          - "When the recomputed risk_posture is strictly higher than before, every ServiceRequest of the area with handling_status IN {RECEIVED, TRIAGED, ASSIGNED, INSPECTED} has priority raised per calculations.posture_priority_escalation and due_at recomputed when triaged_at is not null."
      - from: OPEN
        to: SUPERSEDED
        trigger: "system, on POST /service-areas/{id}/risk-assessments creating a newer assessment for the same area"
        actor: system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "No index recomputation; the superseded assessment keeps its provisional numbers as a historical record."
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system, on confirmation of a newer RiskAssessment of the same area"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "ServiceArea.latest_confirmed_vector_index now reflects the newer assessment."

  - entity: TreatmentPlan
    shape: branching_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /treatment-plans/{id}/transitions with action=SUBMIT"
        actor: VectorEcologist
        preconditions:
          - "status == DRAFT"
          - "at least one TreatmentRoute of this plan has status == PLANNED"
          - "the plan's trigger_assessment (RiskAssessment.id == trigger_assessment_id) has status == CONFIRMED (cross-entity: RiskAssessment)"
        side_effects:
          - "submitted_by_user_id = X-User-ID of the caller."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /treatment-plans/{id}/transitions with action=APPROVE when the quorum is not yet met"
        actor: AbatementManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "X-User-ID NOT IN approver_user_ids"
          - "len(approver_user_ids) + 1 < required_approvals"
        side_effects:
          - "X-User-ID appended to approver_user_ids; status stays SUBMITTED because the AERIAL quorum of 2 distinct managers is not yet met."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /treatment-plans/{id}/transitions with action=APPROVE when this approval completes the quorum"
        actor: AbatementManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "X-User-ID NOT IN approver_user_ids"
          - "len(approver_user_ids) + 1 == required_approvals"
        side_effects:
          - "X-User-ID appended to approver_user_ids."
          - "Routes may now be COMMITTED and Notifications may now be issued."
        note: "This is the join of the branching shape: LARVICIDE / ADULTICIDE plans join after one approval, AERIAL plans only after two distinct approvers."
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /treatment-plans/{id}/transitions with action=RETURN"
        actor: AbatementManager
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "revision_count += 1; return_reason stored."
      - from: RETURNED
        to: DRAFT
        trigger: "POST /treatment-plans/{id}/transitions with action=REVISE"
        actor: VectorEcologist
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "approver_user_ids reset to []; submitted_by_user_id reset to null."
        note: "DRAFT -> SUBMITTED -> RETURNED -> DRAFT is the revision cycle of this machine."
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /treatment-plans/{id}/transitions with action=SCHEDULE, scheduled_start_at supplied"
        actor: AbatementManager
        preconditions:
          - "status == APPROVED"
          - "at least one TreatmentRoute of this plan has status == COMMITTED and no route of this plan is still PLANNED"
          - "scheduled_start_at - logical_now >= AERIAL_NOTIFICATION_LEAD_HOURS when treatment_type == AERIAL, else >= GROUND_NOTIFICATION_LEAD_HOURS (inclusive: exactly the lead passes)"
          - "every Notification of this plan has status IN {ACKNOWLEDGED, EXPIRED} (cross-entity: Notification)"
          - "for every SensitiveSite of the plan's ServiceArea that is encroached by a COMMITTED route of this plan (see calculations.sensitive_site_encroachment) there exists a Notification of this plan for that site with status IN {ACKNOWLEDGED, EXPIRED}"
        side_effects:
          - "scheduled_start_at stored."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /treatment-plans/{id}/transitions with action=START"
        actor: AbatementManager
        preconditions:
          - "status == SCHEDULED"
          - "logical_now >= scheduled_start_at (inclusive)"
        side_effects:
          - "Routes of this plan may now be EXECUTED."
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /treatment-plans/{id}/transitions with action=SUSPEND"
        actor: AbatementManager
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "Route EXECUTE is blocked while the plan is SUSPENDED."
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /treatment-plans/{id}/transitions with action=RESUME"
        actor: AbatementManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "Route EXECUTE is unblocked."
        note: "IN_PROGRESS -> SUSPENDED -> IN_PROGRESS is the weather-hold cycle."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/transitions with action=COMPLETE"
        actor: AbatementManager
        preconditions:
          - "status == IN_PROGRESS"
          - "every TreatmentRoute of this plan has status IN {VERIFIED, VOIDED, RELEASED}"
          - "at least one TreatmentRoute of this plan has status == VERIFIED"
        side_effects:
          - "material_cost_cents, labor_cost_cents, subtotal_cents, admin_fee_rate, admin_fee_cents, total_cost_cents written from calculations.treatment_cost_allocation."
          - "completed_at = logical_now."
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "system, when the last VERIFIED route of a COMPLETED plan is voided (see state_machines.TreatmentRoute VOID cascade hop 3)"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "after the void, no TreatmentRoute of this plan has status IN {EXECUTED, VERIFIED}"
        side_effects:
          - "completed_at = null; material_cost_cents, labor_cost_cents, subtotal_cents, admin_fee_cents, total_cost_cents reset to 0 and admin_fee_rate reset to 0.0."
        note: "This revert edge is what makes the plan machine non-linear alongside the RETURNED revision cycle."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/transitions with action=CANCEL"
        actor: AbatementManager
        preconditions:
          - "status IN {DRAFT, SUBMITTED, RETURNED, APPROVED, SCHEDULED, SUSPENDED}"
        side_effects:
          - "cancel_reason stored."
          - "Every TreatmentRoute of this plan with status == PLANNED becomes RELEASED with no inventory movement; every route with status == COMMITTED becomes RELEASED and releases its reservation (PesticideProduct.committed_ml -= estimated_volume_ml, on_hand_ml += estimated_volume_ml, Applicator.assigned_route_count -= 1)."
          - "Every Notification of this plan with status IN {QUEUED, SENT} becomes EXPIRED."
        note: "The same CANCEL edge is available from SUBMITTED, RETURNED, APPROVED, SCHEDULED, and SUSPENDED with identical side effects."

  - entity: TreatmentRoute
    shape: linear_with_compensation
    initial_state: PLANNED
    terminal_states: [VOIDED, RELEASED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /treatment-routes/{id}/transitions with action=COMMIT"
        actor: AbatementManager
        preconditions:
          - "status == PLANNED"
          - "parent TreatmentPlan.status == APPROVED (cross-entity: TreatmentPlan) else ERR_PLAN_NOT_APPROVED"
          - "Applicator.status == ACTIVE (cross-entity: Applicator) and license_expires_on >= date(window_start) and the licence category covers PesticideProduct.application_method, else ERR_APPLICATOR_LICENSE_INVALID"
          - "PesticideProduct.application_method == TreatmentPlan.treatment_type else ERR_PRODUCT_METHOD_MISMATCH"
          - "when TreatmentPlan.treatment_type IN {ADULTICIDE, AERIAL}: ServiceArea.risk_posture IN {ELEVATED, EMERGENCY} else ERR_POSTURE_TOO_LOW"
          - "sensitive-site clearance per validations priority 14 else ERR_SENSITIVE_SITE_NOT_CLEARED"
          - "re-entry interval per validations priority 15 else ERR_REENTRY_INTERVAL_VIOLATION"
          - "applicator occupancy per validations priority 16 else ERR_APPLICATOR_ROUTE_CONFLICT"
          - "ServiceArea.seasonal_application_count < MAX_SEASONAL_APPLICATIONS else ERR_SEASONAL_LIMIT_EXCEEDED"
          - "PesticideProduct.on_hand_ml >= estimated_volume_ml else ERR_INSUFFICIENT_INVENTORY"
        side_effects:
          - "estimated_volume_ml written from calculations.route_pesticide_volume variant ESTIMATED."
          - "PesticideProduct.on_hand_ml -= estimated_volume_ml; PesticideProduct.committed_ml += estimated_volume_ml; PesticideProduct.version += 1."
          - "Applicator.assigned_route_count += 1."
          - "TreatmentPlan.estimated_total_ml recomputed as the sum of estimated_volume_ml over routes of the plan in status COMMITTED, EXECUTED, or VERIFIED."
      - from: COMMITTED
        to: EXECUTED
        trigger: "POST /treatment-routes/{id}/transitions with action=EXECUTE, actual_acres and wind_speed_mph supplied"
        actor: FieldTech
        preconditions:
          - "status == COMMITTED"
          - "X-User-ID == TreatmentRoute.applicator_id (only the assigned applicator may execute)"
          - "parent TreatmentPlan.status == IN_PROGRESS (cross-entity: TreatmentPlan) else ERR_PLAN_NOT_IN_PROGRESS"
          - "logical_now >= window_start (inclusive)"
          - "PesticideProduct.on_hand_ml + estimated_volume_ml - actual_volume_ml >= 0.00 else ERR_INSUFFICIENT_INVENTORY"
        side_effects:
          - "actual_volume_ml written from calculations.route_pesticide_volume variant ACTUAL; executed_at = logical_now."
          - "PesticideProduct.committed_ml -= estimated_volume_ml; PesticideProduct.applied_ml += actual_volume_ml; PesticideProduct.on_hand_ml += (estimated_volume_ml - actual_volume_ml); PesticideProduct.version += 1."
          - "ServiceArea.seasonal_application_count += 1."
      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /treatment-routes/{id}/transitions with action=VERIFY"
        actor: AbatementManager
        preconditions:
          - "status == EXECUTED"
        side_effects:
          - "The route becomes eligible for calculations.treatment_cost_allocation."
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /treatment-routes/{id}/transitions with action=VOID"
        actor: AbatementManager
        preconditions:
          - "status IN {EXECUTED, VERIFIED}"
        side_effects:
          - "void_reason stored."
          - "CASCADE hop 1: because the application record is voided, PesticideProduct.applied_ml -= actual_volume_ml and PesticideProduct.on_hand_ml += actual_volume_ml (PesticideProduct.version += 1), so on_hand_ml + committed_ml + applied_ml stays equal to received_total_ml."
          - "CASCADE hop 2: because that product usage no longer counts for the area, ServiceArea.seasonal_application_count -= 1."
          - "CASCADE hop 3: because the plan now has no route in {EXECUTED, VERIFIED}, a COMPLETED parent TreatmentPlan reverts to IN_PROGRESS, clears completed_at, and zeroes its cost fields."
          - "Applicator.assigned_route_count -= 1."
          - "TreatmentPlan.estimated_total_ml recomputed."
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /treatment-routes/{id}/transitions with action=VOID"
        actor: AbatementManager
        preconditions:
          - "status == VERIFIED"
        side_effects:
          - "Identical to the EXECUTED -> VOIDED edge, including all three cascade hops."
      - from: PLANNED
        to: RELEASED
        trigger: "POST /treatment-routes/{id}/transitions with action=RELEASE"
        actor: AbatementManager
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "No inventory movement (nothing was reserved)."
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /treatment-routes/{id}/transitions with action=RELEASE"
        actor: AbatementManager
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "PesticideProduct.committed_ml -= estimated_volume_ml; PesticideProduct.on_hand_ml += estimated_volume_ml; PesticideProduct.version += 1."
          - "Applicator.assigned_route_count -= 1; TreatmentPlan.estimated_total_ml recomputed."

  - entity: Notification
    shape: cyclic_retry
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, EXPIRED, UNDELIVERABLE]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /notifications/{id}/transitions with action=SEND"
        actor: DistrictAdmin
        preconditions:
          - "status == QUEUED"
          - "parent TreatmentPlan.status IN {APPROVED, SCHEDULED} (cross-entity: TreatmentPlan)"
          - "attempt_count < NOTIFICATION_MAX_ATTEMPTS else ERR_NOTIFICATION_ATTEMPTS_EXHAUSTED"
        side_effects:
          - "attempt_count += 1; sent_at = logical_now."
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /notifications/{id}/transitions with action=ACKNOWLEDGE"
        actor: SensitiveSiteOperator
        preconditions:
          - "status == SENT"
          - "X-User-ID == Notification.sensitive_site_id (the acknowledging operator must own the notified site) else ERR_NOT_RESOURCE_OWNER"
          - "logical_now <= sent_at + NOTIFICATION_ACK_WINDOW_HOURS (inclusive: exactly 24h still acknowledges)"
        side_effects:
          - "acknowledged_at = logical_now."
      - from: SENT
        to: FAILED
        trigger: "POST /notifications/{id}/transitions with action=FAIL"
        actor: DistrictAdmin
        preconditions:
          - "status == SENT"
        side_effects:
          - "failure_reason stored."
      - from: FAILED
        to: QUEUED
        trigger: "POST /notifications/{id}/transitions with action=REQUEUE"
        actor: DistrictAdmin
        preconditions:
          - "status == FAILED"
          - "attempt_count < NOTIFICATION_MAX_ATTEMPTS (3); attempt_count == 3 is rejected with ERR_NOTIFICATION_ATTEMPTS_EXHAUSTED"
        side_effects:
          - "sent_at retained as the previous attempt's instant until the next SEND overwrites it."
        note: "QUEUED -> SENT -> FAILED -> QUEUED is the retry cycle of this machine."
      - from: FAILED
        to: UNDELIVERABLE
        trigger: "POST /notifications/{id}/transitions with action=ABANDON"
        actor: DistrictAdmin
        preconditions:
          - "status == FAILED"
        side_effects:
          - "The notification can no longer satisfy the SCHEDULE precondition, so the plan cannot be scheduled until a replacement notification for the same site reaches ACKNOWLEDGED or EXPIRED."
      - from: SENT
        to: EXPIRED
        trigger: "POST /notifications/{id}/transitions with action=EXPIRE"
        actor: DistrictAdmin
        preconditions:
          - "status == SENT"
          - "logical_now > sent_at + NOTIFICATION_ACK_WINDOW_HOURS (strictly after; at exactly 24h EXPIRE is rejected with ERR_ACK_WINDOW_OPEN)"
        side_effects:
          - "The un-acknowledged notice counts as served for the SCHEDULE precondition."
      - from: QUEUED
        to: EXPIRED
        trigger: "system, on TreatmentPlan CANCEL"
        actor: system
        preconditions:
          - "status IN {QUEUED, SENT}"
        side_effects:
          - "No further delivery attempts are possible."

  - entity: ServiceRequest
    shape: parallel_dimensions_with_reopen_cycle
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    dimensions:
      handling_status: "RECEIVED -> TRIAGED -> ASSIGNED -> INSPECTED -> RESOLVED -> CLOSED, with RESOLVED -> TRIAGED reopen"
      verification_status: "UNVERIFIED -> FIELD_CONFIRMED | UNFOUNDED, advanced only by INSPECT and reset only by REOPEN; it evolves on its own axis and never gates handling_status except at RESOLVE"
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /service-requests/{id}/transitions with action=TRIAGE, priority supplied"
        actor: AbatementManager
        preconditions:
          - "handling_status == RECEIVED"
        side_effects:
          - "priority = max(supplied priority, floor implied by ServiceArea.risk_posture per calculations.posture_priority_escalation)."
          - "triaged_at = logical_now; due_at = calculations.service_request_due_at."
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /service-requests/{id}/transitions with action=ASSIGN, assigned_applicator_id supplied"
        actor: AbatementManager
        preconditions:
          - "handling_status == TRIAGED"
          - "the referenced Applicator.status == ACTIVE (cross-entity: Applicator) else ERR_APPLICATOR_SUSPENDED"
        side_effects:
          - "assigned_applicator_id stored."
      - from: ASSIGNED
        to: INSPECTED
        trigger: "POST /service-requests/{id}/transitions with action=INSPECT, verification_status supplied"
        actor: FieldTech
        preconditions:
          - "handling_status == ASSIGNED"
          - "X-User-ID == assigned_applicator_id else ERR_NOT_RESOURCE_OWNER"
          - "when verification_status is supplied it MUST be FIELD_CONFIRMED or UNFOUNDED (ERR_VALIDATION otherwise); it MAY be omitted, which records an inconclusive visit"
        side_effects:
          - "handling_status advances to INSPECTED. When verification_status was supplied it is written on its own axis; when it was omitted the verification axis stays UNVERIFIED, which later blocks RESOLVE with ERR_REQUEST_NOT_VERIFIED until a re-inspection supplies a value."
      - from: INSPECTED
        to: INSPECTED
        trigger: "POST /service-requests/{id}/transitions with action=INSPECT, verification_status supplied"
        actor: FieldTech
        preconditions:
          - "handling_status == INSPECTED"
          - "X-User-ID == assigned_applicator_id else ERR_NOT_RESOURCE_OWNER"
          - "verification_status IS supplied and IN {FIELD_CONFIRMED, UNFOUNDED} (a re-inspection may not blank the axis again)"
        side_effects:
          - "verification_status overwritten on its own axis; handling_status stays INSPECTED."
        note: "This self-loop lets an inconclusive first visit be upgraded, and is the second place the two axes are shown to move independently."
      - from: INSPECTED
        to: RESOLVED
        trigger: "POST /service-requests/{id}/transitions with action=RESOLVE, resolution_note supplied"
        actor: FieldTech
        preconditions:
          - "handling_status == INSPECTED"
          - "X-User-ID == assigned_applicator_id else ERR_NOT_RESOURCE_OWNER"
          - "verification_status != UNVERIFIED else ERR_REQUEST_NOT_VERIFIED"
        side_effects:
          - "resolved_at = logical_now; resolution_note stored."
          - "ServiceArea.request_open_count -= 1 and ServiceArea.request_resolved_count += 1, keeping request_open_count + request_resolved_count + request_closed_count == request_total_count."
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /service-requests/{id}/transitions with action=REOPEN"
        actor: AbatementManager
        preconditions:
          - "handling_status == RESOLVED"
          - "logical_now <= resolved_at + REOPEN_WINDOW_DAYS days (inclusive) else ERR_REOPEN_WINDOW_EXPIRED"
        side_effects:
          - "reopen_count += 1; verification_status reset to UNVERIFIED on its own axis; assigned_applicator_id cleared."
          - "triaged_at = logical_now; due_at recomputed by calculations.service_request_due_at from the retained priority."
          - "ServiceArea.request_resolved_count -= 1 and ServiceArea.request_open_count += 1, preserving the same partition identity."
        note: "RESOLVED -> TRIAGED -> ... -> RESOLVED is the reopen cycle of this machine."
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /service-requests/{id}/transitions with action=CLOSE"
        actor: AbatementManager
        preconditions:
          - "handling_status == RESOLVED"
        side_effects:
          - "ServiceArea.request_resolved_count -= 1 and ServiceArea.request_closed_count += 1."
      - from: RECEIVED
        to: CLOSED
        trigger: "POST /service-requests/{id}/transitions with action=CLOSE"
        actor: AbatementManager
        preconditions:
          - "handling_status == RECEIVED"
        side_effects:
          - "ServiceArea.request_open_count -= 1 and ServiceArea.request_closed_count += 1."
        note: "Duplicate or out-of-district complaints are closed without triage; verification_status stays UNVERIFIED."

concurrency_rules:
  - rule_id: assessment-create-stale-area
    parent_entity: ServiceArea
    write_endpoint: "POST /service-areas/{id}/risk-assessments"
    occ_field: "expected_service_area_version"
    description: |
      Creating a RiskAssessment against a ServiceArea whose version has advanced
      since the client last observed it is rejected. A newly created assessment
      legitimately supersedes the area's prior OPEN assessment, so a writer whose
      view of the area is stale would silently discard evidence another writer
      already folded into a newer assessment.
    error_id: ERR_STALE_SERVICE_AREA_VERSION
    http_status: 412

  - rule_id: inventory-adjustment-stale-product
    parent_entity: PesticideProduct
    write_endpoint: "POST /pesticide-products/{id}/adjustments"
    occ_field: "expected_product_version"
    description: |
      Posting a stock adjustment against a PesticideProduct whose version has
      advanced since the client last observed it is rejected. Adjustments are
      additive against received_total_ml and on_hand_ml, so a writer working from
      a stale reading of the ledger would double-count a receipt or drive on-hand
      stock negative.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

constants:
  # Every named constant used anywhere in this scaffold is declared here with an
  # explicit numeric value. Per-calculation `constants:` blocks repeat the subset
  # each formula consumes; the values below are authoritative.
  SURVEILLANCE_WINDOW_DAYS: 14
  ABUNDANCE_REFERENCE: 50.0
  MIR_MULTIPLIER: 1000
  MIR_REFERENCE: 10.0
  LARVAL_REFERENCE: 4.0
  DD_BASE_TEMP_C: 10.0
  DD_REFERENCE: 400.0
  W_ABUNDANCE: 0.40
  W_INFECTION: 0.35
  W_LARVAL: 0.15
  W_WEATHER: 0.10
  OUTBREAK_MULTIPLIER: 1.25
  OUTBREAK_ABUNDANCE_TRIGGER: 50.0
  POSTURE_ELEVATED_INDEX: 40.0
  POSTURE_EMERGENCY_INDEX: 70.0
  POSITIVE_ESCALATION_WINDOW_DAYS: 14
  POOL_MAX_MOSQUITOES: 50
  MAX_POOL_RETESTS: 2
  TRAP_COLLECTION_MAX_AGE_DAYS: 7
  WIND_DRIFT_TRIGGER_MPH: 8.0
  WIND_DRIFT_FACTOR: 1.10
  NO_DRIFT_FACTOR: 1.00
  LABOR_RATE_CENTS_PER_MINUTE: 120
  ADMIN_FEE_TIER1_MAX_CENTS: 100000
  ADMIN_FEE_TIER2_MAX_CENTS: 500000
  ADMIN_FEE_RATE_TIER1: 0.08
  ADMIN_FEE_RATE_TIER2: 0.06
  ADMIN_FEE_RATE_TIER3: 0.045
  ROUTE_SETUP_BUFFER_MINUTES: 45
  AERIAL_NOTIFICATION_LEAD_HOURS: 48
  GROUND_NOTIFICATION_LEAD_HOURS: 24
  NOTIFICATION_ACK_WINDOW_HOURS: 24
  NOTIFICATION_MAX_ATTEMPTS: 3
  MAX_SEASONAL_APPLICATIONS: 2
  REOPEN_WINDOW_DAYS: 30
  SLA_HOURS_ROUTINE: 120
  SLA_HOURS_PRIORITY: 48
  SLA_HOURS_URGENT: 24
  SENSITIVE_SITE_BUFFER_METERS_APIARY: 1600
  SENSITIVE_SITE_BUFFER_METERS_ORGANIC_FARM: 800
  SENSITIVE_SITE_BUFFER_METERS_AQUACULTURE: 1600
  SENSITIVE_SITE_BUFFER_METERS_SCHOOL: 400
  # The notation SENSITIVE_SITE_BUFFER_METERS[site_type] used elsewhere in this
  # scaffold resolves through exactly this map, with no other keys and no default.
  SENSITIVE_SITE_BUFFER_METERS:
    APIARY: 1600
    ORGANIC_FARM: 800
    AQUACULTURE: 1600
    SCHOOL: 400
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00.000Z"

calculations:
  - name: trap_abundance_index
    trigger: "On POST /service-areas/{id}/risk-assessments (writes RiskAssessment.abundance_index) and on GET /service-areas/{id}/surveillance-report"
    algorithm: aggregation
    formula: |
      window = the SURVEILLANCE_WINDOW_DAYS-day window ending on as_of_date inclusive
               (collection_date >= as_of_date - 13 days AND collection_date <= as_of_date)
      included = TrapCollection rows where
                   TrapSite.service_area_id == area.id
                   AND TrapSite.is_active == true
                   AND TrapCollection.status IN {SUBMITTED, POOLED}
                   AND TrapCollection.collection_date IN window
      total_females     = sum(included.female_count)
      total_trap_nights = sum(included.trap_nights)
      if total_trap_nights == 0: abundance_index = 0.00
      else: abundance_index = round_half_up(total_females / total_trap_nights, 2)
    input_set: "TrapCollections in status SUBMITTED or POOLED only; LOGGED and VOIDED collections and collections of inactive trap sites are excluded. No ordering or tie-break is required because the result is a ratio of two order-independent sums."
    constants:
      SURVEILLANCE_WINDOW_DAYS: 14
    precision: "2 decimal places, round_half_up; the empty input set yields exactly 0.00"

  - name: larval_index
    trigger: "On POST /service-areas/{id}/risk-assessments (writes RiskAssessment.larval_index) and on GET /service-areas/{id}/surveillance-report"
    algorithm: aggregation
    formula: |
      window = the SURVEILLANCE_WINDOW_DAYS-day window ending on as_of_date inclusive
      included = LarvalInspection rows where service_area_id == area.id
                   AND inspection_date IN window
      total_dips   = sum(included.dips)
      total_larvae = sum(included.larvae_count)
      if total_dips == 0: larval_index = 0.00
      else: larval_index = round_half_up(total_larvae / total_dips, 2)
    input_set: "All LarvalInspection rows of the area inside the window; LarvalInspection is append-only and has no status filter."
    constants:
      SURVEILLANCE_WINDOW_DAYS: 14
    precision: "2 decimal places, round_half_up; the empty input set yields exactly 0.00"

  - name: degree_day_accumulation
    trigger: "On POST /service-areas/{id}/weather-observations (writes WeatherObservation.degree_day), on POST /service-areas/{id}/risk-assessments (writes RiskAssessment.degree_days), and on GET /service-areas/{id}/surveillance-report"
    algorithm: chronological
    formula: |
      # Per-day value first, rounded, THEN summed. This ordering is pinned.
      for each WeatherObservation o of the area with
          o.obs_date >= area.season_start_date AND o.obs_date <= as_of_date:
        raw_day   = ((o.tmax_c + o.tmin_c) / 2) - DD_BASE_TEMP_C
        o.degree_day = max(0.0, round_half_up(raw_day, 1))     # rounded per day
      degree_days = round_half_up(sum(o.degree_day over the window), 1)
    input_set: "WeatherObservations of the area with obs_date in the closed interval [season_start_date, as_of_date]; observations before season start are excluded. Processing order is obs_date ASC, then created_at ASC for the (impossible by uniqueness) same-date case."
    constants:
      DD_BASE_TEMP_C: 10.0
    precision: |
      Each day's degree_day is rounded to 1 decimal place with round_half_up
      BEFORE the sum, and the negative daily values are clamped to 0.0 before
      summing. Summing the unrounded daily values and rounding once at the end is
      WRONG and yields a different number (e.g. days of 12.55 and 11.55 give
      12.6 + 11.6 = 24.2 under this rule, not round(24.10, 1) = 24.1).

  - name: minimum_infection_rate
    trigger: "On POST /service-areas/{id}/risk-assessments (writes mir_provisional) and on POST /risk-assessments/{id}/confirm (writes mir_confirmed)"
    algorithm: aggregation
    formula: |
      window = the SURVEILLANCE_WINDOW_DAYS-day window ending on as_of_date inclusive
      candidate_pools = LabPool rows whose parent TrapCollection satisfies
                          TrapSite.service_area_id == area.id
                          AND TrapCollection.collection_date IN window
                          AND TrapCollection.status IN {SUBMITTED, POOLED}
      included = candidate_pools filtered by the variant's status set (below)
      total_mosquitoes = sum(included.pool_size)
      positive_pools   = count(included where status == RESULT_POSITIVE)
      if total_mosquitoes == 0: mir = 0.00
      else: mir = round_half_up(positive_pools / total_mosquitoes * MIR_MULTIPLIER, 2)
    input_set: "Pools in status CREATED and DISCARDED are excluded by both variants. Pools in status INVALID are excluded by both variants. The variants differ only in how IN_TESTING pools are treated."
    constants:
      MIR_MULTIPLIER: 1000
      SURVEILLANCE_WINDOW_DAYS: 14
    precision: "2 decimal places, round_half_up; the empty input set yields exactly 0.00"
    variants:
      - name: PROVISIONAL
        when: "Evaluated at RiskAssessment creation and stored in mir_provisional"
        difference: "Status set is {IN_TESTING, RESULT_POSITIVE, RESULT_NEGATIVE}. A pool still in testing is treated as presumed negative: its pool_size enters the denominator while contributing nothing to the numerator, which dilutes the rate downward."
      - name: CONFIRMED
        when: "Evaluated at RiskAssessment confirmation and stored in mir_confirmed"
        difference: "Status set is {RESULT_POSITIVE, RESULT_NEGATIVE}. Pools still in testing are excluded from BOTH numerator and denominator, which raises the rate relative to PROVISIONAL for the same untouched data."

  - name: vector_index
    trigger: "On POST /service-areas/{id}/risk-assessments (writes vector_index_provisional) and on POST /risk-assessments/{id}/confirm (writes vector_index_confirmed)"
    algorithm: weighted_scoring
    formula: |
      abundance_component = min(100.00, round_half_up(abundance_index / ABUNDANCE_REFERENCE * 100, 2))
      infection_component = min(100.00, round_half_up(mir              / MIR_REFERENCE       * 100, 2))
      larval_component    = min(100.00, round_half_up(larval_index     / LARVAL_REFERENCE    * 100, 2))
      weather_component   = min(100.00, round_half_up(degree_days      / DD_REFERENCE        * 100, 2))

      base = W_ABUNDANCE * abundance_component
           + W_INFECTION * infection_component
           + W_LARVAL    * larval_component
           + W_WEATHER   * weather_component

      # Conditional non-linear branch: co-occurrence of any infection signal with
      # high adult abundance amplifies the index.
      if infection_component > 0.00 AND abundance_component >= OUTBREAK_ABUNDANCE_TRIGGER:
          base = base * OUTBREAK_MULTIPLIER

      vector_index = min(100.00, round_half_up(base, 2))
    input_set: "abundance_index, larval_index and degree_days come from this assessment's stored fields (identical for both variants). mir comes from minimum_infection_rate of the matching variant: mir_provisional for PROVISIONAL, mir_confirmed for CONFIRMED."
    constants:
      ABUNDANCE_REFERENCE: 50.0
      MIR_REFERENCE: 10.0
      LARVAL_REFERENCE: 4.0
      DD_REFERENCE: 400.0
      W_ABUNDANCE: 0.40
      W_INFECTION: 0.35
      W_LARVAL: 0.15
      W_WEATHER: 0.10
      OUTBREAK_MULTIPLIER: 1.25
      OUTBREAK_ABUNDANCE_TRIGGER: 50.0
    precision: "Each component is rounded to 2 decimals before weighting; the weighted sum is multiplied (when the branch fires) and only then rounded to 2 decimals. abundance_component == 50.00 exactly DOES fire the branch (>=)."
    variants:
      - name: PROVISIONAL
        when: "RiskAssessment creation"
        difference: "Consumes mir_provisional, which counts IN_TESTING pools as presumed-negative denominator mass."
      - name: CONFIRMED
        when: "RiskAssessment confirmation"
        difference: "Consumes mir_confirmed, which drops IN_TESTING pools entirely, so the same untouched surveillance data yields a strictly higher index whenever at least one pool is still in testing and at least one is positive."

  - name: area_risk_posture
    trigger: "On POST /risk-assessments/{id}/confirm and on the LabPool IN_TESTING -> RESULT_POSITIVE transition; writes ServiceArea.risk_posture and ServiceArea.posture_source"
    algorithm: threshold
    formula: |
      I = area.latest_confirmed_vector_index          # 0.00 when no assessment confirmed yet
      if   I >= POSTURE_EMERGENCY_INDEX: index_posture = EMERGENCY
      elif I >= POSTURE_ELEVATED_INDEX:  index_posture = ELEVATED
      else:                              index_posture = NORMAL

      positive_recent = EXISTS a LabPool with status == RESULT_POSITIVE
                        whose parent TrapCollection belongs to a TrapSite of this area
                        AND result_recorded_at >= logical_now - POSITIVE_ESCALATION_WINDOW_DAYS days
      override_posture = ELEVATED if positive_recent else NORMAL

      rank(NORMAL) = 0, rank(ELEVATED) = 1, rank(EMERGENCY) = 2
      risk_posture = the higher-ranked of index_posture and override_posture

      posture_source = POSITIVE_OVERRIDE when override_posture outranks index_posture
                       NO_ASSESSMENT     when no RiskAssessment of the area has ever been CONFIRMED
                                         and override_posture did not outrank
                       INDEX             otherwise
    input_set: "Only the single most recently CONFIRMED RiskAssessment of the area feeds I, via the denormalized ServiceArea.latest_confirmed_vector_index; earlier CONFIRMED assessments are SUPERSEDED and ignored. The positive-override scan covers all non-VOIDED collections of the area's trap sites."
    constants:
      POSTURE_ELEVATED_INDEX: 40.0
      POSTURE_EMERGENCY_INDEX: 70.0
      POSITIVE_ESCALATION_WINDOW_DAYS: 14
    precision: "Threshold comparisons are inclusive on the low side: exactly 40.00 is ELEVATED and exactly 70.00 is EMERGENCY."

  - name: posture_priority_escalation
    trigger: "On any recomputation of ServiceArea.risk_posture that raises its rank (LabPool RESULT_POSITIVE cascade hop 5, RiskAssessment confirmation), and at ServiceRequest TRIAGE as a floor"
    algorithm: threshold
    formula: |
      posture_floor(NORMAL)    = ROUTINE
      posture_floor(ELEVATED)  = PRIORITY
      posture_floor(EMERGENCY) = URGENT
      rank(ROUTINE) = 0, rank(PRIORITY) = 1, rank(URGENT) = 2

      affected = ServiceRequest rows of the area with
                   handling_status IN {RECEIVED, TRIAGED, ASSIGNED, INSPECTED}
      for each r in affected ordered by created_at ASC:
        r.priority = the higher-ranked of r.priority and posture_floor(new_posture)
        if r.triaged_at is not null and r.priority changed:
            r.due_at = calculations.service_request_due_at(r.triaged_at, r.priority)
    input_set: "Requests in RESOLVED or CLOSED are never escalated. Priority is monotone: escalation never lowers a priority, and a posture drop never lowers one either."
    constants: {}
    precision: "N/A — enum ranking only. Processing order is created_at ASC and has no observable effect because each row is independent."

  - name: service_request_due_at
    trigger: "On ServiceRequest TRIAGE, on REOPEN, and whenever posture_priority_escalation changes a request's priority"
    algorithm: threshold
    formula: |
      sla_hours = SLA_HOURS_ROUTINE  when priority == ROUTINE
                  SLA_HOURS_PRIORITY when priority == PRIORITY
                  SLA_HOURS_URGENT   when priority == URGENT
      due_at = triaged_at + sla_hours hours
    input_set: "Always measured from the request's CURRENT triaged_at (the most recent TRIAGE, including one reached by REOPEN) — never from the escalation instant."
    constants:
      SLA_HOURS_ROUTINE: 120
      SLA_HOURS_PRIORITY: 48
      SLA_HOURS_URGENT: 24
    precision: "Exact hour arithmetic; rendered with three fractional digits."

  - name: sensitive_site_encroachment
    trigger: "On TreatmentRoute COMMIT (validations priority 14) and on TreatmentPlan SCHEDULE"
    algorithm: threshold
    formula: |
      distance_m = round_half_up(
                     sqrt((route.center_x_m - site.x_m)^2 + (route.center_y_m - site.y_m)^2), 2)
      encroaches = distance_m <= (site.buffer_meters + route.swath_radius_m)
    input_set: "Every SensitiveSite whose service_area_id equals the route's plan's service_area_id. site.buffer_meters is the effective buffer (override when supplied, else SENSITIVE_SITE_BUFFER_METERS[site_type])."
    constants:
      SENSITIVE_SITE_BUFFER_METERS_APIARY: 1600
      SENSITIVE_SITE_BUFFER_METERS_ORGANIC_FARM: 800
      SENSITIVE_SITE_BUFFER_METERS_AQUACULTURE: 1600
      SENSITIVE_SITE_BUFFER_METERS_SCHOOL: 400
    precision: "distance_m to 2 decimals, round_half_up. The comparison is INCLUSIVE: a distance exactly equal to buffer_meters + swath_radius_m encroaches."

  - name: route_pesticide_volume
    trigger: "On TreatmentRoute COMMIT (writes estimated_volume_ml) and on TreatmentRoute EXECUTE (writes actual_volume_ml)"
    algorithm: tiered_pricing
    formula: |
      ESTIMATED: estimated_volume_ml = round_half_up(planned_acres * product.label_rate_ml_per_acre, 2)
      ACTUAL:    drift_factor = WIND_DRIFT_FACTOR if wind_speed_mph >= WIND_DRIFT_TRIGGER_MPH
                                else NO_DRIFT_FACTOR
                 actual_volume_ml = round_half_up(
                                      actual_acres * product.label_rate_ml_per_acre * drift_factor, 2)
    input_set: "planned_acres and actual_acres are supplied by the client; label_rate_ml_per_acre is read from the route's PesticideProduct at the moment of each transition."
    constants:
      WIND_DRIFT_TRIGGER_MPH: 8.0
      WIND_DRIFT_FACTOR: 1.10
      NO_DRIFT_FACTOR: 1.00
    precision: "2 decimal places, round_half_up. The drift trigger is inclusive: exactly 8.0 mph uses 1.10."
    variants:
      - name: ESTIMATED
        when: "COMMIT — reserves stock before the work happens"
        difference: "Uses planned_acres and no drift factor; the reserved amount lands in PesticideProduct.committed_ml."
      - name: ACTUAL
        when: "EXECUTE — records the measured application"
        difference: "Uses actual_acres and multiplies by the wind drift factor, so identical acreage consumes 10% more product at or above 8.0 mph; the difference (estimated - actual) is returned to on_hand_ml, which is negative when actual exceeds estimated."

  - name: plan_estimated_total_ml
    trigger: "On TreatmentRoute COMMIT, EXECUTE, RELEASE, and VOID; writes TreatmentPlan.estimated_total_ml"
    algorithm: aggregation
    formula: |
      included = TreatmentRoute rows of the plan with status IN {COMMITTED, EXECUTED, VERIFIED}
      estimated_total_ml = sum over included of route.estimated_volume_ml
    input_set: "PLANNED, RELEASED and VOIDED routes are excluded."
    constants: {}
    precision: |
      Each route's estimated_volume_ml is ALREADY rounded to 2 decimals by
      route_pesticide_volume; the plan total is the sum of those rounded
      per-route values (round-then-sum). Recomputing from raw
      planned_acres * label_rate products and rounding once at the end is WRONG.

  - name: treatment_cost_allocation
    trigger: "On TreatmentPlan IN_PROGRESS -> COMPLETED; writes material_cost_cents, labor_cost_cents, subtotal_cents, admin_fee_rate, admin_fee_cents, total_cost_cents"
    algorithm: waterfall_allocation
    formula: |
      included = TreatmentRoute rows of the plan with status == VERIFIED
                 (VOIDED and RELEASED routes contribute nothing)

      # Step 1 — per-route material cost, rounded to whole cents per route, then summed.
      material_cost_cents = sum over included of
          round_half_up(route.actual_volume_ml / 1000 * product.cost_cents_per_liter, 0)

      # Step 2 — labour.
      labor_cost_cents = sum over included of
          route.duration_minutes * LABOR_RATE_CENTS_PER_MINUTE

      # Step 3 — subtotal.
      subtotal_cents = material_cost_cents + labor_cost_cents

      # Step 4 — tier selection. The tier is keyed on subtotal_cents, i.e. the
      # value BEFORE the administrative fee is added. Evaluation order is fixed:
      # subtotal -> rate -> fee -> total. The fee is never re-derived from the
      # total, and no fixed-point iteration is performed, even though the tier
      # boundaries are expressed in the same units as the total.
      admin_fee_rate = ADMIN_FEE_RATE_TIER1 if subtotal_cents <  ADMIN_FEE_TIER1_MAX_CENTS
                       ADMIN_FEE_RATE_TIER2 if subtotal_cents <  ADMIN_FEE_TIER2_MAX_CENTS
                       ADMIN_FEE_RATE_TIER3 otherwise

      # Step 5 — fee and total.
      admin_fee_cents  = round_half_up(subtotal_cents * admin_fee_rate, 0)
      total_cost_cents = subtotal_cents + admin_fee_cents
    input_set: "Only VERIFIED routes of the plan. Route order does not affect the result because each route's material cost is rounded independently before summation."
    constants:
      LABOR_RATE_CENTS_PER_MINUTE: 120
      ADMIN_FEE_TIER1_MAX_CENTS: 100000
      ADMIN_FEE_TIER2_MAX_CENTS: 500000
      ADMIN_FEE_RATE_TIER1: 0.08
      ADMIN_FEE_RATE_TIER2: 0.06
      ADMIN_FEE_RATE_TIER3: 0.045
    precision: |
      Money is whole cents. Per-route material cost is rounded to whole cents
      BEFORE summation (round-then-sum). Tier boundaries are half-open on the low
      side: subtotal_cents == 100000 selects ADMIN_FEE_RATE_TIER2 (0.06), and
      subtotal_cents == 500000 selects ADMIN_FEE_RATE_TIER3 (0.045).

  - name: pesticide_inventory_partition
    trigger: "Invariant maintained by every TreatmentRoute COMMIT, EXECUTE, VOID, RELEASE and by every POST /pesticide-products/{id}/adjustments"
    algorithm: constraint_propagation
    formula: |
      # Conserved quantity: millilitres of product under district control.
      product.on_hand_ml + product.committed_ml + product.applied_ml
          == product.received_total_ml
      # COMMIT     : on_hand -= E ; committed += E
      # EXECUTE    : committed -= E ; applied += A ; on_hand += (E - A)
      # VOID       : applied  -= A ; on_hand += A
      # RELEASE    : committed -= E ; on_hand += E
      # ADJUSTMENT : on_hand += delta_ml ; received_total_ml += delta_ml
      # where E = estimated_volume_ml and A = actual_volume_ml of the route.
    input_set: "A single PesticideProduct row; all four movement classes above and the adjustment endpoint are the only writers of these four fields."
    constants: {}
    precision: "All four fields carry 2 decimal places; the identity holds exactly at 2 decimals after every mutation, so COMMIT followed by RELEASE, and EXECUTE followed by VOID, both leave the four fields exactly as they were before."

  - name: service_request_count_partition
    trigger: "Invariant maintained by POST /service-requests and by every ServiceRequest transition"
    algorithm: constraint_propagation
    formula: |
      # Conserved quantity: the case count of a ServiceArea.
      area.request_open_count + area.request_resolved_count + area.request_closed_count
          == area.request_total_count
      # CREATE : total += 1 ; open += 1
      # RESOLVE: open  -= 1 ; resolved += 1
      # REOPEN : resolved -= 1 ; open += 1        (compensates RESOLVE exactly)
      # CLOSE from RESOLVED : resolved -= 1 ; closed += 1
      # CLOSE from RECEIVED : open     -= 1 ; closed += 1
    input_set: "A single ServiceArea row; TRIAGE, ASSIGN and INSPECT move a request inside the open bucket and therefore change none of the four counters."
    constants: {}
    precision: "Integer counters; RESOLVE followed by REOPEN restores all four counters to their pre-RESOLVE values."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, X-User-Role is one of the seven declared roles, and X-User-ID is a non-empty string"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list AND, for the five /transitions endpoints, the acting role is the one §1.2 declares as the actor of the requested action (e.g. only AbatementManager may send action=APPROVE, only FieldTech may send action=EXECUTE, only SensitiveSiteOperator may send action=ACKNOWLEDGE)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the request path resolves, validated left to right: service_area_id, then trap_site_id / trap_collection_id / lab_pool_id / risk_assessment_id / pesticide_product_id / applicator_id / treatment_plan_id / treatment_route_id / notification_id / service_request_id"
    error_id: ERR_SERVICE_AREA_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; the error_id is the one matching the first unresolved segment (ERR_TRAP_SITE_NOT_FOUND, ERR_TRAP_COLLECTION_NOT_FOUND, ERR_LAB_POOL_NOT_FOUND, ERR_RISK_ASSESSMENT_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_APPLICATOR_NOT_FOUND, ERR_TREATMENT_PLAN_NOT_FOUND, ERR_TREATMENT_ROUTE_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_SERVICE_REQUEST_NOT_FOUND)"

  - priority: 4
    category: existence
    check: "Every foreign key supplied in the body resolves, validated in the order the endpoint's input list declares: service_area_id, trigger_assessment_id, applicator_id, pesticide_product_id, sensitive_site_id, assigned_applicator_id"
    error_id: ERR_SENSITIVE_SITE_NOT_FOUND
    http_status: 404
    applies_to: "POST /treatment-plans, POST /treatment-plans/{id}/routes, POST /treatment-plans/{id}/notifications, POST /service-requests, POST /service-requests/{id}/transitions with action=ASSIGN"

  - priority: 5
    category: auth
    check: "Ownership for entity-backed roles: a FieldTech submitting a TrapCollection must equal recorded_by_applicator_id; a FieldTech executing a route must equal TreatmentRoute.applicator_id; a FieldTech inspecting or resolving a request must equal assigned_applicator_id; a SensitiveSiteOperator acknowledging a Notification must equal Notification.sensitive_site_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /trap-collections/{id}/transitions, POST /treatment-routes/{id}/transitions, POST /service-requests/{id}/transitions, POST /notifications/{id}/transitions"

  - priority: 6
    category: business_constraint
    check: "Body schema: all required fields present, types correct, enums inside their declared value sets, numeric ranges honored (trap_nights >= 1, female_count >= 0, dips >= 1, pool_size between 1 and POOL_MAX_MOSQUITOES, planned_acres > 0, actual_acres > 0, wind_speed_mph >= 0, tmin_c <= tmax_c, window_end strictly after window_start, code matching its pattern, contact_email containing '@'), and pagination limit within 1..100 with offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

  - priority: 7
    category: business_constraint
    check: "On a /transitions endpoint, the supplied action is one of that entity's declared actions (TrapCollection: SUBMIT, VOID / LabPool: START_TEST, RESULT, DISCARD / TreatmentPlan: SUBMIT, APPROVE, RETURN, REVISE, SCHEDULE, START, SUSPEND, RESUME, COMPLETE, CANCEL / TreatmentRoute: COMMIT, EXECUTE, VERIFY, VOID, RELEASE / Notification: SEND, ACKNOWLEDGE, FAIL, REQUEUE, ABANDON, EXPIRE / ServiceRequest: TRIAGE, ASSIGN, INSPECT, RESOLVE, REOPEN, CLOSE)"
    error_id: ERR_INVALID_ACTION
    http_status: 422
    applies_to: "the five /transitions endpoints"

  - priority: 8
    category: business_constraint
    check: "Optimistic concurrency: expected_service_area_version equals ServiceArea.version, and expected_product_version equals PesticideProduct.version"
    error_id: ERR_STALE_SERVICE_AREA_VERSION
    http_status: 412
    applies_to: "POST /service-areas/{id}/risk-assessments (ERR_STALE_SERVICE_AREA_VERSION); POST /pesticide-products/{id}/adjustments (ERR_STALE_PRODUCT_VERSION)"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: ServiceArea.code globally; TrapSite.site_code within its area; PesticideProduct.epa_reg_no globally; Applicator.license_no globally; TreatmentRoute.route_code within its plan; at most one WeatherObservation per (service_area_id, obs_date); at most one non-VOIDED TrapCollection per (trap_site_id, collection_date); at most one Notification per (treatment_plan_id, sensitive_site_id) in status IN {QUEUED, SENT, ACKNOWLEDGED}"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /service-areas, POST /service-areas/{id}/trap-sites, POST /service-areas/{id}/weather-observations, POST /trap-sites/{id}/collections, POST /pesticide-products, POST /applicators, POST /treatment-plans/{id}/routes, POST /treatment-plans/{id}/notifications"

  - priority: 10
    category: state
    check: "The requested transition exists from the entity's current state in §1.2 (including terminal-state lockdown: no action is accepted from a terminal state)"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "the five /transitions endpoints and POST /risk-assessments/{id}/confirm (ERR_ASSESSMENT_NOT_OPEN)"

  - priority: 11
    category: state
    check: "Cross-entity state gates: LabPool START_TEST needs parent TrapCollection.status IN {SUBMITTED, POOLED} (ERR_COLLECTION_NOT_SUBMITTED); TrapCollection VOID from SUBMITTED needs zero LabPools (ERR_COLLECTION_HAS_POOLS); plan SUBMIT needs trigger_assessment.status == CONFIRMED (ERR_TRIGGER_ASSESSMENT_NOT_CONFIRMED); route COMMIT needs plan.status == APPROVED (ERR_PLAN_NOT_APPROVED); route EXECUTE needs plan.status == IN_PROGRESS (ERR_PLAN_NOT_IN_PROGRESS); plan SCHEDULE needs every Notification of the plan in {ACKNOWLEDGED, EXPIRED} and at least one COMMITTED route with none still PLANNED (ERR_NOTIFICATION_INCOMPLETE / ERR_NO_COMMITTED_ROUTE); plan COMPLETE needs all routes terminal with at least one VERIFIED (ERR_ROUTES_NOT_SETTLED); request ASSIGN needs Applicator.status == ACTIVE (ERR_APPLICATOR_SUSPENDED); request RESOLVE needs verification_status != UNVERIFIED (ERR_REQUEST_NOT_VERIFIED)"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "the five /transitions endpoints"

  - priority: 12
    category: business_safety
    check: "Segregation of duties on plan approval: the approving or returning AbatementManager's X-User-ID must differ from TreatmentPlan.submitted_by_user_id (ERR_SELF_APPROVAL, 403), and an APPROVE from an X-User-ID already present in approver_user_ids is rejected (ERR_DUPLICATE_APPROVER, 409)"
    error_id: ERR_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /treatment-plans/{id}/transitions with action=APPROVE or action=RETURN"

  - priority: 13
    category: business_safety
    check: "Applicator fitness at COMMIT: Applicator.status == ACTIVE, license_expires_on >= date(window_start) (inclusive), and license_category covers the product's application_method per the coverage map on Applicator.license_category"
    error_id: ERR_APPLICATOR_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT"

  - priority: 14
    category: business_referential
    check: "Referential coherence: PesticideProduct.application_method == TreatmentPlan.treatment_type (ERR_PRODUCT_METHOD_MISMATCH); RiskAssessment.service_area_id == TreatmentPlan.service_area_id at plan creation, and SensitiveSite.service_area_id == plan.service_area_id at notification creation (ERR_AREA_MISMATCH)"
    error_id: ERR_PRODUCT_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT, POST /treatment-plans, POST /treatment-plans/{id}/notifications"

  - priority: 15
    category: business_safety
    check: "Posture gate: when TreatmentPlan.treatment_type IN {ADULTICIDE, AERIAL}, the plan's ServiceArea.risk_posture must be ELEVATED or EMERGENCY at COMMIT time"
    error_id: ERR_POSTURE_TOO_LOW
    http_status: 409
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT"

  - priority: 16
    category: business_safety
    check: "Sensitive-site clearance: when TreatmentPlan.treatment_type IN {ADULTICIDE, AERIAL} and the route encroaches on a SensitiveSite of type APIARY or ORGANIC_FARM per calculations.sensitive_site_encroachment, there must already exist a Notification of this plan for that site with status IN {SENT, ACKNOWLEDGED}"
    error_id: ERR_SENSITIVE_SITE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT"

  - priority: 17
    category: business_safety
    check: "Re-entry interval on the ServiceArea (CLOSED interval semantics, aggregated by active ingredient): the route is rejected when any other TreatmentRoute in the same ServiceArea, in status EXECUTED or VERIFIED, whose product shares this route's product.active_ingredient, satisfies new.window_start <= that_route.window_end + product.reentry_interval_hours. A start exactly at the boundary instant is a violation; strictly after it is allowed."
    error_id: ERR_REENTRY_INTERVAL_VIOLATION
    http_status: 409
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT"

  - priority: 18
    category: business_temporal
    check: "Applicator occupancy (HALF-OPEN interval with trailing turnaround buffer): a route's occupancy is [window_start, window_end + ROUTE_SETUP_BUFFER_MINUTES). The route is rejected when any other TreatmentRoute with the same applicator_id, in status COMMITTED, EXECUTED or VERIFIED, satisfies new.window_start < other.window_end + 45min AND other.window_start < new.window_end + 45min. Occupancies that touch exactly at the buffer boundary do NOT conflict."
    error_id: ERR_APPLICATOR_ROUTE_CONFLICT
    http_status: 409
    applies_to: "POST /treatment-routes/{id}/transitions with action=COMMIT"

  - priority: 19
    category: business_temporal
    check: "Time windows: collection SUBMIT within TRAP_COLLECTION_MAX_AGE_DAYS of the logical clock date inclusive (ERR_COLLECTION_WINDOW_EXPIRED); plan SCHEDULE lead time >= AERIAL_NOTIFICATION_LEAD_HOURS for AERIAL else GROUND_NOTIFICATION_LEAD_HOURS, inclusive (ERR_NOTIFICATION_LEAD_TIME); notification ACKNOWLEDGE at most NOTIFICATION_ACK_WINDOW_HOURS after sent_at inclusive (ERR_ACK_WINDOW_EXPIRED); notification EXPIRE only strictly after that same instant (ERR_ACK_WINDOW_OPEN); route EXECUTE only when logical_now >= window_start (ERR_ROUTE_WINDOW_NOT_OPEN); plan START only when logical_now >= scheduled_start_at (ERR_PLAN_START_TOO_EARLY); request REOPEN at most REOPEN_WINDOW_DAYS after resolved_at inclusive (ERR_REOPEN_WINDOW_EXPIRED)"
    error_id: ERR_NOTIFICATION_LEAD_TIME
    http_status: 422
    applies_to: "POST /trap-collections/{id}/transitions, POST /treatment-plans/{id}/transitions, POST /notifications/{id}/transitions, POST /treatment-routes/{id}/transitions, POST /service-requests/{id}/transitions"

  - priority: 20
    category: business_constraint
    check: "Counting limits: LabPool retest only while retest_count < MAX_POOL_RETESTS, i.e. 2 (ERR_RETEST_LIMIT_EXCEEDED); Notification SEND/REQUEUE only while attempt_count < NOTIFICATION_MAX_ATTEMPTS, i.e. 3 (ERR_NOTIFICATION_ATTEMPTS_EXHAUSTED); route COMMIT only while ServiceArea.seasonal_application_count < MAX_SEASONAL_APPLICATIONS, i.e. 2 (ERR_SEASONAL_LIMIT_EXCEEDED)"
    error_id: ERR_SEASONAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /lab-pools/{id}/transitions, POST /notifications/{id}/transitions, POST /treatment-routes/{id}/transitions"

  - priority: 21
    category: business_fiscal
    check: "Inventory sufficiency, evaluated last: at COMMIT, PesticideProduct.on_hand_ml >= estimated_volume_ml (ERR_INSUFFICIENT_INVENTORY); at EXECUTE, on_hand_ml + estimated_volume_ml - actual_volume_ml >= 0.00 (ERR_INSUFFICIENT_INVENTORY); at adjustment, on_hand_ml + delta_ml >= 0.00 and received_total_ml + delta_ml > 0.00 (ERR_INVENTORY_NEGATIVE)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /treatment-routes/{id}/transitions, POST /pesticide-products/{id}/adjustments"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The startup default before any call to this endpoint is exactly 2026-05-01T00:00:00.000Z, and the logical clock never falls back to real wall-clock time."
    roles: [DistrictAdmin]
    code: 200
    input: ["to_iso8601"]
    output:
      current_utc: datetime
    side_effects: ["All subsequent logical_now reads return the supplied instant."]

  - method: POST
    path: "/service-areas"
    description: "Register a district service area"
    roles: [DistrictAdmin]
    code: 201
    input: ["name", "code", "season_start_date", "population"]
    output: ServiceArea
    side_effects:
      - "risk_posture = NORMAL, posture_source = NO_ASSESSMENT, latest_confirmed_vector_index = 0.00, all four request counters = 0, seasonal_application_count = 0, version = 1."

  - method: GET
    path: "/service-areas/{id}"
    description: "Read one service area including its derived posture and counters"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: ServiceArea
    side_effects: []

  - method: POST
    path: "/service-areas/{id}/sensitive-sites"
    description: "Register an apiary / organic farm / aquaculture / school site in the sensitive-site registry"
    roles: [DistrictAdmin]
    code: 201
    input: ["site_type", "operator_name", "contact_email", "x_m", "y_m", "buffer_meters_override?"]
    output: SensitiveSite
    side_effects:
      - "buffer_meters computed from buffer_meters_override when supplied, else SENSITIVE_SITE_BUFFER_METERS[site_type]; registered_on = date(logical_now)."

  - method: GET
    path: "/service-areas/{id}/sensitive-sites"
    description: "List the sensitive sites registered in an area (FK reverse-reachability for SensitiveSite.service_area_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager, SensitiveSiteOperator]
    code: 200
    input: ["site_type?", "limit?", "offset?"]
    output: SensitiveSite[]
    side_effects: []

  - method: POST
    path: "/service-areas/{id}/trap-sites"
    description: "Register a surveillance trap site inside an area"
    roles: [DistrictAdmin]
    code: 201
    input: ["site_code", "trap_type", "habitat", "x_m", "y_m", "is_active?"]
    output: TrapSite
    side_effects: ["season_positive_count = 0; last_positive_at = null; is_active defaults to true."]

  - method: GET
    path: "/service-areas/{id}/trap-sites"
    description: "List the trap sites of an area (FK reverse-reachability for TrapSite.service_area_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: TrapSite[]
    side_effects: []

  - method: GET
    path: "/trap-sites/{id}"
    description: "Read one trap site including its season positive counter"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: TrapSite
    side_effects: []

  - method: POST
    path: "/trap-sites/{id}/collections"
    description: "Log an adult-mosquito trap collection; the acting FieldTech becomes recorded_by_applicator_id"
    roles: [FieldTech]
    code: 201
    input: ["collection_date", "trap_nights", "female_count", "species"]
    output: TrapCollection
    side_effects:
      - "status = LOGGED; recorded_by_applicator_id = X-User-ID; pooled_mosquito_count = 0; positive_pool_count = 0; wnv_detected = false."

  - method: GET
    path: "/trap-collections"
    description: "List trap collections with filters (FK reverse-reachability for TrapCollection.trap_site_id and TrapCollection.recorded_by_applicator_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["trap_site_id?", "recorded_by_applicator_id?", "status?", "limit?", "offset?"]
    output: TrapCollection[]
    side_effects: []

  - method: GET
    path: "/trap-collections/{id}"
    description: "Read one trap collection"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: TrapCollection
    side_effects: []

  - method: POST
    path: "/trap-collections/{id}/transitions"
    description: "Drive the TrapCollection state machine; action is SUBMIT (FieldTech owner) or VOID (AbatementManager)"
    roles: [FieldTech, AbatementManager]
    code: 200
    input: ["action", "void_reason?"]
    output: TrapCollection
    side_effects:
      - "SUBMIT: status LOGGED -> SUBMITTED and every OPEN RiskAssessment of the area is marked stale with stale_reason = NEW_COLLECTION."
      - "VOID: status -> VOIDED; the collection leaves the trap_abundance_index input set."

  - method: POST
    path: "/trap-collections/{id}/lab-pools"
    description: "Create an arbovirus test pool from a submitted collection"
    roles: [LabAnalyst]
    code: 201
    input: ["pool_size", "assay?"]
    output: LabPool
    side_effects:
      - "status = CREATED; retest_count = 0."
      - "Parent TrapCollection.pooled_mosquito_count += pool_size; a SUBMITTED collection transitions to POOLED."

  - method: GET
    path: "/lab-pools"
    description: "List lab pools with filters (FK reverse-reachability for LabPool.trap_collection_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["trap_collection_id?", "status?", "limit?", "offset?"]
    output: LabPool[]
    side_effects: []

  - method: GET
    path: "/lab-pools/{id}"
    description: "Read one lab pool"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: LabPool
    side_effects: []

  - method: POST
    path: "/lab-pools/{id}/transitions"
    description: "Drive the LabPool state machine; action is START_TEST, RESULT (with result POSITIVE / NEGATIVE / INVALID), or DISCARD"
    roles: [LabAnalyst]
    code: 200
    input: ["action", "result?", "ct_value?"]
    output: LabPool
    side_effects:
      - "START_TEST from CREATED or INVALID; the INVALID entry increments retest_count."
      - "RESULT=POSITIVE runs the five-hop surveillance cascade documented in state_machines.LabPool."
      - "RESULT=NEGATIVE / INVALID / DISCARD mark every OPEN RiskAssessment of the area stale with stale_reason = LAB_RESULT."

  - method: POST
    path: "/service-areas/{id}/larval-inspections"
    description: "Record a larval dip survey (append-only)"
    roles: [FieldTech]
    code: 201
    input: ["inspection_date", "dips", "larvae_count", "habitat", "treated_on_site?"]
    output: LarvalInspection
    side_effects: ["The inspection immediately enters the larval_index input set for windows that contain inspection_date."]

  - method: GET
    path: "/service-areas/{id}/larval-inspections"
    description: "List larval inspections of an area (FK reverse-reachability for LarvalInspection.service_area_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["habitat?", "limit?", "offset?"]
    output: LarvalInspection[]
    side_effects: []

  - method: POST
    path: "/service-areas/{id}/weather-observations"
    description: "Record one day of weather for an area (append-only, at most one per obs_date)"
    roles: [DistrictAdmin, FieldTech]
    code: 201
    input: ["obs_date", "tmax_c", "tmin_c", "rainfall_mm?"]
    output: WeatherObservation
    side_effects: ["degree_day computed and stored per calculations.degree_day_accumulation (per-day rounding to 1 decimal)."]

  - method: GET
    path: "/service-areas/{id}/weather-observations"
    description: "List weather observations of an area (FK reverse-reachability for WeatherObservation.service_area_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  - method: POST
    path: "/service-areas/{id}/risk-assessments"
    description: "Open a risk assessment for an area, computing the provisional surveillance indices. Guarded by optimistic concurrency on the area's version because the new assessment supersedes the area's prior OPEN assessment."
    roles: [VectorEcologist]
    code: 201
    input: ["as_of_date", "expected_service_area_version"]
    output: RiskAssessment
    side_effects:
      - "abundance_index, larval_index, degree_days, mir_provisional and vector_index_provisional computed and stored; status = OPEN; is_stale = false."
      - "Any other RiskAssessment of the area with status == OPEN transitions to SUPERSEDED."
      - "increments ServiceArea.version by 1."

  - method: GET
    path: "/service-areas/{id}/risk-assessments"
    description: "List risk assessments of an area (FK reverse-reachability for RiskAssessment.service_area_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  - method: GET
    path: "/risk-assessments/{id}"
    description: "Read one risk assessment including both index variants"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []

  - method: POST
    path: "/risk-assessments/{id}/confirm"
    description: "Confirm an OPEN risk assessment, recomputing the confirmed index variant and re-deriving the area's posture"
    roles: [VectorEcologist]
    code: 200
    input: []
    output: RiskAssessment
    side_effects:
      - "mir_confirmed and vector_index_confirmed written; confirmed_at set; status -> CONFIRMED; any previously CONFIRMED assessment of the area -> SUPERSEDED."
      - "ServiceArea.latest_confirmed_vector_index, risk_posture and posture_source recomputed; posture_at_confirm recorded."
      - "On posture escalation, open ServiceRequests of the area have priority raised and due_at recomputed."

  - method: POST
    path: "/pesticide-products"
    description: "Add a pesticide product to district stock"
    roles: [DistrictAdmin]
    code: 201
    input: ["name", "epa_reg_no", "active_ingredient", "application_method", "label_rate_ml_per_acre", "reentry_interval_hours", "cost_cents_per_liter", "received_total_ml", "restricted_use?"]
    output: PesticideProduct
    side_effects: ["on_hand_ml = received_total_ml; committed_ml = 0.00; applied_ml = 0.00; version = 1."]

  - method: GET
    path: "/pesticide-products/{id}"
    description: "Read one product including the four-field inventory partition"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: PesticideProduct
    side_effects: []

  - method: POST
    path: "/pesticide-products/{id}/adjustments"
    description: "Post a stock receipt or write-off against a product. Guarded by optimistic concurrency on the product's version because adjustments accumulate against the same ledger."
    roles: [DistrictAdmin]
    code: 200
    input: ["delta_ml", "reason", "expected_product_version"]
    output: PesticideProduct
    side_effects:
      - "on_hand_ml += delta_ml and received_total_ml += delta_ml, preserving calculations.pesticide_inventory_partition."
      - "increments PesticideProduct.version by 1."

  - method: POST
    path: "/applicators"
    description: "Register a licensed applicator / field technician; the returned id is the X-User-ID a FieldTech acts under"
    roles: [DistrictAdmin]
    code: 201
    input: ["full_name", "license_no", "license_category", "license_expires_on"]
    output: Applicator
    side_effects: ["status = ACTIVE; assigned_route_count = 0."]

  - method: GET
    path: "/applicators/{id}"
    description: "Read one applicator including duty status and route load"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: Applicator
    side_effects: []

  - method: POST
    path: "/applicators/{id}/status"
    description: "Set an applicator's duty status to ACTIVE or SUSPENDED"
    roles: [DistrictAdmin]
    code: 200
    input: ["status"]
    output: Applicator
    side_effects: ["A SUSPENDED applicator can no longer be committed to new routes nor assigned to service requests; existing routes are untouched."]

  - method: POST
    path: "/treatment-plans"
    description: "Draft a treatment plan justified by a confirmed risk assessment"
    roles: [VectorEcologist]
    code: 201
    input: ["service_area_id", "trigger_assessment_id", "treatment_type"]
    output: TreatmentPlan
    side_effects:
      - "status = DRAFT; required_approvals = 2 when treatment_type == AERIAL else 1; notification_required = treatment_type IN {ADULTICIDE, AERIAL}; approver_user_ids = []; revision_count = 0; estimated_total_ml = 0.00; all cost fields 0."

  - method: GET
    path: "/treatment-plans"
    description: "List treatment plans with filters (FK reverse-reachability for TreatmentPlan.service_area_id and TreatmentPlan.trigger_assessment_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["service_area_id?", "trigger_assessment_id?", "status?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []

  - method: GET
    path: "/treatment-plans/{id}"
    description: "Read one treatment plan including approvals and cost allocation"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/treatment-plans/{id}/transitions"
    description: "Drive the TreatmentPlan state machine; action is SUBMIT / REVISE (VectorEcologist) or APPROVE / RETURN / SCHEDULE / START / SUSPEND / RESUME / COMPLETE / CANCEL (AbatementManager)"
    roles: [VectorEcologist, AbatementManager]
    code: 200
    input: ["action", "scheduled_start_at?", "return_reason?", "cancel_reason?"]
    output: TreatmentPlan
    side_effects:
      - "SUBMIT records submitted_by_user_id; APPROVE appends a distinct approver and only reaches APPROVED once required_approvals distinct managers have approved."
      - "RETURN increments revision_count; REVISE clears submitted_by_user_id and approver_user_ids."
      - "SCHEDULE stores scheduled_start_at after the lead-time and notification checks; COMPLETE writes the cost allocation; CANCEL releases COMMITTED routes and expires open notifications."

  - method: POST
    path: "/treatment-plans/{id}/routes"
    description: "Add a treatment route (applicator + product + time window + geometry) to a DRAFT or RETURNED plan"
    roles: [VectorEcologist]
    code: 201
    input: ["applicator_id", "pesticide_product_id", "route_code", "window_start", "window_end", "planned_acres", "center_x_m", "center_y_m", "swath_radius_m?"]
    output: TreatmentRoute
    side_effects:
      - "status = PLANNED; duration_minutes computed from the window; estimated_volume_ml = 0.00 until COMMIT."
      - "Rejected with ERR_INVALID_TRANSITION unless the parent plan is in DRAFT or RETURNED."

  - method: GET
    path: "/treatment-routes"
    description: "List treatment routes with filters (FK reverse-reachability for TreatmentRoute.treatment_plan_id, applicator_id and pesticide_product_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["treatment_plan_id?", "applicator_id?", "pesticide_product_id?", "status?", "limit?", "offset?"]
    output: TreatmentRoute[]
    side_effects: []

  - method: GET
    path: "/treatment-routes/{id}"
    description: "Read one treatment route including both volume variants"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: []
    output: TreatmentRoute
    side_effects: []

  - method: POST
    path: "/treatment-routes/{id}/transitions"
    description: "Drive the TreatmentRoute state machine; action is COMMIT / VERIFY / VOID / RELEASE (AbatementManager) or EXECUTE (the assigned FieldTech)"
    roles: [AbatementManager, FieldTech]
    code: 200
    input: ["action", "actual_acres?", "wind_speed_mph?", "void_reason?"]
    output: TreatmentRoute
    side_effects:
      - "COMMIT reserves stock (on_hand -> committed) and bumps PesticideProduct.version and Applicator.assigned_route_count."
      - "EXECUTE converts the reservation to consumption using the ACTUAL volume variant and increments ServiceArea.seasonal_application_count."
      - "VOID runs the three-hop compensation cascade; RELEASE returns the reservation."

  - method: POST
    path: "/treatment-plans/{id}/notifications"
    description: "Issue an aerial/adulticide spray notification to a registered sensitive site of the plan's area"
    roles: [DistrictAdmin]
    code: 201
    input: ["sensitive_site_id", "channel?"]
    output: Notification
    side_effects:
      - "status = QUEUED; attempt_count = 0."
      - "Rejected with ERR_INVALID_TRANSITION unless the parent plan is APPROVED or SCHEDULED."

  - method: GET
    path: "/notifications"
    description: "List notifications with filters (FK reverse-reachability for Notification.treatment_plan_id and Notification.sensitive_site_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager, SensitiveSiteOperator]
    code: 200
    input: ["treatment_plan_id?", "sensitive_site_id?", "status?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  - method: GET
    path: "/notifications/{id}"
    description: "Read one notification"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager, SensitiveSiteOperator]
    code: 200
    input: []
    output: Notification
    side_effects: []

  - method: POST
    path: "/notifications/{id}/transitions"
    description: "Drive the Notification state machine; action is SEND / FAIL / REQUEUE / ABANDON / EXPIRE (DistrictAdmin) or ACKNOWLEDGE (the owning SensitiveSiteOperator)"
    roles: [DistrictAdmin, SensitiveSiteOperator]
    code: 200
    input: ["action", "failure_reason?"]
    output: Notification
    side_effects:
      - "SEND increments attempt_count and stamps sent_at; ACKNOWLEDGE stamps acknowledged_at; REQUEUE returns to QUEUED while attempts remain."

  - method: POST
    path: "/service-requests"
    description: "File a public complaint / service request against an area"
    roles: [Resident]
    code: 201
    input: ["service_area_id", "reporter_contact", "category", "description", "x_m", "y_m"]
    output: ServiceRequest
    side_effects:
      - "handling_status = RECEIVED; verification_status = UNVERIFIED; priority = ROUTINE; reported_by_user_id = X-User-ID."
      - "ServiceArea.request_total_count += 1 and ServiceArea.request_open_count += 1."

  - method: GET
    path: "/service-requests"
    description: "List service requests with filters and pagination (FK reverse-reachability for ServiceRequest.service_area_id and assigned_applicator_id)"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager, Resident]
    code: 200
    input: ["service_area_id?", "assigned_applicator_id?", "handling_status?", "priority?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []

  - method: GET
    path: "/service-requests/{id}"
    description: "Read one service request including both status axes"
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager, Resident]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/transitions"
    description: "Drive the ServiceRequest state machine; action is TRIAGE / ASSIGN / REOPEN / CLOSE (AbatementManager) or INSPECT / RESOLVE (the assigned FieldTech)"
    roles: [AbatementManager, FieldTech]
    code: 200
    input: ["action", "priority?", "assigned_applicator_id?", "verification_status?", "resolution_note?"]
    output: ServiceRequest
    side_effects:
      - "TRIAGE sets triaged_at and due_at and applies the posture floor to priority."
      - "INSPECT advances the verification axis only; RESOLVE and CLOSE and REOPEN move the ServiceArea request counters while preserving calculations.service_request_count_partition."

  - method: GET
    path: "/service-areas/{id}/surveillance-report"
    description: "Computed read: the area's surveillance indices for a window plus its posture, application count and complaint-count partition. as_of_date defaults to the logical clock's date."
    roles: [DistrictAdmin, FieldTech, LabAnalyst, VectorEcologist, AbatementManager]
    code: 200
    input: ["as_of_date?"]
    output:
      as_of_date: string
      abundance_index: number
      larval_index: number
      degree_days: number
      mir_provisional: number
      mir_confirmed: number
      vector_index_provisional: number
      risk_posture: string
      posture_source: string
      seasonal_application_count: integer
      request_total_count: integer
      request_open_count: integer
      request_resolved_count: integer
      request_closed_count: integer
    side_effects: []

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint, or is not the declared actor of the requested /transitions action"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acted on a resource it does not own (FieldTech vs recorded_by_applicator_id / applicator_id / assigned_applicator_id, SensitiveSiteOperator vs Notification.sensitive_site_id)"
  - id: ERR_SELF_APPROVAL
    http: 403
    condition: "An AbatementManager tried to APPROVE or RETURN a plan whose submitted_by_user_id equals their own X-User-ID"

  # --- existence ---
  - id: ERR_SERVICE_AREA_NOT_FOUND
    http: 404
    condition: "service_area_id in path or body does not resolve"
  - id: ERR_SENSITIVE_SITE_NOT_FOUND
    http: 404
    condition: "sensitive_site_id in body does not resolve"
  - id: ERR_TRAP_SITE_NOT_FOUND
    http: 404
    condition: "trap_site_id in path does not resolve"
  - id: ERR_TRAP_COLLECTION_NOT_FOUND
    http: 404
    condition: "trap_collection_id in path does not resolve"
  - id: ERR_LAB_POOL_NOT_FOUND
    http: 404
    condition: "lab_pool_id in path does not resolve"
  - id: ERR_RISK_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "risk_assessment_id in path or trigger_assessment_id in body does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "pesticide_product_id in path or body does not resolve"
  - id: ERR_APPLICATOR_NOT_FOUND
    http: 404
    condition: "applicator_id or assigned_applicator_id in path or body does not resolve"
  - id: ERR_TREATMENT_PLAN_NOT_FOUND
    http: 404
    condition: "treatment_plan_id in path does not resolve"
  - id: ERR_TREATMENT_ROUTE_NOT_FOUND
    http: 404
    condition: "treatment_route_id in path does not resolve"
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "notification_id in path does not resolve"
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "service_request_id in path does not resolve"

  # --- request shape ---
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required body field, wrong type, enum value outside the declared set, numeric range violation, tmin_c > tmax_c, window_end <= window_start, or pagination limit outside 1..100"
  - id: ERR_INVALID_ACTION
    http: 422
    condition: "The action supplied to a /transitions endpoint is not one of that entity's declared actions"

  # --- optimistic concurrency ---
  - id: ERR_STALE_SERVICE_AREA_VERSION
    http: 412
    condition: "expected_service_area_version does not equal the ServiceArea's current version"
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the PesticideProduct's current version"

  # --- uniqueness ---
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness constraint from validations priority 9 is violated (area code, trap site_code within area, EPA reg no, licence no, route_code within plan, one weather observation per area-day, one non-VOIDED collection per trap-site-day, one live notification per plan-and-site)"

  # --- state ---
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "The requested action has no transition from the entity's current state, including any action attempted from a terminal state, adding a route to a plan that is not DRAFT or RETURNED, and issuing a notification for a plan that is not APPROVED or SCHEDULED"
  - id: ERR_ASSESSMENT_NOT_OPEN
    http: 409
    condition: "POST /risk-assessments/{id}/confirm on an assessment whose status is not OPEN"
  - id: ERR_COLLECTION_NOT_SUBMITTED
    http: 409
    condition: "LabPool creation or START_TEST while the parent TrapCollection is not SUBMITTED or POOLED"
  - id: ERR_COLLECTION_HAS_POOLS
    http: 409
    condition: "VOID of a SUBMITTED TrapCollection that already has at least one LabPool"
  - id: ERR_TRIGGER_ASSESSMENT_NOT_CONFIRMED
    http: 409
    condition: "Plan SUBMIT while the plan's trigger_assessment is not CONFIRMED"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "Route COMMIT while the parent TreatmentPlan is not APPROVED"
  - id: ERR_PLAN_NOT_IN_PROGRESS
    http: 409
    condition: "Route EXECUTE while the parent TreatmentPlan is not IN_PROGRESS"
  - id: ERR_NO_COMMITTED_ROUTE
    http: 409
    condition: "Plan SCHEDULE with no COMMITTED route, or with a route still in PLANNED"
  - id: ERR_NOTIFICATION_INCOMPLETE
    http: 409
    condition: "Plan SCHEDULE while some Notification of the plan is still QUEUED, SENT, FAILED or UNDELIVERABLE, or while an encroached APIARY / ORGANIC_FARM site has no ACKNOWLEDGED or EXPIRED notification"
  - id: ERR_ROUTES_NOT_SETTLED
    http: 409
    condition: "Plan COMPLETE while some route is not in {VERIFIED, VOIDED, RELEASED}, or while no route is VERIFIED"
  - id: ERR_APPLICATOR_SUSPENDED
    http: 409
    condition: "Request ASSIGN to an Applicator whose status is SUSPENDED"
  - id: ERR_REQUEST_NOT_VERIFIED
    http: 409
    condition: "Request RESOLVE while verification_status is still UNVERIFIED"

  # --- segregation of duties ---
  - id: ERR_DUPLICATE_APPROVER
    http: 409
    condition: "APPROVE from an X-User-ID already present in the plan's approver_user_ids"

  # --- safety / compliance ---
  - id: ERR_APPLICATOR_LICENSE_INVALID
    http: 422
    condition: "At COMMIT the applicator is SUSPENDED, the licence expires before date(window_start), or the licence category does not cover the product's application_method"
  - id: ERR_PRODUCT_METHOD_MISMATCH
    http: 422
    condition: "At COMMIT the product's application_method differs from the plan's treatment_type"
  - id: ERR_AREA_MISMATCH
    http: 422
    condition: "trigger_assessment belongs to a different ServiceArea than the plan, or the notified SensitiveSite belongs to a different ServiceArea than the plan"
  - id: ERR_POSTURE_TOO_LOW
    http: 409
    condition: "COMMIT of an ADULTICIDE or AERIAL route while the area's risk_posture is NORMAL"
  - id: ERR_SENSITIVE_SITE_NOT_CLEARED
    http: 409
    condition: "COMMIT of an ADULTICIDE or AERIAL route that encroaches on an APIARY or ORGANIC_FARM site with no SENT or ACKNOWLEDGED notification for that site on this plan"
  - id: ERR_REENTRY_INTERVAL_VIOLATION
    http: 409
    condition: "COMMIT whose window_start falls at or before a prior applied route's window_end plus the product's reentry_interval_hours, for the same area and active ingredient"

  # --- temporal ---
  - id: ERR_APPLICATOR_ROUTE_CONFLICT
    http: 409
    condition: "COMMIT whose buffered occupancy intersects another COMMITTED / EXECUTED / VERIFIED route of the same applicator"
  - id: ERR_COLLECTION_WINDOW_EXPIRED
    http: 422
    condition: "SUBMIT of a collection whose collection_date is more than TRAP_COLLECTION_MAX_AGE_DAYS before the logical clock date"
  - id: ERR_NOTIFICATION_LEAD_TIME
    http: 422
    condition: "SCHEDULE whose scheduled_start_at is less than the modality's notification lead time after the logical clock"
  - id: ERR_ACK_WINDOW_EXPIRED
    http: 422
    condition: "ACKNOWLEDGE more than NOTIFICATION_ACK_WINDOW_HOURS after sent_at"
  - id: ERR_ACK_WINDOW_OPEN
    http: 409
    condition: "EXPIRE at or before sent_at plus NOTIFICATION_ACK_WINDOW_HOURS, while the operator may still acknowledge"
  - id: ERR_ROUTE_WINDOW_NOT_OPEN
    http: 409
    condition: "EXECUTE before the route's window_start"
  - id: ERR_PLAN_START_TOO_EARLY
    http: 409
    condition: "START before the plan's scheduled_start_at"
  - id: ERR_REOPEN_WINDOW_EXPIRED
    http: 422
    condition: "REOPEN more than REOPEN_WINDOW_DAYS after resolved_at"

  # --- counting limits ---
  - id: ERR_RETEST_LIMIT_EXCEEDED
    http: 409
    condition: "START_TEST from INVALID when retest_count has already reached MAX_POOL_RETESTS"
  - id: ERR_NOTIFICATION_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "SEND or REQUEUE when attempt_count has already reached NOTIFICATION_MAX_ATTEMPTS"
  - id: ERR_SEASONAL_LIMIT_EXCEEDED
    http: 409
    condition: "COMMIT when the area's seasonal_application_count has already reached MAX_SEASONAL_APPLICATIONS"

  # --- fiscal ---
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "COMMIT whose estimated volume exceeds on_hand_ml, or EXECUTE whose actual volume would drive on_hand_ml below zero"
  - id: ERR_INVENTORY_NEGATIVE
    http: 422
    condition: "An adjustment whose delta_ml would drive on_hand_ml below 0.00 or received_total_ml to 0.00 or below"

roles:
  - name: DistrictAdmin
    description: "District operations administrator: maintains areas, registries, stock, applicators, and outbound spray notices"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /service-areas"
      - "POST /service-areas/{id}/sensitive-sites"
      - "POST /service-areas/{id}/trap-sites"
      - "POST /pesticide-products"
      - "POST /pesticide-products/{id}/adjustments"
      - "POST /applicators"
      - "POST /applicators/{id}/status"
      - "POST /treatment-plans/{id}/notifications"
      - "POST /notifications/{id}/transitions with action IN {SEND, FAIL, REQUEUE, ABANDON, EXPIRE}"
    shared_operations:
      - "POST /service-areas/{id}/weather-observations (shared with FieldTech)"
      - "all GET endpoints except GET /service-requests and GET /service-requests/{id} scoping, which it also reads"

  - name: FieldTech
    description: "Licensed field technician: runs traps, larval dips, weather logging, route execution, and complaint field work"
    identity: "entity_backed:Applicator"
    exclusive_operations:
      - "POST /trap-sites/{id}/collections"
      - "POST /trap-collections/{id}/transitions with action=SUBMIT (only for its own collections)"
      - "POST /service-areas/{id}/larval-inspections"
      - "POST /treatment-routes/{id}/transitions with action=EXECUTE (only for routes assigned to it)"
      - "POST /service-requests/{id}/transitions with action IN {INSPECT, RESOLVE} (only for requests assigned to it)"
    shared_operations:
      - "POST /service-areas/{id}/weather-observations (shared with DistrictAdmin)"
      - "all GET endpoints"

  - name: LabAnalyst
    description: "Arbovirus laboratory analyst: builds test pools and records WNV results"
    identity: "opaque"
    exclusive_operations:
      - "POST /trap-collections/{id}/lab-pools"
      - "POST /lab-pools/{id}/transitions"
    shared_operations:
      - "all GET endpoints"

  - name: VectorEcologist
    description: "Vector ecologist: authors risk assessments and drafts treatment plans, but can never approve them"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-areas/{id}/risk-assessments"
      - "POST /risk-assessments/{id}/confirm"
      - "POST /treatment-plans"
      - "POST /treatment-plans/{id}/routes"
      - "POST /treatment-plans/{id}/transitions with action IN {SUBMIT, REVISE}"
    shared_operations:
      - "all GET endpoints"

  - name: AbatementManager
    description: "Abatement manager: approves plans (never one it submitted), commits and settles routes, and manages complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /treatment-plans/{id}/transitions with action IN {APPROVE, RETURN, SCHEDULE, START, SUSPEND, RESUME, COMPLETE, CANCEL}"
      - "POST /treatment-routes/{id}/transitions with action IN {COMMIT, VERIFY, VOID, RELEASE}"
      - "POST /trap-collections/{id}/transitions with action=VOID"
      - "POST /service-requests/{id}/transitions with action IN {TRIAGE, ASSIGN, REOPEN, CLOSE}"
    shared_operations:
      - "all GET endpoints"

  - name: SensitiveSiteOperator
    description: "Beekeeper / organic grower of a registered sensitive site: acknowledges spray notices for its own site"
    identity: "entity_backed:SensitiveSite"
    exclusive_operations:
      - "POST /notifications/{id}/transitions with action=ACKNOWLEDGE (only for notifications addressed to its own site)"
    shared_operations:
      - "GET /notifications, GET /notifications/{id}, GET /service-areas/{id}/sensitive-sites"

  - name: Resident
    description: "Member of the public filing mosquito complaints"
    identity: "opaque"
    exclusive_operations:
