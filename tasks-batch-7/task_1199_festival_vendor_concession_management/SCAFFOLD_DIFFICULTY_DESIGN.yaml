  - rule_id: transitive_cascade
    instances:
      - name: fine_payment_strike_contagion_depth3
        grounds:
          - calculations.strike_contagion
          - state_machines.ComplianceFine.ACKNOWLEDGED_to_PAID
          - state_machines.VendorApplication.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /compliance-fines/{id}/mark-paid:
          fine -> PAID (link 1) mutates Vendor.compliance_strikes to 3 which itself
          flips Vendor -> SUSPENDED (link 2) which itself rejects the vendor's
          pending application in ANOTHER festival (link 3). Each link is caused by
          the previous mutation, not by the original call; the suspension fires
          exactly at strikes == 3 (>= boundary).
