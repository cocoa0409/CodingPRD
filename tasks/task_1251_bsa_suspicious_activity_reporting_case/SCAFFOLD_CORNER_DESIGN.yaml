      - name: duplicate_314b_send_within_buffer_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_314B_DUPLICATE_WINDOW]", "validations[priority=12]"]
        distinguishing_aspect: "The trailing closed 90-day duplicate buffer: a second OUTBOUND share to the same counterparty about the same subject within 90 days of a SENT share is rejected; one to a DIFFERENT counterparty is fine."
        test_recipe:
          setup: ["Customer cu1; isr1 (OUTBOUND, INST-9) already SENT at default clock 2026-05-01; isr2 (OUTBOUND, INST-9, same subject) and isr3 (OUTBOUND, INST-10, same subject) both DRAFT; clock at 2026-05-20 (19 days later, inside the buffer)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Initial coordination" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1: $.data.id } }
            - { call: "POST /info-share-requests/${isr1}/send", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Duplicate to same counterparty" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr2: $.data.id } }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-10", subject_customer_id: "${cu1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Different counterparty" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /info-share-requests/${isr2}/send", as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
            - { call: "POST /info-share-requests/${isr3}/send", as: BSAAnalyst, as_user_id: "${an1}", captures: { isr3_status: $.data.status } }
          assert:
            - "isr2 send: 409 ERR_314B_DUPLICATE_WINDOW (same counterparty+subject within 90 days); status stays DRAFT"
            - "isr3 send succeeds (different counterparty): status == SENT, sent_at == 2026-05-20T00:00:00Z"

