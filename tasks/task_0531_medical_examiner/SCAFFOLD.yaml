scenario: "Coroner / Medical Examiner Case Management: death-report intake & jurisdiction, case type (natural/accident/homicide) & investigation, body intake & cooler/morgue inventory, autopsy scheduling & findings, toxicology & specimen, death-certificate cause/manner sign-off, next-of-kin & property release, indigent disposition ."
domain_name: "medical-examiner-case-management"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Temporal windowing"

  entity_topology: hybrid
  # Case is the aggregate root (hierarchical: Case -> Body -> Specimen), but
  # CoolerUnit and DeathCertificate cross-cut via foreign keys (flat references),
  # and Investigator/Pathologist roles are entity-backed peers.

  state_machine_shape: branching
  # Case forks on case_type triage into {NATURAL, ACCIDENT, HOMICIDE} lanes with
  # divergent required-artifact sets before certification; DeathCertificate has a
  # revert (amendment) cycle; Body cooler occupancy is a guarded compound.

  relationship_patterns:
    - one_to_many          # Case has many Specimen (via Body), many PropertyItem
    - cross_aggregate      # DeathCertificate references Case AND Pathologist; Body references CoolerUnit

  role_model: segregation_of_duties
  # The Pathologist who performs the autopsy MUST NOT be the medical examiner who
  # signs the certificate off; the Investigator who runs the case MUST NOT approve
  # the property release. Same person cannot do both steps of a guarded pair.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: decedent_name
        type: string
        source: input
        description: "Legal name of the decedent; 'UNKNOWN' permitted for John/Jane Doe intakes."
      - name: reported_death_at
        type: datetime
        source: input
        description: "Reported instant of death (ISO 8601 UTC); used to compute jurisdiction window."
      - name: death_location_county
        type: string
        source: input
        description: "County where death occurred or body was found; drives jurisdiction acceptance."
      - name: jurisdiction_status
        type: enum
        source: computed
        description: "ACCEPTED | DECLINED — set at triage from county match against served_counties config."
        constraints: "one of {ACCEPTED, DECLINED}"
      - name: case_type
        type: enum
        source: input
        description: "Manner-of-death lane assigned at triage."
        constraints: "one of {NATURAL, ACCIDENT, HOMICIDE, PENDING}"
        default: "PENDING"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 Case state machine."
        constraints: "one of {REPORTED, ACCEPTED, INVESTIGATING, CERTIFIED, CLOSED, DECLINED}"
        default: "REPORTED"
      - name: investigator_user_id
        type: string
        source: input
        description: "FK -> Investigator.id; the assigned lead investigator."
      - name: served_county
        type: boolean
        source: computed
        description: "True iff death_location_county is in the jurisdiction served_counties list at triage."
      - name: autopsy_required
        type: boolean
        source: computed
        description: "Derived at triage: HOMICIDE always true; ACCIDENT true; NATURAL false; PENDING false."
      - name: closed_at
        type: datetime
        source: computed
        description: "Timestamp when Case entered CLOSED; null until then."

  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Investigator display name."
      - name: badge_no
        type: string
        source: input
        description: "Unique badge identifier."
        constraints: "unique across Investigator"
      - name: active
        type: boolean
        source: input
        description: "Whether the investigator may be assigned to new cases."
        default: true

  - name: Pathologist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Pathologist display name."
      - name: license_no
        type: string
        source: input
        description: "State medical license number; unique."
        constraints: "unique across Pathologist"
      - name: is_medical_examiner
        type: boolean
        source: input
        description: "True iff this pathologist holds ME sign-off authority (may certify)."
        default: false

  - name: CoolerUnit
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label e.g. 'COOLER-A'; unique."
        constraints: "unique across CoolerUnit"
      - name: slot_capacity
        type: integer
        source: input
        description: "Total body storage slots in this cooler unit."
        constraints: ">= 1"
      - name: temperature_c
        type: number
        source: input
        description: "Set-point temperature in Celsius."
        default: 4
      - name: occupied_slots
        type: integer
        source: computed
        description: "Count of Body rows with cooler_unit_id == this.id and storage_status == STORED."
        default: 0
      - name: out_of_service
        type: boolean
        source: input
        description: "When true, no new bodies may be stored here."
        default: false

  - name: Body
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this body belongs to (1:1 with Case)."
      - name: tag_no
        type: string
        source: input
        description: "Toe-tag identifier; unique across Body."
        constraints: "unique across Body"
      - name: cooler_unit_id
        type: string
        source: computed
        description: "FK -> CoolerUnit.id; cooler currently storing this body; null when RELEASED or not yet stored."
      - name: storage_status
        type: enum
        source: computed
        description: "See §1.2 Body state machine."
        constraints: "one of {INTAKE, STORED, RELEASED}"
        default: "INTAKE"
      - name: intake_at
        type: datetime
        source: computed
        description: "Logical-clock instant when body was intaken; used for cooler occupancy-day billing."
      - name: released_at
        type: datetime
        source: computed
        description: "Logical-clock instant when body was released; null while STORED/INTAKE."
      - name: release_blocked
        type: boolean
        source: computed
        description: "True while the parent Case is not CERTIFIED and no indigent disposition path is open; gates body release."

  - name: AutopsyExam
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case examined (1:1 with Case)."
      - name: pathologist_user_id
        type: string
        source: input
        description: "FK -> Pathologist.id; the pathologist performing the exam."
      - name: scheduled_for
        type: datetime
        source: input
        description: "Requested autopsy start instant (ISO 8601 UTC)."
      - name: duration_minutes
        type: integer
        source: input
        description: "Requested exam duration; occupies the pathologist's schedule as a half-open interval."
        constraints: ">= 30"
      - name: exam_status
        type: enum
        source: computed
        description: "See §1.2 AutopsyExam state machine."
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
        default: "SCHEDULED"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "Forward-looking fee quoted at scheduling; see calculation autopsy_fee_estimate."
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Actual fee billed at completion; see calculation autopsy_fee_final. Null until COMPLETED."
      - name: primary_finding
        type: string
        source: input
        description: "Free-text gross finding recorded at completion; required to complete."
      - name: cause_of_death
        type: string
        source: input
        description: "Proximate cause proposed by pathologist at completion; feeds certificate sign-off."

  - name: Specimen
    parent: Body
    common_fields: true
    fields:
      - name: body_id
        type: string
        source: input
        description: "FK -> Body.id; the body this specimen was collected from."
      - name: specimen_type
        type: enum
        source: input
        description: "Collected specimen kind."
        constraints: "one of {BLOOD, URINE, VITREOUS, TISSUE}"
      - name: collected_at
        type: datetime
        source: computed
        description: "Logical-clock instant of collection."
      - name: chain_status
        type: enum
        source: computed
        description: "See §1.2 Specimen state machine (chain of custody)."
        constraints: "one of {COLLECTED, SENT_TO_LAB, CONSUMED, DISCARDED}"
        default: "COLLECTED"

  - name: ToxScreen
    parent: Specimen
    common_fields: true
    fields:
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; the specimen assayed (1:1 with Specimen)."
      - name: panel
        type: enum
        source: input
        description: "Assay panel ordered."
        constraints: "one of {BASIC, EXPANDED, CONFIRMATORY}"
      - name: result_status
        type: enum
        source: computed
        description: "See §1.2 ToxScreen state machine."
        constraints: "one of {ORDERED, RESULTED, AMENDED}"
        default: "ORDERED"
      - name: ethanol_mg_dl
        type: number
        source: input
        description: "Blood ethanol concentration reported at resulting; drives positive/negative interpretation."
        default: 0
      - name: interpretation
        type: enum
        source: computed
        description: "POSITIVE iff ethanol_mg_dl >= POSITIVE_THRESHOLD_MG_DL or any drug flagged; else NEGATIVE."
        constraints: "one of {PENDING, POSITIVE, NEGATIVE}"
        default: "PENDING"

  - name: DeathCertificate
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case certified (1:1 with Case)."
      - name: certifying_me_user_id
        type: string
        source: computed
        description: "FK -> Pathologist.id; the ME who signed off; null until SIGNED."
      - name: cause_of_death
        type: string
        source: input
        description: "Final cause text entered at sign-off."
      - name: manner_of_death
        type: enum
        source: input
        description: "Final manner classification asserted at sign-off; must be consistent with Case.case_type."
        constraints: "one of {NATURAL, ACCIDENT, HOMICIDE, UNDETERMINED}"
      - name: cert_status
        type: enum
        source: computed
        description: "See §1.2 DeathCertificate state machine (with amendment revert)."
        constraints: "one of {DRAFT, SIGNED, AMENDED, VOID}"
        default: "DRAFT"
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of times a SIGNED certificate has been amended."
        default: 0
      - name: signed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of sign-off; null in DRAFT."

  - name: NextOfKin
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this kin relates to."
      - name: full_name
        type: string
        source: input
        description: "Next-of-kin legal name."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to decedent; ranks release priority."
        constraints: "one of {SPOUSE, CHILD, PARENT, SIBLING, OTHER}"
      - name: verified
        type: boolean
        source: computed
        description: "Whether identity has been verified by an investigator; gates property release approval."
        default: false
      - name: contacted_at
        type: datetime
        source: computed
        description: "Logical-clock instant kin was first recorded; used for kin-priority tie-break."

  - name: PropertyItem
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case whose decedent this property belongs to."
      - name: description
        type: string
        source: input
        description: "Inventory description of the personal-effects item."
      - name: valuation_cents
        type: integer
        source: input
        description: "Appraised value in cents; feeds indigent-estate offset."
        constraints: ">= 0"
      - name: item_status
        type: enum
        source: computed
        description: "See §1.2 PropertyItem state machine."
        constraints: "one of {HELD, RELEASED, ESCHEATED}"
        default: "HELD"

  - name: PropertyRelease
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this release acts on."
      - name: next_of_kin_id
        type: string
        source: input
        description: "FK -> NextOfKin.id; the kin receiving the property."
      - name: approver_user_id
        type: string
        source: computed
        description: "FK -> Investigator.id; the investigator who approved the release; null until APPROVED."
      - name: release_status
        type: enum
        source: computed
        description: "See §1.2 PropertyRelease state machine."
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
        default: "REQUESTED"
      - name: released_item_count
        type: integer
        source: computed
        description: "Count of PropertyItem flipped HELD->RELEASED by this release on approval."
        default: 0

  - name: IndigentDisposition
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case with no claiming next-of-kin (1:1 with Case)."
      - name: statutory_allowance_cents
        type: integer
        source: input
        description: "County statutory burial allowance ceiling in cents."
        constraints: ">= 0"
      - name: itemized_cost_cents
        type: integer
        source: input
        description: "Sum of submitted itemized burial costs in cents."
        constraints: ">= 0"
      - name: county_payable_cents
        type: integer
        source: computed
        description: "County-owed amount after estate offset and allowance cap; see calculation indigent_county_payable."
        default: 0
      - name: disposition_status
        type: enum
        source: computed
        description: "See §1.2 IndigentDisposition state machine."
        constraints: "one of {DECLARED, APPROVED, BURIED}"
        default: "DECLARED"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Case
    initial_state: REPORTED
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /cases/{id}/triage with case_type != DECLINED and served county"
        actor: Investigator
        preconditions:
          - "Case.status == REPORTED"
          - "death_location_county is in jurisdiction served_counties config"
        side_effects:
          - "set jurisdiction_status = ACCEPTED, served_county = true"
          - "set case_type from request; set autopsy_required (HOMICIDE|ACCIDENT true, NATURAL false)"
          - "increments Case.version by 1"
      - from: REPORTED
        to: DECLINED
        trigger: "POST /cases/{id}/triage when death_location_county NOT in served_counties config"
        actor: Investigator
        preconditions:
          - "Case.status == REPORTED"
          - "death_location_county is NOT in jurisdiction served_counties config"
        side_effects:
          - "set jurisdiction_status = DECLINED, served_county = false"
          - "increments Case.version by 1"
        note: "Declination is terminal; no body/autopsy artifacts may be created afterward."
      - from: ACCEPTED
        to: INVESTIGATING
        trigger: "POST /cases/{id}/bodies (first body intake)"
        actor: Investigator
        preconditions:
          - "Case.status == ACCEPTED"
        side_effects:
          - "Body created in INTAKE"
          - "increments Case.version by 1"
      - from: INVESTIGATING
        to: CERTIFIED
        trigger: "POST /death-certificates/{id}/sign (ME sign-off)"
        actor: MedicalExaminer
        preconditions:
          - "Case.status == INVESTIGATING"
          - "if autopsy_required then the Case's AutopsyExam.exam_status == COMPLETED"
          - "DeathCertificate.manner_of_death consistent with Case.case_type (see validation priority 21)"
        side_effects:
          - "DeathCertificate.cert_status -> SIGNED"
          - "clear release_blocked on the Case's Body (STORED body becomes releasable)"
          - "increments Case.version by 1"
      - from: CERTIFIED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Investigator
        preconditions:
          - "Case.status == CERTIFIED"
          - "the Case's Body.storage_status == RELEASED"
          - "no PropertyItem for the Case is in HELD"
        side_effects:
          - "set closed_at = clock now"
          - "increments Case.version by 1"

  - entity: Body
    initial_state: INTAKE
    terminal_states: [RELEASED]
    transitions:
      - from: INTAKE
        to: STORED
        trigger: "POST /bodies/{id}/store with cooler_unit_id"
        actor: Investigator
        preconditions:
          - "Body.storage_status == INTAKE"
          - "target CoolerUnit.out_of_service == false"
          - "CoolerUnit.occupied_slots < CoolerUnit.slot_capacity (see validation priority 30)"
        side_effects:
          - "set cooler_unit_id, storage_status = STORED, intake_at = clock now"
          - "CoolerUnit.occupied_slots incremented by 1 (derived recompute)"
          - "set release_blocked = true (until Case CERTIFIED or indigent path open)"
          - "increments Body.version by 1"
      - from: STORED
        to: RELEASED
        trigger: "POST /bodies/{id}/release"
        actor: Investigator
        preconditions:
          - "Body.storage_status == STORED"
          - "Body.release_blocked == false (parent Case CERTIFIED, or IndigentDisposition APPROVED)"
        side_effects:
          - "set storage_status = RELEASED, released_at = clock now, cooler_unit_id = null"
          - "former CoolerUnit.occupied_slots decremented by 1 (derived recompute)"
          - "increments Body.version by 1"

  - entity: AutopsyExam
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /autopsy-exams/{id}/complete with primary_finding, cause_of_death"
        actor: Pathologist
        preconditions:
          - "AutopsyExam.exam_status == SCHEDULED"
          - "clock now >= AutopsyExam.scheduled_for"
          - "acting Pathologist.id == AutopsyExam.pathologist_user_id"
        side_effects:
          - "set exam_status = COMPLETED, primary_finding, cause_of_death"
          - "compute final_fee_cents via autopsy_fee_final"
          - "increments AutopsyExam.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /autopsy-exams/{id}/cancel"
        actor: Pathologist
        preconditions:
          - "AutopsyExam.exam_status == SCHEDULED"
        side_effects:
          - "set exam_status = CANCELLED; release the pathologist schedule interval"
          - "increments AutopsyExam.version by 1"

  - entity: Specimen
    initial_state: COLLECTED
    terminal_states: [CONSUMED, DISCARDED]
    transitions:
      - from: COLLECTED
        to: SENT_TO_LAB
        trigger: "POST /specimens/{id}/send-to-lab"
        actor: Pathologist
        preconditions:
          - "Specimen.chain_status == COLLECTED"
        side_effects:
          - "set chain_status = SENT_TO_LAB"
          - "increments Specimen.version by 1"
      - from: SENT_TO_LAB
        to: CONSUMED
        trigger: "POST /tox-screens/{id}/result (assay consumes specimen)"
        actor: LabTech
        preconditions:
          - "Specimen.chain_status == SENT_TO_LAB"
        side_effects:
          - "ToxScreen.result_status -> RESULTED; Specimen.chain_status -> CONSUMED"
          - "increments Specimen.version by 1"
      - from: COLLECTED
        to: DISCARDED
        trigger: "POST /specimens/{id}/discard"
        actor: Pathologist
        preconditions:
          - "Specimen.chain_status == COLLECTED"
        side_effects:
          - "set chain_status = DISCARDED"
          - "increments Specimen.version by 1"

  - entity: ToxScreen
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: RESULTED
        trigger: "POST /tox-screens/{id}/result with ethanol_mg_dl"
        actor: LabTech
        preconditions:
          - "ToxScreen.result_status == ORDERED"
          - "parent Specimen.chain_status == SENT_TO_LAB"
        side_effects:
          - "set ethanol_mg_dl; compute interpretation (POSITIVE iff ethanol_mg_dl >= 80)"
          - "cascade parent Specimen COLLECTED-path: Specimen.chain_status SENT_TO_LAB -> CONSUMED"
          - "increments ToxScreen.version by 1"
      - from: RESULTED
        to: AMENDED
        trigger: "POST /tox-screens/{id}/amend with ethanol_mg_dl"
        actor: LabTech
        preconditions:
          - "ToxScreen.result_status == RESULTED"
        side_effects:
          - "overwrite ethanol_mg_dl; recompute interpretation"
          - "increments ToxScreen.version by 1"
        note: "Cyclic-style revision: RESULTED->AMENDED, and AMENDED may be amended again (loop)."
      - from: AMENDED
        to: AMENDED
        trigger: "POST /tox-screens/{id}/amend (re-amend)"
        actor: LabTech
        preconditions:
          - "ToxScreen.result_status == AMENDED"
        side_effects:
          - "overwrite ethanol_mg_dl; recompute interpretation"
          - "increments ToxScreen.version by 1"

  - entity: DeathCertificate
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /death-certificates/{id}/sign"
        actor: MedicalExaminer
        preconditions:
          - "DeathCertificate.cert_status == DRAFT"
          - "acting Pathologist.is_medical_examiner == true"
          - "acting ME.id != the Case AutopsyExam.pathologist_user_id (segregation of duties, validation priority 12)"
          - "if Case.autopsy_required then Case AutopsyExam.exam_status == COMPLETED"
          - "manner_of_death consistent with Case.case_type"
        side_effects:
          - "set cert_status = SIGNED, certifying_me_user_id, signed_at = clock now"
          - "cascade Case INVESTIGATING -> CERTIFIED"
          - "cascade clear Body.release_blocked (Case CERTIFIED)"
          - "increments DeathCertificate.version by 1"
      - from: SIGNED
        to: AMENDED
        trigger: "POST /death-certificates/{id}/amend with cause_of_death, manner_of_death"
        actor: MedicalExaminer
        preconditions:
          - "DeathCertificate.cert_status == SIGNED"
          - "acting Pathologist.is_medical_examiner == true"
        side_effects:
          - "overwrite cause_of_death, manner_of_death; increment amendment_count"
          - "set cert_status = AMENDED (case remains CERTIFIED)"
          - "increments DeathCertificate.version by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /death-certificates/{id}/amend (re-amend a SIGNED-then-AMENDED cert)"
        actor: MedicalExaminer
        preconditions:
          - "DeathCertificate.cert_status == AMENDED"
          - "acting Pathologist.is_medical_examiner == true"
        side_effects:
          - "overwrite cause_of_death, manner_of_death; increment amendment_count"
          - "increments DeathCertificate.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /death-certificates/{id}/void"
        actor: MedicalExaminer
        preconditions:
          - "DeathCertificate.cert_status == DRAFT"
        side_effects:
          - "set cert_status = VOID"
          - "increments DeathCertificate.version by 1"

  - entity: PropertyRelease
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /property-releases/{id}/approve"
        actor: Investigator
        preconditions:
          - "PropertyRelease.release_status == REQUESTED"
          - "referenced NextOfKin.verified == true (validation priority 40)"
          - "Case.status IN {CERTIFIED, CLOSED}"
          - "acting Investigator.id != Case.investigator_user_id (segregation of duties, validation priority 13)"
        side_effects:
          - "set release_status = APPROVED, approver_user_id"
          - "cascade every PropertyItem for the Case in HELD -> RELEASED; set released_item_count"
          - "increments PropertyRelease.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /property-releases/{id}/deny"
        actor: Investigator
        preconditions:
          - "PropertyRelease.release_status == REQUESTED"
        side_effects:
          - "set release_status = DENIED"
          - "increments PropertyRelease.version by 1"

  - entity: IndigentDisposition
    initial_state: DECLARED
    terminal_states: [BURIED]
    transitions:
      - from: DECLARED
        to: APPROVED
        trigger: "POST /indigent-dispositions/{id}/approve"
        actor: MedicalExaminer
        preconditions:
          - "IndigentDisposition.disposition_status == DECLARED"
          - "no NextOfKin for the Case has verified == true (validation priority 41)"
          - "compute county_payable_cents via indigent_county_payable"
        side_effects:
          - "set disposition_status = APPROVED; compute county_payable_cents"
          - "cascade clear Body.release_blocked (indigent path open) so body may be released for burial"
          - "increments IndigentDisposition.version by 1"
      - from: APPROVED
        to: BURIED
        trigger: "POST /indigent-dispositions/{id}/bury"
        actor: Investigator
        preconditions:
          - "IndigentDisposition.disposition_status == APPROVED"
          - "the Case's Body.storage_status == RELEASED"
        side_effects:
          - "set disposition_status = BURIED"
          - "cascade every remaining HELD PropertyItem for the Case -> ESCHEATED"
          - "increments IndigentDisposition.version by 1"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: cert-sign-stale-case
    parent_entity: Case
    write_endpoint: "POST /death-certificates/{id}/sign"
    occ_field: "expected_case_version"
    description: |
      Signing a DeathCertificate for a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where the Case
      cascaded (e.g. an AutopsyExam completion bumped Case.version) after the ME
      read the case, so the ME's view of readiness is stale and the sign-off must
      be re-derived against the current Case.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: body-store-stale-cooler
    parent_entity: CoolerUnit
    write_endpoint: "POST /bodies/{id}/store"
    occ_field: "expected_cooler_version"
    description: |
      Storing a Body into a CoolerUnit whose version has advanced since the client
      last observed it is rejected. Another store/release against that cooler has
      changed its occupied_slots (bumping CoolerUnit.version), so a slot the client
      believed free may now be taken; the stale view is rejected before the write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: autopsy_fee_estimate
    trigger: "on AutopsyExam creation (POST /cases/{id}/autopsy-exams)"
    algorithm: forward_looking
    formula: |
      # Forward-looking quote from the REQUESTED plan; assumes standard case load.
      base = BASE_FEE_CENTS
      # projected duration surcharge uses the REQUESTED duration_minutes, billed
      # per whole 30-min block, block count ROUNDED UP (ceil):
      blocks = ceil(duration_minutes / 30)
      duration_surcharge = blocks * BLOCK_FEE_CENTS
      # homicide complexity multiplier applied to (base + surcharge):
      subtotal = base + duration_surcharge
      if Case.case_type == HOMICIDE:
          subtotal = round_half_up(subtotal * HOMICIDE_MULT)
      estimated_fee_cents = subtotal
    input_set: "Single AutopsyExam being created plus its parent Case.case_type at creation time."
    constants:
      BASE_FEE_CENTS: 150000
      BLOCK_FEE_CENTS: 20000
      HOMICIDE_MULT: 1.5
    precision: "integer cents; round_half_up when the homicide multiplier introduces a fraction"
    variants:
      - name: estimate
        when: "at scheduling; uses requested duration_minutes and projected standard load"
        difference: "duration_surcharge billed on requested duration_minutes, no overtime, no specimen add-on"

  - name: autopsy_fee_final
    trigger: "on AutopsyExam completion (POST /autopsy-exams/{id}/complete)"
    algorithm: chronological
    formula: |
      # Actual bill computed at completion from real elapsed time and collected
      # specimens. Elapsed time = (clock now - scheduled_for) in minutes, floored
      # to whole minutes, then billed per whole 30-min block ROUNDED UP (ceil),
      # but never fewer blocks than the requested duration would imply.
      elapsed_min = floor((clock_now - scheduled_for) / 60_seconds)
      billed_min = max(elapsed_min, duration_minutes)
      blocks = ceil(billed_min / 30)
      duration_surcharge = blocks * BLOCK_FEE_CENTS
      # per-specimen add-on: count Specimen rows for the Case's Body whose
      # chain_status IN {SENT_TO_LAB, CONSUMED} at completion (COLLECTED and
      # DISCARDED excluded):
      billable_specimens = count(Specimen where body.case_id == Case.id
                                 and chain_status IN {SENT_TO_LAB, CONSUMED})
      specimen_addon = billable_specimens * SPECIMEN_FEE_CENTS
      subtotal = BASE_FEE_CENTS + duration_surcharge + specimen_addon
      if Case.case_type == HOMICIDE:
          subtotal = round_half_up(subtotal * HOMICIDE_MULT)
      final_fee_cents = subtotal
    input_set: "The completing AutopsyExam, elapsed logical-clock time since scheduled_for, and the Case's collected specimens filtered by chain_status."
    constants:
      BASE_FEE_CENTS: 150000
      BLOCK_FEE_CENTS: 20000
      SPECIMEN_FEE_CENTS: 5000
      HOMICIDE_MULT: 1.5
    precision: "integer cents; round_half_up on the homicide multiplier. Multiplier applies AFTER specimen add-on (pinned order)."
    variants:
      - name: final
        when: "at completion; uses real elapsed time and billable specimen count"
        difference: "adds per-specimen add-on and overtime blocks absent from the estimate; same inputs yield a larger or equal number than the estimate"

  - name: indigent_county_payable
    trigger: "on IndigentDisposition approval (POST /indigent-dispositions/{id}/approve)"
    algorithm: waterfall_allocation
    formula: |
      # Estate offset then statutory cap, applied in this pinned order:
      # 1) The decedent's property estate offsets cost first.
      estate_value = sum(PropertyItem.valuation_cents for the Case where item_status == HELD)
      # 2) Cost owed after estate is applied to itemized_cost_cents (floored at 0):
      cost_after_estate = max(itemized_cost_cents - estate_value, 0)
      # 3) County pays the smaller of cost_after_estate and the statutory ceiling:
      county_payable_cents = min(cost_after_estate, statutory_allowance_cents)
    input_set: "The IndigentDisposition being approved, its statutory_allowance_cents and itemized_cost_cents, and the sum of HELD PropertyItem valuations for the Case."
    constants: {}
    precision: "integer cents; no rounding (all inputs are integer cents)"
    variants:
      - name: with_estate_offset
        when: "when the Case has HELD PropertyItem rows; estate reduces cost before the cap"
        difference: "estate_value > 0 lowers cost_after_estate, which can pull county_payable below the itemized cost even when itemized < allowance"

  - name: cooler_occupancy_days
    trigger: "read on GET /cooler-units/{id}/occupancy-report"
    algorithm: aggregation
    formula: |
      # Whole-day cooler occupancy per stored body, billed per started day.
      # For each Body with cooler_unit_id == this cooler and storage_status == STORED:
      #   end = clock_now; start = intake_at
      #   elapsed_seconds = end - start
      #   days = ceil(elapsed_seconds / 86400)   # a started day counts as a full day; 0 seconds -> 0 days
      #   day 0 rule: if elapsed_seconds == 0 then days = 0 (boundary: exactly-now intake bills nothing)
      # total_occupied_slots = count of such bodies (== CoolerUnit.occupied_slots)
      # total_body_days = sum of per-body days
      total_body_days = sum(ceil((clock_now - body.intake_at) / 86400)
                            for body in STORED bodies of this cooler
                            if (clock_now - body.intake_at) > 0)
    input_set: "All Body rows with cooler_unit_id == this cooler and storage_status == STORED, at read time against the logical clock."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days; ceil per body (started day = full day); zero-elapsed body contributes 0"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /cases (report intake, Anonymous allowed)"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 10
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 11
    category: auth
    check: "For entity_backed acting roles, X-User-ID matches an existing entity of that role type"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all authenticated operations"
  - priority: 12
    category: business_safety
    check: "Certificate sign-off: acting ME.id must NOT equal the Case AutopsyExam.pathologist_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /death-certificates/{id}/sign"
  - priority: 13
    category: business_safety
    check: "Property release approval: acting Investigator.id must NOT equal Case.investigator_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /property-releases/{id}/approve"
  - priority: 20
    category: existence
    check: "All path/body-referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource-scoped operations"
  - priority: 21
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"
  - priority: 22
    category: state
    check: "Case is not DECLINED before creating any Body/AutopsyExam/certificate artifact"
    error_id: ERR_CASE_DECLINED
    http_status: 409
    applies_to: "POST /cases/{id}/bodies, POST /cases/{id}/autopsy-exams, POST /cases/{id}/death-certificate"
  - priority: 23
    category: business_referential
    check: "Certificate manner_of_death must be consistent with Case.case_type (HOMICIDE case may not certify manner NATURAL; NATURAL case may not certify HOMICIDE; UNDETERMINED always allowed)"
    error_id: ERR_MANNER_INCONSISTENT
    http_status: 422
    applies_to: "POST /death-certificates/{id}/sign"
  - priority: 24
    category: business_constraint
    check: "Certificate may not be signed while a required autopsy (Case.autopsy_required) has AutopsyExam.exam_status != COMPLETED"
    error_id: ERR_AUTOPSY_INCOMPLETE
    http_status: 409
    applies_to: "POST /death-certificates/{id}/sign"
  - priority: 25
    category: business_constraint
    check: "AutopsyExam completion requires clock now >= scheduled_for"
    error_id: ERR_EXAM_NOT_DUE
    http_status: 409
    applies_to: "POST /autopsy-exams/{id}/complete"
  - priority: 30
    category: business_constraint
    check: "Cooler must have a free slot: CoolerUnit.occupied_slots < CoolerUnit.slot_capacity (>= is full)"
    error_id: ERR_COOLER_FULL
    http_status: 409
    applies_to: "POST /bodies/{id}/store"
  - priority: 31
    category: business_constraint
    check: "Target CoolerUnit.out_of_service must be false"
    error_id: ERR_COOLER_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /bodies/{id}/store"
  - priority: 32
    category: business_temporal
    check: "AutopsyExam requested [scheduled_for, scheduled_for + duration_minutes) half-open interval must not overlap another SCHEDULED exam for the same pathologist_user_id; adjacency (end == next start) is allowed"
    error_id: ERR_PATHOLOGIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /cases/{id}/autopsy-exams"
  - priority: 33
    category: business_constraint
    check: "Body release requires Body.release_blocked == false"
    error_id: ERR_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /bodies/{id}/release"
  - priority: 40
    category: business_referential
    check: "Property release approval requires referenced NextOfKin.verified == true"
    error_id: ERR_KIN_UNVERIFIED
    http_status: 409
    applies_to: "POST /property-releases/{id}/approve"
  - priority: 41
    category: business_constraint
    check: "IndigentDisposition approval requires that NO NextOfKin for the Case has verified == true"
    error_id: ERR_KIN_CLAIMANT_EXISTS
    http_status: 409
    applies_to: "POST /indigent-dispositions/{id}/approve"
  - priority: 50
    category: business_fiscal
    check: "OCC: expected_<parent>_version must equal current parent version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /death-certificates/{id}/sign, POST /bodies/{id}/store"
  - priority: 60
    category: business_constraint
    check: "Required body fields present and typed; enums within declared domain; numeric constraints honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT with a body"
  - priority: 61
    category: business_constraint
    check: "Unique fields (badge_no, license_no, cooler label, body tag_no) not already used"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /investigators, POST /pathologists, POST /cooler-units, POST /cases/{id}/bodies"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Config / actors ----
  - method: POST
    path: "/investigators"
    description: "Register an investigator."
    roles: [Admin]
    code: 201
    input: [full_name, badge_no, "active?"]
    output: Investigator
    side_effects: []
  - method: GET
    path: "/investigators/{id}"
    description: "Fetch an investigator."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: Investigator
    side_effects: []
  - method: POST
    path: "/pathologists"
    description: "Register a pathologist; is_medical_examiner grants ME certify authority."
    roles: [Admin]
    code: 201
    input: [full_name, license_no, "is_medical_examiner?"]
    output: Pathologist
    side_effects: []
  - method: GET
    path: "/pathologists/{id}"
    description: "Fetch a pathologist."
    roles: [Admin, Pathologist, MedicalExaminer, Investigator]
    code: 200
    input: []
    output: Pathologist
    side_effects: []
  - method: POST
    path: "/cooler-units"
    description: "Register a cooler/morgue storage unit."
    roles: [Admin]
    code: 201
    input: [label, slot_capacity, "temperature_c?", "out_of_service?"]
    output: CoolerUnit
    side_effects: []
  - method: GET
    path: "/cooler-units/{id}"
    description: "Fetch a cooler unit with current occupied_slots."
    roles: [Admin, Investigator]
    code: 200
    input: []
    output: CoolerUnit
    side_effects: []
  - method: PATCH
    path: "/cooler-units/{id}"
    description: "Update cooler out_of_service or temperature; guarded by OCC-free simple update."
    roles: [Admin]
    code: 200
    input: ["out_of_service?", "temperature_c?"]
    output: CoolerUnit
    side_effects: ["may take cooler out of service (blocks future stores)"]
  - method: GET
    path: "/cooler-units/{id}/occupancy-report"
    description: "Computed read: total_body_days and occupied_slots per cooler_occupancy_days calculation."
    roles: [Admin, Investigator]
    code: 200
    input: []
    output: "{ occupied_slots: integer, total_body_days: integer }"
    side_effects: []

  # ---- Case intake & triage ----
  - method: POST
    path: "/cases"
    description: "Report a death (intake). Creates Case in REPORTED. Anonymous reporters allowed."
    roles: [Anonymous, Investigator, Admin]
    code: 201
    input: [decedent_name, reported_death_at, death_location_county, investigator_user_id]
    output: Case
    side_effects: ["Case created in REPORTED, case_type=PENDING"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case with computed jurisdiction/status fields."
    roles: [Admin, Investigator, MedicalExaminer, Pathologist]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases with pagination; filter by status or investigator_user_id."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: ["status?", "investigator_user_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/triage"
    description: "Triage: accept/decline jurisdiction and assign case_type lane. REPORTED->ACCEPTED or ->DECLINED."
    roles: [Investigator]
    code: 200
    input: [case_type]
    output: Case
    side_effects: ["set jurisdiction_status, case_type, autopsy_required; increments Case.version by 1"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close a certified case. CERTIFIED->CLOSED."
    roles: [Investigator]
    code: 200
    input: []
    output: Case
    side_effects: ["set closed_at; increments Case.version by 1"]

  # ---- Body & cooler inventory ----
  - method: POST
    path: "/cases/{id}/bodies"
    description: "Intake a body under a case. First body moves Case ACCEPTED->INVESTIGATING."
    roles: [Investigator]
    code: 201
    input: [tag_no]
    output: Body
    side_effects: ["Body created in INTAKE; cascade Case ACCEPTED->INVESTIGATING; increments Case.version by 1"]
  - method: GET
    path: "/cases/{id}/bodies"
    description: "List bodies for a case (reverse-reachability for Body.case_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: Body[]
    side_effects: []
  - method: GET
    path: "/bodies/{id}"
    description: "Fetch a body."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: Body
    side_effects: []
  - method: GET
    path: "/bodies"
    description: "List bodies; filter by cooler_unit_id (reverse-reachability for Body.cooler_unit_id)."
    roles: [Admin, Investigator]
    code: 200
    input: ["cooler_unit_id?", "limit?", "offset?"]
    output: Body[]
    side_effects: []
  - method: POST
    path: "/bodies/{id}/store"
    description: "Store body into a cooler slot. INTAKE->STORED. OCC on cooler."
    roles: [Investigator]
    code: 200
    input: [cooler_unit_id, expected_cooler_version]
    output: Body
    side_effects: ["set cooler_unit_id, storage_status=STORED, intake_at; recompute CoolerUnit.occupied_slots; increments CoolerUnit.version by 1; increments Body.version by 1; set release_blocked=true"]
  - method: POST
    path: "/bodies/{id}/release"
    description: "Release body from cooler. STORED->RELEASED."
    roles: [Investigator]
    code: 200
    input: []
    output: Body
    side_effects: ["set storage_status=RELEASED, released_at, cooler_unit_id=null; recompute former CoolerUnit.occupied_slots; increments CoolerUnit.version by 1; increments Body.version by 1"]

  # ---- Autopsy ----
  - method: POST
    path: "/cases/{id}/autopsy-exams"
    description: "Schedule an autopsy for the case. Creates AutopsyExam in SCHEDULED with estimated_fee_cents."
    roles: [Pathologist]
    code: 201
    input: [pathologist_user_id, scheduled_for, duration_minutes]
    output: AutopsyExam
    side_effects: ["compute estimated_fee_cents via autopsy_fee_estimate; reserve pathologist schedule interval"]
  - method: GET
    path: "/cases/{id}/autopsy-exams"
    description: "List autopsy exams for a case (reverse-reachability for AutopsyExam.case_id)."
    roles: [Admin, Investigator, MedicalExaminer, Pathologist]
    code: 200
    input: []
    output: AutopsyExam[]
    side_effects: []
  - method: GET
    path: "/autopsy-exams/{id}"
    description: "Fetch an autopsy exam."
    roles: [Admin, Investigator, MedicalExaminer, Pathologist]
    code: 200
    input: []
    output: AutopsyExam
    side_effects: []
  - method: GET
    path: "/autopsy-exams"
    description: "List autopsy exams; filter by pathologist_user_id (reverse-reachability for AutopsyExam.pathologist_user_id)."
    roles: [Admin, Pathologist, MedicalExaminer]
    code: 200
    input: ["pathologist_user_id?", "limit?", "offset?"]
    output: AutopsyExam[]
    side_effects: []
  - method: POST
    path: "/autopsy-exams/{id}/complete"
    description: "Complete an autopsy. SCHEDULED->COMPLETED; computes final_fee_cents."
    roles: [Pathologist]
    code: 200
    input: [primary_finding, cause_of_death]
    output: AutopsyExam
    side_effects: ["set exam_status=COMPLETED; compute final_fee_cents via autopsy_fee_final; increments AutopsyExam.version by 1"]
  - method: POST
    path: "/autopsy-exams/{id}/cancel"
    description: "Cancel a scheduled autopsy. SCHEDULED->CANCELLED; frees the schedule interval."
    roles: [Pathologist]
    code: 200
    input: []
    output: AutopsyExam
    side_effects: ["set exam_status=CANCELLED; release pathologist interval; increments AutopsyExam.version by 1"]

  # ---- Specimen & toxicology ----
  - method: POST
    path: "/bodies/{id}/specimens"
    description: "Collect a specimen from a body. Creates Specimen in COLLECTED."
    roles: [Pathologist]
    code: 201
    input: [specimen_type]
    output: Specimen
    side_effects: ["set collected_at"]
  - method: GET
    path: "/bodies/{id}/specimens"
    description: "List specimens for a body (reverse-reachability for Specimen.body_id)."
    roles: [Admin, Pathologist, MedicalExaminer, Investigator]
    code: 200
    input: []
    output: Specimen[]
    side_effects: []
  - method: GET
    path: "/specimens/{id}"
    description: "Fetch a specimen."
    roles: [Admin, Pathologist, MedicalExaminer, LabTech]
    code: 200
    input: []
    output: Specimen
    side_effects: []
  - method: POST
    path: "/specimens/{id}/send-to-lab"
    description: "Send specimen to lab. COLLECTED->SENT_TO_LAB."
    roles: [Pathologist]
    code: 200
    input: []
    output: Specimen
    side_effects: ["set chain_status=SENT_TO_LAB; increments Specimen.version by 1"]
  - method: POST
    path: "/specimens/{id}/discard"
    description: "Discard specimen. COLLECTED->DISCARDED."
    roles: [Pathologist]
    code: 200
    input: []
    output: Specimen
    side_effects: ["set chain_status=DISCARDED; increments Specimen.version by 1"]
  - method: POST
    path: "/specimens/{id}/tox-screens"
    description: "Order a toxicology screen for a specimen. Creates ToxScreen in ORDERED."
    roles: [Pathologist, LabTech]
    code: 201
    input: [panel]
    output: ToxScreen
    side_effects: []
  - method: GET
    path: "/specimens/{id}/tox-screens"
    description: "List tox screens for a specimen (reverse-reachability for ToxScreen.specimen_id)."
    roles: [Admin, Pathologist, MedicalExaminer, LabTech]
    code: 200
    input: []
    output: ToxScreen[]
    side_effects: []
  - method: GET
    path: "/tox-screens/{id}"
    description: "Fetch a tox screen."
    roles: [Admin, Pathologist, MedicalExaminer, LabTech]
    code: 200
    input: []
    output: ToxScreen
    side_effects: []
  - method: POST
    path: "/tox-screens/{id}/result"
    description: "Report tox result. ORDERED->RESULTED; consumes specimen; computes interpretation."
    roles: [LabTech]
    code: 200
    input: [ethanol_mg_dl]
    output: ToxScreen
    side_effects: ["set ethanol_mg_dl, interpretation; cascade Specimen SENT_TO_LAB->CONSUMED; increments ToxScreen.version by 1; increments Specimen.version by 1"]
  - method: POST
    path: "/tox-screens/{id}/amend"
    description: "Amend a resulted tox screen. RESULTED->AMENDED or AMENDED->AMENDED (loop)."
    roles: [LabTech]
    code: 200
    input: [ethanol_mg_dl]
    output: ToxScreen
    side_effects: ["overwrite ethanol_mg_dl; recompute interpretation; increments ToxScreen.version by 1"]

  # ---- Death certificate ----
  - method: POST
    path: "/cases/{id}/death-certificate"
    description: "Draft the death certificate for a case. Creates DeathCertificate in DRAFT (1:1)."
    roles: [MedicalExaminer]
    code: 201
    input: [cause_of_death, manner_of_death]
    output: DeathCertificate
    side_effects: []
  - method: GET
    path: "/cases/{id}/death-certificate"
    description: "List (0 or 1) the case's death certificate (reverse-reachability for DeathCertificate.case_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: DeathCertificate[]
    side_effects: []
  - method: GET
    path: "/death-certificates/{id}"
    description: "Fetch a death certificate."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: DeathCertificate
    side_effects: []
  - method: GET
    path: "/death-certificates"
    description: "List death certificates; filter by certifying_me_user_id (reverse-reachability for DeathCertificate.certifying_me_user_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: ["certifying_me_user_id?", "limit?", "offset?"]
    output: DeathCertificate[]
    side_effects: []
  - method: POST
    path: "/death-certificates/{id}/sign"
    description: "ME signs certificate. DRAFT->SIGNED; cascades Case->CERTIFIED and clears Body.release_blocked. OCC on Case."
    roles: [MedicalExaminer]
    code: 200
    input: [expected_case_version]
    output: DeathCertificate
    side_effects: ["set cert_status=SIGNED, certifying_me_user_id, signed_at; cascade Case INVESTIGATING->CERTIFIED; cascade clear Body.release_blocked; increments Case.version by 1; increments DeathCertificate.version by 1"]
  - method: POST
    path: "/death-certificates/{id}/amend"
    description: "Amend a signed certificate. SIGNED->AMENDED or AMENDED->AMENDED."
    roles: [MedicalExaminer]
    code: 200
    input: [cause_of_death, manner_of_death]
    output: DeathCertificate
    side_effects: ["overwrite cause_of_death, manner_of_death; increment amendment_count; increments DeathCertificate.version by 1"]
  - method: POST
    path: "/death-certificates/{id}/void"
    description: "Void a draft certificate. DRAFT->VOID."
    roles: [MedicalExaminer]
    code: 200
    input: []
    output: DeathCertificate
    side_effects: ["set cert_status=VOID; increments DeathCertificate.version by 1"]

  # ---- Next of kin ----
  - method: POST
    path: "/cases/{id}/next-of-kin"
    description: "Record a next-of-kin for a case. Creates NextOfKin unverified."
    roles: [Investigator]
    code: 201
    input: [full_name, relationship]
    output: NextOfKin
    side_effects: ["set contacted_at"]
  - method: GET
    path: "/cases/{id}/next-of-kin"
    description: "List next-of-kin for a case (reverse-reachability for NextOfKin.case_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: NextOfKin[]
    side_effects: []
  - method: GET
    path: "/next-of-kin/{id}"
    description: "Fetch a next-of-kin."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: NextOfKin
    side_effects: []
  - method: POST
    path: "/next-of-kin/{id}/verify"
    description: "Investigator verifies kin identity; sets verified=true."
    roles: [Investigator]
    code: 200
    input: []
    output: NextOfKin
    side_effects: ["set verified=true; increments NextOfKin.version by 1"]

  # ---- Property ----
  - method: POST
    path: "/cases/{id}/property-items"
    description: "Add a personal-effects inventory item. Creates PropertyItem in HELD."
    roles: [Investigator]
    code: 201
    input: [description, valuation_cents]
    output: PropertyItem
    side_effects: []
  - method: GET
    path: "/cases/{id}/property-items"
    description: "List property items for a case (reverse-reachability for PropertyItem.case_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: PropertyItem[]
    side_effects: []
  - method: GET
    path: "/property-items/{id}"
    description: "Fetch a property item."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: PropertyItem
    side_effects: []
  - method: POST
    path: "/cases/{id}/property-releases"
    description: "Request release of all held property to a next-of-kin. Creates PropertyRelease in REQUESTED."
    roles: [Investigator]
    code: 201
    input: [next_of_kin_id]
    output: PropertyRelease
    side_effects: []
  - method: GET
    path: "/cases/{id}/property-releases"
    description: "List property releases for a case (reverse-reachability for PropertyRelease.case_id and next_of_kin_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: ["next_of_kin_id?"]
    output: PropertyRelease[]
    side_effects: []
  - method: GET
    path: "/property-releases/{id}"
    description: "Fetch a property release."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: PropertyRelease
    side_effects: []
  - method: GET
    path: "/property-releases"
    description: "List property releases; filter by next_of_kin_id or approver_user_id (reverse-reachability for PropertyRelease.next_of_kin_id and approver_user_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: ["next_of_kin_id?", "approver_user_id?", "limit?", "offset?"]
    output: PropertyRelease[]
    side_effects: []
  - method: POST
    path: "/property-releases/{id}/approve"
    description: "Approve a property release. REQUESTED->APPROVED; cascades HELD PropertyItem->RELEASED. Segregation of duties."
    roles: [Investigator]
    code: 200
    input: []
    output: PropertyRelease
    side_effects: ["set release_status=APPROVED, approver_user_id; cascade HELD PropertyItem->RELEASED; set released_item_count; increments PropertyRelease.version by 1"]
  - method: POST
    path: "/property-releases/{id}/deny"
    description: "Deny a property release. REQUESTED->DENIED."
    roles: [Investigator]
    code: 200
    input: []
    output: PropertyRelease
    side_effects: ["set release_status=DENIED; increments PropertyRelease.version by 1"]

  # ---- Indigent disposition ----
  - method: POST
    path: "/cases/{id}/indigent-disposition"
    description: "Declare an indigent disposition for an unclaimed decedent. Creates IndigentDisposition in DECLARED (1:1)."
    roles: [Investigator]
    code: 201
    input: [statutory_allowance_cents, itemized_cost_cents]
    output: IndigentDisposition
    side_effects: []
  - method: GET
    path: "/cases/{id}/indigent-disposition"
    description: "List (0 or 1) the case's indigent disposition (reverse-reachability for IndigentDisposition.case_id)."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: IndigentDisposition[]
    side_effects: []
  - method: GET
    path: "/indigent-dispositions/{id}"
    description: "Fetch an indigent disposition with computed county_payable_cents."
    roles: [Admin, Investigator, MedicalExaminer]
    code: 200
    input: []
    output: IndigentDisposition
    side_effects: []
  - method: POST
    path: "/indigent-dispositions/{id}/approve"
    description: "Approve indigent disposition. DECLARED->APPROVED; computes county_payable_cents; opens body release."
    roles: [MedicalExaminer]
    code: 200
    input: []
    output: IndigentDisposition
    side_effects: ["compute county_payable_cents via indigent_county_payable; cascade clear Body.release_blocked; increments IndigentDisposition.version by 1"]
  - method: POST
    path: "/indigent-dispositions/{id}/bury"
    description: "Record burial. APPROVED->BURIED; escheats remaining HELD property."
    roles: [Investigator]
    code: 200
    input: []
    output: IndigentDisposition
    side_effects: ["set disposition_status=BURIED; cascade remaining HELD PropertyItem->ESCHEATED; increments IndigentDisposition.version by 1"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute instant. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advance/rewind the logical clock used by all datetime stamping and time-gated preconditions"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for the operation, or entity_backed X-User-ID does not resolve."
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Same person attempts both steps of a segregation-of-duties pair (autopsy vs sign-off; case lead vs release approval)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state."
  - id: ERR_CASE_DECLINED
    http: 409
    condition: "Artifact creation attempted on a DECLINED case."
  - id: ERR_MANNER_INCONSISTENT
    http: 422
    condition: "Certificate manner_of_death conflicts with Case.case_type lane."
  - id: ERR_AUTOPSY_INCOMPLETE
    http: 409
    condition: "Sign-off attempted while a required autopsy is not COMPLETED."
  - id: ERR_EXAM_NOT_DUE
    http: 409
    condition: "Autopsy completion attempted before scheduled_for."
  - id: ERR_COOLER_FULL
    http: 409
    condition: "Cooler occupied_slots >= slot_capacity on store."
  - id: ERR_COOLER_OUT_OF_SERVICE
    http: 409
    condition: "Store attempted into an out_of_service cooler."
  - id: ERR_PATHOLOGIST_DOUBLE_BOOKED
    http: 409
    condition: "Requested autopsy interval overlaps an existing SCHEDULED exam for the same pathologist."
  - id: ERR_RELEASE_BLOCKED
    http: 409
    condition: "Body release attempted while release_blocked is true."
  - id: ERR_KIN_UNVERIFIED
    http: 409
    condition: "Property release approval attempted with an unverified next-of-kin."
  - id: ERR_KIN_CLAIMANT_EXISTS
    http: 409
    condition: "Indigent disposition approval attempted while a verified next-of-kin exists."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match current parent version."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Unique field value (badge_no, license_no, cooler label, body tag_no) already used."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, out-of-domain enum, or violated numeric constraint."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Admin
    description: "System operator: registers actors and cooler units, sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /investigators"
      - "POST /pathologists"
      - "POST /cooler-units"
      - "PATCH /cooler-units/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
  - name: Investigator
    description: "Lead case investigator: triage, body inventory, kin, property, indigent declaration/burial."
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "POST /cases/{id}/triage"
      - "POST /cases/{id}/bodies"
      - "POST /bodies/{id}/store"
      - "POST /bodies/{id}/release"
      - "POST /cases/{id}/next-of-kin"
      - "POST /next-of-kin/{id}/verify"
      - "POST /cases/{id}/property-items"
      - "POST /cases/{id}/property-releases"
      - "POST /property-releases/{id}/approve"
      - "POST /property-releases/{id}/deny"
      - "POST /cases/{id}/indigent-disposition"
      - "POST /indigent-dispositions/{id}/bury"
      - "POST /cases/{id}/close"
    shared_operations:
      - "POST /cases (with Admin, Anonymous)"
      - "GET reads across case artifacts"
  - name: Pathologist
    description: "Performs autopsies and collects specimens; may hold ME authority when is_medical_examiner."
    identity: "entity_backed:Pathologist"
    exclusive_operations:
      - "POST /cases/{id}/autopsy-exams"
      - "POST /autopsy-exams/{id}/complete"
      - "POST /autopsy-exams/{id}/cancel"
      - "POST /bodies/{id}/specimens"
      - "POST /specimens/{id}/send-to-lab"
      - "POST /specimens/{id}/discard"
    shared_operations:
      - "POST /specimens/{id}/tox-screens (with LabTech)"
      - "GET reads on autopsy/specimen resources"
  - name: MedicalExaminer
    description: "A Pathologist with is_medical_examiner=true; drafts, signs, amends, voids certificates and approves indigent dispositions. X-User-ID is a Pathologist id."
    identity: "entity_backed:Pathologist"
    exclusive_operations:
      - "POST /cases/{id}/death-certificate"
      - "POST /death-certificates/{id}/sign"
      - "POST /death-certificates/{id}/amend"
      - "POST /death-certificates/{id}/void"
      - "POST /indigent-dispositions/{id}/approve"
    shared_operations:
      - "GET reads across case artifacts"
  - name: LabTech
    description: "Laboratory technician: resolves and amends toxicology screens."
    identity: "opaque"
    exclusive_operations:
      - "POST /tox-screens/{id}/result"
      - "POST /tox-screens/{id}/amend"
    shared_operations:
      - "POST /specimens/{id}/tox-screens (with Pathologist)"
      - "GET reads on specimen/tox resources"
  - name: Anonymous
    description: "Unauthenticated death reporter; may only file an intake."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cases (with Investigator, Admin)"
