              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_b_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_b_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_b_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_b_id}", name: "Club Pallet Drop", window_start: "2026-08-03", window_end: "2026-08-17", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_b_v1}" }
