            - "Both entries still PENDING (pre-finalization)"

      - name: calc_usage_charge_variants
        claim_type: variant_divergence
        grounds:
          - "calculations.usage_charge"
        excluded_because:
          difficulty_instance: usage_charge_provisional_vs_final_on_booking
          rationale: "Provisional-vs-final divergence (18000 vs 15000) is asserted by the named §1.8 instance."
      - name: calc_nested_rounding_order
        claim_type: precision
        grounds:
          - "calculations.usage_charge"
        excluded_because:
          difficulty_instance: usage_charge_nested_rounding_order
          rationale: "Ceil-increment -> floor -> single money-rounding order pinned and asserted (12500 / 6000) by the named §1.8 instance."
      - name: calc_waterfall_order
        claim_type: correct_result
        grounds:
          - "calculations.subsidy_offset_waterfall"
        excluded_because:
          difficulty_instance: subsidy_waterfall_evaluation_order
          rationale: "valid_until-ASC ordering with per-award remainder asserts covered by the named §1.8 instance."
      - name: calc_trueup_variants
        claim_type: variant_divergence
        grounds:
          - "calculations.fiscal_trueup"
        excluded_because:
          difficulty_instance: fiscal_trueup_accrual_vs_cash_on_fiscal_year
          rationale: "Accrual 24000 vs cash 9000 asserted by the named §1.8 instance."
      - name: calc_break_even_variants
        claim_type: variant_divergence
        grounds:
          - "calculations.break_even_review"
        excluded_because:
          difficulty_instance: break_even_projected_vs_actual_on_rate_set
          rationale: "Projected PASS vs actual -155000 deficit asserted by the named §1.8 instance."
      - name: calc_training_expiry_boundary
        claim_type: correct_result
        grounds:
          - "calculations.training_expiry"
        excluded_because:
          difficulty_instance: training_recertification_cycle
          rationale: "Expiry at exactly expires_at (>= boundary) asserted by the named §1.8 instance."
      - name: calc_penalty_tiers_and_boundary
        claim_type: correct_result
        grounds:
          - "calculations.cancellation_penalty"
        excluded_because:
          difficulty_instance: penalty_free_window_exact_boundary
          rationale: "Free-window >= boundary (0 vs 9000) asserted by the named §1.8 instance; tiered branching asserted by cancellation_penalty_tiered_branching."

  # ===========================================================================
  # Section 4 — validations (violation -> error, satisfaction -> pass)
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_calls_401
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Priority-1 gate: a call with NO X-User-Role/X-User-ID headers is 401 ERR_UNAUTHENTICATED, and an entity-backed role whose X-User-ID references a non-existent User is likewise 401 (identity resolution failure), both before any role/existence check."
        test_recipe:
          setup: ["one instrument exists so the target endpoint is resolvable"]
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
          trigger:
            # Branch 1: generated test sends NO auth headers at all (the `as`
            # below only documents the intended target; headers are omitted).
            - { call: "GET /instruments/${i1}", payload: {}, as: FacilityAdmin, captures: { err1: $.data.error_id } }
            # Branch 2: Researcher header with an X-User-ID that is not any User.id.
            - { call: "GET /instruments/${i1}", payload: {}, as: Researcher, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err2: $.data.error_id } }
          assert:
            - "Branch 1 (headers absent): error_id == ERR_UNAUTHENTICATED with HTTP 401"
            - "Branch 2 (entity-backed id not found): error_id == ERR_UNAUTHENTICATED with HTTP 401"

      - name: booking_start_in_past
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_BOOKING_IN_PAST]"
        distinguishing_aspect: "With the clock at 2026-09-01T10:00Z a booking starting 09:00 same day is rejected; the check is strict (> now)."
        test_recipe:
          setup: ["canonical stack; clock advanced to 2026-09-01T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
