              payload: { name: "Prairie Coop", account_code: "PRC-002", contact_email: "billing@prairie.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-2002", full_name: "T. Boone", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-K2", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-CORN", declared_quantity_bushels: 5000, requested_services: ["GRADING"] }
              captures: { req_corn: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_corn}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-CORN", portions_count: 2 }
              captures: { smp_corn: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "SOYBEANS", point_of_service: "UNLOADING", lot_identifier: "LOT-SOY", declared_quantity_bushels: 5000, requested_services: ["GRADING"] }
              captures: { req_soy: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_soy}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-SOY", portions_count: 2 }
              captures: { smp_soy: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_soy}", sample_id: "${smp_soy}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.0, moisture_pct: 12.95, damaged_total_pct: 2.5, heat_damaged_pct: 0.3, foreign_material_pct: 1.4 }
              captures: { gr_soy: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_corn}", sample_id: "${smp_corn}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.2, moisture_pct: 14.04, damaged_total_pct: 4.0, heat_damaged_pct: 0.15, foreign_material_pct: 2.5 }
              captures: { gr_corn: "$.data.id" }
