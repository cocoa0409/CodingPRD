# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1631_life_coaching_accountability_program
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every setup chain replays from empty-DB against SCAFFOLD.yaml §1.5 only.
#
# Shared date plan (all instances pin the logical clock; server default is
# 2026-08-01T00:00:00Z):
#   2026-08-01  coaches/clients/tiers created
#   2026-08-02  discovery call 10:00Z (45 min), completed, fit-assessed
#   2026-08-03  enrollment paid -> ACTIVE (activated_at = 2026-08-03)
#   cooling-off boundary: days_elapsed = (current_date - 2026-08-03).days
#     2026-08-17 -> days_elapsed 14 (COOLING_OFF, <= boundary)
#     2026-08-18 -> days_elapsed 15 (PRO_RATA)
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_cooling_off_vs_pro_rata_same_data
        grounds:
          - calculations.refund_amount
          - entities.RefundRequest.fields.basis
          - entities.RefundRequest.fields.amount_cents
        distinguishing_aspect: |
          Fiscal dual-variant on the RefundRequest/Enrollment domain: identical enrollment
          data (price 80000, 2 sessions consumed, paid in full) yields amount_cents 65000
          under COOLING_OFF (day 14) and 55000 under PRO_RATA (day 15) — the <= boundary
          flips basis between two adjacent days.
        test_recipe:
          setup:
            - "Coach A VERIFIED (expires 2027-01-01), Coach B VERIFIED assessor, Client C"
            - "Tier PKG-8: PACKAGE, session_count 8, price_cents 80000, duration_days 56, installment_count_allowed 3, reschedule_cap 2"
            - "Two identically-shaped enrollments E1 and E2 for two clients, both ACTIVE since 2026-08-03, paid in full (80000), each with exactly 2 COMPLETED sessions"
            - "Refund on E1 filed at clock 2026-08-17 (day 14); refund on E2 filed at 2026-08-18 (day 15)"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client One", email: "c1@x.com", timezone: "America/New_York" }
              as: PracticeManager
              captures: { client_1: $.data.id }
            - call: "POST /coaching/clients"
              payload: { full_name: "Client Two", email: "c2@x.com", timezone: "America/New_York" }
              as: PracticeManager
              captures: { client_2: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_1}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_1}"
              captures: { dc_1: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_2}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T12:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_2}"
              captures: { dc_2: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_1}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_2}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_1}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 80 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/discovery-calls/${dc_2}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 75 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_1}", coach_id: "${coach_a}", program_tier_id: "${tier_id}", discovery_call_id: "${dc_1}", installment_count: 1 }
              as: Client
              as_user_id: "${client_1}"
              captures: { enr_1: $.data.id }
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_2}", coach_id: "${coach_a}", program_tier_id: "${tier_id}", discovery_call_id: "${dc_2}", installment_count: 1 }
              as: Client
              as_user_id: "${client_2}"
              captures: { enr_2: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_1}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_2}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/enrollments/${enr_1}/sessions"
              payload: { scheduled_start: "2026-08-04T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_1}"
              captures: { s_1a: $.data.id }
            - call: "POST /coaching/enrollments/${enr_1}/sessions"
              payload: { scheduled_start: "2026-08-05T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_1}"
              captures: { s_1b: $.data.id }
            - call: "POST /coaching/enrollments/${enr_2}/sessions"
              payload: { scheduled_start: "2026-08-04T13:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_2}"
              captures: { s_2a: $.data.id }
            - call: "POST /coaching/enrollments/${enr_2}/sessions"
              payload: { scheduled_start: "2026-08-05T13:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_2}"
              captures: { s_2b: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/sessions/${s_1a}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_1b}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_2a}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_2b}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
          trigger:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/refund-requests"
              payload: { enrollment_id: "${enr_1}" }
              as: Client
              as_user_id: "${client_1}"
              captures: { rr_1: $.data.id, rr_1_basis: $.data.basis, rr_1_amount: $.data.amount_cents }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/refund-requests"
              payload: { enrollment_id: "${enr_2}" }
              as: Client
              as_user_id: "${client_2}"
              captures: { rr_2: $.data.id, rr_2_basis: $.data.basis, rr_2_amount: $.data.amount_cents }
          assert:
            - "RefundRequest.${rr_1}.basis == COOLING_OFF"
            - "RefundRequest.${rr_1}.amount_cents == 65000"
            - "RefundRequest.${rr_2}.basis == PRO_RATA"
            - "RefundRequest.${rr_2}.amount_cents == 55000"
            - "65000 != 55000 — identical inputs, divergent variants across the day-14/15 boundary"
      - name: engagement_score_provisional_vs_final
        grounds:
          - calculations.client_engagement_score
          - entities.Client.fields.engagement_score
        distinguishing_aspect: |
          Weighted-scoring dual-variant on the Client domain (distinct from the fiscal
          RefundRequest domain of the sibling instance): identical counts (2 completed
          sessions, 7 completed habit check-ins) score 100 under the provisional
          week-to-date denominator at day 7 and 25 under the final 28-day denominator.
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B VERIFIED assessor, Client C, Tier PKG-8 (80000, 8 sessions, 56 days)"
            - "Enrollment ACTIVE since 2026-08-03; goal G target_count 10"
            - "Exactly 2 sessions COMPLETED (2026-08-04, 2026-08-05) and 7 check-ins completed=true dated 2026-08-03..2026-08-09"
            - "Clock pinned at 2026-08-10 (day 7 of the window anchored at 2026-08-03)"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "ACC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client E", email: "ce@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_e: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "PKG-8", tier_type: "PACKAGE", session_count: 8, price_cents: 80000, duration_days: 56, installment_count_allowed: 3, reschedule_cap: 2 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_e}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_e}"
              captures: { dc_e: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_e}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_e}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 88 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_e}", coach_id: "${coach_a}", program_tier_id: "${tier_id}", discovery_call_id: "${dc_e}", installment_count: 1 }
              as: Client
              as_user_id: "${client_e}"
              captures: { enr_e: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_e}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/enrollments/${enr_e}/goals"
              payload: { title: "Morning pages", target_count: 10 }
              as: Client
              as_user_id: "${client_e}"
              captures: { goal_e: $.data.id }
            - call: "POST /coaching/enrollments/${enr_e}/sessions"
              payload: { scheduled_start: "2026-08-04T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_e}"
              captures: { s_e1: $.data.id }
            - call: "POST /coaching/enrollments/${enr_e}/sessions"
              payload: { scheduled_start: "2026-08-05T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_e}"
              captures: { s_e2: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/sessions/${s_e1}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_e2}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-03", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-04", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-05", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-06", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-07", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
              payload: { check_in_date: "2026-08-08", completed: true }
              as: Client
              as_user_id: "${client_e}"
            - call: "POST /coaching/goals/${goal_e}/check-ins"
