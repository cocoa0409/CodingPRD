            - "After return-for-revision: status == DRAFT and revision_no == 2 (cycle closed)"
            - "After PATCH weight 5 -> 4: required_ild_lb == 40 (ceil(4*10), MEDIUM band)"
            - "Second loop: PASS at 55 auto-validates; approve -> status == APPROVED"
            - "revision_no remains 2 after the second loop"

      - name: production_order_parallel_hold_dimension
        grounds:
          - state_machines.ProductionOrder
          - entities.ProductionOrder.fields.quality_hold
          - entities.ProductionOrder.fields.fab_status
        distinguishing_aspect: |
          Entity = ProductionOrder; shape = parallel state dimensions on one row.
          quality_hold (NONE <-> ON_HOLD) evolves independently of fab_status
          (QUOTED -> CONFIRMED -> IN_PROGRESS -> COMPLETED): a hold can be applied
          mid-fabrication without changing fab_status, and complete is gated on the
          hold dimension alone.
