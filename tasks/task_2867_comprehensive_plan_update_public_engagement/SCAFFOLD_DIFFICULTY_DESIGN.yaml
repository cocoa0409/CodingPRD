            - "the second HOUSING approval returns status == \"APPROVED\" with reviewed_by_user_id == \"director-1\" and consistency_status == \"CLEARED\""
            - "PlanUpdate.${pu}.required_elements_complete_count == 2 and compliance_posture == EQUITY_HOLD (with a scenario adopted and no HousingAllocation rows housing_shortfall_total is 0, so CAPACITY_HOLD no longer applies and the 0.0 equity share is the binding hold)"

  # ===========================================================================
  # Rule 8 - resource/temporal overlap on THREE different resources with THREE
  #   different interval semantics: Venue occupancy (HALF-OPEN + symmetric
  #   buffer), the plan's environmental circulation calendar (CLOSED) and the
  #   plan's hearing calendar per body_type (CLOSED + daily cap)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_half_open_adjacency_allowed_at_zero_buffer_and_blocked_by_buffer
        grounds:
          - validations.priority_62_ERR_VENUE_TIME_CONFLICT
          - entities.Venue.turnover_buffer_minutes
          - state_machines.EngagementActivity.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Resource: Venue. Interval semantics: HALF-OPEN with a symmetric turnover buffer, so exact
          adjacency (new.start_at == existing.end_at) is legal at turnover_buffer_minutes 0 and
          illegal at 30, and the 30-minute venue only frees up at 20:30. The same wall-clock
          adjacency therefore has opposite outcomes on two venues, and a CANCELLED activity releases
          its interval entirely.
        test_recipe:
          setup:
            - "Two venues on one plan: venue A with turnover_buffer_minutes 0 and venue B with turnover_buffer_minutes 30, each already hosting a SCHEDULED WORKSHOP from 18:00 to 20:00 on 2026-08-20."
            - "The logical clock stays at its startup default 2026-08-01T00:00:00Z, so every activity is in the logical future and none can be completed."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_zero: $.data.id, zero_buffer: $.data.turnover_buffer_minutes }
            - call: "POST /planning/venues"
              payload: { name: "Civic Auditorium", seated_capacity: 300, turnover_buffer_minutes: 30, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_buf: $.data.id, buf_buffer: $.data.turnover_buffer_minutes }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_zero}", activity_type: "WORKSHOP", title: "Eastside Evening Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_zero_1: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_buf}", activity_type: "WORKSHOP", title: "Auditorium Evening Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_buf_1: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_zero}", activity_type: "WORKSHOP", title: "Eastside Late Workshop", start_at: "2026-08-20T20:00:00.000Z", end_at: "2026-08-20T22:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_zero_2: $.data.id, zero_2_status: $.data.status }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_buf}", activity_type: "WORKSHOP", title: "Auditorium Late Workshop", start_at: "2026-08-20T20:00:00.000Z", end_at: "2026-08-20T22:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_buf}", activity_type: "WORKSHOP", title: "Auditorium Late Workshop", start_at: "2026-08-20T20:30:00.000Z", end_at: "2026-08-20T22:30:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_buf_2: $.data.id, buf_2_status: $.data.status }
            - call: "POST /planning/engagement-activities/${act_buf_1}/cancel"
              payload: { cancellation_reason: "Consolidated into the later session." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { buf_1_status: $.data.status }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_buf}", activity_type: "WORKSHOP", title: "Auditorium Early Workshop", start_at: "2026-08-20T19:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_buf_3: $.data.id, buf_3_status: $.data.status }
          assert:
            - "on venue ${v_zero} (buffer 0) the 20:00 start exactly at the incumbent's end_at returns HTTP 201 with status == \"SCHEDULED\" (half-open interval, no buffer)"
            - "on venue ${v_buf} (buffer 30) the identical 20:00 start returns HTTP 409 with error_id == \"ERR_VENUE_TIME_CONFLICT\" (20:00 - 30min < 20:00)"
            - "on venue ${v_buf} the 20:30 start returns HTTP 201 (20:30 - 30min == 20:00 is not strictly less than 20:00)"
            - "after cancelling ${act_buf_1} its status == CANCELLED and a 19:00-20:00 activity that overlaps only the cancelled interval returns HTTP 201 (19:00 - 30min < 22:30 but 20:00 + 30min == 20:30 is not strictly greater than 20:30, so the surviving 20:30 activity does not conflict either)"
            - "GET /planning/engagement-activities with venue_id == ${v_buf} returns total_count == 3 (one CANCELLED, two SCHEDULED) and with venue_id == ${v_zero} returns total_count == 2"
            - "PlanUpdate.${pu}.participation_weight_total == 0.0 (nothing was completed)"

      - name: review_circulation_window_closed_interval_touching_endpoint_conflict
        grounds:
          - validations.priority_66_ERR_REVIEW_WINDOW_OVERLAP
          - state_machines.EnvironmentalReview.DRAFT_to_CIRCULATED
          - constants.EIR_COMMENT_PERIOD_DAYS
        distinguishing_aspect: |
          Resource: the plan's environmental circulation calendar. Interval semantics: CLOSED on both
          ends, the opposite of the venue rule - a second EIR whose window opens exactly on the first
          window's comment_period_ends_at (2026-09-15) is rejected with ERR_REVIEW_WINDOW_OVERLAP,
          and it is accepted one calendar day later, with the window derived from the logical clock
          rather than from any request field.
        test_recipe:
          setup:
            - "One plan carrying two DRAFT EIRs, each with two alternatives so both are circulation-eligible."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z when the first EIR circulates, giving the window 2026-08-01 -> 2026-09-15 (EIR_COMMENT_PERIOD_DAYS 45)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er1: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er1}", label: "Transit-Focused Alternative", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er1_alt_a: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er1}", label: "Auto-Oriented Alternative", traffic_vmt_index: 70, ghg_index: 70, habitat_index: 70, water_index: 70 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er1_alt_b: $.data.id }
            - call: "POST /planning/environmental-reviews/${er1}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er1_start: $.data.circulated_at, er1_end: $.data.comment_period_ends_at, er1_days: $.data.comment_period_days }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Recirculated EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er2: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er2}", label: "Transit-Focused Alternative (revised)", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er2_alt_a: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er2}", label: "Auto-Oriented Alternative (revised)", traffic_vmt_index: 70, ghg_index: 70, habitat_index: 70, water_index: 70 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er2_alt_b: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "POST /planning/environmental-reviews/${er2}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00.000Z" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "POST /planning/environmental-reviews/${er2}/circulate"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er2_start: $.data.circulated_at, er2_end: $.data.comment_period_ends_at, er2_status: $.data.status }
          assert:
            - "EnvironmentalReview.${er1}: circulated_at == \"2026-08-01T00:00:00.000Z\", comment_period_days == 45 and comment_period_ends_at == \"2026-09-15T00:00:00.000Z\""
            - "circulating ${er2} at exactly 2026-09-15T00:00:00.000Z returns HTTP 409 with error_id == \"ERR_REVIEW_WINDOW_OVERLAP\" (new_start <= existing end is a conflict because the window is closed) and leaves EnvironmentalReview.${er2}.status == DRAFT with circulated_at == null"
            - "circulating ${er2} at 2026-09-16T00:00:00.000Z returns HTTP 200 with status == \"CIRCULATED\", circulated_at == \"2026-09-16T00:00:00.000Z\" and comment_period_ends_at == \"2026-10-31T00:00:00.000Z\""
            - "EnvironmentalReview.${er1}.status is still CIRCULATED (only certification supersedes siblings, so the plan now holds two CIRCULATED reviews with disjoint windows)"
            - "PlanUpdate.${pu}.compliance_posture == CAPACITY_HOLD (no scenario is adopted; circulation does not change the posture)"

      - name: hearing_calendar_closed_interval_and_daily_cap_per_body
        grounds:
          - validations.priority_63_ERR_HEARING_SLOT_CONFLICT
          - validations.priority_64_ERR_HEARING_DAILY_CAP_EXCEEDED
          - validations.priority_78_ERR_COMMISSION_RECOMMENDATION_REQUIRED
          - state_machines.Hearing.create_preconditions
        distinguishing_aspect: |
          Resource: the plan's hearing calendar, scoped per body_type. Interval semantics: CLOSED with
          no buffer, so a hearing starting exactly at an incumbent's scheduled_end conflicts (the
          mirror image of the venue rule) and one millisecond later does not; on top of the interval
          rule an aggregate cap of MAX_HEARINGS_PER_BODY_PER_DAY (2) rejects a third non-overlapping
          COMMISSION slot on the same UTC date, while a COUNCIL slot - exempt from the COMMISSION
