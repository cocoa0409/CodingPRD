      - name: insufficient_hsa_funds_at_capture_returns_402
        claim_type: Aggregate validation
        grounds: ["validations[priority=20]", "errors[ERR_INSUFFICIENT_HSA_FUNDS]", "calculations.hsa_capture_split"]
        distinguishing_aspect: "If the patient's HSA balance is drained between order placement and capture (PATCH to 0), capture of an HSA_FSA order whose hsa_applied > 0 returns 402 ERR_INSUFFICIENT_HSA_FUNDS."
        test_recipe:
          setup: ["Offering HF @4000. Patient PHF HSA 4000 / HSA_FSA, single-line HOME_KIT order released and COMPLETED. Then PATCH patient HSA to 0 before capture."]
