              as: WorkforceAnalyst
              captures: { fgp_id: "$.data.id" }
            - call: "POST /forecast-groups/${fgp_id}/interval-plans"
              payload: { service_date: "2026-09-07" }
              as: WorkforceAnalyst
              captures: { ip0_id: "$.data[0].id", base_alloc: "$.data[0].allocatable_volume" }
            - call: "POST /outsource-partners"
              payload: { legal_name: "Partner One", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 12500, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { p1_id: "$.data.id", p1_v1: "$.data.version" }
            - call: "POST /partner-allocations"
              payload: { outsource_partner_id: "${p1_id}", interval_plan_id: "${ip0_id}", allocated_volume: 30 }
              as: SourcingManager
