        claim_type: Priority Ordering
        grounds:
          - validations[ERR_CYCLE_NOT_OPEN]
          - validations[ERR_TENDER_MINIMUM_NOT_MET]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cycle_state_beats_tender_minimum_on_nomination
          rationale: "The priority-40 versus priority-62 pair on POST /pipeline/nominations, including the isolating control that returns the lower-priority error on its own, is asserted by the named §1.8 instance."

      - name: priority_quality_versus_credit_limit_pair
        claim_type: Priority Ordering
        grounds:
          - validations[ERR_QUALITY_SPEC_VIOLATION]
          - validations[ERR_CREDIT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / quality_safety_beats_credit_limit_on_injection
          rationale: "The safety-before-fiscal ordering on inject, and the control that isolates the credit error, are asserted by the named §1.8 instance."

      - name: tender_minimum_exact_boundary_pair
        claim_type: Violation → Error
        grounds:
          - validations[ERR_TENDER_MINIMUM_NOT_MET]
        excluded_because:
          difficulty_instance: boundary_precision_check / tender_minimum_exact_boundary_accepted_and_one_below_rejected
          rationale: "Both sides of the tender-minimum boundary — exactly at the minimum accepted, one barrel below refused — are asserted by the named §1.8 instance."

