            - "INVARIANT: retained commission 20000 + clawback 53000 == original 73000 — the cancel+claw-back pair leaves the commission ledger conserved with zero drift"

      - name: aor_transfer_conserves_total_bundle_commission_across_agents
        grounds:
          - calculations.aor_commission_transfer
          - state_machines.BundlePlacement.PLACED_to_AOR_TRANSFERRED
          - entities.BundlePlacement.fields.transferred_commission_cents
        distinguishing_aspect: |
          Conserved quantity of a DIFFERENT type: total agency commission on
          a bundle placement, conserved ACROSS two agents. Transfer at day
          100 of 365 splits 36500 into earned 10000 (old agent) + transferred
          26500 (new agent); the sum is invariant and the placement's AOR
          flips atomically.
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. P-AUTO ACTIVE (BOTH; LIABILITY BASIC 50000; agent_load 0.15; min 0; bundle_eligible true). Feed published."
            - "Agents A and B both APPOINTED (TX, AUTO)."
