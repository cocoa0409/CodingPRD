  - rule_id: resource_temporal_overlap
    instances:

      - name: appraisal_calendar_adjacency_allowed_overlap_rejected
        grounds:
          - validations.priority_29_ERR_APPRAISAL_PERIOD_OVERLAP
          - entities.AppraisalSchedule.fields.effective_from
          - entities.AppraisalSchedule.fields.effective_to
          - calculations.appraisal_reference_value
        distinguishing_aspect: |
          Interval semantics: ADJACENCY on a half-open interval. The contended resource is
          one neighborhood's appraisal calendar (AppraisalSchedule rows sharing a
          neighborhood_code). Two windows that merely touch — one's effective_to equal to
          the other's effective_from — do NOT overlap and are both accepted on either side
          of the incumbent, while a window that starts one day before the incumbent ends is
          rejected. Windows in a DIFFERENT neighborhood never contend at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "exactly one incumbent NB-EAST appraisal schedule: per_unit_value_cents 1000000, equity_adjustment_bps 0, window 2026-01-01 to 2026-07-01, status ACTIVE"
            - "no NB-WEST schedules exist"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1000000, equity_adjustment_bps: 0, effective_from: "2026-01-01", effective_to: "2026-07-01" }
              as: ProgramAdministrator
              captures: { sched_mid: $.data.id }
          trigger:
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-07-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
              captures: { sched_after: $.data.id }
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 900000, equity_adjustment_bps: 0, effective_from: "2025-06-01", effective_to: "2026-01-01" }
              as: ProgramAdministrator
              captures: { sched_before: $.data.id }
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1111111, equity_adjustment_bps: 0, effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-WEST", per_unit_value_cents: 1111111, equity_adjustment_bps: 0, effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: ProgramAdministrator
              captures: { sched_west: $.data.id }
          assert:
            - "the abutting-after window [2026-07-01, 2027-01-01) returns 201 — touching endpoints do not overlap"
            - "the abutting-before window [2025-06-01, 2026-01-01) returns 201 — adjacency holds on the lower endpoint too"
            - "the straddling window [2026-06-30, 2026-12-31) returns 409 ERR_APPRAISAL_PERIOD_OVERLAP (one day of overlap with the incumbent is enough)"
            - "the identical straddling window in NB-WEST returns 201 — contention is scoped to the neighborhood"
            - "AppraisalSchedule.${sched_mid}.status == ACTIVE and AppraisalSchedule.${sched_after}.status == ACTIVE and AppraisalSchedule.${sched_before}.status == ACTIVE"
            - "GET /tdr/appraisal-schedules?neighborhood_code=NB-EAST returns total_count 3 (the rejected window created no row)"
            - "GET /tdr/appraisal-schedules?neighborhood_code=NB-WEST returns total_count 1 containing ${sched_west}"

      - name: inspection_ninety_day_buffer_inclusive_at_the_boundary
        grounds:
          - validations.priority_30_ERR_INSPECTION_WINDOW_CONFLICT
          - entities.ConservationEasement.fields.last_inspection_at
          - entities.MonitoringInspection.fields.inspection_date
          - state_machines.MonitoringInspection.OPEN_to_CLOSED
        distinguishing_aspect: |
          A DIFFERENT interval semantics from instance A — a minimum-separation BUFFER
          (INSPECTION_BUFFER_DAYS 90) rather than adjacency — over a DIFFERENT contended
          resource: the inspection slot on one ConservationEasement rather than a
          neighborhood's appraisal calendar. The buffer is inclusive: a gap of exactly 90
          days is admitted, 89 is refused, and the refusal must not advance
          last_inspection_at.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z while the parcel is severed, then advanced to 2026-11-08T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST (cap 200)"
            - "parcel APN-001 (100.00 / 22.00 / PRIME / 2 dwellings) fully severed for 22 units -> easement RECORDED, COMPLIANT, restricted_acres 100.00"
            - "one COMPLIANT inspection dated 2026-08-10 already recorded, so last_inspection_at is 2026-08-10 and prior_violation_count is 0"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
