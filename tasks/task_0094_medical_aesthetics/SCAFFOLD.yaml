scenario: |
  Medical aesthetics institution management system: project catalog with project category hierarchy
  (surgical/non-surgical/skincare), per-project description (technique/duration/recovery/risk),
  consumable-and-drug bill of materials, qualified-doctor scope per project, pricing-tier configuration,
  and on-shelf review; customer profile and contraindications with personal information, medical history
  and allergies, medication history, current health-condition declaration, photo and 3D-scan archive,
  contraindication rules per project, and informed-consent record; treatment-plan design and physician
  review with consultant-proposed plan, multi-project combination, expected-outcome and risk-disclosure
  documents, attending-physician review and signature, senior-physician countersign for high-risk
  projects, and plan-version control; appointment scheduling with doctor and nurse and room-and-equipment
  four-way matching, anesthesia-resource allocation, pre-operative preparation lead time, conflict
  detection across rooms, and rescheduling rules; intra-operative records with operating-room check-in,
  time-stamped procedure log (start/key-steps/end), consumable-and-drug usage (lot-number traceability),
  vital-sign monitoring data attachment, intra-operative incident reporting, and post-procedure photo
  archive; post-operative follow-up with recovery-stage plan (1-day/1-week/1-month/3-month), follow-up
  reminder dispatch (call/IM), self-reported recovery feedback, adverse-event reporting and escalation
  to medical-quality committee, and outcome-photo comparison; installment payment with installment-plan
  configuration, third-party consumer-finance integration, KYC-and-credit check, payment-schedule,
  prepayment and refund rules, default handling and collection workflow, and refund-on-medical-event
  rules; event-driven synchronization with payment, consumer-finance institution, IM, and
  pharmaceutical-traceability systems; audit logging for plan approvals and intra-operative records.

domain_name: medical-aesthetics
api_prefix: /aesthetics

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - version_pinning_on_approval
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short unique catalog code (e.g., S-LIPO-01).
        constraints: "Unique across all projects; 3..32 chars."
      - name: name
        type: string
        source: input
        description: Display name.
      - name: category
        type: enum
        source: input
        description: Project category hierarchy bucket.
        constraints: "One of {SURGICAL, NON_SURGICAL, SKINCARE}."
      - name: technique
        type: string
        source: input
        description: Technique narrative.
      - name: duration_minutes
        type: integer
        source: input
        description: Planned operative duration.
        constraints: ">= 5 and <= 480."
      - name: recovery_days
        type: integer
        source: input
        description: Expected recovery period.
        constraints: ">= 0 and <= 365."
      - name: risk_level
        type: enum
        source: input
        description: Risk classification.
        constraints: "One of {LOW, MEDIUM, HIGH}. HIGH triggers senior countersign requirement on any plan that includes this project."
      - name: bom
        type: array
        source: input
        description: Bill of materials (consumables/drugs) with required quantities.
        constraints: "Array of {sku_id, quantity} objects; quantity > 0; at least one entry."
      - name: qualified_doctor_ids
        type: array
        source: input
        description: Doctor user-ids permitted to be attending physician for this project.
        constraints: "Non-empty array of Doctor.id values."
      - name: pricing_tiers
        type: array
        source: input
        description: Pricing-tier configuration.
        constraints: |
          Array of {tier_code, base_price_cents, min_quantity} entries, length >= 1.
          tier_code values must be unique within the project.
          base_price_cents is a non-negative integer (cents).
          min_quantity >= 1; tiers sorted ascending by min_quantity at create time.
      - name: status
        type: enum
        source: computed
        description: On-shelf status.
        constraints: "One of {DRAFT, UNDER_REVIEW, ON_SHELF, OFF_SHELF}. Default DRAFT on create."
      - name: reviewer_id
        type: string
        source: computed
        description: User-id of the medical-director reviewer who approved on-shelf.
        default: null

  - name: ConsumableSku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: Globally unique SKU code.
        constraints: "Unique; matches /^[A-Z0-9-]{3,32}$/."
      - name: name
        type: string
        source: input
        description: Display name.
      - name: kind
        type: enum
        source: input
        description: Item kind.
        constraints: "One of {CONSUMABLE, DRUG}."
      - name: requires_lot_tracking
        type: boolean
        source: input
        description: Whether usage must capture a lot number for traceability.
        default: true

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer's full name.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date.
        constraints: "Customer must be aged >= 18 at the time of plan approval."
      - name: contact_phone
        type: string
        source: input
        description: Primary phone (E.164).
      - name: medical_history
        type: array
        source: input
        description: Past conditions and surgeries, as free-text codes.
        default: []
      - name: allergies
        type: array
        source: input
        description: Known allergy codes/substances.
        default: []
      - name: medication_history
        type: array
        source: input
        description: Current and past medications.
        default: []
      - name: health_declaration
        type: object
        source: input
        description: Current health-condition declaration (pregnancy, BP, etc.).
        constraints: |
          Object including booleans: is_pregnant, has_uncontrolled_hypertension,
          has_active_infection, has_bleeding_disorder. Used by contraindication check.
      - name: photo_archive_ids
        type: array
        source: input
        description: Asset ids of stored photos.
        default: []
      - name: scan3d_archive_ids
        type: array
        source: input
        description: Asset ids of stored 3D scans.
        default: []
      - name: kyc_status
        type: enum
        source: computed
        description: KYC state used for installment eligibility.
        constraints: "One of {NOT_VERIFIED, PENDING, VERIFIED, REJECTED}. Default NOT_VERIFIED."
      - name: credit_score
        type: integer
        source: computed
        description: Snapshot credit score (0..1000) recorded at KYC verification time.
        default: null
      - name: risk_score
        type: number
        source: computed
        description: |
          Aggregated contraindication risk score (see calc customer_risk_score).
          Recomputed whenever health_declaration / allergies / medical_history change
          or whenever an adverse event is filed.
        default: 0
      - name: adverse_event_count
        type: integer
        source: computed
        description: Count of confirmed adverse events filed against this customer's procedures.
        default: 0

  - name: ContraindicationRule
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: Project this rule applies to.
      - name: severity
        type: enum
        source: input
        description: Rule severity.
        constraints: "One of {ABSOLUTE, RELATIVE}. ABSOLUTE blocks the plan; RELATIVE requires senior countersign."
      - name: predicate
        type: object
        source: input
        description: |
          Predicate object evaluated against Customer fields.
          Schema: { "field": "<dotted path on Customer>", "op": "EQ|IN|GT|LT", "value": <literal> }.
          Examples: { field: "health_declaration.is_pregnant", op: "EQ", value: true } ;
                    { field: "allergies", op: "IN", value: "LIDOCAINE" }.
      - name: reason
        type: string
        source: input
        description: Human-readable reason logged when triggered.

  - name: TreatmentPlan
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: Owning customer.
      - name: consultant_id
        type: string
        source: input
        description: Consultant user-id who proposed the plan.
      - name: items
        type: array
        source: input
        description: Multi-project combination items.
        constraints: |
          Array of {project_id, tier_code, quantity} entries, length 1..10.
          Each project_id MUST be a Project with status == ON_SHELF.
          quantity is a positive integer (defaults to 1 when omitted from input).
      - name: expected_outcome
        type: string
        source: input
        description: Expected-outcome narrative shared with the customer.
      - name: risk_disclosure
        type: string
        source: input
        description: Risk-disclosure document text presented to the customer.
      - name: requires_senior_countersign
        type: boolean
        source: computed
        description: True iff any included Project.risk_level == HIGH OR any triggered ContraindicationRule has severity == RELATIVE.
      - name: attending_physician_id
        type: string
        source: input
        description: Attending physician chosen at submission; must be in qualified_doctor_ids of every included project.
        default: null
      - name: senior_physician_id
        type: string
        source: input
        description: Senior physician user-id; populated on countersign.
        default: null
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Provisional plan total at proposal time (see calc plan_total_provisional).
      - name: final_total_cents
        type: integer
        source: computed
        description: Locked-in plan total set when status transitions to APPROVED (see calc plan_total_final).
        default: null
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle state.
        constraints: "One of {DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED}. Default DRAFT."
      - name: plan_version
        type: integer
        source: computed
        description: Monotonic plan version number. Starts at 1; any edit that transitions DRAFT→DRAFT increments plan_version. Distinct from entity-level `version` (used for OCC).
        default: 1
      - name: locked_project_versions
        type: object
        source: computed
        description: |
          Snapshot of {project_id: Project.version} captured when status transitions to APPROVED.
          If any referenced Project.version changes afterward, the plan is treated as stale.
        default: null
      - name: informed_consent_signed_at
        type: datetime
        source: computed
        description: Timestamp of the informed-consent record signing. Required before status can advance to APPROVED.
        default: null

  - name: Appointment
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: Parent plan.
      - name: project_id
        type: string
        source: input
        description: Which item in the plan this appointment fulfills.
      - name: scheduled_start
        type: datetime
        source: input
        description: Scheduled start time (ISO 8601 UTC).
      - name: scheduled_end
        type: datetime
        source: computed
        description: Equals scheduled_start + Project.duration_minutes.
      - name: prep_window_start
        type: datetime
        source: computed
        description: scheduled_start - prep_lead_minutes (see calc prep_lead_time). The doctor/nurse/room/equipment must all be free for [prep_window_start, scheduled_end).
      - name: doctor_id
        type: string
        source: input
        description: Attending doctor user-id.
      - name: nurse_id
        type: string
        source: input
        description: Nurse user-id.
      - name: room_id
        type: string
        source: input
        description: Operating room id.
      - name: equipment_ids
        type: array
        source: input
        description: Required equipment ids; all must be free.
        constraints: "Length >= 1."
      - name: anesthesia_resource_id
        type: string
        source: input
        description: Anesthesia resource id (only required for SURGICAL projects; must be null otherwise).
        default: null
      - name: status
        type: enum
        source: computed
        description: Appointment state.
        constraints: "One of {SCHEDULED, CHECKED_IN, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}. Default SCHEDULED."
      - name: reschedule_count
        type: integer
        source: computed
        description: Number of times rescheduled. Hard limit 3.
        default: 0

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Unique room code.
        constraints: "Unique."
      - name: room_kind
        type: enum
        source: input
        description: Room kind.
        constraints: "One of {SURGICAL_OR, PROCEDURE, TREATMENT}. SURGICAL projects MUST be scheduled in SURGICAL_OR rooms."
      - name: is_active
        type: boolean
        source: input
        description: Whether the room can be booked.
        default: true

  - name: OperativeRecord
    parent: Appointment
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: Appointment this record belongs to.
        constraints: "Unique 1:1 with Appointment.id."
      - name: check_in_at
        type: datetime
        source: computed
        description: Set when appointment transitions SCHEDULED → CHECKED_IN.
      - name: procedure_log
        type: array
        source: computed
        description: |
          Append-only array of {step_code, recorded_at, note} entries.
          step_code in {START, KEY_STEP, END}. Must contain exactly one START
          and exactly one END before completion; END must have recorded_at > START.
        default: []
      - name: consumable_usage
        type: array
        source: input
        description: |
          Array of {sku_id, lot_number, quantity, recorded_at}. For any SKU with
          requires_lot_tracking == true, lot_number must be a non-empty string.
        default: []
      - name: vital_sign_attachments
        type: array
        source: input
        description: Asset ids of vital-sign monitoring data files.
        default: []
      - name: incidents
        type: array
        source: computed
        description: Intra-operative incident reports {severity, reported_at, note}.
        default: []
      - name: post_photo_ids
        type: array
        source: input
        description: Post-procedure photo asset ids.
        default: []

  - name: FollowUp
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: Source appointment.
      - name: stage
        type: enum
        source: input
        description: Recovery stage.
        constraints: "One of {D1, W1, M1, M3}. Unique (appointment_id, stage)."
      - name: due_at
        type: datetime
        source: computed
        description: |
          Computed from completed appointment end-time + stage offset
          (D1 = +1 day, W1 = +7 days, M1 = +30 days, M3 = +90 days).
      - name: channel
        type: enum
        source: input
        description: Reminder dispatch channel.
        constraints: "One of {CALL, IM}."
      - name: status
        type: enum
        source: computed
        description: Follow-up status.
        constraints: "One of {PENDING, REMINDED, COMPLETED, MISSED}. Default PENDING."
      - name: feedback
        type: object
        source: input
        description: Self-reported recovery feedback {satisfaction(1..5), symptoms, notes}.
        default: null
      - name: adverse_event_filed
        type: boolean
        source: computed
        description: True if an AdverseEvent record was created from this follow-up.
        default: false

  - name: AdverseEvent
    parent: Appointment
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: Originating appointment.
      - name: customer_id
        type: string
        source: input
        description: Affected customer.
      - name: severity
        type: enum
        source: input
        description: Adverse event severity.
        constraints: "One of {MINOR, MODERATE, SEVERE}. SEVERE always escalates."
      - name: description
        type: string
        source: input
        description: Free-text description.
      - name: status
        type: enum
        source: computed
        description: AE state.
        constraints: "One of {OPEN, ESCALATED, CLOSED}. Default OPEN."
      - name: escalated_at
        type: datetime
        source: computed
        description: When escalated to the medical-quality committee.
        default: null

  - name: InstallmentPlan
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: Plan being financed.
        constraints: "Unique 1:1 with TreatmentPlan.id."
      - name: principal_cents
        type: integer
        source: computed
        description: Equals TreatmentPlan.final_total_cents - downpayment_cents at creation time.
      - name: downpayment_cents
        type: integer
        source: input
        description: Downpayment amount.
        constraints: ">= 0 and <= TreatmentPlan.final_total_cents."
      - name: term_months
        type: integer
        source: input
        description: Number of monthly installments.
        constraints: "One of {3, 6, 12, 24}."
      - name: apr_bps
        type: integer
        source: computed
        description: Annual percentage rate in basis points, set per term tier (see calc installment_schedule.constants).
      - name: finance_partner_id
        type: string
        source: input
        description: Third-party consumer-finance institution id.
      - name: schedule
        type: array
        source: computed
        description: Array of {index, due_date, principal_cents, interest_cents, total_cents, status}. Generated by calc installment_schedule.
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Sum of total_cents for schedule entries with status == PAID.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Installment plan status.
        constraints: "One of {PENDING_KYC, ACTIVE, IN_DEFAULT, REFUNDED, COMPLETED}. Default PENDING_KYC."
      - name: default_strike_count
        type: integer
        source: computed
        description: Number of installments missed past grace period.
        default: 0

  - name: PaymentEvent
    parent: InstallmentPlan
    common_fields: false
    fields:
      - name: installment_plan_id
        type: string
        source: input
        description: Owning installment plan.
      - name: kind
        type: enum
        source: input
        description: Event kind.
        constraints: "One of {INSTALLMENT_PAID, PREPAYMENT, REFUND, COLLECTION_NOTICE}."
      - name: amount_cents
        type: integer
        source: input
        description: Amount (positive for inflows, positive for refunds; sign is implied by kind).
        constraints: "> 0."
      - name: external_ref
        type: string
        source: input
        description: External reference id from payment / finance partner.
      - name: recorded_at
        type: datetime
        source: system
        description: Server-side timestamp.

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: Role of acting user.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of acting user.
      - name: action
        type: string
        source: system
        description: Action verb (e.g., PLAN_APPROVED, OP_RECORD_AMENDED).
      - name: subject_type
        type: string
        source: system
        description: Entity type acted on (e.g., TreatmentPlan).
      - name: subject_id
        type: string
        source: system
        description: Entity id acted on.
      - name: payload
        type: object
        source: system
        description: Action-specific payload snapshot (e.g., before/after status).

  - name: SyncEvent
    parent: null
    common_fields: false
    fields:
      - name: topic
        type: enum
        source: system
        description: Sync topic.
        constraints: "One of {PAYMENT, FINANCE_PARTNER, IM, PHARMA_TRACE}."
      - name: kind
        type: string
        source: system
        description: Event kind string (e.g., PLAN_APPROVED, INSTALLMENT_PAID, CONSUMABLE_USED, FOLLOWUP_REMINDER).
      - name: payload
        type: object
        source: system
        description: Event payload.
      - name: emitted_at
        type: datetime
        source: system
        description: Server time emit.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /aesthetics/projects/{id}/submit"
        actor: Consultant
        preconditions:
          - "bom is non-empty"
          - "qualified_doctor_ids non-empty"
          - "pricing_tiers non-empty"
        side_effects:
          - "AuditEntry written with action=PROJECT_SUBMITTED"
      - from: UNDER_REVIEW
        to: ON_SHELF
        trigger: "POST /aesthetics/projects/{id}/approve"
        actor: MedicalDirector
        preconditions:
          - "actor is MedicalDirector"
        side_effects:
          - "Set Project.reviewer_id = acting user id"
          - "AuditEntry written with action=PROJECT_APPROVED"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /aesthetics/projects/{id}/reject"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "AuditEntry written with action=PROJECT_REJECTED"
      - from: ON_SHELF
        to: OFF_SHELF
        trigger: "POST /aesthetics/projects/{id}/take-off-shelf"
        actor: MedicalDirector
        preconditions:
          - "No TreatmentPlan in {DRAFT, SUBMITTED} references this project (APPROVED plans are allowed because they hold a locked snapshot)"
        side_effects:
          - "AuditEntry written with action=PROJECT_OFF_SHELF"
      - from: OFF_SHELF
        to: ON_SHELF
        trigger: "POST /aesthetics/projects/{id}/return-to-shelf"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "AuditEntry written with action=PROJECT_RETURNED"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /aesthetics/plans/{id}"
        actor: Consultant
        preconditions:
          - "Acting Consultant must be TreatmentPlan.consultant_id"
        side_effects:
          - "Increment plan_version by 1 (semantic plan version, separate from OCC version)"
          - "Recompute provisional_total_cents via calc plan_total_provisional"
          - "Recompute requires_senior_countersign by re-evaluating contraindications + risk_level"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /aesthetics/plans/{id}/submit"
        actor: Consultant
        preconditions:
          - "Every items[].project_id has Project.status == ON_SHELF at submission time"
          - "attending_physician_id is in Project.qualified_doctor_ids of every included project"
          - "No ContraindicationRule with severity == ABSOLUTE evaluates true against the customer"
          - "Customer.date_of_birth implies age >= 18 at this submission time"
        side_effects:
          - "Recompute requires_senior_countersign"
          - "Recompute provisional_total_cents"
          - "AuditEntry action=PLAN_SUBMITTED"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /aesthetics/plans/{id}/sign-consent"
        actor: Customer
        preconditions:
          - "Acting Customer must be TreatmentPlan.customer_id"
          - "informed_consent_signed_at is null"
        side_effects:
          - "Set informed_consent_signed_at to server time"
          - "AuditEntry action=CONSENT_SIGNED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aesthetics/plans/{id}/approve"
        actor: AttendingPhysician
        preconditions:
          - "Acting physician must equal attending_physician_id"
          - "informed_consent_signed_at is not null"
          - "requires_senior_countersign is false (HIGH-risk projects and RELATIVE contraindications require countersign path instead)"
        side_effects:
          - "Set status = APPROVED"
          - "Compute and lock final_total_cents via calc plan_total_final"
          - "Snapshot locked_project_versions = {p.id: Project.version for p in items}"
          - "AuditEntry action=PLAN_APPROVED"
          - "Emit SyncEvent topic=IM kind=PLAN_APPROVED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aesthetics/plans/{id}/countersign"
        actor: SeniorPhysician
        preconditions:
          - "requires_senior_countersign is true"
          - "informed_consent_signed_at is not null"
          - "Acting SeniorPhysician is not equal to attending_physician_id (segregation of duties)"
        side_effects:
          - "Set status = APPROVED"
          - "Set senior_physician_id to acting user id"
          - "Compute and lock final_total_cents via calc plan_total_final"
          - "Snapshot locked_project_versions"
          - "AuditEntry action=PLAN_COUNTERSIGNED"
          - "Emit SyncEvent topic=IM kind=PLAN_APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /aesthetics/plans/{id}/reject"
        actor: AttendingPhysician
        preconditions: []
        side_effects:
          - "AuditEntry action=PLAN_REJECTED"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /aesthetics/plans/{id}/return-to-draft"
        actor: Consultant
        preconditions:
          - "Acting Consultant equals consultant_id"
        side_effects:
          - "Clear informed_consent_signed_at"
          - "AuditEntry action=PLAN_RETURNED_TO_DRAFT"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /aesthetics/plans/{id}/cancel"
        actor: AttendingPhysician
        preconditions:
          - "No Appointment for this plan is in {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "Cancel every Appointment of this plan in status SCHEDULED or CHECKED_IN (cascade to Appointment.CANCELLED)"
          - "If an InstallmentPlan exists in ACTIVE: transition it to REFUNDED and write a PaymentEvent kind=REFUND for paid_amount_cents (cascade depth 3: plan.cancel → installment.refund → emit SyncEvent topic=FINANCE_PARTNER kind=REFUND_INITIATED)"
          - "AuditEntry action=PLAN_CANCELLED"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /aesthetics/appointments/{id}/reschedule"
        actor: Consultant
        preconditions:
          - "reschedule_count < 3"
          - "New time satisfies four-way resource matching (no overlap on doctor, nurse, room, any equipment, anesthesia)"
          - "Parent TreatmentPlan.status == APPROVED"
          - "No Project.version drift since locked_project_versions snapshot"
        side_effects:
          - "Increment reschedule_count"
          - "Recompute scheduled_end and prep_window_start"
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /aesthetics/appointments/{id}/check-in"
        actor: Nurse
        preconditions:
          - "server time within [prep_window_start, scheduled_end)"
        side_effects:
          - "Create OperativeRecord shell with check_in_at = server time"
          - "AuditEntry action=OP_CHECK_IN"
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /aesthetics/appointments/{id}/op-records/start"
        actor: AttendingPhysician
        preconditions:
          - "Acting physician equals doctor_id"
        side_effects:
          - "Append procedure_log entry {step_code=START, recorded_at=now}"
          - "AuditEntry action=OP_START"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /aesthetics/appointments/{id}/op-records/end"
        actor: AttendingPhysician
        preconditions:
          - "procedure_log contains exactly one START"
          - "For every consumable_usage entry: ConsumableSku.requires_lot_tracking implies non-empty lot_number"
          - "For every BOM entry of this appointment's project: cumulative consumable_usage quantity >= BOM-required quantity"
        side_effects:
          - "Append procedure_log entry {step_code=END, recorded_at=now}"
          - "Set Appointment.status=COMPLETED"
          - "Auto-generate four FollowUp rows (D1, W1, M1, M3) each in status=PENDING; due_at = now + offset"
          - "Emit SyncEvent topic=PHARMA_TRACE kind=CONSUMABLE_USED for every consumable_usage entry"
          - "AuditEntry action=OP_END"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aesthetics/appointments/{id}/cancel"
        actor: Consultant
        preconditions: []
        side_effects:
          - "AuditEntry action=APPT_CANCELLED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /_clock/advance (server passes scheduled_end + 60 minutes while still SCHEDULED)"
        actor: system
        preconditions:
          - "server time > scheduled_end + 60 minutes"
          - "status == SCHEDULED"
        side_effects:
          - "Set status = NO_SHOW"

  - entity: FollowUp
    initial_state: PENDING
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: PENDING
        to: REMINDED
        trigger: "POST /aesthetics/followups/{id}/remind"
        actor: Nurse
        preconditions:
          - "server time >= due_at"
        side_effects:
          - "Emit SyncEvent topic=IM kind=FOLLOWUP_REMINDER (or topic=PAYMENT for CALL channel? No — channel governs message body only; SyncEvent topic stays IM)"
          - "AuditEntry action=FOLLOWUP_REMINDED"
      - from: REMINDED
        to: COMPLETED
        trigger: "POST /aesthetics/followups/{id}/feedback"
        actor: Customer
        preconditions:
          - "Acting Customer equals appointment.plan.customer_id"
        side_effects:
          - "Persist feedback object"
          - "If feedback.severity_flag triggers AE (see calc adverse_event_trigger): create AdverseEvent OPEN, set adverse_event_filed=true"
      - from: PENDING
        to: MISSED
        trigger: "POST /_clock/advance (passes due_at + 7 days with status PENDING)"
        actor: system
        preconditions:
          - "server time > due_at + 7 days"
          - "status == PENDING"
        side_effects:
          - "Set status = MISSED"

  - entity: AdverseEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /aesthetics/adverse-events/{id}/escalate (auto when severity == SEVERE on create)"
        actor: AttendingPhysician
        preconditions: []
        side_effects:
          - "Set escalated_at = server time"
          - "Increment Customer.adverse_event_count"
          - "Recompute Customer.risk_score (cascade depth 2: AE.escalate → customer.risk_score recompute → if risk_score >= 80, future plans set requires_senior_countersign at submit time)"
          - "AuditEntry action=AE_ESCALATED"
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /aesthetics/adverse-events/{id}/close"
        actor: SeniorPhysician
        preconditions: []
        side_effects:
          - "AuditEntry action=AE_CLOSED"
      - from: OPEN
        to: CLOSED
        trigger: "POST /aesthetics/adverse-events/{id}/close"
        actor: AttendingPhysician
        preconditions:
          - "severity == MINOR"
        side_effects:
          - "AuditEntry action=AE_CLOSED"

  - entity: InstallmentPlan
    initial_state: PENDING_KYC
    terminal_states: [REFUNDED, COMPLETED]
    transitions:
      - from: PENDING_KYC
        to: ACTIVE
        trigger: "POST /aesthetics/installments/{id}/activate"
        actor: FinanceOfficer
        preconditions:
          - "Customer.kyc_status == VERIFIED"
          - "Customer.credit_score >= MIN_CREDIT_SCORE(term_months) per installment_schedule.constants"
          - "TreatmentPlan.status == APPROVED"
        side_effects:
          - "Generate schedule via calc installment_schedule"
          - "Emit SyncEvent topic=FINANCE_PARTNER kind=PLAN_ACTIVATED"
      - from: ACTIVE
        to: IN_DEFAULT
        trigger: "POST /_clock/advance (when an unpaid installment passes due_date + GRACE_DAYS)"
        actor: system
        preconditions:
          - "Exists schedule entry with status == PENDING and due_date + GRACE_DAYS < server time"
        side_effects:
          - "Increment default_strike_count"
          - "Write PaymentEvent kind=COLLECTION_NOTICE"
          - "Emit SyncEvent topic=FINANCE_PARTNER kind=DEFAULT_STRIKE"
      - from: IN_DEFAULT
        to: ACTIVE
        trigger: "POST /aesthetics/installments/{id}/payments (paying the overdue installment fully)"
        actor: Customer
        preconditions:
          - "Payment covers all overdue PENDING installments"
        side_effects:
          - "Mark overdue entries PAID"
          - "Update paid_amount_cents"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /aesthetics/installments/{id}/payments (final settlement)"
        actor: Customer
        preconditions:
          - "After this payment every schedule entry status == PAID"
        side_effects:
          - "Set status = COMPLETED"
          - "Emit SyncEvent topic=FINANCE_PARTNER kind=PLAN_SETTLED"
      - from: ACTIVE
        to: REFUNDED
        trigger: "Cascaded from TreatmentPlan cancel OR POST /aesthetics/installments/{id}/refund-medical-event"
        actor: system
        preconditions:
          - "Triggered by TreatmentPlan.cancel side-effect OR AdverseEvent.severity == SEVERE"
        side_effects:
          - "Write PaymentEvent kind=REFUND for paid_amount_cents"
          - "Mark remaining schedule entries CANCELLED (status field on individual schedule entries)"
          - "Emit SyncEvent topic=FINANCE_PARTNER kind=REFUND_INITIATED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two consultants try to submit and edit the same DRAFT plan simultaneously."
    guarantee: "Exactly one transition wins; the other receives a stale-version error."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on TreatmentPlan.version"

  - scenario: "Attending physician approve and Consultant return-to-draft fire simultaneously on a SUBMITTED plan."
    guarantee: "Exactly one operation succeeds; loser sees ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on TreatmentPlan.status"

  - scenario: "Two appointment creations target overlapping windows on the same operating room."
    guarantee: "Second creation is rejected because the room window is already occupied."
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Room occupation."

  - scenario: "Two appointment creations both request the same Doctor in overlapping windows."
    guarantee: "Second creation is rejected."
    error_id: ERR_DOCTOR_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Doctor occupation."

  - scenario: "Two appointment creations request the same anesthesia resource at overlapping times."
    guarantee: "Second creation is rejected."
    error_id: ERR_ANESTHESIA_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on anesthesia resource occupation."

  - scenario: "Two installment activations race on the same plan."
    guarantee: "At most one InstallmentPlan per TreatmentPlan; second rejected."
    error_id: ERR_INSTALLMENT_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on InstallmentPlan.treatment_plan_id."

  - scenario: "Take-project-off-shelf and submit-plan-referencing-that-project fire simultaneously."
    guarantee: "Either the take-off-shelf succeeds (and the submit fails ERR_PROJECT_NOT_ON_SHELF) or the submit succeeds (and the take-off-shelf fails ERR_PROJECT_IN_USE)."
    error_id: ERR_PROJECT_NOT_ON_SHELF
    http_status: 409
    serialization: "First-writer-wins on Project.status."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: plan_total_provisional
    trigger: "On TreatmentPlan create, on PATCH /plans/{id}, on POST /plans/{id}/submit. Writes TreatmentPlan.provisional_total_cents."
    algorithm: forward_looking
    formula: |
      # Provisional total uses the CURRENT pricing-tier table of each project
      # and rounds each line item BEFORE summing.
      provisional_total_cents = 0
      for item in plan.items:
          project = Project.fetch(item.project_id)
          tier = project.pricing_tiers.find(t => t.tier_code == item.tier_code)
          line = tier.base_price_cents * item.quantity
          # Per-line rounding (cents are already integer; "round per line" is a no-op for integers,
          # but we explicitly state the order to lock the semantics).
          provisional_total_cents += line
      return provisional_total_cents
    input_set: "All items in plan.items. Uses project.pricing_tiers AS OF the moment the calculation runs (NOT a snapshot)."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: provisional
        when: "Plan is in DRAFT or SUBMITTED status; pricing is read live from Project.pricing_tiers."
        difference: "Live-read pricing — recomputes every time and may drift if pricing changes."

  - name: plan_total_final
    trigger: "On state transition SUBMITTED → APPROVED (both via approve and via countersign). Writes TreatmentPlan.final_total_cents and snapshots locked_project_versions."
    algorithm: chronological
    formula: |
      # Final total locks the pricing tier values snapshotted at the moment of approval.
      # Promotional discounts (computed below) apply ONLY at finalization, not provisional.
      # Rounding order is fixed: discount per line, then round per line, then SUM.
      final_total_cents = 0
      for item in plan.items:
          project = Project.fetch_at_approval_time(item.project_id)
          tier = project.pricing_tiers.find(t => t.tier_code == item.tier_code)
          line_gross = tier.base_price_cents * item.quantity
          # Promotional discount: 5% if plan has >= 3 items, else 0.
          promo_rate_bps = 500 if len(plan.items) >= 3 else 0
          line_discount = (line_gross * promo_rate_bps) // 10000   # integer floor division (locked semantics)
          line_net = line_gross - line_discount
          # Round_half_up is a no-op for integer cents, but the per-line rounding step is locked
          # so any future fractional intermediate (e.g., bps math) stays well-defined.
          final_total_cents += line_net
      # SUM-then-final-round is explicitly NOT done; per-line rounding then SUM is the locked order.
      return final_total_cents
    input_set: "items snapshotted at SUBMITTED→APPROVED transition time. Project.version captured into locked_project_versions."
    constants:
      PROMO_THRESHOLD_ITEMS: 3
      PROMO_RATE_BPS: 500
    precision: "Integer cents. Rounding order: per-line discount (floor) BEFORE summing."
    variants:
      - name: final
        when: "On SUBMITTED→APPROVED transition; pricing locked to snapshot; promotional discount applied."
        difference: "Differs from provisional by promo discount AND by snapshot pricing — same inputs (same item list) can yield different totals between provisional and final if pricing changed between submit and approve."

  - name: customer_risk_score
    trigger: "On Customer create, on PATCH /customers/{id} that mutates health_declaration/allergies/medical_history, on AdverseEvent.OPEN→ESCALATED, on AdverseEvent create with severity=SEVERE. Writes Customer.risk_score."
    algorithm: weighted_scoring
    formula: |
      # Base risk from declarative fields
      base = 0
      if customer.health_declaration.is_pregnant: base += 30
      if customer.health_declaration.has_uncontrolled_hypertension: base += 25
      if customer.health_declaration.has_active_infection: base += 20
      if customer.health_declaration.has_bleeding_disorder: base += 25
      base += 5 * len(customer.allergies)
      base += 3 * len(customer.medication_history)
      # Adverse event multiplier
      ae_factor = 1.0 + 0.25 * customer.adverse_event_count
      raw = base * ae_factor
      # Clamp 0..100, round_half_up to 1 decimal
      return min(100.0, max(0.0, round(raw, 1)))
    input_set: "Customer.health_declaration, Customer.allergies, Customer.medication_history, Customer.adverse_event_count."
    constants:
      PREGNANCY_WEIGHT: 30
      UNCONTROLLED_HYPERTENSION_WEIGHT: 25
      ACTIVE_INFECTION_WEIGHT: 20
      BLEEDING_DISORDER_WEIGHT: 25
      ALLERGY_WEIGHT: 5
      MEDICATION_WEIGHT: 3
      AE_MULTIPLIER_STEP: 0.25
      RISK_CEILING: 100
      RISK_FLOOR: 0
    precision: "1 decimal, round_half_up."
    variants:
      - name: base
        when: "Customer has no recorded adverse events (adverse_event_count == 0)."
        difference: "ae_factor == 1.0; risk score is purely a function of declarative fields."
      - name: ae_amplified
        when: "Customer has >= 1 confirmed adverse event."
        difference: "Multiplier (1 + 0.25 * adverse_event_count) applied to base — same declarative inputs yield a different score than the base variant."

  - name: prep_lead_time
    trigger: "On Appointment create. Sets Appointment.prep_window_start = scheduled_start - prep_lead_minutes."
    algorithm: aggregation
    formula: |
      # Aggregate prep time across the BOM, with explicit rounding-order trap.
      # Locked rule: compute the per-sku prep ceiling FIRST (round each up), then take the MAX.
      # The alternative interpretation "sum then ceil" or "max raw then ceil" would yield
      # a different prep_lead_minutes and is REJECTED.
      per_sku_lead = []
      for bom in project.bom:
          sku = ConsumableSku.fetch(bom.sku_id)
          # Each consumable has a fixed prep_minutes_per_unit constant (DRUG=4, CONSUMABLE=2).
          raw = bom.quantity * (PREP_DRUG if sku.kind == DRUG else PREP_CONSUMABLE)
          per_sku_lead.append(ceil_to_5(raw))   # round each UP to nearest multiple of 5 first
      base_lead = max(per_sku_lead)            # then take max
      # Surgical projects require an additional fixed pad
      if project.category == SURGICAL: base_lead += SURGICAL_PAD
      return base_lead
    input_set: "Project.bom + Project.category at appointment-create time."
    constants:
      PREP_DRUG: 4
      PREP_CONSUMABLE: 2
      SURGICAL_PAD: 30
      ROUNDING_STEP_MINUTES: 5
    precision: "Integer minutes. Rounding order: per-sku ceil_to_5 FIRST, then MAX, then add SURGICAL_PAD if applicable. SUM-then-ceil is NOT used."
    variants: []

  - name: installment_schedule
    trigger: "On InstallmentPlan PENDING_KYC → ACTIVE transition. Writes InstallmentPlan.schedule and apr_bps."
    algorithm: tiered_pricing
    formula: |
      # APR is selected from TERM_APR_TABLE based on term_months.
      apr_bps = TERM_APR_TABLE[term_months]   # raises if term not in {3,6,12,24}
      monthly_rate = apr_bps / 10000.0 / 12.0
      P = principal_cents  # already in cents, integer
      n = term_months
      # Standard annuity formula: M = P * r * (1+r)^n / ((1+r)^n - 1)
      # Compute in float, then ROUND each monthly payment to integer cents using round_half_up.
      # Locked order: compute monthly_total cents per-period (round_half_up), then derive interest_cents
      # for each period from the period principal balance. Final period absorbs the rounding residual
      # so that sum(principal_cents over schedule) == P.
      monthly_total_cents = round_half_up(P * monthly_rate * (1 + monthly_rate)**n
                                           / ((1 + monthly_rate)**n - 1))
      schedule = []
      balance = P
      for i in 1..n:
          if i < n:
              interest_cents = round_half_up(balance * monthly_rate)
              principal_cents = monthly_total_cents - interest_cents
          else:
              # Final installment absorbs any residual cents
              principal_cents = balance
              interest_cents = monthly_total_cents_residual_for_last_period
              monthly_total_cents_final = principal_cents + interest_cents
          balance -= principal_cents
          schedule.append({index: i, due_date: activated_at + i months,
                           principal_cents, interest_cents,
                           total_cents: principal_cents + interest_cents,
                           status: PENDING})
      return schedule
    input_set: "principal_cents (= TreatmentPlan.final_total_cents - downpayment_cents), term_months, activated_at."
    constants:
      TERM_APR_TABLE: { 3: 0, 6: 600, 12: 1200, 24: 1800 }   # bps
      MIN_CREDIT_SCORE: { 3: 500, 6: 600, 12: 700, 24: 750 }
      GRACE_DAYS: 7
    precision: "Integer cents per period, round_half_up on monthly_total, with last-period residual absorption so sum(principal_cents) == P exactly."
    variants:
      - name: zero_apr_3m
        when: "term_months == 3 (promotional 0% APR tier)."
        difference: "All interest_cents == 0; each monthly_total_cents = round_half_up(P/3) with last-period residual absorption. Boundary case where the annuity formula degenerates."
      - name: standard_interest_bearing
        when: "term_months in {6, 12, 24} (non-zero APR tiers)."
        difference: "Full annuity formula applied; interest_cents > 0 for non-final periods."

  - name: appointment_conflict_check
    trigger: "On POST /appointments and on POST /appointments/{id}/reschedule. Used by the validations layer, but the formula is logically a calculation."
    algorithm: interval_merge
    formula: |
      # Four-way matching: doctor, nurse, room, every equipment_id, and anesthesia_resource_id
      # if present. For EACH such resource R, the candidate interval is
      # [prep_window_start, scheduled_end). The check is: NO existing Appointment with
      # status in {SCHEDULED, CHECKED_IN, IN_PROGRESS} that uses R has an interval that
      # OVERLAPS the candidate interval (half-open semantics: end is exclusive).
      # For ROOM the interval also includes a STERILIZATION_GAP of 15 minutes AFTER scheduled_end,
      # so the effective room occupation is [prep_window_start, scheduled_end + 15).
      # For ANESTHESIA, the interval is [scheduled_start, scheduled_end) (no prep, no gap).
      # For DOCTOR / NURSE / EQUIPMENT, the interval is [prep_window_start, scheduled_end).
      def overlaps(a_start, a_end, b_start, b_end):
          return a_start < b_end and b_start < a_end
    input_set: "All Appointments with status in {SCHEDULED, CHECKED_IN, IN_PROGRESS} that reference at least one resource in common with the candidate."
    constants:
      STERILIZATION_GAP_MINUTES: 15
    precision: "Integer minutes; half-open intervals (start inclusive, end exclusive)."
    variants:
      - name: room_with_sterilization_gap
        when: "Resource is a Room."
        difference: "Existing-occupation interval extended by +STERILIZATION_GAP_MINUTES on the END side; doctor/nurse/equipment do NOT use the gap."
      - name: anesthesia_no_prep
        when: "Resource is the anesthesia_resource_id slot."
        difference: "Interval is [scheduled_start, scheduled_end) — does NOT include the prep window."

  - name: adverse_event_trigger
    trigger: "On POST /aesthetics/followups/{id}/feedback. Determines whether to auto-create an AdverseEvent and at what severity."
    algorithm: threshold
    formula: |
      # Maps self-reported feedback to an AE severity (or no AE).
      satisfaction = feedback.satisfaction        # 1..5
      symptoms = feedback.symptoms or []
      severe_symptoms = {INFECTION, NECROSIS, ANAPHYLAXIS}
      moderate_symptoms = {PERSISTENT_PAIN, SWELLING_BEYOND_NORMAL, NUMBNESS}
      if any(s in severe_symptoms for s in symptoms):
          return AdverseEvent(severity=SEVERE)   # auto-escalates
      if satisfaction == 1 or any(s in moderate_symptoms for s in symptoms):
          return AdverseEvent(severity=MODERATE)
      if satisfaction == 2:
          return AdverseEvent(severity=MINOR)
      return None
    input_set: "feedback.satisfaction (1..5), feedback.symptoms (array of codes)."
    constants:
      MIN_SATISFACTION: 1
      MAX_SATISFACTION: 5
    precision: "Discrete enum output."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (validated left-to-right)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-bearing endpoints"

  - priority: 4
    category: existence
    check: "Foreign-key fields in request body refer to existing resources."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits this transition per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Submitted PATCH/PUT payload's `version` matches current resource version (OCC). Mismatch wins over downstream business rules so the client retries with fresh data."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutating endpoints with optional version"

  - priority: 7
    category: business_safety
    check: "Customer age >= 18 at plan submission time."
    error_id: ERR_CUSTOMER_UNDERAGE
    http_status: 422
    applies_to: "POST /aesthetics/plans/{id}/submit"

  - priority: 8
    category: business_safety
    check: "No ContraindicationRule with severity == ABSOLUTE evaluates true for the customer against any item.project_id."
    error_id: ERR_ABSOLUTE_CONTRAINDICATION
    http_status: 422
    applies_to: "POST /aesthetics/plans/{id}/submit"

  - priority: 9
    category: business_safety
    check: "Senior physician for countersign MUST differ from attending_physician_id (segregation of duties)."
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /aesthetics/plans/{id}/countersign"

  - priority: 10
    category: business_safety
    check: "Every consumable_usage entry with ConsumableSku.requires_lot_tracking == true has a non-empty lot_number."
    error_id: ERR_LOT_NUMBER_REQUIRED
    http_status: 422
    applies_to: "POST /aesthetics/appointments/{id}/op-records/end, POST /aesthetics/appointments/{id}/op-records/consumables"

  - priority: 11
    category: business_safety
    check: "Informed-consent record has been signed before SUBMITTED → APPROVED transition."
    error_id: ERR_CONSENT_NOT_SIGNED
    http_status: 422
    applies_to: "POST /aesthetics/plans/{id}/approve, POST /aesthetics/plans/{id}/countersign"

  - priority: 12
    category: business_referential
    check: "Plan's attending_physician_id is contained in Project.qualified_doctor_ids of every included project."
    error_id: ERR_DOCTOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /aesthetics/plans, POST /aesthetics/plans/{id}/submit, POST /aesthetics/appointments"

  - priority: 13
    category: business_referential
    check: "Every items[].project_id has Project.status == ON_SHELF at submission time."
    error_id: ERR_PROJECT_NOT_ON_SHELF
    http_status: 422
    applies_to: "POST /aesthetics/plans/{id}/submit, POST /aesthetics/appointments"

  - priority: 14
    category: business_referential
    check: "Anesthesia resource is required iff Project.category == SURGICAL."
    error_id: ERR_ANESTHESIA_REQUIREMENT_MISMATCH
    http_status: 422
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 15
    category: business_referential
    check: "Operating room.kind == SURGICAL_OR is required iff Project.category == SURGICAL."
    error_id: ERR_ROOM_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 16
    category: business_temporal
    check: "Doctor has no overlapping appointment on the candidate [prep_window_start, scheduled_end) interval (half-open)."
    error_id: ERR_DOCTOR_CONFLICT
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 17
    category: business_temporal
    check: "Nurse has no overlapping appointment on the candidate [prep_window_start, scheduled_end) interval."
    error_id: ERR_NURSE_CONFLICT
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 18
    category: business_temporal
    check: "Room is free on the EXTENDED interval [prep_window_start, scheduled_end + STERILIZATION_GAP_MINUTES). This boundary differs from doctor/nurse — the +15 minute pad after end is exclusive to rooms."
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 19
    category: business_temporal
    check: "Every equipment_id is free on [prep_window_start, scheduled_end)."
    error_id: ERR_EQUIPMENT_CONFLICT
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 20
    category: business_temporal
    check: "Anesthesia resource (when required) is free on [scheduled_start, scheduled_end) — NO prep window, NO gap."
    error_id: ERR_ANESTHESIA_CONFLICT
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 21
    category: business_temporal
    check: "Check-in only between [prep_window_start, scheduled_end)."
    error_id: ERR_CHECKIN_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /aesthetics/appointments/{id}/check-in"

  - priority: 22
    category: business_constraint
    check: "Appointment.reschedule_count < 3 before reschedule succeeds."
    error_id: ERR_RESCHEDULE_LIMIT
    http_status: 422
    applies_to: "POST /aesthetics/appointments/{id}/reschedule"

  - priority: 23
    category: business_constraint
    check: "Plan items length is between 1 and 10."
    error_id: ERR_PLAN_ITEMS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /aesthetics/plans, PATCH /aesthetics/plans/{id}"

  - priority: 24
    category: business_constraint
    check: "Project.locked snapshot has not drifted since plan approval (Project.version unchanged from locked_project_versions). Required before creating Appointment under an APPROVED plan."
    error_id: ERR_PLAN_STALE_REFERENCE
    http_status: 409
    applies_to: "POST /aesthetics/appointments, POST /aesthetics/appointments/{id}/reschedule"

  - priority: 25
    category: business_fiscal
    check: "InstallmentPlan.term_months is in {3,6,12,24}."
    error_id: ERR_INVALID_INSTALLMENT_TERM
    http_status: 422
    applies_to: "POST /aesthetics/installments"

  - priority: 26
    category: business_fiscal
    check: "Customer.kyc_status == VERIFIED AND Customer.credit_score >= MIN_CREDIT_SCORE[term_months] before installment activation."
    error_id: ERR_KYC_OR_CREDIT_FAIL
    http_status: 422
    applies_to: "POST /aesthetics/installments/{id}/activate"

  - priority: 27
    category: business_fiscal
    check: "downpayment_cents in [0, TreatmentPlan.final_total_cents]."
    error_id: ERR_DOWNPAYMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /aesthetics/installments"

  - priority: 28
    category: business_fiscal
    check: "Payment amount > 0 and <= remaining unpaid balance."
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /aesthetics/installments/{id}/payments"

  - priority: 29
    category: business_constraint
    check: "List endpoints' query parameters are within bounds (limit 1..100, offset >= 0)."
    error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 30
    category: business_constraint
    check: "Request body matches declared schema (required fields present, types correct)."
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Projects ---
  - method: POST
    path: "/aesthetics/projects"
    description: "Create a project in DRAFT."
    roles: [MedicalDirector, Consultant]
    code: 201
    input: [code, name, category, technique, duration_minutes, recovery_days, risk_level, bom, qualified_doctor_ids, pricing_tiers]
    output: Project
    side_effects: []

  - method: PATCH
    path: "/aesthetics/projects/{id}"
    description: "Edit a project in DRAFT or UNDER_REVIEW. Increments Project.version (OCC)."
    roles: [MedicalDirector, Consultant]
    code: 200
    input: ["name?", "technique?", "duration_minutes?", "recovery_days?", "risk_level?", "bom?", "qualified_doctor_ids?", "pricing_tiers?", "version?"]
    output: Project
    side_effects: []

  - method: POST
    path: "/aesthetics/projects/{id}/submit"
    description: "Submit project for medical-director review (DRAFT → UNDER_REVIEW)."
    roles: [MedicalDirector, Consultant]
    code: 200
    input: []
    output: Project
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/projects/{id}/approve"
    description: "Approve and publish (UNDER_REVIEW → ON_SHELF)."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Project
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/projects/{id}/reject"
    description: "Reject and send back to DRAFT."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Project
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/projects/{id}/take-off-shelf"
    description: "Take project off shelf (ON_SHELF → OFF_SHELF). Forbidden while non-terminal plans reference it."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Project
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/projects/{id}/return-to-shelf"
    description: "Restore project to shelf (OFF_SHELF → ON_SHELF)."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Project
    side_effects: [audit_entry]

  - method: GET
    path: "/aesthetics/projects/{id}"
    description: "Fetch a single project."
    roles: [MedicalDirector, Consultant, AttendingPhysician, SeniorPhysician, Nurse, FinanceOfficer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/aesthetics/projects"
    description: "List projects with filters (category, status, risk_level)."
    roles: [MedicalDirector, Consultant, AttendingPhysician, SeniorPhysician, Nurse, FinanceOfficer]
    code: 200
    input: ["category?", "status?", "risk_level?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  # --- ContraindicationRules ---
  - method: POST
    path: "/aesthetics/projects/{id}/contraindication-rules"
    description: "Attach a contraindication rule to a project."
    roles: [MedicalDirector]
    code: 201
    input: [severity, predicate, reason]
    output: ContraindicationRule
    side_effects: []

  - method: GET
    path: "/aesthetics/projects/{id}/contraindication-rules"
    description: "List rules for a project."
    roles: [MedicalDirector, Consultant, AttendingPhysician, SeniorPhysician]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContraindicationRule[]"
    side_effects: []

  # --- Consumable SKUs ---
  - method: POST
    path: "/aesthetics/consumable-skus"
    description: "Register a consumable or drug SKU."
    roles: [MedicalDirector]
    code: 201
    input: [sku_code, name, kind, "requires_lot_tracking?"]
    output: ConsumableSku
    side_effects: []

  - method: GET
    path: "/aesthetics/consumable-skus"
    description: "List SKUs."
    roles: [MedicalDirector, Consultant, AttendingPhysician, Nurse]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "ConsumableSku[]"
    side_effects: []

  # --- Rooms ---
  - method: POST
    path: "/aesthetics/rooms"
    description: "Register an operating/procedure room."
    roles: [MedicalDirector]
    code: 201
    input: [code, room_kind, "is_active?"]
    output: Room
    side_effects: []

  - method: GET
    path: "/aesthetics/rooms"
    description: "List rooms with filter on room_kind and is_active."
    roles: [MedicalDirector, Consultant, AttendingPhysician, Nurse]
    code: 200
    input: ["room_kind?", "is_active?", "limit?", "offset?"]
    output: "Room[]"
    side_effects: []

  # --- Customers ---
  - method: POST
    path: "/aesthetics/customers"
    description: "Create a customer profile."
    roles: [Consultant]
    code: 201
    input: [full_name, date_of_birth, contact_phone, "medical_history?", "allergies?", "medication_history?", "health_declaration?", "photo_archive_ids?", "scan3d_archive_ids?"]
    output: Customer
    side_effects: [customer_risk_score]

  - method: PATCH
    path: "/aesthetics/customers/{id}"
    description: "Update a customer's declarative fields. Recomputes risk_score."
    roles: [Consultant, Customer]
    code: 200
    input: ["full_name?", "contact_phone?", "medical_history?", "allergies?", "medication_history?", "health_declaration?", "photo_archive_ids?", "scan3d_archive_ids?", "version?"]
    output: Customer
    side_effects: [customer_risk_score]

  - method: POST
    path: "/aesthetics/customers/{id}/kyc"
    description: "Submit and verify KYC + credit check. Sets kyc_status and credit_score."
    roles: [FinanceOfficer]
    code: 200
    input: [kyc_status, credit_score]
    output: Customer
    side_effects: [audit_entry]

  - method: GET
    path: "/aesthetics/customers/{id}"
    description: "Fetch a customer."
    roles: [Consultant, AttendingPhysician, SeniorPhysician, Nurse, FinanceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- TreatmentPlans ---
  - method: POST
    path: "/aesthetics/plans"
    description: "Create a plan in DRAFT."
    roles: [Consultant]
    code: 201
    input: [customer_id, items, expected_outcome, risk_disclosure, "attending_physician_id?"]
    output: TreatmentPlan
    side_effects: [plan_total_provisional]

  - method: PATCH
    path: "/aesthetics/plans/{id}"
    description: "Edit DRAFT plan. Increments plan_version; recomputes provisional and countersign flag."
    roles: [Consultant]
    code: 200
    input: ["items?", "expected_outcome?", "risk_disclosure?", "attending_physician_id?", "version?"]
    output: TreatmentPlan
    side_effects: [plan_total_provisional]

  - method: POST
    path: "/aesthetics/plans/{id}/submit"
    description: "Submit DRAFT plan for physician review (DRAFT → SUBMITTED)."
    roles: [Consultant]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [plan_total_provisional, audit_entry]

  - method: POST
    path: "/aesthetics/plans/{id}/sign-consent"
    description: "Customer signs informed-consent record while plan is SUBMITTED."
    roles: [Customer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/plans/{id}/approve"
    description: "Attending physician approves a non-countersign plan (SUBMITTED → APPROVED)."
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [plan_total_final, audit_entry, sync_event_im]

  - method: POST
    path: "/aesthetics/plans/{id}/countersign"
    description: "Senior physician countersigns when requires_senior_countersign is true."
    roles: [SeniorPhysician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [plan_total_final, audit_entry, sync_event_im]

  - method: POST
    path: "/aesthetics/plans/{id}/reject"
    description: "Attending rejects plan (SUBMITTED → REJECTED)."
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/plans/{id}/return-to-draft"
    description: "Consultant pulls a SUBMITTED plan back to DRAFT for further edits."
    roles: [Consultant]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/aesthetics/plans/{id}/cancel"
    description: "Cancel an APPROVED plan; cascades to appointments and installment refunds."
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: [cascade_cancel_appointments, cascade_refund_installment, sync_event_finance_partner]

  - method: GET
    path: "/aesthetics/plans/{id}"
    description: "Fetch a plan."
    roles: [Consultant, AttendingPhysician, SeniorPhysician, Customer, FinanceOfficer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: GET
    path: "/aesthetics/plans"
    description: "List plans with filters (customer_id, status)."
    roles: [Consultant, AttendingPhysician, SeniorPhysician, FinanceOfficer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/aesthetics/appointments"
    description: "Create an appointment under an APPROVED plan with four-way (doctor/nurse/room/equipment) + optional anesthesia matching."
    roles: [Consultant]
    code: 201
    input: [plan_id, project_id, scheduled_start, doctor_id, nurse_id, room_id, equipment_ids, "anesthesia_resource_id?"]
    output: Appointment
    side_effects: [prep_lead_time, appointment_conflict_check]

  - method: POST
    path: "/aesthetics/appointments/{id}/reschedule"
    description: "Reschedule appointment within the reschedule limit."
    roles: [Consultant]
    code: 200
    input: [scheduled_start, "doctor_id?", "nurse_id?", "room_id?", "equipment_ids?", "anesthesia_resource_id?", "version?"]
    output: Appointment
    side_effects: [prep_lead_time, appointment_conflict_check]

  - method: POST
    path: "/aesthetics/appointments/{id}/cancel"
    description: "Cancel a SCHEDULED appointment."
    roles: [Consultant]
    code: 200
    input: []
    output: Appointment
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/appointments/{id}/check-in"
    description: "Nurse checks in the appointment within the prep window."
    roles: [Nurse]
    code: 200
    input: []
    output: Appointment
    side_effects: [create_operative_record, audit_entry]

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/start"
    description: "Attending physician marks procedure START. Transitions CHECKED_IN → IN_PROGRESS."
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: OperativeRecord
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/key-step"
    description: "Log a KEY_STEP entry in the procedure log."
    roles: [AttendingPhysician]
    code: 200
    input: [note]
    output: OperativeRecord
    side_effects: []

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/consumables"
    description: "Record consumable / drug usage with lot-number traceability."
    roles: [AttendingPhysician, Nurse]
    code: 200
    input: [sku_id, "lot_number?", quantity]
    output: OperativeRecord
    side_effects: [sync_event_pharma_trace]

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/vitals"
    description: "Attach a vital-sign data asset."
    roles: [Nurse]
    code: 200
    input: [asset_id]
    output: OperativeRecord
    side_effects: []

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/incidents"
    description: "Record an intra-operative incident."
    roles: [AttendingPhysician, Nurse]
    code: 200
    input: [severity, note]
    output: OperativeRecord
    side_effects: [audit_entry]

  - method: POST
    path: "/aesthetics/appointments/{id}/op-records/end"
    description: "Attending physician marks procedure END. Transitions IN_PROGRESS → COMPLETED, spawns FollowUps."
    roles: [AttendingPhysician]
    code: 200
    input: ["post_photo_ids?"]
    output: Appointment
    side_effects: [spawn_followups, audit_entry, sync_event_pharma_trace]

  - method: GET
    path: "/aesthetics/appointments/{id}"
    description: "Fetch an appointment."
    roles: [Consultant, AttendingPhysician, Nurse, Customer]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/aesthetics/appointments"
    description: "List appointments with filters."
    roles: [Consultant, AttendingPhysician, Nurse, FinanceOfficer]
    code: 200
    input: ["plan_id?", "doctor_id?", "room_id?", "status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  # --- FollowUps ---
  - method: POST
    path: "/aesthetics/followups/{id}/remind"
    description: "Dispatch a follow-up reminder via configured channel."
    roles: [Nurse]
    code: 200
    input: []
    output: FollowUp
    side_effects: [sync_event_im, audit_entry]

  - method: POST
    path: "/aesthetics/followups/{id}/feedback"
    description: "Customer submits self-reported feedback; may auto-create an AdverseEvent."
    roles: [Customer]
    code: 200
    input: [satisfaction, "symptoms?", "notes?"]
    output: FollowUp
    side_effects: [adverse_event_trigger]

  - method: GET
    path: "/aesthetics/followups/{id}"
    description: "Fetch a follow-up."
    roles: [Consultant, AttendingPhysician, Nurse, Customer]
    code: 200
    input: []
    output: FollowUp
    side_effects: []

  - method: GET
    path: "/aesthetics/followups"
    description: "List follow-ups."
    roles: [Consultant, AttendingPhysician, Nurse]
    code: 200
    input: ["appointment_id?", "stage?", "status?", "limit?", "offset?"]
    output: "FollowUp[]"
    side_effects: []

  # --- AdverseEvents ---
  - method: POST
    path: "/aesthetics/adverse-events"
    description: "Manually file an adverse event."
    roles: [AttendingPhysician, Nurse]
    code: 201
    input: [appointment_id, severity, description]
    output: AdverseEvent
    side_effects: [customer_risk_score, audit_entry]

  - method: POST
    path: "/aesthetics/adverse-events/{id}/escalate"
    description: "Escalate AE to medical-quality committee."
    roles: [AttendingPhysician, SeniorPhysician]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: [customer_risk_score, audit_entry]

  - method: POST
    path: "/aesthetics/adverse-events/{id}/close"
    description: "Close an adverse event."
    roles: [AttendingPhysician, SeniorPhysician]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: [audit_entry]

  - method: GET
    path: "/aesthetics/adverse-events"
    description: "List adverse events."
    roles: [AttendingPhysician, SeniorPhysician, MedicalDirector]
    code: 200
    input: ["customer_id?", "severity?", "status?", "limit?", "offset?"]
    output: "AdverseEvent[]"
    side_effects: []

  # --- InstallmentPlan ---
  - method: POST
    path: "/aesthetics/installments"
    description: "Create an installment plan for an APPROVED treatment plan."
    roles: [FinanceOfficer, Consultant]
    code: 201
    input: [treatment_plan_id, downpayment_cents, term_months, finance_partner_id]
    output: InstallmentPlan
    side_effects: []

  - method: POST
    path: "/aesthetics/installments/{id}/activate"
    description: "Activate installment plan (PENDING_KYC → ACTIVE) after KYC and credit verification."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: InstallmentPlan
    side_effects: [installment_schedule, sync_event_finance_partner]

  - method: POST
    path: "/aesthetics/installments/{id}/payments"
    description: "Record an installment payment or prepayment."
    roles: [Customer, FinanceOfficer]
    code: 200
    input: [amount_cents, external_ref, "prepay?"]
    output: InstallmentPlan
    side_effects: [sync_event_payment]

  - method: POST
    path: "/aesthetics/installments/{id}/refund-medical-event"
    description: "Issue refund triggered by a SEVERE adverse event."
    roles: [FinanceOfficer]
    code: 200
    input: [adverse_event_id]
    output: InstallmentPlan
    side_effects: [sync_event_finance_partner, audit_entry]

  - method: GET
    path: "/aesthetics/installments/{id}"
    description: "Fetch an installment plan."
    roles: [FinanceOfficer, Customer, Consultant]
    code: 200
    input: []
    output: InstallmentPlan
    side_effects: []

  - method: GET
    path: "/aesthetics/installments"
    description: "List installment plans."
    roles: [FinanceOfficer, Consultant]
    code: 200
    input: ["treatment_plan_id?", "status?", "limit?", "offset?"]
    output: "InstallmentPlan[]"
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/aesthetics/audit-entries"
    description: "List audit entries with filters."
    roles: [MedicalDirector, SeniorPhysician]
    code: 200
    input: ["subject_type?", "subject_id?", "action?", "limit?", "offset?"]
    output: "AuditEntry[]"
    side_effects: []

  # --- Sync events (read-only outbox) ---
  - method: GET
    path: "/aesthetics/sync-events"
    description: "List emitted sync events for inspection/testing."
    roles: [MedicalDirector, FinanceOfficer]
    code: 200
    input: ["topic?", "kind?", "limit?", "offset?"]
    output: "SyncEvent[]"
    side_effects: []

  # --- Clock / sweep test-driving endpoints ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock by `seconds` (test-only). Triggers time-based transitions (Appointment→NO_SHOW, FollowUp→MISSED, InstallmentPlan→IN_DEFAULT)."
    roles: [MedicalDirector]
    code: 200
    input: [seconds]
    output: null
    side_effects: [appointment_noshow_sweep, followup_missed_sweep, installment_default_sweep]


# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/invalid."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."

  - id: ERR_INVALID_INPUT
    http: 400
    condition: "Request payload fails schema/type validation."

  - id: ERR_PAGINATION_OUT_OF_RANGE
    http: 400
    condition: "limit < 1 or > 100, or offset < 0."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this transition."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH/PUT."

  - id: ERR_CUSTOMER_UNDERAGE
    http: 422
    condition: "Customer age < 18 at plan submission time."

  - id: ERR_ABSOLUTE_CONTRAINDICATION
    http: 422
    condition: "An ABSOLUTE ContraindicationRule evaluates true against the customer."

  - id: ERR_SEGREGATION_VIOLATION
    http: 422
    condition: "Same physician acts as attending and senior countersigner on the same plan."

  - id: ERR_CONSENT_NOT_SIGNED
    http: 422
    condition: "Informed-consent has not been signed before plan approval/countersign."

  - id: ERR_LOT_NUMBER_REQUIRED
    http: 422
    condition: "Consumable usage missing lot_number for a SKU with requires_lot_tracking=true."

  - id: ERR_DOCTOR_NOT_QUALIFIED
    http: 422
    condition: "Selected doctor not in Project.qualified_doctor_ids."

  - id: ERR_PROJECT_NOT_ON_SHELF
    http: 422
    condition: "Plan references a Project whose status is not ON_SHELF at submission time."

  - id: ERR_PROJECT_IN_USE
    http: 409
    condition: "Attempt to take a Project off-shelf while non-terminal plans still reference it."

  - id: ERR_ANESTHESIA_REQUIREMENT_MISMATCH
    http: 422
    condition: "Anesthesia resource missing for SURGICAL or supplied for non-SURGICAL."

  - id: ERR_ROOM_KIND_MISMATCH
    http: 422
    condition: "Operating room kind does not match the project category requirement."

  - id: ERR_DOCTOR_CONFLICT
    http: 409
    condition: "Doctor double-booked on [prep_window_start, scheduled_end)."

  - id: ERR_NURSE_CONFLICT
    http: 409
    condition: "Nurse double-booked on [prep_window_start, scheduled_end)."

  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "Room double-booked on extended interval [prep_window_start, scheduled_end + 15min)."

  - id: ERR_EQUIPMENT_CONFLICT
    http: 409
    condition: "Equipment double-booked on [prep_window_start, scheduled_end)."

  - id: ERR_ANESTHESIA_CONFLICT
    http: 409
    condition: "Anesthesia resource double-booked on [scheduled_start, scheduled_end)."

  - id: ERR_CHECKIN_OUTSIDE_WINDOW
    http: 422
    condition: "Check-in occurred outside [prep_window_start, scheduled_end)."

  - id: ERR_RESCHEDULE_LIMIT
    http: 422
    condition: "Appointment.reschedule_count already 3."

  - id: ERR_PLAN_ITEMS_OUT_OF_RANGE
    http: 422
    condition: "Plan items length outside 1..10."

  - id: ERR_PLAN_STALE_REFERENCE
    http: 409
    condition: "Project.version drifted from locked_project_versions snapshot after plan approval."

  - id: ERR_INVALID_INSTALLMENT_TERM
    http: 422
    condition: "term_months not in {3, 6, 12, 24}."

  - id: ERR_KYC_OR_CREDIT_FAIL
    http: 422
    condition: "Customer.kyc_status != VERIFIED or credit_score below the term's minimum."

  - id: ERR_DOWNPAYMENT_OUT_OF_RANGE
    http: 422
    condition: "downpayment_cents < 0 or > TreatmentPlan.final_total_cents."

  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "Payment amount <= 0 or exceeds remaining unpaid balance."

  - id: ERR_INSTALLMENT_ALREADY_EXISTS
    http: 409
    condition: "Attempt to create a second InstallmentPlan on the same TreatmentPlan."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MedicalDirector
    description: "Catalog and clinical governance. Reviews and approves projects, takes them off-shelf, configures contraindication rules, registers SKUs and rooms, and inspects audit logs."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/projects/{id}/approve"
      - "POST /aesthetics/projects/{id}/reject"
      - "POST /aesthetics/projects/{id}/take-off-shelf"
      - "POST /aesthetics/projects/{id}/return-to-shelf"
      - "POST /aesthetics/projects/{id}/contraindication-rules"
      - "POST /aesthetics/consumable-skus"
      - "POST /aesthetics/rooms"
      - "GET /aesthetics/audit-entries"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /aesthetics/projects"
      - "PATCH /aesthetics/projects/{id}"
      - "POST /aesthetics/projects/{id}/submit"
      - "GET /aesthetics/* (read)"

  - name: Consultant
    description: "Customer-facing role. Creates customers and proposes treatment plans; schedules appointments; can edit plans in DRAFT and pull SUBMITTED plans back to DRAFT."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/customers"
      - "POST /aesthetics/plans"
      - "PATCH /aesthetics/plans/{id}"
      - "POST /aesthetics/plans/{id}/submit"
      - "POST /aesthetics/plans/{id}/return-to-draft"
      - "POST /aesthetics/appointments"
      - "POST /aesthetics/appointments/{id}/reschedule"
      - "POST /aesthetics/appointments/{id}/cancel"
    shared_operations:
      - "POST /aesthetics/projects"
      - "PATCH /aesthetics/customers/{id}"
      - "POST /aesthetics/installments"

  - name: AttendingPhysician
    description: "Physician who reviews and signs the treatment plan and conducts the procedure. May approve plans without countersign requirement and reject any submitted plan; runs the operative record; cannot also act as senior countersigner on the same plan. X-User-ID is an opaque doctor id that must match Project.qualified_doctor_ids and TreatmentPlan.attending_physician_id when ownership is required."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/plans/{id}/approve"
      - "POST /aesthetics/plans/{id}/reject"
      - "POST /aesthetics/plans/{id}/cancel"
      - "POST /aesthetics/appointments/{id}/op-records/start"
      - "POST /aesthetics/appointments/{id}/op-records/end"
      - "POST /aesthetics/appointments/{id}/op-records/key-step"
    shared_operations:
      - "POST /aesthetics/appointments/{id}/op-records/consumables"
      - "POST /aesthetics/appointments/{id}/op-records/incidents"
      - "POST /aesthetics/adverse-events"
      - "POST /aesthetics/adverse-events/{id}/escalate"
      - "POST /aesthetics/adverse-events/{id}/close"

  - name: SeniorPhysician
    description: "Senior physician who countersigns high-risk plans and may close escalated adverse events. Cannot be the same person as attending_physician_id on the same plan (segregation of duties). X-User-ID is an opaque doctor id."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/plans/{id}/countersign"
    shared_operations:
      - "POST /aesthetics/adverse-events/{id}/escalate"
      - "POST /aesthetics/adverse-events/{id}/close"
      - "GET /aesthetics/audit-entries"

  - name: Nurse
    description: "Operational support. Checks the customer in, records vitals, attaches photos, and dispatches follow-up reminders. X-User-ID is an opaque nurse id."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/appointments/{id}/check-in"
      - "POST /aesthetics/appointments/{id}/op-records/vitals"
      - "POST /aesthetics/followups/{id}/remind"
    shared_operations:
      - "POST /aesthetics/appointments/{id}/op-records/consumables"
      - "POST /aesthetics/appointments/{id}/op-records/incidents"
      - "POST /aesthetics/adverse-events"

  - name: FinanceOfficer
    description: "Owns KYC, credit verification, installment plan activation and refunds; coordinates with the third-party consumer-finance institution."
    identity: opaque
    exclusive_operations:
      - "POST /aesthetics/customers/{id}/kyc"
      - "POST /aesthetics/installments/{id}/activate"
      - "POST /aesthetics/installments/{id}/refund-medical-event"
    shared_operations:
      - "POST /aesthetics/installments"
      - "POST /aesthetics/installments/{id}/payments"
      - "GET /aesthetics/sync-events"

  - name: Customer
    description: "End user. Reads own records, signs informed-consent on their own plan, submits follow-up feedback, makes installment payments. Identity is bound to a Customer row (X-User-ID == Customer.id)."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /aesthetics/plans/{id}/sign-consent"
      - "POST /aesthetics/followups/{id}/feedback"
    shared_operations:
      - "POST /aesthetics/installments/{id}/payments"
      - "PATCH /aesthetics/customers/{id}"
      - "GET /aesthetics/customers/{id}"
      - "GET /aesthetics/plans/{id}"
      - "GET /aesthetics/appointments/{id}"
      - "GET /aesthetics/followups/{id}"
      - "GET /aesthetics/installments/{id}"
