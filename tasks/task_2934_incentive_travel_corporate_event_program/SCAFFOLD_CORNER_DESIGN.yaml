  - name: gross_up_variant_cannot_switch_so_the_reconciliation_delta_is_always_zero
    claim_type: reconciliation
    grounds:
    - §1.3 taxable_award_gross_up (variants)
    - §1.1 Program.gross_up_policy_locked
    - §1.4 priority 13 ERR_GROSS_UP_POLICY_LOCKED
    - §1.2 Qualifier tax_status PENDING_REPORT -> REPORTED -> VOIDED -> PENDING_REPORT
    distinguishing_aspect: |
      The reconciliation claim for this scaffold is a negative one, and it needs its own recipe
      because it is the only place the design decision is observable: the gross-up variant is
      latched by gross_up_policy_locked before registration can open, so a provisional-to-final
      switch is structurally impossible and there is never a ledger delta to apply. What CAN be
      reversed is the filing itself, and that reversal must be exact — file adds
      reported_value_cents to the program total, void subtracts the same figure, and a
      replacement draft re-derives from the same unchanged policy and reproduces the identical
      numbers. Any implementation that recomputed the snapshot at void or at redraft would be
      caught by the byte-equal comparison of the two drafts.
    test_recipe:
      setup: Empty database. The canonical 5000000-cent program is opened with gross_up_policy FLAT_SUPPLEMENTAL
        and reaches RECONCILED with Ben Ortiz as its single travelling GOLD winner (taxable_award_cents
