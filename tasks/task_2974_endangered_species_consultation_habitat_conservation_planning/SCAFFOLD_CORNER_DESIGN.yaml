      - name: submission_requires_a_reserved_commitment_before_and_after_a_revision
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors["ERR_NO_MITIGATION_COMMITMENTS"]
          - state_machines[entity=HabitatConservationPlan].state_field=plan_status
