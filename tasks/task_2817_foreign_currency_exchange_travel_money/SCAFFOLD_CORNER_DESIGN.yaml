              as: TreasuryOfficer
              captures: { ship_id: "$.data.id" }
          trigger:
            - call: "POST /cash-shipments/${ship_id}/schedule"
              payload: { armored_route_id: "${route_north_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: TreasuryOfficer
