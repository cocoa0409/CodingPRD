# =============================================================================
# task_2144 — Antitrust & Competition Compliance Program
# Seed tables §1.0–§1.7 (SCAFFOLD.yaml)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2144. Antitrust & Competition Compliance Program
  (corporate antitrust counsel): risk assessment by market position & interaction points,
  trade association participation approval & meeting minutes review, competitor contact log
  & pricing communication rules, merger/acquisition HSR filing threshold analysis,
  dawn-raid/inspection readiness protocol, training targeted at sales & pricing roles,
  document creation guidelines & audit, leniency application decision framework

domain_name: antitrust-competition-compliance
api_prefix: /compliance

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer top-level collection under /compliance/<collection>.
  # Ownership is expressed exclusively through FK fields in request bodies;
  # no entity is nested inside another entity's URL path.

  state_machine_shape: parallel
  # AssociationParticipation is fork-join branching (legal clearance ‖ business
  # justification, joined into ACTIVE with divergent per-branch side effects);
  # CompetitorContact is cyclic (UNDER_REVIEW ⇄ REMEDIATION_REQUIRED);
  # LeniencyApplication carries two independent state dimensions on one row
  # (marker_status × disclosure_status); BusinessUnit.posture is a derived
  # aggregate that gates child operations.

  relationship_patterns:
    - one_to_many          # BusinessUnit → EmployeeProfile / CompetitorContact / Transaction
    - many_to_many         # AssociationParticipation joins BusinessUnit × TradeAssociation × EmployeeProfile
    - cross_aggregate      # MeetingAttendance couples AssociationMeeting (association aggregate) to AssociationParticipation (business-unit aggregate)
    - polymorphic          # LeniencyApplication.source_contact_id is an optional back-reference into the contact log

  role_model: segregation_of_duties
  # The AntitrustCounsel user who granted legal clearance on a participation
  # may not review minutes for that participation's attendances; the counsel
  # who flagged an attendance may not close its remediation.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business unit name" }
      - { name: market_code, type: string, source: input, description: "Relevant-market identifier used for risk banding" }
      - { name: market_share_bps, type: integer, source: input, description: "Market share in basis points", constraints: "0..10000" }
      - { name: interaction_point_count, type: integer, source: input, description: "Number of recurring structural interaction points with competitors (joint ventures, standards bodies, shared distributors)", constraints: ">= 0" }
      - { name: competitor_overlap_pct, type: number, source: input, description: "Percent of revenue in product lines where a direct competitor is also present", constraints: "0..100" }
      - { name: exposure_budget_points, type: number, source: input, default: 100, description: "Maximum cumulative exposure points tolerated before new competitor contacts are refused", constraints: "> 0" }
      - { name: review_minutes_budget, type: integer, source: input, default: 480, description: "Counsel review minutes available to reserve across trade-association participations", constraints: "> 0" }
      - { name: exposure_points, type: number, source: computed, default: 0, description: "Running antitrust exposure ledger; see calculations.business_unit_exposure_ledger", constraints: "2 decimal places, floor 0" }
      - { name: manual_exposure_adjustment_points, type: number, source: computed, default: 0, description: "Running sum of every points_delta accepted by POST /compliance/business-units/{id}/exposure-adjustments" }
      - { name: review_minutes_consumed, type: integer, source: computed, default: 0, description: "Sum of AssociationParticipation.review_minutes_reserved over this unit's participations whose status IN {PARTIALLY_APPROVED, ACTIVE, SUSPENDED, UNDER_REVIEW}" }
      - { name: risk_band, type: enum, source: computed, default: LOW, description: "LOW | MODERATE | HIGH | SEVERE — band of the unit's ACTIVE RiskAssessment; LOW when no ACTIVE RiskAssessment exists", constraints: "LOW | MODERATE | HIGH | SEVERE" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | FROZEN — derived gate over all child operations; see calculations.business_unit_posture", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: document_violation_count, type: integer, source: computed, default: 0, description: "Sum of DocumentAudit.violation_count over this unit's audits whose status == COMPLETED" }

  - name: EmployeeProfile
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id; the unit this person books activity against" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Employee email" }
      - { name: role_category, type: enum, source: input, description: "SALES | PRICING | LEGAL | OTHER — drives training targeting and contact exposure weighting", constraints: "SALES | PRICING | LEGAL | OTHER" }
      - { name: clearance_status, type: enum, source: system, default: NONE, description: "NONE | GRANTED | SUSPENDED | REVOKED — trade-association speaking clearance", constraints: "NONE | GRANTED | SUSPENDED | REVOKED" }
      - { name: training_status, type: enum, source: computed, default: NONE, description: "NONE | CURRENT | EXPIRED — derived from this employee's TrainingAssignment rows; see calculations.employee_training_status" }
      - { name: training_expires_at, type: datetime, source: computed, description: "Latest expires_at among this employee's COMPLETED assignments for mandatory curricula targeting role_category; null when none" }

  - name: TrainingCurriculum
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Curriculum code; unique across all curricula" }
      - { name: title, type: string, source: input, description: "Curriculum title" }
      - { name: target_role_categories, type: array, source: input, description: "Non-empty subset of {SALES, PRICING, LEGAL, OTHER} this curriculum is targeted at" }
      - { name: duration_minutes, type: integer, source: input, description: "Nominal training duration", constraints: "> 0" }
      - { name: validity_days, type: integer, source: input, description: "Days a completion stays current", constraints: "> 0" }
      - { name: is_mandatory, type: boolean, source: input, default: true, description: "Whether a current completion of this curriculum is a precondition for competitor-contact logging and participation nomination" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> EmployeeProfile.id" }
      - { name: curriculum_id, type: string, source: input, description: "FK -> TrainingCurriculum.id" }
      - { name: due_at, type: datetime, source: input, description: "Completion deadline" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | IN_PROGRESS | COMPLETED | EXPIRED | WAIVED", constraints: "ASSIGNED | IN_PROGRESS | COMPLETED | EXPIRED | WAIVED" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant of the start transition; null before it" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of the completion transition; null before it" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + TrainingCurriculum.validity_days days; null until COMPLETED" }
      - { name: score, type: integer, source: input, description: "Assessment score supplied at completion", constraints: "0..100" }
      - { name: waiver_reason, type: string, source: system, description: "Reason recorded by the WAIVED transition; null otherwise" }

  - name: TradeAssociation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association name" }
      - { name: approval_tier, type: enum, source: input, description: "TIER_1_LOW | TIER_2_MEDIUM | TIER_3_HIGH — counsel scrutiny tier", constraints: "TIER_1_LOW | TIER_2_MEDIUM | TIER_3_HIGH" }
      - { name: competitor_density_pct, type: number, source: input, description: "Percent of the association's membership that competes with the participating unit", constraints: "0..100" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | PROHIBITED", constraints: "PROPOSED | APPROVED | PROHIBITED" }

  - name: AssociationParticipation
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id" }
      - { name: association_id, type: string, source: input, description: "FK -> TradeAssociation.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> EmployeeProfile.id; the nominated delegate" }
      - { name: purpose, type: string, source: input, description: "Stated business purpose for participating" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVAL_PENDING | PARTIALLY_APPROVED | ACTIVE | SUSPENDED | UNDER_REVIEW | REJECTED | TERMINATED", constraints: "DRAFT | APPROVAL_PENDING | PARTIALLY_APPROVED | ACTIVE | SUSPENDED | UNDER_REVIEW | REJECTED | TERMINATED" }
      - { name: legal_cleared, type: boolean, source: system, default: false, description: "True once the legal-clearance branch has landed with decision CLEARED" }
      - { name: business_justified, type: boolean, source: system, default: false, description: "True once the business-justification branch has landed" }
      - { name: legal_cleared_by_user_id, type: string, source: system, description: "X-User-ID of the AntitrustCounsel who granted legal clearance; null until then. Segregation-of-duties key." }
      - { name: business_justification, type: string, source: system, description: "Justification text recorded by the business-justification branch; null until then" }
      - { name: review_load_minutes, type: integer, source: computed, default: 0, description: "Counsel review load; see calculations.participation_review_load_minutes. Computed at the legal-clearance transition and frozen thereafter." }
      - { name: review_minutes_reserved, type: integer, source: computed, default: 0, description: "Minutes currently held against BusinessUnit.review_minutes_budget; equals review_load_minutes while status IN {PARTIALLY_APPROVED, ACTIVE, SUSPENDED, UNDER_REVIEW}, else 0" }

  - name: AssociationMeeting
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> TradeAssociation.id" }
      - { name: meeting_type, type: enum, source: input, description: "BOARD | COMMITTEE | STANDARDS | SOCIAL", constraints: "BOARD | COMMITTEE | STANDARDS | SOCIAL" }
      - { name: scheduled_start, type: datetime, source: input, description: "Meeting start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Meeting end (ISO 8601 UTC); MUST be strictly after scheduled_start" }
      - { name: agenda_received, type: boolean, source: input, default: false, description: "Whether counsel has received the written agenda in advance" }

  - name: MeetingAttendance
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> AssociationMeeting.id" }
      - { name: participation_id, type: string, source: input, description: "FK -> AssociationParticipation.id" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | ATTENDED | MINUTES_SUBMITTED | MINUTES_REVIEWED | FLAGGED | CANCELLED", constraints: "PLANNED | ATTENDED | MINUTES_SUBMITTED | MINUTES_REVIEWED | FLAGGED | CANCELLED" }
      - { name: occupied_start, type: datetime, source: computed, description: "meeting.scheduled_start minus COUNSEL_BRIEFING_BUFFER_MINUTES; left edge of the delegate's closed occupancy interval" }
      - { name: occupied_end, type: datetime, source: computed, description: "meeting.scheduled_end; right edge of the delegate's closed occupancy interval" }
      - { name: minutes_summary, type: string, source: system, description: "Delegate-submitted minutes summary; null until MINUTES_SUBMITTED" }
      - { name: topics_discussed, type: array, source: system, description: "Delegate-declared topic codes; null until MINUTES_SUBMITTED" }
      - { name: minutes_verdict, type: enum, source: system, description: "CLEAN | CONCERN | VIOLATION — counsel verdict; null until reviewed", constraints: "CLEAN | CONCERN | VIOLATION" }
      - { name: minutes_findings, type: array, source: system, description: "Counsel finding codes from {PRICING_DISCUSSION, CAPACITY_DISCUSSION, CUSTOMER_ALLOCATION, BID_COORDINATION, MARKET_DATA_AGGREGATE, NONE}; null until reviewed" }
      - { name: minutes_reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing AntitrustCounsel; null until reviewed. Segregation-of-duties key." }
      - { name: exposure_points_assessed, type: number, source: computed, default: 0, description: "Exposure points charged to the business unit by the minutes review; see calculations.minutes_review_exposure_points" }
      - { name: cancellation_reason, type: string, source: system, description: "Reason recorded by the CANCELLED transition, including cascade-generated cancellations; null otherwise" }

  - name: CompetitorContact
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> EmployeeProfile.id; the person who had the contact" }
      - { name: competitor_name, type: string, source: input, description: "Competitor entity name" }
      - { name: contact_channel, type: enum, source: input, description: "IN_PERSON_UNSTRUCTURED | TRADE_SHOW | PHONE | EMAIL | WRITTEN_FORMAL", constraints: "IN_PERSON_UNSTRUCTURED | TRADE_SHOW | PHONE | EMAIL | WRITTEN_FORMAL" }
      - { name: topic_tags, type: array, source: input, description: "Subset of {CAPACITY, BID, CUSTOMER_ALLOCATION, TERRITORY, STANDARDS, BENCHMARKING}; may be empty" }
      - { name: pricing_topic, type: boolean, source: input, description: "Whether price, discount, margin or list-price timing was discussed" }
      - { name: occurred_at, type: datetime, source: input, description: "When the contact happened (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED | UNDER_REVIEW | REMEDIATION_REQUIRED | CLEARED | ESCALATED", constraints: "LOGGED | UNDER_REVIEW | REMEDIATION_REQUIRED | CLEARED | ESCALATED" }
      - { name: exposure_points_charged, type: number, source: computed, default: 0, description: "Points this contact currently contributes to BusinessUnit.exposure_points; see calculations.contact_exposure_points" }
      - { name: band_multiplier_applied, type: number, source: computed, default: 1, description: "BAND_MULTIPLIER value frozen at log time from BusinessUnit.risk_band" }
      - { name: review_opened_by_user_id, type: string, source: system, description: "X-User-ID of the counsel who opened the review; null until then" }
      - { name: remediation_instructions, type: string, source: system, description: "Counsel remediation instructions; null until REMEDIATION_REQUIRED" }
      - { name: remediation_response, type: string, source: system, description: "Employee remediation response; null until submitted" }

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id; the acquiring unit" }
      - { name: target_name, type: string, source: input, description: "Target entity name" }
      - { name: deal_value_cents, type: integer, source: input, description: "Contract consideration in cents", constraints: ">= 0" }
      - { name: assumed_liabilities_cents, type: integer, source: input, description: "Liabilities assumed by the acquirer in cents", constraints: ">= 0" }
      - { name: market_valuation_cents, type: integer, source: input, description: "Independently determined market value of the acquired voting securities/assets in cents", constraints: ">= 0" }
      - { name: acquirer_total_assets_cents, type: integer, source: input, description: "Acquiring person total assets in cents", constraints: ">= 0" }
      - { name: target_total_assets_cents, type: integer, source: input, description: "Acquired person total assets in cents", constraints: ">= 0" }
      - { name: exemption_code, type: enum, source: input, default: NONE, description: "NONE | ORDINARY_COURSE | FOREIGN_ASSETS | INVESTMENT_ONLY", constraints: "NONE | ORDINARY_COURSE | FOREIGN_ASSETS | INVESTMENT_ONLY" }
      - { name: signed_at, type: datetime, source: input, description: "Signing date of the definitive agreement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ANALYZED | EXEMPT | FILED | CLEARED", constraints: "DRAFT | ANALYZED | EXEMPT | FILED | CLEARED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of the FILED transition; null before it" }
      - { name: waiting_period_end, type: datetime, source: computed, description: "filed_at + HSR_WAITING_PERIOD_DAYS days; null until FILED" }

  - name: HsrAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id" }
      - { name: valuation_variant, type: enum, source: input, description: "SIGNED_DEAL | MARKET_VALUE — which size-of-transaction algorithm this analysis ran", constraints: "SIGNED_DEAL | MARKET_VALUE" }
      - { name: size_of_transaction_cents, type: integer, source: computed, description: "Size of transaction under the selected variant; see calculations.hsr_size_of_transaction" }
      - { name: filing_required, type: boolean, source: computed, description: "Whether an HSR notification must be filed" }
      - { name: determination, type: enum, source: computed, description: "EXEMPT | BELOW_THRESHOLD | SIZE_OF_PERSON_NOT_MET | FILING_REQUIRED", constraints: "EXEMPT | BELOW_THRESHOLD | SIZE_OF_PERSON_NOT_MET | FILING_REQUIRED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED — only one ACTIVE analysis per transaction", constraints: "ACTIVE | SUPERSEDED" }
      - { name: analyzed_by_user_id, type: string, source: system, description: "X-User-ID of the AntitrustCounsel who ran the analysis" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: concurrent_drill_capacity, type: integer, source: input, default: 1, description: "Maximum number of occupying readiness drills allowed to overlap at any instant", constraints: ">= 1" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "Mean score over this site's COMPLETED ReadinessDrill rows, 2dp; 0 when none" }

  - name: ReadinessDrill
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: drill_type, type: enum, source: input, description: "DAWN_RAID | DOCUMENT_HOLD | INTERVIEW", constraints: "DAWN_RAID | DOCUMENT_HOLD | INTERVIEW" }
      - { name: window_start, type: datetime, source: input, description: "Half-open occupancy window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open occupancy window end (exclusive); MUST be strictly after window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED" }
      - { name: score, type: integer, source: input, description: "Readiness score supplied at completion", constraints: "0..100" }
      - { name: gaps_found, type: integer, source: input, description: "Number of readiness gaps recorded at completion", constraints: ">= 0" }
      - { name: abort_reason, type: string, source: system, description: "Reason recorded by the ABORTED transition; null otherwise" }

  - name: DocumentAudit
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id" }
      - { name: sample_size, type: integer, source: input, description: "Number of documents sampled", constraints: "> 0" }
      - { name: scope_note, type: string, source: input, description: "Scope of the document-creation-guideline audit" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COMPLETED", constraints: "OPEN | COMPLETED" }
      - { name: violation_count, type: integer, source: input, description: "Documents violating the creation guidelines; supplied at findings time", constraints: "0..sample_size" }
      - { name: high_risk_phrase_count, type: integer, source: input, description: "Occurrences of high-risk phrasing; supplied at findings time", constraints: ">= 0" }
      - { name: guideline_score, type: number, source: computed, description: "See calculations.document_guideline_score; null until COMPLETED" }

  - name: LeniencyApplication
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id" }
      - { name: source_contact_id, type: string, source: input, description: "FK -> CompetitorContact.id; optional back-reference to the contact-log entry that surfaced the conduct. Null when the application originates from a minutes review or an internal audit." }
      - { name: cartel_code, type: string, source: input, description: "Opaque code identifying the suspected cartel; the leniency queue is ranked within a cartel_code" }
      - { name: affected_years, type: array, source: input, description: "Non-empty array of objects { year: integer, affected_commerce_cents: integer } — one entry per affected year" }
      - { name: gravity_pct, type: number, source: system, description: "Gravity percentage recorded at disclosure submission; null before", constraints: "0..30" }
      - { name: marker_status, type: enum, source: system, default: NONE, description: "NONE | MARKER_REQUESTED | MARKER_GRANTED | MARKER_DENIED | MARKER_EXPIRED | PERFECTED", constraints: "NONE | MARKER_REQUESTED | MARKER_GRANTED | MARKER_DENIED | MARKER_EXPIRED | PERFECTED" }
      - { name: disclosure_status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | WITHDRAWN", constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: marker_requested_at, type: datetime, source: system, description: "Logical-clock instant of the marker request; null before" }
      - { name: marker_granted_at, type: datetime, source: system, description: "Logical-clock instant of the marker grant; null before. Primary ranking key of the leniency queue." }
      - { name: priority_rank, type: integer, source: computed, description: "Rank within cartel_code; see calculations.leniency_priority_rank. Null while marker_status != MARKER_GRANTED and != PERFECTED." }
      - { name: estimated_penalty_cents, type: integer, source: computed, description: "See calculations.leniency_penalty_estimate; null while gravity_pct is null" }
      - { name: withdrawal_reason, type: string, source: system, description: "Reason recorded by the withdrawal transition; null otherwise" }

  - name: RiskAssessment
    parent: null
    common_fields: true
    fields:
      - { name: business_unit_id, type: string, source: input, description: "FK -> BusinessUnit.id" }
      - { name: variant, type: enum, source: input, description: "BASELINE | INCIDENT_ADJUSTED — which market_risk_index algorithm this assessment ran", constraints: "BASELINE | INCIDENT_ADJUSTED" }
      - { name: share_component, type: number, source: computed, description: "Tiered contribution of market_share_bps" }
      - { name: interaction_component, type: number, source: computed, description: "Capped contribution of interaction_point_count" }
      - { name: overlap_component, type: number, source: computed, description: "Weighted contribution of competitor_overlap_pct" }
      - { name: incident_load, type: number, source: computed, default: 0, description: "Capped incident contribution; always 0 for the BASELINE variant" }
      - { name: escalated_contact_count, type: integer, source: computed, default: 0, description: "Count of CompetitorContact rows for this unit with status == ESCALATED at assessment time" }
      - { name: flagged_attendance_count, type: integer, source: computed, default: 0, description: "Count of MeetingAttendance rows with status == FLAGGED whose participation.business_unit_id == this unit at assessment time" }
      - { name: document_violation_count, type: integer, source: computed, default: 0, description: "Sum of DocumentAudit.violation_count over this unit's COMPLETED audits at assessment time" }
      - { name: market_risk_index, type: number, source: computed, description: "See calculations.market_risk_index", constraints: "0.00..100.00, 2 decimal places" }
      - { name: risk_band, type: enum, source: computed, description: "LOW | MODERATE | HIGH | SEVERE", constraints: "LOW | MODERATE | HIGH | SEVERE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED — only one ACTIVE assessment per business unit", constraints: "ACTIVE | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- BusinessUnit
  # Derived aggregate posture. Every transition is system-triggered: the posture
  # is recomputed (calculations.business_unit_posture) at the END of any request
  # that mutates exposure_points, risk_band, or a LeniencyApplication marker_status
  # for this unit. Recomputation is idempotent; a recomputation that lands on the
  # same value fires no side effects and does NOT increment version a second time.
  - entity: BusinessUnit
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system — posture recompute after exposure_points or risk_band changes"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to RESTRICTED"
        side_effects:
          - "BusinessUnit.posture := RESTRICTED"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"
        note: "RESTRICTED refuses POST /compliance/participations for this unit (ERR_BUSINESS_UNIT_RESTRICTED) but still permits competitor-contact logging — self-reporting is never blocked."

      - from: RESTRICTED
        to: OPEN
        trigger: "system — posture recompute after exposure_points drops (e.g. contact cleared) or risk_band falls"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to OPEN"
        side_effects:
          - "BusinessUnit.posture := OPEN"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"

      - from: OPEN
        to: FROZEN
        trigger: "system — posture recompute after exposure_points crosses FROZEN_EXPOSURE_THRESHOLD or a marker request is filed"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to FROZEN"
        side_effects:
          - "BusinessUnit.posture := FROZEN"
          - "CASCADE HOP 1: every AssociationParticipation of this unit with status IN {PARTIALLY_APPROVED, ACTIVE} transitions to SUSPENDED, processed in created_at ASC order"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"

      - from: RESTRICTED
        to: FROZEN
        trigger: "system — posture recompute after exposure_points crosses FROZEN_EXPOSURE_THRESHOLD or a marker request is filed"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to FROZEN"
        side_effects:
          - "BusinessUnit.posture := FROZEN"
          - "CASCADE HOP 1: every AssociationParticipation of this unit with status IN {PARTIALLY_APPROVED, ACTIVE} transitions to SUSPENDED, processed in created_at ASC order"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"

      - from: FROZEN
        to: RESTRICTED
        trigger: "system — posture recompute after exposure_points falls below FROZEN_EXPOSURE_THRESHOLD and no marker is outstanding"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to RESTRICTED"
        side_effects:
          - "BusinessUnit.posture := RESTRICTED"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"
        note: "Thawing does NOT auto-reinstate suspended participations; reinstatement is an explicit AntitrustCounsel act."

      - from: FROZEN
        to: OPEN
        trigger: "system — posture recompute after exposure_points falls below RESTRICTED_EXPOSURE_THRESHOLD and no marker is outstanding and risk_band NOT IN {HIGH, SEVERE}"
        actor: system
        preconditions:
          - "calculations.business_unit_posture evaluates to OPEN"
        side_effects:
          - "BusinessUnit.posture := OPEN"
          - "BusinessUnit.updated_at refreshed; BusinessUnit.version += 1"

  # ------------------------------------------------- AssociationParticipation
  # Fork-join branching with divergent per-branch side effects, plus a
  # SUSPENDED <-> ACTIVE and UNDER_REVIEW -> ACTIVE revision cycle.
  - entity: AssociationParticipation
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: APPROVAL_PENDING
        trigger: "POST /compliance/participations/{id}/submission"
        actor: BusinessLead
        preconditions:
          - "participation.status == DRAFT"
          - "TradeAssociation.status == APPROVED"
          - "BusinessUnit.posture != FROZEN"
          - "EmployeeProfile.training_status == CURRENT when employee.role_category IN {SALES, PRICING}"
        side_effects:
          - "AssociationParticipation.status := APPROVAL_PENDING"

      - from: APPROVAL_PENDING
        to: PARTIALLY_APPROVED
        trigger: "POST /compliance/participations/{id}/legal-clearance with decision == CLEARED (LEGAL branch, first arrival)"
        actor: AntitrustCounsel
        preconditions:
          - "participation.status == APPROVAL_PENDING"
          - "participation.legal_cleared == false"
          - "BusinessUnit.review_minutes_consumed + calculations.participation_review_load_minutes <= BusinessUnit.review_minutes_budget"
        side_effects:
          - "LEGAL-BRANCH ONLY: review_load_minutes := calculations.participation_review_load_minutes and review_minutes_reserved := review_load_minutes"
          - "LEGAL-BRANCH ONLY: BusinessUnit.review_minutes_consumed += review_minutes_reserved; BusinessUnit.version += 1"
          - "legal_cleared := true; legal_cleared_by_user_id := X-User-ID"
          - "AssociationParticipation.status := PARTIALLY_APPROVED"

      - from: APPROVAL_PENDING
        to: PARTIALLY_APPROVED
        trigger: "POST /compliance/participations/{id}/business-justification (BUSINESS branch, first arrival)"
        actor: BusinessLead
        preconditions:
          - "participation.status == APPROVAL_PENDING"
          - "participation.business_justified == false"
        side_effects:
          - "BUSINESS-BRANCH ONLY: business_justified := true; business_justification := payload.justification"
          - "BUSINESS branch reserves NO counsel review minutes and leaves review_load_minutes at 0"
          - "AssociationParticipation.status := PARTIALLY_APPROVED"

      - from: PARTIALLY_APPROVED
        to: ACTIVE
        trigger: "POST /compliance/participations/{id}/legal-clearance with decision == CLEARED, or POST /compliance/participations/{id}/business-justification — whichever branch had not yet landed (JOIN)"
        actor: AntitrustCounsel | BusinessLead
        preconditions:
          - "participation.status == PARTIALLY_APPROVED"
          - "the arriving branch has not already landed (legal_cleared == false for the legal branch; business_justified == false for the business branch)"
          - "for the legal branch only: BusinessUnit.review_minutes_consumed + calculations.participation_review_load_minutes <= BusinessUnit.review_minutes_budget"
          - "BusinessUnit.posture != FROZEN"
        side_effects:
          - "the arriving branch applies its own branch-specific side effects (see the two PARTIALLY_APPROVED transitions above)"
          - "JOIN: legal_cleared == true AND business_justified == true, therefore AssociationParticipation.status := ACTIVE"

      - from: APPROVAL_PENDING
        to: REJECTED
        trigger: "POST /compliance/participations/{id}/legal-clearance with decision == REJECTED"
        actor: AntitrustCounsel
        preconditions:
          - "participation.status == APPROVAL_PENDING"
        side_effects:
          - "AssociationParticipation.status := REJECTED"
          - "no review minutes are reserved or released"

      - from: PARTIALLY_APPROVED
        to: REJECTED
        trigger: "POST /compliance/participations/{id}/legal-clearance with decision == REJECTED"
        actor: AntitrustCounsel
        preconditions:
          - "participation.status == PARTIALLY_APPROVED"
          - "participation.legal_cleared == false"
        side_effects:
          - "AssociationParticipation.status := REJECTED"

      - from: PARTIALLY_APPROVED
        to: SUSPENDED
        trigger: "system — CASCADE HOP 1 from BusinessUnit posture entering FROZEN"
        actor: system
        preconditions:
          - "BusinessUnit.posture just became FROZEN"
        side_effects:
          - "AssociationParticipation.status := SUSPENDED"
          - "review_minutes_reserved is NOT released — suspension holds the reservation"
          - "CASCADE HOP 2: every MeetingAttendance of this participation with status == PLANNED and meeting.scheduled_start > current logical clock transitions to CANCELLED, processed in meeting.scheduled_start ASC then created_at ASC order"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — CASCADE HOP 1 from BusinessUnit posture entering FROZEN"
        actor: system
        preconditions:
          - "BusinessUnit.posture just became FROZEN"
        side_effects:
          - "AssociationParticipation.status := SUSPENDED"
          - "review_minutes_reserved is NOT released — suspension holds the reservation"
          - "CASCADE HOP 2: every MeetingAttendance of this participation with status == PLANNED and meeting.scheduled_start > current logical clock transitions to CANCELLED, processed in meeting.scheduled_start ASC then created_at ASC order"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance/participations/{id}/reinstatement"
        actor: AntitrustCounsel
        preconditions:
          - "participation.status == SUSPENDED"
          - "BusinessUnit.posture != FROZEN"
          - "participation.legal_cleared == true AND participation.business_justified == true"
        side_effects:
          - "AssociationParticipation.status := ACTIVE"
        note: "Revision cycle: ACTIVE -> SUSPENDED -> ACTIVE."

      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "system — CASCADE HOP 2 from a MeetingAttendance of this participation entering FLAGGED"
        actor: system
        preconditions:
          - "an attendance whose participation_id == this participation just entered FLAGGED"
        side_effects:
          - "AssociationParticipation.status := UNDER_REVIEW"
          - "review_minutes_reserved is NOT released"
          - "CASCADE HOP 3: EmployeeProfile.clearance_status of participation.employee_id moves GRANTED -> SUSPENDED"

      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /compliance/participations/{id}/reinstatement"
        actor: AntitrustCounsel
        preconditions:
          - "participation.status == UNDER_REVIEW"
          - "BusinessUnit.posture != FROZEN"
          - "no MeetingAttendance of this participation is still in FLAGGED"
        side_effects:
          - "AssociationParticipation.status := ACTIVE"
        note: "Revision cycle: ACTIVE -> UNDER_REVIEW -> ACTIVE."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == ACTIVE"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "COMPENSATION: BusinessUnit.review_minutes_consumed -= review_minutes_reserved; review_minutes_reserved := 0; BusinessUnit.version += 1"
          - "every MeetingAttendance of this participation with status == PLANNED transitions to CANCELLED, processed in meeting.scheduled_start ASC then created_at ASC order"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == SUSPENDED"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "COMPENSATION: BusinessUnit.review_minutes_consumed -= review_minutes_reserved; review_minutes_reserved := 0; BusinessUnit.version += 1"

      - from: UNDER_REVIEW
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == UNDER_REVIEW"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "COMPENSATION: BusinessUnit.review_minutes_consumed -= review_minutes_reserved; review_minutes_reserved := 0; BusinessUnit.version += 1"

      - from: DRAFT
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == DRAFT"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "no review minutes were ever reserved, so review_minutes_reserved stays 0 and BusinessUnit.review_minutes_consumed is unchanged"
          - "the (business_unit_id, association_id, employee_id) triple is freed for a fresh nomination"

      - from: APPROVAL_PENDING
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == APPROVAL_PENDING"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "review_minutes_reserved stays 0 when the legal branch has not landed; when it has, BusinessUnit.review_minutes_consumed -= review_minutes_reserved and review_minutes_reserved := 0; BusinessUnit.version += 1"

      - from: PARTIALLY_APPROVED
        to: TERMINATED
        trigger: "POST /compliance/participations/{id}/termination"
        actor: BusinessLead | AntitrustCounsel
        preconditions:
          - "participation.status == PARTIALLY_APPROVED"
        side_effects:
          - "AssociationParticipation.status := TERMINATED"
          - "COMPENSATION: BusinessUnit.review_minutes_consumed -= review_minutes_reserved; review_minutes_reserved := 0; BusinessUnit.version += 1"

  # ------------------------------------------------------------ EmployeeProfile
  - entity: EmployeeProfile
    initial_state: NONE
    terminal_states: [REVOKED]
    transitions:
      - from: NONE
        to: GRANTED
        trigger: "POST /compliance/employees/{id}/clearance-grants"
        actor: AntitrustCounsel
        preconditions:
          - "employee.clearance_status IN {NONE, SUSPENDED}"
          - "employee.training_status == CURRENT when employee.role_category IN {SALES, PRICING}; the check is skipped for LEGAL and OTHER"
        side_effects:
          - "EmployeeProfile.clearance_status := GRANTED"

      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /compliance/employees/{id}/clearance-grants"
        actor: AntitrustCounsel
        preconditions:
          - "employee.clearance_status == SUSPENDED"
          - "employee.training_status == CURRENT when employee.role_category IN {SALES, PRICING}; the check is skipped for LEGAL and OTHER"
        side_effects:
          - "EmployeeProfile.clearance_status := GRANTED"
        note: "Revision cycle GRANTED -> SUSPENDED -> GRANTED."

      - from: GRANTED
        to: SUSPENDED
        trigger: "system — CASCADE HOP 3 from an AssociationParticipation of this employee entering UNDER_REVIEW"
        actor: system
        preconditions:
          - "a participation whose employee_id == this employee just entered UNDER_REVIEW"
        side_effects:
          - "EmployeeProfile.clearance_status := SUSPENDED"
          - "CASCADE HOP 4: every MeetingAttendance whose participation.employee_id == this employee, whose status == PLANNED, and whose meeting.scheduled_start > current logical clock transitions to CANCELLED, processed in meeting.scheduled_start ASC then created_at ASC order"

      - from: GRANTED
        to: REVOKED
        trigger: "POST /compliance/employees/{id}/clearance-revocations"
        actor: AntitrustCounsel
        preconditions:
          - "employee.clearance_status IN {NONE, GRANTED, SUSPENDED}"
        side_effects:
          - "EmployeeProfile.clearance_status := REVOKED"
          - "existing PLANNED attendances are deliberately NOT cancelled — revocation is a personnel record and the delegate's calendar bookings stay on the books (and keep occupying their intervals) until the business lead cancels them explicitly"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /compliance/employees/{id}/clearance-revocations"
        actor: AntitrustCounsel
        preconditions:
          - "employee.clearance_status == SUSPENDED"
        side_effects:
          - "EmployeeProfile.clearance_status := REVOKED"

      - from: NONE
        to: REVOKED
        trigger: "POST /compliance/employees/{id}/clearance-revocations"
        actor: AntitrustCounsel
        preconditions:
          - "employee.clearance_status == NONE"
        side_effects:
          - "EmployeeProfile.clearance_status := REVOKED"

  # ---------------------------------------------------------- TrainingAssignment
  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [EXPIRED, WAIVED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /compliance/training-assignments/{id}/start"
        actor: Employee
        preconditions:
          - "assignment.status == ASSIGNED"
          - "X-User-ID == assignment.employee_id"
        side_effects:
          - "TrainingAssignment.status := IN_PROGRESS; started_at := current logical clock"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /compliance/training-assignments/{id}/completion"
        actor: Employee
        preconditions:
          - "assignment.status == IN_PROGRESS"
          - "X-User-ID == assignment.employee_id"
          - "payload.score is an integer in 0..100"
        side_effects:
          - "TrainingAssignment.status := COMPLETED; completed_at := current logical clock; score := payload.score"
          - "expires_at := completed_at + TrainingCurriculum.validity_days days"
          - "EmployeeProfile.training_status and training_expires_at recomputed (calculations.employee_training_status)"

      - from: COMPLETED
        to: EXPIRED
        trigger: "system — lazy evaluation at the start of any request that reads or validates this assignment"
        actor: system
        preconditions:
          - "current logical clock >= assignment.expires_at"
        side_effects:
          - "TrainingAssignment.status := EXPIRED"
          - "EmployeeProfile.training_status recomputed; becomes EXPIRED when no other COMPLETED assignment is still current"

      - from: ASSIGNED
        to: WAIVED
        trigger: "POST /compliance/training-assignments/{id}/waiver"
        actor: AntitrustCounsel
        preconditions:
          - "assignment.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "TrainingAssignment.status := WAIVED; waiver_reason := payload.reason"
          - "a WAIVED assignment never contributes to training_status — waiving is an audit record, not a substitute for training"

      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /compliance/training-assignments/{id}/waiver"
        actor: AntitrustCounsel
        preconditions:
          - "assignment.status == IN_PROGRESS"
        side_effects:
          - "TrainingAssignment.status := WAIVED; waiver_reason := payload.reason"

  # ------------------------------------------------------------ TradeAssociation
  - entity: TradeAssociation
    initial_state: PROPOSED
    terminal_states: [PROHIBITED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /compliance/trade-associations/{id}/approval with decision == APPROVED"
        actor: AntitrustCounsel
        preconditions:
          - "association.status == PROPOSED"
        side_effects:
          - "TradeAssociation.status := APPROVED"

      - from: PROPOSED
        to: PROHIBITED
        trigger: "POST /compliance/trade-associations/{id}/approval with decision == PROHIBITED"
        actor: AntitrustCounsel
        preconditions:
          - "association.status == PROPOSED"
        side_effects:
          - "TradeAssociation.status := PROHIBITED"

      - from: APPROVED
        to: PROHIBITED
        trigger: "POST /compliance/trade-associations/{id}/approval with decision == PROHIBITED"
        actor: AntitrustCounsel
        preconditions:
          - "association.status == APPROVED"
        side_effects:
          - "TradeAssociation.status := PROHIBITED"
          - "every AssociationParticipation for this association with status IN {PARTIALLY_APPROVED, ACTIVE, SUSPENDED, UNDER_REVIEW} transitions to TERMINATED, processed in created_at ASC order, each releasing its reserved review minutes"

  # ----------------------------------------------------------- MeetingAttendance
  - entity: MeetingAttendance
    initial_state: PLANNED
    terminal_states: [MINUTES_REVIEWED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ATTENDED
        trigger: "POST /compliance/meeting-attendances/{id}/attendance-confirmation"
        actor: Employee
        preconditions:
          - "attendance.status == PLANNED"
          - "X-User-ID == participation.employee_id"
          - "current logical clock >= meeting.scheduled_end"
        side_effects:
          - "MeetingAttendance.status := ATTENDED"

      - from: ATTENDED
        to: MINUTES_SUBMITTED
        trigger: "POST /compliance/meeting-attendances/{id}/minutes"
        actor: Employee
        preconditions:
          - "attendance.status == ATTENDED"
          - "X-User-ID == participation.employee_id"
        side_effects:
          - "MeetingAttendance.status := MINUTES_SUBMITTED; minutes_summary and topics_discussed recorded"

      - from: MINUTES_SUBMITTED
        to: MINUTES_REVIEWED
        trigger: "POST /compliance/meeting-attendances/{id}/minutes-review with verdict IN {CLEAN, CONCERN}"
        actor: AntitrustCounsel
        preconditions:
          - "attendance.status == MINUTES_SUBMITTED"
          - "X-User-ID != participation.legal_cleared_by_user_id (segregation of duties)"
        side_effects:
          - "MeetingAttendance.status := MINUTES_REVIEWED; minutes_verdict, minutes_findings, minutes_reviewed_by_user_id recorded"
          - "exposure_points_assessed := calculations.minutes_review_exposure_points"
          - "BusinessUnit.exposure_points += exposure_points_assessed; BusinessUnit.version += 1; posture recomputed"

      - from: MINUTES_SUBMITTED
        to: FLAGGED
        trigger: "POST /compliance/meeting-attendances/{id}/minutes-review with verdict == VIOLATION"
        actor: AntitrustCounsel
        preconditions:
          - "attendance.status == MINUTES_SUBMITTED"
          - "X-User-ID != participation.legal_cleared_by_user_id (segregation of duties)"
        side_effects:
          - "MeetingAttendance.status := FLAGGED; minutes_verdict := VIOLATION; minutes_reviewed_by_user_id recorded"
          - "exposure_points_assessed := calculations.minutes_review_exposure_points"
          - "CASCADE HOP 1: BusinessUnit.exposure_points += exposure_points_assessed; BusinessUnit.version += 1; posture recomputed"
          - "CASCADE HOP 2: the parent AssociationParticipation moves ACTIVE -> UNDER_REVIEW"

      - from: FLAGGED
        to: MINUTES_REVIEWED
        trigger: "POST /compliance/meeting-attendances/{id}/remediation-closure"
        actor: AntitrustCounsel
        preconditions:
          - "attendance.status == FLAGGED"
          - "X-User-ID != attendance.minutes_reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "MeetingAttendance.status := MINUTES_REVIEWED"
          - "exposure_points_assessed is retained — remediation closes the file but does not refund exposure"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /compliance/meeting-attendances/{id}/cancellation"
        actor: BusinessLead
        preconditions:
          - "attendance.status == PLANNED"
          - "X-User-ID == participation.business_unit_id"
        side_effects:
          - "MeetingAttendance.status := CANCELLED; cancellation_reason recorded"
          - "the delegate's occupancy interval is released — a CANCELLED attendance never participates in overlap detection"

      - from: PLANNED
        to: CANCELLED
        trigger: "system — CASCADE HOP 2 from the parent participation entering SUSPENDED, CASCADE HOP 4 from the delegate's clearance entering SUSPENDED, or participation termination"
        actor: system
        preconditions:
          - "attendance.status == PLANNED"
          - "meeting.scheduled_start > current logical clock (for the posture and clearance-suspension cascades); no clock condition for participation termination"
        side_effects:
          - "MeetingAttendance.status := CANCELLED; cancellation_reason := the cascade origin"
          - "the delegate's occupancy interval is released"

  # ----------------------------------------------------------- CompetitorContact
  # Cyclic: UNDER_REVIEW <-> REMEDIATION_REQUIRED revision loop.
  - entity: CompetitorContact
    initial_state: LOGGED
    terminal_states: [CLEARED, ESCALATED]
    transitions:
      - from: LOGGED
        to: UNDER_REVIEW
        trigger: "POST /compliance/competitor-contacts/{id}/review-opening"
        actor: AntitrustCounsel
        preconditions:
          - "contact.status == LOGGED"
        side_effects:
          - "CompetitorContact.status := UNDER_REVIEW; review_opened_by_user_id := X-User-ID"

      - from: UNDER_REVIEW
        to: REMEDIATION_REQUIRED
        trigger: "POST /compliance/competitor-contacts/{id}/remediation-order"
        actor: AntitrustCounsel
        preconditions:
          - "contact.status == UNDER_REVIEW"
        side_effects:
          - "CompetitorContact.status := REMEDIATION_REQUIRED; remediation_instructions recorded"

      - from: REMEDIATION_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /compliance/competitor-contacts/{id}/remediation-response"
        actor: Employee
        preconditions:
          - "contact.status == REMEDIATION_REQUIRED"
          - "X-User-ID == contact.employee_id"
        side_effects:
          - "CompetitorContact.status := UNDER_REVIEW; remediation_response recorded"
        note: "Closes the revision cycle UNDER_REVIEW -> REMEDIATION_REQUIRED -> UNDER_REVIEW; the loop may repeat any number of times."

      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /compliance/competitor-contacts/{id}/clearance"
        actor: AntitrustCounsel
        preconditions:
          - "contact.status == UNDER_REVIEW"
        side_effects:
          - "CompetitorContact.status := CLEARED"
          - "COMPENSATION: BusinessUnit.exposure_points -= contact.exposure_points_charged; contact.exposure_points_charged := 0.00; BusinessUnit.version += 1; posture recomputed"

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /compliance/competitor-contacts/{id}/escalation"
        actor: AntitrustCounsel
        preconditions:
          - "contact.status == UNDER_REVIEW"
        side_effects:
          - "CompetitorContact.status := ESCALATED"
          - "CASCADE HOP 1: surcharge_delta := round_half_up(exposure_points_charged * (ESCALATION_SURCHARGE_MULTIPLIER - 1), 2); exposure_points_charged += surcharge_delta; BusinessUnit.exposure_points += surcharge_delta; BusinessUnit.version += 1"
          - "CASCADE HOP 2: BusinessUnit.posture recomputed — may enter FROZEN"
          - "CASCADE HOP 3 (only when hop 2 entered FROZEN): every AssociationParticipation of the unit with status IN {PARTIALLY_APPROVED, ACTIVE} moves to SUSPENDED"
          - "CASCADE HOP 4 (only when hop 3 fired): each newly SUSPENDED participation cancels its future PLANNED MeetingAttendance rows"

  # ----------------------------------------------------------------- Transaction
  - entity: Transaction
    initial_state: DRAFT
    terminal_states: [CLEARED]
    transitions:
      - from: DRAFT
        to: ANALYZED
        trigger: "POST /compliance/hsr-analyses producing filing_required == true"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status IN {DRAFT, ANALYZED, EXEMPT}"
          - "payload.expected_transaction_version == transaction.version"
        side_effects:
          - "any prior HsrAnalysis for this transaction with status == ACTIVE moves to SUPERSEDED"
          - "Transaction.status := ANALYZED; Transaction.version += 1"

      - from: DRAFT
        to: EXEMPT
        trigger: "POST /compliance/hsr-analyses producing filing_required == false"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status IN {DRAFT, ANALYZED, EXEMPT}"
          - "payload.expected_transaction_version == transaction.version"
        side_effects:
          - "any prior HsrAnalysis for this transaction with status == ACTIVE moves to SUPERSEDED"
          - "Transaction.status := EXEMPT; Transaction.version += 1"

      - from: EXEMPT
        to: ANALYZED
        trigger: "POST /compliance/hsr-analyses under a different valuation_variant producing filing_required == true"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status == EXEMPT"
          - "payload.expected_transaction_version == transaction.version"
        side_effects:
          - "prior ACTIVE HsrAnalysis moves to SUPERSEDED; the new analysis becomes ACTIVE"
          - "Transaction.status := ANALYZED; Transaction.version += 1"
        note: "Re-analysis cycle EXEMPT -> ANALYZED -> EXEMPT is permitted; the ACTIVE analysis is always the transaction's operative determination."

      - from: ANALYZED
        to: EXEMPT
        trigger: "POST /compliance/hsr-analyses under a different valuation_variant producing filing_required == false"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status == ANALYZED"
          - "payload.expected_transaction_version == transaction.version"
        side_effects:
          - "prior ACTIVE HsrAnalysis moves to SUPERSEDED; the new analysis becomes ACTIVE"
          - "Transaction.status := EXEMPT; Transaction.version += 1"

      - from: ANALYZED
        to: FILED
        trigger: "POST /compliance/transactions/{id}/filing"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status == ANALYZED"
          - "the transaction's ACTIVE HsrAnalysis has filing_required == true"
        side_effects:
          - "Transaction.status := FILED; filed_at := current logical clock"
          - "waiting_period_end := filed_at + HSR_WAITING_PERIOD_DAYS days"
          - "Transaction.version += 1"

      - from: FILED
        to: CLEARED
        trigger: "POST /compliance/transactions/{id}/clearance"
        actor: AntitrustCounsel
        preconditions:
          - "transaction.status == FILED"
          - "current logical clock >= transaction.waiting_period_end"
        side_effects:
          - "Transaction.status := CLEARED; Transaction.version += 1"

  # --------------------------------------------------------------- ReadinessDrill
  - entity: ReadinessDrill
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /compliance/readiness-drills/{id}/start"
        actor: ComplianceAdmin | AntitrustCounsel
        preconditions:
          - "drill.status == SCHEDULED"
          - "current logical clock >= drill.window_start"
        side_effects:
          - "ReadinessDrill.status := IN_PROGRESS"
          - "the drill continues to occupy [window_start, window_end) on its site"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /compliance/readiness-drills/{id}/completion"
        actor: ComplianceAdmin | AntitrustCounsel
        preconditions:
          - "drill.status == IN_PROGRESS"
        side_effects:
          - "ReadinessDrill.status := COMPLETED; score and gaps_found recorded"
          - "the drill stops occupying its window"
          - "Site.readiness_score recomputed as the mean score over the site's COMPLETED drills, 2dp, round_half_up"

      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /compliance/readiness-drills/{id}/abort"
        actor: ComplianceAdmin | AntitrustCounsel
        preconditions:
          - "drill.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "ReadinessDrill.status := ABORTED; abort_reason recorded"
          - "the drill stops occupying its window, freeing site capacity"

      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /compliance/readiness-drills/{id}/abort"
        actor: ComplianceAdmin | AntitrustCounsel
        preconditions:
          - "drill.status == IN_PROGRESS"
        side_effects:
          - "ReadinessDrill.status := ABORTED; abort_reason recorded"
          - "the drill stops occupying its window, freeing site capacity"

  # ---------------------------------------------------------------- DocumentAudit
  - entity: DocumentAudit
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /compliance/document-audits/{id}/findings"
        actor: AntitrustCounsel
        preconditions:
          - "audit.status == OPEN"
          - "payload.violation_count <= audit.sample_size"
        side_effects:
          - "DocumentAudit.status := COMPLETED; violation_count and high_risk_phrase_count recorded"
          - "guideline_score := calculations.document_guideline_score"
          - "BusinessUnit.document_violation_count recomputed as the sum over the unit's COMPLETED audits; BusinessUnit.version += 1"

  # ----------------------------------------------------------- LeniencyApplication
  # PARALLEL STATE DIMENSIONS on one row. `marker_status` (the race-to-the-door
  # queue position with the agency) and `disclosure_status` (the substantive
  # evidence package) advance independently; neither dimension's transitions
  # consume or block the other's. The two dimensions are joined exactly once,
  # at PERFECTED. State names below are prefixed by dimension for readability;
  # the persisted values are the bare enum members declared in §1.1.
  - entity: LeniencyApplication
    initial_state: "MARKER_NONE x DISCLOSURE_DRAFT"
    terminal_states: [MARKER_DENIED, MARKER_EXPIRED, PERFECTED, DISCLOSURE_REJECTED, DISCLOSURE_WITHDRAWN]
    transitions:
      - from: MARKER_NONE
        to: MARKER_REQUESTED
        trigger: "POST /compliance/leniency-applications/{id}/marker-request"
        actor: AntitrustCounsel
        dimension: marker_status
        preconditions:
          - "application.marker_status == NONE"
          - "the applicant BusinessUnit's ACTIVE RiskAssessment exists and its risk_band IN {HIGH, SEVERE}"
          - "no other LeniencyApplication of the same BusinessUnit with the same cartel_code has marker_status IN {MARKER_REQUESTED, MARKER_GRANTED, PERFECTED}"
        side_effects:
          - "LeniencyApplication.marker_status := MARKER_REQUESTED; marker_requested_at := current logical clock"
          - "CASCADE HOP 1: BusinessUnit.posture recomputed — an outstanding marker forces FROZEN; BusinessUnit.version += 1"
          - "CASCADE HOP 2: on entering FROZEN, the unit's PARTIALLY_APPROVED and ACTIVE participations move to SUSPENDED"
          - "CASCADE HOP 3: each newly SUSPENDED participation cancels its future PLANNED attendances"
        note: "disclosure_status is untouched by this transition — the two dimensions are independent."

      - from: MARKER_REQUESTED
        to: MARKER_GRANTED
        trigger: "POST /compliance/leniency-applications/{id}/marker-decisions with decision == GRANTED"
        actor: ComplianceAdmin
        dimension: marker_status
        preconditions:
          - "application.marker_status == MARKER_REQUESTED"
        side_effects:
          - "LeniencyApplication.marker_status := MARKER_GRANTED; marker_granted_at := current logical clock"
          - "priority_rank := calculations.leniency_priority_rank"
          - "estimated_penalty_cents recomputed when gravity_pct is not null (calculations.leniency_penalty_estimate)"

      - from: MARKER_REQUESTED
        to: MARKER_DENIED
        trigger: "POST /compliance/leniency-applications/{id}/marker-decisions with decision == DENIED"
        actor: ComplianceAdmin
        dimension: marker_status
        preconditions:
          - "application.marker_status == MARKER_REQUESTED"
        side_effects:
          - "LeniencyApplication.marker_status := MARKER_DENIED; priority_rank := null"
          - "BusinessUnit.posture recomputed — the marker no longer forces FROZEN; BusinessUnit.version += 1"

      - from: MARKER_GRANTED
        to: MARKER_EXPIRED
        trigger: "system — lazy evaluation at the start of any request that reads or validates this application"
        actor: system
        dimension: marker_status
        preconditions:
          - "application.marker_status == MARKER_GRANTED"
          - "application.disclosure_status == DRAFT"
          - "current logical clock >= marker_granted_at + MARKER_VALIDITY_DAYS days"
        side_effects:
          - "LeniencyApplication.marker_status := MARKER_EXPIRED; priority_rank := null; estimated_penalty_cents recomputed with leniency_reduction_pct = 0"
          - "BusinessUnit.posture recomputed; BusinessUnit.version += 1"

      - from: MARKER_GRANTED
        to: PERFECTED
        trigger: "system — automatic join fired the instant disclosure_status becomes ACCEPTED"
        actor: system
        dimension: marker_status
        preconditions:
          - "application.marker_status == MARKER_GRANTED"
          - "application.disclosure_status just became ACCEPTED"
        side_effects:
          - "LeniencyApplication.marker_status := PERFECTED"
          - "priority_rank retained; estimated_penalty_cents retained"
        note: "The ONLY point at which the two dimensions interact."

      - from: DISCLOSURE_DRAFT
        to: DISCLOSURE_SUBMITTED
        trigger: "POST /compliance/leniency-applications/{id}/disclosure-submission"
        actor: AntitrustCounsel
        dimension: disclosure_status
        preconditions:
          - "application.disclosure_status == DRAFT"
          - "application.marker_status IN {MARKER_REQUESTED, MARKER_GRANTED}"
          - "payload.gravity_pct is a number in 0..30"
        side_effects:
          - "LeniencyApplication.disclosure_status := SUBMITTED; gravity_pct := payload.gravity_pct"
          - "estimated_penalty_cents := calculations.leniency_penalty_estimate"
        note: "marker_status is untouched — a disclosure may be submitted while the marker is still merely REQUESTED."

      - from: DISCLOSURE_SUBMITTED
        to: DISCLOSURE_ACCEPTED
        trigger: "POST /compliance/leniency-applications/{id}/disclosure-decision with decision == ACCEPTED"
        actor: ComplianceAdmin
        dimension: disclosure_status
        preconditions:
          - "application.disclosure_status == SUBMITTED"
        side_effects:
          - "LeniencyApplication.disclosure_status := ACCEPTED"
          - "JOIN: when marker_status == MARKER_GRANTED it advances to PERFECTED in the same request"
          - "estimated_penalty_cents recomputed"

      - from: DISCLOSURE_SUBMITTED
        to: DISCLOSURE_REJECTED
        trigger: "POST /compliance/leniency-applications/{id}/disclosure-decision with decision == REJECTED"
        actor: ComplianceAdmin
        dimension: disclosure_status
        preconditions:
          - "application.disclosure_status == SUBMITTED"
        side_effects:
          - "LeniencyApplication.disclosure_status := REJECTED"
          - "marker_status is untouched — a rejected disclosure does not surrender the marker"
          - "estimated_penalty_cents recomputed"

      - from: DISCLOSURE_DRAFT
        to: DISCLOSURE_WITHDRAWN
        trigger: "POST /compliance/leniency-applications/{id}/withdrawal"
        actor: AntitrustCounsel
        dimension: disclosure_status
        preconditions:
          - "application.disclosure_status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "LeniencyApplication.disclosure_status := WITHDRAWN; withdrawal_reason recorded"
          - "marker_status, when IN {MARKER_REQUESTED, MARKER_GRANTED}, is set to MARKER_DENIED in the same request — withdrawing surrenders the queue position"
          - "priority_rank := null; BusinessUnit.posture recomputed; BusinessUnit.version += 1"

      - from: DISCLOSURE_SUBMITTED
        to: DISCLOSURE_WITHDRAWN
        trigger: "POST /compliance/leniency-applications/{id}/withdrawal"
        actor: AntitrustCounsel
        dimension: disclosure_status
        preconditions:
          - "application.disclosure_status == SUBMITTED"
        side_effects:
          - "LeniencyApplication.disclosure_status := WITHDRAWN; withdrawal_reason recorded"
          - "marker_status, when IN {MARKER_REQUESTED, MARKER_GRANTED}, is set to MARKER_DENIED; priority_rank := null"
          - "BusinessUnit.posture recomputed; BusinessUnit.version += 1"

  # ---------------------------------------------------------------- RiskAssessment
  - entity: RiskAssessment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /compliance/risk-assessments creating a newer assessment for the same business unit"
        actor: AntitrustCounsel
        preconditions:
          - "assessment.status == ACTIVE"
          - "a new assessment for the same business_unit_id is being created and its OCC check passed"
        side_effects:
          - "RiskAssessment.status := SUPERSEDED"
          - "BusinessUnit.risk_band := the NEW assessment's risk_band; BusinessUnit.version += 1; posture recomputed"

  # ------------------------------------------------------------------ HsrAnalysis
  - entity: HsrAnalysis
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /compliance/hsr-analyses creating a newer analysis for the same transaction"
        actor: AntitrustCounsel
        preconditions:
          - "analysis.status == ACTIVE"
          - "a new analysis for the same transaction_id is being created and its OCC check passed"
        side_effects:
          - "HsrAnalysis.status := SUPERSEDED"
          - "Transaction.status re-derived from the NEW analysis's filing_required; Transaction.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
# write-write conflict mechanism in this scaffold)
# =============================================================================
concurrency_rules:
  - rule_id: risk-assessment-create-stale-business-unit
    parent_entity: BusinessUnit
    write_endpoint: "POST /compliance/risk-assessments"
    occ_field: "expected_business_unit_version"
    description: |
      Creating a RiskAssessment for a BusinessUnit whose version has advanced
      since the client last observed it is rejected. A new assessment
      legitimately supersedes the unit's prior ACTIVE assessment and rewrites
      BusinessUnit.risk_band, so an author working from a stale view of the
      unit would silently overwrite an assessment they never saw — and would
      score the unit against exposure and incident counts that have since moved.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hsr-analysis-create-stale-transaction
    parent_entity: Transaction
    write_endpoint: "POST /compliance/hsr-analyses"
    occ_field: "expected_transaction_version"
    description: |
      Creating an HsrAnalysis against a Transaction whose version has advanced
      since the client last observed it is rejected. Each analysis supersedes
      the transaction's prior ACTIVE analysis and re-derives Transaction.status
      (ANALYZED vs EXEMPT), so an author holding a stale view would replace a
      determination they never read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ------------------------------------------------------------------------ 1
  - name: market_risk_index
    trigger: "POST /compliance/risk-assessments — evaluated once, at assessment creation, and frozen onto the RiskAssessment row"
    algorithm: weighted_scoring
    formula: |
      # --- structural components (identical under both variants) ---
      share_component =
          10  if business_unit.market_share_bps < 1500
          25  if 1500 <= business_unit.market_share_bps < 3000
          45  if 3000 <= business_unit.market_share_bps < 5000
          70  if business_unit.market_share_bps >= 5000
      interaction_component = min(INTERACTION_COMPONENT_CAP,
                                  business_unit.interaction_point_count * INTERACTION_POINT_WEIGHT)
      overlap_component = round_half_up(business_unit.competitor_overlap_pct * OVERLAP_WEIGHT, 2)
      base = share_component + interaction_component + overlap_component

      # --- variant-specific incident load ---
      if variant == BASELINE:
          escalated_contact_count   = 0   # not consulted
          flagged_attendance_count  = 0   # not consulted
          document_violation_count  = 0   # not consulted
          incident_load = 0
      if variant == INCIDENT_ADJUSTED:
          escalated_contact_count  = count(CompetitorContact
                                           WHERE business_unit_id == this unit
                                             AND status == ESCALATED)
          flagged_attendance_count = count(MeetingAttendance
                                           WHERE status == FLAGGED
                                             AND participation.business_unit_id == this unit)
          document_violation_count = sum(DocumentAudit.violation_count
                                         WHERE business_unit_id == this unit
                                           AND status == COMPLETED)
          incident_load = min(INCIDENT_LOAD_CAP,
                              ESCALATED_CONTACT_WEIGHT * escalated_contact_count
                            + FLAGGED_ATTENDANCE_WEIGHT * flagged_attendance_count
                            + DOCUMENT_VIOLATION_WEIGHT * document_violation_count)

      market_risk_index = min(100.00, round_half_up(base + incident_load, 2))

      risk_band =
          LOW      if market_risk_index < 25
          MODERATE if 25 <= market_risk_index < 50
          HIGH     if 50 <= market_risk_index < 75
          SEVERE   if market_risk_index >= 75
    input_set: |
      Structural inputs are read live from the BusinessUnit row. Incident counts
      (INCIDENT_ADJUSTED only) are counted at assessment creation with the status
      filters shown above, over the whole history of the unit — there is no time
      window and no tie-break, because the result is a count, not an ordering.
      CLEARED, LOGGED, UNDER_REVIEW and REMEDIATION_REQUIRED contacts are excluded;
      only ESCALATED counts. OPEN document audits are excluded.
    constants:
      INTERACTION_POINT_WEIGHT: 3
      INTERACTION_COMPONENT_CAP: 30
      OVERLAP_WEIGHT: 0.20
      ESCALATED_CONTACT_WEIGHT: 5
      FLAGGED_ATTENDANCE_WEIGHT: 3
      DOCUMENT_VIOLATION_WEIGHT: 2
      INCIDENT_LOAD_CAP: 25
    precision: "2 decimal places, round_half_up; band boundaries are inclusive at the lower edge (>= 25, >= 50, >= 75) and exclusive at the upper edge"
    variants:
      - name: BASELINE
        when: "variant == BASELINE — the structural, position-only view used for periodic programme reporting"
        difference: "incident_load is forced to 0 and the three incident counters are stored as 0; the index is the structural base alone"
      - name: INCIDENT_ADJUSTED
        when: "variant == INCIDENT_ADJUSTED — the view used to justify a leniency marker request"
        difference: "adds the capped incident_load on top of the identical structural base, so the same BusinessUnit row can carry two different indexes and two different risk_bands depending only on which variant was requested"

  # ------------------------------------------------------------------------ 2
  - name: hsr_size_of_transaction
    trigger: "POST /compliance/hsr-analyses — evaluated once at analysis creation and frozen onto the HsrAnalysis row"
    algorithm: threshold
    formula: |
      if valuation_variant == SIGNED_DEAL:
          size_of_transaction_cents = transaction.deal_value_cents
                                    + transaction.assumed_liabilities_cents
      if valuation_variant == MARKET_VALUE:
          size_of_transaction_cents = transaction.market_valuation_cents
                                    + transaction.assumed_liabilities_cents

      # Determination ladder — evaluated strictly top to bottom, first match wins.
      # 1. exemption
      if transaction.exemption_code != NONE:
          determination = EXEMPT ; filing_required = false
      # 2. below the size-of-transaction threshold (STRICTLY below)
      elif size_of_transaction_cents < HSR_SIZE_OF_TRANSACTION_THRESHOLD_CENTS:
          determination = BELOW_THRESHOLD ; filing_required = false
      # 3. at or above the upper threshold: size-of-person test is NOT applied
      elif size_of_transaction_cents >= HSR_SIZE_OF_TRANSACTION_UPPER_CENTS:
          determination = FILING_REQUIRED ; filing_required = true
      # 4. in the band [threshold, upper): the size-of-person test decides
      else:
          large = max(transaction.acquirer_total_assets_cents,
                      transaction.target_total_assets_cents)
          small = min(transaction.acquirer_total_assets_cents,
                      transaction.target_total_assets_cents)
          if large >= HSR_SIZE_OF_PERSON_LARGE_CENTS and small >= HSR_SIZE_OF_PERSON_SMALL_CENTS:
              determination = FILING_REQUIRED ; filing_required = true
          else:
              determination = SIZE_OF_PERSON_NOT_MET ; filing_required = false
    input_set: "Only the Transaction row named by transaction_id. No other transaction, and no prior HsrAnalysis, participates."
    constants:
      HSR_SIZE_OF_TRANSACTION_THRESHOLD_CENTS: 12000000000
      HSR_SIZE_OF_TRANSACTION_UPPER_CENTS: 48000000000
      HSR_SIZE_OF_PERSON_LARGE_CENTS: 48000000000
      HSR_SIZE_OF_PERSON_SMALL_CENTS: 4800000000
      HSR_WAITING_PERIOD_DAYS: 30
    precision: "integer cents; no rounding occurs. Threshold comparisons are >= at step 3 and step 4, and strictly < at step 2, so a size exactly equal to HSR_SIZE_OF_TRANSACTION_THRESHOLD_CENTS is NOT below threshold and falls through to the size-of-person test."
    variants:
      - name: SIGNED_DEAL
        when: "valuation_variant == SIGNED_DEAL — valuation from the four corners of the signed agreement"
        difference: "uses deal_value_cents as the consideration term"
      - name: MARKET_VALUE
        when: "valuation_variant == MARKET_VALUE — valuation from the independently determined market value of what is acquired"
        difference: "uses market_valuation_cents instead of deal_value_cents; for the same Transaction row the two variants can land on opposite sides of HSR_SIZE_OF_TRANSACTION_THRESHOLD_CENTS and therefore drive the Transaction into EXEMPT under one variant and ANALYZED under the other"

  # ------------------------------------------------------------------------ 3
  - name: contact_exposure_points
    trigger: "POST /compliance/competitor-contacts — evaluated once at log time; the band multiplier is frozen onto CompetitorContact.band_multiplier_applied"
    algorithm: weighted_scoring
    formula: |
      channel_points = CHANNEL_POINTS[contact.contact_channel]
      tag_points     = min(TAG_POINTS_CAP,
                           sum(TAG_POINTS[t] for t in contact.topic_tags))   # empty array -> 0
      role_points    = ROLE_POINTS[employee.role_category]
      raw = CONTACT_BASE_POINTS
          + (PRICING_TOPIC_POINTS if contact.pricing_topic else 0)
          + channel_points
          + tag_points
          + role_points
      capped_raw = min(RAW_POINTS_CAP, raw)
      band_multiplier_applied = BAND_MULTIPLIER[business_unit.risk_band]
      exposure_points_charged = round_half_up(capped_raw * band_multiplier_applied, 2)
    input_set: |
      business_unit.risk_band is read from the BusinessUnit row at log time, which
      itself mirrors the unit's single ACTIVE RiskAssessment (LOW when the unit has
      no ACTIVE RiskAssessment). The multiplier is frozen at log time: a later
      RiskAssessment never retro-prices an already-logged contact.
    constants:
      CONTACT_BASE_POINTS: 4
      PRICING_TOPIC_POINTS: 6
      RAW_POINTS_CAP: 20
      TAG_POINTS_CAP: 5
      CHANNEL_POINTS: { IN_PERSON_UNSTRUCTURED: 3, TRADE_SHOW: 2, PHONE: 1, EMAIL: 1, WRITTEN_FORMAL: 0 }
      TAG_POINTS: { CAPACITY: 2, BID: 2, CUSTOMER_ALLOCATION: 3, TERRITORY: 3, STANDARDS: 0, BENCHMARKING: 1 }
      ROLE_POINTS: { SALES: 2, PRICING: 3, LEGAL: 0, OTHER: 1 }
      BAND_MULTIPLIER: { LOW: 1.0, MODERATE: 1.25, HIGH: 1.5, SEVERE: 2.0 }
      ESCALATION_SURCHARGE_MULTIPLIER: 2.0
    precision: "2 decimal places, round_half_up. The RAW_POINTS_CAP is applied to the summed raw score BEFORE the band multiplier — never after."

  # ------------------------------------------------------------------------ 4
  - name: business_unit_exposure_ledger
    trigger: "Recomputed at the end of every request that logs, clears or escalates a CompetitorContact, reviews meeting minutes, or records an exposure adjustment"
    algorithm: aggregation
    formula: |
      exposure_points = round_half_up(
            sum(CompetitorContact.exposure_points_charged
                WHERE business_unit_id == this unit
                  AND status IN {LOGGED, UNDER_REVIEW, REMEDIATION_REQUIRED, ESCALATED})
          + sum(MeetingAttendance.exposure_points_assessed
                WHERE participation.business_unit_id == this unit
                  AND status IN {MINUTES_REVIEWED, FLAGGED})
          + business_unit.manual_exposure_adjustment_points
          , 2)
      exposure_points = max(0.00, exposure_points)
    input_set: |
      CLEARED contacts are excluded — clearing a contact zeroes its
      exposure_points_charged, so it drops out of the sum both ways.
      PLANNED / ATTENDED / MINUTES_SUBMITTED / CANCELLED attendances contribute 0
      because exposure_points_assessed is only written by a minutes review.
      manual_exposure_adjustment_points is the running sum of every accepted
      points_delta, so the identity closes exactly with no drift.
    constants:
      RESTRICTED_EXPOSURE_THRESHOLD: 40
      FROZEN_EXPOSURE_THRESHOLD: 80
    precision: "2 decimal places, round_half_up, floored at 0.00"

  # ------------------------------------------------------------------------ 5
  - name: business_unit_posture
    trigger: "Recomputed at the end of every request that changes exposure_points, risk_band, or any LeniencyApplication.marker_status of this unit"
    algorithm: threshold
    formula: |
      # Strict precedence — first matching clause wins; the clauses are NOT
      # re-evaluated after a match.
      if business_unit.exposure_points >= FROZEN_EXPOSURE_THRESHOLD
         or exists LeniencyApplication
              WHERE business_unit_id == this unit
                AND marker_status IN {MARKER_REQUESTED, MARKER_GRANTED, PERFECTED}:
          posture = FROZEN
      elif business_unit.exposure_points >= RESTRICTED_EXPOSURE_THRESHOLD
           or business_unit.risk_band IN {HIGH, SEVERE}:
          posture = RESTRICTED
      else:
          posture = OPEN
    input_set: "The unit's own exposure_points and risk_band, plus the existence test over its LeniencyApplication rows with the marker statuses listed. MARKER_DENIED and MARKER_EXPIRED applications do not force FROZEN."
    constants:
      RESTRICTED_EXPOSURE_THRESHOLD: 40
      FROZEN_EXPOSURE_THRESHOLD: 80
    precision: "Comparisons are >= on both thresholds: exposure_points of exactly 40.00 is RESTRICTED and exactly 80.00 is FROZEN"

  # ------------------------------------------------------------------------ 6
  - name: participation_review_load_minutes
    trigger: "POST /compliance/participations/{id}/legal-clearance with decision == CLEARED — evaluated once and frozen onto AssociationParticipation.review_load_minutes"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 — base load, from the association's scrutiny tier and how densely
      #          the membership is populated by direct competitors.
      base_minutes = REVIEW_BASE_MINUTES
                   + TIER_MINUTES[association.approval_tier]
                   + DENSITY_STEP_MINUTES * ceil(association.competitor_density_pct / DENSITY_STEP_PCT)

      # STEP 2 — escalation surcharge. The surcharge tier is keyed on
      #          base_minutes ONLY. This is the pinned evaluation order.
      escalation_minutes =
            0  if base_minutes < 60
           15  if 60 <= base_minutes < 100
           30  if base_minutes >= 100

      # STEP 3 — total.
      review_load_minutes = base_minutes + escalation_minutes
    input_set: |
      Only the TradeAssociation row named by the participation. No other
      participation, meeting, or attendance participates.
    constants:
      REVIEW_BASE_MINUTES: 30
      TIER_MINUTES: { TIER_1_LOW: 0, TIER_2_MEDIUM: 20, TIER_3_HIGH: 45 }
      DENSITY_STEP_MINUTES: 5
      DENSITY_STEP_PCT: 25
    precision: |
      Integer minutes; ceil() is applied to the density ratio, so a density of 0
      contributes exactly 0 steps, a density in (0, 25] contributes 1 step, and a
      density of exactly 25 contributes 1 step (not 2).

      EVALUATION ORDER IS PINNED AND NON-CIRCULAR. The surcharge tier reads
      base_minutes, NEVER review_load_minutes. The circular reading — "the tier is
      keyed on the total, so iterate until the total stops moving" — is FORBIDDEN
      and produces different numbers. Worked contrast: for TIER_3_HIGH with
      competitor_density_pct == 100 the base is 30 + 45 + 5*4 = 95; the pinned
      order selects tier(95) = 15 and yields review_load_minutes == 110, whereas
      the fixed-point reading re-selects tier(110) = 30 and converges on 125.
      Implementations MUST produce 110.

  # ------------------------------------------------------------------------ 7
  - name: minutes_review_exposure_points
    trigger: "POST /compliance/meeting-attendances/{id}/minutes-review — evaluated once at review time"
    algorithm: weighted_scoring
    formula: |
      finding_points = min(FINDING_POINTS_CAP,
                           sum(FINDING_POINTS[f] for f in payload.findings))
      exposure_points_assessed = round_half_up(
          (VERDICT_POINTS[payload.verdict] + finding_points)
          * BAND_MULTIPLIER[business_unit.risk_band], 2)
    input_set: "business_unit.risk_band is read at review time from the participation's BusinessUnit row (LOW when the unit has no ACTIVE RiskAssessment)."
    constants:
      VERDICT_POINTS: { CLEAN: 0, CONCERN: 5, VIOLATION: 12 }
      FINDING_POINTS: { PRICING_DISCUSSION: 8, CAPACITY_DISCUSSION: 6, CUSTOMER_ALLOCATION: 10, BID_COORDINATION: 10, MARKET_DATA_AGGREGATE: 1, NONE: 0 }
      FINDING_POINTS_CAP: 15
      BAND_MULTIPLIER: { LOW: 1.0, MODERATE: 1.25, HIGH: 1.5, SEVERE: 2.0 }
    precision: "2 decimal places, round_half_up. The cap applies to the findings sum only — the verdict points are added AFTER the cap, never before."

  # ------------------------------------------------------------------------ 8
  - name: leniency_priority_rank
    trigger: "Evaluated when a LeniencyApplication's marker_status becomes MARKER_GRANTED, and whenever estimated_penalty_cents is recomputed"
    algorithm: chronological
    formula: |
      candidates = LeniencyApplication
                   WHERE cartel_code == this.cartel_code
                     AND marker_status IN {MARKER_GRANTED, PERFECTED}
      ordered    = sort(candidates, key = (marker_granted_at ASC, created_at ASC))
      priority_rank = 1-based position of this application in `ordered`
      # empty-candidate fallback: an application whose own marker_status is not
      # MARKER_GRANTED or PERFECTED is not a candidate, so priority_rank = null.
    input_set: |
      Eligibility filter: same cartel_code, marker_status IN {MARKER_GRANTED, PERFECTED}.
      The set spans ALL business units — the leniency queue is a race across the
      whole cartel, not within one unit. Ranking expression: marker_granted_at ASC.
      Tie-break when two grants share the same logical-clock instant: created_at ASC.
      Fallback when this application is not a candidate: priority_rank = null.
      MARKER_DENIED and MARKER_EXPIRED applications leave the queue entirely and
      the remaining applications keep their existing ranks — ranks are NOT
      renumbered when a holder drops out.
    constants:
      MARKER_VALIDITY_DAYS: 30
    precision: "Integer rank starting at 1; null when not a candidate"

  # ------------------------------------------------------------------------ 9
  - name: leniency_penalty_estimate
    trigger: "POST /compliance/leniency-applications/{id}/disclosure-submission, and again on any marker-decision or disclosure-decision transition once gravity_pct is not null"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — ROUND PER YEAR. Each affected year is rounded to whole cents on
      #          its own, in year ASC order.
      for each y in sort(application.affected_years, key = year ASC):
          year_penalty_cents[y] = round_half_up(y.affected_commerce_cents * gravity_pct / 100)

      # STEP 2 — THEN SUM the already-rounded per-year figures.
      base_penalty_cents = sum(year_penalty_cents)

      # STEP 3 — duration uplift.
      duration_multiplier = min(DURATION_MULTIPLIER_CAP,
                                1 + DURATION_STEP * (count(application.affected_years) - 1))

      # STEP 4 — leniency reduction, keyed on the queue position.
      leniency_reduction_pct = REDUCTION_BY_RANK[priority_rank]   # 0 when rank is null or > 3

      # STEP 5 — single final rounding.
      estimated_penalty_cents = round_half_up(
          base_penalty_cents * duration_multiplier * (100 - leniency_reduction_pct) / 100)
    input_set: |
      Only this application's own affected_years array and gravity_pct, plus its
      priority_rank from calculations.leniency_priority_rank. Other applications
      enter only through the rank.
    constants:
      DURATION_STEP: 0.10
      DURATION_MULTIPLIER_CAP: 2.00
      REDUCTION_BY_RANK: { 1: 100, 2: 50, 3: 30 }
    precision: |
      Integer cents throughout, round_half_up.

      ROUNDING ORDER IS PINNED: round each year first, THEN sum (Step 1 before
      Step 2). The alternative reading — sum affected_commerce_cents across years
      first and round the product once — is FORBIDDEN and yields a different
      figure whenever the per-year products carry fractional cents. Worked
      example: affected_commerce_cents [1000000010, 2000000030, 3000000050] at
      gravity_pct 15 gives per-year [150000002, 300000005, 450000008] summing to
      900000015 under the pinned order, versus 900000014 under the forbidden
      sum-then-round order.

  # ----------------------------------------------------------------------- 10
  - name: attendee_occupancy_interval
    trigger: "POST /compliance/meeting-attendances — overlap detection before the attendance is created"
    algorithm: interval_merge
    formula: |
      occupied_start = meeting.scheduled_start - COUNSEL_BRIEFING_BUFFER_MINUTES minutes
      occupied_end   = meeting.scheduled_end

      # CLOSED interval on BOTH edges: [occupied_start, occupied_end].
      # Two attendances of the SAME delegate conflict when
      #     candidate.occupied_start <= existing.occupied_end
      # AND existing.occupied_start  <= candidate.occupied_end
      # Touching endpoints DO conflict: an existing interval ending at exactly T
      # collides with a candidate whose interval starts at exactly T.
    input_set: |
      Occupying rows are the MeetingAttendance rows whose
      participation.employee_id equals the candidate's delegate and whose status
      IN {PLANNED, ATTENDED, MINUTES_SUBMITTED, MINUTES_REVIEWED, FLAGGED}.
      CANCELLED attendances never occupy. The delegate — not the meeting, not the
      association, not the business unit — is the contended resource.
    constants:
      COUNSEL_BRIEFING_BUFFER_MINUTES: 60
    precision: "Minute resolution, closed-closed interval arithmetic; capacity is exactly 1 delegate-instant"

  # ----------------------------------------------------------------------- 11
  - name: site_drill_capacity_check
    trigger: "POST /compliance/readiness-drills — capacity check before the drill is created"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval [window_start, window_end) with AGGREGATE capacity.
      # Adjacency does NOT conflict: an existing drill ending at exactly T and a
      # candidate starting at exactly T may both exist.
      occupying = ReadinessDrill
                  WHERE site_id == candidate.site_id
                    AND status IN {SCHEDULED, IN_PROGRESS}
      # Sweep the candidate's own boundary instants plus every occupying drill's
      # window_start that falls inside the candidate window; at each instant t,
      #     concurrency(t) = 1 + count(d in occupying
      #                                WHERE d.window_start <= t < d.window_end)
      # The drill is refused when max over t of concurrency(t) > site.concurrent_drill_capacity.
    input_set: |
      COMPLETED and ABORTED drills never occupy. The contended resource is the
      Site, and capacity is Site.concurrent_drill_capacity (an aggregate count),
      not a single slot.
    constants:
      MIN_SITE_CAPACITY: 1
    precision: |
      Minute resolution, half-open [start, end) arithmetic — deliberately the
      opposite adjacency convention from calculations.attendee_occupancy_interval,
      which is closed-closed. The same pair of back-to-back windows is a conflict
      for a delegate and legal for a site.

  # ----------------------------------------------------------------------- 12
  - name: employee_training_status
    trigger: "Recomputed at the start of every request that reads or validates an EmployeeProfile, and after every TrainingAssignment transition"
    algorithm: projection
    formula: |
      qualifying = TrainingAssignment
                   WHERE employee_id == this employee
                     AND status == COMPLETED
                     AND curriculum.is_mandatory == true
                     AND employee.role_category IN curriculum.target_role_categories
      # lazy expiry: any qualifying row with current_clock >= expires_at is first
      # transitioned to EXPIRED and thereby leaves the set.
      current = { a in qualifying : current_clock < a.expires_at }
      training_expires_at = max(a.expires_at for a in current)   # null when current is empty
      training_status =
          CURRENT if current is non-empty
          EXPIRED if current is empty AND qualifying-or-expired history is non-empty
          NONE    if the employee has never completed a targeting mandatory curriculum
    input_set: |
      WAIVED assignments never qualify. Non-mandatory curricula never qualify.
      A curriculum whose target_role_categories does not contain the employee's
      role_category never qualifies, even when completed.
    constants: {}
    precision: "Expiry comparison is STRICT: at current_clock exactly equal to expires_at the assignment is already EXPIRED and no longer current"

  # ----------------------------------------------------------------------- 13
  - name: document_guideline_score
    trigger: "POST /compliance/document-audits/{id}/findings"
    algorithm: threshold
    formula: |
      violation_ratio_pct = round_half_up(violation_count * 100 / sample_size, 2)
      guideline_score = max(0.00, round_half_up(
          100 - violation_ratio_pct - HIGH_RISK_PHRASE_PENALTY * high_risk_phrase_count, 2))
    input_set: "Only the audit's own sample_size, violation_count and high_risk_phrase_count."
    constants:
      HIGH_RISK_PHRASE_PENALTY: 2
    precision: "2 decimal places, round_half_up, floored at 0.00. violation_ratio_pct is rounded to 2dp BEFORE being subtracted — never carried at full precision into the final rounding."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing rule determines the response — later failures are never
#      reported, and no side effect of any kind is applied)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body/query schema: every required field present, every enum member declared, numeric ranges respected (market_share_bps 0..10000, competitor_overlap_pct 0..100, gravity_pct 0..30, score 0..100, sample_size > 0, affected_years non-empty), and interval fields well-formed as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: business_constraint
    check: "pagination parameters: limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 5
    category: existence
    check: "every resource named in the URL path exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the order the fields are listed in §1.5 input"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 7
    category: auth
    check: "an entity_backed actor is operating on its own resource: BusinessLead's X-User-ID equals the target business_unit_id (directly, or via participation.business_unit_id / transaction.business_unit_id); Employee's X-User-ID equals the target employee_id (directly, or via assignment.employee_id / participation.employee_id / contact.employee_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all write endpoints acted on by BusinessLead or Employee"

  - priority: 8
    category: state
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /compliance/risk-assessments, POST /compliance/hsr-analyses, POST /compliance/business-units/{id}/exposure-adjustments"

  - priority: 9
    category: auth
    check: "segregation of duties: the acting X-User-ID is not the user recorded as having performed the incompatible prior step — minutes-review vs participation.legal_cleared_by_user_id, and remediation-closure vs attendance.minutes_reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /compliance/meeting-attendances/{id}/minutes-review, POST /compliance/meeting-attendances/{id}/remediation-closure"

  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "BusinessUnit.posture != FROZEN"
    error_id: ERR_BUSINESS_UNIT_FROZEN
    http_status: 409
    applies_to: "POST /compliance/competitor-contacts, POST /compliance/participations, POST /compliance/participations/{id}/submission, POST /compliance/participations/{id}/legal-clearance, POST /compliance/participations/{id}/business-justification, POST /compliance/participations/{id}/reinstatement, POST /compliance/meeting-attendances, POST /compliance/transactions"

  - priority: 12
    category: state
    check: "BusinessUnit.posture != RESTRICTED"
    error_id: ERR_BUSINESS_UNIT_RESTRICTED
    http_status: 409
    applies_to: "POST /compliance/participations"

  - priority: 13
    category: state
    check: "cross-entity state preconditions: attendance creation requires participation.status == ACTIVE; filing requires transaction.status == ANALYZED with an ACTIVE analysis whose filing_required == true; marker-request requires the unit's ACTIVE RiskAssessment.risk_band IN {HIGH, SEVERE}; disclosure-submission requires marker_status IN {MARKER_REQUESTED, MARKER_GRANTED}"
    error_id: "ERR_PARTICIPATION_NOT_ACTIVE | ERR_TRANSACTION_NOT_ANALYZED | ERR_RISK_BAND_TOO_LOW | ERR_MARKER_NOT_GRANTED"
    http_status: 409
    applies_to: "POST /compliance/meeting-attendances, POST /compliance/transactions/{id}/filing, POST /compliance/leniency-applications/{id}/marker-request, POST /compliance/leniency-applications/{id}/disclosure-submission"

  - priority: 14
    category: business_safety
    check: "the employee's training is current: EmployeeProfile.training_status == CURRENT. Conditional — this rule is SKIPPED entirely when employee.role_category NOT IN {SALES, PRICING}."
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /compliance/competitor-contacts, POST /compliance/participations, POST /compliance/participations/{id}/submission, POST /compliance/employees/{id}/clearance-grants"

  - priority: 15
    category: business_safety
    check: "the nominated delegate holds trade-association speaking clearance: EmployeeProfile.clearance_status == GRANTED"
    error_id: ERR_CLEARANCE_NOT_GRANTED
    http_status: 422
    applies_to: "POST /compliance/meeting-attendances"

  - priority: 16
    category: business_referential
    check: "the trade association is approved: TradeAssociation.status == APPROVED"
    error_id: ERR_ASSOCIATION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /compliance/participations, POST /compliance/participations/{id}/submission, POST /compliance/association-meetings"

  - priority: 17
    category: business_referential
    check: "the curriculum targets the employee: employee.role_category IN curriculum.target_role_categories"
    error_id: ERR_CURRICULUM_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/training-assignments"

  - priority: 18
    category: business_constraint
    check: "no other AssociationParticipation with the same (business_unit_id, association_id, employee_id) has status NOT IN {REJECTED, TERMINATED}"
    error_id: ERR_DUPLICATE_PARTICIPATION
    http_status: 409
    applies_to: "POST /compliance/participations"

  - priority: 19
    category: business_constraint
    check: "no other LeniencyApplication of the same business unit and cartel_code has marker_status IN {MARKER_REQUESTED, MARKER_GRANTED, PERFECTED}"
    error_id: ERR_MARKER_ALREADY_HELD
    http_status: 409
    applies_to: "POST /compliance/leniency-applications/{id}/marker-request"

  - priority: 20
    category: business_temporal
    check: "interval well-formedness: scheduled_end strictly after scheduled_start; window_end strictly after window_start"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /compliance/association-meetings, POST /compliance/readiness-drills"

  - priority: 21
    category: business_temporal
    check: "the meeting agenda has been received AND the meeting starts at least AGENDA_LEAD_HOURS (48) hours after the current logical clock"
    error_id: ERR_AGENDA_DEADLINE_MISSED
    http_status: 422
    applies_to: "POST /compliance/meeting-attendances"

  - priority: 22
    category: business_temporal
    check: "the delegate's closed occupancy interval does not intersect any of their other occupying attendances (calculations.attendee_occupancy_interval)"
    error_id: ERR_ATTENDEE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /compliance/meeting-attendances"

  - priority: 23
    category: business_temporal
    check: "adding the candidate drill would not push concurrency above Site.concurrent_drill_capacity at any instant (calculations.site_drill_capacity_check)"
    error_id: ERR_SITE_DRILL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /compliance/readiness-drills"

  - priority: 24
    category: business_temporal
    check: "the HSR waiting period has elapsed: current logical clock >= transaction.waiting_period_end"
    error_id: ERR_WAITING_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /compliance/transactions/{id}/clearance"

  - priority: 25
    category: business_fiscal
    check: "BusinessUnit.review_minutes_consumed + calculations.participation_review_load_minutes <= BusinessUnit.review_minutes_budget"
    error_id: ERR_REVIEW_MINUTES_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance/participations/{id}/legal-clearance"

  - priority: 26
    category: business_fiscal
    check: "BusinessUnit.exposure_points + calculations.contact_exposure_points <= BusinessUnit.exposure_budget_points"
    error_id: ERR_EXPOSURE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance/competitor-contacts"

# =============================================================================
# §1.5 API Endpoint Table   (flat topology — every collection sits directly
#      under the /compliance prefix; ownership travels in request bodies)
# =============================================================================
endpoints:

  # ------------------------------------------------------------ BusinessUnit
  - method: POST
    path: "/compliance/business-units"
    description: "Register a business unit with its market position inputs and its exposure / review budgets"
    roles: [ComplianceAdmin]
    code: 201
    input: [name, market_code, market_share_bps, interaction_point_count, competitor_overlap_pct, "exposure_budget_points?", "review_minutes_budget?"]
    output: BusinessUnit
    side_effects: ["exposure_points := 0", "risk_band := LOW", "posture := OPEN", "version := 1"]

  - method: GET
    path: "/compliance/business-units/{id}"
    description: "Read a business unit including its derived exposure ledger, risk band and posture"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: []

  - method: GET
    path: "/compliance/business-units"
    description: "List business units with pagination and posture/risk filters"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: ["posture?", "risk_band?", "limit?", "offset?"]
    output: "BusinessUnit[]"
    side_effects: []

  - method: POST
    path: "/compliance/business-units/{id}/exposure-adjustments"
    description: "Counsel-recorded manual movement of the unit's exposure ledger (findings carried over from an external investigation, a regulator letter, or a closed matter)"
    roles: [AntitrustCounsel]
    code: 200
    input: [points_delta, reason, expected_business_unit_version]
    output: BusinessUnit
    side_effects:
      - "manual_exposure_adjustment_points += points_delta"
      - "recomputes calculations.business_unit_exposure_ledger and calculations.business_unit_posture"
      - "may fire the FROZEN cascade (participations suspended, future attendances cancelled)"
      - "increments BusinessUnit.version by 1"

  # --------------------------------------------------------- EmployeeProfile
  - method: POST
    path: "/compliance/employees"
    description: "Register an employee against a business unit with their role category"
    roles: [ComplianceAdmin]
    code: 201
    input: [business_unit_id, full_name, email, role_category]
    output: EmployeeProfile
    side_effects: ["clearance_status := NONE", "training_status := NONE"]

  - method: GET
    path: "/compliance/employees/{id}"
    description: "Read an employee including derived training_status and training_expires_at"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: []
    output: EmployeeProfile
    side_effects: ["lazily expires any COMPLETED TrainingAssignment whose expires_at has passed"]

  - method: GET
    path: "/compliance/employees"
    description: "List employees, filterable by owning business unit, role category and clearance status"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: ["business_unit_id?", "role_category?", "clearance_status?", "limit?", "offset?"]
    output: "EmployeeProfile[]"
    side_effects: []

  - method: POST
    path: "/compliance/employees/{id}/clearance-grants"
    description: "Grant (or reinstate) trade-association speaking clearance"
    roles: [AntitrustCounsel]
    code: 200
    input: []
    output: EmployeeProfile
    side_effects: ["clearance_status := GRANTED"]

  - method: POST
    path: "/compliance/employees/{id}/clearance-revocations"
    description: "Revoke trade-association speaking clearance permanently"
    roles: [AntitrustCounsel]
    code: 200
    input: [reason]
    output: EmployeeProfile
    side_effects: ["clearance_status := REVOKED", "existing PLANNED attendances are NOT cancelled and continue to occupy the delegate's intervals"]

  # ------------------------------------------------------- TrainingCurriculum
  - method: POST
    path: "/compliance/training-curricula"
    description: "Define a training curriculum and the role categories it targets"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, title, target_role_categories, duration_minutes, validity_days, "is_mandatory?"]
    output: TrainingCurriculum
    side_effects: []

  - method: GET
    path: "/compliance/training-curricula/{id}"
    description: "Read a curriculum"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: []
    output: TrainingCurriculum
    side_effects: []

  # -------------------------------------------------------- TrainingAssignment
  - method: POST
    path: "/compliance/training-assignments"
    description: "Assign a curriculum to an employee"
    roles: [ComplianceAdmin]
    code: 201
    input: [employee_id, curriculum_id, due_at]
    output: TrainingAssignment
    side_effects: ["status := ASSIGNED"]

  - method: GET
    path: "/compliance/training-assignments/{id}"
    description: "Read a training assignment"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["lazily expires the assignment when the clock has passed expires_at"]

  - method: GET
    path: "/compliance/training-assignments"
    description: "List training assignments, filterable by employee, curriculum and status"
    roles: [ComplianceAdmin, AntitrustCounsel, BusinessLead, Employee]
    code: 200
    input: ["employee_id?", "curriculum_id?", "status?", "limit?", "offset?"]
    output: "TrainingAssignment[]"
    side_effects: []

  - method: POST
    path: "/compliance/training-assignments/{id}/start"
    description: "Employee starts their assigned training"
    roles: [Employee]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["status := IN_PROGRESS", "started_at := current logical clock"]

  - method: POST
    path: "/compliance/training-assignments/{id}/completion"
    description: "Employee completes their assigned training with an assessment score"
    roles: [Employee]
    code: 200
    input: [score]
    output: TrainingAssignment
    side_effects: ["status := COMPLETED", "completed_at := current logical clock", "expires_at := completed_at + curriculum.validity_days days", "recomputes calculations.employee_training_status"]

  - method: POST
    path: "/compliance/training-assignments/{id}/waiver"
    description: "Counsel waives an outstanding training assignment (audit record only — never satisfies the training gate)"
    roles: [AntitrustCounsel]
    code: 200
    input: [reason]
    output: TrainingAssignment
    side_effects: ["status := WAIVED", "waiver_reason recorded"]

  # ---------------------------------------------------------- TradeAssociation
  - method: POST
    path: "/compliance/trade-associations"
    description: "Propose a trade association with its scrutiny tier and competitor density"
    roles: [ComplianceAdmin]
    code: 201
