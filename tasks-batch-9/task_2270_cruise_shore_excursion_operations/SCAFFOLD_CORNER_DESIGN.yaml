              payload: { port_id: "${port_id}", operator_id: "${op_id}", title: "Inverted Age Tour", duration_minutes: 300, min_age: 18, mobility_level: "LEVEL_2", languages: ["EN", "ES"], base_price_cents: 12000, price_tier: "PREMIUM", is_line_operated: false, max_age: 12 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { bad_exc_id: $.data.id }
          assert:
            - "the create call returns HTTP 422"
            - "data.error_id == ERR_INVALID_TIME_WINDOW"
            - "data.error_id is not ERR_VALIDATION"
            - "the excursion list filtered by port_id == ${port_id} returns total_count == 0"

      - name: a_second_port_with_the_same_code_conflicts
        claim_type: violation_to_error
        grounds:
          - validations[10].ERR_DUPLICATE_PORT_CODE
          - errors[ERR_DUPLICATE_PORT_CODE]
          - entities.Port.fields.port_code
