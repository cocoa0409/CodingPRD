            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_b}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 250000, processing_date_balance_cents: 250000 }, as: PlanSponsor, captures: { c_b: $.data.id } }
