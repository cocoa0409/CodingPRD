  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_slot_beats_duplicate_booking
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_TEE_TIME_CLOSED]
          - errors[ERR_DUPLICATE_BOOKING]
        distinguishing_aspect: |
          Category pair (state) ERR_TEE_TIME_CLOSED (priority 6) vs (business_constraint)
          ERR_DUPLICATE_BOOKING (priority 7): a golfer who already holds a CONFIRMED booking
          re-books a now-CLOSED slot; both checks would fire, the lower-priority CLOSED state check wins.
        test_recipe:
          setup:
            - "FOURSOME slot; golfer GA already CONFIRMED on it; then the slot is CLOSED by ProShop."
            - "Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "PriCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-07T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id }
            - call: "POST /golf/tee-times/${tt_id}/close"
              payload: {}
              as: ProShop
              captures: { v_closed: $.data.version }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v_closed}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TEE_TIME_CLOSED"

      - name: not_owner_beats_invalid_state_on_cancel
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_BOOKING_OWNER]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair (business_referential) ERR_NOT_BOOKING_OWNER (priority 4) vs (state)
          ERR_INVALID_STATE (priority 5): a non-owner golfer cancels an already-CANCELLED booking;
          ownership is checked before state so ERR_NOT_BOOKING_OWNER wins — a different category pair
          than the closed-slot/duplicate conflict above.
        test_recipe:
          setup:
            - "FOURSOME slot; GA CONFIRMED then cancels own booking (now CANCELLED). GB is a different golfer."
            - "Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "OwnCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-08T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id }
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${gb}"
              captures: { err: $.data.error_id }
          assert:
