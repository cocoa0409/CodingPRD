      - name: corner_consent_amendment_holds_only_kits_still_dispatched
        claim_type: conditional_cascade
        grounds: "§1.2 consent_status CONSENTED -> AMENDMENT_PENDING side effect is scoped to 'every CollectionKit of this enrollment with status == DISPATCHED'; §1.2 CollectionKit terminal_states [USED, EXPIRED, RETURNED]."
