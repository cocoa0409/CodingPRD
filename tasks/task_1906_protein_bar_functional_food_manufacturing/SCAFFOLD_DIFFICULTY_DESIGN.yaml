  - rule_id: boundary_precision_check
    instances:
      - name: moq_inclusive_boundary
        grounds:
          - validations[priority=37]
          - entities.ManufacturingAgreement.fields.moq_cases_per_run
        distinguishing_aspect: |
          Numeric threshold boundary on the MOQ metric: planned_cases == moq (100) is accepted
          (inclusive >=) while planned_cases == moq - 1 (99) is rejected with ERR_MOQ_SHORTFALL.
        test_recipe:
          setup:
            - "fixture: lots released; revision R1 APPROVED (claims []); line L1; AG3 ACTIVE with moq_cases_per_run == 100"
          setup_api_calls:
