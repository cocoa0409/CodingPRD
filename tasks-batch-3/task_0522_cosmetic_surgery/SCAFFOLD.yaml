# =============================================================================
# PRD-Bench Scaffold — Concierge Cosmetic & Plastic Surgery (cash-pay)
# Difficulty band: Expert
# =============================================================================

scenario: |
  522. Concierge Cosmetic & Plastic Surgery (cash-pay): consultation & quote/package,
  before/after photo & consent, pre-op clearance & scheduling, surgical-fee + facility
  + anesthesia bundle, financing (CareCredit/Cherry), deposit & cancellation, post-op
  visit & revision policy, complication management

domain_name: cosmetic-surgery
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional quote vs finalized invoice; CareCredit vs Cherry practice-net
    - cascading_side_effects        # booking cancel -> deposit forfeiture -> financing void -> quote revert
    - rate_threshold_triggers       # risk-score clearance tiers; cancellation notice-window tiers
    - optimistic_concurrency        # OCC on QuotePackage.version at booking creation
    - derived_field_reconciliation  # QuotePackage.balance_due_cents kept consistent with deposits + financing

  entity_topology: flat
  # Peer entities linked by FK references; Consultation is a light root but Patient,
  # Procedure, QuotePackage, SurgeryBooking, FinancingApplication, ComplicationCase are
  # first-class peers referenced by id, not nested URL ownership.

  state_machine_shape: branching
  # QuotePackage and SurgeryBooking branch (accept/reject, complete/cancel) with
  # divergent side-effect sets; ComplicationCase cycles (OPEN->UNDER_REVIEW->OPEN).

  relationship_patterns:
    - one_to_many          # QuotePackage -> QuoteLineItem; Patient -> Consultation
    - cross_aggregate      # SurgeryBooking references QuotePackage across aggregates

  role_model: peer_roles
  # FrontDeskCoordinator (intake/quote/scheduling), Surgeon (clinical clearance/consent/complication),
  # BillingSpecialist (deposit/financing/refunds), plus opaque PracticeAdmin for catalog + clock.

  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Procedure
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: code, type: string, source: input, description: "Unique catalog code, e.g. RHINO01" }
      - { name: name, type: string, source: input, description: "Human-readable procedure name" }
      - { name: surgical_fee_cents, type: integer, source: input, description: "Surgeon's professional fee in cents; constraints: > 0" }
      - { name: facility_fee_cents, type: integer, source: input, description: "Operating-room/facility fee in cents; constraints: >= 0" }
      - { name: anesthesia_fee_cents, type: integer, source: input, description: "Anesthesia fee in cents; constraints: >= 0" }
      - { name: revision_window_days, type: integer, source: input, default: 90, description: "Days after surgery within which a surgical-origin revision is free; constraints: >= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether procedure can be added to new quotes; set false by retire action" }
      - { name: status, type: enum, source: system, description: "Lifecycle; constraints: one of {ACTIVE, RETIRED}" }

  # ---------------------------------------------------------------------------
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date; used to derive age at clearance time" }
      - { name: age_years, type: integer, source: input, description: "Age in years at intake; used by risk score; constraints: >= 18" }
      - { name: asa_class, type: integer, source: input, default: 1, description: "ASA physical status 1..4; constraints: 1..4" }
      - { name: bmi, type: number, source: input, description: "Body mass index; constraints: > 0" }
      - { name: smoker, type: boolean, source: input, default: false, description: "Current tobacco use flag" }
      - { name: prior_complication_count, type: integer, source: input, default: 0, description: "Prior surgical complications; constraints: >= 0" }
      - { name: surgical_risk_score, type: integer, source: computed, description: "Weighted risk 0..100; see calculations.surgical_risk_score" }
      - { name: clearance_tier, type: enum, source: computed, description: "Derived from surgical_risk_score; one of {NONE, STANDARD, MEDICAL}" }

  # ---------------------------------------------------------------------------
  - name: Consultation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: surgeon_user_id, type: string, source: input, description: "Opaque X-User-ID of the Surgeon who owns this consultation" }
      - { name: chief_complaint, type: string, source: input, description: "Reason for visit / area of interest" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {SCHEDULED, COMPLETED, CONVERTED, CLOSED}" }

  # ---------------------------------------------------------------------------
  - name: QuotePackage
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: consultation_id, type: string, source: input, description: "FK -> Consultation.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the consultation on create" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line-item bundle totals before multi-procedure discount" }
      - { name: discount_pct, type: number, source: computed, description: "Multi-procedure discount fraction selected by line-item count tier" }
      - { name: total_cents, type: integer, source: computed, description: "Quoted grand total after discount; see calculations.quote_total" }
      - { name: required_deposit_cents, type: integer, source: computed, description: "20% of total_cents, round_half_up; see calculations.required_deposit" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Cumulative deposit recorded against this quote" }
      - { name: financed_cents, type: integer, source: system, default: 0, description: "Amount covered by an APPROVED FinancingApplication on this quote" }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_cents - deposit_paid_cents - financed_cents; derived, kept reconciled" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {DRAFT, PRESENTED, ACCEPTED, REJECTED, EXPIRED}" }

  # ---------------------------------------------------------------------------
  - name: QuoteLineItem
    parent: QuotePackage
    common_fields: false   # id + created_at only (append-only line)
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: quote_package_id, type: string, source: system, description: "FK -> QuotePackage.id" }
      - { name: procedure_id, type: string, source: input, description: "FK -> Procedure.id" }
      - { name: surgical_fee_cents, type: integer, source: computed, description: "Snapshot of Procedure.surgical_fee_cents at add time" }
      - { name: facility_fee_cents, type: integer, source: computed, description: "Snapshot of Procedure.facility_fee_cents at add time" }
      - { name: anesthesia_fee_cents, type: integer, source: computed, description: "Snapshot of Procedure.anesthesia_fee_cents at add time" }
      - { name: bundle_total_cents, type: integer, source: computed, description: "surgical + facility + anesthesia snapshot; see calculations.line_bundle" }

  # ---------------------------------------------------------------------------
  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: quote_package_id, type: string, source: input, description: "FK -> QuotePackage.id" }
      - { name: before_photo_ref, type: string, source: input, description: "Storage reference for the before photo" }
      - { name: photo_consent_signed, type: boolean, source: input, description: "Patient authorized clinical/marketing photo use" }
      - { name: surgical_consent_signed, type: boolean, source: input, description: "Patient signed informed surgical consent" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {PENDING, SIGNED, REVOKED}" }

  # ---------------------------------------------------------------------------
  - name: ClearanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: tier_required, type: enum, source: computed, description: "Copied from Patient.clearance_tier at issue time; one of {NONE, STANDARD, MEDICAL}" }
      - { name: tier_provided, type: enum, source: input, description: "Clearance level attached; one of {STANDARD, MEDICAL}" }
      - { name: cleared, type: boolean, source: computed, description: "True when tier_provided satisfies tier_required" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {ISSUED, REVOKED}" }

  # ---------------------------------------------------------------------------
  - name: SurgeryBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: quote_package_id, type: string, source: input, description: "FK -> QuotePackage.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the quote" }
      - { name: surgeon_user_id, type: string, source: input, description: "Opaque X-User-ID of the operating Surgeon; the contended Surgeon resource for turnaround-buffer overlap" }
      - { name: or_room, type: string, source: input, description: "Operating-room resource label, e.g. OR1; the contended OR resource for half-open overlap" }
      - { name: scheduled_start, type: string, source: input, description: "ISO 8601 UTC surgery start" }
      - { name: scheduled_end, type: string, source: input, description: "ISO 8601 UTC surgery end; constraints: > scheduled_start" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, description: "Portion of deposit kept by practice on cancellation; see calculations.cancellation_settlement" }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Portion of deposit returned on cancellation; see calculations.cancellation_settlement" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {SCHEDULED, COMPLETED, CANCELLED}" }

  # ---------------------------------------------------------------------------
  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: quote_package_id, type: string, source: input, description: "FK -> QuotePackage.id" }
      - { name: lender, type: enum, source: input, description: "Financing lender; one of {CARECREDIT, CHERRY}" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the patient wants financed; constraints: > 0" }
      - { name: approved_amount_cents, type: integer, source: system, default: 0, description: "Amount lender approved (set on approve)" }
      - { name: merchant_fee_cents, type: integer, source: computed, description: "Lender discount fee deducted from practice payout; see calculations.practice_net" }
      - { name: practice_net_cents, type: integer, source: computed, description: "approved_amount_cents - merchant_fee_cents" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {SUBMITTED, APPROVED, DECLINED, VOIDED}" }

  # ---------------------------------------------------------------------------
  - name: ComplicationCase
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: surgery_booking_id, type: string, source: input, description: "FK -> SurgeryBooking.id" }
      - { name: line_item_id, type: string, source: input, description: "FK -> QuoteLineItem.id; the affected procedure line whose surgical_fee drives revision charge" }
      - { name: reported_at, type: string, source: system, description: "Logical-clock timestamp when the case was opened" }
      - { name: attribution, type: enum, source: input, description: "Cause; one of {SURGICAL_ORIGIN, PATIENT_FACTOR, UNRELATED}" }
      - { name: within_revision_window, type: boolean, source: computed, description: "reported_at <= booking.scheduled_end + procedure.revision_window_days" }
      - { name: revision_charge_cents, type: integer, source: computed, description: "Patient charge for revision; see calculations.revision_charge" }
      - { name: status, type: enum, source: system, description: "Lifecycle; one of {OPEN, UNDER_REVIEW, REVISION_APPROVED, RESOLVED}" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Consultation
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /consultations/{id}/complete"
        actor: Surgeon
        preconditions:
          - "Consultation.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "acting Surgeon owns this consultation: X-User-ID == Consultation.surgeon_user_id (else ERR_NOT_OWNER)"
        side_effects: []
      - from: COMPLETED
        to: CONVERTED
        trigger: "system (a QuotePackage moves to ACCEPTED for this consultation)"
        actor: system
        preconditions:
          - "a QuotePackage with this consultation_id reached ACCEPTED"
        side_effects: []
      - from: [SCHEDULED, COMPLETED, CONVERTED]
        to: CLOSED
        trigger: "POST /consultations/{id}/close"
        actor: FrontDeskCoordinator
        preconditions:
          - "no QuotePackage on this consultation is in PRESENTED status (else ERR_OPEN_QUOTE_EXISTS)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: QuotePackage
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /quote-packages/{id}/present"
        actor: FrontDeskCoordinator
        preconditions:
          - "QuotePackage.status == DRAFT (else ERR_INVALID_STATE)"
          - "at least one QuoteLineItem exists on the quote (else ERR_EMPTY_QUOTE)"
        side_effects:
          - "freeze subtotal_cents, discount_pct, total_cents, required_deposit_cents at presentation-time values"
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /quote-packages/{id}/accept"
        actor: FrontDeskCoordinator
        preconditions:
          - "QuotePackage.status == PRESENTED (else ERR_INVALID_STATE)"
          - "a ConsentRecord with this quote_package_id is SIGNED with surgical_consent_signed == true (else ERR_CONSENT_MISSING)"
          - "deposit_paid_cents >= required_deposit_cents (else ERR_DEPOSIT_UNPAID)"
        side_effects:
          - "parent Consultation transitions COMPLETED -> CONVERTED (cascade hop 1)"
          - "recompute balance_due_cents"
      - from: PRESENTED
        to: REJECTED
        trigger: "POST /quote-packages/{id}/reject"
        actor: FrontDeskCoordinator
        preconditions:
          - "QuotePackage.status == PRESENTED (else ERR_INVALID_STATE)"
        side_effects:
          - "any SUBMITTED FinancingApplication on this quote -> VOIDED (cascade)"
      - from: [DRAFT, PRESENTED]
        to: EXPIRED
        trigger: "POST /quote-packages/{id}/expire"
        actor: FrontDeskCoordinator
        preconditions:
          - "QuotePackage.status in {DRAFT, PRESENTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "any SUBMITTED FinancingApplication on this quote -> VOIDED (cascade)"

  # ---------------------------------------------------------------------------
  - entity: SurgeryBooking
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /surgery-bookings/{id}/complete"
        actor: Surgeon
        preconditions:
          - "SurgeryBooking.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "current logical clock >= scheduled_start (else ERR_SURGERY_NOT_STARTED)"
        side_effects:
          - "quote-package deposit and financing are consumed; balance_due_cents recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /surgery-bookings/{id}/cancel"
        actor: BillingSpecialist
        preconditions:
          - "SurgeryBooking.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "direct effect: compute deposit_forfeited_cents / deposit_refunded_cents by cancellation notice-window tier (calculations.cancellation_settlement), and set QuotePackage.deposit_paid_cents -= deposit_refunded_cents (the refunded portion leaves the quote ledger)"
          - "TRANSITIVE HOP 1: this SurgeryBooking reaching CANCELLED causes each APPROVED/SUBMITTED FinancingApplication on the quote to transition -> VOIDED"
          - "TRANSITIVE HOP 2 (caused by hop 1): each FinancingApplication VOIDED transition that was previously APPROVED runs its own side effect QuotePackage.financed_cents -= approved_amount_cents"
          - "TRANSITIVE HOP 3 (caused by hop 2): the change to QuotePackage.financed_cents forces recompute of QuotePackage.balance_due_cents = total_cents - deposit_paid_cents - financed_cents"

  # ---------------------------------------------------------------------------
  - entity: FinancingApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [DECLINED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{id}/approve"
        actor: BillingSpecialist
        preconditions:
          - "FinancingApplication.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "parent QuotePackage.status == ACCEPTED (else ERR_QUOTE_NOT_ACCEPTED)"
          - "approved_amount_cents <= QuotePackage.balance_due_cents at approval time (else ERR_FINANCING_EXCEEDS_BALANCE)"
        side_effects:
          - "direct effect: set approved_amount_cents = requested_amount_cents, compute merchant_fee_cents and practice_net_cents (calculations.practice_net)"
          - "TRANSITIVE HOP 1: this FinancingApplication reaching APPROVED sets QuotePackage.financed_cents += approved_amount_cents"
          - "TRANSITIVE HOP 2 (caused by hop 1): the change to QuotePackage.financed_cents forces recompute of QuotePackage.balance_due_cents = total_cents - deposit_paid_cents - financed_cents"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{id}/decline"
        actor: BillingSpecialist
        preconditions:
          - "FinancingApplication.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: [SUBMITTED, APPROVED]
        to: VOIDED
        trigger: "system (parent quote rejected/expired, or booking cancelled)"
        actor: system
        preconditions:
          - "triggering cascade from QuotePackage REJECTED/EXPIRED or SurgeryBooking CANCELLED"
        side_effects:
          - "if was APPROVED: QuotePackage.financed_cents -= approved_amount_cents and recompute balance_due_cents"

  # ---------------------------------------------------------------------------
  - entity: ComplicationCase
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /complication-cases/{id}/review"
        actor: Surgeon
        preconditions:
          - "ComplicationCase.status == OPEN (else ERR_INVALID_STATE)"
          - "parent SurgeryBooking.status == COMPLETED (else ERR_BOOKING_NOT_COMPLETED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /complication-cases/{id}/reopen"
        actor: Surgeon
        preconditions:
          - "ComplicationCase.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "clear provisional attribution decision; case returns to intake (cyclic revision loop)"
      - from: UNDER_REVIEW
        to: REVISION_APPROVED
        trigger: "POST /complication-cases/{id}/approve-revision"
        actor: Surgeon
        preconditions:
          - "ComplicationCase.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "compute within_revision_window and revision_charge_cents (calculations.revision_charge)"
      - from: [OPEN, UNDER_REVIEW, REVISION_APPROVED]
        to: RESOLVED
        trigger: "POST /complication-cases/{id}/resolve"
        actor: Surgeon
        preconditions:
          - "ComplicationCase.status in {OPEN, UNDER_REVIEW, REVISION_APPROVED} (else ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-quote
    parent_entity: QuotePackage
    write_endpoint: "POST /surgery-bookings"
    occ_field: "expected_quote_package_version"
    description: |
      Creating a SurgeryBooking against a QuotePackage whose version has advanced
      since the client last observed it is rejected. A booking pins the quote's
      financial figures at creation; if another writer has already recorded a
      deposit or bound a FinancingApplication (each of which bumps the quote's
      version), the current writer's view of the quote is stale and its booking
      would encode outdated deposit/balance figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_bundle
    trigger: "POST /quote-packages/{id}/line-items (add procedure line)"
    algorithm: aggregation
    formula: |
      # Snapshots taken from the referenced Procedure at add time.
      surgical_fee_cents  = Procedure.surgical_fee_cents
      facility_fee_cents  = Procedure.facility_fee_cents
      anesthesia_fee_cents = Procedure.anesthesia_fee_cents
      bundle_total_cents  = surgical_fee_cents + facility_fee_cents + anesthesia_fee_cents
    input_set: "the single Procedure referenced by this line item, snapshotted at add time"
    precision: "integer cents (no rounding — inputs are integer cents)"

  - name: quote_total
    trigger: "recomputed on every line-item add/remove while QuotePackage.status == DRAFT; frozen at PRESENTED"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum(line.bundle_total_cents for line in QuoteLineItems of this quote)
      n = count(QuoteLineItems of this quote)
      # Multi-procedure discount tier by line-item COUNT:
      if   n >= 3: discount_pct = 0.10
      elif n == 2: discount_pct = 0.05
      else:        discount_pct = 0.00           # n == 1 (a DRAFT with n==0 has subtotal 0)
      # Rounding order pinned: SUM first (integer cents), THEN apply discount to the
      # subtotal, THEN round_half_up to whole cents. Do NOT round per line item.
      total_cents = round_half_up(subtotal_cents * (1 - discount_pct))
    input_set: "all QuoteLineItems belonging to this QuotePackage; discount keyed on their count"
    constants:
      TIER2_PCT: 0.05
      TIER3_PCT: 0.10
    precision: "round_half_up to whole cents, applied once to the discounted subtotal"
    note: "Combinatorial mode (b): rounding-order is pinned (sum-then-discount-then-round)."

  - name: required_deposit
    trigger: "recomputed with quote_total; frozen at PRESENTED"
    algorithm: threshold
    formula: |
      required_deposit_cents = round_half_up(total_cents * DEPOSIT_PCT)
    input_set: "the quote's own total_cents"
    constants:
      DEPOSIT_PCT: 0.20
    precision: "round_half_up to whole cents"

  - name: surgical_risk_score
    trigger: "recomputed on Patient create and on PATCH /patients/{id}"
    algorithm: weighted_scoring
    formula: |
      score  = (asa_class - 1) * 25
      score += 20 if bmi >= 35 else (10 if bmi >= 30 else 0)
      score += 20 if smoker else 0
      score += 15 if age_years >= 65 else (8 if age_years >= 50 else 0)
      score += prior_complication_count * 15
      surgical_risk_score = clamp(score, 0, 100)
      # Derived clearance tier (drives ClearanceRecord.tier_required):
      if   surgical_risk_score >= 70: clearance_tier = MEDICAL
      elif surgical_risk_score >= 40: clearance_tier = STANDARD
      else:                           clearance_tier = NONE
    input_set: "the Patient's own asa_class, bmi, smoker, age_years, prior_complication_count"
    constants:
      ASA_STEP: 25
      BMI30_PENALTY: 10
      BMI35_PENALTY: 20
      SMOKER_PENALTY: 20
      AGE50_PENALTY: 8
      AGE65_PENALTY: 15
      PRIOR_PENALTY: 15
      STANDARD_THRESHOLD: 40
      MEDICAL_THRESHOLD: 70
    precision: "integer points, clamped to [0,100]"
    note: "Combinatorial mode (a): >=3 inputs with non-linear tiered penalties and clamp."

  - name: cancellation_settlement
    trigger: "POST /surgery-bookings/{id}/cancel"
    algorithm: chronological
    formula: |
      days_notice = floor( (scheduled_start - current_logical_clock) / 86400_seconds )
      # Notice-window refund tiers (of the deposit recorded on the quote):
      if   days_notice >= 30: refund_pct = 1.00
      elif days_notice >= 14: refund_pct = 0.50    # >= 14 and < 30
      else:                   refund_pct = 0.00    # < 14
      deposit_refunded_cents = round_half_up(QuotePackage.deposit_paid_cents * refund_pct)
      deposit_forfeited_cents = QuotePackage.deposit_paid_cents - deposit_refunded_cents
    input_set: "QuotePackage.deposit_paid_cents and the notice window between clock and scheduled_start"
    constants:
      FULL_REFUND_DAYS: 30
      HALF_REFUND_DAYS: 14
      HALF_REFUND_PCT: 0.50
    precision: "round_half_up to whole cents; forfeited = paid - refunded (exact complement, no drift)"
    note: "Invariant: deposit_forfeited_cents + deposit_refunded_cents == deposit_paid_cents (conserved)."

  - name: practice_net
    trigger: "POST /financing-applications/{id}/approve"
    algorithm: forward_looking
    formula: |
      approved_amount_cents = requested_amount_cents   # lender approves the requested amount in v1
      if   lender == CHERRY:     merchant_fee_cents = round_half_up(approved_amount_cents * CHERRY_FEE_PCT)
      elif lender == CARECREDIT: merchant_fee_cents = round_half_up(approved_amount_cents * CARECREDIT_FEE_PCT)
      practice_net_cents = approved_amount_cents - merchant_fee_cents
    input_set: "the FinancingApplication's approved_amount_cents and lender"
    constants:
      CHERRY_FEE_PCT: 0.05
      CARECREDIT_FEE_PCT: 0.03
    precision: "round_half_up to whole cents"
    variants:
      - name: cherry_net
        when: "lender == CHERRY"
        difference: "5% merchant discount fee deducted from practice payout"
      - name: carecredit_net
        when: "lender == CARECREDIT"
        difference: "3% merchant discount fee deducted from practice payout"
    note: "Dual-variant: identical approved_amount, two lenders -> different practice_net_cents and merchant_fee_cents."

  - name: revision_charge
    trigger: "POST /complication-cases/{id}/approve-revision"
    algorithm: threshold
    formula: |
      window_days = Procedure.revision_window_days (of the line item's procedure)
      within_revision_window = (case.reported_at <= booking.scheduled_end + window_days*86400_seconds)
      if attribution == SURGICAL_ORIGIN and within_revision_window:
        revision_charge_cents = 0
      else:
        revision_charge_cents = round_half_up(line_item.surgical_fee_cents * REVISION_RATE)
    input_set: "the affected QuoteLineItem's surgical_fee_cents, the case attribution, and the revision window"
    constants:
      REVISION_RATE: 0.50
    precision: "round_half_up to whole cents"
    note: "Dual-variant on a DIFFERENT entity domain than practice_net: free vs half-fee revision on ComplicationCase."

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: "ERR_PROCEDURE_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_CONSULTATION_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_FINANCING_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_LINE_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path or FK references

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: "ERR_INVALID_STATE / ERR_QUOTE_NOT_ACCEPTED / ERR_BOOKING_NOT_COMPLETED / ERR_SURGERY_NOT_STARTED"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: business_referential
    check: "acting Surgeon owns the Consultation / SurgeryBooking they act on (X-User-ID == surgeon_user_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /consultations/{id}/complete, surgeon booking/complication actions"

  - priority: 6
    category: business_constraint
    check: "Procedure referenced by a new QuoteLineItem is ACTIVE (status == ACTIVE)"
    error_id: ERR_PROCEDURE_RETIRED
    http_status: 409
    applies_to: "POST /quote-packages/{id}/line-items"

  - priority: 7
    category: business_constraint
    check: "QuotePackage has at least one QuoteLineItem before it can be PRESENTED"
    error_id: ERR_EMPTY_QUOTE
    http_status: 409
    applies_to: "POST /quote-packages/{id}/present"

  - priority: 8
    category: business_safety
    check: "Booking a surgery requires an ISSUED ClearanceRecord for the patient whose cleared == true (tier_provided satisfies tier_required)"
    error_id: ERR_CLEARANCE_MISSING
    http_status: 409
    applies_to: "POST /surgery-bookings"

  - priority: 9
    category: business_safety
    check: "Accepting a quote requires a SIGNED ConsentRecord with surgical_consent_signed == true"
    error_id: ERR_CONSENT_MISSING
    http_status: 409
    applies_to: "POST /quote-packages/{id}/accept"

  - priority: 10
    category: business_temporal
    check: "OR resource: SurgeryBooking [scheduled_start, scheduled_end) must not overlap an existing SCHEDULED booking in the same or_room. Half-open interval semantics: two intervals conflict iff a.start < b.end AND b.start < a.end; exactly-touching endpoints (a.end == b.start) do NOT conflict."
    error_id: ERR_OR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /surgery-bookings"

  - priority: 11
    category: business_temporal
    check: "Surgeon resource: SurgeryBooking must leave a 60-minute turnaround BUFFER around any existing SCHEDULED booking with the same surgeon_user_id. Buffered-closed semantics: conflict iff a.start < b.end + 60min AND b.start < a.end + 60min; exactly-touching endpoints DO conflict here (buffer > 0), unlike the OR rule."
    error_id: ERR_SURGEON_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /surgery-bookings"

  - priority: 12
    category: business_temporal
    check: "SurgeryBooking scheduled_start must be strictly in the future relative to the current logical clock"
    error_id: ERR_SURGERY_IN_PAST
    http_status: 409
    applies_to: "POST /surgery-bookings"

  - priority: 13
    category: business_fiscal
    check: "Accepting a quote requires deposit_paid_cents >= required_deposit_cents"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 402
    applies_to: "POST /quote-packages/{id}/accept"

  - priority: 14
    category: business_fiscal
    check: "Approved financing amount must not exceed the quote's current balance_due_cents"
    error_id: ERR_FINANCING_EXCEEDS_BALANCE
    http_status: 402
    applies_to: "POST /financing-applications/{id}/approve"

  - priority: 15
    category: state
    check: "OCC: expected_quote_package_version must match the live QuotePackage.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /surgery-bookings"

  - priority: 16
    category: business_constraint
    check: "SurgeryBooking scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /surgery-bookings"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary UTC instant. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced/reset to to_iso8601"]

  # ---- Procedure catalog -----------------------------------------------------
  - method: POST
    path: "/procedures"
    description: "Create a catalog Procedure with its surgical/facility/anesthesia fee bundle"
    roles: [PracticeAdmin]
    code: 201
    input: [code, name, surgical_fee_cents, facility_fee_cents, anesthesia_fee_cents, "revision_window_days?"]
    output: Procedure
    side_effects: ["status=ACTIVE, active=true"]

  - method: GET
    path: "/procedures"
    description: "List procedures"
    roles: [PracticeAdmin, FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/procedures/{id}"
    description: "Get a procedure"
    roles: [PracticeAdmin, FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: POST
    path: "/procedures/{id}/retire"
    description: "Retire a procedure so it can no longer be added to new quotes"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Procedure
    side_effects: ["status=RETIRED, active=false"]

  - method: GET
    path: "/procedures/{id}/line-items"
    description: "List QuoteLineItems that snapshotted this procedure (FK reverse-reachability for QuoteLineItem.procedure_id)"
    roles: [PracticeAdmin, FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuoteLineItem[]"
    side_effects: []

  # ---- Patient ---------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Create a patient; computes surgical_risk_score and clearance_tier"
    roles: [FrontDeskCoordinator, Surgeon]
    code: 201
    input: [full_name, date_of_birth, age_years, bmi, "asa_class?", "smoker?", "prior_complication_count?"]
    output: Patient
    side_effects: ["compute surgical_risk_score and clearance_tier (calculations.surgical_risk_score)"]

  - method: GET
    path: "/patients/{id}"
    description: "Get a patient"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/patients/{id}"
    description: "Update patient clinical fields; recomputes risk score and clearance tier"
    roles: [Surgeon]
    code: 200
    input: ["asa_class?", "bmi?", "smoker?", "age_years?", "prior_complication_count?"]
    output: Patient
    side_effects: ["recompute surgical_risk_score and clearance_tier"]

  - method: POST
    path: "/patients/{id}/clearances"
    description: "Issue a pre-op ClearanceRecord for a patient; captures required tier from the patient and marks cleared if tier_provided satisfies it"
    roles: [Surgeon]
    code: 201
    input: [tier_provided]
    output: ClearanceRecord
    side_effects: ["tier_required=Patient.clearance_tier snapshot, cleared computed, status=ISSUED"]

  - method: GET
    path: "/patients/{id}/clearances"
    description: "List ClearanceRecords for a patient (FK reverse-reachability for ClearanceRecord.patient_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClearanceRecord[]"
    side_effects: []

  - method: GET
    path: "/patients/{id}/consultations"
    description: "List Consultations for a patient (FK reverse-reachability for Consultation.patient_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Consultation[]"
    side_effects: []

  - method: GET
    path: "/patients/{id}/quote-packages"
    description: "List QuotePackages for a patient (FK reverse-reachability for QuotePackage.patient_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuotePackage[]"
    side_effects: []

  - method: GET
    path: "/patients/{id}/surgery-bookings"
    description: "List SurgeryBookings for a patient (FK reverse-reachability for SurgeryBooking.patient_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "SurgeryBooking[]"
    side_effects: []

  # ---- Consultation ----------------------------------------------------------
  - method: POST
    path: "/consultations"
    description: "Open a consultation for a patient with an owning surgeon"
    roles: [FrontDeskCoordinator]
    code: 201
    input: [patient_id, surgeon_user_id, chief_complaint]
    output: Consultation
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/consultations/{id}"
    description: "Get a consultation"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: Consultation
    side_effects: []

  - method: POST
    path: "/consultations/{id}/complete"
    description: "Surgeon marks the consultation completed"
    roles: [Surgeon]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status SCHEDULED -> COMPLETED"]

  - method: POST
    path: "/consultations/{id}/close"
    description: "Close a consultation"
    roles: [FrontDeskCoordinator]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status -> CLOSED"]

  - method: GET
    path: "/consultations/{id}/quote-packages"
    description: "List QuotePackages under a consultation (FK reverse-reachability for QuotePackage.consultation_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuotePackage[]"
    side_effects: []

  # ---- QuotePackage & line items --------------------------------------------
  - method: POST
    path: "/quote-packages"
    description: "Create a DRAFT quote package for a completed consultation"
    roles: [FrontDeskCoordinator]
    code: 201
    input: [consultation_id]
    output: QuotePackage
    side_effects: ["status=DRAFT, patient_id copied from consultation, totals=0, deposit_paid_cents=0, financed_cents=0"]

  - method: GET
    path: "/quote-packages/{id}"
    description: "Get a quote package"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: QuotePackage
    side_effects: []

  - method: POST
    path: "/quote-packages/{id}/line-items"
    description: "Add a procedure line to a DRAFT quote; snapshots fees and recomputes totals"
    roles: [FrontDeskCoordinator]
    code: 201
    input: [procedure_id]
    output: QuoteLineItem
    side_effects:
      - "snapshot fees (calculations.line_bundle)"
      - "recompute subtotal_cents, discount_pct, total_cents, required_deposit_cents, balance_due_cents (calculations.quote_total, required_deposit)"
      - "increments QuotePackage.version by 1"

  - method: GET
    path: "/quote-packages/{id}/line-items"
    description: "List line items of a quote (FK reverse-reachability for QuoteLineItem.quote_package_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuoteLineItem[]"
    side_effects: []

  - method: POST
    path: "/quote-packages/{id}/deposits"
    description: "Record a deposit payment against the quote"
    roles: [BillingSpecialist]
    code: 201
    input: [amount_cents]
    output: QuotePackage
    side_effects:
      - "deposit_paid_cents += amount_cents, recompute balance_due_cents"
      - "increments QuotePackage.version by 1"

  - method: POST
    path: "/quote-packages/{id}/present"
    description: "Freeze pricing and present the quote to the patient"
    roles: [FrontDeskCoordinator]
    code: 200
    input: []
    output: QuotePackage
    side_effects: ["status DRAFT -> PRESENTED, pricing frozen", "increments QuotePackage.version by 1"]

  - method: POST
    path: "/quote-packages/{id}/accept"
    description: "Accept a presented quote (requires signed consent + deposit)"
    roles: [FrontDeskCoordinator]
    code: 200
    input: []
    output: QuotePackage
    side_effects:
      - "status PRESENTED -> ACCEPTED"
      - "parent Consultation COMPLETED -> CONVERTED (cascade)"
      - "recompute balance_due_cents"
      - "increments QuotePackage.version by 1"

  - method: POST
    path: "/quote-packages/{id}/reject"
    description: "Reject a presented quote"
    roles: [FrontDeskCoordinator]
    code: 200
    input: []
    output: QuotePackage
    side_effects: ["status PRESENTED -> REJECTED", "cascade VOID any SUBMITTED FinancingApplication", "increments QuotePackage.version by 1"]

  - method: POST
    path: "/quote-packages/{id}/expire"
    description: "Expire a draft or presented quote"
    roles: [FrontDeskCoordinator]
    code: 200
    input: []
    output: QuotePackage
    side_effects: ["status -> EXPIRED", "cascade VOID any SUBMITTED FinancingApplication", "increments QuotePackage.version by 1"]

  # ---- Consent ---------------------------------------------------------------
  - method: POST
    path: "/quote-packages/{id}/consents"
    description: "Create a ConsentRecord (before photo + consent signatures) for a quote"
    roles: [FrontDeskCoordinator, Surgeon]
    code: 201
    input: [before_photo_ref, photo_consent_signed, surgical_consent_signed]
    output: ConsentRecord
    side_effects: ["status=SIGNED if surgical_consent_signed==true else PENDING"]

  - method: GET
    path: "/quote-packages/{id}/consents"
    description: "List consent records for a quote (FK reverse-reachability for ConsentRecord.quote_package_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []

  - method: POST
    path: "/consents/{id}/revoke"
    description: "Revoke a consent record"
    roles: [Surgeon]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["status -> REVOKED"]

  # ---- SurgeryBooking --------------------------------------------------------
  - method: POST
    path: "/surgery-bookings"
    description: "Schedule surgery for an ACCEPTED quote (OCC on quote version). Requires cleared patient, non-overlapping OR interval, surgeon turnaround buffer, future start."
    roles: [FrontDeskCoordinator]
    code: 201
    input: [quote_package_id, surgeon_user_id, or_room, scheduled_start, scheduled_end, expected_quote_package_version]
    output: SurgeryBooking
    side_effects: ["status=SCHEDULED, patient_id copied from quote", "increments QuotePackage.version by 1"]

  - method: GET
    path: "/surgery-bookings/{id}"
    description: "Get a surgery booking"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: SurgeryBooking
    side_effects: []

  - method: GET
    path: "/surgery-bookings"
    description: "List surgery bookings, optionally filtered by quote (FK reverse-reachability for SurgeryBooking.quote_package_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["quote_package_id?", "patient_id?", "limit?", "offset?"]
    output: "SurgeryBooking[]"
    side_effects: []

  - method: POST
    path: "/surgery-bookings/{id}/complete"
    description: "Surgeon marks surgery completed (must be at/after scheduled_start)"
    roles: [Surgeon]
    code: 200
    input: []
    output: SurgeryBooking
    side_effects: ["status SCHEDULED -> COMPLETED"]

  - method: POST
    path: "/surgery-bookings/{id}/cancel"
    description: "Cancel a scheduled surgery; settles deposit by notice-window tier and cascades financing void + quote reconcile"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: SurgeryBooking
    side_effects:
      - "compute deposit_forfeited_cents / deposit_refunded_cents (calculations.cancellation_settlement)"
      - "QuotePackage.deposit_paid_cents -= deposit_refunded_cents (cascade hop 1)"
      - "VOID APPROVED/SUBMITTED FinancingApplication and QuotePackage.financed_cents -= approved_amount_cents (cascade hop 2)"
      - "recompute QuotePackage.balance_due_cents (cascade hop 3)"

  # ---- FinancingApplication --------------------------------------------------
  - method: POST
    path: "/financing-applications"
    description: "Submit a CareCredit/Cherry financing application against a quote"
    roles: [BillingSpecialist]
    code: 201
    input: [quote_package_id, lender, requested_amount_cents]
    output: FinancingApplication
    side_effects: ["status=SUBMITTED, approved_amount_cents=0"]

  - method: GET
    path: "/financing-applications/{id}"
    description: "Get a financing application"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []

  - method: GET
    path: "/financing-applications"
    description: "List financing applications, optionally filtered by quote (FK reverse-reachability for FinancingApplication.quote_package_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["quote_package_id?", "limit?", "offset?"]
    output: "FinancingApplication[]"
    side_effects: []

  - method: POST
    path: "/financing-applications/{id}/approve"
    description: "Approve financing; computes merchant fee/practice net and adds to quote financed_cents"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: FinancingApplication
    side_effects:
      - "status SUBMITTED -> APPROVED, set approved_amount_cents (calculations.practice_net)"
      - "QuotePackage.financed_cents += approved_amount_cents, recompute balance_due_cents"

  - method: POST
    path: "/financing-applications/{id}/decline"
    description: "Decline a financing application"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["status SUBMITTED -> DECLINED"]

  # ---- ComplicationCase ------------------------------------------------------
  - method: POST
    path: "/complication-cases"
    description: "Open a complication case against a completed surgery booking and an affected line item"
    roles: [Surgeon]
    code: 201
    input: [surgery_booking_id, line_item_id, attribution]
    output: ComplicationCase
    side_effects: ["status=OPEN, reported_at=current logical clock"]

  - method: GET
    path: "/complication-cases/{id}"
    description: "Get a complication case"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: []

  - method: GET
    path: "/complication-cases"
    description: "List complication cases, optionally filtered by booking (FK reverse-reachability for ComplicationCase.surgery_booking_id and line_item_id)"
    roles: [FrontDeskCoordinator, Surgeon, BillingSpecialist]
    code: 200
    input: ["surgery_booking_id?", "line_item_id?", "limit?", "offset?"]
    output: "ComplicationCase[]"
    side_effects: []

  - method: POST
    path: "/complication-cases/{id}/review"
    description: "Move a case to UNDER_REVIEW"
    roles: [Surgeon]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status OPEN -> UNDER_REVIEW"]

  - method: POST
    path: "/complication-cases/{id}/reopen"
    description: "Send a case back to OPEN (cyclic revision loop)"
    roles: [Surgeon]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status UNDER_REVIEW -> OPEN"]

  - method: POST
    path: "/complication-cases/{id}/approve-revision"
    description: "Approve a revision; computes within_revision_window and revision_charge_cents"
    roles: [Surgeon]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status UNDER_REVIEW -> REVISION_APPROVED, compute revision_charge_cents (calculations.revision_charge)"]

  - method: POST
    path: "/complication-cases/{id}/resolve"
    description: "Resolve a complication case"
    roles: [Surgeon]
    code: 200
    input: []
    output: ComplicationCase
    side_effects: ["status -> RESOLVED"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID/X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting Surgeon is not the owner (X-User-ID != surgeon_user_id) of the consultation/booking" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body: missing required field or type mismatch" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "scheduled_end is not strictly after scheduled_start" }

  - { id: ERR_PROCEDURE_NOT_FOUND, http: 404, condition: "Procedure id does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_CONSULTATION_NOT_FOUND, http: 404, condition: "Consultation id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "QuotePackage id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "QuoteLineItem id does not exist" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "ConsentRecord id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "SurgeryBooking id does not exist" }
  - { id: ERR_FINANCING_NOT_FOUND, http: 404, condition: "FinancingApplication id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "ComplicationCase id does not exist" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_OPEN_QUOTE_EXISTS, http: 409, condition: "Consultation cannot close while a QuotePackage is still PRESENTED" }
  - { id: ERR_EMPTY_QUOTE, http: 409, condition: "Quote has no line items and cannot be presented" }
  - { id: ERR_PROCEDURE_RETIRED, http: 409, condition: "Procedure is RETIRED and cannot be added to a quote" }
  - { id: ERR_CONSENT_MISSING, http: 409, condition: "Accepting a quote requires a SIGNED surgical consent" }
  - { id: ERR_CLEARANCE_MISSING, http: 409, condition: "Booking requires an ISSUED clearance whose cleared==true for the patient" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 409, condition: "Financing approval requires the parent quote to be ACCEPTED" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 409, condition: "Complication review requires the parent booking to be COMPLETED" }
  - { id: ERR_SURGERY_NOT_STARTED, http: 409, condition: "Cannot complete surgery before scheduled_start" }
  - { id: ERR_SURGERY_IN_PAST, http: 409, condition: "scheduled_start is not strictly in the future" }
  - { id: ERR_OR_DOUBLE_BOOKED, http: 409, condition: "OR interval overlaps an existing SCHEDULED booking in the same room (half-open, touching allowed)" }
  - { id: ERR_SURGEON_BUFFER_CONFLICT, http: 409, condition: "Surgeon has an existing SCHEDULED booking within the 60-minute turnaround buffer" }

  - { id: ERR_DEPOSIT_UNPAID, http: 402, condition: "deposit_paid_cents < required_deposit_cents on accept" }
  - { id: ERR_FINANCING_EXCEEDS_BALANCE, http: 402, condition: "approved amount exceeds quote balance_due_cents" }

  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_quote_package_version does not match live QuotePackage.version" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Operational admin; manages the procedure catalog and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /procedures — create procedure"
      - "POST /procedures/{id}/retire — retire procedure"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET /procedures, GET /procedures/{id}"

  - name: FrontDeskCoordinator
    description: "Intake, quoting, consent capture, and scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /consultations — open consultation"
      - "POST /consultations/{id}/close — close consultation"
      - "POST /quote-packages — create quote"
      - "POST /quote-packages/{id}/line-items — add line item"
      - "POST /quote-packages/{id}/present — present quote"
      - "POST /quote-packages/{id}/accept — accept quote"
      - "POST /quote-packages/{id}/reject — reject quote"
      - "POST /quote-packages/{id}/expire — expire quote"
      - "POST /surgery-bookings — schedule surgery"
    shared_operations:
      - "POST /patients — create patient (with Surgeon)"
      - "POST /quote-packages/{id}/consents — create consent (with Surgeon)"
      - "GET reads across patients, consultations, quotes, bookings, financing, cases, procedures"

  - name: Surgeon
    description: "Clinical role; completes consultations, issues clearances, captures consent, runs surgery and complication management"
    identity: "opaque"
    exclusive_operations:
      - "POST /consultations/{id}/complete — complete consultation (owner only)"
      - "PATCH /patients/{id} — update clinical fields"
      - "POST /patients/{id}/clearances — issue clearance"
      - "POST /consents/{id}/revoke — revoke consent"
      - "POST /surgery-bookings/{id}/complete — complete surgery (owner only)"
      - "POST /complication-cases — open case"
      - "POST /complication-cases/{id}/review — review case"
      - "POST /complication-cases/{id}/reopen — reopen case"
      - "POST /complication-cases/{id}/approve-revision — approve revision"
      - "POST /complication-cases/{id}/resolve — resolve case"
    shared_operations:
      - "POST /patients — create patient (with FrontDeskCoordinator)"
      - "POST /quote-packages/{id}/consents — create consent (with FrontDeskCoordinator)"
      - "GET reads across resources"

  - name: BillingSpecialist
    description: "Handles deposits, financing, refunds, and surgery cancellation settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /quote-packages/{id}/deposits — record deposit"
      - "POST /surgery-bookings/{id}/cancel — cancel + settle deposit"
      - "POST /financing-applications — submit financing"
      - "POST /financing-applications/{id}/approve — approve financing"
      - "POST /financing-applications/{id}/decline — decline financing"
    shared_operations:
      - "GET reads across resources"
