              payload: {}
              as: UnitedFundAdmin
              captures: { prov: $.data.provisional_estimated_loss }
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/reconcile"
              payload: {}
              as: FinanceReviewer
              captures: { posture: $.data.posture, loss: $.data.final_actual_loss, bps: $.data.realized_shrinkage_rate_bps, absorbed: $.data.reserve_absorbed_amount }
            - call: "GET /fundraising/employers/${emp}"
              payload: {}
              as: UnitedFundAdmin
              captures: { est: $.data.status, reason: $.data.suspended_reason }
            - call: "GET /fundraising/employers/${emp}/coordinators"
              payload: {}
              as: UnitedFundAdmin
          assert:
            - "${prov} == 0.00 (the written-off pledge is not in the PROVISIONAL input set)"
            - "Campaign.${camp}.reserve_absorbed_amount == 0.00"
            - "Campaign.${camp}.final_actual_loss == 1000.00"
            - "Campaign.${camp}.final_net_expected_revenue == 0.00"
            - "Campaign.${camp}.realized_shrinkage_rate_bps == 10000"
            - "Campaign.${camp}.posture == ESCROW_HOLD and reconciled_at == '2026-08-01T00:00:00Z'"
            - "Pledge.${pl}.designation_status == LOCKED"
            - "Employer.${emp}.status == SUSPENDED and Employer.${emp}.suspended_reason == 'ESCROW_HOLD_SHRINKAGE'"
            - "CampaignCoordinator.${co1}.status == INACTIVE and CampaignCoordinator.${co2}.status == INACTIVE"

      - name: corner_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Pledge.designation_status
          - state_machines.Pledge.collection_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / pledge_designation_and_collection_axes_evolve_independently
          rationale: "The §1.8 instance drives both Pledge axes through a full cross-product and asserts the combined state after each hop; a second breadth test would restate it."

      - name: corner_cyclic_state_machine_loop_bound
        claim_type: cyclic
        grounds:
          - state_machines.OutcomeReport.REVISION_REQUESTED_to_SUBMITTED
          - validations[priority=39]
        excluded_because:
          difficulty_instance: non_linear_state_machine / outcome_report_revision_loop_and_round_cap
          rationale: "The §1.8 instance walks the SUBMITTED -> ... -> REVISION_REQUESTED -> SUBMITTED loop twice and asserts ERR_REVISION_LIMIT_REACHED at MAX_REVISION_ROUNDS."

      - name: corner_guarded_transition_requires_other_entity_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Campaign.PLANNED_to_OPEN
          - validations[priority=10]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / campaign_open_gated_by_employer_partnership_status
          rationale: "The §1.8 instance is exactly the guarded transition: campaign open is refused with ERR_EMPLOYER_NOT_ACTIVE until the Employer reaches ACTIVE."

      - name: corner_cascade_down_parent_change_reaches_children
        claim_type: cascade_down
        grounds:
          - state_machines.Pledge.PENDING_to_WRITTEN_OFF
          - state_machines.PledgeDesignation.ACTIVE_to_UNCOLLECTED
        excluded_because:
          difficulty_instance: transitive_cascade / pledge_write_off_cascade_three_links_to_agency_passthrough
          rationale: "The §1.8 instance asserts all three links of the write-off cascade (pledge -> designation lines -> agency passthrough ledger)."

      - name: corner_cross_entity_side_effect_adjusts_agency_ledger
        claim_type: cross_entity
        grounds:
          - state_machines.Pledge.CONFIRMED_to_AMENDED
          - entities.Agency.fields.designated_passthrough_ytd
        excluded_because:
          difficulty_instance: compensating_invariant / pledge_gross_decomposition_survives_designation_amend_round_trip
          rationale: "The §1.8 instance asserts the agency-side ledger for every agency losing or gaining an ACTIVE line across an amend round trip."

      - name: corner_ledger_sync_cycle_pool_after_award
        claim_type: ledger_sync
        grounds:
          - state_machines.AllocationRequest.PANEL_APPROVED_to_AWARDED
          - entities.AllocationCycle.fields.available_undesignated_pool
        excluded_because:
          difficulty_instance: compensating_invariant / cycle_pool_conservation_survives_award_rescind_reaward
          rationale: "The §1.8 instance reconciles awarded_total + available_undesignated_pool against opening_undesignated_pool after every award hop."

      - name: corner_compensation_transition_reverses_all_side_effects
        claim_type: compensation
        grounds:
          - state_machines.AllocationRequest.AWARDED_to_PANEL_APPROVED
          - calculations.community_impact_fund_allocation
        excluded_because:
          difficulty_instance: compensating_invariant / cycle_pool_conservation_survives_award_rescind_reaward
          rationale: "rescind-award is the compensating transition; the §1.8 instance asserts that all four award components, awarded_at and outcome_report_due_date return to null with no pool drift."

      - name: corner_conditional_cascade_touches_only_selected_children
        claim_type: conditional_cascade
        grounds:
          - state_machines.Agency.UNDER_FINANCIAL_REVIEW_to_PROBATION
          - state_machines.AllocationRequest.SUBMITTED_to_SUSPENDED_REVIEW
        excluded_because:
          difficulty_instance: transitive_cascade / agency_probation_cascade_four_links_to_cycle_restriction
          rationale: "The §1.8 instance shows the probation cascade suspending only requests whose status is SUBMITTED/UNDER_PANEL_REVIEW on cycles in OPEN/RESTRICTED."

  - section: calculations
    instances:

      - name: pledge_designation_fee_allocation_correct_result_on_three_lines
        claim_type: Correct Result
        grounds:
          - calculations.pledge_designation_fee_allocation
          - entities.PledgeDesignation.fields.processing_fee
          - entities.PledgeDesignation.fields.net_designated_amount
          - entities.Pledge.fields.designated_amount_total
          - entities.Pledge.fields.undesignated_amount
        distinguishing_aspect: |
          Known inputs, pinned outputs: a 500.00 pledge with designation lines 100.00, 40.00 and
          25.00 produces per-line processing fees 7.25, 2.90 and 1.81 (the 25.00 line's raw fee
          1.8125 rounds half-up to 1.81), designated_amount_total 165.00,
          designation_fee_total 11.96, net_designated_total 153.04 and undesignated_amount
          335.00. Note the max(..., MIN_LINE_FEE 1.50) guard can never bind, because priority 31
          floors every line at MIN_DESIGNATION_AMOUNT 25.00 whose fee is already 1.81.
        test_recipe:
          setup:
            - "Two GOOD_STANDING agencies (each certified at 90.00) and one OPEN campaign."
            - "The pledge is created with three designation lines in array order 100.00 (agency A), 40.00 (agency B), 25.00 (agency A)."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Maple Street Clinic", ein: "610000001", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
