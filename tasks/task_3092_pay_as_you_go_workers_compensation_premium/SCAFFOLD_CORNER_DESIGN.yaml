              as: TaxFiler
            - call: "POST /wc/audits"
              payload: { policy_id: "${cd_qtr_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z" }
              as: Auditor
              captures: { cd_qtr_audit: $.data.id }
            - call: "GET /wc/policies/${cd_qtr_pol}"
              as: TaxFiler
              captures: { cd_qtr_pv: $.data.version }
          trigger:
            - call: "POST /wc/audits/${cd_qtr_audit}/file"
              payload: { expected_policy_version: "${cd_qtr_pv}" }
              as: TaxFiler
              as_user_id: "tf-qtr"
              captures: { cd_qtr_err: $.data.error_id }
          assert:
            - "response status 422 with error_id ERR_TAX_FILING_MISSING (Q4 of the window has no filing)"

      - name: idempotency_replay_returns_original_conflicting_key_rejected
        claim_type: Violation → Error
        grounds: ['validations.priority-14', 'errors.ERR_{id}EMPOTENCY_CONFLICT']
        distinguishing_aspect: "Same idempotency_key + identical payload replays the ORIGINAL report (no duplicate, no second invoice); same key + different payload fails ERR_IDEMPOTENCY_CONFLICT (409)."
        test_recipe:
          setup: ["Bound policy; one accepted report with idempotency_key idm-1."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-IDM-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
