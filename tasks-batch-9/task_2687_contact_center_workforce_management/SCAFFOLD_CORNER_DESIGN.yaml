              as: WorkforceAnalyst
              captures: { ip0_id: "$.data[0].id" }
            - call: "POST /outsource-partners"
              payload: { legal_name: "P-CHEAP", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 9000, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { p_cheap: "$.data.id" }
            - call: "POST /outsource-partners"
              payload: { legal_name: "P-MID", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 10000, interval_max_volume: 60, commitment_floor_volume: 40, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { p_mid: "$.data.id" }
            - call: "POST /outsource-partners"
              payload: { legal_name: "P-DEAR", skill_codes: ["CHAT_EN"], rate_per_contact_millicents: 12500, interval_max_volume: 50, commitment_floor_volume: 10, performance_threshold_pct: 0.8500, billing_basis: "DELIVERED_ONLY" }
              as: SourcingManager
