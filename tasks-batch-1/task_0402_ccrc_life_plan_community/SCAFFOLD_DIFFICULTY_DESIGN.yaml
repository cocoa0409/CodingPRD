# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# All formula-derived assert literals were computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_voluntary_vs_death_diverge_on_fifty_plan
        grounds:
          - calculations.entrance_fee_refund
          - state_machines.Residency.ACTIVE_to_TERMINATED_VOLUNTARY
          - state_machines.Residency.ACTIVE_to_TERMINATED_DEATH
          - entities.RefundDisbursement.fields.refundable_cents
        distinguishing_aspect: |
          Same FIFTY_REFUNDABLE residency (G=10_000_000, m=5) yields refundable_cents=9_000_000
          under the VOLUNTARY variant but 5_000_000 under the DEATH variant — the two variants
          of the same calculation produce different cents on the Residency/RefundDisbursement domain.
        test_recipe:
          setup:
            - "Community c (discount 600bps, reserve 0); plan p FIFTY_REFUNDABLE entrance_fee 10_000_000, declining_monthly_bps 200."
            - "Two residencies r1, r2, each on plan p, each assigned an INDEPENDENT unit, each ACTIVE with occupied_months=5 after a 5-period clock advance."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Maplewood", actuarial_discount_rate_bps: 600, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Fifty Plan", contract_type: "TYPE_C", entrance_fee_cents: 10000000, refund_plan: "FIFTY_REFUNDABLE", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000, declining_monthly_bps: 200 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "A1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "A2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { u2: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ada Vol", date_of_birth: "1940-01-01" }
              as: AdmissionsDirector
              captures: { res1: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ben Death", date_of_birth: "1939-02-02" }
              as: AdmissionsDirector
              captures: { res2: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res2}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r2: $.data.id }
            - call: "POST /ccrc/residencies/${r1}/assign-unit"
              payload: { unit_id: "${u1}" }
              as: AdmissionsDirector
              captures: { r1v: $.data.version }
            - call: "POST /ccrc/residencies/${r2}/assign-unit"
              payload: { unit_id: "${u2}" }
              as: AdmissionsDirector
              captures: { r2v: $.data.version }
            - call: "POST /ccrc/residencies/${r1}/activate"
              payload: { expected_residency_version: "${r1v}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/residencies/${r2}/activate"
              payload: { expected_residency_version: "${r2v}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/communities/${cid}/clock/advance"
              payload: { by_periods: 5 }
              as: FinanceOfficer
          trigger:
            - call: "POST /ccrc/residencies/${r1}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${r1v}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/residencies/${r2}/terminate"
              payload: { reason: "DEATH", expected_residency_version: "${r2v}" }
              as: AdmissionsDirector
            - call: "GET /ccrc/refund-disbursements"
              payload: { residency_id: "${r1}" }
              as: FinanceOfficer
              captures: { d1_amt: "$.data[0].refundable_cents" }
            - call: "GET /ccrc/refund-disbursements"
              payload: { residency_id: "${r2}" }
              as: FinanceOfficer
              captures: { d2_amt: "$.data[0].refundable_cents" }
          assert:
            - "RefundDisbursement for ${r1} (VOLUNTARY).refundable_cents == 9000000"
            - "RefundDisbursement for ${r2} (DEATH).refundable_cents == 5000000"
            - "the two values differ: 9000000 != 5000000"

      - name: invoice_type_a_vs_type_c_diverge_on_skilled_per_diem
        grounds:
          - calculations.monthly_invoice_total
          - entities.MonthlyInvoice.fields.care_surcharge_cents
          - entities.ContractPlan.fields.contract_type
        distinguishing_aspect: |
          Identical SKILLED billing inputs (15 skilled days, per_diem 40_000) produce
          care_surcharge_cents=0 under a TYPE_A plan but 600_000 under a TYPE_C plan — dual variants
          of monthly_invoice_total on the MonthlyInvoice/ContractPlan domain, distinct from the
          refund instance above which lives on RefundDisbursement.
        test_recipe:
          setup:
            - "Community c; TYPE_A plan pa and TYPE_C plan pc, both monthly_service_fee 300_000, skilled_per_diem 40_000."
            - "Residency ra on pa and rc on pc, both ACTIVE in INDEPENDENT units, both stepped INDEPENDENT→ASSISTED→SKILLED with an OCCUPIED skilled bed."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Cedar", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "A Plan", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000, skilled_per_diem_cents: 40000 }
              as: FinanceOfficer
              captures: { pa: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "C Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000, skilled_per_diem_cents: 40000 }
              as: FinanceOfficer
              captures: { pc: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "I1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { ui1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "I2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { ui2: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "S1", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { us1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "S2", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { us2: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Amy A", date_of_birth: "1938-03-03" }
              as: AdmissionsDirector
              captures: { resa: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Cara C", date_of_birth: "1937-04-04" }
              as: AdmissionsDirector
              captures: { resc: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resa}", contract_plan_id: "${pa}" }
              as: AdmissionsDirector
              captures: { ra: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resc}", contract_plan_id: "${pc}" }
              as: AdmissionsDirector
              captures: { rc: $.data.id }
            - call: "POST /ccrc/residencies/${ra}/assign-unit"
              payload: { unit_id: "${ui1}" }
              as: AdmissionsDirector
              captures: { rav: $.data.version }
            - call: "POST /ccrc/residencies/${rc}/assign-unit"
              payload: { unit_id: "${ui2}" }
              as: AdmissionsDirector
              captures: { rcv: $.data.version }
            - call: "POST /ccrc/residencies/${ra}/activate"
              payload: { expected_residency_version: "${rav}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/residencies/${rc}/activate"
              payload: { expected_residency_version: "${rcv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${ra}", unit_id: "${us1}", hold_expiry_period: 5 }
              as: CareCoordinator
              captures: { bra: $.data.id }
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rc}", unit_id: "${us2}", hold_expiry_period: 5 }
              as: CareCoordinator
              captures: { brc: $.data.id }
            - call: "POST /ccrc/bed-reservations/${bra}/occupy"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/bed-reservations/${brc}/occupy"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${ra}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { cta1: $.data.id }
            - call: "POST /ccrc/care-transitions/${cta1}/apply"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${ra}", to_level: "SKILLED" }
              as: CareCoordinator
              captures: { cta2: $.data.id }
            - call: "POST /ccrc/care-transitions/${cta2}/apply"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rc}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ctc1: $.data.id }
            - call: "POST /ccrc/care-transitions/${ctc1}/apply"
              payload: {}
              as: CareCoordinator
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rc}", to_level: "SKILLED" }
              as: CareCoordinator
              captures: { ctc2: $.data.id }
            - call: "POST /ccrc/care-transitions/${ctc2}/apply"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/residencies/${ra}/invoices"
              payload: { skilled_days_in_period: 15 }
              as: FinanceOfficer
              captures: { inva_care: $.data.care_surcharge_cents, inva_total: $.data.total_cents }
            - call: "POST /ccrc/residencies/${rc}/invoices"
              payload: { skilled_days_in_period: 15 }
              as: FinanceOfficer
              captures: { invc_care: $.data.care_surcharge_cents, invc_total: $.data.total_cents }
          assert:
            - "TYPE_A invoice.care_surcharge_cents == 0 and total_cents == 300000"
            - "TYPE_C invoice.care_surcharge_cents == 600000 and total_cents == 900000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: refund_rounding_order_pinned_per_month_then_multiply
        grounds:
          - calculations.entrance_fee_refund
          - entities.RefundDisbursement.fields.refundable_cents
          - entities.ContractPlan.fields.declining_monthly_bps
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: with G=999_999, declining_monthly_bps=200,
          m=5, the pinned order per_month=floor(999999*200/10000)=19999 then *5=99995 differs from
          floor(999999*200*5/10000)=99999 — DECLINING refundable = max(0, G - nonref - 99995),
          not ...-99999.
        test_recipe:
          setup:
            - "Community c; DECLINING plan with entrance_fee 999_999, declining_monthly_bps 200, declining_nonrefundable_bps 0."
            - "One residency ACTIVE in an INDEPENDENT unit, occupied_months=5."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Birch", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Round Plan", contract_type: "TYPE_C", entrance_fee_cents: 999999, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0, declining_monthly_bps: 200, declining_nonrefundable_bps: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "R1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Rita R", date_of_birth: "1941-05-05" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/communities/${cid}/clock/advance"
              payload: { by_periods: 5 }
              as: FinanceOfficer
          trigger:
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "GET /ccrc/refund-disbursements"
              payload: { residency_id: "${rid}" }
              as: FinanceOfficer
              captures: { amt: "$.data[0].refundable_cents" }
          assert:
            - "RefundDisbursement.refundable_cents == 900004"
            - "the value equals G(999999) - 0 - 99995, NOT 999999 - 99999 (= 900000)"

      - name: invoice_three_input_nonlinear_assisted_second_skilled
        grounds:
          - calculations.monthly_invoice_total
          - entities.MonthlyInvoice.fields.total_cents
          - entities.Residency.fields.has_second_person
          - entities.Residency.fields.care_level
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear interaction: total_cents folds care_level (ASSISTED surcharge
          into base), has_second_person (flat add), and contract_type×skilled_days branch. For an
          ASSISTED residency with a second person on a TYPE_C plan billing 0 skilled days, total =
          (300000+120000)+150000+0 = 570000 — distinct mode from the (b) rounding instance above.
        test_recipe:
          setup:
            - "Community c; TYPE_C plan monthly 300_000, assisted_surcharge 120_000, second_person_fee 150_000, per_diem 40_000."
            - "Residency ACTIVE in INDEPENDENT unit, with an ACTIVE second person, stepped INDEPENDENT→ASSISTED."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Aspen", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Combo Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000, assisted_monthly_surcharge_cents: 120000, skilled_per_diem_cents: 40000 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "I9", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Cora N", date_of_birth: "1936-06-06" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/residencies/${rid}/second-persons"
              payload: { full_name: "Cora Spouse", date_of_birth: "1938-07-07" }
              as: AdmissionsDirector
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ctid: $.data.id }
            - call: "POST /ccrc/care-transitions/${ctid}/apply"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/residencies/${rid}/invoices"
              payload: { skilled_days_in_period: 0 }
              as: FinanceOfficer
              captures: { base: $.data.base_service_fee_cents, second: $.data.second_person_fee_cents, care: $.data.care_surcharge_cents, total: $.data.total_cents }
          assert:
            - "MonthlyInvoice.base_service_fee_cents == 420000"
            - "MonthlyInvoice.second_person_fee_cents == 150000"
            - "MonthlyInvoice.care_surcharge_cents == 0"
            - "MonthlyInvoice.total_cents == 570000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: residency_terminate_branches_voluntary_vs_death
        grounds:
          - state_machines.Residency.ACTIVE_to_TERMINATED_VOLUNTARY
          - state_machines.Residency.ACTIVE_to_TERMINATED_DEATH
          - entities.Residency.fields.status
        distinguishing_aspect: |
          Residency ACTIVE forks into two terminal states selected by the `reason` body field,
          each carrying a different entrance_fee_refund variant; the branch is on the Residency entity.
        test_recipe:
          setup:
            - "Community c; NINETY_REFUNDABLE plan entrance_fee 10_000_000, declining_monthly_bps 200."
            - "Residency ACTIVE, occupied_months 5, in an INDEPENDENT unit."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Willow", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Ninety", contract_type: "TYPE_C", entrance_fee_cents: 10000000, refund_plan: "NINETY_REFUNDABLE", monthly_service_fee_cents: 300000, second_person_fee_cents: 0, declining_monthly_bps: 200 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "N1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Nora D", date_of_birth: "1935-08-08" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/communities/${cid}/clock/advance"
              payload: { by_periods: 5 }
              as: FinanceOfficer
          trigger:
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "DEATH", expected_residency_version: "${rv}" }
              as: AdmissionsDirector
              captures: { final_status: $.data.status }
          assert:
            - "Residency.status == TERMINATED_DEATH (the DEATH branch, not TERMINATED_VOLUNTARY)"
            - "RefundDisbursement.refundable_cents == 9000000 (NINETY death floor)"

      - name: care_transition_continuum_step_back_toward_independent
        grounds:
          - state_machines.CareTransition.PROPOSED_to_APPLIED
          - entities.Residency.fields.care_level
          - validations[priority=9]
        distinguishing_aspect: |
          The CareTransition continuum is non-linear (back-stepping): a residency at ASSISTED may
          apply a transition back to INDEPENDENT, the reverse of the forward INDEPENDENT→ASSISTED step;
          the cycle lives on a different entity (CareTransition) than the Residency-terminate fork.
        test_recipe:
          setup:
            - "Community c; residency ACTIVE in INDEPENDENT unit; one applied INDEPENDENT→ASSISTED transition so care_level==ASSISTED."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Oak", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Step Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "O1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Otis S", date_of_birth: "1934-09-09" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ct1: $.data.id }
            - call: "POST /ccrc/care-transitions/${ct1}/apply"
              payload: {}
              as: CareCoordinator
          trigger:
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "INDEPENDENT" }
              as: CareCoordinator
              captures: { ct2: $.data.id }
            - call: "POST /ccrc/care-transitions/${ct2}/apply"
              payload: {}
              as: CareCoordinator
            - call: "GET /ccrc/residencies/${rid}"
              payload: {}
              as: CareCoordinator
              captures: { lvl: $.data.care_level }
          assert:
            - "second CareTransition.status == APPLIED"
            - "Residency.care_level == INDEPENDENT after the back-step"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: terminate_releases_bed_then_frees_skilled_unit_depth3
        grounds:
          - state_machines.Residency.ACTIVE_to_TERMINATED_VOLUNTARY
          - state_machines.BedReservation.OCCUPIED_to_RELEASED
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Depth-3 chain: terminate (Residency ACTIVE→TERMINATED_VOLUNTARY) ⇒ its OCCUPIED
          BedReservation becomes RELEASED ⇒ that release frees the SKILLED Unit (status OCCUPIED→
          AVAILABLE). Each hop is caused by the prior hop, not directly by terminate.
        test_recipe:
          setup:
            - "Community c; residency ACTIVE in INDEPENDENT unit; a SKILLED unit S1 (bed_capacity 1) with an OCCUPIED bed reservation for the residency."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Pine", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "Casc Plan", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "P-IND", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uind: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "P-SK", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Pat C", date_of_birth: "1933-10-10" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
              captures: { rv2: $.data.version }
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rid}", unit_id: "${usk}", hold_expiry_period: 5 }
              as: CareCoordinator
              captures: { brid: $.data.id }
            - call: "POST /ccrc/bed-reservations/${brid}/occupy"
              payload: {}
              as: CareCoordinator
            - call: "GET /ccrc/residencies/${rid}"
              payload: {}
              as: AdmissionsDirector
              captures: { rv3: $.data.version }
          trigger:
            - call: "POST /ccrc/residencies/${rid}/terminate"
              payload: { reason: "VOLUNTARY", expected_residency_version: "${rv3}" }
              as: AdmissionsDirector
            - call: "GET /ccrc/bed-reservations/${brid}"
              payload: {}
              as: CareCoordinator
              captures: { br_status: $.data.status }
            - call: "GET /ccrc/units/${usk}"
              payload: {}
              as: AdmissionsDirector
              captures: { sk_status: $.data.status }
          assert:
            - "BedReservation ${brid}.status == RELEASED (hop 2)"
            - "Unit ${usk}.status == AVAILABLE (hop 3, freed by the release)"

      - name: waitlist_place_reserves_residency_and_reranks_depth2
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_PLACED
          - state_machines.Residency.WAITLISTED_to_RESERVED
          - calculations.waitlist_ordering
        distinguishing_aspect: |
          Depth-2 chain originating from a different trigger (waitlist place, not terminate):
          placing the head entry (WaitlistEntry→PLACED) ⇒ its parent Residency becomes RESERVED ⇒
          the remaining PENDING entry for the same target_care_level is re-ranked from 2 to 1.
        test_recipe:
          setup:
            - "Community c; two DEPOSIT_HELD residencies r1, r2 both WAITLISTED for INDEPENDENT, r1 enqueued first (rank 1), r2 rank 2; an AVAILABLE INDEPENDENT unit."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Elm", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "WL Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "E1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ella 1", date_of_birth: "1932-01-01", priority_score: 0 }
              as: AdmissionsDirector
              captures: { res1: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Ella 2", date_of_birth: "1931-01-01", priority_score: 0 }
              as: AdmissionsDirector
              captures: { res2: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res2}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r2: $.data.id }
            - call: "POST /ccrc/waitlist-entries"
              payload: { community_id: "${cid}", residency_id: "${r1}", target_care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { w1: $.data.id }
            - call: "POST /ccrc/waitlist-entries"
              payload: { community_id: "${cid}", residency_id: "${r2}", target_care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { w2: $.data.id }
          trigger:
            - call: "POST /ccrc/waitlist-entries/${w1}/place"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
            - call: "GET /ccrc/residencies/${r1}"
              payload: {}
              as: AdmissionsDirector
              captures: { r1_status: $.data.status }
            - call: "GET /ccrc/waitlist-entries/${w2}"
              payload: {}
              as: AdmissionsDirector
              captures: { w2_rank: $.data.rank }
          assert:
            - "WaitlistEntry ${w1}.status == PLACED"
            - "Residency ${r1}.status == RESERVED (hop 1, cross-entity)"
            - "WaitlistEntry ${w2}.rank == 1 (hop 2, re-ranked from 2 after gap closed)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_frozen_beats_not_reserved_state
        grounds:
          - validations[priority=8]
          - validations[priority=7]
          - errors[ERR_ADMISSIONS_FROZEN]
          - errors[ERR_RESIDENCY_NOT_RESERVED]
        distinguishing_aspect: |
          Pair business_safety (ERR_ADMISSIONS_FROZEN, pri 8) vs state (ERR_RESIDENCY_NOT_RESERVED,
          pri 7): NOTE pri 7 is checked first, so a DEPOSIT_HELD residency in a frozen community that
          tries to activate returns ERR_RESIDENCY_NOT_RESERVED — the lower-priority-number (earlier)
          state check wins over the frozen-admissions safety check.
        test_recipe:
          setup:
            - "Community c with is_admissions_frozen forced true via a deficient reserve report; one residency still DEPOSIT_HELD (never reserved)."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Frost", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0, target_funded_ratio_bps: 10000 }
              as: FinanceOfficer
