scaffold_corner_design:
  # ==========================================================================
  # Section: entities — creation, retrieval, listing, defaults, system fields
  # ==========================================================================
  - section: entities
    instances:
      - name: enterprise_create_returns_201_and_server_minted_id
        claim_type: creation
        grounds: ["entities.Enterprise", "endpoints[POST /private-wireless/enterprises]"]
        distinguishing_aspect: "Creating an Enterprise returns 201 with all input fields plus server-minted id, created_at, updated_at, version=1, status=ONBOARDING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "T Corp", erp_account_code: "T-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id, v: $.data.version }
          assert:
            - "HTTP 201"
            - "Enterprise.${ent}.version == 1"
            - "Enterprise.${ent}.status == ONBOARDING"
            - "Enterprise.${ent}.security_posture == STANDARD (default applied)"

      - name: site_get_returns_404_for_nonexistent_id
        claim_type: not_found
        grounds: ["endpoints[GET /private-wireless/sites/{siteId}], errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a Site with a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /private-wireless/sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkArchitect
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: list_sites_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /private-wireless/enterprises/{enterpriseId}/sites], response_envelope"]
        distinguishing_aspect: "List response includes limit, offset, total_count, has_more; default limit=10."
        test_recipe:
          setup:
            - "One Enterprise with 3 Sites"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Pag Co", erp_account_code: "PAG-001", industry_vertical: "VENUE" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "P1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "P2", address: "b", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "P3", address: "c", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
          trigger:
            - call: "GET /private-wireless/enterprises/${ent}/sites?limit=2&offset=0"
              payload: {}
              as: NetworkArchitect
          assert:
            - "Response envelope contains limit=2, offset=0, total_count=3, has_more=true at the data level"
            - "data array contains exactly 2 Site entries"

      - name: site_survey_attenuation_computed_from_material
        claim_type: computed_field
        grounds: ["entities.SiteSurvey.fields.attenuation_factor_db", "calculations.attenuation_factor_derivation"]
        distinguishing_aspect: "attenuation_factor_db is derived from building_material_class; client-supplied value ignored."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "AT Co", erp_account_code: "AT-001", industry_vertical: "FACTORY" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "AT1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site}/surveys"
              payload: { surveyor_id: "ft", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 20, floor_plan_area_sqm: 500, building_material_class: "STEEL" }
              as: FieldTechnician
              captures: { att: $.data.attenuation_factor_db }
          assert:
            - "att == 18"

      - name: sim_profile_imsi_server_minted_not_input
        claim_type: system_field
        grounds: ["entities.SIMProfile.fields.imsi", "entities.SIMProfile.fields.ki_key_ref"]
        distinguishing_aspect: "IMSI and ki_key_ref are server-generated; client cannot supply them."
        test_recipe:
          setup: ["Enterprise exists"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "SIM Co", erp_account_code: "SIM-001", industry_vertical: "LOGISTICS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
          trigger:
            - call: "POST /private-wireless/enterprises/${ent}/sim-profiles"
              payload: { iccid: "8901111111111111111" }
              as: FieldTechnician
              captures: { imsi: $.data.imsi, ki: $.data.ki_key_ref }
          assert:
            - "imsi is a 15-digit string starting with carrier prefix"
            - "ki is a vault reference (not raw key material)"

      - name: duplicate_imei_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=15], errors[ERR_DUPLICATE_IDENTIFIER]"]
        distinguishing_aspect: "Second Device with the same IMEI is rejected 409 ERR_DUPLICATE_IDENTIFIER."
        test_recipe:
          setup: ["Cell exists; one Device with IMEI 111111111111111 already registered"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "DUP Co", erp_account_code: "DUP-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "DUP1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/cells"
              payload: { sector_label: "A", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell: $.data.id }
            - call: "POST /private-wireless/cells/${cell}/devices"
              payload: { serial_number: "SN-A", device_type: "CPE", imei: "111111111111111" }
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/cells/${cell}/devices"
              payload: { serial_number: "SN-B", device_type: "SENSOR", imei: "111111111111111" }
              as: FieldTechnician
          assert:
            - "HTTP 409 ERR_DUPLICATE_IDENTIFIER"

  # ==========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, side effects
  # ==========================================================================
  - section: state_machines
    instances:
      - name: terminal_decommissioned_site_rejects_further_actions
        claim_type: invalid_transition
        grounds: ["state_machines.Site", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Once Site reaches DECOMMISSIONED, every action endpoint returns ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Site in DECOMMISSIONED"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Term Co", erp_account_code: "TERM-001", industry_vertical: "ENERGY" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "T1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/decommission"
              payload: {}
              as: NetworkArchitect
          trigger:
            - call: "POST /private-wireless/sites/${site}/activate"
              payload: {}
              as: NetworkArchitect
          assert:
            - "HTTP 409 ERR_ALREADY_TERMINAL"

      - name: survey_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.SiteSurvey"]
        distinguishing_aspect: "Newly created SiteSurvey has status=DRAFT before any submit."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Init Co", erp_account_code: "INIT-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "I1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site}/surveys"
              payload: { surveyor_id: "ft", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 20, floor_plan_area_sqm: 500, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { status: $.data.status }
          assert:
            - "status == DRAFT"

      - name: cell_off_air_to_on_air_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.CellSector"]
        distinguishing_aspect: "CellSector OFF_AIR cannot transition directly to ON_AIR; must go through CONFIGURED."
        test_recipe:
          setup: ["CellSector in OFF_AIR (was previously ON_AIR then taken off)"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Cell Co", erp_account_code: "CELL-001", industry_vertical: "VENUE" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "CC", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/cells"
              payload: { sector_label: "X", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell: $.data.id }
            - call: "POST /private-wireless/sites/${site}/cells/${cell}/configure"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site}/cells/${cell}/off-air"
              payload: {}
              as: FieldTechnician
          assert:
            - "off-air from CONFIGURED rejected with 409 ERR_INVALID_STATE"

      - name: alert_resolution_rejected_when_remediation_open
        claim_type: precondition_enforcement
        grounds: ["validations[priority=20], errors[ERR_REMEDIATION_OPEN]"]
        distinguishing_aspect: "Resolving an alert while its CoverageRemediation is open returns ERR_REMEDIATION_OPEN."
        test_recipe:
          setup:
            - "Site OPERATIONAL with MAJOR alert ACKNOWLEDGED, then MITIGATING"
            - "CoverageRemediation created against that alert, still in PROPOSED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "RO Co", erp_account_code: "RO-001", industry_vertical: "LOGISTICS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "RO1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/alerts"
              payload: { alert_class: "OUTAGE", severity: "MAJOR" }
              as: FieldTechnician
              captures: { alert: $.data.id }
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/acknowledge"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/mitigate"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site}/remediations"
              payload: { triggered_by_alert_id: "${alert}", remediation_plan: "p", additional_cells_planned: 1 }
              as: RFEngineer
          trigger:
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/resolve"
              payload: {}
              as: FieldTechnician
          assert:
            - "HTTP 422 ERR_REMEDIATION_OPEN"

  # ==========================================================================
  # Section: calculations — known-input correctness
  # ==========================================================================
  - section: calculations
    instances:
      - name: sla_breach_credit_constants_applied
        claim_type: constants_applied
        grounds: ["calculations.sla_breach_credit"]
        distinguishing_aspect: "Per-event credit uses pinned constants: STANDARD=5%, ENHANCED=10%, MISSION_CRITICAL=20% of 100_000 cents."
        test_recipe:
          setup:
            - "Enterprise with ENHANCED ServiceContract ACTIVE; one CRITICAL OUTAGE alert resolved"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "C Co", erp_account_code: "C-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "CS1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.95 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/contracts"
              payload: { contract_code: "K1", sla_tier: "ENHANCED", contracted_availability_pct: 99.95, contracted_max_outage_minutes_per_month: 5, onsite_support_window: "FOUR_HOUR", contract_start_utc: "2026-09-01T00:00:00Z", contract_end_utc: "2027-09-01T00:00:00Z" }
              as: NetworkArchitect
              captures: { contract: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/contracts/${contract}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site}/alerts"
              payload: { alert_class: "OUTAGE", severity: "CRITICAL" }
              as: FieldTechnician
              captures: { alert: $.data.id }
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/acknowledge"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/mitigate"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site}/alerts/${alert}/resolve"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "GET /private-wireless/enterprises/${ent}"
              payload: {}
              as: NetworkArchitect
              captures: { credit: $.data.sla_credit_balance_cents }
          assert:
            - "credit == 10000"

      - name: interference_report_uses_fspl_constant
        claim_type: constants_applied
        grounds: ["calculations.interference_report_worst_case"]
        distinguishing_aspect: "The interference report uses FSPL constant 32.44 and coordination radius 1000 m."
        excluded_because:
          difficulty_instance: dual_variant_calc / design_capacity_provisional_vs_final_diverges
          rationale: "The interference report formula is exercised in the difficulty instance; here the formula constants are part of the same calculation."

  # ==========================================================================
  # Section: validations — priority, cross-entity, conditional
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1], errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role header → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /private-wireless/enterprises"
              payload: {}
              as: NetworkArchitect  # will be sent without header by the test
          assert:
            - "HTTP 401 ERR_UNAUTHENTICATED"

      - name: wrong_role_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2], errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "FieldTechnician attempting to create an Enterprise → 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "X", erp_account_code: "X-1", industry_vertical: "CAMPUS" }
              as: FieldTechnician
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED"

      - name: invalid_time_window_end_before_start
        claim_type: violation_to_error
        grounds: ["validations[priority=11], errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "Creating a SpectrumLease with lease_end_utc <= lease_start_utc → 400 ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup: ["Enterprise ACTIVE"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "TW Co", erp_account_code: "TW-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
          trigger:
            - call: "POST /private-wireless/enterprises/${ent}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 20, lease_start_utc: "2027-09-01T00:00:00Z", lease_end_utc: "2026-09-01T00:00:00Z", priority_access_tier: "GAA", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
          assert:
            - "HTTP 400 ERR_INVALID_TIME_WINDOW"

      - name: cross_enterprise_sim_binding_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=21], errors[ERR_CROSS_ENTERPRISE_REFERENCE]"]
        distinguishing_aspect: "Binding a SIMProfile owned by Enterprise A to a Device under Enterprise B's site → 422 ERR_CROSS_ENTERPRISE_REFERENCE."
        test_recipe:
          setup:
            - "Enterprise A ACTIVE with Site+Cell+Device"
            - "Enterprise B ACTIVE with a SIMProfile in UNASSIGNED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "A Co", erp_account_code: "A-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { entA: $.data.id }
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "B Co", erp_account_code: "B-001", industry_vertical: "FACTORY" }
              as: NetworkArchitect
              captures: { entB: $.data.id }
            - call: "POST /private-wireless/enterprises/${entA}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${entB}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${entA}/sites"
              payload: { site_code: "A1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { siteA: $.data.id }
            - call: "POST /private-wireless/sites/${siteA}/cells"
              payload: { sector_label: "A", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cellA: $.data.id }
            - call: "POST /private-wireless/cells/${cellA}/devices"
              payload: { serial_number: "SN-X", device_type: "CPE", imei: "999999999999999" }
              as: FieldTechnician
              captures: { devA: $.data.id }
            - call: "POST /private-wireless/enterprises/${entB}/sim-profiles"
              payload: { iccid: "8901999999999999999" }
              as: FieldTechnician
              captures: { simB: $.data.id }
          trigger:
            - call: "POST /private-wireless/cells/${cellA}/devices/${devA}/bind-sim"
              payload: { sim_profile_id: "${simB}" }
              as: FieldTechnician
          assert:
            - "HTTP 422 ERR_CROSS_ENTERPRISE_REFERENCE"

      - name: site_decommission_blocked_when_children_active
        claim_type: aggregate_validation
        grounds: ["validations[priority=22], errors[ERR_CHILDREN_ACTIVE]"]
        distinguishing_aspect: "Site with a single ON_AIR CellSector cannot be decommissioned; must decommission the cell first."
        test_recipe:
          setup: ["Site DEPLOYED with 1 ON_AIR Cell"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "CH Co", erp_account_code: "CH-001", industry_vertical: "VENUE" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "CH1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
            - call: "POST /private-wireless/sites/${site}/cells"
              payload: { sector_label: "Y", azimuth_degrees: 0, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell: $.data.id }
            - call: "POST /private-wireless/sites/${site}/cells/${cell}/configure"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site}/decommission"
              payload: {}
              as: NetworkArchitect
          assert:
            - "HTTP 422 ERR_CHILDREN_ACTIVE"

  # ==========================================================================
  # Section: endpoints — CRUD, action, computed read
  # ==========================================================================
  - section: endpoints
    instances:
      - name: site_summary_returns_computed_aggregates
        claim_type: computed_read
        grounds: ["endpoints[GET /private-wireless/sites/{siteId}/summary]"]
        distinguishing_aspect: "Site summary endpoint returns posture, capacity_shortfall, spectrum_utilization, device_count, open alerts, and active slices in a single read."
        test_recipe:
          setup: ["Site with some state"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Sum Co", erp_account_code: "SUM-001", industry_vertical: "CAMPUS" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "S1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id }
          trigger:
            - call: "GET /private-wireless/sites/${site}/summary"
              payload: {}
              as: NetworkArchitect
          assert:
            - "response.data.posture == DORMANT (initial)"
            - "response.data.spectrum_utilization_mhz == 0"
            - "response.data.device_count == 0"

      - name: clock_set_endpoint_updates_logical_time
        claim_type: standard_crud
        grounds: ["endpoints[POST /private-wireless/_clock/set_current_utc]"]
        distinguishing_aspect: "Setting the logical clock affects downstream time-window validation."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /private-wireless/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T12:00:00Z" }
              as: NetworkArchitect
          assert:
            - "HTTP 200; subsequent operations see 2027-06-15 as current time"

  # ==========================================================================
  # Section: errors — coverage for the remaining catalog
  # ==========================================================================
  - section: errors
    instances:
      - name: invalid_state_error_on_bad_transition
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / coverage_remediation_reopen_loop
          rationale: "Exercised implicitly as the failure path of a state machine invalid transition."

      - name: stale_site_version_occ_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_SITE_VERSION], concurrency_rules[design-edit-stale-site]"]
        distinguishing_aspect: "OCC: design creation with a stale expected_site_version returns 412."
        test_recipe:
          setup: ["Site exists at version=2 (after a survey approval)"]
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "OCC Co", erp_account_code: "OCC-001", industry_vertical: "FACTORY" }
              as: NetworkArchitect
              captures: { ent: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent}/sites"
              payload: { site_code: "O1", address: "a", geo_latitude: 40, geo_longitude: -75, site_area_sqm: 1000, target_capacity_mbps: 100, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site: $.data.id, v1: $.data.version }
            - call: "POST /private-wireless/sites/${site}/surveys"
              payload: { surveyor_id: "ft", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 20, floor_plan_area_sqm: 500, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { surv: $.data.id }
            - call: "POST /private-wireless/sites/${site}/surveys/${surv}/submit"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site}/surveys/${surv}/approve"
              payload: {}
              as: RFEngineer
          trigger:
            - call: "POST /private-wireless/sites/${site}/designs"
              payload: { based_on_survey_id: "${surv}", edge_compute_required: false, edge_compute_placement: "NONE", expected_site_version: "${v1}" }
              as: RFEngineer
          assert:
            - "HTTP 412 ERR_STALE_SITE_VERSION (site.version has advanced past the client's view)"

