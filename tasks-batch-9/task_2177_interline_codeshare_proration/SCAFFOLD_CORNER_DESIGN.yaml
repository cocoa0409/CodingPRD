          rationale: "Asserted by the second trigger call of the named §1.8 instance."

      - name: error_coupon_not_on_invoice_on_memo_raise
        claim_type: Error triggerable
        grounds:
          - errors[ERR_COUPON_NOT_ON_INVOICE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / memo_raise_window_beats_coupon_not_on_invoice
          rationale: "The named §1.8 instance sets up exactly this violation as the lower-priority check; the standalone trigger is the same request with the clock left inside the 45-day window."


  # ===========================================================================
  - section: rbac
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "A request carrying neither X-User-Role nor X-User-ID is rejected with ERR_UNAUTHENTICATED (401) before any role, shape or existence check runs."
        test_recipe:
          setup:
            - "Empty database; the trigger call is sent with no X-User-Role and no X-User-ID header."
          setup_api_calls:
            []
          trigger:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 401 with data.error_id == ERR_UNAUTHENTICATED and response_type == error"
            - "No Carrier row is created"
            - "The identical request with X-User-Role ClearinghouseOperator and any X-User-ID succeeds with 201"

      - name: revenue_accountant_cannot_submit_an_invoice
        claim_type: Denial
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.RevenueAccountant
          - roles.BillingAgent
        distinguishing_aspect: "submit is exclusive to BillingAgent: the RevenueAccountant who drafted the invoice is refused with ERR_ROLE_NOT_PERMITTED (403), which is the segregation of duties between the accounting and billing desks."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; period OPEN; a DRAFT invoice BB->AA over one flown, FINAL-prorated coupon."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0067000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "BillingInvoice.${inv}.status == DRAFT and submitted_at is null"
            - "Carrier.${bb}.pending_receivable_minor == 0"

      - name: interline_auditor_cannot_decide_a_recovery_claim
        claim_type: Denial
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.InterlineAuditor
          - roles.BillingAgent
        distinguishing_aspect: "claim-decision is exclusive to BillingAgent, so the auditing desk that raises a claim can never approve it; the role check at priority 2 fires ahead of the path-existence check at priority 4."
        test_recipe:
          setup:
            - "Empty database; the sample id in the path need not exist, because the role check precedes existence."
          setup_api_calls:
            []
          trigger:
            - call: "POST /interline/audit-samples/88888888-8888-4888-8888-888888888888/claim-decision"
              payload: { decision: "ACCEPT" }
              as: InterlineAuditor
              as_user_id: "88888888-8888-4888-8888-888888888888"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "data.error_id != ERR_SAMPLE_NOT_FOUND — priority 2 beats priority 4"

      - name: accountant_cannot_issue_a_ticket_for_another_carrier
        claim_type: Denial
        grounds:
          - validations[priority=6]
          - errors[ERR_CARRIER_OWNERSHIP_REQUIRED]
          - roles.RevenueAccountant
        distinguishing_aspect: "RevenueAccountant is entity_backed on Carrier: acting as BB while naming AA as validating_carrier_id returns ERR_CARRIER_OWNERSHIP_REQUIRED (403), after the referenced carrier has been confirmed to exist."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE."
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
          trigger:
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0068000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 403 with data.error_id == ERR_CARRIER_OWNERSHIP_REQUIRED"
            - "GET /interline/tickets with validating_carrier_id ${aa} returns total_count 0"
            - "The identical request with X-User-ID ${aa} succeeds with 201"

      - name: billed_carrier_cannot_submit_the_billing_carriers_invoice
        claim_type: Denial
        grounds:
          - validations[priority=6]
          - errors[ERR_CARRIER_OWNERSHIP_REQUIRED]
          - roles.BillingAgent
        distinguishing_aspect: "The submit side of an invoice belongs to billing_carrier_id: AA's BillingAgent, who is the party that will have to pay, is refused with ERR_CARRIER_OWNERSHIP_REQUIRED (403) even though its role is correct."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; period OPEN; a DRAFT invoice BB->AA over one flown, FINAL-prorated coupon."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0069000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 403 with data.error_id == ERR_CARRIER_OWNERSHIP_REQUIRED"
            - "BillingInvoice.${inv}.status == DRAFT"
            - "The identical request with X-User-ID ${bb} succeeds with 200"


  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: memo_raise_with_stale_invoice_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[memo-raise-stale-invoice]
          - errors[ERR_STALE_INVOICE_VERSION]
          - validations[priority=43]
        distinguishing_aspect: "The first memo advances BillingInvoice.version, so a second raise still carrying the pre-first-memo version is rejected with ERR_STALE_INVOICE_VERSION (412) — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; invoice BB->AA cleared at 2026-09-06T00:00:00Z with total_claim_minor 99250."
            - "The client read the invoice version once, then raised a first memo of 10000 which bumped that version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0070000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/settlement-periods/${p1}/close"
              payload: {}
              as: ClearinghouseOperator
            - call: "GET /interline/billing-invoices/${inv}"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { iv1: $.data.version }
            - call: "POST /interline/rejection-memos"
              payload: { invoice_id: "${inv}", coupon_id: "${c1}", amount_minor: 10000, reason_code: "PRORATE_FACTOR_DISPUTE", expected_invoice_version: "${iv1}" }
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { memo1: $.data.id }
          trigger:
            - call: "POST /interline/rejection-memos"
              payload: { invoice_id: "${inv}", coupon_id: "${c1}", amount_minor: 5000, reason_code: "SPA_NOT_APPLIED", expected_invoice_version: "${iv1}" }
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 412 with data.error_id == ERR_STALE_INVOICE_VERSION"
            - "BillingInvoice.${inv}.disputed_amount_minor == 10000 — only the first memo counted"
            - "GET /interline/rejection-memos with invoice_id ${inv} returns total_count 1, the row ${memo1}"
            - "Re-reading the invoice and resending the same payload with the fresh version succeeds with 201"

      - name: prorate_with_stale_ticket_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prorate-run-stale-ticket]
          - errors[ERR_STALE_TICKET_VERSION]
          - validations[priority=44]
        distinguishing_aspect: "Adding a coupon bumps Ticket.version, so a proration request built on the version read before that coupon existed is rejected with ERR_STALE_TICKET_VERSION (412) rather than allocating over a stale coupon set."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; a USD 100000 ticket whose version the client read when it had one coupon; a second coupon has since been appended."
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0071000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 2, origin: "LHR", destination: "JFK", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "PROVISIONAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 412 with data.error_id == ERR_STALE_TICKET_VERSION"
            - "Ticket.${t1}.proration_status == UNPRORATED and unallocated_residual_minor == 100000"
            - "Coupon.${c1}.allocated_amount_minor == 0 and Coupon.${c2}.allocated_amount_minor == 0"
            - "GET /interline/tickets/${t1}/proration-runs returns total_count 0"

      - name: memo_escalates_at_exactly_ninety_days_of_age
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.memo_aging
          - state_machines.RejectionMemo.RAISED_to_ARBITRATION
          - entities.RejectionMemo.fields.aging_bucket
        distinguishing_aspect: "The arbitration age gate is inclusive: a stage-1 memo raised at 2026-09-06T00:00:00Z and escalated at 2026-12-05T00:00:00Z reads age_days exactly 90 and aging_bucket AGED_90, and the escalation is accepted."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; invoice BB->AA cleared at 2026-09-06T00:00:00Z; a stage-1 memo of 10000 raised the same instant."
            - "The logical clock has been advanced to 2026-12-05T00:00:00Z, exactly 90 days later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0072000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/settlement-periods/${p1}/close"
              payload: {}
              as: ClearinghouseOperator
            - call: "GET /interline/billing-invoices/${inv}"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { iv1: $.data.version }
            - call: "POST /interline/rejection-memos"
              payload: { invoice_id: "${inv}", coupon_id: "${c1}", amount_minor: 10000, reason_code: "PRORATE_FACTOR_DISPUTE", expected_invoice_version: "${iv1}" }
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { memo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: ClearinghouseOperator
          trigger:
            - call: "POST /interline/rejection-memos/${memo}/escalate"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
          assert:
            - "Immediately before the trigger, RejectionMemo.${memo}.age_days == 90 and aging_bucket == AGED_90"
            - "HTTP status 200 and RejectionMemo.${memo}.status == ARBITRATION"
            - "RejectionMemo.${memo}.stage == 1 — the age gate alone carried it, not the stage gate"
            - "BillingInvoice.${inv}.disputed_amount_minor == 10000, still counted while under arbitration"
            - "Either side may escalate: the call is made by the billing carrier BB, not by the raiser AA"

      - name: derived_invoice_totals_do_not_track_later_allocation_changes
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BillingInvoice.fields.gross_billed_minor
        excluded_because:
          difficulty_instance: non_linear_state_machine / ticket_proration_and_billing_axes_move_independently
          rationale: "The named §1.8 instance voids a proration under a submitted invoice and asserts gross_billed_minor is unchanged at 100000."

      - name: five_level_cascade_ordering_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RejectionMemo.RAISED_to_ACCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / memo_accept_five_hop_cascade_to_carrier_counter
          rationale: "The named §1.8 instance asserts each of the five hops separately, in order."


  # ===========================================================================
  - section: consistency_model
    instances:

      - name: arbitrated_denial_settles_the_dispute_without_moving_a_cent
        claim_type: immediate
        grounds:
          - state_machines.RejectionMemo.ARBITRATION_to_RESOLVED_DENIED
          - calculations.carrier_net_position
          - entities.BillingInvoice.fields.disputed_amount_minor
        distinguishing_aspect: "The DENIED arbitration branch carries none of the five cascade hops: within the same request the disputed amount is released, and the coupon, the ticket axes and both carriers' settled balances read exactly what the clearance left them."
        test_recipe:
          setup:
            - "Carriers AA and BB ACTIVE; invoice BB->AA cleared at 2026-09-06T00:00:00Z with settled balances of 99250 on both sides."
            - "A stage-1 memo of 10000 raised at clearance and escalated to ARBITRATION once the clock reached 2026-12-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers"
              payload: { iata_code: "BB", name: "Borealis Airways", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { bb: $.data.id }
            - call: "POST /interline/settlement-periods"
              payload: { period_code: "2026-08-P1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_deadline: "2026-09-05T00:00:00Z", rate_fixing_date: "2026-09-06T00:00:00Z", settlement_currency: "USD" }
              as: ClearinghouseOperator
              captures: { p1: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0073000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "ECONOMY", tpm_miles: 1000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { c1: $.data.id }
            - call: "POST /interline/coupons/${c1}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "GET /interline/tickets/${t1}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { tv: $.data.version }
            - call: "POST /interline/tickets/${t1}/prorate"
              payload: { run_type: "FINAL", expected_ticket_version: "${tv}" }
              as: RevenueAccountant
              as_user_id: "${aa}"
            - call: "POST /interline/billing-invoices"
              payload: { settlement_period_id: "${p1}", billing_carrier_id: "${bb}", billed_carrier_id: "${aa}", billing_currency: "USD", coupon_ids: ["${c1}"] }
              as: RevenueAccountant
              as_user_id: "${bb}"
              captures: { inv: $.data.id }
            - call: "POST /interline/billing-invoices/${inv}/submit"
              payload: {}
              as: BillingAgent
              as_user_id: "${bb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/settlement-periods/${p1}/close"
              payload: {}
              as: ClearinghouseOperator
            - call: "GET /interline/billing-invoices/${inv}"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { iv1: $.data.version }
            - call: "POST /interline/rejection-memos"
              payload: { invoice_id: "${inv}", coupon_id: "${c1}", amount_minor: 10000, reason_code: "FARE_BASIS_ERROR", expected_invoice_version: "${iv1}" }
              as: BillingAgent
              as_user_id: "${aa}"
              captures: { memo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: ClearinghouseOperator
            - call: "POST /interline/rejection-memos/${memo}/escalate"
              payload: {}
              as: BillingAgent
              as_user_id: "${aa}"
          trigger:
            - call: "POST /interline/rejection-memos/${memo}/arbitrate"
              payload: { ruling: "DENIED" }
              as: ClearinghouseOperator
          assert:
            - "HTTP status 200; the response body already shows RejectionMemo.${memo}.status == RESOLVED_DENIED and resolved_at == 2026-12-05T00:00:00Z"
            - "BillingInvoice.${inv}.disputed_amount_minor == 0, rejected_amount_minor == 0, status == CLEARED, net_billed_minor == 99250"
            - "Coupon.${c1}.allocated_amount_minor == 100000, adjusted_amount_minor == 0, coupon_status == FLOWN"
            - "Ticket.${t1}.proration_status == FINAL and billing_status == BILLED"
            - "Carrier.${bb}.settled_receivable_minor == 99250, Carrier.${aa}.settled_payable_minor == 99250, and the net_position_minor values still sum to 0"
            - "Carrier.${aa}.open_reproration_count == 0"
            - "RejectionMemo.${memo}.age_days == 90, frozen at resolution"


