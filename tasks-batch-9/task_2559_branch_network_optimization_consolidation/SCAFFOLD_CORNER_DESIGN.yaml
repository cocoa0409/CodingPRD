            - call: "POST /distribution/property-dispositions"
              payload: { branch_id: "${b201_id}", consolidation_case_id: "${case_id}", atm_disposition: "DECOMMISSION", atm_monthly_cost_cents: 30000, atm_monthly_surcharge_revenue_cents: 40000, monthly_rent_cents: 250000, lease_end_date: "2027-06-30", buyout_offer_cents: 3000000 }
              as: RealEstateManager
              as_user_id: "u_realestate_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: NetworkOpsAdmin
