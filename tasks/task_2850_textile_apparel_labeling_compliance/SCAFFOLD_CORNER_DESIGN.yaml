      - name: retest_is_allowed_only_from_a_failed_bench
        claim_type: conditional_action
        grounds:
          - endpoints[POST /labeling/lab-tests/{id}/retest]
          - state_machines[entity=LabTest].transitions.FAILED_to_BENCH_RESERVED
          - validations[priority=45]
          - errors.ERR_LAB_TEST_STATE_INVALID
        distinguishing_aspect: "Retest is conditional on the row being FAILED: on a PASSED row it is refused at priority 45 and nothing is cleared, while on a FAILED row it reopens the bench, advances attempt_no to 2 and wipes every result field including valid_until - so the same endpoint is a no-op or a full reset depending on one state."
        test_recipe:
          setup:
            - "Market US is registered; one brand owns styles S1 and S2, each with a CARE_PERFORMANCE test on LAB-ATL-1. S1's test PASSED, S2's test FAILED on shrinkage."
