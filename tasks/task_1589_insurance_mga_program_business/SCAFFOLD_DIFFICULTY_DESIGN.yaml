            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpa}", claim_type: "LIABILITY", authority_limit_cents: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { appt: $.data.id } }
            - { call: "POST /mga/tpa-appointments/${appt}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Loop Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 155000 }, as: MGAFinance }
            - { call: "POST /mga/policies/${pol}/issue", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mga/policies/${pol}/claims", payload: { claim_type: "LIABILITY", occurrence_date: "2026-08-10T00:00:00Z", amount_claimed_cents: 80000 }, as: MGAUnderwriter, captures: { cl: $.data.id } }
            - { call: "POST /mga/claims/${cl}/start-review", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
          trigger:
            - { call: "POST /mga/claims/${cl}/deny", payload: { denial_reason: "no coverage" }, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl}/reopen", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/claims/${cl}/resume-review", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl}/deny", payload: { denial_reason: "still no coverage" }, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl}/reopen", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/claims/${cl}/resume-review", payload: {}, as: TPAAdjuster, as_user_id: "${tpa}" }
            - { call: "POST /mga/claims/${cl}/deny", payload: { denial_reason: "final" }, as: TPAAdjuster, as_user_id: "${tpa}", captures: { rc: $.data.reopened_count } }
            - { call: "POST /mga/claims/${cl}/reopen", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "two full DENIED -> REOPENED -> UNDER_REVIEW cycles completed (cyclic loop works)"
            - "after second deny-reopen cycle: reopened_count == 2"
            - "third reopen rejected: error_id == ERR_REOPEN_LIMIT_EXCEEDED (bounded cycle); claim stays DENIED"

      - name: policy_parallel_lifecycle_and_audit_dimensions
        grounds:
          - state_machines.Policy.NOT_AUDITED_to_AUDITED
          - state_machines.Policy.ISSUED_to_PENDING_CANCELLATION
        distinguishing_aspect: |
