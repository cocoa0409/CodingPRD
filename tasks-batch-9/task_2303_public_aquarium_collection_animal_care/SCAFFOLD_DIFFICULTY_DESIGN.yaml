      - the specimen's disposition_status stays QUARANTINE — the clinical dimension advanced twice without touching the disposition dimension
- rule_id: compensating_invariant
  rationale: 'Two do/undo pairs on two different aggregates: the exhibit bioload ledger under placement/removal, and the species wild-take quota under clearance/cancellation.'
  instances:
  - name: compensating_exhibit_bioload_ledger_restores_exactly_after_removal
    grounds:
    - §1.3 exhibit_bioload_ledger and its no-drift invariant
    - §1.2 Specimen CLEARED -> ON_EXHIBIT -> CLEARED
    - §1.1 Exhibit.occupied_bioload_units / bioload_utilization_pct / posture / version
    - §1.5 POST /aquarium/specimens/{id}/exhibit-placements, POST /aquarium/specimens/{id}/exhibit-removals
    - §1.4 priority 9 ERR_STALE_EXHIBIT_VERSION, priority 44 ERR_PLANNED_COUNT_EXCEEDED
    distinguishing_aspect: Placement, removal and re-placement must return the ledger to bit-identical values (19.00 and 95.00) with no accumulated drift, while Exhibit.version strictly increases at every step. A delta-based implementation that adds on placement and subtracts a re-derived value on removal leaves residue; one that recomputes from the specimen set does not. The planned_count 1 cap also has to be released by the removal, otherwise the re-placement fails at priority 44.
    test_recipe:
      setup: An exhibit with bioload_capacity_units 20 and an APPROVED plan entry with planned_count 1 for a species whose bioload_units_per_specimen is 19. One cleared, healthy specimen is available. The plant is quiet, so bioload is the only posture driver.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 20}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 19, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 1, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {spec_id: $.data.id}
      - call: GET /aquarium/specimens/${spec_id}/quarantine-cases
        payload: {}
        as: VeterinaryOfficer
        captures: {qc_id: '$.data[0].id'}
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-05T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/veterinary-cases
        payload: {specimen_id: '${spec_id}', case_type: PREVENTIVE_EXAM, opened_at: '2026-08-05T00:00:00Z'}
        as: VeterinaryOfficer
        as_user_id: vet-exam-opener
        captures: {vc1_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc1_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/veterinary-cases
        payload: {specimen_id: '${spec_id}', case_type: PREVENTIVE_EXAM, opened_at: '2026-08-10T00:00:00Z'}
        as: VeterinaryOfficer
        as_user_id: vet-exam-opener
        captures: {vc2_id: $.data.id}
      - call: POST /aquarium/veterinary-cases/${vc2_id}/closure
        payload: {outcome: RESOLVED, findings_severity: NONE}
        as: VeterinaryOfficer
        as_user_id: vet-exam-closer
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-01T00:00:00Z'}
        as: VeterinaryOfficer
      - call: POST /aquarium/quarantine-cases/${qc_id}/reviews
        payload: {outcome: CLEAR}
        as: VeterinaryOfficer
        as_user_id: vet-quarantine-clearer
      trigger:
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v2: $.data.version}
      - call: POST /aquarium/specimens/${spec_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_v2}'}
        as: AquaristTechnician
        captures: {d1: $.data.disposition_status}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v3: $.data.version}
      - call: POST /aquarium/specimens/${spec_id}/exhibit-removals
        payload: {expected_exhibit_version: '${ex_v3}', holding_area: QT-BAY-2}
        as: AquaristTechnician
        captures: {d2: $.data.disposition_status}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v4: $.data.version}
      - call: POST /aquarium/specimens/${spec_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_v4}'}
        as: AquaristTechnician
        captures: {d3: $.data.disposition_status}
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_v5: $.data.version}
      assert:
      - 'after trigger[1] (placement): Exhibit.occupied_bioload_units == 19.00, bioload_utilization_pct == 95.00, posture == OPEN; Specimen.disposition_status == ON_EXHIBIT with holding_area == null'
      - 'after trigger[3] (removal): occupied_bioload_units == 0.00 and bioload_utilization_pct == 0.00 exactly — not 0.01 or -0.00 — and Specimen.disposition_status == CLEARED with holding_area == ''QT-BAY-2'''
      - 'after trigger[5] (re-placement): occupied_bioload_units == 19.00 and bioload_utilization_pct == 95.00 again, byte-identical to the first placement'
      - the re-placement is only legal because the removal released the planned_count 1 slot; a second concurrent specimen would fail at priority 44 with 409 ERR_PLANNED_COUNT_EXCEEDED
      - Exhibit.version strictly increases across the three mutations (${ex_v2} < ${ex_v3} < ${ex_v4} < ${ex_v5}), each step by exactly 1, so replaying the removal with ${ex_v3} returns 412 ERR_STALE_EXHIBIT_VERSION
      - Specimen.bioload_units stays 19.00 throughout — it was snapshotted from the species at accession and is never re-derived
      - posture stays OPEN at every step because 95.00 is not strictly greater than BIOLOAD_PRESSURE_PCT 95.0
  - name: compensating_wild_quota_release_by_cancellation_unblocks_second_request
    grounds:
    - §1.2 AcquisitionRequest CLEARED -> CANCELLED with its quota COMPENSATION
    - §1.2 Permit ISSUED -> REVOKED with decision_reason ACQUISITION_CANCELLED
    - §1.4 priority 46 ERR_QUOTA_EXCEEDED
    - §1.3 sustainability_score FINAL quota-pressure term
    - §1.1 Species.wild_take_quota_reserved / version, §1.1 AcquisitionRequest.quota_units_reserved
    - §1.5 POST /aquarium/acquisition-requests/{id}/cancellation, POST /aquarium/acquisition-requests/{id}/clearance
    distinguishing_aspect: 'The quota is a shared counter on the Species: clearing a 3-specimen wild request against an annual allowance of 4 blocks a 2-specimen sibling, and cancelling the first must return the counter to 0 so the sibling clears. The compensation is observable twice — as the unblocked gate AND as a 5.00-point change in the sibling''s FINAL score, because the quota-pressure term reads the counter at clearance time (20 * 2/4 instead of 20 * 5/4).'
    test_recipe:
      setup: One GREEN, UNLISTED species with wild_take_quota_annual 4 under an APPROVED plan entry with planned_count 5, and an ACCREDITED source institution with welfare_audit_score 80.00. Two wild-collection requests are submitted for 3 and 2 specimens, each with its own ISSUED IMPORT permit. The first is cleared, reserving 3 of the 4 takes. Neither request has produced a specimen, so fulfilled_count is 0 on both and cancellation is still legal.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 5, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 80.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 3, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar1_id: $.data.id, prov1: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar1_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar1_id}', permit_type: IMPORT, authority_reference: NMFS-2026-3001, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm1_id: $.data.id}
      - call: POST /aquarium/permits/${pm1_id}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm1_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2027-06-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar1_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {score1: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 2, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar2_id: $.data.id, prov2: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar2_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar2_id}', permit_type: IMPORT, authority_reference: NMFS-2026-3002, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm2_id: $.data.id}
      - call: POST /aquarium/permits/${pm2_id}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm2_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2027-06-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      trigger:
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v3: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar2_id}/clearance
        payload: {expected_species_version: '${sp_v3}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {err: $.data.error_id}
      - call: POST /aquarium/acquisition-requests/${ar1_id}/cancellation
        payload: {reason: collection trip cancelled by the field team}
        as: CuratorOfCollections
        captures: {c1: $.data.status}
      - call: GET /aquarium/permits/${pm1_id}
        payload: {}
        as: PermitOfficer
        captures: {pm1_status: $.data.status}
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v4: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar2_id}/clearance
        payload: {expected_species_version: '${sp_v4}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {score2: $.data.sustainability_score}
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {reserved: $.data.wild_take_quota_reserved}
      assert:
      - 'setup: request 1 clears with sustainability_score == 60.00 / FINAL (min(100, 40 + 10 + 0.25*80.00 + 5) - 0 - 20*((0 + 3)/4)), quota_units_reserved == 3 and Species.wild_take_quota_reserved == 3'
      - 'trigger[1]: clearing request 2 returns 409 ERR_QUOTA_EXCEEDED because 3 + 2 > 4; the request stays PENDING_PERMIT with quota_units_reserved == 0 and its score still PROVISIONAL 70.00'
      - 'trigger[2]: cancellation returns status CANCELLED with closure_reason == ''CURATOR_CANCELLED'', quota_units_reserved == 0, and Species.wild_take_quota_reserved back to 0 — the exact 3 units are returned, not a recomputed guess'
      - 'trigger[3]: the cancelled request''s ISSUED permit is now REVOKED with decision_reason == ''ACQUISITION_CANCELLED'''
      - 'trigger[5]: request 2 now clears with sustainability_score == 65.00 / FINAL (same terms but 20*((0 + 2)/4)) — 5.00 higher than it would have scored under the un-released quota'
      - 'trigger[6]: Species.wild_take_quota_reserved == 2 and Species.version has been incremented by the clearance and by the cancellation, so each clearance needs a freshly read expected_species_version'
      - 'request 1 stays terminal at CANCELLED: a second cancellation returns 409 ERR_ENTITY_TERMINAL and its quota is never released twice'
