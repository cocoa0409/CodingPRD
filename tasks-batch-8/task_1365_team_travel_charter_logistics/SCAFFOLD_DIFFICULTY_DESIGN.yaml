            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/countersign"
