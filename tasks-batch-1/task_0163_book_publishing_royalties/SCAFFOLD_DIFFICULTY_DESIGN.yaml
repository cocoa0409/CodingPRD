scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_after_reserve_liquidation
        grounds:
          - calculations.reserve_liquidation
          - calculations.statement_reconciliation
          - state_machines.AuthorStatement.DRAFT_to_FINALIZED
          - entities.AuthorStatement.fields.reserve_released_cents
          - entities.AuthorStatement.fields.royalty_credited_cents
        distinguishing_aspect: |
          Subject is the AuthorStatement/royalty domain: the period-1 statement's royalty_credited_cents
          excludes the reserve (provisional, reserve withheld = 468750), while the period-3 statement that
          liquidates that same reserve cohort credits reserve_released_cents=281250 — two different committed
          numbers for the same withheld dollars on the Statement entity.
        test_recipe:
          setup:
            - "ACTIVE contract C (advance=2000000, commission_pct=0.15, reserve_pct=0.25, reserve_hold_periods=2) with tiers [1..5000]=0.10,[5001..10000]=0.125,[10001..]=0.15, title T published, HARDCOVER format F at 3000 cents."
            - "Period seq1 net 6000 sold -> statement S1 FINALIZED: reserve R1 held=468750, units=1500, unit_value=312.5, eligible_seq=3."
            - "Period seq2 net 5000 with 400 returns, statement S2 FINALIZED. Period seq3 with 200 returns, CLOSED."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A One", email: "a1@x.com", tax_withholding_pct: 0 }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /agents"
              payload: { agency_name: "Ag One", email: "ag1@x.com" }
              as: Publisher
              captures: { agent_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", agent_id: "${agent_id}", advance_cents: 2000000, agent_commission_pct: 0.15, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, upper_unit: 5000, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 5001, upper_unit: 10000, rate: 0.125 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 10001, rate: 0.15 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book One", edition: 1 }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 6000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
              captures: { s1_royalty_credited: $.data.royalty_credited_cents }
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P2", sequence: 2 }
              as: Publisher
              captures: { p2_id: $.data.id }
            - call: "POST /sales-periods/${p2_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 5000, units_returned: 400 }
              as: Publisher
            - call: "POST /sales-periods/${p2_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p2_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s2_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv2: $.data.version }
            - call: "POST /statements/${s2_id}/finalize"
              payload: { expected_contract_version: "${cv2}" }
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P3", sequence: 3 }
              as: Publisher
              captures: { p3_id: $.data.id }
            - call: "POST /sales-periods/${p3_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 1000, units_returned: 200 }
              as: Publisher
            - call: "POST /sales-periods/${p3_id}/close"
              payload: {}
              as: Publisher
          trigger:
            - call: "POST /sales-periods/${p3_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s3_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv3: $.data.version }
            - call: "POST /statements/${s3_id}/finalize"
              payload: { expected_contract_version: "${cv3}" }
              as: Publisher
              captures: { s3_released: $.data.reserve_released_cents }
          assert:
            - "AuthorStatement.${s1_id}.royalty_credited_cents == 1406250"
            - "AuthorStatement.${s1_id}.reserve_held_cents == 468750"
            - "AuthorStatement.${s3_id}.reserve_released_cents == 281250"
            - "ReturnsReserve originating from ${s1_id} has status == LIQUIDATED with consumed_cents == 187500 and released_cents == 281250"

      - name: agent_commission_base_net_payable_vs_gross_earnings
        grounds:
          - calculations.statement_reconciliation
          - entities.Contract.fields.agent_commission_pct
          - entities.AuthorStatement.fields.agent_commission_cents
          - entities.AuthorStatement.fields.payable_before_commission_cents
        distinguishing_aspect: |
          Subject is the Contract/agent-commission domain (a different entity than instance 1's Statement-royalty
          domain): commission base is payable_before_commission_cents=2406250 -> commission 360938, NOT
          period_earnings_cents=4406250 -> 660938; the canonical post-recoupment base is observable on the statement.
        test_recipe:
          setup:
            - "ACTIVE contract C (advance=2000000, commission_pct=0.15) with one FOREIGN subsidiary right proceeds=4000000 author_share=0.75 (author_income=3000000), period seq1 net 6000 -> royalty_credited 1406250."
            - "Statement S1 CLOSED period, ready to finalize; period_earnings = 1406250 + 0 + 3000000 = 4406250; advance fully recoups 2000000."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Two", email: "a2@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /agents"
              payload: { agency_name: "Ag Two", email: "ag2@x.com" }
              as: Publisher
              captures: { agent_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", agent_id: "${agent_id}", advance_cents: 2000000, agent_commission_pct: 0.15, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, upper_unit: 5000, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 5001, upper_unit: 10000, rate: 0.125 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 10001, rate: 0.15 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Two" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "FOREIGN", proceeds_cents: 4000000, author_share_pct: 0.75 }
              as: Publisher
              captures: { right_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 6000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv}" }
              as: Publisher
              captures: { commission: $.data.agent_commission_cents }
          assert:
            - "AuthorStatement.${s1_id}.period_earnings_cents == 4406250"
            - "AuthorStatement.${s1_id}.advance_recouped_cents == 2000000"
            - "AuthorStatement.${s1_id}.payable_before_commission_cents == 2406250"
            - "AuthorStatement.${s1_id}.agent_commission_cents == 360938"
            - "AuthorStatement.${s1_id}.agent_commission_cents != 660938"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_royalty_escalator_three_input_nonlinear
        grounds:
          - calculations.tiered_royalty_escalator
          - entities.RoyaltyTier.fields.rate
          - entities.Contract.fields.lifetime_net_units
          - entities.Format.fields.list_price_cents
        distinguishing_aspect: |
          Mode (a): the escalator combines >=3 inputs (cum_before=lifetime_net_units, period net_units, list_price,
          and per-tier rate) with non-linear tier selection — period-2 net 5000 starting at cum_before=6000 straddles
          tier2 and tier3, yielding gross_royalty_cents=1950000 (4000@0.125 + 1000@0.15 of 3000), not a single-rate product.
        test_recipe:
          setup:
            - "ACTIVE contract C tiers [1..5000]=0.10,[5001..10000]=0.125,[10001..]=0.15, HARDCOVER 3000c."
            - "Period seq1 net 6000 FINALIZED (lifetime_net_units becomes 6000). Period seq2 net 5000 CLOSED."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Three", email: "a3@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0.25, reserve_hold_periods: 2 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, upper_unit: 5000, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 5001, upper_unit: 10000, rate: 0.125 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 10001, rate: 0.15 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Three" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 6000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P2", sequence: 2 }
              as: Publisher
              captures: { p2_id: $.data.id }
            - call: "POST /sales-periods/${p2_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 5000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p2_id}/close"
              payload: {}
              as: Publisher
          trigger:
            - call: "POST /sales-periods/${p2_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s2_id: $.data.id, s2_gross: $.data.gross_royalty_cents }
          assert:
            - "AuthorStatement.${s2_id}.gross_royalty_cents == 1950000"
            - "Contract.${contract_id}.lifetime_net_units == 6000"

      - name: per_format_then_sum_rounding_order_pinned
        grounds:
          - calculations.tiered_royalty_escalator
          - calculations.tiered_royalty_escalator.variants.per_format_then_sum
          - entities.Format.fields.list_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order. Two formats each priced 333c selling 1 unit at tier-1 rate 0.10 give
          per-unit 33.3c; per_format_then_sum = round(33.3)+round(33.3) = 33+33 = 66, whereas sum-then-round once
          = round(66.6) = 67. The scaffold pins per_format_then_sum so gross_royalty_cents == 66, not 67.
        test_recipe:
          setup:
            - "ACTIVE contract C tiers [1..]=0.10 (single open tier), title T with two formats HARDCOVER@333c and EBOOK@333c."
            - "Period seq1: 1 unit sold of each format, CLOSED."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Four", email: "a4@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Four" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 333 }
              as: Publisher
              captures: { fa_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "EBOOK", list_price_cents: 333 }
              as: Publisher
              captures: { fb_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${fa_id}", units_sold: 1, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${fb_id}", units_sold: 1, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
          trigger:
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id, gross: $.data.gross_royalty_cents }
          assert:
            - "AuthorStatement.${s1_id}.gross_royalty_cents == 66"
            - "AuthorStatement.${s1_id}.gross_royalty_cents != 67"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: statement_branching_draft_finalized_paid_divergent_side_effects
        grounds:
          - state_machines.AuthorStatement.DRAFT_to_FINALIZED
          - state_machines.AuthorStatement.FINALIZED_to_PAID
          - entities.AuthorStatement.fields.status
          - entities.AuthorStatement.fields.tax_withheld_cents
        distinguishing_aspect: |
          AuthorStatement is a branching machine: DRAFT->FINALIZED commits royalty/recoupment/reserve side-effects
          (no tax), while FINALIZED->PAID fires a divergent side-effect set (tax_withheld_cents computed, final
          NET_PAYABLE line) — the two forward edges carry different side-effects on the same entity.
        test_recipe:
          setup:
            - "ACTIVE contract C (advance=0, commission_pct=0, reserve_pct=0, author tax_withholding_pct=0.10), HARDCOVER 3000c."
            - "Period seq1 net 1000 -> statement S1 FINALIZED (gross 300000, reserve_pct=0 so royalty_credited 300000, payable 300000, commission 0)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Five", email: "a5@x.com", tax_withholding_pct: 0.10 }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, agent_commission_pct: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Five" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 1000, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/generate-statement"
              payload: {}
              as: Publisher
              captures: { s1_id: $.data.id }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv1: $.data.version }
            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
              captures: { tax_at_finalize: $.data.tax_withheld_cents }
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Publisher
              captures: { cv2: $.data.version }
            - call: "POST /statements/${s1_id}/pay"
              payload: { expected_contract_version: "${cv2}" }
              as: Publisher
              captures: { tax_at_pay: $.data.tax_withheld_cents, status: $.data.status }
          assert:
            - "AuthorStatement.${s1_id}.tax_withheld_cents == 0 immediately after finalize (tax not applied on FINALIZE edge)"
            - "AuthorStatement.${s1_id}.tax_withheld_cents == 30000 after pay"
            - "AuthorStatement.${s1_id}.net_to_author_cents == 270000 after pay"
            - "AuthorStatement.${s1_id}.status == PAID"

      - name: subsidiary_right_branching_statemented_or_void
        grounds:
          - state_machines.SubsidiaryRight.REGISTERED_to_STATEMENTED
          - state_machines.SubsidiaryRight.REGISTERED_to_VOID
          - entities.SubsidiaryRight.fields.status
        distinguishing_aspect: |
          SubsidiaryRight (a different entity than AuthorStatement) is a fork: REGISTERED branches to either
          STATEMENTED (credited on a finalize) or VOID (cancelled), each terminal with a divergent side-effect set
          (statement_id stamp + income credit vs income permanently excluded).
        test_recipe:
          setup:
            - "ACTIVE contract C with two FOREIGN rights R_void and R_keep both REGISTERED, period seq1 net 100 CLOSED."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Six", email: "a6@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Six" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "FOREIGN", proceeds_cents: 1000000, author_share_pct: 0.50 }
              as: Publisher
              captures: { r_void_id: $.data.id }
            - call: "POST /contracts/${contract_id}/subsidiary-rights"
              payload: { right_type: "AUDIO", proceeds_cents: 800000, author_share_pct: 0.50 }
              as: Publisher
              captures: { r_keep_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /titles/${title_id}/publish"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 100, units_returned: 0 }
              as: Publisher
            - call: "POST /sales-periods/${p1_id}/close"
              payload: {}
