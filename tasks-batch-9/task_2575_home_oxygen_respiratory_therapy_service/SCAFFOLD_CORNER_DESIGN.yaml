          assert:
            - "${e1} == ERR_NO_ELIGIBLE_EQUIPMENT with HTTP 409, and no Placement row is created: GET /home-oxygen/placements?contract_id=${c_id} returns total_count 0 at that point"
            - "${u_low} is excluded by max_continuous_lpm 2.5 < 3.0; ${u_stale} by next_pm_due_date 2026-07-15 < the clock's date 2026-08-01"
            - "${u_recalled} is still status IN_STOCK — a CLASS_III notice quarantines nothing, auto_quarantined_unit_count is 0 on ${rc_id} — yet it is excluded because an OPEN RecallNotice names its model_code"
