            - "after day rollover, same sale apply-coupon succeeds: Sale.${s3}.applied_coupon_id == ${coupon_id}"
            - "Coupon.${coupon_id}.usage_records count for customer == 2 (completed redemptions only)"

      - name: store_dock_capacity_equality_allowed
        grounds:
          - calculations.daily_receiving_capacity
          - errors[ERR_STORE_DOCK_CAPACITY_EXCEEDED]
