            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Portion doubled" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Sandwich as served", role: "BASE", grams: 100, calories_per_100g: 400, sodium_mg_per_100g: 200, added_sugar_g_per_100g: 0, allergen_group: "WHEAT", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
