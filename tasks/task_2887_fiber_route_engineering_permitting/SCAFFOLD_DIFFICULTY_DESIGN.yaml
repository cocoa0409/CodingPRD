              as: PoleOwner
              as_user_id: "telco-owner-1"
          trigger:
            - call: "POST /pole-attachment-applications/${paa_id}/accept-make-ready"
              payload: {}
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 422 and $.data.error_id == ERR_MAKE_READY_REQUIRED"
            - "$.data.error_id != ERR_BUDGET_EXCEEDED and the status is not 402, even though make_ready_cost_cents 35000 > budget_available_cents 10000"
            - "PoleAttachmentApplication.${paa_id}.status == MAKE_READY_ESTIMATED and committed == false"
            - "PoleAttachmentApplication.${paa_id}.make_ready_cost_cents == 35000"
            - "Route.${route_id}.budget_committed_cents == 0 and budget_available_cents == 10000"
            - "Route.${route_id}.budget_authorized_cents == Route.${route_id}.budget_committed_cents + Route.${route_id}.budget_available_cents"

      - name: permit_state_gate_precedes_moratorium_conflict_gate
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - errors[ERR_INVALID_PERMIT_STATE]
          - errors[ERR_MORATORIUM_WINDOW_CONFLICT]
          - state_machines.PermitApplication.terminal_states
        distinguishing_aspect: |
          A DIFFERENT error-category pair from make_ready_safety_gate_precedes_budget_gate: state (priority 11,
          ERR_INVALID_PERMIT_STATE, 409) against business_temporal (priority 15, ERR_MORATORIUM_WINDOW_CONFLICT, 409) —
          same HTTP status on both sides, so only the error_id distinguishes which gate ran first, and the state gate must win.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Mill Street Spur' (SPUR), budget_authorized_cents 90000000"
            - "one RouteSegment: sequence_index 1, street_name 'Mill Street', municipality_code 'MUN-014', length_feet 250, terrain_class URBAN_PAVED, with an ACCEPTED walkout"
            - "the Route is SCOPE_LOCKED"
            - "one MUNICIPAL_ROW PermitApplication with work window 2026-10-05..2026-10-12 was submitted and then APPROVED, so it sits in the terminal state APPROVED and the segment is permit_status CLEARED"
            - "a MoratoriumWindow was then registered on MUN-014 / 'Mill Street' running 2026-06-01..2026-12-01 with moratorium_class NO_OPEN_CUT, which fully contains that permit's work window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Mill Street Spur", topology_objective: "SPUR", target_in_service_date: "2027-05-01", budget_authorized_cents: 90000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Mill Street", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-10-05", planned_work_end_on: "2026-10-12", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "mill street aerial" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-501", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-10-05", work_window_end_on: "2026-10-12" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /permit-applications/${p1_id}/review"
              payload: { decision: "APPROVED", decision_note: "approved as filed" }
              as: AuthorityReviewer
              as_user_id: "city-reviewer-1"
            - call: "POST /moratorium-windows"
              payload: { municipality_code: "MUN-014", street_name: "Mill Street", resurfaced_on: "2026-06-01", starts_on: "2026-06-01", ends_on: "2026-12-01", moratorium_class: "NO_OPEN_CUT", ordinance_reference: "ORD-2026-118" }
              as: NetworkRecordsAdmin
              captures: { mw_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 409 and $.data.error_id == ERR_INVALID_PERMIT_STATE"
            - "$.data.error_id != ERR_MORATORIUM_WINDOW_CONFLICT, even though the permit's 2026-10-05..2026-10-12 window lies inside the 2026-06-01..2026-12-01 NO_OPEN_CUT window"
            - "PermitApplication.${p1_id}.status == APPROVED and revision_round == 0"
            - "PermitApplication.${p1_id}.review_days == 21 and decision_due_at == 2026-08-31T00:00:00Z, both unchanged"
            - "RouteSegment.${seg_id}.permit_status == CLEARED"
            - "Route.${route_id}.status == PERMITTING"

  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spare_fiber_ratio_exactly_at_minimum_passes_stamp
        grounds:
          - validations[priority=22]
          - calculations.design_fiber_allocation
          - entities.DesignPackage.fields.spare_ratio_bp
          - entities.DesignPackage.fields.reserve_fiber_count
          - state_machines.DesignPackage.transitions.IN_REVIEW_to_STAMPED
          - errors[ERR_SPARE_RATIO_BELOW_MINIMUM]
        distinguishing_aspect: |
          A RATIO-metric boundary: spare_ratio_bp lands on exactly MIN_SPARE_RATIO_BP == 2000 (reserve 48 of allocated
          240) and the stamp must SUCCEED because the gate is >=, whereas one more dropped fiber gives 1958 and fails.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000"
            - "one RouteSegment: sequence_index 1, length_feet 1250, terrain_class URBAN_PAVED, with an ACCEPTED walkout"
            - "the Route is SCOPE_LOCKED, its MUNICIPAL_ROW permit is APPROVED and the segment is permit_status CLEARED"
            - "one DesignPackage revision 1 with fiber_count_allocated 240 and express_fiber_count 40"
            - "four PLACED HANDHOLE SplicePoints on that design at stations 0, 250, 500 and 750, each dropping 38 fibers, so assigned_drop_fiber_count is 152, reserve_fiber_count is 48 and spare_ratio_bp is exactly 2000"
            - "the design is IN_REVIEW, submitted by user eng-alice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 1250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-25", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "aerial run confirmed" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-25" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /permit-applications/${p1_id}/review"
              payload: { decision: "APPROVED", decision_note: "approved as filed" }
              as: AuthorityReviewer
              as_user_id: "city-reviewer-1"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /design-packages"
              payload: { route_id: "${route_id}", fiber_count_allocated: 240, express_fiber_count: 40, expected_route_version: "${rv1}" }
              as: RouteEngineer
              captures: { dp_id: $.data.id }
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 0, enclosure_type: "HANDHOLE", fiber_count_dropped: 38 }
              as: RouteEngineer
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 250, enclosure_type: "HANDHOLE", fiber_count_dropped: 38 }
              as: RouteEngineer
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 500, enclosure_type: "HANDHOLE", fiber_count_dropped: 38 }
              as: RouteEngineer
            - call: "POST /splice-points"
              payload: { design_id: "${dp_id}", segment_id: "${seg_id}", station_feet: 750, enclosure_type: "HANDHOLE", fiber_count_dropped: 38 }
              as: RouteEngineer
              captures: { spare_after_fourth: $.data.status }
            - call: "POST /design-packages/${dp_id}/submit-for-review"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-alice"
          trigger:
            - call: "POST /design-packages/${dp_id}/stamp"
              payload: {}
              as: RouteEngineer
              as_user_id: "eng-bob"
              captures: { stamped_ratio: $.data.spare_ratio_bp }
          assert:
            - "DesignPackage.${dp_id}.assigned_drop_fiber_count == 152"
            - "DesignPackage.${dp_id}.reserve_fiber_count == 48"
            - "DesignPackage.${dp_id}.spare_ratio_bp == 2000"
            - "DesignPackage.${dp_id}.status == STAMPED"
            - "DesignPackage.${dp_id}.stamped_by_user_id == eng-bob and stamped_at == 2026-08-10T00:00:00Z"
            - "DesignPackage.${dp_id}.splice_point_count == 4 and handhole_count == 4"
            - "DesignPackage.${dp_id}.fiber_count_allocated == DesignPackage.${dp_id}.express_fiber_count + DesignPackage.${dp_id}.assigned_drop_fiber_count + DesignPackage.${dp_id}.reserve_fiber_count"
            - "Route.${route_id}.status == CONSTRUCTION_READY"
            - "a fifth fiber on any splice point (assigned 153, reserve 47) would give spare_ratio_bp 1958 and the same stamp would be rejected with ERR_SPARE_RATIO_BELOW_MINIMUM (422)"

      - name: lock_scope_with_zero_segments_hits_empty_collection_boundary
        grounds:
          - validations[priority=19]
          - errors[ERR_ROUTE_HAS_NO_SEGMENTS]
          - state_machines.Route.transitions.PLANNING_to_SCOPE_LOCKED
          - entities.Route.fields.segment_count
          - calculations.route_permitting_complexity_index
        distinguishing_aspect: |
          An EMPTY-COLLECTION boundary rather than a ratio boundary: segment_count is exactly 0, which is one below the
          minimum of 1, so lock-scope must be rejected with ERR_ROUTE_HAS_NO_SEGMENTS and planned_complexity_index must
          stay null instead of being computed as a division by zero.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Greenfield Ring' (RING_CLOSURE) with budget_authorized_cents 50000000, status PLANNING, segment_count 0"
            - "no RouteSegment rows exist at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Greenfield Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-09-01", budget_authorized_cents: 50000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 422 and $.data.error_id == ERR_ROUTE_HAS_NO_SEGMENTS"
            - "Route.${route_id}.status == PLANNING"
            - "Route.${route_id}.segment_count == 0"
            - "Route.${route_id}.scope_locked_at == null"
            - "Route.${route_id}.planned_complexity_index == null and live_complexity_index == null"
            - "no division by Route.segment_count is attempted, so no 500 is returned"

