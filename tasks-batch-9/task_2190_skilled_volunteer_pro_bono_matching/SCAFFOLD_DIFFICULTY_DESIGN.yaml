      - name: window_hours_release_matches_grown_commitment
        grounds:
          - invariants.INV_VOLUNTEER_HOUR_CONSERVATION
          - state_machines.ScopeChangeRequest.status.PENDING_to_APPROVED
          - calculations.scope_change_projection
        distinguishing_aspect: |
          Same forward/compensating shape as instance 1 but on the HOUR quantity, and the
          committed amount MOVES between the forward and the compensating action: an
          AUTO_APPROVABLE ScopeChangeRequest grows the commitment after it was taken, so the
          release must be the grown figure, not the original reservation.
          Arithmetic on window [2026-01-05, 2026-03-01) with hours_offered 300.00:
            required_hours = round(40.00 * 1.00, 2) = 40.00 -> MatchOffer.reserved_hours 40.00
            after /match      -> hours_committed 40.00, hours_remaining round(300.00-40.00,2) = 260.00
            after /accept     -> the hold migrates: Engagement.committed_hours 40.00, window
                                 hours_committed still 40.00, hours_remaining 260.00
            scope change of additional_hours 12.00, additional_deliverable_count 0:
                 projected_creep_pct = round((approved 0.00 + other_open 0.00 + 12.00 - 40.00)/40.00, 4)
                                     = round(-0.7000, 4) = -0.7000
                 -0.7000 < RESCOPE_FLOOR 0.5000 and -0.7000 < MANAGER_FLOOR 0.1500 with zero new
                 deliverables -> decision_tier AUTO_APPROVABLE -> status PENDING -> APPROVED
                 in the same request (gate: hours_remaining 260.00 >= 12.00, satisfied)
            after auto-approval -> Engagement.committed_hours round(40.00+12.00,2) = 52.00,
                                 window hours_committed 52.00,
                                 hours_remaining round(300.00-52.00,2) = 248.00
            after /terminate  -> hours_committed round(52.00-52.00,2) = 0.00,
                                 hours_remaining round(300.00-0.00,2) = 300.00
          The naive implementer releases MatchOffer.reserved_hours (40.00) instead of
          Engagement.committed_hours (52.00), stranding 12.00 hours forever
          (hours_committed 12.00 / hours_remaining 288.00); a second variant releases from a
          float accumulator and lands on 0.01 or -0.01 rather than exactly 0.00, which is why
          the assertion pins the cent digit rather than a tolerance.
