            - "Two further WorkAreas on the same worksite: \"Night Yard\" (lone_worker_flag true, public_access_flag false, night_shift_flag false) and \"Cash Vault\" (public_access_flag true, night_shift_flag true)."
            - "DRAFT PreventionPlan for the worksite; the plan version is re-read before each HazardAssessment create because each create bumps PreventionPlan.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
