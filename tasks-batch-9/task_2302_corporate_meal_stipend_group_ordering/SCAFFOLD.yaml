      - "POST /_clock/set_current_utc"
      - "GET /meal-programs/{id}"
      - "GET /meal-programs/{id}/employee-groups"
      - "GET /meal-programs/{id}/delivery-locations"
      - "GET /meal-programs/{id}/eligible-restaurants"
      - "GET /meal-programs/{id}/forecast"
      - "GET /meal-programs/{id}/expense-exports"
      - "GET /employee-groups/{id}"
      - "GET /employee-groups/{id}/budget-rules"
      - "GET /employees/{id}"
      - "GET /employees"
      - "GET /employees/{id}/imputed-income-records"
      - "GET /restaurants/{id}"
      - "GET /benefit-periods/{id}"
      - "GET /benefit-periods"
      - "GET /orders/{id}"
      - "GET /orders"
      - "POST /orders/{id}/cancel"
      - "GET /orders/{id}/refund-entries"
