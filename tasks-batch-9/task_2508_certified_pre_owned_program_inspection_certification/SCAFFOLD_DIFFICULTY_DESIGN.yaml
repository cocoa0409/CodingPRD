  - rule_id: non_linear_state_machine
    instances:
      - name: vehicle_parallel_cpo_and_inventory_dimensions
        grounds:
          - state_machines.Vehicle.cpo_state
          - state_machines.Vehicle.inventory_state
          - state_machines.Vehicle.inventory_state.IN_INVENTORY_to_RETAIL_SOLD
          - state_machines.Vehicle.inventory_state.RETAIL_SOLD_to_IN_INVENTORY
          - state_machines.Certification.SUBMITTED_to_ACTIVE
          - errors.ERR_VEHICLE_NOT_IN_INVENTORY
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The two Vehicle dimensions are exercised against each other: a RETAIL_SOLD event moves
          inventory_state while cpo_state stays CERTIFICATION_PENDING and the SUBMITTED certification
          is left untouched (the sale cascade only reaches ACTIVE and UNDER_AUDIT rows), yet the one
          declared coupling still bites — approval is refused with ERR_VEHICLE_NOT_IN_INVENTORY until
          a RETURNED_TO_INVENTORY event restores the commercial axis, after which the same approval
          succeeds and only the program axis moves. No other instance drives both axes of one vehicle.
        test_recipe:
          setup:
            - "One dealer, one technician, the published MPI-172 template."
            - "Vehicle V1 (in_service_date 2022-02-01, 62000 miles) with a PASSED inspection, so cpo_state is CERTIFICATION_PENDING and inventory_state is IN_INVENTORY."
            - "Certification C1 exists in status SUBMITTED; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Twin Axis Motors", franchise_code: "FR-6001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Gia Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
