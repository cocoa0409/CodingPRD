              payload: { name: "Zero A", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 0 }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "POST /mrm/models"
              payload: { name: "Zero B", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 0 }
