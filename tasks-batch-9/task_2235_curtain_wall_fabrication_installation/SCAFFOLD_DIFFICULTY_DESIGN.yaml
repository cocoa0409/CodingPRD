- rule_id: resource_temporal_overlap
  instances:
  - name: nested_and_enclosing_hoist_windows_conflict_until_cancellation_frees_the_rig
    grounds:
    - validations[priority=99]
    - state_machines.HoistReservation.RESERVED_to_CANCELLED
    - entities.HoistReservation.fields.blocked_from
    - entities.HoistReservation.fields.blocked_until
    distinguishing_aspect: 'Overlap detection must be symmetric in containment: a window nested strictly inside an existing
      one and a window that strictly encloses it are both rejected, and cancelling the incumbent - not deleting it - is
      what frees the rig, proving the rule filters on status RESERVED/CONSUMED rather than on row existence.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z
      - one rig with changeover_buffer_minutes 45 and two zones of the same package
      - reservation 1 holds 2026-08-10T06:00:00Z -> 2026-08-10T18:00:00Z for zone 1, so its blocked interval is [05:15,
        18:45)
