# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3169_leisure_route_seasonal_scheduling_travel_package_bundling
#
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Reused anchor chains are defined once at the top via YAML anchors.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: station_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Station
          - endpoints.POST_/stations
        distinguishing_aspect: "A station created without single_station_flag stores the default false; id/created_at/updated_at/version are system-stamped and version starts at 1."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkPlanner
          trigger:
            - &c_origin
              call: "POST /stations"
              payload: { iata_code: "SCK", station_kind: "ORIGIN_SMALL_CITY", timezone: "America/Los_Angeles" }
              as: NetworkPlanner
              captures: { st_id: $.data.id, st_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Station.${st_id}.single_station_flag == false (default applied)"
            - "Station.${st_id}.version == 1"
            - "id, created_at, updated_at are present and non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: route_get_round_trips_configuration
        claim_type: Retrieval
        grounds:
          - entities.Route
          - endpoints.GET_/routes/{routeId}
        distinguishing_aspect: "Every stored Route field round-trips unchanged through GET, including the computed route_posture and suspended_seasons_count."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; one route created."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - &c_dest
              call: "POST /stations"
              payload: { iata_code: "SFB", station_kind: "LEISURE_DESTINATION", timezone: "America/New_York" }
              as: NetworkPlanner
              captures: { st_dest: $.data.id }
            - &c_route
              call: "POST /routes"
              payload: { origin_station_id: "${st_id}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /routes/${route_id}"
              payload: {}
              as: CustomerService
          assert:
            - "the response status is 200"
            - "Route.${route_id}.base_fare_cents == 9900 and weekly_frequency_cap == 2"
            - "Route.${route_id}.route_posture == PLANNING"
            - "Route.${route_id}.suspended_seasons_count == 0"

      - name: routes_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/routes
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three routes, limit=2 returns total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup: ["Logical clock set; one origin, one destination, three routes."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - call: "POST /routes"
              payload: { origin_station_id: "${st_id}", destination_station_id: "${st_dest}", base_fare_cents: 8900, weekly_frequency_cap: 1 }
              as: NetworkPlanner
            - call: "POST /routes"
              payload: { origin_station_id: "${st_id}", destination_station_id: "${st_dest}", base_fare_cents: 7900, weekly_frequency_cap: 4 }
              as: NetworkPlanner
          trigger:
            - call: "GET /routes"
              payload: { limit: 2, offset: 0 }
              as: FinanceAnalyst
          assert:
            - "the response returns exactly 2 rows, total_count == 3, has_more == true"
            - "GET /routes?limit=2&offset=2 returns 1 row, total_count == 3, has_more == false"

      - name: flight_instance_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/flight-instances/{flightInstanceId}
          - errors.ERR_FLIGHT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the flight path produces 404 ERR_FLIGHT_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Logical clock set; no flights exist."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /flight-instances/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_FLIGHT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: booking_create_missing_booking_kind_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Booking.fields.booking_kind
          - endpoints.POST_/bookings
        distinguishing_aspect: "booking_kind is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST, distinct from the 422 referential errors."
        test_recipe:
          setup: ["Logical clock set; full pipeline: route, window, publication, flight F1, aircraft."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - &c_window
              call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Spring 2027", window_start_date: "2027-03-01", window_end_date: "2027-03-31" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - &c_activate
              call: "POST /routes/${route_id}/activate"
              payload: {}
              as: NetworkPlanner
            - &c_pub
              call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - &c_flights
              call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
              captures: { f1_id: "$.data[0].id", f1_v0: "$.data[0].version" }
            - &c_ac
              call: "POST /aircraft"
              payload: { tail_number: "N901NV", seat_capacity: 156, daily_utilization_cap_minutes: 480, peak_day_cap_minutes: 720 }
              as: OpsController
              captures: { ac_id: $.data.id }
            - &c_assign
              call: "POST /flight-instances/${f1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_id}" }
              as: OpsController
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: ancillary_kind_out_of_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.AncillaryPurchase.fields.ancillary_kind
          - endpoints.POST_/bookings/{bookingId}/ancillaries
        distinguishing_aspect: "ancillary_kind is a closed enum of four values; LOUNGE_ACCESS is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Logical clock set; full pipeline with one CONFIRMED AIR_ONLY booking."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/ancillaries"
              payload: { ancillary_kind: "LOUNGE_ACCESS", amount_cents: 500 }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /bookings/${bk_id}/ancillaries returns 0 rows"

      - name: seats_sold_is_computed_not_client_settable
        claim_type: Computed Fields
        grounds:
          - entities.FlightInstance.fields.seats_sold
          - endpoints.POST_/routes/{routeId}/publications
        distinguishing_aspect: "FlightInstance.seats_sold is source: computed, initialized 0 at publish; there is no endpoint that accepts seats_sold as input, and any attempt to smuggle it into a publication payload is rejected as an unknown field (400)."
        test_recipe:
          setup: ["Logical clock set; route with OPEN window, activated."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}", seats_sold: 50 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 (unknown field rejected)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: route_activate_from_active_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Route
          - errors.ERR_ROUTE_NOT_PLANNING
        distinguishing_aspect: "Activating a route that is already SEASONAL_ACTIVE is rejected — the trigger is not valid from that state."
        test_recipe:
          setup: ["Logical clock set; route activated."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
          trigger:
            - call: "POST /routes/${route_id}/activate"
              payload: {}
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ROUTE_NOT_PLANNING"
            - "Route.${route_id}.route_posture remains SEASONAL_ACTIVE"

      - name: route_close_with_live_flights_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Route
          - errors.ERR_ROUTE_HAS_LIVE_FLIGHTS
        distinguishing_aspect: "Closing a route while any SCHEDULED flight exists is blocked, even if no bookings exist — the live-flight precondition is evaluated independently."
        test_recipe:
          setup: ["Logical clock set; route with publication and SCHEDULED flight F1; no bookings."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
          trigger:
            - call: "POST /routes/${route_id}/close"
              payload: {}
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ROUTE_HAS_LIVE_FLIGHTS"
            - "Route.${route_id}.route_posture remains SEASONAL_ACTIVE"

      - name: flight_cascade_releases_crew_assignments
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FlightInstance
          - state_machines.CrewAssignment
        distinguishing_aspect: "Cancelling a flight via disruption releases its crew assignments as part of the cascade."
        test_recipe:
          setup: ["Logical clock set; route, window, publication, flight F1, aircraft; crew base at origin; captain assigned to F1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /crew-bases"
              payload: { base_station_id: "${st_id}", base_code: "SCK" }
              as: CrewScheduler
              captures: { cb_id: $.data.id }
            - call: "POST /crew-bases/${cb_id}/members"
              payload: { employee_number: "E1001", crew_role: "CAPTAIN" }
              as: CrewScheduler
              captures: { cm_id: $.data.id }
            - call: "POST /flight-instances/${f1_id}/crew-assignments"
              payload: { crew_member_id: "${cm_id}" }
              as: CrewScheduler
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "CREW_SHORTAGE" }
              as: OpsController
          assert:
            - "CrewAssignment.${asg_id}.assignment_status == RELEASED"
            - "FlightInstance.${f1_id}.flight_status == CANCELLED"

      - name: ancillary_void_from_voided_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.AncillaryPurchase
          - errors.ERR_ANCILLARY_NOT_ACTIVE
        distinguishing_aspect: "Voiding the same ancillary twice: the second void observes purchase_status VOIDED and is rejected — terminal states lock down."
        test_recipe:
          setup: ["Logical clock set; full pipeline; CONFIRMED booking with one ACTIVE ancillary."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/ancillaries"
              payload: { ancillary_kind: "CHECKED_BAG", amount_cents: 3500 }
              as: CustomerService
              captures: { anc_id: $.data.id }
            - call: "POST /bookings/${bk_id}/ancillaries/${anc_id}/void"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /bookings/${bk_id}/ancillaries/${anc_id}/void"
              payload: {}
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ANCILLARY_NOT_ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: stranded_until_null_when_no_later_flight
        claim_type: Correct Result
        grounds:
          - calculations.stranded_until_date
        distinguishing_aspect: "When the cancelled flight is the LAST scheduled flight on the route, the candidate set is empty and stranded_until_date is null — the empty-set branch of the selector."
        test_recipe:
          setup: ["Logical clock set; route with publication emitting exactly one flight F1; one booking on F1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "WEATHER" }
              as: OpsController
          assert:
            - "Booking.${bk_id}.booking_status == STRANDED"
            - "Booking.${bk_id}.stranded_until_date is null (no later SCHEDULED flight exists)"

      - name: publish_horizon_boundary_180_days_allowed
        claim_type: Precision
        grounds:
          - calculations.publish_horizon_check
          - errors.ERR_PUBLISH_HORIZON_VIOLATION
        distinguishing_aspect: "first_operating_date exactly 180 days after the logical clock date is allowed (== passes); 179 days is rejected."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; route activated; window 2027-01-01..2027-04-30 (contains 2027-02-28 which is exactly 180 days after 2026-09-01)."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - call: "POST /routes/${route_id}/season-windows"
              payload: { season_label: "Wide", window_start_date: "2027-01-01", window_end_date: "2027-04-30" }
              as: NetworkPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - *c_activate
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-02-28", last_operating_date: "2027-02-28", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_ok: $.data.id }
            - call: "GET /routes/${route_id}/season-windows/${window_id}"
              payload: {}
              as: NetworkPlanner
              captures: { window_v1: $.data.version }
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [6], first_operating_date: "2027-02-27", last_operating_date: "2027-02-27", departure_time_local: "09:00", block_minutes: 240, expected_window_version: "${window_v1}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the first publish succeeds (180 days == PUBLISH_HORIZON_MIN_DAYS, boundary allowed)"
            - "the second publish fails with 422 ERR_PUBLISH_HORIZON_VIOLATION (179 days < 180)"

  # ===========================================================================
  - section: validations
    instances:
      - name: route_creation_kind_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors.ERR_ROUTE_ENDPOINT_KIND_MISMATCH
        distinguishing_aspect: "Creating a route whose origin is a LEISURE_DESTINATION station violates the endpoint-kind rule."
        test_recipe:
          setup: ["Logical clock set; two stations with swapped kinds."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
          trigger:
            - call: "POST /routes"
              payload: { origin_station_id: "${st_dest}", destination_station_id: "${st_id}", base_fare_cents: 9900, weekly_frequency_cap: 2 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ROUTE_ENDPOINT_KIND_MISMATCH"

      - name: crew_base_mismatch_rejected_on_assignment
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_CREW_BASE_MISMATCH
        distinguishing_aspect: "A crew member based at a station other than the route origin cannot be assigned to a flight on that route (crew basing supports the dispersed network)."
        test_recipe:
          setup: ["Logical clock set; full pipeline; crew base at the DESTINATION station (SFB), member hired there."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /crew-bases"
              payload: { base_station_id: "${st_dest}", base_code: "SFB" }
              as: CrewScheduler
              captures: { cb_wrong: $.data.id }
            - call: "POST /crew-bases/${cb_wrong}/members"
              payload: { employee_number: "E2002", crew_role: "FIRST_OFFICER" }
              as: CrewScheduler
              captures: { cm_wrong: $.data.id }
          trigger:
            - call: "POST /flight-instances/${f1_id}/crew-assignments"
              payload: { crew_member_id: "${cm_wrong}" }
              as: CrewScheduler
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CREW_BASE_MISMATCH"

      - name: package_booking_with_wrong_kind_offer_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_OFFER_WRONG_KIND
        distinguishing_aspect: "Passing a RENTAL_CAR offer in the hotel_offer_id slot is rejected — the component kind must match the bundle slot."
        test_recipe:
          setup: ["Logical clock set; full pipeline; one RENTAL_CAR offer for the destination."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /supplier-offers"
              payload: { supplier_code: "CAR-SFB-1", component_kind: "RENTAL_CAR", destination_station_id: "${st_dest}", net_cost_cents: 3000, sell_price_cents: 6000 }
              as: FinanceAnalyst
              captures: { off_car: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${off_car}", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OFFER_WRONG_KIND"

      - name: settlement_finalize_before_period_end_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_11
          - errors.ERR_SETTLEMENT_PERIOD_OPEN
        distinguishing_aspect: "Finalizing while the logical clock is still inside the settlement window is rejected — the window must be fully in the past."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; PROVISIONAL settlement for 2027-03-01..2027-03-31; clock advanced only to 2027-03-31T12:00:00Z (still on period_end_date, not strictly after)."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /supplier-settlements"
              payload: { supplier_code: "HTL-SFB-1", period_start_date: "2027-03-01", period_end_date: "2027-03-31" }
              as: FinanceAnalyst
              captures: { stl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-31T12:00:00Z" }
              as: FinanceAnalyst
          trigger:
            - call: "POST /supplier-settlements/${stl_id}/finalize"
              payload: {}
              as: FinanceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SETTLEMENT_PERIOD_OPEN"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: publication_generates_flight_instances_per_day_mask
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/routes/{routeId}/publications
          - entities.FlightInstance
        distinguishing_aspect: "Publishing [1,4] over 2027-03-01..2027-03-11 generates exactly 4 FlightInstances (Mon 03-01, Thu 03-04, Mon 03-08, Thu 03-11), all SCHEDULED with seats_sold 0."
        test_recipe:
          setup: ["Logical clock set; route activated; OPEN window covering March 2027."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1, 4], first_operating_date: "2027-03-01", last_operating_date: "2027-03-11", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
            - call: "GET /flight-instances"
              payload: { publication_id: "${pub_id}" }
              as: OpsController
          assert:
            - "exactly 4 FlightInstances exist for the publication"
            - "flight dates are 2027-03-01, 2027-03-04, 2027-03-08, 2027-03-11"
            - "every instance has flight_status == SCHEDULED and seats_sold == 0"

      - name: booking_bundle_subresource_returns_zero_or_one_rows
        claim_type: Computed read
        grounds:
          - endpoints.GET_/bookings/{bookingId}/bundle
        distinguishing_aspect: "GET /bookings/{id}/bundle returns an array: length 0 for AIR_ONLY bookings, length 1 for PACKAGE bookings — clients handle one shape."
        test_recipe:
          setup: ["Logical clock set; full pipeline; one AIR_ONLY booking B_air and one PACKAGE booking B_pkg."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
            - call: "POST /supplier-offers"
              payload: { supplier_code: "HTL-SFB-1", component_kind: "HOTEL", destination_station_id: "${st_dest}", net_cost_cents: 12000, sell_price_cents: 20000 }
              as: FinanceAnalyst
              captures: { off_h: $.data.id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_air: $.data.id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "PACKAGE", hotel_offer_id: "${off_h}", expected_flight_version: "${f1_v0} + 1" }
              as: CustomerService
              captures: { bk_pkg: $.data.id }
          trigger:
            - call: "GET /bookings/${bk_air}/bundle"
              payload: {}
              as: CustomerService
            - call: "GET /bookings/${bk_pkg}/bundle"
              payload: {}
              as: CustomerService
          assert:
            - "GET bundle for the AIR_ONLY booking returns an array of length 0"
            - "GET bundle for the PACKAGE booking returns an array of length 1 with bundle_status == ACTIVE"

  # ===========================================================================
  - section: errors
    instances:
      - name: disruption_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REBOOK_FLIGHT_INVALID
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / rebook_gated_by_target_flight_scheduled
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: stale_version_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_referential_vs_business_constraint_on_package_booking
          rationale: "OCC error path exercised in the named §1.8 instance's suppressed branch; direct OCC assertion lives in cross_cutting_occ_stale_booking_create below."

      - name: utilization_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UTILIZATION_CAP_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / aircraft_daily_utilization_point_capacity
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: frequency_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FREQUENCY_CAP_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / weekly_frequency_cap_aggregate_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: customer_service_cannot_create_route
        claim_type: rbac_denial
        grounds:
          - roles.CustomerService
          - roles.NetworkPlanner
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Route creation is NetworkPlanner-exclusive; CustomerService is denied with 403 even with valid input."
        test_recipe:
          setup: ["Logical clock set; two stations."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
          trigger:
            - call: "POST /routes"
              payload: { origin_station_id: "${st_id}", destination_station_id: "${st_dest}", base_fare_cents: 9900, weekly_frequency_cap: 2 }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: finance_analyst_cannot_declare_disruption
        claim_type: rbac_denial
        grounds:
          - roles.FinanceAnalyst
          - roles.OpsController
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Disruption declaration is OpsController-exclusive; FinanceAnalyst is denied with 403."
        test_recipe:
          setup: ["Logical clock set; full pipeline with SCHEDULED flight F1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
          trigger:
            - call: "POST /routes/${route_id}/disruptions"
              payload: { flight_instance_id: "${f1_id}", reason_code: "WEATHER" }
              as: FinanceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "FlightInstance.${f1_id}.flight_status remains SCHEDULED"

      - name: crew_scheduler_can_read_anything_but_not_book
        claim_type: rbac_denial
        grounds:
          - roles.CrewScheduler
          - roles.CustomerService
        distinguishing_aspect: "CrewScheduler's shared GET surface is broad, but POST /bookings is CustomerService-exclusive — read access does not imply write access."
        test_recipe:
          setup: ["Logical clock set; full pipeline with SCHEDULED flight F1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
          trigger:
            - call: "GET /flight-instances/${f1_id}"
              payload: {}
              as: CrewScheduler
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CrewScheduler
              captures: { err: $.data.error_id }
          assert:
            - "the GET succeeds with 200"
            - "the POST is denied with 403 ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_headers_rejected
        claim_type: rbac_denial
        grounds:
          - validations.priority_1
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without X-User-Role is rejected at priority 1 before any role check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /routes"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: cross_cutting_occ_stale_booking_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-flight]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Booking creation against a flight whose version has advanced since the client read it is rejected 412; the happy path with the current version succeeds and bumps the flight's version."
        test_recipe:
          setup: ["Logical clock set; full pipeline with SCHEDULED flight F1 (version v)."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_ok: $.data.id }
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 1, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "the first booking succeeds (201) and FlightInstance.${f1_id}.version advanced"
            - "the second booking with the same stale version is rejected 412 ERR_STALE_VERSION"

      - name: cross_cutting_occ_stale_publication_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[publication-create-stale-window]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Publication creation against a window whose version advanced (because a prior publication bumped it) is rejected 412 when the client reuses the pre-bump version."
        test_recipe:
          setup: ["Logical clock set; route activated with OPEN window (version v0); one successful publication already bumped the window to v0+1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [5], first_operating_date: "2027-03-05", last_operating_date: "2027-03-05", departure_time_local: "12:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION (window version advanced past ${window_v0})"

      - name: cross_cutting_clock_default_is_fixed
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call, the logical clock reads exactly 2026-09-01T00:00:00Z — publish-horizon checks are deterministic without setting the clock."
        test_recipe:
          setup: ["Empty database; clock NEVER set."]
          setup_api_calls:
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
          trigger:
            - call: "POST /routes/${route_id}/publications"
              payload: { season_window_id: "${window_id}", operating_days_mask: [1], first_operating_date: "2027-03-01", last_operating_date: "2027-03-01", departure_time_local: "07:30", block_minutes: 240, expected_window_version: "${window_v0}" }
              as: NetworkPlanner
              captures: { pub_id: $.data.id }
          assert:
            - "the publish succeeds — 2027-03-01 is 181 days after the default clock 2026-09-01, satisfying the 180-day horizon without any clock call"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: booking_creation_immediately_reflects_in_flight_and_list
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - entities.FlightInstance.fields.seats_sold
        distinguishing_aspect: "Immediate consistency: the booking-creation response and a subsequent GET on the flight both reflect the seat consumption in the same request/response cycle — no eventual-consistency lag."
        test_recipe:
          setup: ["Logical clock set; full pipeline with SCHEDULED flight F1."]
          setup_api_calls:
            - *c_clock
            - *c_origin
            - *c_dest
            - *c_route
            - *c_window
            - *c_activate
            - *c_pub
            - *c_flights
            - *c_ac
            - *c_assign
          trigger:
            - call: "POST /bookings"
              payload: { flight_instance_id: "${f1_id}", passenger_count: 2, booking_kind: "AIR_ONLY", expected_flight_version: "${f1_v0}" }
              as: CustomerService
              captures: { bk_id: $.data.id }
            - call: "GET /flight-instances/${f1_id}"
              payload: {}
              as: CustomerService
            - call: "GET /bookings"
              payload: { flight_instance_id: "${f1_id}", booking_status: "CONFIRMED" }
              as: CustomerService
          assert:
            - "FlightInstance.${f1_id}.seats_sold == 2 immediately after creation"
            - "the bookings list filtered by flight_instance_id and CONFIRMED contains exactly 1 row: ${bk_id}"
