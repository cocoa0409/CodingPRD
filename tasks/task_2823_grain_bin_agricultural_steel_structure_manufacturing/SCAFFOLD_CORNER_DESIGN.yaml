      - name: aeration_package_that_needs_more_than_the_maximum_fan_bank_is_rejected_at_order_time
        claim_type: violation_to_error
        grounds:
          - validations.p13
          - errors.ERR_AERATION_UNDERSIZED
          - calculations.aeration_and_drying_capacity
        distinguishing_aspect: "The rejection is computed from the UNSATURATED raw airflow, before any MAX_FAN_CFM clamp: 99754.62109184 CFM for a full drying package on a 3149.38 m3 rice bin at 17.0 percent moisture. An implementation that clamps first and then compares would see 60000 and accept the order, so the only observable difference is whether the order is created at all. The identical design with the AERATION package needs 18137.20383488 raw CFM and is accepted, and with NONE it is accepted with zero airflow - three outcomes on one design, differing only in the package multiplier 5.5, 1.0 and 0.0."
        test_recipe:
          setup:
            - "Jurisdiction IA-CENTRAL (min wind 105), GrainProfile RICE (579 kg/m3, k 0.50, max_safe_moisture_pct 13.0, cfm base 3.2, drying_multiplier 5.5), CoatingSpec G115 (max moisture 18.0)."
            - "Engineer PE-1001, Dealer Alpha."
            - "BinDesign D_RICE: 15.5 m x 15.2 m, 110 mph, moisture 17.0, ASD, with capacity_m3 3149.38."
            - "Logical clock at the default 2026-08-01T00:00:00Z (OFFSEASON)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "IA-CENTRAL", name: "Iowa Central", seal_required: true, min_design_wind_speed_mph: 105, seismic_design_category: "B", permit_review_days: 21 }
              as: PlantAdmin
              captures: { j_ia_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "RICE", bulk_density_kg_per_m3: 579, janssen_k_ratio: 0.50, max_safe_moisture_pct: 13.0, aeration_cfm_per_m3_base: 3.2, drying_multiplier: 5.5 }
              as: PlantAdmin
              captures: { gp_rice_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ia_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ia_id}", grain_profile_id: "${gp_rice_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 15.5, eave_height_m: 15.2, roof_pitch_deg: 30, design_wind_speed_mph: 110, moisture_pct: 17.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { dr_id: $.data.id, dr_cap: $.data.capacity_m3 }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${dr_id}", order_season: "OFFSEASON", aeration_package: "DRYING_FULL", unload_system: "SWEEP_AUGER" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { e_aer: $.data.error_id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${dr_id}", order_season: "OFFSEASON", aeration_package: "AERATION", unload_system: "SWEEP_AUGER" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_aer_id: $.data.id, o_aer_cfm: $.data.required_fan_cfm }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${dr_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_none_id: $.data.id, o_none_cfm: $.data.required_fan_cfm, o_none_hours: $.data.drying_hours_estimate }
            - call: "GET /dealer-orders"
              payload: { bin_design_id: "${dr_id}", limit: 10, offset: 0 }
              as: PlantAdmin
              captures: { total: $.total_count }
          assert:
            - "the design reports capacity_m3 3149.38"
            - "the DRYING_FULL order returns HTTP 422 with error_id ERR_AERATION_UNDERSIZED, because raw CFM 3149.38 * 3.2 * 5.5 * 1.216 * 1.48 == 99754.62109184 exceeds MAX_FAN_CFM 60000"
            - "the AERATION order returns HTTP 201 with required_fan_cfm 18138, since its raw 18137.20383488 is under the maximum"
            - "the NONE order returns HTTP 201 with required_fan_cfm 0 and drying_hours_estimate 0, and its kit carries no AERATION_FAN line"
            - "exactly two DealerOrder rows exist for this design, so the rejected order was never persisted"

      # ---- validations claims already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml ----

      - name: design_state_gate_outranks_the_credit_gate_on_confirmation
        claim_type: priority_ordering
        grounds:
          - validations.p7
          - validations.p33
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / unsealed_design_state_error_precedes_credit_limit_fiscal_error_on_order_confirm"
          rationale: "The §1.8 instance confirms an order whose design is unsealed AND whose dealer has insufficient credit, asserting ERR_DESIGN_NOT_SEALED, then repairs each defect in turn to reach ERR_CREDIT_LIMIT_EXCEEDED and finally success - the full ladder for this pair."

      - name: crew_tier_gate_outranks_the_crew_dealer_gate
        claim_type: priority_ordering
        grounds:
          - validations.p12
          - validations.p16
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / crew_tier_safety_error_precedes_crew_dealer_referential_error_on_installation_assignment"
          rationale: "The §1.8 instance assigns a foreign dealer's undersized crew so that priorities 12 and 16 are violated together and asserts ERR_CREW_TIER_INSUFFICIENT wins. The §1.9 crew instance above deliberately keeps every crew oversized so the referential and temporal gates can be isolated."

      - name: line_window_overlap_and_changeover_buffer_are_enforced
        claim_type: violation_to_error
        grounds:
          - validations.p21
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / roll_forming_line_half_open_adjacency_allowed_within_a_coating_but_changeover_buffer_required_across_coatings"
          rationale: "The §1.8 instance covers half-open intersection, zero-gap adjacency inside one coating, and the changeover-buffer expansion across coatings, which is every observable behaviour of this rule."

      - name: yard_staging_slots_are_an_aggregate_capacity_over_closed_windows
        claim_type: violation_to_error
        grounds:
          - validations.p22
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / dealer_yard_staging_slots_use_closed_intervals_and_aggregate_capacity_so_one_overlap_is_legal"
          rationale: "The §1.8 instance builds up to staging_slots overlapping PLANNED loads, proves touching endpoints intersect, and then shows a cancel frees the slot - the whole rule."

      - name: high_cube_dispatch_requires_the_minimum_cube_utilization
        claim_type: violation_to_error
        grounds:
          - validations.p30
        excluded_because:
          difficulty_instance: "boundary_precision_check / high_cube_load_dispatches_at_exactly_75_00_pct_utilization_and_rejects_at_74_99"
          rationale: "The §1.8 instance tests both sides of the 75.00 percent floor on a HIGH_CUBE_VAN and also confirms a FLATBED load below the floor dispatches, which is the conditional half of the rule."

      - name: dispatch_requires_every_attached_order_to_have_paid_its_deposit
        claim_type: violation_to_error
        grounds:
          - validations.p35
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / freight_load_dispatch_blocked_until_every_attached_dealer_order_is_deposit_paid"
          rationale: "The §1.8 instance dispatches a two-order load with one deposit outstanding, asserts ERR_DEPOSIT_REQUIRED, pays it and dispatches successfully - the violation and satisfaction arms of this rule together."

      - name: run_scheduling_is_blocked_against_a_quarantined_coil_lot
        claim_type: violation_to_error
        grounds:
          - validations.p7
          - errors.ERR_COIL_LOT_NOT_AVAILABLE
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / roll_forming_run_create_blocked_when_coil_lot_is_quarantined_by_a_coating_determination"
          rationale: "The §1.8 instance drives a COATING_INADEQUATE determination to quarantine the lot and then proves the same scheduling request that previously succeeded now returns ERR_COIL_LOT_NOT_AVAILABLE, which covers both the gate and its cross-entity cause."

  - section: endpoints
    instances:
      - name: the_logical_clock_endpoint_returns_a_bare_timestamp_and_moves_in_both_directions
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /_clock/set_current_utc
          - endpoints.POST /dealer-orders/{id}/assign-crew
          - validations.p20
          - errors.ERR_CREW_CERTIFICATION_EXPIRED
        distinguishing_aspect: "The clock endpoint is the one write in the API whose response is NOT an entity: it returns 200 with a body carrying only current_utc, so there is no id, no version and no created_at to read. It is also unordered - the clock may be moved backwards - and it mutates nothing in the store, which is observable in two ways. First, an assignment already made while the certificate was live stays ASSIGNED after the clock passes certified_until, because priority 20 is evaluated only at assignment time and there is no sweep. Second, the crew row itself is untouched: status is still CERTIFIED and certified_until is unchanged, so the very same request that was refused succeeds again once the clock is rewound."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false, min wind 95, seismic category A, permit_review_days 0)."
            - "GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha."
            - "BinDesign D1 12.0 m x 9.6 m, 105 mph, moisture 14.0, ASD - diameter 12.0."
            - "InstallationCrew T3 under Alpha with certified_until 2026-08-15T00:00:00Z, so max_diameter_m 30.0."
            - "Two DRAFT orders O1 and O2 on D1, created while the clock reads the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ne_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ne_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /installation-crews"
              payload: { dealer_id: "${dlr_a_id}", crew_name: "Alpha Erectors T3", certification_tier: "T3", certified_until: "2026-08-15T00:00:00Z" }
              as: PlantAdmin
              captures: { crew_id: $.data.id, crew_max_d: $.data.max_diameter_m, crew_status0: $.data.status }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ne_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_id: $.data.id, o1_ready0: $.data.installation_readiness }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o2_id: $.data.id, o2_ver0: $.data.version }
          trigger:
            - call: "POST /dealer-orders/${o1_id}/assign-crew"
              payload: { installation_crew_id: "${crew_id}" }
              as: PlantAdmin
              captures: { o1_ready: $.data.installation_readiness, o1_crew: $.data.installation_crew_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:01Z" }
              as: PlantAdmin
            - call: "POST /dealer-orders/${o2_id}/assign-crew"
              payload: { installation_crew_id: "${crew_id}" }
              as: PlantAdmin
              captures: { e_exp: $.data.error_id }
            - call: "GET /dealer-orders/${o1_id}"
              payload: {}
              as: PlantAdmin
              captures: { o1_ready_after: $.data.installation_readiness, o1_crew_after: $.data.installation_crew_id }
            - call: "GET /installation-crews/${crew_id}"
              payload: {}
              as: PlantAdmin
              captures: { crew_status_after: $.data.status, crew_until_after: $.data.certified_until }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /dealer-orders/${o2_id}/assign-crew"
              payload: { installation_crew_id: "${crew_id}" }
              as: PlantAdmin
              captures: { o2_ready: $.data.installation_readiness, o2_ver: $.data.version }
          assert:
            - "both clock calls return HTTP 200 - not 201 - and each response data object contains current_utc equal to the to_iso8601 that was sent and carries no id, no version and no created_at, because the clock is not an entity"
            - "the first assignment returns HTTP 200 with installation_readiness ASSIGNED and installation_crew_id equal to the crew id"
            - "the assignment attempted one second after certified_until returns HTTP 422 with error_id ERR_CREW_CERTIFICATION_EXPIRED"
            - "O1 read back at that later clock is STILL installation_readiness ASSIGNED with the same installation_crew_id - the expiry is evaluated at assignment time only and nothing sweeps existing assignments"
            - "the crew row is unchanged by the clock move: status CERTIFIED, certified_until 2026-08-15T00:00:00Z, max_diameter_m 30.0"
            - "after the clock is rewound to 2026-07-20T00:00:00Z the identical assignment request on O2 returns HTTP 200 with installation_readiness ASSIGNED, so the clock is not monotonic"
            - "O2.version increased by exactly 1 across the whole trigger sequence: the refused assignment wrote nothing"

      - name: dispatch_and_delivery_are_the_only_admitted_load_transitions_and_only_delivery_releases_credit
        claim_type: conditional_action
        grounds:
          - endpoints.POST /freight-loads/{id}/dispatch
          - endpoints.POST /freight-loads/{id}/deliver
          - endpoints.POST /freight-loads/{id}/assign-order
          - endpoints.POST /freight-loads/{id}/cancel
          - errors.ERR_LOAD_STATE_INVALID
          - calculations.dealer_credit_ledger
        distinguishing_aspect: "Four different endpoints are refused with the same error_id from the same load, which pins down the from-state list rather than any single transition: deliver is illegal while PLANNED, and dispatch, assign-order and cancel are all illegal once DISPATCHED. The assign-order refusal is the interesting one because that order is already attached, so priority 28 ERR_ORDER_ALREADY_ON_LOAD is also violated - priority 7 must win. The credit boundary is the other half: dispatch moves production_status to SHIPPED and frees the yard slot but releases NO credit, so credit_committed_cents is still 1999734 afterwards; only delivery zeroes credit_hold_cents and returns credit_available_cents to the full 900000000 limit."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha with credit_limit_cents 900000000, program_tier BASE, staging_slots 2."
            - "BinDesign D1 12.0 m x 9.6 m, 105 mph, ASD, analysed and submitted so it is UNDER_REVIEW - enough to confirm in a jurisdiction that does not require a seal."
            - "Order O1 on D1 (OFFSEASON, NONE, GRAVITY): kit_weight_kg 6410.4, kit_cube_m3 18.45, total_cents 2499667, required_deposit_cents 499933, credit_hold_cents 1999734. Confirmed to QUEUED and its deposit paid."
            - "Clock at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ne_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ne_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ne_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_ver}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an_id: $.data.id }
            - call: "POST /bin-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_status: $.data.status }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_id: $.data.id, o1_dep: $.data.required_deposit_cents, o1_hold: $.data.credit_hold_cents }
            - call: "POST /dealer-orders/${o1_id}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_prod: $.data.production_status }
            - call: "POST /dealer-orders/${o1_id}/payments"
              payload: { amount_cents: 499933 }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o1_fin: $.data.financial_status }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dlr_ver: $.data.version, committed0: $.data.credit_committed_cents }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-08-10T08:00:00Z", yard_window_end: "2026-08-12T17:00:00Z", expected_dealer_version: "${dlr_ver}" }
              as: LogisticsCoordinator
              captures: { fl_id: $.data.id, fl_status0: $.data.status, fl_lh0: $.data.linehaul_cost_cents }
          trigger:
            - call: "POST /freight-loads/${fl_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { e_deliver_planned: $.data.error_id }
            - call: "POST /freight-loads/${fl_id}/assign-order"
              payload: { dealer_order_id: "${o1_id}" }
              as: LogisticsCoordinator
              captures: { fl_util: $.data.cube_utilization_pct, fl_lh: $.data.linehaul_cost_cents, fl_cnt: $.data.order_count }
            - call: "POST /freight-loads/${fl_id}/dispatch"
