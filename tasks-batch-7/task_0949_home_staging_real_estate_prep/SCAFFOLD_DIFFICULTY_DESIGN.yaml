          - entities.DamageAssessment.fields.repair_cost_estimate
          - entities.DamageAssessment.fields.disposition
          - state_machines.DamageAssessment.DISPUTED_to_REVISED
        distinguishing_aspect: |
          BOUNDARY 1 — a MONETARY THRESHOLD on the damage endpoint. With drv 840.00 the
          threshold is exactly 504.00: an estimate of 504.00 stays REPAIR and charges
          504.00, while 504.01 flips to REPLACE and charges 420.00. The crossing LOWERS the
          bill, so an off-by-one-cent comparison is visible as an 84.01 swing.
        test_recipe:
          setup:
            - "The canonical VACANT project with its pickup IN_PROGRESS and one SOFA assessment (drv 840.00) at repair_cost_estimate 504.00."
          setup_api_calls: *v_staged
