            - { call: "POST /bag-lots/${bl1}/packout", payload: { requested_bags: 500, expected_bag_lot_version: "${v_bl0}" }, as: ConvertingOperator }
          assert:
            - "POST /bag-lots/${bl1}/packout -> 409 ERR_BAG_LOT_STATE_INVALID"
            - "the response error_id is neither ERR_STALE_BAG_LOT_VERSION nor ERR_PACKOUT_EXCEEDS_UNPACKED"
