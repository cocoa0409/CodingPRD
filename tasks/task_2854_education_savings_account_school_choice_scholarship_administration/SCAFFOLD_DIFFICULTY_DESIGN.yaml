# §1.8 Scaffold Difficulty Design - Test Targeting Index for task 2854
# Nine Difficulty Rules x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain starts from an empty DB and uses
# only endpoints declared in §1.5; every formula-derived assert below was computed by
# executing the §1.3 formulas as code.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: award_provisional_claimed_vs_final_verified_diverge
        grounds:
          - calculations.annual_award_amount
          - entities.Application.fields.provisional_award_cents
          - entities.Application.fields.annual_award_cents
          - entities.Account.fields.final_award_cents
          - entities.Account.fields.quarters_remaining_at_award
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.AWARD_OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Both variants of annual_award_amount run over the same Application in the money
          domain and disagree twice: provisional_claimed scores the guardian's claimed flags
          {DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL} over a full 4 quarters (978382), while
          final_verified scores the officer-verified flag set {DISABILITY_IEP} (932663) and
          then prorates it over the 3 quarters left after the first disbursement run (699497).
        test_recipe:
          setup:
            - "ProgramYear 2026-27 (TX, base 731500, 2 seats, window 2026-08-15 -> 2026-09-30, term 2026-08-01 -> 2027-06-30) in status ACTIVE with current_quarter 1."
            - "Student S1 resides in TX, prior_enrollment PUBLIC_SCHOOL_FULL_YEAR, income_band BAND_B, category_flags [DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL]."
            - "Application A1 was submitted at clock 2026-09-01 claiming BAND_B + [DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL], so provisional_award_cents is 978382."
            - "The eligibility determination verified only [DISABILITY_IEP] at BAND_B, so Application.annual_award_cents is 932663 and priority_tier is 4 with priority_score 100."
            - "The awarding run put A1 in AWARD_OFFERED with acceptance_deadline_at 2026-09-15; the quarter-1 disbursement run then advanced current_quarter to 1 while no account existed yet."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_provisional: $.data.provisional_award_cents }
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
              captures: { ed1_annual: $.data.annual_award_cents }
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/program-years/${py_id}/disbursement-runs"
              payload: { quarter: 1 }
              as: ProgramAdmin
          trigger:
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id, acct1_final: $.data.final_award_cents }
          assert:
            - "Application.${a1_id}.provisional_award_cents == 978382"
            - "Application.${a1_id}.annual_award_cents == 932663"
            - "accept-award response final_award_cents == 699497"
            - "accept-award response quarters_remaining_at_award == 3"
            - "Account.${acct1_id}.final_award_cents == 699497"
            - "Account.${acct1_id}.quarters_remaining_at_award == 3"
            - "Application.${a1_id}.provisional_award_cents != Account.${acct1_id}.final_award_cents (978382 vs 699497)"
            - "Application.${a1_id}.status == ACCEPTED"

      - name: provider_score_screening_static_vs_surveillance_decayed
        grounds:
          - calculations.provider_risk_score
          - entities.Provider.fields.screening_score
          - entities.Provider.fields.surveillance_score
          - entities.Provider.fields.substantiated_case_count
          - entities.FraudScreening.fields.recommended_status
          - state_machines.MisuseCase.UNDER_REVIEW_to_SUBSTANTIATED
        distinguishing_aspect: |
          Both variants of provider_risk_score run over the same Provider in the fraud-risk
          domain (not money) and disagree: screening_static freezes the flag sum at 35 forever,
          while surveillance_decayed decays that 35 by 0.1 per elapsed month (4 months -> 21)
          and then adds 25 per substantiated case, landing on 46 - a number neither the raw
          flag sum nor the case points alone can produce.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is ACTIVE; Student S1 (TX, BAND_B, [DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL]) holds Application A1 in ACCEPTED with Account ACCT1 in ACTIVE and balance_cents 0 (no disbursement run has fired)."
            - "ExpenseCategory TUTORING (per_year_cap_cents 200000, requires_preapproval true, requires_service_period true) is published."
            - "Provider P1 was screened at clock 2026-09-01 with flags [NO_STATE_REGISTRATION] -> screening_score 35, recommended_status APPROVE, then approved for [TUTORING], so status is APPROVED."
            - "PurchaseRequest PR1 (PREAPPROVAL, 150000, TUTORING, P1) sits at approval_status PENDING_REVIEW / settlement_status UNSETTLED."
            - "The logical clock has been moved to 2027-01-01, exactly 4 whole months after screened_at, and MisuseCase MC1 naming PR1 is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id }
            - call: "POST /esa/expense-categories"
              payload: { code: "TUTORING", name: "Tutoring services", per_year_cap_cents: 200000, allowable: true, requires_preapproval: true, requires_service_period: true }
              as: ProgramAdmin
              captures: { cat_tut_id: $.data.id }
            - call: "POST /esa/providers"
              payload: { legal_name: "Lone Star Tutors LLC", ein: "751234567", address_state: "TX", provider_type: "TUTOR" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /esa/providers/${p1_id}/fraud-screenings"
              payload: { flags: ["NO_STATE_REGISTRATION"] }
              as: VendorScreener
              as_user_id: "vs-1"
              captures: { p1_screening_score: $.data.screening_score, p1_recommended: $.data.recommended_status }
            - call: "POST /esa/providers/${p1_id}/approve"
              payload: { authorized_category_codes: ["TUTORING"] }
              as: VendorScreener
              as_user_id: "vs-1"
            - call: "GET /esa/accounts/${acct1_id}"
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_v: $.data.version }
            - call: "POST /esa/accounts/${acct1_id}/purchase-requests"
              payload: { provider_id: "${p1_id}", expense_category_id: "${cat_tut_id}", flow: "PREAPPROVAL", amount_cents: 150000, service_start_at: "2026-10-01T00:00:00Z", service_end_at: "2026-11-01T00:00:00Z", expected_account_version: "${acct1_v}" }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { pr1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/misuse-cases"
              payload: { account_id: "${acct1_id}", purchase_request_id: "${pr1_id}", detection_rule: "PROVIDER_COLLUSION", disallowed_principal_cents: 150000, narrative: "Provider billed for sessions the student never attended." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mc1_id: $.data.id }
            - call: "POST /esa/misuse-cases/${mc1_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /esa/misuse-cases/${mc1_id}/adjudication"
              payload: { outcome: "SUBSTANTIATED", rationale: "Attendance records contradict the invoiced sessions." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Provider.${p1_id}.screening_score == 35 (unchanged by the substantiation)"
            - "Provider.${p1_id}.surveillance_score == 46"
            - "Provider.${p1_id}.substantiated_case_count == 1"
            - "Provider.${p1_id}.status == APPROVED (46 is below the AUTO_PROBATION_THRESHOLD of 75)"
            - "FraudScreening for ${p1_id} has screening_score == 35 and recommended_status == APPROVE"
            - "MisuseCase.${mc1_id}.status == SUBSTANTIATED"
            - "Account.${acct1_id}.status == SUSPENDED"
            - "PurchaseRequest.${pr1_id}.approval_status == VOID and settlement_status == CANCELLED"

  - rule_id: combinatorial_formula
    instances:
      - name: addon_waterfall_truncates_last_flag_and_rounds_per_component
        grounds:
          - calculations.annual_award_amount
          - entities.EligibilityDetermination.fields.annual_award_cents
          - entities.Application.fields.annual_award_cents
          - state_machines.Application.SUBMITTED_to_ELIGIBLE
        distinguishing_aspect: |
          Mode (b) shape: three interacting knobs (income multiplier, per-flag add-on
          percentages ordered by pct DESC then code ASC, and the 0.45 aggregate cap) where the
          lowest-pct admitted flag is truncated to the cap remainder rather than dropped, and
          each component is rounded to whole cents BEFORE summation - BAND_A with
          [DISABILITY_IEP, FOSTER] must yield 1060676, not the 1060675 that summing the
          percentages first (or dropping FOSTER) produces.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 (TX, base_award_cents 731500) is WINDOW_OPEN and the clock reads 2026-09-01."
            - "Student S4 resides in TX, prior_enrollment PRIVATE_SCHOOL, income_band BAND_A, category_flags [DISABILITY_IEP, FOSTER]."
            - "Application A4 has been submitted claiming BAND_A + [DISABILITY_IEP, FOSTER]; the raw add-on percentages sum to 0.600, above the 0.45 cap."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-4", first_name: "Diego", last_name: "Marin", date_of_birth: "2013-11-20", residency_state: "TX", prior_enrollment: "PRIVATE_SCHOOL", income_band: "BAND_A", category_flags: ["DISABILITY_IEP", "FOSTER"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s4_id}", claimed_income_band: "BAND_A", claimed_category_flags: ["DISABILITY_IEP", "FOSTER"] }
              as: Guardian
              as_user_id: "${s4_id}"
              captures: { a4_id: $.data.id }
            - call: "POST /esa/applications/${a4_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s4_id}"
              captures: { a4_provisional: $.data.provisional_award_cents }
          trigger:
            - call: "POST /esa/applications/${a4_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_A", verified_prior_enrollment: "PRIVATE_SCHOOL", verified_category_flags: ["DISABILITY_IEP", "FOSTER"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
              captures: { ed4_id: $.data.id, ed4_annual: $.data.annual_award_cents }
          assert:
            - "EligibilityDetermination.${ed4_id}.annual_award_cents == 1060676"
            - "Application.${a4_id}.annual_award_cents == 1060676"
            - "Application.${a4_id}.provisional_award_cents == 1060676"
            - "Application.${a4_id}.annual_award_cents != 1060675 (the sum-percentages-then-multiply order is wrong)"
            - "Application.${a4_id}.priority_tier == 4"
            - "Application.${a4_id}.priority_score == 170"
            - "Application.${a4_id}.status == ELIGIBLE"
            - "EligibilityDetermination.${ed4_id}.round_number == 1"

      - name: clawback_penalty_tier_keyed_on_principal_not_running_total
        grounds:
          - calculations.clawback_assessment
          - entities.MisuseCase.fields.penalty_rate
          - entities.MisuseCase.fields.clawback_total_cents
          - entities.MisuseCase.fields.receivable_cents
          - entities.ClawbackEntry.fields.entry_type
          - state_machines.MisuseCase.SUBSTANTIATED_to_CLAWBACK_ISSUED
        distinguishing_aspect: |
          Mode (c) shape: the penalty tier looks circular because the amount it produces feeds
          the total it is compared against, and the pinned order breaks the loop by keying the
          tier on disallowed_principal_cents alone - principal 250000 must select 0.20 and
          total 300000, whereas re-deriving the tier from the 300000 total would select 0.35
          and produce 337500.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is ACTIVE with current_quarter 1; Student S1 (TX, BAND_B, [DISABILITY_IEP, PRIOR_PUBLIC_SCHOOL]) holds Application A1 ACCEPTED with Account ACCT1 final_award_cents 932663."
            - "The quarter-1 disbursement credited gross 233168 minus admin fee 4080, so ACCT1.balance_cents is 229088 and lifetime_disbursed_cents is 233168."
            - "MisuseCase MC1 (no purchase request named, detection_rule CAP_CIRCUMVENTION, disallowed_principal_cents 250000) has been reviewed and SUBSTANTIATED by user co-1, which suspended ACCT1."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id }
            - call: "POST /esa/program-years/${py_id}/disbursement-runs"
              payload: { quarter: 1 }
              as: ProgramAdmin
            - call: "POST /esa/misuse-cases"
              payload: { account_id: "${acct1_id}", detection_rule: "CAP_CIRCUMVENTION", disallowed_principal_cents: 250000, narrative: "Award funds routed through a related party to evade the category cap." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mc1_id: $.data.id }
            - call: "POST /esa/misuse-cases/${mc1_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /esa/misuse-cases/${mc1_id}/adjudication"
              payload: { outcome: "SUBSTANTIATED", rationale: "Related-party invoices confirmed by bank records." }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /esa/misuse-cases/${mc1_id}/clawbacks"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb_total: $.data.clawback_total_cents, cb_debit: $.data.account_debit_cents }
          assert:
            - "clawbacks response penalty_rate == 0.20"
            - "clawbacks response penalty_cents == 50000"
            - "clawbacks response clawback_total_cents == 300000 (not 337500)"
            - "clawbacks response account_debit_cents == 229088"
            - "clawbacks response receivable_cents == 70912"
            - "clawbacks response account_balance_cents == 0"
            - "MisuseCase.${mc1_id}.status == CLAWBACK_ISSUED"
            - "Account.${acct1_id}.balance_cents == 0 and lifetime_clawed_back_cents == 229088"
            - "GET /esa/misuse-cases/${mc1_id}/clawback-entries returns exactly 2 entries: entry_type ACCOUNT_DEBIT with amount_cents 229088 and entry_type RECEIVABLE with amount_cents 70912"

  - rule_id: non_linear_state_machine
    instances:
      - name: denied_application_cycles_back_to_submitted_on_overturned_appeal
        grounds:
          - state_machines.Application.SUBMITTED_to_DENIED
          - state_machines.Application.DENIED_to_UNDER_APPEAL
          - state_machines.Application.UNDER_APPEAL_to_SUBMITTED
          - state_machines.Appeal.FILED_to_OVERTURNED
          - entities.Application.fields.appeal_round_count
          - validations[priority=22]
        distinguishing_aspect: |
          Cyclic shape, not a linear pipeline: the Application re-enters a state it already
          left (SUBMITTED) after DENIED -> UNDER_APPEAL -> SUBMITTED, its verified attributes
          are reset on the way back, a second EligibilityDetermination is recorded with
          round_number 2, and the loop is bounded by appeal_round_count against the cap of 2.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is WINDOW_OPEN and the clock reads 2026-09-01."
            - "Student S3 (TX, PRIVATE_SCHOOL, income_band BAND_B, no category flags) holds Application A3, submitted."
            - "The first EligibilityDetermination recorded residency_check FAIL, so A3 is DENIED with denial_reason_code RESIDENCY, annual_award_cents 0 and appeal_round_count 0."
            - "The guardian has filed Appeal AP1 with subject_type APPLICATION_DENIAL, which moved A3 to UNDER_APPEAL and set appeal_round_count 1."
          setup_api_calls:
            - call: "POST /esa/program-years"
