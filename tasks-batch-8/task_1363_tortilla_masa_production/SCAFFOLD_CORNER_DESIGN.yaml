            - "mill response already carried masa_available_kg == 1552.0"
            - "weight-check response carries pack_status == PASSED and avg_pack_weight_g == 360.0"
            - "seal response carries pack_status == SEALED and expires_on == 2026-08-01 + 20 days == 2026-08-21"
