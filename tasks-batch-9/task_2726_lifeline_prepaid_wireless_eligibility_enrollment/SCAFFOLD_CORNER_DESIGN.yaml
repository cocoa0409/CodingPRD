              captures: { e_deenrolled: $.data.error_id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T23:59:59.999Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/subscriber-cases"
              payload: { subscriber_id: "${sub_id}", enrollment_id: "${enr_id}", case_type: "DE_ENROLLMENT_APPEAL", narrative: "Filing at the last permitted millisecond" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { case2_id: $.data.id, case2_type: $.data.case_type, case2_status: $.data.status }
            - call: "POST /lifeline/_clock/set_current_utc"
