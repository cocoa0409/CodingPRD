            - "${allowable_after_4} == 5590 (only the stationary line survives) and ${allowable_after_5} == 0 (no PLACED equipment remains)"
            - "${f_incident} == 100 and ${f_flow} == 20 on the computed read, and ${both_initial} == 16.00 while ${both_ongoing} == 100.00 over that same factor vector"

      - name: recall_remediation_deadline_by_severity_class
        claim_type: threshold
        grounds:
          - calculations.recall_remediation_deadline
          - entities.RecallNotice.fields.remediation_deadline_utc
          - entities.RecallNotice.fields.affected_unit_count
        distinguishing_aspect: |
          Three severities map to three deadline offsets from the SAME issued_at, and only CLASS_I
          quarantines anything: a CLASS_II notice reports auto_quarantined_unit_count 0 while still
          reporting a non-zero affected_unit_count, and RETIRED units are outside both counts.
        test_recipe:
          setup:
            - "One branch holding: two IN_STOCK units of model M2, one further M2 unit that is retired before any notice is published, one IN_STOCK unit of model M3, and one IN_STOCK unit of model M1."
            - "The clock is at its default 2026-08-01T00:00:00Z, so every issued_at below is that instant."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "M2-1", model_code: "M2", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_m2a: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "M2-2", model_code: "M2", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_m2b: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "M2-3", model_code: "M2", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_m2c: $.data.id }
            - call: "POST /home-oxygen/equipment-units/${u_m2c}/retire"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "M3-1", model_code: "M3", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_m3: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "M1-1", model_code: "M1", equipment_class: "COMPRESSED_CYLINDER", max_continuous_lpm: 4.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_m1: $.data.id }
          trigger:
            - call: "POST /home-oxygen/recall-notices"
              payload: { model_code: "M2", severity: "CLASS_II" }
              as: ComplianceAuditor
              captures: { n2: $.data.id, dl2: $.data.remediation_deadline_utc, aff2: $.data.affected_unit_count, auto2: $.data.auto_quarantined_unit_count, rem2: $.data.remediated_unit_count, st2: $.data.status }
            - call: "POST /home-oxygen/recall-notices"
              payload: { model_code: "M3", severity: "CLASS_III" }
              as: ComplianceAuditor
              captures: { n3: $.data.id, dl3: $.data.remediation_deadline_utc, aff3: $.data.affected_unit_count, auto3: $.data.auto_quarantined_unit_count }
            - call: "POST /home-oxygen/recall-notices"
              payload: { model_code: "M1", severity: "CLASS_I" }
              as: ComplianceAuditor
              captures: { n1: $.data.id, dl1: $.data.remediation_deadline_utc, aff1: $.data.affected_unit_count, auto1: $.data.auto_quarantined_unit_count }
            - call: "GET /home-oxygen/equipment-units/${u_m2a}"
              payload: {}
              as: BranchManager
              captures: { m2a_status: $.data.status }
            - call: "GET /home-oxygen/equipment-units/${u_m1}"
              payload: {}
              as: BranchManager
              captures: { m1_status: $.data.status, m1_reason: $.data.quarantine_reason }
          assert:
            - "${dl2} == 2026-08-31T00:00:00.000Z: CLASS_II is issued_at + 30 days from the default clock"
            - "${dl3} == 2026-10-30T00:00:00.000Z: CLASS_III is + 90 days, crossing two month boundaries"
            - "${dl1} == 2026-08-06T00:00:00.000Z: CLASS_I is + 5 days"
            - "${aff2} == 2, not 3: the retired M2 unit ${u_m2c} is outside the {IN_STOCK, RESERVED, DEPLOYED, IN_QUARANTINE} status set"
            - "${auto2} == 0 and ${auto3} == 0 while ${auto1} == 1: only CLASS_I quarantines, so ${m2a_status} == IN_STOCK but ${m1_status} == IN_QUARANTINE with ${m1_reason} == RECALL"
            - "${aff3} == 1 and ${aff1} == 1; ${rem2} == 0 and ${st2} == OPEN on every fresh notice"
            - "Three notices coexist over three different model codes, and none of them affects the others' counts"

      - name: recert_due_date_interval_floor_and_month_clamp
        claim_type: chronological
        grounds:
          - calculations.recert_due_date
          - entities.CertificateOfMedicalNecessity.fields.initial_date
          - state_machines[entity=CertificateOfMedicalNecessity].transitions[PHYSICIAN_SIGNED->ACTIVE]
        distinguishing_aspect: |
          The interval is min(group interval, length_of_need_months), so a GROUP_II lifetime
          certificate recertifies in 3 months while a GROUP_I certificate with a 6-month need
          recertifies in 6, not 12; and add_months clamps rather than overflowing, so an
          initial_date of 2026-08-31 plus 6 months is 2027-02-28 and not 2027-03-03.
        test_recipe:
          setup:
            - "One patient with two studies: a GROUP_II resting study (spo2 89 with cor_pulmonale_or_edema true) and a GROUP_I resting study (spo2 87), both drawn 2026-07-25T14:00:00Z."
