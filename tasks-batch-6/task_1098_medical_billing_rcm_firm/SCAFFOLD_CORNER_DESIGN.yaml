scaffold_corner_design:
  - section: entities
    instances:
      - name: practice_creation_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Practice.fields.status", "endpoints"]
        distinguishing_aspect: "POST /rcm/practices with all required fields returns 201 and the practice starts in status PROSPECT with ar_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rcm/practices"
              payload: { name: "New Clinic", npi: "1111111130", tax_id: "22-9999999", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, st: $.data.status }
          assert:
            - "response.data.status == PROSPECT"
            - "response.data.ar_balance_cents == 0"
            - "response.data.version == 1"
      - name: claim_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "GET /rcm/claims/{unknown uuid} returns ERR_CLAIM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rcm/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coder
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLAIM_NOT_FOUND"
      - name: practice_missing_billing_fee_pct_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Practice.fields.billing_fee_pct", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /rcm/practices without billing_fee_pct returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rcm/practices"
              payload: { name: "No Fee Clinic", npi: "1111111131", tax_id: "22-8888888" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
      - name: payer_invalid_payer_type_returns_invalid_enum
        claim_type: Type Constraints
        grounds: ["entities.Payer.fields.payer_type", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /rcm/payers with payer_type outside {COMMERCIAL,MEDICARE,MEDICAID} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rcm/payers"
              payload: { name: "WeirdCo", payer_type: "SELF_PAY", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ENUM"
      - name: claim_line_allowed_amount_computed_at_scrub
        claim_type: Computed Fields
        grounds: ["entities.ClaimLine.fields.allowed_amount_cents", "calculations.claim_ledger_reconciliation"]
        distinguishing_aspect: "After scrub, ClaimLine.allowed_amount_cents is resolved to units*fee-schedule allowed (2 units * 10000 = 20000), independent of the line's charge_amount_cents."
        test_recipe:
          setup: ["ACTIVE fee schedule prices 99213=10000; claim with one line 99213 units 2 charge 40000; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Sigma Clinic", npi: "1111111132", tax_id: "22-7777777", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222240", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 0, coinsurance_pct: 0.20, copay_cents: 0 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 2, charge_amount_cents: 40000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-c1"
          trigger:
            - call: "GET /rcm/claims/${claim_id}/lines"
              payload: {}
              as: Coder
              captures: { line_allowed: $.data.0.allowed_amount_cents }
          assert:
            - "Claim.${claim_id}.allowed_amount_cents == 20000"
            - "Claim.${claim_id}.billed_amount_cents == 40000"
            - "Claim.${claim_id}.contractual_adjustment_cents == 20000"
  - section: state_machines
    instances:
      - name: scrub_already_scrubbed_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.DRAFT_to_SCRUBBED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second scrub on a SCRUBBED claim returns ERR_INVALID_STATE; no ledger recompute occurs."
