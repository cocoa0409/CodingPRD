              captures: { error_id: $.data.error_id, message: $.data.message }
            - call: "GET /demurrage/invoices/${inv_id}"
              payload: {}
              as: BillingAdmin
              captures: { inv_v2: $.data.version, dispute_count: $.data.dispute_count }
            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "BUNCHING", narrative: "Re-read the version and try again.", claimed_credit_cents: 5000, expected_invoice_version: "${inv_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dsp2_id: $.data.id }
          assert:
            - "the replay returned 412 with error_id ERR_INVOICE_VERSION_STALE"
            - "the invoice read shows version inv_v1 + 1 and dispute_count 1: the rejected create left no row"
            - "the retry with the re-read version returned 201 and the invoice is then at inv_v1 + 2 with dispute_count 2"
            - "a create carrying expected_invoice_version 0 or a negative value is a 400 ERR_INVALID_REQUEST, not a 412"

      - name: stale_rail_car_version_on_cycle_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cycle-create-stale-car
          - errors.ERR_RAIL_CAR_VERSION_STALE
          - validations.priority_44_concurrency
        distinguishing_aspect: |
          Two agents ordering the same car serialise on the car's version, and
          the priority ladder makes the STALE answer outrank the overlap answer:
          the same replay yields 412 while the caller's read is stale and 409
          ERR_CAR_CYCLE_OVERLAP once it has re-read. Both requests describe the
          identical forbidden overlap, so only the ordering distinguishes them.
        test_recipe:
          setup:
            - "a published tariff, an open industry track and one idle rail car"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9L2-CUST", name: "Race Rhodonite", serving_station_code: "STN71", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9L2-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
