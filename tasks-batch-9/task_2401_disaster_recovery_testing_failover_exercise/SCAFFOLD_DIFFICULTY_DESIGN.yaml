            - call: "POST /exercises/${exX_id}/failback-transitions"
              payload: { action: "RECORD_SYNC_FAILURE", note: "Network partition mid-sync" }
              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /exercises/${exX_id}/data-transitions"
              payload: { action: "REVALIDATE" }
              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /exercises/${exX_id}/failback-transitions"
              payload: { action: "RETRY_SYNC" }
