scenario: "2020. Offer Approval & Compensation Governance (recruiting approval workflow): requisition budget & approved salary range check, offer construction (base/bonus/equity) & internal equity analysis, approval routing by deviation from range, counteroffer authority & negotiation limits, sign-on/relocation approval & clawback terms, offer letter generation & contingency (background/reference) clearance, offer acceptance tracking & expiration, declination reason capture"

domain_name: offer-approval-compensation-governance
api_prefix: /api

complexity_profile:
  primary_archetype: Workflow orchestration
  secondary_archetype: Compliance / audit
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Dual-variant calculation
    - Rate / threshold triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: department, type: string, source: input, description: "Owning department" }
      - { name: role_level, type: enum, source: input, description: "Level band: L3 | L4 | L5 | L6 | L7" }
      - { name: geo_tier, type: enum, source: input, description: "Geo pay tier: T1 | T2 | T3" }
      - { name: hiring_manager_id, type: string, source: system, description: "Opaque user id captured from X-User-ID of the HiringManager creator; drives ownership checks" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Total approved annual budget for all hires on this requisition; > 0" }
      - { name: salary_min_cents, type: integer, source: input, description: "Approved salary band minimum; > 0" }
      - { name: salary_mid_cents, type: integer, source: input, description: "Approved salary band midpoint" }
      - { name: salary_max_cents, type: integer, source: input, description: "Approved salary band maximum" }
      - { name: headcount_authorized, type: integer, source: input, description: "Number of hires this requisition funds; >= 1" }
      - { name: headcount_filled, type: integer, source: computed, description: "Count of Offers with status == HIRED on this requisition" }
      - { name: committed_budget_cents, type: integer, source: computed, description: "Sum of fully_loaded_annual_cost_cents over this requisition's offers whose status is in {PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED, ACCEPTED, HIRED}" }
      - { name: status, type: enum, source: system, description: "DRAFT | BUDGET_REVIEW | RANGE_APPROVAL | OPEN | PAUSED | CLOSED | CANCELLED" }
      - { name: close_reason, type: enum, source: system, default: null, description: "null | FILLED (set when auto-closed at full headcount)" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: email, type: string, source: input, description: "Unique email (case-insensitive)" }
      - { name: current_base_cents, type: integer, source: input, default: null, description: "Self-reported current base salary (optional, analytics only)" }
      - { name: status, type: enum, source: system, description: "PROSPECT | IN_PROCESS | HIRED | ARCHIVED" }

  - name: InternalEquitySnapshot
    parent: null
    common_fields: true
    fields:
      - { name: role_level, type: enum, source: input, description: "L3 | L4 | L5 | L6 | L7" }
      - { name: geo_tier, type: enum, source: input, description: "T1 | T2 | T3" }
      - { name: base_cents, type: integer, source: input, description: "One incumbent's current base salary; > 0" }
      - { name: bonus_target_pct, type: number, source: input, default: 0, description: "Incumbent bonus target as decimal (0.10 = 10%)" }

  - name: ApprovalPolicy
    parent: null
    common_fields: true
    fields:
      - { name: min_band_severity, type: enum, source: input, description: "BELOW_MIN | ABOVE_BAND | EXCEPTION; row applies when offer band severity >= row severity (severity: IN_BAND=1, BELOW_MIN=2, ABOVE_BAND=2, EXCEPTION=3)" }
      - { name: required_role, type: enum, source: input, description: "CompAnalyst | DepartmentDirector | VPPeople" }
      - { name: chain_position, type: integer, source: input, description: "Ordering position within the generated chain; >= 1 (position 0 is always HiringManager)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: input, description: "FK -> Requisition.id" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: created_by_user_id, type: string, source: system, description: "Opaque user id from X-User-ID of the creator; drives segregation-of-duties checks" }
      - { name: base_cents, type: integer, source: input, description: "Offered annual base salary; > 0" }
      - { name: bonus_target_pct, type: number, source: input, description: "Bonus target as decimal; >= 0" }
      - { name: equity_shares, type: integer, source: input, description: "Equity grant share count; >= 0" }
      - { name: equity_fmv_cents, type: integer, source: input, description: "Fair market value per share in cents; >= 0" }
      - { name: band, type: enum, source: computed, description: "IN_BAND | BELOW_MIN | ABOVE_BAND | EXCEPTION (see band_classification)" }
      - { name: bonus_target_cents, type: integer, source: computed, description: "round_half_up(base_cents * bonus_target_pct)" }
      - { name: total_cash_cents, type: integer, source: computed, description: "base + bonus_target + sign-on perks + relocation perks (see total_cash_tier)" }
      - { name: cash_only_annual_cost_cents, type: integer, source: computed, description: "Finance cash view (see offer_cost variant cash_only)" }
      - { name: fully_loaded_annual_cost_cents, type: integer, source: computed, description: "Budget view (see offer_cost variant fully_loaded)" }
      - { name: equity_compa_ratio, type: number, source: computed, description: "base / mean peer base, 4 decimal places, round_half_up; null when fewer than MIN_PEER_SNAPSHOTS peers" }
      - { name: equity_percentile, type: integer, source: computed, description: "Midpoint percentile of base within peer set (0-100); null when fewer than MIN_PEER_SNAPSHOTS peers" }
      - { name: equity_compa_risk_flag, type: boolean, source: computed, description: "compa_ratio < 0.85 OR compa_ratio > 1.15 (strict); false when ratio null" }
      - { name: equity_percentile_risk_flag, type: boolean, source: computed, description: "equity_percentile < 10 OR equity_percentile >= 90; false when percentile null" }
      - { name: clearance_posture, type: enum, source: computed, description: "NOT_STARTED | PENDING | CLEARED | FAILED (see clearance_posture_calc)" }
      - { name: round_count, type: integer, source: computed, description: "Count of NegotiationRounds ever created for this offer (any status)" }
      - { name: original_submitted_base_cents, type: integer, source: system, default: null, description: "base_cents at first submission; anchor for concession caps" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "Set at extension: clock + OFFER_EXPIRY_DAYS" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | RETURNED | APPROVED | LETTER_GENERATED | EXTENDED | COUNTERED | ACCEPTED | HIRED | DECLINED | EXPIRED | RESCINDED | WITHDRAWN" }
      - { name: declination_reason, type: enum, source: input, default: null, description: "COMPETING_OFFER | COMPENSATION | ROLE_SCOPE | LOCATION | BENEFITS | PERSONAL | TIMING | OTHER; required at decline" }
      - { name: rescind_reason, type: enum, source: system, default: null, description: "CONTIGENCY_FAILED | RENEG | COMPLIANCE_HOLD; set on rescind" }

  - name: ApprovalStep
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: sequence, type: integer, source: system, description: "0-based chain order; step N is ACTIONABLE only when all steps with smaller sequence are APPROVED" }
      - { name: required_role, type: enum, source: system, description: "HiringManager | CompAnalyst | DepartmentDirector | VPPeople" }
      - { name: status, type: enum, source: system, description: "WAITING | ACTIONABLE | APPROVED | REJECTED | SUPERSEDED" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque user id of decider" }
      - { name: decided_via_delegation, type: boolean, source: system, default: false, description: "True when decided under a DelegationGrant" }
      - { name: delegation_grant_id, type: string, source: system, default: null, description: "Plain reference to the DelegationGrant used (audit only)" }
      - { name: decision_note, type: string, source: input, default: null, description: "Optional note recorded at decision" }

  - name: NegotiationRound
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: sequence, type: integer, source: system, description: "1-based round number" }
      - { name: proposed_base_cents, type: integer, source: input, description: "Candidate-proposed base salary; > 0" }
      - { name: proposed_bonus_target_pct, type: number, source: input, default: null, description: "Optional proposed bonus target" }
      - { name: proposed_equity_shares, type: integer, source: input, default: null, description: "Optional proposed equity shares" }
      - { name: concession_pct, type: number, source: computed, description: "(proposed_base_cents - original_submitted_base_cents) / original_submitted_base_cents, 4 decimal places" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque user id of decider" }
      - { name: decision_note, type: string, source: input, default: null, description: "Optional note at decision" }

  - name: PerkPackage
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: kind, type: enum, source: input, description: "SIGN_ON | RELOCATION" }
      - { name: amount_cents, type: integer, source: input, description: "Perk amount; > 0" }
      - { name: clawback_months, type: integer, source: input, description: "Months of service required to fully earn the perk; >= 1" }
      - { name: clawback_variant, type: enum, source: input, description: "FULL_CLIFF | PRORATED_MONTHLY" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | APPROVED | ACTIVE | VOIDED" }

  - name: ClearanceCheck
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: kind, type: enum, source: input, description: "BACKGROUND | REFERENCE" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_PROGRESS | CLEARED | FLAGGED | FAILED | WAIVED | CANCELLED" }
      - { name: note, type: string, source: input, default: null, description: "Optional note on last transition" }

  - name: OfferLetter
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: sequence, type: integer, source: system, description: "1-based letter number for this offer" }
      - { name: pinned_offer_version, type: integer, source: system, description: "Offer.version at generation time" }
      - { name: body_text, type: string, source: system, description: "Server-rendered letter body summarizing pinned terms" }
      - { name: status, type: enum, source: system, description: "GENERATED | SUPERSEDED" }

  - name: OfferEvent
    parent: null
    common_fields: false
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id" }
      - { name: sequence, type: integer, source: system, description: "1-based monotonically increasing per offer" }
      - { name: event_type, type: enum, source: system, description: "OFFER_CREATED | TERMS_REVISED | SUBMITTED | STEP_APPROVED | STEP_REJECTED | STEP_SUPERSEDED | APPROVED | RETURNED | LETTER_GENERATED | LETTER_SUPERSEDED | EXTENDED | COUNTER_RECORDED | COUNTER_ACCEPTED | COUNTER_REJECTED | ROUND_WITHDRAWN | ACCEPTED | DECLINED | EXPIRED | RESCINDED | WITHDRAWN | HIRED | CHECK_INITIATED | CHECK_TRANSITIONED | CHECK_WAIVED | CHECK_CANCELLED | PERK_ADDED | PERK_VOIDED" }
      - { name: actor_user_id, type: string, source: system, description: "Opaque user id, or the literal string 'system'" }
      - { name: detail, type: string, source: system, default: null, description: "Machine-readable detail (e.g., rescind reason, step sequence)" }

  - name: DelegationGrant
    parent: null
    common_fields: true
    fields:
      - { name: grantor_user_id, type: string, source: input, description: "Opaque user id whose authority is delegated (audit)" }
      - { name: delegate_user_id, type: string, source: input, description: "Opaque user id receiving the authority" }
      - { name: scope_role, type: enum, source: input, description: "CompAnalyst | DepartmentDirector | VPPeople" }
      - { name: valid_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Window end (exclusive); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Requisition
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: BUDGET_REVIEW
        trigger: "POST /api/requisitions/{id}/submit"
        actor: HiringManager
        preconditions: ["X-User-ID == requisition.hiring_manager_id"]
        side_effects: []
      - from: BUDGET_REVIEW
        to: RANGE_APPROVAL
        trigger: "POST /api/requisitions/{id}/review-decision with decision=APPROVE (FinanceController only at this stage)"
        actor: FinanceController
        preconditions: ["actor role == FinanceController"]
        side_effects: []
      - from: BUDGET_REVIEW
        to: DRAFT
        trigger: "POST /api/requisitions/{id}/review-decision with decision=RETURN (FinanceController only at this stage)"
        actor: FinanceController
        preconditions: ["actor role == FinanceController"]
        side_effects: []
      - from: RANGE_APPROVAL
        to: OPEN
        trigger: "POST /api/requisitions/{id}/review-decision with decision=APPROVE (CompAnalyst only at this stage)"
        actor: CompAnalyst
        preconditions: ["actor role == CompAnalyst"]
        side_effects: []
      - from: RANGE_APPROVAL
        to: DRAFT
        trigger: "POST /api/requisitions/{id}/review-decision with decision=RETURN (CompAnalyst only at this stage)"
        actor: CompAnalyst
        preconditions: ["actor role == CompAnalyst"]
        side_effects: []
      - from: OPEN
        to: PAUSED
        trigger: "POST /api/requisitions/{id}/hold with action=PAUSE"
        actor: HiringManager
        preconditions: ["X-User-ID == requisition.hiring_manager_id"]
        side_effects: []
      - from: PAUSED
        to: OPEN
        trigger: "POST /api/requisitions/{id}/hold with action=RESUME"
        actor: HiringManager
        preconditions: ["X-User-ID == requisition.hiring_manager_id"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (after headcount_filled recompute when headcount_filled == headcount_authorized)"
        actor: system
        preconditions: ["headcount_filled == headcount_authorized"]
        side_effects:
          - "close_reason = FILLED"
          - "every Offer of this requisition with status in {DRAFT, RETURNED, PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED} transitions to WITHDRAWN; for each: non-terminal ApprovalSteps -> SUPERSEDED (+STEP_SUPERSEDED events), PROPOSED NegotiationRounds -> WITHDRAWN (+ROUND_WITHDRAWN), PerkPackages in {DRAFT, LOCKED, APPROVED} -> VOIDED (+PERK_VOIDED), event WITHDRAWN with detail REQUISITION_FILLED; committed_budget_cents recomputed (link 3 of hire cascade)"
      - from: CLOSED
        to: OPEN
        trigger: "system (after a HIRED offer is rescinded with reason RENEG or COMPLIANCE_HOLD, when close_reason == FILLED)"
        actor: system
        preconditions: ["close_reason == FILLED"]
        side_effects: ["close_reason = null"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/requisitions/{id}/cancel"
        actor: HiringManager
        preconditions: ["X-User-ID == requisition.hiring_manager_id"]
        side_effects:
          - "same auto-withdraw cascade as OPEN->CLOSED but with event detail REQUISITION_CANCELLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /api/requisitions/{id}/cancel"
        actor: HiringManager
        preconditions: ["X-User-ID == requisition.hiring_manager_id"]
        side_effects:
          - "same auto-withdraw cascade as OPEN->CLOSED but with event detail REQUISITION_CANCELLED"

  - entity: Candidate
    initial_state: PROSPECT
    terminal_states: [ARCHIVED]
    transitions:
      - from: PROSPECT
        to: IN_PROCESS
        trigger: "system (on first Offer creation referencing this candidate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROCESS
        to: HIRED
        trigger: "system (on any of the candidate's offers reaching HIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HIRED
        to: IN_PROCESS
        trigger: "system (on rescind of a HIRED offer with reason RENEG or COMPLIANCE_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROSPECT
        to: ARCHIVED
        trigger: "POST /api/candidates/{id}/archive"
        actor: Recruiter
        preconditions: ["no Offer of this candidate has status in {DRAFT, RETURNED, PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED, ACCEPTED, HIRED}"]
        side_effects: []
      - from: IN_PROCESS
        to: ARCHIVED
        trigger: "POST /api/candidates/{id}/archive"
        actor: Recruiter
        preconditions: ["no Offer of this candidate has status in {DRAFT, RETURNED, PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED, ACCEPTED, HIRED}"]
        side_effects: []

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, RESCINDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /api/offers/{id} (self-transition, no status change)"
        actor: Recruiter
        preconditions: ["expected_offer_version == offer.version"]
        side_effects:
          - "apply changed term fields; recompute band, bonus_target_cents, total_cash_cents, cash_only_annual_cost_cents, fully_loaded_annual_cost_cents, equity metrics and risk flags"
          - "increments Offer.version by 1"
          - "append OfferEvent TERMS_REVISED"
      - from: RETURNED
        to: RETURNED
        trigger: "PATCH /api/offers/{id} (self-transition, no status change)"
        actor: Recruiter
        preconditions: ["expected_offer_version == offer.version"]
        side_effects:
          - "same recompute + version increment + TERMS_REVISED event as DRAFT->DRAFT"
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /api/offers/{id}/submit"
        actor: Recruiter
        preconditions:
          - "requisition.status == OPEN"
          - "count of InternalEquitySnapshots with matching role_level and geo_tier >= 3"
          - "fully_loaded_annual_cost_cents <= requisition.annual_budget_cents - requisition.committed_budget_cents"
          - "base_cents <= salary_max_cents * 1.25 (hard cap)"
        side_effects:
          - "original_submitted_base_cents = base_cents if null"
          - "generate ApprovalSteps per approval_chain_construction; sequence 0 -> ACTIONABLE, all others WAITING"
          - "PerkPackages in DRAFT -> LOCKED"
          - "recompute requisition.committed_budget_cents (this offer now counted)"
          - "append OfferEvent SUBMITTED"
      - from: RETURNED
        to: PENDING_APPROVAL
        trigger: "POST /api/offers/{id}/submit"
        actor: Recruiter
        preconditions: ["same as DRAFT->PENDING_APPROVAL"]
        side_effects:
          - "any pre-existing ApprovalSteps not yet SUPERSEDED -> SUPERSEDED (+STEP_SUPERSEDED events)"
          - "same generation / lock / committed-recompute / SUBMITTED event as DRAFT->PENDING_APPROVAL"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "system (when the final ACTIONABLE ApprovalStep is decided APPROVED and no step remains non-terminal)"
        actor: system
        preconditions: ["all ApprovalSteps of the current chain are APPROVED"]
        side_effects:
          - "PerkPackages in LOCKED -> APPROVED"
          - "append OfferEvent APPROVED"
      - from: PENDING_APPROVAL
        to: RETURNED
        trigger: "system (when any ACTIONABLE ApprovalStep is decided REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "all sibling ApprovalSteps in {WAITING, ACTIONABLE} -> SUPERSEDED (link 2 of rejection cascade; append STEP_SUPERSEDED per step, link 3)"
          - "PerkPackages in LOCKED -> DRAFT"
          - "recompute requisition.committed_budget_cents (RETURNED offer no longer counted)"
          - "append OfferEvent RETURNED"
      - from: APPROVED
        to: LETTER_GENERATED
        trigger: "POST /api/offers/{id}/letters (first generation)"
        actor: Recruiter
        preconditions: ["requisition.status == OPEN"]
        side_effects:
          - "create OfferLetter sequence 1, pinned_offer_version = offer.version, status GENERATED"
          - "append OfferEvent LETTER_GENERATED"
      - from: LETTER_GENERATED
        to: LETTER_GENERATED
        trigger: "POST /api/offers/{id}/letters (regeneration)"
        actor: Recruiter
        preconditions: ["requisition.status == OPEN"]
        side_effects:
          - "latest GENERATED OfferLetter -> SUPERSEDED (+LETTER_SUPERSEDED event)"
          - "create new OfferLetter with sequence = prior max + 1, pinned_offer_version = offer.version, status GENERATED (+LETTER_GENERATED event)"
      - from: LETTER_GENERATED
        to: EXTENDED
        trigger: "POST /api/offers/{id}/extend"
        actor: Recruiter
        preconditions:
          - "latest OfferLetter has status GENERATED and pinned_offer_version == offer.version"
          - "no other Offer of the same candidate has status in {EXTENDED, COUNTERED, ACCEPTED}"
        side_effects:
          - "expires_at = clock + 10 days"
          - "append OfferEvent EXTENDED"
      - from: EXTENDED
        to: COUNTERED
        trigger: "POST /api/offers/{id}/negotiation-rounds"
        actor: Recruiter
        preconditions:
          - "expected_offer_version == offer.version"
          - "round_count < 3"
          - "proposed_base_cents <= salary_max_cents * 1.25 (hard cap on proposed base)"
        side_effects:
          - "create NegotiationRound sequence = round_count + 1, status PROPOSED"
          - "increments Offer.version by 1"
          - "append OfferEvent COUNTER_RECORDED"
      - from: COUNTERED
        to: EXTENDED
        trigger: "POST /api/negotiation-rounds/{id}/decision with outcome=REJECTED"
        actor: Recruiter
        preconditions: ["round.status == PROPOSED", "actor may always REJECT (authority cap applies only to ACCEPTED)"]
        side_effects:
          - "round.status = REJECTED; offer terms unchanged; expires_at unchanged"
          - "append OfferEvent COUNTER_REJECTED"
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /api/negotiation-rounds/{id}/decision with outcome=ACCEPTED (re-routing rule: recomputed chain roles are a subset of the last fully-approved chain's roles)"
        actor: VPPeople
        preconditions:
          - "round.status == PROPOSED"
          - "concession cap: proposed_base_cents <= original_submitted_base_cents + round_half_up(original_submitted_base_cents * cap) where cap = 0.05 Recruiter / 0.10 HiringManager / 1.00 VPPeople"
          - "new fully_loaded fits remaining budget (new_fully <= annual_budget_cents - committed_budget_cents + old_fully)"
          - "recomputed approval chain roles subset of last approved chain roles"
        side_effects:
          - "round.status = ACCEPTED; apply proposed fields to offer (base_cents, bonus_target_pct if present, equity_shares if present); recompute all offer computed fields"
          - "increments Offer.version by 1"
          - "GENERATED OfferLetters -> SUPERSEDED (+LETTER_SUPERSEDED)"
          - "recompute requisition.committed_budget_cents"
          - "append OfferEvent COUNTER_ACCEPTED"
      - from: COUNTERED
        to: PENDING_APPROVAL
        trigger: "POST /api/negotiation-rounds/{id}/decision with outcome=ACCEPTED (re-routing rule: recomputed chain introduces a role not in the last approved chain)"
        actor: VPPeople
        preconditions: ["same authority + budget preconditions as COUNTERED->APPROVED; subset rule fails"]
        side_effects:
          - "same term-application / letter-supersede / committed recompute / COUNTER_ACCEPTED event as COUNTERED->APPROVED"
          - "generate fresh ApprovalSteps per approval_chain_construction (old chain fully decided, remains for audit)"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /api/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "X-User-ID == offer.candidate_id"
          - "lazy expiry: if clock >= expires_at, first transition to EXPIRED (see EXTENDED->EXPIRED) and reject with ERR_OFFER_EXPIRED"
        side_effects:
          - "append OfferEvent ACCEPTED"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/offers/{id}/accept (candidate accepts the original extended terms; pending round is abandoned)"
        actor: Candidate
        preconditions: ["X-User-ID == offer.candidate_id", "lazy expiry check as EXTENDED->ACCEPTED"]
        side_effects:
          - "PROPOSED NegotiationRound -> WITHDRAWN (+ROUND_WITHDRAWN event)"
          - "append OfferEvent ACCEPTED"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /api/offers/{id}/decline"
        actor: Candidate
        preconditions: ["X-User-ID == offer.candidate_id", "declination_reason present"]
        side_effects:
          - "record declination_reason; PerkPackages in APPROVED -> VOIDED (+PERK_VOIDED)"
          - "recompute requisition.committed_budget_cents (release)"
          - "append OfferEvent DECLINED"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /api/offers/{id}/decline"
        actor: Candidate
        preconditions: ["same as EXTENDED->DECLINED"]
        side_effects:
          - "PROPOSED NegotiationRound -> WITHDRAWN (+ROUND_WITHDRAWN)"
          - "same perk-void / committed-release / DECLINED event as EXTENDED->DECLINED"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system (lazy: evaluated on any mutation attempt or on GET when clock >= expires_at)"
        actor: system
        preconditions: ["clock >= expires_at"]
        side_effects:
          - "PerkPackages in APPROVED -> VOIDED (+PERK_VOIDED)"
          - "recompute requisition.committed_budget_cents (release)"
          - "append OfferEvent EXPIRED"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system (lazy expiry as EXTENDED->EXPIRED)"
        actor: system
        preconditions: ["clock >= expires_at"]
        side_effects:
          - "PROPOSED NegotiationRound -> WITHDRAWN (+ROUND_WITHDRAWN)"
          - "same perk-void / committed-release / EXPIRED event as EXTENDED->EXPIRED"
      - from: ACCEPTED
        to: HIRED
        trigger: "system (when clearance_posture recomputes to CLEARED)"
        actor: system
        preconditions: ["clearance_posture == CLEARED"]
        side_effects:
          - "PerkPackages in APPROVED -> ACTIVE"
          - "candidate -> HIRED"
          - "recompute requisition.headcount_filled (link 1 of hire cascade); if headcount_filled == headcount_authorized then requisition OPEN->CLOSED (link 2) which auto-withdraws sibling offers (link 3)"
          - "append OfferEvent HIRED"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "system (when clearance_posture recomputes to FAILED)"
        actor: system
        preconditions: ["clearance_posture == FAILED"]
        side_effects:
          - "rescind_reason = CONTINGENCY_FAILED"
          - "all ClearanceChecks in {INITIATED, IN_PROGRESS, FLAGGED} -> CANCELLED (+CHECK_CANCELLED each, link 3 of failure cascade)"
          - "PerkPackages in APPROVED -> VOIDED (+PERK_VOIDED)"
          - "recompute requisition.committed_budget_cents (release)"
          - "append OfferEvent RESCINDED with detail CONTINGENCY_FAILED"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind"
        actor: HRAdmin
        preconditions: ["reason in {RENEG, COMPLIANCE_HOLD}; HiringManager actor must own the requisition (hiring_manager_id == X-User-ID)"]
        side_effects:
          - "same check-cancel / perk-void / committed-release side effects as auto-rescind; append OfferEvent RESCINDED with detail = reason"
      - from: HIRED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind (reneg)"
        actor: HRAdmin
        preconditions: ["reason in {RENEG, COMPLIANCE_HOLD}; HiringManager actor must own the requisition"]
        side_effects:
          - "rescind_reason = reason; PerkPackages in ACTIVE -> VOIDED (+PERK_VOIDED)"
          - "recompute requisition.headcount_filled (decrement); if requisition.close_reason == FILLED then requisition CLOSED->OPEN (reopen)"
          - "candidate HIRED -> IN_PROCESS"
          - "recompute requisition.committed_budget_cents (release)"
          - "append OfferEvent RESCINDED with detail = reason"
      - from: LETTER_GENERATED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind"
        actor: HRAdmin
        preconditions: ["reason in {RENEG, COMPLIANCE_HOLD}; HiringManager actor must own the requisition"]
        side_effects: ["PerkPackages in APPROVED -> VOIDED; committed recompute (release); OfferEvent RESCINDED"]
      - from: EXTENDED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind"
        actor: HRAdmin
        preconditions: ["same as LETTER_GENERATED->RESCINDED"]
        side_effects: ["PerkPackages in APPROVED -> VOIDED; committed recompute (release); OfferEvent RESCINDED"]
      - from: COUNTERED
        to: RESCINDED
        trigger: "POST /api/offers/{id}/rescind"
        actor: HRAdmin
        preconditions: ["same as LETTER_GENERATED->RESCINDED"]
        side_effects: ["PROPOSED NegotiationRound -> WITHDRAWN (+ROUND_WITHDRAWN); PerkPackages in APPROVED -> VOIDED; committed recompute (release); OfferEvent RESCINDED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: []
        side_effects: ["PerkPackages in DRAFT -> VOIDED (+PERK_VOIDED); OfferEvent WITHDRAWN"]
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: []
        side_effects: ["PerkPackages in DRAFT -> VOIDED (+PERK_VOIDED); OfferEvent WITHDRAWN"]
      - from: PENDING_APPROVAL
        to: WITHDRAWN
        trigger: "POST /api/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "non-terminal ApprovalSteps -> SUPERSEDED (+STEP_SUPERSEDED each)"
          - "PerkPackages in LOCKED -> VOIDED (+PERK_VOIDED)"
          - "recompute requisition.committed_budget_cents (release)"
          - "append OfferEvent WITHDRAWN"

  - entity: ApprovalStep
    initial_state: WAITING
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: WAITING
        to: ACTIONABLE
        trigger: "system (on chain generation for sequence 0; afterwards when every step with smaller sequence is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIONABLE
        to: APPROVED
        trigger: "POST /api/approval-steps/{id}/decide with decision=APPROVED"
        actor: HiringManager
        preconditions:
          - "X-User-Role == required_role OR an ACTIVE DelegationGrant with delegate_user_id == X-User-ID, scope_role == required_role, valid_from <= clock < valid_until (else grant lazily marked EXPIRED when past valid_until)"
          - "X-User-ID != offer.created_by_user_id (segregation of duties)"
        side_effects:
          - "record decided_by_user_id, decided_via_delegation, delegation_grant_id"
          - "append OfferEvent STEP_APPROVED"
          - "if a next WAITING step exists it -> ACTIONABLE; if none, offer PENDING_APPROVAL->APPROVED"
      - from: ACTIONABLE
        to: REJECTED
        trigger: "POST /api/approval-steps/{id}/decide with decision=REJECTED"
        actor: HiringManager
        preconditions: ["same authorization + SoD preconditions as APPROVED"]
        side_effects:
          - "append OfferEvent STEP_REJECTED (link 1 of rejection cascade)"
          - "offer PENDING_APPROVAL->RETURNED (link 2), which supersedes sibling steps and appends STEP_SUPERSEDED events (link 3)"
      - from: WAITING
        to: SUPERSEDED
        trigger: "system (offer returned, withdrawn, resubmitted, or auto-withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent STEP_SUPERSEDED"]
      - from: ACTIONABLE
        to: SUPERSEDED
        trigger: "system (offer withdrawn or auto-withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent STEP_SUPERSEDED"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (offer resubmitted after RETURNED; entire old chain superseded)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent STEP_SUPERSEDED"]

  - entity: NegotiationRound
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/negotiation-rounds/{id}/decision with outcome=ACCEPTED"
        actor: VPPeople
        preconditions: ["concession cap for actor role satisfied", "budget re-check satisfied"]
        side_effects: ["offer COUNTERED -> APPROVED or PENDING_APPROVAL per re-routing rule (see Offer machine)"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/negotiation-rounds/{id}/decision with outcome=REJECTED"
        actor: Recruiter
        preconditions: []
        side_effects: ["offer COUNTERED -> EXTENDED"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system (offer accepted from COUNTERED, expired, rescinded, or auto-withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent ROUND_WITHDRAWN"]

  - entity: PerkPackage
    initial_state: DRAFT
    terminal_states: [ACTIVE, VOIDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "system (offer submitted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: APPROVED
        trigger: "system (offer chain fully approved)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: DRAFT
        trigger: "system (offer returned)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "system (offer reaches HIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "system (offer withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent PERK_VOIDED"]
      - from: LOCKED
        to: VOIDED
        trigger: "system (offer withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent PERK_VOIDED"]
      - from: APPROVED
        to: VOIDED
        trigger: "system (offer declined, expired, rescinded, or auto-withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent PERK_VOIDED"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system (HIRED offer rescinded / reneg)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent PERK_VOIDED"]

  - entity: ClearanceCheck
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, WAIVED, CANCELLED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /api/clearance-checks/{id}/transition with to=IN_PROGRESS"
        actor: BackgroundScreener
        preconditions: []
        side_effects: ["append OfferEvent CHECK_TRANSITIONED", "recompute offer.clearance_posture"]
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /api/clearance-checks/{id}/transition with to=CLEARED"
        actor: BackgroundScreener
        preconditions: []
        side_effects: ["append OfferEvent CHECK_TRANSITIONED", "recompute offer.clearance_posture; if CLEARED and offer ACCEPTED then offer -> HIRED (hire cascade)"]
      - from: IN_PROGRESS
        to: FLAGGED
        trigger: "POST /api/clearance-checks/{id}/transition with to=FLAGGED"
        actor: BackgroundScreener
        preconditions: []
        side_effects: ["append OfferEvent CHECK_TRANSITIONED", "recompute offer.clearance_posture"]
      - from: FLAGGED
        to: IN_PROGRESS
        trigger: "POST /api/clearance-checks/{id}/transition with to=IN_PROGRESS (re-check cycle)"
        actor: BackgroundScreener
        preconditions: []
        side_effects: ["append OfferEvent CHECK_TRANSITIONED"]
      - from: FLAGGED
        to: FAILED
        trigger: "POST /api/clearance-checks/{id}/transition with to=FAILED"
        actor: BackgroundScreener
        preconditions: []
        side_effects: ["append OfferEvent CHECK_TRANSITIONED", "recompute offer.clearance_posture; posture FAILED auto-rescinds ACCEPTED offer (failure cascade)"]
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /api/clearance-checks/{id}/waive"
        actor: VPPeople
        preconditions: ["reason present"]
        side_effects: ["append OfferEvent CHECK_WAIVED", "recompute offer.clearance_posture; if CLEARED and offer ACCEPTED then offer -> HIRED"]
      - from: FLAGGED
        to: WAIVED
        trigger: "POST /api/clearance-checks/{id}/waive"
        actor: VPPeople
        preconditions: ["reason present"]
        side_effects: ["append OfferEvent CHECK_WAIVED", "recompute offer.clearance_posture; if CLEARED and offer ACCEPTED then offer -> HIRED"]
      - from: INITIATED
        to: CANCELLED
        trigger: "system (offer reaches a negative terminal state)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent CHECK_CANCELLED"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (offer reaches a negative terminal state)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent CHECK_CANCELLED"]
      - from: FLAGGED
        to: CANCELLED
        trigger: "system (offer reaches a negative terminal state)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent CHECK_CANCELLED"]

  - entity: OfferLetter
    initial_state: GENERATED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: GENERATED
        to: SUPERSEDED
        trigger: "system (letter regenerated, or accepted counter changes terms)"
        actor: system
        preconditions: []
        side_effects: ["append OfferEvent LETTER_SUPERSEDED"]

  - entity: DelegationGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/delegation-grants/{id}/revoke"
        actor: HRAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated when the grant is consulted at decide-time and clock >= valid_until)"
        actor: system
        preconditions: ["clock >= valid_until"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: offer-terms-patch-stale-version
    parent_entity: Offer
    write_endpoint: "PATCH /api/offers/{id}"
    occ_field: "expected_offer_version"
    description: |
      Revising offer terms against an Offer whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just revised terms or recorded a counter (both of
      which legitimately advance Offer.version) and the current writer's view
      of the offer is therefore stale.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: offer-round-create-stale-version
    parent_entity: Offer
    write_endpoint: "POST /api/offers/{id}/negotiation-rounds"
    occ_field: "expected_offer_version"
    description: |
      Recording a negotiation round against an Offer whose version has advanced
      since the client last observed it is rejected. A prior terms revision or
      round creation legitimately advances Offer.version, so the current
      writer's view of the negotiation state is stale.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: requisition-patch-stale-version
    parent_entity: Requisition
    write_endpoint: "PATCH /api/requisitions/{id}"
    occ_field: "expected_requisition_version"
    description: |
      Editing a DRAFT requisition whose version has advanced since the client
      last observed it is rejected. A prior edit legitimately advanced
      Requisition.version, so the current writer's view is stale.
    error_id: ERR_STALE_REQUISITION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: band_classification
    trigger: "on Offer create, on offer PATCH terms, on negotiation-round ACCEPTED"
    algorithm: threshold
    formula: |
      r = requisition referenced by offer.requisition_id
      if base_cents < r.salary_min_cents: band = BELOW_MIN
      elif base_cents <= r.salary_max_cents: band = IN_BAND            # boundary: == max is IN_BAND
      elif base_cents <= r.salary_max_cents * (1 + ABOVE_BAND_TOLERANCE_PCT): band = ABOVE_BAND   # boundary: exactly max*1.10 is ABOVE_BAND
      else: band = EXCEPTION                                            # > max*1.10; hard cap at max*1.25 enforced by validation
    input_set: "the offer's base_cents and its requisition's salary range"
    constants:
      ABOVE_BAND_TOLERANCE_PCT: 0.10
      HARD_CAP_PCT: 0.25
    precision: "integer cents; thresholds compared on unrounded products"
    variants: []

  - name: approval_chain_construction
    trigger: "on Offer submit (DRAFT or RETURNED -> PENDING_APPROVAL); recomputed on negotiation-round ACCEPTED for the re-routing subset test"
    algorithm: policy_routing
    formula: |
      severity(IN_BAND)=1, severity(BELOW_MIN)=2, severity(ABOVE_BAND)=2, severity(EXCEPTION)=3
      chain = [ { role: HiringManager, position: 0 } ]                  # step 0 is ALWAYS HiringManager
      rows = ApprovalPolicy where status == ACTIVE
             and severity(offer.band) >= severity(row.min_band_severity)
      sort rows by chain_position ASC, tie-break created_at ASC
      for each row: append { role: row.required_role, position: row.chain_position } if role not already in chain
      if sign_on_total_cents > SIGNON_REVIEW_THRESHOLD_CENTS: ensure CompAnalyst present (append after policy rows if absent)
      if equity_compa_risk_flag OR equity_percentile_risk_flag: ensure CompAnalyst present (append if absent)
      if total_cash_cents >= TIER2_TOTAL_CASH_CENTS: ensure VPPeople present (append last if absent)
      final order: position 0 first, then policy rows in sorted order, then ensured roles in fixed order (CompAnalyst, then VPPeople)
      assign sequence = 0..N-1 in final order; create one ApprovalStep per entry (sequence 0 starts ACTIONABLE, rest WAITING)
    input_set: "offer band, ACTIVE ApprovalPolicy rows, offer's non-VOIDED SIGN_ON perks total, offer equity risk flags, offer total_cash_cents"
    constants:
      SIGNON_REVIEW_THRESHOLD_CENTS: 1000000
      TIER2_TOTAL_CASH_CENTS: 30000000
    precision: "n/a (deterministic list construction; dedupe keeps earliest occurrence)"
    variants: []

  - name: total_cash_tier
    trigger: "on Offer create / PATCH / perk create / negotiation-round ACCEPTED (before approval_chain_construction consults it)"
    algorithm: threshold
    formula: |
      # self-referential-looking: sign-on both enters total_cash AND is gated by its own threshold;
      # pinned evaluation order makes it well-defined:
      #   1. bonus_target_cents  = round_half_up(base_cents * bonus_target_pct)
      #   2. sign_on_total       = sum(amount_cents of this offer's PerkPackages with kind == SIGN_ON and status != VOIDED)
      #   3. relocation_total    = sum(amount_cents ... kind == RELOCATION and status != VOIDED)
      #   4. total_cash_cents    = base_cents + bonus_target_cents + sign_on_total + relocation_total
      #   5. tier2_flag          = total_cash_cents >= TIER2_TOTAL_CASH_CENTS   (boundary: exactly 30000000 triggers VPPeople)
      # The sign-on threshold (> 1000000) applies to sign_on_total from step 2, BEFORE the tier test in step 5;
      # both evaluations feed approval_chain_construction independently.
    input_set: "offer term fields + this offer's non-VOIDED PerkPackages"
    constants:
      SIGNON_REVIEW_THRESHOLD_CENTS: 1000000
      TIER2_TOTAL_CASH_CENTS: 30000000
    precision: "integer cents"
    variants: []

  - name: offer_cost
    trigger: "on Offer create / PATCH / perk create / perk void / negotiation-round ACCEPTED"
    algorithm: aggregation
    formula: |
      # evaluation order pinned (bonus -> benefits -> equity -> perk sums):
      #   bonus_target_cents   = round_half_up(base_cents * bonus_target_pct)
      #   benefits_load_cents  = round_half_up((base_cents + bonus_target_cents) * BENEFITS_LOAD_PCT)
      #   equity_annual_cents  = round_half_up(equity_shares * equity_fmv_cents / EQUITY_VEST_YEARS)
      #   sign_on_total        = sum of non-VOIDED SIGN_ON perk amount_cents
      #   relocation_total     = sum of non-VOIDED RELOCATION perk amount_cents
      #   cash_only            = base_cents + bonus_target_cents + sign_on_total + relocation_total
      #   fully_loaded         = cash_only + equity_annual_cents + benefits_load_cents
    input_set: "offer term fields + this offer's non-VOIDED PerkPackages"
    constants:
      BENEFITS_LOAD_PCT: 0.30
      EQUITY_VEST_YEARS: 4
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: cash_only
        when: "cash compensation view shown to recruiters and candidates (Offer.cash_only_annual_cost_cents)"
        difference: "excludes benefits_load_cents and equity_annual_cents; for identical offer data it is strictly lower than fully_loaded whenever bonus, benefits or equity are non-zero"
      - name: fully_loaded
        when: "budget authority view (Offer.fully_loaded_annual_cost_cents); the ONLY variant committed_budget_cents and the submit-time budget check use"
        difference: "includes 30% benefits load on (base+bonus) plus annualized equity (shares*fmv/4)"

  - name: peer_equity_position
    trigger: "on Offer create / PATCH / negotiation-round ACCEPTED; also recomputed on submit after the peer-count gate passes"
    algorithm: aggregation
    formula: |
      peers = InternalEquitySnapshot where role_level == requisition.role_level and geo_tier == requisition.geo_tier
      n = count(peers); if n < MIN_PEER_SNAPSHOTS: both metrics are null and both risk flags are false
      mean_cents = round_half_up(sum(peers.base_cents) / n, 0)
      compa_ratio = round_half_up(base_cents / mean_cents, 4)
      count_lt = count(peers where base_cents < offer.base_cents)
      count_eq = count(peers where base_cents == offer.base_cents)
      percentile = round_half_up(100 * (count_lt + 0.5 * count_eq) / n, 0)   # midpoint percentile, integer 0-100
      compa_risk_flag      = compa_ratio < 0.85 OR compa_ratio > 1.15        # strict >
      percentile_risk_flag = percentile < 10 OR percentile >= 90             # percentile of exactly 90 DOES flag
    input_set: "InternalEquitySnapshots matching the requisition's role_level and geo_tier (all statuses - snapshots have no status filter), plus offer base_cents"
    constants:
      MIN_PEER_SNAPSHOTS: 3
      COMPA_RISK_LOW: 0.85
      COMPA_RISK_HIGH: 1.15
      PCT_RISK_LOW: 10
      PCT_RISK_HIGH: 90
    precision: "compa_ratio 4 decimals round_half_up; percentile integer round_half_up"
    variants:
      - name: compa_ratio
        when: "mean-relative equity measure (Offer.equity_compa_ratio + equity_compa_risk_flag)"
        difference: "sensitive to outliers: one very high peer drags the mean up and LOWERS the ratio"
      - name: percentile_rank
        when: "rank-relative equity measure (Offer.equity_percentile + equity_percentile_risk_flag)"
        difference: "robust to outliers: a high outlier raises the offer's rank only by position; for skewed peer sets the two flags legitimately diverge on identical data"

  - name: committed_budget
    trigger: "on any Offer status change (enter or leave the counted set) and on any change to an offer's fully_loaded_annual_cost_cents"
    algorithm: aggregation
    formula: |
      counted = offers of this requisition with status in
                {PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED, ACCEPTED, HIRED}
      committed_budget_cents = sum(counted.fully_loaded_annual_cost_cents)
      submit-time budget gate: offer.fully_loaded_annual_cost_cents <= requisition.annual_budget_cents - committed_budget_cents
      (the submitting offer is in DRAFT/RETURNED, hence not yet counted; self-inclusion impossible)
    input_set: "offers filtered by exact status set above; DRAFT, RETURNED and all terminal offers excluded"
    constants: {}
    precision: "integer cents; full recompute on every trigger (no incremental drift)"
    variants: []

  - name: headcount_filled
    trigger: "on Offer entering HIRED or leaving HIRED (rescind)"
    algorithm: aggregation
    formula: |
      headcount_filled = count(offers of this requisition with status == HIRED)
      if requisition.status == OPEN and headcount_filled == headcount_authorized: requisition -> CLOSED (close_reason = FILLED)
    input_set: "offers of the requisition filtered to status == HIRED exactly"
    constants: {}
    precision: "integer count; boundary is exact equality (>= never occurs because the requisition auto-closes at equality)"
    variants: []

  - name: concession_authority
    trigger: "on POST /api/negotiation-rounds/{id}/decision with outcome=ACCEPTED"
    algorithm: threshold
    formula: |
      concession_pct = (proposed_base_cents - offer.original_submitted_base_cents) / offer.original_submitted_base_cents
      # cumulative by construction: original_submitted_base_cents never changes, so prior accepted raises are included
      max_allowed_cents(role) = original_submitted_base_cents + round_half_up(original_submitted_base_cents * cap(role))
      cap: Recruiter 0.05 | HiringManager 0.10 | VPPeople 1.00
      ACCEPTED permitted iff proposed_base_cents <= max_allowed_cents(actor role)   # boundary: exactly at cap is allowed
      REJECTED outcomes carry no cap (any listed role may reject)
    input_set: "the PROPOSED round's proposed_base_cents and the offer's original_submitted_base_cents"
    constants:
      RECRUITER_CONCESSION_CAP: 0.05
      HM_CONCESSION_CAP: 0.10
      VP_CONCESSION_CAP: 1.00
    precision: "concession_pct 4 decimals round_half_up; cap product round_half_up to integer cents"
    variants: []

  - name: clawback_schedule
    trigger: "on GET /api/perks/{id}/clawback-quote (advisory; never mutates)"
    algorithm: installment_proration
    formula: |
      variant FULL_CLIFF:
        repayment_cents = amount_cents if months_worked < clawback_months else 0
      variant PRORATED_MONTHLY:
        if months_worked >= clawback_months: repayment_cents = 0
        elif months_worked == 0: repayment_cents = amount_cents                    # special case: full amount, no installment math
        else:
          installment_cents = round_half_up(amount_cents / clawback_months)        # PINNED ORDER: round the per-month installment FIRST
          repayment_cents   = installment_cents * (clawback_months - months_worked) # then multiply by remaining months
      # nested-rounding divergence: amount 1000100 over 3 months at months_worked=1 yields
      # installment-first: 333367 * 2 = 666734  vs  sum-then-round: round(1000100*2/3) = 666733
    input_set: "the PerkPackage's amount_cents, clawback_months, clawback_variant and the months_worked query parameter (>= 0)"
    constants: {}
    precision: "integer cents, round_half_up at the pinned step"
    variants:
      - name: full_cliff
        when: "clawback_variant == FULL_CLIFF"
        difference: "100% repayment until the final month boundary, then 0 - no proration"
      - name: prorated_monthly
        when: "clawback_variant == PRORATED_MONTHLY"
        difference: "linear earn-out using installment-first rounding; differs from full_cliff for identical (amount, months, months_worked) whenever 0 < months_worked < clawback_months"

  - name: expiration_check
    trigger: "lazily on any state-changing call targeting an EXTENDED or COUNTERED offer, and on GET of such an offer"
    algorithm: threshold
    formula: |
      on extend: expires_at = clock + OFFER_EXPIRY_DAYS days
      expired iff clock >= expires_at          # boundary: a call landing exactly at expires_at is EXPIRED; one second before is still valid
      expiry is lazy: no background sweep; the first call that observes clock >= expires_at persists EXPIRED
      and fires its side effects (perk void, round withdraw, committed release, EXPIRED event)
    input_set: "offer.expires_at and the logical clock"
    constants:
      OFFER_EXPIRY_DAYS: 10
    precision: "ISO8601 UTC seconds comparison"
    variants: []

  - name: clearance_posture_calc
    trigger: "on ClearanceCheck create / transition / waive / cancel for the offer"
    algorithm: aggregation
    formula: |
      checks = ClearanceChecks of the offer
      if any check.status == FAILED: posture = FAILED
      elif checks is empty: posture = NOT_STARTED
      elif every check.status in {CLEARED, WAIVED}: posture = CLEARED
      else: posture = PENDING
      posture CLEARED while offer.status == ACCEPTED triggers offer -> HIRED
      posture FAILED while offer.status == ACCEPTED triggers offer auto-RESCINDED (reason CONTINGENCY_FAILED)
    input_set: "all ClearanceChecks of the offer, no status pre-filter (posture logic inspects each status)"
    constants: {}
    precision: "deterministic set logic"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "request shape: required fields present, unknown fields rejected, types/enum membership valid, integer amounts > 0 where specified, pagination limit within [1,100]", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "X-User-Role is listed in the endpoint's roles (stage-dependent role checks included: requisition review-decision requires FinanceController at BUDGET_REVIEW stage and CompAnalyst at RANGE_APPROVAL stage)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "ownership: Candidate may only read/act on own offers (X-User-ID == offer.candidate_id); HiringManager may only PATCH/hold/cancel/rescind requisitions where X-User-ID == requisition.hiring_manager_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "candidate-facing and hiring-manager-owned endpoints" }
  - { priority: 5, category: existence, check: "path ids exist, validated left-to-right; body FK references (requisition_id, candidate_id) exist", error_id: ERR_OFFER_NOT_FOUND, http_status: 404, applies_to: "all (each entity has its own *_NOT_FOUND variant: ERR_REQUISITION_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_APPROVAL_STEP_NOT_FOUND, ERR_NEGOTIATION_ROUND_NOT_FOUND, ERR_PERK_NOT_FOUND, ERR_CLEARANCE_CHECK_NOT_FOUND, ERR_DELEGATION_GRANT_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_SNAPSHOT_NOT_FOUND)" }
  - { priority: 6, category: state, check: "requisition state gates: PATCH only in DRAFT; submit only from DRAFT; hold PAUSE only in OPEN, RESUME only in PAUSED; cancel only in OPEN/PAUSED; review-decision only in BUDGET_REVIEW/RANGE_APPROVAL", error_id: ERR_REQUISITION_INVALID_STATE, http_status: 409, applies_to: "requisition state endpoints" }
  - { priority: 6, category: state, check: "offer create requires requisition.status == OPEN; offer submit and letter generation require requisition.status == OPEN", error_id: ERR_REQUISITION_NOT_OPEN, http_status: 409, applies_to: "POST /api/offers, POST /api/offers/{id}/submit, POST /api/offers/{id}/letters" }
  - { priority: 6, category: state, check: "offer action is valid from the offer's current status (per Offer state machine; e.g., extend only from LETTER_GENERATED, accept only from EXTENDED/COUNTERED, withdraw only from DRAFT/RETURNED/PENDING_APPROVAL)", error_id: ERR_INVALID_OFFER_STATE, http_status: 409, applies_to: "offer action endpoints" }
  - { priority: 6, category: state, check: "approval step is ACTIONABLE", error_id: ERR_STEP_NOT_ACTIONABLE, http_status: 409, applies_to: "POST /api/approval-steps/{id}/decide" }
  - { priority: 6, category: state, check: "negotiation round is PROPOSED", error_id: ERR_ROUND_NOT_PENDING, http_status: 409, applies_to: "POST /api/negotiation-rounds/{id}/decision" }
  - { priority: 6, category: state, check: "clearance transition is a declared edge of the ClearanceCheck machine (e.g., INITIATED -> CLEARED is not)", error_id: ERR_CHECK_INVALID_TRANSITION, http_status: 409, applies_to: "POST /api/clearance-checks/{id}/transition" }
  - { priority: 6, category: state, check: "candidate is not ARCHIVED when an offer is created for them", error_id: ERR_CANDIDATE_NOT_HIRABLE, http_status: 409, applies_to: "POST /api/offers" }
  - { priority: 6, category: state, check: "candidate archive requires no offers in {DRAFT, RETURNED, PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED, ACCEPTED, HIRED}", error_id: ERR_CANDIDATE_HAS_ACTIVE_OFFER, http_status: 409, applies_to: "POST /api/candidates/{id}/archive" }
  - { priority: 7, category: state, check: "OCC: expected_offer_version == offer.version on offer PATCH and negotiation-round create", error_id: ERR_STALE_OFFER_VERSION, http_status: 412, applies_to: "PATCH /api/offers/{id}, POST /api/offers/{id}/negotiation-rounds" }
  - { priority: 7, category: state, check: "OCC: expected_requisition_version == requisition.version on requisition PATCH", error_id: ERR_STALE_REQUISITION_VERSION, http_status: 412, applies_to: "PATCH /api/requisitions/{id}" }
  - { priority: 8, category: business_safety, check: "segregation of duties: approval decider's X-User-ID must differ from offer.created_by_user_id", error_id: ERR_SELF_APPROVAL_FORBIDDEN, http_status: 403, applies_to: "POST /api/approval-steps/{id}/decide" }
  - { priority: 9, category: business_referential, check: "internal equity input set: count of InternalEquitySnapshots matching requisition role_level+geo_tier >= 3 at offer submit", error_id: ERR_INSUFFICIENT_PEER_DATA, http_status: 422, applies_to: "POST /api/offers/{id}/submit" }
  - { priority: 10, category: business_constraint, check: "round_count < 3 before creating a negotiation round", error_id: ERR_NEGOTIATION_ROUND_LIMIT, http_status: 409, applies_to: "POST /api/offers/{id}/negotiation-rounds" }
  - { priority: 10, category: business_constraint, check: "candidate has at most one offer in {EXTENDED, COUNTERED, ACCEPTED}; extending a second collides", error_id: ERR_CANDIDATE_ACTIVE_OFFER_EXISTS, http_status: 409, applies_to: "POST /api/offers/{id}/extend" }
  - { priority: 10, category: business_constraint, check: "no second clearance check of the same kind while one exists in {INITIATED, IN_PROGRESS, FLAGGED}", error_id: ERR_DUPLICATE_ACTIVE_CHECK, http_status: 409, applies_to: "POST /api/offers/{id}/clearance-checks" }
  - { priority: 10, category: business_constraint, check: "perks may only be added while offer is in DRAFT or RETURNED", error_id: ERR_PERK_STATE_LOCKED, http_status: 409, applies_to: "POST /api/offers/{id}/perks" }
  - { priority: 10, category: business_constraint, check: "delegation grant window overlap: no two grants for the same (delegate_user_id, scope_role) with overlapping half-open windows [valid_from, valid_until); adjacency (valid_from == other.valid_until) is allowed", error_id: ERR_GRANT_OVERLAP, http_status: 409, applies_to: "POST /api/delegation-grants" }
  - { priority: 10, category: business_constraint, check: "delegation grant grantor_user_id != delegate_user_id; valid_until > valid_from", error_id: ERR_GRANT_SELF_DELEGATION, http_status: 422, applies_to: "POST /api/delegation-grants" }
  - { priority: 10, category: business_constraint, check: "decline requires declination_reason from the declared enum", error_id: ERR_DECLINATION_REASON_REQUIRED, http_status: 422, applies_to: "POST /api/offers/{id}/decline" }
  - { priority: 10, category: business_constraint, check: "candidate email unique case-insensitively", error_id: ERR_CANDIDATE_EMAIL_EXISTS, http_status: 409, applies_to: "POST /api/candidates" }
  - { priority: 10, category: business_constraint, check: "requisition salary range coherent: 0 < salary_min_cents < salary_mid_cents <= salary_max_cents; annual_budget_cents > 0; headcount_authorized >= 1", error_id: ERR_SALARY_RANGE_INVALID, http_status: 422, applies_to: "POST /api/requisitions, PATCH /api/requisitions/{id}" }
  - { priority: 11, category: business_temporal, check: "lazy expiry: on any state-changing call against an EXTENDED/COUNTERED offer with clock >= expires_at, persist EXPIRED (with side effects) and reject the call", error_id: ERR_OFFER_EXPIRED, http_status: 409, applies_to: "offer action endpoints while EXTENDED/COUNTERED" }
  - { priority: 11, category: business_temporal, check: "delegation window at decide-time: grant status ACTIVE, valid_from <= clock < valid_until; grant past valid_until is lazily marked EXPIRED", error_id: ERR_DELEGATION_NOT_ACTIVE, http_status: 403, applies_to: "POST /api/approval-steps/{id}/decide (delegated path only)" }
  - { priority: 12, category: business_fiscal, check: "submit budget gate: fully_loaded_annual_cost_cents <= annual_budget_cents - committed_budget_cents", error_id: ERR_REQUISITION_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /api/offers/{id}/submit (and budget re-check on negotiation-round ACCEPTED)" }
  - { priority: 12, category: business_fiscal, check: "hard cap: base_cents <= salary_max_cents * 1.25 at offer create and submit; proposed_base_cents <= salary_max_cents * 1.25 at round create", error_id: ERR_BASE_EXCEEDS_HARD_CAP, http_status: 422, applies_to: "POST /api/offers, POST /api/offers/{id}/submit, POST /api/offers/{id}/negotiation-rounds" }
  - { priority: 12, category: business_fiscal, check: "concession authority: ACCEPTED outcome requires proposed_base_cents <= original_submitted_base_cents + round_half_up(original * cap(role)) with caps Recruiter 0.05 / HiringManager 0.10 / VPPeople 1.00", error_id: ERR_CONCESSION_EXCEEDS_AUTHORITY, http_status: 422, applies_to: "POST /api/negotiation-rounds/{id}/decision" }
  - { priority: 12, category: business_fiscal, check: "sign-on hard cap: any single SIGN_ON perk amount_cents <= 2500000", error_id: ERR_SIGNON_EXCEEDS_HARD_CAP, http_status: 422, applies_to: "POST /api/offers/{id}/perks" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). All expiry/delegation window logic reads this clock."
    roles: [HRAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; no entity mutation"]

  # --- Requisition ---
  - method: POST
    path: "/api/requisitions"
    description: "Create a requisition in DRAFT"
    roles: [HiringManager]
    code: 201
    input: [title, department, role_level, geo_tier, annual_budget_cents, salary_min_cents, salary_mid_cents, salary_max_cents, headcount_authorized]
    output: Requisition
    side_effects: ["hiring_manager_id = X-User-ID", "status=DRAFT", "headcount_filled=0", "committed_budget_cents=0", "close_reason=null"]
  - method: GET
    path: "/api/requisitions"
    description: "List requisitions (paginated)"
    roles: [HiringManager, Recruiter, CompAnalyst, FinanceController, DepartmentDirector, VPPeople, HRAdmin]
    code: 200
    input: ["status?", "hiring_manager_id?", "limit?", "offset?"]
    output: Requisition[]
    side_effects: []
  - method: GET
    path: "/api/requisitions/{id}"
    description: "Get a requisition"
    roles: [HiringManager, Recruiter, CompAnalyst, FinanceController, DepartmentDirector, VPPeople, HRAdmin]
    code: 200
    input: []
    output: Requisition
    side_effects: []
  - method: PATCH
    path: "/api/requisitions/{id}"
    description: "Edit a DRAFT requisition (OCC)"
    roles: [HiringManager]
    code: 200
    input: [expected_requisition_version, "title?", "department?", "annual_budget_cents?", "salary_min_cents?", "salary_mid_cents?", "salary_max_cents?", "headcount_authorized?"]
    output: Requisition
    side_effects: ["increments Requisition.version by 1"]
  - method: POST
    path: "/api/requisitions/{id}/submit"
    description: "Submit requisition for budget review (DRAFT -> BUDGET_REVIEW)"
    roles: [HiringManager]
    code: 200
    input: []
    output: Requisition
    side_effects: ["status=BUDGET_REVIEW"]
  - method: POST
    path: "/api/requisitions/{id}/review-decision"
    description: "Approve or return at the current stage (FinanceController at BUDGET_REVIEW, CompAnalyst at RANGE_APPROVAL)"
    roles: [FinanceController, CompAnalyst]
    code: 200
    input: [decision, "note?"]
    output: Requisition
    side_effects: ["status transition per stage and decision"]
  - method: POST
    path: "/api/requisitions/{id}/hold"
    description: "PAUSE (OPEN->PAUSED) or RESUME (PAUSED->OPEN)"
    roles: [HiringManager]
    code: 200
    input: [action]
    output: Requisition
    side_effects: ["status transition per action"]
  - method: POST
    path: "/api/requisitions/{id}/cancel"
    description: "Cancel requisition and auto-withdraw non-terminal offers"
    roles: [HiringManager]
    code: 200
    input: ["reason?"]
    output: Requisition
    side_effects: ["status=CANCELLED", "auto-withdraw cascade on offers in {DRAFT, RETURNED, PENDING_APPROVAL, APPROVED, LETTER_GENERATED, EXTENDED, COUNTERED}"]

  # --- Candidate ---
  - method: POST
    path: "/api/candidates"
    description: "Create a candidate in PROSPECT"
    roles: [Recruiter]
    code: 201
    input: [full_name, email, "current_base_cents?"]
    output: Candidate
    side_effects: ["status=PROSPECT"]
  - method: GET
    path: "/api/candidates/{id}"
    description: "Get a candidate (Candidate role restricted to self)"
    roles: [Recruiter, HiringManager, CompAnalyst, HRAdmin, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: POST
    path: "/api/candidates/{id}/archive"
    description: "Archive a candidate with no active offers"
    roles: [Recruiter]
    code: 200
    input: []
    output: Candidate
    side_effects: ["status=ARCHIVED"]

  # --- InternalEquitySnapshot ---
  - method: POST
    path: "/api/equity-snapshots"
    description: "Add one incumbent peer data row"
    roles: [CompAnalyst]
    code: 201
    input: [role_level, geo_tier, base_cents, "bonus_target_pct?"]
    output: InternalEquitySnapshot
    side_effects: []
  - method: GET
    path: "/api/equity-snapshots"
    description: "List peer snapshots (paginated)"
    roles: [CompAnalyst, Recruiter, HiringManager, HRAdmin]
    code: 200
    input: ["role_level?", "geo_tier?", "limit?", "offset?"]
    output: InternalEquitySnapshot[]
    side_effects: []
  - method: GET
    path: "/api/equity-snapshots/{id}"
    description: "Get one peer snapshot"
    roles: [CompAnalyst, Recruiter, HiringManager, HRAdmin]
    code: 200
    input: []
    output: InternalEquitySnapshot
    side_effects: []

  # --- ApprovalPolicy ---
  - method: POST
    path: "/api/approval-policies"
    description: "Create an ACTIVE routing policy row"
    roles: [HRAdmin]
    code: 201
    input: [min_band_severity, required_role, chain_position]
    output: ApprovalPolicy
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/approval-policies"
    description: "List policy rows"
    roles: [HRAdmin, CompAnalyst, VPPeople, DepartmentDirector, Recruiter, HiringManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ApprovalPolicy[]
    side_effects: []
  - method: POST
    path: "/api/approval-policies/{id}/deactivate"
    description: "Deactivate a policy row"
    roles: [HRAdmin]
    code: 200
    input: []
    output: ApprovalPolicy
    side_effects: ["status=INACTIVE"]

  # --- Offer ---
  - method: POST
    path: "/api/offers"
    description: "Construct an offer (base/bonus/equity) in DRAFT with computed band, costs and equity metrics"
    roles: [Recruiter, HiringManager]
    code: 201
    input: [requisition_id, candidate_id, base_cents, bonus_target_pct, equity_shares, equity_fmv_cents]
    output: Offer
    side_effects: ["created_by_user_id = X-User-ID", "status=DRAFT", "clearance_posture=NOT_STARTED", "round_count=0", "band + cost + equity computations", "candidate PROSPECT -> IN_PROCESS", "append OfferEvent OFFER_CREATED"]
  - method: GET
    path: "/api/offers"
    description: "List offers (paginated; Candidate sees only own)"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin, Candidate]
    code: 200
    input: ["requisition_id?", "candidate_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: GET
    path: "/api/offers/{id}"
    description: "Get an offer (Candidate restricted to own; lazy expiry may persist EXPIRED)"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin, Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["lazy expiry evaluation when EXTENDED/COUNTERED"]
  - method: PATCH
    path: "/api/offers/{id}"
    description: "Revise offer terms while DRAFT or RETURNED (OCC)"
    roles: [Recruiter, HiringManager]
    code: 200
    input: [expected_offer_version, "base_cents?", "bonus_target_pct?", "equity_shares?", "equity_fmv_cents?"]
    output: Offer
    side_effects: ["increments Offer.version by 1", "recompute band/costs/equity metrics", "append OfferEvent TERMS_REVISED"]
  - method: POST
    path: "/api/offers/{id}/submit"
    description: "Submit offer for approval; generates the routed ApprovalStep chain"
    roles: [Recruiter, HiringManager]
    code: 200
    input: []
    output: Offer
    side_effects: ["status=PENDING_APPROVAL", "ApprovalSteps generated per approval_chain_construction", "perks DRAFT->LOCKED", "committed_budget recompute", "OfferEvent SUBMITTED"]
  - method: POST
    path: "/api/offers/{id}/withdraw"
    description: "Withdraw offer while DRAFT, RETURNED or PENDING_APPROVAL"
    roles: [Recruiter, HiringManager]
    code: 200
    input: ["reason?"]
    output: Offer
    side_effects: ["status=WITHDRAWN", "steps SUPERSEDED", "perks VOIDED", "committed_budget recompute", "OfferEvent WITHDRAWN"]
  - method: POST
    path: "/api/offers/{id}/extend"
    description: "Extend the current letter to the candidate (10-day expiry); single active offer per candidate"
    roles: [Recruiter]
    code: 200
    input: []
    output: Offer
    side_effects: ["status=EXTENDED", "expires_at = clock + 10 days", "OfferEvent EXTENDED"]
  - method: POST
    path: "/api/offers/{id}/accept"
    description: "Candidate accepts (from EXTENDED, or from COUNTERED abandoning the pending round)"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["status=ACCEPTED", "pending round WITHDRAWN if any", "OfferEvent ACCEPTED"]
  - method: POST
    path: "/api/offers/{id}/decline"
    description: "Candidate declines with mandatory reason"
    roles: [Candidate]
    code: 200
    input: [reason, "detail?"]
    output: Offer
    side_effects: ["status=DECLINED", "declination_reason recorded", "perks APPROVED->VOIDED", "committed_budget recompute", "OfferEvent DECLINED"]
  - method: POST
    path: "/api/offers/{id}/rescind"
    description: "Rescind from LETTER_GENERATED/EXTENDED/COUNTERED/ACCEPTED/HIRED; reneg from HIRED reopens headcount and the requisition"
    roles: [HRAdmin, HiringManager]
    code: 200
    input: [reason]
    output: Offer
    side_effects: ["status=RESCINDED", "checks CANCELLED", "perks VOIDED", "headcount/committed recompute", "requisition reopen if close_reason == FILLED", "candidate HIRED->IN_PROCESS if reneg", "OfferEvent RESCINDED"]

  # --- ApprovalStep ---
  - method: GET
    path: "/api/offers/{id}/approval-steps"
    description: "List an offer's approval steps ordered by sequence ASC"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin]
    code: 200
    input: []
    output: ApprovalStep[]
    side_effects: []
  - method: POST
    path: "/api/approval-steps/{id}/decide"
    description: "Approve or reject the ACTIONABLE step; role match or active DelegationGrant; SoD enforced"
    roles: [HiringManager, CompAnalyst, DepartmentDirector, VPPeople]
    code: 200
    input: [decision, "note?"]
    output: ApprovalStep
    side_effects: ["step status per decision", "next step ACTIONABLE or offer chain resolution", "OfferEvent STEP_APPROVED/STEP_REJECTED (+cascade events)"]

  # --- NegotiationRound ---
  - method: POST
    path: "/api/offers/{id}/negotiation-rounds"
    description: "Record a candidate counter while EXTENDED (OCC; max 3 rounds)"
    roles: [Recruiter]
    code: 201
    input: [expected_offer_version, proposed_base_cents, "proposed_bonus_target_pct?", "proposed_equity_shares?"]
    output: NegotiationRound
    side_effects: ["increments Offer.version by 1", "offer EXTENDED->COUNTERED", "OfferEvent COUNTER_RECORDED"]
  - method: GET
    path: "/api/offers/{id}/negotiation-rounds"
    description: "List an offer's negotiation rounds ordered by sequence ASC"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin]
    code: 200
    input: []
    output: NegotiationRound[]
    side_effects: []
  - method: POST
    path: "/api/negotiation-rounds/{id}/decision"
    description: "Accept (authority-capped, re-routes if new chain exceeds approved coverage) or reject (back to EXTENDED)"
    roles: [Recruiter, HiringManager, VPPeople]
    code: 200
    input: [outcome, "note?"]
    output: NegotiationRound
    side_effects: ["round status per outcome", "on ACCEPTED: terms applied, letters SUPERSEDED, band/chain recompute, committed recompute", "OfferEvent COUNTER_ACCEPTED/COUNTER_REJECTED"]

  # --- PerkPackage ---
  - method: POST
    path: "/api/offers/{id}/perks"
    description: "Add a sign-on or relocation perk with clawback terms while offer is DRAFT/RETURNED"
    roles: [Recruiter, HiringManager]
    code: 201
    input: [kind, amount_cents, clawback_months, clawback_variant]
    output: PerkPackage
    side_effects: ["status=DRAFT", "total_cash + cost recompute", "OfferEvent PERK_ADDED"]
  - method: GET
    path: "/api/offers/{id}/perks"
    description: "List an offer's perks ordered by created_at ASC"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin, Candidate]
    code: 200
    input: []
    output: PerkPackage[]
    side_effects: []
  - method: GET
    path: "/api/perks/{id}/clawback-quote"
    description: "Advisory clawback repayment quote for a given months_worked (never mutates)"
    roles: [Recruiter, HiringManager, HRAdmin, VPPeople]
    code: 200
    input: [months_worked]
    output: "{ repayment_cents: integer, remaining_months: integer, clawback_variant: string }"
    side_effects: []

  # --- ClearanceCheck ---
  - method: POST
    path: "/api/offers/{id}/clearance-checks"
    description: "Initiate a BACKGROUND or REFERENCE check on an ACCEPTED offer"
    roles: [BackgroundScreener]
    code: 201
    input: [kind]
    output: ClearanceCheck
    side_effects: ["status=INITIATED", "clearance_posture recompute", "OfferEvent CHECK_INITIATED"]
  - method: GET
    path: "/api/offers/{id}/clearance-checks"
    description: "List an offer's clearance checks"
    roles: [Recruiter, HiringManager, HRAdmin, VPPeople, BackgroundScreener]
    code: 200
    input: []
    output: ClearanceCheck[]
    side_effects: []
  - method: POST
    path: "/api/clearance-checks/{id}/transition"
    description: "Advance a check per the ClearanceCheck machine (FLAGGED supports re-check cycle to IN_PROGRESS)"
    roles: [BackgroundScreener]
    code: 200
    input: [to, "note?"]
    output: ClearanceCheck
    side_effects: ["status transition", "clearance_posture recompute", "hire or auto-rescind cascade when posture resolves", "OfferEvent CHECK_TRANSITIONED"]
  - method: POST
    path: "/api/clearance-checks/{id}/waive"
    description: "VPPeople waives an IN_PROGRESS or FLAGGED check with mandatory reason"
    roles: [VPPeople]
    code: 200
    input: [reason]
    output: ClearanceCheck
    side_effects: ["status=WAIVED", "clearance_posture recompute", "OfferEvent CHECK_WAIVED"]

  # --- OfferLetter ---
  - method: POST
    path: "/api/offers/{id}/letters"
    description: "Generate (or regenerate, superseding) the offer letter pinned to the current offer version"
    roles: [Recruiter]
    code: 201
    input: []
    output: OfferLetter
    side_effects: ["prior GENERATED letter SUPERSEDED", "offer APPROVED->LETTER_GENERATED on first generation", "OfferEvents LETTER_SUPERSEDED/LETTER_GENERATED"]
  - method: GET
    path: "/api/offers/{id}/letters"
    description: "List an offer's letters ordered by sequence ASC"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin, Candidate]
    code: 200
    input: []
    output: OfferLetter[]
    side_effects: []

  # --- OfferEvent ---
  - method: GET
    path: "/api/offers/{id}/events"
    description: "Append-only audit log for an offer, ordered by sequence ASC (paginated)"
    roles: [Recruiter, HiringManager, CompAnalyst, DepartmentDirector, VPPeople, HRAdmin, BackgroundScreener]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: OfferEvent[]
    side_effects: []

  # --- DelegationGrant ---
  - method: POST
    path: "/api/delegation-grants"
    description: "Delegate an approver role's authority to another user for a half-open window"
    roles: [HRAdmin]
    code: 201
    input: [grantor_user_id, delegate_user_id, scope_role, valid_from, valid_until]
    output: DelegationGrant
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/delegation-grants"
    description: "List delegation grants (paginated)"
    roles: [HRAdmin, VPPeople]
    code: 200
    input: ["delegate_user_id?", "scope_role?", "status?", "limit?", "offset?"]
    output: DelegationGrant[]
    side_effects: []
  - method: GET
    path: "/api/delegation-grants/{id}"
    description: "Get a delegation grant"
    roles: [HRAdmin]
    code: 200
    input: []
    output: DelegationGrant
    side_effects: []
  - method: POST
    path: "/api/delegation-grants/{id}/revoke"
    description: "Revoke an ACTIVE grant"
    roles: [HRAdmin]
    code: 200
    input: []
    output: DelegationGrant
    side_effects: ["status=REVOKED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body: missing required field, unknown field, bad type/enum, non-positive amount, or pagination limit outside [1,100]" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not permitted on this endpoint (including stage-dependent role mismatch on review-decision)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Candidate acting on another candidate's offer/record, or HiringManager acting on a requisition they do not own" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "requisition id does not exist" }
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "candidate id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "offer id does not exist" }
  - { id: ERR_APPROVAL_STEP_NOT_FOUND, http: 404, condition: "approval step id does not exist" }
  - { id: ERR_NEGOTIATION_ROUND_NOT_FOUND, http: 404, condition: "negotiation round id does not exist" }
  - { id: ERR_PERK_NOT_FOUND, http: 404, condition: "perk id does not exist" }
  - { id: ERR_CLEARANCE_CHECK_NOT_FOUND, http: 404, condition: "clearance check id does not exist" }
  - { id: ERR_DELEGATION_GRANT_NOT_FOUND, http: 404, condition: "delegation grant id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "approval policy id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "equity snapshot id does not exist" }
  - { id: ERR_REQUISITION_INVALID_STATE, http: 409, condition: "requisition action invalid from current requisition status" }
  - { id: ERR_REQUISITION_NOT_OPEN, http: 409, condition: "offer create/submit/letter-generation requires requisition status OPEN" }
  - { id: ERR_INVALID_OFFER_STATE, http: 409, condition: "offer action invalid from current offer status" }
  - { id: ERR_STEP_NOT_ACTIONABLE, http: 409, condition: "approval step is not ACTIONABLE (waiting, decided, or superseded)" }
  - { id: ERR_ROUND_NOT_PENDING, http: 409, condition: "negotiation round is not PROPOSED" }
  - { id: ERR_CHECK_INVALID_TRANSITION, http: 409, condition: "clearance transition is not a declared edge from the check's current status" }
  - { id: ERR_CANDIDATE_NOT_HIRABLE, http: 409, condition: "offer create targets an ARCHIVED candidate" }
  - { id: ERR_CANDIDATE_HAS_ACTIVE_OFFER, http: 409, condition: "archive blocked: candidate has an offer in a non-terminal status" }
  - { id: ERR_STALE_OFFER_VERSION, http: 412, condition: "expected_offer_version does not match the offer's current version (OCC)" }
  - { id: ERR_STALE_REQUISITION_VERSION, http: 412, condition: "expected_requisition_version does not match the requisition's current version (OCC)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "approval decider is the offer's creator (segregation of duties)" }
  - { id: ERR_INSUFFICIENT_PEER_DATA, http: 422, condition: "fewer than 3 InternalEquitySnapshots match the requisition's role_level + geo_tier at submit" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 409, condition: "round_count already at 3" }
  - { id: ERR_CANDIDATE_ACTIVE_OFFER_EXISTS, http: 409, condition: "candidate already has an offer in EXTENDED, COUNTERED or ACCEPTED" }
  - { id: ERR_DUPLICATE_ACTIVE_CHECK, http: 409, condition: "a check of this kind already exists in INITIATED, IN_PROGRESS or FLAGGED" }
  - { id: ERR_PERK_STATE_LOCKED, http: 409, condition: "perk add attempted while offer is not in DRAFT or RETURNED" }
  - { id: ERR_GRANT_OVERLAP, http: 409, condition: "half-open delegation window overlaps an existing ACTIVE grant for the same delegate + scope_role" }
  - { id: ERR_GRANT_SELF_DELEGATION, http: 422, condition: "grantor_user_id == delegate_user_id, or valid_until <= valid_from" }
  - { id: ERR_DECLINATION_REASON_REQUIRED, http: 422, condition: "decline without a declination_reason enum value" }
  - { id: ERR_CANDIDATE_EMAIL_EXISTS, http: 409, condition: "candidate email already registered (case-insensitive)" }
  - { id: ERR_SALARY_RANGE_INVALID, http: 422, condition: "salary_min < salary_mid <= salary_max violated, budget <= 0, or headcount_authorized < 1" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "mutation attempted on an EXTENDED/COUNTERED offer at or past expires_at (offer persisted EXPIRED)" }
  - { id: ERR_DELEGATION_NOT_ACTIVE, http: 403, condition: "delegated decide attempted with a grant that is revoked, expired, or not yet valid (expired grants lazily marked EXPIRED)" }
  - { id: ERR_REQUISITION_BUDGET_EXCEEDED, http: 422, condition: "fully_loaded_annual_cost_cents exceeds annual_budget_cents - committed_budget_cents" }
  - { id: ERR_BASE_EXCEEDS_HARD_CAP, http: 422, condition: "base (or proposed base) exceeds salary_max_cents * 1.25" }
  - { id: ERR_CONCESSION_EXCEEDS_AUTHORITY, http: 422, condition: "ACCEPTED outcome exceeds the actor role's cumulative concession cap" }
  - { id: ERR_SIGNON_EXCEEDS_HARD_CAP, http: 422, condition: "single SIGN_ON perk amount exceeds 2500000 cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "HR operations administrator; configures policies, delegation grants, logical clock; can rescind any offer"
    identity: opaque
    exclusive_operations: ["POST /api/approval-policies", "POST /api/approval-policies/{id}/deactivate", "POST /api/delegation-grants", "POST /api/delegation-grants/{id}/revoke", "POST /api/_clock/set_current_utc"]
    shared_operations: ["GET reads", "POST /api/offers/{id}/rescind", "GET /api/perks/{id}/clawback-quote"]
  - name: HiringManager
    description: "Owns requisitions; first approver on every offer chain (unless creator); can rescind own requisitions' offers"
    identity: opaque
    exclusive_operations: ["POST /api/requisitions", "PATCH /api/requisitions/{id}", "POST /api/requisitions/{id}/submit", "POST /api/requisitions/{id}/hold", "POST /api/requisitions/{id}/cancel"]
    shared_operations: ["POST /api/offers", "PATCH /api/offers/{id}", "POST /api/offers/{id}/submit", "POST /api/offers/{id}/withdraw", "POST /api/offers/{id}/perks", "POST /api/approval-steps/{id}/decide", "POST /api/negotiation-rounds/{id}/decision", "POST /api/offers/{id}/rescind", "GET reads"]
  - name: Recruiter
    description: "Runs the offer desk: candidates, offer construction/submission, letters, extension, negotiation recording"
    identity: opaque
    exclusive_operations: ["POST /api/candidates", "POST /api/candidates/{id}/archive", "POST /api/offers/{id}/extend", "POST /api/offers/{id}/negotiation-rounds", "POST /api/offers/{id}/letters"]
    shared_operations: ["POST /api/offers", "PATCH /api/offers/{id}", "POST /api/offers/{id}/submit", "POST /api/offers/{id}/withdraw", "POST /api/offers/{id}/perks", "POST /api/negotiation-rounds/{id}/decision", "GET reads"]
  - name: CompAnalyst
    description: "Compensation analyst; owns equity snapshot data, approves requisition ranges, sits on escalated offer chains"
    identity: opaque
    exclusive_operations: ["POST /api/equity-snapshots"]
    shared_operations: ["POST /api/requisitions/{id}/review-decision (RANGE_APPROVAL stage)", "POST /api/approval-steps/{id}/decide", "GET reads"]
  - name: FinanceController
    description: "Finance business partner; approves requisition budgets at BUDGET_REVIEW stage"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /api/requisitions/{id}/review-decision (BUDGET_REVIEW stage)", "GET reads"]
  - name: DepartmentDirector
    description: "Director-level approver on EXCEPTION-band chains"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /api/approval-steps/{id}/decide", "GET reads"]
  - name: VPPeople
    description: "VP of People; final approver, uncapped counteroffer authority, sole waiver of clearance checks"
    identity: opaque
    exclusive_operations: ["POST /api/clearance-checks/{id}/waive"]
    shared_operations: ["POST /api/approval-steps/{id}/decide", "POST /api/negotiation-rounds/{id}/decision", "GET reads"]
  - name: BackgroundScreener
    description: "Contingency operations; initiates and transitions clearance checks"
    identity: opaque
    exclusive_operations: ["POST /api/offers/{id}/clearance-checks", "POST /api/clearance-checks/{id}/transition"]
    shared_operations: ["GET /api/offers/{id}/clearance-checks", "GET /api/offers/{id}/events"]
  - name: Candidate
    description: "The offeree; may read and respond to own offers only (X-User-ID == candidate id)"
    identity: "entity_backed:Candidate"
    exclusive_operations: ["POST /api/offers/{id}/accept", "POST /api/offers/{id}/decline"]
    shared_operations: ["GET /api/candidates/{id} (self)", "GET /api/offers (own only)", "GET /api/offers/{id} (own)", "GET /api/offers/{id}/perks (own)", "GET /api/offers/{id}/letters (own)"]
