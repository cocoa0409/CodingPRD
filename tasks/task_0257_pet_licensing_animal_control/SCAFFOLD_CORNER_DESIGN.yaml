  - section: cross_cutting_complexity_layers
    instances:
      - name: kennel_discount_floor_caps_at_60pct
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.license_fee
          - entities.Kennel.fields.occupied_slots
          - entities.License.fields.provisional_fee_cents
        distinguishing_aspect: "With occupied_slots high enough that 5%-per-slot would exceed 40% (e.g. 10 slots → 50%), the kennel discount is clamped at the floor 1-0.6=0.4, so provisional_fee_cents==7200 (12000*0.6), not 6000."
        test_recipe:
          setup: ["Owner OV owns kennel KV (capacity 12) with 10 ACTIVE kennel licenses (occupied_slots=10); an 11th unaltered-pet KENNEL license is created and submitted"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "VV Owner", email: "vv@x.com", address_zip: "10032" }
              as: LicensingClerk
              captures: { vv_id: $.data.id }
            - call: "POST /kennels"
              payload: { owner_id: "${vv_id}", facility_name: "VV Kennel", slot_capacity: 12 }
              as: Owner
              as_user_id: "${vv_id}"
              captures: { kv_id: $.data.id }
            - call: "POST /_bulk/seed-kennel-licenses"
              payload: { kennel_id: "${kv_id}", owner_id: "${vv_id}", count: 10, is_altered: false }
              as: LicensingClerk
            - call: "POST /pets"
              payload: { owner_id: "${vv_id}", name: "Eleven", species: "DOG", breed: "B", is_altered: false, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${vv_id}"
              captures: { vv_pet: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${vv_id}", pet_id: "${vv_pet}", license_kind: "KENNEL", term_years: 1, kennel_id: "${kv_id}" }
              as: Owner
              as_user_id: "${vv_id}"
              captures: { lv_id: $.data.id }
          trigger:
            - call: "POST /licenses/${lv_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${vv_id}"
              captures: { prov: $.data.provisional_fee_cents }
          assert:
            - "Kennel.${kv_id}.occupied_slots == 10"
            - "License.${lv_id}.provisional_fee_cents == 7200"

      - name: match_min_score_gate_zip_only_at_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.lost_found_match
          - state_machines.LostFoundReport.OPEN_to_MATCHED
        distinguishing_aspect: "A counterpart matching only on ZIP (different species) scores exactly MATCH_MIN_SCORE=20 and IS a candidate (>= boundary), so the match succeeds with match_score==20; a species-only counterpart (score 10) would be below the gate."
        test_recipe:
          setup: ["LOST RB (DOG, zip 80808) OPEN; FOUND FB (CAT, zip 80808) OPEN — zip matches but species differs, score exactly 20"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "CAT", zip_seen: "80808", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "LOST", species: "DOG", zip_seen: "80808", reported_at: "2026-03-01T07:00:00Z" }
              as: AnimalControlOfficer
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /lost-found-reports/${rb_id}/match"
              payload: {}
              as: AnimalControlOfficer
              captures: { rb_match: $.data.matched_report_id, rb_score: $.data.match_score }
          assert:
            - "LostFoundReport.${rb_id}.matched_report_id == ${fb_id}"
            - "LostFoundReport.${rb_id}.match_score == 20"

      - name: derived_active_license_count_after_issue
        claim_type: derived_field_reconciliation
        grounds: [entities.Owner.fields.active_license_count, state_machines.License.APPROVED_to_ACTIVE]
        distinguishing_aspect: "After issuing a tag (license → ACTIVE), Owner.active_license_count reconciles to 1."
        test_recipe:
          setup: ["owner + pet + license driven to APPROVED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "XX Owner", email: "xx@x.com", address_zip: "10034" }
              as: LicensingClerk
              captures: { xx_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${xx_id}", name: "Count", species: "DOG", breed: "B", is_altered: true, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${xx_id}"
              captures: { xx_pet: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${xx_pet}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VXX" }
              as: Owner
              as_user_id: "${xx_id}"
              captures: { xx_v: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${xx_id}", pet_id: "${xx_pet}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${xx_id}"
              captures: { xl_id: $.data.id }
            - call: "POST /licenses/${xl_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${xx_id}"
            - call: "POST /licenses/${xl_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${xl_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${xl_id}/attach-vaccination"
              payload: { vaccination_record_id: "${xx_v}" }
              as: Owner
              as_user_id: "${xx_id}"
            - call: "POST /licenses/${xl_id}/approve"
              payload: {}
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/${xl_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            - call: "GET /owners/${xx_id}"
              payload: {}
              as: LicensingClerk
              captures: { xx_count: $.data.active_license_count }
          assert:
            - "Owner.${xx_id}.active_license_count == 1"

      - name: cascade_designation_fans_out_to_active_licenses
        claim_type: cascading_side_effects
        grounds: [state_machines.DangerousDogCase.INVESTIGATING_to_DESIGNATED, entities.License.fields.final_fee_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / dangerous_overturn_restores_license_final_fee
          rationale: "The designation surcharge cascade onto an ACTIVE license's final_fee_cents is set up and asserted by the named §1.8 compensating-invariant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: issue_tag_changes_visible_same_response
        claim_type: immediate
        grounds: [state_machines.License.APPROVED_to_ACTIVE, entities.License.fields.tag_serial, entities.License.fields.issued_on]
        distinguishing_aspect: "issue-tag response immediately reflects status ACTIVE, a non-null tag_serial, and a set issued_on — immediate consistency, no read-after-write lag."
        test_recipe:
          setup: ["license driven to APPROVED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "YY Owner", email: "yy@x.com", address_zip: "10035" }
              as: LicensingClerk
              captures: { yy_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${yy_id}", name: "Imm", species: "DOG", breed: "B", is_altered: true, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${yy_id}"
              captures: { yy_pet: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${yy_pet}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VYY" }
              as: Owner
              as_user_id: "${yy_id}"
              captures: { yy_v: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${yy_id}", pet_id: "${yy_pet}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${yy_id}"
              captures: { yl_id: $.data.id }
            - call: "POST /licenses/${yl_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${yy_id}"
            - call: "POST /licenses/${yl_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${yl_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${yl_id}/attach-vaccination"
              payload: { vaccination_record_id: "${yy_v}" }
              as: Owner
              as_user_id: "${yy_id}"
            - call: "POST /licenses/${yl_id}/approve"
              payload: {}
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/${yl_id}/issue-tag"
              payload: {}
