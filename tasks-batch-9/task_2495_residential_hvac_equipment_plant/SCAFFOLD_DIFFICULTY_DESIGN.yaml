              captures: { plat_v_released: $.data.version }
            - call: "POST /plant/certification-records"
              payload: { platform_id: "${plat_id}", region_code: "SOUTHEAST", rated_seer2_submitted: 15.80, expected_platform_version: "${plat_v_released}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { cert_id: $.data.id }
            - call: "POST /plant/certification-records/${cert_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "user-ce-1"
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "CERTIFIED" }
              as: RegulatoryAuditor
              as_user_id: "user-ra-1"
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-51", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id, cmp_v0: $.data.version }
            - call: "POST /plant/component-supplies"
              payload: { component_type: "CONTROL_BOARD", part_number: "CTL-9X", supplier_lot_code: "LOT-CTL-77", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { ctl_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-SE-1", platform_id: "${plat_id}", region_code: "SOUTHEAST", requested_units: 30, priority_score: 80, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-1"
              captures: { ord_se_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-NE-1", platform_id: "${plat_id}", region_code: "NORTHEAST", requested_units: 20, priority_score: 60, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-2"
              captures: { ord_ne_id: $.data.id }
            - call: "POST /plant/distributor-orders/${ord_se_id}/allocate"
              payload: { expected_component_supply_version: "${cmp_v0}" }
              as: SupplyPlanner
            - call: "GET /plant/component-supplies/${cmp_id}"
              payload: {}
              as: SupplyPlanner
              captures: { cmp_v1: $.data.version }
          trigger:
            - call: "POST /plant/distributor-orders/${ord_ne_id}/allocate"
              payload: { expected_component_supply_version: "${cmp_v0}" }
              as: SupplyPlanner
              captures: { stale_error_id: $.data.error_id }
            - call: "POST /plant/distributor-orders/${ord_ne_id}/allocate"
              payload: { expected_component_supply_version: "${cmp_v1}" }
              as: SupplyPlanner
              captures: { region_error_id: $.data.error_id }
          assert:
            - "First trigger call: HTTP 412 with ${stale_error_id} == ERR_STALE_SUPPLY_VERSION - the priority-40 concurrency check wins even though the order's region is also blocked"
            - "Second trigger call, same order and the same blocked region but a fresh token: HTTP 409 with ${region_error_id} == ERR_REGION_NOT_CERTIFIED"
            - "ProductPlatform.${plat_id}.blocked_region_codes == [\"NORTHEAST\"] and salable_region_count == 1"
            - "DistributorOrder.${ord_ne_id}.allocation_status == UNALLOCATED and allocated_units == 0 after both calls"
            - "ComponentSupply.${cmp_id}.available_units == 70, reserved_units == 30, version == ${cmp_v1} - neither refused call moved a unit or bumped the version"
            - "ComponentSupply.${ctl_id}.available_units == 70 and GET /plant/distributor-orders/${ord_ne_id}/allocation-lines returns 0 records"

      - name: charge_stage_gate_preempts_flammable_charge_limit
        grounds:
          - priority_pair_conflicts.charge-stage-beats-safety-limit
          - validations.build-stage-gate
          - validations.flammable-charge-limit
          - state_machines.BuildOrder.LEAK_PASSED_to_CHARGED
        distinguishing_aspect: |
          A 5000 g charge request on a BRAZED lot of an A2L platform limited to 1800 g breaks the
          priority-50 stage gate and the priority-80 safety limit at once. Safety intuition says the
          flammable-charge violation should win, but the specified order returns 409
          ERR_BUILD_STAGE_INVALID first; the 422 ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED appears only
          once the lot has actually reached LEAK_PASSED, with the identical payload.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ACTIVE A2L program and a RELEASED HIGH-tier platform whose max_charge_grams is 1800."
            - "One build lot at BRAZED with no leak test recorded yet, charge_grams 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 12, scheduled_start_utc: "2026-08-05T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/build-orders/${bo_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
          trigger:
            - call: "POST /plant/build-orders/${bo_id}/charge"
              payload: { charge_grams: 5000 }
              as: ProductionTechnician
              captures: { stage_error_id: $.data.error_id }
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.20 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
            - call: "POST /plant/build-orders/${bo_id}/charge"
              payload: { charge_grams: 5000 }
              as: ProductionTechnician
              captures: { safety_error_id: $.data.error_id }
          assert:
            - "First trigger call: HTTP 409 with ${stage_error_id} == ERR_BUILD_STAGE_INVALID, not the 422 safety error"
            - "After the first call BuildOrder.${bo_id}.status == BRAZED and charge_grams == 0 - nothing was written"
            - "Second trigger call: HTTP 201, BuildOrder.${bo_id}.status == LEAK_PASSED"
            - "Third trigger call, byte-identical payload: HTTP 422 with ${safety_error_id} == ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED"
            - "BuildOrder.${bo_id}.status == LEAK_PASSED and charge_grams == 0 - the refused charge left the lot where it was"

  - rule_id: boundary_precision_check
    instances:
      - name: carrying_cost_per_reservation_is_one_cent_below_pooled
        grounds:
          - calculations.preseason_carrying_cost
          - endpoints.GET_/plant/warehouses/{id}/carrying-cost
          - entities.WarehouseReservation.fields.pallet_units
        distinguishing_aspect: |
          Two 5-pallet, 10-day reservations give 100 pallet-days, exactly 14.285714... pallet-weeks.
          Rounding each invoice line first yields 8321 + 8321 = 16642 cents; pooling first yields
          round(16642.857) = 16643 cents. An implementation that rounds at the wrong moment - or
          that rounds pallet-weeks before multiplying - is off by exactly one cent, while
          pallet_week_total stays 14.2857 under both bases.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Warehouse WH-1 with pallet_capacity 50."
            - "A RELEASED STANDARD-tier A1 platform with two pre-season lots at DRAFT."
            - "Two ACTIVE reservations of 5 pallets each: 2026-11-02 to 2026-11-12 and 2026-11-12 to 2026-11-22, both entirely inside the queried window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/warehouses"
              payload: { name: "WH-1", pallet_capacity: 50 }
              as: PlantAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 10, scheduled_start_utc: "2026-11-02T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo1_id: $.data.id }
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 10, scheduled_start_utc: "2026-11-12T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo2_id: $.data.id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo1_id}", start_date: "2026-11-02", end_date: "2026-11-12", pallet_units: 5 }
              as: ProductionPlanner
              captures: { res1_id: $.data.id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo2_id}", start_date: "2026-11-12", end_date: "2026-11-22", pallet_units: 5 }
              as: ProductionPlanner
              captures: { res2_id: $.data.id }
          trigger:
            - call: "GET /plant/warehouses/${wh_id}/carrying-cost?window_start=2026-11-01&window_end=2026-12-01&basis=PER_RESERVATION"
              payload: { window_start: "2026-11-01", window_end: "2026-12-01", basis: "PER_RESERVATION" }
              as: ProductionPlanner
            - call: "GET /plant/warehouses/${wh_id}/carrying-cost?window_start=2026-11-01&window_end=2026-12-01&basis=POOLED"
              payload: { window_start: "2026-11-01", window_end: "2026-12-01", basis: "POOLED" }
              as: ProductionPlanner
            - call: "GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-11-12"
              payload: { on_date: "2026-11-12" }
              as: ProductionPlanner
          assert:
            - "First trigger call: data.carrying_cost_cents == 16642 (8321 + 8321, each line rounded before summing) with data.reservation_count == 2"
            - "Second trigger call: data.carrying_cost_cents == 16643 (round(14.285714... * 1165)) on the identical reservation set"
            - "data.pallet_week_total == 14.2857 in both responses"
            - "Third trigger call: data.occupancy_units == 5 - the intervals are half-open, so the day the first reservation ends is counted only for the second"
            - "Warehouse.${wh_id}.pallets_reserved_current == 0 at the 2026-08-01 clock date, which is outside both intervals"

      - name: claim_rate_of_exactly_five_percent_trips_capa_threshold
