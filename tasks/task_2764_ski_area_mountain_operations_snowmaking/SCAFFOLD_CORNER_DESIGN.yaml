          - entities.TerrainArea.fields.assigned_patroller_count
          - calculations.incident_response_minutes
        distinguishing_aspect: |
          Dispatching a patroller off an open area is a cascade that a close does NOT fully undo: the
          staffing count is restored and the patroller returns to AVAILABLE, but the state machine
          explicitly forbids auto-reopening an area that is already in PATROL_HOLD. That asymmetry is
          the corner - reopening requires a fresh human decision. The dispatch also lands the
          response_minutes edge case where report and dispatch share a logical instant, yielding 0.
