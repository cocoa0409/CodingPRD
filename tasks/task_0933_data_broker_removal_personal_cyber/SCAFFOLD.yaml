      - "creates a DeviceSeat row in BOUND with bind_count 1"
      - "raises AddOnSubscription.seats_bound and lowers seats_available"
      - "increments AddOnSubscription.version by 1"

  - method: GET
    path: "/device-seats"
    description: "FK reverse lookup for DeviceSeat.addon_id and .member_id. Ordered by created_at ASC."
