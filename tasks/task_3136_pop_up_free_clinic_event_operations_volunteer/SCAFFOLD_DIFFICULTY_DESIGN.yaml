              as: VolunteerCoordinator
              captures: { err15: $.data.error_id }
          assert:
            - "error_id == ERR_LICENSE_EXPIRED (expiry == service_date fails the strictly-greater half-open test)"
            - "Volunteer.${v15}.status == VERIFIED (unchanged)"

      - name: station_window_inverted_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_TEMPORAL_WINDOW_INVALID]
          - entities.ServiceStation.fields.service_window_close_utc
        distinguishing_aspect: |
          Different resource (ServiceStation service window) and different
          interval semantics (closed ordering constraint, not half-open
          adjacency): creating a station whose service_window_close_utc is not
          strictly after service_window_open_utc — including the equal
          (zero-length) case — is rejected with ERR_TEMPORAL_WINDOW_INVALID.
