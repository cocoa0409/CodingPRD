            - "CapacityContract.${contract_id}.reserved_slots == 1"

      - name: corner_inspection_before_disposition_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_CYCLE_NOT_DISPOSITIONED]
          - validations.p8[POST /cycle-loads/{id}/inspection -> ERR_CYCLE_NOT_DISPOSITIONED]
