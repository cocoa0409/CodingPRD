  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: auditor_active_audit_count_assign_cancel_conservation
        grounds:
          - entities.Auditor.fields.active_audit_count
          - state_machines.Audit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = the auditor workload counter
          (active_audit_count), defined as the count of the auditor's audits
          in {SCHEDULED, IN_PROGRESS}. The forward action (assign, +1) paired
          with its compensating action (cancel, -1) returns the counter to
          exactly its origin — zero drift.
        test_recipe:
          setup:
            - "SQF scheme; client; one calibrated auditor; application ACCEPTED -> audit seq1 SCHEDULED"
          setup_api_calls:
            - call: "POST /certification-body/schemes"
              payload: { code: "SQF", name: "SQF Food Safety", supported_category_codes: ["BAKERY", "DAIRY", "MEAT"], critical_nc_days: 7, major_nc_days: 28, minor_nc_days: 84, pass_score: 70, unannounced_every_n: 3, unannounced_min_window_days: 60, announced_max_window_days: 30, min_audit_gap_days: 30, cert_validity_days: 1095, witness_validity_days: 365, appeal_window_days: 14, max_cap_rejections: 3, rotation_limit: 2, base_fee: 2000.00, per_category_fee: 333.33, day_rate: 1000.00, unannounced_uplift_pct: 0.10, high_risk_multiplier: 1.5 }
              as: SchemeAdmin
              captures: { scheme_id: $.data.id }
            - call: "POST /certification-body/clients"
              payload: { name: "Acme Baking Co", contact_email: "qa@acme.test", country: "US" }
              as: SchemeAdmin
              captures: { client_id: $.data.id }
            - call: "POST /certification-body/auditors"
              payload: { name: "Audrey Auditor", competency_categories: ["BAKERY", "DAIRY", "MEAT"], conflicted_client_ids: [] }
              as: SchemeAdmin
              captures: { auditor_id: $.data.id }
            - call: "POST /certification-body/auditors/${auditor_id}/witness-audits"
              payload: { witnessed_on: "2026-07-01T00:00:00Z", result: "PASS" }
              as: SchemeAdmin
            - call: "POST /certification-body/decision-makers"
              payload: { name: "Dana Decider" }
              as: SchemeAdmin
              captures: { dm_id: $.data.id }
            - call: "POST /certification-body/applications"
              payload: { scheme_id: "${scheme_id}", site_name: "Site A", product_categories: [{ category_code: "BAKERY", risk_tier: "STANDARD" }], scope_text: "production of baked goods" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { app_id: $.data.id }
            - call: "POST /certification-body/applications/${app_id}/submit"
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /certification-body/applications/${app_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: SchemeAdmin
            - call: "GET /certification-body/applications/${app_id}/audits"
              as: SchemeAdmin
              captures: { audit_id: "$.data[0].id" }
            - call: "GET /certification-body/auditors/${auditor_id}"
              as: SchemeAdmin
              captures: { count_before: $.data.active_audit_count }
          trigger:
            - call: "POST /certification-body/audits/${audit_id}/assign"
              payload: { auditor_id: "${auditor_id}" }
              as: SchemeAdmin
            - call: "GET /certification-body/auditors/${auditor_id}"
              as: SchemeAdmin
              captures: { count_assigned: $.data.active_audit_count }
            - call: "POST /certification-body/audits/${audit_id}/cancel"
              as: SchemeAdmin
            - call: "GET /certification-body/auditors/${auditor_id}"
              as: SchemeAdmin
              captures: { count_after: $.data.active_audit_count }
          assert:
            - "Auditor.${auditor_id}.active_audit_count == 0 before assignment"
            - "after assign: active_audit_count == 1 (audit SCHEDULED counts)"
            - "after cancel: active_audit_count == 0 — forward + compensating action leave the counter unchanged"
            - "Audit.${audit_id}.status == CANCELLED (CANCELLED audits are excluded from the counter)"

      - name: active_certificate_listed_directory_parity_over_suspend_reinstate
        grounds:
          - entities.DirectoryListing.fields.status
          - state_machines.Certificate.ACTIVE_to_SUSPENDED
          - state_machines.Certificate.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = the publication parity invariant
          count(Certificate in ACTIVE) == count(DirectoryListing in LISTED) —
          a cross-entity count invariant (different quantity type from the
          sibling workload counter). The suspend/reinstate round trip holds
          parity at every step: 1==1 -> 0==0 -> 1==1.
