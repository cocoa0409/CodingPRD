            - "UtilityConflict.${cb}.status == RELOCATION_SCHEDULED and UtilityConflict.${ca}.status == RELOCATION_SCHEDULED"
            - "UtilityOwner.${o1}.open_commitment_days == 27 (15 for [2027-04-05, 2027-04-20) plus 12 for [2027-04-23, 2027-05-05))"

      - name: joint_trench_slot_containment_is_inclusive_and_capacity_counts_overlaps
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - entities.JointTrenchSlot.fields.trench_open_start
          - entities.JointTrenchSlot.fields.max_occupants
          - entities.JointTrenchSlot.fields.occupant_count
        distinguishing_aspect: |
          A different resource entity (JointTrenchSlot) with the opposite interval semantics: the
          slot opening is a CLOSED interval that each occupant window must sit inside, inclusive at
          both ends, and occupants are expected to overlap each other freely - the trench is shared,
          so only the occupant count, never mutual overlap, can reject a booking. A window matching
          the slot exactly is admitted, one ending a single day past the slot is rejected, and a
          third fully-contained window is rejected only because the slot is at capacity.
        test_recipe:
          setup:
            - "One project, one owner, three facilities FA, FB and FC (three distinct facilities so the mobilization-buffer rule never fires), each carried to an APPROVED plan."
