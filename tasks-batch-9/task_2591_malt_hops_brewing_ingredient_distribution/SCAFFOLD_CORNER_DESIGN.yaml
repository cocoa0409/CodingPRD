              as: AllocationManager
              captures: { mm_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { mm_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${mm_b_id}", variety_id: "${mm_citra_id}", crop_year_program_id: "${mm_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { mm_k_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${mm_a_id}", requested_ship_date: "2026-10-01T00:00:00Z" }
