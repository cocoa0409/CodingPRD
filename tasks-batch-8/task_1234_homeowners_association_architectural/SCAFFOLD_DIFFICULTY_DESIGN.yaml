  # =================================================================
  # Rule 4 — transitive_cascade (different triggers: committee decide
  #           vs inspection record)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approval_cascade_application_to_permit_to_property
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_APPROVED_WITH_CONDITIONS
          - entities.Property.fields.open_permit_count
          - entities.ConstructionPermit.fields.status
        distinguishing_aspect: |
          Depth-3 chain triggered by POST decide: the decision mutates Application (link 0),
          that transition creates ConstructionPermit ACTIVE (link 1, caused by the state
          change), and permit creation recomputes Property.open_permit_count (link 2, caused
          by link 1). Companion cascade originates from the inspection-record trigger.
        test_recipe:
          setup:
            - "Standard association; complete application UNDER_REVIEW at 2026-05-01 with three APPROVE ballots"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Casc HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "K-1", address: "1 Cascade Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: SOLAR, guideline_section: "SEC-8.3", description: "rooftop solar", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "array layout", uri: "s3://k/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "panel spec", uri: "s3://k/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
          trigger:
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: ["panels flush-mounted", "conduit hidden"] }, as: Manager, captures: { app_status: $.data.status, app_conditions: $.data.conditions } }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit_status: "$.data[0].status", permit_ws: "$.data[0].window_start", permit_we: "$.data[0].window_end" } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { open_permits: $.data.open_permit_count } }
          assert:
            - "Application.${app}.status == APPROVED_WITH_CONDITIONS with conditions == ['panels flush-mounted', 'conduit hidden']"
            - "ConstructionPermit created: status == ACTIVE, window_start == 2026-06-01, window_end == 2026-07-15 (link 1)"
            - "Property.${prop}.open_permit_count == 1 (link 2, recomputed from permit creation)"

      - name: inspection_fail_cascade_to_violation_fine_property
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED_REMEDIATION
          - state_machines.Violation.transitions
          - entities.Property.fields.compliance_posture
          - entities.Fine.fields.accrued_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by POST record FAIL: the inspection mutation creates a
          Violation OPEN kind=CONDITION_BREACH (link 1), violation creation creates its Fine
          ACCRUING at base 10000 (link 2), and fine creation recomputes the Property balance
          to 10000 and posture to FINES_OUTSTANDING (link 3). Different trigger than the
          decide-approval cascade.
        test_recipe:
          setup:
            - "Approved application, ACTIVE permit, logical clock 2026-06-10; inspection attempt 1 SCHEDULED"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Fail HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "F-1", address: "1 Fail Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: ADDITION, guideline_section: "SEC-9.0", description: "garage bump-out", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plans", uri: "s3://f/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "brick", uri: "s3://f/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: ["match brick"] }, as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: Manager }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit: "$.data[0].id" } }
            - { call: "POST /arc/permits/${permit}/request-inspection", as: Homeowner, as_user_id: "${owner_a}", captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /arc/inspections/${insp}/record", payload: { result: FAIL, result_notes: "eave height exceeds approved plans" }, as: Inspector, captures: { insp_status: $.data.status } }
            - { call: "GET /arc/inspections/${insp}/violations", as: Manager, captures: { vio_id: "$.data[0].id", vio_kind: "$.data[0].kind", vio_status: "$.data[0].status" } }
            - { call: "GET /arc/violations/${vio_id}/fines", as: Manager, captures: { fine_status: "$.data[0].status", fine_accrued: "$.data[0].accrued_cents" } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { balance: $.data.outstanding_fine_balance_cents, posture: $.data.compliance_posture } }
          assert:
            - "Inspection.${insp}.status == FAILED_REMEDIATION"
            - "Violation created (link 1): kind == CONDITION_BREACH, status == OPEN"
            - "Fine created (link 2): status == ACCRUING, accrued_cents == 10000 (base at creation)"
            - "Property (link 3): outstanding_fine_balance_cents == 10000, compliance_posture == FINES_OUTSTANDING"

  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different category
  #           pairs: state-vs-fiscal, safety-vs-constraint)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_settled_fine_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Fine.ACCRUING_to_SETTLED
        distinguishing_aspect: |
          Category pair state(P6) vs business_fiscal(P11): a second settle on an already
          SETTLED fine with a wrong amount fails BOTH the state gate and the fiscal
          amount-equality check; the response must be ERR_INVALID_STATE (higher priority),
          not ERR_SETTLEMENT_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "Association base 10000 SIMPLE; violation reported at default clock; fine ACCRUING with outstanding 10000; fine then settled in full"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Prio HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "P-1", address: "1 Prio Pl", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "unapproved shed" }, as: Manager, captures: { vio: $.data.id } }
            - { call: "GET /arc/violations/${vio}/fines", as: Manager, captures: { fine: "$.data[0].id" } }
            - { call: "POST /arc/fines/${fine}/settle", payload: { amount_cents: 10000 }, as: Homeowner, as_user_id: "${owner_a}", captures: { fine_status: $.data.status, fine_settled: $.data.settled_cents, fine_outstanding: $.data.outstanding_cents } }
          trigger:
            - { call: "POST /arc/fines/${fine}/settle", payload: { amount_cents: 1 }, as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
          assert:
            - "first settle: status == SETTLED, settled_cents == 10000, outstanding_cents == 0"
            - "second settle (wrong amount on terminal fine): error_id == ERR_INVALID_STATE, NOT ERR_SETTLEMENT_AMOUNT_MISMATCH"

      - name: submit_liened_property_safety_beats_completeness
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.Property.FINES_OUTSTANDING_to_LIENED
        distinguishing_aspect: |
          Category pair business_safety(P7) vs business_constraint(P9): submitting an
          attachment-less application on a LIENED property fails both the posture gate and
          the completeness rule; the response must be ERR_PROPERTY_LIENED, not
          ERR_INCOMPLETE_SUBMISSION.
        test_recipe:
          setup:
            - "Association base 10000, lien_threshold 10000, lien_min_age_days 0; violation at 2026-05-01 makes balance 10000"
            - "Sweep at 2026-05-02 auto-files the lien; property posture LIENED"
            - "DRAFT application exists on that property with NO attachments"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Gate HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 10000, lien_min_age_days: 0, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "G-1", address: "1 Gate Dr", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "unapproved shed" }, as: Manager, captures: { vio: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { liens_filed: $.data.liens_filed } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { posture: $.data.compliance_posture } }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
          assert:
            - "sweep filed exactly 1 lien (liens_filed == 1); Property.compliance_posture == LIENED"
            - "submit of the incomplete application on the LIENED property: error_id == ERR_PROPERTY_LIENED, NOT ERR_INCOMPLETE_SUBMISSION"
            - "Application.${app}.status remains DRAFT"

  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics, different
  #           endpoints: elapsed review days via sweep vs approve
  #           ratio via decide)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: deemed_approval_at_exact_statutory_day
        grounds:
          - calculations.statutory_deadline_check
          - state_machines.Application.UNDER_REVIEW_to_DEEMED_APPROVED
        distinguishing_aspect: |
          Metric: elapsed review days. The sweep at elapsed == 4 (statutory 5) deems nothing;
          the sweep at elapsed == 5 deems exactly — the >= boundary fires AT the threshold.
          Reached via POST /arc/_sweeps/daily; companion boundary uses the decide endpoint.
        test_recipe:
          setup:
            - "Association CALENDAR statutory_response_days 5; complete application UNDER_REVIEW at 2026-05-01"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Edge HOA", statutory_response_days: 5, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
