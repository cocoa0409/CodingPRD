  # ---------------------------------------------------------------------------
  # Rule 9 - compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: department_budget_reserve_release_conservation
        grounds:
          - calculations.department_posture
          - state_machines.CoveragePlan.CONFIRMED_to_RELEASED
          - entities.Department.fields.available_amount
        distinguishing_aspect: |
          Conserved quantity = department budget dollars. Reserve (approve 24000.00) paired with
          its compensating release (grant cancelled by pre-activation separation) leaves
          reserved_amount, spent_amount, available_amount EXACTLY as before the reserve:
          pool == reserved + spent + available holds at every step, zero drift.
        test_recipe:
          setup:
            - "Dept pool 160000.00 (reserved 0, spent 0, available 160000.00) + chair; F with 72 credits; award pipeline with a 3-course plan (24000.00) -> plan CONFIRMED, grant SCHEDULED"
            - "Faculty still ACTIVE (grant never activated)"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
