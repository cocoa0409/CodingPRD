            - "a retry carrying ${inv_fresh} succeeds with TravelArrangement status CONFIRMED"

      - name: stale_game_version_on_participation_confirm_returns_precondition_failed
        claim_type: Violation -> Error
        grounds:
          - concurrency_rules[game-participation-confirm-stale-game]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/camp-ops/games/{gameId}/participations/{participationId}/confirm
        distinguishing_aspect: "A second participation confirm carrying the game version read before the first confirm returns 412 ERR_STALE_VERSION, so the serial stale-version path is observable without any parallel dispatch."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with a published HOME game and two cleared position players scheduled into it; the game version is captured before the first confirm."
