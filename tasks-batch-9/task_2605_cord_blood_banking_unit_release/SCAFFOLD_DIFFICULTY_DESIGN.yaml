            - call: "POST /cbb/collections/${col_b2_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
          assert:
            - "at exactly 48 hours: the first receive returns 200 and Collection.${col_b1_id}.status == RECEIVED"
            - "Collection.${col_b1_id}.hours_to_receipt == 48.00 and received_at == 2026-08-12T05:00:00Z"
            - "Collection.${col_b1_id}.net_volume_ml == 105.0"
            - "GET /cbb/collections/${col_b1_id}/units → data has length 1 with processing_status RECEIVED"
            - "at 48.5 hours: the second receive returns 422 with error.code == ERR_PROCESSING_WINDOW_EXCEEDED"
            - "Collection.${col_b2_id}.status is still COLLECTED, received_at is null and hours_to_receipt is null"
            - "GET /cbb/collections/${col_b2_id}/units → data has length 0 (no unit is minted by a rejected receipt)"

