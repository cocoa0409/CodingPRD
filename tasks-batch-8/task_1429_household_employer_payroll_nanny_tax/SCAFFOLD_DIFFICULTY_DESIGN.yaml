          assert:
            - "W1 check 1 (gross 150000, YTD 150000 < 280000): no SS_EE and no MEDICARE_EE line; net_pay_cents == 150000"
            - "W2 check 1 (gross 279950, 50 cents UNDER the threshold): no FICA lines; net_pay_cents == 279950"
            - "W3 check 1 (gross exactly 280000 == threshold): covered; SS_EE == 17360 and MEDICARE_EE == 4060; net_pay_cents == 258580"
            - "W1 check 2 (crossing check, YTD 300000): retroactive catch-up SS base == 300000 -> SS_EE == 18600, MEDICARE_EE == 4350; net_pay_cents == 127050"
