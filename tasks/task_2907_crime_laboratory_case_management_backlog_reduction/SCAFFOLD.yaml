      - "GET /lab/examination-requests"
      - "GET /lab/assignments"
      - "GET /lab/review-records"
      - "GET /lab/vendor-engagements"
      - "GET /lab/nonconformances"
      - "GET /lab/court-events"
      - "GET /lab/cases"
      - "GET /lab/evidence-items"
      - "GET /lab/analysts/{analyst_id}"
      - "GET /lab/methods/{method_id}"
      - "GET /lab/vendors/{vendor_id}"
      - "GET /lab/cases/{case_id}"
      - "GET /lab/evidence-items/{evidence_item_id}"
      - "GET /lab/examination-requests/{examination_request_id}"
      - "GET /lab/assignments/{assignment_id}"
