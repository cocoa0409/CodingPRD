  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: or_room_half_open_interval_rejects_only_true_intersection
        grounds:
          - validations[priority=21]
          - errors[ERR_OR_ROOM_CONFLICT]
          - entities.SurgicalCase.fields.or_room_code
          - entities.SurgicalCase.fields.scheduled_start_utc
          - entities.SurgicalCase.fields.scheduled_end_utc
        distinguishing_aspect: |
          The resource is the operating room keyed by SurgicalCase.or_room_code
          and the geometry is HALF-OPEN AND UNBUFFERED: a booking of
          10:00-12:00 against an existing 08:00-10:00 in OR-3 is ACCEPTED
          because [08:00,10:00) and [10:00,12:00) merely touch, while
          09:59-11:00 is rejected with ERR_OR_ROOM_CONFLICT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Three distinct patients P1, P2 and P3 (so the patient-buffer rule at priority 22 can never fire)."
            - "One SCHEDULED case CASE-1 for P1 in OR-3 from 2026-09-10T08:00:00Z to 2026-09-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat1_id: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1002", display_name: "Pat Two", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat2_id: "$.data.id" }
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1003", display_name: "Pat Three", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat3_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat1_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case1_id: "$.data.id" }
          trigger:
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat2_id}", case_number: "CASE-2", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T10:00:00Z", scheduled_end_utc: "2026-09-10T12:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case2_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat3_id}", case_number: "CASE-3", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T09:59:00Z", scheduled_end_utc: "2026-09-10T11:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "The touching booking succeeds: HTTP 201 and SurgicalCase.${case2_id}.status == SCHEDULED"
            - "The overlapping booking fails: HTTP 409 with error_id == ERR_OR_ROOM_CONFLICT"
            - "GET /udi/surgical-cases?or_room_code=OR-3 returns total_count == 2"

      - name: patient_recovery_buffered_closed_interval_rejects_touching_windows
        grounds:
          - validations[priority=22]
          - errors[ERR_PATIENT_SCHEDULE_CONFLICT]
          - entities.Patient.fields.mrn
          - entities.SurgicalCase.fields.scheduled_start_utc
        distinguishing_aspect: |
          A different resource entity (Patient, not an OR room) with the
          OPPOSITE interval geometry to
          or_room_half_open_interval_rejects_only_true_intersection: both
          windows are expanded by 120 minutes on each side and compared as
          CLOSED intervals, so a 14:00-15:00 booking whose buffered start of
          12:00 exactly touches the first case's buffered end of 12:00 is
          REJECTED, and moving it one second later to 14:00:01 is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One patient P1 with a single SCHEDULED case CASE-1 in OR-3 from 2026-09-10T08:00:00Z to 2026-09-10T10:00:00Z; its buffered closed interval is [06:00, 12:00]."
            - "OR-9 holds no cases at all, so the priority-21 room rule cannot fire on either trigger call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat1_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat1_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case1_id: "$.data.id" }
          trigger:
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat1_id}", case_number: "CASE-2", or_room_code: "OR-9", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T15:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat1_id}", case_number: "CASE-3", or_room_code: "OR-9", scheduled_start_utc: "2026-09-10T14:00:01Z", scheduled_end_utc: "2026-09-10T15:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case3_id: "$.data.id" }
          assert:
            - "The touching booking fails: HTTP 409 with error_id == ERR_PATIENT_SCHEDULE_CONFLICT"
            - "The one-second-later booking succeeds: HTTP 201 and SurgicalCase.${case3_id}.status == SCHEDULED"
            - "GET /udi/surgical-cases?patient_id=${pat1_id} returns total_count == 2"
            - "Patient.${pat1_id}.implant_count == 0"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: lot_unit_count_conserved_across_reserve_release_roundtrip
        grounds:
          - calculations.lot_unit_conservation
          - state_machines.DeviceUnit.custody_state.AVAILABLE_to_RESERVED
          - state_machines.DeviceUnit.custody_state.RESERVED_to_AVAILABLE
          - entities.Lot.fields.on_hand_qty
          - entities.Lot.fields.consumed_qty
          - entities.Lot.fields.received_qty
        distinguishing_aspect: |
          The conserved quantity is a UNIT COUNT:
          Lot.on_hand_qty + Lot.consumed_qty == Lot.received_qty == 3 must hold
          identically before, during and after the reserve/release-reservation
          compensating pair, with on_hand_qty pinned at 3 and consumed_qty at 0
          at every step because both AVAILABLE and RESERVED sit in the on-hand
          bucket.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One catalog item with one released lot L-4401 holding three owned units, so received_qty is 3, on_hand_qty is 3 and consumed_qty is 0."
            - "CatalogItem.on_hand_available_qty is 3."
            - "One SCHEDULED case CASE-1 for patient P1 in OR-3 on 2026-09-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
