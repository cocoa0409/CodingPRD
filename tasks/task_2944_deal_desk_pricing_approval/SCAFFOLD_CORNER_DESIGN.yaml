            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 60, requested_discount_pct: 0.15 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id, core_line_net: $.data.final_net_cents, core_line_list: $.data.extended_list_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${svc_id}", quantity: 4, requested_discount_pct: 0.10 }
              as: SalesRep
