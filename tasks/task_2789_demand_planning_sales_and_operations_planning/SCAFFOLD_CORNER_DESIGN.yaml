            - "Status is 200 and SupplyPlan.${plan_id}.status == \"RATIONED\""
            - "The Allocation for ${hold_id} has requested_units == 500, allocated_units == 0, allocation_status == \"WITHHELD_CREDIT_HOLD\", allocation_pass == \"NONE\" and fill_rate_pct == 0.00"
            - "The Allocation for ${ok_id} has requested_units == 500, allocated_units == 500, allocation_status == \"ALLOCATED\", allocation_pass == \"PRO_RATA\" and fill_rate_pct == 100.00"
            - "NOT 450 each: the credit-held request is out of the pro-rata denominator, so the pool total is 500 and start == min(900, 500) == 500"
