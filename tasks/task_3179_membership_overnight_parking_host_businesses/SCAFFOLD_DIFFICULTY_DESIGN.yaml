        distinguishing_aspect: |
          Two rules that read the same instant in opposite directions: the
          vehicle-collision rule at priority 9 uses the half-open date interval,
          where adjacency is NOT a conflict, while the capacity rule reads the
          same request as already withholding a site — so the overlapping request
          must be re-filed with request_depth 2 to stop counting, which is a
          different mechanism from a collision rejection.
